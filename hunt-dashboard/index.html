<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunt Dashboard</title>
<style>
:root {
  --bg: #0a0a0f;
  --card: #0f0f18;
  --text: #e0e0e0;
  --accent: #00d4aa;
  --dim: #888;
  --border: #1a1a2e;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.4);
  --severity-critical: #ff4757;
  --severity-high: #ff6b6b;
  --severity-medium: #ffa502;
  --severity-low: #2ed573;
  --status-parked: #888;
  --status-confirmed: #3498db;
  --status-reported: #2ed573;
  --status-accepted: #f1c40f;
  --status-rejected: #ff4757;
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1a1a2e;
  --accent: #00b894;
  --dim: #666;
  --border: #ddd;
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
}
.container { max-width: 1400px; margin: 0 auto; padding: 16px 20px; }
a { color: var(--accent); text-decoration: none; }

/* ── Header ──────────────────────────────────────────── */
.header {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px;
}
.header-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.protocol-name { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 0.72rem;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.badge-platform { background: var(--accent); color: #0a0a0f; }
.badge-payout { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle {
  display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
}
.theme-btn {
  padding: 4px 14px; font-size: 0.72rem; font-family: inherit; cursor: pointer;
  background: transparent; color: var(--dim); border: none; transition: all 0.2s;
}
.theme-btn.active { background: var(--accent); color: #0a0a0f; }
.refresh-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--dim); }
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--severity-low);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.btn-refresh {
  padding: 4px 12px; font-size: 0.72rem; font-family: inherit; cursor: pointer;
  background: var(--card); color: var(--accent); border: 1px solid var(--accent);
  border-radius: 4px; transition: all 0.2s;
}
.btn-refresh:hover { background: var(--accent); color: #0a0a0f; }

/* ── Progress ────────────────────────────────────────── */
.progress-section { margin-bottom: 16px; }
.progress-header { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--dim); margin-bottom: 6px; }
.progress-bar {
  height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s;
  background: linear-gradient(90deg, var(--accent), #00f0c0);
}

/* ── Filter Buttons ──────────────────────────────────── */
.filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-btn {
  padding: 4px 14px; font-size: 0.72rem; font-family: inherit; cursor: pointer;
  background: var(--card); color: var(--dim); border: 1px solid var(--border);
  border-radius: 4px; transition: all 0.2s;
}
.filter-btn.active { border-color: var(--accent); color: var(--accent); }

/* ── Component Grid ──────────────────────────────────── */
.comp-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px; margin-bottom: 16px;
}
.comp-card {
  background: var(--card); border-radius: 8px; padding: 14px 16px;
  border-left: 3px solid var(--dim); cursor: pointer;
  box-shadow: var(--card-shadow); transition: border-color 0.2s, transform 0.15s;
}
.comp-card:hover { transform: translateY(-1px); }
.comp-card.done { border-left-color: var(--severity-low); }
.comp-card.active { border-left-color: var(--accent); }
.comp-card.pending { border-left-color: var(--dim); }
.comp-card-header { display: flex; align-items: center; gap: 8px; }
.comp-icon { font-size: 1rem; flex-shrink: 0; }
.comp-name { font-weight: 600; font-size: 0.88rem; }
.comp-meta { font-size: 0.7rem; color: var(--dim); margin-top: 4px; }

/* ── Detail Panel ────────────────────────────────────── */
.detail-panel {
  background: var(--card); border-radius: 8px; padding: 20px;
  margin-bottom: 16px; box-shadow: var(--card-shadow); border: 1px solid var(--border);
}
.detail-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 1100px) {
  .detail-layout { grid-template-columns: 1fr 340px; }
}
.detail-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.section-title { font-size: 0.85rem; font-weight: 600; margin: 16px 0 10px; color: var(--accent); }
.no-ficha { color: var(--dim); font-size: 0.8rem; padding: 20px 0; }

/* Checklist */
.checklist-item { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 0.78rem; }
.checklist-icon { flex-shrink: 0; width: 18px; text-align: center; }
.checklist-icon.done { color: var(--severity-low); }
.checklist-icon.active-step { color: var(--accent); }
.checklist-icon.pending-step { color: var(--dim); }
.checklist-label { font-weight: 600; }
.checklist-desc { color: var(--dim); font-size: 0.72rem; }

/* Hunters grid */
.hunters-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px;
}
.hunter-card {
  background: var(--bg); border-radius: 6px; padding: 10px 12px; cursor: pointer;
  border: 1px solid var(--border); transition: border-color 0.2s;
}
.hunter-card:hover { border-color: var(--accent); }
.hunter-name { font-weight: 600; font-size: 0.8rem; }
.hunter-domain { font-size: 0.68rem; color: var(--dim); margin-top: 2px; }
.hunter-stats { font-size: 0.7rem; margin-top: 6px; display: flex; gap: 10px; }
.hunter-status {
  display: inline-block; font-size: 0.65rem; padding: 1px 6px; border-radius: 3px; margin-top: 4px;
}
.hunter-status.completed { background: rgba(46,213,115,0.15); color: var(--severity-low); }
.hunter-status.waiting { background: rgba(136,136,136,0.15); color: var(--dim); }

/* Hypothesis list */
.hyp-list { margin-top: 8px; padding: 8px 12px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
.hyp-item { padding: 4px 0; font-size: 0.72rem; display: flex; gap: 8px; align-items: flex-start; }
.hyp-tier { flex-shrink: 0; font-weight: 700; font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; }
.hyp-tier.t1 { background: rgba(255,71,87,0.15); color: var(--severity-critical); }
.hyp-tier.t2 { background: rgba(136,136,136,0.1); color: var(--dim); }

/* Convergence */
.convergence-row {
  display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 0.78rem;
  border-bottom: 1px solid var(--border);
}
.convergence-row:last-child { border-bottom: none; }
.conv-fn { font-weight: 600; min-width: 140px; }
.conv-count { font-weight: 700; min-width: 30px; text-align: center; }
.conv-count.hot3 { color: var(--severity-critical); }
.conv-count.hot2 { color: var(--severity-medium); }
.conv-hunters { font-size: 0.7rem; color: var(--dim); }

/* Fuzzing pipeline */
.fuzz-pipeline { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.fuzz-phase {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 12px; font-size: 0.72rem; min-width: 130px;
}
.fuzz-phase.phase-done { border-color: var(--severity-low); }
.fuzz-phase-name { font-weight: 600; font-size: 0.75rem; }
.fuzz-phase-tool { color: var(--accent); font-size: 0.68rem; }
.fuzz-phase-desc { color: var(--dim); font-size: 0.65rem; margin-top: 2px; }
.fuzz-arrow { color: var(--dim); margin: 0 6px; font-size: 1rem; flex-shrink: 0; }

/* ── Activity Feed ───────────────────────────────────── */
.activity-feed { max-height: 500px; overflow-y: auto; }
.activity-title { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; margin-bottom: 10px; }
.activity-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.75rem; }
.activity-item:last-child { border-bottom: none; }
.activity-time { color: var(--dim); font-size: 0.68rem; }
.activity-event { font-weight: 600; margin-top: 2px; }
.activity-event.success { color: var(--severity-low); }
.activity-event.info { color: var(--status-confirmed); }
.activity-event.warning { color: var(--severity-medium); }
.activity-event.error { color: var(--severity-critical); }
.activity-narrative { color: var(--dim); font-size: 0.68rem; margin-top: 2px; }

/* ── Findings Table ──────────────────────────────────── */
.findings-section { margin-top: 20px; }
.findings-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.findings-table th {
  text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--accent);
  font-size: 0.72rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px;
}
.findings-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.findings-table tr { cursor: pointer; transition: background 0.15s; }
.findings-table tbody tr:hover { background: rgba(0,212,170,0.04); }
.sev-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.68rem;
  font-weight: 700; text-transform: uppercase;
}
.sev-critical { background: rgba(255,71,87,0.15); color: var(--severity-critical); }
.sev-high { background: rgba(255,107,107,0.15); color: var(--severity-high); }
.sev-medium { background: rgba(255,165,2,0.15); color: var(--severity-medium); }
.sev-low { background: rgba(46,213,115,0.15); color: var(--severity-low); }
.status-badge {
  display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.68rem; font-weight: 600;
}
.st-parked { background: rgba(136,136,136,0.15); color: var(--status-parked); }
.st-confirmed { background: rgba(52,152,219,0.15); color: var(--status-confirmed); }
.st-reported { background: rgba(46,213,115,0.15); color: var(--status-reported); }
.st-accepted { background: rgba(241,196,15,0.15); color: var(--status-accepted); }
.st-rejected { background: rgba(255,71,87,0.15); color: var(--status-rejected); }
.finding-detail {
  background: var(--bg); padding: 12px 16px; font-size: 0.75rem; border-bottom: 1px solid var(--border);
}

/* ── States ──────────────────────────────────────────── */
.state-msg { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 0.9rem; }

/* ── Scrollbar ───────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="container" x-data="dashboard()" x-init="init()">

  <!-- Loading -->
  <template x-if="loading && !data">
    <div class="state-msg">Cargando...</div>
  </template>

  <!-- Error / no hunt -->
  <template x-if="!loading && data && data.error">
    <div class="state-msg" x-text="data.error"></div>
  </template>

  <!-- Dashboard -->
  <template x-if="data && !data.error">
    <div>

      <!-- ═══ Section 1: Header ═══ -->
      <div class="header">
        <div class="header-left">
          <span class="protocol-name" x-text="data.protocol"></span>
          <span class="badge badge-platform" x-text="data.platform" x-show="data.platform"></span>
          <span class="badge badge-payout" x-text="data.payout" x-show="data.payout"></span>
        </div>
        <div class="header-right">
          <div class="theme-toggle">
            <button class="theme-btn" :class="{ active: theme === 'dark' }" @click="setTheme('dark')">Dark</button>
            <button class="theme-btn" :class="{ active: theme === 'light' }" @click="setTheme('light')">Light</button>
          </div>
          <div class="refresh-indicator">
            <span class="pulse-dot"></span>
            <span>Auto-refresh 5s</span>
          </div>
          <button class="btn-refresh" @click="refresh()">Refrescar</button>
        </div>
      </div>

      <!-- ═══ Section 2: Progress Bar ═══ -->
      <div class="progress-section">
        <div class="progress-header">
          <span x-text="data.components_done.length + ' / ' + data.total_components + ' componentes completados'"></span>
          <span x-text="data.findings.length + ' findings · ' + data.confirmed_count + ' confirmados'"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" :style="'width:' + (data.total_components ? (data.components_done.length / data.total_components * 100) : 0) + '%'"></div>
        </div>
      </div>

      <!-- ═══ Section 3: Component Map ═══ -->
      <div class="filters">
        <button class="filter-btn" :class="{ active: filter === 'all' }" @click="filter = 'all'">Todos</button>
        <button class="filter-btn" :class="{ active: filter === 'done' }" @click="filter = 'done'">Completados</button>
        <button class="filter-btn" :class="{ active: filter === 'active' }" @click="filter = 'active'">Activo</button>
        <button class="filter-btn" :class="{ active: filter === 'pending' }" @click="filter = 'pending'">Pendientes</button>
      </div>

      <div class="comp-grid">
        <template x-for="comp in filteredComponents()" :key="comp.name">
          <div class="comp-card" :class="compStatus(comp.name)" @click="toggleExpand(comp.name)">
            <div class="comp-card-header">
              <span class="comp-icon" x-text="compIcon(comp.name)"></span>
              <span class="comp-name" x-text="comp.name"></span>
            </div>
            <div class="comp-meta">
              <span x-text="(comp.loc || '?') + ' LOC'"></span>
              <span x-show="comp.priority"> · P<span x-text="comp.priority"></span></span>
            </div>
          </div>
        </template>
      </div>

      <!-- ═══ Section 4+5: Detail Panel (expandable) ═══ -->
      <template x-if="expanded">
        <div class="detail-panel" x-show="expanded" x-transition>
          <div class="detail-layout">
            <!-- Left: detail content -->
            <div>
              <div class="detail-title" x-text="'Detalle: ' + expanded"></div>

              <!-- No ficha -->
              <template x-if="!data.fichas[expanded]">
                <div class="no-ficha">Sin ficha — ejecuta run_hunt.py</div>
              </template>

              <template x-if="data.fichas[expanded]">
                <div>
                  <!-- 4a: Checklist -->
                  <div class="section-title">Checklist (12 items)</div>
                  <template x-for="(meta, key) in data.checklist_labels" :key="key">
                    <div class="checklist-item">
                      <span class="checklist-icon" :class="checklistState(key)" x-text="checklistIcon(key)"></span>
                      <div>
                        <div class="checklist-label" x-text="meta.label"></div>
                        <div class="checklist-desc" x-text="meta.desc"></div>
                      </div>
                    </div>
                  </template>

                  <!-- 4b: Hunters -->
                  <div class="section-title">Hunters</div>
                  <template x-if="data.hypotheses[expanded]">
                    <div>
                      <div class="hunters-grid">
                        <template x-for="(hdata, hname) in data.hypotheses[expanded]" :key="hname">
                          <div>
                            <div class="hunter-card" @click="expandedHunter = (expandedHunter === expanded+'_'+hname ? null : expanded+'_'+hname)">
                              <div class="hunter-name" x-text="hname"></div>
                              <div class="hunter-domain" x-text="data.hunter_domains[hname] || ''"></div>
                              <div class="hunter-stats">
                                <span x-text="hdata.count + ' hip.'"></span>
                                <span x-text="hdata.tier1 + ' T1'" style="font-weight:700"></span>
                              </div>
                              <span class="hunter-status"
                                :class="hunterCompleted(hname) ? 'completed' : 'waiting'"
                                x-text="hunterCompleted(hname) ? 'completado' : 'en espera'"></span>
                            </div>
                            <!-- Hypothesis list -->
                            <template x-if="expandedHunter === expanded+'_'+hname && hdata.items">
                              <div class="hyp-list">
                                <template x-for="hyp in hdata.items" :key="hyp.id">
                                  <div class="hyp-item">
                                    <span class="hyp-tier" :class="hyp.tier === 1 ? 't1' : 't2'" x-text="'T' + hyp.tier"></span>
                                    <span x-text="hyp.description || hyp.id"></span>
                                  </div>
                                </template>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                  <template x-if="!data.hypotheses[expanded]">
                    <div class="no-ficha">Sin hipótesis generadas aún.</div>
                  </template>

                  <!-- 4c: Convergence Map -->
                  <template x-if="data.convergence[expanded]">
                    <div>
                      <div class="section-title">Mapa de Convergencia</div>
                      <template x-for="row in data.convergence[expanded]" :key="row.function">
                        <div class="convergence-row">
                          <span class="conv-fn" x-text="row.function + '()'"></span>
                          <span class="conv-count" :class="row.count >= 3 ? 'hot3' : (row.count >= 2 ? 'hot2' : '')" x-text="row.count"></span>
                          <span class="conv-hunters" x-text="row.hunters.join(', ')"></span>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- 4d: Fuzzing Pipeline -->
                  <div class="section-title">Pipeline de Fuzzing</div>
                  <div class="fuzz-pipeline">
                    <template x-for="(phase, idx) in fuzzPhases()" :key="idx">
                      <div style="display:flex;align-items:center;">
                        <div class="fuzz-phase" :class="phase.done ? 'phase-done' : ''">
                          <div class="fuzz-phase-name" x-text="phase.name"></div>
                          <div class="fuzz-phase-tool" x-text="phase.tool"></div>
                          <div class="fuzz-phase-desc" x-text="phase.desc"></div>
                          <div style="font-size:0.65rem;margin-top:4px;" :style="phase.done ? 'color:var(--severity-low)' : 'color:var(--dim)'" x-text="phase.done ? '✓ Hecho' : '○ Pendiente'"></div>
                        </div>
                        <span class="fuzz-arrow" x-show="idx < 4">→</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <!-- Right: Activity Feed -->
            <div>
              <div class="activity-title">
                <span class="pulse-dot"></span>
                <span>Actividad en Vivo</span>
              </div>
              <div class="activity-feed">
                <template x-for="(evt, i) in componentActivity()" :key="i">
                  <div class="activity-item">
                    <div class="activity-time" x-text="evt.time"></div>
                    <div class="activity-event" :class="evt.type" x-text="evt.event"></div>
                    <div class="activity-narrative" x-text="evt.narrative"></div>
                  </div>
                </template>
                <template x-if="componentActivity().length === 0">
                  <div class="no-ficha">Sin actividad registrada.</div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ═══ Section 6: Findings Table ═══ -->
      <div class="findings-section" x-show="data.findings.length > 0">
        <div class="section-title" style="font-size:1rem;">Findings</div>
        <div style="overflow-x:auto;">
          <table class="findings-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Titulo</th>
                <th>Severidad</th>
                <th>Componente</th>
                <th>Estado</th>
                <th>Confianza</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(f, fi) in data.findings" :key="f.id || fi">
                <tr>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)" x-text="f.id || '-'"></td>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)" x-text="f.title || f.description || '-'"></td>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)">
                    <span class="sev-badge" :class="sevClass(f.severity)" x-text="f.severity || '-'"></span>
                  </td>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)" x-text="f.component || '-'"></td>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)">
                    <span class="status-badge" :class="statusClass(f.status)" x-text="f.status || '-'"></span>
                  </td>
                  <td @click="expandedFinding = (expandedFinding === fi ? null : fi)" x-text="(f.confidence || '-') + '%'"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <!-- Finding detail row -->
        <template x-if="expandedFinding !== null && data.findings[expandedFinding]">
          <div class="finding-detail">
            <div><strong>Descripcion:</strong> <span x-text="data.findings[expandedFinding].description || data.findings[expandedFinding].title || 'Sin descripcion'"></span></div>
            <div x-show="data.findings[expandedFinding].attack_scenario"><strong>Escenario:</strong> <span x-text="data.findings[expandedFinding].attack_scenario"></span></div>
            <div x-show="data.findings[expandedFinding].impact"><strong>Impacto:</strong> <span x-text="data.findings[expandedFinding].impact"></span></div>
            <div x-show="data.findings[expandedFinding].redteam_verdict"><strong>RedTeam:</strong> <span x-text="data.findings[expandedFinding].redteam_verdict"></span></div>
          </div>
        </template>
      </div>

      <!-- No findings -->
      <div x-show="data.findings.length === 0" class="no-ficha" style="margin-top:20px;">
        Sin findings registrados.
      </div>

    </div>
  </template>
</div>

<script src="alpine.min.js" defer></script>
<script>
window.addEventListener('error', function(e) {
  if (e.target && e.target.src && e.target.src.includes('alpine.min.js')) {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js';
    s.defer = true;
    document.head.appendChild(s);
  }
}, true);
</script>
<script>
function dashboard() {
  return {
    data: null,
    expanded: null,
    expandedFinding: null,
    expandedHunter: null,
    filter: 'all',
    loading: true,
    theme: localStorage.getItem('hunt-theme') || 'dark',

    init() {
      document.documentElement.setAttribute('data-theme', this.theme);
      this.refresh();
      setInterval(() => this.refresh(), 5000);
    },

    async refresh() {
      try {
        const res = await fetch('/api/dashboard');
        this.data = await res.json();
      } catch (e) {
        if (!this.data) this.data = { error: 'Error de conexion: ' + e.message };
      } finally {
        this.loading = false;
      }
    },

    setTheme(t) {
      this.theme = t;
      localStorage.setItem('hunt-theme', t);
      document.documentElement.setAttribute('data-theme', t);
    },

    allComponents() {
      if (!this.data) return [];
      const map = this.data.component_map || [];
      if (map.length) return map;
      const all = [];
      (this.data.components_done || []).forEach(n => all.push({ name: n, loc: '?', priority: null }));
      if (this.data.current_component) all.push({ name: this.data.current_component, loc: '?', priority: null });
      (this.data.components_remaining || []).forEach(n => all.push({ name: n, loc: '?', priority: null }));
      return all;
    },

    compStatus(name) {
      if (!this.data) return 'pending';
      if ((this.data.components_done || []).includes(name)) return 'done';
      if (this.data.current_component === name) return 'active';
      return 'pending';
    },

    compIcon(name) {
      const s = this.compStatus(name);
      if (s === 'done') return '✓';
      if (s === 'active') return '▶';
      return '○';
    },

    filteredComponents() {
      const all = this.allComponents();
      if (this.filter === 'all') return all;
      return all.filter(c => {
        const s = this.compStatus(c.name);
        if (this.filter === 'done') return s === 'done';
        if (this.filter === 'active') return s === 'active';
        if (this.filter === 'pending') return s === 'pending';
        return true;
      });
    },

    toggleExpand(name) {
      this.expanded = this.expanded === name ? null : name;
      this.expandedHunter = null;
    },

    checklistState(key) {
      if (!this.data || !this.expanded || !this.data.fichas[this.expanded]) return 'pending-step';
      const cl = this.data.fichas[this.expanded].checklist || {};
      if (cl[key]) return 'done';
      const keys = Object.keys(this.data.checklist_labels);
      const idx = keys.indexOf(key);
      const allPrevDone = keys.slice(0, idx).every(k => cl[k]);
      if (allPrevDone && !cl[key]) return 'active-step';
      return 'pending-step';
    },

    checklistIcon(key) {
      const s = this.checklistState(key);
      if (s === 'done') return '✓';
      if (s === 'active-step') return '◉';
      return '○';
    },

    hunterCompleted(hname) {
      if (!this.data || !this.expanded || !this.data.fichas[this.expanded]) return false;
      const hc = this.data.fichas[this.expanded].hunters_completed || {};
      return !!hc[hname];
    },

    fuzzPhases() {
      const cl = (this.data && this.expanded && this.data.fichas[this.expanded]) ? this.data.fichas[this.expanded].checklist || {} : {};
      return [
        { name: 'Phase 1', tool: 'Foundry', desc: 'Mock Quick — validacion rapida', done: !!cl.foundry_fuzz },
        { name: 'Phase 2', tool: 'Medusa', desc: 'Stateful — secuencias multi-step', done: false },
        { name: 'Phase 3', tool: 'Foundry Fork', desc: 'Contratos reales desde mainnet', done: false },
        { name: 'Phase 4', tool: 'Echidna', desc: 'Optimizacion — maximizar profit', done: false },
        { name: 'Phase 5', tool: 'Halmos', desc: 'Prueba simbolica — todos los inputs', done: false },
      ];
    },

    componentActivity() {
      if (!this.data || !this.expanded) return [];
      return (this.data.activity_log || []).filter(e => e.component === this.expanded);
    },

    sevClass(sev) {
      if (!sev) return '';
      const s = sev.toLowerCase();
      if (s === 'critical') return 'sev-critical';
      if (s === 'high') return 'sev-high';
      if (s === 'medium') return 'sev-medium';
      if (s === 'low') return 'sev-low';
      return '';
    },

    statusClass(status) {
      if (!status) return '';
      const s = status.toUpperCase();
      if (s === 'PARKED') return 'st-parked';
      if (s === 'CONFIRMED') return 'st-confirmed';
      if (s === 'REPORTED') return 'st-reported';
      if (s === 'ACCEPTED') return 'st-accepted';
      if (s === 'REJECTED') return 'st-rejected';
      return 'st-parked';
    }
  };
}
</script>
</body>
</html>
