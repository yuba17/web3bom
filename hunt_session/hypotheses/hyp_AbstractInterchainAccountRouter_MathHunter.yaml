invariants:
- id: AIAR-M-01
  tier: 2
  type: property
  description: "quoteGasPayment uses empty body but actual dispatch uses encoded body -- quote may underestimate if hook pricing depends on message size"
  attack_scenario: >
    quoteGasPayment(line 210) passes `new bytes(0)` as body, but the actual dispatch in
    callRemoteWithOverrides passes the full encoded InterchainAccountMessage body. If the hook
    prices based on message body length (e.g., per-byte fee), the quote will be lower than actual
    cost. User underpays with ERC20 feeToken path, or overpays with native ETH path (excess not
    refunded to user but stays in router). In _dispatchMessageWithValue, the fee is quoted with
    bytes("") (line 261) not the actual body either, so the ERC20 fee path is also under-quoted.
  impact: "User may lose funds if hook charges more than quoted, or router accumulates dust from overpayment"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Compare quote with empty body vs quote with realistic body size
    // If they differ, the quote function is inaccurate
    uint256 quoteEmpty = originRouter.quoteGasPayment(DESTINATION, 200000);
    // The actual dispatch also quotes with empty bytes in _dispatchMessageWithValue
    // so this checks consistency between public quote and internal quote
    // Both use empty body, so they should match -- but the REAL cost at the hook may differ
    // This invariant verifies the public API is at least internally consistent
    uint256 quoteFromRouter = originRouter.quoteGasPayment(DESTINATION, 200000);
    eq(quoteEmpty, quoteFromRouter, "AIAR-M-01: quoteGasPayment not deterministic");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    Both quoteGasPayment AND _dispatchMessageWithValue quote with empty/zero-length body.
    The real question is whether the hook charges differently when it receives the actual
    non-empty body during mailbox.dispatch. This is a design-level mismatch -- the quote
    is for an empty message but the dispatch sends a real message. The severity depends on
    whether any deployed hook prices by body size.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-M-02
  tier: 2
  type: property
  description: "_getSalt uses abi.encodePacked with fixed-size types only -- no collision risk from dynamic types but verify determinism"
  attack_scenario: >
    _getSalt(line 340) uses abi.encodePacked(uint32, bytes32, bytes32, bytes32, bytes32).
    Since all types are fixed-size, there is NO abi.encodePacked collision risk (the classic
    bug only applies when mixing dynamic types or variable-length types that can be split
    differently). However, verify that the salt computation is deterministic and that two
    different (origin, owner, router, ism, userSalt) tuples never produce the same salt.
    With uint32 (4 bytes) + 4*bytes32 (128 bytes) = 132 bytes total, always same length.
    This is safe by construction. MARKING AS FALSE POSITIVE.
  impact: "If collision found, attacker could hijack another user's ICA"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify two different parameter sets produce different salts
    // Using the public getLocalInterchainAccount as a proxy for _getSalt
    address account1 = address(destRouter.getLocalInterchainAccount(ORIGIN, USER1, address(destRouter), address(0)));
    address account2 = address(destRouter.getLocalInterchainAccount(ORIGIN, USER2, address(destRouter), address(0)));
    t(account1 != account2, "AIAR-M-02: different owners produce same ICA address");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 30
  notes: >
    Investigated: abi.encodePacked with all fixed-size types (uint32 + 4x bytes32) is safe.
    No dynamic type collision possible. The uint32 is 4 bytes and cannot bleed into the next
    bytes32 because bytes32 is always exactly 32 bytes. Total packed = 132 bytes always.
    This is a FALSE POSITIVE for collision but keeping as a sanity-check invariant.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-M-03
  tier: 1
  type: property
  description: "Fee token transfer amount may not match what hook actually consumes -- residual tokens accumulate in router"
  attack_scenario: >
    In _dispatchMessageWithValue (line 259-267): the router quotes a fee, transfers that exact
    amount from msg.sender, then does forceApprove(hook, type(uint256).max). The hook then takes
    what it needs during mailbox.dispatch. If the hook takes LESS than the quoted amount (quote
    is an upper bound), the difference stays in the router forever. Over many transactions, this
    could accumulate significant value. Anyone can then call approveFeeTokenForHook to approve
    a malicious "hook" to drain these residual tokens.
  impact: "Accumulated fee token dust in router can be drained via approveFeeTokenForHook"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a dispatch with feeToken, check that router does not retain fee tokens
    uint256 routerBalance = feeToken.balanceOf(address(originRouter));
    // If router retains tokens after dispatch, they are extractable via approveFeeTokenForHook
    // This checks the router should have zero balance of fee tokens after dispatch
    eq(routerBalance, 0, "AIAR-M-03: router retains fee tokens after dispatch -- drainable via approveFeeTokenForHook");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    This combines with the permissionless approveFeeTokenForHook (IAR-DD-01 already found in
    child contract). Here we focus on the MATH aspect: the quote may overestimate, leaving
    residual tokens. The forceApprove(type(uint256).max) is also concerning -- it approves
    ALL tokens the router holds, not just the current fee amount.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-M-04
  tier: 2
  type: property
  description: "msg.value forwarded entirely to mailbox.dispatch but hook may only consume part of it"
  attack_scenario: >
    callRemoteWithOverrides passes msg.value entirely to _dispatchMessageWithValue which
    forwards it to mailbox.dispatch{value: _value}. If the mailbox/hook only needs a portion
    of msg.value, the excess ETH stays in the mailbox (not refunded to caller). The user
    overpays. Combined with the receive() function that accepts arbitrary ETH, the router
    can also accumulate ETH that is never recoverable (no sweep function).
  impact: "Users overpay ETH fees with no refund mechanism; ETH stuck in router via receive()"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track ETH balance of router before and after operations
    // receive() accepts ETH but there is no way to withdraw it
    uint256 routerEthBalance = address(originRouter).balance;
    // Any ETH in the router (not forwarded to mailbox) is permanently stuck
    // ghost_routerBalanceBefore is set before handler calls
    // After all dispatches, router should not accumulate ETH
    gte(ghost_routerBalanceBefore + ghost_totalMsgValueSent, routerEthBalance, "AIAR-M-04: router ETH balance grew unexpectedly");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The receive() payable with no withdrawal function means any ETH sent directly to the
    router is permanently locked. This is a known pattern but worth flagging as the router
    is a high-value target address that might receive ETH from failed refunds etc.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-M-05
  tier: 2
  type: property
  description: "forceApprove(type(uint256).max) on every dispatch is wasteful but also leaves permanent max approval"
  attack_scenario: >
    Every time _dispatchMessageWithValue is called with a feeToken, it does
    forceApprove(address(_hook), type(uint256).max) at line 267. This means the hook has
    permanent unlimited approval even after the dispatch. If the hook contract is upgradeable
    or compromised, it can drain ALL fee tokens the router holds (from previous dispatches
    where quote > actual cost). The approval is never revoked.
  impact: "Compromised or upgraded hook can drain all fee tokens held by router"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After any dispatch with feeToken, the hook has max approval on router's tokens
    // This is a permanent state that never gets cleaned up
    uint256 allowance = feeToken.allowance(address(originRouter), address(originRouter.hook()));
    // If any feeToken dispatch was made, allowance should be max
    // The invariant is: router should NOT have feeToken balance AND max approval simultaneously
    uint256 routerTokenBalance = feeToken.balanceOf(address(originRouter));
    if (routerTokenBalance > 0 && allowance > 0) {
        // This is the dangerous state: hook can take all tokens
        t(false, "AIAR-M-05: router has tokens AND active approval -- hook can drain");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Related to AIAR-M-03. The combination of residual tokens + permanent max approval is
    the actual vulnerability vector. The forceApprove should ideally approve only the exact
    fee amount, or revoke after dispatch.
  poc_sketch: ''
  call_stack: ''

