invariants:
- id: WR-O-01
  tier: 2
  type: property
  description: >
    WorkflowRouter does NOT enforce any replay protection at the routing layer.
    The same (metadata, report) pair can be sent to onReport() multiple times
    by a FORWARDER_ROLE holder. Whether replay causes harm depends entirely
    on the downstream target. For PriceManager.transmit(), replay is mitigated
    by the VerifierProxy (which may reject already-verified reports) and the
    staleness check. For performUpkeep() and bid(), replay could cause
    unexpected re-execution if the target does not have its own idempotency.
  attack_scenario: >
    1. FORWARDER calls onReport(metadata, report) with a valid transmit() payload.
    2. Price is updated successfully.
    3. FORWARDER calls onReport() again with the EXACT same (metadata, report).
    4. At the WorkflowRouter level, nothing prevents this — same workflowId,
    same target, same selector all pass the allowlist checks.
    5. Whether this succeeds depends on VerifierProxy.verifyBulk() —
    if it accepts the same signed report twice (within the validity window),
    the price is re-written with the same value (no-op in practice).
    6. For non-transmit targets like performUpkeep(), replaying could
    re-trigger auction start or bid execution if the target lacks guards.
  impact: "Low practical impact for transmit() (VerifierProxy + staleness mitigate). For performUpkeep/bid replay, depends on target-side guards. WorkflowRouter itself is not the right layer for replay protection."
  impact_rating: Info
  likelihood: Low
  severity_final: Info
  confidence: 30
  code_location: "WorkflowRouter.sol:86-118 (onReport function — no nonce/timestamp tracking)"
  solidity: |
    // Conceptual invariant: each unique (workflowId, report_hash) should only
    // be processed once. WorkflowRouter does NOT enforce this.
    // mapping(bytes32 => bool) processedReports;
    // bytes32 reportHash = keccak256(abi.encode(metadata, report));
    // assert(!processedReports[reportHash]);
  notes: >
    This is INFO because: (a) FORWARDER_ROLE is a trusted Chainlink DON component,
    (b) PriceManager.transmit() has its own VerifierProxy verification + staleness,
    (c) the architecture deliberately pushes content validation to targets.
    However, if a new target is allowlisted that lacks idempotency guards,
    this becomes a real vector. Worth flagging as a design consideration.

- id: WR-O-02
  tier: 2
  type: property
  description: >
    WorkflowRouter treats the report as opaque bytes — it decodes only
    (address target, bytes data) and validates target + selector against
    the allowlist. It does NOT validate any content within the data payload.
    This means the router cannot distinguish between a legitimate price report
    and a crafted payload that calls an allowlisted selector with manipulated
    arguments. Content validation is fully delegated to the target contract.
  attack_scenario: >
    1. Assume FORWARDER_ROLE is compromised (or a bug in DON signing).
    2. Attacker crafts report = abi.encode(auction_address,
       abi.encodeWithSelector(transmit.selector, [malicious_report_bytes])).
    3. WorkflowRouter checks: workflowId allowlisted? YES.
       Target (auction) allowlisted for this workflowId? YES.
       Selector (transmit) allowlisted for this target? YES.
    4. Router forwards the call. PriceManager.transmit() receives the
       malicious report bytes but VerifierProxy.verifyBulk() should reject
       them if DON signatures are invalid.
    5. The real protection is VerifierProxy signature verification, NOT
       WorkflowRouter. If VerifierProxy is also compromised or has a bug,
       there is no second line of defense.
  impact: "If FORWARDER_ROLE AND VerifierProxy are both compromised, arbitrary price manipulation is possible. Single compromise of FORWARDER alone is insufficient because transmit() verifies DON signatures."
  impact_rating: Info
  likelihood: Very Low
  severity_final: Info
  confidence: 20
  code_location: "WorkflowRouter.sol:103-117 (report decoded as opaque (address, bytes), no content checks)"
  solidity: |
    // WorkflowRouter only checks routing, not content:
    // (address target, bytes memory data) = abi.decode(report, (address, bytes));
    // bytes4 selector extracted from data
    // Checks: workflowId allowlisted, target allowlisted, selector allowlisted
    // Then: _call(target, data) — no content inspection
  notes: >
    This is by design — WorkflowRouter is a routing middleware, not a
    content validator. The defense-in-depth comes from PriceManager's
    VerifierProxy verification. Marking Info because it requires trusted
    role compromise. The design is sound for its intended purpose.

- id: WR-O-03
  tier: 2
  type: property
  description: >
    The metadata field contains workflow_name (bytes10 at offset 32) and
    workflow_owner (address at offset 42), but WorkflowRouter only reads
    workflowId (bytes32 at offset 0). The workflow_name and workflow_owner
    are completely ignored. This means two different workflows with different
    names/owners but the same workflowId would be treated identically.
    Additionally, there is no validation that the workflow_owner in metadata
    matches any expected value.
  attack_scenario: >
    1. FORWARDER sends onReport() with metadata containing:
       workflowId = PRICE_ADMIN_WORKFLOW_ID (valid),
       workflow_name = arbitrary bytes10,
       workflow_owner = arbitrary address.
    2. WorkflowRouter only extracts bytes32(metadata[:32]) = workflowId.
    3. The rest of metadata is completely ignored.
    4. Call proceeds to target with full permissions.
    5. No exploit here IF workflowId is the sole authentication factor
       (which it is, by design), but this means the metadata schema
       is partially vestigial within this contract.
  impact: "No direct impact. The workflowId is the only routing key. The ignored fields are part of the IReceiver interface standard but serve no security function in this implementation."
  impact_rating: Info
  likelihood: N/A
  severity_final: Info
  confidence: 90
  code_location: "WorkflowRouter.sol:90-94 (metadata layout documented at L91-93, only L94 actually used)"
  solidity: |
    // Metadata layout per comments:
    // - Offset 0, size 32: workflow_id (bytes32)  <- USED
    // - Offset 32, size 10: workflow_name (bytes10) <- IGNORED
    // - Offset 42, size 20: workflow_owner (address) <- IGNORED
    bytes32 workflowId = bytes32(metadata[:32]);
  notes: >
    Pure informational. The IReceiver interface defines the metadata format
    but WorkflowRouter only needs workflowId for routing. No security gap
    because workflowId uniquely identifies an authorized workflow. The
    workflow_owner could theoretically add a second authorization check
    but this is not how the system is designed.

- id: WR-O-04
  tier: 2
  type: property
  description: >
    WorkflowRouter uses _call() (from Caller.sol) which performs a raw
    target.call(data) without value. The return value from onReport() is
    void — the return data from the target call is silently discarded.
    If a target function returns important status information (e.g., success/
    failure indicator), WorkflowRouter would not propagate it. However,
    target functions that fail will revert, and _call() bubbles up reverts,
    so failure detection works correctly.
  attack_scenario: >
    1. FORWARDER calls onReport() to execute target.someFunction().
    2. someFunction() succeeds but returns false (indicating partial failure).
    3. _call() captures the returnData but onReport() discards it.
    4. FORWARDER has no on-chain way to know the call returned false.
    5. In practice, all current targets (transmit, performUpkeep, bid)
       do not use return values for success signaling — they revert on failure.
  impact: "No practical impact with current targets. Revert-based error handling works correctly. Only relevant if future allowlisted targets use return-value-based error signaling (uncommon in Solidity)."
  impact_rating: Info
  likelihood: Very Low
  severity_final: Info
  confidence: 85
  code_location: "WorkflowRouter.sol:117 (_call return value discarded), Caller.sol:27 (raw call with revert bubbling)"
  solidity: |
    // In onReport():
    _call(target, data);  // return value discarded
    // In Caller._call():
    (bool success, bytes memory response) = target.call(data);
    if (!success) { /* revert bubbled */ }
    return response;  // returned but caller ignores it
  notes: >
    This is standard Solidity pattern for fire-and-forget calls.
    The revert bubbling ensures failures are not silently swallowed.
    No action needed unless targets start using return values.

- id: WR-O-05
  tier: 2
  type: property
  description: >
    PriceManager.transmit() requires PRICE_ADMIN_ROLE on msg.sender.
    When called via WorkflowRouter._call(), msg.sender is WorkflowRouter
    (not the original FORWARDER). This means WorkflowRouter itself must
    hold PRICE_ADMIN_ROLE on the target PriceManager/Auction contract.
    The security boundary shifts: instead of validating the DON directly,
    the target trusts WorkflowRouter which trusts the FORWARDER. This is
    a 2-hop trust chain. If WorkflowRouter's allowlist is misconfigured
    (e.g., wrong workflowId → target mapping), a workflow could call
    targets it shouldn't reach.
  attack_scenario: >
    1. Admin configures WorkflowRouter with workflowId_A → auction.transmit()
       and workflowId_B → auction.performUpkeep().
    2. Admin accidentally adds auction.transmit() to workflowId_B's allowlist too.
    3. Now the AUCTION_WORKER workflow can also transmit prices, even though
       its DON logic is not designed for price reporting.
    4. If the AUCTION_WORKER DON produces a report that happens to decode
       as valid transmit() arguments, it could update prices through an
       unintended path.
    5. In practice, the report encoding would likely not match transmit()'s
       expected format, causing a revert. But the allowlist misconfiguration
       itself is the vulnerability.
  impact: "Misconfigured allowlist could allow unintended cross-workflow target access. Impact depends on the specific misconfiguration. WorkflowRouter has no way to detect semantic mismatches — it only checks structural (workflowId, target, selector) tuples."
  impact_rating: Low
  likelihood: Low
  severity_final: Low
  confidence: 40
  code_location: "WorkflowRouter.sol:99-117 (allowlist check is purely structural, no semantic validation)"
  solidity: |
    // The allowlist maps: workflowId -> target -> selector
    // No check that the workflow's purpose matches the target's purpose
    // E.g., nothing prevents mapping a "price" workflow to "bid" selector
    // if admin misconfigures
  notes: >
    This is an admin misconfiguration risk, not a code bug. The allowlist
    design is correct for its purpose — it just relies on correct admin
    configuration. Severity is Low because it requires admin error and the
    downstream target's input validation (VerifierProxy for transmit) would
    likely catch semantically invalid calls. Marking as Low, not Info,
    because unlike the other hypotheses, the misconfiguration is plausible
    and would bypass the intended workflow isolation.

- id: WR-OR-06
  tier: 1
  type: property
  description: >
    ANÁLISIS DE INTEGRIDAD DEL SELECTOR — El assembly `selector := mload(add(data, 32))`
    extrae los primeros 4 bytes del contenido de `data` (bytes memory).
    Layout de bytes memory en memoria: [slot_longitud (32 bytes)][contenido...].
    Por tanto `data + 32` apunta al inicio del contenido, y mload toma 32 bytes
    comenzando allí. Como bytes4 toma los 4 bytes más significativos (big-endian),
    se obtiene data[0:4] = el selector. Esto es idéntico a lo que _call(target, data)
    ejecutará. No hay desincronización entre el selector verificado y el ejecutado.
    CASO EDGE: data.length < 4 → mload lee bytes del contenido + padding de cero,
    produciendo un selector parcialmente cero. Ese selector no estará en la allowlist
    (ningún selector con bytes de cero al final es allowlisteado en práctica), y
    bytes4(0) está explícitamente bloqueado. La TX revertiría en SelectorNotAllowlisted.
    CONCLUSIÓN: La extracción de selector es segura aunque no tenga un require(data.length >= 4).
  attack_scenario: >
    No hay ataque viable. El edge case de data corto causa revert, no bypass.
    El selector extraído y el ejecutado son siempre idénticos.
  impact: "Ninguno — análisis confirma que la extracción de selector es correcta y segura"
  impact_rating: Info
  likelihood: Low
  severity_final: Info
  confidence: 95
  code_location: "WorkflowRouter.sol:104-107 (assembly selector extraction)"
  solidity: |
    // Verificar consistencia: selector extraído == selector ejecutado
    bytes4 extractedSelector;
    assembly ("memory-safe") {
      extractedSelector := mload(add(data, 32))
    }
    // El check y el call usan el mismo data — no hay desincronización posible
    // Si data.length < 4 → extractedSelector tiene bytes de cero
    // bytes4(0) nunca está en allowlist → revert SelectorNotAllowlisted
    t(
      data.length < 4 || s_workflowInfos[workflowId].allowlistedSelectors[target].contains(extractedSelector),
      "WR-OR-06: selector extraído no en allowlist pero call procedería"
    );
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    False positive investigado y descartado. Documentado para que otros hunters
    no pierdan tiempo re-investigando el mismo edge case.

- id: WR-OR-07
  tier: 2
  type: property
  description: >
    WORKFLOW_OWNER EN METADATA IGNORADO — La especificación del metadata documenta tres campos:
    workflowId (offset 0, 32 bytes), workflow_name (offset 32, 10 bytes), workflow_owner
    (offset 42, 20 bytes). WorkflowRouter solo verifica workflowId. El workflow_owner
    es completamente ignorado. Esto significa que el contrato no puede distinguir si
    el report proviene del propietario legítimo del workflow o de otro actor.
    Sin embargo, en el modelo de Chainlink Keystone, el workflow_owner está embedded
    en el workflowId (el workflowId se deriva del workflow owner + workflow name + hash
    de la definición). Por tanto, workflowId ya es suficiente para autenticación.
    IMPLICACIÓN: No hay vulnerabilidad, pero el campo workflow_owner en el metadata
    es vestigial desde la perspectiva de seguridad de este contrato.
    NOTA SUTIL: Si el CRE pudiera producir reports con el mismo workflowId pero
    diferentes workflow_owners (teóricamente imposible por design del CRE), el router
    no detectaría la discrepancia. Documentado como consideración de diseño.
  attack_scenario: >
    Requeriría que el CRE produzca reports con workflowId correcto pero workflow_owner falso.
    Imposible en el modelo real del CRE (workflowId deriva del owner).
    FORWARDER_ROLE comprometido podría hacer esto, pero es trusted role.
    No hay ataque viable sin comprometer roles confiados.
  impact: "Info — diseño intencional, no explotable sin trusted role compromise"
  impact_rating: Info
  likelihood: Low
  severity_final: Info
  confidence: 90
  code_location: "WorkflowRouter.sol:83-87 (metadata layout comentado pero workflow_owner no verificado)"
  solidity: |
    // Metadata layout documentado en el contrato:
    // Offset 0-31: workflowId (VERIFICADO)
    // Offset 32-41: workflow_name (IGNORADO)
    // Offset 42-61: workflow_owner (IGNORADO)
    bytes32 workflowId = bytes32(metadata[:32]);
    // No hay verificación de workflow_owner contra una lista esperada
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    El workflowId en Chainlink Keystone es un hash que incluye el workflow owner,
    por lo que verificar el workflowId es equivalente a verificar indirectamente
    el owner. La no-verificación explícita del workflow_owner es segura por diseño
    del sistema CRE subyacente.

