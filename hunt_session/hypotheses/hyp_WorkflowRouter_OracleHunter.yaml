- hunter: OracleHunter
  id: WR-OR-FP-02
  reason: >
    "WorkflowRouter podría ser usado para replay de un mismo report (mismo price transmit)."
    INVESTIGADO: No hay nonce ni hash de report almacenado en WorkflowRouter.
    Técnicamente el mismo (metadata, report) puede enviarse varias veces.
    SIN EMBARGO: PriceManager.transmit() llama a VerifierProxy.verifyBulk() que verifica
    las firmas del DON. Si el VerifierProxy tiene replay protection (que los contratos
    de Chainlink tienen), el segundo call fallaría ahí. Además, el stalenessThreshold
    en PriceManager previene que un precio antiguo sobreescriba uno reciente si el
    observationsTimestamp es viejo. Para performUpkeep/bid: esos targets tienen sus
    propias guards (estado de subasta, checks de liquidez). El replay sin impact real
    requiere que TODOS los targets downstream carezcan de idempotencia.
    Confidence en el replay como problema real: 20%. Marcado como Info en WR-O-01.
  investigated_at: '2026-03-22T12:00:00Z'
  pending_briefing_update:
    action: none
    briefing: ''
    content: ''
    briefing_update_applied: false

summary: >
  WorkflowRouter es un contrato de routing minimal y bien diseñado. Desde la perspectiva
  OracleHunter, NO contiene lógica oracle propia — delega todo a los targets downstream.
  Las observaciones principales son:

  (1) WR-O-01: Sin replay protection en la capa del router. Mitigado por targets (VerifierProxy,
      staleness, estado de subasta). Info.
  (2) WR-O-02: Report forwarding opaco sin validación de contenido. By design.
      La validación real es de VerifierProxy en PriceManager. Info.
  (3) WR-O-03: Campos workflow_name y workflow_owner en metadata ignorados.
      workflowId es suficiente por derivación en el CRE. Info.
  (4) WR-O-04: Return values de _call() descartados. Mitigado por revert bubbling.
      Todos los targets actuales usan reverts, no return values. Info.
  (5) WR-O-05: WorkflowRouter debe tener roles en targets (PRICE_ADMIN_ROLE, AUCTION_WORKER_ROLE,
      etc.) — 2-hop trust chain. Riesgo de misconfiguration de allowlist. Low.
  (6) WR-OR-06: Selector extraction via assembly es segura. Edge case data < 4 bytes
      causa revert, no bypass. Documentado como false positive.
  (7) WR-OR-07: workflow_owner ignorado es by design del CRE (workflowId lo incluye). Info.

  VEREDICTO: Sin findings Medium+. El contrato es correcto para su propósito.
  La seguridad del sistema depende de: integridad del KeystoneForwarder (trusted),
  correcta configuración de workflowIds separados por función (operacional), y
  la verificación criptográfica en VerifierProxy (out of scope pero crítica).

  RECOMENDACIÓN PARA CROSS-COMPONENT HUNT: La superficie más valiosa es
  WorkflowRouter → PriceManager.transmit() → BaseAuction price usage.
  Un report de precio malformado pero firmado correctamente podría causar
  pérdida de fondos si los checks de staleness/decimals en PriceManager son insuficientes.
