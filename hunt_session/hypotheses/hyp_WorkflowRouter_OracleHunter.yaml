  id: WR-OR-FP-01
  reason: >
    "El assembly mload(add(data, 32)) podría leer bytes incorrectos si data es vacío o < 4 bytes."
    INVESTIGADO: Si data.length < 4, mload produce un selector con bytes de padding (cero).
    bytes4(0) nunca está allowlisteado (bloqueado en applyAllowlistedSelectorsUpdates).
    Cualquier selector parcialmente cero tampoco estará en la allowlist práctica.
    La TX revertiría en SelectorNotAllowlisted. No hay bypass de seguridad.
    La extracción de selector es "accidentalmente segura" sin require(data.length >= 4).
  investigated_at: '2026-03-22T12:00:00Z'
