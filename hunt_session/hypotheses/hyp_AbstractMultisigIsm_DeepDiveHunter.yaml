overall_assessment: 'The AbstractMultisigIsm code is EXTREMELY well-designed. The
  cryptographic

  verification (ECDSA, merkle proofs, checkpoint digests) is sound.

  The two-pointer algorithm is correct for unique validator sets.


  The ONLY concrete finding is the factory''s lack of validator uniqueness

  validation, which 5/9 hunters independently flagged. This is a real gap

  but requires admin misconfiguration to exploit — the factory is permissionless

  but the ISM must be configured on a Mailbox by a privileged actor.


  For Immunefi: borderline MEDIUM. Exclusion says "attacks requiring privileged

  access" are out of scope, but the factory gap is a code-level validation

  failure, not a governance design choice. The factory SHOULD validate inputs.

  Trail of Bits likely already flagged this — probability of duplicate: 80%.

  '
hypotheses:
- id: ISM-DD-01
  poc: test/chimera/ism/ForkPoC_ISM_DD_01.sol
  title: Factory duplicate validators enable single-key threshold bypass
  description: 'StaticThresholdAddressSetFactory.deploy() accepts duplicate addresses
    in

    the _values array without any uniqueness check. When the resulting ISM''s

    verify() runs, the two-pointer algorithm matches each duplicate separately,

    allowing a single private key to satisfy multiple threshold slots.


    Example: deploy([A, A, A, B, C], 3) creates a "3-of-5" ISM that actually

    requires only 1 unique signer (A). The factory''s only check is

    0 < threshold <= values.length, which passes for duplicates.


    This is the CONSOLIDATED finding from 5 independent hunters (ISM-ACC-04,

    ISM-F-03, ISM-WC-01, ISM-WC-02, ISM-SIG-07) with a concrete attack path.

    '
  component: StaticAddressSetFactory + AbstractMultisigIsm
  file: contracts/libs/StaticAddressSetFactory.sol
  line: 35-52
  severity: medium
  confidence: 80
  validated: true
  category: input_validation
  attack_vector: "1. Attacker (or careless admin) calls factory.deploy([A, A, A, B,\
    \ C], 3)\n2. Factory passes validation (3 <= 5 ✓)\n3. MetaProxy ISM deployed with\
    \ duplicate validators baked into bytecode\n4. Admin sets this ISM on Mailbox\
    \ for a domain\n5. Attacker with ONLY key A crafts metadata with [sigA, sigA,\
    \ sigA]\n6. verify(): i=0 → recover(sigA)=A, match validators[0]\n   i=1 → recover(sigA)=A,\
    \ match validators[1]\n   i=2 → recover(sigA)=A, match validators[2]\n7. Threshold\
    \ 3 satisfied with 1 unique signer → message verified\n8. Mailbox.process() executes\
    \ → cross-chain message delivered\n"
  impact: 'Cross-chain message verification bypass. If the ISM protects a high-value

    route, a single compromised validator key can verify arbitrary messages,

    enabling theft of bridged assets. Impact = total value protected by the ISM.

    '
  preconditions:
  - ISM must be deployed with duplicate validators (factory misconfiguration)
  - ISM must be set as the security module on a Mailbox or Router
  - Attacker must have one of the duplicated validator private keys
  immunefi_assessment:
    reportable: true
    likely_severity: medium
    risk_of_duplicate: HIGH (80%) — standard factory input validation finding, Trail
      of Bits likely caught
    exclusion_risk: '''Attacks requiring privileged access'' — but factory gap is
      code-level, not governance'
  call_stack: "factory.deploy([A,A,A,B,C], 3)\n  → require(0 < 3 && 3 <= 5) ✓ — NO\
    \ uniqueness check\n  → _saltAndBytecode: abi.encode([A,A,A,B,C], 3)\n  → MetaProxy.bytecode(impl,\
    \ metadata)\n  → Create2.deploy(0, salt, bytecode)\n... later ...\nmailbox.process(metadata,\
    \ message)\n  → ism.verify(metadata, message)\n    → digest = CheckpointLib.digest(...)\n\
    \    → validatorsAndThreshold(message) → ([A,A,A,B,C], 3) from MetaProxy\n   \
    \ → for i in 0..2:\n        ECDSA.recover(digest, sigA) = A\n        while validators[idx]\
    \ != A: idx++\n        match! idx++\n    → return true ← BYPASSED with 1 key\n"
  solidity: "// ISM-DD-01: Factory must reject duplicate validators\nfunction check_ISM_DD_01_noDuplicateValidatorsInFactory()\
