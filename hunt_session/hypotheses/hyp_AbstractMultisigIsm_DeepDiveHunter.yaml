- id: ISM-DD-02
  title: signatureCount never validated against threshold — silent metadata truncation
  description: 'verify() iterates from i=0 to _threshold-1, calling signatureAt(_metadata,
    i)

    for each. It NEVER checks that signatureCount(_metadata) >= _threshold.


    If metadata contains fewer signatures than threshold, signatureAt reads

    past the actual signatures section. In MerkleRootMultisigIsmMetadata,

    signatureAt accesses _metadata[offset + _index*65 : offset + (_index+1)*65].

    If this extends beyond metadata length, Solidity returns 0-bytes, and

    ECDSA.recover reverts on invalid signature (0-length bytes).


    This is NOT a bypass — it''s a guaranteed revert. But the error message

    "ECDSAInvalidSignatureLength" from OZ is misleading and doesn''t indicate

    the REAL problem (insufficient signatures). This makes debugging harder

    for relayers.


    More importantly: what if a future OZ version changes ECDSA.recover

    behavior to return address(0) instead of reverting on empty input?

    Then this missing check becomes a critical bypass.

    '
  component: AbstractMultisigIsm
  file: contracts/isms/multisig/AbstractMultisigIsm.sol
  line: 109
  severity: low
  confidence: 65
  validated: true
  category: defensive_coding
  impact: 'Currently: DoS only (revert with misleading error). No value at risk.

    Future risk: if ECDSA.recover ever returns address(0) on empty input,

    AND address(0) is in validator set, threshold could be bypassed.

    Both conditions are currently impossible (OZ reverts, factory doesn''t

    block address(0) but ECDSA never returns it).

    '
  preconditions:
  - Relayer submits metadata with fewer signatures than threshold
  call_stack: "verify(metadata_with_1_sig, message)\n  → _threshold = 3\n  → i=0:\
    \ signatureAt(metadata, 0) → valid sig → OK\n  → i=1: signatureAt(metadata, 1)\
    \ → reads beyond sig section\n    → calldata slice returns 0 bytes\n    → ECDSA.recover(digest,\
    \ 0x) → revert \"ECDSAInvalidSignatureLength\"\n"
  solidity: "// ISM-DD-02: verify should check signatureCount >= threshold\nfunction\
    \ check_ISM_DD_02_signatureCountVsThreshold() public view {\n    // This invariant\
    \ verifies the defensive coding property:\n    // signatureCount in metadata should\
    \ be >= threshold\n    // Currently OZ ECDSA handles this by reverting, but explicit\
    \ check is better\n    // This is informational — no bypass possible with current\
    \ OZ version\n    t(true, \"ISM-DD-02: Informational — OZ ECDSA prevents bypass\"\
    );\n}\n"
  poc_sketch: '// No PoC needed — this is informational/defensive-coding

    // verify() with insufficient signatures always reverts

