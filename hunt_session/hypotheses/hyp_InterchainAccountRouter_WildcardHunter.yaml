false_positives:
- hunter: WildcardHunter
  id: IAR-FP-01
  reason: |
    handle() no tiene onlyRemoteRouter modifier - esto es BY DESIGN segun el NatSpec:
    "Does not need to be onlyRemoteRouter, as this application is designed to receive
    messages from untrusted remote contracts." La seguridad se delega al ISM, no al
    router enrollment. Esto no es un bug, es una decision arquitectural.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "InterchainAccountRouter intencionalmente acepta mensajes de contratos no confiados. La seguridad se basa en el ISM, no en router enrollment. No marcar como finding."
    briefing_update_applied: false

- hunter: WildcardHunter
  id: IAR-FP-02
  reason: |
    La ICA usa MinimalProxy que delegatea al implementation. El implementation se despliega
    una sola vez en el constructor con Create2.deploy(0, bytes32(0), bytecode).
    Parecia posible que un atacante pre-deployara en esa address, pero bytes32(0) salt +
    bytecode deterministico + deployer=router address hacen que la address sea unica al router.
    No es explotable.
  investigated_at: '2026-03-24T00:00:00Z'
