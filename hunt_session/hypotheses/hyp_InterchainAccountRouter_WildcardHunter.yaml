- id: IAR-W-11
  tier: 1
  type: property
  description: "callRemoteWithOverrides permite _ism arbitrario que define el ISM del ICA en destino, independiente del ISM enrolled"
  attack_scenario: |
    callRemoteWithOverrides (L530-560) acepta _ism como parametro y lo usa directamente
    en InterchainAccountMessage.encode. Este ISM se embebe en el mensaje y en destino
    se usa para:
    1. route() retorna este ISM como el ISM que debe verificar el mensaje
    2. handle() usa este ISM como parte del salt del ICA deployment

    Un atacante puede:
    1. Llamar callRemoteWithOverrides con _ism = ISM malicioso en destino
    2. En destino, route() retorna el ISM malicioso
    3. El mailbox usa el ISM malicioso para verificar - que siempre retorna true
    4. handle() crea un ICA con el ISM malicioso en el salt
    5. El atacante controla este ICA y puede ejecutar calls arbitrarias desde el

    La pregunta clave: el ICA creado con ISM malicioso es DIFERENTE al ICA con ISM
    legitimo (salt diferente). Asi que no puede robar fondos de ICAs existentes.
    Pero puede ejecutar calls arbitrarias desde una nueva ICA (que tiene address nueva).

    Si terceros envian tokens a la ICA del atacante pensando que es del usuario
    legitimo (e.g. via getRemoteInterchainAccount), hay confusion.
  impact: "Un atacante puede crear ICAs controladas con ISM arbitrario. No roba de ICAs existentes pero puede ejecutar calls arbitrarias desde nuevas ICAs."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // The ISM used in callRemoteWithOverrides should ideally be validated
    // or at minimum, users should be aware that different ISMs create different ICAs

    // Property: two calls with different ISMs must produce different ICAs
    address ica1 = address(router.getLocalInterchainAccount(origin, owner, remoteRouter, ism1));
    address ica2 = address(router.getLocalInterchainAccount(origin, owner, remoteRouter, ism2));

    if (ism1 != ism2) {
        t(ica1 != ica2, "IAR-W-11: different ISMs must produce different ICAs");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: |
    callRemoteWithOverrides es public payable sin restriccion de acceso. Cualquier
    usuario puede enviar mensajes con ISM arbitrario. El ISM en el mensaje controla
    que ISM se usa en destino para verificar el mensaje (via route()).

    Combinado con IAR-W-04, esto es la base del ataque de ISM bypass.
  poc_sketch: ''
