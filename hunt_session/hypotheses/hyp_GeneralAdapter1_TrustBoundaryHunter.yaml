# ═══════════════════════════════════════════════════════════════
# ANÁLISIS DE TRUST BOUNDARIES — GeneralAdapter1
# ═══════════════════════════════════════════════════════════════
#
# RESUMEN EJECUTIVO:
#
# El adapter es un contrato sin estado persistente que actúa como intermediario
# entre el usuario (initiator) y Morpho/ERC4626 vaults. Las funciones siguen
# el patrón: recibir tokens → aprobar → llamar protocolo → revocar aprobación.
#
# HALLAZGOS CLAVE:
#
# 1. FEE-ON-TRANSFER: erc20TransferFrom y permit2TransferFrom transfieren `amount`
#    pero si el token cobra fee, el receiver recibe menos. Cuando receiver=adapter
#    y luego se usa balanceOf(this) con type(uint256).max, esto se autocorrige.
#    Pero si se pasa un amount fijo a morphoSupply/erc4626Deposit después,
#    el adapter no tiene suficientes tokens → revert. No hay pérdida de fondos,
#    solo DoS. El patrón max→balanceOf mitiga esto por diseño.
#
# 2. REBASING: Si el underlying es rebasing (stETH, aToken), el balance puede
#    cambiar entre el momento del balanceOf y el momento del deposit/supply.
#    Con stETH esto es conocido (1-2 wei off), EthereumGeneralAdapter1 maneja
#    stETH→wstETH explícitamente. Para aTokens genéricos vía ERC4626, el rebase
#    positivo no causa pérdida (el adapter tiene MÁS de lo que cree).
#
# 3. ERC777: Los callbacks tokensReceived() podrían dar control al atacante
#    durante un safeTransferFrom. Pero el adapter no tiene estado mutable y
#    está protegido por onlyBundler3 + el reenterHash del Bundler3. Un atacante
#    no puede re-entrar al bundler porque no conoce el reenterHash.
#
# 4. APPROVAL TRUST ASIMÉTRICA: Morpho recibe approval permanente (nunca se
#    revoca — "Morpho is trusted"). ERC4626 vaults reciben approve max → call →
#    approve 0. Esto es CORRECTO: Morpho es immutable y audited, los vaults
#    son arbitrarios (el usuario elige cuál).
#
# 5. VAULT NO VALIDADO: erc4626Mint/Deposit/Withdraw/Redeem aceptan CUALQUIER
#    address como vault. Un usuario podría pasar un contrato malicioso como vault.
#    Pero: (a) el usuario se perjudicaría a sí mismo, (b) el adapter no tiene
#    fondos propios, (c) onlyBundler3 protege que solo el initiator puede
#    triggear esto. La excepción es: vault malicioso que NO revierte en deposit()
#    pero tampoco transfiere shares → el adapter aprueba max, revoca a 0, pero
#    entre esos dos puntos el vault podría frontrun y drenar tokens. Esto es
#    mitigado porque el approve→call→revoke es atómico dentro de una tx.
#
# 6. sendValue EN unwrapNative: Si receiver es un contrato sin receive(),
#    Address.sendValue revierte → DoS pero no pérdida de fondos. El usuario
#    controla receiver, así que es su responsabilidad.
#
# 7. morphoRepay shares==max usa onBehalf (CORREGIDO): El Solodit finding sobre
#    morphoRepay usando initiator en vez de onBehalf para borrowShares ya está
#    corregido en este código (L281 usa onBehalf). Verificado.
#
# ═══════════════════════════════════════════════════════════════

