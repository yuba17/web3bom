- id: GA-T08
  tier: 1
  type: property
  description: >
    Morpho callback reentrancy via morphoCallback: cuando Morpho llama
    onMorphoSupply/onMorphoRepay/etc., el adapter llama reenterBundler3(data)
    que ejecuta un nuevo bundle dentro del callback. El caller check es
    msg.sender == MORPHO. ¿Puede un atacante explotar esto?
    El atacante necesita que Morpho llame al adapter con data arbitraria.
    Esto solo sucede si el atacante tiene una posición en Morpho y triggerea
    un callback. Los callbacks de Morpho son: supply, supplyCollateral, repay,
    flashLoan — todos iniciados por el adapter mismo como parte de un bundle.
    El data en el callback es el data pasado por el adapter al llamar a Morpho.
  attack_scenario: >
    1. Atacante incluye en su bundle: morphoSupply(market, 100, 0, ..., onBehalf, maliciousCallbackData).
    2. Adapter llama MORPHO.supply(..., maliciousCallbackData).
    3. Morpho calls back adapter.onMorphoSupply(100, maliciousCallbackData).
    4. adapter verifica msg.sender == MORPHO ✓.
    5. adapter llama reenterBundler3(maliciousCallbackData).
    6. Bundler3.reenter() verifica reenterHash.
    7. reenterHash fue configurado en el Call que targetea al adapter con el callbackHash
       correspondiente al hash del maliciousCallbackData.
    8. Si el atacante calculó el callbackHash correctamente, reenter() ejecuta el nuevo bundle.
    PREGUNTA: ¿puede el atacante ejecutar calls dentro del callback que no debería?
    RESPUESTA: Sí, pero el atacante ES el initiator — solo puede perjudicarse a sí mismo.
    El initiator controla todo el bundle, incluyendo los callbacks. No hay escalación.
  impact: >
    No hay escalación. El initiator ya controla el bundle completo. Los callbacks
    de Morpho solo se ejecutan si el initiator los configuró en su bundle.
    reenterHash asegura que solo los callbacks pre-autorizados se ejecutan.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que morphoCallback SOLO acepta calls de MORPHO
    // Test: llamar onMorphoSupply desde un address != MORPHO → expect revert
    try adapter.onMorphoSupply(100, bytes("")) {
        t(false, "GA-T08: onMorphoSupply should only accept calls from MORPHO");
    } catch {
        t(true, "GA-T08: correctly reverted for non-MORPHO sender");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    El mecanismo de reenterHash + msg.sender check en morphoCallback es robusto.
    El atacante controla el data del callback pero también controla el bundle —
    no hay escalación de privilegios. El sistema asume correctamente que el
    initiator es el trust boundary principal.

