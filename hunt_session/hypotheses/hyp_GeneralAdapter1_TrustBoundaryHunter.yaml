- id: GA-T04
  tier: 1
  type: property
  description: >
    ERC777 reentrancy via erc20TransferFrom: si el token es ERC777, el
    safeTransferFrom en L381 triggerea tokensReceived() en el receiver.
    Si receiver es un contrato del atacante, obtiene control de ejecución.
    Pero: (a) el Bundler3 usa reenterHash para controlar reentradas,
    (b) onlyBundler3 protege todas las funciones del adapter,
    (c) el atacante necesitaría ser el initiator para construir el bundle.
    Vector real: el atacante ES el initiator y usa el callback para observar
    estado intermedio del adapter (e.g., tokens recibidos pero no aún depositados).
  attack_scenario: >
    1. Token ERC777 con hooks activados.
    2. Atacante (initiator) construye bundle: [erc20TransferFrom(erc777, attackerContract, 1000)].
    3. Durante safeTransferFrom, attackerContract.tokensReceived() se ejecuta.
    4. Dentro del callback, attackerContract intenta llamar al adapter o bundler.
    5. No puede reentrar al bundler porque reenterHash no matchea (no se configuró callbackHash).
    6. No puede llamar al adapter directamente (onlyBundler3).
    Conclusión: el reenterHash del Bundler3 protege contra reentrancy ERC777.
    Pero verificar: ¿qué pasa si el atacante CONFIGURA un callbackHash en su bundle
    que coincida con el hash del callback del ERC777?
  impact: >
    Si el reenterHash puede ser predicho/manipulado por el atacante durante un
    ERC777 callback, podría ejecutar calls arbitrarios durante estado intermedio.
    En el código actual, el callbackHash se configura POR CALL en el bundle array.
    El atacante controla el bundle, así que controla callbackHash. Pero el
    reenterHash se verifica como keccak256(sender || callbackHash), y el sender
    del reenter debe ser el contract que recibió el call original.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que durante un ERC777 callback, el atacante no puede reentrar al bundler
    // Test: bundle con erc20TransferFrom de un ERC777, receiver = attackerContract
    // attackerContract.tokensReceived() intenta bundler.reenter(maliciousBundle)
    // Debe revertir con IncorrectReenterHash
    //
    // CRITICAL CHECK: si el call que triggerea erc20TransferFrom tiene un callbackHash
    // configurado, ¿puede el atacante predecir el hash correcto?
    //
    // reenterHash = keccak256(bytes20(to) || callbackHash)
    // to = address del adapter (conocido)
    // callbackHash = hash del calldata del reenter (controlado por atacante)
    // PERO: el reenterHash se setea ANTES del call, y el atacante necesitaría
    // que to (el receiver del token) sea el que llama reenter.
    // En erc20TransferFrom, to = adapter, pero el callback es en el RECEIVER del token.
    // Si receiver != adapter, el receiver no puede matchear reenterHash porque
    // reenterHash espera bytes20(adapter), no bytes20(receiver).
    //
    // CONCLUSIÓN: Seguro. El ERC777 callback se ejecuta en el receiver del token,
    // pero reenterHash espera que el sender del reenter sea el target del call original
    // (el adapter). El receiver del token != adapter target → no puede reentrar.
    bool reentered = false;  // Set by mock ERC777 receiver
    t(!reentered, "GA-T04: ERC777 callback should not enable reentry to bundler");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    Análisis más profundo revela que el mecanismo es seguro:
    - Bundle call: Bundler3 llama adapter.erc20TransferFrom()
    - reenterHash se calcula con bytes20(adapter_address) || callbackHash
    - Dentro de erc20TransferFrom, safeTransferFrom triggerea tokensReceived() en el RECEIVER
    - El RECEIVER intenta llamar Bundler3.reenter()
    - Bundler3 verifica: keccak256(bytes20(msg.sender) || keccak256(msg.data[4:]))
    - msg.sender sería el RECEIVER, no el adapter → hash no matchea → revert
    - SALVO QUE: el atacante configure callbackHash para el call al adapter de forma
      que el hash matchee con receiver como sender. Pero callbackHash se setea en la Call
      que targeteó al adapter, y el sender del reenter sería el token receiver.
      keccak256(bytes20(receiver_address) || ...) != keccak256(bytes20(adapter_address) || ...)
    VEREDICTO: Seguro por diseño. El reenterHash bindea al target del call, no al receptor del token.

