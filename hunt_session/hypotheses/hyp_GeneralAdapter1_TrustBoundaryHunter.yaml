    ANTES de llamar vault.deposit(). Si el vault es un contrato malicioso
    que en su deposit() no consume los tokens sino que los redirige a otro
    address, los tokens se pierden. Pero esto requiere que el usuario (initiator)
    voluntariamente pase un vault malicioso, lo cual es auto-phishing.
    Invariante: después de erc4626Deposit, la allowance del adapter al vault
    DEBE ser 0 (revocada correctamente).
  attack_scenario: >
    1. Atacante crea VaultMalicioso que en deposit() hace:
       token.transferFrom(adapter, attacker, token.balanceOf(adapter))
    2. Víctima es engañada para usar el bundler con vault=VaultMalicioso.
    3. Bundle: [erc20TransferFrom(token, adapter, 1000), erc4626Deposit(VaultMalicioso, max, ...)].
    4. adapter aprueba VaultMalicioso con max, llama deposit().
    5. VaultMalicioso drena los tokens del adapter.
    Pero: esto requiere phishing social — la víctima firma un bundle con un vault
    que no reconoce. El bundler no valida vaults. Riesgo real en frontends comprometidos.
  impact: >
    Pérdida total de tokens del usuario si es engañado a usar un vault malicioso.
    El adapter no tiene fondos propios, así que solo afecta la transacción actual.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que después de erc4626Deposit, allowance es 0
    // Esto es correcto en el código actual (L91: forceApprove(underlyingToken, vault, 0))
    uint256 allowanceAfter = underlyingToken.allowance(address(adapter), vault);
    eq(allowanceAfter, 0, "GA-T02: allowance must be zero after erc4626 operation");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    El riesgo real aquí es de frontend phishing, no un bug en el contrato.
    El adapter CORRECTAMENTE revoca el approve después del call. El vector
    es que durante el call, el vault tiene allowance infinita. Pero esto es
    inherente al patrón approve→call→revoke. No reportable como bug del adapter.

