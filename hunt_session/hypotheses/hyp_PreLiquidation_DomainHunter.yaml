    preLIF ∈ [PRE_LIF_1, PRE_LIF_2] ⊆ [1, 1/LLTV]. For LTV > PRE_LLTV > 0:
    1/LTV < 1/PRE_LLTV. And preLIF <= 1/LLTV < 1/LTV. Therefore preLIF < 1/LTV → LTV improves.
    Wait, that's wrong. 1/LLTV < 1/PRE_LLTV because LLTV > PRE_LLTV. And preLIF <= 1/LLTV.
