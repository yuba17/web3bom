- id: PL-D-05
  tier: 1
  type: property
  description: >
    quotient rounding exceeds WAD: in L152, ltv = borrowed.wDivUp(collateralQuoted).
    In L148, the require checks borrowed <= collateralQuoted.wMulDown(LLTV).
    wMulDown truncates: collateralQuoted * LLTV / WAD (floor).
    wDivUp rounds up: borrowed * WAD / collateralQuoted (ceil).
    If borrowed = collateralQuoted.wMulDown(LLTV) = floor(collateralQuoted * LLTV / WAD),
    then ltv = ceil(borrowed * WAD / collateralQuoted).
    = ceil(floor(collateralQuoted * LLTV / WAD) * WAD / collateralQuoted).
    If collateralQuoted * LLTV is not divisible by WAD, then floor removes a remainder r,
    so borrowed = (collateralQuoted * LLTV - r) / WAD where 0 < r < WAD.
    ltv = ceil((collateralQuoted * LLTV - r) * WAD / (WAD * collateralQuoted))
        = ceil(LLTV - r/collateralQuoted).
    For large collateralQuoted, r/collateralQuoted ≈ 0, so ltv ≈ LLTV.
    But ceil can push it to LLTV. Can it push to LLTV + 1?
    ceil(LLTV - epsilon) = LLTV when epsilon < 1. And epsilon = r/collateralQuoted.
    Since r < WAD and collateralQuoted ≥ 1, epsilon < WAD. So ceil(LLTV - epsilon) could be
    LLTV (when epsilon > 0) or LLTV (when epsilon = 0).
    Wait: ceil is the ceiling in integer division. ltv = (x * WAD + y - 1) / y where
    x = borrowed, y = collateralQuoted. The key question: can ltv > LLTV?
    borrowed <= collateralQuoted * LLTV / WAD. ltv = ceil(borrowed * WAD / collateralQuoted).
    borrowed * WAD <= collateralQuoted * LLTV. So ltv = ceil(something <= LLTV).
    ceil(x) > x only when x is not integer. ltv = ceil(borrowed * WAD / collateralQuoted).
    borrowed * WAD / collateralQuoted <= LLTV (from require). ceil(≤ LLTV) could be LLTV + 1
    ONLY if LLTV is not an integer... but LLTV IS an integer (it's a uint256 in WAD scale).
    So ceil(x) where x <= LLTV (integer): if x < LLTV, ceil(x) <= LLTV. If x = LLTV, ceil = LLTV.
    WAIT: x = borrowed * WAD / collateralQuoted is not necessarily an integer.
    ceil(x) ≤ LLTV when x ≤ LLTV - 1 + fraction. But x can be LLTV - epsilon for tiny epsilon.
    ceil(LLTV - epsilon) = LLTV for any epsilon ∈ (0, 1). So ltv = LLTV.
    Can ltv = LLTV + 1? Only if x > LLTV, i.e., borrowed * WAD > LLTV * collateralQuoted.
    But require says borrowed <= collateralQuoted * LLTV / WAD, i.e., borrowed * WAD <= LLTV * collateralQuoted.
    Hmm, not exactly: borrowed <= floor(collateralQuoted * LLTV / WAD).
    borrowed * WAD <= floor(collateralQuoted * LLTV / WAD) * WAD.
    floor(collateralQuoted * LLTV / WAD) * WAD <= collateralQuoted * LLTV.
    So borrowed * WAD <= collateralQuoted * LLTV. Hence x = borrowed * WAD / collateralQuoted <= LLTV.
    ceil(x) = ceil(y/collateralQuoted) where y = borrowed * WAD.
    In Solidity: (y + collateralQuoted - 1) / collateralQuoted. Since y <= LLTV * collateralQuoted:
    (LLTV * collateralQuoted + collateralQuoted - 1) / collateralQuoted
    = LLTV + (collateralQuoted - 1) / collateralQuoted. For collateralQuoted ≥ 2, this < LLTV + 1.
    Integer division: = LLTV. So ltv <= LLTV always. quotient <= WAD.
    BUT: for collateralQuoted = 1 (1 wei worth of collateral):
    (LLTV * 1 + 1 - 1) / 1 = LLTV. Still LLTV.
    CONCLUSION: quotient cannot exceed WAD. The math is tight.
  attack_scenario: >
    After thorough mathematical analysis, quotient = (ltv - PRE_LLTV) / (LLTV - PRE_LLTV)
    where ltv <= LLTV (proven above). So quotient = (ltv - PRE_LLTV) / (LLTV - PRE_LLTV) <= 1.
    But wDivDown rounds DOWN, so quotient <= WAD. No overflow possible.
    The only edge case: when ltv = LLTV exactly, quotient = WAD exactly. preLIF = PRE_LIF_2.
    preLCF = PRE_LCF_2. These are the maximum configured values. Working as designed.
  impact: >
    No impact. quotient is bounded by WAD. preLIF and preLCF are bounded by constructor limits.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify quotient <= WAD after every pre-liquidation
    Market memory mkt = MORPHO.market(ID);
    Position memory pos = MORPHO.position(ID, borrower);
    uint256 price = IOracle(PRE_LIQUIDATION_ORACLE).price();
    uint256 colQuoted = uint256(pos.collateral).mulDivDown(price, ORACLE_PRICE_SCALE);
    uint256 bor = uint256(pos.borrowShares).toAssetsUp(mkt.totalBorrowAssets, mkt.totalBorrowShares);
    if (bor > colQuoted.wMulDown(PRE_LLTV) && bor <= colQuoted.wMulDown(LLTV) && colQuoted > 0) {
        uint256 ltv = bor.wDivUp(colQuoted);
        uint256 quotient = (ltv - PRE_LLTV).wDivDown(LLTV - PRE_LLTV);
        lte(quotient, WAD, "PL-D-05: quotient exceeds WAD");
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 90
  notes: >
    Mathematically proven: quotient <= WAD. The require(borrowed <= collateralQuoted.wMulDown(LLTV))
    combined with wDivUp for ltv still yields ltv <= LLTV due to Solidity integer arithmetic.
    This is a solid invariant for fuzz-testing to confirm the proof computationally.

