# ─────────────────────────────────────────────────────────────────────
# PROTOCOL MODEL
# ─────────────────────────────────────────────────────────────────────
# PreLiquidation es un contrato permisionless que wrappea Morpho Blue
# para ofrecer pre-liquidaciones parciales ANTES de que una posición
# alcance el LLTV de liquidación normal.
#
# FLUJO DE DINERO:
#   preLiquidate() → MORPHO.accrueInterest() → lee market+position →
#   calcula LTV con PRE_LIQUIDATION_ORACLE → verifica preLLTV < LTV <= LLTV →
#   calcula preLIF/preLCF lineales → calcula seizedAssets/repaidShares →
#   MORPHO.repay(shares) → [Morpho reduce borrowShares, totalBorrow*] →
#   callback onMorphoRepay → MORPHO.withdrawCollateral(seizedAssets, borrower, liquidator) →
#   [Morpho reduce collateral, health check con MARKET oracle] →
#   callback onPreLiquidate(liquidator) → ERC20.safeTransferFrom(liquidator → this)
#
# DOS ORACLES:
#   - PRE_LIQUIDATION_ORACLE: usado en preLiquidate() para calcular LTV, preLIF, seizedAssets
#   - ORACLE (market oracle): usado por Morpho en withdrawCollateral._isHealthy()
#
# PARÁMETROS CLAVE:
#   - preLLTV < LLTV: zona de pre-liquidación = [preLLTV, LLTV]
#   - preLCF = linear(preLCF1→preLCF2) según quotient = (LTV-preLLTV)/(LLTV-preLLTV)
#   - preLIF = linear(preLIF1→preLIF2) según quotient. preLIF ∈ [1, 1/LLTV]
#   - preLCF puede ser > WAD (100%) — documented in L167-168
#
# TRUST BOUNDARIES:
#   - Borrower MUST call Morpho.setAuthorization(preLiquidation, true) para opt-in
#   - Cualquiera puede deployar PreLiquidation con parámetros arbitrarios (permisionless)
#   - El constructor valida bounds matemáticos pero NO valida que el oracle sea "safe"
#
# INVARIANTE CENTRAL DEL PROTOCOLO:
#   Post pre-liquidación: la posición NO puede quedar liquidable en Morpho
#   (garantizado por withdrawCollateral → _isHealthy con MARKET oracle, L337 Morpho.sol)
# ─────────────────────────────────────────────────────────────────────

# ═══════════════════════════════════════════════════════════════════════
# SYMMETRIC INSPECTION
# ═══════════════════════════════════════════════════════════════════════
# Par: preLiquidate ↔ Morpho.liquidate
#   1. State: ambas reducen borrowShares y collateral via Morpho internals.
#      Morpho.liquidate maneja bad debt (collateral=0 → socializa, L391-401).
#      PreLiquidation NO maneja bad debt — withdrawCollateral reverts si position unhealthy.
#   2. Validaciones: Morpho.liquidate requiere !_isHealthy. PreLiquidation requiere
#      preLLTV < LTV <= LLTV (two-sided check). ASIMETRÍA: Morpho.liquidate no tiene
#      close factor limit. PreLiquidation sí (preLCF), pero puede ser > 100%.
#   3. Rounding: Morpho.liquidate L371-378 usa EXACTAMENTE las mismas fórmulas de rounding
#      que PreLiquidation L156-165. Misma dirección (Up/Down) en ambas ramas. SIMÉTRICO.
#   4. Events: Morpho.liquidate incluye badDebtAssets/Shares. PreLiquidation no. OK — no aplica.
#   5. Modifiers: NINGUNA tiene nonReentrant ni whenNotPaused. Morpho Blue es deliberadamente
#      sin reentrancy guards — usa checks-effects-interactions (CEI).
#
# Par: seizedAssets-branch ↔ repaidShares-branch (dentro de preLiquidate)
#   seizedAssets > 0 (L156-161):
#     seizedAssetsQuoted = seizedAssets.mulDivUp(price, SCALE) → rounds UP (against liquidator)
#     repaidShares = seizedAssetsQuoted.wDivUp(preLIF).toSharesUp(...) → rounds UP (against liquidator)
#   repaidShares > 0 (L162-165):
#     seizedAssets = repaidShares.toAssetsDown(...).wMulDown(preLIF).mulDivDown(SCALE, price) → all DOWN (against liquidator)
#   BOTH branches round AGAINST the liquidator. Consistent and safe for borrower.
# ═══════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════
# CONSTRAINT INFERENCE (0xRajeev)
# ═══════════════════════════════════════════════════════════════════════
# 1. Morpho.repay: no close factor check. PreLiquidation: has preLCF check (L172).
#    → preLCF is the ONLY constraint on how much can be repaid. If bypassed via iteration, no other guard.
# 2. Morpho.withdrawCollateral: requires _isSenderAuthorized(onBehalf) (L331).
#    PreLiquidation calls this with onBehalf=borrower. Borrower must have authorized PreLiquidation.
#    → authorization is the trust gate. No per-call approval, it's blanket.
# 3. Morpho._isHealthy uses MARKET oracle (L517,533). PreLiquidation uses PRE_LIQUIDATION_ORACLE.
#    → TWO different price feeds for eligibility vs safety. This is the primary attack surface.
# 4. preLIF2 <= WAD.wDivDown(LLTV) ensures post-pre-liq position is healthy IF same oracle used.
#    With different oracles, this guarantee does NOT hold.
# ═══════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════
# TRAZA HACIA ATRÁS (samczsun)
# ═══════════════════════════════════════════════════════════════════════
# Exit point 1: MORPHO.withdrawCollateral(seizedAssets, borrower, liquidator) — L190
#   ← called from onMorphoRepay ← called from MORPHO.repay ← called from preLiquidate
#   Conditions: borrower authorized PreLiquidation, position in pre-liq zone per PRE_LIQUIDATION_ORACLE,
#   seizedAssets calculated from preLIF * repaidValue, health check passes with MARKET oracle.
#   Manipulation: can PRE_LIQUIDATION_ORACLE be manipulated? Can preLIF be inflated?
#   Can seizedAssets exceed what's "fair"?
#
# Exit point 2: ERC20.safeTransferFrom(liquidator, this, repaidAssets) — L196
#   This pulls loan tokens FROM the liquidator. If liquidator doesn't have them, reverts.
#   No manipulation possible here — it's the liquidator paying.
#
# Exit point 3: IPreLiquidationCallback(liquidator).onPreLiquidate — L193-195
#   Called AFTER withdrawCollateral, BEFORE safeTransferFrom. The liquidator gets collateral
#   first, then must provide loan tokens. In this callback, the liquidator has the collateral
#   and hasn't paid yet → can re-enter preLiquidate.
# ═══════════════════════════════════════════════════════════════════════

invariants:

- id: PL-D-01
  tier: 1
  type: property
  description: >
    Iterative pre-liquidation via callback reentrancy: preLIF >= 1.0 (constructor enforced)
    means each pre-liquidation removes MORE collateral value than debt value. Therefore,
    after a pre-liquidation, the borrower's LTV INCREASES (gets worse). If the LTV remains
    above PRE_LLTV, the position is STILL pre-liquidatable. A liquidator contract can use
    the onPreLiquidate callback (L193-195) to re-enter preLiquidate() for the same borrower.
    Morpho Blue has NO reentrancy guard (deliberate CEI design). The state IS correctly updated
    (Morpho.repay updates borrowShares before callback, withdrawCollateral updates collateral
    before callback), so each re-entrant call sees correct state. The bug is NOT a classic
    reentrancy with stale state — it's that the CLOSE FACTOR (preLCF) protection is per-call,
    not per-tx, and iteration bypasses the intended limit on how much collateral is seized at once.
    Each successive call has higher LTV → higher quotient → higher preLCF AND higher preLIF,
    creating an escalating feedback loop that extracts more collateral per iteration.
  attack_scenario: >
    Setup: LLTV=0.80e18, PRE_LLTV=0.75e18, PRE_LCF1=0.3e18, PRE_LCF2=1.0e18,
    PRE_LIF1=1.01e18, PRE_LIF2=1.25e18 (max=1/0.80=1.25).
    Borrower: 1000 USDC collateral value, 760 USDC debt (LTV=0.76).

    Iteration 1: quotient=(0.76-0.75)/0.05=0.20, preLCF=0.44, preLIF=1.058
      Repay: 0.44*760=334.4 debt. Seize: 334.4*1.058=353.8 collateral value.
      New: debt=425.6, collateral=646.2, LTV=0.6587 → BELOW PRE_LLTV. STOPS.

    BUT with LTV closer to LLTV:
    Borrower: LTV=0.79. quotient=0.80, preLCF=0.86, preLIF=1.202
      Repay: 0.86*790=679.4. Seize: 679.4*1.202=816.6 collateral value.
      New: debt=110.6, collateral=183.4, LTV=0.603 → BELOW PRE_LLTV. STOPS.

    In this case a SINGLE call already seizes 81.7% of collateral because preLCF=0.86.
    The preLCF close factor ALREADY allows huge seizure near LLTV. The iteration adds
    marginal damage only when LTV is in the lower part of the pre-liq zone.

    REVISED ANALYSIS: With preLIF2=1/LLTV, the math guarantees that after a pre-liq
    near LLTV, the position typically drops below PRE_LLTV (LTV improves significantly
    because the large debt reduction outweighs the over-seizure at high preLIF).
    Iteration is only possible with moderate LTV where preLIF is small enough that
    LTV increases slightly. Let me verify with LTV=0.76, preLIF=1.058:
      New LTV = (760-334.4)/(1000-353.8) = 425.6/646.2 = 0.659 < PRE_LLTV=0.75. STOPS.

    Wait — 0.659 < 0.75, so it STOPS. Let me try with tighter params:
    PRE_LLTV=0.70, LLTV=0.80, PRE_LIF1=1.0e18, PRE_LIF2=1.25e18.
    LTV=0.71, quotient=0.10, preLCF=0.10*0.7+0.3=0.37, preLIF=1.0+0.10*0.25=1.025.
      Repay: 0.37*710=262.7. Seize: 262.7*1.025=269.3 value.
      New debt: 447.3, new collat: 730.7, new LTV: 447.3/730.7=0.6122 < PRE_LLTV=0.70. STOPS.

    The math analysis shows that for reasonable parameters, pre-liquidation ALWAYS brings
    the LTV well below PRE_LLTV in a single call. Iteration is NOT productive because
    the debt reduction is substantial. The preLIF over-seizure is bounded by 1/LLTV which
    ensures post-pre-liq health improvement. This looks like it's BY DESIGN and not exploitable.

    HOWEVER: with PRE_LCF1 very small (e.g., 0.01e18) and PRE_LIF very close to LTV,
    the small amount repaid with tiny over-seizure might keep LTV above PRE_LLTV.
    With 1% close factor and 1.01x LIF: repay 1% of debt, seize 1.01% of debt in collateral.
    The 0.01% extra seizure vs 1% debt reduction → LTV decreases by ~0.99%. If original
    LTV was 0.751 (barely above PRE_LLTV=0.75), after 1 iteration LTV ≈ 0.751 - 0.0074 = 0.7436.
    STILL below PRE_LLTV. Even 1% close factor brings LTV below threshold.

    CONCLUSION: Iterative pre-liquidation is NOT viable because even minimal debt repayment
    improves LTV more than the preLIF over-seizure worsens it. This is because:
      LTV_new = (D - repaid) / (C - seized) = (D - repaid) / (C - repaid*preLIF)
    For LTV_new > LTV_old = D/C: need (D-repaid)/(C-repaid*preLIF) > D/C
    → C*(D-repaid) > D*(C-repaid*preLIF) → CD - C*repaid > DC - D*repaid*preLIF
    → D*repaid*preLIF > C*repaid → D*preLIF > C → preLIF > C/D = 1/LTV.
    So LTV worsens IFF preLIF > 1/LTV. Since LTV > PRE_LLTV and preLIF <= 1/LLTV < 1/PRE_LLTV < 1/LTV,
    we have preLIF < 1/LTV always in the pre-liq zone. Therefore LTV ALWAYS IMPROVES.
    The iteration hypothesis is MATHEMATICALLY IMPOSSIBLE given the constructor constraints.
  impact: >
