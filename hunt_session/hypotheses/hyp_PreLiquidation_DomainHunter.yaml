- id: PL-D-02
  tier: 1
  type: property
  description: >
    Dual-oracle divergence exploitation: PRE_LIQUIDATION_ORACLE determines eligibility
    (is position pre-liquidatable?) and seized collateral amount. MARKET oracle (ORACLE)
    determines post-withdrawal health check in Morpho. If PRE_LIQUIDATION_ORACLE reports
    collateral price LOWER than MARKET oracle, then:
    (a) Position appears to have HIGHER LTV per PRE_LIQUIDATION_ORACLE → eligible for pre-liq
    (b) preLIF is higher (higher quotient) → more collateral seized per unit of debt
    (c) seizedAssets is larger (lower price → more tokens needed to match value)
    (d) Morpho health check uses MARKET oracle (higher price) → position still healthy → passes
    Result: liquidator receives more collateral than warranted by market conditions.
    HOWEVER: the borrower opt-in means the borrower accepted this oracle. The question is
    whether the design allows for unfair value extraction even within "legitimate" oracle divergence.
  attack_scenario: >
    Scenario 1 — Malicious oracle:
    1. Attacker deploys PreLiquidation with preLiquidationOracle = AttackerOracle.
    2. AttackerOracle.price() initially returns same as market oracle.
    3. Victim borrower authorizes this PreLiquidation (tricked via UI or social engineering).
    4. Attacker sets AttackerOracle to return price 20% lower.
    5. Victim's position now appears pre-liquidatable with high quotient.
    6. Attacker calls preLiquidate, seizes extra collateral.
    7. Morpho health check with real oracle: position still healthy (reduced debt helps).

    Scenario 2 — Legitimate oracle lag:
    1. PreLiquidation uses Chainlink (1h heartbeat). Market uses Uniswap TWAP (5min).
    2. Collateral drops 10% suddenly. TWAP reflects it in 5min. Chainlink in 1h.
    3. During the lag, PRE_LIQUIDATION_ORACLE (Chainlink) shows higher price,
       MARKET oracle (TWAP) shows lower price. OPPOSITE direction.
    4. In this case, PreLiquidation thinks LTV is LOWER → less aggressive pre-liq → BORROWER IS PROTECTED.
    5. But if inverted (TWAP as preLiqOracle, Chainlink as market): pre-liq oracle shows
       lower price → higher LTV → more aggressive seizure → market oracle says healthy.
  impact: >
    Scenario 1: total loss of collateral excess = debt * (preLIF_diverged - preLIF_fair).
    With 20% price divergence and preLIF max 1.25, excess could be ~5-15% of seized value.
    Scenario 2: depends on volatility and heartbeat differences. Typically 1-5% for major assets.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Compare seized collateral value (at MARKET oracle price) vs repaid debt value.
    // The ratio should not exceed preLIF + rounding tolerance.
    uint256 marketPrice = IOracle(ORACLE).price();
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    // If prices diverge, the effective seizure ratio differs from intended preLIF
    if (ghost_seized > 0 && ghost_repaid > 0) {
        uint256 seizedValueMarket = ghost_seized.mulDivDown(marketPrice, ORACLE_PRICE_SCALE);
        // Effective LIF at market price should not exceed PRE_LIF_2
        uint256 effectiveLIF = seizedValueMarket.wDivUp(ghost_repaid);
        lte(effectiveLIF, PRE_LIF_2 + 1e15, "PL-D-02: effective LIF exceeds PRE_LIF_2 due to oracle divergence");
    }
  ghost_vars:
    - uint256 internal ghost_seized;
    - uint256 internal ghost_repaid;
  validated: false
  priority: high
  confidence: 65
  notes: >
    The core question for reportability: is oracle divergence between PRE_LIQUIDATION_ORACLE
    and MARKET oracle a known/accepted risk that borrowers take on when they authorize a
    PreLiquidation? If yes → informational. If the protocol should enforce same oracle → Medium.
    Need to check documentation/README for stated assumptions about oracle consistency.
    The constructor does NOT require preLiquidationOracle == marketParams.oracle.
    The factory (if any) might enforce it — check PreLiquidationFactory.

- id: PL-D-03
  tier: 1
  type: property
  description: >
    Dust positions cannot be pre-liquidated: when a position has very small borrowShares
    or very small collateral, the rounding in seizedAssets/repaidShares calculations can
    produce 0 for one of the values. Specifically:
    - repaidShares=1: toAssetsDown(1, totalBorrowAssets, totalBorrowShares) can be 0 when
      totalBorrowShares >> totalBorrowAssets + VIRTUAL_ASSETS (with virtual shares 1e6).
      If toAssetsDown returns 0, then wMulDown(0, preLIF)=0, mulDivDown(0,...)=0 → seizedAssets=0.
      MORPHO.withdrawCollateral(0,...) reverts with ZERO_ASSETS (L328 Morpho.sol).
    - seizedAssets=1: mulDivUp(1, price, ORACLE_PRICE_SCALE) can be 0 when
      price < ORACLE_PRICE_SCALE. But ORACLE_PRICE_SCALE = 1e36, and typical prices are ~1e36,
      so mulDivUp(1, 1e36, 1e36) = 1. Then wDivUp(1, preLIF) where preLIF ≈ 1e18: = ceil(1e18/1e18) = 1.
      toSharesUp(1, totalBorrowAssets, totalBorrowShares) = ceil(1*(totalShares+1e6)/(totalAssets+1)) ≥ 1.
      So seizedAssets=1 works. repaidShares ≥ 1. MORPHO.repay(0, repaidShares≥1,...) works.
    Main risk: repaidShares=1 branch where seizedAssets rounds to 0.
    This means dust positions with very small debt are impossible to pre-liquidate,
    potentially accumulating bad micro-debt if borrower abandons position.
  attack_scenario: >
    1. Borrower creates position with 1 wei of collateral and 1 borrowShare.
    2. Interest accrues, LTV crosses PRE_LLTV.
    3. Liquidator tries preLiquidate(borrower, 0, 1, "") → repaidShares=1.
    4. toAssetsDown(1, totalBorrowAssets, totalBorrowShares) → depends on share price.
       With virtualShares=1e6 and virtualAssets=1: = 1*(totalBorrowAssets+1)/(totalBorrowShares+1e6).
       If totalBorrowAssets=1e18 and totalBorrowShares=1e24: = 1e18/1e24 ≈ 0. seizedAssets=0.
       BUT: totalBorrowShares is in shares with virtual offset. In Morpho Blue, first borrow of
       1e18 assets gets ~1e24 shares (1e18 * (0+1e6) / (0+1) = 1e24). So ratio is 1:1e6.
       toAssetsDown(1, 1e18, 1e24) = 1*(1e18+1)/(1e24+1e6) ≈ 0. seizedAssets=0. REVERTS.
    5. Even with seizedAssets=1: works (as analyzed above). But withdrawCollateral(1,...) is 1 wei.
       If 1 wei of collateral doesn't bring position healthy, revert. So: need to analyze if
       repaying 1 share while seizing 1 wei actually improves health.
    6. Dust position stuck: not pre-liquidatable, not worth normal liquidation gas.
  impact: >
    Micro bad debt accumulation. Each dust position is trivial (<$0.01), but if protocol
    allows permisionless position creation, thousands of dust positions could be created
    as griefing to accumulate bad debt that gets socialized to lenders. However, gas cost
    of creating each position likely exceeds the bad debt created.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that any pre-liquidatable position can actually be pre-liquidated
    // with some nonzero seizedAssets and repaidShares
    Position memory pos = MORPHO.position(ID, borrower);
    Market memory mkt = MORPHO.market(ID);
    if (pos.borrowShares > 0 && pos.collateral > 0) {
        uint256 price = IOracle(PRE_LIQUIDATION_ORACLE).price();
        uint256 colQuoted = uint256(pos.collateral).mulDivDown(price, ORACLE_PRICE_SCALE);
        uint256 bor = uint256(pos.borrowShares).toAssetsUp(mkt.totalBorrowAssets, mkt.totalBorrowShares);
        bool inPreLiqZone = bor > colQuoted.wMulDown(PRE_LLTV) && bor <= colQuoted.wMulDown(LLTV);
        if (inPreLiqZone) {
            // Try pre-liquidating with seizedAssets=1 (more likely to work than repaidShares=1)
            try preLiquidation.preLiquidate(borrower, 1, 0, "") returns (uint256 s, uint256 r) {
                gt(s, 0, "PL-D-03: seized 0 on dust pre-liq");
                gt(r, 0, "PL-D-03: repaid 0 on dust pre-liq");
            } catch {
                // If it reverts, check if it's because of health check failure vs zero amounts
                t(false, "PL-D-03: dust position in pre-liq zone cannot be pre-liquidated");
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The main question is whether Morpho Blue allows creation of dust positions at all.
    In Morpho Blue, borrow() requires assets > 0 OR shares > 0, but no minimum amount.
    supplyCollateral requires assets > 0 but no minimum. So yes, dust positions are possible.
    The practical risk is low because gas cost of creating positions far exceeds micro bad debt.
    But on L2s (Base, Arbitrum) with low gas, this could be more viable.

- id: PL-D-04
  tier: 1
  type: property
  description: >
    Interest accrual timing — triple accrueInterest in single tx: PreLiquidation calls
    MORPHO.accrueInterest(marketParams()) at L138. Then MORPHO.repay() internally calls
    _accrueInterest at L281. Then MORPHO.withdrawCollateral() internally calls _accrueInterest
    at L333. The second and third calls are no-ops because lastUpdate was already set to
    block.timestamp by the first call. This is correct behavior.
    HOWEVER: what if a third party calls MORPHO.accrueInterest BETWEEN the PreLiquidation
    call reading market state (L140-141) and the MORPHO.repay call (L175)? This is impossible
    within a single tx (atomic). But what about the CALLBACK at L193-195?
    During onPreLiquidate callback, the liquidator has received collateral but not yet paid
    loan tokens. At this point Morpho.repay has ALREADY executed (state updated). The callback
    cannot affect the current pre-liquidation's calculations. BUT: if the liquidator calls
    some OTHER Morpho function (e.g., supply, borrow) during the callback, it could modify
    totalBorrowAssets/totalBorrowShares. This doesn't affect the current pre-liquidation
    (calculations already done), but could affect a SUBSEQUENT pre-liquidation in the same tx
    (if re-entering preLiquidate). The subsequent call would read the modified state.
    KEY INSIGHT: the accrueInterest at L138 of the re-entrant call would be a no-op
    (same block), so the state read would reflect changes made by the liquidator's callback.
    This could be used to manipulate totalBorrowAssets/totalBorrowShares to get favorable
    share conversion rates on the re-entrant pre-liquidation.
  attack_scenario: >
    1. Liquidator calls preLiquidate(borrower, ..., callbackData).
    2. Morpho.repay reduces totalBorrowAssets and totalBorrowShares.
    3. In onMorphoRepay, withdrawCollateral sends collateral to liquidator.
    4. In onPreLiquidate callback, liquidator:
       a. Calls MORPHO.supply() to inject a large amount of loan tokens → increases totalSupplyAssets
          (but doesn't change totalBorrowAssets/totalBorrowShares directly).
       b. Actually: supply/withdraw don't change totalBorrow. Only borrow/repay do.
       c. Liquidator calls MORPHO.borrow() to increase totalBorrowAssets/totalBorrowShares.
          This changes the share price for the re-entrant preLiquidate.
