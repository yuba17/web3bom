- id: PL-FL-01
  tier: 1
  type: property
  description: >
    Reentrancy via onPreLiquidate callback: liquidator re-enters preLiquidate()
    during the callback to extract additional collateral before paying loan tokens.
    The callback fires at L215 AFTER withdrawCollateral sends collateral to liquidator
    but BEFORE safeTransferFrom pulls loan tokens at L218. Inside Morpho.repay(),
    state (borrowShares, totalBorrow) is already updated before the callback,
    so a re-entrant call to preLiquidate() would see the NEW (reduced) position state.
    If the borrower still has remaining debt above PRE_LLTV after partial repayment,
    the re-entrant call succeeds — computing new LTV, new preLIF, new preLCF on the
    already-reduced position. Each nested call does withdrawCollateral before
    safeTransferFrom. The liquidator receives collateral from ALL nested calls,
    then only the innermost safeTransferFrom pulls tokens first (LIFO unwind).
    However, each Morpho.repay() independently calls safeTransferFrom at the end,
    so the liquidator must ultimately pay for ALL repayments. The re-entrancy does
    NOT allow extracting collateral without paying — Morpho's repay() enforces
    the transfer at L295. This is likely safe by design but must be verified:
    the re-entrant calls see stale market.totalBorrowAssets/Shares from memory
    snapshots in the OUTER preLiquidate, but the INNER calls read fresh storage
    from Morpho. Net effect should be neutral but rounding across multiple
    small repayments vs one large repayment could differ.
  attack_scenario: >
    Liquidator calls preLiquidate(borrower, seizedAssets1, 0, data). During
    onPreLiquidate callback, liquidator re-enters preLiquidate(borrower,
    seizedAssets2, 0, ""). Each call seizes collateral independently.
    If rounding across N small repayments vs 1 large repayment results in
    the liquidator paying fewer loan tokens total or receiving more collateral
    total, there's profit. Attack: flash loan collateral token, set up callback
    contract, chain N pre-liquidations in one tx.
  impact: >
    If rounding favors the attacker across split repayments, profit per
    pre-liquidation is small (dust-level per call) but can be amplified
    with many re-entrant calls. Likely Low/Info severity.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Compare: N small pre-liquidations vs 1 large pre-liquidation
    // Track total collateral seized and total loan tokens paid
    // ghost_totalSeizedSplit vs ghost_totalSeizedSingle
    // ghost_totalRepaidSplit vs ghost_totalRepaidSingle
    // The split path should not give more collateral for less repayment
    int256 seizedDiff = int256(ghost_totalSeizedSplit) - int256(ghost_totalSeizedSingle);
    int256 repaidDiff = int256(ghost_totalRepaidSplit) - int256(ghost_totalRepaidSingle);
    // If split gives MORE collateral AND LESS repaid, that's a bug
    t(!(seizedDiff > 1e6 && repaidDiff < -1e6), "PL-FL-01: split pre-liq extracts value vs single");
  ghost_vars:
  - uint256 internal ghost_totalSeizedSplit;
  - uint256 internal ghost_totalSeizedSingle;
  - uint256 internal ghost_totalRepaidSplit;
  - uint256 internal ghost_totalRepaidSingle;
  validated: false
  priority: medium
  confidence: 35
  notes: >
    After deep analysis, this is likely NOT exploitable. Morpho.repay() does
    state update BEFORE callback (CEI pattern at Morpho level), and each
    repay() independently enforces safeTransferFrom. The re-entrant call
    reads FRESH Morpho storage, so the position is correctly reduced.
    The only vector would be rounding differences between N small vs 1 large
    repayment. Mark as tier 1 to verify with fuzzing but low confidence.
  poc_sketch: ''
  call_stack: >
    preLiquidate() -> MORPHO.repay() -> [Morpho updates state] ->
    onMorphoRepay() -> MORPHO.withdrawCollateral() -> onPreLiquidate(liquidator)
    -> [REENTRY] preLiquidate() -> MORPHO.repay() -> ... -> safeTransferFrom
    -> [UNWIND] safeTransferFrom (outer)

- id: PL-FL-02
  tier: 1
  type: property
  description: >
    Callback-based state manipulation: The onPreLiquidate callback (L214-216)
    gives the liquidator arbitrary execution before safeTransferFrom pulls
    loan tokens. During this callback, the liquidator could manipulate the
    PRE_LIQUIDATION_ORACLE price (if the oracle is manipulable, e.g., a spot
    price AMM oracle). However, this does NOT help because the oracle price
    was already read and used in the OUTER preLiquidate() call — the amounts
    are already computed. The callback happens inside onMorphoRepay which is
    inside Morpho.repay() — the repaidShares and seizedAssets are already
    fixed. So oracle manipulation during callback cannot change the current
    liquidation's terms. But if the liquidator re-enters for a SECOND
    pre-liquidation, the new call reads a fresh oracle price. Attack:
    1) Call preLiquidate with normal price. 2) During callback, manipulate
    oracle to inflate collateral value (lower LTV) — this would make the
    position NOT pre-liquidatable, blocking the attack. OR manipulate oracle
    to deflate collateral value (higher LTV) — this increases preLIF and
    preLCF, giving a better deal on the second pre-liquidation.
  attack_scenario: >
    1. Liquidator flash-borrows to manipulate AMM-based oracle.
    2. Calls preLiquidate() at normal price — gets moderate preLIF.
    3. During onPreLiquidate callback, manipulates oracle DOWN (collateral
       worth less) to increase LTV toward LLTV.
    4. Re-enters preLiquidate() — now sees higher LTV, gets higher preLIF
       (more collateral per unit of debt repaid) and higher preLCF (can
       repay more debt).
    5. Unwinds oracle manipulation, repays flash loan.
    Result: Second pre-liquidation got a better incentive factor than fair.
    The borrower lost more collateral than they should have.
  impact: >
    Borrower loses excess collateral due to inflated preLIF on the
    re-entrant call. Impact depends on how much oracle can be manipulated
    and position size. Could be Medium if oracle is an AMM spot price.
    Mitigated if PRE_LIQUIDATION_ORACLE is a Chainlink feed (not manipulable
    in same tx).
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After a preLiquidate call, verify that the total collateral seized
    // relative to debt repaid matches the preLIF at the INITIAL oracle price
    // (not a manipulated one). This requires tracking oracle price at entry.
    // ghost_oraclePriceAtEntry vs current oracle price during callback
    uint256 priceNow = IOracle(PRE_LIQUIDATION_ORACLE).price();
    // If price changed during the same block, flag it
    if (ghost_oraclePriceAtEntry > 0 && ghost_sameBlock) {
        uint256 deviation = ghost_oraclePriceAtEntry > priceNow
            ? ghost_oraclePriceAtEntry - priceNow
            : priceNow - ghost_oraclePriceAtEntry;
        uint256 threshold = ghost_oraclePriceAtEntry / 100; // 1% deviation
        t(deviation <= threshold, "PL-FL-02: oracle price changed during pre-liquidation tx");
    }
  ghost_vars:
  - uint256 internal ghost_oraclePriceAtEntry;
  - bool internal ghost_sameBlock;
  validated: false
  priority: high
  confidence: 40
  notes: >
    This hypothesis is conditional on the PRE_LIQUIDATION_ORACLE being
    manipulable within a single transaction. If it's a Chainlink oracle or
    a TWAP, this is not exploitable. If it's a spot AMM price, it could be
    critical. Need to check what oracles are typically used. Morpho Blue uses
    IOracle.price() which is a single-call oracle — the implementation
    determines manipulability. The key insight is that PreLiquidation has
    its own oracle (PRE_LIQUIDATION_ORACLE) separate from the market oracle
    (ORACLE), which could be a weaker oracle.
  poc_sketch: ''
  call_stack: >
    preLiquidate() [reads oracle price P1] -> MORPHO.repay() ->
    onMorphoRepay() -> withdrawCollateral() -> onPreLiquidate(liquidator)
    -> [liquidator manipulates oracle to P2] -> preLiquidate() [reads P2]
    -> computes higher preLIF -> seizes more collateral

- id: PL-FL-03
  tier: 1
  type: property
  description: >
    Fund routing: onMorphoRepay pulls loan tokens FROM liquidator
    (safeTransferFrom at L218) but the borrower field is decoded from
    callbackData which was encoded by preLiquidate(). The liquidator
    address is msg.sender of preLiquidate() passed through callbackData.
    Morpho.repay() calls the callback on msg.sender (which is the
    PreLiquidation contract), and PreLiquidation then calls
    safeTransferFrom(liquidator, address(this), repaidAssets). The
    liquidator must have approved PreLiquidation for the loan token.
    The collateral goes directly from Morpho to the liquidator via
    withdrawCollateral(). Key check: can the callbackData be crafted
    to mismatch the actual liquidator? No — the liquidator is set to
    msg.sender in preLiquidate() at L196, so it can't be spoofed.
    But: the borrower IS a parameter — could a malicious liquidator
    specify borrower=themselves to self-liquidate and extract the
    preLIF bonus? Self-pre-liquidation: borrower creates an unhealthy
    position, then calls preLiquidate on themselves. They repay their
    own debt and receive their own collateral * preLIF. Since preLIF >= 1,
    they get MORE collateral value than debt repaid. But the "extra"
    collateral comes from their own position — they're essentially
    converting debt to collateral at a favorable rate. Net effect:
    they lose (preLIF - 1) * repaid_value in collateral vs just
    repaying normally. Self-pre-liquidation is NOT profitable.
  attack_scenario: >
    Attacker creates position with collateral and borrows. Lets LTV
    drift above PRE_LLTV. Calls preLiquidate(self). Gets back
    collateral worth repaidAssets * preLIF. But they also pay
    repaidAssets in loan tokens. Net: they paid repaidAssets in loan,
    got repaidAssets * preLIF in collateral. Their position lost
    seizedAssets in collateral and borrowShares in debt. Since
    seizedAssets_value = repaidAssets * preLIF > repaidAssets, they
    NET LOST (preLIF - 1) * repaidAssets worth of collateral.
    Self-liquidation is always unprofitable. NOT a bug.
  impact: >
    No impact — self-pre-liquidation is unprofitable by design.
    The preLIF bonus means the liquidator extracts value from the
    borrower, not creates it. When liquidator == borrower, they pay
    the bonus to themselves from their own collateral.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify self-pre-liquidation is not profitable
    // Track attacker's net position value before and after
    // netBefore = collateral_value - borrowed_value
    // netAfter = (collateral - seized)_value - (borrowed - repaid)_value + loan_received
    // The attacker pays repaidAssets in loan token and receives seizedAssets in collateral
    // Net change: seizedAssets_value - repaidAssets = repaidAssets * (preLIF - 1)
    // But this came from their OWN collateral, so net position change is:
    // -seizedAssets_value + repaidAssets (debt reduced) + seizedAssets_value (collateral received) - repaidAssets (loan paid)
    // = 0. Self-liquidation is net zero ignoring gas.
    // Actually: position loses seizedAssets collateral and borrowShares debt.
    // Liquidator gains seizedAssets collateral and pays repaidAssets loan.
    // If same person: net = -seizedAssets(position) + seizedAssets(received) - repaidAssets(paid) + repaidAssets(debt gone)
    // = 0 exactly. No profit, no loss (ignoring gas).
    t(true, "PL-FL-03: self-pre-liquidation check — always passes, documented as not-a-bug");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Investigated and confirmed: self-pre-liquidation is NOT profitable.
    The liquidator and borrower being the same person results in zero net
    gain (ignoring gas costs, which make it unprofitable). This is a common
    pattern in liquidation protocols. Marking as validated=true because
    the analysis is complete, not because it's a bug.
  poc_sketch: ''
  call_stack: ''

- id: PL-FL-04
  tier: 1
  type: property
  description: >
    CEI violation in onMorphoRepay: The callback sequence inside
    onMorphoRepay is: (1) withdrawCollateral, (2) onPreLiquidate callback,
    (3) safeTransferFrom. Steps 1 and 2 happen BEFORE step 3. This means
    the liquidator receives collateral and gets a callback BEFORE they pay.
    This is intentional (allows flash-liquidation pattern where liquidator
    sells collateral in callback to get loan tokens to pay). But it means:
    if the loan token is an ERC-777 (tokensReceived callback) or ERC-677
    (transferAndCall), the safeTransferFrom at step 3 could trigger ANOTHER
    callback. However, safeTransferFrom uses solmate's SafeTransferLib which
    doesn't trigger ERC-777 hooks (it uses low-level call with transfer
    selector). More importantly, even if there were a callback, it would
    happen AFTER all state is settled. The real concern is the
    onPreLiquidate callback at step 2: the liquidator has full control
    and can do anything — call other Morpho functions, move tokens, etc.
    This is the classic flash-loan-like pattern. The key invariant: after
    onMorphoRepay returns to Morpho.repay(), Morpho does
    safeTransferFrom(msg.sender=PreLiquidation, ..., repaidAssets). So
    PreLiquidation MUST have repaidAssets of loan token. PreLiquidation
    gets these from safeTransferFrom(liquidator, ..., repaidAssets).
    If liquidator doesn't have tokens or hasn't approved, the whole tx reverts.
  attack_scenario: >
    A malicious liquidator implements onPreLiquidate to: (1) receive the
    collateral (already sent via withdrawCollateral), (2) attempt to avoid
    paying by having the tx revert selectively — but this is impossible
    because revert would undo collateral receipt too. (3) Use collateral
    to swap for loan tokens on a DEX to fund the payment — this is the
    INTENDED flash-liquidation use case, not a bug. The callback exists
    precisely for this purpose.
  impact: >
    No impact — the callback pattern is intentional and safe because:
    (a) Morpho has already updated state before callback, (b) revert
    in callback reverts everything atomically, (c) safeTransferFrom after
    callback enforces payment. The flash-liquidation pattern is by design.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After any preLiquidate call, verify that:
    // 1. Borrower's collateral decreased by exactly seizedAssets
    // 2. Borrower's debt decreased by exactly repaidShares
    // 3. PreLiquidation contract has zero loan token balance (pass-through)
    uint256 plBalance = ERC20(LOAN_TOKEN).balanceOf(address(preLiquidation));
    eq(plBalance, 0, "PL-FL-04: PreLiquidation should not hold loan tokens");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    The callback pattern follows Morpho's design philosophy: callback
    before payment allows flash-liquidation. This is safe because Morpho
    enforces the safeTransferFrom AFTER the callback chain completes.
    The PreLiquidation contract acts as a pass-through and should never
    hold tokens after a tx completes. Marking validated because analysis
    is complete — the pattern is safe by design.
  poc_sketch: ''
  call_stack: >
    preLiquidate() -> MORPHO.repay(callbackData) ->
      [Morpho: update borrowShares, totalBorrow] ->
      [Morpho: callback] onMorphoRepay(repaidAssets, callbackData) ->
        MORPHO.withdrawCollateral(borrower -> liquidator) ->
        onPreLiquidate(liquidator) [LIQUIDATOR HAS COLLATERAL, HASN'T PAID] ->
        safeTransferFrom(liquidator -> PreLiquidation) [LIQUIDATOR PAYS] ->
      [Morpho: safeTransferFrom(PreLiquidation -> Morpho)] [PRELIQ PAYS MORPHO]

- id: PL-FL-05
  tier: 2
  type: property
  description: >
    Authorization dependency: PreLiquidation.onMorphoRepay() calls
    MORPHO.withdrawCollateral(marketParams(), seizedAssets, borrower, liquidator).
    This call requires that the caller (PreLiquidation contract) is authorized
    by the borrower via Morpho.setAuthorization(preLiquidation, true) OR is the
    borrower themselves (which it isn't). If the borrower revokes authorization
    mid-transaction (impossible in a single tx without reentrancy from within
    Morpho's withdrawCollateral) or never granted it, the pre-liquidation reverts.
    This is by design — borrowers must opt-in. But what if the borrower front-runs
    a pre-liquidation by revoking authorization? The pre-liquidation reverts, the
    borrower avoids being pre-liquidated. They can then become liquidatable on
    Morpho proper (worse penalty). This is a grief vector against the liquidator
    (wasted gas) but economically irrational for the borrower (they'd face full
    liquidation instead). Not a real vulnerability but a flow concern.
  attack_scenario: >
    Borrower sees preLiquidate tx in mempool. Front-runs with
    MORPHO.setAuthorization(preLiquidation, false). preLiquidate reverts.
    Borrower avoids pre-liquidation but now faces full Morpho liquidation
    with higher penalty. Rational borrower would not do this.
  impact: >
    Liquidator wastes gas on reverted tx. Borrower faces worse outcome.
    No fund loss. Informational at best.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that if preLiquidate succeeds, the borrower had authorization set
    // This is implicitly enforced by Morpho's withdrawCollateral requiring auth
    // No additional invariant needed — Morpho handles this
    t(true, "PL-FL-05: authorization is enforced by Morpho.withdrawCollateral");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Authorization is enforced at the Morpho level. The borrower must
    opt-in to pre-liquidation by authorizing the PreLiquidation contract.
    Revoking auth is self-defeating (leads to full liquidation). This is
    by design and well-documented in the Morpho ecosystem. Not a bug.
  poc_sketch: ''
  call_stack: ''

- id: PL-FL-06
  tier: 1
  type: property
  description: >
    Token approval drain via infinite approval: The constructor sets
    ERC20(loanToken).safeApprove(morpho, type(uint256).max) at L133.
    This gives Morpho unlimited approval to pull loan tokens from the
    PreLiquidation contract. This is safe because Morpho only pulls
    tokens during repay() after the callback — and the callback ensures
    PreLiquidation has exactly the right amount. But: if anyone can send
    loan tokens directly to the PreLiquidation contract (e.g., by just
    calling transfer()), those tokens could be pulled by Morpho in a
    subsequent repay call. Scenario: someone accidentally sends tokens
    to PreLiquidation. Next preLiquidate() call: the callback does
    safeTransferFrom(liquidator, address(this), repaidAssets) — this
    transfers exact repaidAssets. Then Morpho does
    safeTransferFrom(PreLiquidation, Morpho, repaidAssets) — pulls
    exactly repaidAssets. The accidentally sent tokens remain stuck.
    They can't be extracted because there's no sweep function.
    Actually wait — could a liquidator exploit this? If PreLiquidation
    already has a balance of loan tokens, the liquidator could arrange
    for the callback's safeTransferFrom to transfer LESS (by only
    approving part) while the total balance covers Morpho's pull.
    But safeTransferFrom either transfers the full amount or reverts —
    there's no partial transfer. So the callback always transfers
    exactly repaidAssets from liquidator, and Morpho always transfers
    exactly repaidAssets from PreLiquidation. No drain possible.
    Tokens sent directly to PreLiquidation are permanently stuck.
  attack_scenario: >
    User accidentally transfers loan tokens to PreLiquidation contract.
    Tokens are stuck forever — no sweep function, no way to recover.
    Not a loss for the protocol, but a loss for the user. Informational.
  impact: >
    Tokens accidentally sent to PreLiquidation are permanently locked.
    No protocol fund loss. User error only.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Track PreLiquidation's loan token balance — should always be 0 after each tx
    uint256 plBalance = ERC20(LOAN_TOKEN).balanceOf(address(preLiquidation));
    eq(plBalance, 0, "PL-FL-06: PreLiquidation should not hold loan tokens");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    The infinite approval to Morpho is safe because Morpho only pulls
    exact amounts during repay. No sweep function exists, so directly
    sent tokens are stuck. This is common in protocol contracts and
    typically rated Informational/QA. Not a real vulnerability.
  poc_sketch: ''
  call_stack: ''

- id: PL-FL-07
  tier: 1
  type: property
  description: >
    Read-only reentrancy via stale market snapshot: preLiquidate() reads
    market state at L162 (Market memory market = MORPHO.market(ID)) and
    position at L163. These are MEMORY copies, not storage references.
    Then it calls MORPHO.repay() which modifies Morpho's STORAGE state
    (reduces totalBorrowAssets, totalBorrowShares, borrower's borrowShares).
    Inside onMorphoRepay(), withdrawCollateral further modifies storage
    (reduces borrower's collateral). If any external contract reads
    Morpho's state during the onPreLiquidate callback, it sees the
    UPDATED storage (post-repay, post-withdrawCollateral). This is
    actually the CORRECT behavior. However, the values used in
    preLiquidate() for computing seizedAssets and repaidShares were from
    the STALE memory snapshot. This is also correct because the amounts
    should be computed based on the state AT THE TIME of the pre-liquidation
    decision. The key question: could another protocol reading Morpho
    state during the callback see inconsistent state? During onPreLiquidate:
    - borrower.borrowShares: REDUCED (repay done)
    - borrower.collateral: REDUCED (withdrawCollateral done)
    - totalBorrowAssets/Shares: REDUCED
    - But Morpho has NOT yet received the loan tokens (safeTransferFrom pending)
    So Morpho's loan token balance is temporarily LOW — it has already
    credited the repayment in accounting but hasn't received the tokens.
    Any protocol using Morpho's totalSupplyAssets vs actual balance as
    an invariant would see a discrepancy during this window.
  attack_scenario: >
    During onPreLiquidate callback: Morpho's accounting says
    totalBorrowAssets is reduced (debt repaid) but Morpho hasn't received
    the loan tokens yet. If a lending rate oracle or vault reads Morpho's
    utilization (totalBorrow / totalSupply) during this window, it sees
    artificially low utilization. This could be exploited by a vault
    that rebalances based on utilization — but this is a vulnerability
    in the EXTERNAL protocol reading stale data, not in PreLiquidation.
    For PreLiquidation itself: the stale memory market data is used
    correctly for the initial computation, and Morpho's storage is
    updated correctly. No direct exploit on PreLiquidation.
  impact: >
    Cross-protocol read-only reentrancy. External protocols reading
    Morpho state during onPreLiquidate callback may see temporarily
    inconsistent state (debt reduced but tokens not yet transferred).
    Impact is on external protocols, not on PreLiquidation itself.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // During the pre-liquidation callback window, verify that
    // Morpho's actual loan token balance >= totalSupplyAssets - totalBorrowAssets
    // This checks for temporary accounting inconsistency
    // (This invariant would need to be checked from within a callback)
    uint256 morphoBalance = ERC20(LOAN_TOKEN).balanceOf(address(MORPHO));
    Market memory m = MORPHO.market(ID);
    uint256 expectedMin = m.totalSupplyAssets - m.totalBorrowAssets;
    gte(morphoBalance, expectedMin, "PL-FL-07: Morpho balance below expected during callback");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    This is a known pattern in callback-based DeFi. Morpho's repay()
    updates accounting before receiving tokens (standard callback pattern).
    The temporary inconsistency is a feature, not a bug — it enables
    flash-repay patterns. External protocols should not read Morpho's
    state mid-callback. However, this is worth documenting because
    cross-protocol composability bugs are a real attack surface.
    This may be out-of-scope for PreLiquidation audit specifically.
  poc_sketch: ''
  call_stack: >
    preLiquidate() -> MORPHO.repay() ->
      [Morpho storage: borrowShares--, totalBorrow--] ->
      onMorphoRepay() -> withdrawCollateral() ->
        [Morpho storage: collateral--] ->
      onPreLiquidate(liquidator) ->
        [WINDOW: Morpho accounting updated but tokens NOT transferred] ->
        [External protocol reads Morpho state — sees stale balance] ->
      safeTransferFrom(liquidator -> PreLiquidation) ->
    [Morpho: safeTransferFrom(PreLiquidation -> Morpho)] ->
    [Morpho balance restored]

flash_loan_analysis:
  function: preLiquidate
  answers:
    q1_reads_manipulable_state: true
    q1_details: >
      Reads IOracle(PRE_LIQUIDATION_ORACLE).price() at L165.
      Manipulability depends on oracle implementation.
      Also reads Morpho position/market state (not externally manipulable
      except via legitimate Morpho operations).
    q2_affects_fund_movement: true
    q2_details: >
      Oracle price determines collateralQuoted, which determines LTV,
      preLIF, preLCF, and ultimately seizedAssets and repaidShares.
      Direct impact on how much collateral is seized.
    q3_same_tx_consumable: true
    q3_details: >
      No timelock or delay. Oracle price is read and consumed atomically
      in the same transaction.
    q4_post_action_verification: false
    q4_details: >
      No FREI-PI pattern. The function computes amounts based on the
      oracle read and executes them without post-verification.
      Morpho's withdrawCollateral does check _isHealthy but uses the
      MARKET oracle (ORACLE), not PRE_LIQUIDATION_ORACLE.
    q5_reentrancy_guard: false
    q5_details: >
      No reentrancy guard on preLiquidate or onMorphoRepay.
      No reentrancy guard in Morpho.repay() either.
    q6_callback_verifies_initiator: true
    q6_details: >
      onMorphoRepay checks msg.sender == MORPHO (L208).
      The liquidator address is passed through callbackData, not derived
      from msg.sender in the callback. This is correct because Morpho
      is the expected caller.
    q7_spot_vs_twap: unknown
    q7_details: >
      Depends on PRE_LIQUIDATION_ORACLE implementation. Could be spot
      (manipulable) or TWAP (safer). The oracle is set at construction
      and is immutable. Need to check what oracle implementations are
      used in practice.
    q8_reward_by_instant_balance: false
    q8_details: >
      No reward/share calculation by balance. Amounts are computed
      from Morpho position data (borrowShares, collateral) and oracle.
    q9_atomic_threshold_crossing: true
    q9_details: >
      A flash loan can push a position from healthy to pre-liquidatable
      in one tx by manipulating oracle price (if oracle is manipulable)
      or by borrowing more on Morpho. Then the pre-liquidation happens
      in the same tx. However, borrowing more requires the borrower's
      authorization, so an attacker can't force someone else's position
      into pre-liquidation range.
    q10_self_liquidation_profitable: false
    q10_details: >
      Self-pre-liquidation is net zero (analyzed in PL-FL-03).
      The preLIF bonus is paid from own collateral. No profit.
    q11_fee_rounding_to_zero: false
    q11_details: >
      No explicit fee in pre-liquidation. The "cost" to the borrower
      is the preLIF factor (collateral seized > debt repaid in value).
      Minimum preLIF is WAD (1x), so minimum collateral seized equals
      debt repaid. No zero-fee path.
    q12_checkpoint_storage_vs_memory: memory
    q12_details: >
      Market and Position are read into memory at L162-163.
      All computations use these memory values. Morpho's storage
      is modified during the callback but the outer function's
      memory values are stale. This is correct for the initial
      computation but means re-entrant calls see fresh storage.

