  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // defaultIsm no debe cambiar sin previo aviso
    address currentIsm = address(destMailbox.defaultIsm());
    if (ghost_lastDefaultIsm != address(0) && currentIsm != ghost_lastDefaultIsm) {
      // Si cambio, registrar -- en produccion esto deberia tener timelock
      ghost_ismChangeCount += 1;
