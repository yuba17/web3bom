- id: M-D-01
  tier: 1
  type: property
  description: "El nonce del Mailbox debe ser estrictamente monotonicamente creciente -- cada dispatch incrementa nonce en exactamente 1"
  attack_scenario: "Si el nonce se repite o salta, dos mensajes distintos podrian generar el mismo message ID (colision de keccak256 del mensaje formateado), permitiendo replay de un mensaje en el destino o impidiendo delivery de mensajes legitimos. Un atacante podria explotar un overflow de uint32 nonce tras ~4.3B dispatches para colisionar IDs."
  impact: "Replay de mensajes cross-chain, perdida de fondos si el mensaje transporta value transfers"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint32 currentNonce = originMailbox.nonce();
    gte(uint256(currentNonce), uint256(ghost_lastNonce), "M-D-01: nonce decreased or overflowed");
    if (ghost_lastNonce > 0) {
      lte(uint256(currentNonce), uint256(ghost_lastNonce) + 100, "M-D-01: nonce jumped unexpectedly");
    }
    ghost_lastNonce = currentNonce;
  ghost_vars:
  - uint32 internal ghost_lastNonce;
  validated: false
  priority: medium
  confidence: 50
  notes: "uint32 nonce overflow es teoricamente posible tras 4.3B dispatches. En la practica, improbable en una sola chain, pero el invariante debe mantenerse. nonce += 1 en L301 no tiene unchecked, asi que en Solidity >=0.8 overflow revertira, bloqueando TODOS los dispatches futuros -- DoS permanente."
  poc_sketch: ''
  call_stack: ''

- id: M-D-02
  tier: 1
  type: property
  description: "Un mensaje procesado (delivered == true) NUNCA debe poder ser procesado de nuevo -- replay protection absoluta"
  attack_scenario: "Si un mensaje puede procesarse dos veces, un atacante duplica transferencias cross-chain. El check en L217 (require delivered(_id) == false) protege, pero si hay una forma de limpiar deliveries[] o si block.number == 0 causa un bypass del check delivered(), el replay es posible."
  impact: "Doble ejecucion de mensajes cross-chain, duplicacion de token mints/transfers"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que mensajes ya procesados permanecen marcados como delivered
    // Usar ghost tracking de IDs procesados
    if (ghost_processedMsgCount > 0) {
      // El ultimo mensaje procesado debe seguir marcado como delivered
      t(destMailbox.delivered(ghost_lastProcessedId), "M-D-02: previously delivered message lost delivery status");
    }
  ghost_vars:
  - uint256 internal ghost_processedMsgCount;
  - bytes32 internal ghost_lastProcessedId;
  validated: false
  priority: high
  confidence: 75
  notes: "delivered() usa blockNumber > 0 (L362). Si un mensaje se procesa en block 0 (genesis), delivered() retornaria false, permitiendo re-process. En la practica block 0 no tiene transacciones en la mayoria de chains, pero es un edge case real. El storage de deliveries[] es la unica proteccion contra replay."
  poc_sketch: ''
  call_stack: ''

- id: M-D-03
  tier: 1
  type: property
  description: "process() escribe delivery (EFFECTS) ANTES de verificar ISM (INTERACTIONS) -- CEI violation potencial que permite reentrancia a traves del ISM"
  attack_scenario: "Un ISM malicioso o comprometido podria, durante verify(), hacer un reentrant call a otra funcion del Mailbox o a un contrato que consulta delivered(). Durante la ejecucion de verify(), delivered(_id) ya retorna true aunque la verificacion no ha pasado aun. Si verify() revierte, el tx entero revierte y el estado se rollbackea. PERO: si un ISM malicioso llama a un contrato externo que toma decisiones basadas en delivered() == true, ese contrato actuaria sobre informacion prematura."
  impact: "Contratos que consultan delivered() durante la ejecucion del ISM.verify() verian un estado inconsistente -- el mensaje aparece como entregado antes de ser verificado"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: despues de process(), si delivered(id) == true, el ISM verify fue exitoso
    // No podemos testear directamente la reentrancia aqui, pero podemos verificar consistencia
    if (ghost_processedMsgCount > 0) {
      // Si delivered es true, el proceso completo debio haber terminado exitosamente
      t(destMailbox.delivered(ghost_lastProcessedId), "M-D-03: delivery state inconsistent");
      t(destMailbox.processedAt(ghost_lastProcessedId) > 0, "M-D-03: processedAt should be > 0 for delivered msg");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: "L225-228 escribe deliveries[] ANTES de L235 ism.verify(). Esto es un CEI violation deliberado (pattern comun en Hyperlane para prevenir reentrancy a process -- la re-entrancia a process() fallaria en 'already delivered'). Sin embargo, la verificacion ISM es un external call a un contrato no trusted que podria side-effectear."
  poc_sketch: ''
  call_stack: ''

- id: M-D-04
  tier: 1
  type: property
  description: "recipientIsm() puede retornar un ISM no-contrato (EOA) si el recipient retorna una direccion que pasa ism != address(0) pero no tiene codigo"
  attack_scenario: "Si recipientIsm() retorna un EOA o un contrato self-destructed, la llamada ism.verify() haria un call a un EOA. En Solidity, llamar a un EOA con call retorna success=true y data vacia. Sin embargo, ism.verify() es un high-level call que espera returndata -- en Solidity >=0.8, un high-level call a un EOA que no tiene codigo revierte si el returndata no decodifica correctamente. Esto causaria un DoS permanente: nadie podria procesar mensajes para ese recipient."
  impact: "DoS permanente en delivery de mensajes a un recipient cuyo ISM no es un contrato valido"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // recipientIsm debe retornar siempre un contrato valido o el defaultIsm
    address recipient = address(uint160(uint256(keccak256(abi.encodePacked(ghost_processedMsgCount)))));
    // Solo verificar si el recipient tiene codigo (es un contrato)
    IInterchainSecurityModule ism = destMailbox.recipientIsm(address(destMailbox));
    // El ISM retornado debe ser un contrato
    uint256 codeSize;
    assembly { codeSize := extcodesize(ism) }
    t(codeSize > 0, "M-D-04: recipientIsm returned non-contract address");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: "recipientIsm() L421-450 hace staticcall al recipient, decodifica address, verifica != address(0), pero NO verifica Address.isContract(ism). Contraste con setDefaultIsm() L370-371 que SI verifica isContract. Asimetria en validacion. Si recipient.interchainSecurityModule() retorna un EOA, process() revertira siempre en ism.verify()."
  poc_sketch: ''
  call_stack: ''

- id: M-D-05
  tier: 2
  type: property
  description: "latestDispatchedId es un valor global que puede ser front-run -- hooks que dependen de latestDispatchedId para autenticacion son vulnerables a race conditions"
  attack_scenario: "Si un hook usa latestDispatchedId para autenticar que un postDispatch proviene del Mailbox (pattern documentado en L42-43: 'used for auth in post-dispatch hooks'), un atacante puede front-run un dispatch legitimo con su propio dispatch, cambiando latestDispatchedId antes de que el hook del usuario legitimo lo lea. Sin embargo, dentro de un mismo dispatch() call, latestDispatchedId se escribe en L300 y los hooks se llaman en L311-312, asi que la lectura del hook veria el ID correcto. El riesgo es inter-transaccion, no intra-transaccion."
  impact: "Hooks que cachean o verifican latestDispatchedId entre transacciones podrian ser engannados"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    bytes32 currentId = originMailbox.latestDispatchedId();
    // latestDispatchedId debe corresponder al ultimo mensaje dispatched
    if (ghost_callRemoteCount > 0) {
      // Debe ser no-zero despues de al menos un dispatch
      t(currentId != bytes32(0), "M-D-05: latestDispatchedId is zero after dispatch");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: "latestDispatchedId es public storage que cambia con cada dispatch. Los hooks lo leen para auth. Si dos dispatches ocurren en el mismo bloque, el segundo sobreescribe el primero. El hook del primer dispatch ya ejecuto con el ID correcto (dentro de la misma tx), asi que el riesgo real es bajo para el flujo normal."
  poc_sketch: ''
  call_stack: ''

- id: M-D-06
  tier: 1
  type: property
  description: "dispatch() permite a cualquier caller pasar un hook arbitrario (address(0) se reemplaza por defaultHook, pero cualquier otro address se usa directamente) -- un hook malicioso podria robar el msg.value restante"
  attack_scenario: "Un usuario llama dispatch() con un custom hook malicioso. El hook recibe msg.value - requiredValue via postDispatch{value: ...}. El hook malicioso podria: (1) robar los fondos del caller, (2) revertir selectivamente para DoS, (3) hacer reentrancia. Sin embargo, el caller ELIGE su propio hook, asi que self-inflicted. El riesgo real es si un contrato intermediario (router, bridge) llama dispatch con un hook proporcionado por un usuario no-trusted."
  impact: "Robo de msg.value si un contrato intermediario pasa un hook no validado del usuario"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Despues de dispatch, el balance del mailbox no debe retener fondos
    // Todo el msg.value debe haberse distribuido a hooks
    uint256 mailboxBalance = address(originMailbox).balance;
    lte(mailboxBalance, ghost_mailboxBalanceBefore, "M-D-06: mailbox retained unexpected funds after dispatch");
  ghost_vars:
  - uint256 internal ghost_mailboxBalanceBefore;
  validated: false
  priority: high
  confidence: 55
  notes: "dispatch() L283 acepta cualquier IPostDispatchHook. L306 address(hook) == address(0) fallback a defaultHook. Pero cualquier otro address se usa directamente sin validacion. Los routers de Hyperlane (InterchainAccountRouter, WarpRouter) que llaman dispatch con hooks pasados por usuarios son el vector real."
  poc_sketch: ''
  call_stack: ''

