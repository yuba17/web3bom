  validated: false
  priority: medium
  confidence: 55
  notes: "setDefaultIsm/setDefaultHook/setRequiredHook son onlyOwner sin timelock. En el contexto de un bounty, owner=trusted es comun, pero el impacto de un owner comprometido en cross-chain messaging es catastrofico. Verificar si hay timelock en la deployment real."
  poc_sketch: ''
  call_stack: ''

