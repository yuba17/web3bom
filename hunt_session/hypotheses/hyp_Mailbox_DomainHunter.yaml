  attack_scenario: "El owner (o un owner comprometido) cambia defaultIsm a un ISM permisivo (que retorna true para todo). Inmediatamente, cualquier mensaje fabricado puede ser procesado sin verificacion real. Alternativamente, cambiar requiredHook a un hook que roba los fees. Esto es un governance risk, pero en protocolos cross-chain el impacto es amplificado porque afecta multiples chains."
