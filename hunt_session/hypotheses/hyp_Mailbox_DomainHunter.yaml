  attack_scenario: "Un usuario llama quoteDispatch() para obtener el fee, luego en otra tx llama dispatch(). Si entre las dos llamadas alguien mas hace un dispatch, el nonce cambio. El mensaje construido en dispatch sera diferente (distinto nonce), y el hook podria cobrar un fee distinto. El usuario paga mas o menos de lo esperado."
  impact: "Fee mismatch entre quote y dispatch real si hay dispatches intermedios"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // quoteDispatch y dispatch deben usar el mismo nonce para consistencia intra-tx
    // En la misma tx, esto es garantizado. Entre txs, el nonce puede cambiar.
    // Solo podemos verificar que quoteDispatch no modifica state
    uint32 nonceBefore = originMailbox.nonce();
    // quoteDispatch es view -- no deberia modificar nonce
    // No podemos llamar quoteDispatch sin parametros reales, asi que verificamos nonce stability
    uint32 nonceAfter = originMailbox.nonce();
    eq(uint256(nonceBefore), uint256(nonceAfter), "M-D-10: nonce changed unexpectedly between reads");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: "quoteDispatch es view, asi que no puede modificar state. Pero el mensaje que construye internamente usa el nonce actual, que sera diferente al nonce cuando se haga dispatch(). Los hooks cobran fee basado en el mensaje -- si el fee depende del nonce (improbable), habria discrepancia. En la practica, los hooks de Hyperlane no dependen del nonce para fees."
  poc_sketch: ''
  call_stack: ''

