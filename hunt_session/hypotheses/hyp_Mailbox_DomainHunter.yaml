- hunter: DomainHunter
  id: M-D-FP-02
  reason: "process() CEI violation (write delivery before verify) es intencional -- previene reentrancy a process() con el mismo messageId. Si verify revierte, el tx entero revierte y el storage se rollbackea. Esto es un pattern conocido y documentado."
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "Hyperlane process() escribe delivery ANTES de verify como proteccion anti-replay reentrancy -- no es un bug CEI clasico"
    briefing_update_applied: false

- hunter: DomainHunter
  id: M-D-FP-03
  reason: "El ISM.verify() no es view/pure -- puede tener side effects (ej. actualizar nonces de multisig, marcar checkpoints como usados). Esto es by design para ISMs que necesitan estado."
