  reason: "dispatch() es intencionalmente permissionless -- cualquier address puede enviar mensajes. Esto es by design en Hyperlane: la autenticacion ocurre en el destino via ISM, no en el origen."
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
