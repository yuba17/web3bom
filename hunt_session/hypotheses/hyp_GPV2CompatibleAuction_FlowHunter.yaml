false_positives:
- hunter: FlowHunter
  id: GPVCA-FP-01
  reason: >
    bid() flash-swap pattern (transfer asset before pulling payment) es by design.
    assetOutAmount se calcula ANTES del callback y es un valor local inmutable.
    El callback no puede manipular el precio porque el amount ya está fijado.
    La atomicidad de la tx garantiza que si el pago falla, todo revierte.
    Esto es el IAuctionCallback pattern documentado.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Flash-swap patterns donde el amount se calcula pre-callback son safe — no confundir con reentrancy real. El callback solo permite al bidder preparar los fondos, no manipular el precio."
    briefing_update_applied: false

- hunter: FlowHunter
  id: GPVCA-FP-02
  reason: >
    Approval stale (vault relayer approval > balance after bid) no es un bug.
    ERC20 transferFrom es limited by min(approval, balance). Si balance < approval,
    el transfer just caps at balance. No hay double-spend posible.
    La aprobación no se actualiza after bid() by design — sería gas-wasteful.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Stale ERC20 approvals (approval > balance) no son un bug — transferFrom caps at min(approval, balance). Solo sería bug si la approval se usara como accounting source, no como spending cap."
    briefing_update_applied: false
