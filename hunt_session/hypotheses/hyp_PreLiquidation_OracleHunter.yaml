- id: PL-O-05
  tier: 1
  type: property
  description: >
    STALE ORACLE — IOracle interface exposes ONLY price() with no metadata
    (no updatedAt, no roundId, no heartbeat). PreLiquidation has ZERO staleness
    checks. If PRE_LIQUIDATION_ORACLE becomes stale (underlying Chainlink feed
    stops updating), the stale price is used for all eligibility and incentive
    calculations. Unlike Morpho Blue (which has the same limitation for its
    market oracle), PreLiquidation's DUAL oracle architecture means staleness
    in one oracle while the other is fresh creates asymmetric mispricing.
  attack_scenario: >
    1. PRE_LIQUIDATION_ORACLE goes stale — returns price from 24h ago.
    2. Market has dropped 15% since then. Market ORACLE (fresh) reflects current price.
    3. By stale PRE_LIQ_ORACLE: position looks healthier (higher collateral value).
       Positions that SHOULD be pre-liquidatable are NOT detected.
    4. These positions deteriorate past LLTV → full Morpho liquidation.
    5. Borrowers lose the pre-liquidation benefit (softer terms, lower LIF).
    Reverse scenario: price has RISEN 15% since staleness.
    6. By stale PRE_LIQ_ORACLE: positions appear more leveraged than they are.
    7. Pre-liquidations triggered on actually-healthy positions.
    8. BUT: Morpho's withdrawCollateral health check with FRESH market oracle
       acts as safety net — if position is truly healthy, seizure might still
       pass if preLIF-adjusted seizure doesn't breach LLTV by market oracle.
    9. Bounded by: preLIF <= 1/LLTV constraint from constructor.
  impact: >
    Stale-high oracle: healthy positions incorrectly pre-liquidated (bounded by
    Morpho health check safety net). Stale-low oracle: DOS on pre-liquidation,
    borrowers face harsher full liquidation. The IOracle interface makes it
    impossible to add staleness checks at the PreLiquidation level — it must
    be handled by the oracle implementation itself.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Cannot directly check staleness with IOracle — use divergence as proxy
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    uint256 marketPrice = IOracle(ORACLE).price();
    if (marketPrice > 0 && preLiqPrice > 0) {
        uint256 divergence;
        if (preLiqPrice > marketPrice) {
            divergence = (preLiqPrice - marketPrice) * WAD / marketPrice;
        } else {
            divergence = (marketPrice - preLiqPrice) * WAD / marketPrice;
        }
        t(divergence <= 0.10e18, "PL-O-05: oracle divergence >10% — possible staleness");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 60
  notes: >
    The IOracle interface is INTENTIONALLY minimal — Morpho's philosophy is
    that oracle safety is delegated to the oracle implementation. This means
    PreLiquidation inherits ALL oracle risks of whatever is deployed as
    PRE_LIQUIDATION_ORACLE. The staleness risk is real but is the same risk
    that exists in Morpho Blue itself. Likely classified as "known limitation"
    rather than a bug. The DUAL oracle aspect makes it slightly worse because
    one can be stale while the other is fresh.

- id: PL-O-06
  tier: 2
  type: property
  description: >
    ROUNDING DIRECTION ANALYSIS — The contract uses directional rounding:
    L144: collateralQuoted = mulDivDown (rounds DOWN → less collateral value → harder to pre-liquidate but conservative)
    L152: ltv = wDivUp (rounds UP → higher LTV → more aggressive pre-liquidation → favors liquidator)
    L157: seizedAssetsQuoted = mulDivUp (rounds UP → more quoted value → more debt repaid → favors borrower)
    L159: repaidShares = wDivUp + toSharesUp (rounds UP → more shares repaid → favors borrower)
    L162-164: seizedAssets = toAssetsDown + wMulDown + mulDivDown (all round DOWN → fewer assets seized → favors borrower)
    Overall: rounding favors the BORROWER in seizure calculations, which is the
    correct direction. But at dust amounts, the rounding stack could zero out
    seizedAssets while repaidShares > 0 (liquidator pays debt, gets nothing).
  attack_scenario: >
    1. With 1 wei of repaidShares and high collateralPrice:
       repaidAssets = toAssetsDown(1, ...) → could be 0 if totalBorrowAssets < totalBorrowShares.
       seizedAssets = 0.wMulDown(preLIF).mulDivDown(SCALE, price) = 0.
    2. Liquidator repays 1 share of debt but seizes 0 collateral.
    3. Not economically exploitable (gas >> 1 share of debt), but the invariant
       that seized > 0 when repaid > 0 may not hold at dust amounts.
  impact: >
    Dust-level only. No economic exploit possible because gas cost exceeds
    any potential gain from the rounding mismatch. Informational finding.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: in repaidShares path, if repaidShares > 0 then seizedAssets should be > 0
    Market memory mkt = MORPHO.market(ID);
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    if (preLiqPrice > 0 && mkt.totalBorrowShares > 0) {
        uint256 testShares = 1;
        uint256 repaidAssets = testShares.toAssetsDown(mkt.totalBorrowAssets, mkt.totalBorrowShares);
        uint256 seized = repaidAssets.wMulDown(PRE_LIF_1).mulDivDown(ORACLE_PRICE_SCALE, preLiqPrice);
        if (repaidAssets > 0) {
            t(seized > 0, "PL-O-06: rounding zeroed out seizure for nonzero repayment");
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    Rounding directions are intentional and favor the borrower, which is correct
    for a liquidation mechanism. The dust edge case is theoretical and not
    economically exploitable.

- id: PL-O-07
  tier: 1
  type: optimize
  description: >
    OPTIMIZATION: Maximize attacker profit from oracle divergence.
    If PRE_LIQUIDATION_ORACLE and ORACLE differ, the attacker can exploit
    the price gap to extract more collateral than the debt is worth at
    real market prices. This optimize function measures the maximum
    extractable value from a single preLiquidate call.
  attack_scenario: >
    Attacker finds a PreLiquidation instance where PRE_LIQUIDATION_ORACLE
    underprices collateral vs market ORACLE. This means PreLiquidation
    computes higher LTV → higher preLIF → more collateral per unit of
    debt. The attacker calls preLiquidate, repays debt at market rate
    but receives collateral valued higher by market oracle. Profit =
    (seizedCollateral * marketPrice) - (repaidDebt).
  impact: >
    If profit is positive, there's an arbitrage between the two oracle
    prices that harms borrowers. The preLIF amplifies the extraction.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Echidna optimization: maximize profit from oracle divergence
    // Assumes attacker can trigger preLiquidate on a victim
    uint256 marketPrice = IOracle(ORACLE).price();
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    // If preLiqPrice < marketPrice: collateral undervalued by preLiq oracle
    // → higher LTV → higher preLIF → more collateral seized
    if (preLiqPrice > 0 && marketPrice > 0 && preLiqPrice < marketPrice) {
        // Seized collateral at market value vs debt repaid
        // profit_ratio = (seizedAssets * marketPrice) / (repaidAssets * ORACLE_PRICE_SCALE) - 1
        uint256 divergenceRatio = (marketPrice - preLiqPrice) * WAD / marketPrice;
        return int256(divergenceRatio); // maximize divergence = maximize profit
    }
    return int256(0);
  ghost_vars:
    - uint256 internal ghost_maxProfit;
  validated: false
  priority: high
  confidence: 65
  notes: >
    This optimization function is a proxy — real profitability depends on
    the specific preLIF/preLCF parameters, position size, and whether
    Morpho's health check blocks the withdrawal. Needs fork testing with
    real oracle divergence scenarios.

# ═══════════════════════════════════════════════════════════════════════════════
# FLASH LOAN HYPOTHESIS — preLiquidate() (L132-180)
# ═══════════════════════════════════════════════════════════════════════════════
# 1. ¿Lee estado manipulable?
#    SÍ — IOracle(PRE_LIQUIDATION_ORACLE).price() en L143.
#    Si el oracle lee de un AMM pool, el pool state es manipulable.
#
# 2. ¿Ese estado afecta movimiento de fondos?
#    SÍ — collateralPrice determina: eligibility (L148-150), LTV (L152),
#    preLIF (L154), seizedAssets/repaidShares conversion (L156-165).
#    Directly controls how much collateral the liquidator receives.
#
# 3. ¿Se puede leer y consumir en la misma tx?
#    SÍ — no hay timelock, delay, or multi-block requirement.
#    price() is read and used immediately in the same call.
#
# 4. ¿Verificación post-acción?
#    SÍ (PARCIAL) — Morpho._isHealthy in withdrawCollateral uses MARKET oracle.
#    This is a safety net but uses a DIFFERENT oracle than PreLiquidation.
#    If market oracle is not manipulated, it catches over-seizure.
#    If BOTH oracles read from same source → both manipulated → no safety net.
#
# 5. ¿Tiene reentrancy guard?
#    NO explicit guard. But state changes happen inside Morpho (which has its own
#    protection). The callback onMorphoRepay is called by Morpho during repay().
#    The onPreLiquidate callback to the liquidator (L193) happens BEFORE the
#    safeTransferFrom (L196) — this is the classic callback-before-transfer pattern.
#    BUT: PreLiquidation has no state to re-enter. It's stateless (all immutables).
#
# 6. ¿Si es callback, verifica initiator?
#    onMorphoRepay checks msg.sender == MORPHO (L186). Correct.
#    But the onPreLiquidate callback (L193) goes to msg.sender of preLiquidate —
#    this is the liquidator, who controls the callback code. This is by design.
#
# 7. ¿Usa spot price o TWAP?
#    DEPENDS on PRE_LIQUIDATION_ORACLE implementation. IOracle is abstract.
#    If spot → manipulable. If long TWAP → resistant. No way to verify at
#    PreLiquidation contract level.
#
# 8. ¿Reward/share por balance instantáneo?
#    NO — not a reward mechanism.
#
# 9. ¿Hay cap/threshold cruzable atómicamente?
#    SÍ — PRE_LLTV threshold. If oracle price drops atomically (manipulation),
#    a position can cross from healthy → pre-liquidatable in one tx.
#    The LLTV cap also matters: position must stay BELOW LLTV to be
#    pre-liquidatable (above = LiquidatablePosition revert).
#
# 10. ¿Permite self-liquidation con bonus > flash fee?
#     TECHNICALLY YES — borrower can be the liquidator (msg.sender).
#     Borrower repays own debt and receives own collateral back.
#     With preLIF > 1.0, borrower gets more collateral back than debt repaid
#     (in collateral terms). But this is circular — borrower pays debt with
#     loan tokens, receives collateral tokens. The "bonus" is paid from their
#     own collateral. Net effect: borrower deleverages at slight collateral cost.
#     Not exploitable because the borrower was already at risk.
#
# 11. ¿Fee rounding a zero?
#     Possible at dust amounts (see PL-O-06). Not economically significant.
#
# 12. ¿Checkpoint usa storage o memory?
#     Memory — all computation in preLiquidate() is in memory.
#     No persistent state in PreLiquidation (stateless contract, all immutables).
#
# VERDICT: Questions 1+2+3 = ALL YES → strong flash loan candidate.
# Primary vector: PL-O-02 (oracle manipulation via flash loan).
# Mitigation: Morpho's _isHealthy check with market oracle (question 4).
# If PRE_LIQUIDATION_ORACLE == ORACLE (same feed) → mitigation is ZERO
# because both would be manipulated together.
# If PRE_LIQUIDATION_ORACLE != ORACLE → mitigation exists but divergence
# creates its own issues (PL-O-01).
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# ORACLE DEEP CHECK — PRE_LIQUIDATION_ORACLE
# ═══════════════════════════════════════════════════════════════════════════════
# 1. updatedAt vs heartbeat?
#    NO CHECK — IOracle.price() returns only uint256. No timestamp metadata.
#    Staleness detection is impossible at PreLiquidation level.
#
# 2. answeredInRound >= roundId?
#    NOT APPLICABLE — IOracle is not Chainlink AggregatorV3Interface.
#    No round concept exposed.
#
# 3. price > 0?
#    NO EXPLICIT CHECK — but implicitly handled by L148/L150 require
#    statements that revert before any division-by-zero (see PL-O-04).
#
# 4. L2 sequencer down check?
#    NO — must be implemented in the oracle itself. PreLiquidation has
#    no awareness of L2 sequencer status.
#
# 5. minAnswer/maxAnswer clamp?
#    NO — IOracle has no bounds. If underlying Chainlink has circuit breakers,
#    it's in the oracle adapter, not in PreLiquidation.
#
# 6. Sandwichable?
#    DEPENDS ON ORACLE IMPLEMENTATION.
#    If PRE_LIQUIDATION_ORACLE is Chainlink: price updates are infrequent
#    and triggered by deviation threshold — sandwichable at update boundaries
#    but hard to predict timing.
#    If PRE_LIQUIDATION_ORACLE is AMM spot: directly sandwichable via flash loan.
#    If PRE_LIQUIDATION_ORACLE == ORACLE: sandwich affects both equally,
#    eliminating the safety net of Morpho's health check.
#
# CONCLUSION: PreLiquidation adds ZERO oracle safety. All protection is
# delegated to the oracle implementation. This is consistent with Morpho Blue
# but the DUAL oracle architecture creates a new attack surface not present
# in Morpho Blue itself: the divergence between PRE_LIQUIDATION_ORACLE and
# the market ORACLE.
# ═══════════════════════════════════════════════════════════════════════════════

false_positives:
- hunter: OracleHunter
  id: PL-O-FP-01
  reason: >
    Price=0 from PRE_LIQUIDATION_ORACLE does NOT allow attacks. The require
    statements at L148 and L150 act as implicit guards: if price=0 then
    collateralQuoted=0, and borrowed <= 0*LLTV reverts with LiquidatablePosition
    for any borrower with debt > 0. For borrowed=0: 0 > 0*PRE_LLTV fails with
    NotPreLiquidatablePosition. In the repaidShares path, division by zero
    in L164 causes automatic Solidity 0.8.x revert. All paths are safe.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: liquidation-mechanics.md
    content: >
      In Morpho PreLiquidation, oracle price=0 is implicitly protected by
      require statements before computation code. LiquidatablePosition reverts
      when collateralQuoted=0 and borrowed>0. No explicit require(price>0)
      needed — the existing checks cover this case.
    briefing_update_applied: false

- hunter: OracleHunter
  id: PL-O-FP-02
  reason: >
    Intra-transaction oracle race condition is NOT exploitable due to
    Ethereum transaction atomicity. PRE_LIQUIDATION_ORACLE.price() is read
    once at L143 and the value is used consistently throughout preLiquidate().
    There is no callback or external call that could modify the oracle between
    the price read and the Morpho operations. The onPreLiquidate callback (L193)
    happens inside onMorphoRepay, but by that point all price-dependent
    calculations are complete and encoded in callbackData.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: liquidation-mechanics.md
    content: >
      Transaction atomicity prevents intra-tx oracle price changes.
      The callback order in PreLiquidation (price read → compute → repay →
      callback → transfer) is safe because price-dependent values are
      computed before any external calls.
    briefing_update_applied: false

- hunter: OracleHunter
  id: PL-O-FP-03
  reason: >
    Malicious oracle deployed by borrower to block pre-liquidation is
    equivalent to not authorizing any PreLiquidation contract. The mechanism
    is permissionless by design — borrower authorization (Morpho.setAuthorization)
    is required for any PreLiquidation to withdraw collateral. A borrower who
    doesn't want pre-liquidation simply doesn't authorize any. Deploying a
    malicious oracle is unnecessarily complex — the same result is achieved by
    not authorizing. Per IOracle.sol L8: "It is the user's responsibility to
    select markets with safe oracles."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: liquidation-mechanics.md
    content: >
      In permissionless protocols like Morpho, "borrower deploys malicious oracle
      to block pre-liquidation" is NOT a bug — equivalent to not authorizing any
      PreLiquidation. Authorization requirement (Morpho.setAuthorization) is the
      trust boundary. Liquidators must verify PRE_LIQUIDATION_ORACLE quality.
    briefing_update_applied: false

- hunter: OracleHunter
  id: PL-O-FP-04
  reason: >
    Oracle sandwich MEV (front-running Chainlink updates to trigger
    pre-liquidation) is standard liquidation MEV behavior present in ALL
    lending protocols (Aave, Compound, Morpho Blue). The preLIF bonus
    amplifies extraction slightly but this is inherent to any liquidation
    incentive mechanism. Not a smart contract bug — it's a known property
    of on-chain oracle-dependent liquidation systems.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: liquidation-mechanics.md
    content: >
      Oracle-update sandwich on pre-liquidation is standard MEV, not a bug.
      The preLIF bonus (1x to 1/LLTV) is bounded and comparable to standard
      liquidation incentives. All oracle-dependent liquidation systems have
      this property.
    briefing_update_applied: false

