# ============================================================
# ANALYSIS SUMMARY (v2 — refined from v1)
# ============================================================
# ARQUITECTURA DUAL ORACLE:
#
#   PRE_LIQUIDATION_ORACLE (immutable, L48, L143):
#     - Determina eligibilidad de pre-liquidación (L148-L150)
#     - Calcula LTV, quotient, preLIF, preLCF
#     - Calcula seizedAssets ↔ repaidShares conversión
#     - NO tiene validación en constructor (ni address(0) ni tipo)
#
#   ORACLE (immutable, L38, L55 via marketParams()):
#     - Usado por Morpho Blue en _isHealthy() dentro de withdrawCollateral()
#     - Es el oracle del market, elegido por el market creator
#     - Actúa como SAFETY NET: si after-seizure position es unhealthy → revert
#
# FLUJO COMPLETO de preLiquidate():
#   1. collateralPrice = PRE_LIQUIDATION_ORACLE.price()     [L143]
#   2. collateralQuoted = collateral * collateralPrice / 1e36 [L144]
#   3. borrowed = borrowShares → assets                       [L145]
#   4. require borrowed <= collateralQuoted * LLTV             [L148] ← not liquidatable
#   5. require borrowed > collateralQuoted * PRE_LLTV          [L150] ← is pre-liquidatable
#   6. compute LTV, quotient, preLIF                           [L152-154]
#   7. compute seizedAssets or repaidShares                    [L156-165]
#   8. compute preLCF, check close factor                      [L169-172]
#   9. MORPHO.repay() → callback onMorphoRepay()              [L175]
#  10. onMorphoRepay: MORPHO.withdrawCollateral() ← uses ORACLE via _isHealthy [L190]
#  11. onMorphoRepay: optional callback to liquidator           [L192-194]
#  12. onMorphoRepay: safeTransferFrom liquidator → this        [L196]
#
# KEY INSIGHT: Steps 1-8 use PRE_LIQUIDATION_ORACLE.
#              Step 10 uses market ORACLE (inside Morpho Blue).
#              Divergence between these two creates the attack surface.
#
# AUTHORIZATION REQUIREMENT (CRITICAL SAFETY):
#   Morpho.withdrawCollateral requires _isSenderAuthorized(onBehalf).
#   PreLiquidation calls withdrawCollateral(borrower, liquidator).
#   Therefore, borrower MUST have called Morpho.setAuthorization(preLiqContract, true).
#   This means:
#   - Borrower explicitly trusts this specific PreLiquidation instance
#   - Malicious PreLiquidation with bad oracle = only hurts borrowers who opted in
#   - This is the primary trust boundary
# ============================================================

invariants:

- id: PL-O-01
  tier: 1
  type: property
  description: >
    DUAL ORACLE DOS — When PRE_LIQUIDATION_ORACLE returns a significantly LOWER
    price than the market ORACLE, PreLiquidation computes a higher LTV → higher
    preLIF → more collateral to seize. But when Morpho.withdrawCollateral()
    checks _isHealthy using the MARKET oracle, the remaining collateral (valued
    higher by market oracle) may still cover remaining debt. HOWEVER, in the
    OPPOSITE case: if PRE_LIQUIDATION_ORACLE reports HIGHER price than reality,
    positions that should be pre-liquidatable appear healthy → pre-liquidation
    is DOSed. The borrower sits in the danger zone without the benefit of
    soft pre-liquidation terms. Since PreLiquidation contracts are immutable
    (oracle cannot be updated), this DOS is permanent for that instance.
  attack_scenario: >
    Case A — PRE_LIQ_ORACLE price too HIGH (DOS vector):
    1. PRE_LIQUIDATION_ORACLE returns 2000e36 but real market price is 1000e36.
    2. Borrower: 1 unit collateral, 750 USD debt. PRE_LLTV = 70%, LLTV = 80%.
    3. By PRE_LIQ_ORACLE: LTV = 750/2000 = 37.5% < PRE_LLTV (70%) → NOT pre-liquidatable.
    4. By market ORACLE: LTV = 750/1000 = 75% > PRE_LLTV (70%) → SHOULD be pre-liquidatable.
    5. Pre-liquidation is blocked. Position deteriorates until full Morpho liquidation.

    Case B — PRE_LIQ_ORACLE price too LOW (revert at Morpho):
    1. PRE_LIQUIDATION_ORACLE returns 500e36 but real market price is 1000e36.
    2. By PRE_LIQ_ORACLE: LTV = 750/500 = 150% > LLTV → L148 reverts "LiquidatablePosition".
    3. Pre-liquidation blocked again, but by a different check.

    Both cases: pre-liquidation mechanism fails when oracles diverge significantly.
  impact: >
    DOS of pre-liquidation mechanism for affected PreLiquidation instances.
    No direct fund loss, but borrowers lose access to softer pre-liquidation
    terms and face full Morpho liquidation with harsher penalties.
    Immutability of PreLiquidation contracts means a new instance must be
    deployed with corrected oracle. This is documented behavior (NatSpec L125-127)
    but the permanence makes it noteworthy.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Check divergence between the two oracles
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    uint256 marketPrice = IOracle(ORACLE).price();
    if (marketPrice > 0 && preLiqPrice > 0) {
        uint256 ratio = preLiqPrice * WAD / marketPrice;
        // Flag if divergence exceeds 50% in either direction
        t(ratio <= 1.5e18, "PL-O-01: preLiqOracle overvalues collateral >50%");
        t(ratio >= 0.5e18, "PL-O-01: preLiqOracle undervalues collateral >50%");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    This is by-design (NatSpec documents it). But the PERMANENCE of the issue
    (immutable contract, no oracle update mechanism) elevates it from "known
    limitation" to "design concern". The factory has no validation on oracle
    quality. Confidence is moderate because this might be classified as
    "user responsibility" per Morpho's design philosophy.

- id: PL-O-02
  tier: 1
  type: property
  description: >
    FLASH LOAN ORACLE MANIPULATION — If PRE_LIQUIDATION_ORACLE reads from a
    manipulable source (spot AMM, low-liquidity TWAP), an attacker can:
    (a) Flash-crash the oracle price → healthy position appears pre-liquidatable.
    (b) Call preLiquidate with maximum seizedAssets (inflated preLIF from high LTV).
    (c) Morpho.withdrawCollateral health check uses MARKET oracle which is NOT
        manipulated → the position may still pass health check if the seized
        amount doesn't push it below LLTV by market oracle.
    (d) Attacker profits: receives collateral at preLIF discount vs debt repaid.
    The preLIF incentive (1x to 1/LLTV, max ~1.25x for 80% LLTV) is the
    attacker's profit margin after subtracting flash loan + manipulation costs.
  attack_scenario: >
    Prerequisites: PRE_LIQUIDATION_ORACLE is a spot price from a DEX pool.
    1. Borrower has healthy position: 1000 collateral, 600 debt, PRE_LLTV=70%.
       By real price: LTV = 60% < PRE_LLTV → not pre-liquidatable.
    2. Attacker flash-borrows collateral token, dumps on DEX.
    3. PRE_LIQUIDATION_ORACLE now reports 50% of real price.
    4. By manipulated price: collateralQuoted = 1000 * 0.5 = 500.
       LTV = 600/500 = 120% > LLTV (80%) → L148 reverts "LiquidatablePosition"!
    WAIT — this FAILS. If the manipulated price makes LTV > LLTV, L148 reverts.
    The attacker needs to manipulate to the sweet spot: PRE_LLTV < LTV < LLTV.
    5. Attacker manipulates price to ~75% of real: collateralQuoted = 750.
       LTV = 600/750 = 80% — exactly at LLTV boundary.
    6. But L148: borrowed(600) <= collateralQuoted(750)*LLTV(0.8)=600. Passes (barely).
       L150: borrowed(600) > collateralQuoted(750)*PRE_LLTV(0.7)=525. Passes.
    7. quotient = (0.8 - 0.7) / (0.8 - 0.7) = 1.0 → preLIF = PRE_LIF_2 (maximum).
    8. Attacker seizes collateral at PRE_LIF_2 discount.
    9. Morpho health check uses REAL market oracle: remaining collateral still
       covers remaining debt → tx succeeds.
    10. Attacker restores DEX price, repays flash loan, keeps profit.
    CONSTRAINT: The attacker must hit the narrow window PRE_LLTV < manipulated_LTV < LLTV.
  impact: >
    Direct theft of borrower collateral. The preLIF bonus (up to 1/LLTV = 1.25x
    for 80% LLTV) means attacker receives 25% more collateral than debt repaid.
    Bounded by: PRE_LCF (max close factor), and manipulation precision needed.
    Realistically: only exploitable if PRE_LIQUIDATION_ORACLE is a spot/short-TWAP
    oracle, which would be a deployment configuration error.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: if position is healthy by market oracle (LTV < PRE_LLTV),
    // it should not be pre-liquidatable
    uint256 marketPrice = IOracle(ORACLE).price();
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    Position memory pos = MORPHO.position(ID, borrower);
    Market memory mkt = MORPHO.market(ID);
    uint256 borrowed = uint256(pos.borrowShares).toAssetsUp(mkt.totalBorrowAssets, mkt.totalBorrowShares);
    if (marketPrice > 0 && borrowed > 0) {
        uint256 collateralByMarket = uint256(pos.collateral).mulDivDown(marketPrice, ORACLE_PRICE_SCALE);
        uint256 ltvByMarket = borrowed.wDivUp(collateralByMarket);
        uint256 collateralByPreLiq = uint256(pos.collateral).mulDivDown(preLiqPrice, ORACLE_PRICE_SCALE);
        // If healthy by market oracle, should also be healthy by pre-liq oracle
        if (ltvByMarket <= PRE_LLTV) {
            t(borrowed <= collateralByPreLiq.wMulDown(PRE_LLTV),
              "PL-O-02: healthy position pre-liquidatable via oracle divergence");
        }
    }
  ghost_vars: []
  validated: true
  priority: critical
  confidence: 55
  notes: >
    Confidence is moderate because exploitability depends entirely on what oracle
    is deployed as PRE_LIQUIDATION_ORACLE. The IOracle interface has no safety
    guarantees. The IOracle.sol NatSpec says "It is the user's responsibility
    to select markets with safe oracles" — same philosophy applies here.
    The CRITICAL nuance: the market oracle is chosen by market creator (presumably
    careful), but PRE_LIQUIDATION_ORACLE is chosen by ANYONE calling the factory.
    A borrower wouldn't authorize a bad PreLiquidation, but they might not verify
    the oracle quality of a PreLiquidation they're asked to authorize.

