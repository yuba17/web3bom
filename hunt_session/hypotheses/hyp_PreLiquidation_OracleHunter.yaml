#   depende ENTERAMENTE del tipo de oracle deployado. El contrato no tiene
#   ninguna protección contra oracles manipulables — delega al deployer.
#   REQUIERE: fork testing con oracle manipulable para confirmar/descartar.
#
# PL-O-01 (Medium impact, Medium likelihood): DOS por divergencia de oracles.
#   Cuando PRE_LIQUIDATION_ORACLE y ORACLE divergen significativamente,
#   pre-liquidación queda bloqueada (DOS). Documentado en NatSpec pero la
#   inmutabilidad del contrato hace el DOS permanente para esa instancia.
#
