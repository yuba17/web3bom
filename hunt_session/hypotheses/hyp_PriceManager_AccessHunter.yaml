invariants:

  - id: PM-A-01
    tier: 2
    type: property
    description: >
      transmit() is protected by onlyRole(PRICE_ADMIN_ROLE) but lacks a whenNotPaused modifier.
      When the contract is paused (emergencyPause), the PRICE_ADMIN_ROLE holder can still call
      transmit() and update stored prices. This means the pause mechanism does not prevent price
      updates. In BaseAuction (the inheriting contract), bid() and performUpkeep() ARE protected
      by whenNotPaused, so during pause auctions cannot start or be bid on. However, a compromised
      PRICE_ADMIN could inject stale or manipulated prices during a pause, and those prices would
      take effect immediately when the contract is unpaused. The stored s_dataStreamsPrice would
      reflect the poisoned prices. This breaks the assumption that pause = frozen state.
    attack_scenario: >
      1. Contract is paused due to a detected issue.
      2. PRICE_ADMIN_ROLE holder (compromised or malicious) calls transmit() with a manipulated
         report that passes VerifierProxy verification (legitimate Chainlink report, but chosen
         at an advantageous timestamp/price).
      3. Prices are updated in s_dataStreamsPrice during the paused state.
      4. When contract is unpaused, the first bid() or performUpkeep() uses the manipulated price
         immediately, before any fresh price can be transmitted.
      5. Bidder gets an unfavorable price, or auctions start with wrong valuations.
    impact: "Price manipulation during pause could cause incorrect auction pricing when unpaused. Bidders or the protocol could lose funds due to stale/manipulated prices."
    impact_rating: Medium
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: when contract is paused, no price state changes should occur.
      // If paused() == true, then s_dataStreamsPrice[asset].timestamp must not change.
      // This checks that transmit cannot be called while paused.
      // In a handler: call transmit() while paused and verify it reverts.
      bool isPaused = pausable.paused();
      if (isPaused) {
          // Record all asset prices before transmit attempt
          // After any transmit attempt during pause, prices must be unchanged
          // EXPECTED: transmit reverts when paused. ACTUAL: it does NOT revert.
          t(false, "PM-A-01: transmit() succeeded while paused");
      }
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 75
    notes: >
      Confirmed by code review: transmit() has onlyRole(PRICE_ADMIN_ROLE) but NO whenNotPaused.
      In BaseAuction, bid() and performUpkeep() have whenNotPaused. applyFeedInfoUpdates() also
      lacks whenNotPaused but is less critical since it requires ASSET_ADMIN_ROLE (admin-level).
      The severity depends on trust model: if PRICE_ADMIN_ROLE is a trusted Chainlink automation
      bot, the risk is lower. If it can be compromised independently, this is a real gap.
      The VerifierProxy still validates report signatures, so fully fabricated prices cannot be
      injected — but the PRICE_ADMIN can choose WHICH valid report to submit and WHEN.

  - id: PM-A-02
    tier: 2
    type: property
    description: >
      applyFeedInfoUpdates() is protected by onlyRole(ASSET_ADMIN_ROLE) but lacks whenNotPaused.
      An ASSET_ADMIN can add/remove/update feed configurations even while the contract is paused.
      This includes changing the usdDataFeed (fallback Chainlink oracle), the stalenessThreshold,
      and the dataStreamsFeedId mapping. Changing these during pause can set up conditions that
      affect pricing immediately when unpaused. Most critically: reducing stalenessThreshold
      could make a previously-valid price appear stale, or increasing it could make a stale price
      appear valid. Changing usdDataFeed to a malicious oracle contract would serve poisoned prices.
    attack_scenario: >
      1. Contract is paused.
      2. Compromised ASSET_ADMIN calls applyFeedInfoUpdates to set usdDataFeed for an asset
         to a malicious contract that returns inflated prices.
      3. Alternatively, ASSET_ADMIN sets stalenessThreshold to a very large value (e.g., 365 days)
         so that extremely old prices are considered valid.
      4. On unpause, _getAssetPrice returns the malicious/stale price.
      5. Auctions start or bids settle at wrong prices.
    impact: "Feed configuration changes during pause can set up price manipulation that activates on unpause."
    impact_rating: Medium
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: feed info cannot be modified while paused.
      bool isPaused = pausable.paused();
      if (isPaused) {
          // Any call to applyFeedInfoUpdates during pause should revert.
          // EXPECTED: reverts. ACTUAL: does NOT revert.
          t(false, "PM-A-02: applyFeedInfoUpdates() succeeded while paused");
      }
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 65
    notes: >
      Same pattern as PM-A-01 but requires ASSET_ADMIN_ROLE instead of PRICE_ADMIN_ROLE.
      The ASSET_ADMIN_ROLE is typically more privileged and fewer addresses hold it,
      so the attack surface is smaller. The BaseAuction._onFeedInfoUpdate hook does check
      for live auctions (reverts if asset has a live auction), which provides partial protection
      but only against changing feeds for assets with active auctions. During pause, no auctions
      can be live (performUpkeep is blocked by whenNotPaused), so _onFeedInfoUpdate's LiveAuction
      check never fires during pause — all feed changes are allowed.

  - id: PM-A-03
    tier: 1
    type: property
    description: >
      The constructor calls _applyFeedInfoUpdates(feedsInfo, ...) which sets up initial feed
      configurations. This bypasses the ASSET_ADMIN_ROLE check since it runs inside the constructor
      before any role setup. This is expected behavior for initialization. However, the constructor
      does NOT validate that the provided usdDataFeed addresses implement AggregatorV3Interface
      correctly. A malicious deployer could set usdDataFeed to any contract. Since the contract
      uses AccessControlDefaultAdminRules with adminRoleTransferDelay, the admin cannot be
      immediately changed, but the initial feed setup is permanently trusted.
      More importantly: the verifierProxy is set as immutable in the constructor. If a wrong or
      malicious verifierProxy is provided, ALL future transmit() calls will use it for report
      verification. Since it's immutable, it CANNOT be changed after deployment. The only
      protection is the zero-address check.
    attack_scenario: >
      1. A malicious or incorrect verifierProxy is provided during deployment.
      2. The verifierProxy either always returns success (accepting any report) or returns
         manipulated report data.
      3. PRICE_ADMIN transmits reports that are "verified" by the fake proxy.
      4. Any price can be stored in s_dataStreamsPrice.
      5. Since i_streamsVerifierProxy is immutable, the only fix is deploying a new contract.
    impact: "Immutable verifierProxy set at deployment cannot be corrected if wrong. Full price manipulation possible if verifierProxy is compromised."
    impact_rating: High
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: verifierProxy must be a legitimate Chainlink VerifierProxy contract.
      // This is only verifiable at deployment time. Post-deployment, we can check:
      // 1. verifierProxy supports the IVerifierProxy interface
      // 2. verifierProxy is a known Chainlink contract address
      address proxy = address(priceManager.getStreamsVerifierProxy());
      t(proxy != address(0), "PM-A-03: verifierProxy is zero");
      // Additional check: proxy should be a contract, not an EOA
      uint256 codeSize;
      assembly { codeSize := extcodesize(proxy) }
      t(codeSize > 0, "PM-A-03: verifierProxy is not a contract");
    ghost_vars: []
    validated: true
    priority: high
    confidence: 40
    notes: >
      This is a deployment-time trust concern, not a runtime exploit. The immutability of
      verifierProxy means there is no upgrade path if the Chainlink VerifierProxy itself is
      upgraded or deprecated. This is a design choice — immutability is safer against runtime
      manipulation but inflexible. Most bounty programs exclude deployment configuration issues.
      Marking as low confidence for reporting purposes. Worth noting if the bounty scope includes
      deployment/initialization review.

  - id: PM-A-04
    tier: 1
    type: property
    description: >
      In transmit(), the pre-verification loop (lines 156-166) decodes unverifiedReports to check
      that each feedId is allowlisted. But after verifyBulk, the post-verification loop (lines 171-198)
      decodes the VERIFIED reports and uses the feedId from the verified data. There is an implicit
      assumption that verifyBulk returns reports in the same order as the input. If a malicious or
      buggy verifierProxy returns reports in a different order or returns different reports entirely,
      the pre-check on allowlisting would be bypassed. The pre-check validates feedIds from
      unverified data, but the actual price storage uses feedIds from verified data. If these
      differ (due to verifierProxy behavior), a non-allowlisted feed could have its price stored.
      However, s_dataStreamsFeedIdToAsset[report.dataStreamsFeedId] maps to address(0) for
      non-allowlisted feeds, so the price would be stored for address(0) — which has no practical
      impact since no asset maps to address(0).
    attack_scenario: >
      1. PRICE_ADMIN submits N reports, all with allowlisted feedIds (passes pre-check).
      2. The verifierProxy (if compromised) returns N verified reports but with DIFFERENT feedIds.
      3. The post-verification loop reads the verified feedId: report.dataStreamsFeedId.
      4. s_dataStreamsFeedIdToAsset[newFeedId] returns address(0) since the new feedId is not mapped.
      5. s_dataStreamsPrice[address(0)] is set — no practical effect.
      6. BUT: s_feedInfo[address(0)] is read for stalenessThreshold and decimals. Since it's
         uninitialized, stalenessThreshold = 0, making block.timestamp - 0 = block.timestamp.
         report.observationsTimestamp < block.timestamp is always true, so it reverts with StaleFeedData.
      CONCLUSION: The attack self-destructs because stalenessThreshold=0 for address(0) makes
      the staleness check always fail. The pre-check is technically redundant but provides a
      cleaner revert message.
    impact: "Theoretical only. If verifierProxy returns mismatched feedIds, the staleness check on the zero-address feed info causes a revert, so no price corruption occurs."
    impact_rating: Low
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: after transmit(), only prices for allowlisted assets are updated.
      // For every asset a in s_allowlistedAssets:
      //   s_dataStreamsPrice[a] can change.
      // For any other address:
      //   s_dataStreamsPrice[addr] must remain unchanged.
      // Ghost tracking: snapshot all s_dataStreamsPrice for non-allowlisted addresses before transmit.
      // After transmit: verify they are unchanged.
      // This is hard to express without enumeration of all possible addresses.
      // Simplified: verify that address(0) never has a stored price.
      (uint224 zeroPrice, uint32 zeroTs) = (s_dataStreamsPrice[address(0)].usdPrice, s_dataStreamsPrice[address(0)].timestamp);
      t(zeroPrice == 0 && zeroTs == 0, "PM-A-04: price stored for address(0)");
    ghost_vars: []
    validated: true
    priority: low
    confidence: 30
    notes: >
      After deep analysis, this is NOT exploitable. The staleness check on address(0)'s feed info
      (which has stalenessThreshold=0) causes an automatic revert. The pre-check in the first loop
      is technically a gas optimization / better error message, not a security boundary. The real
      security boundary is the verifierProxy's cryptographic verification of DON signatures.
      Marking as false-positive-adjacent but keeping for completeness.

  - id: PM-A-05
    tier: 2
    type: property
    description: >
      ASSET_ADMIN_ROLE can set usdDataFeed to ANY address via applyFeedInfoUpdates. There is no
      validation that the provided usdDataFeed actually implements AggregatorV3Interface or returns
      sane values. The only checks are: (1) at least one of dataStreamsFeedId or usdDataFeed must
      be non-zero, (2) stalenessThreshold > 0. The usdDataFeed address is used in _getAssetPrice
      as a fallback when Data Streams prices are stale. If usdDataFeed is a malicious contract,
      it could return any price via latestRoundData() and any decimals via decimals(). Since
      _getAssetPrice does not validate the data feed's answer beyond zero-check and staleness,
      a malicious feed could return an extreme price (e.g., 1 wei or type(int256).max).
    attack_scenario: >
      1. Compromised ASSET_ADMIN sets usdDataFeed for assetX to a malicious contract.
      2. The malicious contract returns latestRoundData() with price = 1e30 (extreme inflation).
      3. Data Streams price for assetX goes stale (PRICE_ADMIN stops transmitting).
      4. _getAssetPrice falls back to the malicious data feed.
      5. Auctions for assetX use the inflated price, allowing bidders to receive far too many
         tokens per unit of assetOut, or making auctions fail to start because minAuctionSizeUsd
         appears already met with tiny balances.
    impact: "Malicious fallback oracle can manipulate all pricing when Data Streams are stale. Direct fund loss via mispriced auctions."
    impact_rating: High
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: usdDataFeed for any allowlisted asset must be either address(0) or
      // a contract that implements AggregatorV3Interface with reasonable values.
      // Cannot fully verify on-chain without calling the feed, but can check it's a contract.
      address[] memory assets = priceManager.getAllowlistedAssets();
      for (uint256 i = 0; i < assets.length; i++) {
          PriceManager.FeedInfo memory fi = priceManager.getFeedInfo(assets[i]);
          if (address(fi.usdDataFeed) != address(0)) {
              uint256 codeSize;
              assembly { codeSize := extcodesize(fi.usdDataFeed) }
              t(codeSize > 0, "PM-A-05: usdDataFeed is not a contract");
          }
      }
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 55
    notes: >
      This requires ASSET_ADMIN_ROLE compromise, which is a trusted role. In the Chainlink trust
      model, this role is held by a multisig or timelock. If the bounty excludes admin-level attacks,
      this is not reportable. However, the LACK of validation on usdDataFeed (no interface check,
      no sanity bounds on returned price) is a design weakness. Compare to how setFeeAggregator
      in BaseAuction DOES check supportsInterface — the same pattern is missing for usdDataFeed.

  - id: PM-A-06
    tier: 1
    type: property
    description: >
      The _onFeedInfoUpdate hook in PriceManager is an empty virtual function. The BaseAuction
      override adds a LiveAuction check. However, the hook is called BEFORE the actual state
      changes in _applyFeedInfoUpdates. For removes: _onFeedInfoUpdate is called at line 236,
      then s_allowlistedAssets.remove at line 238, then state cleanup. For adds: _onFeedInfoUpdate
      is called at line 253, then validation and state writes happen. This means the hook sees
      the OLD state, not the new state. If a future inheriting contract's _onFeedInfoUpdate
      implementation relies on the NEW feed info being already set, it would read stale data.
      In BaseAuction's override, this is fine because it only checks live auctions (independent
      of feed info state). But it's a latent composability risk for future overrides.
    attack_scenario: >
      A future contract inheriting PriceManager overrides _onFeedInfoUpdate to perform validation
      based on the new feed info (e.g., checking that the new usdDataFeed has compatible decimals
      with the Data Streams feed). Since _onFeedInfoUpdate is called before s_feedInfo[asset] is
      updated, the override reads the OLD feed info and validates the wrong data. The new
      (potentially malicious) feed info passes validation because the hook never sees it.
      This is a future/composability risk, not a current exploit.
    impact: "Latent hook ordering issue. No current exploit but could lead to validation bypass in future inheriting contracts."
    impact_rating: Low
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: _onFeedInfoUpdate hook state consistency.
      // Verify that after applyFeedInfoUpdates, the hook was called with correct parameters.
      // This is a design review item, not easily expressible as a fuzz invariant.
      // For adds: feedInfo in storage must match what was passed to applyFeedInfoUpdates.
      // For removes: feedInfo must be deleted from storage.
      // These are trivially true by construction in the current code.
      t(true, "PM-A-06: placeholder - design review item");
    ghost_vars: []
    validated: false
    priority: low
    confidence: 25
    notes: >
      This is an informational design observation. The current BaseAuction override is safe because
      it only checks s_auctionStarts (independent of feed info). The hook ordering (before state
      change) is intentional — it allows the hook to revert and prevent the state change. But it
      means the hook cannot validate the NEW state. This is a known pattern tradeoff.

  - id: PM-A-07
    tier: 2
    type: property
    description: >
      ASSET_ADMIN_ROLE can rotate a dataStreamsFeedId from one asset to another via
      applyFeedInfoUpdates. When this happens (lines 281-296), the previous asset's Data Streams
      feed info is zeroed out and its stored price is deleted. However, the previous asset remains
      in s_allowlistedAssets. If the previous asset also has no usdDataFeed configured (only
      Data Streams), the rotation would be blocked by the check at line 287-289. But if the
      previous asset HAS a usdDataFeed, the rotation proceeds silently: the previous asset loses
      its Data Streams price source and falls back exclusively to the data feed.
      The concern: if ASSET_ADMIN rotates a feedId from assetA to assetB, assetA's price
      immediately becomes data-feed-only. If assetA's data feed is slow/stale or has different
      decimals than expected, assetA's pricing degrades without any explicit action by the admin
      to acknowledge the change for assetA. The admin only intended to update assetB but
      implicitly degraded assetA.
    attack_scenario: >
      1. assetA is configured with dataStreamsFeedId=X and usdDataFeed=ChainlinkFeedA.
      2. ASSET_ADMIN calls applyFeedInfoUpdates to assign feedId=X to assetB.
      3. assetA silently loses its Data Streams source. Its price now comes from ChainlinkFeedA only.
      4. ChainlinkFeedA has a 1-hour heartbeat. For the next hour, assetA's price could be stale
         but still within stalenessThreshold.
      5. If assetA is involved in an active auction, bidders get stale prices.
      6. The admin may not realize assetA is degraded because no revert or event explicitly
         indicates "assetA lost Data Streams pricing."
    impact: "Silent pricing degradation for an asset whose feedId is rotated away. Could cause incorrect auction pricing if the fallback data feed is slow."
    impact_rating: Medium
    likelihood: Low
    severity_final: null
    solidity: |
      // Invariant: if an asset is allowlisted and has an active auction, it must have
      // at least one valid price source that is fresh (Data Streams OR Data Feed).
      address[] memory assets = priceManager.getAllowlistedAssets();
      for (uint256 i = 0; i < assets.length; i++) {
          PriceManager.FeedInfo memory fi = priceManager.getFeedInfo(assets[i]);
          // At minimum: either dataStreamsFeedId is set OR usdDataFeed is set
          bool hasDataStreams = fi.dataStreamsFeedId != bytes32(0);
          bool hasDataFeed = address(fi.usdDataFeed) != address(0);
          t(hasDataStreams || hasDataFeed, "PM-A-07: asset has no price source");
      }
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 60
    notes: >
      The code does protect against total price source loss (lines 287-289 revert if the previous
      asset would have NO source at all). But it does NOT prevent degradation from dual-source
      (Data Streams + Data Feed) to single-source (Data Feed only). This is arguably by design
      since the admin is trusted, but the silent nature of the degradation is a concern.
      The FeedInfoUpdated event is emitted for the NEW asset but NOT for the previous asset whose
      feed was silently modified. An event like FeedInfoUpdated(previousAsset, modifiedFeedInfo)
      should be emitted for observability.

false_positives:
  - hunter: AccessHunter
    id: PM-FP-01
    reason: >
      transmit() pre-check on allowlisting vs post-verification feedId mismatch: initially looked
      like a TOCTOU issue, but analysis shows that non-allowlisted feedIds in the post-verification
      loop map to address(0), and address(0)'s feedInfo has stalenessThreshold=0, which causes an
      automatic StaleFeedData revert. The verifierProxy's cryptographic verification is the real
      security boundary, not the pre-check loop.
    investigated_at: '2026-03-22T00:00:00Z'
    pending_briefing_update:
      action: add_to_trampas
      briefing: oracle.md
      content: "Pre-verification allowlist checks in transmit-style functions may appear to be TOCTOU vulnerabilities, but if the post-verification path naturally reverts for unmapped IDs (e.g., zero stalenessThreshold), the pre-check is redundant but not a security issue."
      briefing_update_applied: false

  - hunter: AccessHunter
    id: PM-FP-02
    reason: >
      Constructor bypasses ASSET_ADMIN_ROLE for initial feed setup: This is standard initialization
      pattern. The constructor runs before any roles are set up, so role-gating is impossible.
      The deployer is implicitly trusted at construction time. Not a vulnerability.
    investigated_at: '2026-03-22T00:00:00Z'
    pending_briefing_update: null

  - hunter: AccessHunter
    id: PM-FP-03
    reason: >
      emergencyWithdraw requires DEFAULT_ADMIN_ROLE + whenPaused. This is properly secured. The
