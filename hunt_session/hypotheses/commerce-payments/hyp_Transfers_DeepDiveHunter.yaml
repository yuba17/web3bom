convergences:
- theme: feeDestination no está en el hash firmado — puede cambiar entre signing y
    ejecución
  hunters:
  - AccessHunter
  - DomainHunter
  - FlowHunter
  - TrustBoundaryHunter
  - WildcardHunter
  weight: high
  summary: '5 hunters detectaron que feeDestinations[operator] se resuelve en tiempo
    de ejecución

    (L588, L674, L725-727, L734) pero NO está incluido en el hash que firma el operador.

    El operador puede cambiar su feeDestination en cualquier momento vía

    registerOperatorWithFeeDestination(). Esto redirige los fees de TODOS los intents

    pendientes a la nueva dirección. Los hunters lo tratan como diseño intencional

    (el operador controla sus propios fees), pero ninguno investigó el caso donde

    el operador cambia feeDestination DENTRO de la misma secuencia de bloque que

    contiene intents pendientes, ni el impacto compuesto con el escenario de

    recipient == feeDestination en swap paths.

    '
