- id: DD-T-06
  title: subsidizedTransferToken con token que no soporta IERC7597 — el call a permit()
    falla silenciosamente o ejecuta fallback arbitrario, pero el allowance check (L539)
    detecta la inconsistencia
  tier: 2
  severity: low
  confidence: 76
  description: "subsidizedTransferToken (L505-559) hace un cast forzado a IERC7597\
    \ en L530:\n\n    IERC7597(_intent.recipientCurrency).permit({...})\n\nSi recipientCurrency\
    \ NO implementa IERC7597.permit(), hay tres outcomes posibles:\n\nOUTCOME A —\
    \ El token tiene fallback() que acepta la llamada silenciosamente:\nLa llamada\
    \ a permit() no revierte pero tampoco establece ningún allowance.\nL539-542 luego\
    \ verifica: allowance = erc20.allowance(owner, address(this)).\nSi allowance <\
    \ neededAmount → revert InsufficientAllowance.\nLa tx revierte. No hay pérdida\
    \ de fondos. El usuario está protegido.\n\nOUTCOME B — El token revierte (no tiene\
    \ fallback compatible):\nL530 revierte. Toda la tx revierte. Griefing: cualquier\
    \ usuario que intente\nusar subsidizedTransferToken con este token siempre falla.\
    \ Debe usar\ntransferTokenPreApproved en su lugar.\n\nOUTCOME C — El token tiene\
    \ un fallback() que establece allowance de forma diferente:\nExtremadamente improbable,\
    \ pero si el fallback ejecuta setApproval o similar,\nel allowance check podría\
    \ pasar. Luego safeTransferFrom (L549) transferiría tokens.\nEste es el escenario\
    \ más peligroso pero requiere un token específicamente malicioso.\n\nLA VERDADERA\
    \ IMPLICACIÓN: La función ASUME que recipientCurrency es IERC7597.\nNo hay validación\
    \ on-chain. El operador decide qué token es pagable via\nsubsidizedTransferToken.\
    \ Si el operador crea un intent con un token no-IERC7597,\nla función siempre\
    \ falla para ese intent. El operador debe conocer qué tokens\nsoportan ERC-7597\
    \ (ERC-20 con permit de tipo {r, s, v, deadline}).\n\nNota: ERC-7597 es la interfaz\
    \ de permit estilo {bytes signature} (distinta de\nEIP-2612 que usa {uint8 v,\
    \ bytes32 r, bytes32 s}). La mayoría de tokens usan\nEIP-2612, pero el contrato\
    \ espera la interfaz de {bytes signature}.\n"
  attack_scenario: '1. Operador crea intent con recipientCurrency = USDC (que usa
    EIP-2612 con v,r,s).

    2. USDC NO implementa permit(bytes calldata signature) → solo permit(v, r, s).

    3. Owner firma una EIP-2612 permit para USDC.

    4. Relayer intenta subsidizedTransferToken con la firma EIP-2612 como bytes.

    5. IERC7597(USDC).permit({sig: bytes}) — este selector no existe en USDC.

    6. Toda la tx revierte con "function not found" (o fallback error).

    7. El pago no puede completarse via subsidizedTransferToken.


    Alternativa correcta: usar transferTokenPreApproved con allowance pre-aprobada.

    '
