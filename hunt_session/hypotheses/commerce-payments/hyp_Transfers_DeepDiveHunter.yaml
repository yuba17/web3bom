- id: DD-T-07
  title: 'transferFundsToDestinations orden de operaciones: fee se envía ANTES que
    recipient en pagos nativos, callback del feeDestination ejecuta con feeAmount+recipientAmount
    aún parcialmente en contrato'
  tier: 2
  severity: low
  confidence: 61
  description: "En transferFundsToDestinations (L720-737) para pagos nativos (NATIVE_CURRENCY):\n\
    \n    if (_intent.recipientAmount > 0) {\n        sendNative(_intent.recipient,\
    \ _intent.recipientAmount, false);  // L723\n    }\n    if (_intent.feeAmount\
    \ > 0) {\n        sendNative(feeDestinations[_intent.operator], _intent.feeAmount,\
    \ false);  // L726\n    }\n\nEl orden es: recipient PRIMERO, feeDestination SEGUNDO.\n\
    \nEl sendNative usa .call{value}(\"\") que entrega gas al recipient/feeDestination.\n\
    Con nonReentrant activo, la receive() del recipient/feeDestination NO puede\n\
    re-entrar en Transfers. PERO puede:\n1. Leer el balance del contrato Transfers\
    \ (address(transfers).balance).\n2. Leer processedTransferIntents (que NO está\
    \ marcado todavía — succeedPayment\n   se llama DESPUÉS en la función padre).\n\
    3. Interactuar con otros contratos que leen el estado de Transfers.\n\nEl estado\
    \ observable durante el callback del recipient:\n- address(transfers).balance\
    \ = feeAmount  (recipientAmount ya fue enviado)\n- processedTransferIntents[operator][id]\
    \ = false  (aún no procesado)\n\nLEER-ONLY REENTRANCY: Un contrato externo que\
    \ lee processedTransferIntents podría\nver el intent como \"no procesado\" durante\
    \ el callback. Si ese contrato externo\nusa esto para alguna lógica (ej: \"si\
    \ el pago no está procesado, permite crédito\"),\npodría ser manipulado. Esta\
    \ es la \"read-only reentrancy\" clásica.\n\nIMPORTANCIA PARA COINBASE COMMERCE:\
    \ El sistema de pagos tiene componentes off-chain\nque LEEN el estado on-chain.\
    \ Si un merchant contract lee processedTransferIntents\ndurante su receive() callback\
    \ para confirmar el pago, vería false y podría\ndenegar el servicio — aunque los\
    \ fondos SÍ llegan.\n\nMás concretamente: hay un estado inconsistente donde:\n\
    - recipient TIENE el ETH (fondos enviados)\n- processedTransferIntents == false\
    \ (intent no marcado aún)\n\nEsto viola la expectativa de atomicidad observable:\
    \ \"si tengo el dinero, el intent\nfue procesado\". No es un bug de fondos, sino\
    \ una inconsistencia de estado observable\nque podría afectar contratos que integran\
    \ con Transfers.\n"
  attack_scenario: "1. Merchant despliega un contrato con receive() que hace:\n  \
    \ if (transfers.isProcessed(operator, id)) { acceptDelivery(); }\n   else { revert(\"\
    payment not confirmed\"); }\n2. Payer llama transferNative, fondos enviados al\
    \ merchant contract.\n3. merchant.receive() ejecuta. transfers.processedTransferIntents\
    \ == false todavía.\n4. Merchant contract revierte: \"payment not confirmed\"\
    .\n5. sendNative ve revert → NativeTransferFailed → toda la tx revierte.\n6. Payer's\
    \ ETH devuelto. Merchant no recibió nada.\n7. Deadlock: el merchant necesita ver\
    \ processedTransferIntents=true pero eso\n   se establece DESPUÉS del send, y\
    \ el send requiere que el recipient no revierta.\n"
  impact: 'Deadlock para smart contract recipients que validan el intent status en
    receive().

    No hay pérdida de fondos, pero es una trampa de diseño que puede afectar a

    merchants que intentan implementar lógica de negocio en su receive().

    Severity: Low/Informational — el diseño requiere que los recipients no validen

    el intent status durante el callback de receive().

    '
  solidity: "contract ReentrantMerchant {\n    ITransfers public transfers;\n    address\
    \ public operator;\n    bytes16 public expectedId;\n\n    receive() external payable\
    \ {\n        // Merchant tries to validate payment is processed before accepting\n\
    \        // This creates a deadlock with Transfers.sol ordering\n        require(\n\
    \            transfers.processedTransferIntents(operator, expectedId),\n     \
    \       \"payment not confirmed\"\n        );\n    }\n}\n\nfunction test_DD_T_07_processedTransferIntents_ordering()\
    \ public {\n    ReentrantMerchant merchant = new ReentrantMerchant();\n    merchant.transfers\
    \ = transfers;\n    merchant.operator = operator;\n\n    TransferIntent memory\
    \ intent = _buildNativeIntent(\n        address(merchant), 1 ether, 0, operator\n\
    \    );\n    merchant.expectedId = intent.id;\n    _signIntent(intent, operatorKey);\n\
    \n    // Payment fails because merchant checks processedTransferIntents\n    //\
    \ which is set AFTER sendNative, not before\n    vm.expectRevert(); // NativeTransferFailed\
    \ from merchant.receive() revert\n    vm.prank(payer);\n    transfers.transferNative{value:\
    \ 1 ether}(intent);\n}\n"
