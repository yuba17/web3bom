- id: DD-T-01
  title: recipient == feeDestination en swap path — revertIfInexactTransfer doble-mide
    la misma dirección causando revert en pagos legítimos
  tier: 1
  severity: low
  confidence: 85
  description: "En swapTokens (L668-681), después de que Uniswap ejecuta el swap,\
    \ el contrato verifica\nque los tokens de salida llegaron correctamente via revertIfInexactTransfer.\
    \ Lo hace en\nDOS llamadas separadas: una para feeDestination (L670-675) y otra\
    \ para recipient (L676-681).\n\nEl problema crítico: si _intent.recipient == feeDestinations[_intent.operator],\
    \ AMBAS\nllamadas miden el balance de la MISMA dirección. El flujo es:\n\n1. Pre-swap:\
    \ feeBalanceBefore = IERC20(tokenOut).balanceOf(feeDestinations[operator])\n \
    \            recipientBalanceBefore = IERC20(tokenOut).balanceOf(_intent.recipient)\n\
    \   → Si recipient == feeDestination, feeBalanceBefore == recipientBalanceBefore\n\
    \n2. Uniswap ejecuta TRANSFER(feeAmount → feeDestination) y TRANSFER(recipientAmount\
    \ → recipient)\n   → Ambas van a la MISMA dirección. Balance aumenta en feeAmount\
    \ + recipientAmount.\n\n3. Primera check (L670-675):\n   balanceAfter = token.balanceOf(feeDestinations[operator])\n\
    \                = feeBalanceBefore + feeAmount + recipientAmount  (AMBOS transfers\
    \ llegaron)\n   expectedDiff = feeAmount\n   balanceAfter - balanceBefore = feeAmount\
    \ + recipientAmount ≠ feeAmount\n   → REVERT con InexactTransfer()\n\nEl pago\
    \ falla aunque los fondos estuvieran siendo entregados correctamente a la dirección\n\
    correcta. El operador legítimo que usa su propia dirección como recipient Y feeDestination\n\
    (caso común en comercios que quieren simplificar — reciben todo en una wallet)\
    \ nunca\npuede usar las funciones de swap. Solo afecta a swapAndTransferUniswapV3Native,\n\
    swapAndTransferUniswapV3Token, swapAndTransferUniswapV3TokenPreApproved cuando\n\
    recipientCurrency != NATIVE_CURRENCY (el path token-to-token y native-to-token).\n\
    \nEl path token-to-native (recipientCurrency == NATIVE_CURRENCY) NO está afectado\
    \ porque\nel check solo se ejecuta para recipientCurrency != NATIVE_CURRENCY (L669:\n\
    if (_intent.recipientCurrency != NATIVE_CURRENCY)).\n\nLos pagos non-swap (transferToken,\
    \ transferTokenPreApproved, etc.) NO están afectados\nporque transferFundsToDestinations\
    \ NO hace revertIfInexactTransfer después de enviar\n— simplemente hace safeTransfer\
    \ directamente.\n"
  attack_scenario: "1. Operador registra con feeDestination = merchantWallet.\n2.\
    \ Operador firma intent con:\n   - recipientAmount = 100 USDC\n   - feeAmount\
    \ = 5 USDC\n   - recipientCurrency = USDC\n   - recipient = merchantWallet  (=\
    \ feeDestination)\n3. Pagador llama swapAndTransferUniswapV3Native con suficiente\
    \ ETH.\n4. swapTokens ejecuta: V3_SWAP_EXACT_OUT compra 105 USDC total.\n5. TRANSFER\
    \ 5 USDC → merchantWallet. TRANSFER 100 USDC → merchantWallet.\n   merchantWallet\
    \ recibe 105 USDC total (correcto).\n6. revertIfInexactTransfer para fee:\n  \
    \ balanceAfter - balanceBefore = 105, expectedDiff = 5 → REVERT InexactTransfer.\n\
    7. El pago falla. El swap fue hecho pero la tx revierte en su totalidad.\n8. El\
    \ merchant no recibe fondos. El pagador recupera su ETH (revert atómico).\n\n\
    Escenario sin ataque malicioso: esto es un bug funcional. Cualquier operador que\n\
    simplifica su setup poniendo recipient == feeDestination en intents de swap nunca\n\
    puede recibir pagos via swap functions con output token != NATIVE. Necesita crear\n\
    dos wallets separadas o usar funciones non-swap.\n"
  impact: 'Pagos legítimos bloqueados. Ningún fondo se pierde (tx revierte), pero
    el merchant

    no puede recibir pagos cuando usa una sola wallet para recipient y fees en swaps.

    Afecta a todos los operadores que configuran recipient == feeDestination, lo cual

    es un caso de uso válido y razonable (simplificar contabilidad). Severidad: Media

    (funcionalidad bloqueada sin pérdida de fondos).

    '
  solidity: "function test_DD_T_01_recipient_equals_feeDestination_swap_path() public\
    \ {\n    // Setup: recipient == feeDestination == merchantWallet\n    address\
    \ merchantWallet = makeAddr(\"merchant\");\n\n    vm.prank(operator);\n    transfers.registerOperatorWithFeeDestination(merchantWallet);\n\
    \n    // Build intent: recipient = merchantWallet (same as feeDestination)\n \
    \   TransferIntent memory intent;\n    intent.recipientAmount = 100e6;   // 100\
    \ USDC\n    intent.feeAmount = 5e6;           // 5 USDC\n    intent.recipientCurrency\
    \ = USDC;\n    intent.recipient = payable(merchantWallet);  // SAME as feeDestination\n\
    \    intent.deadline = block.timestamp + 1 hours;\n    intent.id = bytes16(uint128(1));\n\
    \    intent.operator = operator;\n    // ... sign intent with operator key ...\n\
    \n    uint256 merchantBefore = IERC20(USDC).balanceOf(merchantWallet);\n\n   \
    \ // Payer calls swap with ETH → should deliver 105 USDC to merchantWallet\n \
    \   // But revertIfInexactTransfer will see 105 USDC increase vs expected 5 →\
    \ REVERT\n    vm.expectRevert(abi.encodeWithSelector(ITransfers.InexactTransfer.selector));\n\
    \    vm.prank(payer);\n    transfers.swapAndTransferUniswapV3Native{value: 1 ether}(intent,\
    \ 500);\n\n    // Verify: no funds moved (tx reverted)\n    assertEq(IERC20(USDC).balanceOf(merchantWallet),\
    \ merchantBefore,\n        \"DD-T-01: payment should have failed with InexactTransfer\"\
    );\n\n    // Compare: transferTokenPreApproved (non-swap) WORKS with same recipient==feeDestination\n\
    \    IERC20(USDC).approve(address(transfers), 105e6);\n    transfers.transferTokenPreApproved(intent);\
    \ // This should succeed\n    assertEq(IERC20(USDC).balanceOf(merchantWallet),\
    \ merchantBefore + 105e6,\n        \"DD-T-01: non-swap path should work with recipient==feeDestination\"\
    );\n}\n"
