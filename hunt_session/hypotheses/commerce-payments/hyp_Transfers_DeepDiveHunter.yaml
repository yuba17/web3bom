- id: DD-T-02
  title: 'subsidizedTransferToken — permit consumido por front-run + allowance previa:
    el front-runner puede ejecutar el pago antes que el relayer legítimo sin pérdida
    de fondos, pero con timing completamente fuera de control del owner'
  tier: 1
  severity: medium
  confidence: 82
  description: "6 hunters detectaron el vector pero solo lo analizaron como \"griefing\
    \ al relayer\".\nLa investigación profunda revela el escenario completo:\n\nsubsidizedTransferToken\
    \ (L505-559) llama permit() en L530 SIN try/catch. Cualquier\nactor puede front-run\
    \ la tx del relayer de dos formas:\n\nFORMA 1 — Front-run completo del pago:\n\
    El front-runner extrae del mempool: intent + EIP-2612 sig + permit data.\nLlama\
    \ subsidizedTransferToken directamente (es permisionless — L505 no tiene restricción\n\
    de caller). La tx del front-runner ejecuta primero: permit consume nonce, allowance\n\
    se establece, safeTransferFrom toma los fondos del owner, el intent se marca processed.\n\
    La tx del relayer legítimo llega: validIntent falla con AlreadyProcessed(). Outcome:\n\
    el pago fue ejecutado, los fondos fueron a recipient/feeDestination correctos,\
    \ pero\nel relayer original (si tenía incentivos off-chain) pierde su compensación.\n\
    \nFORMA 2 — Grief del nonce:\nEl front-runner extrae solo la firma de permit y\
    \ llama T.permit(owner, Transfers, amount, deadline, sig)\ndirectamente en el\
    \ token. El nonce se consume. Cuando la tx del relayer llega,\nL530 llama permit()\
    \ → revierte (nonce stale). El allow check (L539-542) falla porque\nno se estableció\
    \ el allowance. Toda la subsidizedTransferToken revierte.\nOutcome: pago bloqueado,\
    \ operador debe crear nuevo intent con nuevo ID, owner\ndebe firmar nuevo permit.\n\
    \nCASO CRÍTICO NO EXAMINADO — Token que NO implementa IERC7597:\nLa línea L530\
    \ hace un cast forzado: IERC7597(_intent.recipientCurrency).permit(...)\nSi el\
    \ token NO implementa ERC-7597 (la mayoría de ERC20 no lo hacen), la llamada\n\
    a permit() sobre una dirección que no tiene esa función puede:\na) Revertir con\
    \ \"function not found\" → toda la tx revierte → grief permanente\n   para esa\
    \ combinación de token+intent.\nb) En tokens con fallback(), ejecutar código arbitrario\
    \ del fallback → no hay\n   validación de que el call tuvo el efecto esperado\
    \ (el allowance check L539\n   SÍ valida que el allowance fue establecido, lo\
    \ cual mitiga esto parcialmente).\n\nLa función succeedPayment en subsidizedTransferToken\
    \ usa _signatureTransferData.owner\ncomo el \"sender\" del evento Transferred\
    \ (L558). Esto es correcto en la mayoría\nde los casos, pero si el relayer es\
    \ también el payer (por algún escenario de\nbatch), el evento puede ser misleading.\n"
  attack_scenario: "=== Forma 2 (Grief permanente por intent) ===\n1. Alice firma\
    \ permit(owner=alice, spender=Transfers, value=105 USDC, deadline=T, sig=S1)\n\
    2. Operador firma intent para Alice con id=0x1234, deadline=T.\n3. Relayer R1\
    \ emite subsidizedTransferToken(intent, {owner=alice, sig=S1}) al mempool.\n4.\
    \ Bot B ve la tx en mempool.\n5. Bot B llama USDC.permit(alice, Transfers, 105,\
    \ T, S1) directamente.\n6. USDC incrementa nonce de Alice (nonce: N → N+1).\n\
    7. R1's tx llega: L530 IERC7597(USDC).permit(alice, Transfers, 105, T, S1)\n \
    \  → REVERT porque nonce N ya fue consumido.\n8. Toda la subsidizedTransferToken\
    \ revierte.\n\nCosto para Bot B: solo gas de la llamada permit (~50K gas ≈ $0.01\
    \ en L1).\nCosto para Alice: debe firmar nuevo permit. Operador debe crear nuevo\
    \ intent.\nEsto puede repetirse indefinidamente por cada intent ID único.\n\n\
    === Impacto económico del grief ===\nEn un sistema de pagos de alta frecuencia\
    \ (Coinbase Commerce), un atacante puede\ngriefear TODOS los pagos subsidiados\
    \ con un costo marginal de ~$0.01 por permit,\nmientras cada grief cuesta al operador/relayer\
    \ la coordinación de re-firma.\n"
  impact: 'Forma 1: el pago se completa pero el relayer pierde incentivos off-chain.
    Bajo impacto

    en fondos si los fondos llegan al destino correcto.


    Forma 2: DoS de pagos gasless. El atacante puede bloquear sistemáticamente todos

    los subsidizedTransferToken con costo mínimo. Los fondos del owner no se pierden

    (tx revierte), pero el servicio de pagos gasless queda degradado.


    Forma 3 (token sin ERC-7597): grief permanente. Todos los intentos de

    subsidizedTransferToken con ese token siempre fallan.

    '
  solidity: "function test_DD_T_02_permit_frontrun_grief() public {\n    // Setup:\
    \ Alice wants gasless payment of 105 USDC\n    address alice = makeAddr(\"alice\"\
    );\n    deal(USDC, alice, 200e6);\n\n    // Alice signs EIP-2612 permit\n    uint256\
    \ aliceNonce = IERC2612(USDC).nonces(alice);\n    (uint8 v, bytes32 r, bytes32\
    \ s) = vm.sign(\n        aliceKey,\n        keccak256(abi.encode(\n          \
    \  PERMIT_TYPEHASH, alice, address(transfers),\n            105e6, aliceNonce,\
    \ block.timestamp + 1 hours\n        ))\n    );\n    bytes memory permitSig =\
    \ abi.encodePacked(r, s, v);\n\n    // Front-runner consumes the permit nonce\
    \ directly\n    address frontRunner = makeAddr(\"frontRunner\");\n    vm.prank(frontRunner);\n\
    \    IERC2612(USDC).permit(alice, address(transfers), 105e6, block.timestamp +\
    \ 1 hours, v, r, s);\n\n    // Verify nonce incremented\n    assertEq(IERC2612(USDC).nonces(alice),\
    \ aliceNonce + 1, \"DD-T-02: nonce should be consumed\");\n\n    // Now the relayer\
    \ tries to execute subsidizedTransferToken\n    TransferIntent memory intent =\
    \ _buildIntentForAlice();\n    EIP2612SignatureTransferData memory sigData = EIP2612SignatureTransferData({\n\
    \        owner: alice,\n        signature: permitSig\n    });\n\n    // Should\
    \ revert because permit nonce is already consumed\n    vm.expectRevert(); // ERC2612\
    \ nonce error\n    vm.prank(relayer);\n    transfers.subsidizedTransferToken(intent,\
    \ sigData);\n\n    // Verify Alice's funds are untouched\n    assertEq(IERC20(USDC).balanceOf(alice),\
    \ 200e6, \"DD-T-02: Alice funds should be safe\");\n}\n"
  status: investigate
- id: DD-T-03
  title: registerOperatorWithFeeDestination(address(0)) elimina al operador silenciosamente
    pero emite OperatorRegistered — inconsistencia de estado observable vs real
  tier: 1
  severity: low
  confidence: 92
  description: "registerOperatorWithFeeDestination (L781-785) NO valida _feeDestination\
    \ != address(0):\n\n    function registerOperatorWithFeeDestination(address _feeDestination)\
    \ external {\n        feeDestinations[_msgSender()] = _feeDestination;\n     \
    \   emit OperatorRegistered(_msgSender(), _feeDestination);\n    }\n\nSi el operador\
    \ llama registerOperatorWithFeeDestination(address(0)):\n- feeDestinations[operator]\
    \ = address(0)\n- operatorIsRegistered modifier: feeDestinations[operator] ==\
    \ address(0) → revert OperatorNotRegistered()\n- PERO se emite OperatorRegistered(operator,\
    \ address(0))\n\nEl evento dice que el operador ESTÁ registrado con feeDestination=address(0),\
    \ pero\nel modifier dice que NO está registrado. Esta contradicción afecta a:\n\
    1. Off-chain sistemas que monitorizan OperatorRegistered para saber qué operadores\n\
    \   están activos — verían al operador como \"registered\" cuando en realidad\
    \ no puede\n   procesar pagos.\n2. El operador podría confundirse y pensar está\
    \ activo.\n3. Contraste con registerOperator() (L788-792) que usa msg.sender como\
    \ feeDestination\n   (nunca puede ser 0) y con unregisterOperator() que emite\
    \ OperatorUnregistered.\n\nLa combinación peligrosa: un operador registra con\
    \ address(0) (accidentalmente o\npor bug en su dApp). Emite OperatorRegistered.\
    \ Luego firma 50 intents y los distribuye.\nLos pagadores intentan ejecutar →\
    \ todo revierte con OperatorNotRegistered.\nNingún evento indica que el operador\
    \ se \"auto-des-registró\" — el último evento es\nOperatorRegistered, lo cual\
    \ es misleading.\n\nDiferencia clave con unregisterOperator(): unregisterOperator\
    \ emite OperatorUnregistered\n(correcto, sistemas pueden rastrear). registerOperatorWithFeeDestination(0)\
    \ emite\nOperatorRegistered con feeDestination=0 (incorrecto, sistemas no pueden\
    \ distinguir).\n"
  attack_scenario: '1. Operador A llama registerOperatorWithFeeDestination(address(0))
    por error.

    2. Evento OperatorRegistered(A, address(0)) emitido.

    3. Off-chain dApp de Coinbase Commerce ve el evento, asume A está activo.

    4. A distribuye 100 intents firmados a merchants para pagos de $500 cada uno.

    5. Merchants/pagadores intentan ejecutar → OperatorNotRegistered en todos.

    6. $50,000 en pagos fallidos. Merchant experience destruida.

    7. Operador y plataforma no entienden por qué — el evento dice que estaban registrados.


    No hay pérdida de fondos directa (tx revierte), pero el daño reputacional y operacional

    es significativo en un sistema de pagos.

    '
  impact: 'No hay pérdida de fondos directa. Impacto: operational — todos los intents
    firmados

    por ese operador fallan silenciosamente (desde la perspectiva del off-chain).
    El evento

    misleading puede causar que la plataforma no detecte el problema hasta que los
    pagos

    fallen en producción. Severity: Low/Informational con impacto operacional potencialmente

    significativo para Coinbase Commerce.

    '
  solidity: "function test_DD_T_03_registerWithZeroFeeDestination() public {\n   \
    \ address operator = makeAddr(\"operator\");\n\n    // Operator registers with\
    \ address(0) as fee destination\n    vm.prank(operator);\n    transfers.registerOperatorWithFeeDestination(address(0));\n\
    \n    // OperatorRegistered event was emitted (check in fork test)\n    // But\
    \ the operator is effectively unregistered\n\n    // Build a valid intent signed\
    \ by this operator\n    TransferIntent memory intent = _buildIntent(operator);\n\
    \    _signIntent(intent, operatorKey);\n\n    // Payment should fail with OperatorNotRegistered\
    \ despite OperatorRegistered event\n    vm.expectRevert(ITransfers.OperatorNotRegistered.selector);\n\
    \    vm.prank(payer);\n    transfers.transferNative{value: 1 ether}(intent);\n\
    \n    // Invariant: if OperatorRegistered was emitted, payments should work\n\
    \    // VIOLATION: OperatorRegistered(op, address(0)) → payments still fail\n\n\
    \    // Compare: unregisterOperator correctly uses OperatorUnregistered event\n\
    \    vm.prank(operator);\n    transfers.registerOperator(); // Fix: register properly\n\
    \    transfers.unregisterOperator(); // Correctly emits OperatorUnregistered\n\
    \n    // After proper unregister, same revert — but at least event is consistent\n\
    \    vm.expectRevert(ITransfers.OperatorNotRegistered.selector);\n    vm.prank(payer);\n\
    \    transfers.transferNative{value: 1 ether}(intent);\n}\n"
  status: confirmed
