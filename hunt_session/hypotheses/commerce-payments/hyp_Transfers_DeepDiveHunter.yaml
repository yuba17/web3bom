    1. Balances preexistentes en feeDestination/recipient se capturan ANTES del swap.

    2. El diff measurement cancela los balances preexistentes.

    3. feeAmount==0 o recipientAmount==0 resulta en diff==0==expectedDiff, safe.

    4. El único bug real relacionado con esta lógica es DD-T-01 (recipient==feeDestination).

