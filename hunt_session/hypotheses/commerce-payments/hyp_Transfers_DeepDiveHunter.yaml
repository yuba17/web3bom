- id: DD-T-05
  title: swapTokens feeDestination capturado en collectFees al inicio de la función
    — si feeDestination == address(0) en ese momento, TRANSFER command de Uniswap
    envía a address(0)
  tier: 1
  severity: medium
  confidence: 71
  description: "En swapTokens (L586-590), el comando collectFees para el Uniswap router\
    \ se construye\nANTES del try/catch:\n\n    bytes memory collectFees = abi.encode(\n\
    \        _intent.recipientCurrency,\n        feeDestinations[_intent.operator],\
    \  // ← resolución aquí\n        _intent.feeAmount\n    );\n\nEl modifier operatorIsRegistered\
    \ (L128-132) verifica que feeDestinations[operator] != 0\nANTES de entrar a swapTokens.\
    \ Esto parece seguro. Pero hay un race condition teórico:\n\nEn teoría, dentro\
    \ de una función nonReentrant, ningún estado externo puede cambiar\nentre L128\
    \ (check) y L588 (captura del valor). Sin embargo, hay un escenario específico:\n\
    \nESCENARIO: ¿Puede feeDestinations[operator] ser 0 durante la construcción de\
    \ collectFees?\n\nRespuesta: NO bajo ejecución normal single-threaded de EVM.\
    \ El nonReentrant garantiza\nque no hay re-entrada, y la función es lineal. El\
    \ valor de feeDestinations[operator]\nno puede cambiar entre el modifier y la\
    \ ejecución de swapTokens.\n\nPERO: hay una implicación más interesante. Los comandos\
    \ Uniswap para el swap\ncodifican feeDestinations[operator] como una dirección\
    \ fija en el bytes payload.\nSi esta dirección es address(0) por algún edge case,\
    \ el comando TRANSFER de\nUniswap intentaría transferir fees a address(0). El\
    \ UniversalRouter de Uniswap\ntípicamente interpreta address(0) como \"no transfer\"\
    \ o como ETH para TRANSFER commands.\n\nPara el path de tokenOut != NATIVE (L644-660):\n\
    - collectFees = abi.encode(tokenOut, address(0), feeAmount)\n- TRANSFER(tokenOut,\
    \ address(0), feeAmount) → Uniswap envía feeAmount de tokenOut a address(0)?\n\
    \nSi el Uniswap UniversalRouter TRANSFER command para ERC20 envía a address(0),\
    \ los tokens\nvan a la dirección quemada. El revertIfInexactTransfer luego verifica\
    \ el balance de address(0):\nbalanceAfter - balanceBefore == feeAmount. Si el\
    \ token permite transferir a address(0) (la\nmayoría lo hace), esto no revertirá,\
    \ y los fees serán quemados permanentemente.\n\nSin embargo, el modifier operatorIsRegistered\
    \ previene que lleguemos aquí si\nfeeDestinations[operator] == 0. Así que este\
    \ escenario NO es alcanzable.\n\nLO QUE SÍ ES ALCANZABLE: el operador registra\
    \ con una dirección que PARECE válida pero\nes contract address(0)-like: por ejemplo,\
    \ una dirección que devuelve true en address.call\npero no acepta tokens. Esto\
    \ ya está cubierto en DD-T-04.\n\nHALLAZGO REAL DE ESTE DD: La construcción de\
    \ collectFees usa feeDestinations lookup\nDOS VECES: una en L588 y otra en L674\
    \ (revertIfInexactTransfer). Si entre estas\ndos líneas el feeDestination cambiara\
    \ (imposible en nonReentrant), el check\nmediría el balance de una dirección diferente\
    \ a donde fue el fee. Esto confirma\nla importancia de nonReentrant para la correctness\
    \ del swap accounting.\n\nVECTOR CONCRETO: swapAndTransferUniswapV3Token cuando\
    \ feeAmount == 0. En ese caso:\n- collectFees encoda feeAmount=0\n- L671: revertIfInexactTransfer(0,\
    \ feeBalanceBefore, tokenOut, feeDestinations[operator])\n- Si feeDestinations[operator]\
    \ cambió a una dirección con tokens de tokenOut preexistentes,\n  el check podría\
    \ fallar (balance cambió por razón externa al swap). Pero nonReentrant\n  previene\
    \ esto.\n"
  attack_scenario: "Escenario: swap con feeAmount == 0 y feeDestination activo que\
    \ tiene tokens preexistentes.\n\n1. Operador registra con feeDestination = multisigWallet\
    \ que ya tiene 100 USDC.\n2. Operador firma intent con feeAmount = 0, recipientAmount\
    \ = 50 USDC.\n3. Pagador llama swapAndTransferUniswapV3Native.\n4. En swapTokens:\
    \ feeBalanceBefore = 100 USDC (preexistente en multisigWallet).\n5. Uniswap TRANSFER(USDC,\
    \ multisigWallet, 0) → balance no cambia.\n6. revertIfInexactTransfer(0, 100,\
    \ USDC, multisigWallet):\n   balanceAfter = 100 USDC. balanceAfter - balanceBefore\
    \ = 0 == expectedDiff(0). OK.\n7. NO revierte. Safe.\n\nVariante con feeAmount\
    \ > 0 y tokens preexistentes:\n1. feeBalanceBefore = 100 USDC preexistente.\n\
    2. TRANSFER(USDC, feeDestination, 5) → balance = 105.\n3. revertIfInexactTransfer(5,\
    \ 100, USDC, feeDestination): 105-100=5==5. OK.\n4. Safe — preexisting balance\
    \ cancela.\n\nCONCLUSIÓN: Este vector está correctamente manejado por la fórmula\
    \ de balance diff.\nReclasificando como investigación de diseño, no bug explotable.\
    \ La lógica es correcta.\n"
  impact: 'Investigación resulta en: NO exploitable. La combinación de nonReentrant
    + balance diff

    formula (balanceAfter - balanceBefore) hace que los balances preexistentes se
