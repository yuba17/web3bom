    del gas: ¿puede el front-runner ejecutar el subsidizedTransferToken él mismo

    (con el permit ya consumido vía allowance previa) y dirigir el pago incorrectamente?

    Tampoco investigaron: ¿qué pasa si el token NO implementa ERC-7597 (IERC7597)?

    '
