- id: DD-T-08
  title: 'swapAndTransferUniswapV3Token con feeAmount == 0 y recipientCurrency !=
    NATIVE: feeBalanceBefore se inicializa a 0 pero revertIfInexactTransfer se salta
    — ¿se pierde el fee check?'
  tier: 2
  severity: informational
  confidence: 68
  description: "En swapTokens (L596-598), las variables feeBalanceBefore y recipientBalanceBefore\n\
    se inicializan implícitamente a 0 (variables uint256 de Solidity).\n\nEn el path\
    \ tokenIn → tokenOut (msg.value == 0, recipientCurrency != NATIVE) L644-660:\n\
    \    feeBalanceBefore = IERC20(tokenOut).balanceOf(feeDestinations[_intent.operator]);\n\
    \    recipientBalanceBefore = IERC20(tokenOut).balanceOf(_intent.recipient);\n\
    \nEstos SÍ se populan. Luego en L668-681 post-swap, si recipientCurrency != NATIVE_CURRENCY:\n\
    \    revertIfInexactTransfer(feeAmount, feeBalanceBefore, tokenOut, feeDestinations[operator])\n\
    \    revertIfInexactTransfer(recipientAmount, recipientBalanceBefore, tokenOut,\
    \ recipient)\n\nCASO: feeAmount == 0.\n- revertIfInexactTransfer(0, feeBalanceBefore,\
    \ tokenOut, feeDestinations[operator])\n- balanceAfter de feeDestinations = feeBalanceBefore\
    \ + 0 (no transfer happened)\n- balanceAfter - feeBalanceBefore = 0 == expectedDiff(0).\
    \ OK.\n\nCASO: recipientAmount == 0 (aunque feeAmount > 0).\n- neededAmount =\
    \ 0 + feeAmount = feeAmount.\n- Swap produce feeAmount de tokenOut.\n- TRANSFER(tokenOut,\
    \ feeDestination, feeAmount).\n- TRANSFER(tokenOut, recipient, 0) — Uniswap puede\
    \ o no ejecutar transfer de 0.\n- revertIfInexactTransfer(0, recipientBalanceBefore,\
    \ tokenOut, recipient):\n  balance de recipient no cambió → 0 == 0. OK.\n- revertIfInexactTransfer(feeAmount,\
    \ feeBalanceBefore, tokenOut, feeDestination):\n  feeAmount fue transferido →\
    \ OK.\n\nNO HAY BUG en los casos puros de 0. Pero sí hay una subtileza interesante:\n\
    \nEn el path msg.value > 0 (ETH → tokenOut), L604-605:\n    feeBalanceBefore =\
    \ IERC20(tokenOut).balanceOf(feeDestinations[_intent.operator]);\n    recipientBalanceBefore\
    \ = IERC20(tokenOut).balanceOf(_intent.recipient);\n\nSin embargo, en este path\
    \ NO se establece feeBalanceBefore si feeAmount == 0\n(el balance sigue siendo\
    \ 0 por inicialización). Luego L670-675:\n    revertIfInexactTransfer(0, 0, IERC20(tokenOut),\
    \ feeDestinations[operator])\n    → balanceOf(feeDestinations[operator]) puede\
    \ ser no-cero si tiene tokens preexistentes.\n    → balanceAfter - 0 = preexistingBalance.\
    \ ¡Si preexistingBalance > 0, REVIERTE!\n\nESPERA — re-examinando: L604-605 SÍ\
