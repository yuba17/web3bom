priority_ranking:
  tier_1:
  - id: DD-T-01
    reason: 'Bug funcional confirmado: bloquea pagos legítimos cuando recipient==feeDestination
      en swap paths. Verificable con un test simple. No requiere actores maliciosos.'
    recommended_action: Fork PoC inmediato con USDC en Base. Luego RedTeam y ReportWriter.
  - id: DD-T-04
    reason: Fee redirection via feeDestination change. Impacto económico real si key
      comprometida. feeDestination=address(this) causa DoS permanente en pagos nativos.
    recommended_action: Investigar si bounty cubre compromiso de operator key como
      precondición.
  - id: DD-T-02
    reason: Permit front-run grief con costo $0.01 por ataque. Confirmado por 6 hunters.
      Fix conocido (try/catch + allowance check).
    recommended_action: PoC Foundry + RedTeam. Probablemente Medium.
  tier_2:
  - id: DD-T-03
    reason: 'Event inconsistency: OperatorRegistered(op, address(0)) pero operador
      inactivo. Confunde sistemas off-chain.'
    recommended_action: Informational/Low. Incluir en reporte.
  - id: DD-T-06
    reason: 'Token compatibility: solo funciona con IERC7597, no EIP-2612 estándar.
      Limitación funcional.'
    recommended_action: Informational. Documentar en reporte.
  - id: DD-T-07
    reason: 'State ordering: processedTransferIntents set AFTER sendNative. Smart
      contract recipients que validan status en receive() quedan en deadlock.'
    recommended_action: Low. Documentar patrón de integración incorrecto.
  dismissed:
  - id: DD-T-05
    reason: Análisis mostró que nonReentrant + balance diff formula manejan correctamente
      todos los edge cases. No exploitable.
  - id: DD-T-08
    reason: Swap accounting con feeAmount/recipientAmount=0 es correcto. El único
      bug real es DD-T-01 que ya está en Tier 1.
summary:
  total_hypotheses: 8
  tier_1: 3
  tier_2: 3
  dismissed: 2
  highest_priority: DD-T-01
  key_insight: 'El hallazgo más importante es DD-T-01: recipient == feeDestination
    en swap paths

    causa que revertIfInexactTransfer mida la misma dirección dos veces con expected

    diffs individuales, pero el balance real aumentó en la suma. Esto es un bug funcional

    que no requiere actores maliciosos — cualquier operador que simplifica su setup

    poniendo una sola wallet como destino de todo no puede usar swap functions.


    El segundo hallazgo más importante es DD-T-02 (permit front-run grief) confirmado

    por 6 hunters. El fix estándar (try/catch + allowance check) existe y está documentado

    en múltiples auditorías previas. Su presencia aquí indica que la auditoría original

    puede no haberlo capturado.


    DD-T-04 (feeDestination mutable) es un riesgo de diseño real que se materializa

    en el escenario feeDestination=address(this) que causa DoS confirmado en pagos
    nativos.

    '
