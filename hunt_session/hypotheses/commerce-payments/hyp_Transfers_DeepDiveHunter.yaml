    las dos llamadas a revertIfInexactTransfer comprueban feeDestination y recipient

    por separado. Si recipient == feeDestinations[operator], ambas llamadas miden

    el balance de la MISMA dirección. La primera medición ve el incremento TOTAL

    (feeAmount + recipientAmount) pero espera solo feeAmount → REVERT.

    Este es un bug funcional confirmable que bloquea pagos legítimos cuando un

    comerciante configura recipient == feeDestination en swaps. NINGÚN otro hunter

    lo detectó. Requiere investigación urgente con PoC concreto.

    '
- theme: Custom prefix — operador controla la construcción del hash firmado
  hunters:
  - AccessHunter
  - DomainHunter
  - SignatureHunter
  - TrustBoundaryHunter
  - WildcardHunter
  weight: medium
  summary: '5 hunters exploraron el custom prefix. Conclusión mayoritaria: keccak256
    previene

    colisiones, el operador es el signer, low risk. PERO TrustBoundaryHunter (T-TB-01)

    señala que el prefix es caller-supplied en calldata, NO firmado por el operador

    de forma independiente. El operador firma keccak256(prefix || hash). Un atacante

    puede variar el prefix en calldata y computar qué hash_externo haría match.

    El punto crítico no explorado: el prefix es un campo de la TransferIntent calldata

    que NO se incluye en el hash interno. Cualquier persona que llame la función puede

    poner CUALQUIER prefix. Esto significa que si el operador firmó un hash con prefix=""

    (path EIP-191), un atacante podría intentar pasar prefix=anything y hash_diff.

    Sin embargo, la firma recuperada tendría que seguir resolviendo a _intent.operator,

    lo cual requiere colisión. Correctamente descartado como infeasible.

    '
