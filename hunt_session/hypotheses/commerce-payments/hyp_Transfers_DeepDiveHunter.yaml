  - DomainHunter
  - FlowHunter
  - SignatureHunter
  - TrustBoundaryHunter
  - WildcardHunter
  weight: high
  summary: '6 hunters detectaron el patrón: subsidizedTransferToken llama IERC7597.permit()

    sin try/catch (L530-536). Un front-runner puede consumir el nonce del permit

    antes del relayer, causando que la tx revierta. Todos lo clasifican como griefing

