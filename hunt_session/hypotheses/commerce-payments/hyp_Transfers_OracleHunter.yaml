hypotheses:

  - id: OH-T-01
    title: "poolFeesTier caller-controlled: payer selects Uniswap V3 pool fee tier enabling sandwich via low-liquidity pool"
    description: |
      In swapAndTransferUniswapV3Native (L384), swapAndTransferUniswapV3Token (L413), and
      swapAndTransferUniswapV3TokenPreApproved (L458), the `poolFeesTier` parameter is entirely
      caller-controlled. The operator signs the TransferIntent which locks recipientAmount,
      feeAmount, recipientCurrency, and deadline, but does NOT sign poolFeesTier.

      The swap uses V3_SWAP_EXACT_OUT (L580: swapPath = abi.encodePacked(tokenOut, poolFeesTier, tokenIn)).
      EXACT_OUT means the router will consume whatever amount of tokenIn is needed to produce
      exactly `neededAmount` of tokenOut. The `maxAmountWillingToPay` serves as the slippage cap.

      Attack vector: The payer (msg.sender) IS the caller, so they choose poolFeesTier themselves.
      A malicious payer could pick a pool with extremely thin liquidity (e.g., fee tier 10000 = 1%
      pool that has almost no liquidity). In a thin pool, the price impact is massive, so the
      swap consumes far more tokenIn.

      However: the payer is paying with THEIR OWN tokens. Using a worse pool only hurts the payer
      (they spend more of their own tokens for the same output). The recipient and fee destination
      always receive exactly recipientAmount and feeAmount of the recipientCurrency. So the payer
      has no incentive to pick a bad pool — it only costs them more.

      The real risk is: a third-party relayer submitting the transaction on behalf of the payer.
      If the payer pre-signs a Permit2 signature for maxWillingToPay, a malicious relayer could
      choose a bad poolFeesTier to maximize the payer's input consumption. The relayer could
      sandwich the swap to extract the excess. But: the payer controls maxWillingToPay via the
      permit2 signature, which caps maximum extraction.

      For the Native variant (swapAndTransferUniswapV3Native): the payer sends msg.value directly,
      and any excess ETH is swept back to the payer via SWEEP. So there's no extraction — the
      payer gets the unused ETH back.

      Conclusion: The payer self-selects the pool and bears the cost of bad selection. The protocol
      is designed so that recipient always gets exact amounts. This is by-design, not a vulnerability.
    severity: informational
    confidence: 80
    affected_functions:
      - "swapAndTransferUniswapV3Native (L384-410)"
      - "swapAndTransferUniswapV3Token (L413-455)"
      - "swapAndTransferUniswapV3TokenPreApproved (L458-502)"
      - "swapTokens (L561-718)"
    attack_scenario: |
      1. Operator signs intent: recipientAmount=1000 USDC, feeAmount=10 USDC, recipientCurrency=USDC
      2. Payer calls swapAndTransferUniswapV3Native with poolFeesTier=10000 (1% fee pool, low liquidity)
      3. V3_SWAP_EXACT_OUT requests 1010 USDC output, consuming excessive ETH due to thin liquidity
      4. Unused ETH is swept back to payer via UNWRAP_WETH + SWEEP
      5. Net effect: payer pays more gas but same effective price. Recipient gets exactly 1000+10 USDC.
      6. No profit extraction possible — payer hurts only themselves.
    solidity_invariant: |
      // INV: recipient and feeDestination always receive exact amounts regardless of poolFeesTier
      // After any swap function, recipient balance increased by exactly recipientAmount
      // and feeDestination balance increased by exactly feeAmount
      uint256 recipientAfter = IERC20(intent.recipientCurrency).balanceOf(intent.recipient);
      uint256 feeDestAfter = IERC20(intent.recipientCurrency).balanceOf(feeDestination);
      eq(recipientAfter - recipientBefore, intent.recipientAmount, "OH-T-01: recipient underpaid");
      eq(feeDestAfter - feeDestBefore, intent.feeAmount, "OH-T-01: fee underpaid");

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-02
    title: "V3_SWAP_EXACT_OUT sandwich attack: payer's swap is sandwichable but loss is bounded by maxWillingToPay"
    description: |
      The swap in swapTokens (L667) executes via Uniswap's UniversalRouter with V3_SWAP_EXACT_OUT.
      The swap path is a single hop: tokenOut -> poolFeesTier -> tokenIn (L579).

      For the token-in variants (swapAndTransferUniswapV3Token, swapAndTransferUniswapV3TokenPreApproved),
      maxWillingToPay = _signatureTransferData.transferDetails.requestedAmount (L431) or the
      explicit maxWillingToPay parameter (L463). This amount is transferred to the contract first,
      then sent to the Uniswap router (L663: safeTransfer(address(uniswap), maxWillingToPay)).

      The swap parameters (L580): abi.encode(address(uniswap), neededAmount, maxAmountWillingToPay, swapPath, false).
      The third parameter is the amountInMaximum for V3_SWAP_EXACT_OUT. This provides slippage
      protection.

      Sandwich attack: an MEV bot can front-run the swap to move the pool price, causing the payer
      to consume more tokenIn (up to maxWillingToPay), then back-run to profit. The maximum
      extraction is: maxWillingToPay - fair_price_amount.

      This is standard DEX interaction behavior, not a protocol bug. The payer controls their own
      slippage by setting maxWillingToPay. The protocol correctly passes this as amountInMaximum.

      However, there is NO on-chain enforcement that maxWillingToPay is reasonable. A dApp frontend
      could set a very high maxWillingToPay, exposing the payer to large sandwich losses. This is
      a UX concern, not a smart contract vulnerability.
    severity: low
    confidence: 75
    affected_functions:
      - "swapTokens (L561-718)"
      - "swapAndTransferUniswapV3Token (L413-455)"
      - "swapAndTransferUniswapV3TokenPreApproved (L458-502)"
    attack_scenario: |
      1. Payer wants to pay 1000 USDC intent by swapping DAI. Sets maxWillingToPay=1100 DAI (10% slippage).
      2. Fair swap would cost 1005 DAI.
      3. MEV bot front-runs: buys USDC in the pool, moves price up.
      4. Payer's EXACT_OUT swap now costs 1095 DAI (within max).
      5. MEV bot back-runs: sells USDC, pockets ~90 DAI profit.
      6. Payer lost 90 DAI extra vs fair price. Recipient still got exactly 1000 USDC.
      7. Maximum loss bounded by maxWillingToPay - neededAmount.
    solidity_invariant: |
      // INV: swap must not consume more than maxWillingToPay of input token
      // Already enforced by Uniswap V3 EXACT_OUT amountInMaximum parameter
      // The return value of swapTokens represents actual consumed amount
      uint256 consumed = swapTokens(_intent, tokenIn, maxWillingToPay, poolFeesTier);
      lte(consumed, maxWillingToPay, "OH-T-02: swap exceeded max willing to pay");

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-03
    title: "swapAndTransferUniswapV3Native: no minimum check on msg.value allows zero-value swap attempt"
    description: |
      In swapAndTransferUniswapV3Native (L384-410), there is no `exactValueSent` modifier.
      The function only checks `if (neededAmount > 0)` at L403 before swapping. There is NO
      check that msg.value >= some minimum relative to neededAmount.

      If the payer sends 1 wei of ETH for a 1000 USDC intent, the swap will attempt
      V3_SWAP_EXACT_OUT requesting 1000 USDC but with only 1 wei WETH available. The swap
      will revert with V3TooMuchRequested (amountIn would exceed maxAmountWillingToPay=1 wei).

      This is NOT a vulnerability — the swap simply reverts, no funds are lost. But it does
      mean the payer wastes gas on an impossible swap. The Uniswap router reverts cleanly.

      The interesting case: if msg.value is close to but slightly less than needed. The swap
      might succeed if the pool has enough liquidity at favorable price. The payer bears the
      price risk. Any unused ETH is swept back via UNWRAP_WETH + SWEEP (L613-614, L621-622).

      Actually more interesting: msg.value = 0 with neededAmount > 0. L403: neededAmount > 0
      is true, so swapTokens is called. L601: msg.value > 0 is false, so we enter the else
      branch (L623+). But tokenIn = wrappedNativeCurrency and maxAmountWillingToPay = msg.value = 0.
      L626: payerBalanceBefore = WETH.balanceOf(payer) + 0. L663: safeTransfer(router, 0) — transfers
      0 tokens. The swap with 0 input will revert. No loss, just wasted gas.
    severity: informational
    confidence: 85
    affected_functions:
      - "swapAndTransferUniswapV3Native (L384-410)"
      - "swapTokens (L561-718)"
    attack_scenario: |
      Not exploitable. Payer sending insufficient msg.value simply causes the Uniswap swap
      to revert with V3TooMuchRequested. No funds are lost or stuck. Transaction reverts
      atomically, and the swap error is surfaced via SwapFailedString.
    solidity_invariant: |
      // INV: swapAndTransferUniswapV3Native reverts cleanly when msg.value is insufficient
      // The swap's amountInMaximum = msg.value ensures automatic revert
      // No explicit invariant needed — enforced by Uniswap V3 router

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-04
    title: "swapTokens amountSwapped calculation: router pre-existing balance of tokenIn could inflate reported consumption"
    description: |
      In swapTokens, after the swap succeeds, the consumed amount is calculated as (L699):
        return (payerBalanceBefore + routerBalanceBefore) - (payerBalanceAfter + routerBalanceAfter)

      The code explicitly accounts for the router's pre-existing balance of tokenIn (L686-698).
      If the router already holds some tokenIn before the swap, the SWEEP command sends it to
      the payer. This means payerBalanceAfter increases by the router's pre-existing balance,
      and routerBalanceAfter decreases by the same. The sum (payerAfter + routerAfter) stays
      correct.

      But consider: between the balance snapshots (before) and the swap execution, another
      transaction could change the router's or payer's balance. This is a classic TOCTOU issue.
      In practice, this is within a single transaction (nonReentrant), so no external state
      change can occur between the snapshots and the swap.

      Potential issue: for ETH path (msg.value > 0), L602-603:
        payerBalanceBefore = _msgSender().balance + msg.value
        routerBalanceBefore = address(uniswap).balance + IERC20(wrappedNativeCurrency).balanceOf(address(uniswap))

      The payer's balance at L602 is already REDUCED by msg.value (since msg.value was sent to
      the Transfers contract). Adding msg.value back reconstructs the pre-tx balance. This is correct.

      The router balance includes BOTH native ETH and WETH at L603. After the swap, L692-694
      does the same. This is correct because WRAP_ETH converts ETH→WETH within the router,
      and UNWRAP_WETH converts back.

      Edge case: if the router receives ETH from another source during the multicall execution
      (e.g., via selfdestruct targeting the router address). This would increase routerBalanceAfter,
      making the return value larger (reporting MORE consumption). But the excess would be
      trapped in the router, not taken from the payer. The payer's emitted spentAmount would be
      inflated in the event, but no actual extra loss to the payer (they only sent msg.value).

      The Transferred event at L409 emits amountSwapped as spentAmount. An inflated spentAmount
      is a logging inaccuracy, not a fund loss. No funds are at risk.
    severity: informational
    confidence: 70
    affected_functions:
      - "swapTokens (L592-699)"
    attack_scenario: |
      1. Router has 1 ETH pre-existing balance (from previous incomplete swap or selfdestruct)
      2. Payer calls swapAndTransferUniswapV3Native sending 2 ETH
      3. payerBalanceBefore = payer.balance + 2 ETH. routerBalanceBefore = 1 ETH (+ WETH)
      4. Swap consumes 1.5 WETH. SWEEP returns 0.5 ETH + 1 ETH (router pre-existing) to payer
      5. payerBalanceAfter = payer.balance_original - 2 + 0.5 + 1 = payer.balance_original - 0.5
      6. routerBalanceAfter = 0
      7. Return: (payerOrig + 2 + 1) - (payerOrig - 0.5 + 0) = 3.5 — but actual consumed = 1.5
      8. Wait — re-checking: payerBalanceBefore = (payerOrig - 2) + 2 = payerOrig. routerBefore = 1.
         Sum before = payerOrig + 1.
         payerAfter = payerOrig - 2 + 0.5 + 1 = payerOrig - 0.5. routerAfter = 0.
         Sum after = payerOrig - 0.5.
         Return = (payerOrig + 1) - (payerOrig - 0.5) = 1.5. CORRECT.
      9. The formula correctly accounts for router pre-existing balance. No issue.
    solidity_invariant: |
      // INV: amountSwapped calculation correctly accounts for router pre-existing balance
      // (payerBefore + routerBefore) - (payerAfter + routerAfter) = actual amount consumed
      // Verified: the formula is algebraically correct even with router pre-existing balance

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-05
    title: "Single-hop swap path: no multi-hop routing means some token pairs may have no direct pool"
    description: |
      The swap path in swapTokens is always a single hop (L579):
        swapPath = abi.encodePacked(tokenOut, poolFeesTier, tokenIn)

      This means the swap ONLY works if a direct Uniswap V3 pool exists for the (tokenIn, tokenOut,
      poolFeesTier) combination. For exotic token pairs (e.g., DAI → COMP), there might not be a
      direct pool at any fee tier. The most liquid route would be DAI → WETH → COMP (multi-hop),
      but the contract doesn't support this.

      Impact: some valid payment intents cannot be fulfilled via swap functions. The payer must
      pre-swap externally and use transferToken instead. This is a functionality limitation, not
      a security vulnerability.

      However, from an oracle/price perspective: single-hop forces the swap through potentially
      thin pools. If the only available direct pool (e.g., 1% fee tier) has low liquidity, the
      payer suffers high slippage. A multi-hop route through deep pools (0.05% WETH pools) would
      give better execution. The protocol forces suboptimal price execution for the payer.

      The payer has two mitigations: (1) use a different fee tier, (2) swap externally and use
      transferToken. So this is a UX issue, not exploitable.
    severity: informational
    confidence: 90
    affected_functions:
      - "swapTokens (L579)"
    attack_scenario: |
      Not a direct attack. A payer trying to pay with an exotic token through a thin direct pool
      suffers high slippage. The payer controls maxWillingToPay so they can't lose more than they
      explicitly authorized. The limitation pushes sophisticated payers to external DEX aggregators
      plus transferToken, which is the better UX anyway.
    solidity_invariant: |
      // INV: swap path is always single-hop (tokenOut, fee, tokenIn)
      // No multi-hop routing — limitation but not invariant violation
      // Payer's slippage bounded by maxAmountWillingToPay

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-06
    title: "No TWAP oracle or price validation: swap executes at whatever spot price the pool offers"
    description: |
      The contract uses Uniswap V3's V3_SWAP_EXACT_OUT which executes at the current spot price
      of the selected pool. There is NO comparison against a TWAP oracle, Chainlink price feed,
      or any other price reference. The only protection is maxAmountWillingToPay (the amountInMaximum
      parameter for the swap).

      In a commerce context, the operator signs the intent with a specific recipientAmount in
      recipientCurrency (e.g., 100 USDC). The operator determines the price off-chain and creates
      the intent. The payer then chooses to pay with a different currency via swap.

      The absence of on-chain price validation means:
      1. A manipulated pool price only affects how much the payer spends (not what the recipient gets)
      2. The recipient is guaranteed exactly recipientAmount in recipientCurrency
      3. The payer's maxWillingToPay is the only slippage protection

      This is acceptable design for a commerce payment protocol: the merchant sets the price,
      the payer accepts or rejects. The swap is just a convenience feature. No oracle needed
      because the "oracle" is the operator's off-chain price determination.

      The risk model is: payer sandwich → payer loses (bounded by maxWillingToPay). The protocol
      and merchant are not exposed to price manipulation risk.
    severity: informational
    confidence: 90
    affected_functions:
      - "swapTokens (L561-718)"
      - "swapAndTransferUniswapV3Native (L384-410)"
      - "swapAndTransferUniswapV3Token (L413-455)"
      - "swapAndTransferUniswapV3TokenPreApproved (L458-502)"
    attack_scenario: |
      No direct attack on protocol. MEV sandwich of payer swaps is standard DEX interaction.
      1. Attacker sees payer's swap tx in mempool
      2. Front-runs to manipulate pool price
      3. Payer's EXACT_OUT swap consumes more input tokens (up to maxWillingToPay)
      4. Attacker back-runs to profit
      5. Recipient still gets exact recipientAmount. Merchant unaffected.
      6. Loss is payer's, bounded by their own maxWillingToPay setting.
    solidity_invariant: |
      // INV: no on-chain price oracle — by design for commerce payments
      // The operator determines price off-chain, recipient gets exact amount
      // Payer bears all swap price risk, bounded by maxWillingToPay
      // No invariant needed — this is architectural choice, not a bug

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-07
    title: "Arbitrary poolFeesTier: non-standard fee tiers could route through pools that don't exist, causing revert"
    description: |
      Uniswap V3 has standard fee tiers: 100 (0.01%), 500 (0.05%), 3000 (0.3%), 10000 (1%).
      The contract does NOT validate that poolFeesTier is one of these standard values. A caller
      can pass any uint24 value (e.g., 42, 9999, 16777215).

      If the pool for the given fee tier doesn't exist, the Uniswap router will revert with
      V3InvalidSwap. The contract catches this and emits SwapFailedString("V3InvalidSwap").
      No funds are lost — the entire transaction reverts atomically.

      But for the Native variant: the payer sent msg.value with the transaction. If the swap
      reverts (caught by try/catch at L667), the catch block reverts with SwapFailedString.
      Since this is a revert, ALL state changes are undone, including the msg.value transfer.
      The payer gets their ETH back. Correct behavior.

      For the Token variant: tokens were transferred to the contract (L439-444 or L491) and then
      to the router (L663). If the swap reverts inside the try/catch, the catch block reverts
      the entire transaction, so the permitTransferFrom and safeTransfer are also reverted.
      Correct behavior.

      No vulnerability — invalid fee tiers simply cause clean reverts.
    severity: informational
    confidence: 90
    affected_functions:
      - "swapAndTransferUniswapV3Native (L384)"
      - "swapAndTransferUniswapV3Token (L413)"
      - "swapAndTransferUniswapV3TokenPreApproved (L458)"
      - "swapTokens (L565, L579)"
    attack_scenario: |
      1. Payer calls swapAndTransferUniswapV3Native with poolFeesTier=42 (no such pool exists)
      2. Uniswap router tries to route through non-existent pool
      3. Router reverts with V3InvalidSwap error
      4. Transfers contract catches error, reverts with SwapFailedString("V3InvalidSwap")
      5. Payer's ETH is returned (transaction reverted atomically). No loss.
    solidity_invariant: |
      // INV: invalid poolFeesTier always causes clean revert (no stuck funds)
      // Guaranteed by try/catch + atomic revert in swapTokens
      // No funds can be stuck because catch block always reverts

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
  - id: OH-T-08
    title: "Token-to-native swap: UNWRAP_WETH amount uses neededAmount, could leave dust WETH in router"
    description: |
      For the token→ETH path (recipientCurrency == NATIVE_CURRENCY, msg.value == 0), the
      swap sequence at L631-643 is:
        V3_SWAP_EXACT_OUT → UNWRAP_WETH → TRANSFER (fee) → TRANSFER (recipient) → SWEEP

      The UNWRAP_WETH at L640 unwraps `neededAmount` of WETH to ETH:
        uniswap_inputs[1] = abi.encode(address(uniswap), neededAmount)

      The V3_SWAP_EXACT_OUT outputs exactly neededAmount of WETH (tokenOut = wrappedNativeCurrency,
      per L569-570). Then UNWRAP_WETH unwraps exactly neededAmount. The amounts match exactly.

      After UNWRAP_WETH, the router has neededAmount ETH. TRANSFER sends recipientAmount to
      fee destination (L642), TRANSFER sends recipientAmount to recipient (L643). Wait — L634
      uses collectFees for L642 and transferToRecipient for L643. collectFees encodes
      (recipientCurrency=NATIVE_CURRENCY, feeDestination, feeAmount). transferToRecipient encodes
      (recipientCurrency=NATIVE_CURRENCY, recipient, recipientAmount).

      recipientAmount + feeAmount = neededAmount. So all ETH is distributed. SWEEP at L644
      sweeps remaining tokenIn back to payer. No dust issue.

      Actually checking: the TRANSFER command for ETH uses the address(0) or specific encoding.
      The UniversalRouter's TRANSFER command calls Payments.pay(token, recipient, amount).
      For ETH (token=address(0) or Constants.ETH): it sends native ETH.

      The transfers sum to neededAmount, which equals the unwrapped amount. Clean — no dust.
    severity: informational
    confidence: 85
    affected_functions:
      - "swapTokens (L629-660)"
    attack_scenario: |
      No attack. The UNWRAP_WETH amount exactly matches the sum of TRANSFER amounts
      (recipientAmount + feeAmount = neededAmount). No WETH dust remains in the router
      from this operation. The SWEEP only sweeps leftover tokenIn, not WETH.
    solidity_invariant: |
      // INV: for token→ETH swaps, UNWRAP_WETH amount == recipientAmount + feeAmount
      // neededAmount = recipientAmount + feeAmount (L574)
      // UNWRAP_WETH input = neededAmount (L640)
      // All unwrapped ETH is distributed via two TRANSFERs

    solidity: |
      // Invariant placeholder — OracleHunter findings are informational/design analysis
      // No direct Solidity property test; verified via integration test
      function property_oracle_placeholder() public pure returns (bool) {
          return true; // By-design: exact-out swap, maxWillingToPay is slippage cap
      }
