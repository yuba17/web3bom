- hunter: TrustBoundaryHunter
  id: T-TB-FP-03
  reason: >
    Sweepable could steal in-flight funds — investigated but sweep
    functions are restricted to onlySweeper (set by owner). The
    contract processes payments atomically within a single tx
    (receive → forward), so funds should never sit in the contract
    between transactions. The sweeper is a safety mechanism for
    stuck funds, not a vulnerability. The only edge case is if a
    tx partially executes and leaves funds (which can't happen due
    to atomicity). Safe by design.
  investigated_at: '2026-03-27T00:00:00Z'
