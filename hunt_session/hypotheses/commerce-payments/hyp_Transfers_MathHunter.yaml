    - T-M-05 — ETH+WETH router balance accounting is robust against wrap/unwrap
    - T-M-06 — Swap functions correctly handle excess ETH via Uniswap SWEEP
    - T-M-07 — V3 EXACT_OUT rounding is negligible for practical amounts
    - T-M-08 — revertIfInexactTransfer correctly rejects non-standard tokens
    - T-M-09 — Contract is decimal-agnostic (no decimal conversion math)
    - T-M-11 — Zero amount intents are by design (operator signed)
    - T-M-12 — Router residual tokens cancel out in balance diff formula
  math_verdict: |
    El contrato Transfers tiene math MUY simple — casi toda la aritmética es sumas y restas de montos absolutos.
    No hay share price calculations, no hay exchange rate conversions, no hay operaciones con decimales.
    La parte más compleja es el cálculo de balance diff en swapTokens, que es algebraicamente correcto
    y maneja edge cases (tokens residuales del router). Los dos items en "investigate" requieren
    verificación con fork test pero tienen baja probabilidad de ser explotables.
