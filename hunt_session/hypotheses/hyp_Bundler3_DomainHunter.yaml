# ═══════════════════════════════════════════════════════════════════════
# DOMAIN HUNTER — Análisis Consolidado de Bundler3 + Todos los Adapters
# ═══════════════════════════════════════════════════════════════════════
#
# MODELO DE PROTOCOLO:
#   Bundler3 es un multicall stateless con transient storage (EIP-1153).
#   - El usuario llama multicall(Call[]) con ETH opcional
#   - Cada Call puede ir a CUALQUIER address (adapter, EOA, contrato externo)
#   - initiator = msg.sender se guarda en transient storage
#   - Los adapters verifican msg.sender == BUNDLER3 (onlyBundler3)
#   - Los adapters usan initiator() para identificar al usuario original
#   - Patrón de callbacks: callbackHash + reenter() para Morpho callbacks
#   - Los tokens fluyen: user → adapter → protocolo externo → adapter → user
#   - El adapter es un TRANSIT POINT: nunca debe retener fondos entre txs
#
# SUPERFICIE CLAVE IDENTIFICADA (nuevas hipótesis, no duplicadas):
#   1. CompoundV2 wMulDown delta — received calculado vs real
#   2. stETH 1-2 wei rounding en stakeEth transfer
#   3. erc20WrapperWithdrawTo double-transfer + permissioned wrapper interaction
#   4. Cross-adapter token flow con fee-on-transfer tokens
#   5. AaveV3 repay approval residual — cap delegado a Aave vs explicit
#   6. Bundler3 arbitrary call target — el contrato puede llamar CUALQUIER address
#   7. msg.value reuse dentro de un mismo bundle
#   8. morphoBorrow/Withdraw usa initiator — authorization delegation risk
#   9. CompoundV2 repay — wMulDown + borrowBalanceCurrent race
#  10. Paraswap Augustus upgrade/registry manipulation
#
# ═══════════════════════════════════════════════════════════════════════

