# La approval se da por max, Aave usa solo lo necesario, luego se revoca.
# Los tokens excedentes quedan en el adapter como residual.
#
# CONTRASTE con CompoundV2: compoundV2RepayErc20 hace el cap EXPLÍCITO
# en el adapter: amount = min(amount, borrowBalanceCurrent(onBehalf)).
# CompoundV3 también lo hace. SOLO AaveV3 (y AaveV2) delegan el cap.
#
# RIESGO: si Aave V3 NO caps correctamente y toma más tokens de los
# debidos, el adapter pierde tokens de otro usuario. PERO Aave V3 es
# un protocolo auditado y caps correctamente. Riesgo minúsculo.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-07
  tier: 2
  type: property
  description: >
    aaveV3Repay delega el cap de amount a Aave V3 internamente (no hay
    min(amount, debt) explícito en el adapter). Si Aave V3 no caps
    correctamente, el adapter sobre-paga. Contraste: CompoundV2/V3
    adapters SÍ hacen el cap explícito. Esta asimetría es un code smell.
  attack_scenario: >
    1. Adapter tiene 1000 USDC de un paso previo del bundle.
    2. onBehalf tiene solo 500 USDC de deuda en Aave V3.
    3. aaveV3Repay(USDC, max, 2, onBehalf) → amount = 1000 USDC.
    4. AAVE_V3.repay(USDC, 1000, 2, onBehalf) — Aave caps at 500.
    5. Aave solo toma 500. 500 USDC quedan en el adapter.
    6. Estos 500 USDC son drenables por el siguiente usuario en el bundle
       (si hay más calls) o quedan como dust.
    NOTA: esto no es un exploit per se — el adapter es un transit point
    y los tokens residuales son "fair game". Pero si el usuario esperaba
    que aaveV3Repay(max) consumiera todo y luego otra call usara amount=max,
    puede haber un misallocation.
  impact: "Tokens residuales en adapter tras repay parcial de Aave V3 — misallocación potencial"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Pre-repay: track balance
    uint256 balBefore = IERC20(token).balanceOf(address(adapter));
    // Execute aaveV3Repay(token, amount, rateMode, onBehalf)
    uint256 balAfter = IERC20(token).balanceOf(address(adapter));
    uint256 actualRepaid = balBefore - balAfter;
    // Invariante: actualRepaid == min(amount, debt)
    // Si amount fue max: actualRepaid debería ser min(balBefore, debt)
    uint256 expectedRepaid = MorphoUtilsLib.min(amount, debtAmount);
    eq(actualRepaid, expectedRepaid, "BD-D-07: AaveV3 repay amount mismatch");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Aave V3 caps correctamente (confirmado en su código: _repay caps at
    current debt). Los tokens excedentes quedan en el adapter, lo cual
    es by design del transit-point model. Severity baja.

# ─────────────────────────────────────────────────────────────────────
# BD-D-08: PARASWAP AUGUSTUS REGISTRY — UPGRADE/MANIPULATION RISK
# ─────────────────────────────────────────────────────────────────────
# ParaswapAdapter.swap() L174:
#   require(AUGUSTUS_REGISTRY.isValidAugustus(augustus), ...);
#   forceApprove(srcToken, augustus, max);
#   augustus.call(callData);
#   forceApprove(srcToken, augustus, 0);
#
# AUGUSTUS_REGISTRY es immutable. Pero el registry contract ITSELF puede
# tener funciones que añadan/remuevan Augustus addresses. Si el owner
# del registry añade un Augustus malicioso, ese Augustus puede drenar
# cualquier srcToken del adapter.
#
# El adapter da forceApprove(max) ANTES del call. El Augustus malicioso
# puede llamar srcToken.transferFrom(adapter, attacker, balance) dentro
# de su "swap" function, luego retornar normalmente.
# El post-swap check verifica srcAmount <= maxSrcAmount, pero el Augustus
# malicioso podría inflar destToken balance del adapter (vía transfer
# directo) para pasar ambos checks.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-08
  tier: 1
  type: property
  description: >
    Un Augustus registrado en el AugustusRegistry tiene max approval del
    adapter durante el swap. Si un Augustus registrado es malicioso o
    se compromete, puede drenar todos los srcTokens del adapter.
    El riesgo es la supply chain del registry: quién puede registrar
    nuevos Augustus contracts y si ese proceso es seguro.
  attack_scenario: >
    1. Owner del AugustusRegistry registra un nuevo Augustus contract
       (upgrade legítimo o compromiso de la key del owner).
    2. El nuevo Augustus contiene: function swap(...) { srcToken.transferFrom(adapter, attacker, balance); }
    3. Cualquier usuario que use sell/buy con este Augustus pierde sus tokens.
    4. El adapter da forceApprove(srcToken, augustus, max) antes del call.
    5. El Augustus malicioso llama transferFrom antes de que el adapter revoque.
    6. Post-swap: srcAmount = srcInitial - srcFinal = srcInitial (todo drenado).
       srcAmount <= maxSrcAmount? Si maxSrcAmount era alto (sellEntireBalance), pasa.
       destAmount = destFinal - destInitial >= minDestAmount?
       Augustus puede transferir destTokens al adapter para pasar este check.
    7. Net: usuario pierde srcTokens, recibe destTokens inflados por Augustus.
    MITIGACIÓN: Los checks post-swap (srcAmount <= maxSrcAmount Y destAmount >= minDestAmount)
    ofrecen protección parcial. Pero un Augustus malicioso controla ambos.
  impact: "Drain total de srcTokens del adapter si un Augustus registrado es malicioso"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: isValidAugustus solo retorna true para contratos verificados
    // Este invariante es externo al adapter — depende del registry
    // On-chain: verificar que el Augustus que se usa es el oficial Paraswap
    // No hay forma de forzar esto en el adapter — es trust en el registry
    t(AUGUSTUS_REGISTRY.isValidAugustus(augustus), "BD-D-08: Augustus not registered");
    // Este check ya existe. El riesgo es si el registry es comprometido.
  ghost_vars: []
  validated: false
  priority: high
  confidence: 35
  notes: >
    Este es un trust boundary issue más que un vulnerability del adapter.
    El adapter confía en el registry, que confía en su owner. Si el owner
    es un multisig seguro o un governance contract, el riesgo es bajo.
    Si el owner es un EOA, el riesgo es medio. Verificar el owner del
    AugustusRegistry en mainnet. NOTA: esto es un known trust assumption
    y probablemente está documentado. Pero si el adapter asume que todos
    los Augustus registrados son benignos, es una dependencia de seguridad
    importante que debería mencionarse.

# ─────────────────────────────────────────────────────────────────────
# BD-D-09: FEE-ON-TRANSFER TOKEN — SYSTEMIC ISSUE ACROSS ALL ADAPTERS
# ─────────────────────────────────────────────────────────────────────
# Múltiples funciones usan type(uint256).max → balanceOf(address(this))
# para determinar el amount a operar. Si el token cobra fee-on-transfer,
# el balance del adapter tras un transferFrom del initiator es MENOR que
# el amount transferido. Esto afecta a:
#   - morphoSupply (L191-193): assets = balanceOf(adapter)
#   - morphoSupplyCollateral (L220): assets = balanceOf(adapter)
#   - morphoRepay (L275-277): assets = balanceOf(adapter)
#   - erc4626Deposit (L83): assets = balanceOf(adapter)
#   - wrapNative (L391): amount = address(this).balance
#
# Para tokens con fee, el flow es:
#   Call 1: erc20TransferFrom(token, adapter, 1000) → adapter recibe 990 (1% fee)
#   Call 2: morphoSupply(market, max, ...) → assets = balanceOf = 990
#   morphoSupply aprueba MORPHO para max, MORPHO toma 990. Correcto.
#
# PERO: para funciones que NO usan max:
#   Call 1: erc20TransferFrom(token, adapter, 1000) → adapter recibe 990
#   Call 2: morphoSupply(market, 1000, ...) → MORPHO.supply intenta tomar 1000
#           pero adapter solo tiene 990. REVIERTE.
#
# ¿El adapter maneja esto? NO — no hay check para fee-on-transfer.
# El patrón max es la salvación pero no se enforcea.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-09
  tier: 1
  type: property
  description: >
    Fee-on-transfer tokens causan discrepancia entre amount transferido
    y amount recibido en el adapter. Funciones que usan amount fijo (no max)
    fallan porque el adapter tiene menos tokens de los esperados.
    Funciones con max pasan correctamente pero el usuario pierde la fee.
  attack_scenario: >
    1. Token USDT-like con 0.1% fee en cada transfer.
    2. Bundle: [erc20TransferFrom(USDT, adapter, 10000), morphoSupply(market, 10000, ...)].
    3. erc20TransferFrom: USDT.transferFrom(initiator, adapter, 10000) → adapter recibe 9990.
    4. morphoSupply con assets=10000: forceApprove(USDT, MORPHO, max), MORPHO.supply(10000, ...).
    5. MORPHO intenta transferFrom(adapter, pool, 10000) → REVIERTE: adapter solo tiene 9990.
    6. Bundle completo falla. El usuario no puede supply.
    MITIGACIÓN PARCIAL: usar assets=max → supply 9990, que pasa correctamente.
    Pero el frontend debe saber que el token cobra fee y ajustar.
    VECTOR DE PÉRDIDA: si el usuario no usa max y hay skipRevert=true en el supply call,
    el supply falla silently y los 9990 USDT quedan en el adapter como residual.
  impact: "DoS para fee-on-transfer tokens con amounts fijos; residuales con skipRevert"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante: para fee-on-transfer tokens, usar amount fijo en operaciones
    // downstream es peligroso. El balance real es menor.
    uint256 balanceBefore = IERC20(token).balanceOf(address(adapter));
    // erc20TransferFrom(token, adapter, amount)
    uint256 balanceAfter = IERC20(token).balanceOf(address(adapter));
    uint256 actualReceived = balanceAfter - balanceBefore;
    // Para fee-on-transfer: actualReceived < amount
    // Si el siguiente step usa `amount` (not max), REVERT
    eq(actualReceived, amount, "BD-D-09: fee-on-transfer discrepancy");
  ghost_vars:
    - "mapping(address => uint256) internal ghost_feeOnTransferDelta;"
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Fee-on-transfer es un tema conocido en DeFi. Morpho Blue itself maneja
    fee-on-transfer en algunos paths. La pregunta es si el adapter/bundler
    debería también manejarlo o si es responsabilidad del frontend. La
    respuesta estándar en la industria es "by design, usar max". Pero el
    DoS cuando el usuario usa amount fijo es real. Probablemente known issue.

# ─────────────────────────────────────────────────────────────────────
# BD-D-10: PARASWAP sell/buy SON EXTERNAL SIN onlyBundler3 DIRECTO
# ─────────────────────────────────────────────────────────────────────
# ParaswapAdapter: sell() y buy() son external/public SIN onlyBundler3.
# Solo swap() interno tiene onlyBundler3. Esto ya fue reportado como
