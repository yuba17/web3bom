# ─────────────────────────────────────────────────────────────────────
# BD-D-15: CompoundV2 REPAY — borrowBalanceCurrent SIDE EFFECT
# ─────────────────────────────────────────────────────────────────────
# CompoundV2MigrationAdapter.compoundV2RepayErc20() L46:
#   amount = MorphoUtilsLib.min(amount, ICToken(cToken).borrowBalanceCurrent(onBehalf));
#
# borrowBalanceCurrent() es una función que ACCRUE INTEREST internamente
# en Compound V2 (llama accrueInterest). Esto modifica el estado de
# Compound V2 ANTES del repay. Es un side effect esperado.
#
# PERO: si el bundle tiene múltiples calls que interactúan con Compound V2
# (e.g., repay de múltiples cTokens), el accrueInterest de uno puede
# afectar el interest rate de otro (si comparten la misma Comptroller
# y hay efectos de utilización cruzada).
#
# ¿Es explotable? En un bundle atómico, un atacante no puede intervenir
# entre calls. Pero el ORDER de las calls importa: repagar un mercado
# primero puede cambiar la utilización y afectar el interest de otro
# mercado. Esto es un edge case de UX, no un exploit.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-15
  tier: 2
  type: property
  description: >
    borrowBalanceCurrent() en CompoundV2 adapter accrue interest como
    side effect. En bundles con múltiples repays de Compound V2, el
    orden de los calls puede afectar los amounts por interest accrual.
    No es explotable pero puede causar diferencias vs lo esperado.
  attack_scenario: >
    1. Bundle: [compoundV2Repay(cUSDC, max, user), compoundV2Repay(cDAI, max, user)].
    2. Primera call: borrowBalanceCurrent(cUSDC) accrue interest → deuda USDC sube 1 wei.
    3. Repay USDC completo con los tokens disponibles.
    4. Segunda call: borrowBalanceCurrent(cDAI) accrue interest → deuda DAI sube 1 wei.
    5. Si los tokens DAI enviados al adapter eran EXACTAMENTE la deuda pre-accrual,
       ahora hay 1 wei short. min(balance, debt) = balance. Se paga balance, queda 1 wei de debt.
    6. No es un exploit, es un edge case de timing. Resuelto pasando unos wei extra.
  impact: "Dust debt residual tras múltiples repays CompoundV2 — sub-wei impact"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante: después de compoundV2Repay con max, la deuda del onBehalf es 0
    uint256 remainingDebt = ICToken(cToken).borrowBalanceCurrent(onBehalf);
    eq(remainingDebt, 0, "BD-D-15: dust debt after compound V2 repay with max");
    // NOTA: puede fallar por 1-2 wei de accrual — tolerance de 2 wei
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    Low severity — dust debt from interest accrual. El adapter ya caps
    con min(amount, debt), que es correcto. El timing issue solo causa
    1-2 wei de diferencia. Probablemente known.

# ─────────────────────────────────────────────────────────────────────
# BD-D-16: CROSS-ADAPTER FLOW — SWAP → SUPPLY con SLIPPAGE MISMATCH
# ─────────────────────────────────────────────────────────────────────
# Patrón típico de uso:
#   Call 1: permit2TransferFrom(WETH, adapter, 10e18)
#   Call 2: paraswap.sell(augustus, callData, WETH, USDC, true, offsets, adapter)
#   Call 3: morphoSupply(market_USDC, max, 0, maxSharePriceE27, user, "")
#
# RIESGO: el sell() tiene su propio slippage check (minDestAmount).
# morphoSupply tiene su propio slippage check (maxSharePriceE27).
# Pero NO hay un check end-to-end: "¿cuántos shares de Morpho obtuve
# por mis 10 ETH originales?"
#
# Un atacante con MEV puede:
#   - Sandwich el swap para minimizar USDC recibido (justo arriba de minDestAmount)
#   - Manipular el share price de Morpho para maximizar assets/share ratio
#   - Resultado: el usuario obtiene mucho menos value de lo esperado
#
# Cada check individual pasa, pero el resultado combinado es malo.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-16
  tier: 1
  type: property
  description: >
    Cross-adapter bundles (swap → supply, swap → repay) tienen slippage
    checks independientes en cada paso pero NO end-to-end. Un MEV
    attacker puede sandwich ambos pasos por separado, cada uno justo
    dentro del slippage limit, causando pérdida acumulada al usuario.
  attack_scenario: >
    1. Usuario quiere: 10 ETH → swap a USDC → supply a Morpho vault.
    2. Slippage sell: minDestAmount = 25000 USDC (esperados ~27000 a precio justo).
    3. Slippage supply: maxSharePriceE27 = 1.01e27 (1% tolerance).
    4. MEV attacker sandwiches el swap: usuario recibe 25001 USDC (just above min).
    5. MEV attacker manipula Morpho vault share price: assets/share = 1.009e27 (just below max).
    6. Ambos checks pasan. Pero el usuario perdió ~2000 USDC en el swap + ~0.9% en supply.
    7. Pérdida total: ~$2225 en un swap de ~$27000 (8.2%).
    8. Sin un check end-to-end "mis 10 ETH deben producir al menos X shares de Morpho",
       el usuario no tiene protección contra esta pérdida acumulada.
  impact: "Pérdida acumulada de slippage en bundles multi-step sin protección end-to-end"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante end-to-end: shares recibidas en Morpho / ETH enviados >= minEndToEndPrice
    // Este invariante requiere ghost tracking del input original y output final
    uint256 ethSent = ghost_ethInputForBundle;
    uint256 sharesReceived = ghost_morphoSharesReceived;
    // property: sharesReceived / ethSent >= minAcceptableRatio
    // NOTA: esto no se puede enforcer on-chain sin un check explícito en el bundle
    // El usuario debería añadir una Call final que verifique su posición final
  ghost_vars:
    - "uint256 internal ghost_ethInputForBundle;"
    - "uint256 internal ghost_morphoSharesReceived;"
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Este es un design limitation inherente a multicall bundlers. Cada adapter
    solo conoce su propia operación, no el bundle completo. La solución
    standard es que el frontend añada un "assert" call al final del bundle
    que verifique el resultado end-to-end. Si Bundler3 no ofrece esta
    funcionalidad de "assert final state", es un gap de UX/seguridad.
    Verificar si hay una función de assertion disponible en algún adapter.
    Probablemente known limitation.

false_positives:
- hunter: DomainHunter
  id: BD-FP-01
  reason: >
    Investigado: "adapter permanent MORPHO approval exploitation" — DESCARTADO.
    La approval del adapter a MORPHO es permanente pero solo usable por MORPHO
    en el contexto de sus propias operaciones (supply, repay, flashloan repayment).
    No hay path donde un tercero pueda triggerear MORPHO para drenar el adapter
    usando esa approval. MORPHO.supply/repay usa transferFrom(msg.sender), no
    transferFrom(adapter). Solo cuando el adapter ES msg.sender (via morphoSupply
    etc.) la approval se usa, y esas funciones tienen onlyBundler3.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: trust.md
    content: >
      Approval permanente de adapter a protocolo trusted (como Morpho Blue)
      es safe porque el protocolo solo usa la approval en contextos controlados
      (supply, repay, flashloan repayment). No confundir con approval a
      contratos no confiables.
    briefing_update_applied: false

- hunter: DomainHunter
  id: BD-FP-02
  reason: >
    Investigado: "msg.value reuse/amplification via selfdestruct" — DESCARTADO.
    Conservation of ETH impide amplificación. selfdestruct devuelve el mismo
    ETH enviado, no más. Bundler3 no tiene receive() pero selfdestruct ignora
    eso. El resultado neto es neutral — no hay ganancia para el atacante.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: BD-FP-03
  reason: >
    Investigado: "initiator spoofing via arbitrary call in bundle" — DESCARTADO.
    Las calls en el bundle salen de msg.sender=Bundler3, no del initiator.
    Approvals vía bundle calls solo afectan a Bundler3 (que no debería tener fondos).
    initiator() en adapters lee de Bundler3.initiator (transient), que solo se
    modifica en multicall() con require(initiator==0) + msg.sender.
    No hay path para spoofear initiator.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: BD-FP-04
  reason: >
    Investigado: "ERC4626 vault malicioso reentrancia via callback" — DESCARTADO.
    El vault recibe la call desde el adapter. El vault no puede reentrar porque:
    (1) multicall() bloquea con AlreadyInitiated; (2) reenter() usa hash(to, H)
    donde to=adapter, no vault; (3) adapter functions tienen onlyBundler3.
    El modelo de protección es robusto para todos los niveles de anidamiento.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: multicall.md
    content: >
      Bundler3 reenter model: callbackHash usa hash(to, H) donde `to` es el
      target de la Call en el bundle, NO el contrato que recibe la sub-call.
      Un vault malicioso pasado a erc4626Deposit no puede reentrar porque
      msg.sender sería el vault (no el adapter = to). Triple protección:
      AlreadyInitiated + IncorrectReenterHash + onlyBundler3.
    briefing_update_applied: false
