  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: Known issue confirmado. No re-reportar.

# ─────────────────────────────────────────────────────────────────────
# BD-D-11: BUNDLER3 OPEN CALL TARGET — SOCIAL ENGINEERING VECTOR
# ─────────────────────────────────────────────────────────────────────
# Bundler3._multicall() hace to.call{value}(data) donde `to` es
# CUALQUIER address. El contrato puede llamar a:
#   - Adapters (diseñados para esto)
#   - Tokens ERC20 (e.g., approve, transfer)
#   - Cualquier otro contrato
#
# Un bundle puede incluir calls a ERC20.approve(attacker, max).
# Si el initiator firma este bundle sin verificarlo, da approval
# al atacante para todos sus tokens.
#
# WAIT: la call sale de BUNDLER3, no del initiator. Así que
# ERC20.approve(attacker, max) daría approval de BUNDLER3 a attacker.
# BUNDLER3 no debería tener balance de tokens (transit), así que
# la approval es inútil. Pero si Bundler3 tiene tokens residuales
# (B-D-01), el atacante podría drenarlos.
#
# ¿Y los adapters? Las calls van del Bundler3 AL adapter. El adapter
# no da approvals a terceros excepto en patrones controlados
# (forceApprove → call → forceApprove(0)).
#
# VECTOR ALTERNATIVO: un bundle con Call.to = initiator's token contract
# y Call.data = approve(attacker, max) NO funciona porque msg.sender
# es Bundler3, no el initiator. El approve sería de Bundler3.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-11
  tier: 2
  type: property
  description: >
    Bundler3 puede hacer calls arbitrarias a cualquier contrato. Las
    calls salen de msg.sender=Bundler3, no del initiator. Approvals
    o autorizaciones via bundle calls solo afectan a Bundler3, no al
    usuario. Bundler3 no debería tener fondos, así que esto es neutral.
  attack_scenario: >
    Un bundle malicioso con [Call(to: USDC, data: approve(attacker, max))]
    da approval de BUNDLER3 (no del usuario) a attacker. Si Bundler3 tiene
    USDC residual, attacker puede drenarlos. Pero Bundler3 no debería
    tener balance. Y si tiene (B-D-01), ya es extraíble sin este vector.
  impact: "Approval de Bundler3 a terceros — solo relevante si Bundler3 tiene residual"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Post-multicall: verificar que Bundler3 no tiene approvals inesperadas
    // (esto es más un monitoring concern que un invariant fuzzeable)
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    El comment del contrato lo dice: "it should not be approved/authorized
    anywhere". El diseño es que Bundler3 es un proxy sin estado. Las
    approvals de Bundler3 no deberían importar. Confirmado safe.

# ─────────────────────────────────────────────────────────────────────
# BD-D-12: ERC4626 VAULT MALICIOSO + CALLBACK REENTRANCY
# ─────────────────────────────────────────────────────────────────────
# GeneralAdapter1.erc4626Deposit() aprueba vault para max, luego llama
# vault.deposit(assets, receiver). Si vault es malicioso:
#   - vault.deposit() puede hacer RE-ENTER: llamar Bundler3.multicall()
#     WAIT: multicall() requiere initiator == address(0). Pero initiator
#     ya está seteado (estamos dentro de un bundle). Así que multicall()
#     revierte con AlreadyInitiated.
#   - vault.deposit() puede llamar Bundler3.reenter()? Solo si
#     reenterHash coincide. El call a erc4626Deposit NO tiene
#     callbackHash (en el bundle call struct). Si callbackHash == 0,
#     reenterHash = 0 tras L60. Así que reenter() fallaría con
#     IncorrectReenterHash (reenterHash is 0, not matching any hash).
#   - vault.deposit() puede llamar al adapter directamente? Las funciones
#     del adapter tienen onlyBundler3 → msg.sender sería el vault, no
#     Bundler3 → revierte.
#   - vault.deposit() puede llamar a MORPHO directamente? Sí, pero
#     como msg.sender del vault, no del adapter. No puede usar la
#     approval del adapter.
#
# CONCLUSIÓN: un vault malicioso dentro de erc4626Deposit() NO puede
# reentrar al Bundler3 ni al adapter. La protección es robusta:
# 1. multicall() → AlreadyInitiated
# 2. reenter() → IncorrectReenterHash (si callbackHash=0)
# 3. adapter functions → UnauthorizedSender
#
# EXCEPCIÓN: Si el Call que invoca erc4626Deposit tiene callbackHash != 0,
# entonces reenterHash está seteado y el vault PODRÍA llamar reenter()
# con el bundle correcto. PERO el vault necesitaría conocer el exact
# callbackHash, que el usuario define en el bundle. Si el usuario pone
# callbackHash en un call a erc4626Deposit con un vault no confiable,
# es un error del usuario.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-12
  tier: 1
  type: property
  description: >
    Un vault ERC4626 malicioso pasado a erc4626Deposit/Mint NO puede
    reentrar al Bundler3 ni al adapter durante la ejecución del deposit.
    El modelo de protección (initiator lock + reenterHash + onlyBundler3)
    es suficiente EXCEPTO si el Call tiene callbackHash != 0, en cuyo
    caso el vault podría triggear un reenter con datos arbitrarios.
  attack_scenario: >
    CASO SEGURO (callbackHash == 0):
    1. Bundle: [{to: adapter, data: erc4626Deposit(malVault, max, ...), callbackHash: 0}]
    2. reenterHash = 0 (L60). malVault.deposit() se ejecuta.
    3. malVault intenta: Bundler3.multicall() → AlreadyInitiated.
    4. malVault intenta: Bundler3.reenter() → IncorrectReenterHash.
    5. malVault intenta: adapter.morphoSupply() → UnauthorizedSender.
    6. No hay reentrancia posible.

    CASO PELIGROSO (callbackHash != 0 + vault = callee):
    1. Bundle: [{to: adapter, data: erc4626Deposit(malVault, max, ...), callbackHash: H}]
    2. WAIT: callbackHash se computa con hash(to, callbackHash). to = adapter, no malVault.
    3. reenterHash = hash(adapter, H). malVault necesita msg.sender = adapter para reenter.
    4. malVault no es el adapter → no puede satisfacer msg.sender check en reenter().
    5. SEGURO: el callbackHash usa `to` (adapter) no el vault.
  impact: "Confirmación de que el modelo de protección bloquea reentrancia de vaults maliciosos"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: vault malicioso intenta reentrar durante deposit
    // El revert esperado es AlreadyInitiated o IncorrectReenterHash
    // Este es un test unitario, no un invariante de fuzzing
    // INVARIANTE: post-erc4626Deposit, el adapter NO fue reentered
    bytes32 postHash = IBundler3(BUNDLER3).reenterHash();
    // Si callbackHash era 0: reenterHash debe ser 0 (fue seteado a 0 en L60)
    // Si callbackHash era != 0: reenterHash debe ser 0 (callback consumió el hash)
    eq(uint256(postHash), 0, "BD-D-12: reenterHash not cleared — unexpected reenter");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 80
  notes: >
    El análisis muestra que el modelo es seguro. El callbackHash usa
    hash(to, H) donde to es el adapter (no el vault), así que el vault
    no puede satisfacer la verificación de reenter(). Confidence 80%
    de que es seguro, 20% reservado para edge cases con nested callbacks
    donde el adapter llama al vault que llama a MORPHO que hace callback
    al adapter que llama reenter. Necesita fuzzing para confirmar.

# ─────────────────────────────────────────────────────────────────────
# BD-D-13: permit2TransferFrom — INITIATOR BALANCE ASSUMPTION
# ─────────────────────────────────────────────────────────────────────
# GeneralAdapter1.permit2TransferFrom() L355-363:
#   address initiator = initiator();
#   if (amount == type(uint256).max) amount = IERC20(token).balanceOf(initiator);
#   Permit2Lib.PERMIT2.transferFrom(initiator, receiver, amount.toUint160(), token);
#
# Si el initiator tiene una cantidad ENORME de tokens (> type(uint160).max),
# toUint160() truncaría el amount. WAIT: SafeCast160 revierte en overflow.
# Así que si balanceOf > type(uint160).max, la tx revierte.
#
# ¿Puede balanceOf > type(uint160).max? type(uint160).max es ~1.46e48.
# Para tokens de 18 decimales, eso es ~1.46e30 tokens. Improbable.
# Para tokens de 0 decimales (raro), eso es ~1.46e48 tokens. Improbable.
#
# TAMBIÉN: receiver puede ser CUALQUIER address (no solo adapter o initiator).
# permit2TransferFrom(token, attackerAddr, max) transferiría todos los tokens
# del initiator al atacante, si el initiator aprobó Permit2 y Permit2 aprobó
# al adapter. PERO: el initiator (msg.sender) es quien llama multicall.
# Si el initiator firma un bundle con receiver=attacker, es culpa del initiator.
#
# No hay forma de que un tercero haga esto sin que el initiator lo firme.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-13
  tier: 2
  type: property
  description: >
    permit2TransferFrom con receiver libre permite enviar tokens del
    initiator a cualquier address. El initiator controla el bundle,
    así que no hay exploit directo. SafeCast160 previene truncación.
  attack_scenario: >
    1. Initiator firma bundle: [permit2TransferFrom(USDC, attacker, max)].
    2. Permit2 transfiere todo el USDC del initiator al attacker.
    3. PERO: el initiator firmó este bundle voluntariamente.
    4. No es un bug — es el initiator transfiriendo sus propios fondos.
    5. Para smart wallets con relayers: el relayer podría inyectar esto,
       pero la misma lógica que BD-D-06 aplica (trust en relayer).
  impact: "Token drain via permit2TransferFrom — pero requiere que el initiator firme el bundle"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: receiver en permit2TransferFrom debería ser adapter o initiator
    // Pero esto limitaría funcionalidad legítima
    // Monitoring: contar transfers a addresses que no son adapter/initiator
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    By design. El initiator tiene control total del bundle. permit2TransferFrom
    con receiver libre es una feature, no un bug. La seguridad depende de
    que el initiator verifique el bundle antes de firmar.

# ─────────────────────────────────────────────────────────────────────
# BD-D-14: MORPHO CALLBACK DATA INJECTION VIA REENTER
# ─────────────────────────────────────────────────────────────────────
# GeneralAdapter1.morphoCallback() L416-421:
#   require(msg.sender == address(MORPHO), ...);
#   reenterBundler3(data);
#
# `data` viene del callback de Morpho. ¿Quién controla `data`?
# El initiator lo pasa en el bundle: morphoSupply(..., data=callbackBundle).
# Morpho lo pasa transparentemente al callback. El adapter lo pasa a
# Bundler3.reenter().
#
# PERO: ¿Morpho modifica `data` antes del callback? NO — Morpho pasa
# los bytes tal cual. Así que `data` es exactamente lo que el initiator
# puso en el bundle.
#
# RIESGO: si callbackHash (en el Call struct del bundle) no coincide con
# keccak256(data), reenter() revierte. El initiator DEBE pre-computar
# el hash correctamente. Si hay un error en la computación del hash
# (e.g., encoding discrepancy), el bundle falla.
#
# ¿PUEDE MORPHO MODIFICAR DATA? En Morpho Blue, los callbacks
# (onMorphoSupply, etc.) pasan `data` tal cual de la función original.
# No hay modificación. PERO: Morpho agrega el `assets` como primer
# parámetro del callback: onMorphoSupply(uint256 assets, bytes data).
# El adapter ignora `assets` (L145: onMorphoSupply(uint256, bytes calldata data)).
# `data` es el segundo parámetro, sin modificar.
#
# CONCLUSIÓN: No hay injection. data es controlado por el initiator y
# pasa sin modificación a través de Morpho.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-14
  tier: 2
  type: property
  description: >
    morphoCallback pasa `data` transparentemente a Bundler3.reenter().
    `data` es controlado por el initiator y no modificado por Morpho.
    El callbackHash en el Call struct debe coincidir con keccak256(data)
    para que reenter() funcione.
  attack_scenario: >
    No hay injection posible. Morpho pasa `data` sin modificar.
