# ─────────────────────────────────────────────────────────────────────
# BD-D-01: stETH 1-2 WEI ROUNDING — stakeEth transfiere `amount` no `received`
# ─────────────────────────────────────────────────────────────────────
# EthereumGeneralAdapter1.stakeEth() L112-115:
#   uint256 sharesReceived = IStEth(ST_ETH).submit{value: amount}(referral);
#   require(amount.rDivUp(sharesReceived) <= maxSharePriceE27, ...);
#   if (receiver != address(this)) SafeERC20.safeTransfer(IERC20(ST_ETH), receiver, amount);
#
# PROBLEMA: stETH tiene un CONOCIDO 1-2 wei rounding issue donde
# balanceOf() puede devolver 1-2 wei menos que el amount depositado.
# El código transfiere `amount` (el ETH depositado), NO el balance real
# de stETH recibido. Si Lido devuelve amount-1 de stETH (por rounding),
# el safeTransfer de `amount` falla si no hay dust previo en el adapter.
#
# ANÁLISIS LÍNEA POR LÍNEA:
#   L112: submit{value: amount}(referral) → deposita ETH, recibe stETH
#   L115: safeTransfer(stETH, receiver, amount) → transfiere `amount`
#   stETH internamente usa shares para representar balance. balanceOf()
#   puede devolver amount - 1 wei por truncación. Si el adapter no
#   tenía stETH previo, tiene exactamente lo que recibió del submit.
#   Si recibió amount - 1 de stETH, transferir `amount` REVIERTE.
#
# CONTRAARGUMENTO: Lido's submit() returns stETH 1:1 con ETH for new
# deposits (antes de rebases). El rounding issue es en transferencias
# posteriores, no en el mint. Pero hay edge cases con rebases activos.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-01
  tier: 1
  type: property
  description: >
    stakeEth() transfiere `amount` de stETH al receiver, pero stETH tiene
    un conocido 1-2 wei rounding issue. Si el adapter recibe amount-1 de
    stETH tras el submit(), el safeTransfer de `amount` revierte. Esto es
    un DoS para bundles que usan stakeEth con receiver != address(this).
  attack_scenario: >
    1. Usuario envía bundle con stakeEth(10 ETH, maxPrice, referral, userAddress).
    2. submit() deposita 10 ETH, adapter recibe 9999999999999999999 wei de stETH
       (10e18 - 1 por rounding interno de Lido).
    3. safeTransfer(stETH, user, 10e18) intenta transferir 10e18 pero el adapter
       solo tiene 10e18 - 1. La transferencia REVIERTE.
    4. Todo el bundle del usuario falla. Gas perdido.
    5. Esto afecta a TODOS los usuarios que usen stakeEth con receiver != address(this),
       que es el caso de uso principal.
    NOTA: si el adapter tenía 1 wei de stETH residual de antes, la transfer pasa.
    Pero depender de dust residual no es robusto.
  impact: "DoS de stakeEth para todos los usuarios cuando stETH rounding causa deficit de 1 wei"
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Pre-stakeEth: balance de stETH del adapter
    uint256 stEthBefore = IERC20(ST_ETH).balanceOf(address(adapter));
    // Execute stakeEth(amount, maxPrice, referral, receiver)
    uint256 stEthAfter = IERC20(ST_ETH).balanceOf(address(adapter));
    uint256 actualReceived = stEthAfter - stEthBefore;
    // Invariante: actualReceived >= amount (si receiver == adapter, no transfer)
    // Si receiver != adapter: la transferencia intenta `amount`, necesita actualReceived >= amount
    gte(actualReceived, amount, "BD-D-01: stETH received < ETH deposited (rounding)");
  ghost_vars:
    - "uint256 internal ghost_stEthReceivedVsDeposited;"
  validated: false
  priority: high
  confidence: 70
  notes: >
    stETH rounding es un bug CONOCIDO y documentado. La pregunta es si
    Lido's submit() se ve afectado o solo transferencias secundarias.
    Si submit() siempre retorna exactamente `amount` de stETH, este finding
    se cae. Pero Lido docs mencionan que shares→balance conversion puede
    tener off-by-one en CUALQUIER operación incluyendo mint. Verificar en fork.

# ─────────────────────────────────────────────────────────────────────
# BD-D-02: CompoundV2 REDEEM — wMulDown vs REDEEM REAL
# ─────────────────────────────────────────────────────────────────────
# CompoundV2MigrationAdapter.compoundV2RedeemErc20() L86-91:
#   uint256 received = MathLib.wMulDown(exchangeRateCurrent(), amount);
#   require(ICToken(cToken).redeem(amount) == 0, ...);
#   if (receiver != address(this))
#       SafeERC20.safeTransfer(underlying, receiver, received);
#
# PROBLEMA: `received` se calcula ANTES del redeem usando wMulDown.
# Compound V2 internamente puede redondear de forma diferente.
# Si Compound V2 entrega MENOS tokens que wMulDown calcula, el adapter
# intenta transferir más de lo que tiene → revert o drena dust residual.
# Si Compound V2 entrega MÁS, tokens quedan stuck en el adapter.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-02
  tier: 1
  type: property
  description: >
    compoundV2RedeemErc20/Eth calcula `received` pre-redeem via wMulDown.
    Si Compound V2 redondea diferente, delta de 1+ wei causa revert (si
    Compound da menos) o tokens stuck (si Compound da más).
  attack_scenario: >
    1. Adapter tiene 100 cUSDC de un paso previo del bundle.
    2. exchangeRateCurrent() retorna R.
    3. received = wMulDown(R, 100) = X.
    4. redeem(100) se ejecuta. Compound V2 entrega X-1 (rounding diferente).
    5. safeTransfer(USDC, receiver, X) falla: adapter solo tiene X-1 USDC.
    6. Bundle completo revierte. Fondos del usuario quedan en el adapter
       (los cTokens ya se redimieron pero USDC no se pudo transferir).
    WAIT: si redeem revierte, los cTokens no se redimen. Pero aquí el
    redeem SÍ pasa (retorna 0), es el transfer posterior que falla.
    Los cTokens se quemaron pero el USDC no llega al usuario. ¿Dónde
    están? En el adapter. Pero la tx revierte, así que todo se revierte.
    CONCLUSIÓN: revert limpio, pero el usuario no puede completar su migración.
    Este es un DoS para migraciones de Compound V2.
  impact: "DoS de migración Compound V2 por delta de 1 wei entre wMulDown y redeem real"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Pre-redeem: snapshot
    uint256 underlyingBefore = IERC20(underlying).balanceOf(address(adapter));
    uint256 exchangeRate = ICToken(cToken).exchangeRateCurrent();
    uint256 cTokenAmount = /* amount pasado a compoundV2RedeemErc20 */;
    uint256 calculatedReceived = MathLib.wMulDown(exchangeRate, cTokenAmount);
    // Execute redeem
    uint256 underlyingAfter = IERC20(underlying).balanceOf(address(adapter));
    uint256 actualReceived = underlyingAfter - underlyingBefore;
    // Invariante: actualReceived >= calculatedReceived
    // Si falla → el adapter intentará transferir más de lo que tiene
    gte(actualReceived, calculatedReceived, "BD-D-02: Compound V2 redeem gave less than wMulDown");
  ghost_vars:
    - "uint256 internal ghost_compV2RedeemDelta;"
  validated: false
  priority: high
  confidence: 65
  notes: >
    Compound V2 usa Exp math internally: truncate(exchangeRate * amount).
    wMulDown es mulDivDown(x, y, 1e18). Si Compound V2 redondea diferente,
    el delta existe. Verificar en fork con cUSDC real. Si el delta es
    siempre positivo (Compound da más), los tokens extra quedan como dust
    en el adapter — less severity pero sigue siendo un leak.

# ─────────────────────────────────────────────────────────────────────
# BD-D-03: erc20WrapperWithdrawTo — DOUBLE TRANSFER AUTHORIZATION BYPASS
# ─────────────────────────────────────────────────────────────────────
# ERC20WrapperAdapter.erc20WrapperWithdrawTo() L56-60:
#   address initiator = initiator();
#   SafeERC20.safeTransfer(IERC20(wrapper), initiator, amount);
#   SafeERC20.safeTransferFrom(IERC20(wrapper), initiator, address(this), amount);
#   require(ERC20Wrapper(wrapper).withdrawTo(receiver, amount), ...);
#
# Este patrón de transfer→transferFrom se usa para verificar que el
# initiator autoriza el unwrap: los tokens se envían al initiator y
# luego se traen de vuelta via transferFrom (requiere approval).
# PERO: el initiator ya aprobó el adapter (via permit o approve previo
# en el bundle) para hacer el transferFrom. ¿Qué pasa si el wrapper
# es un token que cobra fee-on-transfer?
#
# Si el wrapper cobra fee: transfer(initiator, amount) entrega amount-fee.
# Luego transferFrom(initiator, adapter, amount) intenta traer `amount`
# pero el initiator solo tiene amount-fee del wrapper. REVIERTE.
#
# TAMBIÉN: ¿qué pasa si el wrapper tiene un callback en transfer
# (como ERC777 tokensReceived)? El initiator recibe los tokens y
# podría reentrear. Pero onlyBundler3 protege las funciones del adapter.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-03
  tier: 1
  type: property
  description: >
    erc20WrapperWithdrawTo usa un patrón transfer→transferFrom que falla
    con fee-on-transfer wrapper tokens. El transfer envía `amount` pero
    si el wrapper cobra fee, el initiator recibe `amount - fee`. El
    transferFrom posterior intenta traer `amount` completo y revierte.
  attack_scenario: >
    1. Un wrapper token que cobra 0.1% de fee en cada transfer.
    2. Usuario llama erc20WrapperWithdrawTo(wrapper, receiver, 1000e18).
    3. Adapter tiene 1000e18 wrapper tokens.
    4. safeTransfer(wrapper, initiator, 1000e18) → initiator recibe 999e18 (fee: 1e18).
    5. safeTransferFrom(wrapper, initiator, adapter, 1000e18) → REVIERTE:
       initiator solo tiene 999e18, no puede enviar 1000e18.
    6. DoS total para wrapper tokens con fee-on-transfer.
    7. El usuario no puede unwrap sus tokens via el bundler.
    ALTERNATIVA: si el wrapper token NO cobra fee pero tiene un rebase
    negativo entre las dos transfers (misma tx = no rebase = OK).
  impact: "DoS completo de erc20WrapperWithdrawTo para wrapper tokens con fee-on-transfer"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Simular fee-on-transfer wrapper
    // uint256 initiatorBalanceAfterTransfer = IERC20(wrapper).balanceOf(initiator);
    // El transferFrom intentará amount, necesita:
    // initiatorBalanceAfterTransfer >= amount
    // Con fee-on-transfer: initiatorBalanceAfterTransfer = amount - fee < amount
    // → REVERT
    uint256 transferDelta = amount - IERC20(wrapper).balanceOf(initiator);
    eq(transferDelta, 0, "BD-D-03: fee-on-transfer wrapper breaks withdrawTo");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    La probabilidad depende de si existen wrappers ERC20 con fee-on-transfer
    en producción que se usen con Morpho. Los wrappers permissionados
    (como USDC bridged) generalmente NO cobran fee. Pero el adapter acepta
    CUALQUIER address como wrapper (sin whitelist), así que un wrapper
    malicioso o exótico con fee-on-transfer causaría el DoS.
    Severity reducida porque el usuario elige el wrapper.

# ─────────────────────────────────────────────────────────────────────
# BD-D-04: BUNDLER3 ARBITRARY CALL + ADAPTER forceApprove RESIDUAL
# ─────────────────────────────────────────────────────────────────────
# Bundler3._multicall() hace to.call{value}(data) con to/data arbitrarios.
# El contrato puede llamar a CUALQUIER address, incluyendo tokens ERC20
# directamente. Esto es by-design ("Anybody can do arbitrary calls").
#
# PERO: ¿qué pasa si un usuario construye un bundle donde:
#   Call 1: adapter.morphoSupply(...) → forceApprove(loanToken, MORPHO, max)
#           [la approval a MORPHO queda permanente — "trusted"]
#   Call 2: una call arbitraria a un contrato que interactúa con MORPHO
#
# El adapter tiene approval PERMANENTE a MORPHO para el loanToken.
# Si el adapter recibe tokens del loanToken en un paso posterior y
# luego MORPHO es llamado directamente (no via adapter), ¿podría
# MORPHO usar esa approval para drenar tokens del adapter?
#
# MORPHO solo usa la approval en el contexto de sus propias operaciones
# (supply, repay, flashloan repayment). No puede drenar arbitrariamente.
# PERO: si un usuario llama MORPHO.supply directamente con onBehalf=attacker
# y MORPHO usa la approval del adapter para traer tokens... WAIT:
# MORPHO.supply trae tokens de msg.sender, no del adapter.
# msg.sender sería Bundler3 (porque la call va desde Bundler3 a MORPHO).
# MORPHO haría transferFrom(Bundler3, ...) — Bundler3 no tiene approval.
# CONCLUSIÓN: la approval del adapter a MORPHO no es usable desde Bundler3
# directamente. Solo el adapter puede triggearla (via morphoSupply etc).
# ─────────────────────────────────────────────────────────────────────
