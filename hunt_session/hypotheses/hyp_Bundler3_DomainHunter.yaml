# ─────────────────────────────────────────────────────────────────────
# BD-D-05: msg.value REUSE — ETH puede ser "gastado" múltiples veces
# ─────────────────────────────────────────────────────────────────────
# Bundler3._multicall() ejecuta to.call{value: bundle[i].value}(data).
# msg.value se acredita al balance de Bundler3 al inicio de multicall().
# Las calls posteriores pueden usar ESE balance, incluyendo ETH recibido
# de VUELTA de calls previas.
#
# PERO: ¿puede sum(bundle[i].value) > msg.value?
# SÍ, si una call intermedia DEVUELVE ETH al Bundler3.
# Ejemplo: Call 1 envía 1 ETH a un contrato que lo devuelve.
# Bundler3 balance vuelve a 1 ETH. Call 2 envía 1 ETH.
# Total enviado: 2 ETH. msg.value: 1 ETH.
#
# ¿Es esto un bug? En multicalls normales NO hay receive/fallback en
# Bundler3 para recibir ETH de vuelta. Pero un contrato puede enviar
# ETH via selfdestruct (deprecado pero funcional post-Dencun).
# WAIT: Bundler3 no tiene receive(). ¿Puede recibir ETH via selfdestruct?
# Sí, selfdestruct ignora receive(). Pero esto es un vector extremo.
#
# MÁS IMPORTANTE: si el adapter unwraps WETH y envía ETH de vuelta
# al Bundler3... pero unwrapNative en adapter envía a `receiver`, no
# a Bundler3. Y nativeTransfer también va a `receiver`.
# No hay path normal donde ETH vuelva al Bundler3 DENTRO de un bundle.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-05
  tier: 2
  type: property
  description: >
    En teoría, ETH puede "reciclarse" si una call envía ETH a un contrato
    que lo devuelve a Bundler3 via selfdestruct. Bundler3 NO tiene receive()
    pero selfdestruct ignora eso. Esto permitiría que sum(bundle[i].value)
    > msg.value original.
  attack_scenario: >
    1. Atacante crea contrato SelfDestructor que en su fallback llama
       selfdestruct(payable(bundler3)).
    2. Bundle: [{to: SelfDestructor, value: 1 ETH, ...}, {to: attacker, value: 1 ETH, ...}]
    3. Call 1 envía 1 ETH a SelfDestructor. SelfDestructor se autodestruye
       enviando 1 ETH de vuelta a Bundler3.
    4. Bundler3 balance = 1 ETH de nuevo. Call 2 envía 1 ETH a attacker.
    5. Total extraído: 1 ETH (solo el original). No hay amplificación.
    6. El atacante pagó 1 ETH (msg.value) y recibió 1 ETH. Net = 0.
    CONCLUSIÓN: No hay amplificación de ETH. selfdestruct devuelve el
    mismo ETH que se envió. No es explotable. El recycling es neutral.
  impact: "N/A — no hay amplificación posible de ETH via recycling"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Post-multicall: Bundler3 balance no debe ser mayor que pre-multicall
    uint256 balanceBefore = address(bundler3).balance;
    // ... multicall ...
    uint256 balanceAfter = address(bundler3).balance;
    // Si recycling ocurre, balanceAfter podría ser != balanceBefore
    // Pero no hay amplificación — conservation of ETH applies
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    Descartado como vector de ataque. Conservation of ETH impide amplificación.
    El msg.value reuse pattern (como en Uniswap V4 router) no aplica aquí
    porque Bundler3 no tiene receive() para recibir ETH de vuelta en un
    contexto normal. Solo selfdestruct, que es neutral.

# ─────────────────────────────────────────────────────────────────────
# BD-D-06: morphoBorrow + morphoWithdraw AUTHORIZATION DELEGATION
# ─────────────────────────────────────────────────────────────────────
# morphoBorrow(L248): MORPHO.borrow(market, assets, shares, initiator(), receiver)
# morphoWithdraw(L316): MORPHO.withdraw(market, assets, shares, initiator(), receiver)
# morphoWithdrawCollateral(L334): MORPHO.withdrawCollateral(market, assets, initiator(), receiver)
#
# Todas estas funciones usan initiator() como el "onBehalf" (el owner
# de la posición). Esto requiere que el initiator haya previamente
# autorizado al ADAPTER como isAuthorized en Morpho Blue.
#
# RIESGO: Si un usuario autoriza al adapter una vez (setAuthorization(adapter, true)),
# esa autorización es PERMANENTE. Cualquier bundle futuro que el usuario ejecute
# (o que CUALQUIERA ejecute mientras Bundler3 tiene initiator == ese usuario)
# puede borrowar/withdraw de la posición del usuario.
#
# WAIT: Bundler3 solo puede tener initiator == address(X) si X llamó
# multicall(). Nadie más puede setear initiator a X. Así que un
# atacante no puede hacer que initiator sea la víctima.
#
# PERO: el adapter es UN address fijo. Si la víctima autorizó el adapter,
# y luego la víctima llama multicall con un bundle que SIN QUERER incluye
# un morphoBorrow... es culpa del usuario (firma el bundle completo).
#
# VECTOR REAL: Si la víctima es un CONTRATO (e.g., un smart wallet) que
# tiene autorización permanente al adapter, y ese contrato llama multicall
# con datos proporcionados por un tercero (e.g., un relayer malicioso),
# el relayer podría inyectar un morphoBorrow en el bundle.
# PERO: el contrato/smart wallet FIRMA o aprueba el bundle completo.
# Si no verifica el bundle antes de llamar multicall, es culpa del wallet.
# ─────────────────────────────────────────────────────────────────────
- id: BD-D-06
  tier: 1
  type: property
  description: >
    morphoBorrow/Withdraw/WithdrawCollateral actúan como el initiator en
    Morpho Blue. El initiator debe haber autorizado el adapter en Morpho.
    La autorización es permanente hasta que se revoque. Si un smart wallet
    o contrato autoriza el adapter y luego ejecuta bundles con datos de
    un relayer no confiable, el relayer podría drenar la posición.
  attack_scenario: >
    1. Smart wallet W autoriza adapter en Morpho: setAuthorization(adapter, true).
    2. W usa un relayer para construir y submitear bundles (gasless pattern).
    3. Relayer malicioso construye bundle: [morphoBorrow(market, max, 0, price, attackerAddr)].
    4. W llama multicall(bundle) — initiator() = W.
    5. morphoBorrow llama MORPHO.borrow(..., W, attacker) — W autorizó adapter.
    6. MORPHO transfiere loanTokens a attacker. W ahora tiene deuda sin recibir nada.
    MITIGACIÓN: El usuario (W) debe verificar el bundle antes de firmar/llamar.
    Es un trust issue entre el usuario y el relayer, no del adapter.
    PERO: si el adapter verificara que receiver es initiator() o address(this),
    este vector se cerraría. Actualmente receiver es LIBRE.
  impact: "Drain de posición Morpho si el initiator confía en un tercero para construir bundles"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante parcial: en morphoBorrow, receiver debería ser controlado por initiator
    // NOTA: actualmente receiver es libre — cualquier address
    // Un invariante más fuerte sería: receiver == initiator() || receiver == address(adapter)
    // Pero esto limitaría la funcionalidad legítima (e.g., borrow y enviar a otro address)
    // Ghost: rastrear si receiver != initiator en morphoBorrow
    bool receiverIsInitiator = (receiver == initiator());
    bool receiverIsAdapter = (receiver == address(adapter));
    // ALERTA si receiver es ni initiator ni adapter (posible drain)
  ghost_vars:
    - "uint256 internal ghost_borrowToNonInitiatorCount;"
  validated: false
  priority: high
  confidence: 40
  notes: >
    Este es un design trade-off, no un bug. El adapter permite receiver
    libre para soportar use cases legítimos (borrow y enviar a otro
    contrato en el mismo bundle). La seguridad depende de que el initiator
    (msg.sender de multicall) controle el bundle completo. Para EOAs,
    esto es seguro. Para smart wallets con relayers, depende de la
    confianza en el relayer. Probablemente known/wontfix.

