# sell() → swap() revierte → sell() propaga el revert.
# sell() NO tiene try/catch. El revert se propaga.
# Un caller que use try/catch en sell() vería el revert pero no
# puede extraer información útil de callData (it's in the reverted tx).
#
# CONCLUSIÓN: PA-FP-02 es correcto. No hay nuevo vector aquí.
# ─────────────────────────────────────────────────────────────────────
