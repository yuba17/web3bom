# ═══════════════════════════════════════════════════════════════════
# B-W-18: ParaswapAdapter.sell/buy — MISSING onlyBundler3 (ANALISIS PROFUNDO)
# ═══════════════════════════════════════════════════════════════════
- id: B-W-18
  tier: 2
  type: property
  description: "sell() y buy() son external/public sin onlyBundler3 modifier directo. La proteccion esta en swap() internal que SI tiene onlyBundler3. Analisis de bypass."
  attack_scenario: |
    Analisis exhaustivo de bypass de onlyBundler3 via sell/buy:

    1. DIRECT CALL: Atacante llama sell() directamente
       → sell() llama swap() que tiene onlyBundler3
       → msg.sender != BUNDLER3 → UnauthorizedSender → REVERT
       ✅ Protegido

    2. DELEGATECALL: Si algun contrato hace delegatecall a ParaswapAdapter
       → msg.sender se mantiene del caller
       → swap() verifica msg.sender == BUNDLER3 → probablemente falla
       → PERO: en delegatecall, BUNDLER3 es del caller's storage, no del adapter
       ✅ No aplica — nadie hace delegatecall al adapter

    3. INTERNAL CALL VIA HERENCIA: buyMorphoDebt llama buy() internamente (L141)
       → buy es public para permitir esto
       → swap() hereda msg.sender del call externo (debe ser BUNDLER3)
       ✅ Protegido — solo funciona cuando Bundler3 llama buyMorphoDebt

    CONCLUSION: La proteccion indirecta via swap() es correcta.
  impact: "Ninguno. La proteccion es correcta."
