# ═══════════════════════════════════════════════════════════════════
# B-W-11: stakeEth — stETH 1-WEI ROUNDING → REVERT SISTEMATICO
# ═══════════════════════════════════════════════════════════════════
# VECTOR PRINCIPAL DE ESTA ITERACION
# stETH tiene un bug conocido: balanceOf puede devolver 1 wei menos
# de lo depositado (shares → balance conversion rounding).
# EthereumGeneralAdapter1.stakeEth() L112-115 hace:
#   submit{value: amount}(referral) → recibe shares
#   safeTransfer(stETH, receiver, amount) → envia `amount`
# Si stETH balance = amount - 1 (rounding), safeTransfer revierte.
- id: B-W-11
  tier: 1
  type: property
  description: "EthereumGeneralAdapter1.stakeEth() transfiere `amount` de stETH al receiver, pero stETH tiene known 1-wei rounding que puede hacer que el adapter tenga `amount - 1` de balance, causando revert sistematico"
  attack_scenario: |
    1. Usuario quiere stakear 1 ETH via bundle
    2. stakeEth(1 ether, maxPrice, referral, receiver) en EthereumGeneralAdapter1.sol L104
    3. L112: submit{value: 1 ether}(referral) → adapter recibe shares equivalentes
    4. Internamente stETH convierte shares -> balanceOf. Rounding puede dar 999999999999999999 (1 ether - 1 wei)
    5. L115: safeTransfer(stETH, receiver, 1 ether) → adapter solo tiene 999999999999999999 → REVERT
    6. El bundle entero falla. El usuario NO puede stakear ETH via Bundler3.
    7. Esto afecta a TODOS los usuarios que usen stakeEth, no solo un edge case.

    NOTA: Esto NO es un ataque externo. Es un DoS funcional causado por incompatibilidad
    con el rounding conocido de stETH. Lido documenta este comportamiento.

    CONTRAARGUMENTO: stETH submit() devuelve shares, y el balance puede ser exactamente
    `amount` en la mayoria de los casos. El 1-wei error ocurre en transferencias y
    conversiones especificas. Necesita test en fork para confirmar frecuencia.
  impact: "DoS funcional de stakeEth para cantidades donde stETH rounding produce amount-1. Funcionalidad Lido del bundler inutilizable para esos montos."
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Fork test: stakear ETH y verificar que adapter puede transferir el stETH recibido
    uint256 ethAmount = 1 ether;
    // Simular: adapter recibe stETH via submit
    uint256 stEthBal = IERC20(ST_ETH).balanceOf(address(adapter));
    // Si stEthBal < ethAmount, la transferencia revertira
    gte(stEthBal, ethAmount, "B-W-11: stETH rounding causes stakeEth to fail");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 75
  notes: |
    stETH 1-wei rounding es un bug conocido y documentado por Lido.
    Muchos protocolos (Aave, Lido, Morpho?) tienen workarounds.
    La fix seria: transferir min(amount, balanceOf(adapter)) o usar shares directamente.
    NECESITA TEST EN FORK ETHEREUM para confirmar.

# ═══════════════════════════════════════════════════════════════════
# B-W-12: skipRevert + callbackHash — MissingExpectedReenter INEVITABLE
# ═══════════════════════════════════════════════════════════════════
- id: B-W-12
  tier: 2
  type: property
  description: "Si una call con callbackHash!=0 tiene skipRevert=true y la call falla, reenterHash nunca se limpia → MissingExpectedReenter revierte todo el bundle. skipRevert es efectivamente inutil con callbackHash."
  attack_scenario: |
    1. Usuario construye bundle:
       Call[0]: {to: morpho, data: supply(...), callbackHash: hash, skipRevert: true}
       Call[1]: {to: adapter, data: erc20Transfer(...), callbackHash: 0, skipRevert: false}
    2. supply() falla (e.g., insufficient tokens)
    3. skipRevert=true → no revierte en L64
    4. Pero reenterHash fue seteado en L61 y nunca limpiado (reenter nunca se llamo)
    5. L66: require(reenterHash == 0) → REVERT con MissingExpectedReenter
    6. El bundle entero falla, contrariamente a la expectativa del usuario
    7. skipRevert=true no protege contra nada cuando hay callbackHash

    Impacto: No hay perdida de fondos. Es by-design (estado consistente). Pero la
    interaccion skipRevert + callbackHash es confusa y no documentada.
  impact: "Confusion para integradores. skipRevert=true con callbackHash es un noop. No hay perdida de fondos."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Test: bundle con skipRevert=true + callbackHash != 0 + call that fails
    // Expect: MissingExpectedReenter revert (not silent skip)
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: "By-design. Documenting for integradores."

# ═══════════════════════════════════════════════════════════════════
# B-W-13: GRIEFING VIA DUST — type(uint256).max BALANCE MANIPULATION
# ═══════════════════════════════════════════════════════════════════
- id: B-W-13
  tier: 2
  type: property
  description: "Un atacante puede donar tokens al adapter antes del multicall de una victima para manipular operaciones que usan type(uint256).max como sentinel, causando slippage reverts o depositos excesivos"
  attack_scenario: |
    1. Atacante ve en mempool: victima va a hacer multicall con:
       - Call[0]: permit2TransferFrom(USDC, adapter, 1000e6)
       - Call[1]: erc4626Deposit(vault, type(uint256).max, maxPrice, receiver)
    2. Atacante front-runs y envia 1000e6 USDC al adapter
    3. Ahora adapter tiene 2000e6 USDC cuando deposit se ejecuta
    4. erc4626Deposit intenta depositar 2000e6 pero maxSharePriceE27 calibrado para 1000e6
    5. Si share price es desfavorable a mayor escala → SlippageExceeded → revert
    6. La victima pierde gas y no puede ejecutar su operacion

    Variante mas sutil (sin frontrun):
    - Un bundle previo deja tokens residuales en el adapter (B-W-01 patron)
    - El proximo usuario que use type(uint256).max captura esos tokens extra
    - Esto puede ser POSITIVO (free tokens) o NEGATIVO (slippage fail) para el usuario

    Costo del ataque: el atacante necesita front-run Y donar tokens significativos.
    Los tokens donados son recuperables por CUALQUIERA despues (no solo el atacante),
    lo que introduce riesgo para el propio atacante.
  impact: "DoS via slippage failure. Costo alto para atacante (must donate real tokens)."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Pre-condition: adapter balance should be 0 at start of multicall
    uint256 bal = IERC20(token).balanceOf(address(adapter));
    eq(bal, 0, "B-W-13: unexpected tokens in adapter at start of multicall");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: |
    El diseno asume adapter balance = 0 entre txs. Griefing costoso pero real.
    La fix seria no usar type(uint256).max o verificar balance delta en lugar de balance absoluto.

# ═══════════════════════════════════════════════════════════════════
# B-W-14: ParaswapAdapter — forceApprove(augustus, max) WINDOW + TOKENS RESIDUALES
# ═══════════════════════════════════════════════════════════════════
- id: B-W-14
  tier: 2
  type: property
  description: "ParaswapAdapter.swap() da approval infinita a Augustus (L181), ejecuta swap, y resetea a 0 (L186). Durante la window, Augustus tiene acceso a TODOS los srcTokens del adapter, no solo los necesarios para el swap."
  attack_scenario: |
    Escenario 1 — Tokens residuales amplificados:
    1. Bundle tiene: [transferFrom(1000 USDC, adapter), transferFrom(500 USDC, adapter), sell(augustus, ...)]
    2. Adapter tiene 1500 USDC cuando sell() ejecuta
    3. sell() da approval(augustus, max) para USDC
    4. Augustus (via callData crafteado) puede tomar hasta 1500 USDC, no solo los 1000 esperados
    5. PERO: L194 require(srcAmount <= maxSrcAmount) protege — maxSrcAmount viene de callData
    6. Si atacante controla callData y pone maxSrcAmount alto... el atacante ES el initiator,
       y esta robando sus propios tokens.

    Escenario 2 — Augustus malicioso (trust assumption):
    1. Paraswap registra un Augustus con backdoor
    2. Augustus toma todos los srcTokens del adapter durante swap
    3. La approval se resetea despues (L186) pero ya es tarde

    CONCLUSION: No hay ataque de terceros. El initiator controla callData.
    El riesgo es solo trust assumption en Paraswap registry.
  impact: "Trust assumption en Paraswap. No explotable por terceros."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que approval se resetea a 0 despues de swap
    uint256 allowAfter = IERC20(srcToken).allowance(address(adapter), augustus);
    eq(allowAfter, 0, "B-W-14: Augustus approval not reset after swap");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 45
  notes: |
    La approval window es real pero protegida por slippage checks (L194-195).
    El initiator controla callData asi que no puede ser atacado por terceros.
    Solo relevante si Augustus es malicioso (trust assumption en Paraswap).

# ═══════════════════════════════════════════════════════════════════
# B-W-15: ERC20WrapperAdapter — TRANSFER-BACK PATTERN CON FEE-ON-TRANSFER
# ═══════════════════════════════════════════════════════════════════
- id: B-W-15
  tier: 2
  type: property
  description: "ERC20WrapperAdapter.erc20WrapperWithdrawTo() usa transfer-then-transferFrom pattern (L57-58) que falla con fee-on-transfer wrapped tokens"
  attack_scenario: |
    1. Wrapped token tiene fee-on-transfer (e.g., 1% fee)
    2. Usuario llama erc20WrapperWithdrawTo(wrapper, receiver, 1000)
    3. L57: safeTransfer(wrapper, initiator, 1000) → initiator recibe 990 (1% fee)
    4. L58: safeTransferFrom(wrapper, initiator, adapter, 1000) → intenta transferir 1000
       pero initiator solo tiene 990 → REVERT (o initiator needs 10 extra tokens + allowance)
    5. erc20WrapperWithdrawTo es inutilizable con fee-on-transfer wrapped tokens

    Con ERC777 hooks:
    1. L57 envia wrapped tokens al initiator → trigger tokensReceived callback
    2. Initiator ejecuta codigo arbitrario en callback
    3. No puede reentrar multicall (AlreadyInitiated)
    4. Podria mover tokens elsewhere → L58 fails
    5. No hay perdida de fondos del adapter — solo self-DoS

    Ademas: el patron transfer-then-transferFrom (L57-L58) es para verificar que el
    initiator "aprueba" el unwrap (proof of authorization via allowance). Es una
    design decision para wrappers permissionados. Pero fee-on-transfer lo rompe.
  impact: "Incompatibilidad con fee-on-transfer tokens. DoS funcional para esos tokens."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: use fee-on-transfer token as wrapper
    // Expect: erc20WrapperWithdrawTo reverts due to balance mismatch
  ghost_vars: []
  validated: false
  priority: low
  confidence: 65
  notes: "Edge case de compatibilidad. Probablemente by-design — wrappers permissionados no deberian tener fee-on-transfer."

