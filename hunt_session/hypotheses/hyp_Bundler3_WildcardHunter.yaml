summary: |
  WildcardHunter Iteracion 2 — 20 hipotesis totales (10 nuevas).

  === FINDINGS QUE MERECEN INVESTIGACION (requieren fork test) ===

  1. **B-W-11 (Medium, 75% confianza)** — stakeEth stETH 1-wei rounding
     EthereumGeneralAdapter1.stakeEth() transfiere `amount` de stETH al receiver,
     pero stETH tiene known 1-wei rounding que puede hacer adapter.balance = amount - 1.
     safeTransfer(amount) revertira. DoS funcional de Lido staking via bundler.
     REQUIERE: test en fork Ethereum con stETH real.

  2. **B-W-02 (High, 85% confianza)** — skipRevert + value = ETH perdido silenciosamente
     Si skipRevert=true y la call con value>0 falla, el ETH queda en Bundler3 sin
     notificacion al usuario. Combinable con B-W-01 para robo por MEV bot.
     REQUIERE: PoC en Foundry.

  3. **B-W-13 (Medium, 55% confianza)** — Griefing via token donation al adapter
     Front-running con tokens donados al adapter puede causar slippage reverts
     en operaciones que usan type(uint256).max. Costoso pero real.

  === CONFIRMADOS SEGUROS (no invertir mas tiempo) ===
  - reenterHash/callbackHash: criptograficamente solido (B-W-06)
  - Transient storage revert: correcto por EIP-1153 (B-W-08)
  - initiator spoofing: imposible (B-W-09)
  - Cross-bundle reentrancy: bloqueada (B-W-10)
  - ParaswapAdapter access control: correcto via swap() (B-W-18)
  - BytesLib bounds: correcto con checked arithmetic
  - reenter() front-running: imposible (msg.sender verificado en hash)

  === PRIORIDAD DE SIGUIENTE PASO ===
  1. Fork test B-W-11 (stETH rounding) en Ethereum mainnet
  2. PoC B-W-02 (skipRevert + value) en Foundry
  3. Verificar B-W-05 on-chain (approvals al Bundler3)
