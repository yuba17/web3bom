# ─────────────────────────────────────────────────────────────────────
# H-12: USDC blacklist — withdrawal failure does not block batch
# ─────────────────────────────────────────────────────────────────────
- id: TB-12
  tier: 2
  type: property
  description: >
    USDC has a blacklist. If a pool party gets blacklisted:
    - Individual withdrawals (withdrawUSDC): will revert in the pool's
      try/catch at L275, causing the entire _withdrawUSDCOnBehalf to revert
      (it re-reverts with the catch message).
    - Batch withdrawals (processTreasuryManagementWithdrawals): the Oracle
      wraps each withdrawal in try/catch (L206-225), so one failure doesn't
      block others. Other parties can still withdraw.
    - Batch fee collection (collectFees): same try/catch pattern, graceful.
    - Direct party withdrawals: there is no direct party withdrawal function
      (all withdrawals go through Oracle). So a blacklisted party cannot
      withdraw at all.

    The REMAINING concern: if the blacklisted party's share of USDC is stuck
    in the pool forever. No rescue mechanism exists.
  attack_scenario: >
    1. PartyA deposits 50k USDC to pool
    2. USDC blacklists PartyA
    3. Provider tries to withdraw to PartyA → fails
    4. PartyA's 50k USDC is permanently stuck in the pool
    5. No admin rescue function exists to redirect stuck funds

    This is a known USDC limitation. The protocol has no mitigation.
  impact: "Permanent fund lock for blacklisted parties. No rescue mechanism."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: ''
