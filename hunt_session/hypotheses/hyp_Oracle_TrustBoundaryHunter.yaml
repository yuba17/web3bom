    Oracle maintains its OWN pool mapping (mapping pools at L21) AND uses
    factory.getPool() for some functions. After factory change:

    - Oracle.getPool(uuid) → uses Oracle.pools[uuid] (OLD pools still accessible)
    - Functions using factory.getPool(uuid) → uses NEW factory mapping (different pools)

    Functions using Oracle.pools (via getPool):
    - withdrawUSDC (L258: getPool)
    - atomicDeposit (L296: getPool)
    - depositUSDC (L350: getPool)

    Functions using factory.getPool:
    - collectFees (L103: factory.getPool)
    - processTreasuryManagementDeposits (L154: factory.getPool)
    - processTreasuryManagementWithdrawals (L203: factory.getPool)
    - batchAtomicDeposit (L330: factory.getPool)
    - addOtherParty (L386: factory.getPool)

    After factory swap, the same poolUuid may resolve to DIFFERENT addresses
    depending on which function is called. This is a split-brain state.
  attack_scenario: >
    1. Admin changes factory to newFactory
    2. Provider calls withdrawUSDC(user, amount, poolUuid, uuid)
       → Oracle.getPool(poolUuid) → returns OLD pool address (from Oracle.pools)
