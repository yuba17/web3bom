# ─────────────────────────────────────────────────────────────────────
# H-08: Implementation contract can be called directly (init protection only)
# ─────────────────────────────────────────────────────────────────────
- id: TB-08
  tier: 2
  type: property
  description: >
    The SettlementPool implementation contract (deployed at constructor, used as
    EIP-1167 clone source) is a live contract. Its initialize() has the check
    `require(factory == address(0))` which prevents re-initialization.

    BUT: the implementation contract itself is NEVER initialized (initialize is
    only called on clones). So factory == address(0) on the implementation.
    Someone could call initialize() on the implementation contract directly,
    setting themselves as factory.

    However, after initialization, _oracle() calls factory.oracle() and
    _usdc() calls factory.usdcAddress(). The attacker-set factory would need
    to implement these interfaces. Even then, there's no USDC in the
    implementation contract, so deposits/withdrawals would be on an empty contract.

    The real risk: if someone sends USDC to the implementation contract by mistake
    (e.g., via transferFromOLPToPool with poolAddress=implementation), the
    attacker who initialized it could drain those funds.
  attack_scenario: >
    1. Attacker deploys a fake factory contract that returns attacker as oracle
    2. Attacker calls implementation.initialize(attacker, fakeFactory, [], uuid)
    3. Now attacker controls the implementation contract
    4. If ANY USDC is accidentally sent to the implementation, attacker can drain it
    5. Risk amplified by TB-03: transferFromOLPToPool can send to ANY address
  impact: "Low — requires USDC to be accidentally sent to implementation. But combined with TB-03, possible."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Implementation contract should not be initializable
    // Check: factory == address(0) on implementation before any interaction
    address impl = factory.implementation();
    t(SettlementPool(impl).factory() == address(0), "TB-08: impl not initialized — vulnerable");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 65
  notes: >
    Standard EIP-1167 concern. Best practice is to call _disableInitializers()
    in the implementation constructor, or initialize the implementation in the
    constructor. Neither is done here.

    KILL SIGNAL: No USDC should ever be in the implementation. The pools are
    clones with their own addresses. Unless TB-03 is used to send there.

    Combined with TB-03: if a rogue provider uses transferFromOLPToPool with
    poolAddress=implementation, and someone has initialized the implementation
    with a fake factory, the USDC could be drained. This is a 2-step attack
    requiring both a rogue provider AND a pre-initialized implementation.
  poc_sketch: |
    function test_initialize_implementation() public {
        address impl = factory.implementation();
        // Deploy fake factory
        FakeFactory fake = new FakeFactory(address(this));
        address[] memory others = new address[](1);
        others[0] = makeAddr("other");
        // Initialize implementation directly
        SettlementPool(impl).initialize(
            address(this), address(fake), others, 999
        );
        assertEq(SettlementPool(impl).factory(), address(fake));
    }
  call_stack: ''

