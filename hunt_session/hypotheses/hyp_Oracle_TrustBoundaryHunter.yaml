# ─────────────────────────────────────────────────────────────────────
# H-01: grantRole PROVIDER_ROLE bypasses duplicate check (BUG — CONFIRMED)
# ─────────────────────────────────────────────────────────────────────
- id: TB-01
  tier: 1
  type: property
  description: >
    Oracle.grantRole() for PROVIDER_ROLE has a dead-code duplicate check.
    Line 442: require(!hasRole(PROVIDER_ROLE, account), ...) executes AFTER
    super.grantRole() on line 439 which already granted the role. So the
    require on L442 will ALWAYS revert if the account didn't already have the role
    (because super.grantRole just granted it, so hasRole returns true), and will
    never revert if the account already had the role (because super.grantRole is
    a no-op for existing holders, hasRole returns true, and the require reverts).

    Wait — re-analyzing: super.grantRole() calls _grantRole() which sets
    the role. So after super.grantRole(PROVIDER_ROLE, account):
    - If account DID NOT have role before: now has it → hasRole = true → !hasRole = false → REVERTS
    - If account DID have role before: still has it → hasRole = true → !hasRole = false → REVERTS

    This means grantRole(PROVIDER_ROLE, ...) ALWAYS REVERTS. numProviders can
    never be incremented via grantRole. The only way to add a provider is via
    addProvider() which uses _grantRole (internal, no override).

    Impact: grantRole for PROVIDER_ROLE is permanently broken. Admin must use
    addProvider() instead. The OZ AccessControl grantRole path is dead code.
    This is a LOW severity design inconsistency — the intended path (addProvider)
    works correctly.
  attack_scenario: >
    Admin tries to use standard OZ grantRole(PROVIDER_ROLE, addr) → always reverts.
    Not exploitable for fund loss, but indicates a logic error in the override.
    The real risk: if admin expects grantRole to work and it doesn't, providers
    cannot be added via the standard interface.
  impact: "Admin cannot use grantRole to add providers — must use addProvider. Functional but inconsistent."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // grantRole(PROVIDER_ROLE, newProvider) should succeed for new providers
    // but it always reverts because the require is AFTER super.grantRole
    bool preHasRole = oracle.hasRole(PROVIDER_ROLE, newProvider);
    try oracle.grantRole(PROVIDER_ROLE, newProvider) {
        // Should reach here for new providers but won't
        t(false, "TB-01: grantRole should have reverted");
    } catch {
        // Always ends up here
        t(!preHasRole, "TB-01: grantRole reverted for new provider — bug confirmed");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    The bug is clear from code reading. Line 439 calls super.grantRole which
    internally calls _grantRole, setting the role. Line 442 then checks
    !hasRole which is now always true (role was just set), so require always
    fails. This is a logic error in the override ordering.

    KILL SIGNALS: None — this is a genuine code defect. But severity is Low
    because addProvider() works correctly as the intended path.
  poc_sketch: |
    function test_grantRole_always_reverts() public {
        address newProvider = makeAddr("provider");
        // Admin tries grantRole
        vm.prank(admin);
        vm.expectRevert("Oracle: Provider already added.");
        oracle.grantRole(PROVIDER_ROLE, newProvider);
        // Verify provider was NOT added
        assertFalse(oracle.hasRole(PROVIDER_ROLE, newProvider));
    }
  call_stack: |
    grantRole(PROVIDER_ROLE, account)
    → super.grantRole(PROVIDER_ROLE, account)  // L439 — sets the role
      → _grantRole(PROVIDER_ROLE, account)     // OZ internal — role is now SET
    → if (role == PROVIDER_ROLE)               // L441
    → require(!hasRole(PROVIDER_ROLE, account)) // L442 — hasRole=true → !true=false → REVERT

