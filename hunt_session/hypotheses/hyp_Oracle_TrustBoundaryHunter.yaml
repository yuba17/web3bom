# ═══════════════════════════════════════════════════════════════════════
# TRUST BOUNDARY MAP — Complete Provider Capability Analysis
# ═══════════════════════════════════════════════════════════════════════
#
# TRUST CHAIN: User → Provider (PROVIDER_ROLE) → Oracle → Factory → Pool
#
# PROVIDER_ROLE can:
#   1. createPool          — create pools with arbitrary creator/other addresses, set feePaidBy/feeAmount
#   2. depositUSDC         — deposit on behalf of any sender (requires sender's approval to pool)
#   3. withdrawUSDC        — withdraw from pool to any requestor who is a party (no approval needed, pool sends)
#   4. atomicDeposit       — transfer from parties to pool (requires approval)
#   5. batchAtomicDeposit  — batch version of above
#   6. collectFees         — withdraw fees to msg.sender (the provider) from any pool
#   7. processTreasuryManagementDeposits — deposit from requestor to pools (requires requestor approval)
#   8. processTreasuryManagementWithdrawals — withdraw from pools to requestor (requestor must be party)
#   9. transferFromOLPToPool — transfer from olpWallet to ANY address (requires olpWallet approval to Oracle)
#  10. addOtherParty       — add arbitrary address as party to any pool
#
# KEY QUESTION: Is PROVIDER_ROLE trusted?
#   Immunefi says "Settlement Pool Factory owner" is trusted. PROVIDER_ROLE trust is UNCLEAR.
#   Provider is added by DEFAULT_ADMIN_ROLE (Oracle deployer), so it's likely semi-trusted (backend service).
#   BUT: if provider key is compromised, the attack surface is MASSIVE.
#
# ADMIN (DEFAULT_ADMIN_ROLE) can:
#   1. addProvider / removeProvider — manage providers
#   2. setSettlementPoolFactory — change factory address (and indirectly change which pools are recognized)
#   3. pause / unpause
#   4. grantRole / revokeRole — OZ AccessControl
#
# FACTORY OWNER can:
#   1. setOracleAddress — change which oracle controls ALL pools
#   2. createPool — directly (bypassing Oracle)
#
# ═══════════════════════════════════════════════════════════════════════

