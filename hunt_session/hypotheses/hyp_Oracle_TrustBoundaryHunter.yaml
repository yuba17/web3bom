# ─────────────────────────────────────────────────────────────────────
# H-13: atomicDeposit — party order validation can be bypassed
# ─────────────────────────────────────────────────────────────────────
- id: TB-13
  tier: 2
  type: property
  description: >
    Oracle.atomicDeposit (L287-322): When partyOneAmountRequested > 0 AND
    partyTwoAmountRequested == 0 (single-party deposit):
    - L298-308: Transfers from partyOne to pool (via Oracle as intermediary)
    - L309-313: Validates party addresses match pool creator/other
    - L314: Calls pool.depositUSDCAtomic which just emits event (L169-180)

    The address validation (L309-313) checks AFTER the transfer (L301-304).
    If the transfer succeeds but validation fails, the USDC is already in the
    Oracle contract. The require on L309 would revert the entire transaction,
    refunding the transfer. So this is safe due to atomicity.

    BUT: there's a subtle issue. The transferFrom on L301 pulls from partyOne
    to address(this) (Oracle). Then transfer on L303 sends to poolAddress.
    If the require on L309 reverts, both transfers are reverted. Safe.

    HOWEVER: the parentQuoteUuid replay protection (L299, L305-307) sets
    atomic_deposits_processed[parentQuoteUuid] = true BEFORE the address
    validation. If the address check reverts, the replay flag is also reverted
    (atomic transaction). So this is safe.

    After deeper analysis: no issue here. Solidity transaction atomicity
    protects against all ordering concerns.
  attack_scenario: No attack — transaction atomicity prevents partial execution.
  impact: "None — false alarm after deeper analysis"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: ''
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    KILL SIGNAL: Solidity atomic transactions. If any step reverts, all state
    changes revert. The ordering of checks vs effects doesn't matter for
    correctness within a single transaction (it matters for reentrancy, but
    ReentrancyGuard is used).
  poc_sketch: ''
  call_stack: ''

