hypotheses:
- id: FW-DD-01
  title: FINALIZED campaigns allow withdrawing funds backing allocated-but-undistributable
    payouts
  status: CONFIRMED
  severity: High
  confidence: 95
  poc: PASS — ForkFW-DD-01-PhantomAllocations.t.sol (2/2 tests, Base mainnet fork,
    USDC + native ETH)
  verify: PASS — Flywheel 0x00000F14AD09382841DB481403D1775ADeE1179F on Base. Immutable
    (no proxy, no owner). No recent fix.
  source_hunters:
  - FlowHunter
  - TrustBoundaryHunter
  - DomainHunter
  root_cause: "Two independent mechanisms in Flywheel.sol combine to create a fund\
    \ loss:\n\n1. `distribute()` (line 405) uses the `acceptingPayouts` modifier (line\
    \ 247-251)\n   which BLOCKS calls when status == FINALIZED:\n     ```\n     modifier\
    \ acceptingPayouts(address campaign) {\n         CampaignStatus status = _campaigns[campaign].status;\n\
    \         if (status == CampaignStatus.INACTIVE || status == CampaignStatus.FINALIZED)\n\
    \             revert InvalidCampaignStatus();\n         _;\n     }\n     ```\n\
    \n2. `withdrawFunds()` (line 508-512) ignores `totalAllocatedPayouts` when FINALIZED:\n\
    \     ```\n     uint256 requiredSolvency = campaignStatus(campaign) == CampaignStatus.FINALIZED\n\
    \         ? totalAllocatedFees[campaign][token]\n         : totalAllocatedFees[campaign][token]\
    \ + totalAllocatedPayouts[campaign][token];\n     ```\n\nThe NatSpec on line 487\
    \ says: \"Allocated payouts are ignored for solvency\nrequirements if the campaign\
    \ is finalized\" — this is INTENTIONAL design.\nBut the combination means: funds\
    \ backing allocations CAN be withdrawn,\nwhile recipients CANNOT claim via distribute()\
    \ because acceptingPayouts blocks it.\n\nThere is NO mechanism to distribute allocated\
    \ payouts after FINALIZED.\nThere is NO requirement that all allocations be distributed\
    \ before FINALIZED.\n"
  code_evidence:
  - file: src/Flywheel.sol
    lines: 247-251
    description: acceptingPayouts blocks FINALIZED status for distribute()
  - file: src/Flywheel.sol
    lines: 405-409
    description: distribute() uses acceptingPayouts modifier
  - file: src/Flywheel.sol
    lines: 508-512
    description: withdrawFunds ignores totalAllocatedPayouts when FINALIZED
  - file: src/Flywheel.sol
    lines: '487'
    description: NatSpec confirms intentional design to ignore allocated payouts
  attack_scenario: "Context: SimpleRewards campaign. Manager allocates rewards to\
    \ recipients.\n\n1. Manager calls allocate() for 100 ETH to recipients A, B, C\
    \ while ACTIVE\n   → totalAllocatedPayouts[campaign][ETH] = 100 ETH\n   → allocatedPayout[campaign][ETH][keyA]\
    \ = 40, [keyB] = 30, [keyC] = 30\n2. Manager calls updateStatus(ACTIVE → FINALIZING\
    \ → FINALIZED)\n   (SimpleRewards._onUpdateStatus has no restrictions beyond onlyManager)\n\
    3. Owner calls withdrawFunds() for 100 ETH\n   → Solvency check: balance(0) >=\
    \ totalAllocatedFees(0)? YES ✓\n   → totalAllocatedPayouts(100 ETH) is IGNORED\n\
    \   → Funds withdrawn successfully\n4. Recipients A, B, C try to call distribute()\n\
    \   → REVERTS with InvalidCampaignStatus (acceptingPayouts blocks FINALIZED)\n\
    5. Recipients have no path to recover their allocated funds\n\nIn AdConversion:\n\
    1. attributionProvider calls send() processing conversions with feeBps > 0\n \
    \  → Fees allocated via _processFees (sendFeesNow=false)\n2. attributionProvider\
    \ does ACTIVE → FINALIZED directly (line 576-579 allows this)\n3. advertiser calls\
    \ withdrawFunds()\n   → Only totalAllocatedFees checked, totalAllocatedPayouts\
    \ ignored\n4. If there were pending allocations from earlier allocate() calls,\
    \ those funds are gone\n"
  impact: 'Recipients lose ALL allocated-but-undistributed payouts. In SimpleRewards,

    the manager (trusted) controls both allocation and status, so the trust model

    is that manager can rug. BUT in AdConversion, the attributionProvider can

    allocate (via send), and the advertiser controls FINALIZED + withdrawFunds.

    Neither party alone should be able to steal from recipients.


    Cross-role attack in AdConversion:

    - attributionProvider processes legitimate conversions

    - advertiser finalizes and withdraws before distributions complete

    '
  invariant_solidity: "// INV-FW-01: Allocated payouts must remain claimable or be\
    \ explicitly deallocated\nfunction invariant_allocated_payouts_recoverable(\n\
    \    address campaign, address token\n) external view {\n    uint256 allocated\
    \ = flywheel.totalAllocatedPayouts(campaign, token);\n    if (allocated > 0) {\n\
    \        // If there are allocations, campaign must be in a state where distribute()\
    \ works\n        Flywheel.CampaignStatus status = flywheel.campaignStatus(campaign);\n\
    \        assert(\n            status == Flywheel.CampaignStatus.ACTIVE ||\n  \
    \          status == Flywheel.CampaignStatus.FINALIZING\n        );\n    }\n}\n"
  notes: 'The NatSpec on line 487 documents this as intentional — "Allocated payouts
    are

    ignored for solvency requirements if the campaign is finalized." This suggests

    the design intent is that FINALIZED means "campaign is done, advertiser recovers

    remaining funds." But there''s a logical contradiction: allocations exist that

    can never be distributed. Either:

    (a) distribute() should work in FINALIZED state, OR

    (b) FINALIZED should require totalAllocatedPayouts == 0


    The fact that deallocate() also requires acceptingPayouts means even the cleanup

    path is blocked. Once FINALIZED, allocated payouts are in permanent limbo.

    '
  redteam_verdict: REPORT_DOWNGRADED
