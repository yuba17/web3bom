  variant_hunt_done: true
- id: FW-DD-02
  title: Builder code deregistration permanently locks allocated fees in BridgeReferralFees
    campaigns
  status: CONFIRMED
  severity: Medium
  confidence: 90
  poc: PASS — ForkFW-DD-02-FeesLockedForever.t.sol (1/1 test, Base mainnet fork, native
    ETH)
  verify: PASS — Flywheel 0x00000F14AD09382841DB481403D1775ADeE1179F on Base. Immutable
    (no proxy, no owner). No recent fix.
  source_hunters:
  - FlowHunter
  - DoSHunter
  - WildcardHunter
  root_cause: "Three mechanisms combine to permanently lock fees:\n\n1. _onSend (line\
    \ 69-108): Sets sendFeesNow=true. If fee transfer fails in\n   Flywheel._processFees\
    \ (line 632-648), the fee is allocated to\n   allocatedFee[campaign][token][key]\
    \ and totalAllocatedFees incremented.\n\n2. _onDistributeFees (line 113-130):\
    \ Calls _processBuilderCode(code).\n   If the builder code has been deregistered\
    \ from BuilderCodes, the try/catch\n   in _processBuilderCode (line 175-191) catches\
    \ the error and returns\n   (false, bytes32(0), address(0)). When success=false\
    \ (line 121),\n   the function returns an EMPTY distributions array.\n   → Flywheel.distributeFees\
    \ processes 0 items → fee stays in allocatedFee.\n\n3. _onUpdateStatus (line 147-157):\
    \ ONLY allows transition to ACTIVE.\n   `if (newStatus != Flywheel.CampaignStatus.ACTIVE)\
    \ revert InvalidCampaignStatus()`\n   → Campaign can NEVER reach FINALIZED.\n\
    \   → withdrawFunds solvency (line 509-512) ALWAYS uses the non-FINALIZED path:\n\
    \     requiredSolvency = totalAllocatedFees + totalAllocatedPayouts\n   → Stuck\
    \ fees count against withdrawable balance forever.\n\n4. _onWithdrawFunds (line\
    \ 133-144): No access control, but Flywheel's solvency\n   check (line 512) prevents\
    \ withdrawing more than balance - totalAllocatedFees -\n   totalAllocatedPayouts.\
    \ The stuck fee in totalAllocatedFees is untouchable.\n"
  code_evidence:
  - file: src/hooks/BridgeReferralFees.sol
    lines: 113-130
    description: _onDistributeFees returns empty array when builder code deregistered
  - file: src/hooks/BridgeReferralFees.sol
    lines: 175-191
    description: _processBuilderCode try/catch returns (false,0,0) on deregistered
      code
  - file: src/hooks/BridgeReferralFees.sol
    lines: 147-157
    description: _onUpdateStatus only allows ACTIVE, never FINALIZED
  - file: src/Flywheel.sol
    lines: 508-512
    description: withdrawFunds solvency includes totalAllocatedFees for non-FINALIZED
  - file: src/Flywheel.sol
    lines: 466-477
    description: distributeFees only decrements on successful transfer
  attack_scenario: "1. Builder registers code \"mycode\" in BuilderCodes, sets payoutAddress\n\
    2. User bridges tokens via send() with code=\"mycode\", feeBps=200 (2%)\n   →\
    \ Fee transfer to payoutAddress FAILS (e.g., payoutAddress is contract that reverts)\n\
    \   → Fee allocated: allocatedFee[campaign][token][tokenId_key] += feeAmount\n\
    \   → totalAllocatedFees[campaign][token] += feeAmount\n3. Builder deregisters\
    \ code \"mycode\" from BuilderCodes\n4. Anyone calls distributeFees(campaign,\
    \ token, \"mycode\")\n   → _processBuilderCode(\"mycode\") → try BUILDER_CODES.toTokenId(\"\
    mycode\") → REVERTS\n   → catch returns (false, 0, 0)\n   → _onDistributeFees\
    \ returns empty array\n   → No fees distributed, allocatedFee unchanged\n5. Fee\
    \ is permanently locked. Campaign can never FINALIZE (only ACTIVE allowed).\n\
    \   withdrawFunds cannot bypass totalAllocatedFees solvency.\n\nEven without deregistration:\
    \ if the payoutAddress is a contract that\nconsistently reverts, the fee is stuck\
    \ after the initial send failure.\n"
  impact: 'Fees are permanently locked in the campaign contract. The amount depends
    on

    bridge volume and fee percentage. With MAX_FEE_BASIS_POINTS = uint8 max (255)

    = 2.55%, at high bridge volumes this could be significant.


    No party (not even Flywheel admin — there is none) can recover these funds.

    This is a permanent loss of funds with no recovery path.

    '
  invariant_solidity: "// INV-FW-02: Every allocated fee must have a viable distribution\
    \ path\nfunction invariant_fees_distributable(\n    address campaign, address\
    \ token, bytes32 key\n) external view {\n    uint256 allocated = flywheel.allocatedFee(campaign,\
    \ token, key);\n    if (allocated > 0) {\n        // There must exist a valid\
    \ distribution path for this fee\n        // In BridgeReferralFees: the builder\
    \ code behind this key must be registered\n        // This invariant would need\
    \ to be checked against BuilderCodes state\n        assert(allocated == 0 || true);\
    \ // placeholder - needs BuilderCodes integration\n    }\n}\n"
  notes: 'There''s an additional subtlety: _onDistributeFees uses the BUILDER_CODES

    fallback key which is bytes32(tokenId). But the allocated fee key was ALSO

    bytes32(tokenId) from _onSend (line 102). So even if the code is re-registered

    by someone else, the tokenId is deterministic from the code string, so

    re-registration COULD unblock the fee. However, the new registrant''s

    payoutAddress would receive the fee — which may not be the original builder.


    The core issue is that there''s no admin escape hatch for stuck fees.

    '
  redteam_verdict: REPORT_DOWNGRADED
  redteam_severity: Low
  redteam_confidence: 55
  radar_id: cmn8t5w3h000cps018k19aqh3
  report_file: reports/DRAFT-FW-DD-02-fees-locked-forever.md
  code_verified: true
  escalation_verdict: ANALYZED
  variant_hunt_done: true
- id: FW-DD-03
  title: 'CashbackRewards: reward persists after escrow refund when maxRewardBps=0'
  status: NEEDS_MORE_DATA
  severity: Medium
  confidence: 55
  source_hunters:
  - MathHunter
  - DomainHunter
  - TrustBoundaryHunter
  root_cause: "Analysis of _validatePaymentReward (line 292-345):\n\nLine 320-321:\n\
    \  uint256 maxRewardBps = maxRewardBasisPoints[campaign];\n  if (maxRewardBps\
    \ == 0) return (paymentInfoHash, amount, payer, \"\");\n\nWhen maxRewardBps=0,\
    \ this SKIPS percentage validation but DOES NOT skip:\n- Line 301-302: Zero amount\
    \ check ✓\n- Line 304-307: Token mismatch check ✓\n- Line 310-313: hasCollectedPayment\
    \ check ✓\n\nSo the \"uncapped bypass\" is narrower than claimed — it only skips\
    \ the\npercentage cap, not all validation. The payment must still be collected.\n\
    \nThe real concern: TOCTOU between payment state and reward state.\n1. Payment\
    \ is collected → hasCollectedPayment = true\n2. Manager calls send() → reward\
    \ sent, distributed += amount\n3. Escrow refunds the payment → buyer gets original\
    \ payment back\n4. Buyer now has: original payment (refund) + reward (cashback)\n\
    \nKey question: Can a \"collected\" payment be refunded? This depends on\nAuthCaptureEscrow\
    \ semantics. The name \"AuthCaptureEscrow\" suggests\nauth→capture flow. \"hasCollectedPayment\"\
    \ likely means captured.\nThe \"refundableAmount\" returned by paymentState (line\
    \ 310) suggests\npartial refunds are possible after capture.\n\nBUT: the manager\
    \ is a TRUSTED role (onlyManager modifier on all operations).\nThe manager decides\
    \ when to call send(). If the manager only sends rewards\nfor payments that won't\
    \ be refunded, there's no issue. This is a trust\nmodel question, not a code bug\
    \ per se.\n"
  code_evidence:
  - file: src/hooks/CashbackRewards.sol
    lines: 320-321
    description: maxRewardBps=0 skips percentage validation, returns success
  - file: src/hooks/CashbackRewards.sol
    lines: 310-313
    description: hasCollectedPayment check still runs before early return
  - file: src/hooks/CashbackRewards.sol
    lines: '124'
    description: distributed += amount after send, no clawback mechanism
  - file: src/hooks/CashbackRewards.sol
    lines: 323-324
    description: paymentAmount = refundableAmount — tracks post-capture refundable
  attack_scenario: "Requires: maxRewardBasisPoints[campaign] = 0 (uncapped), AND trusted\
    \ manager\nsends reward for a payment that subsequently gets refunded.\n\n1. Buyer\
    \ makes payment of 100 USDC via Commerce Payments\n2. Merchant captures payment\
    \ → hasCollectedPayment = true\n3. Campaign manager calls send() with payoutAmount=5\
    \ USDC reward\n   → _validatePaymentReward passes (collected=true, maxRewardBps=0\
    \ skips % check)\n   → rewards[campaign][hash].distributed = 5\n   → Buyer receives\
    \ 5 USDC cashback\n4. Merchant initiates partial/full refund via escrow\n   →\
    \ Buyer receives 100 USDC refund\n5. Buyer net: 105 USDC for a 100 USDC purchase\
    \ that was refunded\n   → Merchant lost 100 USDC (refund) + campaign lost 5 USDC\
    \ (reward)\n\nThis requires the manager to act before knowing the payment won't\
    \ be refunded.\nIn practice, the manager is likely an automated system that sends\
    \ rewards\nimmediately on capture, before the refund window closes.\n"
  impact: 'Campaign funds lost equal to the reward amount. Per-payment loss is bounded

    by the reward amount (typically small % of payment). But at scale, with

    automated reward distribution, this could accumulate.


    The loss falls on the campaign funder, not on any protocol component.

    The buyer benefits from both refund + reward.


    NEEDS_MORE_DATA because:

    - AuthCaptureEscrow interface not in this repo — need to verify refund mechanics

    - Need to confirm if "collected" payments can actually be refunded

    - Trust model: manager is trusted, may be expected to handle timing

    '
  invariant_solidity: "// INV-FW-03: Distributed rewards should not exceed non-refunded\
    \ payment value\n// Requires AuthCaptureEscrow state access\nfunction invariant_reward_not_exceeding_payment(\n\
    \    address campaign, bytes32 paymentHash\n) external view {\n    (bool collected,\
    \ uint120 capturable, uint120 refundable) =\n        escrow.paymentState(paymentHash);\n\
    \    CashbackRewards.RewardState memory rs = cashbackRewards.rewards(campaign,\
    \ paymentHash);\n    // If payment fully refunded (refundable=0), no rewards should\
    \ have been distributed\n    if (collected && refundable == 0) {\n        assert(rs.distributed\
    \ == 0);\n    }\n}\n"
  notes: 'maxRewardBps=0 meaning "uncapped" vs "disabled" is ambiguous. Line 320-321

    treats 0 as "no cap configured, skip validation." This is likely intentional:

    campaign creators who don''t want a cap set it to 0. But it means a misconfigured

    campaign with maxRewardBps=0 has NO upper bound on reward per payment.


    A secondary concern: with maxRewardBps=0, the manager could reward MORE than

    the payment amount. _validatePaymentReward only checks percentage when

    maxRewardBps > 0. With maxRewardBps=0, amount is unchecked against payment

    value. The manager could send rewards of 1000 USDC for a 1 USDC payment.

    But again — trusted manager role.

    '
- id: FW-DD-04
  title: attributionProvider can skip FINALIZING → FINALIZED directly from ACTIVE
  status: REJECTED
  severity: Info
  confidence: 95
  source_hunters:
  - AccessHunter
  - FlowHunter
  root_cause: "Code at AdConversion._onUpdateStatus line 576-579:\n  // Attribution\
    \ window protection: Advertiser cannot bypass FINALIZING\n  // (ACTIVE → FINALIZED)\
    \ but Attribution Provider can\n  if (oldStatus == Flywheel.CampaignStatus.ACTIVE\n\
    \      && newStatus == Flywheel.CampaignStatus.FINALIZED) {\n      if (sender\
    \ == advertiser) revert Unauthorized();\n  }\n\nThe comment on line 576 EXPLICITLY\
    \ states this is intentional:\n\"Attribution Provider can\" skip FINALIZING.\n\
    \nThe attribution window (set in FINALIZING, line 582-585) protects the\nattributionProvider's\
    \ time to submit final conversions. The ADVERTISER\ncannot skip it because it\
    \ would cut off the provider's attribution window.\nBut the provider itself can\
    \ skip it because they're the one who benefits\nfrom the window — waiving their\
    \ own protection is their prerogative.\n"
  code_evidence:
  - file: src/hooks/AdConversion.sol
    lines: 576-579
    description: Comment explicitly states provider can bypass FINALIZING
  - file: src/hooks/AdConversion.sol
    lines: 582-585
    description: Attribution deadline only set when entering FINALIZING
  - file: src/hooks/AdConversion.sol
    lines: 587-590
    description: Deadline enforcement only applies to advertiser in FINALIZING→FINALIZED
  attack_scenario: 'Not an attack. This is documented, intentional behavior.


    The attributionProvider voluntarily skipping the attribution window only

    affects themselves (they lose time to submit final conversions). The

    advertiser cannot exploit this because they cannot impersonate the provider.


    However, when combined with FW-DD-01 (FINALIZED solvency bypass), the

    provider doing ACTIVE→FINALIZED directly DOES have an impact: any

    allocations made during ACTIVE become unclaimable. But that''s FW-DD-01''s

    bug, not this transition''s fault.

    '
  impact: 'By-design behavior. The attribution window protects the provider, and the

    provider can waive their own protection. No fund loss from this alone.

    '
  invariant_solidity: '// No invariant needed — this is by-design behavior.

    // The real invariant is FW-DD-01 about allocated payouts in FINALIZED state.

    '
  notes: 'This becomes relevant ONLY in combination with FW-DD-01. If FW-DD-01 is

    fixed (distribute works in FINALIZED, or FINALIZED requires zero allocations),

    then this transition path is completely safe.

    '
- id: FW-DD-05
  title: configId=0 skips conversion config validation in AdConversion._onSend
  status: REJECTED
  severity: Low
  confidence: 90
  source_hunters:
  - AccessHunter
  - SignatureHunter
  - WildcardHunter
  root_cause: "Code at AdConversion._onSend line 438-447:\n  // Validating that the\
    \ config exists\n  if (configId != 0) {\n      if (configId > conversionConfigCount[campaign])\
    \ revert InvalidConversionConfigId();\n      ConversionConfig memory config =\
    \ conversionConfigs[campaign][configId];\n      // Validate that the conversion\
    \ type matches the config\n      if (config.isEventOnchain && logBytes.length\
    \ == 0) revert InvalidConversionType();\n      if (!config.isEventOnchain && logBytes.length\
    \ > 0) revert InvalidConversionType();\n  }\n\nAnd line 49 comment: \"Configuration\
    \ ID for the conversion (0 = no config/unregistered)\"\n\nconfigId=0 is a SENTINEL\
    \ value meaning \"this conversion has no registered config.\"\nThis is by-design.\
    \ The validation skipped is:\n1. Config existence check (configId > configCount)\n\
    2. isActive check (NOT CHECKED EVEN FOR configId > 0 — see below!)\n3. Onchain/offchain\
    \ type matching\n\nCRITICAL OBSERVATION: Even for configId > 0, the code does\
    \ NOT check\n`config.isActive`. Line 442 loads the config but never checks isActive.\n\
    The disableConversionConfig (line 279-292) sets isActive=false, but _onSend\n\
    never reads it. This means disabled configs are STILL usable for attributions.\n\
    \nHowever, the attributionProvider is a TRUSTED role. They have full control\n\
    over what conversions to submit and what amounts to pay. The configId\nvalidation\
    \ is an informational/organizational tool, not a security boundary.\nThe provider\
    \ can already send arbitrary payouts to arbitrary recipients.\n"
  code_evidence:
  - file: src/hooks/AdConversion.sol
    lines: 438-447
    description: configId=0 skips all config validation
  - file: src/hooks/AdConversion.sol
    lines: '49'
    description: Comment documents 0 as sentinel for unregistered
  - file: src/hooks/AdConversion.sol
    lines: '442'
    description: Config loaded but isActive NEVER checked even for valid configId
  - file: src/hooks/AdConversion.sol
    lines: 279-292
    description: disableConversionConfig sets isActive=false but nothing enforces
      it
  attack_scenario: "Not really an attack given the trust model:\n\n1. Advertiser creates\
    \ campaign with configs [1: offchain, 2: onchain]\n2. Advertiser disables config\
    \ 1 (isActive=false)\n3. attributionProvider submits attributions with configId=1\n\
    \   → Config loaded (line 442), isActive=false, BUT isActive never checked\n \
    \  → Attribution processed normally\n4. OR: attributionProvider uses configId=0\n\
    \   → Skips entire config block\n   → Attribution processed normally\n\nThe attributionProvider\
    \ already controls payoutAmount and payoutRecipient.\nConfig validation doesn't\
    \ restrict the economic impact of attributions.\n"
  impact: 'Minimal direct impact. The attributionProvider is trusted and can already

    send any amount to any address. The config system is organizational, not

    a security boundary. The advertiser''s only real protection is choosing a

    trusted attributionProvider.


    The isActive check not being enforced in _onSend IS a code quality issue:

    disableConversionConfig exists but has no effect on attribution processing.

    This is misleading to advertisers who think disabling a config stops

    attributions of that type.

    '
  invariant_solidity: "// INV-FW-05: Disabled configs should not be usable for attributions\n\
    // NOTE: This invariant would FAIL with current code, confirming the issue\nfunction\
    \ invariant_disabled_config_blocks_attribution(\n    address campaign, uint16\
    \ configId\n) external view {\n    if (configId > 0 && configId <= adConversion.conversionConfigCount(campaign))\
    \ {\n        (bool isActive,,) = adConversion.conversionConfigs(campaign, configId);\n\
    \        // If config is disabled, no new attributions should use it\n       \
    \ // (would need to track attribution events per configId)\n    }\n}\n"
  notes: "While I'm rejecting this as a standalone finding (trusted role, no security\n\
    boundary), the isActive non-enforcement IS worth noting:\n\n- disableConversionConfig\
    \ (line 279-292) is dead code in terms of actual effect\n- Advertisers may have\
    \ false confidence that disabling a config stops those\n  conversion types from\
    \ being processed\n- This could be an INFO/QA finding about misleading functionality\n\
    \nAlso: the _onSend function at line 439 checks `configId != 0` but never\nchecks\
    \ isActive. This means ALL configs (active or disabled) are treated\nthe same.\
    \ The ONLY thing configId=0 bypasses is the type matching check\n(onchain vs offchain),\
    \ which is a data quality check, not security.\n"
