- id: CLPM-W07
  tier: 1
  type: property
  description: "afterModifyLiquidity passes delta+feeDelta to hook but hook can return hookDelta that exceeds the actual pool delta, shifting costs to caller"
  attack_scenario: |
    In CLPoolManager.modifyLiquidity() line 156, the pool calculates (delta, feeDelta).
    Line 172: afterModifyLiquidity receives `delta + feeDelta` as the combined delta.
    The hook can return a hookDelta via afterAddLiquidity/afterRemoveLiquidity return value.
    Line 106 in CLHooks: `callerDelta = callerDelta - hookDelta`.

    If hookDelta is positive (hook claims tokens), callerDelta becomes more negative
    (caller pays more). The vault then settles:
    - caller pays callerDelta
    - hook pays/receives hookDelta

    A malicious hook can return a large positive hookDelta, making the caller pay extra
    tokens beyond what the pool requires. The hook receives these tokens via the vault.

    The check is whether the vault's settlement properly validates that the total delta
    (callerDelta + hookDelta) equals the pool's actual delta. If vault just blindly
    accounts both deltas, the hook effectively steals from the caller.

    From VaultAppDeltaSettlement line 19: it calls vault.accountAppBalanceDelta with
    both delta (caller) and hookDelta (hook) separately. The vault should ensure
    callerDelta + hookDelta = original pool delta. If it doesn't... the hook steals.
  impact: "Malicious hook extracts tokens from LP users by returning inflated hookDelta in afterModifyLiquidity"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariant: callerDelta + hookDelta must equal pool's original (delta + feeDelta)
    // from modifyLiquidity
    (BalanceDelta poolDelta, BalanceDelta poolFeeDelta) = pool.modifyLiquidity(modParams);
    BalanceDelta expectedTotal = poolDelta + poolFeeDelta;
    // After hook processing:
    // callerDelta + hookDelta should == expectedTotal
    int256 totalAmount0 = int256(callerDelta.amount0()) + int256(hookDelta.amount0());
    int256 totalAmount1 = int256(callerDelta.amount1()) + int256(hookDelta.amount1());
    eq(totalAmount0, int256(expectedTotal.amount0()), "CLPM-W07: amount0 conservation violated");
    eq(totalAmount1, int256(expectedTotal.amount1()), "CLPM-W07: amount1 conservation violated");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: |
    Looking at CLHooks.afterModifyLiquidity more carefully: callerDelta starts as
    (delta + feeDelta), then callerDelta = callerDelta - hookDelta. So callerDelta + hookDelta
    = original (delta + feeDelta). The math IS conserved at the CLHooks level.

    But vault.accountAppDeltaWithHookDelta passes (callerDelta, hookDelta) to vault. The
    vault implementation needs to verify these sum correctly. If vault.accountAppBalanceDelta
    with 6 params just accounts them independently without checking the sum, and the hook
    returned an arbitrary hookDelta... the conservation IS maintained by CLHooks math
    (callerDelta = delta - hookDelta), so callerDelta + hookDelta = delta always.

    CONCLUSION: This is actually safe by construction. The hook can shift WHO pays, but
    the total is conserved. If hookDelta is +X for the hook, callerDelta is -X more for
    caller, and total is the same. The hook still needs to settle its own delta with the
    vault. So this is by-design hook subsidizing/taxing LPs. Downgrading confidence but
    keeping because the attack surface (hook taxing LPs) is real — users must trust hooks.

false_positives:
- hunter: WildcardHunter
  id: CLPM-WFP-01
  reason: |
    poolIdToPoolKey storage manipulation — investigated whether the stored PoolKey could be
    manipulated to create confusion. PoolId = keccak256(PoolKey), so the mapping is deterministic.
    The stored key is ONLY used for reading (public getter) — all pool operations receive the
    key as a parameter and hash it to get the PoolId. An attacker cannot change the stored key
    after initialization, and the stored key has no effect on pool operations. The only use is
    off-chain convenience. NOT a bug.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "poolIdToPoolKey in Uniswap v4-style pools is informational only — not used in any security-critical path. Pool operations always receive PoolKey as param and hash it."
    briefing_update_applied: false

- hunter: WildcardHunter
  id: CLPM-WFP-02
  reason: |
    protocolFeesAccrued uint256 overflow — investigated the unchecked += in CLPoolManager
    lines 203-207. The value is uint256 (2^256 - 1 max). Protocol fee is max 0.4% of swap
    amount. Even with the largest possible swap (type(int256).max), a single swap adds at most
    ~0.4% * 2^255 ≈ 2^243 to protocolFeesAccrued. It would take 2^13 = 8192 max-value swaps
    to overflow. With realistic token decimals (18), this requires cumulative swap volume of
    2^256 / 10^18 ≈ 10^59 tokens. Impossible in any realistic scenario. The unchecked is
    gas optimization, not a vulnerability.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "unchecked += on uint256 protocolFeesAccrued is safe — overflow requires cumulative fees > 2^256, impossible with realistic token supplies"
    briefing_update_applied: false

- hunter: WildcardHunter
  id: CLPM-WFP-03
  reason: |
    Extsload exposing private pool state — this is intentionally inherited from Uniswap v4
    design pattern. Extsload allows gas-efficient state reads for off-chain integrations.
    While it negates Solidity's `private` visibility, this is by-design and well-documented.
    The blockchain is transparent anyway — private only prevents on-chain contract reads,
    not off-chain reads. Not a vulnerability.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Extsload in Uniswap v4 / PancakeSwap Infinity is by design — do not report as a vulnerability. Private state on-chain is never truly private."
    briefing_update_applied: false
