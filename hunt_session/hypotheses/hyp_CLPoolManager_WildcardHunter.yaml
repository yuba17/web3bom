    bytes32 slot0Data = poolManager.extsload(slot0StorageSlot);
    // If data is readable, the invariant is that it matches getSlot0()
    (uint160 sqrtPrice,,,) = poolManager.getSlot0(poolId);
    // Just confirming the data is accessible — not a bug per se
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: |
    This is definitively by design (copied from Uniswap v4). NOT a bug. Including it as
