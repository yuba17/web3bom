  type: property
  description: "Concurrent callRemoteCommitReveal() calls race on address(this).balance -- second caller can steal first caller's ETH or first caller's reveal fails"
  attack_scenario: "callRemoteCommitReveal() es NOT reentrancy-protected. Dos usuarios llamando simultaneamente comparten address(this).balance. User A envia 2 ETH: primer dispatch (commitment) usa msg.value = 2 ETH, pero el hook solo consume 1 ETH, dejando 1 ETH en el router. Segundo dispatch (reveal) usa address(this).balance = 1 ETH. Si User B llama entre el primer y segundo dispatch de A (en el mismo bloque via bundle), B's primer dispatch puede consumir el ETH residual de A, dejando A sin fondos para su reveal dispatch. Esto NO requiere reentrancy -- solo concurrencia en el mismo bloque."
  impact: "Un usuario puede inadvertidamente usar el ETH de otro usuario para su reveal dispatch. El primer usuario's reveal dispatch falla por fondos insuficientes. El commitment se entrega pero el reveal no."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // callRemoteCommitReveal flow:
    // 1. First dispatch: _dispatchMessageWithValue(..., msg.value)  [L606-618]
    // 2. Second dispatch: _dispatchMessageWithValue(..., address(this).balance)  [L624-631]
    // Between 1 and 2, address(this).balance = msg.value - fee1
    // If another tx runs between, balance changes
    // In same-block MEV context, this is exploitable
    uint256 balanceBefore = address(router).balance;
    // After a callRemoteCommitReveal, balance should be 0 (all value used for dispatches)
    // If balance > 0, there's residual ETH that can be claimed by next caller
    uint256 balanceAfter = address(router).balance;
    t(balanceAfter == 0, "IAR-DOS-10: router has residual ETH after callRemoteCommitReveal -- vulnerable to front-running");
  ghost_vars:
    - ghost_commitRevealConcurrentCalls
  validated: true
  priority: high
  confidence: 70
  notes: "Esto es fundamentalmente el mismo bug que IAR-DOS-02 pero con enfoque en la concurrencia. La raiz del problema es usar address(this).balance en vez de calcular el valor exacto necesario (msg.value - fee1). Si el segundo dispatch usara msg.value - fee1 (o el valor retornado por el primer dispatch), no habria race condition. Esto es un pattern de design flaw, no un bug accidental. Combinar con IAR-DOS-02 para un finding mas fuerte."
  poc_sketch: |
    // 1. Alice sends callRemoteCommitReveal{value: 2 ether}()
    // 2. Commitment dispatch consumes 1 ether (fee), 1 ether remains
    // 3. In same block, Bob sends callRemoteCommitReveal{value: 2 ether}()
    // 4. Bob's commitment dispatch consumes 1 ether, leaving Bob's 1 ether + Alice's 1 ether
    // 5. Bob's reveal dispatch uses address(this).balance = 2 ether (steals Alice's 1 ether)
    // 6. Alice's reveal dispatch uses address(this).balance = 0 ether -> reverts or underpays
  call_stack: 'Alice: callRemoteCommitReveal() -> dispatch1(msg.value) -> [Bob interleaves] -> dispatch2(address(this).balance = wrong)'

false_positives:
- hunter: DoSHunter
  id: IAR-DOS-FP-01
  reason: "handle() no teniendo onlyRemoteRouter es by design, no un DoS vector. El comment en L133 explica que el sistema esta disenado para recibir mensajes de contratos untrusted. Cada ICA es aislada por (origin, owner, sender, ism, salt), asi que un mensaje malicioso solo afecta la ICA del atacante, no las de otros usuarios."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: none
    briefing: ''
    content: ''
    briefing_update_applied: false
- hunter: DoSHunter
  id: IAR-DOS-FP-02
  reason: "OwnableMulticall.multicall() loop no es unbounded en el sentido clasico -- el gas limit lo controla el sender via hookMetadata. Si el sender especifica gas suficiente, todas las calls se ejecutan. Si no, falla. No hay vector de DoS a terceros porque cada mensaje tiene su propio gas budget."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: none
    briefing: ''
    content: ''
    briefing_update_applied: false
- hunter: DoSHunter
  id: IAR-DOS-FP-03
  reason: "getDeployedInterchainAccount Create2 deploy no puede fallar por address collision. Create2 con salt unico siempre genera address unico. Si la address ya tiene codigo (isContract=true), skip deploy. No hay DoS vector en el deployment path."
