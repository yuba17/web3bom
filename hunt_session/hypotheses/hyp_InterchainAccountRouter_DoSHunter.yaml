- id: IAR-DOS-09
  tier: 2
  type: property
  description: "ICA proxy deployment via Create2 es deterministica pero irrevocable -- si el implementation contract es destruido o corrupted, todas las ICAs quedan bricked"
  attack_scenario: "El constructor L73 despliega el implementation via Create2.deploy(0, bytes32(0), bytecode). Todas las ICAs son MinimalProxy que delegan al implementation. Si alguien logra destruir el implementation contract (via selfdestruct en una delegatecall, o un bug en el EVM), todas las proxies se vuelven no-funcionales. Las proxies siguen existiendo pero delegatecall a una address sin codigo retorna success=true con empty data, lo que puede causar comportamiento inesperado. En Solidity >=0.8.13 con EIP-3529, SELFDESTRUCT esta deprecated pero todavia funciona. El implementation tiene receive() y funciones, pero es un contrato regular sin selfdestruct."
  impact: "Si el implementation muere, TODAS las ICAs en esa chain quedan permanentemente inutilizables. Fondos en ICAs (ETH + tokens) quedan atrapados."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Constructor L73: implementation = Create2.deploy(0, bytes32(0), bytecode)
    // implementation is OwnableMulticall(address(this)) -- constructor arg is router address
    // All ICAs are MinimalProxy pointing to implementation
    // If implementation.code.length == 0, all proxies are dead
    address impl = router.implementation();
    t(impl.code.length > 0, "IAR-DOS-09: implementation contract destroyed -- all ICAs bricked");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 60
  notes: "El riesgo es bajo porque OwnableMulticall no tiene selfdestruct y no acepta delegatecalls de fuentes externas. El unico vector seria un bug en el EVM (ej: Pectra hardfork cambiando semantica de selfdestruct/create2). El implementation es desplegado via Create2 con salt=0, asi que su address es deterministica. Si se destruyera, Create2 podria re-desplegarlo en la misma address (si el bytecode es el mismo). Post-EIP-6780, selfdestruct solo destruye en la misma tx que deployment, asi que en la practica el implementation es inmutable una vez desplegado."
  poc_sketch: ''
  call_stack: ''

