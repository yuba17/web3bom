- id: IAR-DOS-01
  tier: 1
  type: property
  description: "handle() con CALLS message: si UNA call en el array multicall revierte, TODA la entrega del mensaje se bloquea -- no hay try/catch ni skip de calls fallidas"
  attack_scenario: "Cuando un usuario envia un batch de calls via callRemote(), todas las calls se ejecutan atomicamente en handle() L162-163 via ica.multicall(). Si el usuario incluye N calls y la call N-1 revierte (ej: target contract pausado, fondos insuficientes en ICA, target autodestruido), TODA la entrega falla. El relayer reintenta pero siempre falla. El mensaje queda permanentemente stuck en el Mailbox. Peor: si el usuario envio ETH value con el mensaje, ese ETH queda atrapado en el Mailbox/relayer porque handle() revierte. El usuario no tiene forma de cancelar el mensaje ni recuperar los fondos. Un atacante puede self-DoS o grief a su propia ICA intencionalmente, pero el impacto real es sobre usuarios legitimos cuyo call target cambia de estado entre dispatch y delivery (cross-chain latency window)."
  impact: "Mensajes con calls que reviertan quedan permanentemente bloqueados. ETH enviado como value queda potencialmente atrapado. No hay mecanismo de retry parcial ni cancelacion."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // handle() L162-163: ica.multicall{value: msg.value}(calls)
    // CallLib.multicall iterates all calls, any revert propagates up
    // No try/catch wrapping individual calls
    // Invariant: si una call individual revierte, todo handle() revierte
    // En fuzzing: enviar mensaje con una call valida + una call que revierte
    // Verificar que el mensaje queda sin procesar
    bool handleReverted = false;
    try router.handle{value: 0}(originDomain, senderRouter, maliciousMessage) {
        // handle succeeded
    } catch {
        handleReverted = true;
    }
    // Si la call interna revierte, handle DEBE revertir (esto es el comportamiento actual)
    // El invariante verifica que NO hay mecanismo de recovery
    t(handleReverted, "IAR-DOS-01: handle reverts when inner call reverts -- no partial execution");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "Este es un patron conocido en cross-chain messaging. Hyperlane ICA no tiene mecanismo de retry selectivo ni skip de calls fallidas. La mitigacion esperada es que los usuarios sean responsables de sus calls. Pero la ventana de latencia cross-chain crea un gap donde el estado del target puede cambiar entre dispatch y delivery. Comparar con Axelar/LayerZero que tienen mecanismos de retry/refund."
  poc_sketch: |
    // 1. User dispatches callRemote with 2 calls: [transferERC20, interactWithPausableContract]
    // 2. During cross-chain latency, target contract gets paused
    // 3. Relayer delivers message, handle() calls ica.multicall()
    // 4. First call succeeds, second call reverts (paused)
    // 5. Entire handle() reverts, message permanently stuck
    // 6. No cancel/retry mechanism exists
  call_stack: 'Mailbox.process() -> InterchainAccountRouter.handle() -> ica.multicall() -> CallLib.multicall() -> CallLib.call() -> Address.functionCallWithValue() -> REVERT'

- id: IAR-DOS-02
  tier: 1
  type: property
  description: "callRemoteCommitReveal() usa address(this).balance para pagar el segundo dispatch -- un atacante puede front-run con selfdestruct/coinbase para manipular el pago del reveal message"
  attack_scenario: "En callRemoteCommitReveal() L630, el segundo dispatch (reveal message) usa address(this).balance como value. Un atacante puede enviar ETH al router via selfdestruct() o coinbase rewards ANTES de la tx del usuario. Esto infla address(this).balance, haciendo que el reveal dispatch pague MAS de lo necesario al hook. El exceso de ETH se pierde para el router. Inversamente, si otro usuario llama callRemoteCommitReveal() justo antes, puede drenar el balance del router, haciendo que el segundo dispatch falle por fondos insuficientes si el hook requiere pago. El router tiene receive() payable, asi que cualquiera puede enviar ETH."
  impact: "Usuarios pueden perder ETH extra en el reveal dispatch, o el reveal dispatch puede fallar si el balance fue drenado por una tx concurrente. El commitment se entrega pero el reveal no, dejando el commitment sin poder ejecutarse."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // callRemoteCommitReveal L606-618: primer dispatch usa msg.value
    // L624-631: segundo dispatch usa address(this).balance
    // Si alguien envia ETH al router entre las dos llamadas, el balance cambia
    // Race condition: dos usuarios llamando callRemoteCommitReveal concurrentemente
    uint256 routerBalance = address(router).balance;
    // El router no debe tener balance residual significativo despues de operaciones
    // Un balance alto indica ETH atrapado o manipulacion
    // Despues de callRemoteCommitReveal, el balance deberia ser ~0
    t(routerBalance < 1 ether, "IAR-DOS-02: router has unexpected ETH balance -- potential stuck funds or manipulation");
  ghost_vars:
    - ghost_routerBalanceBefore
    - ghost_routerBalanceAfter
  validated: true
  priority: high
  confidence: 75
  notes: "address(this).balance es un patron peligroso en contratos con receive() payable. El primer dispatch consume msg.value, el segundo consume TODO el balance restante. Si msg.value > fee del primer dispatch, el sobrante se usa para el segundo. Pero si hay ETH residual de otros sources, se incluye. Esto puede causar overpayment o underpayment dependiendo del estado del balance."
  poc_sketch: |
    // 1. Alice calls callRemoteCommitReveal{value: 2 ether}()
    // 2. First dispatch (commitment) consumes 1 ether
    // 3. Bob front-runs with selfdestruct sending 10 ether to router
    // 4. Second dispatch (reveal) pays address(this).balance = 11 ether (1 ether residual + 10 ether attack)
    // 5. Alice overpays 10 ether for the reveal message
    // Alternatively:
    // 1. Alice calls callRemoteCommitReveal{value: 2 ether}()
    // 2. Carol simultaneously calls callRemoteCommitReveal{value: 2 ether}()
    // 3. Carol's first dispatch runs first, consuming her msg.value
    // 4. Carol's second dispatch uses address(this).balance which now includes Alice's value
    // 5. Alice's second dispatch has insufficient balance
  call_stack: 'callRemoteCommitReveal() -> _dispatchMessageWithValue(msg.value) -> _dispatchMessageWithValue(address(this).balance)'

- id: IAR-DOS-03
  tier: 1
  type: property
  description: "Gas griefing via calls con datos arbitrariamente grandes -- un usuario puede crear un mensaje con calls[] enormes que excede el gas limit del relayer"
  attack_scenario: "callRemote() acepta un array CallLib.Call[] sin limite de tamano. Cada Call tiene bytes data sin limite. Un usuario puede dispatchar un mensaje con miles de calls o calls con data de megabytes. Cuando el relayer intenta entregar el mensaje via handle(), la decodificacion de _message.calls() (abi.decode del array) consume gas proporcional al tamano. Incluso si las calls individuales no son costosas, la decodificacion puede exceder el block gas limit. El mensaje queda permanentemente sin entregar. El usuario paga el dispatch fee (quizas bajo), pero el relayer pierde gas intentando entregar un mensaje imposible."
  impact: "Relayer pierde gas en intentos fallidos de entrega. Mensajes con payload excesivo quedan permanentemente bloqueados. No es un DoS a otros usuarios (cada mensaje es independiente), pero si un griefing al relayer."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // handle() L162: CallLib.Call[] memory calls = _message.calls()
    // _message.calls() = abi.decode(_message[97:], (CallLib.Call[]))
    // abi.decode de un array grande consume gas proporcional al tamano
    // No hay limite en la cantidad de calls ni en el tamano de call.data
    // El gas limit del handle() esta determinado por el hookMetadata del sender
    // Si el sender especifica gas limit insuficiente, el relayer falla
    // Invariante: verificar que mensajes con calls grandes no causan OOG
    uint256 callsLength = 0; // decoded from message
    // En un test real, crear mensaje con 1000 calls vacias y medir gas
    t(callsLength < 100, "IAR-DOS-03: message has excessive number of calls -- potential gas griefing");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 65
  notes: "El gas griefing al relayer es limitado porque el dispatch fee deberia cubrir el gas cost de la entrega. Si el gas payment hook esta bien calibrado, el usuario paga por el gas que el relayer necesita. Sin embargo, si el gas estimation es incorrecta o el usuario especifica un gas limit bajo en hookMetadata, el relayer pierde. La mitigacion es que los relayers pueden filtrar mensajes con payload excesivo off-chain."
  poc_sketch: |
    // 1. Attacker creates 10000 Call structs with empty data
    // 2. Dispatches via callRemote with minimal msg.value
    // 3. Relayer tries to deliver, abi.decode of 10000 Call structs exceeds gas
    // 4. handle() reverts with OOG
    // 5. Relayer retries, fails again, eventually gives up
  call_stack: 'Mailbox.process() -> InterchainAccountRouter.handle() -> _message.calls() -> abi.decode (OOG)'

