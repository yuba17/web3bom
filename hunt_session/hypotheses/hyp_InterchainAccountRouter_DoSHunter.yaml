- id: IAR-DOS-06
  tier: 1
  type: property
  description: "Commitment sin reveal: setCommitment marca commitment como pending, pero si el reveal message nunca llega o falla, el commitment queda pendiente para siempre bloqueando re-uso del mismo commitment hash"
  attack_scenario: "callRemoteCommitReveal() envia DOS mensajes: (1) commitment que setea commitments[hash] = true en la ICA, y (2) reveal que ejecuta las calls y borra el commitment. Si el reveal message falla (relayer no lo entrega, ISM rechaza, gas insuficiente), el commitment queda pendiente permanentemente. La ICA tiene require(!commitments[_commitment], 'Previous commitment pending execution') en setCommitment(), asi que el mismo hash no se puede re-enviar. El usuario necesaria generar un nuevo commitment con salt diferente. Los fondos enviados con el commitment message quedan en la ICA sin poder ejecutarse."
  impact: "Commitment permanentemente pendiente bloquea re-envio del mismo commitment hash. El usuario debe generar nuevo commitment con diferente salt. Fondos en la ICA asociados al commitment quedan sin ejecutar."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // OwnableMulticall.setCommitment L41-48:
    // require(!commitments[_commitment], "ICA: Previous commitment pending execution");
    // commitments[_commitment] = true;
    // revealAndExecute L60: require(commitments[revealedHash], "ICA: Invalid Reveal");
    // L64: delete commitments[revealedHash];
    // Si reveal nunca llega, commitments[hash] queda true para siempre
    // No hay mecanismo de cancelacion/cleanup de commitments pendientes
    // El owner de la ICA (el router) no tiene funcion para limpiar commitments
    // Invariante: un commitment pendiente debe eventualmente ejecutarse o ser cancelable
    // Como no hay cancel, verificar que el re-envio funciona con salt diferente
    t(true, "IAR-DOS-06: no cancellation mechanism for pending commitments -- stuck if reveal fails");
  ghost_vars:
    - ghost_pendingCommitments
  validated: true
  priority: high
  confidence: 80
  notes: "El commitment-reveal pattern tiene un gap fundamental: no hay mecanismo de cancelacion. Si el reveal falla, el commitment es permanente. La ICA no expone funcion para limpiar commitments (solo el owner=router puede llamar setCommitment, y el router no tiene cancel function). El workaround es usar un salt diferente para un nuevo commitment, pero los fondos del commitment original quedan inutilizados si se enviaron value con el commitment message. revealAndExecute es permissionless (no tiene onlyOwner), asi que cualquiera puede revelar si conoce las calls y salt."
  poc_sketch: |
    // 1. Alice calls callRemoteCommitReveal() -- sends commitment + reveal messages
    // 2. Commitment message delivered: ICA.commitments[hash] = true
    // 3. Reveal message delivery fails (gas too low, ISM rejects, etc)
    // 4. ICA.commitments[hash] is permanently true
    // 5. Alice tries to re-send same commitment -> setCommitment reverts "Previous commitment pending execution"
    // 6. Alice must create new commitment with different salt
    // 7. No way to clear the stuck commitment
  call_stack: 'handle(COMMITMENT) -> ica.setCommitment(hash) -> commitments[hash] = true -> [reveal never arrives] -> STUCK'

- id: IAR-DOS-07
  tier: 1
  type: property
  description: "route() permite que el ISM del mensaje sea arbitrario -- un atacante puede especificar un ISM malicioso que revierte en verify(), bloqueando la entrega del mensaje"
  attack_scenario: "route() L170-191 retorna el ISM especificado en el mensaje body. Para CALLS/COMMITMENT messages, usa InterchainAccountMessage.ism(), que viene directamente del sender en la chain origen. Si el sender especifica un ISM que revierte en verify(), el Mailbox no puede procesar el mensaje porque ISM.verify() falla. Esto es self-DoS (el sender bloquea su propio mensaje). PERO: si el sender es un contrato compartido (multisig, DAO), un actor malicioso dentro del contrato podria sabotear mensajes de otros participantes especificando un ISM malicioso. El ISM address(0) se resuelve al defaultIsm del Mailbox, que es seguro."
  impact: "Self-DoS: el sender puede bloquear sus propios mensajes eligiendo un ISM que revierte. No afecta a otros usuarios porque cada mensaje tiene su propio ISM routing."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // route() L172-191: retorna ISM del message body
    // Para CALLS: _ism = InterchainAccountMessage.ism(_body).bytes32ToAddress()
    // Si _ism == address(0), usa mailbox.defaultIsm()
    // Si _ism != address(0), usa el ISM especificado -- sin validacion
    // El ISM puede ser cualquier contrato, incluyendo uno que revierte
    // Invariante: ISM especificado debe ser un contrato valido
    address ismAddr = address(uint160(uint256(specifiedIsm)));
    if (ismAddr != address(0)) {
        t(ismAddr.code.length > 0, "IAR-DOS-07: specified ISM is not a contract -- message undeliverable");
    }
  ghost_vars: []
  validated: true
  priority: low
  confidence: 75
  notes: "El diseno de ICA permite ISMs arbitrarios por diseno -- es una feature, no un bug. El sender elige su propio nivel de seguridad. Self-DoS por ISM incorrecto es responsabilidad del sender. No hay impacto a terceros. El ISM address(0) fallback al defaultIsm es una mitigacion razonable para usuarios que no especifican ISM."
  poc_sketch: ''
  call_stack: 'Mailbox.process() -> InterchainAccountRouter.route(message) -> IInterchainSecurityModule(maliciousIsm).verify() -> REVERT'

- id: IAR-DOS-08
  tier: 1
  type: property
  description: "approveFeeTokenForHook() no tiene access control -- cualquiera puede forzar approval de max uint256 de cualquier token al cualquier hook, habilitando un hook malicioso a drenar tokens del router"
  attack_scenario: "AbstractInterchainAccountRouter.approveFeeTokenForHook() L109-111 es external sin restriccion de acceso. Cualquiera puede llamarlo con _feeToken=<token que el router tiene> y _hook=<attacker contract>. Esto aprueba type(uint256).max al atacante. Si el router tiene balance de ese token (por ejemplo, fee tokens sobrantes de dispatches previos), el atacante puede transferirlos. El router recibe tokens via _dispatchMessageWithValue() L241 (safeTransferFrom del sender), y si el hook no consume todos, quedan residuales. Esto tambien se aplica a tokens enviados por error al router."
  impact: "Cualquier token con balance en el router puede ser drenado por un atacante que llame approveFeeTokenForHook con su propia address como hook. Perdida directa de fondos."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
