    // function approveFeeTokenForHook(address _feeToken, address _hook) external {
    //     IERC20(_feeToken).forceApprove(_hook, type(uint256).max);
    // }
    // NO tiene onlyOwner ni ninguna restriccion de acceso
    // Cualquiera puede llamar con _hook = attacker
    // Invariante: el router no debe tener balance significativo de fee tokens
    // Pero si lo tiene, cualquiera puede drenarlo
    uint256 tokenBalance = IERC20(feeToken).balanceOf(address(router));
