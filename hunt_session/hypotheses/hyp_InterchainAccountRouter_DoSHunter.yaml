  priority: high
  confidence: 90
  notes: "ESTE ES UN FINDING POTENCIAL, NO SOLO DOS. approveFeeTokenForHook sin access control permite a cualquiera aprobar tokens del router a cualquier address. Si el router tiene balance residual de ERC20 fee tokens, es robo directo. La funcion esta disenada para que el owner pre-apruebe fee tokens para hooks, pero sin access control es peligrosa. Verificar si _dispatchMessageWithValue deja residuales: L234 calcula _fee y L241 transfiere exactamente _fee, pero si _fee < balance pre-existente, hay residual. NOTA: Esto puede ser mas un Access Control finding que DoS, pero el impacto incluye que un atacante puede revocar approvals legitimas cambiando el allowance."
  poc_sketch: |
    // 1. Alice calls _dispatchMessageWithValue with feeToken = USDC
