- id: CLPM-07
  tier: 1
  type: property
  description: "getLiquidityForAmounts con price exactamente en tickLower boundary: cuando sqrtRatioX96 == sqrtRatioAX96, solo se usa amount0 (ignora amount1). Si el usuario deposita token1 esperando participar, su token1 queda como crédito no usado sin advertencia."
  attack_scenario: "El precio actual está exactamente en tickLower. El usuario minta una posición con _mintFromDeltas depositando ambos tokens. getLiquidityForAmounts(sqrtPrice == sqrtRatioA) entra en el branch 'sqrtRatioX96 <= sqrtRatioAX96' y usa solo getLiquidityForAmount0. Todo el token1 depositado queda como crédito no consumido. Si el usuario no incluye CLOSE_CURRENCY para token1 en su batch, esos fondos quedan en el vault sin reclamar (accesibles para sweep por cualquiera con crédito)."
  impact: "Pérdida de token1 depositado cuando price == tickLower. Para tokens de alto valor, la pérdida puede ser significativa."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que after _mintFromDeltas, no hay crédito residual significativo
    // Este invariante requiere tracking del crédito antes y después de la operación
    int256 delta0After = vault.currencyDelta(address(clPositionManager), currency0);
    int256 delta1After = vault.currencyDelta(address(clPositionManager), currency1);
    // Después de fromDeltas + settle, los deltas deberían estar cercanos a 0
    // Un delta positivo grande indica tokens no usados
    if (delta1After > int256(ghost_dustThreshold)) {
        t(false, "CLPM-07: significant token1 residue after mintFromDeltas at tick boundary");
    }
  ghost_vars:
  - "uint256 internal ghost_dustThreshold = 1000;"
  validated: false
  priority: medium
  confidence: 50
  notes: "Esto es comportamiento esperado de concentrated liquidity math — fuera del range, solo un token tiene valor. Pero fromDeltas no advierte al usuario. La protección está en amount0Max/amount1Max del _mint interno, pero el usuario ya depositó los tokens. Es más un problema de UX que un exploit directo, pero en batches automatizados por contratos integradores puede causar pérdida real."

- id: CLPM-08
  tier: 1
  type: optimize
  description: "Maximizar precision loss en getLiquidityForAmount0 con tokens de 6 decimales y tick ranges estrechos"
  attack_scenario: "Con tokens de pocos decimales (USDC, 6 dec) y tick ranges muy estrechos, la conversión amount → liquidity → amount puede perder una fracción significativa del depósito. Un atacante podría explotar esto en un round-trip: mint con X tokens, immediate burn, recibir X-loss tokens. Si loss/X > fee, es un vector de extracción del pool."
  impact: "Extracción de valor del pool vía rounding arbitrage en tokens de bajo decimal."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Optimizar: maximizar la diferencia entre tokens depositados y recibidos en round-trip
    // mint(liquidity) → immediate decrease(all_liquidity) → medir loss
    return int256(ghost_tokensDeposited0 + ghost_tokensDeposited1)
         - int256(ghost_tokensReceived0 + ghost_tokensReceived1);
  ghost_vars:
  - "uint256 internal ghost_tokensDeposited0;"
  - "uint256 internal ghost_tokensDeposited1;"
  - "uint256 internal ghost_tokensReceived0;"
  - "uint256 internal ghost_tokensReceived1;"
  validated: false
  priority: medium
  confidence: 45
  notes: "getLiquidityForAmount0 usa FullMath.mulDiv (rounds down). getAmount0ForLiquidity también rounds down. Rounding en ambas direcciones favorece al protocolo. En Uniswap V3 esto es well-known y la pérdida es de 1 wei por token por operación. Fuzzear con USDC (6 dec) y tick ranges de 1-tick para verificar si la pérdida es mayor que dust."

