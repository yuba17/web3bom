  attack_scenario: "Teóricamente imposible (requiere 2^256 mints) pero el uso de unchecked{} sin guard es un anti-patrón. Si de alguna forma se manipula nextTokenId (upgrade, storage collision), tokenId=0 podría ser asignado, y la posición info para tokenId=0 podría ya tener datos residuales."
