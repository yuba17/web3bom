- id: GA-W08
  tier: 1
  type: property
  description: >
    unwrapNative sends ETH via Address.sendValue() to an arbitrary receiver. If the receiver
    is a contract that reverts on receive (e.g., a contract without receive/fallback, or one
    that intentionally reverts), the entire bundle reverts. This is a griefing vector if the
    receiver address is determined by an external party or if the bundle is constructed
    programmatically with user-controlled receiver parameters.
  attack_scenario: >
    1. Protocol X builds on Bundler3 and constructs bundles to pay out rewards in ETH.
    2. User sets their reward recipient to a contract that reverts on ETH receipt.
    3. The unwrapNative call reverts, causing the entire payout bundle to fail.
    4. If multiple users' payouts are batched, one malicious receiver blocks all payouts.
  impact: "DoS of ETH transfers to contracts that reject ETH"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After unwrapNative, the ETH balance of the adapter should decrease by amount
    // and receiver should increase by amount (unless receiver rejects ETH)
    // This is a standard ETH transfer griefing - not specific to this adapter
    uint256 adapterEthAfter = address(adapter).balance;
    lte(adapterEthAfter, ghost_adapterEthBefore, "GA-W08: adapter ETH not decreased after unwrap");
  ghost_vars:
  - "uint256 internal ghost_adapterEthBefore;"
  validated: false
  priority: low
  confidence: 50
  notes: >
    This is a well-known ETH transfer griefing pattern. The adapter uses Address.sendValue()
    which forwards 2300 gas (no, actually sendValue forwards ALL gas). So the receiver can
    execute arbitrary code. However, the bundle initiator controls the receiver parameter,
    so they would only grief themselves. Unless a meta-protocol builds bundles with
    user-controlled receiver parameters. Likely a Low/Info or design-accepted risk.

- id: GA-W09
  tier: 1
  type: property
  description: >
    ERC4626 vault interactions have a reentrancy window during mint/deposit/withdraw/redeem.
    The vault is an external, user-supplied contract. During the external call, the vault can
    call back into the Bundler3 system. Since onlyBundler3 is the only guard on adapter
    functions, and the vault call doesn't go through Bundler3, direct reentrancy into the
    adapter is blocked. BUT the vault could call Bundler3.multicall() to start a NEW bundle
    as a different initiator. This would fail because initiator != address(0) (AlreadyInitiated).
    The vault could also try Bundler3.reenter() but would need the correct reenterHash.
  attack_scenario: >
    1. Malicious vault is used as the vault parameter in erc4626Deposit.
    2. During vault.deposit(), the vault tries to reenter the adapter.
    3. Direct call to adapter: blocked by onlyBundler3 (msg.sender != BUNDLER3).
    4. Call Bundler3.multicall(): blocked by AlreadyInitiated (initiator != 0).
    5. Call Bundler3.reenter(): blocked unless reenterHash matches.
    6. If the current Call in the bundle has a callbackHash set to the hash of the vault's
       reenter data, the vault COULD successfully reenter. But the callbackHash is set by
       the bundle initiator, not the vault.
    7. So the initiator would have to INTENTIONALLY enable the vault to reenter.
    EDGE CASE: What if the initiator sets callbackHash for erc4626Deposit expecting the
    vault to call back? Then the vault controls the reenter bundle content. If the vault
    is malicious, it could encode calls that drain the initiator's approved tokens.
  impact: "If initiator sets callbackHash for ERC4626 calls, a malicious vault controls the reenter bundle"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // The key invariant: after erc4626 operations, no unexpected state changes should occur
    // Test with a malicious vault that tries various reentry paths
    // This is more of a scenario test than a property test
    address currentInitiator = IBundler3(BUNDLER3).initiator();
    t(currentInitiator != address(0), "GA-W09: ERC4626 operation outside bundle context");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    The reenterHash mechanism effectively prevents unauthorized reentry. The only way a
    malicious vault can reenter is if the bundle initiator explicitly enables it via
    callbackHash. This would be a user error (setting callbackHash for a non-callback
    operation). The protocol design seems sound here. The risk is in the UX/documentation
    layer: if a frontend incorrectly sets callbackHash for ERC4626 operations, a malicious
    vault could exploit it. However, this requires user misconfiguration, not a code bug.
    Likely a false positive for the smart contract audit, but worth noting as a design concern.

- id: GA-W10
  tier: 1
  type: property
  description: >
    Cross-adapter composability: if multiple adapters are used in the same bundle, tokens
    transferred to one adapter cannot be used by another adapter. Each adapter is a separate
    contract with its own balance. If a user's bundle involves operations across GeneralAdapter1
    and ParaswapAdapter (or ERC20WrapperAdapter), tokens must be explicitly transferred between
    adapters. A missing transfer step silently fails (zero balance) or uses stale residual tokens.
  attack_scenario: >
    1. User's bundle: [swap USDC->WETH on ParaswapAdapter, supply WETH on GeneralAdapter1].
    2. ParaswapAdapter receives WETH from swap but holds it in its own contract.
    3. GeneralAdapter1.morphoSupply with assets=max reads WETH.balanceOf(GeneralAdapter1) = 0.
    4. Reverts with ZeroAmount.
    5. User needs an explicit erc20Transfer step from ParaswapAdapter to GeneralAdapter1.
    6. If the user forgets this step, the bundle fails. Not exploitable, but a UX footgun
       that could cause failed transactions and wasted gas.
  impact: "Failed bundles due to cross-adapter token routing errors"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // This is a design-level concern, not a property test
    // Invariant: after bundle completion, no adapter should hold residual tokens
    // (tokens should flow through and end up with the intended receiver)
    uint256 adapter1Balance = IERC20(token).balanceOf(address(generalAdapter1));
    eq(adapter1Balance, 0, "GA-W10: residual tokens in GeneralAdapter1 after bundle");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: >
    This is a UX/integration issue, not a security vulnerability. The Bundler3 design
    intentionally uses separate adapter contracts, and users must route tokens explicitly.
    However, the Bundler3 can send value to adapters directly (Call.value field), and
    adapters can transfer ERC20s. The design is sound but complex. Worth documenting as
    an integration consideration. FALSE POSITIVE for security audit.

