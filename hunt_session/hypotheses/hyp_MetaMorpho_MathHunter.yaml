  attack_scenario: "Classic ERC4626 inflation: (1) attacker deposits 1 wei, gets minimal shares. (2) attacker donates to inflate totalAssets. (3) victim deposits large amount, gets 0 or few shares due to inflated ratio. For 18-decimal tokens DECIMALS_OFFSET=0, virtual shares = 1. Formula: shares = assets * (totalSupply + 1) / (totalAssets + 1). With 1 share, 1+D totalAssets, victim gets V * 2 / (2+D) shares — 0 if D >> V. NOTED: this is a known/documented risk in MetaMorpho for 18-dec tokens."
  impact: "Second depositor loses entire deposit to first depositor"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 ts = vault.totalSupply();
    uint256 ta = vault.totalAssets();
    uint256 victimDeposit = 1e18;
    if (ts > 0 && ts < 1e6) {
        uint256 victimShares = vault.previewDeposit(victimDeposit);
        if (victimShares > 0) {
            uint256 victimValue = vault.previewRedeem(victimShares);
            gte(victimValue, victimDeposit * 99 / 100, "MM-M-05: inflation attack - victim loses >1%");
        } else {
            t(false, "MM-M-05: inflation attack - victim gets 0 shares");
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 65
  notes: "KNOWN ISSUE documented in code comments. For 18-decimal tokens with offset=0, the inflation protection is minimal. Morpho Blue's underlying 1e6 virtual shares provide secondary protection at the market level. For 6-decimal tokens offset=12 provides strong protection. This invariant documents the risk boundary."
  poc_sketch: 'Deposit 1 wei -> donate directly to Morpho markets -> victim deposits'
  call_stack: 'constructor() L130 | _convertToSharesWithTotals() L654'

