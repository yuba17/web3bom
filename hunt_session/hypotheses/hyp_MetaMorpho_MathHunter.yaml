- id: MM-M-08
  tier: 1
  type: property
  description: "zeroFloorSub in withdraw must not zero out lastTotalAssets when vault has significant assets"
  attack_scenario: "withdraw() L565: _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets)). If assets > newTotalAssets, lastTotalAssets = 0. Next _accrueFee sees totalInterest = totalAssets() - 0 = totalAssets(), charging fee on ENTIRE vault balance as if it were all interest. This requires withdraw to pass assets > newTotalAssets, which should be impossible because shares-to-assets conversion bounds the withdrawal. But concurrent interest accrual could create a gap."
  impact: "Fee recipient gets fee on entire vault balance — massive theft from depositors"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 lastTA = vault.lastTotalAssets();
    uint256 actualTA = vault.totalAssets();
    uint256 ts = vault.totalSupply();
    if (ts > 1e6 && actualTA > 1e6) {
        gt(lastTA, 0, "MM-M-08: lastTotalAssets is 0 while vault has significant assets and shares");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: "In normal flow, newTotalAssets = totalAssets() and the withdrawal amount comes from shares * (totalAssets+1) / (totalSupply+offset) which is bounded by totalAssets. So assets <= newTotalAssets should always hold. The zeroFloorSub is a safety net. But if Morpho returns more assets than expected from withdraw (e.g., due to interest accrual during the tx), the gap could appear."
  poc_sketch: ''
  call_stack: 'withdraw() L565: _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets))'

