  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: "The strict equality check on L416 is the primary defense. Morpho.withdraw returns actual withdrawn assets, and Morpho.supply takes exact assets. The allocator must craft allocations that balance perfectly. If they cannot (due to rounding), the tx reverts. No accounting gap possible as long as L416 check exists."
