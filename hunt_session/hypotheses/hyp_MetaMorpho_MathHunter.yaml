  attack_scenario: "reallocate() accumulates totalWithdrawn from Morpho.withdraw() return values and totalSupplied from the assets passed to Morpho.supply(). L416 requires strict equality. But Morpho rounding could cause withdrawnAssets (Morpho's return) to differ from the requested amount, making it impossible to balance. This is by design — forces the allocator to handle dust. However, if Morpho rounds UP on withdraw (gives more than requested), totalWithdrawn > expected and the allocator must supply more to balance."
