# ANALYSIS SUMMARY:
# MetaMorpho math is well-designed. All rounding directions favor the vault (existing depositors).
# OZ mulDiv handles overflow. Virtual shares via DECIMALS_OFFSET mitigate inflation (partially for 18-dec tokens).
# Fee accrual rounds down (conservative). Solodit toSupply rounding fix already applied.
# The invariants below codify the critical math properties that MUST hold for the vault to be safe.

invariants:
- id: MM-M-01
  tier: 1
  type: property
  description: "ERC4626 roundtrip: redeem(deposit(X)) <= X — depositor cannot profit from immediate deposit+redeem"
  attack_scenario: "User deposits X assets, receives shares via Floor rounding, then redeems all shares via Floor rounding. Both roundings are against the user. If this breaks, attacker cycles deposit/redeem to drain vault. The virtual offset (10^DECIMALS_OFFSET) and +1 in the conversion formula should prevent profitable roundtrips, but edge cases with very small amounts or specific totalSupply/totalAssets ratios could create rounding in attacker's favor."
  impact: "Value extraction from existing vault depositors on every cycle"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 testAmount = _clampBetween(1, 1e24);
    uint256 shares = vault.previewDeposit(testAmount);
    if (shares > 0) {
        uint256 assetsBack = vault.previewRedeem(shares);
        lte(assetsBack, testAmount, "MM-M-01: roundtrip profit - depositor extracted value");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "Deposit uses Floor (fewer shares for depositor), redeem uses Floor (fewer assets back). Both round against user. For any given totalSupply/totalAssets, previewRedeem(previewDeposit(X)) <= X by construction of mulDiv Floor. Safe by design but worth testing across extreme ranges."
  poc_sketch: ''
  call_stack: 'deposit() L538 Floor -> redeem() L576 Floor'

- id: MM-M-02
  tier: 1
  type: property
  description: "Share price monotonicity: assets-per-share must be non-decreasing across operations"
  attack_scenario: "If totalAssets()/totalSupply() decreases, all shareholders lose value. Interest accrual increases totalAssets. Fee accrual mints new shares against (newTotalAssets - feeAssets), which is designed to preserve share price. If _accrueFee over-mints feeShares (e.g., due to rounding in feeAssets computation), the share price could drop below pre-interest level, meaning fee extraction exceeds the interest earned."
  impact: "All vault depositors lose a fraction of their deposits per fee accrual"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 currentTotalAssets = vault.totalAssets();
    uint256 currentTotalSupply = vault.totalSupply();
    uint256 offset = uint256(vault.DECIMALS_OFFSET());
    uint256 currentPrice = 0;
    if (currentTotalSupply > 0) {
        currentPrice = (currentTotalAssets + 1) * 1e18 / (currentTotalSupply + 10 ** offset);
    }
    if (ghost_lastSharePrice > 0 && currentTotalSupply > 0) {
        gte(currentPrice + 1, ghost_lastSharePrice, "MM-M-02: share price decreased");
    }
    ghost_lastSharePrice = currentPrice;
  ghost_vars:
    - "uint256 ghost_lastSharePrice;"
  validated: true
  priority: high
  confidence: 75
  notes: "+1 tolerance for rounding dust. Fee shares are computed as _convertToSharesWithTotals(feeAssets, totalSupply, newTotalAssets - feeAssets, Floor). The resulting share price for existing holders should be (newTotalAssets - feeAssets + 1) / (totalSupply + 10^offset), which equals the pre-fee price since feeAssets is subtracted from numerator. The feeShares just represent the fee portion. Safe by construction."
  poc_sketch: ''
  call_stack: '_accrueFee() -> _accruedFeeShares() -> _mint(feeRecipient, feeShares)'

- id: MM-M-03
  tier: 1
  type: property
  description: "Fee shares value must not exceed total interest earned"
  attack_scenario: "Each _accrueFee call mints feeShares worth feeAssets = totalInterest * fee / WAD. If the value of feeShares (convertToAssets) exceeds totalInterest, the fee recipient is extracting more than the interest, reducing depositors' share price. The formula mints against (newTotalAssets - feeAssets) denominator, so share value should equal feeAssets. But Floor rounding on feeShares means value <= feeAssets <= totalInterest. This should hold."
  impact: "Fee recipient extracts more than interest earned, depositors suffer loss"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 feeRecBefore = vault.balanceOf(vault.feeRecipient());
    uint256 lastTABefore = vault.lastTotalAssets();
    // After any operation that triggers _accrueFee:
    uint256 feeRecAfter = vault.balanceOf(vault.feeRecipient());
    uint256 newShares = feeRecAfter > feeRecBefore ? feeRecAfter - feeRecBefore : 0;
    if (newShares > 0) {
        uint256 feeValue = vault.convertToAssets(newShares);
        uint256 totalAssetsNow = vault.totalAssets();
        uint256 interest = totalAssetsNow > lastTABefore ? totalAssetsNow - lastTABefore : 0;
        lte(feeValue, interest + 2, "MM-M-03: fee shares value exceeds interest earned");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: "Tolerance of 2 wei for rounding. feeAssets = totalInterest * fee / WAD (Floor). feeShares = feeAssets * (totalSupply + 10^offset) / (totalAssets - feeAssets + 1) (Floor). Both round down, so feeValue should be <= feeAssets <= totalInterest * 50%. Safe by construction."
  poc_sketch: ''
  call_stack: '_accruedFeeShares() L894-905'

- id: MM-M-04
  tier: 1
  type: property
  description: "lastTotalAssets tracks totalAssets within bounded drift after fee accrual"
  attack_scenario: "After _accrueFee(), lastTotalAssets = totalAssets(). But deposit updates it as lastTotalAssets + assets, and withdraw as newTotalAssets.zeroFloorSub(assets). These approximations cause drift. If drift accumulates, _accrueFee computes wrong totalInterest. If lastTotalAssets < totalAssets persistently, phantom interest is charged as fee. If lastTotalAssets > totalAssets, fees are skipped."
  impact: "Cumulative drift causes incorrect fee accrual — either overcharge or undercharge"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 lastTA = vault.lastTotalAssets();
    uint256 actualTA = vault.totalAssets();
    uint256 maxDrift = actualTA / 1000 + 10;
    if (actualTA >= lastTA) {
        lte(actualTA - lastTA, maxDrift, "MM-M-04: lastTotalAssets drifted too low vs totalAssets");
    } else {
        lte(lastTA - actualTA, maxDrift, "MM-M-04: lastTotalAssets drifted too high vs totalAssets");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: "After any deposit/withdraw, the drift per operation is bounded by Morpho supply/withdraw rounding (~1 wei). Over N operations, drift is at most N wei. For realistic operation counts this is negligible. But the invariant catches if something goes structurally wrong."
  poc_sketch: ''
  call_stack: '_deposit() L676 | withdraw() L565'

