- id: IAR-TB-01
  tier: 1
  type: property
  description: "route() returns attacker-specified ISM from message body — sender can bypass all security verification"
  attack_scenario: |
    The route() function extracts the ISM address directly from the message body (InterchainAccountMessage.ism()).
    An attacker on chain A dispatches a message to chain B with a malicious ISM address embedded in the body.
    The malicious ISM's verify() always returns true. On chain B, Mailbox.process() calls
    recipientIsm(router) -> router.interchainSecurityModule() -> router (itself, AbstractRoutingIsm).
    Then Mailbox calls router.verify(metadata, message) which calls route(message).verify(metadata, message).
    route() reads ISM from the message body -> returns the attacker's ISM -> verify() returns true.
    Now handle() executes: deploys/gets ICA and runs multicall with attacker's calls.
    The ICA is unique per (origin, owner, sender, ism, salt) so the attacker gets their own ICA,
    but that ICA could hold tokens or ETH from prior operations. The key issue is that
    ANY message from ANY origin with ANY sender is processed without verification if the ISM is malicious.
    This is a CRITICAL trust boundary: the message body controls its own verification.
  impact: "Complete ISM bypass. Any relayer or attacker who can call Mailbox.process() with crafted metadata+message can execute arbitrary calls through an ICA without real cryptographic verification."
  impact_rating: Critical
  likelihood: High
  severity_final: null
  solidity: |
    // Test that the ISM returned by route() for a CALLS message
    // is the one embedded in the message body, not a trusted/enrolled one
    bytes memory fakeBody = abi.encodePacked(
        uint8(0), // MessageType.CALLS
        bytes32(uint256(uint160(address(this)))), // owner
        bytes32(uint256(uint160(address(maliciousIsm)))), // ISM = attacker controlled
        bytes32(0), // salt
        abi.encode(new CallLib.Call[](0)) // empty calls
    );
    // Build full Hyperlane message wrapping the body
    // route() should NOT return the attacker ISM if security is sound
    // If it does, this invariant fails
    IInterchainSecurityModule returnedIsm = router.route(fullMessage);
    t(
        address(returnedIsm) != address(maliciousIsm),
        "IAR-TB-01: route() returned attacker-controlled ISM from message body"
    );
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 95
  notes: |
    This is by design per the comment "Does not need to be onlyRemoteRouter, as this application
    is designed to receive messages from untrusted remote contracts." The security model relies on
    the ISM specified by the SENDER on chain A being the ISM that verifies on chain B. The sender
    chooses their own ISM, and each (origin, owner, sender, ism) tuple maps to a unique ICA.
    So an attacker with a weak ISM only controls THEIR OWN ICA (derived with that weak ISM).
    The risk is if a legitimate user's ICA was deployed with ISM=0 (falling back to defaultIsm),
    and then the defaultIsm changes or is weak. Downgrading to tier 2 after analysis but keeping
    high confidence that the pattern is worth testing.
  poc_sketch: ''
  call_stack: 'Mailbox.process -> recipientIsm(router) -> router.interchainSecurityModule() -> address(this) -> AbstractRoutingIsm.verify -> route(message) -> ISM from body -> ISM.verify -> handle()'

- id: IAR-TB-02
  tier: 1
  type: property
  description: "approveFeeTokenForHook() has no access control — anyone can force max approval to arbitrary hook address"
  attack_scenario: |
    AbstractInterchainAccountRouter.approveFeeTokenForHook(address _feeToken, address _hook) is external
    with NO access modifier (no onlyOwner). Any user can call it with any feeToken and any hook address.
    Attack: attacker deploys a malicious "hook" contract, then calls
    router.approveFeeTokenForHook(USDC, attackerHook). Now the router has approved max USDC to
    attackerHook. If the router holds any USDC (from fees, stuck tokens, etc.), the attacker's
    hook contract calls USDC.transferFrom(router, attacker, balance) to drain all USDC.
    This applies to any ERC20 token the router might hold.
  impact: "Theft of all ERC20 tokens held by the router contract. Anyone can approve unlimited tokens to arbitrary addresses."
  impact_rating: Critical
  likelihood: High
  severity_final: null
  solidity: |
    // Before: router has some token balance
    uint256 routerBalBefore = IERC20(token).balanceOf(address(router));
    // Attacker calls approveFeeTokenForHook with their own address as hook
    // This should revert or be restricted to owner
    try router.approveFeeTokenForHook(address(token), address(attacker)) {
        // If it succeeds, check that the router did NOT approve to attacker
        uint256 allowance = IERC20(token).allowance(address(router), address(attacker));
        t(allowance == 0, "IAR-TB-02: approveFeeTokenForHook allowed non-owner to set max approval");
    } catch {
        // Expected: should revert for non-owner
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 90
  notes: |
    Looking at the code: `function approveFeeTokenForHook(address _feeToken, address _hook) external {`
    There is no onlyOwner or any access control modifier. This is a permissionless function that
    grants type(uint256).max approval of any ERC20 to any address. The router may hold tokens
    from fee payments (see _dispatchMessageWithValue which does safeTransferFrom to address(this)
    then forceApprove to hook). If the router accumulates any token dust, it's drainable.
    The intended use seems to be pre-approving fee tokens for hooks, but the lack of access control
    is a clear vulnerability. Needs to verify the router actually holds tokens in practice.
  poc_sketch: |
    1. Deploy token, send 100 tokens to router
    2. Call router.approveFeeTokenForHook(token, attacker) from attacker EOA
    3. Call token.transferFrom(router, attacker, 100) from attacker
