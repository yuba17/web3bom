- id: AIAR-D-01
  tier: 1
  type: property
  description: "enrollRemoteRouterAndIsm is immutable once set -- wrong enrollment permanently bricks a domain with no correction path"
  attack_scenario: >
    _enrollRemoteRouterAndIsm (line 318-330) requires both routers(destination) AND
    isms[destination] to be EMPTY_SALT. Once set, they can NEVER be changed. If the owner
    enrolls a wrong router or ISM (typo, wrong chain deployment, compromised remote router),
    the domain is permanently bricked. All callRemote to that domain will route to the wrong
    address forever. There is no unenroll override in this contract -- the parent
    Router.unenrollRemoteRouter exists but _enrollRemoteRouterAndIsm only checks if the
    current value is EMPTY_SALT, and unenroll sets the router back to 0 but does NOT reset
    isms[destination]. So even after unenroll, re-enrollment fails because isms[destination]
    != EMPTY_SALT. The domain is permanently stuck.
  impact: "Domain permanently bricked -- cannot re-enroll after unenroll due to ISM not being reset"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that enrolled domains cannot be corrected
    // After enrollment, both router and ISM are set
    bytes32 enrolledRouter = originRouter.routers(DESTINATION);
    bytes32 enrolledIsm = originRouter.isms(DESTINATION);
    // If both are set (non-zero), trying to re-enroll should revert
    // More importantly: unenrollRemoteRouter resets router to 0 but NOT isms
    // So after unenroll: routers(DEST) == 0 but isms[DEST] != 0
    // Re-enrollment requires BOTH to be EMPTY_SALT -- this fails
    if (enrolledRouter != bytes32(0) && enrolledIsm != bytes32(0)) {
        // Domain is permanently locked -- this is the DoS condition
        t(true, "AIAR-D-01: domain enrolled -- verify unenroll+re-enroll works");
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 85
  notes: >
    CRITICAL: The parent Router.unenrollRemoteRouter calls _unenrollRemoteRouter which does
    _routers.remove(domain). But isms[domain] is a plain mapping that is NEVER cleared.
    After unenroll: routers(domain) returns 0 (EMPTY_SALT equivalent via tryGet default),
    but isms[domain] still has the old value. Re-enrollment check at line 323-326 requires
    BOTH to be EMPTY_SALT. Since isms[domain] != EMPTY_SALT, re-enrollment reverts.
    The domain is permanently DoS'd. This is a real bug in the base contract.
  poc_sketch: |
    1. Owner enrolls domain 42 with router=0xAAA, ism=0xBBB
    2. Router discovers 0xAAA was wrong
    3. Owner calls unenrollRemoteRouter(42) -- removes router from _routers map
    4. routers(42) now returns bytes32(0) -- good
    5. isms[42] still = 0xBBB -- NOT reset
    6. Owner calls enrollRemoteRouterAndIsm(42, 0xCCC, 0xDDD)
    7. Check: routers(42) == EMPTY_SALT -- TRUE (was removed)
    8. Check: isms[42] == EMPTY_SALT -- FALSE (still 0xBBB)
    9. REVERT: "router and ISM defaults are immutable once set"
    10. Domain 42 is permanently bricked
  call_stack: >
    unenrollRemoteRouter(42) -> _unenrollRemoteRouter(42) -> _routers.remove(42)
    // isms[42] is NEVER touched
    enrollRemoteRouterAndIsm(42, newRouter, newIsm) -> _enrollRemoteRouterAndIsm(42, ...)
    // require(routers(42) == EMPTY_SALT && isms[42] == EMPTY_SALT) -> REVERTS

- id: AIAR-D-02
  tier: 2
  type: property
  description: "enrollRemoteRouterAndIsms unbounded loop -- gas DoS with large arrays"
  attack_scenario: >
    enrollRemoteRouterAndIsms (line 117-130) iterates over calldata arrays with no length cap.
    Each iteration does a storage write (router enrollment + ISM enrollment = 2 SSTORE ops =
    ~40K gas minimum). With large arrays (e.g., 200+ domains), the transaction could exceed
    block gas limit. However, this is onlyOwner so the attacker must be the owner. Low severity
    since it is a self-DoS by the admin, not an external attack. The owner can batch smaller.
  impact: "Owner transaction reverts if enrolling too many domains at once -- self-inflicted"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that batch enrollment with many domains does not exceed gas
    // This is a gas measurement invariant
    // With 100 domains, each costing ~50K gas (2 SSTORE + emit), total ~5M gas
    // Block gas limit is typically 30M, so up to ~600 domains per tx
    // This is unlikely to be an issue in practice
    t(true, "AIAR-D-02: batch enrollment gas -- manual review needed");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    onlyOwner function, self-DoS only. Owner can batch in smaller chunks. Not a real
    vulnerability -- marking as informational. Keeping for completeness.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-03
  tier: 1
  type: property
  description: "_handle always reverts (assert(false)) -- if child contract fails to override, ALL inbound messages are permanently DoS'd"
  attack_scenario: >
    _handle (line 297-299) is `internal pure override` and unconditionally calls assert(false).
    The comment says "Required for use of Router, compiler will not include this function in
    the bytecode." But if a child contract inherits AbstractInterchainAccountRouter and does NOT
    properly override _handle (or its override has a bug that falls through), ALL incoming
    messages to this router will revert permanently. This is a critical DoS -- messages sent
    from other chains will fail to be processed, and the sender's ETH/fee tokens are already
    consumed on the source chain.
  impact: "All inbound cross-chain messages permanently fail if child contract does not properly override _handle"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that the concrete router implementation overrides _handle properly
    // In the test setup, handle() should succeed for valid messages
    // If it reverts with assert(false), the abstract _handle was not overridden
    t(ghost_handleCount >= 0, "AIAR-D-03: handle count sanity check -- if handle reverts, this never increments");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    The assert(false) in _handle is a safety measure -- it should never be reached because
    the child contract (InterchainAccountRouter) overrides handle() at a higher level.
    The comment says the compiler will not include it. However, if there is a Solidity
    inheritance linearization issue or the child forgets to override, it is catastrophic.
    Low likelihood but high impact.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-04
  tier: 1
  type: property
  description: "feeToken safeTransferFrom can DoS dispatch if user has insufficient approval or blacklisted"
  attack_scenario: >
    _dispatchMessageWithValue (line 266) calls IERC20(feeToken).safeTransferFrom(msg.sender, ...).
    If the feeToken is USDC and the user or router is blacklisted, this reverts and the entire
    dispatch fails. Similarly, if the user forgot to approve or the approval is frontrun (approve
    to 0 first for USDT), the dispatch reverts. The user cannot send their cross-chain message.
    Unlike the native ETH path which has no such external dependency, the ERC20 path introduces
    multiple DoS vectors via token-specific behavior.
  impact: "Cross-chain message dispatch blocked by fee token transfer failure"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify dispatch works when user has sufficient approval
    // If feeToken reverts on transfer, dispatch is DoS'd
    uint256 userAllowance = feeToken.allowance(USER1, address(originRouter));
    uint256 userBalance = feeToken.balanceOf(USER1);
    // For dispatch to succeed with feeToken, user needs both balance and allowance
    if (ghost_callRemoteCount > 0) {
        // At least one dispatch succeeded, so the fee path worked
        t(true, "AIAR-D-04: dispatch succeeded with fee token");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Standard token interaction DoS. The USDC/USDT blacklist scenario is well-known. The
    specific concern here is that there is no fallback to native ETH if the ERC20 path
    fails. The user must change their hookMetadata to remove the feeToken, which may not
    be obvious. The fix would be try/catch around the safeTransferFrom with a fallback.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-05
  tier: 1
  type: property
  description: "quoteGasPayment reverts if destination has no enrolled router -- cannot even estimate cost for new domains"
  attack_scenario: >
    quoteGasPayment (line 207-215) calls _Router_quoteDispatch which calls _mustHaveRemoteRouter
    (line 225 in Router.sol). If the destination domain has no enrolled router, _mustHaveRemoteRouter
    reverts with "No router enrolled for domain: X". This means users cannot get a gas quote
    before the owner enrolls the router. This is expected behavior but creates a chicken-and-egg
    problem: users cannot estimate costs before the route is configured. More importantly,
    callRemoteWithOverrides with a custom _router BYPASSES this check (it passes _router
    directly to _dispatchMessageWithValue which only checks _router != bytes32(0)). So the
    override path works without enrollment but quoting does not.
  impact: "Users cannot quote gas for override paths where a custom router is used without enrollment"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // quoteGasPayment for an enrolled destination should succeed
    // For a non-enrolled destination, it reverts
    bytes32 enrolledRouter = originRouter.routers(DESTINATION);
    if (enrolledRouter != bytes32(0)) {
        // Should not revert
        uint256 quote = originRouter.quoteGasPayment(DESTINATION, 200000);
        gte(quote, 0, "AIAR-D-05: quote should be non-negative for enrolled domain");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    The asymmetry between quoteGasPayment (requires enrollment) and callRemoteWithOverrides
    (does not require enrollment) is a UX issue more than a security issue. Users of the
    override path have no way to get an accurate quote via the public API.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-06
  tier: 2
  type: property
  description: "approveFeeTokenForHook with malicious token can execute arbitrary code during forceApprove"
  attack_scenario: >
    approveFeeTokenForHook (line 134-135) calls IERC20(_feeToken).forceApprove(_hook, max).
    The _feeToken parameter is user-controlled. If a malicious contract is passed as _feeToken,
    its approve function executes arbitrary code in the context of a call FROM the router.
    The malicious token's approve could: (1) re-enter the router, (2) call back to other
    contracts impersonating a call from the router, (3) consume gas. However, the router
    has no special privileges beyond being the msg.sender, and SafeERC20.forceApprove handles
    return values. The main risk is if other contracts check "is caller the router?" for
    authorization.
  impact: "Malicious token contract executes code during forceApprove call from router address"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // approveFeeTokenForHook is permissionless and accepts any address as feeToken
    // A malicious feeToken can execute code during the approve call
    // The router makes an external call to an attacker-controlled address
    // Verify router state is not corrupted after such a call
    uint256 routerEthBal = address(originRouter).balance;
    bytes32 enrolledRouter = originRouter.routers(DESTINATION);
    // State should remain consistent regardless of malicious token interactions
    t(enrolledRouter == routerOverride || enrolledRouter == bytes32(0), "AIAR-D-06: router state corrupted after approveFeeTokenForHook");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    The permissionless nature of approveFeeTokenForHook allows anyone to trigger an external
    call from the router to any address. SafeERC20.forceApprove first tries approve(0) then
    approve(max), so TWO external calls are made. Combined with the fact that the router is
    often a trusted address in the Hyperlane ecosystem, this could be used for social
    engineering or to confuse off-chain monitoring.
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-07
  tier: 1
  type: property
  description: "Create2.deploy reverts if salt collision (same params used twice) -- but isContract check prevents this"
  attack_scenario: >
    getDeployedInterchainAccount (line 169-171) checks isContract before deploying. If the
    ICA already exists, it skips deployment. This is correct. However, if the bytecodeHash
    immutable is set incorrectly during construction (mismatch with actual MinimalProxy.bytecode),
    then computeAddress returns wrong address, isContract returns false for the real deployed
    contract, and Create2.deploy tries to deploy at a new address. This would waste gas but
    not cause a revert (different salt). The main DoS risk is if implementation is set to
    address(0) -- MinimalProxy.bytecode(address(0)) produces invalid bytecode, and Create2
    may deploy a non-functional proxy.
  impact: "Non-functional ICA proxy deployed if implementation address is zero or incorrect"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify implementation is non-zero (set in constructor)
    address impl = originRouter.implementation();
    t(impl != address(0), "AIAR-D-07: implementation is zero -- ICA proxies will be non-functional");
    // Verify bytecodeHash matches actual proxy bytecode
    // bytes32 expectedHash = keccak256(MinimalProxy.bytecode(impl));
    // This would require importing MinimalProxy -- instead check implementation is a contract
    t(impl.code.length > 0, "AIAR-D-07: implementation is not a contract");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The implementation and bytecodeHash are immutable, set in the constructor. If the constructor
    is called with wrong values, all ICA deployments will produce broken proxies. This is a
    deployment-time DoS that cannot be fixed post-deployment. Low likelihood if deployment
    scripts are correct.
  poc_sketch: ''
  call_stack: ''

