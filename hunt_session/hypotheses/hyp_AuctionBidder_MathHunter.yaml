hunter: MathHunter
component: AuctionBidder
date: "2026-03-22"
summary: >
  AuctionBidder.sol has minimal internal math. The primary math-related surface
  is the forceApprove amount computed via getAssetOutAmount on L78, which delegates
  to BaseAuction._getAssetOutAmount. After thorough analysis, no exploitable
  integer overflow, rounding error, or balance drain vector was identified.
  The code uses Solady FixedPointMathLib (mulDivUp, mulWadUp) consistently with
  rounding UP against the bidder, SafeERC20 for all transfers, and Solidity 0.8.26
  checked arithmetic.

invariants:
  - id: AB-M-01
    description: >
      TOCTOU between getAssetOutAmount (view, withValidation=false) used for
      forceApprove on L78 and the actual assetOutAmount computed inside
      BaseAuction.bid() (withValidation=true). If these diverge, the approval
      could be insufficient, causing the bid to revert (safeTransferFrom fails).
    confidence: 15
    severity: "Low"
    status: "likely_not_exploitable"
    attack_scenario: >
      1. Bidder calls AuctionBidder.bid() with solution=[] (simple path, L75-79).
      2. L78 calls getAssetOutAmount which uses _getAssetPrice(assetIn, false)
         and _getAssetPrice(assetOut, false) — no validation, tolerates stale prices.
      3. L81 calls auction.bid() which internally calls _getAssetOutAmount with
         withValidation=true, which reverts on stale/zero prices.
      4. If prices are valid: both paths return identical values (same block.timestamp,
         same price data). No discrepancy.
      5. If prices are stale: bid() reverts regardless — no fund loss, just DoS of
         the simple path (bidder must use solution[] callback path instead).
      6. Net impact: None. The simple path (solution=[]) is a convenience. If it
         fails, the callback path still works. No funds at risk.
    code_location: "AuctionBidder.sol:L78"
    analysis_detail: >
      Both getAssetOutAmount (view) and bid() (state-changing) use the same
      _getAssetOutAmount internal function with identical rounding (mulDivUp,
      mulWadUp). The only difference is withValidation flag for _getAssetPrice.
      Within a single transaction, block.timestamp is constant and price sources
      (Data Streams + Data Feeds) return the same data. The validation flag only
      controls whether to revert on stale/zero — it does not change the price
      value when prices are valid.

  - id: AB-M-02
    description: >
      getAssetOutAmount (view) caps amount to availableBalance (L762), but
      BaseAuction.bid() reverts if amount > availableBalance (L438-439). If
      bidder calls AuctionBidder.bid() with amount > availableBalance, the
      forceApprove sets a lower approval (capped), but bid() reverts anyway.
    confidence: 10
    severity: "Info"
    status: "not_exploitable"
    attack_scenario: >
      1. Auction has 100 tokens available.
      2. Bidder calls AuctionBidder.bid(assetIn, 200, []) — amount > available.
      3. L78: getAssetOutAmount caps to 100, computes price for 100 tokens.
      4. forceApprove sets approval for the 100-token price.
      5. L81: auction.bid(assetIn, 200, "") reverts with BidAmountTooHigh(200, 100).
      6. No state change, no fund loss. The capped approval is irrelevant since
         the tx reverts entirely.
    code_location: "AuctionBidder.sol:L78, BaseAuction.sol:L438-439,L762"

  - id: AB-M-03
    description: >
      Rounding direction analysis in _getAssetOutAmount: all three math operations
      (mulDivUp for USD conversion, mulWadUp for price multiplier, mulDivUp for
      assetOut conversion) round UP. This means the bidder always pays slightly
      MORE than the exact price — favorable to the protocol, not the bidder.
    confidence: 95
    severity: "Info"
    status: "by_design"
    attack_scenario: >
      No attack. Rounding UP against the bidder is the correct and safe direction.
      The bidder pays ceil(exactPrice) in assetOut. At most 1-2 wei of extra
      payment per bid. This is standard practice and not exploitable.
    code_location: "BaseAuction.sol:L799-802"

  - id: AB-M-04
    description: >
      Balance accounting after bid (L83-91): after auction.bid() completes,
      any remaining assetOut balance on the AuctionBidder contract is swept to
      s_receiver. Could leftover assetOut accumulate unexpectedly?
    confidence: 10
    severity: "Info"
    status: "by_design"
    attack_scenario: >
      1. The callback path (solution != []) executes arbitrary calls via _multiCall
         which could acquire assetOut tokens (e.g., via a DEX swap).
      2. auctionCallback approves exactly amountOut to the auction contract.
      3. auction.bid() pulls exactly amountOut via safeTransferFrom.
      4. If the solution acquired MORE assetOut than amountOut, the surplus stays
         on AuctionBidder and gets swept to s_receiver on L89.
      5. This is the intended design — s_receiver catches leftovers. The bidder
         (AUCTION_BIDDER_ROLE) controls the solution calls, so they control how
         much assetOut is acquired. No unintended drain.
    code_location: "AuctionBidder.sol:L83-91"

  - id: AB-M-05
    description: >
      withdraw() loop (L127-130): no math operations, just iterates and calls
      safeTransfer. No overflow/underflow risk. Admin-only function.
    confidence: 95
    severity: "Info"
    status: "not_applicable"
    attack_scenario: "No attack vector. Simple loop with safeTransfer, admin-gated."
    code_location: "AuctionBidder.sol:L127-130"

  - id: AB-M-06
    description: >
      priceMultiplier subtraction in _getAssetOutAmount (L793-795) could
      theoretically underflow if startingPriceMultiplier < endingPriceMultiplier.
      However, this is validated at configuration time in _applyAssetParamsUpdates
      (L653-656) which reverts if ending > starting.
    confidence: 5
    severity: "Info"
    status: "mitigated_by_validation"
    attack_scenario: >
      Not exploitable. The subtraction (startingPriceMultiplier - endingPriceMultiplier)
      is guaranteed non-negative by the configuration check at L653. Both are uint64,
      and the config enforces starting >= ending. The mulDiv with elapsedTime and
      auctionDuration cannot exceed the difference since elapsedTime is bounded
      to auctionDuration (L785).
    code_location: "BaseAuction.sol:L793-795"

conclusion: >
  AuctionBidder.sol is mathematically clean. No exploitable overflow, underflow,
  rounding error, or balance drain was found. The forceApprove amount on L78
  matches what bid() actually requires within the same transaction (same
  block.timestamp, same price data). The rounding direction (UP against bidder)
  is correct. The only observation (AB-M-01) is a theoretical TOCTOU that
  results in a revert (DoS of simple path), not fund loss, and is Low/Info at best.
  No findings warrant progression through the finding pipeline.
