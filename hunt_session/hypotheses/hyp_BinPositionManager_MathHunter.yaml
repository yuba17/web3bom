  description: "BinFungibleToken.batchTransferFrom uses unchecked addition for balanceOf[to][id] — if to's balance is near max uint256 (from a bug elsewhere), the addition wraps to near-zero, destroying the receiver's shares"
  attack_scenario: "If balanceOf[to][id] is somehow near type(uint256).max (requires separate bug or extremely many mints), adding `amount` in the unchecked block wraps around. The receiver's balance becomes near-zero instead of near-max + amount. However, reaching balanceOf near uint256.max requires totalSupply to also be near max, which requires ~2^256 worth of mints — practically impossible. This is a theoretical concern only."
  impact: "Balance overflow destroys receiver's shares — theoretical only, requires totalSupply ≈ 2^256"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Before any transfer, verify no overflow
    // balanceOf[to][id] + amount should not overflow
    uint256 toBal = bft.balanceOf(to, id);
    uint256 amount = transferAmount;
    t(toBal + amount >= toBal, "BPM-09: balanceOf overflow on transfer");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 25
  notes: "Practically impossible — requires totalSupply near 2^256. The unchecked is justified by the comment 'An array can't have a total length larger than the max uint256 value' but this refers to loop index, not the balance. The balance overflow is guarded by totalSupply being checked in _mint. Keeping as tier 2 for completeness."

