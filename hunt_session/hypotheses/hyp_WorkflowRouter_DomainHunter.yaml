    workflow), no el workflow_execution_id (único por ejecución). El nombre de variable
    local "workflowId" perpetúa la confusión. La documentación misleading puede causar
    errores en integraciones externas.
  attack_scenario: >
    Un integrador que construye metadata manualmente leyendo el comentario podría colocar
    el workflow_execution_id en metadata[0:32] en lugar del workflow_CID, causando que
    todas sus llamadas fallen con WorkflowIdNotAllowlisted aunque el workflow esté
    configurado correctamente. DoS operacional por mala documentación, no por código roto.
  impact: >
    Ninguno de seguridad directa. Riesgo de integración incorrecta. La infraestructura
    Keystone de Chainlink siempre pasa el workflow_CID correcto, por lo que el flujo
    on-chain es seguro. Solo afecta a integradores que construyan metadata artesanal.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // EVIDENCIA (cross-reference con KeystoneForwarder.sol):
    // KeystoneForwarder FORWARDER_METADATA_LENGTH = 45
    // KeystoneForwarder METADATA_LENGTH = 109
    // route() pasa: rawReport[45:109] como metadata → 64 bytes
    // rawReport[45:77] = workflow_cid (32 bytes) → metadata[0:32]
    // rawReport[77:87] = workflow_name (10 bytes) → metadata[32:42]
    // rawReport[87:107] = workflow_owner (20 bytes) → metadata[42:62]
    // rawReport[107:109] = report_id (2 bytes) → metadata[62:64]
    // KeystoneFeedDefaultMetadataLib confirma con assembly:
    //   workflow_cid → mload(add(metadata, 64)) → memoria offset 32 = calldata offset 0 ✓
    // El código WorkflowRouter.onReport lee metadata[:32] = workflow_cid ✓ (correcto)
    // La variable se llama "workflowId" pero el valor es el CID → naming confuso.
    t(true, "WR-DOM-03: solo documentacion incorrecta, codigo funciona bien");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Documentación errónea confirmada por análisis del KeystoneForwarder.sol.
    El offset en el comentario ("Offset 32") es relativo a la memoria Solidity (length prefix
    de 32 bytes antes del contenido), no al calldata. El campo es workflow_CID no workflow_id.
    Recomendación: renombrar variable y actualizar comentarios. No es bounty-reportable
    como bug de seguridad — máximo Info/QA.

