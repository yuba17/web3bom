# ============================================================
# ANÁLISIS DE LOS 4 PUNTOS DE INVESTIGACIÓN ESPECÍFICOS
# ============================================================
#
# PUNTO 1 — METADATA PARSING: ¿El comentario "Offset 32, size 32: workflow_id" es correcto?
#
#   El KeystoneForwarder.sol pasa a IReceiver.onReport:
#     metadata  = rawReport[FORWARDER_METADATA_LENGTH : METADATA_LENGTH]
#               = rawReport[45 : 109]  → 64 bytes
#     report    = rawReport[METADATA_LENGTH:]
#               = rawReport[109:]
#
#   Layout rawReport (0-indexed):
#     byte  0: version (1 byte)   [NO está en metadata del receiver]
#     bytes 1-32: workflow_execution_id (32 bytes)
#     bytes 33-36: timestamp (4 bytes)
#     bytes 37-40: don_id (4 bytes)
#     bytes 41-44: don_config_version (4 bytes)
#     === FORWARDER_METADATA_LENGTH = 45 ===
#     bytes 45-76: workflow_cid (32 bytes)   → metadata[0:32]
#     bytes 77-86: workflow_name (10 bytes)  → metadata[32:42]
#     bytes 87-106: workflow_owner (20 bytes) → metadata[42:62]
#     bytes 107-108: report_id (2 bytes)     → metadata[62:64]
#     === METADATA_LENGTH = 109 ===
#
#   Confirmado por KeystoneFeedDefaultMetadataLib._extractMetadataInfo:
#     workflow_cid   → mload(add(metadata, 64)) con offset 64 en mem = offset 32 en calldata
#     workflow_name  → mload(add(metadata, 64)) = offset 32 calldata → bytes [32:42]
#     workflow_owner → mload(add(metadata, 74)) shr(12*8) → offset 42 calldata
#
#   WorkflowRouter.onReport línea 110:
#     bytes32 workflowId = bytes32(metadata[:32])  → lee workflow_CID (bytes 45-76 del rawReport)
#
#   El comentario dice "Offset 32, size 32: workflow_id" pero:
#   - El "offset 32" se refiere al offset en memoria Solidity (que incluye el length prefix)
#     = offset 0 en calldata. El comentario es sobre la posición en memoria, no calldata.
#   - El campo leído NO es el workflow_execution_id (que es único por ejecución),
#     sino el workflow_CID (hash estático que identifica la definición del workflow).
#   - La variable se llama "workflowId" en el código pero el dato es el workflow_CID.
#
#   CONCLUSIÓN: El comentario tiene una inconsistencia de naming (workflowId vs workflowCid)
#   pero el código ES CORRECTO funcionalmente. El admin allowlista por workflow_CID, y el
#   forwarder envía el workflow_CID en metadata[0:32]. El check funciona como se diseñó.
#   No es un bug de seguridad. Es un comentario misleading. → FP documentado.
#
# PUNTO 2 — WORKFLOW REMOVAL DOS (targets ya vacíos):
#
#   Flujo confirmado como BUG REAL:
#   Estado inicial: workflow W allowlisted, target T con selector S.
#
#   Paso A: applyAllowlistedTargetsUpdates(W, [T], []) → elimina T con sus selectors.
#           W queda en s_allowlistedWorkflowIds con allowlistedTargets.length == 0.
#
#   Paso B: applyAllowlistedWorkflowsUpdates([W], []):
#           Para i=0 (removes[0] = W):
#             llama _applyAllowlistedTargetsUpdates(W,
#               s_workflowInfos[W].allowlistedTargets.values(),  ← []
#               new TargetSelectors[](0))                         ← []
#           En _applyAllowlistedTargetsUpdates:
#             if (removes.length == 0 && adds.length == 0) revert Errors.EmptyList();  ← REVERT
#
#   RESULTADO: applyAllowlistedWorkflowsUpdates revierte → W queda zombi en el set.
#   Path alcanzable con operaciones admin legítimas. BUG CONFIRMADO. → WR-DOM-01
#
# PUNTO 3 — ALLOWLIST STATE CONSISTENCY (¿selector sin target?):
#
#   Todos los paths de escritura:
#   - ADD target: _applyAllowlistedTargetsUpdates add loop:
#     línea 234: s_workflowInfos[workflowId].allowlistedTargets.add(target)  ← target first
#     línea 235: _applyAllowlistedSelectorsUpdates(wfId, target, [], selectors)  ← then selectors
#     _applyAllowlistedSelectorsUpdates línea 276: requires target in allowlistedTargets ✓
#   - REMOVE target: _applyAllowlistedTargetsUpdates remove loop:
#     línea 221: _applyAllowlistedSelectorsUpdates → limpia selectores first
#     línea 222: s_workflowInfos[workflowId].allowlistedTargets.remove(target) ← target last
#   - ADD selector direct: _applyAllowlistedSelectorsUpdates línea 276:
#     requires target in allowlistedTargets → no puede crear selector sin target ✓
#   - REMOVE selector direct: _applyAllowlistedSelectorsUpdates línea 276:
#     requires target in allowlistedTargets ✓
#     PERO: si se eliminan TODOS los selectores del target, el target queda en allowlistedTargets
#     con 0 selectores. Luego el target se vuelve IRREMOVIBLE (ver WR-DOM-05).
#
#   onReport línea 126-130:
#     if (!s_workflowInfos[workflowId].allowlistedSelectors[target].contains(selector)) {
#       if (!s_workflowInfos[workflowId].allowlistedTargets.contains(target)) {
#         revert TargetNotAllowlisted(...)
#       }
#       revert SelectorNotAllowlisted(...)
#     }
#   ASIMETRÍA: selector se chequea antes que target. Si selector está en el mapping,
#   se pasa la verificación SIN comprobar si el target está en allowlistedTargets.
#   Hoy: imposible con el código actual. Si futuro código crea selector sin target →
#   bypass completo del check de target. → WR-DOM-02 (tier 2, hipotético)
#
# PUNTO 4 — REPORT DATA PARSING (data.length < 4):
#
#   Código onReport:
#     (address target, bytes memory data) = abi.decode(report, (address, bytes));
#     assembly ("memory-safe") {
#       selector := mload(add(data, 32))
#     }
#   Layout de `data` en memoria: [length_32bytes][byte0][byte1]...[byteN][zero_padding...]
#   mload(add(data, 32)) lee 32 bytes empezando en el primer byte de contenido.
#   Si data.length == 0: lee 32 bytes de zeros → selector = 0x00000000
#   Si data.length == 1: lee byte0 + 31 bytes de zero-padding → selector = bytes4(byte0 ++ 0x000000)
#   Si data.length < 4: selector está zero-padded con los bytes faltantes.
#   Solidity garantiza zero-padding de la memoria hasta el slot de 32 bytes.
#   NO hay out-of-bounds en el sentido de leer datos externos al array.
#   bytes4(0) no puede ser allowlisted (línea 295). → revert siempre para data vacío.
#   Para 1-3 bytes: selector no-cero solo si admin lo allowlistó explícitamente (muy improbable).
#   CONCLUSIÓN: No explotable. Zero-padding de Solidity lo cubre. → FP documentado.
#
# ============================================================

invariants:

- id: WR-DOM-01
  tier: 1
  type: property
  description: >
    DoS administrativo: un workflow con 0 targets (todos eliminados via
    applyAllowlistedTargetsUpdates) no puede ser eliminado con
    applyAllowlistedWorkflowsUpdates, quedando como entrada zombi permanente en
    s_allowlistedWorkflowIds. El guard EmptyList() en _applyAllowlistedTargetsUpdates
    (línea 208) bloquea la eliminación cuando removes=[] y adds=[].
  attack_scenario: >
    El admin ejecuta estas dos operaciones en orden:
    1. applyAllowlistedTargetsUpdates(workflowId, [target], [])
       → target eliminado correctamente, allowlistedTargets.length == 0
    2. applyAllowlistedWorkflowsUpdates([workflowId], [])
       → llama _applyAllowlistedTargetsUpdates(workflowId, [], [])
       → revert Errors.EmptyList() en línea 208
    El workflowId queda permanentemente en s_allowlistedWorkflowIds aunque esté inerte
    (ningún report puede ejecutar nada porque no hay targets ni selectors).
    El admin no puede hacer housekeeping limpio del state — el zombi nunca puede
    eliminarse sin añadir primero un target dummy (workaround no documentado).
  impact: >
    Griefing administrativo. Sin pérdida de fondos directa. En escenarios de rotación
    frecuente de workflowIds, el set crece indefinidamente con entradas irremovibles.
    El workflow zombi no es peligroso (no puede ejecutar calls) pero polluta el state
    y viola el invariante de que "el admin puede siempre limpiar lo que configuró".
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // property_wr_dom_01: si allowlistedTargets está vacío para un workflowId
    // que está en s_allowlistedWorkflowIds, applyAllowlistedWorkflowsUpdates
    // debería poder eliminarlo sin revertir.
    //
    // Para testear el bug:
    // 1. Añadir workflow W con target T y selector S
    // 2. applyAllowlistedTargetsUpdates(W, [T], [])  ← OK
    // 3. intentar: applyAllowlistedWorkflowsUpdates([W], [])  ← REVERT EmptyList
    //
    bytes32[] memory workflowIds = workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < workflowIds.length; ++i) {
      address[] memory targets = workflowRouter.getAllowlistedTargets(workflowIds[i]);
      if (targets.length == 0) {
        // Invariante violado: este workflow zombi existe y es irremovible
        t(false, "WR-DOM-01: workflow zombi irremovible en allowlist");
      }
    }
  ghost_vars:
    - bytes32[] internal ghost_workflowIdsWithZeroTargets;
  validated: true
  priority: medium
  confidence: 95
  notes: >
    BUG CONFIRMADO por lectura directa. Path exacto:
    _applyAllowlistedTargetsUpdates línea 205: requiere workflowId en allowlist ✓
    _applyAllowlistedTargetsUpdates línea 208: if (removes.length == 0 && adds.length == 0) revert EmptyList()
    Cuando removes=[] (targets vacíos) y adds=[] → REVERT.
    La única workaround no documentada: re-añadir un target dummy para luego poder
    hacer el remove conjunto. Severity probable: Low (solo admin, sin fondos en riesgo).
    Hay que verificar si Chainlink lo clasifica como Low o Info para el bounty.

- id: WR-DOM-05
  tier: 1
  type: property
  description: >
    DoS administrativo análogo a WR-DOM-01 pero a nivel de target: si se eliminan
    TODOS los selectores de un target via applyAllowlistedSelectorsUpdates (sin eliminar
    el target en el mismo paso), el target queda con 0 selectores en allowlistedTargets
    pero se vuelve IRREMOVIBLE. Intentar eliminarlo via applyAllowlistedTargetsUpdates
    llama _applyAllowlistedSelectorsUpdates(wfId, target, [], []) → revert EmptyList().
  attack_scenario: >
    El admin ejecuta:
    1. applyAllowlistedSelectorsUpdates(workflowId, target, [selector1, selector2], [])
       → target queda en allowlistedTargets con 0 selectores
    2. applyAllowlistedTargetsUpdates(workflowId, [target], [])
       → llama _applyAllowlistedSelectorsUpdates(wfId, target,
              s_workflowInfos[wfId].allowlistedSelectors[target].values(),  ← []
              new bytes4[](0))
       → removes=[] y adds=[] → revert Errors.EmptyList() en línea 279
    Target queda zombi: existe en allowlistedTargets, no tiene selectores,
    no puede ejecutar calls, y no puede ser eliminado.
    ADICIONALMENTE: si el workflow luego intenta eliminarse (WR-DOM-01), también fallará
    porque el target zombi bloquea el cleanup.
    Este path (eliminar selectores sin eliminar target) es MÁS PROBABLE que WR-DOM-01
    porque eliminar selectores individualmente para rotarlos es una operación de mantenimiento
    más común que eliminar todos los targets de un workflow.
  impact: >
    Griefing administrativo. Target zombi en allowlistedTargets que además bloquea la
    eliminación del workflow padre (exacerba WR-DOM-01). Sin pérdida de fondos directa.
    El target zombi no puede ejecutar ninguna llamada (no tiene selectors válidos).
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // property_wr_dom_05: ningún target en allowlistedTargets debería tener 0 selectores.
    // Si tiene 0 selectores, es un zombi irremovible.
    bytes32[] memory workflowIds = workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < workflowIds.length; ++i) {
      address[] memory targets = workflowRouter.getAllowlistedTargets(workflowIds[i]);
      for (uint256 j = 0; j < targets.length; ++j) {
        bytes4[] memory selectors = workflowRouter.getAllowlistedSelectors(
          workflowIds[i], targets[j]
        );
        if (selectors.length == 0) {
          t(false, "WR-DOM-05: target zombi con 0 selectores es irremovible");
        }
      }
    }
  ghost_vars:
    - mapping(bytes32 => mapping(address => uint256)) internal ghost_selectorCount;
  validated: true
  priority: medium
  confidence: 90
  notes: >
    BUG CONFIRMADO por traza de código:
    _applyAllowlistedSelectorsUpdates línea 279:
      if (removes.length == 0 && adds.length == 0) revert Errors.EmptyList();
    Cuando se llama desde _applyAllowlistedTargetsUpdates remove loop con allowlistedSelectors
    vacío: removes=[] adds=[] → REVERT.
    Path de creación del state zombi: applyAllowlistedSelectorsUpdates(wfId, target, [s1], [])
    Severity Low — mismo razonamiento que WR-DOM-01. Los dos bugs son la misma clase de
    defecto en el guard EmptyList() que es demasiado agresivo en los flujos de limpieza.

