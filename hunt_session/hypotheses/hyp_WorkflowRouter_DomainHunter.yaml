- id: WR-D-01
  tier: 2
  type: property
  description: >
    No hay validación de workflow_owner en metadata — cualquier workflow_owner en el DON
    puede emitir reports para cualquier workflowId allowlisted. Si dos owners registran
    workflows con el mismo workflowId, ambos pueden rutear calls al mismo target.
  attack_scenario: >
    Un operador malicioso del DON registra un workflow con el mismo workflowId que el workflow
    de pricing legítimo. El Keystone forwarder acepta reports de ambos owners porque
    WorkflowRouter solo valida workflowId (L94), no workflow_owner (L93 — campo ignorado).
    El atacante puede entonces enviar reports con datos arbitrarios al target allowlisted.
    NOTA: esto depende de si el Keystone forwarder ya valida workflow_owner upstream. Si lo
    hace, este finding es by-design (defense-in-depth ya cubierta). Si NO lo hace, es Medium+.
  impact: >
    Si el forwarder no valida owner: un nodo DON malicioso puede inyectar precios falsos
    via transmit(), manipulando subastas y causando pérdida directa de fondos.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // No es fuzzeable — requiere análisis del Keystone forwarder contract.
    // Verificar: ¿el forwarder valida (workflowId, workflow_owner) como par?
    // Si solo valida workflowId → este finding es válido.
    // Si valida el par → este finding es informational (defense-in-depth).
  ghost_vars: []
  validated: false
  priority: high
  confidence: 35
  notes: >
    REQUIERE investigar el contrato Keystone forwarder on-chain. La seguridad del sistema
    depende de que el forwarder valide workflow_owner. WorkflowRouter NO lo valida — si el
    forwarder tampoco, hay un gap real. Confianza baja porque es probable que Chainlink ya
    lo cubra upstream, pero debe verificarse explícitamente.

- id: WR-D-02
  tier: 2
  type: property
  description: >
    Sin protección contra replay — el mismo report puede ser reenviado múltiples veces
    por el forwarder. WorkflowRouter no trackea reports procesados (no hay nonce, no hay
    hash de report, no hay mapping de reports vistos).
  attack_scenario: >
    1. Forwarder envía report legítimo: transmit([priceReport]) → precio se actualiza.
    2. Tiempo pasa, precio real cambia significativamente.
    3. Forwarder (o un nodo comprometido con FORWARDER_ROLE) reenvía el MISMO report.
    4. Precio se sobreescribe con el valor antiguo (PriceManager.transmit solo valida
       staleness contra stalenessThreshold, L162).
    5. Si el precio antiguo beneficia al atacante en una subasta activa, puede comprar
       tokens a precio incorrecto.
    NOTA CRÍTICA: PriceManager.transmit() tiene su propia validación de staleness (L162).
    Si el report original ya pasó el stalenessThreshold, el replay será rechazado.
    El window de replay es [0, stalenessThreshold] desde el observationsTimestamp del report.
  impact: >
    Dentro del window de staleness: precio puede retroceder a un valor anterior,
    potencialmente manipulando el precio de subasta. Impacto limitado por el
    stalenessThreshold (típicamente minutos, no horas).
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Conceptual — no hay estado de replay tracking en WorkflowRouter.
    // El mitigante es PriceManager.stalenessThreshold (L162).
    // Para explotar: block.timestamp - report.observationsTimestamp < stalenessThreshold
    // → window temporal limitado pero existente.
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: >
    La protección real contra replay viene de PriceManager.stalenessThreshold, NO de
    WorkflowRouter. Pero para targets que NO son PriceManager (e.g., performUpkeep,
    bid), no hay NINGUNA protección contra replay. performUpkeep probablemente es
    idempotente (ya tiene subasta activa), pero bid podría no serlo — investigar.

- id: WR-D-03
  tier: 2
  type: property
  description: >
    performUpkeep y bid no tienen protección contra replay en WorkflowRouter. A diferencia
    de transmit() (que tiene stalenessThreshold), estos selectors no tienen validación
    temporal. Un report re-enviado podría ejecutar performUpkeep o bid dos veces.
  attack_scenario: >
    1. DON envía report legítimo: performUpkeep(performData) → subasta inicia.
    2. Subasta se completa normalmente.
    3. Condiciones cambian: nuevo balance en feeAggregator, checkUpkeep retornaría
       performData diferente.
    4. Forwarder reenvía el report ORIGINAL con performData antiguo.
    5. performUpkeep se ejecuta con datos stale — podría iniciar subasta con parámetros
       incorrectos o en momento inoportuno.
    Para bid: el replay de un bid podría intentar ejecutar una segunda compra si la
    subasta aún está activa, dependiendo de la lógica interna de BaseAuction.
  impact: >
    Impacto depende de la idempotencia de performUpkeep y bid. Si performUpkeep chequea
    estado interno (subasta ya activa), el replay falla gracefully. Si bid permite
    múltiples ejecuciones, podría causar doble-swap.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Requiere analizar BaseAuction.performUpkeep() y AuctionBidder.bid()
    // para determinar si son idempotentes o si permiten re-ejecución.
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 30
  notes: >
    Depende fuertemente de la implementación de los targets. Si BaseAuction tiene
    guards internos (e.g., "subasta ya activa"), el replay es inofensivo. Necesita
    lectura profunda de BaseAuction.performUpkeep y AuctionBidder.bid.

