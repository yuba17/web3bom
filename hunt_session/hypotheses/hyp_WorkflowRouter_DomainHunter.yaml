    apuntar al propio WorkflowRouter como target, permitiendo llamar funciones
    admin del router si están allowlisted (e.g., applyAllowlistedWorkflowsUpdates).
  attack_scenario: >
    1. Admin configura erróneamente: allowlista address(WorkflowRouter) como target
       para algún workflowId, con selector de applyAllowlistedWorkflowsUpdates.
    2. DON envía report: target=WorkflowRouter, data=applyAllowlistedWorkflowsUpdates(...)
    3. _call ejecuta la llamada al propio router.
    4. PERO: applyAllowlistedWorkflowsUpdates tiene onlyRole(DEFAULT_ADMIN_ROLE).
       msg.sender en _call es el propio WorkflowRouter (self-call).
    5. Si WorkflowRouter NO tiene DEFAULT_ADMIN_ROLE sobre sí mismo → revert.
    6. Si por alguna razón WorkflowRouter SE otorgó admin role → el DON puede
       reconfigurar las allowlists.
    MITIGANTE: requiere error de configuración del admin (allowlistar el propio router
    + otorgarle admin role). Bajo probabilidad pero alto impacto si ocurre.
  impact: >
    Si se dan las condiciones (misconfiguration): el DON podría añadir nuevos targets
    y selectors, esencialmente tomando control total del routing.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // property_wr_d_05: target nunca debe ser address(this)
    // No hay check en onReport() L103-117
    // Requiere: admin allowliste address(WorkflowRouter) como target
    // Y que WorkflowRouter tenga DEFAULT_ADMIN_ROLE sobre sí mismo
  ghost_vars: []
  validated: false
  priority: high
  confidence: 25
  notes: >
    Probabilidad muy baja — requiere doble misconfiguration. Pero la ausencia del check
    target != address(this) es un gap real en defense-in-depth. Comparable a "missing
    self-call protection" en otros routers. Podría ser QA/Low.

- id: WR-D-06
  tier: 2
  type: property
  description: >
    La granularidad workflowId → target → selector es suficiente para el caso de uso actual,
    pero no permite distinguir por parámetros. Dos workflows con el mismo target y selector
    pero diferentes restricciones de parámetros no se pueden diferenciar a nivel de router.
  attack_scenario: >
    WorkflowA y WorkflowB ambos allowlisted para transmit() en PriceManager.
    El router no puede saber qué feeds debe transmitir cada uno.
    Mitigante: PriceManager.transmit() valida feedIds allowlisted internamente.
  impact: >
    Nulo en la práctica. Observación de arquitectura.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Informational — la allowlist no restringe parámetros, solo (workflowId, target, selector).
  ghost_vars: []
  validated: false
  priority: low
  confidence: 85
  notes: >
    By design. La separación de responsabilidades es correcta. No reportable como bug.

- id: WR-D-07
  tier: 2
  type: property
  description: >
    Report con data.length < 4 bytes: el assembly en L106-108 lee selector como
    mload(add(data, 32)) — si data tiene menos de 4 bytes, el selector contendrá
    los bytes disponibles padded con zeros. bytes4(0) no puede ser allowlisted.
  attack_scenario: >
    data vacío → selector = 0x00000000 → rechazado por check en línea 295.
    data = 1 byte → selector = byte ++ 0x000000 → requiere allowlist explícita.
    Zero-padding de Solidity garantiza que no hay OOB read.
  impact: >
    Ninguno. El check de bytes4(0) y el zero-padding cubren todos los casos.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // El mload de 32 bytes desde data+32 es safe por el zero-padding garantizado por Solidity.
    // bytes4(0) no puede ser allowlisted — L295 lo previene explícitamente.
  ghost_vars: []
  validated: false
  priority: low
  confidence: 80
  notes: >
    INVESTIGADO Y DESCARTADO (ver WR-FP-03). Zero-padding de Solidity cubre este edge case.
    No reportable. Informational puro.

false_positives:

- hunter: DomainHunter
  id: WR-FP-01
  reason: >
    METADATA PARSING — El comentario dice "Offset 32, size 32: workflow_id" que parece
    referirse al workflow_execution_id. PERO el campo leído es workflow_CID (hash estático
    del workflow). El código ES CORRECTO: el Keystone Forwarder siempre pasa el workflow_CID
    en metadata[0:32] y el allowlist usa el mismo CID como clave. El naming variable
    "workflowId" cuando el dato es "workflowCid" es confuso pero no rompe la seguridad.
    No hay gap: lo que se allowlista y lo que se verifica es siempre el mismo campo.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/staking.md
    content: >
      Chainlink Keystone metadata layout: IReceiver.onReport recibe rawReport[45:109].
      metadata[0:32] = workflow_CID (hash estático, NO el execution ID).
      metadata[32:42] = workflow_name (bytes10).
      metadata[42:62] = workflow_owner (address).
      metadata[62:64] = report_id (bytes2).
      Contratos que llaman "workflowId" a este campo están usando el CID — correcto
      funcionalmente pero confuso en naming. No asumir workflow_id = execution ID.
    briefing_update_applied: false

- hunter: DomainHunter
  id: WR-FP-02
  reason: >
    msg.value no se envía en _call() podría parecer un fallo silencioso. FALSO.
    Caller.sol líneas 30-39 propagan el revert explícitamente. Si el target necesita
    ETH y no lo recibe, el call revierte y Caller lo hace burbujear. No hay pérdida
    silenciosa de fondos ni estado inconsistente. Es una limitación de diseño conocida.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: WR-FP-03
  reason: >
    DATA LENGTH < 4 BYTES en assembly mload — inicialmente parecía un OOB read.
    INCORRECTO: Solidity garantiza zero-padding de la memoria hasta el slot de 32 bytes.
    mload(add(data, 32)) con data.length < 4 retorna los bytes disponibles + zeros.
    bytes4(0) está bloqueado de ser allowlisted (línea 295). Para 1-3 bytes el selector
    no-cero requeriría allowlist explícita del admin. No hay vector de ataque.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/staking.md
    content: >
      Assembly mload sobre bytes memory en Solidity: el array tiene zero-padding hasta
      el siguiente slot de 32 bytes. mload(ptr + 32) cuando length < 4 retorna bytes
      reales + zeros de padding. No es un OOB en el sentido de seguridad. Patrón común
      para extraer function selector de calldata de forma eficiente.
    briefing_update_applied: false

- hunter: DomainHunter
  id: WR-FP-04
  reason: >
    TARGET CON 0 SELECTORES via add path — considere inicialmente que añadir un target
    con selectors=[] crearía un zombi inmediatamente. INCORRECTO: el flujo llama
    _applyAllowlistedSelectorsUpdates(wfId, target, [], selectors_from_adds).
    Si selectors_from_adds está vacío → removes=[] adds=[] → revert EmptyList().
    Por tanto NO se puede crear un target zombi via el add path.
    El zombi solo se crea via el remove-selector path (WR-DOM-05) — ese SÍ es un bug real.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null
