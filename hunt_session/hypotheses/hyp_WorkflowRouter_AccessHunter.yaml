- id: WR-AC-01
  tier: 1
  type: property
  description: >
    La verificación de acceso en onReport tiene el orden invertido: verifica selector
    ANTES que target. El happy path (líneas 126-131) nunca comprueba explícitamente
    que target esté en allowlistedTargets — solo verifica selector en
    allowlistedSelectors[target]. La verificación del target solo ocurre en el
    error path (cuando el selector falla). Si el estado s_workflowInfos tiene
    un selector registrado para un target que NO está en allowlistedTargets (estado
    inconsistente), _call(target, data) se ejecuta sin que el contrato lo detecte.
  attack_scenario: >
    Prerequisito: estado inconsistente donde allowlistedSelectors[badTarget] contiene
    un selector pero badTarget no está en allowlistedTargets. Este estado no es
    alcanzable mediante las funciones públicas actuales (todas verifican target en
    allowlistedTargets antes de añadir selectors). SIN EMBARGO:
    (a) Un upgrade futuro del contrato que modifique el cleanup sin actualizar onReport
        podría dejar este estado.
    (b) En un contexto proxy/upgradeable, storage manipulation podría forzarlo.
    (c) Es un design smell: la seguridad depende de un invariante de estado implícito
        que nunca se verifica en el hot path.
    Si el estado es alcanzable: FORWARDER llama onReport con (workflowId, badTarget,
    allowlistedSelector) → el contrato NO revierte → ejecuta _call(badTarget, data).
  impact: >
    Ejecución de llamadas a targets no sancionados explícitamente como allowlisted
    para ese workflowId. Dependiendo de badTarget, puede resultar en invocación de
    funciones críticas (transferencia de fondos, modificación de precios, cambio de
    parámetros). El impacto es contingente al estado inconsistente siendo alcanzable.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: para cualquier (workflowId, target) en s_workflowInfos,
    // si allowlistedSelectors[target] no está vacío, target DEBE estar
    // en allowlistedTargets del mismo workflowId.
    // Verificar vía vm.store (Foundry) para forzar estado inconsistente.
    //
    // Test de verificación (pseudocódigo):
    // 1. Crear setup normal con (wId, targetA, selectorA) allowlisted
    // 2. Usar vm.store para añadir selectorA a allowlistedSelectors[badTarget]
    //    sin añadir badTarget a allowlistedTargets
    // 3. Llamar onReport(wId, badTarget, selectorA)
    // 4. Si NO revierte → bug confirmado
    bool hasSelectors = s_workflowInfos[workflowId].allowlistedSelectors[target].length() > 0;
    bool targetInSet = s_workflowInfos[workflowId].allowlistedTargets.contains(target);
    t(!hasSelectors || targetInSet, "WR-AC-01: selector registrado para target no allowlisted");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    La verificación de acceso debería ser: 1) workflowId en allowlist, 2) target en
    allowlistedTargets, 3) selector en allowlistedSelectors[target]. El código actual
    invierte 2 y 3. En el estado actual del protocolo no es explotable directamente,
    pero es un invariante de seguridad implícito que el código no garantiza en el
    hot path. Merece mención en un reporte como "missing explicit target validation
    in execution path" (Low/QA).

- id: WR-AC-02
  tier: 1
  type: property
  description: >
    applyAllowlistedWorkflowsUpdates permite en una sola llamada: remover workflowId X
    (limpiando todos sus targets/selectors) Y re-añadir workflowId X con nuevos targets.
    El orden de operaciones es crítico: primero se procesan todos los removes (incluyendo
    cleanup completo de X), luego todos los adds. Sin embargo, si removes=[X] y adds
    contiene X con targetSelectors=[], se re-añade X sin targets — la función
    _applyAllowlistedTargetsUpdates con adds=[] lanza Errors.EmptyList(). Verificar
    que la secuencia remove-then-readd con configuración vacía está correctamente manejada.
  attack_scenario: >
    Un admin llama applyAllowlistedWorkflowsUpdates(removes=[X], adds=[{workflowId:X, targetSelectors:[]}]).
    Secuencia:
    1. Remove X: _applyAllowlistedTargetsUpdates(X, allTargets, []) → limpia targets
    2. s_allowlistedWorkflowIds.remove(X) → X ya no está en allowlist
    3. Add X: s_allowlistedWorkflowIds.add(X) → X re-añadido
    4. _applyAllowlistedTargetsUpdates(X, [], []) → removes=[] y adds=[] → REVIERTE con EmptyList
    Resultado: X está en s_allowlistedWorkflowIds (añadido en paso 3) pero sin targets.
    Ahora un FORWARDER puede llamar onReport con workflowId=X, y la llamada pasará los
    checks de workflowId e irá al check de target — cualquier target+selector fallará
    con TargetNotAllowlisted. No es explotable directamente, pero el estado es inconsistente:
    workflowId en allowlist sin targets. Si el admin intenta corregirlo llamando
    applyAllowlistedTargetsUpdates(X, [], [{target, [selector]}]) — ahora SÍ funciona
    porque X está en allowlistedWorkflowIds.
    ADVERTENCIA: el estado de "workflowId sin targets" puede ser intencional (señal futura),
    pero no hay documentación de este caso y puede crear confusión operacional.
  impact: >
    DoS parcial: onReport con ese workflowId siempre falla con TargetNotAllowlisted.
    No hay pérdida de fondos directa, pero interrumpe el flujo del protocolo hasta que
    el admin corrija la configuración.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que si workflowId está en s_allowlistedWorkflowIds,
    // tiene al menos un target allowlisted (invariante de completitud).
    bytes32[] memory wids = s_workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < wids.length; i++) {
      address[] memory targets = s_workflowRouter.getAllowlistedTargets(wids[i]);
      // Nota: esto puede ser false positive si workflowId-sin-targets es intencional.
      // Para el invariante de seguridad, lo más importante es que onReport falle
      // correctamente (TargetNotAllowlisted) en vez de ejecutar calls.
      t(targets.length > 0, "WR-AC-02: workflowId en allowlist sin targets");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 55
  notes: >
    Investigado el flujo: add con targetSelectors=[] revierte en _applyAllowlistedTargetsUpdates
    (línea 208: removes.length == 0 && adds.length == 0 → EmptyList). Por tanto el
    escenario de remove+readd con targetSelectors=[] sería un revert de la tx completa
    — el estado no queda inconsistente por atomicidad EVM. Reducido a Tier 1 como
    invariante de completitud pero con confianza baja.

- id: WR-AC-03
  tier: 2
  type: property
  description: >
    WorkflowRouter hereda Caller.sol que expone _call() como función internal.
    _call() hace target.call(data) sin ninguna validación de que target != address(0)
    y sin enviar ETH (correcto). Sin embargo, _call() también puede llamar a precompiles
    (address(1) a address(9) en EVM) si están allowlisted. El contrato no verifica
    que target no sea una precompile. Si un admin por error allowlistea una precompile
    como target, el FORWARDER puede enviar calldata arbitrario a esa precompile.
  attack_scenario: >
    Admin allowlistea address(0x1) (ecrecover precompile) con selector=bytes4(0xffffffff).
    FORWARDER llama onReport con metadata válida y report=abi.encode(address(1), crafted_data).
    _call(address(1), crafted_data) ejecuta ecrecover con datos controlados por el FORWARDER.
    Para ecrecover, el resultado es determinista y no tiene efectos secundarios dañinos.
    Para precompiles más peligrosas en otras redes (identity, sha256, ripemd160, etc.),
    tampoco hay efectos secundarios. Sin embargo, en chains con precompiles custom
    (Base/Optimism tienen precompiles en rangos superiores), podría haber impacto.
    REQUIRES: admin misconfiguration + precompile con efectos secundarios = dos fallos.
  impact: >
    En práctica: bajo. Las precompiles EVM estándar no tienen efectos secundarios de estado.
    En chains con precompiles custom (e.g., L2s con gas oracles o bridge precompiles),
    podría haber efectos no deseados. Documentado como riesgo de configuración.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que ningún target allowlisted sea una precompile EVM (0x01 a 0x09)
    // o una precompile de cadena específica (rango varía por chain).
    bytes32[] memory wids = s_workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < wids.length; i++) {
      address[] memory targets = s_workflowRouter.getAllowlistedTargets(wids[i]);
      for (uint256 j = 0; j < targets.length; j++) {
        uint160 addr = uint160(targets[j]);
        t(addr > 9, "WR-AC-03: target allowlisted es una precompile EVM");
      }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 35
  notes: >
    Riesgo teórico bajo en chains estándar. Más relevante en L2s con precompiles
    custom (Base Optimism tienen precompiles de sistema hasta 0x800). Documentado
    como QA finding. Probabilidad de ser un hallazgo válido en bounty: muy baja
    porque requiere admin misconfiguration.

- id: WR-AC-04
  tier: 2
  type: property
  description: >
    AccessControlDefaultAdminRules de OZ aplica un delay (adminRoleTransferDelay)
    únicamente para TRANSFERIR DEFAULT_ADMIN_ROLE, NO para grantRole/revokeRole de
    otros roles. Por tanto, FORWARDER_ROLE puede ser asignado/revocado instantáneamente
    por el admin actual. Un admin comprometido puede añadir un forwarder malicioso
    sin ningún delay de timelock, ejecutar onReport con payloads arbitrarios
    (dentro de la allowlist), y luego revocar el rol para ocultar el rastro.
    En combinación con WR-A-02 (self-allowlist), si el admin también allowlistea
    WorkflowRouter como target con grantRole.selector, el flujo podría escalar.
  attack_scenario: >
    1. Admin comprometido llama grantRole(FORWARDER_ROLE, attacker) → instantáneo
    2. Attacker llama onReport con workflowId y target/selector allowlisted para
       ejecutar acciones sensibles (actualizar precios, ejecutar subastas, etc.)
    3. Admin revoca grantRole(FORWARDER_ROLE, attacker) → instantáneo
    4. No hay delay que permita que governance detecte y bloquee el ataque.
    NOTA: si hay un multisig como admin, el atacante necesita comprometer el multisig.
