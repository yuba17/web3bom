# ═══════════════════════════════════════════════════════════════════════
# MODELO DEL PROTOCOLO
# ═══════════════════════════════════════════════════════════════════════
# WorkflowRouter es un receptor de informes Chainlink Keystone. Su función
# es: recibir onReport(metadata, report) de un FORWARDER de confianza,
# extraer workflowId del metadata (offset 0, confirmado por tests),
# verificar que (workflowId, target, selector) esté en la allowlist tri-nivel,
# y ejecutar _call(target, data) heredado de Caller.sol.
#
# Flujo de dinero: no hay assets propios en WorkflowRouter. El riesgo
# es ejecución arbitraria de llamadas a contratos externos allowlisted.
# Un bypass de la allowlist permitiría invocar funciones privilegiadas
# en nombre del contrato.
#
# Trust boundaries:
#   - DEFAULT_ADMIN_ROLE: controla la allowlist + puede grantar roles sin delay
#   - FORWARDER_ROLE: puede invocar onReport (forwarder de Chainlink DON)
#   - PAUSER_ROLE / UNPAUSER_ROLE: pausan/desbloquean el contrato
#   - Chainlink DON: provee integridad del contenido del report (off-chain)
#
# Estructura de verificación en onReport():
#   1. workflowId != 0 ✓
#   2. workflowId in s_allowlistedWorkflowIds ✓
#   3. selector in allowlistedSelectors[target] ← VERIFICA SELECTOR ANTES QUE TARGET
#      3a. si NO: verifica si target in allowlistedTargets → error apropiado
#   4. _call(target, data)
#
# NOTA: el happy path nunca verifica explícitamente target in allowlistedTargets.
# ═══════════════════════════════════════════════════════════════════════
invariants:
- id: WR-A-01
  tier: 2
  type: property
  description: "Selector extraction from sub-4-byte data reads memory garbage — could match an allowlisted selector by accident"
  attack_scenario: >
    FORWARDER calls onReport() with a report that abi.decodes to (target, data) where
    data.length < 4 bytes (e.g., empty bytes or 1-3 bytes). At L106-108, the assembly
    `mload(add(data, 32))` reads 32 bytes starting at the data content pointer. If
    data.length is 0, it reads whatever sits in the adjacent memory slot (leftover from
    abi.decode or other allocations). The high-order 4 bytes of this read become `selector`.
    If this garbage value happens to match an allowlisted bytes4 for the given workflowId+target,
    the call to target proceeds with < 4 bytes of calldata. The target's fallback/receive
    function would execute. In practice, the probability of matching an allowlisted selector
    from random memory is low (~1 in 2^32 per allowlisted selector), and the FORWARDER is
    a trusted Chainlink node so crafting this deliberately requires a compromised forwarder.
    Still, the contract lacks a `data.length >= 4` check which is a defensive gap.
  impact: "Low — requires FORWARDER compromise AND memory coincidence. Worst case: target's fallback executes with msg.value=0"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: onReport should revert if report's data field has < 4 bytes
    // This tests the defensive gap — can't be a Chimera invariant easily
    // because it requires crafting specific calldata
    bytes memory shortData = hex"aabb"; // 2 bytes
    bytes memory report = abi.encode(allowlistedTarget, shortData);
    bytes memory metadata = abi.encodePacked(allowlistedWorkflowId, bytes10(0), bytes20(0));
    // Expect revert — but currently it does NOT revert, it reads garbage
    // vm.expectRevert();
    // workflowRouter.onReport(metadata, report);
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    The assembly reads past data boundaries. While Solidity guarantees the memory
    after data content is zero-padded for the last word of the ABI encoding, this
    applies to the encoding of `data` within the abi.decode output. For data.length=0,
    mload reads the 32 bytes following the length field, which is zero-padded by
    abi.decode. So for empty data, selector would be bytes4(0), which is explicitly
    blocked by the add-selector function (L279: `if (selector == bytes4(0)) revert`).
    For data.length 1-3, the non-provided bytes are zero-padded by ABI encoding.
    So the actual selector extracted would be the provided bytes left-padded into
    the high bits + zeros. Example: data=0xAA → selector=0xAA000000. This is
    deterministic, not random garbage. DOWNGRADING confidence — the ABI encoding
    guarantees make this less exploitable than initially thought. Still, no explicit
    length check is a code quality issue.

- id: WR-A-02
  tier: 2
  type: property
  description: "Admin can add WorkflowRouter itself as allowlisted target — enables FORWARDER to trigger self-calls (grantRole, revokeRole, pause, etc.)"
  attack_scenario: >
    1. Admin calls applyAllowlistedWorkflowsUpdates() adding address(WorkflowRouter)
       as a target with selector = grantRole.selector (0x2f2ff15d).
    2. FORWARDER calls onReport() with report = abi.encode(address(WorkflowRouter),
       abi.encodeWithSelector(grantRole.selector, FORWARDER_ROLE, attackerAddress)).
    3. The _call() on L117 executes target.call(data) where target = address(this).
       Inside this self-call, msg.sender = address(WorkflowRouter).
    4. grantRole checks onlyRole(getRoleAdmin(role)). For FORWARDER_ROLE, the admin
       role is DEFAULT_ADMIN_ROLE. WorkflowRouter would need DEFAULT_ADMIN_ROLE on
       itself for this to succeed — it does NOT have it by default.
    5. HOWEVER: if admin also grants DEFAULT_ADMIN_ROLE to address(WorkflowRouter)
       (a misconfiguration), then the self-call succeeds and FORWARDER can grant
       arbitrary roles to arbitrary addresses.
    VERDICT: Requires TWO admin mistakes (allowlist self + grant admin role to self).
    The contract does not prevent adding address(this) as a target, which is a missing
    safety check. But exploitation requires admin misconfiguration, making this Low.
  impact: "Medium impact IF exploited (full privilege escalation), but requires admin misconfiguration"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: WorkflowRouter should never be an allowlisted target
    address[] memory targets = workflowRouter.getAllowlistedTargets(workflowId);
    for (uint256 i = 0; i < targets.length; i++) {
        t(targets[i] != address(workflowRouter), "WR-A-02: WorkflowRouter is self-allowlisted as target");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    This is a defense-in-depth finding. The contract lacks a check like
    `require(target != address(this))` in _applyAllowlistedTargetsUpdates.
    Exploitation requires the admin to make two specific mistakes. Most contest
    judges would rate this QA/Low since it requires trusted admin misbehavior.
    Worth documenting but unlikely to be a paid finding.

- id: WR-A-03
  tier: 2
  type: property
  description: "FORWARDER_ROLE is fully trusted — a compromised Chainlink forwarder can call any allowlisted target+selector with arbitrary arguments"
  attack_scenario: >
    The allowlist validates (workflowId, target, selector) but NOT the arguments
    passed to the target function. A compromised FORWARDER can craft the report
    to call any allowlisted function with arbitrary parameters. For example, if
    target=PriceManager and selector=updatePrices is allowlisted, the FORWARDER
    can submit any price values. The allowlist provides coarse-grained authorization
    (which functions can be called) but zero validation of the call parameters.
    This is BY DESIGN — the Chainlink DON consensus is supposed to ensure report
    integrity. But if a forwarder is compromised (key leak, node takeover), the
    allowlist provides no defense against parameter manipulation.
  impact: "Depends on what targets+selectors are allowlisted. Could range from price manipulation to fund movement."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // This is a trust model observation, not a testable invariant.
    // The allowlist checks (workflowId, target, selector) but never validates
    // the actual calldata arguments beyond the 4-byte selector.
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    This is explicitly by design — Chainlink DON consensus validates report content.
    The FORWARDER_ROLE is meant to be assigned to trusted Chainlink infrastructure.
    Not a vulnerability per se, but a trust assumption that should be documented.
    Contest judges would reject this as "trusted role" unless the scope says otherwise.
    DO NOT REPORT — this is architecture documentation, not a finding.

- id: WR-A-04
  tier: 2
  type: property
  description: "No reentrancy guard on onReport() — allowlisted target could reenter if it has FORWARDER_ROLE"
  attack_scenario: >
    1. onReport() calls _call(target, data) on L117.
    2. The target contract executes and, if it also has FORWARDER_ROLE, calls back
       into onReport() with a different (workflowId, target, selector) combination.
    3. Since there is no reentrancy guard and no state is mutated before the external
       call in onReport(), the reentrant call succeeds independently.
    4. This allows a single tx to execute multiple allowlisted calls.
    However: (a) target contracts don't normally have FORWARDER_ROLE, (b) even if
    they did, each reentrant call is independently validated against the allowlist,
    (c) no state is corrupted because onReport() is stateless (reads allowlist, calls
    target, returns). The reentrancy doesn't give any advantage over simply calling
    onReport() twice in separate txs.
  impact: "None in practice — onReport is effectively stateless, reentrancy doesn't corrupt state"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Can't easily test in Chimera — would need a malicious target contract
    // that has FORWARDER_ROLE and calls back into onReport.
    // The key insight is that onReport has no state writes before _call,
    // so reentrancy is a non-issue.
  ghost_vars: []
  validated: false
  priority: low
  confidence: 85
  notes: >
    Verified: onReport() performs zero state writes. It only reads from
    s_allowlistedWorkflowIds and s_workflowInfos (view operations), then calls
    _call(). Reentrancy cannot corrupt any state because there is no state to
    corrupt. The function is effectively a stateless router. This is NOT a finding.

- id: WR-A-05
  tier: 2
  type: property
  description: "Metadata comment says workflowId at offset 32 but code reads metadata[:32] (offset 0) — comment/code mismatch"
  attack_scenario: >
    The NatDoc comment on L91 says "Offset 32, size 32: workflow_id (bytes32)" implying
    workflowId starts at byte 32. But L94 reads `bytes32(metadata[:32])` which takes
    bytes 0-31. Verified against tests: test/unit/workflow-router/on-report/onReport.t.sol
    uses `abi.encodePacked(WORKFLOW_ID, bytes10(0), bytes20(0))` placing workflowId at
    offset 0. So the CODE is correct and the COMMENT is misleading. The comment describes
    a structure where offset values represent cumulative positions, not starting offsets.
    However, under the stated layout: offset 32 = workflowId(32 bytes), offset 64 =
    workflow_name(10 bytes), offset 74 = workflow_owner(20 bytes). Total = 94 bytes, but
    reading from offset 32 means bytes 0-31 are something undocumented. The comment is
    simply wrong about offsets.
  impact: "None — code is correct per tests. Comment is misleading but harmless."
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Documentation issue — not a code vulnerability
    // The comment on L91 says "Offset 32" but code reads metadata[:32]
    // Tests confirm workflowId is at offset 0
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    Confirmed via unit tests. This is an informational/QA finding at best.
    The comment should say "Offset 0, size 32" for workflowId, "Offset 32,
    size 10" for workflow_name, "Offset 42, size 20" for workflow_owner.
    Worth mentioning in a QA report but not worth a standalone finding.

- id: WR-A-06
  tier: 1
  type: property
  description: "allowlistedSelectors stores bytes4 as bytes32 — the contains() check on L110 compares bytes32(selector) which zero-extends to the RIGHT, matching the add() on L283 which also uses bytes32(selector)"
  attack_scenario: >
    When a selector is added via _applyAllowlistedSelectorsUpdates (L283):
      s_workflowInfos[workflowId].allowlistedSelectors[target].add(bytes32(selector))
    bytes4 → bytes32 conversion in Solidity left-aligns the 4 bytes and zero-pads the
    right 28 bytes. Example: 0xAABBCCDD → 0xAABBCCDD000...000.

    In onReport (L106-108), selector is extracted via assembly:
      selector := mload(add(data, 32))
    mload reads 32 bytes, and `selector` is bytes4, so Solidity takes the high 4 bytes.
    Then L110 checks: contains(bytes32(selector)) — same left-aligned conversion.

    The question is: could an attacker craft data where the first 4 bytes match an
    allowlisted selector but the remaining 28 bytes of the mload are non-zero, causing
    the bytes32 comparison to FAIL even though the selector matches? NO — because the
    assignment `selector := mload(...)` into a bytes4 variable truncates to 4 bytes,
    and `bytes32(selector)` re-extends with zeros. So the contains check is consistent.

    VERIFIED: No bypass possible. The bytes4→bytes32 conversion is consistent between
    add and contains paths.
  impact: "None — the encoding is consistent"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify bytes4 → bytes32 conversion consistency
    bytes4 sel = bytes4(0xAABBCCDD);
    bytes32 stored = bytes32(sel);
    // stored == 0xAABBCCDD000...000 (left-aligned)
    // This matches what EnumerableSet.Bytes32Set stores
    t(stored == bytes32(bytes4(0xAABBCCDD)), "WR-A-06: selector encoding mismatch");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    Thoroughly verified. Solidity bytes4→bytes32 cast is always left-aligned with
    zero-padding on the right. Both the add (L283) and contains (L110) paths use
    bytes32(selector), ensuring consistency. The assembly extraction (L106-108)
    produces a proper bytes4 because the assignment target is bytes4. NO FINDING.

- id: WR-A-07
  tier: 2
  type: property
  description: "No TOCTOU between allowlist check and _call — but allowlist removal during a batch via _multiCall (inherited from Caller) could affect other calls in the batch"
  attack_scenario: >
    WorkflowRouter inherits Caller which has _multiCall(). However, _multiCall is
    internal and is NOT called from onReport() — onReport does a single _call().
    WorkflowRouter does not expose _multiCall publicly, so there is no batch
    execution path in this contract.

    For the single _call path in onReport(): the allowlist check (L99-114) and
    the call (L117) happen atomically in the same execution frame. The only way
    to modify the allowlist between check and call is via reentrancy into
    applyAllowlisted*() functions, which require DEFAULT_ADMIN_ROLE. If the target
    contract has DEFAULT_ADMIN_ROLE (extremely unlikely), it could remove the
    selector from the allowlist during execution — but this doesn't matter because
    the call already passed the check.

    VERDICT: No TOCTOU vulnerability exists.
  impact: "None"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // No testable invariant — this is a verified non-issue
    // The check-then-call pattern in onReport is atomic within EVM execution
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    Confirmed no TOCTOU. The check-call is atomic. _multiCall is internal and
    not exposed by WorkflowRouter. Even if reentrancy occurred, the allowlist
    check already passed so removing it mid-call has no effect. NOT A FINDING.


