      → adapter.erc20TransferFrom() → initiator() → IBundler3(BUNDLER3).initiator() → attacker
      → safeTransferFrom(token, attacker, receiver, amount) — only attacker's tokens
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
