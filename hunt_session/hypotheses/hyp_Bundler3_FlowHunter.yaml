- id: B3-FL-10
  tier: 1
  type: property
  description: >
    Callback reentrancy depth: morphoCallback llama reenterBundler3, que llama Bundler3.reenter,
    que llama _multicall. Dentro de _multicall, otra call podría trigger otro callback
    (e.g., morphoSupply con callback data). Esto crea un nesting de _multicall.
    ¿Puede el nesting causar una inconsistencia en reenterHash?
  attack_scenario: >
    1. multicall con Call 0: morphoSupply(market, assets, shares, ..., callbackData1)
       con callbackHash1 correcto.
    2. morphoSupply → MORPHO.supply(..., callbackData1) → onMorphoSupply → morphoCallback
       → reenterBundler3(callbackData1) → Bundler3.reenter(bundle1).
    3. reenter verifica reenterHash == hash(adapter, hash(callbackData1)). PASA.
    4. reenter → _multicall(bundle1).
    5. Dentro de bundle1, Call 0: morphoRepay(market2, ..., callbackData2) con callbackHash2.
    6. _multicall setea reenterHash = hash(adapter, callbackHash2).
    7. morphoRepay → MORPHO.repay(..., callbackData2) → onMorphoRepay → morphoCallback
       → reenterBundler3(callbackData2) → Bundler3.reenter(bundle2).
    8. reenter verifica reenterHash == hash(adapter, hash(callbackData2)). PASA.
    9. reenter → _multicall(bundle2). Al final, reenterHash = 0.
    10. Vuelve a bundle1._multicall. L66: require(reenterHash == 0). PASA (fue seteado a 0 por bundle2).
    11. Continúa con el siguiente call en bundle1. Todo funciona correctamente.
    CONCLUSIÓN: el nesting funciona correctamente porque reenterHash es un solo slot
    que se setea/resetea secuencialmente. Cada nivel de nesting completa su _multicall
    con reenterHash=0 antes de volver al nivel superior.
  impact: "N/A — nesting de callbacks funciona correctamente. Verificado."
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  call_stack: >
    multicall → _multicall(outerBundle)
      → reenterHash = hash(adapter, callbackHash1)
      → adapter.morphoSupply(data_with_callback)
        → MORPHO.supply → onMorphoSupply → reenterBundler3 → reenter(bundle1)
          → _multicall(bundle1)
            → reenterHash = hash(adapter, callbackHash2)
            → adapter.morphoRepay(data_with_callback2)
              → MORPHO.repay → onMorphoRepay → reenterBundler3 → reenter(bundle2)
                → _multicall(bundle2) → reenterHash = 0
              → return to bundle1._multicall
            → require(reenterHash == 0) ✓
            → continue
          → return
        → return to outerBundle._multicall
      → require(reenterHash == 0) ✓
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    El mecanismo de single-slot reenterHash funciona correctamente con nesting arbitrario.
    Cada nivel de _multicall termina con reenterHash=0 (último call tiene callbackHash=0).
    No hay race condition ni overwrite porque la ejecución es secuencial (no paralela).

- id: B3-FL-11
  tier: 1
  type: property
  description: >
    ERC4626 vault malicioso puede ser pasado a erc4626Mint/erc4626Deposit. El vault es un
    parámetro de usuario, no una dirección verificada. Un vault malicioso podría:
    (a) No devolver shares al receiver pero consumir los tokens del adapter.
    (b) Re-entrar al adapter durante vault.mint/deposit.
  attack_scenario: >
    1. Atacante deploya MaliciousVault que implementa IERC4626.
    2. MaliciousVault.asset() retorna USDC (o cualquier token que el adapter tenga).
    3. Atacante construye bundle:
       Call 0: permit2TransferFrom(USDC, adapter, 10000e6) — mueve USDC al adapter.
       Call 1: erc4626Deposit(maliciousVault, type(uint256).max, maxSlippage, receiver).
    4. erc4626Deposit:
       - underlyingToken = maliciousVault.asset() = USDC
       - forceApprove(USDC, maliciousVault, max)
       - maliciousVault.deposit(amount, receiver) → vault pulls USDC via transferFrom
       - forceApprove(USDC, maliciousVault, 0)
    5. El vault malicioso recibe los USDC y no devuelve shares reales.
    6. PERO: esto solo afecta al ATACANTE (que es el initiator y envió SUS propios USDC).
       No puede robar USDC de otros usuarios porque permit2TransferFrom usa initiator().
    7. CONTRAARGUMENTO: ¿y si el adapter tiene USDC residuales de otro usuario (B3-FL-02)?
       Entonces el atacante podría usar erc4626Deposit con un vault malicioso para drenar
       los USDC residuales. Pero necesitaría que hubiera residuales primero.
    8. CONCLUSIÓN: el vault malicioso por sí solo no es un vector (el atacante solo roba
       sus propios tokens). PERO combinado con residuales (B3-FL-02), amplifica el riesgo.
  impact: >
    Sin tokens residuales: autorobo, no es un bug.
    Con tokens residuales (B3-FL-02): permite drenar residuales via vault malicioso + max approval temporal.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  confidence: 70
  call_stack: >
    multicall → adapter.erc4626Deposit(maliciousVault, max, ...)
      → underlyingToken = maliciousVault.asset()
      → forceApprove(underlyingToken, maliciousVault, max) ← CRITICAL: max approval to untrusted vault
      → maliciousVault.deposit(amount, receiver) ← vault pulls tokens
      → forceApprove(underlyingToken, maliciousVault, 0) ← approval reset
  solidity: |
    // The approval is correctly reset to 0, so the vault can only pull tokens DURING deposit().
    // The risk is: maliciousVault.deposit() could call back into the adapter before returning.
    // BUT: onlyBundler3 blocks direct calls. Bundler3 is already in _multicall.
    // The vault could call Bundler3.multicall → AlreadyInitiated.
    // The vault could call Bundler3.reenter → needs correct reenterHash.
    // UNLESS the current call in the bundle has callbackHash set for this vault's callback.
    // In that case, the vault COULD reenter with the pre-committed bundle.
    // This is actually the intended behavior for supply callbacks.
  ghost_vars: []
  validated: false
  priority: medium
  notes: >
    El vault malicioso es un edge case. El approval se resetea a 0 después del deposit,
    limitando la ventana de explotación a la ejecución de vault.deposit().
    El vault podría reentrear via Bundler3.reenter si callbackHash fue pre-committeado,
    pero eso requiere que el INITIATOR (el atacante) haya configurado el bundle así.
    Autoataque = no es un bug.

- id: B3-FL-12
  tier: 1
  type: property
  description: >
    morphoCallback no verifica que los datos (Call[] encoded en data) son los mismos
    que fueron pre-committeados en callbackHash. El hash verification ocurre en Bundler3.reenter(),
    no en morphoCallback(). ¿Es posible que Morpho modifique el data entre el supply call
    y el callback?
  attack_scenario: >
    1. adapter.morphoSupply(marketParams, assets, shares, ..., onBehalf, data) es llamada.
    2. MORPHO.supply(marketParams, assets, shares, onBehalf, data) es llamada.
    3. Morpho ejecuta la lógica de supply y luego llama onMorphoSupply(assets_supplied, data).
    4. data pasa por Morpho sin modificación (Morpho Blue es audited + immutable).
    5. onMorphoSupply → morphoCallback(data) → reenterBundler3(data).
    6. reenterBundler3 → Bundler3.reenter(decoded_data).
    7. Bundler3.reenter verifica: reenterHash == keccak256(bytes20(msg.sender) || keccak256(msg.data[4:])).
    8. msg.sender = adapter address. msg.data[4:] = abi.encode(Call[]).
    9. El callbackHash en el Call original del bundle externo debe ser keccak256(msg.data[4:])
       = keccak256(abi.encode(innerBundle)).
    10. Si Morpho modificara data, el hash no coincidiría y reenter revertiría.
    CONCLUSIÓN: el mecanismo es robusto. Morpho no puede modificar los datos del callback.
    Incluso si pudiera, el hash check en reenter lo detectaría.
  impact: "N/A — mecanismo verificado como correcto. Los datos del callback están protegidos por el hash pre-commitment."
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  call_stack: >
    multicall.Call[i].callbackHash = keccak256(abi.encode(innerBundle))
      → reenterHash = keccak256(bytes20(adapter) || callbackHash)
      → adapter.morphoSupply(..., data=abi.encode(innerBundle))
        → MORPHO.supply → onMorphoSupply(_, data) → morphoCallback(data)
          → reenterBundler3(data) → Bundler3.reenter(innerBundle)
            → verify: reenterHash == keccak256(bytes20(msg.sender=adapter) || keccak256(msg.data[4:]))
            → keccak256(msg.data[4:]) == keccak256(abi.encode(innerBundle)) == callbackHash ✓
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    Doble protección: (1) Morpho es inmutable y pasa data sin modificar,
    (2) aún si se modificara, el hash check en reenter lo detectaría.

- id: B3-FL-13
  tier: 1
  type: property
  description: >
    ParaswapAdapter: Augustus registry puede registrar un Augustus malicioso. El check
    AUGUSTUS_REGISTRY.isValidAugustus(augustus) confía en el registry. Si el registry owner
    registra un Augustus malicioso, puede drenar tokens del adapter durante swaps.
  attack_scenario: >
    1. ParaswapAdapter confía en AUGUSTUS_REGISTRY para validar Augustus contracts.
    2. AUGUSTUS_REGISTRY es un contrato externo de Paraswap, controlado por Paraswap team.
    3. Si Paraswap registra un Augustus malicioso (por compromiso o malicia):
       - swap() hace forceApprove(srcToken, maliciousAugustus, max).
       - maliciousAugustus.call(callData) → Augustus drena todos los srcTokens del adapter.
       - Luego forceApprove(srcToken, maliciousAugustus, 0) — pero ya es tarde.
    4. PERO: la ventana es limitada. Augustus solo puede tomar srcTokens que el adapter
       tenga en ese momento. Los tokens llegan al adapter justo antes del swap y deberían
       salir justo después. El adapter no mantiene balances permanentes.
    5. RIESGO ADICIONAL: si sellEntireBalance=true, el adapter tiene un balance conocido
       que Augustus puede tomar completamente.
    6. CONCLUSIÓN: trust boundary issue. El adapter confía en el Augustus Registry de Paraswap.
       Si Paraswap es comprometido, los tokens en tránsito durante swaps son vulnerables.
  impact: >
    Confianza en tercero (Paraswap). Si Augustus registry es comprometido, tokens en tránsito
    durante swaps pueden ser robados. Magnitud = valor de los swaps en curso.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  confidence: 75
  call_stack: >
    multicall → adapter.sell(augustus, callData, srcToken, destToken, ...)
      → swap() → AUGUSTUS_REGISTRY.isValidAugustus(augustus) ✓ (registry comprometido)
      → forceApprove(srcToken, augustus, max) ← max approval a contrato malicioso
      → augustus.call(callData) ← Augustus drena srcTokens
      → forceApprove(srcToken, augustus, 0) ← too late
  solidity: null
  ghost_vars: []
  validated: false
  priority: medium
  notes: >
    Trust boundary — no es un bug directo del adapter sino una dependencia en Paraswap.
    El adapter correctamente resetea la approval a 0 después, pero el daño ya ocurrió.
    Comparable a confiar en Chainlink oracles — aceptable en la industria.
    Para Cantina bounty: probablemente "known issue" / design decision.

- id: B3-FL-14
  tier: 1
  type: property
  description: >
    multicall con bundle vacío después de que otro call modificó reenterHash:
    Si un call en el bundle tiene callbackHash != 0, reenterHash se setea.
    Si ese call NO trigger un reenter (callback no llama reenterBundler3),
    L66 require(reenterHash == 0) falla → MissingExpectedReenter.
    Esto funciona correctamente como safety check. PERO: ¿hay un escenario donde
    un call legítimo tiene callbackHash pero el callback path no ejecuta reenter?
  attack_scenario: >
    1. Usuario setea callbackHash para una operación de morphoSupply CON callback data.
    2. morphoSupply → MORPHO.supply(... data) → onMorphoSupply(_, data).
    3. Si data está vacío (bytes("")), onMorphoSupply hace morphoCallback("") →
       reenterBundler3("") → Bundler3.reenter(emptyBundle).
    4. PERO: reenter requiere bundle.length > 0 (EmptyBundle check).
    5. Si data = abi.encode(emptyCallArray), reenter intentaría _multicall con array vacío → revert.
    6. CONCLUSIÓN: si un usuario pone callbackHash != 0 pero los callback data resultarán
       en un reenter con bundle vacío, la tx revierte. Esto es correcto.
    7. El otro caso: usuario pone callbackHash != 0 pero data = bytes("") que no codifica
       un Call[]. reenter recibe datos malformados → reverts al decodificar.
    8. En todos los casos, MissingExpectedReenter o un revert previo protege la integridad.
  impact: "N/A — safety check funciona correctamente. No hay bypass."
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  call_stack: null
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    Verificación de completitud del check MissingExpectedReenter.
    El check es robusto y no tiene bypass conocidos.

- id: B3-FL-15
  tier: 1
  type: property
  description: >
    ETH value double-spending across calls in a bundle: Bundler3._multicall envía
    bundle[i].value en cada call. Si sum(bundle[i].value) > msg.value, ¿la tx revierte
    o usa ETH de otra fuente (balance previo de Bundler3)?
  attack_scenario: >
    1. Bundler3 tiene 0 balance previo.
    2. Usuario llama multicall{value: 1 ether}(bundle) con:
       bundle[0] = {to: adapter, data: wrapNative(1 ether), value: 1 ether}
       bundle[1] = {to: adapter, data: wrapNative(1 ether), value: 1 ether}
    3. Call 0: to.call{value: 1 ether}(data) — envía 1 ether al adapter. Bundler3.balance = 0.
    4. Call 1: to.call{value: 1 ether}(data) — Bundler3.balance = 0 < 1 ether → EVM REVERTS
       (insufficient balance for value transfer).
    5. CONCLUSIÓN: el EVM previene double-spending de ETH. Si Bundler3 no tiene balance
       suficiente, el call revierte a nivel de EVM antes de la ejecución.
    6. PERO: si Call 0 le devuelve ETH al Bundler3 (e.g., via unwrapNative con receiver=Bundler3),
       entonces Call 1 podría usar ese ETH.
    7. Esto NO es un bug — es el flujo intencional del multicall.
    8. El riesgo real es SOLO cuando hay ETH residual de OTRAS transacciones (B3-FL-01).
  impact: "N/A — EVM previene double-spending. ETH value es correctamente limitado por address(bundler3).balance."
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  call_stack: >
    multicall{value: 1 ether} → Bundler3.balance = 1 ether
      → to.call{value: 1 ether}(...) → Bundler3.balance = 0
      → to.call{value: 1 ether}(...) → REVERTS (insufficient balance)
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    El EVM es el enforcement layer aquí. Bundler3 no necesita validar sum(values) <= balance
    porque el EVM lo hace implícitamente en cada call.
    El vector real es ETH residual de transacciones previas, cubierto en B3-FL-01.

- id: B3-FL-16
  tier: 1
  type: property
  description: >
    stakeEth en EthereumGeneralAdapter1: usa IStEth.submit{value: amount}(referral).
    stETH tiene 1-2 wei rounding issue conocido ("1 wei corner case").
    Si receiver != adapter, transfiere amount de stETH, pero stETH.balanceOf podría ser
    amount-1 debido al rounding. ¿Se pierden tokens por rounding?
  attack_scenario: >
    1. stakeEth(amount=100 ether, ..., receiver=user) ejecuta:
       L112: sharesReceived = IStEth(ST_ETH).submit{value: 100 ether}(referral)
       L113: require(amount.rDivUp(sharesReceived) <= maxSharePriceE27)
       L115: if (receiver != adapter) safeTransfer(ST_ETH, receiver, amount)
    2. stETH.submit devuelve shares, no tokens 1:1. El adapter recibe shares.
    3. Pero L115 transfiere `amount` (no shares-based amount). stETH.balanceOf(adapter)
       podría ser amount-1 wei debido a stETH rounding.
    4. Si balanceOf(adapter) < amount, safeTransfer revierte.
    5. PERO: stETH.submit generalmente mints >= amount de stETH al caller (1:1 o better).
       El 1-wei issue es en transferencias subsiguientes, no en el mint.
    6. MITIGACIÓN parcial: maxSharePriceE27 check protege contra slippage significativo.
    7. RIESGO RESIDUAL: si stETH tiene un bug que mints amount-1, la función revierte.
       Esto es un DoS, no pérdida de fondos. El usuario puede reintentar.
  impact: "DoS potencial por 1-wei rounding de stETH. No pérdida de fondos. Low/QA."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  confidence: 70
  call_stack: >
    stakeEth(amount, maxSharePriceE27, referral, receiver)
      → IStEth.submit{value: amount}(referral) → shares minted
      → slippage check ✓
      → safeTransfer(stETH, receiver, amount) ← might revert if balance < amount by 1 wei
  solidity: null
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    stETH 1-wei rounding es un issue conocido en todo el ecosystem DeFi.
    No es específico de Bundler3. La función podría usar balanceOf en lugar de amount
    para ser más robusta, pero el riesgo actual es mínimo.

