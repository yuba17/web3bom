# FINDINGS REALES (potencialmente reportables):
#   B3-FL-01 (HIGH): ETH stranding via skipRevert → robo por cualquier usuario
#   B3-FL-02 (HIGH): Token residuales en adapter → robo via erc20Transfer(max)
#   Ambos comparten root cause: skipRevert permite bundles parcialmente fallidos
#   que dejan activos sin dueño en contratos compartidos.
#
# DISEÑO VERIFICADO (no bugs):
#   B3-FL-03: ParaswapAdapter approval leak → FALSE POSITIVE (EVM subcall revert)
#   B3-FL-04: Flash loan callback → seguro (Morpho verifica repago)
#   B3-FL-05: Initiator spoofing → imposible (transient storage)
#   B3-FL-10: Nested callbacks → funciona correctamente
#   B3-FL-12: Callback data integrity → protegido por hash pre-commitment
#   B3-FL-14: MissingExpectedReenter → check robusto
#   B3-FL-15: ETH double-spending → EVM lo previene
#
# EDGE CASES (Low/QA):
#   B3-FL-06: ERC20Wrapper fee-on-transfer incompatibility
#   B3-FL-08: srcToken == destToken in ParaswapAdapter → DoS
#   B3-FL-16: stETH 1-wei rounding en stakeEth
#
# TRUST BOUNDARIES (design decisions):
#   B3-FL-09: Permanent Morpho approval → accepted trust
#   B3-FL-11: Untrusted ERC4626 vault → autoataque only
#   B3-FL-13: Augustus registry trust → Paraswap dependency

false_positives:
- hunter: FlowHunter
  id: B3-FL-FP-01
  reason: >
    ParaswapAdapter approval leak via skipRevert (B3-FL-03): descartado.
    Cuando to.call() falla en Bundler3._multicall, el EVM revierte TODOS los side effects
    de esa subcall, incluyendo storage writes (approvals). El skipRevert solo controla
    si el loop de Bundler3 continúa, no si los efectos de la subcall persisten.
    La forceApprove(max) dentro de swap() se revierte junto con toda la subcall.
  investigated_at: '2026-03-23T00:00:00Z'

- hunter: FlowHunter
  id: B3-FL-FP-02
  reason: >
    Initiator spoofing (B3-FL-05): descartado. Transient storage slot para initiator
    solo se escribe en multicall() con msg.sender (no spoofable). La lectura en adapters
    es via IBundler3(BUNDLER3).initiator() — lectura directa del storage.
    No hay forma de hacer que initiator() retorne la dirección de otro usuario.
  investigated_at: '2026-03-23T00:00:00Z'

- hunter: FlowHunter
  id: B3-FL-FP-03
  reason: >
    Nested reenterHash corruption: descartado. Cada nivel de _multicall completa con
    reenterHash=0 (último call tiene callbackHash=0). La ejecución es secuencial,
    no paralela. No hay race condition ni overwrite entre niveles de nesting.
  investigated_at: '2026-03-23T00:00:00Z'

- hunter: FlowHunter
  id: B3-FL-FP-04
  reason: >
    ETH double-spending across calls (B3-FL-15): descartado. El EVM previene envío de ETH
    cuando address(this).balance < value. No se necesita check adicional en Bundler3.
    Solo el ETH residual de txs previas (B3-FL-01) es un vector real.
  investigated_at: '2026-03-23T00:00:00Z'

- hunter: FlowHunter
  id: B3-FL-FP-05
  reason: >
    Flash loan token theft via callback (B3-FL-04): descartado. Morpho verifica repago
    al final del flash loan. Si los tokens no están en el adapter, la tx revierte.
    El atacante no puede sacar tokens durante el callback sin que el flash loan falle.
  investigated_at: '2026-03-23T00:00:00Z'
