- id: B3-FL-08
  tier: 1
  type: property
  description: >
    ParaswapAdapter: srcToken == destToken en swap. Los checks de balance before/after
    producen resultados inesperados cuando el mismo token es source y dest.
    srcAmount = srcInitial - srcFinal, destAmount = destFinal - destInitial.
    Si srcToken == destToken, srcInitial == destInitial y srcFinal == destFinal.
    Entonces: srcAmount = srcInitial - srcFinal, destAmount = srcFinal - srcInitial = -srcAmount.
    Si srcAmount > 0, destAmount underflows (uint256).
  attack_scenario: >
    1. Atacante llama sell() con srcToken = USDC, destToken = USDC.
    2. Augustus ejecuta alguna operación que mueve USDC (e.g., swap A→B→A via pool route).
    3. Después de augustus.call:
       - srcFinal = destFinal (misma variable, mismo token)
       - srcAmount = srcInitial - srcFinal
       - destAmount = destFinal - destInitial = srcFinal - srcInitial
    4. Si srcFinal < srcInitial (tokens gastados): srcAmount > 0, destAmount underflows → REVERT.
       Si srcFinal > srcInitial (tokens ganados): srcAmount underflows → REVERT.
       Si srcFinal == srcInitial: srcAmount = 0, destAmount = 0 → pasa pero no hace nada.
    5. CONCLUSIÓN: srcToken == destToken siempre revierte o no hace nada.
       No hay explotación — pero es un DoS si Augustus acepta rutas circulares.
  impact: "DoS — swap con srcToken == destToken siempre revierte. No hay pérdida de fondos, solo gas waste."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  confidence: 90
  call_stack: >
    sell/buy → swap(srcToken=X, destToken=X)
      → srcInitial = X.balanceOf(adapter)
      → destInitial = X.balanceOf(adapter) [== srcInitial]
      → augustus.call(callData)
      → srcFinal = X.balanceOf(adapter)
      → destFinal = X.balanceOf(adapter) [== srcFinal]
      → srcAmount = srcInitial - srcFinal [underflow si srcFinal > srcInitial]
      → destAmount = destFinal - destInitial = srcFinal - srcInitial [underflow si srcFinal < srcInitial]
  solidity: |
    // PoC: srcToken == destToken always reverts
    // Setup: adapter has 100 USDC, Augustus swaps USDC→USDC via circular route
    // Result: either srcAmount or destAmount underflows → revert
  ghost_vars: []
  validated: false
  priority: low
  notes: >
    No es explotable. Es un edge case de validación. Un require(srcToken != destToken)
    sería una mejora pero no es un bug de seguridad. QA/Gas-optimization.

