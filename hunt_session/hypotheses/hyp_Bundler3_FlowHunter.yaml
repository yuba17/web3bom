- id: B3-FL-06
  tier: 1
  type: property
  description: >
    ERC20WrapperAdapter.erc20WrapperWithdrawTo: el patrón de transfer→transferFrom para
    verificar ownership del wrapper token crea una ventana donde los tokens están en el
    initiator. Si el initiator es un contrato con un hook en transfer/transferFrom,
    puede reentrear y manipular el estado.
  attack_scenario: >
    1. erc20WrapperWithdrawTo ejecuta:
       L57: safeTransfer(wrapper, initiator, amount) — tokens VAN al initiator
       L58: safeTransferFrom(wrapper, initiator, adapter, amount) — tokens VUELVEN al adapter
    2. El wrapper token podría tener un hook (ERC777, ERC1363, hook de permisos).
    3. PERO: el wrapper es un ERC20Wrapper de OpenZeppelin. Su transfer es estándar ERC20.
    4. Incluso si el token tuviera un hook, el initiator es el msg.sender del multicall original.
       Durante el hook, el initiator podría llamar otro contrato, pero NO puede llamar
       multicall (AlreadyInitiated) ni reenter (no tiene el hash correcto).
    5. El risk real: si el wrapper es un contrato MALICIOSO (no OZ ERC20Wrapper), podría
       no devolver los tokens en el transferFrom. Pero el require(withdrawTo(...)) después
       verificaría que el unwrap funciona — si no hay tokens, falla.
    6. CUIDADO con tokens con fee-on-transfer: si el wrapper cobra fee en transfer,
       la cantidad que llega al initiator es menor que amount. Luego el transferFrom por
       amount falla porque el initiator no tiene suficientes tokens.
       Esto NO es un bug del adapter — es incompatibilidad con fee-on-transfer tokens.
       Pero si el wrapper ES un fee-on-transfer token, la función es unusable.
  impact: >
    El patrón transfer→transferFrom es seguro contra reentrancy dado AlreadyInitiated guard.
    La vulnerabilidad a fee-on-transfer tokens es un edge case Low/QA.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  confidence: 80
  call_stack: >
    Bundler3._multicall → adapter.erc20WrapperWithdrawTo(wrapper, receiver, amount)
      → safeTransfer(wrapper, initiator, amount) ← tokens to initiator
      [POSIBLE HOOK si wrapper es ERC777 — pero initiator no puede reentrar Bundler3]
      → safeTransferFrom(wrapper, initiator, adapter, amount) ← tokens back
      → ERC20Wrapper(wrapper).withdrawTo(receiver, amount)
  solidity: |
    // Test: fee-on-transfer wrapper token breaks erc20WrapperWithdrawTo
    // Deploy a mock wrapper with 1% fee on transfer
    // erc20WrapperWithdrawTo should revert because transferFrom(initiator, adapter, amount)
    // fails — initiator only has amount * 99/100 after the transfer to them
  ghost_vars: []
  validated: false
  priority: medium
  notes: >
    El vector de reentrancy via hooks está mitigado por AlreadyInitiated.
    El vector de fee-on-transfer es Low/QA — no pérdida de fondos, solo DoS de la función.
    El patrón transfer→transferFrom es deliberado: fuerza al initiator a "aprobar" el unwrap
    al tener que tener allowance al adapter para el transferFrom.

