    4. swap() chequea require(msg.sender == BUNDLER3) via el modifier.
    5. Si msg.sender NO es BUNDLER3, la llamada a swap() revierte.
    6. CORRECCIÓN: buy() es PUBLIC, no external. buyMorphoDebt() llama buy() internamente.
       Pero buy() también llama swap() que tiene onlyBundler3.
    7. CONCLUSIÓN: no se puede llamar sell/buy sin pasar por Bundler3 porque swap() lo impide.
    8. SIN EMBARGO: ¿qué pasa si BUNDLER3 mismo tiene una vulnerabilidad que permite llamar
       al adapter con calldata crafteada que no pasa por sell/buy sino directamente a swap?
       Bundler3.multicall hace to.call(data) — el data puede ser cualquier función del adapter.
       Pero swap() es internal, no external. No se puede llamar directamente.
  impact: "N/A — sell/buy correctamente protegidos por swap() → onlyBundler3. swap() es internal."
