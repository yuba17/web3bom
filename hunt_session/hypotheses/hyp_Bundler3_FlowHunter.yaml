    ANÁLISIS: initiator es transient storage del Bundler3. Solo se setea en multicall()
    por msg.sender. No hay forma de setear initiator a la dirección de otro usuario.
    La lectura es via IBundler3(BUNDLER3).initiator() — lectura directa del transient slot.
  attack_scenario: >
    1. Usuario A ha dado approve(adapter, max) para USDC (para usar erc20TransferFrom en bundles).
    2. Atacante B quiere hacer que initiator() retorne la dirección de A durante su bundle.
    3. Para esto, B necesitaría: (a) ser msg.sender == A en multicall, o (b) manipular
       el transient storage slot de initiator.
    4. (a) es imposible — msg.sender es la dirección real del caller.
    5. (b) requeriría una vulnerabilidad en transient storage o en el slot assignment.
       El slot es determinístico (storage layout del contrato) y no hay overflow/underflow posible.
    6. CONCLUSIÓN: no hay forma de spoofear initiator(). Cada usuario solo puede operar
       sobre sus propios tokens vía erc20TransferFrom/permit2TransferFrom.
  impact: "N/A — iniciator no puede ser spoofeado. Seguro por diseño."
