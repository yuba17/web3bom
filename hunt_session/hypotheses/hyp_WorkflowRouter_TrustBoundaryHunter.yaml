# ═══════════════════════════════════════════════════════════════
# TRUST BOUNDARY ANALYSIS SUMMARY
# ═══════════════════════════════════════════════════════════════
#
# Trust model:
#   FORWARDER_ROLE (CRE forwarder) → onReport(metadata, report)
#     - Provides: metadata (workflowId, workflow_name, workflow_owner)
#     - Provides: report (target address + calldata)
#     - Trust assumption: forwarder faithfully relays CRE workflow output
#
#   DEFAULT_ADMIN_ROLE → applyAllowlistedWorkflowsUpdates(), applyAllowlistedTargetsUpdates(),
#                         applyAllowlistedSelectorsUpdates(), grantRole(), revokeRole()
#     - Controls entire allowlist: which workflowIds, targets, selectors are valid
#     - Controls who has FORWARDER_ROLE
#     - Uses AccessControlDefaultAdminRules (2-step transfer with timelock)
#
# Call flow in onReport:
#   1. Check caller has FORWARDER_ROLE
#   2. Extract workflowId from metadata[:32]
#   3. Check workflowId is allowlisted
#   4. Decode (target, data) from report
#   5. Extract selector from data (first 4 bytes)
#   6. Check selector is allowlisted for (workflowId, target)
#   7. _call(target, data) — low-level call, no value, return data discarded
#
# Key boundaries:
#   - Forwarder→WorkflowRouter: protected by FORWARDER_ROLE
#   - WorkflowRouter→Target: protected by (workflowId, target, selector) allowlist
#   - Admin→Allowlist: protected by DEFAULT_ADMIN_ROLE + 2-step timelock
#   - Target→WorkflowRouter (callback): would need FORWARDER_ROLE, so reentrancy is blocked
#
# msg.sender context: target contracts see msg.sender = WorkflowRouter address.
# This means WorkflowRouter acts as an IDENTITY to downstream contracts — any
# permissions granted to WorkflowRouter address can be exercised by any forwarder
# through any allowlisted workflow.
#
# CALLER.SOL BEHAVIOR VERIFIED (2026-03-22):
#   _call() PROPAGA reverts — NO los silencia.
#   Patron: if (!success) { if (response.length > 0) { assembly revert } else { revert LowLevelCallFailed } }
#   El error siempre se propaga al forwarder. Comportamiento correcto.
#
# METADATA OFFSET DISCREPANCY (WR-TB-06):
#   El NatDoc dice "Offset 32, size 32: workflow_id" pero el codigo lee bytes32(metadata[:32]).
#   El comentario describe offsets dentro del struct COMPLETO de la CRE (que tiene un prefijo
#   de 32 bytes antes del workflowId). El contrato recibe SOLO la parte relevante del metadata.
#   Los tests confirman que el codigo funciona correctamente leyendo offset 0.
#   VEREDICTO: error de documentacion (el comentario describe el formato CRE completo, no el
#   calldata recibido). El codigo es correcto segun los tests. Clasificado como Low/Info.
#
# SELECTOR EXTRACTION CON DATA CORTA (WR-TB-07):
#   assembly mload(add(data, 32)) lee los primeros 4 bytes del contenido de data.
#   Si data tiene 0 bytes: lee el length word siguiente en memoria = 0 → selector = bytes4(0).
#   bytes4(0) no puede estar en la allowlist (protegido por check en add selectors).
#   Si data tiene 1-3 bytes: el mload lee datos parciales + memoria adyacente.
#   El selector resultante casi nunca coincidira con uno allowlisteado (probabilidad minima).
#   VEREDICTO: no hay revert explicito para data corta, pero el comportamiento es safe
#   en la practica. Recomendacion: añadir require(data.length >= 4) explicito.
#

invariants:

  - id: WR-TB-01
    title: "Self-referential allowlist: admin can allowlist WorkflowRouter itself as target"
    description: |
      There is NO check preventing the admin from adding the WorkflowRouter's own address
      as an allowlisted target. If the admin adds WorkflowRouter as a target with selectors
      like grantRole (0x2f2ff15d) or revokeRole (0xd547741f), a compromised forwarder could:
        1. Call onReport with report = (WorkflowRouter, grantRole(FORWARDER_ROLE, attacker))
        2. Grant FORWARDER_ROLE to any address
        3. Then use that to grant DEFAULT_ADMIN_ROLE (if that selector is also allowlisted)

      The _call in Caller.sol does target.call(data) with no restriction on target == address(this).
      Since grantRole is a public function inherited from AccessControlDefaultAdminRules, the
      call would execute in the context of WorkflowRouter itself.

      However: DEFAULT_ADMIN_ROLE uses AccessControlDefaultAdminRules which requires 2-step
      transfer with timelock, so directly granting DEFAULT_ADMIN_ROLE via grantRole would fail
      (it's special-cased). But granting other roles (PAUSER_ROLE, FORWARDER_ROLE, etc.) works.

      MITIGATION CHECK: No validation exists that target != address(this).
    confidence: 45
    severity: Medium
    status: unverified
    attack_scenario: |
      1. Admin misconfigures allowlist: adds WorkflowRouter as target with grantRole selector
      2. Compromised FORWARDER_ROLE calls onReport(metadata, report) where
         report = abi.encode(address(workflowRouter), abi.encodeWithSelector(
           AccessControl.grantRole.selector, Roles.PAUSER_ROLE, attackerAddress))
      3. WorkflowRouter calls itself: grantRole(PAUSER_ROLE, attacker) succeeds because
         msg.sender = address(this) which needs DEFAULT_ADMIN_ROLE... wait —
         grantRole requires the caller to have the role's admin role.
      4. CORRECTION: grantRole checks that msg.sender has the admin role for the target role.
         DEFAULT_ADMIN_ROLE is the admin of all roles by default. So this call would only
         succeed if WorkflowRouter itself has DEFAULT_ADMIN_ROLE — which it doesn't normally.
      5. REVISED RISK: This vector is only exploitable if the admin also grants
         DEFAULT_ADMIN_ROLE to the WorkflowRouter contract address (very unlikely).
         The self-call works mechanically but lacks the role authority to do damage.
    code_location:
      file: src/WorkflowRouter.sol
      lines: "103-117"
      relevant_code: |
        (address target, bytes memory data) = abi.decode(report, (address, bytes));
        // ... selector check ...
        _call(target, data);  // no check: target != address(this)

  - id: WR-TB-02
    title: "Forwarder compromise blast radius: arbitrary calls to any allowlisted target with WorkflowRouter identity"
    description: |
      If FORWARDER_ROLE is compromised, the attacker can call ANY function on ANY target
      that is in the allowlist, for ANY allowlisted workflowId. The allowlist is per-workflowId,
      but the forwarder is NOT bound to a specific workflowId — any forwarder can use any
      workflowId.

      The blast radius is: every allowlisted (target, selector) pair across ALL workflow IDs.

      Crucially, downstream contracts see msg.sender = WorkflowRouter. If those contracts
      have granted permissions or balances to WorkflowRouter (e.g., token approvals, role
      memberships), a compromised forwarder can exercise ALL of those permissions.

      This is by-design (forwarder is trusted), but the trust surface is wider than it
      appears: forwarder trust grants access to the UNION of all allowlisted paths, not
      just one workflow's paths.
    confidence: 85
    severity: Informational
    status: verified-by-design
    attack_scenario: |
      1. WorkflowRouter has 3 workflows configured:
         - Workflow A: can call FeeAggregator.processPayment()
         - Workflow B: can call Auction.performUpkeep()
         - Workflow C: can call Treasury.distribute()
      2. Compromised forwarder can call ALL THREE using ANY workflowId
         (workflowId in metadata is attacker-controlled, just needs to be allowlisted)
      3. A single forwarder compromise exposes ALL allowlisted functionality
      4. If FeeAggregator has approved WorkflowRouter to spend tokens, the
         forwarder can trigger processPayment to misroute those tokens
    code_location:
      file: src/WorkflowRouter.sol
      lines: "86-117"
      relevant_code: |
        function onReport(
          bytes calldata metadata,
          bytes calldata report
        ) external whenNotPaused onlyRole(Roles.FORWARDER_ROLE) {
          bytes32 workflowId = bytes32(metadata[:32]);
          // workflowId is from metadata — forwarder controls this

  - id: WR-TB-03
    title: "Admin allowlisting a token contract as target enables fund drainage"
    description: |
      If DEFAULT_ADMIN_ROLE adds a token contract (ERC20) as an allowlisted target with
      the transfer(address,uint256) selector (0xa9059cbb), any forwarder can drain all
      tokens held by WorkflowRouter by calling:
        report = abi.encode(tokenAddress, abi.encodeWithSelector(
          IERC20.transfer.selector, attackerAddress, balance))

      Similarly with approve(address,uint256) selector (0x095ea7b3) — forwarder could
      approve arbitrary spender for WorkflowRouter's token balance.

      This is an admin misconfiguration risk. The contract has NO guardrails against
      allowlisting dangerous selectors on sensitive targets.

      MITIGATION: WorkflowRouter does not appear to hold tokens in normal operation
      (no receive/fallback, no direct token handling). But if tokens are accidentally
      sent to it, or if a workflow deposits tokens to it, they become drainable.
    confidence: 35
    severity: Low
    status: unverified
    attack_scenario: |
      1. Admin (possibly through governance proposal) adds USDC as allowlisted target
         with transfer selector for some payment workflow
      2. WorkflowRouter receives USDC (from fees, accidental transfer, or workflow design)
      3. Compromised forwarder calls onReport to transfer all USDC to attacker
      4. Or: legitimate forwarder relays a malicious CRE workflow output that specifies
         attacker address as transfer recipient
    code_location:
      file: src/WorkflowRouter.sol
      lines: "103-117"
      relevant_code: |
        (address target, bytes memory data) = abi.decode(report, (address, bytes));
        // target could be USDC, data could be transfer(attacker, balance)
        _call(target, data);

  - id: WR-TB-04
    title: "Proxy target: implementation change between allowlist setup and call execution"
    description: |
      The allowlist stores (target address, function selector). If the target is a proxy
      contract (UUPS, TransparentProxy, etc.), the admin verifies the selector against the
      CURRENT implementation. But the proxy owner can upgrade the implementation at any time.

      After upgrade, the same selector could:
        - Map to a completely different function (same selector, different logic)
        - Be handled by a new fallback function that ignores the selector entirely
        - Execute arbitrary logic in the new implementation

      The WorkflowRouter has no way to detect this. The allowlist check passes (same address,
      same selector), but the executed code is different from what was audited/allowlisted.

      This is a fundamental limitation of address+selector allowlisting for proxy targets.
      The trust boundary extends from "I trust this specific function" to "I trust the
      proxy owner to never change what this selector does."
    confidence: 60
    severity: Medium
    status: unverified
    attack_scenario: |
      1. Admin allowlists ProxyContract at address 0xABC with selector processPayment(bytes)
      2. ProxyContract owner upgrades implementation
      3. New implementation's processPayment(bytes) has different logic:
         e.g., sends funds to a different address, or the function body now does token transfers
      4. Forwarder legitimately calls onReport, which calls the now-malicious processPayment
      5. WorkflowRouter's allowlist check passes — address and selector haven't changed
      6. Different code executes than what the admin intended to allow
    code_location:
      file: src/WorkflowRouter.sol
      lines: "110-117"
      relevant_code: |
        // Check is on (target address, selector) — not on implementation code
        if (!s_workflowInfos[workflowId].allowlistedSelectors[target].contains(selector)) {
          // ...
        }
        _call(target, data);  // calls whatever code is at target now

  - id: WR-TB-05
    title: "Return data from _call is silently discarded — no post-call validation"
    description: |
      The _call function returns bytes memory returnData, but onReport completely ignores
      the return value:
        _call(target, data);  // return value not captured

      This means:
      1. If the target function returns a success/failure boolean (like ERC20 transfer),
         a false return is silently swallowed — the call "succeeds" but the operation didn't.
      2. No post-condition can be checked on the return data.
      3. A target that returns important state information (e.g., amount actually processed)
         has no way to communicate back through this path.

      For payment abstraction, this could mean a payment is marked as "executed" at the CRE
      level but actually failed silently at the target contract level (if target returns
      false instead of reverting).
    confidence: 70
    severity: Low
    status: unverified
    attack_scenario: |
      1. WorkflowRouter calls target.processPayment(recipient, amount)
      2. Target function returns false (indicating insufficient funds or other failure)
      3. _call returns the encoded false value, but onReport doesn't check it
      4. CRE workflow considers the report successfully delivered
      5. Payment not actually processed, but no error is surfaced
      6. This is context-dependent: only matters if allowlisted targets return bool success
         patterns instead of reverting on failure
    code_location:
      file: src/WorkflowRouter.sol
      line: "117"
      relevant_code: |
        _call(target, data);  // return value completely ignored

  - id: WR-TB-06
    title: "Metadata comment/code mismatch: comment says offset 32, code reads offset 0"
    description: |
      The NatDoc comment says:
        "Offset 32, size 32: workflow_id (bytes32)"
      But the code reads:
        bytes32 workflowId = bytes32(metadata[:32]);
      Which takes bytes 0-31, i.e., offset 0, not offset 32.

      If the metadata format truly has workflow_id at offset 32 (i.e., there's a 32-byte
      field before it), then the code is reading the WRONG field as workflowId.

      However, this is likely just a comment error — the comment may be describing offsets
      within a larger structure where the first 32 bytes are already stripped. The code
      is probably correct since it's what's actually tested.

      If the comment is accurate and the code is wrong, the workflowId check is comparing
      against the wrong data, which could allow unauthorized workflows to execute.
    confidence: 25
    severity: Informational
    status: unverified
    attack_scenario: |
      If comment is correct (offset 32 = workflowId):
      1. Forwarder sends metadata where bytes[0:32] = allowlisted_workflowId
         but bytes[32:64] = different_workflowId (the "real" one)
      2. onReport reads bytes[0:32] and validates against allowlist — passes
      3. But the actual workflow that generated this report is different from
         what was allowlisted
      4. Result: workflow authorization bypass

      Most likely: comment is wrong, code is correct. Low confidence.
    code_location:
      file: src/WorkflowRouter.sol
      lines: "90-94"
      relevant_code: |
        // Metadata structure:
        // - Offset 32, size 32: workflow_id (bytes32)  ← says offset 32
        bytes32 workflowId = bytes32(metadata[:32]);    ← reads offset 0

  - id: WR-TB-07
    title: "No data length validation: empty data causes zero-selector lookup"
    description: |
      onReport decodes the report as (address target, bytes data), then extracts the
      selector via assembly:
        selector := mload(add(data, 32))

      If data is empty (0 bytes), mload reads 32 bytes starting at the data pointer + 32.
      Since the length at the data pointer is 0, the next 32 bytes are whatever is in
      memory after the empty bytes array — likely zeros or garbage.

      With empty data, selector would be bytes4(0). The code then checks:
        if selector == bytes4(0) → this is implicitly blocked because
        _applyAllowlistedSelectorsUpdates reverts on bytes4(0) selector additions
        (line 279: if (selector == bytes4(0)) revert InvalidZeroValue())

      So bytes4(0) can never be in the allowlist, and the check on line 110 would fail.
      This means empty data is safely rejected — but only because of the zero-selector
      add prevention, not because of an explicit length check.

      EDGE CASE: if data has 1-3 bytes, the selector extraction reads past the data
      into adjacent memory. The extracted selector would be partially from data and
      partially from adjacent memory. This could theoretically match an allowlisted
      selector, but the subsequent _call with malformed data would likely fail at the
      target contract level (bad calldata).
    confidence: 30
    severity: Low
    status: unverified
    attack_scenario: |
      1. Forwarder sends report = abi.encode(target, bytes("")) (empty data)
      2. Assembly reads memory past the empty bytes array → gets bytes4(0)
      3. bytes4(0) is not in allowlist (can never be added) → reverts
      4. Safe. But reliance on implicit guard rather than explicit check.

      Short data (1-3 bytes):
      1. Forwarder sends report with data = hex"aa" (1 byte)
      2. Assembly reads 32 bytes: 0xaa followed by 31 bytes of adjacent memory
      3. Resulting selector could coincidentally match an allowlisted one
      4. _call(target, 0xaa) sends 1-byte calldata to target — almost certainly
         reverts at the target, but the allowlist check would have passed
    code_location:
      file: src/WorkflowRouter.sol
      lines: "103-108"
      relevant_code: |
        (address target, bytes memory data) = abi.decode(report, (address, bytes));
        bytes4 selector;
        assembly ("memory-safe") {
          selector := mload(add(data, 32))  // reads 32 bytes regardless of data.length
        }

  - id: WR-TB-08
    title: "Reentrancy through target callback: blocked by FORWARDER_ROLE but no explicit guard"
    description: |
      When _call(target, data) executes, control is transferred to the target contract.
      If the target calls back into WorkflowRouter.onReport(), it would need FORWARDER_ROLE,
      which the target contract almost certainly doesn't have.

      However, there is NO reentrancy guard (nonReentrant modifier). The protection is
      purely through the role check. If the target contract somehow HAS FORWARDER_ROLE
      (e.g., admin granted it for some integration reason), reentrancy is possible.

      With reentrancy, the target could:
      1. Execute onReport again with different report data
      2. Trigger additional calls to other allowlisted targets
      3. Create unexpected state in downstream contracts

      The risk is low because granting FORWARDER_ROLE to an allowlisted target would be
      an unusual admin configuration, but it's not prevented by the contract.
    confidence: 20
    severity: Low
    status: unverified
    attack_scenario: |
      1. Admin grants FORWARDER_ROLE to TargetContract (unusual but not prevented)
      2. Admin allowlists TargetContract with processPayment selector
      3. Forwarder calls onReport → _call(TargetContract, processPayment(...))
      4. TargetContract.processPayment() calls back WorkflowRouter.onReport()
         with different report targeting a different (target2, selector2)
      5. Nested call executes before the outer call completes
      6. No state in WorkflowRouter is at risk (no mutable state modified in onReport),
         but downstream contracts may see unexpected call ordering
    code_location:
      file: src/WorkflowRouter.sol
      lines: "86-117"
      relevant_code: |
        function onReport(...) external whenNotPaused onlyRole(Roles.FORWARDER_ROLE) {
          // No nonReentrant modifier
          // ...
          _call(target, data);  // external call — potential reentrancy point
        }

  - id: WR-TB-09
    title: "Selector-only validation: same selector permits arbitrary calldata arguments"
    description: |
      The allowlist validates only the function selector (first 4 bytes of calldata), NOT
      the arguments. This means once a selector is allowlisted, the forwarder can call
      that function with ANY arguments.

      For example, if transfer(address,uint256) is allowlisted on a token target:
      - Forwarder can transfer to ANY address (not just intended recipient)
      - Forwarder can transfer ANY amount (not just the intended amount)

      The trust assumption is that the forwarder (CRE) provides correct arguments as
      determined by the workflow. But if the forwarder is compromised or the CRE workflow
      has a bug, there's no on-chain validation of argument correctness.

      This is a fundamental design choice — validating arguments would require per-function
      logic. But it means the security model is: "we trust the forwarder to provide correct
      arguments for allowlisted functions." The allowlist only prevents calling WRONG
      functions, not calling RIGHT functions with WRONG parameters.
    confidence: 90
    severity: Informational
    status: verified-by-design
    attack_scenario: |
      1. Admin allowlists FeeAggregator with processPayment(address,uint256,bytes) selector
      2. Intended workflow: processPayment(serviceProvider, correctAmount, paymentProof)
      3. Compromised forwarder calls: processPayment(attacker, maxUint, fakeProof)
      4. Allowlist check passes — selector matches
      5. FeeAggregator may or may not have its own argument validation
      6. If FeeAggregator trusts msg.sender (WorkflowRouter) and doesn't validate
         arguments independently, funds are misrouted
    code_location:
      file: src/WorkflowRouter.sol
      lines: "104-117"
      relevant_code: |
        bytes4 selector;
        assembly ("memory-safe") {
          selector := mload(add(data, 32))  // only checks 4 bytes
        }
        if (!s_workflowInfos[workflowId].allowlistedSelectors[target].contains(selector)) {
          // ...
        }
        _call(target, data);  // full data (including arbitrary args) is forwarded

# ═══════════════════════════════════════════════════════════════
# SUMMARY — TRUST BOUNDARY FINDINGS
# ═══════════════════════════════════════════════════════════════
#
# Findings by severity:
#   Medium (2): WR-TB-01 (self-referential allowlist), WR-TB-04 (proxy mutation)
#   Low (3): WR-TB-03 (token target drain), WR-TB-05 (return data discarded),
#            WR-TB-07 (empty data selector), WR-TB-08 (reentrancy via role)
#   Info (3): WR-TB-02 (forwarder blast radius), WR-TB-06 (comment mismatch),
#             WR-TB-09 (selector-only validation)
#
# Highest confidence findings:
#   WR-TB-09 (90%) — by design, selector-only doesn't validate arguments
#   WR-TB-02 (85%) — by design, forwarder trust spans all workflows
#   WR-TB-05 (70%) — return data silently discarded
#
# Key trust assumptions validated:
#   1. FORWARDER_ROLE IS the security boundary — no other check on call content
#   2. Reentrancy IS blocked (by role check, not by explicit guard)
#   3. Allowlist DOES prevent calling non-allowlisted targets/selectors
#   4. DEFAULT_ADMIN_ROLE transfer IS protected by 2-step timelock
#
# Key trust assumptions NOT validated:
#   1. Target implementation stability (proxy risk)
#   2. Argument correctness (only selector checked)
#   3. Return value correctness (discarded)
#   4. Admin won't allowlist dangerous combinations (self-referential, token targets)
#
# ═══════════════════════════════════════════════════════════════
# FALSE POSITIVES VERIFICADOS (2026-03-22)
# ═══════════════════════════════════════════════════════════════
#
# FP-01: "_call() silencia errores del target"
#   DESCARTADO. Caller.sol lineas 30-40 muestran propagacion explicita de reverts.
#   El patron es correcto: if (!success) → revert o assembly revert con return data.
#   NO hay silenciamiento. La pregunta del prompt partia de una asuncion incorrecta.
#
# FP-02: "Reentrancy al WorkflowRouter puede corromper el allowlist"
#   DESCARTADO. onReport() no modifica estado del contrato — solo lee la allowlist
#   y delega la call. La reentrancy no puede corromper nada porque no hay estado
#   mutable que se actualice durante la ejecucion de onReport. El allowlist solo
#   se modifica por DEFAULT_ADMIN_ROLE en funciones separadas.
#
# FP-03: "allowlistedSelectors puede quedar inconsistente tras remove de target"
#   DESCARTADO. _applyAllowlistedTargetsUpdates() limpia PRIMERO todos los selectores
#   del target antes de eliminarlo de allowlistedTargets. La secuencia es correcta.
#   Adicionalmente, applyAllowlistedSelectorsUpdates() requiere que el target este
#   en allowlistedTargets para añadir selectores (verificacion en linea 276).
#
# ═══════════════════════════════════════════════════════════════
# RECOMENDACIONES DE DISEÑO (no bugs, mejoran seguridad)
# ═══════════════════════════════════════════════════════════════
#
# R-01: Añadir validacion explicita require(data.length >= 4, "InvalidCalldata")
#       antes del assembly mload en onReport() — actualmente la proteccion contra
#       selector=0 es implicita (no se puede añadir bytes4(0) a la allowlist).
#
# R-02: Añadir nonReentrant modifier en onReport() como defensa en profundidad,
#       aunque la proteccion actual via FORWARDER_ROLE es suficiente en la practica.
#
# R-03: Corregir el comentario NatDoc sobre el offset del metadata (dice offset 32
#       pero el codigo lee offset 0). El comentario deberia decir "Offset 0, size 32".
#
# R-04: Documentar explicitamente el blast radius del FORWARDER_ROLE comprometido:
#       un solo forwarder tiene acceso al UNION de todos los paths allowlisteados.
#
# R-05: Considerar añadir un check target != address(this) en onReport() para
#       prevenir auto-llamadas al WorkflowRouter como target (WR-TB-01).
#
