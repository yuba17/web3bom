      1. Se setea a true al inicio de bid() antes de cualquier externa call
      2. Se resetea a false al final, después de safeTransferFrom
      3. isValidSignature también lo chequea
      No confundir con: performUpkeep NO tiene protección de reentrancy — pero
      tampoco hace calls externas entre pasos que podrían causar reentrancy,
      excepto en tokens con callbacks (ERC777).
    briefing_update_applied: false

- hunter: WildcardHunter
