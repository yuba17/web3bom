- id: BA-W-03
  tier: 1
  type: property
  title: "Allowance residual si _onAuctionEnd es llamado pero forceApprove(0) falla"
  description: |
    GPV2CompatibleAuction._onAuctionEnd() llama primero a super._onAuctionEnd()
    (que transfiere el balance restante al feeAggregator) y DESPUÉS hace
    forceApprove(relayer, 0). Si el token revierte en safeTransfer (e.g., blacklist),
    el _onAuctionEnd completo falla y s_auctionStarts[asset] NUNCA se borra
    (el delete ocurre en performUpkeep DESPUÉS de _onAuctionEnd).
    Pero más sutil: si el token tiene un hook post-transfer que reentra, la secuencia
    es:
      super._onAuctionEnd → transfer → [reentrada] → forceApprove(0) no se ejecuta
    El s_entered flag solo protege bid(), no performUpkeep(). Un token con hook
    podría resetear s_auctionStarts o manipular estado durante _onAuctionEnd.
  attack_scenario: |
    Token ERC777 con receiver hook:
    1. FeeAggregator tiene un token ERC777 como asset a subastar.
    2. Subasta inicia, forceApprove(relayer, balance) ejecuta.
    3. Subasta expira, performUpkeep llama _onAuctionEnd.
    4. super._onAuctionEnd hace safeTransfer(feeAggregator, balance).
    5. El hook del feeAggregator reentra en performUpkeep o bid() con data manipulada.
    6. s_entered=false, así que bid() puede ejecutarse durante _onAuctionEnd.
    7. El bid() dentro del hook extrae tokens antes de que forceApprove(0) se ejecute.
    8. Después del hook, super._onAuctionEnd retorna, y forceApprove(relayer, 0) se
       ejecuta — pero ya no hay balance. El relayer queda con allowance=0 correctamente,
       pero el bidder dentro del hook extrajo tokens pagando el precio del momento
       (posiblemente más favorable).
  impact: |
    Un bidder malicioso puede conseguir un precio subóptimo para el protocolo al
    ejecutar bid() durante el proceso de cierre de subasta, cuando el precio puede
    estar en su mínimo (endingPriceMultiplier). Pérdida de valor capturado.
    Severity depende del token — tokens estándar no son afectados.
  where: "GPV2CompatibleAuction._onAuctionEnd() L96-104 + BaseAuction.bid() L415-417"
  severity_hypothesis: low
