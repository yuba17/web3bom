# BLOQUE 1: INTERACCIÓN forceApprove ↔ bid() DIRECTO
# ============================================================

- id: BA-W-01
  tier: 1
  type: property
  title: "forceApprove inflado tras bid() directo en GPV2CompatibleAuction"
  description: |
    En GPV2CompatibleAuction._onAuctionStart(), el relayer de CowSwap recibe
    forceApprove(relayer, balanceOf(this)) en el momento de inicio de la subasta.
    Cada bid() directo posterior REDUCE el balance del contrato pero NO reduce la
    aprobación. El relayer queda con allowance > balance_real, y puede transferir
    más tokens de los que el contrato posee en cualquier momento posterior.
    Si bien el relayer es una dirección de confianza (Cowswap), cualquier orden
    válida firmada con sellAmount > balance_actual pasará isValidSignature (que
    chequea balance en el momento) pero podría fallar en el settle si el balance
    cae entre la validación y la ejecución. El invariante a verificar es:
    allowance(auction, relayer, asset) <= balanceOf(auction, asset) en TODO momento
    durante la subasta.
  attack_scenario: |
    1. AUCTION_WORKER inicia subasta para tokenA con balance=1000.
       _onAuctionStart: forceApprove(relayer, 1000).
    2. Bidder legítimo llama bid(tokenA, 600, ""). Balance → 400, allowance sigue 1000.
    3. CowSwap crea una orden con sellAmount=700 (> balance real de 400).
    4. isValidSignature revierte con InsufficientAssetInBalance — la orden falla.
    5. El relayer no puede ejecutar ninguna orden de CowSwap porque el balance ya
       no coincide con la allowance. La vía CowSwap queda bloqueada hasta timeout.
    Variante con ERC20 no-standard: si el token tiene un callback en transferFrom,
    el relayer puede hacer transferFrom en la ventana post-bid antes del reapprove.
  impact: |
    DoS del mecanismo de liquidación CowSwap para el asset afectado durante toda
    la duración de la subasta. Los tokens quedan sin liquidar o se liquidan a precio
    subóptimo vía bid() directo únicamente. Pérdida de MEV/precio para el protocolo.
  where: "GPV2CompatibleAuction._onAuctionStart() L92 + BaseAuction.bid() L444"
  severity_hypothesis: medium
  confidence: 75
  solidity: |
    // ghost: rastrear aprobación inicial dada al relayer por asset
    mapping(address => uint256) internal ghost_cowApprovalAtStart;

    function property_ba_w_01_approval_not_exceeds_balance() public {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            if (auction.getAuctionStart(asset) != 0) {
                // Si hay subasta activa, la aprobación al relayer no debe exceder
                // el balance actual del contrato para ese asset.
                // Nota: el contrato no expone el relayer directamente — usar getter
                uint256 currentBalance = IERC20(asset).balanceOf(address(auction));
                uint256 relayerAllowance = IERC20(asset).allowance(
                    address(auction),
                    auction.getGPV2VaultRelayer()
                );
                // INVARIANTE: relayerAllowance <= currentBalance durante subasta activa
                lte(relayerAllowance, currentBalance, "BA-W-01: allowance > balance post-bid");
            }
        }
    }
  ghost_vars:
    - "mapping(address => uint256) internal ghost_cowApprovalAtStart;"
  validated: false
  priority: high
  notes: |
    El allowance inicial se fija en balanceOf() en el momento del start.
    Los bid() directos NO actualizan el allowance — divergencia garantizada.
    El impacto real depende de si el relayer de CowSwap es trustless o admin-only.
    Si el relayer es trustless (cualquier solver), el impacto sube a HIGH.

# ============================================================
# BLOQUE 2: TIMING ATTACK EN isValidSignature vs. BID DIRECTO
# ============================================================

- id: BA-W-02
  tier: 1
  type: property
  title: "Race condition: isValidSignature valida balance que cambia antes del settle"
  description: |
    isValidSignature() valida que order.sellAmount <= balanceOf(auction, sellToken)
    en el momento de la llamada. Sin embargo, CowSwap separa la verificación de la
    ejecución: isValidSignature puede ser llamada en el bloque N, pero el settlement
    real ocurre en el bloque N+k. Entre ambos bloques, un bid() directo puede reducir
    el balance por debajo de order.sellAmount. El settlement de CowSwap entonces
    fallará con InsufficientAssetInBalance al intentar transferir, causando que el
    solver pierda su gas y la orden quede pendiente sin ejecutar.
    Adicionalmente, isValidSignature usa block.timestamp para calcular elapsedTime
    y el minBuyAmount — un solver que captura la firma en el bloque T puede recibir
    un precio más favorable si el settle se ejecuta T+60s después (precio más bajo
    por más decay).
  attack_scenario: |
    PATH A — DoS de solver:
    1. CowSwap solver valida orden con isValidSignature() en bloque N. OK.
    2. Bidder directo llama bid() en bloque N+1, extrae todo el balance.
    3. Solver intenta settle en bloque N+2: safeTransferFrom del relayer falla
       porque auction.balanceOf == 0. El solver pierde gas. Cycle de DoS.

    PATH B — Precio stale favorable al bidder CowSwap:
    1. Subasta empieza con priceMultiplier=1.10 (10% premium).
    2. Solver valida firma en tiempo T=0 (priceMultiplier=1.10). isValidSignature OK.
    3. Solver demora el settle hasta T+3000s (precio ya decayó a ~1.05).
    4. El settle ejecuta con el buyAmount mínimo de T=0 — paga el precio de T=0
       pero el contrato en el settle solo chequea el allowance, no re-valida precio.
       El solver recibe los tokens pagando el precio más antiguo (más caro).
    Nota: el PATH B depende de si CowSwap re-valida precio en settle.
  impact: |
    PATH A: DoS temporal del mecanismo CowSwap. Pérdida de gas para solvers.
    PATH B: Si el settle no re-valida precio, el protocol recibe menos assetOut
    de lo esperado al precio de ejecución real. Pérdida cuantificable por decay.
  where: "GPV2CompatibleAuction.isValidSignature() L119-176 + BaseAuction.bid() L444"
  severity_hypothesis: medium
  confidence: 60
  solidity: |
    function property_ba_w_02_cowswap_balance_consistency() public {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            uint256 auctionStart = auction.getAuctionStart(asset);
            if (auctionStart != 0) {
                // La aprobación dada al relayer en start debe cubrir las ordenes
                // que isValidSignature acepta en cualquier momento.
                // Invariante: una orden que pasó isValidSignature en timestamp T
                // debe ser ejecutable en el mismo bloque (no hay garantía cross-bloque,
                // pero el contrato no debería emitir firmas válidas para montos
                // superiores al balance actual).
                uint256 currentBalance = IERC20(asset).balanceOf(address(auction));
                // Si el balance es 0, isValidSignature debe revertir.
                // No hay invariante Solidity directo aquí — esto es un property de secuencia:
                // bid(amount_total) → isValidSignature(sellAmount > 0) debe revertir
                if (currentBalance == 0 && auctionStart != 0) {
                    // Si hay subasta pero balance=0, la subasta debería haberse cerrado
                    // por minAuctionSize check. Si sigue activa, es una anomalía.
                    eq(auctionStart, 0, "BA-W-02: subasta activa con balance=0");
                }
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  notes: |
    PATH B requiere análisis del contrato GPv2Settlement — si re-valida ERC1271
    en el momento del settle, el PATH B no aplica. Verificar en CowSwap codebase.
    El PATH A es más sólido y no depende de comportamiento externo.

