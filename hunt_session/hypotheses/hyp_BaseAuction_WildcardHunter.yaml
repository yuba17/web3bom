# ============================================================
# BLOQUE 4: DECAY PRECIO — ROUNDING DIRECTION ATTACK
# ============================================================

- id: BA-W-04
  tier: 2
  type: property
  title: "Precio mínimo garantizable: decay rounding favorece al bidder en tiempo=1"
  description: |
    En _getAssetOutAmount(), la fórmula de decay es:
      priceMultiplier = startingPM - (startingPM - endingPM).mulDiv(elapsedTime, duration)
    mulDiv usa redondeo hacia ABAJO. En elapsedTime=1, el decay calculado es el mínimo
    posible, dando priceMultiplier máximo. El resultado final usa mulDivUp para el
    auctionUsdValue y mulDivUp para la conversión a assetOut.
    El efecto neto: el protocolo paga el precio más alto posible (mulDivUp), pero el
    decay calculado es el más bajo posible (mulDiv hacia abajo). Esto es correcto
    individualmente, pero en combinación con el decay lineal y una duración muy corta,
    puede haber un efecto de "precio plano" donde múltiples timestamps dan el mismo
    priceMultiplier.
    Para auctionDuration=60s y (startingPM-endingPM)=2e16 (2%):
      decay_per_second = 2e16 / 60 = 333333333333333
      A t=1: priceMultiplier = startingPM - 333333333333333 ≈ startingPM
      A t=2: priceMultiplier = startingPM - 666666666666666
    Un bidder puede esperar al último segundo de la subasta para obtener el
    endingPriceMultiplier exacto, pagando el mínimo. No es un bug, sino un riesgo
    de diseño — pero la pregunta es si el protocolo espera que el bidder pague
    un precio justo en cada momento o solo al final.
  attack_scenario: |
    Economically optimal bidding:
    1. Subasta inicia con startingPM=1.1e18, endingPM=0.98e18, duration=3600s.
    2. Bidder espera hasta t=3599 (1 segundo antes del fin).
    3. Precio: PM = 1.1e18 - (0.12e18 * 3599/3600) = 1.1e18 - 0.11996...e18 = ~0.9800..
    4. Bidder paga exactamente el precio mínimo + 1 unidad de rounding.
    5. No es exploit — es comportamiento esperado de Dutch auction.
    PERO: si elapsedTime=0 (mismo bloque que el start), priceMultiplier=startingPM
    exacto. No hay rounding error en t=0. El peligro es t= auctionDuration exacto:
    priceMultiplier = endingPM exactamente — sin rounding.
    El verdadero vector: si decay trunca y acumula error, el precio efectivo al final
    puede ser MENOR que endingPriceMultiplier, violando la garantía del parámetro.
  impact: |
    Si el priceMultiplier efectivo cae por debajo de endingPM, el protocolo acepta
    bids a precio peor del configurado como mínimo. Cuantificación: hasta 1 wei
    por operación — dust level para montos normales, pero potencialmente significativo
    con volúmenes grandes o tokens de alta precisión.
  where: "BaseAuction._getAssetOutAmount() L793-802"
  severity_hypothesis: info
  confidence: 35
  solidity: |
    function property_ba_w_04_price_not_below_floor() public {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            uint256 auctionStart = auction.getAuctionStart(asset);
            if (auctionStart == 0) continue;

            IBaseAuction.AssetParams memory params = auction.getAssetParams(asset);

            // El precio al final de la subasta (elapsedTime = auctionDuration)
            // debe ser >= lo que daría endingPriceMultiplier puro.
            // Calculamos con amount=1e18 para normalizar.
            uint256 amountTest = 10 ** params.decimals; // 1 token
            uint256 priceAtEnd = auction.getAssetOutAmount(asset, amountTest, auctionStart + params.auctionDuration);
            uint256 priceAtEndMinus1 = auction.getAssetOutAmount(asset, amountTest, auctionStart + params.auctionDuration - 1);

            // El precio al final debe ser <= precio 1 segundo antes (decay monotónico)
            lte(priceAtEnd, priceAtEndMinus1, "BA-W-04: precio al final mayor que precio anterior");
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  notes: |
    Este es más un check de correctness del decay que un bug explotable.
    La garantía de endingPriceMultiplier como floor debe mantenerse siempre.
    Útil para validar el math pero severity real es Info.

# ============================================================
# BLOQUE 5: AuctionBidder — PRICE STALE ENTRE APPROVE Y BID
# ============================================================

- id: BA-W-05
  tier: 1
  type: property
  title: "AuctionBidder aprueba precio stale: precio cambia entre forceApprove y bid()"
  description: |
    En AuctionBidder.bid() (sin solution):
      1. Calcula: amount_to_approve = getAssetOutAmount(assetIn, amount, block.timestamp)
      2. forceApprove(auction, amount_to_approve)
      3. auction.bid(assetIn, amount, "")   ← usa block.timestamp del momento de ejecución
    El problema: getAssetOutAmount() y auction.bid() están en el mismo tx, así que
    block.timestamp es idéntico. NO hay stale entre ellos en condiciones normales.
    SIN EMBARGO: getAssetOutAmount() hace min(amount, availableBalance) internamente.
    Si availableBalance < amount en el momento de getAssetOutAmount() pero un
    performUpkeep añade balance entre getAssetOutAmount() y bid() (no posible en mismo
    bloque), o si la lógica de capping es inconsistente con bid():
    - getAssetOutAmount: clampea amount a min(amount, balance) → aprueba X
    - bid(): no clampea, usa amount exacto → puede revertir si amount > balance
    La inconsistencia de clamping: getAssetOutAmount SÍ hace clamping,
    bid() VERIFICA pero no clampea (revierte con BidAmountTooHigh).
    Si el caller de AuctionBidder.bid() pasa un amount > balance actual, el
    forceApprove se hace por un amount clampeado menor, pero bid() revierte por
    BidAmountTooHigh. Los fondos están seguros pero la transacción falla.
    El vector real: getAssetOutAmount retorna 0 cuando auction no está activa
    (auctionStart==0). AuctionBidder.bid() haría forceApprove(auction, 0) y luego
    auction.bid() revertirá con InvalidAuction. Resultado: tx falla pero sin pérdida.
  attack_scenario: |
    Escenario de DoS por race condition externa:
    1. AUCTION_WORKER llama performUpkeep para cerrar la subasta de tokenA.
    2. En el mismo bloque, el AUCTION_BIDDER_ROLE llama AuctionBidder.bid(tokenA, ...).
    3. Si performUpkeep se ejecuta PRIMERO, getAssetOutAmount devuelve 0 porque
       s_auctionStarts[tokenA]=0. forceApprove(auction, 0). bid() revierte.
    4. El bidder pierde gas pero no fondos.
    Vector más interesante: en el modo SIN solution, el bidder aprueba basándose en
    el precio al inicio del bloque. Si el precio de getAssetOutAmount y el precio
    real en bid() divergen (no deberían en mismo bloque), el contrato podría intentar
    transferir más de lo aprobado → SafeERC20 falla.
  impact: |
    En condiciones normales: solo pérdida de gas. En condiciones de MEV/reordering:
    posible DoS. No hay pérdida de fondos ya que SafeERC20 protege.
    La inconsistencia de clamping entre getAssetOutAmount y bid() es la raíz del issue.
  where: "AuctionBidder.bid() L65-92 + BaseAuction.getAssetOutAmount() L749-767"
  severity_hypothesis: low
  confidence: 55
  solidity: |
    // Verifica que la aprobación calculada por getAssetOutAmount es consistente
    // con lo que bid() realmente extrae.
    function property_ba_w_05_approval_covers_bid_cost() public {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            if (auction.getAuctionStart(asset) == 0) continue;

            uint256 balance = IERC20(asset).balanceOf(address(auction));
            if (balance == 0) continue;

            uint256 testAmount = balance / 2;
            // El precio que getAssetOutAmount reporta debe ser >= el precio real en bid
            // (porque bid usa el precio del momento y el decay solo baja con el tiempo)
            uint256 quoted = auction.getAssetOutAmount(asset, testAmount, block.timestamp);
            // No podemos llamar bid() aquí sin ejecutarlo, pero podemos verificar que
            // el quote es no-cero para auctions activas con balance positivo.
            if (auction.getAuctionStart(asset) + auction.getAssetParams(asset).auctionDuration >= block.timestamp) {
                gt(quoted, 0, "BA-W-05: quote=0 para subasta activa con balance");
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: medium
  notes: |
    El vector principal es la inconsistencia de clamping entre getAssetOutAmount
    y bid(). Documentar como defecto de UX si no es explotable económicamente.

# ============================================================
# BLOQUE 6: SUBASTAS CONCURRENTES — ASSETOUT COMPARTIDO
# ============================================================

- id: BA-W-06
  tier: 1
  type: property
  title: "Múltiples subastas concurrentes comparten assetOut: primera bid drena assetOut para todas"
  description: |
    BaseAuction soporta múltiples subastas activas simultáneamente (un asset diferente
    cada una, compartiendo el mismo assetOut). En bid() de la primera subasta:
      IERC20(assetOut).safeTransferFrom(msg.sender, address(this), assetOutAmount1)
    En _onAuctionEnd() de CUALQUIER subasta:
      IERC20(assetOut).safeTransfer(s_assetOutReceiver, balanceOf(assetOut))
    Si la subasta A termina primero, _onAuctionEnd transfiere TODO el balance de
    assetOut al receiver — incluyendo los assetOut acumulados de bids en la subasta B
    que aún está activa. Cuando la subasta B termine, _onAuctionEnd intentará
    transferir balance=0 al receiver. Los fondos del protocolo por la subasta B
    fueron transferidos prematuramente al cerrar la subasta A.
    Esto NO es pérdida de fondos (el receiver los recibe igual), pero subvierte el
    tracking de "cuánto assetOut vino de cada subasta", y podría causar issues si
    el receiver tiene lógica condicional basada en recibir los fondos en el momento
    correcto.
  attack_scenario: |
    Escenario de timing cross-auction:
    1. Subastas activas: tokenA (duration=1h), tokenB (duration=2h).
    2. Bidder paga 100 LINK por tokenA (subasta A). Auction tiene 100 LINK.
    3. Bidder paga 200 LINK por tokenB (subasta B). Auction tiene 300 LINK.
    4. Subasta A termina (1h). _onAuctionEnd(tokenA): transfiere 300 LINK al receiver.
    5. Subasta B termina (2h). _onAuctionEnd(tokenB): transfiere 0 LINK al receiver.
    Los 200 LINK de la subasta B fueron enviados prematuramente al cierre de A.
    Si el receiver espera recibir fondos al cierre de B para trigger alguna acción,
    esa acción no se triggerea (o se triggerea con un monto incorrecto).
  impact: |
    No hay pérdida de fondos directa — el receiver recibe todo eventualmente.
    El impacto real es en la semántica del evento AuctionEnded y cualquier lógica
    downstream que dependa de recibir exactamente los fondos de UNA subasta al cierre.
    Si el receiver es un contrato que hace accounting por subasta, puede corromperse.
  where: "BaseAuction._onAuctionEnd() L383-397 + BaseAuction.bid() L453"
  severity_hypothesis: medium
  confidence: 70
  solidity: |
    // ghost: tracking de cuánto assetOut debe recibir el receiver por subasta
    mapping(address => uint256) internal ghost_assetOutAccruedPerAuction;
    uint256 internal ghost_totalAssetOutAccrued;

    function property_ba_w_06_assetout_conservation() public {
        // El balance de assetOut en el contrato debe ser >= suma de lo acruado
        // en subastas activas (aún no cerradas).
        uint256 activeAuctionsAccrued = 0;
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            if (auction.getAuctionStart(assets[i]) != 0) {
                activeAuctionsAccrued += ghost_assetOutAccruedPerAuction[assets[i]];
            }
        }
        address assetOut = auction.getAssetOut();
        uint256 currentAssetOutBalance = IERC20(assetOut).balanceOf(address(auction));
        // Si hay subastas activas, el balance de assetOut debe cubrir lo acruado.
        // Si este invariante se rompe, hubo una transferencia prematura.
        gte(currentAssetOutBalance, activeAuctionsAccrued,
            "BA-W-06: assetOut balance < accrued para subastas activas");
    }
  ghost_vars:
    - "mapping(address => uint256) internal ghost_assetOutAccruedPerAuction;"
    - "uint256 internal ghost_totalAssetOutAccrued;"
  validated: false
  priority: high
  notes: |
    Este es el bug de interacción más claro del sistema. Requiere al menos 2 subastas
    activas simultáneamente para manifestarse. checkUpkeep puede devolver múltiples
    eligibleAssets en la misma llamada a performUpkeep, iniciando varias subastas.
    El handler para el fuzzer debe crear al menos 2 subastas concurrentes y verificar
    el invariante al cierre de la primera.

# ============================================================
# BLOQUE 7: ISVALIDSIGNATURE — ORDER EXPIRED PERO SUBASTA ACTIVA
# ============================================================

- id: BA-W-07
  tier: 2
  type: property
  title: "isValidSignature acepta ordenes con validTo > auctionEnd — CowSwap puede settle post-expiry"
  description: |
    isValidSignature() verifica:
      - order.validTo >= block.timestamp (la orden no ha expirado)
      - elapsedTime <= auctionDuration (la subasta sigue activa)
    Pero NO verifica que order.validTo <= auctionStart + auctionDuration.
    Esto significa que una orden puede tener validTo=type(uint32).max, siendo
    "válida" según ERC1271 durante toda la subasta.
    Sin embargo, una vez que la subasta expira y performUpkeep la cierra
    (_onAuctionEnd → forceApprove(0)), el relayer ya no tiene allowance.
    El bid() ya revertirá post-expiración.
    El edge case real: si performUpkeep no se llama inmediatamente al expirar
    (e.g., keeper down, gas strike), hay una ventana donde:
      - La subasta ha "expirado" conceptualmente (timestamp > start + duration)
      - bid() revertiría con InvalidAuction
      - PERO el relayer de CowSwap aún tiene allowance del balance original
      - isValidSignature() revertiría con InvalidAuction (línea 150-152) ✓
    Esto está PROTEGIDO. La validación en isValidSignature() cubre este caso.
    El vector es cuando el keeper SÍ cierra la subasta pero hay una orden de CowSwap
    en-flight (signed pre-closure, settling post-closure). El forceApprove(0) en
    _onAuctionEnd elimina el allowance antes de que el settle llegue.
    PERO si el settlement llega ANTES que performUpkeep:
      - block.timestamp > start + duration
      - isValidSignature: elapsedTime > auctionDuration → revert InvalidAuction ✓
    El sistema está correctamente protegido aquí.
  attack_scenario: |
    Este invariante es "expected to hold" — documenta que el sistema ES correcto
    en este aspecto. Útil para el fuzzer para confirmar que no hay bypass.
    No hay attack scenario creíble para este vector.
  impact: N/A — el sistema está correctamente protegido.
  where: "GPV2CompatibleAuction.isValidSignature() L148-152"
  severity_hypothesis: info
  confidence: 90
  solidity: |
    function property_ba_w_07_expired_auction_rejects_cowswap() public {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            uint256 auctionStart = auction.getAuctionStart(asset);
            if (auctionStart == 0) continue;

            IBaseAuction.AssetParams memory params = auction.getAssetParams(asset);
            // Si el timestamp ha superado auctionDuration, el relayer no debe tener allowance
            if (block.timestamp > auctionStart + params.auctionDuration) {
                // El allowance del relayer debería ser 0 si performUpkeep se ejecutó.
                // Si aún tiene allowance, el keeper no ha cerrado la subasta.
                // No es un bug del contrato — es un bug operacional (keeper down).
                // El invariante documenta que cuando performUpkeep se ejecuta, el allowance se revoca.
                // Verificamos: si auctionStart != 0 pero expiró → debe haber sido cerrada
                // (auctionStart borrado). Si aún aparece, hay delay en el keeper.
                t(true, "BA-W-07: placeholder para análisis operacional");
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  notes: |
    Este invariante confirma que el diseño es correcto — no un bug. Útil para
    documentar el análisis pero no esperar un finding aquí.

# ============================================================
# BLOQUE 8: WORKFLOWROUTER — BYPASS DE VALIDACIÓN VÍA SELECTOR VULN
# ============================================================

- id: BA-W-08
  tier: 1
  type: property
  title: "WorkflowRouter: selector de 4 bytes puede colisionar — función no autorizada ejecutable"
  description: |
    En WorkflowRouter.onReport(), el selector se extrae de los primeros 4 bytes de data:
      assembly { selector := mload(add(data, 32)) }
    La validación es:
      s_workflowInfos[workflowId].allowlistedSelectors[target].contains(selector)
    Un selector de 4 bytes tiene 2^32 ≈ 4B posibilidades. Si una función NO autorizada
    tiene un selector que colisiona con una función autorizada, el router la llamará.
    La colisión de 4 bytes es conocida en Solidity (proxy collisions) pero en este
    contexto el target es un contrato específico (e.g., el auction), y el selector
    que se permite es explícitamente allowlisteado por el admin.
    El vector: si el admin allowlistea transmit() (0x00....) en PriceManager como
    selector permitido para un workflowId, pero existe otra función en el auction
    con el mismo selector, el WorkflowRouter llamaría esa función alternativa.
    La probabilidad de colisión accidental es 1/2^32. Muy baja.
    Pero si el atacante puede influir en qué funciones se despliegan en contratos
    actualizables, puede crear colisiones deliberadas.
  attack_scenario: |
    1. Admin allowlistea selector(transmit(bytes[])) para workflowId=X, target=auction.
    2. Atacante encuentra que auction tiene función func_0x12345678() con el mismo
       selector (colisión deliberada o accidental en proxy upgrade).
    3. WorkflowRouter.onReport() con workflowId=X llama a func_0x12345678() en lugar
       de transmit().
    4. func_0x12345678() puede ser cualquier función pública del auction — e.g.,
       bid() con datos craftados, o applyAssetParamsUpdates() con params maliciosos.
    Nota: el contrato actual no es upgradeable — esto solo aplica si se introduce
    un proxy en el futuro, o si dos funciones distintas colisionan por azar.
  impact: |
    Potencialmente crítico en contexto de upgradeable proxies. En el sistema actual
    (no upgradeable), la probabilidad es negligible. Documentar como architectural risk.
  where: "WorkflowRouter.onReport() L106-117"
  severity_hypothesis: info
  confidence: 20
  solidity: |
    // Este invariante no es testeable directamente en Chimera sin colisiones reales.
    // Documentar como architectural concern para el reporte.
    function property_ba_w_08_selector_collision_concern() public {
        // Placeholder — no hay forma de generar colisiones de selector en Solidity.
        t(true, "BA-W-08: architectural concern, no invariante ejecutable");
    }
  ghost_vars: []
  validated: false
  priority: low
  notes: |
    Relevante principalmente en contexto de upgradeable proxies. En el sistema
    actual es un theoretical concern. Mencionarlo en el reporte como architectural
    recommendation.

# ============================================================
# BLOQUE 9: OPTIMIZE — MAXIMIZAR EXTRACCIÓN CON TIMING ÓPTIMO
# ============================================================

- id: BA-W-09
  tier: 3
  type: optimize
  title: "Maximizar profit del bidder por timing óptimo de bid() en Dutch auction"
  description: |
    El precio decae linealmente desde startingPM a endingPM durante auctionDuration.
    El bidder óptimo espera hasta el último momento para obtener el precio mínimo.
    La función de optimización busca el timestamp de bid que maximiza:
      tokens_assetIn_recibidos / tokens_assetOut_pagados
    El máximo teórico es en t=auctionDuration con assetOutAmount = endingPM * fair_price.
    Esta función verifica que no existe ningún timestamp donde el ratio sea mayor
    que el endingPriceMultiplier (i.e., el precio nunca cae por debajo del floor).
  attack_scenario: |
    Si optimize_ba_w_09 devuelve un profit positivo con ratio mejor que endingPM,
    hay un bug en el cálculo del decay o en la fórmula de precio.
  impact: |
    Si el ratio efectivo supera startingPM, el bidder obtiene más tokens de los
    que paga — directamente a expensas del protocolo.
  where: "BaseAuction._getAssetOutAmount() L777-803"
  severity_hypothesis: high
  confidence: 30
  solidity: |
    function optimize_ba_w_09_max_bid_profit() public returns (int256) {
        address[] memory assets = auction.getAllowlistedAssets();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            uint256 auctionStart = auction.getAuctionStart(asset);
            if (auctionStart == 0) continue;

            IBaseAuction.AssetParams memory params = auction.getAssetParams(asset);
            address assetOut = auction.getAssetOut();
            uint256 balance = IERC20(asset).balanceOf(address(auction));
            if (balance == 0) continue;

            // Precio al momento actual vs precio al final
            uint256 priceNow = auction.getAssetOutAmount(asset, balance, block.timestamp);
            uint256 priceEnd = auction.getAssetOutAmount(asset, balance, auctionStart + params.auctionDuration);

            if (priceEnd == 0 || priceNow == 0) continue;

            // Profit = (balance / priceEnd) - (balance / priceNow)
            // Si es positivo y >0, el bidder que espera gana más que el que bid temprano
            // Esto es ESPERADO en Dutch auction. Solo reportar si excede startingPM.
            // Devolvemos la diferencia como proxy del "incentivo a esperar"
            if (priceNow > priceEnd) {
                return int256(priceNow - priceEnd); // mayor = mayor incentivo a delay
            }
        }
        return 0;
    }
  ghost_vars: []
  validated: false
  priority: medium
  notes: |
    En Dutch auction descendente, siempre hay incentivo a esperar. La pregunta es si
    hay un punto donde el precio cae MÁS de lo esperado por un bug de redondeo.
    Si la función devuelve siempre 0, el decay es correcto. Si devuelve positivo
    grande en t=0 (precio ya en el mínimo al inicio), hay un bug.

# ============================================================
# BLOQUE 10: CONCURRENCIA — PERFORMUPKEEP CON LISTA STALE
# ============================================================

- id: BA-W-10
  tier: 1
  type: property
  title: "performUpkeep ejecuta lista stale de checkUpkeep — estado puede haber cambiado"
  description: |
    El patrón AutomationCompatible separa checkUpkeep (offchain, view) de
    performUpkeep (onchain, state-changing). El performData generado por checkUpkeep
    puede ser stale cuando performUpkeep lo ejecuta:
    - checkUpkeep en bloque N: eligibleAssets=[tokenA, tokenB], endedAuctions=[tokenC]
    - En bloque N+1: alguien directamente llama bid(tokenC, ...) y paga todo tokenC
      Ahora tokenC tiene balance 0 — checkUpkeep habría dicho que ya no hay nada que
      cerrar (balanceUsdValue < minAuctionSizeUsd → endedAuctions), pero ya está vacío.
    - performUpkeep en bloque N+2: procesa performData stale que incluye tokenC como
      ended. _onAuctionEnd(tokenC): safeTransfer(feeAggregator, 0) → no pasa nada.
      delete s_auctionStarts[tokenC] → correcto.
    - También: eligibleAssets puede incluir assets que YA tienen una subasta activa
      (iniciada entre checkUpkeep y performUpkeep). performUpkeep revierte con LiveAuction.
    El revert en LiveAuction es la ÚNICA protección — si eligibleAssets stale causa
    revert, el keeper debe re-run checkUpkeep. Esto es un DoS temporal del keeper.
    Peor: si feeAggregator.transferForSwap() TRANSFIERE antes del loop de validación,
    los fondos se mueven al auction antes de verificar que la subasta es válida.
    Los fondos quedan en el auction sin subasta activa si la validación falla después.
  attack_scenario: |
    1. checkUpkeep: eligibleAssets=[tokenA]. feeAggregator tiene 1000 tokenA.
    2. En bloque N+1: ASSET_ADMIN_ROLE llama applyAssetParamsUpdates y REMUEVE tokenA.
    3. performUpkeep en N+2 con performData stale:
       a. transferForSwap([tokenA, 1000]) → 1000 tokenA van al auction.
       b. Loop sobre eligibleAssets: assetDecimals = s_assetParams[tokenA].decimals
          → decimals == 0 → revert AssetParamsNotSet.
    4. La transacción revierte. Los 1000 tokenA ya están en el auction pero la
       subasta nunca se inició. s_auctionStarts[tokenA] == 0.
    5. Los tokens quedan atrapados en el auction sin subasta activa.
    ¿Recuperables? Solo via emergencyWithdraw() si está disponible.
  impact: |
    Tokens atrapados en el auction sin subasta activa. No hay mecanismo estándar para
    recuperarlos excepto emergencyWithdraw (si el protocolo lo implementa para el admin).
    Cuantificación: todo el balance del feeAggregator para el asset afectado.
  where: "BaseAuction.performUpkeep() L305-369 + L321 (transferForSwap antes del loop)"
  severity_hypothesis: medium
  confidence: 65
  solidity: |
    function property_ba_w_10_no_orphaned_tokens_post_upkeep() public {
        // Después de cualquier performUpkeep, no deben quedar tokens en el auction
        // sin una subasta activa correspondiente (excepto el assetOut que se envía
        // al receiver).
        address[] memory assets = auction.getAllowlistedAssets();
        address assetOut = auction.getAssetOut();
        for (uint256 i = 0; i < assets.length; i++) {
            address asset = assets[i];
            if (asset == assetOut) continue;
            uint256 balance = IERC20(asset).balanceOf(address(auction));
            uint256 auctionStart = auction.getAuctionStart(asset);
            // Si hay balance de un asset no-assetOut pero no hay subasta activa,
            // los tokens están "huérfanos" — solo son válidos durante una subasta.
            // Nota: puede haber balance legítimamente entre bid() y _onAuctionEnd()
            // pero no cuando no hay subasta activa.
            if (auctionStart == 0 && balance > 0) {
                // Excepción: el asset puede haber terminado su subasta y quedar con
                // tokens que se envían al feeAggregator en el próximo _onAuctionEnd.
                // Pero si no hay subasta, esos tokens no deben existir normalmente.
                eq(balance, 0, "BA-W-10: tokens huerfanos sin subasta activa");
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  notes: |
    El bug de transferForSwap-antes-del-loop es el más crítico aquí. Si la lista
    stale causa un revert después de transferForSwap(), los fondos quedan en el
    contrato sin subasta. Verificar si hay un mecanismo de recovery (emergencyWithdraw).
    Este vector requiere que un ASSET_ADMIN_ROLE actúe entre checkUpkeep y performUpkeep,
    o que el keeper use performData muy antigua. La probabilidad en producción es baja
    pero el impacto es alto (tokens bloqueados).

false_positives:
- hunter: WildcardHunter
  id: BA-W-FP-01
  reason: |
    "Reentrancy en bid() via auctionCallback" — El s_entered flag protege correctamente.
    bid() setea s_entered=true, llama auctionCallback() si data != "", y solo setea
    s_entered=false al final. isValidSignature() también chequea s_entered. No hay
    vector de reentrancy válido en el flujo estándar.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
