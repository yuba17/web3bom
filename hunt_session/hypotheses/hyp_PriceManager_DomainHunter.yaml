invariants:
- id: PM-D01
  tier: 1
  type: property
  description: >
    Transmit does NOT check report.expiresAt — an expired Data Streams report (observationsTimestamp
    fresh but expiresAt < block.timestamp) is accepted and stored. The ReportV3 struct has an
    expiresAt field that the contract completely ignores. A PRICE_ADMIN could (accidentally or
    maliciously) submit an expired report that was valid in the past but whose price no longer
    reflects reality. The verifierProxy.verify() may not enforce expiresAt either (it only
    validates DON signatures, not business-layer expiry).
  attack_scenario: >
    1. PRICE_ADMIN obtains a Data Streams report where observationsTimestamp = T (recent enough
       to pass staleness) but expiresAt = T+30s (already expired when submitted at T+60s).
    2. transmit() checks observationsTimestamp >= block.timestamp - stalenessThreshold — PASSES.
    3. expiresAt is never checked — report is accepted.
    4. The stored price is outdated. BaseAuction uses this stale-but-accepted price for bid()
       calculations, allowing a bidder to buy assets at an incorrect price.
  impact: >
    Bidders can exploit a stale price to extract value from auctions. If the real price moved
    significantly since the expired report, bidders buy cheap assets or the protocol overpays
    in assetOut.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // In transmit(), after decoding the verified report:
    // ReportV3 has expiresAt but it is NEVER checked.
    // Invariant: report.expiresAt >= block.timestamp
    // This cannot be directly tested as a property without modifying transmit,
    // but we can verify the stored timestamp vs current time relationship.
    //
    // Ghost tracking: after transmit, check that the stored price timestamp
    // is within a reasonable window AND the report hadn't expired.
    //
    // Since we can't access expiresAt after storage (it's discarded), this
    // is primarily a code review finding.
    //
    // Pseudo-invariant for fork testing:
    // uint32 expiresAt = report.expiresAt;
    // t(expiresAt >= block.timestamp, "PM-D01: expired report accepted");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: >
    Direct code review finding. The expiresAt field exists in ReportV3 struct (line 79) but
    is never referenced in transmit(). The only timestamp check is observationsTimestamp vs
    stalenessThreshold (line 162). This is a clear omission. Confidence is high because it's
    a verifiable code path, but impact depends on whether verifierProxy enforces expiresAt
    (needs verification on-chain).

- id: PM-D02
  tier: 1
  type: property
  description: >
    Transmit allows price regression — a report with an OLDER observationsTimestamp can overwrite
    a NEWER stored price for the same asset. There is no check that
    report.observationsTimestamp > s_dataStreamsPrice[asset].timestamp. As long as the older
    report passes the staleness check, it replaces the current price.
  attack_scenario: >
    1. At T=100, PRICE_ADMIN transmits report with observationsTimestamp=100, price=2000 USD.
    2. At T=105, PRICE_ADMIN transmits report with observationsTimestamp=105, price=2100 USD.
    3. At T=110, PRICE_ADMIN transmits report with observationsTimestamp=100 again (same report
       as step 1, still passes staleness if threshold > 10s). Price reverts to 2000 USD.
    4. A bidder front-runs or coordinates with PRICE_ADMIN to bid() at the lower price,
       receiving more assetIn for less assetOut.
  impact: >
    Price regression enables temporal arbitrage on auctions. The protocol loses value because
    it sells assets at a price that no longer reflects the current market.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track last stored timestamp per asset and verify monotonicity
    // ghost_var: mapping(address => uint32) ghost_lastPriceTimestamp;
    uint32 storedTimestamp = uint32(s_dataStreamsPrice[asset].timestamp);
    if (ghost_lastPriceTimestamp[asset] > 0) {
      gte(uint256(storedTimestamp), uint256(ghost_lastPriceTimestamp[asset]),
        "PM-D02: price timestamp regression detected");
    }
    ghost_lastPriceTimestamp[asset] = storedTimestamp;
  ghost_vars:
  - mapping(address => uint32) internal ghost_lastPriceTimestamp;
  validated: true
  priority: high
  confidence: 85
  notes: >
    Code at line 178-179 unconditionally overwrites s_dataStreamsPrice[asset] without comparing
    to the existing timestamp. This is a standard oracle monotonicity violation. Impact requires
    PRICE_ADMIN complicity or key compromise, which reduces real-world likelihood but the code
    path is clear. Note: PRICE_ADMIN is a trusted role, so this may be "by design" — verify
    trust model.

- id: PM-D03
  tier: 1
  type: property
  description: >
    Fallback data feed in _getAssetPrice does NOT validate answeredInRound >= roundId from
    latestRoundData(). The code calls feedInfo.usdDataFeed.latestRoundData() but only uses
    the `answer` and `updatedAt` return values. The `roundId` and `answeredInRound` are
    discarded. A stale Chainlink round (answeredInRound < roundId) could provide an outdated
    price that passes the timestamp check because updatedAt is recent enough.
  attack_scenario: >
    1. Data Streams price goes stale (beyond stalenessThreshold).
    2. _getAssetPrice falls back to Chainlink data feed.
    3. Chainlink aggregator is in a partial-update state where roundId has advanced but
       answeredInRound is lagging (price from a previous round).
    4. The updatedAt timestamp may still be within the staleness window, so the stale
       answer is accepted as valid.
    5. BaseAuction.bid() uses this incorrect price, causing incorrect assetOut calculations.
  impact: >
    Stale Chainlink fallback price used for auction pricing. Bidders can exploit the difference
    between the stale fallback price and the real market price to extract value.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Cannot directly test without mocking the data feed, but the code path is:
    // (, int256 answer,, uint256 dataFeedUpdatedAt,) = feedInfo.usdDataFeed.latestRoundData();
    // Missing: roundId and answeredInRound validation
    //
    // In a fork test, we could verify:
    // (uint80 roundId, int256 answer,, uint256 updatedAt, uint80 answeredInRound) =
    //   feedInfo.usdDataFeed.latestRoundData();
    // t(answeredInRound >= roundId, "PM-D03: stale Chainlink round");
    //
    // This is primarily a code review finding — the check is missing at line 386.
    t(true, "PM-D03: placeholder - verify answeredInRound check on fork");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: >
    Standard Chainlink integration issue. Line 386 destructures latestRoundData but discards
    roundId and answeredInRound. However, modern Chainlink aggregators (OCR2) may not exhibit
    this issue frequently. Lower confidence because the practical scenario where
    answeredInRound < roundId AND updatedAt is still fresh is rare on modern feeds.

- id: PM-D04
  tier: 1
  type: property
  description: >
    dataStreamsFeedDecimals is admin-provided and never verified against the actual Data Streams
    feed. If ASSET_ADMIN sets an incorrect dataStreamsFeedDecimals (e.g., 8 when the feed
    actually returns 18 decimals), the price will be scaled incorrectly by a factor of 10^10.
    Unlike the Chainlink fallback where decimals() is called on-chain, Data Streams decimals
    are a constructor/admin parameter with no on-chain verification.
  attack_scenario: >
    1. ASSET_ADMIN configures asset X with dataStreamsFeedDecimals = 8.
    2. The actual Data Streams feed for asset X returns prices in 18 decimals.
    3. transmit() scales: usdPrice * 10^(18-8) = usdPrice * 10^10.
    4. The stored price is 10^10 times too high.
    5. In BaseAuction.bid(), the inflated price makes the asset appear much more valuable,
       causing the protocol to demand too much assetOut from bidders (or vice versa if
       decimals are set too high, making assets appear cheap).
  impact: >
    Incorrect price scaling by orders of magnitude. If price is inflated, auctions don't
    execute (no one bids). If deflated, bidders buy assets for almost nothing. Direct fund
    loss in the deflation case.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify decimal consistency: the admin-provided decimals should produce
    // a price in a reasonable range after scaling.
    // We can track the ratio between Data Streams and fallback prices for
    // the same asset — they should be within a reasonable band.
    //
    // If both sources are configured:
    (uint256 streamsPrice,, ) = _getStreamsPrice(asset);
    (uint256 feedPrice,, ) = _getFallbackPrice(asset);
    // They should be within 5% of each other (assuming same underlying)
    // |streamsPrice - feedPrice| / feedPrice < 0.05
    //
    // This is hard to test without both sources active simultaneously.
    // Primary finding is code review: no on-chain decimals verification for Data Streams.
    t(true, "PM-D04: placeholder - verify decimal consistency on fork");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    The fallback path (line 394) calls feedInfo.usdDataFeed.decimals() dynamically, which
    is correct. But the Data Streams path (line 167-168) uses feedInfo.dataStreamsFeedDecimals
    which is set by admin without verification. This asymmetry is a design risk. Impact is
    High if the admin makes an error, but likelihood is Low because it requires admin mistake
    or compromise. Still worth reporting as the fix is trivial (verify against known feed
    metadata if available).

- id: PM-D05
  tier: 2
  type: property
  description: >
    _getAssetPrice returns a non-zero price with isValid=false when both Data Streams and
    fallback are stale. Consumers that check only the price value (not isValid) will use a
    stale price. BaseAuction.checkUpkeep calls _getAssetPrice(asset, false) and uses the price
    for USD value calculations even when isPriceValid is false (line 248-258 in BaseAuction).
  attack_scenario: >
    1. Both Data Streams and Chainlink data feed become stale for asset X.
    2. checkUpkeep() calls _getAssetPrice(asset, false) — returns old price, isValid=false.
    3. checkUpkeep uses this price at line 248: assetBalanceUsdValue = (assetBalance * assetPrice)
       / (10 ** assetParams.decimals). The price is stale but non-zero.
    4. For ended auction detection (line 249-253), a stale price is used to evaluate if
       assetBalanceUsdValue < minAuctionSizeUsd. An outdated price could cause an auction
       to end prematurely (if price dropped) or not end when it should (if price increased).
    5. However, line 251 guards: isPriceValid && assetBalanceUsdValue < minAuctionSizeUsd,
       so stale prices only affect the duration-based end path, not the value-based one.
    6. For eligible assets (line 255), isPriceValid is checked before proceeding, so this
       path is safe. The risk is limited to auction end timing.
  impact: >
    Limited. Auctions may not end when they should based on remaining value, but the
    duration-based end still works. Not a direct fund loss vector.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that _getAssetPrice with withValidation=false still returns
    // meaningful data. Track when isValid is false and price is non-zero.
    (uint256 price, uint256 updatedAt, bool isValid) = _getAssetPrice(asset, false);
    if (!isValid && price > 0) {
      // Flag: stale price being used for calculations
      t(false, "PM-D05: stale non-zero price returned without validation");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: >
    After deeper analysis, BaseAuction.checkUpkeep properly gates eligible asset detection
    behind isPriceValid (line 255). The ended auction check at line 251 also gates the
    value-based end behind isPriceValid. The remaining risk is that the duration-based end
    (line 250) doesn't need price at all. Marking as tier 2 / low priority because the
    actual impact is minimal.

- id: PM-D06
  tier: 1
  type: property
  description: >
    Chainlink data feed minAnswer/maxAnswer circuit breaker bypass. When the Chainlink
    aggregator reaches its minAnswer or maxAnswer boundary (e.g., LUNA crash), it returns
    the boundary value instead of the real price. The contract does not check if the
    returned answer equals the aggregator's minAnswer or maxAnswer, which could mask an
    extreme price event. The price would appear valid (non-zero, non-stale) but be
    completely wrong.
  attack_scenario: >
    1. Asset X's real price drops 99% (e.g., from $100 to $1).
    2. Chainlink aggregator has minAnswer = $10. It returns $10 instead of $1.
    3. Data Streams go stale (DON nodes may also be disrupted during a crash).
    4. _getAssetPrice falls back to Chainlink data feed, gets answer=$10.
    5. Price is non-zero, updatedAt is fresh → isValid = true.
    6. BaseAuction.bid() uses $10 price for an asset worth $1.
    7. Bidder buys the asset at 10x its real value, or the protocol undervalues what
       it should charge in assetOut.
  impact: >
    During extreme market events (the exact time when correct pricing matters most),
    the fallback oracle can return a bounded price that is significantly wrong. This
    directly affects auction settlement pricing in BaseAuction.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Check if the returned answer hits the aggregator's circuit breaker bounds.
    // This requires reading minAnswer/maxAnswer from the aggregator.
    // AggregatorV3Interface doesn't expose these, but AggregatorV2V3Interface does.
    //
    // In a fork test:
    // int192 minAnswer = AggregatorV2V3Interface(address(feedInfo.usdDataFeed)).minAnswer();
    // int192 maxAnswer = AggregatorV2V3Interface(address(feedInfo.usdDataFeed)).maxAnswer();
    // (, int256 answer,,,) = feedInfo.usdDataFeed.latestRoundData();
    // t(answer > minAnswer && answer < maxAnswer,
    //   "PM-D06: price at circuit breaker boundary");
    t(true, "PM-D06: placeholder - verify circuit breaker bounds on fork");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 65
  notes: >
    Classic Chainlink integration issue. Well-documented in Solodit and audit reports.
    The contract uses AggregatorV3Interface which doesn't expose minAnswer/maxAnswer.
    The fix is to use AggregatorV2V3Interface and check bounds. Impact is High during
    extreme events but likelihood is Low because such events are rare. However, when
    they DO happen, this is exactly the scenario where correct pricing matters most.

- id: PM-D07
  tier: 2
  type: property
  description: >
    validFromTimestamp in Data Streams ReportV3 is never checked. A report could be submitted
    before its validity window (block.timestamp < validFromTimestamp). The contract only
    checks observationsTimestamp for staleness but never verifies that the current time
    is within [validFromTimestamp, expiresAt].
  attack_scenario: >
    1. PRICE_ADMIN receives a report with validFromTimestamp = T+60 (valid in the future).
    2. At T, PRICE_ADMIN submits the report. observationsTimestamp passes staleness check.
    3. The price from this "future" report is stored and used immediately.
    4. If market conditions change between T and T+60, the stored price may not reflect
       the actual price at time T.
  impact: >
    A pre-valid report's price is used before its intended validity window. Impact is
    limited because Data Streams reports typically have validFromTimestamp close to
    observationsTimestamp, and the DON consensus price is still a valid observation.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After decoding report in transmit():
    // t(block.timestamp >= report.validFromTimestamp,
    //   "PM-D07: report used before validity window");
    // Cannot test as property without access to report fields post-decode.
    t(true, "PM-D07: placeholder - verify validFromTimestamp on fork");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    Lower confidence because Data Streams validFromTimestamp is typically <= observationsTimestamp
    in practice. The field exists for the full validity window [validFrom, expiresAt] but
    in crypto streams, both are usually very close. This is more of a completeness issue
    than a practical exploit. Combined with PM-D01 (expiresAt not checked), the full
    validity window is completely ignored.

- id: PM-D08
  tier: 1
  type: property
  description: >
    Potential underflow in staleness check when block.timestamp < feedInfo.stalenessThreshold.
    Line 378: uint256 minTimestamp = block.timestamp - feedInfo.stalenessThreshold. If
    stalenessThreshold is set larger than block.timestamp (only possible in tests or very
    early chain life), this underflows. In Solidity 0.8.26 this reverts, causing a DoS
    on _getAssetPrice for all assets. However, in _getAssetPrice context this would make
    ALL price queries revert, blocking all auction operations.
  attack_scenario: >
    1. ASSET_ADMIN sets stalenessThreshold to a very large value (e.g., type(uint32).max = ~136 years).
    2. On a fresh testnet/L2 with low block.timestamp, block.timestamp - stalenessThreshold underflows.
    3. _getAssetPrice reverts for this asset, blocking checkUpkeep, performUpkeep, and bid().
    4. All auctions for this asset are bricked until stalenessThreshold is reduced.
  impact: >
    DoS on price queries and all auction operations for affected assets. No direct fund
    loss but complete operational freeze. Recoverable by ASSET_ADMIN updating the threshold.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify no underflow: block.timestamp >= feedInfo.stalenessThreshold
    FeedInfo memory feedInfo = s_feedInfo[asset];
    t(block.timestamp >= feedInfo.stalenessThreshold,
      "PM-D08: staleness threshold larger than block.timestamp");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    Very unlikely in production (block.timestamp on mainnet/L2s is > 1.7 billion, far
    exceeding any reasonable uint32 stalenessThreshold). Only relevant on fresh test chains.
    Marking validated=false and low confidence. Including for completeness but this is
    borderline false positive territory.

false_positives:
- hunter: DomainHunter
  id: PM-FP-01
  reason: >
    Negative price handling: report.price is int192, and the code does
    int256(report.price).toUint256() using SafeCast. If price is negative, toUint256()
    reverts. This is correct behavior — a negative price SHOULD revert transmit().
    This is NOT a bug, it's proper defensive coding. The Chainlink fallback also uses
    answer.toUint256() which similarly reverts on negative. Both paths handle negative
    prices correctly via revert.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: oracle.md
    content: >
      SafeCast.toUint256(int256) correctly reverts on negative prices — not a bug,
      it's the intended defense. Don't waste time flagging negative price handling
      when SafeCast is used.
    briefing_update_applied: false

- hunter: DomainHunter
  id: PM-FP-02
  reason: >
    PRICE_ADMIN_ROLE trust boundary: Several findings (PM-D01, PM-D02) require PRICE_ADMIN
    complicity. In Chainlink's architecture, PRICE_ADMIN is a Chainlink-operated automation
    node, not an arbitrary external caller. The trust model assumes PRICE_ADMIN submits
    valid, timely reports. However, the code should still defend against edge cases (delayed
    submission, reorgs) even with trusted callers, so the findings remain valid as defensive
    hardening. Not marking the findings as false positives, but noting the trust context.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: oracle.md
    content: >
      In Chainlink PA systems, PRICE_ADMIN is typically an automation node operated by
      Chainlink. Findings requiring PRICE_ADMIN malice are lower severity but findings
      about PRICE_ADMIN operational errors (stale reports, wrong order) are still valid
      as hardening issues.
    briefing_update_applied: false
