# ─── H1: Reentrancy via onPreLiquidate Bypasses preLCF Close Factor ────────
- id: PL-TB-01
  tier: 1
  type: property
  description: >
    The preLiquidate flow calls MORPHO.repay() which triggers the onMorphoRepay callback.
    Inside onMorphoRepay, the contract: (1) withdraws collateral to liquidator, (2) calls
    liquidator.onPreLiquidate() callback, (3) pulls loan tokens from liquidator. Morpho Blue
    has NO reentrancy guard on repay(). The liquidator callback at step 2 can re-enter
    preLiquidate() for the SAME borrower. In the re-entered call, Morpho state is already
    updated (borrowShares reduced from first repay), so the position has a DIFFERENT LTV
    and different borrowShares. The preLCF check (L171-172: repaidShares <= position.borrowShares
    * preLCF) uses the CURRENT (already-reduced) borrowShares. This means each nested call
    can repay up to preLCF of the REMAINING shares, not the ORIGINAL shares. After N nested
    calls, total repaid = S * (1 - (1-preLCF)^N), which approaches 100% for large N even
    when preLCF << 100%. This bypasses the close factor protection entirely.
  attack_scenario: |
    1. Borrower has position with borrowShares = 1000, LTV slightly above PRE_LLTV.
    2. preLCF = 30% (borrower should only lose 300 shares max per pre-liquidation).
    3. Attacker (liquidator) calls preLiquidate(borrower, 0, 300_shares, data).
    4. Inside onMorphoRepay callback:
       a. Collateral withdrawn, sent to attacker.
       b. attacker.onPreLiquidate() fires.
       c. Attacker re-enters preLiquidate(borrower, 0, 210_shares, data).
          - Now borrowShares = 700 (after first repay). preLCF * 700 = 210. Check passes.
          d. Inside nested onMorphoRepay:
             - Collateral withdrawn again.
             - attacker.onPreLiquidate() fires again.
             - Attacker re-enters AGAIN: borrowShares = 490, repay 147 shares... etc.
    5. After ~10 nested calls, borrower has lost ~97% of debt + proportional collateral.
    6. Original preLCF of 30% was meant to limit damage to 30%.
    Net: the close factor is completely circumvented via reentrancy.
    NOTE: Each nested call also recalculates LTV. As debt decreases, LTV decreases.
    At some depth, LTV drops below PRE_LLTV and the require on L150 fails, stopping
    the recursion. But collateral is also being seized, keeping LTV somewhat stable.
    The exact depth depends on preLIF vs preLCF interaction.
  impact: "Close factor bypass — borrower loses significantly more collateral than preLCF allows in a single transaction"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track cumulative repaidShares across all preLiquidate calls for same borrower
    // Compare against what a SINGLE call would have allowed
    uint256 originalBorrowShares = ghost_originalBorrowShares[borrower];
    uint256 totalRepaid = ghost_cumulativeRepaidShares[borrower];
    // preLCF is at most PRE_LCF_2 (when LTV is near LLTV)
    uint256 maxSingleCallRepay = uint256(originalBorrowShares).wMulDown(PRE_LCF_2);
    lte(totalRepaid, maxSingleCallRepay,
        "PL-TB-01: cumulative repaid shares exceed single-call preLCF limit");
  ghost_vars:
  - mapping(address => uint256) internal ghost_originalBorrowShares;
  - mapping(address => uint256) internal ghost_cumulativeRepaidShares;
  validated: false
  priority: high
  confidence: 70
  notes: >
    This is the highest-priority hypothesis. Morpho Blue explicitly allows reentrancy
    in its callback pattern (it's a feature for flash-loan-style liquidations). But
    PreLiquidation's close factor check is designed to LIMIT per-operation damage.
    The reentrancy doesn't violate Morpho's invariants (debt accounting is correct),
    but it violates PreLiquidation's intended close factor guarantee. Key question:
    does the position exit the pre-liquidatable range fast enough (LTV drops below
    PRE_LLTV) to limit the damage? Need to model the math: as borrowShares decrease
    AND collateral decreases, does LTV stay in range or drop out?

# ─── H2: Oracle Divergence Enables Excess Collateral Seizure ───────────────
- id: PL-TB-02
  tier: 1
  type: property
  description: >
    PreLiquidation uses PRE_LIQUIDATION_ORACLE for LTV assessment and seized collateral
    computation (L143-144, L157, L164). Morpho uses ORACLE (the market oracle) for its
    health check in withdrawCollateral (L337 in Morpho.sol: _isHealthy calls
    IOracle(marketParams.oracle).price()). If PRE_LIQUIDATION_ORACLE returns a LOWER price
    than ORACLE, the effective liquidation incentive factor is amplified beyond preLIF:
    - PreLiquidation computes seizedAssets using low PRE_LIQUIDATION_ORACLE price → MORE
      collateral tokens seized for same debt.
    - Morpho validates health using high ORACLE price → position appears healthier,
      withdrawCollateral passes.
    The borrower loses more collateral than the nominal preLIF warrants at real market price.
  attack_scenario: |
    Setup: ORACLE = Chainlink ($100/token), PRE_LIQUIDATION_ORACLE = TWAP ($80/token).
    Position: 20 collateral tokens, 1500 USDC debt. LLTV = 80%, PRE_LLTV = 70%.

    With PRE_LIQUIDATION_ORACLE ($80):
      collateralQuoted = 20 * 80 = $1600
      LTV = 1500/1600 = 93.75% → BUT this exceeds LLTV (80%), so LiquidatablePosition reverts.

    Actually, the check on L148 ensures borrowed <= collateralQuoted.wMulDown(LLTV).
    With PRE_LIQUIDATION_ORACLE: collateralQuoted*LLTV = 1600*0.8 = 1280 < 1500 → REVERTS.

    Better scenario: PRE_LIQUIDATION_ORACLE slightly lower.
    ORACLE = $100, PRE_LIQUIDATION_ORACLE = $95.
    collateralQuoted_pre = 20 * 95 = $1900. LTV_pre = 1500/1900 = 78.9%.
    Check: 1500 <= 1900*0.8 = 1520 ✓. And 1500 > 1900*0.7 = 1330 ✓. Pre-liquidatable.

    LTV = 1500/1900 = 0.7895. quotient = (0.7895-0.7)/(0.8-0.7) = 0.895.
    preLIF = 0.895*(LIF2-LIF1) + LIF1. Say LIF1=1.0, LIF2=1.15.
    preLIF = 0.895*0.15 + 1.0 = 1.134.

    If liquidator specifies repaidShares (say 100 USDC worth):
    seizedAssets = 100 * 1.134 * SCALE / $95 = 1.194 tokens.
    At REAL price ($100): 1.194 tokens = $119.4.
    Effective LIF = 119.4/100 = 1.194 (vs nominal 1.134).

    The 5% oracle divergence creates a ~5.3% excess collateral seizure.
    With Morpho's health check using $100: position remains healthy → withdrawal passes.
  impact: "Borrower loses ~5% excess collateral per percentage point of oracle divergence, amplified by preLIF"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 preLiqPrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
    uint256 morphoPrice = IOracle(ORACLE).price();
    // Effective LIF at real prices vs nominal LIF
    if (ghost_lastSeizedAssets > 0 && ghost_lastRepaidAssets > 0) {
        uint256 seizedValueReal = ghost_lastSeizedAssets.mulDivDown(morphoPrice, ORACLE_PRICE_SCALE);
        uint256 effectiveLIF = seizedValueReal.wDivUp(ghost_lastRepaidAssets);
        // effectiveLIF should not exceed PRE_LIF_2 by more than 5% (oracle tolerance)
        lte(effectiveLIF, PRE_LIF_2 + PRE_LIF_2 / 20,
            "PL-TB-02: effective LIF exceeds PRE_LIF_2 by >5% due to oracle divergence");
    }
  ghost_vars:
  - uint256 internal ghost_lastSeizedAssets;
  - uint256 internal ghost_lastRepaidAssets;
  validated: false
  priority: high
  confidence: 72
  notes: >
    The dual-oracle design is intentional (documented). The trust assumption is that
    PRE_LIQUIDATION_ORACLE and ORACLE don't diverge significantly. No on-chain validation
    exists. The severity depends on what oracles are actually used. If PRE_LIQUIDATION_ORACLE
    is a manipulable TWAP, this becomes a real attack vector. Key: anyone can deploy a
    PreLiquidation with ANY oracle, but borrowers must explicitly authorize each one. The
    risk is borrowers authorizing contracts with weak oracles without understanding the risk.

# ─── H3: Authorization Revocation Griefing ─────────────────────────────────
- id: PL-TB-03
  tier: 1
  type: property
  description: >
    PreLiquidation calls MORPHO.withdrawCollateral(borrower, liquidator) inside onMorphoRepay.
    This requires the borrower to have authorized PreLiquidation on Morpho via
    setAuthorization(preLiquidationAddr, true). The borrower can front-run any preLiquidate
    tx by calling setAuthorization(preLiquidationAddr, false), causing withdrawCollateral to
    revert with UNAUTHORIZED. The entire preLiquidate tx reverts. The borrower can
    repeatedly block pre-liquidations until their position reaches LLTV and gets normally
    liquidated by Morpho (where no authorization is needed). This defeats the purpose of
    PreLiquidation — the borrower can choose to skip the "gentler" pre-liquidation and
    go directly to harsh full liquidation or accumulate bad debt.
  attack_scenario: |
    1. Borrower has authorized PreLiquidation on Morpho. Position LTV > PRE_LLTV.
    2. Liquidator submits preLiquidate(borrower, ...) to mempool.
    3. Borrower sees tx in mempool, submits setAuthorization(preLiquidation, false)
       with higher gas price → executes first.
    4. preLiquidate reverts at withdrawCollateral (UNAUTHORIZED).
    5. Borrower re-authorizes (optional — they can wait).
    6. Position deteriorates. Borrower can repeat this griefing indefinitely.
    7. Eventually position reaches LLTV → Morpho liquidation (no authorization needed).
    Result: borrower avoided pre-liquidation penalty and any position management.
    The market's lenders bear the risk of the position deteriorating without the buffer
    that PreLiquidation was designed to provide.
  impact: "Borrowers can indefinitely block pre-liquidation, defeating the protocol's purpose. Market lenders bear increased risk."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // This is a design-level issue — hard to express as a Chimera invariant
    // Test: if borrower is pre-liquidatable AND authorized, preLiquidate MUST succeed
    bool isAuthorized = MORPHO.isAuthorized(borrower, address(preLiquidation));
    if (isAuthorized && ghost_isPreLiquidatable[borrower]) {
        // preLiquidate should NOT revert with UNAUTHORIZED
        t(true, "PL-TB-03: authorization griefing check placeholder");
    }
  ghost_vars:
  - mapping(address => bool) internal ghost_isPreLiquidatable;
  validated: false
  priority: medium
  confidence: 82
  notes: >
    This is a known design limitation of the authorization model. The borrower explicitly
    opts into pre-liquidation by authorizing the contract. The question is whether this
    is documented as a risk. If the protocol presents PreLiquidation as a reliable safety
    mechanism for lenders, the borrower griefing vector undermines that promise. However,
    if PreLiquidation is framed as a "borrower-friendly option" (borrower chooses to enable
    it for their own benefit of gentler liquidation), then revocation is by-design.
    Check documentation/README for framing before reporting.

# ─── H4: No Upper Bound on PRE_LCF_2 in Constructor ───────────────────────
- id: PL-TB-04
  tier: 1
  type: property
  description: >
    The constructor validates: preLCF1 <= preLCF2 (L88) and preLCF1 <= WAD (L89).
    But there is NO upper bound check on preLCF2. The comment on L167-168 confirms this
    is intentional: "the pre-liquidation close factor can be greater than WAD (100%)."
    When preLCF2 > WAD, a position near LLTV can be 100% pre-liquidated in a single call.
    Combined with H1 (reentrancy), even moderate preLCF values can be bypassed. But with
    preLCF2 > WAD, a single call already allows full liquidation — no reentrancy needed.
    The trust boundary: anyone can deploy a PreLiquidation via the factory with preLCF2
    set to type(uint256).max. Borrowers who authorize it without checking parameters
    risk losing their entire position in one pre-liquidation.
  attack_scenario: |
    1. Attacker deploys PreLiquidation via factory with:
       preLCF1 = 1e18 (100%), preLCF2 = type(uint256).max, preLIF1 = 1e18, preLIF2 = 1/LLTV.
    2. Social-engineers borrower into authorizing this contract (e.g., via fake frontend).
    3. When borrower's LTV barely exceeds PRE_LLTV:
       - preLCF = quotient * (type(uint256).max - 1e18) + 1e18 → huge number
       - repayableShares = borrowShares * preLCF / WAD → overflows or equals all shares
       - Attacker can repay ALL borrow shares and seize corresponding collateral
       - With preLIF at max (1/LLTV), maximum collateral is seized per unit of debt
    4. Borrower loses entire position in one transaction at the earliest moment.
    This is partially by-design (factory doesn't restrict who creates what parameters),
    but the lack of preLCF2 upper bound is the enabling factor.
  impact: "Borrower can lose entire position if they authorize a PreLiquidation with extreme preLCF2"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that preLCF2 is bounded to a reasonable value
    // A preLCF2 > 1e18 (100%) means full position can be pre-liquidated at LLTV
    // This is documented as by-design, but worth flagging
    if (PRE_LCF_2 > WAD) {
        // This is allowed by the protocol — document but don't fail
        t(true, "PL-TB-04: preLCF2 > 100% — full pre-liquidation possible near LLTV");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    The comment in the code (L167-168) explicitly says preLCF > WAD is allowed. This is
    by-design. The real trust issue is: borrowers may not understand that authorizing a
    PreLiquidation contract means their entire position can potentially be pre-liquidated
    in one shot. But this is a parameter choice made at deployment, not a code bug.
    Downgrade to informational unless combined with H1 (reentrancy bypass).

# ─── H5: Factory CREATE2 Salt Collision Prevents Replacement ───────────────
- id: PL-TB-05
  tier: 2
  type: property
  description: >
    PreLiquidationFactory uses CREATE2 with salt: 0 (L48 in Factory). The deployed address
    is deterministic based on (factory_address, salt=0, init_code_hash). Since init_code
    includes constructor args (morpho, id, preLiquidationParams), different parameters
    produce different addresses. But the SAME parameters always produce the SAME address.
    This means: if a PreLiquidation contract is deployed and then the token at its address
    gets blocklisted (USDC blocklist), no one can deploy a replacement with identical
    parameters — CREATE2 would try to deploy to the same (blocklisted) address and revert.
    The borrower must authorize a PreLiquidation with DIFFERENT parameters to get a new
    address. This is a minor inconvenience, not a critical issue, but breaks the assumption
    that PreLiquidation is always available for a given market.
  attack_scenario: |
    1. PreLiquidation deployed at address X for market M with params P.
    2. Address X gets USDC-blocklisted (USDC is the loan token).
    3. All preLiquidate calls revert because USDC transfers to/from X fail.
    4. Admin tries to deploy new PreLiquidation with same params → CREATE2 produces
       same address X → deployment reverts (code already exists at X).
    5. Must deploy with slightly different params (e.g., preLltv + 1 wei) to get
       a new address. Borrowers must re-authorize the new address.
    6. Minor: the factory maps isPreLiquidation[X] = true for the old (broken) one.
       Anyone checking isPreLiquidation to validate contracts sees the broken one as "valid".
  impact: "Inability to replace a blocklisted PreLiquidation contract with identical parameters; existing isPreLiquidation mapping becomes misleading"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that the PreLiquidation address has no token restrictions
    // This is a deployment-time check, not a runtime invariant
    uint256 balance = ERC20(LOAN_TOKEN).balanceOf(address(preLiquidation));
    // If we can query balance without revert, the address is not fully blocked
    // (but transfers might still fail)
    gte(balance, 0, "PL-TB-05: loan token balance query failed — possible blocklist");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    This is a theoretical edge case. USDC blocklisting a smart contract requires Circle's
    active intervention. The likelihood is very low. The impact is mitigated by deploying
    with slightly different parameters. Tier 2 — worth mentioning in an audit report as
    informational but not a real vulnerability.

# ─── H6: Callback to Untrusted Liquidator Before Payment ──────────────────
- id: PL-TB-06
  tier: 2
  type: property
  description: >
    In onMorphoRepay (L212-218), collateral is sent to the liquidator BEFORE the liquidator
    pays. The liquidator then gets a callback (onPreLiquidate) with full code execution
    rights. This is the standard Morpho "optimistic transfer" pattern. The liquidator
    can use the callback to manipulate external state (oracle prices, DEX pools) before
    subsequent pre-liquidations of OTHER borrowers in the same transaction. This is
    standard MEV extraction and may not be a "bug" per se, but the trust boundary is
    that the borrower trusts PRE_LIQUIDATION_ORACLE to be manipulation-resistant even
    during the liquidator's callback window.
  attack_scenario: |
    1. Liquidator calls preLiquidate(borrowerA, ..., data).
    2. Receives collateral tokens in onMorphoRepay.
    3. In onPreLiquidate callback: dumps collateral on DEX that feeds PRE_LIQUIDATION_ORACLE.
    4. PRE_LIQUIDATION_ORACLE price drops (if spot/TWAP).
    5. Still in callback: calls preLiquidate(borrowerB, ...) with cheaper oracle price.
    6. BorrowerB loses excess collateral due to manipulated price.
    7. After all nested liquidations: attacker buys back collateral cheaply.
  impact: "Cross-borrower MEV extraction via intra-tx oracle manipulation"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track oracle price at start of tx vs during callback
    uint256 priceNow = IOracle(PRE_LIQUIDATION_ORACLE).price();
    if (ghost_priceAtTxStart > 0) {
        uint256 drift;
        if (priceNow > ghost_priceAtTxStart) {
            drift = (priceNow - ghost_priceAtTxStart) * WAD / ghost_priceAtTxStart;
        } else {
            drift = (ghost_priceAtTxStart - priceNow) * WAD / ghost_priceAtTxStart;
        }
        lte(drift, 5e16, "PL-TB-06: oracle price drifted >5% within tx");
    }
  ghost_vars:
  - uint256 internal ghost_priceAtTxStart;
  validated: false
  priority: medium
  confidence: 50
  notes: >
    This is standard MEV risk, not specific to PreLiquidation. The severity depends
    entirely on PRE_LIQUIDATION_ORACLE type. Chainlink is resistant. TWAP is partially
    resistant. Spot price is trivially manipulable. The protocol doesn't restrict which
    oracle can be used. This is more of a deployment/parameter risk than a code bug.

# ─── H7: No Slippage Protection for Borrower ──────────────────────────────
- id: PL-TB-07
  tier: 1
  type: property
  description: >
    preLiquidate has no slippage parameters. The liquidator specifies EITHER seizedAssets
    OR repaidShares, and the other is computed from the current oracle price and preLIF.
    The BORROWER has no control over how much collateral they lose. If the oracle price
    changes between the liquidator's tx submission and execution:
    - When liquidator specifies repaidShares: seizedAssets = repaid * preLIF * SCALE / price.
      If price DECREASES, seizedAssets INCREASES → borrower loses more collateral.
    - When liquidator specifies seizedAssets: repaidShares = seizedQuoted / preLIF (shares).
      If price INCREASES, seizedAssetsQuoted INCREASES → repaidShares INCREASES → more
      debt is repaid but at a worse rate for the borrower.
    The Solodit finding M-6 (USG-Tangent) documents this exact pattern: "No slippage check
    for liquidators when they burn USG from their account without swapping first."
    In PreLiquidation, the BORROWER is the one unprotected — not the liquidator.
  attack_scenario: |
    1. Borrower position is pre-liquidatable with LTV just above PRE_LLTV.
    2. Liquidator submits preLiquidate(borrower, 0, repaidShares=100, "").
    3. MEV bot sandwiches: pushes PRE_LIQUIDATION_ORACLE price down 10%.
    4. seizedAssets = 100 * preLIF * SCALE / (0.9 * originalPrice)
                    = original_seized / 0.9 = 11.1% more collateral seized.
    5. Borrower loses 11.1% more collateral than expected.
    6. MEV bot profits by arbitraging the price back.
    Note: this requires PRE_LIQUIDATION_ORACLE to be manipulable in the same block.
    If it's Chainlink, this is not feasible. If it's a TWAP or spot DEX price, it is.
  impact: "Borrower loses excess collateral proportional to oracle price manipulation magnitude"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After pre-liquidation, verify that the effective price paid for collateral
    // is within reasonable bounds of the oracle price
    if (ghost_lastRepaidAssets > 0 && ghost_lastSeizedAssets > 0) {
        uint256 effectivePrice = ghost_lastRepaidAssets.mulDivUp(ORACLE_PRICE_SCALE, ghost_lastSeizedAssets);
        uint256 oraclePrice = IOracle(PRE_LIQUIDATION_ORACLE).price();
        // The effective price should be within preLIF of the oracle price
        // effectivePrice = oraclePrice / preLIF (approximately)
        uint256 minEffectivePrice = oraclePrice.wDivDown(PRE_LIF_2);
        gte(effectivePrice, minEffectivePrice,
            "PL-TB-07: effective price below minimum — possible oracle manipulation");
    }
  ghost_vars:
  - uint256 internal ghost_lastRepaidAssets;
  - uint256 internal ghost_lastSeizedAssets;
  validated: false
  priority: medium
  confidence: 55
  notes: >
    This matches the Solodit M-6 pattern. However, the Morpho ecosystem generally
    doesn't provide slippage protection in its liquidation functions (Morpho.liquidate
    also has none). The liquidator is expected to use atomic transactions or wrapper
    contracts. The borrower has no protection by design. Whether this is reportable
    depends on whether the bounty considers this a known limitation or a new finding.

# ─── H8: Fee-on-Transfer Breaks Pre-Liquidation ───────────────────────────
- id: PL-TB-08
  tier: 2
  type: property
  description: >
    If LOAN_TOKEN is a fee-on-transfer token, the flow breaks: In onMorphoRepay,
    safeTransferFrom(liquidator, PreLiquidation, repaidAssets) delivers less than
    repaidAssets to PreLiquidation. Then Morpho calls safeTransferFrom(PreLiquidation,
    Morpho, repaidAssets) for the exact amount — this reverts because PreLiquidation
    doesn't have enough tokens. Pre-liquidation is permanently broken for FOT tokens.
    Morpho Blue documents that FOT tokens are not supported, but PreLiquidation adds
    an extra intermediary step (tokens go liquidator → PreLiquidation → Morpho instead
    of liquidator → Morpho directly), making the FOT incompatibility worse.
  attack_scenario: >
    Market uses FOT loan token. Any preLiquidate call reverts because the intermediary
    transfer leaves insufficient tokens. Borrowers can only be liquidated via regular
    Morpho liquidation (which has the same FOT issue). Not a new attack vector — inherits
    Morpho's limitation. But PreLiquidation's two-hop transfer makes it doubly broken
    (two fee deductions instead of one).
  impact: "Pre-liquidation permanently broken for fee-on-transfer tokens (inherits Morpho's documented limitation)"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After preLiquidate, PreLiquidation should have zero loan token balance
    uint256 residual = ERC20(LOAN_TOKEN).balanceOf(address(preLiquidation));
    eq(residual, 0, "PL-TB-08: residual loan tokens in PreLiquidation");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    Morpho explicitly does not support FOT tokens. This is a known limitation.
    Not reportable unless the bounty scope specifically includes FOT token compatibility.

