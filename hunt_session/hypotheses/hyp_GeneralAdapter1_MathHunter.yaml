  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: >
    Esto es by-design. El contrato provee el mecanismo de slippage protection;
    es responsabilidad del integrador/frontend configurar valores razonables.
    Marcado como tier 1 solo para verificar que el invariante se mantiene —
