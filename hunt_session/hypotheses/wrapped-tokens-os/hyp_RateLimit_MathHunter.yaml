component: RateLimit
hunter: MathHunter
status: complete
date: 2026-03-27

hypotheses:
  - id: MATH-WT-01
    title: "Stale allowancesLastSet enables 2x burst beyond rate limit"
    target_function: "RateLimit._replenishAllowance"
    severity: High
    confidence: 92
    solidity: |
      if (allowances[caller] == maxAllowances[caller]) {
          return; // BUG: allowancesLastSet[caller] queda stale
      }
    attack_path:
      - "Caller configured, allowance=max, lastSet=T0"
      - "Time passes (days/weeks), allowance stays at max → early return, lastSet stays T0"
      - "Caller mints maxAllowance → allowance=0, lastSet still T0"
      - "Next block: _replenishAllowance computes from stale T0 → instant full replenish"
      - "Caller mints maxAllowance AGAIN → 2x burst in seconds"
    impact: "2x rate limit bypass for minting (cbBTC/cbETH) and exchange rate updates (cbETH)"

  - id: MATH-WT-02
    title: "Same stale timestamp in ExchangeRateUpdater enables double rate change"
    target_function: "ExchangeRateUpdater.updateExchangeRate"
    severity: High
    confidence: 90
    solidity: |
      // Same RateLimit._replenishAllowance bug applied to exchange rate delta
      uint256 exchangeRateChange = abs(newRate - currentRate);
      require(exchangeRateChange <= allowances[msg.sender]);
    attack_path:
      - "Caller inactive with allowance=max for long period"
      - "Updates exchange rate with delta=maxAllowances (spends all)"
      - "Immediately: replenish from stale timestamp → full allowance restored"
      - "Updates exchange rate AGAIN with delta=maxAllowances"
      - "Total: 2x allowed delta in one block"
    impact: "cbETH exchange rate moved 2x beyond rate limit, affecting all DeFi protocols reading exchangeRate()"

  - id: MATH-WT-03
    title: "Precision loss in _getReplenishAmount for small maxAllowances"
    target_function: "RateLimit._getReplenishAmount"
    severity: Low
    confidence: 85
    solidity: |
      uint256 amountToReplenish = (secondsSinceAllowanceSet * maxAllowances[caller]) / intervals[caller];
      // Truncates to 0 when seconds * max < interval
    impact: "Step-function replenishment instead of linear. Low impact for cbETH given large wei values."

  - id: MATH-WT-06
    title: "Second early return (amountToReplenish==0) also leaves timestamp stale"
    target_function: "RateLimit._replenishAllowance"
    severity: Medium
    confidence: 88
    solidity: |
      uint256 amountToReplenish = _getReplenishAmount(caller);
      if (amountToReplenish == 0) {
          return; // BUG: allowancesLastSet NOT updated
      }
    impact: "Amplifies MATH-WT-01. Both early returns have the same defect."
