hypotheses:
  - id: WT-FL-01
    title: "State machine has STALE state enabling rate limit bypass"
    target_function: "RateLimit._replenishAllowance"
    severity: High
    confidence: 85
    state_machine: |
      CONFIGURED → allowance=max, lastSet=now
      ACTIVE → allowance<max, being used/replenished
      DEPLETED → allowance=0, waiting replenish
      STALE → allowance=max, lastSet=OLD (BUG STATE)

      CONFIGURED →(time passes, no usage)→ STALE
      STALE →(use allowance)→ DEPLETED
      DEPLETED →(replenish from stale timestamp)→ CONFIGURED (instant!)
    solidity: "// See description"
    impact: "Same as MATH-WT-01: 2x rate limit bypass"

  - id: WT-FL-02
    title: "Dual rate limit: MintForwarder + FiatToken minterAllowance"
    target_function: "MintForwarder.mint → FiatTokenV2_1.mint"
    severity: Info
    confidence: 95
    flow: |
      mint(to, amount):
        1. Check RateLimit allowance (time-based, auto-replenish)
        2. Call tokenContract.mint()
        3. FiatToken checks minterAllowance (fixed, no auto-replenish)

      If minterAllowance > maxAllowances: RateLimit is binding constraint (bypassable)
      If minterAllowance <= maxAllowances: FiatToken is binding constraint (safe)
    solidity: "// See description"
    impact: "Miti gates MATH-WT-01 ONLY if minterAllowance is set <= maxAllowances. Otherwise RateLimit bypass is exploitable."
