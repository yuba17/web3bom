component: RateLimit
hunter: AccessHunter
status: complete
date: 2026-03-27

hypotheses:
  - id: WT-AC-01
    title: "currentAllowance() is public non-view — anyone can trigger state change"
    target_function: "RateLimit.currentAllowance(address)"
    severity: Info
    confidence: 90
    solidity: |
      function currentAllowance(address caller) public returns (uint256) {
          _replenishAllowance(caller); // STATE CHANGE — no access control
          return allowances[caller];
      }
    impact: "Beneficial state change only (replenishes allowance). No attack vector but poor API design."

  - id: WT-AC-02
    title: "initialize() protected by onlyOwner but not atomic with deployment"
    target_function: "MintForwarder.initialize() / ExchangeRateUpdater.initialize()"
    severity: Info
    confidence: 85
    impact: "Window between deploy and initialize where deployer must call. Protected by onlyOwner."
