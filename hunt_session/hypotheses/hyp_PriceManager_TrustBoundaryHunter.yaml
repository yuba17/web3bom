invariants:
- id: PM-TB-01
  tier: 1
  type: property
  description: >
    verifyBulk return mismatch — transmit() validates feedId allowlisting on the
    UNVERIFIED reports (pre-verification loop L140-150), then calls verifyBulk which
    returns verified reports. But verifyBulk can return a DIFFERENT number of reports
    or reports in a DIFFERENT ORDER than the input. The post-verification loop (L155-182)
    iterates verifiedReports without re-checking that each report's feedId is allowlisted.
    If verifyBulk reorders or injects a report with a non-allowlisted feedId, the
    s_dataStreamsFeedIdToAsset lookup returns address(0) and the price is stored at
    mapping key address(0) — a no-op storage write that wastes gas but causes no fund loss.
    HOWEVER, if verifyBulk returns FEWER reports than input, some prices silently don't
    update. If it returns MORE, it processes extra unvalidated reports.
  attack_scenario: >
    A compromised or buggy verifierProxy returns a verifiedReports array with an extra
    report containing a feedId that maps to a legitimate asset but with a manipulated price.
    The pre-check loop only validated the original input feedIds, not the verified output.
    The extra report's price gets stored, overwriting a legitimate price. In the auction
    context (BaseAuction), this manipulated price directly determines swap amounts,
    enabling the attacker to buy assets below market or sell above.
  impact: >
    Direct fund loss in auctions — manipulated price used in _getAssetPrice(asset, true)
    to calculate swap amounts. Attacker extracts value equal to price deviation * auction volume.
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // After transmit(), for every asset whose feedId was in the unverified input,
    // the stored price must match what verifyBulk returned for that specific feedId.
    // This invariant checks that no EXTRA feedIds got stored beyond what was in the input.
    // Pseudo — needs harness tracking input feedIds vs stored prices.
    bytes32[] memory inputFeedIds = ghost_lastTransmitInputFeedIds;
    for (uint256 i = 0; i < s_allowlistedAssets.length(); i++) {
        address asset = s_allowlistedAssets.at(i);
        if (s_dataStreamsPrice[asset].timestamp == block.timestamp) {
            // This asset was updated this block — verify its feedId was in the input
            bool found = false;
            for (uint256 j = 0; j < inputFeedIds.length; j++) {
                if (s_feedInfo[asset].dataStreamsFeedId == inputFeedIds[j]) {
                    found = true;
                    break;
                }
            }
            t(found, "PM-TB-01: price stored for asset whose feedId was not in transmit input");
        }
    }
  ghost_vars:
  - bytes32[] internal ghost_lastTransmitInputFeedIds;
  validated: false
  priority: high
  confidence: 45
  notes: >
    Confidence is moderate-low because verifierProxy is a trusted Chainlink component.
    However, the trust boundary violation is real — the contract validates input but
    trusts output blindly. If verifierProxy is upgradeable or compromised, this is exploitable.
    The key question is whether verifyBulk guarantees 1:1 input-output correspondence.

- id: PM-TB-02
  tier: 1
  type: property
  description: >
    Negative Chainlink price causes revert in fallback path, breaking withValidation=false
    contract. In _getAssetPrice (L386-392), when the Data Streams price is stale, the
    contract falls back to usdDataFeed.latestRoundData(). The int256 answer is cast via
    answer.toUint256() (SafeCast), which REVERTS on negative values. The caller
    (e.g., BaseAuction L238) calls with withValidation=false expecting a graceful return
    with isValid=false, but instead gets an unexpected revert. This breaks the auction's
    ability to handle invalid prices gracefully.
  attack_scenario: >
    1. Data Streams price becomes stale (normal operation gap).
    2. Chainlink aggregator returns a negative price (extreme market event, oracle malfunction,
       or minAnswer circuit breaker returning -1 on some feeds).
    3. _getAssetPrice is called with withValidation=false (e.g., BaseAuction._getAssetPrice
       at L238 or L764).
    4. SafeCast.toUint256() reverts on the negative int256.
    5. The entire auction function reverts — users cannot create/fill auctions.
    6. This is a DoS on the auction system during the exact moment prices are most volatile
       and auctions are most critical.
  impact: >
    DoS of auction system during market stress. Users cannot interact with auctions when
    both Data Streams is stale AND Chainlink returns negative/zero. The withValidation=false
    path is designed to be non-reverting but SafeCast breaks that assumption.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: _getAssetPrice with withValidation=false must NEVER revert
    // (it should return isValid=false instead).
    // This is a liveness property — test by setting up stale streams + negative feed answer.
    // In fuzzing harness:
    try priceManager.getAssetPrice(asset) returns (uint256 p, uint256 u, bool v) {
        // OK — function returned without revert
        // If price source is negative, isValid should be false
    } catch {
        t(false, "PM-TB-02: getAssetPrice reverted — withValidation=false must not revert");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    This is a real trust boundary violation. The contract trusts that latestRoundData will
    return non-negative values, but Chainlink docs explicitly state int256 can be negative.
    SafeCast.toUint256 reverts on negative. The code should handle negative prices by
    treating them as zero/invalid instead of reverting. High confidence because the code
    path is clear and the behavior of SafeCast is deterministic.

- id: PM-TB-03
  tier: 2
  type: property
  description: >
    Feed rotation silently removes price source for previous asset without notifying
    downstream consumers. When _applyFeedInfoUpdates rotates a feedId from asset A to
    asset B (L265-278), it clears A's dataStreamsFeedId and dataStreamsPrice. If A has
    no usdDataFeed configured, the function reverts (L271-273). BUT if A has a usdDataFeed,
    the rotation succeeds and A silently loses its Data Streams price source — falling back
    to the potentially lower-frequency/lower-quality Chainlink feed. There is no event
    emitted for A indicating its Data Streams source was removed. Downstream systems
    monitoring events would not know A's price source degraded.
  attack_scenario: >
    1. Asset A is configured with both Data Streams feed F and a Chainlink fallback feed.
    2. ASSET_ADMIN rotates feed F to asset B via applyFeedInfoUpdates.
    3. Asset A's Data Streams price is deleted, and A silently falls back to Chainlink only.
    4. If the Chainlink feed for A has a longer heartbeat (e.g., 1h vs Data Streams' near-real-time),
       auctions using A's price operate on stale data during that gap.
    5. An attacker exploits the stale Chainlink price to buy/sell at outdated rates.
  impact: >
    Price staleness during feed rotation window. Attacker can front-run the transition
    to trade at stale prices in auctions. Impact depends on heartbeat difference between
    Data Streams and Chainlink feeds.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After a feed rotation, the previous asset must still have a valid price source
    // AND its price must still be fresh (not relying on a stale Chainlink feed).
    // Track feedId-to-asset mapping changes:
    if (ghost_previousFeedRotationAsset != address(0)) {
        (, uint256 updatedAt, bool isValid) = _getAssetPrice(ghost_previousFeedRotationAsset, false);
        // The previous asset should still return a valid price
        t(isValid, "PM-TB-03: previous asset lost valid price after feed rotation");
        ghost_previousFeedRotationAsset = address(0);
    }
  ghost_vars:
  - address internal ghost_previousFeedRotationAsset;
  validated: false
  priority: medium
  confidence: 55
  notes: >
    This is a trust boundary issue between admin operations and downstream consumers.
    The code does check that usdDataFeed exists for the previous asset (L271), but does
    NOT check that the fallback feed is actually fresh/working. The silent degradation
    is the core issue. Confidence medium because it requires a specific admin action sequence.

- id: PM-TB-04
  tier: 1
  type: property
  description: >
    Chainlink feed decimals() can change or be inconsistent with stored dataStreamsFeedDecimals.
    In _getAssetPrice (L394), decimals() is called dynamically on the Chainlink feed each time.
    But in transmit() (L167), feedDecimals comes from the stored dataStreamsFeedDecimals
    configured by admin. If the Chainlink feed's decimals() return value differs from what
    the admin configured for Data Streams, the two price sources are scaled differently.
    When _getAssetPrice falls back from Data Streams to Chainlink, it uses the Chainlink
    feed's own decimals() — which is correct. BUT the comparison between the two
    (which is more recent) compares a Data Streams price scaled with admin-configured decimals
    vs a Chainlink price scaled with the feed's own decimals. If the admin misconfigures
    dataStreamsFeedDecimals, the Data Streams price could be orders of magnitude wrong.
  attack_scenario: >
    1. ASSET_ADMIN configures an asset with dataStreamsFeedDecimals=8 but the actual
       Data Streams feed reports in 18 decimals.
    2. transmit() receives a price of 1000e18 (1000 USD in 18 decimals).
    3. The scaling logic at L168-172 multiplies by 10^(18-8) = 10^10, producing 1000e28
       instead of 1000e18.
    4. This inflated price is stored and used in auctions.
    5. Attacker buys assets at 10^10x the real price — or sells assets worth far more than
       they should receive.
  impact: >
    Critical price manipulation if admin misconfigures decimals. 10^N price deviation
    where N is the difference between actual and configured decimals. Direct fund extraction
    in auctions.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Cross-check: Data Streams price and Chainlink price for the same asset should be
    // within a reasonable deviation band (e.g., 5%) when both are available and fresh.
    // This catches decimal misconfiguration.
    DataStreamsPriceInfo memory dsPrice = s_dataStreamsPrice[asset];
    FeedInfo memory fi = s_feedInfo[asset];
    if (dsPrice.usdPrice > 0 && address(fi.usdDataFeed) != address(0)) {
        (, int256 answer,, uint256 feedUpdatedAt,) = fi.usdDataFeed.latestRoundData();
        if (answer > 0 && feedUpdatedAt > block.timestamp - fi.stalenessThreshold) {
            uint256 clPrice = uint256(answer);
            uint8 clDecimals = fi.usdDataFeed.decimals();
            if (clDecimals < 18) clPrice = clPrice * 10 ** (18 - clDecimals);
            else if (clDecimals > 18) clPrice = clPrice / 10 ** (clDecimals - 18);
            // Prices should be within 5% of each other
            uint256 deviation = dsPrice.usdPrice > clPrice
                ? dsPrice.usdPrice - clPrice
                : clPrice - dsPrice.usdPrice;
            uint256 maxDeviation = clPrice * 5 / 100;
            lte(deviation, maxDeviation, "PM-TB-04: DS and CL prices deviate >5% — possible decimal misconfiguration");
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 50
  notes: >
    This is an admin trust boundary issue. The contract trusts the admin to configure
    dataStreamsFeedDecimals correctly but has no on-chain validation against the actual
    Data Streams feed. Chainlink Data Streams feeds don't expose a decimals() on-chain.
    Confidence 50% because it requires admin error, but the impact is catastrophic if it happens.

- id: PM-TB-05
  tier: 1
  type: property
  description: >
    transmit() pre-validates feedIds on unverified data, but feedId can be spoofed in the
    unverified payload. The first loop (L140-150) decodes feedId from the UNVERIFIED report
    (before verifyBulk), extracting it as bytes32(reportData). An attacker with PRICE_ADMIN_ROLE
    could craft an unverified report where the pre-decoded feedId passes the allowlist check,
    but the actual verified report (after verifyBulk) contains a different feedId. The
    post-verification loop at L155-182 uses the VERIFIED report's feedId for storage.
    If the verified feedId maps to address(0) via s_dataStreamsFeedIdToAsset, the price
    is stored at s_dataStreamsPrice[address(0)] — a dead-end write. But if the verified
    feedId happens to map to a different legitimate asset, that asset's price gets overwritten.
  attack_scenario: >
    1. PRICE_ADMIN crafts unverified reports where the raw reportData starts with
       allowlisted feedId X, but the actual signed report contains feedId Y.
    2. Pre-check loop passes because feedId X is allowlisted.
    3. verifyBulk validates the signature and returns the real report with feedId Y.
    4. Post-check loop stores the price at s_dataStreamsFeedIdToAsset[Y].
    5. If Y maps to a different asset, that asset's price is manipulated.
    Note: This requires that verifyBulk doesn't reject the report if the unsigned wrapper
    differs from the signed content. The trust boundary is: does verifyBulk guarantee
    consistency between wrapper and payload?
  impact: >
    Price manipulation of a different asset than intended. Could cause incorrect auction
    pricing leading to direct fund loss.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: the feedId decoded from the unverified report MUST match the feedId
    // in the verified report output from verifyBulk.
    // In harness, intercept both pre and post verification feedIds:
    for (uint256 i = 0; i < ghost_preVerifyFeedIds.length; i++) {
        eq(
            ghost_preVerifyFeedIds[i],
            ghost_postVerifyFeedIds[i],
            "PM-TB-05: pre-verify feedId differs from post-verify feedId"
        );
    }
  ghost_vars:
  - bytes32[] internal ghost_preVerifyFeedIds;
  - bytes32[] internal ghost_postVerifyFeedIds;
  validated: false
  priority: high
  confidence: 40
  notes: >
    Low confidence because verifyBulk is a Chainlink-controlled contract that presumably
    ensures consistency. BUT the trust boundary violation is architecturally real — the
    contract validates the unverified data and trusts the verified data without cross-checking.
    If verifyBulk has any inconsistency in how it maps reports, this becomes exploitable.
    Requires PRICE_ADMIN_ROLE, which limits attack surface.

- id: PM-TB-06
  tier: 2
  type: property
  description: >
    Chainlink latestRoundData() can revert (feed decommissioned, access controlled,
    proxy upgraded), causing _getAssetPrice to revert even with withValidation=false.
    When Data Streams price is stale and the contract falls back to Chainlink (L386),
    the external call to latestRoundData() is not wrapped in try/catch. If the Chainlink
    feed reverts (decommissioned, ACL denied, etc.), the entire _getAssetPrice call
    reverts — including calls from BaseAuction with withValidation=false that expect
    graceful degradation.
  attack_scenario: >
    1. Data Streams price becomes stale (normal gap).
    2. The configured Chainlink usdDataFeed is decommissioned or access-controlled.
    3. latestRoundData() reverts.
    4. All auction functions calling _getAssetPrice revert — full DoS.
    5. Users cannot create, fill, or settle auctions for the affected asset.
    6. If the asset is the output asset of an active auction, the auction cannot be settled
       and funds are temporarily locked.
  impact: >
    Full DoS of auction functions for the affected asset. Funds in active auctions
    may be temporarily inaccessible until admin removes/updates the feed.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Property: _getAssetPrice with withValidation=false should never revert.
    // Test with a reverting Chainlink feed mock:
    try priceManager.getAssetPrice(asset) returns (uint256 p, uint256 u, bool v) {
        // Success — function handled gracefully
    } catch {
        t(false, "PM-TB-06: getAssetPrice reverted with withValidation=false — DoS risk");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    Similar to PM-TB-02 but different root cause. PM-TB-02 is about negative price causing
    SafeCast revert. This is about the external call itself reverting. Both violate the
    same trust boundary: _getAssetPrice(withValidation=false) is expected to be non-reverting
    but has multiple revert paths through trusted-but-uncontrolled external calls.

- id: PM-TB-07
  tier: 2
  type: property
  description: >
    No validation that Chainlink feed's decimals() is reasonable. In _getAssetPrice L394,
    decimals() is called on the Chainlink feed. If the feed returns an unexpectedly large
    value (e.g., 77), the scaling calculation 10**(decimals - 18) at L399 would produce
    10**59, and dividing the price by that would return 0. With withValidation=false, this
    zero price is returned with isValid=false. With withValidation=true, it reverts with
    ZeroFeedData. The contract trusts decimals() to return a sane value.
  attack_scenario: >
    If a malicious or buggy Chainlink feed returns decimals() > 77 (uint8 max is 255),
    the exponentiation 10**(decimals-18) overflows. With Solidity 0.8.26, this causes a
    revert via overflow check, which is another DoS vector for withValidation=false callers.
    Even decimals=77 would underflow the price to zero.
  impact: >
    DoS or zero-price return from corrupted Chainlink feed decimals. If decimals > ~77,
    overflow revert. If decimals in range 19-77, price divided to zero.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: Chainlink feed decimals() should be in a reasonable range (0-24)
    FeedInfo memory fi = s_feedInfo[asset];
    if (address(fi.usdDataFeed) != address(0)) {
        uint8 d = fi.usdDataFeed.decimals();
        lte(uint256(d), 24, "PM-TB-07: Chainlink feed decimals > 24 — unreasonable");
        gte(uint256(d), 1, "PM-TB-07: Chainlink feed decimals is 0 — unreasonable");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    Low confidence because Chainlink feeds are well-maintained and decimals() is stable.
    But the trust boundary exists — the contract blindly uses the value without sanity checks.
    In practice, all Chainlink USD feeds use 8 decimals, making this theoretical.

false_positives:
- hunter: TrustBoundaryHunter
  id: PM-FP-01
  reason: >
    answeredInRound >= roundId check is NOT performed on latestRoundData(). This is a
    classic oracle checklist item but is actually a false positive for recent Chainlink
    feeds. Chainlink deprecated multi-round aggregation — latestRoundData always returns
    the latest round by definition. The answeredInRound check was relevant for Flux
    Aggregator (pre-OCR) but is unnecessary for OCR-based feeds which are all modern
    deployments. Not a real trust boundary violation.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: oracle.md
    content: >
      answeredInRound >= roundId check is deprecated for OCR feeds — do not flag
      as a finding on modern Chainlink deployments.
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: PM-FP-02
  reason: >
    IERC20Metadata.decimals() trust — listed as a key area to investigate. However,
    PriceManager itself never calls IERC20Metadata.decimals(). The token decimals are
    used in BaseAuction for amount scaling, not for price scaling. PriceManager only
    deals with feed decimals (dataStreamsFeedDecimals and Chainlink feed.decimals()),
    which are separate concerns. Not a PriceManager trust boundary issue.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null
