# ─────────────────────────────────────────────────────────────────────────────
# PROTOCOL MODEL — DomainHunter Analysis
#
# BaseAuction es una subasta holandesa multi-asset con decay lineal de precio.
# Flujo de dinero:
#   1. FeeAggregator tiene fees acumuladas (assetIn) → transfiere al contrato en performUpkeep
#   2. Auction vive `auctionDuration` segundos con precio decayendo de startingPriceMultiplier a endingPriceMultiplier
#   3. Bidders llaman bid(asset, amount) → reciben assetIn, pagan assetOut (ej LINK)
#   4. Al terminar el auction (tiempo o dust), _onAuctionEnd devuelve assetIn residual al FeeAggregator
#      y transfiere TODO el assetOut acumulado al assetOutReceiver
#
# GPV2CompatibleAuction (subclase):
#   - En _onAuctionStart: aprueba i_gpV2VaultRelayer para gastar assetIn
#   - En _onAuctionEnd: revoca la aprobación
#   - isValidSignature (EIP-1271): CowSwap valida órdenes — el contrato actúa como solver on-chain
#     * receiver del order DEBE ser address(this) (no s_assetOutReceiver)
#     * Los buyTokens (assetOut) llegan al contrato y _onAuctionEnd los barre al receiver
#
# SUPERFICIES DE ATAQUE PRINCIPALES:
#   A) Multi-auction assetOut accounting — _onAuctionEnd no tiene tracking por auction
#   B) Aprobación GPv2 no revocada a tiempo (race: CowSwap vs keeper)
#   C) AUCTION_WORKER_ROLE puede forzar cierre prematuro de auctions activos
#   D) Boundary en bid() vs getAssetOutAmount para elapsedTime == auctionDuration
# ─────────────────────────────────────────────────────────────────────────────

invariants:

- id: BA-01
  tier: 1
  type: property
  description: >
    _onAuctionEnd barre el balance TOTAL de assetOut sin distinguir por auction.
    Con múltiples auctions simultáneos, el assetOut pagado por bidders del auction B
    es robado al terminar el auction A.
  attack_scenario: >
    Existen auctions simultáneos para asset A y asset B.
    1. Bidder paga 100 LINK (assetOut) por asset A → LINK queda en el contrato.
    2. El auction de asset B expira primero. Keeper llama performUpkeep([B]).
    3. _onAuctionEnd(B) ejecuta: assetOutBalance = IERC20(LINK).balanceOf(address(this)) = 100 LINK.
    4. Los 100 LINK van a s_assetOutReceiver.
    5. El auction de A continúa activo pero todo su assetOut acumulado ya fue enviado.
    Resultado: el protocolo acumula LINK de bidders del auction A sin poder pagarlo al receiver
    correctamente. El receiver recibe el LINK del auction A prematuramente. No hay restitución.
    Impacto: el assetOut de bidders activos se barre por auctions terminados de otros assets.
  solidity: |
    // Ghost vars: assetOut pagado por auction de cada asset
    // Invariante: assetOutBalance >= suma de lo que han pagado los bidders de auctions aún activos
    //
    // Si auction_A está activo y ha recibido ghost_assetOutPaidForA de bidders:
    // el balance actual de assetOut DEBE ser >= ghost_assetOutPaidForA
    // porque esos fondos todavía no deberían haberse barrido
    //
    uint256 currentAssetOutBalance = IERC20(s_assetOut).balanceOf(address(auctionContract));
    // Si hay N auctions activos y los bidders han pagado ghost_totalActiveBidPayments:
    gte(
      currentAssetOutBalance,
      ghost_totalActiveBidPayments,
      "BA-01: assetOut de auctions activos barrido por _onAuctionEnd de otro auction"
    );
  ghost_vars:
    - uint256 internal ghost_totalActiveBidPayments;
    - mapping(address => uint256) internal ghost_assetOutPaidByAuction;
  validated: false
  priority: high
  confidence: 88
  notes: >
    El bug es estructural: _onAuctionEnd usa balanceOf() global en vez de tracking
    por auction. La línea clave es L393-396 en BaseAuction.sol:
      uint256 assetOutBalance = IERC20(s_assetOut).balanceOf(address(this));
      if (assetOutBalance > 0) { IERC20(s_assetOut).safeTransfer(s_assetOutReceiver, assetOutBalance); }
    No hay ningún mapeo de "cuánto assetOut pertenece a qué auction".
    Para que esto sea exploitable en la práctica, se necesitan >= 2 assets en s_allowlistedAssets
    con auctions activos simultáneamente. Esto es un caso de uso normal del protocolo
    (fee aggregator acumula fees de múltiples tokens y los subasta).
    TAMBIÉN aplica en performUpkeep cuando se inician Y terminan auctions en la misma tx:
    el loop de starts (L324-357) puede transferir tokens y luego el loop de ends (L359-369)
    hace _onAuctionEnd que barre el assetOut recién pagado por bidders del auction nuevo.
    Severity estimada: HIGH (pérdida de fondos, no requiere permisos especiales del attacker).

- id: BA-02
  tier: 1
  type: property
  description: >
    Race condition entre la expiración del auction y la revocación de aprobación GPv2.
    CowSwap puede ejecutar una orden después de que el auction haya expirado si el keeper
    no ha llamado performUpkeep(endedAuctions) aún, porque la aprobación sigue activa.
  attack_scenario: >
    1. Auction de asset X comienza. GPv2CompatibleAuction._onAuctionStart aprueba
       i_gpV2VaultRelayer por balanceOf(X) tokens.
    2. Un solver de CowSwap crea una orden con validTo = auctionStart + auctionDuration + 3600
       (1 hora después del fin del auction).
    3. El auction expira (block.timestamp > auctionStart + auctionDuration).
    4. El keeper NO ha llamado performUpkeep(endedAuctions) todavía (latencia normal en Chainlink Automation).
    5. isValidSignature revierte con InvalidAuction en este punto → la orden en CowSwap
       ya no es válida en el contrato.
    6. PERO: si el solver intenta ejecutar en CowSwap directamente antes de que isValidSignature
       se compruebe (GPv2 usa un settlement con batch de muchas órdenes), la aprobación preexistente
       permite a i_gpV2VaultRelayer mover los tokens X sin que isValidSignature sea llamado
       para esta transacción específica.
    NOTA: Este vector depende de la implementación de CowSwap settlement. Si settlement
    siempre llama isValidSignature antes de usar la aprobación, el bug no es explotable.
    Si CowSwap caching de firmas válidas permite ejecución sin re-verificación, sí lo es.
  solidity: |
    // Invariante: si auction está expirado Y aprobación del relayer > 0, hay riesgo
    uint256 auctionStart = auctionContract.getAuctionStart(asset);
    if (auctionStart != 0) {
      AssetParams memory params = auctionContract.getAssetParams(asset);
      if (block.timestamp > auctionStart + params.auctionDuration) {
        // El auction expiró pero el keeper no lo ha cerrado aún
        uint256 relayerAllowance = IERC20(asset).allowance(
          address(auctionContract),
          auctionContract.getGPV2VaultRelayer()
        );
        // La aprobación debería ser 0 para assets con auction expirado
        eq(relayerAllowance, 0, "BA-02: aprobacion GPv2 activa en auction expirado");
      }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 62
  notes: >
    La severidad depende de cómo CowSwap GPv2 settlement maneja las órdenes.
    El flow normal de CowSwap llama isValidSignature en cada settlement batch, por lo que
    el bloqueo ocurriría. Sin embargo, si la orden fue "pre-signed" en el OrderBook de CowSwap
    antes de la expiración del auction, y hay un solver que la tiene en su batch pendiente,
    podría intentar ejecución justo cuando el auction expira pero antes del keepers.
    La ventana de exposición es la latencia del keeper (tipicamente 1-3 bloques en Base).
    En la práctica CowSwap re-verifica con isValidSignature en cada settle, lo que mitiga esto.
    Downgrading confidence a 62% — necesita análisis del GPv2Settlement real.

- id: BA-03
  tier: 1
  type: property
  description: >
    AUCTION_WORKER_ROLE puede forzar cierre prematuro de auction activo.
    performUpkeep no verifica que los endedAuctions realmente hayan expirado —
    solo verifica que s_auctionStarts[asset] != 0. Un keeper malicioso puede
    terminar cualquier auction activo enviando performData fabricado.
  attack_scenario: >
    1. Auction de asset X comienza (s_auctionStarts[X] = block.timestamp).
    2. Bidders han pagado 500 LINK por partial fills durante los primeros minutos.
    3. AUCTION_WORKER_ROLE (keeper malicioso o comprometido) llama performUpkeep
       con eligibleAssets=[] y endedAuctions=[X].
    4. El check en L362: if (s_auctionStarts[asset] == 0) revert — pero s_auctionStarts[X] != 0,
       así que pasa.
    5. _onAuctionEnd(X, hasFeeAggregator): transfiere assetIn residual al feeAggregator
       y TODOS los 500 LINK al s_assetOutReceiver.
    6. El auction termina prematuramente. Los bidders que ya pagaron no pueden hacer bid
       del resto. El assetIn residual regresa al feeAggregator (lo que llaman "dust attack protection")
       pero el assetOut ya fue enviado.
    Impacto: el keeper puede manipular el timing del auction para favorecer a ciertos bidders
    (cierra antes de que otros puedan pujar) o para robar oportunidades de arbitraje.
    Severity: MEDIUM si se asume que AUCTION_WORKER_ROLE es trusted. HIGH si se considera
    que es un keeper de Chainlink Automation (potencialmente explotable via griefing).
  solidity: |
    // Invariante: _onAuctionEnd solo puede llamarse cuando el auction realmente ha expirado
    // o cuando el balance está por debajo de minAuctionSizeUsd
    uint256 auctionStart = auctionContract.getAuctionStart(asset);
    if (auctionStart != 0) {
      AssetParams memory params = auctionContract.getAssetParams(asset);
      // El auction no debería terminar si aún le queda tiempo Y el balance es suficiente
      uint256 assetBalance = IERC20(asset).balanceOf(address(auctionContract));
      (uint256 assetPrice,,) = auctionContract.getAssetPrice(asset);
      uint256 assetUsdValue = (assetBalance * assetPrice) / (10 ** params.decimals);
      bool expired = block.timestamp > auctionStart + params.auctionDuration;
      bool dustLevel = assetUsdValue < params.minAuctionSizeUsd;
      // Si ninguna condición de terminación aplica, el auction no debería haberse terminado
      t(expired || dustLevel, "BA-03: auction terminado prematuramente por keeper");
    }
  ghost_vars:
    - mapping(address => bool) internal ghost_auctionWasActive;
    - mapping(address => uint256) internal ghost_auctionExpectedEndTime;
  validated: false
  priority: medium
  confidence: 75
  notes: >
    La raíz del problema: performUpkeep no valida que los endedAuctions realmente
    cumplan las condiciones de terminación (L362 solo chequea que el auction existe).
    checkUpkeep sí las valida, pero performUpkeep acepta cualquier performData y solo
    verifica existencia del auction. Un AUCTION_WORKER_ROLE malicioso o un bug en el
    keeper off-chain puede causar terminación prematura.
    La mitigación natural es que AUCTION_WORKER_ROLE es un rol trusted (Chainlink DON).
    Sin embargo, si el keeper off-chain tiene un bug (e.g., off-by-one en timestamp),
    puede terminar auctions prematuramente sin intención maliciosa.
    Severity: MEDIUM (requiere AUCTION_WORKER_ROLE comprometido o buggy).

- id: BA-04
  tier: 1
  type: property
  description: >
    Asymmetry en bid() vs getAssetOutAmount para el boundary exacto elapsedTime == auctionDuration.
    bid() permite bidear cuando elapsedTime == auctionDuration pero getAssetOutAmount
    retorna 0 para ese mismo timestamp — precio inconsistente en el boundary.
  attack_scenario: >
    1. Auction de asset X. auctionDuration = 3600 segundos. auctionStart = T.
    2. En block.timestamp = T + 3600 (exactamente al expirar):
       - bid() check: elapsedTime = 3600. Condición de rechazo: elapsedTime > auctionDuration (3600 > 3600 = FALSE).
         bid() procede. ¡El bidder puede pujar al precio de floor (endingPriceMultiplier)!
       - getAssetOutAmount() check: auctionStart + auctionDuration < timestamp → T + 3600 < T + 3600 = FALSE.
         También permite la vista en este caso.
    3. PERO si el caller pasa timestamp = T + 3600 a getAssetOutAmount externamente:
       auctionStart + auctionDuration < timestamp → T + 3600 < T + 3600 = FALSE — RETORNA el valor (correcto).
    4. Revisar: en el segundo después: block.timestamp = T + 3601.
       - bid(): elapsedTime = 3601 > 3600 → REVERT InvalidAuction. Correcto.
       - checkUpkeep en el mismo bloque: auctionStart + auctionDuration < block.timestamp
         → T + 3600 < T + 3601 = TRUE → marca como endedAuction. Correcto.
    Análisis: El boundary ES consistente (>= en ambos casos). No hay bug aquí.
    Sin embargo: la condición de end en checkUpkeep usa `<` (strict less than), lo que
    significa que en el bloque exacto de expiración (timestamp == auctionStart + auctionDuration)
    el auction NO se marca como terminado pero el bid sí puede ejecutarse.
    Ventana de 1 bloque donde el auction está "en el límite" — técnicamente válido pero borderline.
  solidity: |
    // Verificar que bid() y checkUpkeep son consistentes en el boundary
    uint256 auctionStart = auctionContract.getAuctionStart(asset);
    if (auctionStart != 0) {
      AssetParams memory params = auctionContract.getAssetParams(asset);
      uint256 elapsedTime = block.timestamp - auctionStart;
      // Si bid() acepta (elapsedTime <= auctionDuration), checkUpkeep NO debería marcarlo como ended
      // La condición de end: auctionStart + auctionDuration < block.timestamp
      // Cuando elapsedTime == auctionDuration: auctionStart + auctionDuration == block.timestamp
      // → la condición de end es FALSE → NO se marca como ended
      // → bid() también acepta (elapsedTime > auctionDuration es FALSE)
      // Los dos están de acuerdo en este caso. El invariante es:
      // bid_accepted ↔ NOT checkUpkeep_marked_as_ended
      bool bidWouldBeAccepted = elapsedTime <= params.auctionDuration;
      bool upkeepWouldMarkEnded = auctionStart + params.auctionDuration < block.timestamp;
      t(bidWouldBeAccepted != upkeepWouldMarkEnded || (!bidWouldBeAccepted && !upkeepWouldMarkEnded),
        "BA-04: inconsistencia bid/checkUpkeep en boundary de duracion");
    }
  ghost_vars: []
  validated: true
  priority: low
  confidence: 40
  notes: >
    Investigado: el boundary es en realidad consistente. Ambas condiciones usan
    comparación estricta (>) y (<) respectivamente, creando una ventana de 1 bloque
    donde el auction está exactamente al límite: bid() acepta Y checkUpkeep no lo marca
    como ended. Esto es by design — el bloque exacto de expiración permite la última puja.
    No es un bug. Marcado como FALSE POSITIVE candidate.
    La única anomalía real: un bidder que pide quote via getAssetOutAmount en el bloque
    de expiración recibirá el precio de floor (endingPriceMultiplier) — correcto.

- id: BA-05
  tier: 1
  type: property
  description: >
    Decay rate calculado con redondeo hacia abajo en los comentarios del código.
    El priceMultiplier al final del auction puede ser ligeramente MAYOR que endingPriceMultiplier,
    haciendo que el precio de floor sea más alto que el configurado — bidders nunca obtienen
    el precio mínimo prometido exacto.
  attack_scenario: >
    El comentario en L133 muestra:
      decayRatePerSecond = (1.1e18 - 0.98e18) / 3600 = 33333333333333 (redondeado hacia abajo)
    Esto se usa para configurar el decayRate implícitamente via startingPriceMultiplier,
    endingPriceMultiplier, y auctionDuration.
    En _getAssetOutAmount:
      priceMultiplier = startingPriceMultiplier
        - (startingPriceMultiplier - endingPriceMultiplier).mulDiv(elapsedTime, auctionDuration)
    mulDiv(elapsedTime, auctionDuration) usa redondeo hacia ABAJO (OZ mulDiv default).
    Cuando elapsedTime == auctionDuration:
      mulDiv(auctionDuration, auctionDuration) = 1.0 (exacto) → priceMultiplier = endingPriceMultiplier exacto.
    El problema ocurre en tiempos intermedios: mulDiv(elapsedTime, auctionDuration) puede redondear
    hacia abajo, haciendo que la deducción sea menor → priceMultiplier > valor teórico → bidder paga MÁS.
    Máximo "extra" pagado: ~1 wei del assetIn. Esto favorece al protocolo, no es pérdida de fondos.
    PERO: si el bidder construyó su oferta asumiendo el precio mínimo y la blockchain redondea hacia arriba,
    la orden podría ser rechazada (revert en InsufficientBuyAmount en isValidSignature GPv2).
  solidity: |
    // Invariante: priceMultiplier calculado nunca debe ser MENOR que endingPriceMultiplier
    // (el floor del precio siempre se respeta)
    uint256 startM = params.startingPriceMultiplier;
    uint256 endM = params.endingPriceMultiplier;
    uint256 elapsed = block.timestamp - auctionStart;
    uint256 duration = params.auctionDuration;
    if (elapsed > duration) elapsed = duration;
    uint256 decay = uint256(startM - endM).mulDiv(elapsed, duration);
    uint256 actualMultiplier = startM - decay;
    gte(actualMultiplier, endM, "BA-05: priceMultiplier cae por debajo del floor endingPriceMultiplier");
    lte(actualMultiplier, startM, "BA-05: priceMultiplier supera el ceiling startingPriceMultiplier");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    El invariante BA-05 verificará que el precio siempre está entre [endingPriceMultiplier, startingPriceMultiplier].
    El rounding en mulDiv (hacia abajo) hace que la deducción del decay sea menor, lo que
    mantiene el priceMultiplier ligeramente ENCIMA del valor teórico — esto favorece al protocolo
    (bidder paga más). No hay pérdida de fondos para el protocolo.
    Verificado algebraicamente: como mulDiv redondea hacia abajo, decay <= (start-end)*elapsed/duration teórico,
    por lo tanto priceMultiplier >= endingPriceMultiplier + epsilon. El floor siempre se respeta.
    MARCADO COMO FALSE POSITIVE para el ataque — el invariante es verdadero pero no hay bug.

- id: BA-06
  tier: 1
  type: property
  description: >
    performUpkeep con eligibleAssets que incluyen assetOut inicia una transferencia directa
    (no auction). Si alguien transfiere assetOut al contrato externamente antes de performUpkeep,
    esos fondos van al receiver aunque no provengan del FeeAggregator. Este path es un sweep
    implícito que puede ser explotado para enviar tokens arbitrarios al assetOutReceiver.
  attack_scenario: >
    Mirando L350-351:
      if (asset == s_assetOut) {
        IERC20(asset).safeTransfer(s_assetOutReceiver, IERC20(asset).balanceOf(address(this)));
      }
    Cuando assetOut está en eligibleAssets Y no hay auction activo, se transfiere el balance completo.
    Si un adversario envía assetOut al contrato directamente (donate), y luego el keeper
    trigerea performUpkeep con assetOut en eligibleAssets, esos fondos adicionales van al receiver.
    Esto no es pérdida de fondos del protocolo — es más bien un sweep que incluye donaciones.
    SIN EMBARGO: combinado con BA-01, el sweep incluye assetOut que bidders pagaron por auctions activos.
    El path de "assetOut como eligible" en performUpkeep (L350) y el path "_onAuctionEnd" (L393)
    AMBOS barren el balance completo sin tracking. Esto es la misma raíz que BA-01.
  solidity: |
    // El balance de assetOut en el contrato siempre debería ser explicable:
    // = suma de pagos de bidders de auctions activos + nada más
    // (no debería haber surplus no atribuible)
    uint256 assetOutInContract = IERC20(s_assetOut).balanceOf(address(auctionContract));
    // Todo assetOut en el contrato debe ser de bidders activos
    gte(
      assetOutInContract + ghost_sweptAssetOut,
      ghost_totalAssetOutReceivedFromBidders,
      "BA-06: assetOut en contrato no coincide con pagos de bidders"
    );
  ghost_vars:
    - uint256 internal ghost_sweptAssetOut;
    - uint256 internal ghost_totalAssetOutReceivedFromBidders;
  validated: false
  priority: medium
  confidence: 70
  notes: >
    Este es en realidad una extensión de BA-01 — el mismo problema de sweep global sin tracking.
    La raíz: ningún estado del contrato lleva cuenta de cuánto assetOut pertenece a qué auction.
    Dos paths de sweep: (1) _onAuctionEnd → L393, (2) performUpkeep con assetOut en eligibleAssets → L351.
    Tanto uno como otro son potencialmente problemáticos cuando hay auctions simultáneos.
    Para el fuzzer: trackear ghost_totalAssetOutReceivedFromBidders acumulando cada bid() call,
    y ghost_sweptAssetOut acumulando cada transfer al receiver. Al final, estos deben ser iguales
    (conservación de assetOut).

- id: BA-07
  tier: 1
  type: property
  description: >
    isValidSignature en GPV2CompatibleAuction verifica order.receiver == address(this),
    no == s_assetOutReceiver. El buyToken (assetOut) llega al contrato en vez de ir directamente
    al receiver. Si entre el settle de CowSwap y la llamada de _onAuctionEnd al keeper,
    el contrato tiene assetOut de CowSwap que puede ser barrido por el cierre de OTRO auction.
  attack_scenario: >
    1. CowSwap liquida una orden para auction A → 200 LINK van al contrato (receiver=address(this)).
    2. Antes de que el keeper termine el auction A, el auction B termina (por tiempo o dust).
    3. _onAuctionEnd(B) → barre los 200 LINK que eran del auction A al receiver.
    4. Cuando el keeper termina el auction A, _onAuctionEnd(A) no encuentra LINK → no transfiere nada.
    El receiver recibe el assetOut correctamente en el paso 3, pero el accounting se confunde:
    el assetOut de A se atribuyó al cierre de B. Esto no es pérdida neta de fondos (el receiver
    recibe el dinero), pero rompe cualquier invariante de "esta cantidad de assetOut proviene de este auction".
    Además: si el receiver quiere hacer reconciliación de qué auction generó qué ingresos,
    el evento AuctionEnded(B) no reflejará el assetOut real recibido por el settlement de A.
    Confianza reducida porque el impacto económico neto es cero — el receiver recibe sus fondos.
  solidity: |
    // Verificar que order.receiver == address(this) está siendo chequeado
    // Esto es correcto por diseño, pero documentar el invariante:
    // Invariante: buyAmount depositado por CowSwap DEBE ser contabilizado en el cierre del auction correcto
    // (no borrarlo accidentalmente en el cierre de otro auction)
    //
    // Esta invariante necesita tracking por-auction del assetOut:
    // ghost_assetOutForAuction[asset] += buyAmount (en cada settlement de CowSwap para ese asset)
    // Al terminar auction, verificar que se transfirió exactamente ghost_assetOutForAuction[asset]
    // (más los pagos de bid() para ese auction)
  ghost_vars:
    - mapping(address => uint256) internal ghost_assetOutExpectedForAuction;
  validated: false
  priority: low
  confidence: 55
  notes: >
    Este invariante es una consecuencia de BA-01. La falta de tracking por-auction del assetOut
    hace que el receiver a veces reciba fondos de un auction vía el cierre de otro auction.
    El impacto económico neto es 0 (el receiver recibe todos sus fondos en algún momento),
    pero es incorrecto en términos de contabilidad y puede causar problemas si el receiver
    espera el assetOut en el evento AuctionEnded del auction correcto.
    Marcado como LOW — no hay pérdida de fondos directa, solo accounting incorrecto.

false_positives:

- hunter: DomainHunter
  id: BA-FP-01
  reason: >
    BA-04 (boundary elapsedTime == auctionDuration): investigado en detalle.
    Las condiciones en bid() (elapsedTime > auctionDuration → revert) y en checkUpkeep
    (auctionStart + auctionDuration < block.timestamp → marcar como ended) son consistentes.
    En el bloque exacto de expiración, ambas permiten la operación. No hay inconsistencia.
    El decay formula también es correcto: mulDiv(auctionDuration, auctionDuration) = 1 exacto.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      En subastas holandesas con decay lineal, el boundary elapsedTime == auctionDuration
      puede parecer inconsistente pero si las condiciones usan comparaciones estrictas coherentes
      en todos los paths (bid, checkUpkeep, getAssetOutAmount), es correcto. Verificar que
      todas las comparaciones de boundary usen el mismo operador.
    briefing_update_applied: false

- hunter: DomainHunter
  id: BA-FP-02
  reason: >
    BA-05 (rounding del priceMultiplier por debajo del floor): verificado algebraicamente.
    mulDiv redondea hacia abajo, lo que hace que la deducción del decay sea <= el valor teórico,
    manteniendo priceMultiplier >= endingPriceMultiplier. El bidder paga >= el precio floor
    (no menos). El protocolo siempre recibe al menos el precio mínimo. No hay bug.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      En subastas holandesas con decay lineal, mulDiv(elapsedTime, duration) redondea hacia abajo,
      lo que AUMENTA el priceMultiplier (deducción menor), favoreciendo al protocolo.
      El precio siempre está >= endingPriceMultiplier. No es un bug de underpricing.
    briefing_update_applied: false
