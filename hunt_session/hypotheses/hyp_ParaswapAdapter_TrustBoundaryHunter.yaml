- id: PA-TB-07
  tier: 1
  type: property
  description: >
    Augustus registry compromise: AUGUSTUS_REGISTRY es immutable, pero el contrato de
    registry de Paraswap es externo y mutable (Paraswap puede agregar/remover Augustus
    contracts). Si Paraswap es comprometido o actúa maliciosamente, puede registrar un
    contrato Augustus malicioso que pasa isValidAugustus() y drena tokens del adapter.
    El adapter confía COMPLETAMENTE en el registry para validar Augustus.
  attack_scenario: >
    1. Paraswap (o un atacante que compromete la clave de admin de Paraswap) registra
       un contrato malicioso en AugustusRegistry.
    2. Atacante llama sell() con el Augustus malicioso.
    3. isValidAugustus() retorna true.
    4. Adapter da approval max al contrato malicioso.
    5. Contrato malicioso transfiere todos los srcTokens y devuelve destTokens falsos.
    6. Si destToken es un token controlado por el atacante, puede enviar destAmount necesario.
    PERO: Los balance checks protegen parcialmente — el atacante necesita que destAmount >=
    minDestAmount, lo que significa que necesita enviar tokens reales de destToken al adapter.
  impact: "Trust dependency en Paraswap — si registry es comprometido, cualquier swap vía este adapter es vulnerable."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // No es un invariante testeable en fuzzing.
    // Es un análisis de trust model: ¿el protocolo documenta la dependencia en Paraswap?
    // ¿Hay un mecanismo para pausar el adapter si Augustus registry es comprometido?
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Este es un riesgo de trust boundary fundamental. El adapter confía en un contrato externo
    (AugustusRegistry) controlado por Paraswap. Si Paraswap es comprometido, el adapter es
    vulnerable. Sin embargo, esto es "by design" — el adapter NECESITA confiar en alguien
    para validar Augustus. La pregunta es si hay mitigaciones adicionales (pausability,
    time-lock en registry updates, etc.) que Paraswap tenga. Probablemente Info/Low
    en un bounty porque es trust assumption documentada.

false_positives:
- hunter: TrustBoundaryHunter
  id: PA-FP-01
  reason: >
    sell() y buy() no tienen onlyBundler3 directamente, pero llaman a swap() que SÍ tiene
    onlyBundler3. Esto fue reportado como LOW en Solodit para una versión anterior, pero en
    la versión actual el check está presente en swap() que es la única función que ejecuta
    la lógica crítica (approve + call + transfer). Las funciones sell/buy sin el modifier
    solo hacen updateAmounts (pure) y luego llaman swap. No hay bypass posible.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: trust.md
    content: >
      ParaswapAdapter sell/buy sin onlyBundler3 directo pero swap() interno sí lo tiene.
      No es bypass — la Solodit finding LOW fue para versión previa o es un code style issue,
      no un bug funcional.
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: PA-FP-02
  reason: >
    receive() payable heredado de CoreAdapter — si Augustus envía ETH al adapter durante
    un swap, el ETH queda atrapado. Pero esto NO es un bug del adapter: (a) los tokens del
    adapter son transitorios (se envían/reciben dentro de un bundle), (b) CoreAdapter tiene
    nativeTransfer() para extraer ETH, (c) el initiator del bundle puede incluir un paso
    para transferir ETH restante. Es by design como "catch-all" para wrapping/unwrapping
    de WETH durante bundles.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: trust.md
    content: >
      receive() payable en CoreAdapter no es un bug — es necesario para WETH unwrapping
      durante bundles. ETH residual puede recuperarse con nativeTransfer().
    briefing_update_applied: false
