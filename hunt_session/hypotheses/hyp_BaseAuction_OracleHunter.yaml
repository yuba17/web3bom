# ──────────────────────────────────────────────────────────────────────────────
# RESUMEN DEL ANÁLISIS
#
# Sistema de precios dual: Data Streams (primario) + Chainlink data feed (fallback).
# El precio almacenado usa `observationsTimestamp` del reporte DON, no block.timestamp.
# La staleness se evalúa comparando ese timestamp contra block.timestamp - stalenessThreshold.
# Punto clave: _getAssetPrice(asset, withValidation=true) se usa en bid() y performUpkeep().
# withValidation=false se usa en checkUpkeep() y en la rama pública getAssetOutAmount().
#
# Hallazgos identificados: 5 invariantes + 3 false positives documentados.
# ──────────────────────────────────────────────────────────────────────────────

invariants:

- id: BA-O-01
  tier: 1
  type: property
  description: >
    El fallback de Chainlink en _getAssetPrice no verifica answeredInRound >= roundId.
    Si el aggregator devuelve datos de una ronda antigua (modo recuperación post-outage),
    el contrato acepta el precio obsoleto siempre que dataFeedUpdatedAt sea reciente
    respecto al stalenessThreshold. Un atacante puede bid() durante este período con
    precios favorables si el precio real divergió durante el outage.
  attack_scenario: >
    1. El feed de Data Streams para assetX está stale (>stalenessThreshold segundos sin transmit).
    2. El Chainlink aggregator sufre un outage y entra en modo de recuperación.
    3. El aggregator devuelve answeredInRound < roundId pero con dataFeedUpdatedAt reciente
       (el timestamp del último intento, no del precio real).
    4. _getAssetPrice activa el fallback porque DS está stale: usa el precio Chainlink.
    5. El precio Chainlink retornado es stale en términos de roundId pero fresco en timestamp.
    6. El atacante hace bid() con precio incorrecto, pagando menos assetOut del debido.
    Pérdida: protocolo recibe menos assetOut (LINK/USDC) por los assets subastados.
  solidity: |
    // Simular un Chainlink feed que devuelve answeredInRound < roundId
    // El invariante: si el fallback Chainlink se activa, answeredInRound debe >= roundId
    // No hay assertion directa en el contrato — es una propiedad del proceso de verificación.
    // Para fuzzing: mock un feed con answeredInRound = roundId - 1 y dataFeedUpdatedAt reciente.
    // Verificar que el precio resultante de _getAssetPrice no sea el del roundId obsoleto.
    //
    // Ghost: registrar si el fallback fue activado y qué roundId/answeredInRound se usaron.
    // Si ghost_fallbackActivated && ghost_answeredInRound < ghost_roundId → violation.
    bool ghost_fallbackActivated;
    uint80 ghost_answeredInRound;
    uint80 ghost_roundId;
    // La propiedad se viola si: ghost_fallbackActivated && ghost_answeredInRound < ghost_roundId
    t(!ghost_fallbackActivated || ghost_answeredInRound >= ghost_roundId,
      "BA-O-01: Chainlink fallback used price from incomplete round (answeredInRound < roundId)");
  ghost_vars:
    - bool internal ghost_fallbackActivated;
    - uint80 internal ghost_answeredInRound;
    - uint80 internal ghost_roundId;
  validated: false
  priority: high
  confidence: 75
  notes: >
    La ausencia de la verificación answeredInRound >= roundId es documentada por Chainlink
    como práctica recomendada. Sin embargo, en la práctica, el riesgo es mitigado por el
    stalenessThreshold. Si el threshold es ajustado (ej: 3600s para un feed de 1h heartbeat),
    un precio de ronda incompleta con timestamp reciente podría pasar. Necesita fork test
    para determinar si algún feed configurado tiene heartbeat largo + historial de outages.

- id: BA-O-02
  tier: 1
  type: property
  description: >
    En checkUpkeep(), la condición de finalización de subasta activa usa assetPrice
    (potencialmente stale/inválido) para calcular assetBalanceUsdValue. Si isPriceValid=false,
    la segunda condición de terminación no puede cumplirse (AND con isPriceValid). Esto crea
    una situación donde una subasta con precio inválido solo puede terminar por timeout.
    Si el precio cae a cero (asset devalued, feed muerto), la subasta no termina
    anticipadamente — el contrato sigue esperando bids hasta el timeout.
    Un atacante puede explotar esto: cuando el feed se recupera y el precio es bajo,
    puede hacer bid() al precio real, llevándose los assets antes del timeout.
  attack_scenario: >
    1. Subasta de assetX activa. El feed de Data Streams se vuelve stale.
    2. checkUpkeep: isPriceValid=false para assetX. La condición de terminación por dust
       (isPriceValid && assetBalanceUsdValue < minAuctionSizeUsd) no puede cumplirse.
    3. La subasta no se termina anticipadamente aunque el asset valga prácticamente cero.
    4. Un keeper legítimo podría terminar la subasta via timeout, pero si el feed se recupera
       antes del timeout con precio bajísimo, cualquier bidder puede llevarse los assets
       pagando casi nada en assetOut.
    Pérdida estimada: valor del asset auctioned a precio de mercado deprimido.
  solidity: |
    // Invariante: si hay una subasta activa y el asset price es válido y muy bajo,
    // checkUpkeep debe reportar la subasta como terminada (dust check).
    // Si isPriceValid=true y assetBalanceUsdValue < minAuctionSizeUsd → ended.
    // El path de vulnerabilidad: precio fue inválido, ahora es válido pero bajo.
    //
    // Para testing: verificar que después de que isPriceValid cambia de false a true,
    // checkUpkeep detecta correctamente la condición de dust.
    uint256 assetBalance = IERC20(asset).balanceOf(address(auctionContract));
    (uint256 assetPrice,, bool isPriceValid) = auctionContract.getAssetPrice(asset);
    uint256 assetBalanceUsdValue = (assetBalance * assetPrice) / (10 ** assetParams.decimals);
    uint256 auctionStart = auctionContract.getAuctionStart(asset);
    // Si hay subasta activa y precio válido y USD value bajo threshold → checkUpkeep DEBE reportar ended
    if (auctionStart != 0 && isPriceValid && assetBalanceUsdValue < assetParams.minAuctionSizeUsd) {
      (, bytes memory performData) = auctionContract.checkUpkeep("");
      (Common.AssetAmount[] memory eligibleAssets, address[] memory endedAuctions) =
        abi.decode(performData, (Common.AssetAmount[], address[]));
      bool auctionInEnded = false;
      for (uint i = 0; i < endedAuctions.length; i++) {
        if (endedAuctions[i] == asset) auctionInEnded = true;
      }
      t(auctionInEnded, "BA-O-02: checkUpkeep did not detect dust-level auction as ended");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: >
    Esta es más una limitación de diseño que un bug explotable directamente. El riesgo real
    depende de: (a) frecuencia de feed outages, (b) duración de auctionDuration vs outage.
    Si auctionDuration es corta (ej: 1h) y los feeds tienen heartbeats de 24h, el riesgo
    es bajo. Pero si hay assets con feeds poco confiables, merece atención.

- id: BA-O-03
  tier: 1
  type: property
  description: >
    En _getAssetPrice(), el fallback de Chainlink solo se activa cuando
    `updatedAt < dataFeedUpdatedAt` (estricto). Si los timestamps son iguales
    (updatedAt == dataFeedUpdatedAt), el precio de Data Streams stale se usa sin activar
    el fallback. Aunque la staleness se detecta correctamente via isStale, la condición
    de fallback usa < en lugar de <=, potencialmente descartando un precio Chainlink
    más fresco con el mismo timestamp pero diferente valor.
    Caso límite: DS transmite con observationsTimestamp=T. Chainlink actualiza a timestamp=T.
    El fallback NO se activa. Se usa el precio DS aunque Chainlink tenga precio diferente.
  attack_scenario: >
    1. Data Streams transmite reporte con observationsTimestamp = T_X (dentro del threshold).
    2. Chainlink data feed actualiza con dataFeedUpdatedAt = T_X (mismo timestamp).
    3. Los dos precios son diferentes (ej: DS=$100, Chainlink=$120 por slippage/diferencias).
    4. _getAssetPrice usa DS=$100 porque updatedAt (T_X) no es menor que dataFeedUpdatedAt (T_X).
    5. En `bid()`, la subasta procede con el precio de DS=$100.
    6. Si el precio real es $120, el bidder paga menos assetOut del necesario.
    Pérdida: diferencia de precio * amount auctioned. Requiere coincidencia de timestamps.
  solidity: |
    // Invariante: cuando ambos oráculos tienen el mismo timestamp, el precio usado
    // debe ser consistente (no favorece sistemáticamente a ninguno de los dos).
    // Test: configurar DS price = P1 con timestamp T, Chainlink price = P2 con timestamp T.
    // Verificar que el precio retornado es P1 (DS tiene prioridad por diseño).
    // Si P2 > P1, el protocolo recibe menos assetOut — verificar si esto es by design.
    //
    // La propiedad testeable: precio retornado cuando DS.timestamp == Chainlink.timestamp
    // DEBE ser el precio DS (comportamiento documentado) O el mayor de los dos.
    (uint256 price,, bool isValid) = priceManager.getAssetPrice(asset);
    // Si el DS price está stale pero Chainlink tiene mismo timestamp, esperamos DS price
    // Este comportamiento es by design según NatSpec — pero puede sorprender.
    t(isValid || price == 0, "BA-O-03: price returned from stale DS without fallback activation");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 45
  notes: >
    Probablemente by design — el NatSpec dice "returns the most recent price between DS and
    data feed". Con timestamps iguales, DS tiene prioridad implícita. No es un bug sino
    comportamiento definido. Marcado para verificar en tests si el protocolo documenta
    explícitamente esta elección de diseño. Confidence bajo.

- id: BA-O-04
  tier: 2
  type: property
  description: >
    El precio del assetOut se lee en dos momentos distintos durante performUpkeep:
    (1) una vez al inicio para validar que el assetOut tiene precio válido,
    (2) otra vez dentro de _getAssetOutAmount() para calcular cuánto assetOut
    pagar por cada bid durante la subasta. En performUpkeep(), assetOutPrice se
    cachea del primer read y se pasa a _getAssetOutAmount — esto es correcto.
    PERO en bid(), _getAssetOutAmount lee el assetOut price de nuevo via
    _getAssetPrice(s_assetOut, withValidation=true). Esto significa que entre
    el momento en que bid() verifica el precio del asset (línea 429) y el momento
    en que calcula assetOutAmount (línea 442), no hay atomicidad adicional.
    En una misma transacción esto no es relevante. Pero hay una window temporal
    entre checkUpkeep (que determina si iniciar subasta) y bid() (que usa el precio).
    Si el precio de assetOut sube drásticamente entre el inicio de la subasta y
    la bid, el bidder paga más assetOut del esperado.
  attack_scenario: >
    Escenario de pérdida para el BIDDER (no para el protocolo):
    1. checkUpkeep detecta subasta elegible cuando assetOut.price = $1.
    2. performUpkeep inicia la subasta.
    3. Precio de assetOut sube a $1.50 (movimiento de mercado).
    4. Bidder llama bid() — assetOutAmount se calcula con $1.50, paga 50% más.
    Esto es funcionalmente correcto (subasta usa precio spot), pero puede sorprender
    a bidders que calcularon costos con el precio al inicio de la subasta.
    No hay pérdida para el protocolo — solo riesgo de mercado para el bidder.
  solidity: |
    // Invariante débil: el assetOut amount no excede el valor de mercado razonable
    // del asset subastado * maxPriceMultiplier.
    // Verificar que assetOutAmount <= amount * assetInPrice * startingPriceMultiplier / assetOutPrice
    uint256 maxExpectedOut = amount.mulDivUp(assetInPrice, 10 ** assetInDecimals)
      .mulWadUp(assetInParams.startingPriceMultiplier)
      .mulDivUp(10 ** assetOutDecimals, assetOutPrice);
    uint256 actualOut = auction.getAssetOutAmount(asset, amount, block.timestamp);
    lte(actualOut, maxExpectedOut + 1, "BA-O-04: assetOutAmount exceeds expected max");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    Este es riesgo de mercado inherente a las Dutch auctions, no un bug. El priceMultiplier
    decay absorbe parte de este riesgo. No reportable como bug, pero útil para documentar
    el comportamiento esperado en tests.

- id: BA-O-05
  tier: 1
  type: property
  description: >
    HALLAZGO CRÍTICO: En `_getAssetOutAmount()`, cuando se calcula el precio de salida
    de la subasta para el assetOut, se usa assetOutUsdPrice leído via _getAssetPrice con
    `withValidation=false` en la función pública `getAssetOutAmount()`. Si assetOutPrice=0
    (no transmitido nunca, o feed muerto), la división `auctionUsdValue.mulDivUp(10**decimals, 0)`
    causa un revert por división por cero. PERO esto solo aplica al getter público —
    en bid() se usa withValidation=true para el assetOut price. Sin embargo, hay un
    vector de DoS: si el precio del assetOut se vuelve 0 (feed caído, sin datos), bid()
    también revertirá por `ZeroFeedData`. Esto bloquea todas las bids durante el outage.
    Las subastas activas no pueden completarse, los assets quedan bloqueados hasta timeout.
  attack_scenario: >
    1. Subastas activas para assetX con assetOut=LINK.
    2. El feed de LINK (Data Streams) se cae. No hay transmit durante stalenessThreshold.
    3. El fallback de Chainlink también está stale o no configurado.
    4. bid() llama _getAssetPrice(assetOut, true) → revierte con StaleFeedData.
    5. Ningún bidder puede completar bids durante el outage.
    6. Los assets (fees recaudadas) permanecen bloqueados en el contrato hasta timeout.
    7. En timeout, _onAuctionEnd() devuelve los assets al feeAggregator — sin pérdida de fondos.
    Impacto: DoS temporal de subastas. No hay pérdida de fondos. Severidad: Medium/Low.
  solidity: |
    // Invariante de liveness: si hay una subasta activa y ambos precios son válidos,
    // bid() debe completarse sin revert.
    uint256 auctionStart = auction.getAuctionStart(asset);
    if (auctionStart != 0 && block.timestamp < auctionStart + assetInParams.auctionDuration) {
      (,, bool assetInValid) = priceManager.getAssetPrice(asset);
      (,, bool assetOutValid) = priceManager.getAssetPrice(assetOut);
      // Si ambos precios son válidos, bid() no debe revertir por precio
      if (assetInValid && assetOutValid) {
        uint256 amount = IERC20(asset).balanceOf(address(auction)) / 2;
        if (amount > 0) {
          // En un entorno de test: verificar que bid() no revierte por oracle issues
          // La propiedad: precios válidos implican bid() sin revert por oracle
          t(assetInValid && assetOutValid, "BA-O-05: auction live but prices invalid");
        }
      }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    El DoS es temporal y sin pérdida de fondos (timeout → assets vuelven a feeAggregator).
    Sin embargo, si el stalenessThreshold es largo (ej: 24h) y auctionDuration es corto
    (ej: 1h), una subasta entera puede ser bloqueada. La severidad depende del auctionDuration
    configurado vs. la frecuencia esperada de outages de Data Streams.

false_positives:

- hunter: OracleHunter
  id: BA-O-FP-01
  reason: >
    Inicialmente investigué si `price == 0` pasaba silenciosamente en el fallback de Chainlink.
    La lógica es: si answer (int256) < 0, SafeCast.toUint256() revertirá. Si answer == 0,
    `price` queda en 0 y `isZero=true`. Con withValidation=true (en bid/performUpkeep),
    revierte con ZeroFeedData. Con withValidation=false (en checkUpkeep), retorna isValid=false.
    En ambos casos la protección existe. No es un bug.
  investigated_at: '2026-03-22T05:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/oracle.md
    content: >
      En PriceManager: price=0 en fallback Chainlink está protegido por la verificación
      post-merge `isZero = price == 0`. Con withValidation=true revierte; sin él, isValid=false.
      No es un bug — la protección existe en ambas ramas.
    briefing_update_applied: false

- hunter: OracleHunter
  id: BA-O-FP-02
  reason: >
    Investigué si había inconsistencia entre la verificación de staleness en `transmit()`
    y en `_getAssetPrice()`. transmit() usa: `report.observationsTimestamp < block.timestamp - stalenessThreshold`.
    _getAssetPrice() usa: `updatedAt < block.timestamp - stalenessThreshold` donde
    updatedAt = s_dataStreamsPrice[asset].timestamp = report.observationsTimestamp (seteado en transmit).
    Las dos verificaciones son equivalentes — usan la misma base temporal y la misma
    variable. No hay inconsistencia.
  investigated_at: '2026-03-22T05:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/oracle.md
    content: >
      En PriceManager: transmit() y _getAssetPrice() usan observationsTimestamp como
      referencia temporal. Son equivalentes — no hay asimetría de staleness entre
      la ruta de escritura y la de lectura.
    briefing_update_applied: false

- hunter: OracleHunter
  id: BA-O-FP-03
  reason: >
    Investigué si el timestamp de igualdad (updatedAt == dataFeedUpdatedAt) en el fallback
    Chainlink creaba una vulnerabilidad real de precio manipulable. Conclusión: cuando los
    timestamps son iguales, el NatSpec de _getAssetPrice dice "returns the most recent price
    between DS and data feed" — con timestamps iguales, DS tiene prioridad implícita.
    El contrato está diseñado para preferir DS sobre Chainlink ante cualquier ambigüedad.
    Esto es by design documentado en los comentarios del contrato. Degradado a BA-O-03
    (tier 2, confidence 45) para verificación en tests pero no reportable como bug.
  investigated_at: '2026-03-22T05:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/oracle.md
    content: >
      PriceManager _getAssetPrice fallback: usa `<` (estricto) para comparar timestamps.
      Con timestamps iguales, DS tiene prioridad. Esto es by design — no investigar
      como bug en futuros hunts de protocolos similares.
    briefing_update_applied: false
