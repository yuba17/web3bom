component: LeverageTransformer
hunter: AccessHunter
date: "2026-03-21"

invariants:
  - id: LT-A-01
    title: "leverageUp/Down: only callable via vault.transform() with valid transformedTokenId"
    tier: 2
    type: property
    confidence: 90
    description: >
      Transformer._validateCaller() requires: (a) msg.sender == vault AND
      vault.transformedTokenId() == params.tokenId, OR (b) msg.sender is the direct
      NFT owner. Path (a) is the vault-mediated flow. Path (b) allows direct calls
      from the owner. For path (b): if owner calls LeverageTransformer directly
      (not via vault.transform()), then vault.borrow() will be called with
      msg.sender == LeverageTransformer, but vault checks that LeverageTransformer
      is an approved transformer. The borrow succeeds. But _requireLoanIsHealthy
      is NOT called in the direct path — only vault._transform() calls it.
      Direct owner calls bypass the post-transform health check.
    affected_line: "Transformer.sol:_validateCaller(), LeverageTransformer.sol:leverageUp"
    attack_scenario: >
      Owner calls leverageUp() directly (not via vault.transform()). Borrow succeeds
      (vault approves transformer). Liquidity added. No health check enforced by vault
      (vault._transform() not in call stack). Position can be left under-collateralized.
      However: the owner IS the borrower, so this is self-harm rather than theft.
      Still relevant if owner == malicious contract exploiting a protocol that holds the NFT.
    status: hypothesis
    solidity: |
      // INV-LT-A-01: health check always enforced after leverageUp
      function invariant_leverageUp_healthCheckAlways() public {
          // vault._requireLoanIsHealthy() must be in the call stack
          // Direct owner path may bypass this
      }

  - id: LT-A-02
    title: "leverageUp/Down: arbitrary swapData allows malicious router injection"
    tier: 2
    type: property
    confidence: 72
    description: >
      params.swapData0 and params.swapData1 are passed verbatim to _routerSwap().
      The router address is extracted from swapData for UniversalRouter detection.
      A malicious owner could craft swapData that points to a malicious router contract
      while still passing the Swapper validation. If _routerSwap() doesn't validate
      the router address against a whitelist, arbitrary external calls are possible.
    affected_line: "LeverageTransformer.sol:65-80, Swapper.sol:_routerSwap"
    attack_scenario: >
      Owner crafts swapData with a malicious router address. _routerSwap() calls
      the malicious router with token approvals already set. Router drains the
      approved tokens (borrow proceeds) to attacker. Health check then fails →
      revert. No net gain for attacker IF revert propagates. Risk is if malicious
      router can keep tokens despite revert (non-reverting theft path).
    status: hypothesis
    solidity: |
      // INV-LT-A-02: swap router is from approved whitelist
      function invariant_leverageUp_approvedRouter() public {
          // router in swapData == zeroxAllowanceHolder || universalRouter
      }

  - id: LT-A-03
    title: "leverageDown: params.recipient validation gap for leftover after repay"
    tier: 2
    type: property
    confidence: 75
    description: >
      After repaying debt in leverageDown, excess tokens (amount - repayedAmount)
      are sent to params.recipient. No validation that recipient is position owner
      or authorized address. While only the NFT owner can initiate the call (via
      vault.transform() or directly), a UI bug or social engineering could trick
      an owner into specifying attacker's address as recipient.
    affected_line: "LeverageTransformer.sol:180-185"
    attack_scenario: >
      1. Attacker tricks victim into calling leverageDown with recipient = attacker address
      2. After repay, excess tokens (e.g., over-collected fees) go to attacker
      3. Victim's position is deleveraged (debt repaid) but excess value stolen
      Not a contract-level bug but an interface/UX vulnerability that may be reportable
      as a "funds can be sent to arbitrary address" finding.
    status: hypothesis
    solidity: |
      // INV-LT-A-03: recipient == NFT owner for all token transfers
      function invariant_leverageDown_recipientIsOwner() public {
          // params.recipient == nonfungiblePositionManager.ownerOf(params.tokenId)
      }

  - id: LT-A-04
    title: "leverageUp: insufficient health check — vault validates after, not during"
    tier: 3
    type: property
    confidence: 55
    description: >
      vault._requireLoanIsHealthy is called AFTER leverageUp completes. During leverageUp
      execution, the position is temporarily: (a) has extra debt (from borrow), (b) has
      original liquidity + new tokens. The intermediate state is unhealthy. If any
      callback during addLiquidity can read vault state (e.g., via oracle), it sees
      an unhealthy position. This could trigger automated liquidation bots that monitor
      health factor in real-time.
    affected_line: "V3Vault.sol:_transform() line 579"
    attack_scenario: >
      Automated liquidation bot monitors positions. During leverageUp execution (mid-tx),
      position shows as unhealthy (borrow done, liquidity not yet added). Bot calls
      liquidate() in same block (different tx). Position gets liquidated mid-leverage.
      Not possible in same tx (EVM sequential), but MEV bots monitoring next block
      could front-run the health restoration.
    status: low_priority
    solidity: |
      // NOTE: Single-transaction atomicity means this is not exploitable within one tx.
      // Multi-block concern only.

  - id: LT-A-05
    title: "leverageUp: dust token absorption via leftover sent to recipient"
    tier: 3
    type: property
    confidence: 50
    description: >
      After addLiquidity, any undeposited tokens (dust from rounding) are sent to
      params.recipient. In theory a malicious position owner could craft params to
      maximize dust extraction: borrow large amount, add minimal liquidity, extract
      large leftover. But vault._requireLoanIsHealthy(newTokenId, debt) catches
      this — if leftover extraction makes position unhealthy, the whole tx reverts.
    affected_line: "LeverageTransformer.sol:97-105"
    attack_scenario: >
      Constrained by vault health check. Not exploitable without passing health check.
      Health check uses oracle price, so as long as oracle is accurate, this is safe.
    status: low_priority
    solidity: |
      // Vault health check is the safeguard. No additional invariant needed.

  - id: LT-A-06
    title: "leverageDown: swap allowance cleanup — approve(0) not called after partial use"
    tier: 3
    type: property
    confidence: 45
    description: >
      Before swap, LeverageTransformer approves the router for the swap amount.
      After swap, if ERC20.approve(router, 0) is not explicitly called, residual
      allowance remains. On USDC/USDT (which have approval race conditions),
      this could theoretically be exploited if router is upgraded to malicious version.
      In practice, Foundry fork tests show allowance IS consumed during swap.
    affected_line: "LeverageTransformer.sol:160-170"
    attack_scenario: >
      Low risk. Only relevant with upgradeble routers and token-specific approval quirks.
    status: low_priority
    solidity: |
      // INV-LT-A-06: allowance == 0 after swap completion
      function invariant_approvalCleanup() public {
          // IERC20(token).allowance(address(this), router) == 0 after leverageDown
      }
