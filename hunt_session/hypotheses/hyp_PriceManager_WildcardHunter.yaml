    SafeCast.toUint256() revierte si answer < 0. Si answer == 0, price=0 y
    isValid=false. Si withValidation=true, se revierte con ZeroFeedData.
    El contrato maneja correctamente el caso de answer=0.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
