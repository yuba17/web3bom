    content: |
      SafeCast.toUint256() en Solidity 0.8 revierte para int256 < 0.
      No es necesario un check explícito de answer > 0 antes del cast si
      la intención es revertir en caso de precio negativo. Pero si la intención
      es un fallback graceful, se necesita try/catch o check previo.
