component: LeverageTransformer
hunter: FlowHunter
date: "2026-03-21"

invariants:
  - id: LT-F-01
    title: "leverageUp: CEI violation — external borrow call before internal state finalized"
    tier: 2
    type: property
    confidence: 60
    description: >
      leverageUp calls IVault(msg.sender).borrow() at line ~50 before internal amount tracking
      is fully resolved. The borrow triggers vault accounting changes. If any callback or
      reentrancy vector exists in the swap path, internal state could diverge from vault state.
      The vault's reentrancy guard (transformedTokenId check) mitigates this but doesn't
      eliminate the risk for external swapper callbacks.
    affected_line: "LeverageTransformer.sol:50-105"
    attack_scenario: >
      Attacker deploys malicious swapper contract that re-enters LeverageTransformer during
      _routerSwap callback. With transformedTokenId already set, vault re-entry is blocked,
      but cross-contract state manipulation is possible if swapper interacts with other protocols.
    status: hypothesis
    solidity: |
      // INV-LT-F-01: no state change possible during swap callback that affects this position
      function invariant_leverageUp_noReentryDuringSwap() public {
          // transformedTokenId should equal the current position ID during entire execution
      }

  - id: LT-F-02
    title: "leverageDown: partial repay silent failure — amount collected < borrow outstanding"
    tier: 2
    type: property
    confidence: 70
    description: >
      leverageDown calls decreaseLiquidity + collect to get tokens, then repays. If the
      collected amount (amount0/amount1 after swap) is less than params.debtShares value,
      the repay still succeeds partially — vault.repay() with insufficient funds just repays
      what's available. The position remains leveraged with outstanding debt. No revert,
      no event flagging partial repay. The user may think they fully deleveraged.
    affected_line: "LeverageTransformer.sol:110-185"
    attack_scenario: >
      Slippage during swap causes collected < required for full repay. User calls leverageDown
      expecting full deleveraging but vault only partially repays. Position remains at risk.
      Silent failure: tx succeeds, debt remains.
    status: hypothesis
    solidity: |
      // INV-LT-F-02: if params intent is full repay, vault debt after == 0
      function invariant_leverageDown_fullRepayIntent() public {
          // if params.debtShares == position's full debt, then after leverageDown debt == 0
      }

  - id: LT-F-03
    title: "leverageUp: same-token position (token0==token1) causes double-counting"
    tier: 3
    type: property
    confidence: 50
    description: >
      When token0 == token1 (unusual but theoretically possible with custom pools), the
      amount tracking in leverageUp uses both amount0 and amount1 variables tracking the
      same token. addLiquidity returns (added0, added1) both representing the same token.
      The leftover calculation may incorrectly double-count what was deposited.
    affected_line: "LeverageTransformer.sol:85-105"
    attack_scenario: >
      Edge case: token0 == token1. After addLiquidity, added0 and added1 both count toward
      the same token balance. Leftover sent to recipient may be under- or over-calculated.
    status: hypothesis
    solidity: |
      // INV-LT-F-03: token0 != token1 in all valid positions (precondition)
      function invariant_leverageUp_differentTokens() public {
          // token0 != token1 always for Uniswap V3 positions
      }

  - id: LT-F-04
    title: "leverageUp: stale deadline — block.timestamp can exceed params.deadline"
    tier: 2
    type: property
    confidence: 75
    description: >
      LeverageTransformer passes params.deadline to nonfungiblePositionManager.increaseLiquidity()
      and to the swap router. If a miner or validator delays the transaction, the deadline
      may have passed by execution time. This is the M-21 pattern from the Solodit context —
      deadline parameter should be block.timestamp for keeper-executed transactions, not a
      user-supplied value that may be stale. For leverageDown, same issue with collectParams.
    affected_line: "LeverageTransformer.sol:65, 153, 170"
    attack_scenario: >
      User submits leverageUp with params.deadline = block.timestamp + 1 hour. Transaction
      sits in mempool for >1 hour (network congestion). Transaction executes with stale
      deadline → Uniswap reverts with "Transaction too old". Permanent DoS for the user's
      leverageUp during congestion periods.
    status: hypothesis
    solidity: |
      // INV-LT-F-04: deadline >= block.timestamp at execution
      function invariant_leverageUp_deadlineNotStale() public {
          // params.deadline >= block.timestamp when function executes
      }

  - id: LT-F-05
    title: "leverageUp/Down: arbitrary recipient — leftover funds sent to any address"
    tier: 2
    type: property
    confidence: 80
    description: >
      In leverageUp (lines 97-105) and leverageDown (lines 180-185), leftover tokens
      are sent to params.recipient with no validation that recipient == position owner.
      A malicious caller with transform permissions could specify any recipient address.
      However, only the NFT owner can call transform() on the vault, so the practical
      risk is limited to: (a) owner accidentally sends to wrong address, or (b) if
      vault's _validateCaller has a gap that allows third-party callers.
    affected_line: "LeverageTransformer.sol:97-105, 180-185"
    attack_scenario: >
      If vault.transform() is callable by non-owner (approved operator, etc.), attacker
      could specify params.recipient = attacker address. Leftover borrowed tokens (from
      leverageUp) would flow to attacker. The borrow is against the NFT owner's collateral.
    status: hypothesis
    solidity: |
      // INV-LT-F-05: recipient is always the position owner
      function invariant_leverageUp_recipientIsOwner() public {
          // params.recipient == IERC721(npm).ownerOf(params.tokenId)
      }

  - id: LT-F-06
    title: "leverageDown: allowance not reset after failed swap"
    tier: 3
    type: property
    confidence: 55
    description: >
      Before calling _routerSwap, LeverageTransformer approves the router for the swap
      amount. If the swap fails (revert in swapper), the approval remains. On subsequent
      calls, the stale approval could be used by a compromised router. In practice,
      Solidity 0.8 reverts propagate, resetting state, so this is low risk.
    affected_line: "LeverageTransformer.sol:160-170"
    attack_scenario: >
      Unlikely in practice due to EVM state revert on failure. Only relevant if
      there's a non-reverting failure path in the swap router.
    status: hypothesis
    solidity: |
      // INV-LT-F-06: approval is always reset to 0 after swap (or never set if swap skipped)
      function invariant_leverageDown_approvalCleanup() public {
          // token.allowance(address(this), swapRouter) == 0 after leverageDown
      }

  - id: LT-F-07
    title: "leverageDown: amount tracking inconsistency when both swaps active"
    tier: 2
    type: property
    confidence: 65
    description: >
      leverageDown can swap both amount0 and amount1 to the debt token. The tracking
      uses `amount` (the running repayable total). After each swap, amount is increased
      by amountOut. But if one swap returns less than expected (high slippage) while
      the other returns more, the total `amount` may be incorrect. Combined with
      the repay(tokenId, amount, false) call, underpay could leave residual debt.
    affected_line: "LeverageTransformer.sol:155-175"
    attack_scenario: >
      Extreme slippage on one of two swaps causes actual repayable amount < params
      expected. Vault receives less than expected. Position's debt partially unpaid.
    status: hypothesis
    solidity: |
      // INV-LT-F-07: amount after swaps == actual token balance of contract before repay
      function invariant_leverageDown_amountMatchesBalance() public {
          // amount == IERC20(token).balanceOf(address(this)) before vault.repay()
      }
