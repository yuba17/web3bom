    int256 profit0 = int256(token0.balanceOf(attacker)) - int256(ghost_attackerInitial0);
    int256 profit1 = int256(token1.balanceOf(attacker)) - int256(ghost_attackerInitial1);
    // Convert to single metric using approximate price
