false_positives:
- hunter: DomainHunter
  id: BPM-FP-01
  reason: >
    The unchecked block in BinPool.swap() for amount conversion (line 135-137) is safe
    because the conditional guarantees the sign: if amountSpecified > 0 then uint128(positive)
    is valid, if < 0 then uint128(-negative) is valid (negating a negative int128 produces
    a positive value that fits in uint128). Not a bug.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: BPM-FP-02
  reason: >
    The donate() function uses accountAppBalanceDelta directly instead of
    accountAppDeltaWithHookDelta. This means donate hooks cannot return deltas. This is
    intentional — donate is a gift mechanism and should not have hook-mediated delta
    adjustments. Not a bug, but a design decision that differs from mint/burn/swap.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: BPM-FP-03
  reason: >
    burn() lacks whenNotPaused modifier while swap/mint/donate have it. This is by design —
    LPs must always be able to exit, even during emergencies. Standard pattern across
    DeFi protocols (Uniswap V4 does the same). The proportional share-based withdrawal
    means no price dependency, so paused-state value extraction is not a concern.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: DomainHunter
  id: BPM-FP-04
  reason: >
    MAX_LIQUIDITY_PER_BIN check in swap (line 178-184) could theoretically revert a swap
    if fees push a bin over the limit. But MAX_LIQUIDITY_PER_BIN is astronomically large
    (~6.5e70), so this is practically unreachable. The check is a safety net against
    accounting overflow, not a denial-of-service vector. Not a bug.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
