hunter: FlowHunter
component: Bridge (Base-Solana Bridge)
scope: Bridge.sol, BridgeValidator.sol, Twin.sol, CrossChainERC20.sol, CrossChainERC20Factory.sol, TokenLib.sol, MessageLib.sol, MessageStorageLib.sol, CallLib.sol, SVMBridgeLib.sol, SVMLib.sol, VerificationLib.sol, RelayerOrchestrator.sol, IPartner.sol
date: 2026-03-27
platform: Coinbase ($5M bounty)

# ============================================================
# STATE MACHINE MODEL
# ============================================================

state_machines:

  message_lifecycle:
    description: >
      Incoming messages (Solana->Base) go through: pre-validated -> relayed (success/failure) -> retry on failure.
      Outgoing messages (Base->Solana) go through: sendMessage -> MMR leaf appended -> root updated.
    states:
      - unvalidated: "Message hash not in BridgeValidator.validMessages"
      - pre_validated: "BridgeValidator.validMessages[hash] = true (set in registerMessages)"
      - relayed_success: "Bridge.successes[hash] = true, failures[hash] deleted"
      - relayed_failure: "Bridge.failures[hash] = true, successes[hash] still false"
    transitions:
      - from: unvalidated
        to: pre_validated
        trigger: "BridgeValidator.registerMessages() with valid signatures + nonce"
        guard: "signatures meet base + partner thresholds, nonce sequential"
      - from: pre_validated
        to: relayed_success
        trigger: "Bridge._validateAndRelay() -> this.__relayMessage() succeeds"
        guard: "successes[hash] == false, validMessages[hash] == true"
        effect: "successes[hash] = true, delete failures[hash]"
      - from: pre_validated
        to: relayed_failure
        trigger: "Bridge._validateAndRelay() -> this.__relayMessage() reverts"
        guard: "successes[hash] == false, validMessages[hash] == true"
        effect: "failures[hash] = true"
      - from: relayed_failure
        to: relayed_success
        trigger: "Bridge._validateAndRelay() called again (retry)"
        guard: "successes[hash] still false, validMessages[hash] still true"
        notes: >
          CONFIRMED: _validateAndRelay does NOT check failures[hash] before retrying.
          Messages that failed can be retried unlimited times. The gasLimit is baked
          into the IncomingMessage struct and thus into the messageHash, so a different
          gasLimit would produce a different hash — there is NO way to change the
          gasLimit for a failed message. The message must succeed within the original
          gasLimit or it's permanently stuck.
      - from: relayed_success
        to: "TERMINAL - no transition back"
        notes: >
          CONFIRMED: successes[hash] is only set to true, never to false.
          Once successful, _validateAndRelay returns early on `if (successes[messageHash]) return`.
          No path to replay a successful message.
    invariants:
      - "successes[hash] == true => message was executed exactly once"
      - "successes[hash] == true => failures[hash] == false (delete in catch block)"
      - "A message cannot go from success to any other state"
      - "gasLimit is immutable per messageHash (baked into hash via IncomingMessage struct)"

  token_lifecycle_outgoing:
    description: >
      Base->Solana token bridging: lock/burn tokens -> serialize message -> MMR leaf.
      Three paths: ETH (lock), CrossChainERC20 (burn), native ERC20 (lock).
    states:
      - idle: "No transfer in progress"
      - tokens_locked_or_burned: "initializeTransfer completed: tokens moved, deposits updated"
      - message_serialized: "SVMBridgeLib.serializeTransfer completed"
      - message_stored: "MessageStorageLib.sendMessage completed, MMR leaf added"
    transitions:
      - from: idle
        to: tokens_locked_or_burned
        trigger: "TokenLib.initializeTransfer()"
        paths:
          eth_path:
            guard: "localToken == ETH_ADDRESS, scalar != 0, msg.value == remoteAmount * scalar"
            effect: "ETH held by Bridge, deposits[ETH][remote] += localAmount"
          crosschain_erc20_path:
            guard: "isCrossChainErc20(localToken), remoteToken matches or bytes32(0)"
            effect: "CrossChainERC20.burn(msg.sender, remoteAmount) — NO deposits tracking"
          native_erc20_path:
            guard: "!isCrossChainErc20(localToken), scalar != 0, msg.value == 0"
            effect: "safeTransferFrom(sender -> bridge), deposits[local][remote] += localAmount, dust returned"
      - from: tokens_locked_or_burned
        to: message_serialized
        trigger: "SVMBridgeLib.serializeTransfer()"
        notes: "Pure function, cannot fail except OOM"
      - from: message_serialized
        to: message_stored
        trigger: "MessageStorageLib.sendMessage()"
        effect: "MMR leaf appended, root updated, nonce incremented, event emitted"
    invariants:
      - "All steps happen in same tx — if any step reverts, all revert (atomic)"
      - "deposits[local][remote] tracks locked ETH and native ERC20 balances"
      - "CrossChainERC20 burns are NOT tracked in deposits (mint/burn model, no custody)"
      - "For fee-on-transfer tokens: remoteAmount is adjusted IN MEMORY before serialization"

  token_lifecycle_incoming:
    description: >
      Solana->Base token delivery: validate message -> finalize transfer (unlock/mint).
    states:
      - validated: "Message in BridgeValidator.validMessages"
      - tokens_delivered: "finalizeTransfer completed"
    transitions:
      - from: validated
        to: tokens_delivered
        trigger: "TokenLib.finalizeTransfer() via __relayMessage"
        paths:
          eth_path:
            guard: "localToken == ETH_ADDRESS, scalar != 0"
            effect: "deposits[ETH][remote] -= localAmount, safeTransferETH(to, localAmount)"
          crosschain_erc20_path:
            guard: "isCrossChainErc20(localToken), remoteToken matches"
            effect: "CrossChainERC20.mint(to, remoteAmount)"
          native_erc20_path:
            guard: "!isCrossChainErc20(localToken), scalar != 0"
            effect: "deposits[local][remote] -= localAmount, safeTransfer(to, localAmount)"
    invariants:
      - "For custody tokens (ETH, native ERC20): withdraw <= deposits (underflow revert)"
      - "For CrossChainERC20: mint is unbounded by any on-chain tracking (Solana side controls)"

  twin_lifecycle:
    description: >
      Twin deployment is lazy — created on first Call/TransferAndCall from a Solana sender.
    states:
      - non_existent: "twins[sender] == address(0)"
      - deployed: "twins[sender] == deployed beacon proxy address"
    transitions:
      - from: non_existent
        to: deployed
        trigger: "__relayMessage with message.ty == Call or TransferAndCall, sender not REMOTE_BRIDGE"
        effect: "LibClone.deployDeterministicERC1967BeaconProxy(TWIN_BEACON, sender), twins[sender] = address"
    invariants:
      - "Once deployed, twins[sender] never changes (no re-deployment path)"
      - "Transfer messages SKIP twin logic entirely — no twin deployment needed"
      - "Twin address is deterministic: predictable from sender pubkey + beacon"
      - "All twins share same beacon — beacon upgrade affects ALL twins simultaneously"
      - "Twin.execute() authorized only for BRIDGE or self (Twin itself)"

# ============================================================
# HYPOTHESES
# ============================================================

hypotheses:

  - id: BRIDGE-FLOW-01
    title: "Reentrancy via this.__relayMessage external self-call bypassing ReentrancyGuardTransient"
    severity: critical
    confidence: 30
    status: investigating
    description: >
      Bridge.relayMessages -> _validateAndRelay -> this.__relayMessage{gas: message.gasLimit}(message).
      The `this.` syntax makes an EXTERNAL call to self. ReentrancyGuardTransient uses transient storage
      (EIP-1153) on all networks because _useTransientReentrancyGuardOnlyOnMainnet returns FALSE.

      The reentrancy guard is set in relayMessages (nonReentrant), and __relayMessage is an external
      function that does NOT have the nonReentrant modifier. However, __relayMessage enforces
      _assertSenderIsEntrypoint (msg.sender == address(this)).

      Attack vector: During __relayMessage execution, if Twin.execute makes a call back to
      Bridge.relayMessages (which has nonReentrant), it WOULD be blocked by the reentrancy guard.
      But what about Bridge.bridgeToken or Bridge.bridgeCall? Those also have nonReentrant.

      ANALYSIS: The `this.__relayMessage` call happens WITHIN the nonReentrant context of relayMessages.
      Since _useTransientReentrancyGuardOnlyOnMainnet returns false, transient storage guard is active
      on Base too. The guard is set before the for loop in relayMessages, and any callback to any
      nonReentrant function would hit the guard.

      HOWEVER: __relayMessage itself is NOT nonReentrant. If Twin.execute could somehow call
      Bridge.__relayMessage directly (passing _assertSenderIsEntrypoint), it would need
      msg.sender == address(Bridge). Twin cannot do this unless via delegatecall into Bridge...
      but Twin.execute supports DelegateCall type.
    attack_path:
      - "1. Attacker crafts a Solana message with type=Call targeting a Twin"
      - "2. The Call instructs Twin to delegatecall to some contract"
      - "3. That contract, executing in Twin context, calls Bridge.__relayMessage"
      - "4. But msg.sender would be Twin, not Bridge — _assertSenderIsEntrypoint fails"
      - "5. ALTERNATIVELY: Twin calls Bridge with CallType.Call — msg.sender = Twin, fails too"
    conclusion: >
      LIKELY SAFE. The _assertSenderIsEntrypoint check (msg.sender == address(this) where this = Bridge)
      prevents any external party from calling __relayMessage. Twin.execute with DelegateCall executes
      in Twin's context, so msg.sender for any call from Twin would be Twin, not Bridge.
      The nonReentrant on relayMessages/bridgeToken/bridgeCall blocks re-entry to those.
      No viable reentrancy path found, but the pattern of external self-call is unusual and warrants
      deeper verification.
    solidity: |
      // Bridge._validateAndRelay line 358:
      try this.__relayMessage{gas: message.gasLimit}(message) {
      // __relayMessage line 216:
      require(msg.sender == address(this), SenderIsNotEntrypoint());

  - id: BRIDGE-FLOW-02
    title: "TransferAndCall atomicity — Twin.execute revert loses tokens"
    severity: critical
    confidence: 15
    status: investigating
    description: >
      In __relayMessage for TransferAndCall (line 253-257):
        TokenLib.finalizeTransfer(...) — mints/unlocks tokens to Twin
        Twin(payable(twinAddress)).execute(call) — executes arbitrary call

      If Twin.execute reverts, does finalizeTransfer also revert?

      YES — because both calls are inside __relayMessage which is called via try/catch
      in _validateAndRelay (line 358). If __relayMessage reverts at any point, the
      entire call reverts (including the token transfer), and the message is marked as
      failed (failures[hash] = true).

      BUT: For the Transfer type (not TransferAndCall), tokens are minted/transferred
      directly to the `to` address (line 236-237). If `to` is a contract that reverts
      on receive (e.g., no receive/fallback for ETH, or revert in ERC20 transfer),
      the whole message reverts and is marked failed.

      KEY QUESTION: For TransferAndCall, the tokens go to... WHERE? Let me re-check.
      finalizeTransfer sends tokens to `address(bytes20(transfer.to))`. This is the `to`
      field of the Transfer struct, not the Twin address. So tokens go to transfer.to,
      then execute runs on Twin. If execute reverts, tokens were already sent BUT the
      entire __relayMessage reverts via the try/catch. So tokens are NOT lost.
    conclusion: >
      SAFE. The try/catch in _validateAndRelay ensures full atomicity. If any part of
      __relayMessage reverts, the entire state change (including token transfers) is rolled back.
      The message is marked as failure and can be retried.
    solidity: |
      // Bridge.__relayMessage lines 253-257:
      } else if (message.ty == MessageType.TransferAndCall) {
          (Transfer memory transfer, Call memory call) = abi.decode(message.data, (Transfer, Call));
          TokenLib.finalizeTransfer({transfer: transfer, crossChainErc20Factory: CROSS_CHAIN_ERC20_FACTORY});
          Twin(payable(twinAddress)).execute(call);
      }

  - id: BRIDGE-FLOW-03
    title: "Failed message retry with baked-in gasLimit — permanent fund lock"
    severity: high
    confidence: 60
    status: investigating
    description: >
      When a message fails (failures[hash] = true), it can be retried by calling
      relayMessages again with the same message. The _validateAndRelay function only
      checks `successes[messageHash]`, not `failures[messageHash]`.

      HOWEVER: the gasLimit is part of the IncomingMessage struct, which determines the
      messageHash. There is NO mechanism to change the gasLimit for a failed message.
      The message must be re-submitted with the EXACT same parameters (including gasLimit)
      to produce the same messageHash.

      If a message fails because gasLimit was too low (e.g., complex ERC20 with hooks,
      or gas costs increased due to EIP changes), there is NO path to retry with higher gas.
      A new message with different gasLimit would produce a different hash, which would
      need to be pre-validated again by validators.

      IMPACT: For Transfer messages, tokens were sent from Solana but cannot be delivered
      on Base. Tokens are effectively locked on the Solana side. The bridge validators could
      potentially register a new message with higher gasLimit, but this requires the Solana
      side to create a new OutgoingMessage.

      MITIGATING FACTOR: The gasLimit is set by the sender on Solana. If they set it too low,
      it's user error. But gas costs can increase over time (e.g., state growth, EVM upgrades).
      Also, the message.gasLimit is forwarded as the gas stipend to __relayMessage, and the
      relayer must provide enough gas in the outer tx. If the relayer provides enough outer gas
      but message.gasLimit is too low, the internal call fails.
    attack_path:
      - "1. User bridges tokens from Solana with gasLimit=X"
      - "2. Validators register the message on Base"
      - "3. Relayer calls relayMessages — __relayMessage runs with gas=X"
      - "4. Execution needs more than X gas (e.g., token with hooks, or gas repricing)"
      - "5. __relayMessage reverts, failures[hash] = true"
      - "6. Any retry with same message will also fail (same gasLimit)"
      - "7. New message with higher gasLimit needs new Solana OutgoingMessage + new validation"
      - "8. If Solana side doesn't support re-sending, funds are permanently locked"
    conclusion: >
      DESIGN CONCERN rather than exploitable bug. This is inherent to any bridge with
      pre-committed gas limits. The severity depends on whether the Solana side supports
      re-creating failed messages with updated gasLimit. If not, this is a real fund-lock risk.
      Worth reporting as Medium if the Solana side doesn't have a recovery mechanism.
    solidity: |
      // gasLimit is part of IncomingMessage and thus part of the hash:
      struct IncomingMessage {
          Pubkey outgoingMessagePubkey;
          uint64 nonce;
          Pubkey sender;
          uint64 gasLimit;  // <-- baked into messageHash
          MessageType ty;
          bytes data;
      }
      // _validateAndRelay line 358:
      try this.__relayMessage{gas: message.gasLimit}(message) {

  - id: BRIDGE-FLOW-04
    title: "Twin beacon upgrade drains all Twin-held assets"
    severity: high
    confidence: 40
    status: investigating
    description: >
      All Twin contracts are deployed as ERC-1967 beacon proxies pointing to TWIN_BEACON.
      The beacon owner can upgrade the implementation, affecting ALL twins simultaneously.

      If the beacon is upgraded to a malicious implementation, all assets held by any Twin
      (ETH, ERC20s, NFTs) can be drained in a single transaction.

      This is a TRUST ASSUMPTION, not a bug per se. But:
      1. The TWIN_BEACON is immutable in Bridge (set in constructor) — good
      2. But the beacon itself is upgradeable by its owner
      3. Bridge.owner() can set guardians but cannot change TWIN_BEACON

      For TransferAndCall: tokens are sent to transfer.to (which could be the Twin address
      or another address), then execute runs on the Twin. If tokens are sent to the Twin,
      a malicious beacon upgrade could steal them.

      ADDITIONALLY: Twin supports DelegateCall. A beacon upgrade could add a sweepAll()
      function that delegatecalls to drain tokens.
    conclusion: >
      TRUST ASSUMPTION — the beacon owner is a trusted party. This is standard for
      upgradeable beacon pattern. Not a bug but worth noting as a centralization risk.
      In bug bounty context, likely out of scope as admin privilege.
    solidity: |
      // Bridge.sol line 39:
      address public immutable TWIN_BEACON;
      // Twin deployment at line 244:
      twinAddress = LibClone.deployDeterministicERC1967BeaconProxy({
          beacon: TWIN_BEACON, salt: Pubkey.unwrap(message.sender)
      });

  - id: BRIDGE-FLOW-05
    title: "CrossChainERC20 mint unbounded by deposits — Solana-side trust"
    severity: medium
    confidence: 35
    status: investigating
    description: >
      For CrossChainERC20 tokens (wrapped Solana tokens on Base), the mint path in
      finalizeTransfer does NOT check any deposits mapping. It simply mints
      `transfer.remoteAmount` tokens to the recipient.

      This is by design (burn/mint model vs lock/unlock), but the invariant is:
      "Total minted on Base <= Total burned on Solana (for each token pair)"

      This invariant is enforced ONLY by the validator set. If validators are compromised
      or collude, they can register arbitrary messages that mint unlimited CrossChainERC20 tokens.

      For the lock/unlock path (native ETH/ERC20), there IS a deposits check:
      `deposits[local][remote] -= localAmount` would underflow-revert if trying to unlock
      more than deposited. This provides a hard on-chain bound.

      ASYMMETRY: Lock/unlock tokens have on-chain safety bounds. Mint/burn tokens rely
      entirely on validator honesty.
    conclusion: >
      DESIGN PATTERN, not a bug. The mint/burn model inherently trusts the source chain
      and validator set. The deposits mapping protects lock/unlock tokens from over-withdrawal.
      This asymmetry is standard for bridges but worth verifying the validator threshold is
      sufficiently high.
    solidity: |
      // finalizeTransfer for CrossChainERC20 (no deposits check):
      localAmount = transfer.remoteAmount;
      CrossChainERC20(transfer.localToken).mint({to: to, amount: localAmount});
      // vs native ERC20 (deposits check):
      localAmount = transfer.remoteAmount * scalar;
      $.deposits[transfer.localToken][transfer.remoteToken] -= localAmount; // underflow protection

  - id: BRIDGE-FLOW-06
    title: "registerRemoteToken has no access control — arbitrary scalar injection"
    severity: critical
    confidence: 65
    status: investigating
    description: >
      TokenLib.registerRemoteToken() is called from __relayMessage when message.sender == REMOTE_BRIDGE.
      It sets: scalars[localToken][remoteToken] = 10 ** scalarExponent

      There is NO check that a scalar already exists. A second registerRemoteToken call for the
      same (localToken, remoteToken) pair OVERWRITES the scalar.

      Attack scenario:
      1. Token pair (USDC, SOL_USDC) is registered with scalar = 10^12 (6 decimals ERC20, 6 decimals SPL)
      2. Users deposit USDC: deposits[USDC][SOL_USDC] = 1_000_000e6 (1M USDC locked)
      3. Validators process a new registerRemoteToken for (USDC, SOL_USDC) with scalarExponent = 0
         → scalar becomes 1 (was 10^12)
      4. Now finalizeTransfer computes localAmount = remoteAmount * 1 instead of remoteAmount * 10^12
      5. Withdrawals return dust amounts (e.g., 1 wei per 1 remote unit instead of 10^12 wei)
      6. Deposited USDC is permanently locked — withdrawals drastically under-pay

      ALTERNATIVELY: scalar increased to steal more:
      1. Set scalar higher → each remote unit unlocks more local tokens
      2. But deposits underflow would eventually revert

      HOWEVER: This requires the VALIDATORS to sign a malicious registerRemoteToken message
      claiming to be from REMOTE_BRIDGE. The trust model puts this in admin/validator trust.

      But what about the Solana side? If the Solana bridge program can send registerRemoteToken
      messages, and there's a vulnerability on the Solana side that lets someone trigger this...
    conclusion: >
      The registerRemoteToken path is gated by message.sender == REMOTE_BRIDGE, which is
      the Solana bridge program itself. Only the Solana bridge can trigger this, and only
      if validators sign the message. The scalar overwrite is a design concern — no protection
      against re-registration. If the Solana bridge or validators are compromised, scalar
      manipulation could lock/steal deposited tokens. Worth reporting as Medium centralization risk.
    solidity: |
      // Bridge.__relayMessage lines 222-231:
      if (message.sender == REMOTE_BRIDGE) {
          Call memory call = abi.decode(message.data, (Call));
          (address localToken, Pubkey remoteToken, uint8 scalarExponent) =
              abi.decode(call.data, (address, Pubkey, uint8));
          TokenLib.registerRemoteToken({
              localToken: localToken, remoteToken: remoteToken, scalarExponent: scalarExponent
          });
          return;
      }
      // TokenLib.registerRemoteToken — NO existing scalar check:
      function registerRemoteToken(address localToken, Pubkey remoteToken, uint8 scalarExponent) internal {
          TokenLibStorage storage $ = getTokenLibStorage();
          $.scalars[localToken][remoteToken] = 10 ** scalarExponent;  // OVERWRITES existing
      }

  - id: BRIDGE-FLOW-07
    title: "Fee-on-transfer token dust rounding allows tiny value extraction per tx"
    severity: low
    confidence: 45
    status: investigating
    description: >
      In initializeTransfer for native ERC20 path (lines 176-208):
      1. transferLocalAmount = remoteAmount * scalar
      2. safeTransferFrom(sender, bridge, transferLocalAmount)
      3. receivedLocalAmount = balanceAfter - balanceBefore (accounts for fee)
      4. receivedRemoteAmount = receivedLocalAmount / scalar (truncating division)
      5. localAmount = receivedRemoteAmount * scalar
      6. dust = receivedLocalAmount - localAmount → returned to sender

      The truncating division at step 4 means: receivedLocalAmount % scalar is lost.
      Wait no — step 6 returns the dust. So dust = receivedLocalAmount - (receivedRemoteAmount * scalar).
      That equals receivedLocalAmount % scalar, which is returned to sender.

      Actually this is CORRECT. The dust is returned. No value extracted.

      But what about the deposits tracking?
      deposits += localAmount = receivedRemoteAmount * scalar

      And on withdrawal: deposits -= remoteAmount * scalar

      The amount bridged (remoteAmount in the message) is receivedRemoteAmount (step 4).
      On the Solana side, the user receives receivedRemoteAmount tokens.
      When bridging back, the message contains remoteAmount = receivedRemoteAmount.
      finalizeTransfer: localAmount = remoteAmount * scalar = receivedRemoteAmount * scalar
      deposits -= localAmount. This matches what was added.
    conclusion: >
      SAFE. The dust handling is correct. Truncated amounts are returned to sender,
      and deposits tracking is consistent with the actual remoteAmount bridged.
    solidity: |
      // TokenLib.initializeTransfer native ERC20 path:
      uint256 receivedRemoteAmount = receivedLocalAmount / scalar;
      localAmount = receivedRemoteAmount * scalar;
      uint256 dust = receivedLocalAmount - localAmount;
      if (dust > 0) {
          SafeTransferLib.safeTransfer({token: transfer.localToken, to: msg.sender, amount: dust});
      }
      transfer.remoteAmount = SafeCastLib.toUint64(receivedRemoteAmount);

  - id: BRIDGE-FLOW-08
    title: "Transfer to address(0) via truncated bytes32 in finalizeTransfer"
    severity: medium
    confidence: 50
    status: investigating
    description: >
      In TokenLib.finalizeTransfer line 227:
        address to = address(bytes20(transfer.to));

      This takes the FIRST 20 bytes of the 32-byte `to` field. If the Solana side encodes
      an EVM address in the wrong position (e.g., right-padded instead of left-padded),
      `to` could become address(0) or a wrong address.

      For CrossChainERC20.mint: there's a check `require(to != address(0), MintToZeroAddress())`.
      For SafeTransferLib.safeTransferETH and safeTransfer: sending to address(0) would succeed
      (safeTransferLib typically doesn't check for zero address).

      However, if to == address(0):
      - ETH sent to address(0) is burned (no receive function)
      - ERC20 sent to address(0) depends on token implementation

      WAIT: Let me re-check. SafeTransferLib.safeTransferETH uses low-level call.
      Sending ETH to address(0) would likely succeed (empty account receives ETH).
      That ETH would be permanently lost.

      But deposits[local][remote] was already decremented, so the accounting is correct —
      the bridge doesn't owe those tokens anymore. The loss is on the user who provided
      a wrong `to` address from Solana.

      The real question: can a Solana sender manipulate `to` to be address(0) to
      unlock tokens from deposits without actually delivering them to anyone useful?
      No — the tokens are still delivered (just to address(0)), and deposits are decremented.
      The sender loses their tokens. No profit vector.
    conclusion: >
      LOW RISK. Sending to address(0) would lose the user's funds but there's no exploit.
      The Solana side should validate the `to` field. The EVM side does check for address(0)
      on mint (CrossChainERC20) but not on safeTransfer/safeTransferETH. This is user error,
      not a vulnerability.
    solidity: |
      // TokenLib.finalizeTransfer line 227:
      address to = address(bytes20(transfer.to));
      // ETH path — no address(0) check:
      SafeTransferLib.safeTransferETH({to: to, amount: localAmount});
      // CrossChainERC20 path — HAS address(0) check:
      CrossChainERC20(transfer.localToken).mint({to: to, amount: localAmount});

  - id: BRIDGE-FLOW-09
    title: "Twin DelegateCall can manipulate Twin storage to steal held assets"
    severity: high
    confidence: 50
    status: investigating
    description: >
      Twin.execute supports CallType.DelegateCall, which runs arbitrary code in the Twin's
      storage context. A Solana user can instruct their Twin to delegatecall to ANY address.

      This is BY DESIGN — the Twin is the Solana user's "representative" on Base. They have
      full control over it. But consider:

      1. Twin is an ERC-1967 beacon proxy
      2. DelegateCall in the proxy context can overwrite proxy storage slots
      3. Specifically, it could overwrite the beacon pointer (ERC-1967 slot)
      4. This would brick the Twin or redirect it to a malicious implementation

      But this only affects the Solana user's OWN Twin. They're only hurting themselves.

      HOWEVER: What if another user has sent tokens to a Twin address (e.g., via direct
      transfer, or airdrop)? The Twin owner could delegatecall to steal those tokens.
      Again, the Twin owner has full control — this is expected behavior.

      MORE INTERESTING: Could a delegatecall from Twin affect Bridge storage?
      No — delegatecall runs in Twin's context, not Bridge's. msg.sender inside the
      delegatecalled code would be Bridge (since Bridge called Twin.execute), but
      storage modifications would be to Twin's storage, not Bridge's.
    conclusion: >
      BY DESIGN. Twin owners have full control over their Twin via DelegateCall.
      This cannot affect Bridge or other users' Twins. Each Twin's storage is isolated.
    solidity: |
      // Twin.execute with DelegateCall:
      } else if (call.ty == CallType.DelegateCall) {
          require(call.value == 0, DelegateCallCannotHaveValue());
          (bool success, bytes memory result) = call.to.delegatecall(call.data);
          require(success, string(result));
