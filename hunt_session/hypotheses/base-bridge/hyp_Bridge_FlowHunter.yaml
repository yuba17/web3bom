  - id: BRIDGE-FLOW-10
    title: "Deposit overflow protection — CumulativeDepositExceedsU64 can lock bridge for a token pair"
    severity: medium
    confidence: 40
    status: investigating
    description: >
      _addToDeposits checks: `require(newDeposits / scalar <= type(uint64).max)`.

      If cumulative deposits for a token pair approach uint64.max * scalar, further
      deposits are blocked. This is a safety check to prevent Solana-side overflow
      (Solana uses u64 for token amounts).

      But this means an attacker could intentionally deposit a large amount of a
      low-value token to hit the uint64 cap, blocking legitimate users from bridging
      that token pair.

      COST: The attacker must actually deposit real tokens. For high-scalar pairs
      (e.g., scalar = 10^12), the maximum deposit in local units is:
      uint64.max * 10^12 = 18.4 * 10^18 * 10^12 = 18.4 * 10^30 wei ≈ 18.4 * 10^12 ETH

      This is unrealistically large for ETH. For low-value tokens, it might be feasible
      but the attacker locks their own capital. Not a realistic attack.
    conclusion: >
      NOT EXPLOITABLE in practice. The uint64 cap requires astronomically large deposits
      for typical scalars. For edge-case tokens with very low scalar (scalar=1), the cap
      is uint64.max ≈ 18.4 * 10^18 wei, which is still ~18 ETH worth. Low severity DoS
      only for very specific token configurations.
    solidity: |
      function _addToDeposits(...) private {
          uint256 newDeposits = $.deposits[localToken][remoteToken] + additionalLocalAmount;
          require(newDeposits / scalar <= type(uint64).max, CumulativeDepositExceedsU64());
          $.deposits[localToken][remoteToken] = newDeposits;
      }

  - id: BRIDGE-FLOW-11
    title: "BridgeValidator nonce sequentiality — single failed batch bricks all subsequent messages"
    severity: high
    confidence: 55
    status: investigating
    description: >
      BridgeValidator.registerMessages requires sequential nonces starting from nextNonce.
      The nonce is incremented AFTER all messages in a batch are processed (line 195).

      If a batch of N messages is registered, nonces are assigned as [nextNonce, nextNonce+1, ..., nextNonce+N-1].
      The messageHash is computed from (nonce, outgoingMessagePubkey, innerMessageHash).

      CRITICAL OBSERVATION: The nonces assigned here (in BridgeValidator) must match the nonces
      in the IncomingMessage structs that will be passed to Bridge.relayMessages. But the
      IncomingMessage struct has its own `nonce` field (line 27 of MessageLib.sol).

      Wait — let me re-read. In MessageLib.getMessageHash (used by Bridge.getMessageHash):
        hash = EfficientHashLib.hash(bytes32(nonce), Pubkey.unwrap(outgoingMessagePubkey), innerMessageHash)

      And in BridgeValidator.registerMessages:
        messageHashes[i] = MessageLib.getMessageHash(currentNonce++, signedMessages[i].outgoingMessagePubkey, signedMessages[i].innerMessageHash)

      So the nonce in the Bridge's IncomingMessage.nonce MUST equal the currentNonce assigned
      during registerMessages for the hashes to match.

      If the off-chain system gets nonces wrong (e.g., processes messages out of order),
      the hashes won't match and messages will be rejected by Bridge._validateAndRelay
      (BridgeValidator.validMessages check).

      This is a liveness concern, not a security issue. If the nonce sequence gets stuck
      (e.g., one message can't be validated), ALL subsequent messages are blocked until
      the stuck one is resolved, because nextNonce only advances sequentially.
    conclusion: >
      LIVENESS CONCERN. Sequential nonce requirement means a single problematic message
      can block the entire pipeline. This is a design tradeoff for replay protection vs
      availability. Worth noting but not a funds-at-risk vulnerability.
    solidity: |
      // BridgeValidator.registerMessages:
      uint256 currentNonce = nextNonce;
      for (uint256 i; i < len; i++) {
          messageHashes[i] = MessageLib.getMessageHash(
              currentNonce++, signedMessages[i].outgoingMessagePubkey, signedMessages[i].innerMessageHash
          );
      }
      // ... validation ...
      nextNonce = currentNonce;  // Only advances after successful batch

  - id: BRIDGE-FLOW-12
    title: "relayMessages processes multiple messages — partial execution with mixed success/failure"
    severity: medium
    confidence: 35
    status: investigating
    description: >
      Bridge.relayMessages iterates over all messages in the array. For each message,
      _validateAndRelay is called. If one message succeeds and the next fails, the
      successful one is permanently committed (successes[hash] = true) while the
      failed one is marked for retry (failures[hash] = true).

      This is correct behavior. But consider: a relayer can intentionally order messages
      to front-run or back-run specific messages. For example:

      1. Message A: Transfer 100 tokens to User
      2. Message B: registerRemoteToken changing scalar

      If processed in order A then B, user gets tokens at old scalar.
      If B is processed first (in a previous batch), then A uses new scalar.

      But registerRemoteToken messages come from REMOTE_BRIDGE and would have their own
      nonce/hash. The ordering depends on the order the validators register them.

      The relayer has freedom to choose which pre-validated messages to relay and in what order.
      But each message is independent — its effect is determined by its contents, not its
      position relative to other messages (except for scalar changes).
    conclusion: >
      ORDERING CONCERN. A malicious relayer could strategically order registerRemoteToken
      messages to affect subsequent transfers. But this requires validator complicity (they
      must register the messages) and the scalar change itself requires REMOTE_BRIDGE authority.
      Low practical risk.
    solidity: |
      function relayMessages(IncomingMessage[] calldata messages) external nonReentrant whenNotPaused {
          for (uint256 i; i < messages.length; i++) {
              _validateAndRelay(messages[i]);
          }
      }

  - id: BRIDGE-FLOW-13
    title: "nextNonce overflow in MessageStorageLib — unchecked increment"
    severity: low
    confidence: 20
    status: investigating
    description: >
      MessageStorageLib.sendMessage (line 158):
        unchecked { ++$.nextNonce; }

      nextNonce is uint64, max value 2^64 - 1 ≈ 1.8 * 10^19.
      With unchecked increment, at 2^64 - 1 it wraps to 0.

      At 1 message per block (2 seconds on Base), reaching overflow takes:
      2^64 / (365.25 * 24 * 3600 / 2) ≈ 1.17 * 10^12 years.

      Not a practical concern.
    conclusion: >
      NOT EXPLOITABLE. Nonce overflow would take over a trillion years at maximum throughput.
    solidity: |
      unchecked { ++$.nextNonce; }

  - id: BRIDGE-FLOW-14
    title: "Transfer type skips Twin — tokens sent to arbitrary address without Twin deployment"
    severity: info
    confidence: 90
    status: confirmed_safe
    description: >
      In __relayMessage (line 235-239), Transfer type messages bypass the Twin mechanism
      entirely. Tokens are sent directly to `address(bytes20(transfer.to))`.

      This means:
      1. No Twin is deployed for simple transfers (gas saving)
      2. The recipient can be ANY EVM address, not just a Twin
      3. The sender on Solana can send tokens to anyone on Base

      This is correct and by design. The comment on line 233 confirms it:
      "For simple transfers, skip the twin logic."

      HOWEVER: This means for Transfer type, there's no "execute" step.
      For TransferAndCall, tokens go to transfer.to AND execute runs on Twin.
      The Twin is determined by message.sender (Solana sender), not by transfer.to.
      So tokens go to one address and execution happens on another (the Twin).

      Is there a confusion vector? Could someone expect tokens to go to the Twin
      but they go to transfer.to instead? The Solana side must set transfer.to correctly.
    conclusion: >
      BY DESIGN. Transfer type sends tokens directly to transfer.to without Twin.
      TransferAndCall sends tokens to transfer.to AND executes on the sender's Twin.
      No confusion vector on the EVM side — the Solana side must encode correctly.

  - id: BRIDGE-FLOW-15
    title: "Scalar of 0 blocks finalization — tokens locked on Solana permanently"
    severity: medium
    confidence: 40
    status: investigating
    description: >
      In finalizeTransfer for ETH and native ERC20 paths:
        uint256 scalar = $.scalars[transfer.localToken][transfer.remoteToken];
        require(scalar != 0, WrappedSplRouteNotRegistered());

      If a scalar is set to 0 (or was never registered), finalization reverts.
      This means tokens bridged from Solana to Base cannot be delivered.

      The scalar is set by registerRemoteToken(localToken, remoteToken, scalarExponent)
      where scalar = 10 ** scalarExponent. Since scalarExponent is uint8, min value is 0,
      giving scalar = 10^0 = 1. So scalar can never be 0 via normal registration.

      BUT: What if a scalar was registered and then a bug or state corruption sets it to 0?
      Or what if the token pair was never registered but tokens are somehow bridged?
      The Solana side should prevent bridging unregistered token pairs. If it doesn't,
      tokens could be locked.

      Also: registerRemoteToken OVERWRITES. If called with scalarExponent=0, scalar becomes 1 (not 0).
      There's no way to set scalar to 0 through the normal path.
    conclusion: >
      SAFE by normal paths. scalar = 10 ** scalarExponent >= 1 always. The require(scalar != 0)
      protects against unregistered pairs. Registration requires REMOTE_BRIDGE authority.
      No path to set scalar to 0 through normal code flow.

