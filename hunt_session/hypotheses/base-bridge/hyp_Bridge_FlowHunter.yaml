      message: "MMR leaf with Sol or Spl type"
    native_erc20_path:
      lock: "safeTransferFrom(sender, bridge, amount) — tokens held by Bridge"
      accounting: "deposits[localToken][remoteToken] += localAmount"
      message: "MMR leaf with WrappedToken type"

  incoming_solana_to_base:
    eth_path:
      unlock: "safeTransferETH(to, localAmount)"
      accounting: "deposits[ETH_ADDRESS][remoteToken] -= localAmount (underflow reverts)"
    crosschain_erc20_path:
      unlock: "CrossChainERC20.mint(to, remoteAmount) — tokens created"
      accounting: "NO deposits tracking (burn/mint model)"
    native_erc20_path:
      unlock: "safeTransfer(localToken, to, localAmount)"
      accounting: "deposits[localToken][remoteToken] -= localAmount (underflow reverts)"

  invariants:
    - "For lock/unlock tokens: sum(deposits) == sum(locked_in_bridge) at all times"
    - "For lock/unlock tokens: total_unlocked <= total_locked (deposits underflow protection)"
    - "For burn/mint tokens: total_minted_on_base <= total_burned_on_solana (off-chain invariant, no on-chain enforcement)"
    - "All token movements are atomic within their respective transactions"
    - "No token can be locked without a corresponding MMR message (same tx atomicity)"
    - "No token can be unlocked without a pre-validated message hash (BridgeValidator)"

