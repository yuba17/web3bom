    - BR-W-03 — Commutative MMR hashing may allow proof forgery (High, needs Solana verification)
    - BR-W-04 — bytes32-to-address truncation may burn funds (Critical, needs Solana verification)
    - BR-W-08 — Insufficient gasLimit makes messages permanently stuck (Medium, liveness issue)
    - BR-W-10 — Scalar re-registration desynchronizes deposits (High, needs Solana verification)
    - BR-W-13 — No chain ID in message hash enables cross-chain replay (Medium, deployment-dependent)
  safe:
