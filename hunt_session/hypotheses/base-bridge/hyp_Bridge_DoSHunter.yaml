# H5: MMR storage growth — unbounded $.nodes array
#######################################################################
- id: BRG-D-05
  tier: 1
  type: property
  description: >
    MessageStorageLib.sendMessage appends to $.nodes (unbounded array) on every
    outgoing message. The array grows as O(2N) for N leaves (leaves + internal nodes).
    After millions of messages, storage and proof generation become increasingly expensive.
  attack_scenario: >
    MessageStorageLib._appendLeafToMmr (line 184-200):
      $.nodes.push(leafHash);
      _createParentNodes(newLeafNodeIndex, originalLeafCount);
    For each leaf, 1 node is pushed. Then _createParentNodes pushes 0 to log2(N)
    additional nodes depending on binary representation. Total nodes after N leaves
    is approximately 2N - popcount(N).

    sendMessage is called from bridgeCall and bridgeToken. Both require msg.sender to
    be a real user paying gas. So the cost of growing the array is borne by senders.

    generateProof (line 101-145) is a VIEW function. It does O(log N) SLOADs to build
    the proof. At N = 2^32 (~4 billion messages), this is ~32 SLOADs — totally fine.
    At N = 2^64 (uint64 max), ~64 SLOADs — still fine for a view function.

    The _calculateRoot function called during sendMessage also does O(log N) SLOADs
    to bag the peaks. But with warm slots (just written), this is cheap.

    REAL CONCERN: The $.nodes array length is a uint256 slot. After 2^63 messages,
    the nextNonce (uint64) wraps. But the nodes array keeps growing. Actually,
    nextNonce is uint64, so max ~18.4 quintillion messages. Nodes array would be
    ~36.8 quintillion entries — impossible to fill in practice.

    VERDICT: Theoretically unbounded but practically limited by uint64 nonce and
    the economic cost of sending messages (each costs gas). Not a real DoS vector.
    generateProof cost grows logarithmically, not linearly.
  impact: "Theoretical — proof generation cost grows O(log N), negligible in practice"
  impact_rating: Informational
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify MMR growth is bounded by O(2N)
