#######################################################################
# H1: gasLimit NOT in hash — retryable by design (MITIGATED)
#######################################################################
- id: BRG-D-01
  tier: 2
  type: property
  description: >
    gasLimit is excluded from IncomingMessage hash — messages are retryable with different gasLimit.
    Verify this property holds: a message that fails with low gasLimit can always be retried with higher gasLimit.
  attack_scenario: >
    The Solana sender sets gasLimit in the IncomingMessage struct. The message hash is
    computed from (nonce, outgoingMessagePubkey, keccak256(sender, ty, data)) — gasLimit
    is INTENTIONALLY excluded (MessageLib.sol lines 50-51). This means:
    1. If a message fails due to insufficient gasLimit, failures[hash] = true
    2. Anyone can resubmit the same message with a higher gasLimit value
    3. On success, successes[hash] = true and failures[hash] is deleted
    This is a GOOD design. However, we must verify there's no edge case where a
    malicious front-runner repeatedly relays with gasLimit=1 to waste validator gas
    and create noise. Each failed attempt costs the relayer gas but marks the message
    as failed — the next relayer with correct gasLimit still succeeds.
    VERDICT: No permanent DoS. Design is correct. Marking as MITIGATED.
  impact: "None — messages are always retryable"
  impact_rating: Informational
  likelihood: N/A
  severity_final: null
  solidity: |
    // Verify gasLimit is not in hash
    IncomingMessage memory msg1 = IncomingMessage({
        outgoingMessagePubkey: pubkey,
        nonce: 1,
        sender: sender,
        gasLimit: 100_000,  // low
        ty: MessageType.Transfer,
        data: transferData
    });
    IncomingMessage memory msg2 = msg1;
    msg2.gasLimit = 500_000;  // high
    bytes32 h1 = MessageLib.getMessageHash(msg1);
    bytes32 h2 = MessageLib.getMessageHash(msg2);
    eq(h1, h2, "BRG-D-01: same hash regardless of gasLimit");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: >
    Confirmed by reading MessageLib.sol: getInnerMessageHash hashes (sender, ty, data).
    getMessageHash hashes (nonce, outgoingMessagePubkey, innerMessageHash). gasLimit nowhere.
    This is intentional and correct design for retryability.
  poc_sketch: ""

