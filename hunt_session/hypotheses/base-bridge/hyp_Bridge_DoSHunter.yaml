# H3: BridgeValidator sequential nonce — validator censorship vector
#######################################################################
- id: BRG-D-03
  tier: 1
  type: property
  description: >
    BridgeValidator.registerMessages uses strictly sequential nonces. If validators
    refuse to sign message at nonce N, ALL subsequent messages (N+1, N+2, ...) are
    permanently blocked until nonce N is registered.
  attack_scenario: >
    BridgeValidator.registerMessages (line 172-196):
      uint256 currentNonce = nextNonce;
      for (i) { messageHashes[i] = MessageLib.getMessageHash(currentNonce++, ...); }
      nextNonce = currentNonce;
    The nonce MUST be consecutive. If validators collude to NOT sign message N:
    1. nextNonce stays at N
    2. Message N+1 cannot be registered because the validator set signs over
       messageHashes computed with nonces starting from nextNonce
    3. Even if validators sign N+1, registerMessages computes hashes using
       currentNonce = nextNonce = N, so the hashes won't match the signatures
    4. ALL cross-chain communication is halted

    This is a CENSORSHIP vector. In Stage 0 (current), validators are trusted.
    But the trust model means:
    - A single compromised validator quorum can halt the bridge
    - The base threshold + partner threshold must BOTH be met
    - If partnerValidatorThreshold > 0 and partner refuses, bridge halts

    IMPORTANT: There is NO skip mechanism, NO admin override for nonces, and NO
    way to force-register a message without validator signatures. The only recovery
    is deploying a new BridgeValidator contract.
  impact: "Complete bridge halt — all Solana→Base messages blocked permanently"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify nonce gap blocks all subsequent messages
    uint256 nonceBefore = bridgeValidator.nextNonce();
    // Skip registering message at nonce N
    // Try to register message at nonce N+1 — should fail because
    // registerMessages computes hash with nextNonce (= N), not N+1
    // The computed hash won't match the validators' signatures over N+1
    eq(bridgeValidator.nextNonce(), nonceBefore, "BRG-D-03: nonce didn't advance");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 90
  notes: >
    This is inherent to Stage 0 trust model. The validators ARE the trust anchor.
    However, the lack of an admin emergency mechanism to skip/force nonces is worth
    noting. If one message is contentious (e.g., a sanctioned address), the validators
    must still sign it or the entire bridge halts. There's no selective censorship —
    it's all or nothing. The comment at VerificationLib.sol line 23-24 mentions this
    will be replaced by CrossL2Inbox in Stage 1. Worth flagging as design consideration.
  poc_sketch: |
    1. Validators sign and register messages nonces 0-99 (normal operation)
    2. Message at nonce 100 is from a controversial sender
    3. Validators refuse to sign nonce 100
    4. nextNonce = 100, stuck forever
    5. Messages 101, 102, ... exist on Solana but can never be registered on Base
    6. Bridge is completely halted for Solana→Base direction
    7. Base→Solana direction (via MMR/proofs) still works independently

