#######################################################################
# H12: CallLib.execute — unbounded gas in delegatecall/create
#######################################################################
- id: BRG-D-12
  tier: 1
  type: property
  description: >
    Twin.execute → CallLib.execute supports DelegateCall and Create/Create2.
    A DelegateCall to a malicious contract could selfdestruct the Twin or modify
    its storage arbitrarily. A Create/Create2 could consume all gas in constructor.
  attack_scenario: >
    CallLib.execute (lines 42-65):
    - CallType.DelegateCall: call.to.delegatecall(call.data)
    - CallType.Create: create(value, ...) — deploys arbitrary bytecode
    - CallType.Create2: create2(value, ..., salt)

    DelegateCall from Twin to a malicious contract runs in Twin's context. The
    malicious contract can:
    1. selfdestruct(attacker) — destroys Twin, steals ETH balance
    2. Modify Twin's storage — corrupt state

    HOWEVER: This requires the message to be validator-signed. The Solana sender
    explicitly sends a DelegateCall instruction. Validators sign it. So:
    - The Solana sender is attacking their OWN Twin (self-harm)
    - Validators approved the message

    An external attacker CANNOT delegatecall to someone else's Twin because:
    - Twin.execute requires msg.sender == BRIDGE || msg.sender == address(this)
    - Bridge only calls execute for the Twin matching message.sender
    - message.sender is a Solana pubkey validated by the protocol

    VERDICT: Self-harm only. A Solana user can destroy their own Twin via
    delegatecall. This is by design — the Twin is the user's proxy.
    Not an attack vector against other users.
  impact: "Self-harm — user can destroy their own Twin"
  impact_rating: Informational
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify delegatecall runs in Twin's context (self-harm)
    // Attacker's twin only — cannot affect other users' twins
    t(true, "BRG-D-12: delegatecall is self-sovereign");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    The DelegateCall capability is intentional — it allows Solana users to execute
    complex operations through their Twin. The risk is limited to self-harm.
    Validators might want to filter DelegateCall messages as an additional safety
    measure, but that's an off-chain policy decision.
  poc_sketch: ""

