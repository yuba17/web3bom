    The legitimate relayer then calls with proper gasLimit. On success:
    - delete failures[hash] (line 360)
    - successes[hash] = true (line 361)

    So the attack just creates one failure event before the success. No permanent harm.
    After success, subsequent calls skip the message (line 352-354).

    VERDICT: Noise-only attack. No permanent DoS. The legitimate relayer always wins.
