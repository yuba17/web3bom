#######################################################################
# H7: __relayMessage gas — relayer gas waste via high gasLimit messages
#######################################################################
- id: BRG-D-07
  tier: 2
  type: property
  description: >
    Since gasLimit is not in the message hash, the relayer chooses the gasLimit when
    submitting IncomingMessage. A relayer who sets gasLimit too high for a reverting
    call wastes their own gas. This is not an external attack vector.
  attack_scenario: >
    _validateAndRelay (Bridge.sol line 358):
      try this.__relayMessage{gas: message.gasLimit}(message)
    The gasLimit is a field in the IncomingMessage struct submitted by the relayer.
    Since it's NOT in the message hash, the relayer can set any value.

    Potential concern: Could a Solana user craft a message whose execution always
    reverts after consuming exactly gasLimit gas? E.g., a Call to a contract that
    does while(true){} — this would consume all allocated gas and revert.

    Analysis:
    1. The relayer chooses gasLimit, not the Solana sender
    2. The relayer can simulate the transaction before submitting (eth_estimateGas)
    3. Even if the execution consumes all gas and reverts, the message is marked as
       failure and can be retried (or not — it's the relayer's choice)
    4. The EVM 1/64 rule ensures the outer _validateAndRelay retains enough gas to
       execute the catch block and continue the loop

    VERDICT: The relayer is self-sovereign over gas costs. Not an attack vector.
    A smart relayer simulates before submitting.
  impact: "Relayer wastes own gas — self-inflicted, not an external attack"
  impact_rating: Informational
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify 1/64 rule: after __relayMessage reverts, enough gas
    // remains to execute catch block (failures[hash] = true, emit event)
    // and continue the for loop to process next messages
    t(true, "BRG-D-07: operational consideration, not invariant");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    One subtle point: the try/catch on this.__relayMessage is an EXTERNAL call to self.
    The 1/64 rule applies. If the relayer provides txGas and sets message.gasLimit =
    txGas * 63/64, then after the external call, only txGas/64 remains. For the catch
    block to succeed, it needs enough gas for: SSTORE (failures[hash] = true) ~20K +
    LOG2 (emit event) ~2K = ~22K gas. So txGas/64 >= 22K → txGas >= 1.4M. This is
    fine for any reasonable transaction. The relayer just needs to ensure tx gas > gasLimit * 64/63.
  poc_sketch: ""

