#######################################################################
- id: BRG-D-09
  tier: 2
  type: property
  description: >
    relayMessages is permissionless. An attacker could repeatedly call relayMessages
    with already-validated messages using gasLimit=0, causing failures and emitting
    FailedToRelayMessage events. This creates noise but no permanent damage.
