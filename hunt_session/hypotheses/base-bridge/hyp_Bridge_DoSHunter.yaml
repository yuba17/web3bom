# H8: registerMessages can be called by ANYONE — spam registration
#######################################################################
- id: BRG-D-08
  tier: 1
  type: property
  description: >
    BridgeValidator.registerMessages is permissionless — anyone with valid validator
    signatures can call it. Could a third party register messages out of order or
    cause issues by front-running the official relayer?
  attack_scenario: >
    BridgeValidator.registerMessages (line 172-196) has no access control beyond
    the whenNotPaused modifier. The function validates signatures and registers
    message hashes. However:

    1. The nonces are strictly sequential (nextNonce). So you can't register
       messages out of order — the nonce sequence is enforced.
    2. The signatures are over the EXACT message hashes derived from the nonces.
       You can't reuse signatures for different messages.
    3. If someone front-runs registerMessages with the same data, the second call
       would try to increment nextNonce again, compute different hashes (because
       nonce changed), and the signatures won't match.

    Wait — actually, if attacker front-runs with the EXACT same calldata:
    - Attacker's tx: nextNonce goes from N to N+K, messages registered
    - Legitimate tx: nextNonce is now N+K, computes hashes with N+K..N+2K-1,
      signatures were for N..N+K-1, signature validation fails → revert

    The legitimate relayer's tx reverts (wasted gas), but messages are correctly
    registered. The relayer just needs to detect this and not re-submit.

    VERDICT: Front-running registerMessages is possible but harmless — the messages
    still get registered. The front-runner pays gas. The legitimate relayer's tx
    fails but can detect this via events.
  impact: "Legitimate relayer's tx reverts, wastes gas. Messages still registered."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
