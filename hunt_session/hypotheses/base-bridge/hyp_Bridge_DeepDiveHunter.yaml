  # BR-DD-06 — NEW: registerRemoteToken for CrossChainERC20 tokens creates
  #            a dual-path withdrawal — mint path AND deposit-subtraction path
  ###########################################################################
  - id: BR-DD-06
    title: "registerRemoteToken on a CrossChainERC20 creates dual withdrawal path — unbounded mint + deposit drain"
    description: |
      NEW FINDING — not previously identified by any hunter.

      TokenLib has TWO finalization paths in finalizeTransfer:
      1. CrossChainERC20 path (isCrossChainErc20 = true): MINTS tokens, NO deposit tracking
      2. Native ERC20 path (isCrossChainErc20 = false): transfers FROM deposits

      registerRemoteToken sets $.scalars[localToken][remoteToken] regardless of whether localToken
      is a CrossChainERC20 or not. It doesn't check isCrossChainErc20.

      NOW: What if registerRemoteToken is called for a localToken that IS a CrossChainERC20?

      In finalizeTransfer:
        Line 239: if (CrossChainERC20Factory(...).isCrossChainErc20(transfer.localToken))
        This check runs FIRST. If true, it takes the CrossChainERC20 mint path.
        The scalar is NEVER used in this path (localAmount = transfer.remoteAmount directly).

      So for CrossChainERC20 tokens, registerRemoteToken's scalar is IRRELEVANT for the
      finalization path. The scalar would only matter if someone tried to use this CrossChainERC20
      as localToken in initializeTransfer — but that path checks:
        if (CrossChainERC20Factory(...).isCrossChainErc20(transfer.localToken)) → takes burn path
      Which also doesn't use the scalar.

      FALSE ALARM: The two paths are correctly separated. CrossChainERC20 always uses mint/burn.
      Native ERC20/ETH always uses deposit/transfer. The scalar is only used for native ERC20/ETH.
      registerRemoteToken on a CrossChainERC20 is a no-op in practice (sets unused scalar).

      HOWEVER: There IS a subtle issue. What if localToken is a contract that was:
      1. Originally deployed by CrossChainERC20Factory (so isCrossChainErc20 = true)
      2. But ALSO has a scalar registered via registerRemoteToken

      A user calling bridgeToken with this token would:
        initializeTransfer → isCrossChainErc20 check → takes BURN path
        Burns from msg.sender, serializes message.

      On finalization:
        finalizeTransfer → isCrossChainErc20 check → takes MINT path
        Mints to recipient.

      The scalar is completely ignored for CrossChainERC20. No issue here.

      ACTUALLY — wait. Let me re-read the initializeTransfer flow more carefully:

      For CrossChainERC20 in initializeTransfer (line 156-170):
        It checks remoteToken: either bytes32(0) or must match CrossChainERC20.remoteToken()
        It then BURNS from msg.sender
        localAmount = transfer.remoteAmount (1:1, no scalar)

      For native ERC20 in initializeTransfer (line 171-208):
        It requires $.scalars[localToken][remoteToken] != 0 (WrappedSplRouteNotRegistered)

      So if an attacker registers a scalar for a CrossChainERC20 token with a DIFFERENT remoteToken
      than the CrossChainERC20's configured remoteToken:
        bridgeToken(localToken=ccERC20, remoteToken=FAKE, ...)
        isCrossChainErc20 = true → enters CrossChainERC20 path
        But: Pubkey.unwrap(transfer.remoteToken) == bytes32(0)? No, it's FAKE.
        transfer.remoteToken == expectedRemoteToken? No, FAKE != real remote.
        → REVERT: IncorrectRemoteToken

      The check on line 159-162 prevents using a CrossChainERC20 with a wrong remoteToken.
      The dual-path attack doesn't work.

      CONCLUSION: Not exploitable. The isCrossChainErc20 check and remoteToken validation
      together prevent any confusion between the two finalization paths.
    severity: informational
    confidence: 90
    status: pending
    solidity: |
      // Informational: CrossChainERC20 and native ERC20 paths are properly separated
      // registerRemoteToken on a CrossChainERC20 is harmless (scalar unused)
      function property_BR_DD_06_dual_path_safe() public pure returns (bool) {
          return true;
      }

  ###########################################################################
  # BR-DD-07 — NEW: MMR commutative hashing + Solana verification analysis
  ###########################################################################
  - id: BR-DD-07
    title: "MMR commutative hashing sibling swap — Solana prove_message binds nonce to leaf index, preventing swap"
    description: |
      EXTENDS: BR-W-03

      The Base-side MMR uses commutative hashing for internal nodes:
        _hashInternalNode: if (left < right) hash(left, right) else hash(right, left)

      This means H(A,B) == H(B,A) — swapping siblings doesn't change the parent hash.

      The Solana-side prove_message (prove_message.rs:55-89):
        1. Computes hash_message(nonce.to_be_bytes(), sender, data) = keccak(nonce || sender || data)
        2. Verifies message_hash matches the computed hash
        3. Calls mmr::verify_proof(root, message_hash, nonce, proof, total_leaf_count)

      The nonce parameter is used as the leaf INDEX in the MMR verification:
        mmr::verify_proof uses nonce to determine the leaf's position in the MMR tree structure.

      The message hash includes the nonce: keccak(nonce || sender || data).
      Different nonces → different message hashes → different leaf values.

      Even with commutative hashing, swapping siblings would require:
        - Leaf at index i has hash H_i = keccak(i || sender_i || data_i)
        - Leaf at index i^1 has hash H_{i^1} = keccak(i^1 || sender_{i^1} || data_{i^1})
        - Parent = H(sort(H_i, H_{i^1})) = same regardless of which is left/right

      ATTACK: Submit a proof for H_i claiming it's at index i^1 (the sibling position).
      - prove_message receives nonce = i, which it uses to verify the proof at leaf position i
      - If attacker submits nonce = i^1, the message_hash = keccak(i^1 || sender || data)
        which is DIFFERENT from H_i = keccak(i || sender || data)
      - The hash mismatch causes message_hash != computed_hash → REVERT

      CONCLUSION: SAFE. The nonce is embedded in the message hash, so changing the claimed
      position changes the hash, invalidating the proof. The commutative hashing is NOT
      exploitable because leaf values are position-dependent.
    severity: informational
    confidence: 95
    status: pending
    solidity: |
      // Safe: nonce embedded in hash prevents sibling swap attack
      function property_BR_DD_07_mmr_position_bound() public pure {
          bytes32 hash_at_0 = keccak256(abi.encodePacked(uint64(0), sender, data));
          bytes32 hash_at_1 = keccak256(abi.encodePacked(uint64(1), sender, data));
          // hash_at_0 != hash_at_1 (nonce differs)
          // Proof for hash_at_0 at position 0 cannot prove hash_at_1 at position 0
          assert(hash_at_0 != hash_at_1);
      }

  ###########################################################################
  # BR-DD-08 — NEW: Solana-side partner double-counting mirrors EVM bug
  ###########################################################################
  - id: BR-DD-08
    title: "Solana register_output_root has same base/partner double-counting bug as EVM BridgeValidator"
    description: |
      EXTENDS BR-DD-02 to Solana side.

      Solana register_output_root (register_output_root.rs:55-122):
        1. Recovers unique EVM addresses from signatures
        2. Counts base oracle approvals: bridge.base_oracle_config.count_approvals(&unique_signers)
        3. If partner threshold > 0: partner_config.count_approvals(&unique_signers)

      BaseOracleConfig.count_approvals (bridge.rs:275-283):
        Iterates signers, checks if each is in self.signers[..active_len]. Simple contains check.

      Signers.count_approvals (signers.rs:56-86):
        Iterates signers, matches against evm_address or new_evm_address of each configured signer.
        Uses matched_indices to prevent double-counting WITHIN partner set.
        But does NOT exclude signers already counted as base oracle signers.

      SAME BUG as EVM side: a single recovered EVM address can count toward BOTH thresholds.

      This affects the Base→Solana direction (output root registration). A compromised set of
      overlapping validators could register fraudulent output roots, which would then allow
      forging message proofs for arbitrary Base→Solana transfers.

      IMPACT on Base→Solana direction:
      - Attacker registers fake output root with fake MMR root
      - Constructs arbitrary IncomingMessage on Solana with fake MMR proof
      - prove_message verifies against the fake root → succeeds
      - relay_message executes the fake message → mints tokens or transfers from vaults
      - Fund loss on Solana side

      This is arguably MORE severe than the EVM-side bug because output root registration
      directly controls which messages are considered valid on Solana.
    severity: medium
    confidence: 75
    status: pending
    solidity: |
      // This is a Rust-side bug, but documenting the parallel for completeness
      // Both EVM BridgeValidator._validateSigs AND Solana register_output_root
      // have the same pattern: independent counting without mutual exclusion
      //
      // EVM: _countBaseSigners + _countPartnerSigners (no exclusion)
      // Solana: base_oracle_config.count_approvals + partner_config.count_approvals (no exclusion)
      //
      // Fix: either exclude base-counted signers from partner counting, or maintain
      // a single unified validator set with a single threshold

  ###########################################################################
  # BR-DD-09 — NEW: Fee-on-transfer token round-trip insolvency path
  ###########################################################################
  - id: BR-DD-09
    title: "Fee-on-transfer tokens cause systematic bridge insolvency via finalizeTransfer outbound fee"
    description: |
      EXTENDS: BR-D-03

      initializeTransfer for native ERC20 (lines 171-208) CORRECTLY handles fee-on-transfer:
        1. Measures balanceBefore/balanceAfter
        2. receivedLocalAmount = balanceAfter - balanceBefore (actual received)
        3. receivedRemoteAmount = receivedLocalAmount / scalar
        4. localAmount = receivedRemoteAmount * scalar (rounded down)
        5. dust = receivedLocalAmount - localAmount (refunded to sender)
        6. deposits += localAmount (exact amount held)

      finalizeTransfer for native ERC20 (lines 246-254) does NOT handle fee-on-transfer:
        1. localAmount = transfer.remoteAmount * scalar
        2. deposits -= localAmount
        3. safeTransfer(token, to, localAmount)

      If the token charges a fee on safeTransfer (step 3), the recipient receives
      (localAmount - fee). But deposits was already decremented by the full localAmount.

      The bridge's actual token balance decreases by localAmount (it sends localAmount).
      The recipient receives (localAmount - fee). The fee is taken FROM the amount sent,
      not from the bridge's remaining balance.

      Wait — for a fee-on-transfer token, safeTransfer sends localAmount but the recipient
      gets less. The bridge's actual balance decreases by localAmount. So:
        Bridge balance: decreased by localAmount (correct)
        Deposits: decreased by localAmount (correct)
        Balance = previous - localAmount, Deposits = previous - localAmount
        Balance == Deposits (still balanced!)

      Actually the fee comes from the TRANSFER, not the bridge:
        Bridge calls transfer(to, localAmount)
        Token takes fee from the transferred amount
        Bridge balance decreases by localAmount
        Recipient gets localAmount - fee
        Bridge balance after = Bridge balance before - localAmount

      So both deposits and actual balance decrease by localAmount. They remain in sync.
      The USER loses the fee (gets less than localAmount), not the bridge.

      BUT: this means each round-trip, the user loses fees in BOTH directions:
        Deposit: user sends X, bridge receives X - fee_in. Credited: (X - fee_in) / scalar remote units.
        Withdraw: bridge sends Y = remote_units * scalar, user receives Y - fee_out.
        Net loss per round-trip: fee_in + fee_out (from user's perspective)
        Bridge solvency: maintained (deposits always == actual balance)

      CONCLUSION: Bridge solvency is maintained. Users absorb the transfer fees.
      This is expected behavior for fee-on-transfer tokens. NOT a vulnerability.
    severity: informational
    confidence: 90
    status: pending
    solidity: |
      // Invariant: bridge token balance >= tracked deposits, even with fee-on-transfer
      // Bridge always sends from its balance and decrements deposits by the same amount
      function invariant_BR_DD_09_solvency_with_fot(
          address localToken, Pubkey remoteToken
      ) public view {
          uint256 balance = IERC20(localToken).balanceOf(address(bridge));
          uint256 deposits = bridge.deposits(localToken, remoteToken);
          assert(balance >= deposits);
      }

  ###########################################################################
  # BR-DD-10 — NEW: Attack WITHOUT validator compromise — permissionless
  #            CrossChainERC20 deployment + social engineering
  ###########################################################################
  - id: BR-DD-10
    title: "Permissionless CrossChainERC20 deployment enables token confusion attack on DEX liquidity"
    description: |
      This explores attack paths that do NOT require validator or Solana compromise.

      CrossChainERC20Factory.deploy is fully permissionless. Anyone can call:
        factory.deploy(remoteToken, "USD Coin", "USDC", 6)

      This creates a CrossChainERC20 at a CREATE2-deterministic address with:
        isCrossChainErc20[address] = true
        remoteToken() = Pubkey.unwrap(solana_usdc_pubkey)

      The legitimate deployment would use the SAME parameters and get the SAME address.
      But: if the attacker uses DIFFERENT parameters (e.g., slightly different name like
      "USD  Coin" with two spaces), they get a DIFFERENT address.

      Wait — actually, if the attacker uses EXACTLY the same parameters, they get the same
      address. The CREATE2 deployment would revert because code already exists (if legitimate
      deployment happened first) or succeed (if attacker deploys first).

      If attacker deploys first with same parameters:
        - Same address, same isCrossChainErc20 = true
        - Legitimate deployment at same address would revert (code exists)
        - But the token at that address IS correct (same remoteToken, name, symbol, decimals)
        - No impact — the attacker just front-ran the deployment of the correct token

      If attacker deploys with different parameters (same remoteToken, different name):
        - Different address, also isCrossChainErc20 = true
        - Both tokens have the same remoteToken() pointing to the same Solana token
        - Bridge can mint BOTH tokens (via finalizeTransfer with localToken = either address)
        - But the Solana→Base message specifies the exact localToken address
        - Oracle/validator would only sign messages with the OFFICIAL localToken address

      ACTUAL RISK: UI/social engineering. If users interact with the wrong CrossChainERC20
      contract thinking it's the official one, they could:
        1. Buy FAKE_USDC on a DEX (no backing, just social engineering)
        2. Try to bridge FAKE_USDC back to Solana via bridgeToken
        3. initializeTransfer checks: CrossChainERC20(FAKE_USDC).remoteToken() == expected
           → matches! Burns FAKE_USDC, sends message to Solana referencing real USDC mint
        4. On Solana, the finalization would release real USDC from vault
        5. But wait — the Solana side processes the message data, not localToken address.
           The SVMBridgeLib serialization for CrossChainERC20 (Spl type) includes localToken
           and remoteToken. On Solana, finalize_spl_transfer checks local_token matches the
           SPL mint, which IS the correct Solana USDC mint.

      WAIT: For the SPL path in SVMBridgeLib.serializeTransfer:
        result = encodePacked(uint8(1), transfer.localToken, transfer.remoteToken, transfer.to, amount)

      transfer.localToken is the EVM address (20 bytes) of the CrossChainERC20.
      On Solana, FinalizeBridgeSpl has local_token: Pubkey (Solana mint) and remote_token: [u8; 20].

      The Borsh deserialization on Solana would map:
        - localToken (EVM address 20 bytes) → FinalizeBridgeSpl.remote_token [u8; 20]
        - remoteToken (Solana pubkey 32 bytes) → FinalizeBridgeSpl.local_token Pubkey

      Actually the field ordering in Borsh serialization matters. Let me re-read...
      The Spl variant in SVMBridgeLib: transfer.localToken, transfer.remoteToken, transfer.to, amount
      On Solana Transfer::Spl(FinalizeBridgeSpl): remote_token [u8;20], local_token Pubkey, to Pubkey, amount u64

      So: EVM localToken (address = 20 bytes) maps to remote_token [u8;20] on Solana.
      And: EVM remoteToken (Pubkey = 32 bytes) maps to local_token Pubkey on Solana.

      If attacker burns FAKE_USDC (different EVM address), the remote_token in the Solana message
      is FAKE_ADDR (attacker's ERC20 address). On Solana, the token vault PDA is derived from:
        [TOKEN_VAULT_SEED, mint_key.as_ref(), self.remote_token.as_ref()]

      If remote_token = FAKE_ADDR, the vault PDA is DIFFERENT from the real vault PDA (which uses
      REAL_ADDR). There are no tokens in the fake vault → transfer fails!

      CONCLUSION: The token vault PDA derivation on Solana includes the remote_token (EVM address),
      which means each EVM CrossChainERC20 has its OWN vault on Solana. Deploying a fake
      CrossChainERC20 doesn't give access to the real vault's tokens.

      This is a robust defense. NOT exploitable.
    severity: informational
    confidence: 85
    status: pending
    solidity: |
      // Safe: Solana vault PDA includes remote_token (EVM address), so different ERC20 = different vault
      function property_BR_DD_10_fake_ccerc20_safe() public pure returns (bool) {
          return true;
      }

summary:
  total_hypotheses: 10
  critical_findings: 0
  high_severity:
    - BR-DD-01 — Cross-deployment replay + scalar overwrite = fund extraction (High, 55% confidence)
      Requires same validators on multiple deployments + registerRemoteToken re-invocation.
      The scalar overwrite without deposit check is a real code bug. The cross-chain replay is
      the delivery mechanism. Fix: add require(deposits == 0) to registerRemoteToken AND add
      chain ID to message hash.
  medium_severity:
    - BR-DD-02 — Base/partner validator double-counting on EVM side (Medium, 75% confidence)
      Code-level bug: no mutual exclusion between base and partner signer counting.
      Fix: exclude base-counted signers from partner count or vice versa.
    - BR-DD-08 — Same double-counting bug on Solana side (Medium, 75% confidence)
      Mirror of DD-02 in register_output_root. Same fix needed.
  low_severity:
    - BR-DD-03 — gasLimit not in hash = griefing only (Low, 80% confidence)
      By design for retryability. Not a fund-loss vector.
    - BR-DD-05 — bytes32 address encoding = oracle implementation concern (Low, 85%)
  informational:
    - BR-DD-04 — Cross-direction signature safety (safe due to EIP-191 length difference)
    - BR-DD-06 — CrossChainERC20 dual-path (safe, paths properly separated)
    - BR-DD-07 — MMR commutative hashing (safe, nonce in hash prevents swap)
    - BR-DD-09 — Fee-on-transfer solvency (safe, users absorb fees not bridge)
    - BR-DD-10 — Permissionless CrossChainERC20 (safe, Solana vault PDA includes EVM address)

  priority_for_pipeline:
    1. BR-DD-01 — registerRemoteToken scalar overwrite is the most reportable finding.
       The missing `require(deposits == 0)` is a concrete code bug. Cross-chain replay amplifies
       but isn't required (Solana-side re-registration is sufficient trigger).
    2. BR-DD-02 + BR-DD-08 — Validator double-counting on BOTH sides. Concrete code bug.
       Impact depends on operational setup but the code should enforce mutual exclusion.
    3. BR-DD-01's cross-chain replay component (no chain ID in hash) is a design issue.
       Independently reportable as a separate finding.
