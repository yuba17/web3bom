    title: "Cross-deployment replay of registerRemoteToken to overwrite scalar and drain deposits"
    description: |
      COMBINES: BR-D-01, BR-D-02, BR-D-07, BR-SIG-03, BR-TB-04, BR-TB-05, BR-M-10

      This is the highest-severity combined attack path. It chains two independently-identified
      weaknesses into a fund-draining exploit:

      STEP 1: Cross-deployment message replay (BR-D-01 + BR-D-07 + BR-SIG-03)
      The Solana→Base message hash is:
        hash(nonce, outgoingMessagePubkey, keccak256(sender, ty, data))
      NO chain ID, NO bridge address, NO domain separator.
      The validator signature is: toEthSignedMessageHash(abi.encode(messageHashes))
      Also NO chain ID.

      If the same validator set is used across two EVM deployments (e.g., Base mainnet + testnet,
      or Base + another OP chain), a batch signed for chain A is valid on chain B provided
      the nonce range matches. The nonce is BridgeValidator.nextNonce (per-deployment), so
      on a fresh deployment chain B starts at 0.

      STEP 2: Scalar overwrite via replayed registerRemoteToken (BR-D-02 + BR-TB-05 + BR-M-10)
      TokenLib.registerRemoteToken unconditionally sets:
        $.scalars[localToken][remoteToken] = 10 ** scalarExponent
      No check for existing scalar. No check that deposits are zero.

      If message.sender == REMOTE_BRIDGE (Solana bridge pubkey), __relayMessage decodes and calls
      registerRemoteToken. On a fresh deployment, there are no deposits yet, so scalar overwrite
      isn't directly harmful. BUT: if the same deployment later receives real deposits, and a
      SECOND registerRemoteToken message can be replayed with a different scalar...

      COMBINED ATTACK:
      1. Bridge on chain A has registered (USDC, solUSDC, scalarExp=12) → scalar = 10^12
      2. Users deposit 1M USDC on chain A → deposits = 1M * 10^12 = 1e18
      3. On chain A, Solana bridge sends a NEW registerRemoteToken(USDC, solUSDC, scalarExp=0)
         This would be legitimate on Solana side (correcting misconfiguration).
      4. Validators sign this message at nonce N.
      5. Chain B is deployed AFTER chain A, with same validator set, and nextNonce catches up to N.
      6. Attacker replays the registerRemoteToken message on chain B.
         On chain B, USDC/solUSDC scalar changes to 10^0 = 1.
      7. Now on chain B, finalizeTransfer for 1 remoteAmount releases 1 * 1 = 1 wei USDC.
         Actually the attack is REVERSE: if scalar INCREASES on chain B...

      REVISED ATTACK (scalar increase):
      1. Bridge on chain A initially registered scalar = 10^6 (scalarExp=6).
      2. Chain A later re-registers with scalarExp=12. Validators sign at nonce N.
      3. Chain B has scalar = 10^6 already and users deposited X USDC.
      4. Attacker replays the scalarExp=12 registration on chain B.
      5. Now scalar = 10^12. Attacker bridges back 1 remote unit → localAmount = 10^12.
         But deposits on chain B are tracked at old scalar (deposits = X * 10^6).
      6. deposits -= 10^12. If deposits = X * 10^6 >= 10^12, this succeeds when X >= 10^6.
         Attacker extracts 10^12 local units = 10^6 USDC (with 6 decimals).
      7. The cost is bridging 1 remote unit from Solana. If remote unit is worth 10^6 local units
         at the old scalar, attacker pays 10^6 and gets 10^12 — 10^6x profit.

      CRITICAL ASSESSMENT:
      - Requires same validator set across 2 deployments (operational, NOT code-enforced)
      - Requires nonce alignment (plausible on fresh deployment)
      - Requires registerRemoteToken to have been called with different scalars on chain A
