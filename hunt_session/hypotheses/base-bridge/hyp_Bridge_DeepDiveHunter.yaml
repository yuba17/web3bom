  # BR-DD-02 — CONVERGENCE 3: Validator double-counting reduces effective
  #            security to (baseThreshold - overlap) + overlap signatures
  ###########################################################################
  - id: BR-DD-02
    title: "Base/partner validator overlap reduces effective multisig from N+M to max(N,M) unique keys"
    description: |
      COMBINES: BR-SIG-01, BR-SIG-04, BR-TB-07

      The EVM-side BridgeValidator has TWO independent counting functions:
        _countBaseSigners: iterates all recovered signers, counts those in VerificationLib.validators
        _countPartnerSigners: iterates all recovered signers, counts those in IPartner.getSigners()

      There is NO mutual exclusion. A signer that appears in BOTH sets counts toward BOTH thresholds.

      DEEPER ANALYSIS — combining with partner key rotation (BR-SIG-04):
      IPartner.Signer has (evmAddress, newEvmAddress). BridgeValidator._indexOf matches BOTH:
        if (addr == addrs[i].evmAddress || addr == addrs[i].newEvmAddress) return i;

      Attack: Partner sets newEvmAddress = baseValidator[0].address during "key rotation".
      Now baseValidator[0]'s signature counts as:
        1 base signer (via VerificationLib.isBaseValidator)
        1 partner signer (via _indexOf matching newEvmAddress)

      With baseThreshold=2, partnerThreshold=1, overlap=1:
        2 base signatures needed (A, B) — both are base validators
        1 partner signature needed — A's signature ALSO counts as partner (via newEvmAddress overlap)
        Total unique keys needed: 2 instead of 3

      With baseThreshold=3, partnerThreshold=2, overlap=2:
        3 base signatures needed (A, B, C) — all are base validators
        2 partner signatures needed — A and B also match partner via newEvmAddress
        Total unique keys needed: 3 instead of 5

      SOLANA-SIDE CHECK: The Solana-side register_output_root has its OWN separate validator sets:
        base_oracle_config: BaseOracleConfig (signers stored in Bridge account)
        partner_oracle_config: uses Signers account from partner program

      On Solana side, count_approvals in Signers (line 56-86 of signers.rs) uses matched_indices
      to prevent double-counting within partner set. But there's NO cross-check against base_oracle_config.
      BaseOracleConfig.count_approvals (bridge.rs:275-283) also counts independently.

      SAME BUG EXISTS ON BOTH SIDES.

      If a single EVM address is registered as BOTH a base oracle signer AND a partner signer on
      BOTH chains, its signature counts toward both thresholds on both sides.

      This reduces the key-compromise threshold from (baseThreshold + partnerThreshold) unique keys
      to max(baseThreshold, partnerThreshold) unique keys.

      For a $5M bridge, if base=3, partner=2, and 2 addresses overlap:
        Design intent: 5 unique compromised keys to forge messages
        Reality: 3 unique compromised keys (base validators only) suffice

      IMPORTANT: This is a CODE-LEVEL BUG. The code does not prevent overlap. Whether overlap
      exists in practice is an operational question, but the code SHOULD enforce mutual exclusion.
    severity: medium
    confidence: 75
    status: pending
    solidity: |
      // Invariant: a signer counted toward base threshold MUST NOT also count toward partner threshold
      function invariant_BR_DD_02_no_double_count(
          bytes32[] memory messageHashes,
          bytes calldata sigData
      ) public view {
          address[] memory signers = bridgeValidator._getSignersFromSigs(messageHashes, sigData);
          uint256 baseCount = 0;
          uint256 partnerCount = 0;
          uint256 overlapCount = 0;
          for (uint i = 0; i < signers.length; i++) {
              bool isBase = verificationLib.isBaseValidator(signers[i]);
              bool isPartner = _isPartnerSigner(signers[i]);
              if (isBase) baseCount++;
              if (isPartner) partnerCount++;
              if (isBase && isPartner) overlapCount++;
          }
          // overlapCount should be 0 for proper security separation
          // Current code allows overlapCount > 0
          assert(overlapCount == 0); // FAILS if overlap exists
      }

