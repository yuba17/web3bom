  - id: VV-12
    tier: 2
    type: property
    description: "Interest rate calculation precision loss over many small time steps vs one large step"
    attack_scenario: "In _calculateGlobalInterest (lines 1276-1277), interest uses linear formula: newRate = oldRate + oldRate * timeElapsed * rateX64 / Q64. This is applied once per block since lastExchangeRateUpdate is cached. If someone triggers _updateGlobalInterest every block (1 second on L2), the cumulative rate will differ from a single long-period calculation due to rounding: sum of (oldRate * 1 * rate / Q64) for each second vs (oldRate * N * rate / Q64) once. The difference is that in the per-second case, each intermediate rate is slightly higher (compounding effect), while the single-step is pure linear. Actually, per-second updates BENEFIT the vault because each step uses a slightly higher oldRate (mini-compounding). But the rounding truncation each second could LOSE precision. For a 5% APY rate, the per-second rounding loss is approximately 1 wei per Q96 per second, which is negligible."
    solidity: |
      // Track cumulative interest over many small steps vs expected from single step
      // ghost_initialDebtRate set at start
      // After N operations:
      uint256 currentRate = vault.lastDebtExchangeRateX96();
      uint256 timeTotal = block.timestamp - ghost_initialTimestamp;
      // The linear approximation should not diverge more than timeTotal / Q64 from actual
      // This is a soft invariant — tolerance-based
    ghost_vars:
      - "uint256 internal ghost_initialDebtRate;"
      - "uint256 internal ghost_initialTimestamp;"
    validated: false
    priority: low
    confidence: 55
    notes: "This is more of a precision analysis than a vulnerability. The linear model is intentional (no compounding). Per-block updates vs batch updates should produce nearly identical results. Rounding loss per second at Q96 precision is negligible. Not a real attack vector."

  - id: VV-13
