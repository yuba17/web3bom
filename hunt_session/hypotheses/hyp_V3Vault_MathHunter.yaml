      uint256 shares = vault.totalSupply();
      if (shares > 0 && shares < 1000) {
          // If very few shares exist, check if exchange rate was manipulated
          (, uint256 lendExchangeRateX96) = vault._calculateGlobalInterest();
          uint256 assetsPerShare = shares * lendExchangeRateX96 / Q96;
          // Exchange rate should still be close to Q96 for new vault
          t(lendExchangeRateX96 <= Q96 * 2, "VV-10: exchange rate inflated suspiciously for low-supply vault");
