    ghost_vars: []
    validated: false
    priority: medium
    confidence: 50
    notes: "INVESTIGATED: The exchange rate in V3Vault is NOT balance-based like typical ERC4626. It is tracked via lastLendExchangeRateX96 which only changes in _updateGlobalInterest based on time and IRM rates. Direct token donations to vault DO NOT affect the exchange rate — they only increase reserves. So the classic first depositor attack does NOT work here. The donation just becomes reserves. However, donation DOES affect the balance in _getBalanceAndReserves, which affects the IRM utilization rate, which affects interest rates. This is an indirect manipulation vector but low severity. Downgrading."

