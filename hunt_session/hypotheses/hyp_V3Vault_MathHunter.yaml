  - id: VV-04
    tier: 1
    type: property
    description: "Liquidation penalty fraction division by zero when fullValue equals maxPenaltyValue"
    attack_scenario: "In _calculateLiquidation (line 1174), penaltyFractionX96 = Q96 - ((fullValue - maxPenaltyValue) * Q96 / (startLiquidationValue - maxPenaltyValue)). If startLiquidationValue == maxPenaltyValue, this is division by zero. This happens when debt * fullValue / collateralValue == debt * (Q32 + MAX_LIQUIDATION_PENALTY_X32) / Q32, i.e., when fullValue/collateralValue == (Q32 + MAX_LIQUIDATION_PENALTY_X32)/Q32 = 1.1. With 90% collateral factor, collateralValue = fullValue * 0.9, so fullValue/collateralValue = 1/0.9 = 1.111..., which is > 1.1. So startLiquidationValue > maxPenaltyValue always. BUT with lower collateral factors (e.g., 50%), fullValue/collateralValue = 2.0, so startLiquidation = 2*debt which is always > 1.1*debt. SAFE. However, if collateralValue approaches fullValue (factor near 100%), then startLiquidation approaches debt, and maxPenaltyValue = 1.1*debt. Since factor is capped at 90%, startLiquidation = debt/0.9 = 1.111*debt > 1.1*debt. The margin is only 0.011*debt."
    solidity: |
      // Fuzz with various debt, fullValue, collateralValue combinations
      // Check that _calculateLiquidation never reverts with division by zero
      // Focus on cases where collateralFactorX32 is close to MAX_COLLATERAL_FACTOR_X32
      uint256 maxPenaltyValue = debt * (Q32 + MAX_LIQUIDATION_PENALTY_X32) / Q32;
      uint256 startLiquidationValue = debt * fullValue / collateralValue;
      // This must never be zero
      t(startLiquidationValue > maxPenaltyValue, "VV-04: liquidation division by zero possible");
    ghost_vars: []
    validated: false
    priority: high
    confidence: 60
    notes: "Investigated: With MAX_COLLATERAL_FACTOR_X32 = 90%, the minimum gap is (1/0.9 - 1.1) * debt = 0.011 * debt. For very small debts (e.g., 1 wei), rounding could make startLiquidationValue == maxPenaltyValue. However, minLoanSize prevents tiny loans. Likely safe by design but edge case worth fuzzing."

  - id: VV-05
    tier: 1
