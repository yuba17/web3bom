  - id: VV-14
    tier: 1
    type: optimize
    description: "Maximize attacker profit via borrow-repay rounding extraction"
    attack_scenario: "An attacker repeatedly borrows and repays small amounts, exploiting rounding in _convertToShares/_convertToAssets to pay back slightly less than borrowed each cycle. In borrow: shares = _convertToShares(assets, rate, Up) — rounds UP shares, meaning more debt recorded. In repay: when isShare=false, shares = _convertToShares(amount, rate, Down) — rounds DOWN shares burned. If borrow records ceil(debt) and repay burns floor(debt), each cycle could leave 1 wei of unburned debt. But this costs the attacker 1 extra share of debt per cycle (from the Up rounding in borrow), so the attacker actually LOSES from rounding. The rounding consistently favors the protocol. Need to verify with extreme values."
    solidity: |
