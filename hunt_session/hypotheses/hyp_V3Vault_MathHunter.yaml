    attack_scenario: "In _handleReserveLiquidation (line 1216), newLendExchangeRateX96 = (totalLent - missing) * newLendExchangeRateX96 / totalLent. If totalLent == 0 (no lenders), this is division by zero. This could happen if all lenders withdraw and then a liquidation with bad debt occurs. The vault would revert, making liquidation impossible, and the bad debt position would be stuck forever — a permanent DoS on liquidation."
    solidity: |
      // After any liquidation with reserveCost > 0:
      uint256 totalLent = _convertToAssets(vault.totalSupply(), newLendExchangeRateX96, Math.Rounding.Up);
