    attack_scenario: "In _repay (line 1019), when repaying by assets, shares = _convertToShares(amount, debtExchangeRateX96, Rounding.Down). Rounding down means fewer shares are burned. The check at line 1046 only applies when currentShares != shares (partial repay). But what if the borrower carefully chooses an asset amount that converts to exactly currentShares - 1 shares? The remaining 1 share of debt converts to less than minLoanSize. The position now has micro-debt that is not economical to liquidate (gas > value), effectively creating bad debt."
    solidity: |
