    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: "This is a fundamental accounting invariant. The only paths that modify debtSharesTotal are borrow (+= shares), repay/liquidate (-= shares). The transform replacement path in onERC721Received correctly copies shares without changing the total. _cleanupLoan sets loan.debtShares to 0 via delete, and the corresponding debtSharesTotal decrement happens in liquidate() before _cleanupLoan is called."
