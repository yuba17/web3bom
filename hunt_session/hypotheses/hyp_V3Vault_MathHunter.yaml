    validated: false
    priority: medium
    confidence: 45
    notes: "INVESTIGATED: Rounding directions in V3Vault are CORRECT for protocol safety. Borrow rounds shares UP (more debt), repay by assets rounds shares DOWN (less debt burned, so borrower pays more shares or same). The protocol consistently takes the favorable rounding. An attacker cannot extract value through rounding alone. Confidence is low because this is likely a non-issue."

  - id: VV-15
    tier: 1
    type: property
    description: "Liquidation free-liquidation path: when fullValue <= penalty, liquidatorCost = 0 but position value is transferred"
    attack_scenario: "In _calculateLiquidation line 1190: if fullValue <= penalty (extreme underwater), liquidatorCost = 0 (free liquidation). The liquidator receives the full position value for free. Then reserveCost = debt - 0 = debt. The protocol/lenders eat the entire debt. But _handleReserveLiquidation may not have enough reserves. If totalLent is small, the socialization at line 1216 could reduce lendExchangeRate drastically — potentially to near zero. This is a grief attack: create many small positions, let them all go underwater, then trigger free liquidation to socialize massive losses onto remaining lenders."
    solidity: |
      // After liquidation: check that lendExchangeRate did not drop more than 50% in a single liquidation
      uint256 currentRate = vault.lastLendExchangeRateX96();
      if (ghost_preLiquidationLendRate > 0) {
          gte(currentRate, ghost_preLiquidationLendRate / 2, "VV-15: catastrophic lend rate drop in single liquidation");
      }
    ghost_vars:
      - "uint256 internal ghost_preLiquidationLendRate;"
    validated: false
    priority: medium
    confidence: 45
    notes: "DOWNGRADED after flow-hunter analysis. The lender haircut cascade is real on the lender side (each free liquidation reduces lendExchangeRate), but it does NOT cascade into more borrower liquidations — borrower health is oracle-driven, independent of lendExchangeRate. The 'democratize debt' socialization is an explicit design feature (commented in code). An attacker creating intentional bad debt would lose their own collateral, making it unprofitable. One edge case remains: L1216 can set newLendExchangeRateX96 = 0 if missing == totalLent (reserves=0, liquidatorCost=0, balance=0, debt=totalLent), making all shares worthless. Extremely unlikely but theoretically possible. Reclassifying as design risk, not bug."

  - id: VV-16
    tier: 1
    type: property
    description: "Staked position liquidation: liquidator receives uncollected fees for free because liquidation cost is computed on fee-excluded fullValue"
    attack_scenario: "When a staked position is liquidated: (1) _checkLoanIsHealthy calls oracle.getValue with ignoreFees=true, returning fullValue WITHOUT fees and feeValue=0. (2) _unstakeIfNeeded unstakes, making fees collectible. (3) _calculateLiquidation computes liquidatorCost based on fee-excluded fullValue. (4) In _sendPositionValue, for full liquidation (line 1115), liquidator gets ALL liquidity AND ALL fees (type(uint128).max). For partial liquidation, feeValue=0 forces the else branch (line 1127) which sets fees to max anyway. Liquidator pays for fee-excluded value but receives fee-included value. The accumulated trading fees of the Uniswap position are extracted from the borrower for free."
    solidity: |
      // Before liquidation of staked position:
      // ghost_preLiqFeeExcludedValue = fullValue from _checkLoanIsHealthy (ignoreFees=true)
      // After liquidation:
      // actual_value_received = amount0_value + amount1_value (includes fees)
      // liquidatorCost was based on ghost_preLiqFeeExcludedValue
      // The difference (actual_received - fee_excluded_value) represents stolen borrower fees
      // Invariant: liquidator should not receive more value than liquidationValue
      t(actualValueReceived <= liquidationValue + 1, "VV-16: liquidator received excess value from staked position fees");
    ghost_vars:
      - "uint256 internal ghost_preLiqFeeExcludedValue;"
    validated: false
    priority: high
    confidence: 80
    notes: "Cross-confirmed with oracle-hunter (VV-O-02, VV-O-05). The root cause is that _checkLoanIsHealthy uses ignoreFees=true for staked positions but _sendPositionValue operates on the post-unstake position where fees are collectible. The feeValue=0 from the health check propagates into _sendPositionValue where it causes ALL fees to be sent to liquidator as a bonus. Impact depends on accumulated fee volume in staked Slipstream positions. For high-volume pools this could be substantial."

  - id: VV-17
    tier: 2
    type: property
    description: "Daily debt limit can exceed post-haircut cap after bad-debt liquidation due to ordering of haircut reduction and liquidatorCost addition"
    attack_scenario: "In liquidate(): (1) _handleReserveLiquidation at L1228-1229 reduces dailyDebtIncreaseLimitLeft by capReduction (adjusting for smaller totalLent post-socialization). (2) Then L767 adds liquidatorCost back to dailyDebtIncreaseLimitLeft. The liquidatorCost addition happens AFTER the haircut reduction and is not bounded by the post-haircut cap. Result: dailyDebtIncreaseLimitLeft can exceed the post-haircut daily cap, allowing more borrowing than the daily limit intends. Example: pre-haircut cap=1000, used=900, left=100. Haircut: capReduction=200, left=0. Post-haircut cap=800. Then liquidatorCost=500 added: left=500. But 900 was already used against an 800 cap — the system should allow 0 more, not 500."
    solidity: |
      uint256 postHaircutCap = _calculateDailyIncreaseLimit(vault.lastLendExchangeRateX96(), dailyDebtIncreaseLimitMin, MAX_DAILY_DEBT_INCREASE_X32);
      lte(vault.dailyDebtIncreaseLimitLeft(), postHaircutCap, "VV-17: daily debt limit exceeds post-haircut cap");
    ghost_vars: []
    validated: false
    priority: medium
    confidence: 70
    notes: "Cross-confirmed with flow-hunter (VV-F-07). The globalDebtLimit at L610 still provides a hard ceiling on total outstanding debt, so the practical impact is limited to exceeding the daily RATE limit, not the absolute limit. Severity is medium because daily limits are a secondary safety mechanism. However, in a scenario where admin sets a tight daily limit to slow down borrowing during volatility, this bypass could undermine that protection."

