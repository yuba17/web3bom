  confidence: 75
  notes: "For 6-decimal tokens, the minimum deposit that yields >= 1 share is exchangeRate / Q96 wei. At 1x rate, this is 1 wei. At 2x rate, 2 wei. Even at 1000x rate, only 1000 wei = 0.001 USDC. Not a practical concern. The ERC4626 preview functions should return 0 shares for such deposits, warning the user."
