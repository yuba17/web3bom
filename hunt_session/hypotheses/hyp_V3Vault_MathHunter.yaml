    validated: false
    priority: low
    confidence: 25
    notes: "DOWNGRADED after flow-hunter analysis. For totalSupply() to reach 0, ALL debt must be repaid first because _withdraw checks balance < assets and reverts InsufficientLiquidity (borrowed assets are not in vault balance). With no outstanding debt, there are no underwater positions to liquidate, so the socialization path is never entered. Even if totalLent were 0, missing = reserveCost - reserves, and reserves = balance + debt - lent = balance + debt (when lent=0), which would cover reserveCost in most cases. The original scenario is unreachable. Reclassifying as FALSE POSITIVE candidate."

  - id: VV-06
