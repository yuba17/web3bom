- id: VV-M-12
  tier: 1
  type: property
  description: "Liquidation: _sendPositionValue fee proportioning division by zero when feeValue == 0"
  attack_scenario: "In _sendPositionValue L1165-1168: if liquidationValue <= feeValue, fees are proportioned as liquidationValue * fees0 / feeValue. If feeValue == 0 and liquidationValue > 0, this path isn't taken (liquidationValue <= 0 is false). But in L1173: liquidity = (liquidationValue - feeValue) * liquidity / (fullValue - feeValue). If feeValue == fullValue, denominator is 0. This happens when position has only fees and no liquidity value."
  impact: "Liquidation reverts for positions where all value is in fees -- position becomes unliquidatable"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    if (ghost_allTokenIds.length > 0) {
        for (uint256 i = 0; i < ghost_allTokenIds.length && i < 5; i++) {
            (uint256 debt, uint256 fullValue,,, uint256 liquidationValue) = vault.loanInfo(ghost_allTokenIds[i]);
            if (debt > 0 && liquidationValue > 0 && liquidationValue < fullValue) {
                t(fullValue > 0, "VV-M-12: position has liquidation value but zero full value");
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 60
  notes: "The code path: if liquidationValue == fullValue, the full position is taken (no proportioning needed). If liquidationValue < fullValue and feeValue == fullValue (all value in fees), then liquidationValue <= feeValue is true, and the fee-only path runs with feeValue > 0. If feeValue == 0, liquidationValue > feeValue is true, and we go to the else branch where (fullValue - feeValue) = fullValue > 0. So division by zero only if fullValue == feeValue AND liquidationValue > feeValue, which is a contradiction. Likely safe but keeping as tier 1 for fuzzing confirmation."
  poc_sketch: ''
  call_stack: ''

