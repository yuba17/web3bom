  tier: 1
  type: property
  description: "Sum of all individual loan debtShares must equal debtSharesTotal"
  attack_scenario: "debtSharesTotal is incremented in borrow() and decremented in repay()/liquidate(). Individual loan.debtShares are also updated. If there is any code path where one changes without the other (e.g., during token replacement in onERC721Received transform mode), the totals diverge. In onERC721Received L494: loans[tokenId] = Loan(debtShares) copies debt to new token, then _cleanupLoan deletes old token. But debtSharesTotal is NOT changed here -- it stays the same because total debt hasn't changed. This is correct."
  impact: "If sum(loan.debtShares) != debtSharesTotal, interest calculation and liquidation math will be wrong, affecting all users"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 sumDebtShares = 0;
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 20; i++) {
