- id: VV-M-19
  tier: 2
  type: property
  description: "6-decimal token precision: exchange rate arithmetic with USDC (6 dec) must not lose significant precision"
  attack_scenario: "V3Vault uses the asset token's decimals for its own ERC20 shares. With USDC (6 decimals), share amounts are small numbers. The exchange rate starts at Q96 = 2^96. _convertToShares: assets * Q96 / exchangeRate. For 1 USDC (1e6): 1e6 * 2^96 / 2^96 = 1e6 shares. This is fine. But as exchangeRate grows (interest accrues), shares per asset decrease. After 100% interest: rate = 2*Q96. 1e6 * Q96 / (2*Q96) = 5e5 shares. Still fine. The concern is with very small deposits (1 wei USDC = 1): 1 * Q96 / (2*Q96) = 0 shares (rounds to 0). With _convertToShares rounding Down, deposit of 1 wei gives 0 shares."
  impact: "Micro-deposits yield zero shares, losing the depositor's assets entirely (dust loss, not critical unless systematically exploited)"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
