# ============================================================================
# MATH HUNTER
# ============================================================================

- id: MIG-MATH-01
  tier: 1
  type: property
  hunter: MathHunter
  component: CV3
  description: >
    CompoundV3 repay hace un DOBLE cap: primero cap al balance del adapter
    (si amount==max), luego cap al borrowBalanceOf(onBehalf). Esto es MAS
    conservador que AaveV2/V3 que solo hacen cap al balance y delegan el cap
    de deuda a Aave internamente.
  attack_scenario: >
    Si el doble cap tuviera un off-by-one, el adapter podria intentar repagar
    mas de lo que el usuario debe, y Compound V3 supplyTo convertiria el exceso
    en un deposito (no un repay). Pero MorphoUtilsLib.min() es correcto.
  impact: "Deposito accidental en Compound V3 en lugar de repay"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // CompoundV3Repay L30: if (max) amount = balance
    // L32: amount = MorphoUtilsLib.min(amount, borrowBalanceOf(onBehalf))
    // supplyTo con signed accounting: si amount > debt, el exceso se deposita.
    // El min() previene esto.
    //
    // Edge case: borrowBalanceOf cambia entre el read (L32) y el supplyTo (L39)
    // si hay un bloque intermedio — pero todo esto es en la misma tx, asi que
    // borrowBalanceOf es estable EXCEPTO si hay un reentrancy que modifique
    // la deuda entre L32 y L39. Compound V3 supplyTo no tiene callbacks.
    // => No hay reentrancy posible aqui.
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: >
    El edge case de "exceso se deposita" esta mitigado por el min(). Pero si
    Compound V3 accrues interest entre operaciones del mismo bundle (time=0
    entre calls, asi que no hay accrual), no hay riesgo.

- id: MIG-MATH-02
  tier: 2
  type: property
  hunter: MathHunter
  component: AV2, AV3
  description: >
    AaveV2/V3 repay con amount=type(uint256).max en el adapter se traduce a
    amount=balanceOf(adapter). Luego Aave internamente caps esto al debt del
    usuario. Si balance < debt, se repaga parcialmente. Si balance > debt, Aave
    solo toma lo necesario y devuelve el exceso al adapter (NO al usuario).
  attack_scenario: >
    Si el usuario envia mas tokens de los necesarios al adapter para el repay,
    el exceso queda en el adapter despues del repay. Si el bundle no incluye un
    erc20Transfer para recoger el exceso, los tokens quedan en el adapter y
    el siguiente usuario que haga un bundle podria reclamarlos.
  impact: "Perdida de tokens excedentes si el bundle esta mal construido"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Scenario:
    // 1. User sends 1000 USDC to adapter (via erc20TransferFrom in bundle)
    // 2. User calls aaveV3Repay(USDC, type(uint256).max, 2, user)
    // 3. Adapter sets amount = balanceOf(adapter) = 1000 USDC
    // 4. Aave V3 repay: user debt = 800 USDC, so Aave takes 800, returns 200
    // 5. 200 USDC remain in adapter
    // 6. If bundle doesn't include erc20Transfer(USDC, user, type(uint256).max)
    //    the 200 USDC are stranded
    //
    // Aave V2 repay: devuelve exceso? Depende de la version. En V2 el repay
    // caps internamente y solo toma lo necesario — el exceso queda en el caller.
    // Resultado identico: exceso queda en adapter.
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 85
  notes: >
    Esto es responsabilidad del bundle designer, no del adapter. Pero es un
    vector real de perdida de fondos si el bundle esta mal construido.
    Clasificacion: documentar como QA / informational. El adapter es correcto;
    el riesgo esta en la capa de bundle composition.

- id: MIG-MATH-03
  tier: 2
  type: property
  hunter: MathHunter
  component: CV3
  description: >
    CompoundV3 withdraw hace cap al balance del usuario (baseToken balance o
    collateral balance segun el asset). Si el usuario no tiene posicion, el
    require(amount != 0) despues del min() revierte limpiamente.
  attack_scenario: >
    Si userCollateral retornara un struct con balance=0 para un asset no
    depositado, min(amount, 0) = 0, y require(0 != 0) revierte. Seguro.
    No hay forma de extraer mas de lo que el usuario tiene.
  impact: "N/A — comportamiento correcto"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // CV3WithdrawFrom L57-59:
    // uint256 balance = asset == baseToken
    //     ? balanceOf(initiator)
    //     : userCollateral(initiator, asset).balance;
    // L61: amount = min(amount, balance);
    // L63: require(amount != 0);
    //
    // Para base token: balanceOf devuelve el supply balance (lending position)
    // Para collateral: userCollateral.balance devuelve el collateral depositado
    // Ambos son 0 si no hay posicion => require falla => revert limpio
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: El cap explicito es mas seguro que delegar al protocolo externo.

# ============================================================================
# DOMAIN HUNTER
# ============================================================================

- id: MIG-DOM-01
  tier: 2
  type: property
  hunter: DomainHunter
  component: ALL
  description: >
    Si el pool externo (Aave/Compound) esta pausado, la llamada a repay/withdraw
    revierte. El adapter no tiene logica de fallback ni manejo de pausas. El
    bundle entero falla a menos que el Call tenga skipRevert=true.
  attack_scenario: >
    Un usuario construye un bundle de migracion completo: repay deuda en Aave ->
    withdraw collateral en Aave -> supply en Morpho. Si Aave se pausa entre la
    creacion del bundle y su ejecucion, TODO el bundle revierte. El usuario no
    pierde fondos (tx revierte atomicamente), pero la migracion falla.
  impact: "DoS temporal de migracion — no hay perdida de fondos"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Aave V2: pool.paused() => todas las operaciones revierten
    // Aave V3: reserve puede estar frozen/paused individualmente
    // Compound V3: pauseGuardian puede pausar supply/withdraw
    //
    // El adapter no puede hacer nada — es un thin wrapper.
    // El bundle es atomico: si cualquier paso falla (sin skipRevert),
    // todo revierte y el usuario esta exactamente como antes.
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    Not a finding. La atomicidad del bundle protege al usuario. skipRevert=true
    en una call de migracion seria PELIGROSO (dejar al usuario con deuda
    repagada pero sin migrar el collateral).

- id: MIG-DOM-02
  tier: 1
  type: property
  hunter: DomainHunter
  component: ALL
  description: >
    Migracion parcial: si el bundle solo repaga deuda pero no retira collateral
    (o viceversa), el usuario queda en un estado intermedio donde tiene deuda
    parcialmente repagada en Aave pero el collateral sigue ahi. No hay mecanismo
    de rollback parcial dentro del adapter.
  attack_scenario: >
    El bundle repaga 100% de la deuda en Aave (paso 1), luego intenta retirar
    collateral (paso 2) pero falla porque el aToken transfer al adapter no se
    completo. Con skipRevert=false, todo revierte — seguro. Con skipRevert=true
    en el paso 2, la deuda se repago pero el collateral quedo en Aave — el
    usuario perdio los tokens usados para repagar sin obtener el collateral.
  impact: "Perdida de tokens de repay si skipRevert=true en withdraw que falla"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Si skipRevert=true en la call de withdraw:
    //   Paso 1: repay exitoso — tokens salen del adapter a Aave
    //   Paso 2: withdraw falla — skipRevert=true, bundle continua
    //   Paso 3: supply a Morpho — no hay tokens, falla (o skipRevert tambien)
    //   Resultado: deuda repagada, collateral no migrado, tokens de repay gastados
    //
    // Mitigacion: NO usar skipRevert=true en bundles de migracion.
    // Esto es responsabilidad del bundle designer, no del adapter.
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: >
    Es un riesgo de composability, no un bug del adapter. Pero es un escenario
    real si el frontend genera bundles incorrectos. Clasificar como informational
    para el bundle design guide.

- id: MIG-DOM-03
  tier: 2
  type: property
  hunter: DomainHunter
  component: AV2, AV3
  description: >
    En Aave V2/V3, el interestRateMode parametro (1=stable, 2=variable) lo pasa
    el usuario sin validacion en el adapter. Si el usuario tiene deuda variable
    pero pasa interestRateMode=1 (stable), Aave V3 repay revertira porque no
    hay deuda stable que repagar. Fallo seguro.
  attack_scenario: >
    Un bundle mal construido pasa el interestRateMode incorrecto. El repay
    revierte en Aave. Si skipRevert=false, el bundle entero falla. Fallo seguro
    pero UX confusa.
  impact: "Fallo de migracion por parametro incorrecto — sin perdida de fondos"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // El adapter no valida interestRateMode. Aave lo valida internamente.
    // Si el modo no matchea la deuda, Aave revierte.
    // El adapter confia en que el caller (bundle designer) pasa el modo correcto.
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: Informational — validacion delegada al protocolo externo.

# ============================================================================
# TRUST BOUNDARY HUNTER
# ============================================================================

- id: MIG-TRUST-01
  tier: 1
  type: property
  hunter: TrustBoundaryHunter
  component: ALL
  description: >
    Los pools de Aave V2, Aave V3, Aave V3 Optimizer son IMMUTABLES seteados en
    el constructor. No pueden ser cambiados post-deployment. Un pool malicioso
    solo podria inyectarse si el deployer pasa una direccion maliciosa al
    constructor — lo cual es un ataque al deployment, no al adapter.
  attack_scenario: >
    Si los pools NO fueran immutables, un atacante podria cambiar AAVE_V2_POOL
    a un contrato malicioso que roba los tokens aprobados con forceApprove(max).
    Dado que son immutables, este vector esta eliminado.
  impact: "N/A — pools son immutables"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // AaveV2: IAaveV2 public immutable AAVE_V2_POOL; (L13)
    // AaveV3: IAaveV3 public immutable AAVE_V3_POOL; (L13)
    // AVO: IAaveV3Optimizer public immutable AAVE_V3_OPTIMIZER; (L13)
    // CV3: NO tiene pool immutable — recibe `instance` como parametro!
    //
    // ATENCION: CompoundV3 es diferente — el instance se pasa por parametro
    // en cada llamada, no es immutable. Ver MIG-TRUST-02.
  ghost_vars: []
  validated: true
  priority: high
  confidence: 99
  notes: >
    AaveV2/V3/AVO son seguros por immutability. CV3 tiene un modelo diferente.

- id: MIG-TRUST-02
  tier: 1
  type: property
  hunter: TrustBoundaryHunter
  component: CV3
  description: >
    CompoundV3MigrationAdapter NO tiene un pool immutable. El parametro `instance`
    se pasa en CADA llamada a compoundV3Repay y compoundV3WithdrawFrom. Esto
    permite flexibilidad (multiples Comet markets) pero abre un vector: el
    bundle designer puede pasar un `instance` arbitrario.
  attack_scenario: >
    Un atacante construye un bundle que pasa un contrato malicioso como `instance`
    en compoundV3Repay. El adapter hace forceApprove(asset, instance, max), luego
    llama instance.supplyTo(). El contrato malicioso podria hacer un
    transferFrom del adapter durante supplyTo, robando los tokens aprobados.
    PERO: el atacante es el initiator del bundle — solo puede robar tokens que
    EL MISMO envio al adapter. No puede robar tokens de OTROS usuarios porque
    onlyBundler3 previene llamadas fuera de un bundle.
  impact: >
    Bajo — el atacante solo puede manipular su propio bundle. Si el bundle es
    construido por un frontend malicioso que inyecta un instance falso, el
    usuario del frontend perderia sus tokens.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // compoundV3Repay flujo con instance malicioso:
    // 1. User envia tokens al adapter (via bundle)
    // 2. Adapter: forceApprove(asset, MALICIOUS_INSTANCE, max)
    // 3. Adapter: MALICIOUS_INSTANCE.supplyTo(onBehalf, asset, amount)
    //    -> MALICIOUS_INSTANCE podria llamar asset.transferFrom(adapter, attacker, max)
    //    porque tiene approval
    // 4. Adapter: forceApprove(asset, MALICIOUS_INSTANCE, 0) — pero tokens ya robados
    //
    // PERO: esto solo funciona si el USUARIO (via su bundle) pasa el instance malicioso.
    // El adapter no puede distinguir un Comet real de uno falso.
    //
    // Mitigacion: el frontend deberia validar que instance es un Comet conocido.
    // A nivel de adapter, esta es una decision de diseno explicita (soportar
    // multiples Comet markets sin re-deploy).
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: >
    VECTOR INTERESANTE pero la responsabilidad es del bundle designer, no del
    adapter. El adapter asume que el caller sabe lo que hace (patron comun en
    bundler architectures). Documentar como informational — el frontend es la
    linea de defensa. Si el frontend es comprometido, este es un path de ataque.

- id: MIG-TRUST-03
  tier: 2
  type: property
  hunter: TrustBoundaryHunter
  component: AVO, CV3
  description: >
    Las funciones de withdraw del Optimizer y CompoundV3 dependen de que el
    usuario haya dado permisos previos (approveManager para AVO, allow para CV3).
    Estos permisos son PERSISTENTES — no se revocan automaticamente despues de
    la migracion.
  attack_scenario: >
    Si el usuario aprueba al adapter como manager en AaveV3 Optimizer y luego no
    la revoca, el adapter retiene la capacidad de retirar de su posicion
    indefinidamente. Sin embargo, solo puede ser trigereado via un bundle donde
    el usuario es el initiator — nadie mas puede activar un withdraw en nombre
    del usuario.
  impact: "Riesgo de persistencia de permisos — no explotable directamente"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // AVO: AAVE_V3_OPTIMIZER.withdraw(underlying, amount, initiator(), receiver, maxIterations)
    //   -> Optimizer verifica que msg.sender (adapter) es manager de initiator()
    //   -> Si el usuario no revoco approveManager, el adapter puede seguir retirando
    //
    // CV3: ICompoundV3(instance).withdrawFrom(initiator, receiver, asset, amount)
    //   -> Compound verifica que msg.sender (adapter) tiene allowance de initiator
    //
    // En ambos casos, solo un bundle con el usuario como initiator puede triggear.
    // Un tercero no puede explotar esto.
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Best practice: incluir una call de revocacion al final del bundle de migracion.
    Informational — no es un bug del adapter.

