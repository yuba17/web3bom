- id: MIG-WILD-01
  tier: 1
  type: property
  hunter: WildcardHunter
  component: CV3
  description: >
    CompoundV3 repay usa supplyTo (signed accounting) en lugar de repay().
    En Compound V3, un supply a una cuenta con deuda REDUCE la deuda. Pero si
    onBehalf NO tiene deuda y el cap min(amount, borrowBalanceOf) produce 0,
    require(amount != 0) revierte. No hay path donde un supply sin deuda se
    ejecute exitosamente.
  attack_scenario: >
    Que pasa si un usuario llama compoundV3Repay para una cuenta SIN deuda?
    borrowBalanceOf = 0, min(amount, 0) = 0, require(0 != 0) revierte.
    No se puede usar compoundV3Repay para depositar en Compound V3 como efecto
    secundario del signed accounting.
  impact: "N/A — el min() cap previene depositos accidentales"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // L32: amount = MorphoUtilsLib.min(amount, ICompoundV3(instance).borrowBalanceOf(onBehalf));
    // Si borrowBalanceOf == 0: amount = 0
    // L34: require(amount != 0, ErrorsLib.ZeroAmount()); -> REVERT
    //
    // No hay forma de llegar a supplyTo con amount > 0 si onBehalf no tiene deuda.
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 95
  notes: Buen diseno — el doble cap (balance + debt) elimina el edge case de signed accounting.

- id: MIG-WILD-02
  tier: 1
  type: property
  hunter: WildcardHunter
  component: ALL
  description: >
    Cross-protocol interaction: un bundle de migracion tipicamente hace
    repay-on-source + withdraw-on-source + supply-on-morpho + borrow-on-morpho.
    Si el repay excede lo necesario en la source, el exceso queda en el adapter.
    Si el supply-on-morpho asume que TODO el balance del adapter son tokens del
    withdraw, la contabilidad puede desviarse.
  attack_scenario: >
    Bundle: (1) enviar 1000 USDC al adapter, (2) aaveV3Repay(USDC, max, 2, user)
    — Aave toma 800, devuelve 200 al adapter, (3) aaveV3Withdraw(WETH, max, adapter)
    — adapter recibe 5 WETH, (4) morphoSupply(WETH, max, ...) — OK,
    (5) erc20Transfer(USDC, user, max) — recoge los 200 USDC sobrantes.
    Si paso 5 se omite, los 200 USDC se pierden.
  impact: "Perdida de tokens si el bundle no recoge excedentes"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // El adapter es stateless — no trackea "quien puso que".
    // Todos los tokens en el adapter al momento de una operacion son accesibles.
    // Es responsabilidad del bundle incluir pasos de limpieza al final.
    //
    // El riesgo es real pero esta en la capa de composability, no en el adapter.
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 85
  notes: >
    Consistente con el diseno de Bundler3 — el adapter es un tool, no un vault.
    Documentar como informational para bundle designers.

- id: MIG-WILD-03
  tier: 2
  type: property
  hunter: WildcardHunter
  component: AV2, AV3
  description: >
    Si un aToken tiene un mecanismo de fee-on-transfer o rebasing que cambia el
    balance entre el transfer al adapter y el withdraw call, el amount calculado
    podria ser incorrecto. Los aTokens standard de Aave son rebasing (balance
    aumenta con interes acumulado) pero el rebasing ocurre por bloque — dentro
    de la misma tx es estable.
  attack_scenario: >
    Un token exotico listado en Aave que cobra fee-on-transfer causaria que el
    adapter reciba menos aTokens de los esperados. El withdraw intentaria
    retirar mas de lo que el adapter tiene en aTokens, y Aave revertiria.
    Fallo seguro pero inesperado.
  impact: "Fallo de migracion con tokens exoticos — sin perdida de fondos"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Los aTokens standard de Aave NO cobran fee-on-transfer.
    // El rebasing ocurre via scaledBalanceOf * liquidityIndex, pero dentro
    // de la misma tx el liquidityIndex es constante tras el primer accrue.
    // Edge case: si hay un accrue entre el transfer-to-adapter y el withdraw,
    // el balance podria cambiar minimamente. Pero Aave's withdraw con
    // type(uint256).max retira todo — no hay over-withdraw posible.
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: Teorico — no hay aTokens con fee-on-transfer en produccion.

- id: MIG-WILD-04
  tier: 1
  type: property
  hunter: WildcardHunter
  component: CV3
  description: >
    CompoundV3 userCollateral(initiator, asset).balance usa uint128 internamente.
    Si el balance real excede uint128.max (~3.4e38), habria truncamiento. En
