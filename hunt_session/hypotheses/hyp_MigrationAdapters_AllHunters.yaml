  hunter: FlowHunter
  component: AVO
  description: >
    aaveV3OptimizerWithdraw y aaveV3OptimizerWithdrawCollateral usan initiator()
    como onBehalf para el withdraw. El Optimizer hace withdraw DESDE la posicion
    del initiator (no del adapter). Esto requiere que el initiator haya aprobado
    al adapter como manager en el Optimizer previamente.
  attack_scenario: >
    Si initiator() devolviera address(0) o un valor incorrecto fuera de un
    bundle context, el withdraw se haria desde una posicion incorrecta. Pero
    onlyBundler3 garantiza que estamos en un bundle, y Bundler3.initiator()
    devuelve el msg.sender original del multicall.
  impact: "Retiro de fondos de la posicion incorrecta"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // initiator() en CoreAdapter L77-79:
    //   return IBundler3(BUNDLER3).initiator();
    // Bundler3 setea initiator al msg.sender del multicall().
    // onlyBundler3 garantiza que solo Bundler3 puede llamar.
    // => initiator() siempre es el usuario que inicio el bundle.
    //
    // El usuario DEBE haber llamado approveManager(adapter, true)
    // en el Optimizer ANTES del bundle de migracion.
    // Si no lo hizo, el withdraw revierte en el Optimizer — fallo seguro.
  ghost_vars: []
  validated: true
  priority: high
  confidence: 95
  notes: >
    initiator() NO es spoofable: solo Bundler3 puede llamar al adapter
