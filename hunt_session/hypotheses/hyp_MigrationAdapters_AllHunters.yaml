# ============================================================================
# RESUMEN EJECUTIVO
# ============================================================================
# Los 4 adaptadores de migracion son thin wrappers (~65 LOC cada uno) que:
#   1. Reciben tokens/aTokens previamente enviados al adapter
#   2. Aprueban el pool externo (Aave/Compound)
#   3. Llaman repay/withdraw en el pool externo
#   4. Revocan aprobacion (patron approve-max -> action -> approve-zero)
#
# Patron de seguridad comun:
#   - Todas las funciones tienen onlyBundler3 (sin excepciones)
#   - No hay estado mutable (solo immutables)
#   - El flujo de fondos es unidireccional dentro de cada operacion
#
# DIFERENCIAS CLAVE entre adaptadores:
#   - AaveV2/V3 withdraw: usa msg.sender (adapter) como "from" implicitamente
#     porque los aTokens fueron transferidos al adapter previamente
#   - AaveV3Optimizer withdraw: usa initiator() como "onBehalf" — el usuario
#     debe haber aprobado al adapter como manager en el Optimizer
#   - CompoundV3 withdraw: usa initiator() como "src" via withdrawFrom — el
#     usuario debe haber dado allowance al adapter en Compound
#   - CompoundV3 repay: usa supplyTo (signed accounting), NO repay directo
#   - CompoundV3 repay: hace min(amount, borrowBalanceOf) — doble cap EXPLICITO
#     AaveV2/V3 repay: delegan el cap a Aave internamente
# ============================================================================

invariants:

# ============================================================================
# ACCESS HUNTER
# ============================================================================

- id: MIG-ACC-01
  tier: 2
  type: property
  hunter: AccessHunter
  component: ALL
  description: >
    Todas las funciones externas de los 4 adaptadores (excepto receive() y los
    getters immutable) tienen el modifier onlyBundler3. No existen funciones
    externas sin proteccion de acceso.
  attack_scenario: >
    Si existiera una funcion sin onlyBundler3, un atacante podria llamarla
    directamente para drenar tokens que esten temporalmente en el adapter
    durante un bundle de otro usuario.
  impact: "Robo directo de tokens en transito durante migracion"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificacion estatica — no se puede fuzzear, se verifica por inspeccion:
    // AaveV2: aaveV2Repay(onlyBundler3), aaveV2Withdraw(onlyBundler3) — OK
    // AaveV3: aaveV3Repay(onlyBundler3), aaveV3Withdraw(onlyBundler3) — OK
    // AVO: aaveV3OptimizerRepay(onlyBundler3), aaveV3OptimizerWithdraw(onlyBundler3),
    //       aaveV3OptimizerWithdrawCollateral(onlyBundler3) — OK
    // CV3: compoundV3Repay(onlyBundler3), compoundV3WithdrawFrom(onlyBundler3) — OK
    // CoreAdapter: nativeTransfer(onlyBundler3), erc20Transfer(onlyBundler3) — OK
    // receive() — sin proteccion pero solo acepta ETH, no drena nada
    // RESULTADO: 100% cobertura de onlyBundler3 en funciones mutables
  ghost_vars: []
  validated: true
  priority: high
  confidence: 99
  notes: >
    Verificado por lectura manual exhaustiva. No hay funciones ocultas ni
    fallbacks peligrosos. receive() solo acepta ETH pasivamente.

- id: MIG-ACC-02
  tier: 2
  type: property
  hunter: AccessHunter
  component: ALL
  description: >
    CoreAdapter.receive() es payable sin restriccion — cualquiera puede enviar
    ETH al adapter. Esto es by-design para recibir unwrapped ETH del WETH
    contract, pero significa que ETH puede quedar atrapado si no se recoge.
  attack_scenario: >
    Un atacante envia dust ETH al adapter antes de un bundle de un usuario. El
    usuario hace nativeTransfer(type(uint256).max) esperando recibir solo SU
    ETH, pero recibe el extra del atacante. Impacto: grief de dust, no es
    explotable para robo.
  impact: "Grief de dust — no explotable para robo"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // El adapter no guarda estado de "quien envio que" — los tokens que estan
    // en el adapter al momento de un erc20Transfer/nativeTransfer van al receiver.
    // Esto es by-design: el adapter es stateless entre bundles.
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    No es un finding. El patron stateless es intencional — el adapter se limpia
    al final de cada bundle via erc20Transfer/nativeTransfer. Si queda algo,
    cualquiera con acceso via bundler3 puede reclamarlo en un bundle posterior.

