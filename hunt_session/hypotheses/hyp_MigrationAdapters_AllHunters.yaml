    funciones de repay (aaveV2Repay, aaveV3Repay, aaveV3OptimizerRepay) y en
    compoundV3Repay. Cada repay sigue: forceApprove(max) -> call -> forceApprove(0).
  attack_scenario: >
    Si el approve(0) final faltara en alguna funcion, el pool externo retendria
    allowance infinita sobre el adapter. Un atacante podria explotar esto en un
    bundle posterior donde el adapter contenga tokens del mismo tipo.
  impact: "Tokens del adapter drenados via allowance residual"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificacion por inspeccion:
    // AaveV2Repay L44: forceApprove(max) -> L46: repay -> L48: forceApprove(0) — OK
    // AaveV3Repay L45: forceApprove(max) -> L47: repay -> L49: forceApprove(0) — OK
    // AVORepay L40: forceApprove(max) -> L42: repay -> L44: forceApprove(0) — OK
    // CV3Repay L36: forceApprove(max) -> L39: supplyTo -> L41: forceApprove(0) — OK
    // RESULTADO: Patron consistente en los 4 adaptadores. Sin allowance residual.
  ghost_vars: []
  validated: true
  priority: high
  confidence: 99
  notes: >
    Importante: si el repay/supplyTo revierte internamente, la ejecucion entera
    revierte y el approve(0) no se ejecuta — pero el approve(max) tampoco
    persiste porque toda la tx revierte. Seguro.

