  attack_scenario: "Si _multicall() revierte (e.g., call fails sin skipRevert), ¿initiator se resetea a address(0)? Sí — EVM revert restaura todo el estado incluyendo transient storage. Pero: ¿qué pasa si multicall() es called, _multicall pasa, pero initiator=address(0) line 54 falla por alguna razón?"
  impact: "Teóricamente initiator podría quedar set, bloqueando futuras multicalls. Pero transient storage se limpia al final de la tx de todas formas."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After any multicall (success or fail), initiator MUST be address(0)
    // Transient storage guarantees this at tx boundary
    eq(uint256(uint160(bundler3.initiator())), 0, "B-03: initiator not cleared");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: "Secure by design. Transient storage (EIP-1153) se limpia al final de cada tx. initiator=0 en L54 es belt-and-suspenders."

