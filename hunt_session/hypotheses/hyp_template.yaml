# hyp_template.yaml — Schema de hipótesis de hunter
# Copia este archivo como: hyp_{ComponentName}_{HunterType}.yaml
# Ejemplo: hyp_GaugeManager_MathHunter.yaml
#
# Hunter types: MathHunter | AccessHunter | FlowHunter | OracleHunter | DomainHunter | WildcardHunter

protocol: revert-lend
component: ComponentName
file: src/ComponentName.sol
domain: staking          # lending | vault | staking | oracle | dex | access | flash | token
hunter: MathHunter
generated_at: "2026-03-20T00:00:00Z"

invariants:
  - id: CN-01            # CN = ComponentName abbreviation, sequential 01..99
    tier: 1              # 1=hard fail (fund loss confirmado), 2=needs review, 3=optimization only
    type: property       # property | optimize | ghost
    description: "Descripción corta del invariante"
    attack_scenario: "Si esto se rompe, un atacante puede..."
    solidity: |
      // Cuerpo de la función property_cn_01() — sin firma, solo el body
      uint256 current = contract.someValue();
      if (ghost_lastValue > 0) {
          gte(current, ghost_lastValue, "CN-01: valor disminuyó");
      }
      ghost_lastValue = current;
    ghost_vars:
      - "uint256 internal ghost_lastValue;"
    validated: false      # DEJAR EN false. Solo cambiar a true cuando el body Solidity es completo y correcto. merge_invariants.py ignora validated: false.
    priority: high        # high | medium | low (low = omitido salvo --include-low)
    confidence: 80        # 0-100: ajustar honestamente. Si < 60, dejar validated: false.
    notes: ""

  - id: CN-02
    tier: 3
    type: optimize
    description: "Maximizar extracción de rewards por atacante"
    attack_scenario: "Si el profit es positivo, hay un vector de extracción económica"
    solidity: |
      return int256(rewardToken.balanceOf(attacker)) - int256(INITIAL_ATTACKER_BALANCE);
    ghost_vars: []
    validated: false      # Cambiar a true solo cuando el body Solidity es completo y correcto
    priority: medium
    confidence: 60
    notes: "Solo relevante si el componente maneja rewards"

# Findings investigados y descartados por este hunter
false_positives:
  - hunter: MathHunter
    id: CN-FP-01
    reason: "El comportamiento es by design según los docs"
    investigated_at: "2026-03-20T00:00:00Z"
    pending_briefing_update:        # opcional: actualizar knowledge base con este aprendizaje
      action: add_to_trampas        # add_to_trampas | add_bug_entry | add_invariant
      briefing: staking.md
      content: "El rounding de 1 wei en rewardPerToken por epoch es esperado — no es bug"
