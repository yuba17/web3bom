- id: BPM-W01
  tier: 1
  type: property
  description: "activeId=0 sentinel collision: checkPoolInitialized uses activeId==0 as 'not initialized', but activeId=0 is a valid uint24. If initialize() succeeds with activeId=0, pool is permanently bricked — all operations revert via checkPoolInitialized. Meanwhile poolIdToPoolKey is set, blocking re-initialization."
  attack_scenario: >
    initialize() calls PriceHelper.getPriceFromId(0, binStep). This computes
    base^(0 - 2^23) = base^(-8388608). For binStep=1, base is minimal but the
    exponent is extreme. If Uint128x128Math.pow() does NOT revert (returns 0 or a tiny
    value), initialize completes and sets slot0 with activeId=0. After that:
    1) checkPoolInitialized() sees activeId==0 → reverts PoolNotInitialized
    2) All operations (swap, mint, burn, donate) call checkPoolInitialized first → all revert
    3) initialize() checks activeId() != 0 for PoolAlreadyInitialized → but activeId IS 0,
       so it doesn't revert on PoolAlreadyInitialized. However, slot0 has lpFee and protocolFee
       set, which means the pool IS partially initialized in storage but functionally dead.
    4) poolIdToPoolKey maps this poolId → makes the namespace consumed.
    Verification needed: does pow() revert for extreme negative exponents or return 0?
  impact: "Permanent pool bricking — poolId namespace consumed, any tokens sent to pool unrecoverable"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: can we initialize a pool with activeId = 0?
    try poolManager.initialize(key, 0) {
      // If this succeeds, pool is bricked
      (uint24 aid,,) = poolManager.getSlot0(poolId);
      t(aid != 0, "BPM-W01: pool initialized with activeId=0, permanently bricked");
    } catch {
      // Expected: getPriceFromId should revert for extreme negative exponent
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 40
  notes: >
    The assembly guard in swap (iszero(nextId) → revert) prevents activeId reaching 0
    via swap traversal. The real question is whether initialize() itself allows it.
    If pow() returns 0 for extreme negative exponents, getPriceFromId returns 0 and
    does NOT revert → pool created at activeId=0 is permanently bricked.

