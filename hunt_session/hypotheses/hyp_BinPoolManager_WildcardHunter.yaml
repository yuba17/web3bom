- id: BPM-W05
  tier: 1
  type: property
  description: "Composition fee front-running: attacker manipulates active bin ratio via swap, then victim's mint into active bin incurs maximum composition fees. The fee goes to existing LPs (including the attacker who minted before the swap)."
  attack_scenario: >
    1. Active bin has balanced reserves: 50% tokenX, 50% tokenY.
    2. Attacker swaps a large amount of tokenX for tokenY, pushing active bin to 99% tokenX.
    3. Victim mints into active bin providing balanced 50/50 liquidity.
    4. Because bin is 99% tokenX, the victim's 50% tokenY portion triggers a composition fee
       (implicit swap from Y to X at the bin price).
    5. Composition fee = getCompositionFee(amtSwapped, swapFee). With 10% max fee:
       fee = amtSwapped * 0.1 * 1.1 / 1 = 11% of the Y portion.
    6. This fee increases bin reserves for existing LPs (attacker captured most shares
       before the swap that imbalanced the bin).
    7. Attacker then swaps back to rebalance, profits from fee extraction.

    Key: the composition fee is designed to prevent implicit swaps via mint. But the
    attacker can deliberately create the conditions that maximize the fee for others.
    The attacker profits as an LP receiving the composition fee from the victim.

    Profitability depends on: swap fee (cost of imbalancing the bin) vs composition fee
    collected from victim's mint. If swap fee < composition fee on victim's amount,
    attacker profits.
  impact: "LP value extraction via composition fee manipulation — front-running victim mints"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track composition fees paid per mint
    // compositionFeeAmount is returned by mint()
    // Invariant: composition fee should not exceed X% of total deposit value
    if (ghost_lastCompositionFee > 0 && ghost_lastMintValue > 0) {
      uint256 feeRatio = ghost_lastCompositionFee * 1e18 / ghost_lastMintValue;
      // Composition fee should not exceed 12% (max fee 10% * 1.1 factor)
      lte(feeRatio, 12e16, "BPM-W05: composition fee exceeds 12% of mint value");
    }
  ghost_vars:
  - "uint256 internal ghost_lastCompositionFee;"
  - "uint256 internal ghost_lastMintValue;"
  validated: false
  priority: high
  confidence: 50
  notes: >
    The composition fee formula: getCompositionFee(amt, feeBips) = amt * fee * (fee + 1e18) / 1e36.
    At max fee (100_000 bips = 10%), this is amt * 0.1e18 * 1.1e18 / 1e36 = 0.11 * amt = 11%.
    The attacker's cost is the swap fee to imbalance the bin. If swap fee is also 10%,
    the attack is break-even at best. But with dynamic fees, a hook could set swap fee
    to 0 for the attacker (see BPM-W05 in original). Without hook manipulation, this
    is probably not profitable. Worth fuzzing to find fee configurations where it works.

- id: BPM-W06
  tier: 1
  type: property
  description: "exactOutput swap rounding: getAmountsIn calculates amountInWithoutFee using shiftDivRoundUp/mulShiftRoundUp. For tiny amountOut values at specific price points, the rounding-up of input could mean user pays significantly more than fair price. Over many small exactOutput swaps, this extracts value from swapper."
  attack_scenario: >
    For exactOutput, swapForY=true (X→Y):
      amountInWithoutFee = amountOut.shiftDivRoundUp(128, price)
    This rounds UP, meaning user pays at least 1 wei more than exact.
    Then feeAmount = amountInWithoutFee.getFeeAmount(fee) which also rounds UP.
    Total input = amountInWithoutFee + feeAmount — both rounded up.

    For amountOut = 1 at a specific price, shiftDivRoundUp(1, 128, price):
    = (1 << 128 + price - 1) / price = ceil(2^128 / price)
    For price = 2^128 (activeId = 2^23): input = 1. Fair.
    For price = 2^128 + 1: input = ceil(2^128 / (2^128+1)) = 1. Still fair.
    For price = 2^127: input = ceil(2^128 / 2^127) = 2. User pays 2x for 1 unit.

    For bins below center (price < 2^128), user overpays. For bins above center
    (price > 2^128), the rounding favors the user less but still rounds up.
    This is standard rounding behavior but combined with fees rounding up too,
    the total overpayment per swap step can be 2-3 wei.

    NOT a practical exploit — the rounding amounts are negligible in absolute terms.
    But worth documenting for completeness.
  impact: "Per-swap rounding overpayment of 1-3 wei for exactOutput swaps — negligible individually"
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Compare actual input paid vs theoretical input for exactOutput swap
    // The invariant: input paid should be within 3 wei of theoretical for single-bin swaps
    t(true, "BPM-W06: rounding analysis — manual calculation required per price point");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: >
    Standard rounding behavior. All roundings favor the pool/LPs, which is correct design.
    Including because some audit platforms accept rounding-direction findings as QA/Info.

- id: BPM-W07
  tier: 1
  type: property
  description: "Cross-pool price manipulation via shared tokens: two BinPools with the same token pair but different binSteps have independent price states. An attacker can arbitrage between them, and if any external protocol uses BinPoolManager.getSlot0(poolId).activeId as an oracle, the attacker controls the 'price' seen by that protocol."
  attack_scenario: >
    1. Pool A: WETH/USDC with binStep=1. Pool B: WETH/USDC with binStep=100.
    2. Both initialized at similar activeId (representing ~$3000 WETH).
    3. Attacker executes large swap on Pool A (low fee due to binStep=1), moving activeId
       significantly — e.g., from bin 8388608 to 8388708 (100 bins = ~1% price move).
    4. Any protocol reading Pool A's activeId as a price oracle now sees manipulated price.
    5. Attacker exploits the oracle-reading protocol (borrow at wrong collateral value, etc.).
    6. Attacker arbitrages Pool A back to fair price via Pool B or external DEX.

    The BinPoolManager itself is not vulnerable — the risk is for EXTERNAL protocols
    that use BinPool's activeId as a spot price oracle. Unlike Uniswap v3's TWAP,
    BinPool has no built-in time-weighted oracle mechanism. The activeId IS the spot
    price and is trivially manipulable within a single transaction.
  impact: "External oracle manipulation via activeId — loss of funds in oracle-dependent protocols"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track activeId changes within a single test step
    (uint24 activeIdBefore,,) = binPoolManager.getSlot0(poolId);
    // ... swap ...
    (uint24 activeIdAfter,,) = binPoolManager.getSlot0(poolId);

    uint24 delta = activeIdAfter > activeIdBefore
      ? activeIdAfter - activeIdBefore
      : activeIdBefore - activeIdAfter;

    // Large activeId moves in a single tx indicate potential manipulation
    // For binStep=1, each bin = 0.01% price change. 100 bins = 1%.
    lte(uint256(delta), 1000, "BPM-W07: activeId moved >1000 bins in single operation");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    This is not a BinPoolManager bug per se — the activeId is DESIGNED to be the spot
    price. The bug would be in any external protocol that uses it as an oracle without
    TWAP or other manipulation resistance. However, the lack of a built-in TWAP mechanism
    (unlike Uniswap v3 which has observe()) is a design limitation worth flagging.
    getSlot0() is a public view function that any contract can read.

- id: BPM-W08
  tier: 1
  type: property
  description: "First-depositor share inflation in individual bins: MINIMUM_SHARE=1e3 may be insufficient protection. Attacker is first to mint into a new bin, gets (shares - 1e3). If they then manipulate reserves-per-share via composition fees (not donate — donate requires 2^128 shares), subsequent depositors get fewer shares."
  attack_scenario: >
    1. Attacker mints into empty bin at activeId. Supply becomes S. Attacker gets S - 1e3.
    2. Attacker needs to inflate reserves without minting shares.
       - donate() requires 2^128 shares in the bin → NOT possible on a new bin.
       - Swap that crosses the bin adds reserves (input token) and removes reserves (output).
         Net effect on reserves depends on fee: input_with_fee - output = fee amount stays.
         The fee accrues to the bin's reserves → inflates value per share.
    3. If attacker can trigger many swaps through this bin, the accumulated fees inflate
       reserves per share. Then victim's mint gets fewer shares.

    However: the attacker cannot easily trigger swaps through a specific bin unless they
    also provide liquidity on both sides (creating the market). And the fee accrual is
    shared proportionally with the MINIMUM_SHARE holder (dead shares), which limits profit.

    With MINIMUM_SHARE = 1e3 and 18-decimal tokens:
    - Attacker deposits 1e18 tokens, gets 1e18 - 1e3 shares.
    - Share price = 1e18 / (1e18 tokens). MINIMUM_SHARE controls 1e3 / 1e18 = 1e-15 of bin.
    - To make MINIMUM_SHARE control significant value, need reserves >> 1e18.
    - This requires huge fee accrual or external reserve inflation (donate blocked).

    Conclusion: MINIMUM_SHARE = 1e3 is likely sufficient for 18-decimal tokens but
    potentially vulnerable for low-decimal tokens (e.g., USDC with 6 decimals).
    For 6-decimal: 1e3 shares out of 1e6 deposit = 0.1% of bin controlled by dead shares.
  impact: "Share inflation on new bins — potential LP value theft for low-decimal tokens"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Track share price consistency across mints into the same bin
    (uint128 rx, uint128 ry,, uint256 totalShares) = binPoolManager.getBin(poolId, activeId);
    if (totalShares > 0 && ghost_prevSharePrice > 0) {
      uint256 currentSharePrice = (uint256(rx) + uint256(ry)) * 1e18 / totalShares;
      // Share price should not increase by more than 100x between consecutive mints
      // (100x would indicate inflation attack)
      lte(currentSharePrice, ghost_prevSharePrice * 100,
        "BPM-W08: share price inflated >100x between mints — possible inflation attack");
    }
    if (totalShares > 0) {
      ghost_prevSharePrice = (uint256(rx) + uint256(ry)) * 1e18 / totalShares;
    }
  ghost_vars:
  - "uint256 internal ghost_prevSharePrice;"
  validated: false
  priority: high
  confidence: 45
  notes: >
    The 2^128 minBinShareForDonate threshold effectively blocks the donate-based inflation
    vector. Swap fee accrual is the remaining inflation path but it's slow and proportional.
    For 18-decimal tokens, MINIMUM_SHARE=1e3 is sufficient. For 2-decimal tokens (if any),
    it might not be. Worth fuzzing with different token decimal configurations.

- id: BPM-W09
  tier: 1
  type: property
  description: "swap() exactOutput at extreme prices: getAmountsIn for swapForY=true computes amountInWithoutFee = amountOut.shiftDivRoundUp(128, price). If price is very high (bin far above center), shiftDivRoundUp(amountOut, 128, price) could equal 0 for small amountOut, making amountIn = 0 + fee(0) = 0. User gets output tokens for free."
  attack_scenario: >
    For swapForY=true (X→Y), exactOutput:
      amountInWithoutFee = amountOutOfBin.shiftDivRoundUp(SCALE_OFFSET, price)
    shiftDivRoundUp(x, 128, y) = (x << 128 + y - 1) / y

    For x = amountOutOfBin, y = price:
    If amountOutOfBin = 1, price = type(uint256).max:
      (1 << 128 + type(uint256).max - 1) / type(uint256).max
      = (2^128 + 2^256 - 2) / (2^256 - 1)
      = approximately 1 (rounds up to 1)
    So amountInWithoutFee >= 1 for any price.

    Actually: shiftDivRoundUp ensures result >= 1 when numerator > 0.
    (x << 128 + y - 1) / y >= 1 iff x << 128 >= 1, which is true when x >= 1.
    So amountInWithoutFee >= 1 always. No free tokens.

    BUT: for the opposite direction (swapForY=false, X←Y), exactOutput:
      amountInWithoutFee = amountOutOfBin.mulShiftRoundUp(price, SCALE_OFFSET)
    mulShiftRoundUp(x, price, 128) = (x * price + 2^128 - 1) >> 128

    For x = 1, price = 1 (bin at extreme low):
      (1 * 1 + 2^128 - 1) >> 128 = (2^128) >> 128 = 1.
    Still >= 1. Safe.

    For x = 1, price = 0: this shouldn't happen as getPriceFromId returns > 0 for valid bins.
  impact: "Free token extraction via zero-input exactOutput swaps — LIKELY FALSE POSITIVE after analysis"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that exactOutput swaps always require non-zero input
    // amountSpecified > 0 = exactOutput
    // After swap: check that the payer's balance decreased
    uint256 balBefore = ghost_balanceBefore;
    // ... swap exactOutput for 1 wei ...
    // Input token balance should have decreased
    t(ghost_balanceAfter < balBefore, "BPM-W09: exactOutput swap required 0 input");
  ghost_vars:
  - "uint256 internal ghost_balanceBefore;"
  - "uint256 internal ghost_balanceAfter;"
  validated: false
  priority: medium
  confidence: 30
  notes: >
    After mathematical analysis, shiftDivRoundUp and mulShiftRoundUp both produce >= 1
    for any non-zero inputs. Combined with getFeeAmount (which also rounds up), total
    amountIn >= 2 for any exactOutput swap. This is likely a false positive but worth
    confirming via Halmos symbolic execution for all possible price/amount combinations.

- id: BPM-W10
  tier: 1
  type: property
  description: "donate() target race in batched vault operations: donate always targets slot0.activeId at execution time. In a batched unlock callback (vault pattern), a preceding swap can change activeId. The donation goes to a different bin than the caller intended, enriching unintended LPs."
  attack_scenario: >
    In the vault/unlock pattern, a router batches multiple operations:
    1. Router calls vault.unlock(data) with batched ops = [swap(X→Y, large), donate(100, 100)].
    2. Swap executes first, moving activeId from 8388608 to 8388650 (42 bins moved).
    3. Donate executes, reads activeId = 8388650, donates to that bin.
    4. The caller intended to donate to bin 8388608 where their LP position is.
    5. The donation enriches LPs at bin 8388650 — possibly the attacker who has LP there.

    MEV scenario: attacker sees a pending tx that does swap+donate in a batch.
    Attacker front-runs with a mint at the expected post-swap activeId.
    Attacker receives the donation via their LP position.
    Attacker back-runs with a burn to extract.

    The root cause: donate() has no `targetBinId` parameter — it always uses live activeId.
    Unlike mint() which specifies exact bin IDs via liquidityConfigs, donate() is inherently
    vulnerable to activeId manipulation in the same transaction.
  impact: "Donation to unintended bin in batched transactions — MEV extraction of donated funds"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track that donate goes to the expected bin
    (uint24 preSwapActiveId,,) = binPoolManager.getSlot0(poolId);
    // ... swap that changes activeId ...
    (uint24 postSwapActiveId,,) = binPoolManager.getSlot0(poolId);
    // ... donate ...
    // The donate went to postSwapActiveId, not preSwapActiveId
    if (preSwapActiveId != postSwapActiveId) {
      // Donation went to wrong bin — flag for review
      t(false, "BPM-W10: activeId changed before donate in same tx — donation misdirected");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    This is more of a design limitation than a bug. The caller should be aware that donate()
    uses live state. However, in complex batched operations (especially via routers or hooks),
    this can lead to unexpected behavior. A `targetBinId` parameter would mitigate this.
    The MEV vector depends on the attacker predicting the post-swap activeId, which is
    deterministic given the swap parameters.

