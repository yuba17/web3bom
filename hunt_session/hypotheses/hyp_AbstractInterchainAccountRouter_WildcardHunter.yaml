invariants:
- id: AIAR-W-01
  tier: 1
  type: property
  description: "receive() payable with no guard allows ETH donation to router. Combined with callRemoteWithOverrides forwarding msg.value, an attacker can force the router to forward pre-existing ETH balance to the mailbox"
  attack_scenario: "1. Attacker sends 10 ETH to router via receive(). 2. Attacker calls callRemoteWithOverrides{value: 0}() -- msg.value is 0 but _dispatchMessageWithValue passes msg.value (0) to mailbox.dispatch{value: 0}. Wait -- msg.value is forwarded, not address(this).balance. So pre-existing ETH is NOT forwarded. 3. HOWEVER: if a child contract uses address(this).balance instead of msg.value for dispatch, the donated ETH IS at risk. In THIS base class, only msg.value is forwarded. 4. The real risk: ETH sent to the router via receive() is permanently stuck. No withdrawal function exists."
  impact: "ETH permanently locked in router contract. No sweep/rescue function. Low severity unless significant ETH accumulates (e.g., from failed refunds, accidental sends)."
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // ETH balance of router should not grow unboundedly (no withdrawal mechanism)
    uint256 currentBalance = address(originRouter).balance;
    // After dispatches, any excess ETH (beyond what was sent in current tx) is stuck
    // We check that balance does not exceed what was sent via msg.value
    lte(currentBalance, ghost_totalMsgValueSent, "AIAR-W-01: excess ETH stuck in router -- no rescue");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 80
  notes: "receive() at line 132 accepts ETH with no logic. No withdraw/rescue function in AbstractInterchainAccountRouter or Router. Owner cannot recover ETH. This is a permanent loss vector. Different from IAR-DD-02 which covers callRemoteCommitReveal draining pre-existing ETH -- this covers the base class where no such drain path exists but ETH is still stuck."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-W-02
  tier: 1
  type: property
  description: "OwnableMulticall ICA is initialized with owner=address(this) (the router) but NOT initialized with any access control beyond that. Anyone who can make the router call ICA.multicall() can execute arbitrary calls FROM the ICA."
  attack_scenario: "The ICA's owner is the router (set in OwnableMulticall constructor). The router calls ica.multicall(calls) when processing inbound messages via handle(). The calls in the message come from the ORIGIN chain sender. The critical trust assumption: ONLY the legitimate origin-chain owner should be able to trigger calls on their ICA. This is enforced by: (1) Mailbox only accepts messages from enrolled routers, (2) ISM verification. But if ISM is address(0) or a permissive ISM (see AIAR-D-04), anyone can forge messages and execute arbitrary calls from any ICA."
  impact: "Complete ICA takeover -- drain all tokens, NFTs, and ETH from the interchain account if ISM verification is weak"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // ICA owner must always be the router (deterministic via Create2)
    address icaOwner = ica.owner();
    eq(uint256(uint160(icaOwner)), uint256(uint160(address(destRouter))), "AIAR-W-02: ICA owner is not the router");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 50
  notes: "This is by design -- the router is the sole controller of all ICAs. The real security relies on the ISM layer. If ISM is correctly configured, only authentic cross-chain messages from the origin owner can trigger ICA calls. The self-referential ISM (address(this)) means the router's own verify() logic is the trust boundary. Low confidence this is exploitable given correct ISM setup."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-W-03
  tier: 1
  type: property
  description: "callRemoteWithOverrides encodes msg.sender as ICA owner in the message body but uses EMPTY_SALT for salt. If two different users on origin chain have the same address but different intents, they map to the same ICA on destination."
  attack_scenario: "This is not exploitable since msg.sender is unique per account. However: callRemoteWithOverrides always uses EMPTY_SALT in the event and in InterchainAccountMessage.encode (which also defaults to EMPTY_SALT). The child contract callRemoteWithOverridesAndSalt adds salt support. In the base class, ALL users who call callRemoteWithOverrides get ICAs with salt=0. Two different callers get different ICAs (different owner in salt). Same caller always gets same ICA. No collision possible."
  impact: "Non-issue after analysis. Different msg.sender = different ICA address."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Different callers should get different ICAs
    OwnableMulticall ica1 = destRouter.getDeployedInterchainAccount(
        ORIGIN, USER1, address(originRouter), address(0)
    );
    OwnableMulticall ica2 = destRouter.getDeployedInterchainAccount(
        ORIGIN, USER2, address(originRouter), address(0)
    );
    t(address(ica1) != address(ica2), "AIAR-W-03: different users got same ICA -- collision");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: "After analysis, confirmed safe. Different owner bytes32 in _getSalt produces different hash. No collision vector."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-W-04
  tier: 1
  type: property
  description: "Composability attack: _dispatchMessageWithValue allows caller-specified _router as mailbox.dispatch recipient. Mailbox delivers to _router on destination. If _router is a contract that implements handle() but is NOT an InterchainAccountRouter, the encoded InterchainAccountMessage body is misinterpreted."
  attack_scenario: "1. Attacker deploys MaliciousRecipient on destination chain that implements handle(). 2. Attacker calls callRemoteWithOverrides(destDomain, maliciousRecipientAsBytes32, someIsm, calls, metadata). 3. Message is dispatched to MaliciousRecipient on destination. 4. MaliciousRecipient.handle() receives the message body which contains encoded owner + ism + calls. 5. MaliciousRecipient can parse this and extract the origin caller's address (encoded as owner). 6. This leaks the caller's identity to an untrusted contract -- but the caller chose to send there, so no loss. 7. Real risk: if the router-specified address is another legitimate Hyperlane app, the message could be misinterpreted as a valid app message, causing unintended state changes."
  impact: "Cross-protocol message confusion if callRemoteWithOverrides targets a non-ICA-router contract. Attacker-chosen router means attacker bears risk, but if a legitimate protocol is targeted, it could process the ICA-formatted message incorrectly."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Messages dispatched via callRemoteWithOverrides should only go to valid ICA routers
    // No on-chain way to verify destination is a valid ICA router
    // Ghost track: did we dispatch to a non-enrolled router?
    bytes32 enrolled = originRouter.routers(DESTINATION);
    t(enrolled != bytes32(0), "AIAR-W-04: test requires enrolled router");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: "By design. The override function explicitly allows custom routing. The caller bears all risk. Destination contract must handle() correctly or revert. Not a vulnerability in the ICA router itself."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-W-05
  tier: 1
  type: property
  description: "MinimalProxy bytecode is deterministic from implementation address. If implementation is upgradeable or self-destructible, all ICAs become invalid simultaneously."
  attack_scenario: "1. implementation is set immutable in constructor -- cannot be changed. 2. BUT if the implementation contract itself has a selfdestruct path (via delegatecall through OwnableMulticall.multicall -> call to self), the implementation bytecode is destroyed. 3. All MinimalProxy ICAs delegatecall to implementation. After selfdestruct, all delegatecalls return success with no code executed. 4. Any ETH/tokens in ICAs become permanently inaccessible (no code to call transfer). 5. Actually: post-Dencun EIP-6780, selfdestruct only sends ETH, does not delete code except in create-tx. So this attack is mitigated on modern EVM."
  impact: "Pre-Dencun: total loss of all ICA funds if implementation self-destructs. Post-Dencun: mitigated by EIP-6780."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Implementation should always have code (not self-destructed)
    uint256 codeSize;
    address impl = originRouter.implementation();
    assembly {
        codeSize := extcodesize(impl)
    }
    gt(codeSize, 0, "AIAR-W-05: implementation has no code -- all ICAs broken");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 35
  notes: "OwnableMulticall does not have selfdestruct. The implementation is deployed separately and its address is immutable. The only way to destroy it would be if the implementation had a delegatecall-based selfdestruct path, which OwnableMulticall does not. Safe by design."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-W-06
  tier: 2
  type: property
  description: "Deadlock: if isms[domain] is set to a value that is NOT EMPTY_SALT but the router for that domain is later unenrolled, the domain becomes permanently unusable. Cannot re-enroll (isms check fails) and cannot send/receive (no router)."
  attack_scenario: "This is the same as AIAR-D-03 viewed from the deadlock perspective. Once a domain is enrolled with a non-zero ISM and then unenrolled via unenrollRemoteRouter, the domain enters a zombie state: no router but non-zero ISM. _enrollRemoteRouterAndIsm reverts because isms[domain] != EMPTY_SALT. No function exists to clear isms[domain] independently."
  impact: "Permanent domain lockout after unenrollment. Requires proxy upgrade to fix."
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Same as AIAR-D-03: after unenroll, isms should be cleared
    bytes32 routerForDest = originRouter.routers(DESTINATION);
    bytes32 ismForDest = originRouter.isms(DESTINATION);
    if (routerForDest == bytes32(0) && ismForDest != bytes32(0)) {
        t(false, "AIAR-W-06: deadlock -- domain has stale ISM but no router, cannot re-enroll");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: "Converges with AIAR-D-03 from DomainHunter. This is the deadlock angle of the same underlying bug. The immutability check in _enrollRemoteRouterAndIsm (line 323-326) creates an irrecoverable state when combined with unenrollRemoteRouter which does not clear isms."
  poc_sketch: ''
  call_stack: 'unenrollRemoteRouter(domain) -> _routers.remove(domain) [isms NOT cleared] -> enrollRemoteRouterAndIsm(domain, ...) REVERTS'

- id: AIAR-W-07
  tier: 2
  type: property
  description: "Reimplementation gap: _enrollRemoteRouter override passes EMPTY_SALT as ISM but _enrollRemoteRouterAndIsm checks immutability of BOTH router and ism. If Router base class adds new enrollment paths that call _enrollRemoteRouter, they silently set ISM to zero."
  attack_scenario: "Future Router upgrades or new base class functions that call _enrollRemoteRouter will trigger the override which sets ISM to EMPTY_SALT. If the intent was to preserve an existing ISM, this silently resets it. Not exploitable in current code but fragile for upgrades."
  impact: "Silent ISM reset to zero on future upgrades that use base Router enrollment. Defense-in-depth concern."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // If router is enrolled, ISM should be intentionally set (not accidentally zero)
    bytes32 routerForDest = originRouter.routers(DESTINATION);
    bytes32 ismForDest = originRouter.isms(DESTINATION);
    if (routerForDest != bytes32(0)) {
        // Log but don't hard-fail -- zero ISM may be intentional via _enrollRemoteRouter path
