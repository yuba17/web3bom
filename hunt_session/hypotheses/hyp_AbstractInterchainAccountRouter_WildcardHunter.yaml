  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: "The _enrollRemoteRouterAndIsm immutability check prevents double-enrollment, so this only affects first enrollment via the base Router path. After that, ISM is frozen. Low practical impact."
  poc_sketch: ''
  call_stack: ''

