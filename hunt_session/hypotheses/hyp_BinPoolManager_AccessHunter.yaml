- id: BPM-AC-09
  tier: 1
  type: property
  description: "BinPool.checkPoolInitialized() usa activeId == 0 como sentinel — si un swap drena liquidez y activeId llega a 0 post-swap, el pool quedaría bricked (todas las operaciones revertirían con PoolNotInitialized)"
  attack_scenario: >
    BinPool.swap() actualiza activeId en slot0 al final del swap loop (línea 205).
    Durante el loop, getNextNonEmptyBin() puede retornar 0 (ningún bin a la derecha)
    o 0xffffff (ningún bin a la izquierda). Si retorna 0 o 0xffffff, el swap revierte
    con OutOfLiquidity (assembly check en líneas 193-198). Pero swapState.activeId se
    asigna nextId en línea 199 ANTES de la siguiente iteración del loop. Si el swap
    consume el último bin y la siguiente iteración retorna nextId=0, el assembly revert
    evita que activeId=0 se persista. SIN EMBARGO: ¿qué pasa si activeId LEGÍTIMAMENTE
    llega a un bin en el extremo inferior del rango (binId=1) y luego se drena? El
    siguiente getNextNonEmptyBin(swapForY=true, 1) retorna 0 → revert OutOfLiquidity.
    activeId queda en 1, no en 0. SAFE.
    Pero si hay un path donde activeId se setea a 0 por otro mecanismo (e.g., un bug
    futuro en initialize que no valida activeId=0), checkPoolInitialized() revertirá
    para TODAS las operaciones, incluyendo burn() — los usuarios no podrían retirar.
  impact: "Pool bricking si activeId llega a 0 — fondos de LPs atrapados permanentemente"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que activeId nunca es 0 después de una operación de swap
    PoolId id = key.toId();
    (uint24 activeId,,) = binPoolManager.getSlot0(id);
    t(activeId != 0, "BPM-AC-09: activeId is 0 post-swap — pool bricked");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    Investigado: en swap(), el assembly revert en líneas 193-198 previene que nextId=0
    se use como activeId. Y en initialize(), PriceHelper.getPriceFromId(0, binStep)
    se llama como safety check — si retorna un precio válido, activeId=0 sería aceptado
    pero luego checkPoolInitialized() revertirá. initialize() debería REVERTIR si
    activeId == 0, pero no tiene ese check explícito. La protección es indirecta via
    PoolAlreadyInitialized check (si activeId != 0, pool exists; si == 0, pool doesn't).
    Pero esto crea un invariante implícito: activeId NUNCA puede ser 0 para un pool válido.
    Fuzzing merece la pena para edge cases con bins cerca de binId=0.

- id: BPM-AC-10
  tier: 2
  type: property
  description: "initialize() no valida que activeId != 0 explícitamente — si PriceHelper.getPriceFromId(0, binStep) no revierte, se crearía un pool que no se puede usar (checkPoolInitialized siempre revertirá)"
  attack_scenario: >
    Un caller llama initialize(key, 0). PriceHelper.getPriceFromId(0, binStep) se ejecuta
    como safety check. Si NO revierte, pools[id].initialize(0, protocolFee, lpFee) se ejecuta.
    Dentro de BinPool.initialize(), self.slot0.activeId() se checkea contra 0 para verificar
    que el pool no está ya inicializado — pero estamos seteando activeId=0, así que si el
    slot0 era 0 antes (no inicializado), el check pasa y el pool se "inicializa" con activeId=0.
    Después, CUALQUIER llamada a checkPoolInitialized() revertirá porque activeId == 0.
    El pool existe en poolIdToPoolKey pero es inutilizable. El PoolKey está quemado —
    no se puede re-inicializar porque PoolAlreadyInitialized... ESPERA: PoolAlreadyInitialized
    checkea activeId != 0. Si activeId == 0, el check de "ya inicializado" NO revertirá,
    así que se podría re-inicializar. Esto es un loop: initialize con activeId=0 → pool
    "existe" pero activeId=0 → alguien puede re-inicializar con un activeId válido.
    ¿Hay otros campos en slot0 (protocolFee, lpFee) que podrían hacer que el check pase
    incluso con activeId=0? BinSlot0.activeId() extrae los bits de activeId — si son 0,
    retorna 0 independientemente de protocolFee/lpFee.
    Conclusión: initialize(key, 0) crea un pool "fantasma" que puede ser re-inicializado.
    Impacto: si alguien deposita antes de re-init (imposible, checkPoolInitialized revierte),
    no hay pérdida de fondos. Pero es un edge case de diseño.
  impact: "Pool fantasma con activeId=0 — re-inicializable, pero sin impacto de fondos"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que initialize con activeId=0 se maneja correctamente
    // Si no revierte, el pool queda en estado inconsistente pero sin riesgo de fondos
    try binPoolManager.initialize(key, 0) {
        // Pool creado con activeId=0 — debería ser re-inicializable
        (uint24 activeId,,) = binPoolManager.getSlot0(key.toId());
        eq(activeId, 0, "BPM-AC-10: pool initialized with activeId=0");
        // Intentar re-initialize
        try binPoolManager.initialize(key, 2**23) {
            t(true, "BPM-AC-10: re-initialization succeeded after activeId=0 init");
        } catch {
            t(false, "BPM-AC-10: re-initialization failed — pool stuck in limbo");
        }
    } catch {
        // Expected: PriceHelper reverts for activeId=0
        t(true, "BPM-AC-10: initialize(0) correctly reverted");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    Necesita verificación: ¿PriceHelper.getPriceFromId(0, binStep) revierte?
    getExponent(0) retorna 0 - 8388608 = -8388608 (extremo negativo). base.pow(-8388608)
    probablemente retorna un precio extremadamente pequeño pero válido. Si no revierte,
    activeId=0 se acepta y el pool queda en estado zombie. El slot0 tendría protocolFee
    y lpFee seteados pero activeId=0 — checkPoolInitialized lee activeId que es 0 → revert.
    Re-initialize checka self.slot0.activeId() != 0 → pasa → se puede re-inicializar.
    No hay pérdida de fondos pero es un bug de lógica.

false_positives:
- hunter: AccessHunter
  id: BPM-FP-01
  reason: >
    initialize() sin restricción de caller — CUALQUIERA puede inicializar un pool.
    Investigado: esto es by design en Uniswap v4 / PCS Infinity. Los pools son permissionless.
    La protección es que el pool se liga a una PoolKey específica con poolManagerMatch,
    y el hook debe tener el bitmap correcto. No hay fondos en riesgo porque un pool recién
    inicializado no tiene liquidez.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: AccessHunter
  id: BPM-FP-02
  reason: >
    mint()/swap()/burn() sin restricción de caller — CUALQUIERA puede operar en cualquier pool.
    Investigado: by design. El acceso está controlado por el vault.lock() pattern — el caller
    debe ser un contrato que implementa ILockCallback y settle todos los deltas al final.
    Los hooks pueden restringir acceso adicionalmente (via beforeSwap/beforeMint/beforeBurn).
    No es un bug de access control.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: AccessHunter
  id: BPM-FP-03
  reason: >
    poolManagerMatch modifier solo verifica address(this) == poolManager — no verifica que el
    pool exista. Investigado: la verificación de existencia se hace después via pool.checkPoolInitialized()
    en swap/mint/burn. initialize() crea el pool, así que no necesita check previo. El modifier
    solo previene que alguien use una PoolKey que apunte a otro BinPoolManager.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
