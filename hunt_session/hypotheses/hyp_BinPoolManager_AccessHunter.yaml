- id: BPM-AC-05
  tier: 2
  type: property
  description: "setMinBinSharesForDonate en BinPoolManager no tiene lower bound — owner puede setear minBinShareForDonate a 0, habilitando donation-based share inflation attacks"
  attack_scenario: >
    El owner de BinPoolManager llama setMinBinSharesForDonate(0). Ahora donate() solo requiere
    que currentBinShare >= 0, lo cual es siempre true. Un atacante puede donar a bins con muy pocas
    shares, inflando el valor por share masivamente. Esto es un first-depositor style attack:
    1. Atacante es el primer LP en un bin, obtiene MINIMUM_SHARE (1e3) shares
    2. Owner (o atacante si es el owner) setea minBinShareForDonate a 0
    3. Atacante dona una cantidad enorme al bin
    4. Próximo LP que deposite recibe shares desproporcionadamente bajas

    NOTA: BinPoolManagerOwner.setMinBinSharesForDonate() SÍ tiene check de minBinShare >= 1e3.
    Pero BinPoolManager.setMinBinSharesForDonate() es directamente callable por el owner de BinPoolManager
    sin ese check. Si el owner de BinPoolManager NO es BinPoolManagerOwner (ej: ownership fue transferida
    a otro contrato), el check se bypasea.
  impact: "Share inflation attack → robo de fondos de nuevos LPs que depositan en bins inflados"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que minBinShareForDonate nunca es menor que MINIMUM_SHARE (1e3)
    uint256 currentMin = BinPoolManager(address(this)).minBinShareForDonate();
    gte(currentMin, 1e3, "BPM-AC-05: minBinShareForDonate below MINIMUM_SHARE");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: >
    BinPoolManager.setMinBinSharesForDonate() tiene onlyOwner pero NO valida el valor mínimo.
    BinPoolManagerOwner.setMinBinSharesForDonate() sí valida minBinShare >= 1e3.
    El gap existe si ownership de BinPoolManager se transfiere a un contrato que no tenga ese check.
    En la práctica, el owner debería ser siempre BinPoolManagerOwner, pero el código de BinPoolManager
    no lo garantiza. El default de minBinShareForDonate es 2**128 (muy alto), así que el riesgo
    solo se materializa si el owner lo baja explícitamente.

- id: BPM-AC-06
  tier: 2
  type: property
  description: "Un hook malicioso con afterSwap/afterMint/afterBurn returnsDelta puede manipular hookDelta para extraer tokens del vault sin respaldo real"
  attack_scenario: >
    Un pool se inicializa con un hook que tiene HOOKS_AFTER_SWAP_RETURNS_DELTA habilitado.
    En afterSwap, el hook retorna un hookDelta que le acredita tokens en el vault (hookDeltaUnspecified).
    El caller (delta = delta - hookDelta) paga más, pero el hook recibe tokens del vault.

    Esto es by design (hooks pueden cobrar fees), pero el riesgo es:
    1. El pool creator elige el hook — los LPs que depositan confían en que el hook es benigno
    2. Un hook malicioso puede extraer valor de cada swap a costa de los swappers
    3. No hay upper bound en hookDelta más allá de la disponibilidad de tokens en el vault

    El check real es que el locker (msg.sender of vault.lock()) debe settle todos los deltas.
    Pero si el hook es el locker, puede settle con tokens propios y luego take del vault.
  impact: "Hook malicioso extrae valor de todos los swaps/mints/burns — LPs y traders pierden fondos"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Para cada operación, verificar que hookDelta está bounded por el delta principal
    // Esto es difícil de invariantizar sin acceso al hook — se testea vía scenarios
    // Ghost: track total hookDelta acumulado por pool
    int256 hookDelta0 = int256(hookDelta.amount0());
    int256 hookDelta1 = int256(hookDelta.amount1());
    // hookDelta no debe exceder el delta principal en magnitud
    // (esto es una heurística — el bound real depende del diseño del hook)
    t(true, "BPM-AC-06: hookDelta tracking - manual review needed");
  ghost_vars:
    - "mapping(PoolId => int256) internal ghost_cumulativeHookDelta0;"
    - "mapping(PoolId => int256) internal ghost_cumulativeHookDelta1;"
  validated: false
  priority: medium
  confidence: 45
  notes: >
    Este es un riesgo inherente al diseño de hooks de Uniswap v4 / PCS Infinity.
    Los LPs y traders DEBEN confiar en el hook del pool al que interactúan.
    No es un bug del BinPoolManager per se, sino un trust boundary que los usuarios deben entender.
    Marcado validated: false porque el invariante no es testeable de forma autónoma sin un hook específico.

