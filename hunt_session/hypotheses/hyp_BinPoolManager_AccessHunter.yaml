- id: BPM-AC-01
  tier: 2
  type: property
  description: "updateDynamicLPFee solo puede ser llamada por el hook registrado en la PoolKey — nunca por un tercero con una PoolKey fabricada que apunte a un hook distinto"
  attack_scenario: >
    Un atacante construye una PoolKey con fee dinámico habilitado y key.hooks = address(atacante).
    Llama updateDynamicLPFee(key, newFee). Como msg.sender == address(key.hooks) el check pasa.
    Sin embargo, key.toId() debe corresponder a un pool inicializado con ESA key exacta.
    Si un pool diferente tiene el mismo PoolId (colisión de hash), el atacante cambia el lpFee de un pool ajeno.
    PoolId = keccak256(abi.encode(key)) hace colisión prácticamente imposible, pero el invariante verifica
    que el lpFee de un pool solo cambie cuando msg.sender es exactamente el hook con el que el pool fue inicializado.
  impact: "Cambiar el lpFee de un pool ajeno a 0% o 10% — robar fees de LPs o hacer el pool inusable"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Después de cada llamada a updateDynamicLPFee(key, newFee):
    // Verificar que el lpFee solo cambió si msg.sender == address(key.hooks)
    // y que key.toId() corresponde a un pool inicializado con esa key exacta
    PoolId id = key.toId();
    PoolKey memory storedKey = poolIdToPoolKey[id];
    // Si el pool existe, el hook almacenado debe ser msg.sender
    if (address(storedKey.poolManager) != address(0)) {
        eq(address(storedKey.hooks), msg.sender, "BPM-AC-01: lpFee changed by non-hook caller");
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 40
  notes: >
    La protección actual (msg.sender != address(key.hooks) reverts) parece sólida.
    El key que el caller pasa DEBE generar el mismo PoolId que el pool existente,
    lo cual requiere todos los campos idénticos incluyendo hooks. Pero el contrato
    NO verifica que poolIdToPoolKey[id].hooks == key.hooks — confía en que el caller
    pasa la key correcta. Investigar si hay un mismatch posible entre la key pasada
    y la key almacenada.

- id: BPM-AC-02
  tier: 1
  type: property
  description: "burn() usa msg.sender como from — un usuario solo puede quemar sus propias shares, nunca las de otro"
  attack_scenario: >
    En BinPoolManager.burn(), el parámetro from se hardcodea a msg.sender (L262: from: msg.sender).
    Esto impide que un caller queme shares de otro usuario directamente. Sin embargo, si un hook
    con afterBurn returnsDelta habilitado puede manipular el delta para que el caller reciba tokens
    sin realmente quemar shares (hookDelta modifica callerDelta), podría haber un path de extracción.
    Además, la función burn() NO tiene whenNotPaused — se puede quemar incluso cuando el protocolo
    está pausado, lo cual podría ser intencional (permitir retiros de emergencia) pero merece verificación.
  impact: "Robo de shares/tokens de otros usuarios si from no está bien protegido"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Antes y después de burn: verificar que solo las shares de msg.sender disminuyen
    // Ghost: track shares por usuario antes de burn
    uint256 sharesBefore = pool.positions.get(msg.sender, binId, salt).share;
    // Después del burn:
    uint256 sharesAfter = pool.positions.get(msg.sender, binId, salt).share;
    // Las shares de msg.sender deben haber disminuido exactamente por amountToBurn
    eq(sharesBefore - sharesAfter, amountToBurn, "BPM-AC-02: shares mismatch in burn");
  ghost_vars:
    - "mapping(address => mapping(uint24 => uint256)) internal ghost_sharesBefore;"
  validated: true
  priority: high
  confidence: 75
  notes: >
    burn() hardcodea msg.sender como from — esto es correcto y seguro.
    La ausencia de whenNotPaused en burn() es probablemente by design (retiros de emergencia).
    El vector real de ataque sería a través de un hook malicioso que manipule hookDelta en afterBurn.

