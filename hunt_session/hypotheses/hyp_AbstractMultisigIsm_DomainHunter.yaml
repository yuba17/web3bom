component: AbstractMultisigIsm
hunter: DomainHunter
date: '2026-03-24'
overall_assessment: |
  El diseno de domainHash es solido: incluye origin + merkleTreeHook + "HYPERLANE" como separador.
  Esto previene replay cross-domain de forma efectiva. Sin embargo, hay un punto critico:
  originMerkleTreeHook viene del METADATA (controlado por relayer), no del message ni del
  contrato on-chain. Si los validators firman sobre un merkleTreeHook arbitrario proporcionado
  en metadata, la unica proteccion es que los validators SOLO deben firmar checkpoints del
  merkle tree hook correcto. El contrato NO valida on-chain que el merkleTreeHook sea el
  correcto para ese origin domain. Esto es BY DESIGN (off-chain trust en validators), pero
  abre la puerta si validators son comprometidos o firman checkpoints para un hook diferente.

  El signedMessageId en MerkleRootIsm NO se valida contra el message.id() actual --
  es un campo separado que identifica el checkpoint que los validators firmaron, no el
  mensaje que se esta verificando. Esto tambien es by design para la propiedad de
  censorship resistance.

invariants:
- id: ISM-DOM-01
  title: "originMerkleTreeHook is relayer-controlled metadata, not validated on-chain"
  tier: 2
  type: property
  confidence: 40
  severity: medium
  description: |
    En ambos ISMs (MerkleRoot y MessageId), originMerkleTreeHook se extrae de _metadata
    (bytes controlados por el relayer). Este valor se usa directamente en domainHash(), que
    forma parte del digest que los validators firman. NO hay validacion on-chain de que este
    valor corresponda al merkle tree hook real del origin domain.

    ANALISIS HONESTO: Esto funciona porque los validators SOLO deben firmar checkpoints
    para el merkle tree hook correcto. Si firman para un hook distinto, seria un acto
    malicioso que el slashing protocol deberia castigar. Sin embargo, el contrato NO
    puede distinguir un digest firmado con el hook correcto de uno con un hook incorrecto
    -- depende 100% de la honestidad del validator set.

    PERO: si un relayer malicioso proporciona metadata con un originMerkleTreeHook diferente,
    la verificacion FALLARIA porque los validators no habrian firmado ese digest. Asi que
    no hay vector de ataque real desde el lado del relayer.

    CONCLUSION: By design, no explotable. El domainHash binds el origin + hook, y los
    validators son los que firman. Un relayer no puede fabricar firmas.
  attack_scenario: |
    NO EXPLOTABLE por relayer. Requeriria que validators firmen checkpoints para un
    merkle tree hook incorrecto, lo cual es una falla operacional fuera del scope del contrato.
  solidity: |
    // Este invariante verifica que verify() rechaza metadata con originMerkleTreeHook incorrecto
    // No es directamente testable sin acceso a claves de validator, marcado como conceptual
    t(true, "ISM-DOM-01: conceptual -- originMerkleTreeHook validation depends on validator honesty");
  validated: false
  status: hypothesis

- id: ISM-DOM-02
  title: "signedMessageId in MerkleRoot ISM is NOT validated against message.id()"
  tier: 2
  type: property
  confidence: 55
  severity: medium
  description: |
    En AbstractMerkleRootMultisigIsm.digest(), el signedMessageId viene de _metadata
    (linea 54) y se pasa directamente a CheckpointLib.digest(). Este ID NO se compara
    con _message.id() (keccak256 del mensaje). Son valores diferentes por diseno:
    signedMessageId es el message ID del checkpoint MAS RECIENTE que los validators
    firmaron, mientras que message.id() es el mensaje que se esta verificando.

    La prueba de inclusion se hace via merkle proof: message.id() se usa como leaf
    en MerkleLib.branchRoot() (linea 42-46). Si el proof es valido, demuestra que
    message.id() esta incluido en el arbol cuya root fue firmada por los validators.

    ANALISIS: Esto es la esencia de la censorship resistance -- permite usar un
    checkpoint mas nuevo (ej: #33) para probar un mensaje mas viejo (#22). El
    signedMessageId es parte del digest para binding, no para validar el mensaje actual.

    CONCLUSION: By design. La seguridad viene del merkle proof, no de comparar IDs.
  attack_scenario: |
    NO EXPLOTABLE. Un atacante no puede forjar un merkle proof valido que incluya un
    message.id() arbitrario en el root firmado por los validators. La seguridad
    criptografica del merkle tree lo previene.
  solidity: |
    // Conceptual -- la seguridad depende de la integridad del merkle proof
    t(true, "ISM-DOM-02: signedMessageId != message.id() is by design for censorship resistance");
  validated: false
  status: investigated_safe

- id: ISM-DOM-03
  title: "Cross-ISM metadata confusion: MerkleRoot metadata vs MessageId ISM"
  tier: 2
  type: property
  confidence: 30
  severity: low
  description: |
    MerkleRootMultisigIsmMetadata y MessageIdMultisigIsmMetadata tienen formatos
    completamente diferentes:
    - MerkleRoot: [0:32] hook, [32:36] msgIndex, [36:68] signedMsgId, [68:1092] proof, [1092:1096] signedIndex, [1096:...] sigs
    - MessageId: [0:32] hook, [32:64] root, [64:68] index, [68:...] sigs

    Si metadata de MerkleRoot se pasara a un MessageId ISM:
    - originMerkleTreeHook: mismo offset, misma interpretacion -> OK
    - root: leeria bytes [32:64] que serian msgIndex(4 bytes) + signedMsgId(28 bytes) -> basura
    - index: leeria bytes [64:68] que serian parte del proof -> basura
    - Resultado: digest diferente, firmas no matchean -> REVERTS

    La confusion es imposible en la practica porque:
    1. Cada ISM concreto (StaticMerkleRootMultisigIsm vs StaticMessageIdMultisigIsm) hereda solo UNA implementacion de digest()
    2. moduleType es diferente (MERKLE_ROOT_MULTISIG vs MESSAGE_ID_MULTISIG)
    3. El Mailbox/routing selecciona el ISM correcto basado en la configuracion

    CONCLUSION: No explotable. Proteccion por tipo + digest diferente.
  attack_scenario: |
    NO EXPLOTABLE. Cada ISM concreto tiene un unico digest(). No hay forma de
    llamar verify() con el tipo de metadata incorrecto y obtener una verificacion exitosa.
  solidity: |
    t(true, "ISM-DOM-03: cross-ISM metadata confusion impossible -- different digest implementations");
  validated: false
  status: investigated_safe

- id: ISM-DOM-04
  title: "domainHash replay protection across origin domains"
  tier: 2
  type: property
  confidence: 85
  severity: low
  description: |
    domainHash = keccak256(abi.encodePacked(_origin, _merkleTreeHook, "HYPERLANE"))

    _origin es uint32 (4 bytes), _merkleTreeHook es bytes32 (32 bytes).
    Con abi.encodePacked, esto produce: 4 + 32 + 9 = 45 bytes.

    No hay colision posible entre dominios diferentes porque _origin es el primer campo
    y tiene tamano fijo (4 bytes). Dos dominios diferentes SIEMPRE producen domainHash
    diferentes (asumiendo el mismo merkleTreeHook, que seria diferente de todos modos
    porque cada chain tiene su propio MerkleTreeHook address).

    NOTA: abi.encodePacked con multiples tipos de tamano variable podria causar colisiones,
    pero aqui todos los tipos son de tamano fijo (uint32, bytes32, string literal).

    CONCLUSION: Seguro. No hay vector de colision.
  attack_scenario: |
    NO EXPLOTABLE. domainHash es unico por (origin, merkleTreeHook). No hay forma de
    crear una colision que permita replay cross-domain.
  solidity: |
    t(true, "ISM-DOM-04: domainHash includes fixed-size origin -- no encodePacked collision risk");
  validated: true
  status: investigated_safe

- id: ISM-DOM-05
  title: "ISM deployed for domain X but validators configured for domain Y"
  tier: 2
  type: property
  confidence: 25
  severity: medium
  description: |
    En StaticMultisigIsm, los validators se bake-an en el MetaProxy bytecode al deploy.
    validatorsAndThreshold() los lee del bytecode, ignorando el _message parameter.

    Si un admin despliega un ISM con validators del domain Y y lo configura como ISM
    para domain X en el Mailbox:
    - Los validators de Y podrian firmar un checkpoint valido para domain X SI tambien
      son validators de X (poco probable si son sets diferentes)
    - Mas importante: los validators de Y firmarian checkpoints con el merkleTreeHook de
      Y, no de X. El domainHash seria diferente. Las firmas no matchearian.

    CONCLUSION: Protegido por domainHash. Incluso si validators son misconfigured,
    los checkpoints que firman incluyen el origin + hook correcto. Un validator de
    domain Y no produce firmas validas para domain X a menos que deliberadamente
    firme checkpoints de X (lo cual seria correcto, no un ataque).

    RIESGO OPERACIONAL: Si el admin configura el validator set incorrecto, los mensajes
    simplemente no se verificaran. No hay perdida de fondos, solo DoS.
  attack_scenario: |
    Riesgo operacional (DoS), no exploit. Mensajes de domain X no se verificarian
    si el ISM tiene validators de domain Y. No hay forma de que validators de Y
    firmen checkpoints validos para X sin control deliberado.
  solidity: |
    t(true, "ISM-DOM-05: misconfigured validator set causes DoS not fund loss -- domainHash protects");
  validated: false
  status: investigated_safe

- id: ISM-DOM-06
  title: "messageIndex <= signedIndex check in MerkleRoot ISM"
  tier: 2
  type: property
  confidence: 70
  severity: low
  description: |
    AbstractMerkleRootMultisigIsm.digest() tiene: require(messageIndex <= signedIndex).
    Esto asegura que el mensaje que se prueba fue insertado ANTES del checkpoint firmado.

    Si este check no existiera, un atacante podria intentar probar un "mensaje futuro"
    que no existe en el arbol al momento del checkpoint. Pero el merkle proof fallaria
    de todos modos porque el leaf no estaria en el arbol.

    El check es una optimizacion / sanity check: falla rapido en vez de computar un
    merkle proof invalido. No es estrictamente necesario para la seguridad, pero es
    buena practica defensiva.

    CONCLUSION: El check es correcto y util. No hay bypass posible.
  attack_scenario: |
    NO EXPLOTABLE. Incluso sin el check, el merkle proof fallaria para indices futuros.
    El check es defensa en profundidad.
  solidity: |
    t(true, "ISM-DOM-06: messageIndex <= signedIndex is defense-in-depth -- merkle proof would fail anyway");
  validated: true
  status: investigated_safe

false_positives:
- title: "originMerkleTreeHook from metadata allows domain spoofing"
  reason: |
    Inicialmente parecia un vector: relayer controla metadata, puede poner cualquier hook.
    Pero el digest cambia con el hook, y los validators NO habrian firmado ese digest.
    Un relayer no puede fabricar firmas de validators. El unico riesgo seria validators
    maliciosos, que ya esta fuera del threat model del ISM (se maneja con slashing).
- title: "signedMessageId not validated against message"
  reason: |
    Es by design. MerkleRoot ISM usa merkle proof para vincular message.id() al root
    firmado. signedMessageId es del checkpoint, no del mensaje siendo verificado.
    Esto permite censorship resistance.
- title: "abi.encodePacked collision in domainHash"
  reason: |
    Todos los campos son de tamano fijo (uint32 + bytes32 + string literal).
    No hay riesgo de colision con encodePacked cuando los tipos son fijos.
