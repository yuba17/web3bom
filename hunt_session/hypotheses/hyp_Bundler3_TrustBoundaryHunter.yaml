  - id: TB-05
    tier: 1
    type: property
    description: >
      reenter() cannot be called by an unauthorized party. The check is:
      reenterHash == keccak256(bytes.concat(bytes20(msg.sender), keccak256(msg.data[4:])))
      This means: (1) the caller address must match, AND (2) the call data must match.
      An attacker calling reenter() directly gets rejected because their address wasn't
      in the pre-committed hash. Even if they know the callbackHash, they'd need to
      be calling FROM the expected address (the callee set in the bundle's `to` field).
    attack_scenario: >
      1. No active multicall: reenterHash = bytes32(0), attacker's hash != 0, reverts
      2. Active multicall with callbackHash: reenterHash = keccak256(bytes20(to) ++ callbackHash)
         Attacker needs msg.sender == to AND exact matching data
         Attacker cannot be `to` because `to` is a contract that was called by Bundler3
      3. Direct Morpho callback injection: Attacker calls MORPHO.supply() with adapter
         callback. Morpho calls adapter.onMorphoSupply() which calls reenterBundler3().
         msg.sender of reenter() is adapter. bytes20 matches IF reenterHash was set for
         adapter. BUT reenterHash was set for the Morpho call target (which is adapter),
         so bytes20(adapter) matches. The keccak256(msg.data[4:]) must match callbackHash.
         The callback data is attacker-controlled! BUT: reenterHash is only set during an
         active _multicall, and EVM execution is sequential per transaction. The attacker's
         tx cannot interfere with another tx's reenterHash.
    impact: "Unauthorized reentry would allow executing arbitrary operations as initiator"
    impact_rating: Critical
    likelihood: Low
    severity_final: null
    solidity: |
      // Direct call to reenter from unauthorized address
      vm.prank(attacker);
      vm.expectRevert(ErrorsLib.IncorrectReenterHash.selector);
      bundler3.reenter(subBundle);
    ghost_vars: []
    validated: true
    priority: high
    confidence: 95
    notes: >
      The reenterHash mechanism is cryptographically sound. The pre-commitment model
      locks both the caller identity (bytes20) and the exact data (keccak256). No
      third party can inject operations. EVM sequential execution prevents cross-tx
      interference. Analyzed the direct-Morpho-callback vector thoroughly — blocked
      because no active multicall means reenterHash=0, and keccak256 output != 0.

  - id: TB-06
    tier: 1
    type: property
    description: >
      morphoBorrow/morphoWithdraw/morphoWithdrawCollateral use initiator() as the
