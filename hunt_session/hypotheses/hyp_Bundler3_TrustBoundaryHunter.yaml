# ============================================================================
# TRUST MODEL SUMMARY
# ============================================================================
# Bundler3 implements 3 authorization primitives:
# 1. transient `initiator` — set to msg.sender at multicall entry, cleared on exit
# 2. `reenterHash` pre-commitment — caller commits to callee + callback data hash
#    BEFORE the call. Only matching (sender, data) can call reenter().
# 3. `onlyBundler3` modifier — adapter functions only callable by Bundler3 contract
#
# Trust boundaries:
# - User -> Bundler3: user trusts Bundler3 to execute their bundle correctly
# - Bundler3 -> Callee: arbitrary call, NO trust assumed. callee cannot modify initiator
# - Callee -> Bundler3 (reenter): ONLY with pre-committed hash. callee locked to exact data
# - Adapter -> Morpho: trusted (permanent max approval, no reset)
# - Adapter -> User-supplied vault/wrapper: untrusted but approval is transient (set+reset)
# - ParaswapAdapter -> Augustus: semi-trusted (registry validation + balance diff checks)
#
# Key invariant: the initiator cannot be spoofed, and reenter cannot be called
# with unauthorized data. The pre-commitment model is cryptographically sound.
# ============================================================================

invariants:

  - id: TB-01
    tier: 1
    type: property
    description: >
      initiator MUST be address(0) after multicall() completes. Transient storage
      is cleared at end of transaction by EIP-1153, but the explicit reset on line 35
      is the primary protection. If an uncaught exception leaves the flow before
      the reset, initiator could remain set within the same transaction.
      In Solidity 0.8.28, require() reverts the entire tx, so the only way initiator
      stays set is within a successful multicall's internal calls (by design).
    attack_scenario: >
      If initiator is not reset, a second call in the same tx (via a contract
      intermediary) would see a stale initiator. Adapters would allow borrow/withdraw
      on behalf of the stale initiator. However, multicall itself would revert at
      line 29 (AlreadyInitiated) if called again, so the only path is via reenter()
      which requires a valid hash. VERDICT: Safe due to AlreadyInitiated guard.
    impact: "Full fund theft if initiator could be spoofed — but it cannot"
    impact_rating: Critical
    likelihood: Low
    severity_final: null
    solidity: |
      address initiatorAfter = bundler3.initiator();
      eq(initiatorAfter, address(0), "TB-01: initiator not reset after multicall");
    ghost_vars: []
    validated: true
    priority: high
    confidence: 90
    notes: >
      The code correctly resets initiator to address(0) at line 35. The AlreadyInitiated
      guard at line 29 prevents nested multicalls. Transient storage provides additional
      cleanup guarantee at tx end. Triple protection — extremely robust.

  - id: TB-02
    tier: 1
    type: property
    description: >
      reenterHash MUST be bytes32(0) at the end of each iteration of _multicall loop
      (line 66). If callbackHash was non-zero but the callee didn't call reenter(),
      the MissingExpectedReenter check catches it. This holds even with skipRevert=true
      because the TSTORE on lines 60-61 happens in Bundler3's context (before the
      external call), so a callee revert does NOT undo the reenterHash assignment.
    attack_scenario: >
      A bundle with callbackHash != 0 and skipRevert=true where the callee reverts.
      The reenterHash stays non-zero (callee revert doesn't undo Bundler3's TSTORE).
      Line 66 require(reenterHash == 0) reverts the ENTIRE multicall despite skipRevert.
      This is an important edge case: skipRevert does NOT protect against missing callbacks.
    impact: "DoS — unexpected revert despite skipRevert=true"
    impact_rating: Medium
    likelihood: Medium
    severity_final: null
    solidity: |
      // After each call in _multicall, reenterHash must be 0
      bytes32 hashAfter = bundler3.reenterHash();
      eq(hashAfter, bytes32(0), "TB-02: reenterHash not zero after call iteration");
    ghost_vars: []
    validated: true
    priority: high
    confidence: 85
    notes: >
      skipRevert + callbackHash interaction is surprising but correct by design.
      If you expect a callback, it MUST happen — there's no way to make it optional.
      This is a trust boundary between the bundle creator and the callee: the bundle
      creator commits to a callback that the callee MUST execute, or the entire tx fails.

  - id: TB-03
