    attack_scenario: >
      1. Wrapper is fee-on-transfer (1% fee)
      2. Adapter has 100 wrapped tokens
      3. safeTransfer(initiator, 100) -> initiator receives 99
      4. safeTransferFrom(initiator, adapter, 100) -> tries to pull 100, only 99 available
