      uint256 destAmount = destFinal - destInitial;
      gte(srcInitial, srcFinal, "TB-09: srcToken balance increased (unexpected)");
      gte(destFinal, destInitial, "TB-09: destToken balance decreased (unexpected)");
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 90
    notes: >
