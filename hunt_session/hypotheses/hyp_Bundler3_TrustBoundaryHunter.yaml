  - id: TB-13
    tier: 1
    type: property
    description: >
      ParaswapAdapter sell() and buy() are external/public WITHOUT onlyBundler3 modifier.
      However, they internally call swap() which IS onlyBundler3. Since sell/buy do
      NO state modifications before calling swap(), a direct call reverts at the
      swap() level with UnauthorizedSender. The access control is correctly enforced
      despite the missing modifier on the public functions.
    attack_scenario: >
      1. Attacker calls paraswapAdapter.sell() directly
      2. sell() computes amounts (memory only, no state changes)
      3. sell() calls swap() -> checks msg.sender == BUNDLER3
      4. msg.sender is attacker -> reverts with UnauthorizedSender
    impact: "None — correctly protected"
    impact_rating: Info
    likelihood: Low
    severity_final: null
    solidity: |
      vm.prank(attacker);
      vm.expectRevert(ErrorsLib.UnauthorizedSender.selector);
      paraswapAdapter.sell(augustus, callData, srcToken, destToken, false, offsets, attacker);
    ghost_vars: []
    validated: true
    priority: low
    confidence: 95
    notes: >
      Verified: sell() reads balanceOf and modifies memory-only callData before
      calling swap(). buy() is public (called by buyMorphoDebt) with same pattern.
      buyMorphoDebt() reads Morpho state (view) then calls buy(). All paths end
      at swap() which has the access control. No state changes before the check.

  - id: TB-14
    tier: 2
    type: property
    description: >
      Transient storage isolation between transactions. The `initiator` and `reenterHash`
      use EIP-1153 transient storage which is guaranteed to be zeroed at the start of
      each transaction. The contract also does explicit resets. Double protection ensures
      no cross-transaction state leakage.
    attack_scenario: >
      Theoretical: if EVM client has a bug in EIP-1153 implementation and transient
      storage leaks between transactions, an attacker could find a stale initiator.
      This is an infrastructure-level bug, not a contract bug.
    impact: "Cross-tx initiator spoofing if EVM client buggy"
    impact_rating: Critical
    likelihood: Low
    severity_final: null
    solidity: |
      // At start of any new multicall, initiator must be address(0)
      address init = bundler3.initiator();
      eq(init, address(0), "TB-14: transient storage not clean at tx start");
      bytes32 hash = bundler3.reenterHash();
      eq(hash, bytes32(0), "TB-14: reenterHash not clean at tx start");
    ghost_vars: []
    validated: true
    priority: low
    confidence: 95
    notes: >
      EIP-1153 guarantees cleanup. The explicit require(initiator == address(0)) at
      line 29 is the primary guard. Even if transient storage leaked, the explicit
      check would catch it (initiator would be non-zero, blocking new multicall).

false_positives:

  - hunter: TrustBoundaryHunter
    id: TB-FP-01
    reason: >
      Investigated: "delegatecall from callee to Bundler3 allows transient storage
      access." FALSE — Bundler3 uses .call() (line 63), not delegatecall. The callee
      executes in its own context and cannot access Bundler3's transient storage.
      Only if Bundler3 used delegatecall would the callee have access. This is a
      fundamental EVM property.
    investigated_at: '2026-03-23T00:00:00Z'

  - hunter: TrustBoundaryHunter
    id: TB-FP-02
    reason: >
      Investigated: "callee can spoof initiator via reenter()." FALSE — reenter()
      does NOT set initiator. It only calls _multicall() with the pre-committed bundle.
      The initiator remains the original msg.sender of multicall(). A callee calling
      reenter() cannot change who the initiator is — they can only execute the exact
      bundle the user pre-committed to.
    investigated_at: '2026-03-23T00:00:00Z'

  - hunter: TrustBoundaryHunter
    id: TB-FP-03
    reason: >
      Investigated: "ERC777 tokensReceived callback during bundle allows reentrancy."
      FALSE — even if an ERC777 token triggers a callback during a bundle call,
      the callback contract cannot call multicall() (AlreadyInitiated) or reenter()
      (no matching reenterHash). The authorization model is immune to ERC777 callbacks.
    investigated_at: '2026-03-23T00:00:00Z'

  - hunter: TrustBoundaryHunter
    id: TB-FP-04
    reason: >
      Investigated: "forceApprove(max) to arbitrary vault enables third-party theft."
      FALSE — the user constructs their own bundle and chooses the vault address.
      No third party can inject a malicious vault into another user's bundle. The
      approval is also reset to 0 after the vault call returns. Self-inflicted risk only.
    investigated_at: '2026-03-23T00:00:00Z'

  - hunter: TrustBoundaryHunter
    id: TB-FP-05
    reason: >
      Investigated: "ParaswapAdapter sell/buy missing onlyBundler3 allows direct calls."
      FALSE — sell() and buy() call internal swap() which HAS onlyBundler3. No state
      modifications occur before swap() is reached. Direct calls revert with
      UnauthorizedSender at the swap() level.
    investigated_at: '2026-03-23T00:00:00Z'

summary: |
  ## TrustBoundaryHunter Analysis — Morpho Bundler3

  ### Trust Model Assessment
  Bundler3 implements a well-designed trust boundary model with three mechanisms:
  1. **transient `initiator`** — identifies the original caller, protected by AlreadyInitiated guard
  2. **`reenterHash` pre-commitment** — cryptographically sound authorization for callbacks
  3. **`onlyBundler3` modifier** — ensures adapter functions only execute within bundle context

  ### Key Findings (14 hypotheses, 5 false positives investigated)

  **NO critical exploitable vulnerabilities found.** The authorization model is robust.

  **Real risks (Low/Medium, by design or known patterns):**
  - TB-03: Residual ETH in Bundler3 is stealable (HIGH risk, known multicall pattern)
  - TB-04: Token approvals to Bundler3 are immediately exploitable (CRITICAL if it happens, integration error)
  - TB-02: skipRevert + callbackHash interaction causes unexpected reverts (MEDIUM, surprising behavior)
  - TB-10: Returnbomb gas griefing from malicious callee (MEDIUM, known pattern)
  - TB-11: Fee-on-transfer wrapper incompatibility (LOW, functionality limitation)

  **Safe by design (verified):**
  - TB-01: Initiator reset — triple protection (explicit + AlreadyInitiated + transient cleanup)
  - TB-05: reenterHash — cryptographically sound pre-commitment
  - TB-06: Callback initiator persistence — protected by reenterHash
  - TB-07: Direct Morpho callback injection — blocked by reenterHash=0 when no multicall active
  - TB-08: Malicious vault approval — self-inflicted, user controls bundle
  - TB-09: ParaswapAdapter balance-diff — robust against manipulation
  - TB-12: Persistent Morpho approval — accepted trust assumption
  - TB-13: ParaswapAdapter visibility — correctly protected via swap()
  - TB-14: Transient storage isolation — EIP-1153 guarantee + explicit check

  ### Conclusion
  The Bundler3 trust boundary model is one of the strongest I've analyzed. The
  transient storage + pre-commitment hash design eliminates entire classes of
  attacks (reentrancy, initiator spoofing, callback injection). The remaining
  risks are all known patterns (residual ETH, approval hygiene) that are
  documented in the codebase and mitigatable at the SDK/frontend level.
