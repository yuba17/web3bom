  - id: TB-07
    tier: 1
    type: property
    description: >
      Morpho callback functions (onMorphoSupply, etc.) only check msg.sender == MORPHO.
      They do NOT verify that the Morpho operation was initiated by the adapter itself.
      An attacker could call MORPHO.supply() directly, passing the adapter as the callback
      target. Morpho would call adapter.onMorphoSupply() which calls reenterBundler3().
      However, reenter() requires a matching reenterHash. If no multicall is active,
      reenterHash = 0 and the attacker's hash != 0, so it reverts.
    attack_scenario: >
      1. Attacker calls MORPHO.supply(params, 1 wei, 0, adapter, maliciousCallbackData)
      2. Morpho calls adapter.onMorphoSupply(1, maliciousCallbackData)
      3. msg.sender == MORPHO, check passes
      4. adapter calls reenterBundler3(maliciousCallbackData)
      5. Bundler3.reenter() checks reenterHash
      6. No active multicall -> reenterHash = bytes32(0)
      7. keccak256(bytes20(adapter) ++ keccak256(data)) != bytes32(0)
      8. Reverts with IncorrectReenterHash
    impact: "Would allow executing arbitrary operations under victim's initiator — but blocked"
    impact_rating: Critical
    likelihood: Low
    severity_final: null
    solidity: |
      function test_directMorphoCallbackBlocked() public {
        Call[] memory subBundle = new Call[](1);
        subBundle[0] = Call({
          to: address(adapter),
          data: abi.encodeCall(GeneralAdapter1.erc20TransferFrom,
            (address(usdc), attacker, type(uint256).max)),
          value: 0,
          skipRevert: false,
          callbackHash: bytes32(0)
