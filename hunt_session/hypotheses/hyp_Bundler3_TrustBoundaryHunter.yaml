      A malicious Augustus cannot inflate destAmount by sending adapter's own tokens back
      (that would be a no-op on net balance).
    attack_scenario: >
      1. Compromised Augustus takes srcTokens via approval
      2. Does not deliver destTokens
      3. destAmount = 0, require(0 >= minDestAmount) fails if minDestAmount > 0
      4. Transaction reverts
