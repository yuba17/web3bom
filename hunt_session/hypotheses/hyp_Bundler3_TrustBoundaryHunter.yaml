  - id: TB-10
    tier: 1
    type: property
    description: >
      Returnbomb attack: A malicious callee can return extremely large returndata,
      causing the memory expansion to consume all gas. In _multicall line 63:
      (bool success, bytes memory returnData) = to.call{value}(data)
      Solidity copies ALL returndata to memory. If returndata is MB-sized, the
      quadratic memory expansion cost drains gas. Even with skipRevert=true, the
      returndata is always copied.
    attack_scenario: >
      1. Bundle includes a call to malicious contract returning 1MB of data
      2. Memory expansion: ~1MB = 32,000 words, cost ~512M gas (quadratic)
      3. Transaction runs out of gas
      4. If subsequent calls were critical (flash loan repay), user suffers
    impact: "Gas griefing / DoS — cannot complete bundle"
    impact_rating: Medium
    likelihood: Medium
    severity_final: null
    solidity: |
      uint256 gasBefore = gasleft();
      // execute call to returnbomb contract
      uint256 gasAfter = gasleft();
      uint256 gasUsed = gasBefore - gasAfter;
      t(gasUsed < gasBefore * 90 / 100, "TB-10: returnbomb gas drain");
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 75
    notes: >
      Known pattern. Bundler3 does not limit gas forwarded to callees (forwards
      63/64 of remaining gas). Mitigation would require assembly-level returndata
      size limiting. Since the user constructs the bundle and chooses call targets,
      this is primarily a self-inflicted risk. However, if a previously-trusted
      contract is compromised, it could grief users.

