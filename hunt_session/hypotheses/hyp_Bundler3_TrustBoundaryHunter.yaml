        bytes memory data = abi.encode(subBundle);
        deal(address(loanToken), attacker, 1);
        vm.startPrank(attacker);
        loanToken.approve(address(morpho), 1);
        // Morpho calls adapter.onMorphoSupply -> reenterBundler3
        // reenterHash=0, attacker hash!=0 -> reverts
        vm.expectRevert();
        morpho.supply(marketParams, 1, 0, address(adapter), data);
        vm.stopPrank();
      }
    ghost_vars: []
    validated: true
    priority: high
    confidence: 90
    notes: >
      This is the most subtle attack vector I analyzed. The key insight is that
      reenterHash is transient storage that is bytes32(0) when no multicall is
      active. Since keccak256 output is never bytes32(0), unauthorized reenter
      always fails. Even during an active multicall, the sequential EVM execution
      prevents a second tx from interfering.

