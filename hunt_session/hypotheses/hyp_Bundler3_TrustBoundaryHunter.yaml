      Bundler3 and can be stolen by the next multicall caller.
    attack_scenario: >
      1. User sends multicall{value: 10 ether} with bundle using only 8 ether
      2. 2 ether left in Bundler3
      3. MEV bot backruns with multicall([{to: bot, value: 2 ether, data: ""}])
