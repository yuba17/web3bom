      Analyzed multi-hop callback chain: user -> Bundler3 -> adapter.morphoSupply ->
      MORPHO.supply -> token.transferFrom (hook) -> cannot reenter Bundler3.
      The hook would need to be the same address as the adapter (bytes20 match) AND
