  - id: TB-09
    tier: 1
    type: property
    description: >
      ParaswapAdapter.swap() uses balance-diff accounting to verify swap results.
      srcAmount = srcInitial - srcFinal (tokens sold)
      destAmount = destFinal - destInitial (tokens bought)
