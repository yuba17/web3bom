# CLPM-04: feeGrowthGlobal wrapping causes incorrect fee accounting across tick boundaries
# ============================================================================
- id: CLPM-04
  tier: 1
  type: property
  description: >
    feeGrowthGlobal0X128 and feeGrowthGlobal1X128 are uint256 that are designed to
    wrap (overflow) by Uniswap V3 convention. All fee calculations use unchecked
    subtraction to handle wrapping. However, Tick.cross() updates feeGrowthOutside
    via: info.feeGrowthOutside = feeGrowthGlobal - info.feeGrowthOutside (unchecked).
    And getFeeGrowthInside computes: global - below - above (unchecked).
    This is correct AS LONG AS the invariant holds that feeGrowthGlobal monotonically
    increases (mod 2^256). If feeGrowthGlobal wraps multiple times between two
    position updates, the position could receive more fees than were actually generated.
    With simpleMulDiv producing truncated (smaller) values, this is even more complex.
    The real risk: if a position is not updated for so long that feeGrowthGlobal wraps
    past its last checkpoint, the position computes incorrect (potentially massive) fees.
  attack_scenario: >
    1. LP creates position, feeGrowthInside0LastX128 = X.
    2. Massive volume occurs, feeGrowthGlobal0X128 wraps past 2^256 and returns to X+1.
    3. When LP collects fees: delta = (X+1) - X = 1 (should be ~2^256 worth of fees).
    4. LP LOSES all accumulated fees — they get 1 instead of the full amount.
    5. Conversely, if feeGrowthGlobal wraps to X - 1: delta = (X-1) - X = 2^256-1 (unchecked).
    6. FullMath.mulDiv(2^256-1, liquidity, Q128) could yield a massive feesOwed.
    ANALYSIS: For feeGrowthGlobal to wrap, total fees accumulated must exceed 2^256 / Q128
    = 2^128 total fee units. With 18-dec tokens, that's 3.4e20 tokens in fees.
    For USDC (6-dec) that's 3.4e32 USDC — completely unrealistic.
    For 18-dec tokens, 3.4e20 tokens is also enormous (~$3.4e20 at $1).
    CONCLUSION: Practically impossible to reach wrapping threshold.
  impact: "Theoretical fee loss or gain for LPs if feeGrowthGlobal wraps around 2^256. Practically unreachable."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Monitor feeGrowthGlobal for wrapping — track monotonicity
    uint256 fg0 = pool.feeGrowthGlobal0X128;
    uint256 fg1 = pool.feeGrowthGlobal1X128;
    // After swap or donate, feeGrowthGlobal should increase (or stay same if no fee)
    if (ghost_lastFeeGrowth0 > 0) {
