# ============================================================================
# CLPM-07: Rounding direction consistency — swap roundtrip profit extraction
# ============================================================================
- id: CLPM-07
  tier: 1
  type: property
  description: >
    SqrtPriceMath consistently rounds: getAmount0Delta rounds UP for input (roundUp=true)
    and DOWN for output (roundUp=false). getAmount1Delta follows the same pattern.
    SwapMath.computeSwapStep uses roundUp=true for amountIn and roundUp=false for amountOut.
    This means the protocol always rounds in its own favor: user pays slightly more in,
    receives slightly less out. A swap A->B followed by B->A should never be profitable
    for the swapper (ignoring fees entirely, pure rounding should cost the swapper).
    However, with fees=0 (if a hook overrides LP fee to 0 and protocol fee is 0),
    the rounding could theoretically be the only cost. If rounding is inconsistent
    in any code path, a roundtrip could extract 1 wei per swap.
  attack_scenario: >
    1. Create pool with fee=0 (hook overrides LP fee to 0, protocol fee = 0).
    2. Execute swap zeroForOne with amount X.
    3. Execute swap oneForZero to swap back.
    4. If rounding is inconsistent, attacker ends with more than X.
    5. Repeat millions of times to extract dust.
    ANALYSIS: SqrtPriceMath rounds UP for amounts in, DOWN for amounts out.
    This is consistent in both directions. A roundtrip should always cost the swapper
    >= 0 (net loss or zero). The rounding is correct by inspection of Uniswap V3 math.
    With zero fees, the price returns to original after round trip, but amounts
    differ by rounding: user pays ceil(amount_in) and receives floor(amount_out).
    Net: user loses >= 0 per roundtrip. Safe.
  impact: "None if rounding is consistent. Worth fuzzing to confirm."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Roundtrip invariant: swap A->B then B->A should not profit the swapper
    // This requires ghost tracking of balances before and after roundtrip
    // After completing a roundtrip (two opposite swaps):
    int128 netAmount0 = ghost_roundtripDelta0; // sum of amount0 across both swaps
    int128 netAmount1 = ghost_roundtripDelta1; // sum of amount1 across both swaps
    // User should not gain in BOTH tokens. At least one should be net negative (paid).
    // With rounding in protocol's favor: user net is <= 0 for the input token.
    t(netAmount0 <= 0 || netAmount1 <= 0, "CLPM-07: roundtrip profit — rounding inconsistency");
  ghost_vars:
  - "int128 internal ghost_roundtripDelta0;"
  - "int128 internal ghost_roundtripDelta1;"
  - "bool internal ghost_roundtripPending;"
  validated: true
  priority: high
  confidence: 70
  notes: >
    Uniswap V3 rounding is well-studied and audited. PancakeSwap Infinity uses the
    same math. This invariant is primarily a regression test. The real risk is if
    PancakeSwap modified any rounding direction from the Uniswap V3 original.

# ============================================================================
# CLPM-08: fee subtraction underflow in protocol fee calculation
# ============================================================================
- id: CLPM-08
  tier: 1
  type: property
  description: >
    CLPool.swap line 301: `step.feeAmount -= delta` in unchecked block, where delta
    is the protocol fee portion. If delta > step.feeAmount, this underflows and
    step.feeAmount wraps to a huge value, inflating LP fees massively.
    delta = (step.amountIn + step.feeAmount) * protocolFee / PIPS_DENOMINATOR.
    For delta > step.feeAmount to hold:
    (amountIn + feeAmount) * protocolFee / 1e6 > feeAmount
    amountIn * protocolFee / 1e6 > feeAmount * (1 - protocolFee / 1e6)
    With protocolFee max = 4000 and feeAmount proportional to amountIn:
    feeAmount = amountIn * lpFee / (1e6 - lpFee) approximately.
    So: amountIn * 4000/1e6 > amountIn * lpFee / (1e6 - lpFee) * (1 - 4000/1e6)
    => 4000/1e6 > lpFee / (1e6 - lpFee) * 996000/1e6
    => 4000 * (1e6 - lpFee) > lpFee * 996000
    => 4e9 - 4000*lpFee > 996000*lpFee
    => 4e9 > 1e6 * lpFee
    => lpFee < 4000.
    When lpFee < protocolFee, the swapFee = calculateSwapFee(protocolFee, lpFee).
    BUT: if swapFee == protocolFee (meaning lpFee is 0), the code takes a different
    branch: `delta = step.feeAmount` (entire fee goes to protocol), and then
    step.feeAmount -= delta = 0. No underflow.
    For lpFee > 0 but < 4000: delta could exceed step.feeAmount.
    Let me recalculate: if lpFee = 100 (0.01%), protocolFee = 4000 (0.4%):
    swapFee = calculateSwapFee(4000, 100) = 4000 + 100 - 4000*100/1e6 = 4099.6 -> 4099
    In computeSwapStep exact input: feeAmount = amountIn * 4099 / (1e6 - 4099) ~ amountIn * 0.004
    delta = (amountIn + feeAmount) * 4000 / 1e6 ~ amountIn * 0.004
    feeAmount ~ amountIn * 0.004, delta ~ amountIn * 0.004. They're approximately equal.
    But with rounding: feeAmount could be slightly less than delta.
    feeAmount = mulDivRoundingUp(amountIn, 4099, 995901) when reaching target.
    delta = (amountIn + feeAmount) * 4000 / 1e6 (truncated down in unchecked).
    The rounding-up of feeAmount makes it larger, and the truncation-down of delta makes it smaller.
    So delta <= feeAmount should hold. Let me verify more carefully...
    Actually, the issue is mulDivRoundingUp for feeAmount (rounds UP = larger fee to collect)
    and division truncation for delta (rounds DOWN = smaller protocol cut).
    So feeAmount is rounded UP, delta is rounded DOWN. step.feeAmount -= delta is safe.
  impact: "None — rounding directions prevent underflow."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After each swap step, verify step.feeAmount >= protocolFee delta
    // i.e., no underflow in the subtraction
    uint256 amountIn = step.amountIn;
    uint256 feeAmount = step.feeAmount;
    uint16 protocolFee = state.protocolFee;
    uint24 swapFee = state.swapFee;
    if (protocolFee > 0 && swapFee != protocolFee) {
        uint256 delta = (amountIn + feeAmount) * protocolFee / 1_000_000;
        gte(feeAmount, delta, "CLPM-08: protocol fee delta exceeds feeAmount");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: >
    The rounding analysis suggests safety, but this is subtle enough to warrant
    fuzzing. If there exists any combination of amountIn, lpFee, protocolFee where
    delta > feeAmount, the unchecked subtraction would wrap, inflating LP fees.
    The SwapMath rounds feeAmount up (mulDivRoundingUp), and the protocol fee
    calculation rounds delta down (integer division). So feeAmount >= delta should hold.
    But edge cases with very small amounts could violate this.

# ============================================================================
# CLPM-09: calculateSwapFee overflow for extreme lpFee values
# ============================================================================
- id: CLPM-09
  tier: 2
  type: property
  description: >
    ProtocolFeeLibrary.calculateSwapFee computes in assembly:
    swapFee = self + lpFee - (self * lpFee / PIPS_DENOMINATOR)
    where self (protocolFee) is uint16 <= 4000 and lpFee is uint24 <= 1_000_000.
    The intermediate `mul(self, lpFee)` = max 4000 * 1_000_000 = 4e9, which fits uint256.
    Division by 1e6 gives max 4000. So swapFee max = 4000 + 1_000_000 - 4000 = 1_000_000.
    The result fits uint24. But there's a subtlety: the assembly uses uint256 arithmetic
    and then the result is implicitly cast to uint24 (return type). If the intermediate
    calculation somehow exceeds 2^24 = 16_777_216... it can't, since max is 1_000_000.
    This is safe.
  attack_scenario: >
    No attack possible. The math is bounded by input constraints.
    Max self = 4000, max lpFee = 1_000_000.
