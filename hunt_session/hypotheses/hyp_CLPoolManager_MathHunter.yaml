# ============================================================================
# CLPM-05: Hook delta can flip swap direction — amountToSwap sign inversion
# ============================================================================
- id: CLPM-05
  tier: 1
  type: property
  description: >
    In CLHooks.beforeSwap, when HOOKS_BEFORE_SWAP_RETURNS_DELTA is enabled, the hook
    returns hookDeltaSpecified which is ADDED to amountToSwap (line 157).
    There's a check (line 158): if the hook delta changes the sign of amountToSwap
    (exactInput to exactOutput or vice versa), it reverts with HookDeltaExceedsSwapAmount.
    But the boundary case is: hookDeltaSpecified == -amountSpecified, making amountToSwap = 0.
    In CLPool.swap, if amountSpecified == 0 after hook modification, it returns ZERO_DELTA
    (line 247). BUT: the user's original params.amountSpecified is still nonzero, so the
    final delta computation in the swap function uses params.amountSpecified which was the
    ORIGINAL value. The amountToSwap is what gets passed to pool.swap().
    Actually, looking more carefully: pool.swap receives amountToSwap (modified by hook).
    If amountToSwap == 0, pool.swap returns (ZERO_DELTA, state) with state defaults.
    Then in CLPoolManager.swap, delta = ZERO_DELTA. The hook doesn't change the swap itself.
    But beforeSwapDelta still has the hookDeltaSpecified and hookDeltaUnspecified.
    In afterSwap, hookDelta is computed from beforeSwapDelta, and delta = delta - hookDelta.
    So the caller pays for the hook's delta even though no swap occurred.
    The hook effectively extracted tokens from the caller without executing a swap.
  attack_scenario: >
    1. Malicious hook sets beforeSwapReturnssDelta flag.
    2. User calls swap with amountSpecified = -100 (exact input, 100 tokens).
    3. Hook returns hookDeltaSpecified = 100, making amountToSwap = 0.
    4. Check: exactInput (true) and amountToSwap (0) > 0 is false, so no revert.
    5. pool.swap executes with amountSpecified=0, returns ZERO_DELTA immediately.
    6. But afterSwap processes beforeSwapDelta: hookDeltaSpecified=100 is applied.
    7. delta = ZERO_DELTA - hookDelta, so user pays hookDelta to the hook.
    8. This is "by design" — the hook is trusted. But if the check at line 158 is
       supposed to prevent the hook from consuming the entire swap amount, it fails
       because amountToSwap=0 doesn't trigger `amountToSwap > 0` for exactInput.
    ANALYSIS: The check `exactInput ? amountToSwap > 0 : amountToSwap < 0` specifically
    allows amountToSwap == 0. So hookDeltaSpecified == -amountSpecified is allowed.
    This is likely by design — hooks are trusted entities. The user chose this pool.
  impact: "By design — hooks are trusted. A malicious hook can extract the full swap amount."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After swap with hook, verify that hook delta doesn't exceed original swap amount
    // This is a sanity check — hooks are trusted but we want to detect anomalies
    int128 hookDelta0 = hookDelta.amount0();
    int128 hookDelta1 = hookDelta.amount1();
    int256 originalAmount = params.amountSpecified;
    // Hook specified delta should not exceed swap amount in magnitude
    if (originalAmount < 0) {
        // exact input: hook should not take more than the input amount
        t(hookDelta0 <= -int128(int256(originalAmount)) && hookDelta1 <= -int128(int256(originalAmount)),
          "CLPM-05: hook delta exceeds swap amount");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    After analysis, this is by design. Hooks are chosen by the pool creator and are
    trusted by users who interact with the pool. The HookDeltaExceedsSwapAmount check
    prevents sign flipping but intentionally allows full consumption. This is not a bug
    but a design consideration that users should be aware of.

