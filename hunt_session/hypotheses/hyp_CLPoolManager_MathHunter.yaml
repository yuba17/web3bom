# ============================================================================
# CLPM-10: Tick boundary off-by-one in zeroForOne swap preemptive decrement
# ============================================================================
- id: CLPM-10
  tier: 1
  type: property
  description: >
    CLPool.swap line 336: when the swap reaches the next tick boundary exactly
    (sqrtPriceX96 == sqrtPriceNextX96), for zeroForOne swaps the tick is set to
    tickNext - 1 (preemptive decrement). This is by Uniswap V3 design to ensure
    the tick correctly reflects the price range. However, the comment notes that
    donation calls should verify both price and tick. If a donate occurs right after
    a swap that preemptively decremented the tick, the donation goes to the wrong
    liquidity range (tick-1 instead of tick). The donate function uses state.slot0.tick()
    to determine current tick, which would be tickNext-1 even though price is at tickNext.
    This is documented behavior but could cause fee distribution errors at boundaries.
  attack_scenario: >
    1. Swap zeroForOne that lands exactly on tick boundary T.
    2. Pool state: sqrtPriceX96 = getSqrtRatioAtTick(T), tick = T-1.
    3. Donate to the pool — fees go to LPs active at tick T-1.
    4. But price is actually at T, so LPs with range [T, T+X] should receive fees.
    5. LPs in range [T-X, T] receive fees they shouldn't; LPs in [T, T+X] miss out.
    ANALYSIS: In Uniswap V3 this is known and documented. The donate function in
    CLPool uses `tick = state.slot0.tick()` which returns the preemptively decremented
    tick. The feeGrowthGlobal update in donate goes to current liquidity which is
    determined by tick = T-1, potentially including different positions than expected.
    However, donate() adds to feeGrowthGlobal which is GLOBAL, not tick-specific.
    The per-position fees are determined by feeGrowthInside which uses tick boundaries.
    So the donate fee is distributed to whoever has liquidity at the current tick (T-1).
    If the price is actually at T, the liquidity at T-1 includes positions whose lower
    bound is <= T-1 and upper bound > T-1. A position [T, T+X] has lower=T > T-1,
    so it's NOT in range at tick T-1. This is correct behavior IF tick T-1 truly
    represents the price. Since sqrtPrice IS at tick T, there's a mismatch.
    This is a KNOWN Uniswap V3 edge case, not a bug.
  impact: "Minor fee misdirection at exact tick boundaries during donate. Known V3 behavior."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // After swap, verify tick-price consistency (allowing for preemptive decrement)
    uint160 sqrtPrice = slot0.sqrtPriceX96();
    int24 tick = slot0.tick();
    int24 computedTick = TickMath.getTickAtSqrtRatio(sqrtPrice);
    // tick should be either computedTick or computedTick-1 (preemptive decrement)
    t(tick == computedTick || tick == computedTick - 1,
      "CLPM-10: tick-price inconsistency beyond preemptive decrement");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 65
  notes: >
    Known Uniswap V3 design. PancakeSwap inherits this behavior. The edge case
    affects donate() at exact tick boundaries. Impact is small (1 tick of misdirection)
    and requires exact boundary landing. Not a bug but worth documenting.

# ============================================================================
# CLPM-11: Optimize — maximize LP fee loss from simpleMulDiv truncation
# ============================================================================
- id: CLPM-11
  tier: 3
  type: optimize
  description: >
    Maximize the precision loss in feeGrowthGlobal updates by finding the worst-case
    inputs for UnsafeMath.simpleMulDiv(feeAmount, Q128, liquidity). The truncation
    from using assembly mul instead of full 512-bit multiplication loses precision
    when feeAmount * Q128 approaches 2^256.
  attack_scenario: >
    If optimization finds positive precision loss, LPs are losing fees on every swap.
    The loss per swap may be small (dust), but accumulated over millions of swaps
    it could be significant.
  solidity: |
    // Compare simpleMulDiv vs FullMath.mulDiv for the same inputs
    // Return the absolute difference (precision loss)
    uint256 feeAmount = step.feeAmount; // from most recent swap step
    uint128 liquidity = state.liquidity;
    if (liquidity > 0 && feeAmount > 0) {
        uint256 Q128 = 0x100000000000000000000000000000000;
        uint256 unsafeResult;
        assembly { unsafeResult := div(mul(feeAmount, Q128), liquidity) }
        uint256 safeResult = FullMath.mulDiv(feeAmount, Q128, liquidity);
        // Return difference — Echidna will try to maximize this
        return int256(safeResult) - int256(unsafeResult);
    }
    return int256(0);
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    Since feeAmount is bounded by int256 max (from amountSpecified), and Q128 = 2^128,
    the product feeAmount * Q128 <= (2^127) * 2^128 = 2^255 < 2^256. So for swap-originated
    fees, there is NO overflow and simpleMulDiv produces the same result as FullMath.mulDiv.
    The optimization should confirm this by finding zero precision loss for all inputs.
    The only path where feeAmount could exceed 2^127 is donate(), but SafeCast blocks it.

# ============================================================================
# CLPM-12: BalanceDelta addition overflow in modifyLiquidity
# ============================================================================
- id: CLPM-12
  tier: 2
  type: property
  description: >
    In CLPoolManager.modifyLiquidity line 156, delta + feeDelta is computed using
    BalanceDelta addition which internally does `add(a0, b0)` and `add(a1, b1)` in
    assembly, then casts results via SafeCast.toInt128(). If the sum of delta.amount0
    and feeDelta.amount0 exceeds int128 bounds, the SafeCast will revert.
    delta.amount0 comes from SqrtPriceMath (token amounts for liquidity change).
    feeDelta comes from position fee collection.
    For removal: delta.amount0 is negative (user gets tokens back), feeDelta is negative
    (user gets fees back). Sum is more negative. If both are near -type(int128).max,
    the sum could underflow int128.
    For addition: delta.amount0 is positive (user deposits), feeDelta is negative (fees out).
    The sum could be negative or positive depending on magnitude.
    The SafeCast prevents silent overflow but could cause DoS: a position with very
    large accumulated fees + large liquidity removal could revert.
  attack_scenario: >
    1. LP accumulates massive fees (near int128 max in value).
    2. LP tries to remove liquidity — delta.amount0 is also large negative.
    3. delta + feeDelta overflows int128, SafeCast reverts.
    4. LP cannot remove liquidity or collect fees — funds are locked.
    ANALYSIS: For this to happen, fee accumulation and liquidity value both need to
    approach 2^127 in the same token. With 18-dec tokens, 2^127 = ~1.7e20 tokens.
    For USDC (6-dec), 2^127 = ~1.7e32 USDC. Both are unrealistic in practice.
    However, for very low-decimal tokens or wrapped tokens with unusual decimals,
    the threshold could be lower in dollar terms. Still very unlikely.
  impact: "Theoretical DoS for LPs with extreme fee accumulation + liquidity. Unrealistic in practice."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify BalanceDelta addition doesn't revert for realistic values
    // This is a liveness check — ensure modifyLiquidity never reverts due to overflow
    // Track max observed delta + feeDelta magnitudes
    int128 d0 = delta.amount0();
    int128 d1 = delta.amount1();
    int128 f0 = feeDelta.amount0();
    int128 f1 = feeDelta.amount1();
    // If we reached here without revert, the addition succeeded
    // Track the magnitudes for monitoring
    int256 sum0 = int256(d0) + int256(f0);
    int256 sum1 = int256(d1) + int256(f1);
    t(sum0 >= type(int128).min && sum0 <= type(int128).max,
      "CLPM-12: delta+feeDelta amount0 exceeds int128");
    t(sum1 >= type(int128).min && sum1 <= type(int128).max,
      "CLPM-12: delta+feeDelta amount1 exceeds int128");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    The SafeCast protection means this is a DoS risk, not a fund loss risk.
    And the DoS only occurs for unrealistically large values. Low priority.

