    uint256 maxFeeAmount = maxAmountIn; // worst case 100% fee
    uint16 maxProtocolFee = 4000;
    uint256 product;
    bool overflowed;
    assembly {
        let sum := add(maxAmountIn, maxFeeAmount)
        // Check if sum overflows
        overflowed := lt(sum, maxAmountIn)
        product := mul(sum, maxProtocolFee)
