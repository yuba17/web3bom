# ============================================================================
# CLPM-01: UnsafeMath.simpleMulDiv truncation silently loses fee value
# ============================================================================
- id: CLPM-01
  tier: 1
  type: property
  description: >
    UnsafeMath.simpleMulDiv uses assembly `div(mul(a,b), denominator)` which
    silently truncates the intermediate product to 256 bits. In CLPool.swap
    (line 309) and CLPool.donate (line 458), feeGrowthGlobalX128 is updated via
    simpleMulDiv(feeAmount, Q128, liquidity). When feeAmount * Q128 overflows
    uint256, the result wraps mod 2^256 and the division produces an incorrect
    (too small) feeGrowthGlobal increment. This means LPs lose fees silently.
    feeAmount is uint256 (capped by amountIn which is uint256), and Q128 = 2^128.
    Overflow occurs when feeAmount >= 2^128 (~3.4e38). With 18-decimal tokens,
    this is ~3.4e20 tokens — large but reachable with high-supply tokens (SHIB-like).
    With low-decimal tokens (2 dec), this is only ~3.4e36 base units which is
    unreachable, so the risk is primarily with 18-decimal high-supply tokens.
  attack_scenario: >
    1. Attacker provides massive liquidity in a narrow tick range.
    2. Executes a swap with an extremely large amountIn (feeAmount > 2^128).
    3. feeGrowthGlobalX128 update truncates silently via simpleMulDiv overflow.
    4. LPs in the range receive drastically fewer fees than they should.
    5. The fee tokens are effectively lost (paid by swapper but not tracked for LP distribution).
    Protocol fee accumulator also loses since feeAmount is reduced before the LP portion.
  impact: "Fee loss for LPs on swaps with very large amounts in high-supply 18-decimal tokens. Fees paid by swapper but never claimable by LPs."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Track cumulative feeGrowthGlobal increments vs actual fee amounts
    // Ghost: ghost_cumulativeFees0, ghost_cumulativeFees1 (sum of all step.feeAmount from swaps + donates for each token)
    // Ghost: ghost_cumulativeFeeGrowth0, ghost_cumulativeFeeGrowth1 (sum of feeGrowthGlobal deltas)
    // After each swap, check: feeGrowthGlobal increment * liquidity / Q128 should approximate step.feeAmount
    // This invariant detects if simpleMulDiv silently lost precision
    uint256 feeAmount = 1e30; // large but feasible for 18-dec tokens
    uint256 Q128 = 0x100000000000000000000000000000000;
    uint128 liquidity = 1e18;
    // simpleMulDiv result
    uint256 unsafeResult;
    assembly { unsafeResult := div(mul(feeAmount, Q128), liquidity) }
    // FullMath result (correct)
    uint256 safeResult = FullMath.mulDiv(feeAmount, Q128, liquidity);
    // If these differ, simpleMulDiv lost precision
    eq(unsafeResult, safeResult, "CLPM-01: simpleMulDiv overflow lost fee precision");
  ghost_vars:
  - "uint256 internal ghost_cumulativeFees0;"
  - "uint256 internal ghost_cumulativeFees1;"
  validated: true
  priority: high
  confidence: 75
  notes: >
    This is the same pattern as Uniswap V3 — they also use unchecked mul/div for
    feeGrowthGlobal. The design relies on feeAmount being "reasonably sized."
    With realistic swap sizes (<1e24 for 18-dec tokens), feeAmount * Q128 fits in
    uint256. But the boundary is not explicitly enforced. The overflow threshold
    for feeAmount is 2^128 / Q128... wait, Q128 IS 2^128, so overflow happens when
    feeAmount >= 2^128. Since feeAmount comes from SwapMath and is bounded by
    amountIn, and amountIn is int256 (max ~2^127), feeAmount is actually bounded
    at ~2^127. So feeAmount * Q128 = 2^127 * 2^128 = 2^255 which fits uint256.
    CONCLUSION: This is safe by construction since amountSpecified is int256 and
    feeAmount <= |amountSpecified|. Downgrading to validated:false.
    However, donate() takes uint256 amounts without this bound — donate(2^128, 0)
    WOULD overflow in simpleMulDiv. The donate path IS vulnerable.

# ============================================================================
# CLPM-02: donate() feeGrowthGlobal overflow via simpleMulDiv
# ============================================================================
- id: CLPM-02
  tier: 1
  type: property
  description: >
    CLPool.donate() calls UnsafeMath.simpleMulDiv(amount, Q128, liquidity) where
    amount is uint256 from the caller (no int256 bound like swap). If amount >= 2^128,
    the intermediate product amount * Q128 overflows uint256, and simpleMulDiv returns
    an incorrect truncated result. The feeGrowthGlobal is updated with a wrong
    (smaller) value. The donated tokens are taken from the donor (delta is negative)
    but never properly tracked for LP distribution. Tokens are permanently locked.
  attack_scenario: >
    1. An LP has a position in range with low liquidity (e.g., 1 wei).
    2. Anyone calls donate(2^128, 0) — this is a valid call if pool has liquidity > 0.
    3. amount0.toInt128() will revert for amount >= 2^127 due to SafeCast, BUT
       if amount is between 2^127 and 2^128, toInt128(uint256) also reverts (x >= 1 << 127).
    4. WAIT: donate uses amount0.toInt128() via SafeCast uint256->int128 which reverts
       if amount >= 2^127. So donate reverts for amounts that would overflow simpleMulDiv.
    5. CONCLUSION: SafeCast protects against this vector. The actual overflow threshold
       for simpleMulDiv is feeAmount >= 2^128, but SafeCast blocks at 2^127.
       max(amount * Q128) = (2^127 - 1) * 2^128 = 2^255 - 2^128, which fits uint256.
  impact: "None — SafeCast prevents the dangerous inputs from reaching simpleMulDiv."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: donate with amount near max safe value does not lose precision
    uint256 amount = type(int128).max; // 2^127 - 1 (max that passes SafeCast)
    uint256 Q128 = 0x100000000000000000000000000000000;
    uint128 liquidity = 1;
    uint256 unsafeResult;
    assembly { unsafeResult := div(mul(amount, Q128), liquidity) }
    uint256 safeResult = FullMath.mulDiv(amount, Q128, liquidity);
    eq(unsafeResult, safeResult, "CLPM-02: donate simpleMulDiv precision at max amount");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 90
  notes: >
    After deeper analysis, SafeCast.toInt128(uint256) reverts for any value >= 2^127.
    Since donate() does `-(amount0.toInt128())`, the max amount that can be donated is
    2^127 - 1. At that max, amount * Q128 = (2^127-1) * 2^128 = 2^255 - 2^128 < 2^256.
    No overflow. This hypothesis is INVALID — SafeCast protects it.
    Marking as false positive below.

