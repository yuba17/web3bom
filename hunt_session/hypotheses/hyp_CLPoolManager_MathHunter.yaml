    step.feeAmount <= amountIn * feePips / (MAX_FEE - feePips) ~ amountIn (when fee ~50%).
    So step.amountIn + step.feeAmount <= ~2^193.
    Product with protocolFee: 2^193 * 4000 < 2^193 * 2^12 = 2^205. Fits uint256.
    CONCLUSION: Safe by construction. The math bounds hold.
  impact: "None — bounded by construction."
  impact_rating: Low
  likelihood: Low
