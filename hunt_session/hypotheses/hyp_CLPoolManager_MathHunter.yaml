    The comment says "cannot overflow due to limits on protocolFee and amountSpecified."
    protocolFee max = 4000. amountSpecified max = type(int256).max ~ 2^255.
    step.amountIn + step.feeAmount <= |amountSpecified| (guaranteed by SwapMath).
    Max product: (2^255) * 4000 = 2^255 * 2^12 = 2^267 — OVERFLOWS uint256.
    However, step.amountIn is uint256 from SwapMath which computes it from
    SqrtPriceMath where amountIn is bounded by liquidity * price range.
    With max liquidity = 2^128 and max price range, amountIn could be very large.
    The real question is: can step.amountIn + step.feeAmount be > 2^256 / 4000 = 2^244?
  attack_scenario: >
    1. Pool with very high liquidity and wide tick range.
    2. Swap with large amountSpecified (close to int256 max).
    3. In a single step, step.amountIn + step.feeAmount could be very large.
    4. Multiply by protocolFee (up to 4000) in unchecked block.
    5. If product exceeds 2^256, wraps around, protocol gets tiny fee, rest goes to LP.
    6. Protocol loses revenue; LPs unfairly gain.
    ANALYSIS: step.amountIn comes from SqrtPriceMath.getAmount0Delta or getAmount1Delta.
    getAmount0Delta max = liquidity * (sqrtUpper - sqrtLower) / (sqrtUpper * sqrtLower) * Q96
    With max liquidity (2^128) and max price range, this is bounded by approximately
