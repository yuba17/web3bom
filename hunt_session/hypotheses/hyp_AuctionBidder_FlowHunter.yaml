hunter: FlowHunter
component: AuctionBidder
date: "2026-03-22"
invariants:

  - id: AB-F-01
    description: "Non-assetOut tokens obtained via _multiCall in auctionCallback are permanently stuck in the contract until admin withdraw(). The bid() function (L83-91) only sweeps assetOut balance to receiver. If the solution calls involve multi-hop swaps that leave intermediate token residuals, or if _multiCall acquires tokens other than assetOut as a side effect, those tokens remain in the AuctionBidder with no automatic recovery path."
    confidence: 65
    severity: "Low"
    attack_scenario: |
      1. AUCTION_BIDDER_ROLE calls bid() with a solution that swaps assetIn -> tokenX -> assetOut via DEX
      2. Due to slippage or partial fills, some tokenX remains in AuctionBidder
      3. bid() only checks IERC20(assetOut).balanceOf(address(this)) at L83 and sweeps that
      4. tokenX is stuck until admin calls withdraw()
      5. Impact: dust accumulation over many bids, requires admin intervention to recover
      Note: mitigated by withdraw() existing, but it's a manual process and admin may not track which tokens accumulate
    code_location: "AuctionBidder.sol:L83-L91"

  - id: AB-F-02
    description: "Price discrepancy between getAssetOutAmount (withValidation=false) and bid() internal computation (withValidation=true) can cause the 'without solution' path to always revert. In bid() L78, the AuctionBidder pre-approves using getAssetOutAmount which calls _getAssetPrice with withValidation=false. But when BaseAuction.bid() executes internally at L429+L442, it uses withValidation=true. If validation causes a different (higher) price, the computed assetOutAmount inside bid() exceeds the pre-approved amount, and safeTransferFrom at L453 reverts."
    confidence: 55
    severity: "Medium"
    attack_scenario: |
      1. Price feed has a stale primary source but valid fallback source with higher price
      2. getAssetOutAmount (no validation) returns amount X using primary source price
      3. AuctionBidder approves X tokens of assetOut to BaseAuction
      4. BaseAuction.bid() internally calls _getAssetPrice with validation=true
      5. Validation rejects stale primary, falls back to higher-priced source
      6. Computed assetOutAmount = Y > X
      7. safeTransferFrom(AuctionBidder, BaseAuction, Y) reverts because approval is only X
      8. Result: DoS — the "without solution" path is broken whenever validated vs unvalidated prices diverge
      9. Impact: bids fail, auction may expire without being filled, protocol accumulates unsold assets
    code_location: "AuctionBidder.sol:L78, BaseAuction.sol:L429,L442,L453"

  - id: AB-F-03
    description: "bid() sweeps ENTIRE assetOut balance (L83), not just the amount received from the current bid. Any pre-existing assetOut tokens in the contract (from previous failed callbacks, direct transfers, or donations) are swept to receiver alongside the legitimate bid proceeds. This is a token accounting conflation — the contract uses balance-of rather than tracking the delta."
    confidence: 45
    severity: "Low"
    attack_scenario: |
      1. Someone sends assetOut tokens directly to AuctionBidder (donation, mistake, or intentional griefing)
      2. Next time any AUCTION_BIDDER_ROLE calls bid(), the sweep at L83-91 sends ALL assetOut balance to receiver
      3. This includes both the legitimately received assetIn tokens AND the donated tokens
      4. The receiver gets more than they should from this specific bid
      5. Impact: low — tokens go to the configured receiver anyway, and donate scenario requires external action
      6. However, if receiver changes between donation and sweep, tokens go to wrong receiver
    code_location: "AuctionBidder.sol:L83-L91"

  - id: AB-F-04
    description: "In the 'without solution' path (L77-78), if getAssetOutAmount returns 0 (auction expired or invalid), forceApprove sets approval to 0 and bid() proceeds to call auction.bid() which will revert at the auction level. No harm, but the approval to 0 is a wasted gas operation. More importantly, the external call to getAssetOutAmount at L78 can be manipulated if a malicious auction contract is set by admin — the auction contract is trusted, so this is by-design."
    confidence: 20
    severity: "Info"
    attack_scenario: |
      Not a real attack — just a gas inefficiency. The auction.bid() call at L81 would revert
      with InvalidAuction if the auction is expired, after the wasted forceApprove(0) call.
    code_location: "AuctionBidder.sol:L77-L81"

  - id: AB-F-05
    description: "auctionCallback _multiCall executes arbitrary calls as AuctionBidder. If AuctionBidder has standing token approvals (from previous forceApprove calls that were not consumed, or from solution calls that set approvals), _multiCall in a subsequent bid can drain those approved tokens. The forceApprove at L111 sets approval for assetOut to the auction, but previous _multiCall calls may have set approvals to other addresses that persist."
    confidence: 40
    severity: "Low"
    attack_scenario: |
      1. Bid 1: AUCTION_BIDDER_ROLE submits solution that includes _multiCall calling
         IERC20(tokenX).approve(someAddress, type(uint256).max) as a step in the swap
      2. Bid completes, but the approval to someAddress persists
      3. someAddress (if attacker-controlled or compromised) can now transferFrom AuctionBidder's tokenX
      4. Mitigated by: AUCTION_BIDDER_ROLE is trusted, and they control the solution calls
      5. But if AUCTION_BIDDER_ROLE is a bot with compromised keys, leftover approvals expand blast radius
    code_location: "AuctionBidder.sol:L107-L109, Caller.sol:L49-L63"

  - id: AB-F-06
    description: "No reentrancy guard on AuctionBidder.bid(). BaseAuction.bid() has s_entered guard, but AuctionBidder itself does not. During _multiCall execution in auctionCallback, one of the arbitrary calls could re-enter AuctionBidder.bid() with a DIFFERENT auction contract (if setAuction was called by admin between calls — unlikely in same tx). However, the whenNotPaused and onlyRole modifiers limit this, and _multiCall runs in the callback from BaseAuction which has s_entered=true, so re-entering the SAME BaseAuction is blocked."
    confidence: 15
    severity: "Info"
    attack_scenario: |
      Theoretical only: during _multiCall in auctionCallback, a call re-enters AuctionBidder.bid().
      This would require AUCTION_BIDDER_ROLE (msg.sender check), and BaseAuction.bid() would block
      re-entry via s_entered. No practical path found because:
      - Re-entering same auction: blocked by s_entered
      - Re-entering different auction: would need setAuction in same tx (admin only)
      - msg.sender in the re-entrant bid() call would be the _multiCall target, not the original caller
      Actually, _multiCall uses target.call() from AuctionBidder, so if the target calls back
      AuctionBidder.bid(), msg.sender would be the target — which likely doesn't have AUCTION_BIDDER_ROLE.
    code_location: "AuctionBidder.sol:L69, L102-L109"
