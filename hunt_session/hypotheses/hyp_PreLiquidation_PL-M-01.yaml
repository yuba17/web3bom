component: PreLiquidation.sol
hunter: MathHunter
protocol: morpho-pre-liquidation

findings:
  - id: PL-M-01
    title: "Missing upper bound on preLCF2 causes arithmetic overflow DoS in preLiquidate()"
    severity: low
    category: missing_validation
    component: PreLiquidation.sol
    function: "constructor L88-89, preLiquidate() L169"
    description: |
      Constructor validates preLCF1 <= preLCF2 and preLCF1 <= WAD but has no upper bound
      on preLCF2. When preLCF2 is set to an extreme value (e.g., type(uint256).max), the
      computation at L169 (quotient.wMulDown(PRE_LCF_2 - PRE_LCF_1)) overflows uint256
      in Solidity 0.8.27 checked arithmetic, causing permanent revert of preLiquidate().
      Asymmetry: preLIF2 IS bounded by WAD/LLTV (L92) but preLCF2 is not.
    impact: |
      PreLiquidation contract deployed with extreme preLCF2 passes all constructor validation
      and is registered as isPreLiquidation[addr] = true, but preLiquidate() always reverts.
      A borrower who authorizes such a contract loses pre-liquidation protection.
    poc: "test/PoCFindings.sol::test_PL_M_01_unboundedPreLCF2_overflow_DoS — PASS"
    fix: "Add require(preLCF2 <= type(uint256).max / WAD) in constructor"
    confidence: 85
    redteam_verdict: DO_NOT_REPORT
    redteam_severity_final: INFO
    user_override: REPORT
    report_file: "reports/DRAFT-PL-M-01-unbounded-preLCF2-overflow.md"
