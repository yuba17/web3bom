  investigated_at: '2026-03-24T18:30:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "High-level calls en Solidity >=0.8 incluyen EXTCODESIZE check -- una EOA como ISM target causa revert, no bypass de verificacion."
    briefing_update_applied: false

- hunter: OracleHunter
  id: M-O-FP-03
  reason: "El CEI violation en process() (delivery marcado antes de ISM verify) NO es explotable porque: (1) si verify() revierte, toda la tx revierte y el storage se deshace, (2) si verify() retorna false, el require en L257-259 revierte y deshace, (3) la unica forma de explotar seria si verify() tiene side-effects Y retorna true pero el handle() revierte -- en ese caso, todo se deshace tambien. El delivery solo persiste si TODA la funcion completa exitosamente."
  investigated_at: '2026-03-24T18:30:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
