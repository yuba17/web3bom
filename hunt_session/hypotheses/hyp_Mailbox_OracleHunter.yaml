    bytes32 recipient = bytes32(uint256(uint160(address(this))));
    try originMailbox.dispatch{value: 0}(DESTINATION, recipient, msgBody1) returns (bytes32 id1) {
      bytes32 latestAfter1 = originMailbox.latestDispatchedId();
      eq(uint256(latestAfter1), uint256(id1), "M-O-08: latestDispatchedId mismatch after first dispatch");
