- id: WR-W-01
  tier: 2
  type: property
  description: >
    Assembly selector extraction from short calldata reads uninitialized memory.
    If report contains a data field shorter than 4 bytes, mload(add(data, 32))
    at L106-108 reads past the end of the bytes array into adjacent memory.
    The extracted selector could be partially garbage.
  attack_scenario: >
    Forwarder sends a report where `data` is 1-3 bytes. The assembly reads 32 bytes
    from data+32, but only bytes 0..3 form the selector. Bytes beyond the data length
    are whatever is in adjacent memory. In theory this could match an allowlisted
    selector if memory layout is favorable. In practice: (1) the forwarder role is
    trusted, (2) the probability of a random memory match is ~1/2^32, (3) even if
    matched, the target.call(data) with <4 bytes data would hit the fallback, not
    the matched selector. Net exploitability: near zero.
  impact: >
    If somehow matched, an unintended function call to the target could occur, but
    the data sent would still be the original short bytes, not a valid calldata for
    the matched selector. Fallback execution on target.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Not directly fuzzable — requires crafted ABI encoding
    // Manual test: encode report with data = hex"AA" (1 byte)
    // selector extracted = 0xAA?????? where ? = adjacent memory
    // Verify: contains() returns false for any allowlisted selector
  ghost_vars: []
  validated: false
  priority: low
  confidence: 15
  notes: >
    The allowlist check prevents exploitation. The assembly is technically
    reading out-of-bounds memory but the security impact is negligible because
    the result must match a known selector. bytes4(0) is blocked at L279.
    Solidity 0.8.26 does not zero-pad short bytes in memory beyond their length.
    Informational at best.

- id: WR-W-02
  tier: 2
  type: property
  description: >
    Same target+selector can be allowlisted under multiple workflowIds.
    Removing the pair from one workflowId does NOT revoke access via another
    workflowId that still has it allowlisted.
  attack_scenario: >
    Admin adds target=BaseAuction, selector=performUpkeep to workflowId_A and
    workflowId_B. Later, admin decides to revoke access and removes target+selector
    from workflowId_A only, believing the function is no longer callable.
    A compromised DON node with workflowId_B can still trigger performUpkeep
    on BaseAuction via the second workflowId. Admin has a false sense of security.
  impact: >
    Unintended function execution persists after partial revocation. If the target
    function has side effects (starting auctions, transferring funds), the impact
    could be High depending on the target. The root cause is admin misconfiguration
    rather than a code bug — the per-workflowId isolation is by design.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: after removing target+selector from ALL workflowIds,
    // onReport must revert for that target+selector regardless of workflowId
    // This is an operational invariant, not directly testable in isolation
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: >
    This is arguably by design — each workflowId is an independent authorization
    scope. But there is no admin-facing view that shows "all workflowIds that can
    call target X with selector Y", making revocation error-prone. No getter exists
    for reverse lookups. QA/Low severity — operational risk, not code bug.

- id: WR-W-03
  tier: 2
  type: property
