- id: WR-W-07
  tier: 1
  type: property
  description: >
    Cross-contract: WorkflowRouter can call BaseAuction.performUpkeep or bid
    if admin allowlists those selectors. performUpkeep starts/ends auctions,
    bid transfers tokens. If WorkflowRouter is the msg.sender, it could
    manipulate auctions via crafted report data.
  attack_scenario: >
    1. Admin allowlists target=BaseAuction with selector=performUpkeep(bytes).
    2. A compromised workflow sends a report with crafted performData that
       starts auctions for assets with manipulated amounts.
    3. performUpkeep calls s_feeAggregator.transferForSwap, pulling funds
       into the auction contract.
    4. A second report (or a collaborating bidder) bids at favorable prices.
    Key insight: the report data is controlled by the DON/workflow execution,
    not by the admin. So the admin allowlists the function, but the DON
    controls WHAT arguments are passed to it.
  impact: >
    If BaseAuction.performUpkeep is allowlisted and the DON is compromised,
    the attacker can start auctions with arbitrary parameters, potentially
    allowing underpriced bids. However, performUpkeep has its own validation
    (checks minAuctionSize, assetParams, etc.) and requires AUCTION_WORKER_ROLE
    — WorkflowRouter would need that role on BaseAuction.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Cross-contract test: deploy WorkflowRouter + BaseAuction
    // Grant AUCTION_WORKER_ROLE to WorkflowRouter on BaseAuction
    // Allowlist BaseAuction+performUpkeep on WorkflowRouter
    // Send report with crafted performData
    // Verify: BaseAuction's own validations catch invalid data
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 30
  notes: >
    The security model assumes: (1) admin only allowlists intended targets,
    (2) the DON/workflow is trusted to send correct data. If either assumption
    breaks, the allowlist becomes an attack surface rather than a defense.
    BaseAuction has its own internal validation so direct fund loss is unlikely,
    but the trust boundary between "what function can be called" (admin decides)
    and "what arguments are passed" (DON decides) creates a gap.
    Severity: Low — requires DON compromise AND admin misconfiguration.

