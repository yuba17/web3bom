- id: WR-WC-01
  tier: 1
  type: property
  description: >
    Confirmación de _call: Caller.sol usa target.call(data) — NO delegatecall
    ni staticcall. Los reverts del target se propagan via bubble-up en assembly
    (response.length > 0 → revert con reason; response.length == 0 →
    LowLevelCallFailed). Sin reentrancy guard en ninguna capa. El contrato
    define Errors.ReentrantCall pero NUNCA lo usa. Esta es la base del vector
    de reentrancy en onReport.
  attack_scenario: >
    Si el admin allowlista address(workflowRouter) como target para workflowId_A
    con selector = IReceiver.onReport.selector (0x...), un forwarder puede enviar:
      report = abi.encode(address(workflowRouter),
                          abi.encodeCall(IReceiver.onReport, (metadata_B, innerReport)))
    WorkflowRouter.onReport() pasa todos los checks y ejecuta
    _call(workflowRouter, data) → re-entra en onReport() con workflowId_B.
    Resultado: un forwarder ejecuta dos workflows en una sola transacción.
    No hay ningún guard (ni reentrancy guard, ni counter, ni flag entered).
    Errors.ReentrantCall está definido pero nunca se lanza.
  impact: >
    Un forwarder comprometido puede encadenar N workflows en una transacción,
    colapsando invariantes de orden que el sistema off-chain asume. Si los
    targets afectados asumen ejecución serializada (un report por bloque), la
    reentrancy rompe esa asunción. Severidad depende de targets allowlisted.
    Requiere error de admin como precondición (allowlistar el propio WR).
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verifica que WorkflowRouter NO está allowlisted como target en ningún workflow
    // (cierra la precondición del vector de reentrancy)
    bytes32[] memory wfIds = router.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < wfIds.length; i++) {
        address[] memory targets = router.getAllowlistedTargets(wfIds[i]);
        for (uint256 j = 0; j < targets.length; j++) {
            t(
                targets[j] != address(router),
                "WR-WC-01: WorkflowRouter se allowlisto como target — reentrancy risk"
            );
        }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 75
  notes: >
    Confirmado via lectura de Caller.sol: usa call() puro. No hay ReentrancyGuard.
    El finding WR-W-05 ya cubre esta familia pero con confidence 25% y escenario
    de "target con admin role". Este WR-WC-01 es más preciso: la precondición
    es SOLO que el admin allowliste el propio WorkflowRouter (sin necesidad de
    dar roles al target). El selector onReport.selector (0x...) puede estar en
    la allowlist sin que nadie lo note si el admin maneja muchos workflows.
    Upgrade de confidence a 75% respecto a WR-W-05 por precondición más simple.

- id: WR-WC-02
  tier: 1
  type: property
  description: >
    Short-data selector extraction: análisis preciso del comportamiento en
    Solidity 0.8.26. Si data.length == 0: el mload lee la posición data+32 que
    en Solidity 0.8 heap es cero (scratch space limpio entre allocaciones) →
    selector = bytes4(0) → bloqueado por la allowlist (bytes4(0) nunca puede
    añadirse). Si data.length == 1..3: el mload lee los bytes válidos de data
    en las posiciones más significativas + los bytes del slot de memoria
    contiguo (que es cero en Solidity 0.8 heap limpio) → selector =
    0xXX000000 / 0xXXYY0000 / 0xXXYYZZ00. Si alguno de estos selectores
    compuestos está en la allowlist, _call(target, data) se ejecuta con
    calldata truncado.
  attack_scenario: >
    Escenario concreto: admin allowlista (workflowId, target, selector=0xAA000000).
    Un forwarder buggy o comprometido envía report con data = hex"AA" (1 byte).
    Assembly extrae selector = 0xAA000000 (bytes reales + zero padding del heap).
    Check de allowlist: allowlistedSelectors[target].contains(bytes4(0xAA000000))
    → true. _call(target, hex"AA") ejecuta target con 1 byte de calldata.
    En el target: si hay fallback(), recibe 1 byte de data. Si target es un
    contrato bien formado, el selector 0xAA... no matchea ninguna función y
    el call revertiría → efecto: DoS del workflow.
    Si target tiene un fallback() que acepta cualquier data → ejecución
    inesperada con 1 byte.
    Más importante: el forwarder puede omitir intencionalmente los argumentos
    reales de una función, pasando solo el selector sin argumentos, y el
    sistema lo ejecutaría.
  impact: >
    Un forwarder comprometido puede ejecutar funciones allowlisted con calldata
    incompleto, causando DoS (revert en target) o ejecución del fallback con
    datos malformados. No hay pérdida directa de fondos en WorkflowRouter,
    pero el efecto downstream en el target puede ser relevante.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Ghost var que trackea el length de data del último onReport procesado
    // Un handler de fuzzing inyecta data de 0-3 bytes intencionalmente
    // Invariante: si onReport completa sin revert, data.length >= 4
    if (ghost_lastDataLength > 0 && ghost_lastDataLength < 4) {
        t(false, "WR-WC-02: onReport ejecuto _call con data.length < 4");
    }
  ghost_vars:
    - "uint256 internal ghost_lastDataLength;"
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Análisis más profundo que WR-W-01 (confidence 15%). La clave es que en
    Solidity 0.8.26 el heap se inicializa limpio entre allocaciones, por lo que
    el mload en data+32 cuando data.length < 4 lee ceros en los bytes de padding.
    Esto hace el comportamiento DETERMINÍSTICO (no "garbage" como dice WR-W-01):
    data=[0xAA] → selector = 0xAA000000 SIEMPRE. Esto eleva el riesgo respecto
    a WR-W-01 porque el selector resultante es predecible, no aleatorio.
    El bloqueo sigue siendo la allowlist: ese selector específico debe estar
    allowlisted para que haya impacto.

- id: WR-WC-03
  tier: 2
  type: property
  description: >
    Target zombie: si admin añade (workflowId, target, [selector]) y luego
    remueve todos los selectors de ese target via applyAllowlistedSelectorsUpdates,
    el target permanece en allowlistedTargets sin ningún selector. El getter
    getAllowlistedTargets() devuelve ese target como activo aunque no pueda
    recibir ninguna call. Crea inconsistencia entre la set de targets y la
    realidad operacional.
  attack_scenario: >
    Secuencia: add(workflowId_A, target_X, [sel1]). Luego remove selector sel1.
    Estado resultante: target_X está en allowlistedTargets[workflowId_A] pero
    allowlistedSelectors[workflowId_A][target_X] está vacía.
    getAllowlistedTargets(workflowId_A) devuelve [target_X] → monitor off-chain
    cree que target_X sigue activo para workflowId_A.
    En onReport, el check de allowlist falla: allowlistedSelectors[target_X].contains(sel)
    == false para cualquier sel → revierte con SelectorNotAllowlisted. No hay
    ejecución incorrecta, pero hay confusión de estado.
    Sin impacto directo de seguridad — puramente inconsistencia observable.
  impact: >
    Estado inconsistente entre allowlistedTargets y allowlistedSelectors.
    Herramientas de monitoreo off-chain pueden reportar target como activo
    cuando no lo es. No hay pérdida de fondos.
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Para cada workflowId y target en allowlistedTargets,
    // debe haber al menos 1 selector allowlisted (invariante de consistencia)
    bytes32[] memory wfIds = router.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < wfIds.length; i++) {
        address[] memory targets = router.getAllowlistedTargets(wfIds[i]);
        for (uint256 j = 0; j < targets.length; j++) {
            bytes4[] memory sels = router.getAllowlistedSelectors(wfIds[i], targets[j]);
            t(
                sels.length > 0,
                "WR-WC-03: target en allowlist sin selectors activos (zombie)"
            );
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: >
    Este invariante es violable con certeza por la secuencia documentada arriba.
    Confidence 95% (no 100% porque no he ejecutado el test). La pregunta es si
    el programa de bug bounty considera esto un bug o by-design. Como QA/Info
    finding podría ser aceptado si el programa cubre inconsistencias de estado.
    Más útil como mejora de UX que como security finding.

- id: WR-WC-04
  tier: 2
  type: property
  description: >
    EnumerableSet.add idempotencia: en applyAllowlistedWorkflowsUpdates, si
    el mismo workflowId se añade dos veces en el array adds[], la primera
    llamada a s_allowlistedWorkflowIds.add(workflowId) devuelve true, la
    segunda devuelve false (set ya contiene el elemento). No hay revert.
    El workflowId queda correctamente en la set. Sin embargo, la segunda
    pasada por _applyAllowlistedTargetsUpdates puede añadir targets/selectors
    adicionales o sobreescribir los anteriores, resultando en la UNIÓN de
    los dos sets de targetSelectors.
  attack_scenario: >
    Admin llama applyAllowlistedWorkflowsUpdates con adds = [
      AllowlistedWorkflow{workflowId_A, [{target1, [sel1]}]},
      AllowlistedWorkflow{workflowId_A, [{target2, [sel2]}]}
    ]. La segunda entrada añade target2+sel2 SIN que el admin intencionalmente
    haya querido configurar ambos en la misma llamada. El resultado es que
    workflowId_A tiene AMBOS (target1,sel1) y (target2,sel2).
    Si el admin esperaba que la segunda entrada REEMPLAZARA la primera
    (comportamiento de "upsert"), el contrato silenciosamente hace MERGE.
    No hay evento que indique la segunda pasada.
    Impacto: workflowId puede terminar con más permisos de los intencionados.
  impact: >
    Configuración incorrecta silenciosa: workflowId puede tener más targets/
    selectors de los que el admin pensó configurar. Si uno de los targets
    extra es sensible, el workflow tiene acceso no intencional. Depende del
    error del admin para ser explotable.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // No es un invariante de estado sino de comportamiento de configuración.
    // Test: llamar applyAllowlistedWorkflowsUpdates con workflowId duplicado.
    // Verificar que el resultado es la UNION (no el REPLACE) de los dos sets.
    // No hay Solidity assertion directa — es un test de expectativa de admin.
  ghost_vars: []
  validated: false
  priority: low
  confidence: 85
  notes: >
    Comportamiento documentado de EnumerableSet.add: silenciosamente no-op si
    ya existe. El contrato no tiene ningún check de "este workflowId ya está
    en adds[] anteriormente en este batch". El efecto es merge silencioso de
    configuraciones duplicadas. Finding de QA/Info — requiere error de admin.

false_positives:
- hunter: WildcardHunter
  id: WR-W-FP-01
  reason: >
    bytes4(0) selector bypass investigated — L279 prevents adding bytes4(0) to
    the allowlist, and L95-96 prevents bytes32(0) workflowId. The contains()
    check at L110 correctly converts bytes4 to bytes32 (right-padded) matching
    the storage format at L283. No bypass possible via zero values.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null

- hunter: WildcardHunter
  id: WR-W-FP-02
  reason: >
    Assembly memory safety of bytes32[] to bytes4[] cast at L201-203 and L316-317.
    The cast reinterprets the memory pointer without copying. Since both types use
    32-byte slots per element in memory, and selectors are stored as bytes32(bytes4_val)
    (right-padded, first 4 bytes are the selector), reading as bytes4[] correctly
    extracts the selector from each slot. The length word is shared. Safe cast.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null

- hunter: WildcardHunter
  id: WR-W-FP-03
  reason: >
    Multi-workflowId target+selector duplication (WR-W-02 above). After deeper
    analysis, this is by design — each workflowId is an independent authorization
    scope. The code correctly isolates permissions per workflowId. The lack of
    reverse-lookup getters is a UX concern, not a security bug. Downgraded to QA.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null
