    an EOA returns (true, "") — the call succeeds, data is ignored, and no state
    change occurs. No validation that target has code.
  attack_scenario: >
    Admin accidentally allowlists an EOA address (e.g., typo in target address).
    Every report for that workflowId+target executes successfully but does nothing.
    The workflow silently fails to achieve its intended effect (e.g., starting an
    auction, updating a price). This could persist undetected for a long time if
    monitoring only checks that onReport doesn't revert.
  impact: >
    Denial of intended functionality. No fund loss directly, but if the workflow
    is supposed to trigger time-sensitive actions (like auction starts or price
    updates), the delay could have economic consequences. Funds are not at risk
    from the EOA call itself.
