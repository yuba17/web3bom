- id: WR-W-04
  tier: 2
  type: property
  description: >
    OOG risk during workflowId removal when target/selector sets are large.
    L144-145 calls .values() on the entire allowlistedTargets set, then for
    each target, _applyAllowlistedSelectorsUpdates calls .values() on its
    selectors set. Memory allocation is O(sum of all selectors across all targets).
  attack_scenario: >
    Admin (or a compromised admin key) adds a large number of targets and selectors
    to a workflowId over time. When trying to remove the workflowId, the removal
    transaction runs out of gas because .values() copies the entire set to memory,
    and then iterates to remove each element one by one (each removal is O(1) in
    storage but the memory copy is O(n)). The workflowId becomes permanently
    un-removable within block gas limits.
  impact: >
    The workflowId cannot be removed, meaning its permissions persist forever.
    Admin can still remove individual targets/selectors one by one, so the
    permissions can be revoked piecemeal. Not a permanent lockout, but the
    bulk-removal path is broken. If the admin key is compromised and the attacker
    inflates the sets first, the legitimate admin cannot easily revoke all
    permissions.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Difficult to fuzz — requires large set construction
    // Manual test: add 1000 targets with 100 selectors each to a workflowId
    // Try to remove the workflowId — measure gas
    // Expected: OOG at standard block gas limit (30M)
  ghost_vars: []
  validated: false
  priority: low
  confidence: 35
  notes: >
    The code comments at L129-130 acknowledge this: "should be kept to a
    reasonable length to avoid running into block gas limits." This is a known
    limitation, not a bug. However, the comment only appears on applyAllowlistedWorkflowsUpdates,
    not on the individual add functions where the set actually grows.
    Severity: QA — acknowledged by design.

- id: WR-W-05
  tier: 1
  type: property
  description: >
    No reentrancy guard on onReport. The _call(target, data) at L117 performs
    an external call to an arbitrary allowlisted target. If that target calls
    back into WorkflowRouter (e.g., if the target has FORWARDER_ROLE or
    DEFAULT_ADMIN_ROLE), state can be manipulated mid-execution.
  attack_scenario: >
    1. Admin allowlists target=MaliciousContract with selector=attack().
    2. MaliciousContract.attack() is called via onReport.
    3. Inside attack(), MaliciousContract calls back into WorkflowRouter's
       applyAllowlistedWorkflowsUpdates (if it has DEFAULT_ADMIN_ROLE) to
       add new targets/selectors, or calls onReport again (if it has FORWARDER_ROLE).
    4. The reentrant call can execute additional target calls that were not
       originally authorized, or modify the allowlist while a report is being
       processed.
    Prerequisite: the malicious target must also hold an admin/forwarder role
    on WorkflowRouter — requires admin to grant roles to an allowlisted target.
  impact: >
    If exploitable, arbitrary function calls to any newly-added target during
    reentrancy. But the prerequisite of the target having admin/forwarder role
    is extremely unlikely in practice — it would require severe admin misconfiguration
    (granting privileged roles to a contract that is also an allowlisted call target).
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: onReport should not be reentrable
    // Requires a malicious target contract that reenters onReport
    // Would need FORWARDER_ROLE on the target contract
    // Test: deploy ReentrantTarget that calls router.onReport() in its fallback
    // Expected: should revert (but currently no reentrancy guard exists)
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 25
  notes: >
    The access control (FORWARDER_ROLE + DEFAULT_ADMIN_ROLE) makes this very hard
    to exploit in practice. The forwarder is typically a Chainlink infrastructure
    contract, not user-controlled. However, the absence of a reentrancy guard is
    a defense-in-depth concern. Compare with BaseAuction.bid() which has explicit
    s_entered reentrancy protection. Severity: Low — requires unrealistic admin
    misconfiguration.

