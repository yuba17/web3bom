    2. Attacker uses EXECUTE_SUB_PLAN containing: BALANCE_CHECK_ERC20(victim, USDC, threshold)
       followed by sandwich commands. If the check fails, the sub-plan fails but
       FLAG_ALLOW_REVERT on the EXECUTE_SUB_PLAN means the outer tx succeeds (no gas wasted
       on revert).
    3. This creates a gas-efficient conditional sandwich bot.
  impact: "Enables gas-efficient conditional sandwich attacks using balance checks as oracles"
