- id: D-01
  tier: 1
  type: property
  description: >
    INFI_CL_POSITION_CALL forwards entire ETH balance to position manager — an attacker can
    sequence commands to first deposit ETH (WRAP_ETH with ADDRESS_THIS or raw msg.value), fail
    the wrap intentionally (FLAG_ALLOW_REVERT), and then trigger INFI_CL_POSITION_CALL or
    INFI_BIN_POSITION_CALL which sends address(this).balance to the position manager. If the
    position manager returns excess ETH to the router, subsequent SWEEP by attacker drains it.
    More critically: if user A's tx leaves ETH residue in the router (e.g., overpaid msg.value
    without final SWEEP), user B can craft a tx with INFI_CL_POSITION_CALL that forwards that
    residue into B's own position.
  attack_scenario: >
    1. User A calls execute() with msg.value=1 ETH, does a V2 swap but doesn't sweep leftover ETH.
    2. Router now holds residual ETH (e.g., 0.01 ETH from rounding or overpayment).
    3. Attacker B calls execute() with INFI_CL_POSITION_CALL — line 312 sends
       address(this).balance (including A's residue) as value to INFI_CL_POSITION_MANAGER.
    4. B's mint receives extra ETH at A's expense.
  impact: "Direct theft of ETH residue left in the router between transactions"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track ETH balance before and after INFI_CL_POSITION_CALL
    uint256 ethBefore = address(router).balance;
    // Execute a INFI_CL_POSITION_CALL command
    // The call forwards address(this).balance — verify no third-party ETH is forwarded
    uint256 ethSent = ethBefore; // all ETH is forwarded
    // Invariant: ethSent should be <= msg.value of current tx
    lte(ethSent, msg.value, "D-01: forwarded more ETH than caller sent");
  ghost_vars:
    - uint256 internal ghost_ethSentToPositionManager;
  validated: false
  priority: high
  confidence: 70
  notes: >
    Both INFI_CL_POSITION_CALL (line 312) and INFI_BIN_POSITION_CALL (line 316) use
    address(this).balance as the value. This is a known pattern from Uniswap UR but
    PancakeSwap adds two position managers (CL + Bin) that both do this. Need to verify
    if the position managers refund excess ETH back to the router.

- id: D-02
  tier: 1
  type: property
  description: >
    EXECUTE_SUB_PLAN bypasses the isNotLocked modifier via self-call. The sub-plan calls
    execute() via address(this).call, which re-enters execute(). The Lock.isNotLocked modifier
    allows self-reentrancy (msg.sender == address(this) skips lock check). This means the
    sub-plan runs with the original locker's identity (msgSender() returns _getLocker()). An
    attacker could craft a sub-plan where an inner command fails with FLAG_ALLOW_REVERT, and
    the outer plan continues — potentially using stale state from a partially-failed inner
    swap sequence (e.g., tokens transferred to router but swap reverted after the transfer).
  attack_scenario: >
    1. Attacker crafts execute() with commands: [PERMIT2_TRANSFER_FROM (token A to router),
       EXECUTE_SUB_PLAN].
    2. Sub-plan contains: [V3_SWAP_EXACT_IN with FLAG_ALLOW_REVERT (fails), SWEEP token A
       to attacker].
    3. The V3 swap fails but FLAG_ALLOW_REVERT means execution continues.
    4. Token A is still in the router (transferred in step 1), SWEEP sends it to attacker.
    5. This is "by design" for the user's own tokens, but if combined with a batched permit
       from another user's approval, the attacker could drain tokens.
  impact: "Potential token theft if permit2 approvals can be replayed within sub-plans"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After EXECUTE_SUB_PLAN with a failed inner command, router balance should not
    // contain tokens from a different user's permit2 transfer
    uint256 balAfter = ERC20(token).balanceOf(address(router));
    eq(balAfter, 0, "D-02: tokens stuck in router after sub-plan with partial failure");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    The self-reentrancy pattern is intentional. The risk is in combining FLAG_ALLOW_REVERT
    with sub-plans to create partial-execution states. Need to verify that permit2TransferFrom
    always uses msgSender() correctly even in nested sub-plans.

- id: D-03
  tier: 1
  type: property
  description: >
    Cross-protocol swap token residue: when chaining V2 → V3 → Infinity swaps in a single
    execute(), intermediate tokens pass through the router (recipient=ADDRESS_THIS for
    intermediate hops, payerIsUser=false for subsequent hops). If any intermediate swap
    fails with FLAG_ALLOW_REVERT, tokens from earlier successful swaps remain in the router.
    A subsequent SWEEP or PAY_PORTION by the same user recovers them, but if the user
    doesn't include a final SWEEP, the tokens are stuck and can be stolen by anyone via
    SWEEP in their own transaction.
  attack_scenario: >
    1. User executes: V2_SWAP_EXACT_IN (ETH→USDC, recipient=ADDRESS_THIS),
       V3_SWAP_EXACT_IN (USDC→WBTC, payerIsUser=false, FLAG_ALLOW_REVERT).
    2. V2 swap succeeds: USDC now in router. V3 swap fails (e.g., slippage): silently ignored.
    3. USDC remains in router.
    4. Attacker front-runs the next block with SWEEP(USDC, attacker, 0) and takes the USDC.
  impact: "Theft of intermediate swap tokens left in router after partial execution with FLAG_ALLOW_REVERT"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After execute() completes, the router should hold zero balance of any swap token
    // unless the user intentionally left it there (recipient = ADDRESS_THIS on final command)
    uint256 routerBal = ERC20(intermediateToken).balanceOf(address(router));
    eq(routerBal, 0, "D-03: intermediate tokens stuck in router after cross-protocol swap");
  ghost_vars:
    - uint256 internal ghost_intermediateTokenBalance;
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is the classic Universal Router token residue problem. PancakeSwap's version adds
    StableSwap and Infinity pool types, increasing the number of possible partial-failure
    paths. The FLAG_ALLOW_REVERT bit (0x80) on any command byte allows silent failure.
    Key question: does the frontend always append SWEEP? If so, this is a UX bug, not a
    contract bug — but bots/integrators may not.

- id: D-04
  tier: 1
  type: property
  description: >
    Infinity position manager action allow-list bypass in _checkInfiBinPositionManagerCall.
    The function only blocks Actions.BIN_REMOVE_LIQUIDITY but does NOT block BIN_DONATE_LIQUIDITY
    or other potentially dangerous actions. Compare with _checkInfiClPositionManagerCall which
    blocks CL_INCREASE_LIQUIDITY, CL_DECREASE_LIQUIDITY, and CL_BURN_POSITION explicitly.
    The Bin check is an allow-list-by-exclusion (blocklist) which is weaker than a true allowlist.
    If new Actions are added to the Bin position manager, they would automatically be allowed.
  attack_scenario: >
    1. Infinity Bin position manager gets a new action added (e.g., BIN_TRANSFER_POSITION,
       BIN_COLLECT_FEES, or any future action).
    2. The Dispatcher's _checkInfiBinPositionManagerCall only blocks BIN_REMOVE_LIQUIDITY.
    3. Attacker uses INFI_BIN_POSITION_CALL with the new action to manipulate positions
       that the router has been approved for.
    4. More immediately: if BIN_DONATE is a valid action, attacker could donate to manipulate
       bin pricing through the router.
  impact: "Unauthorized position manipulation via actions not in the blocklist"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that _checkInfiBinPositionManagerCall blocks ALL actions except BIN_ADD_LIQUIDITY
    // Currently it only blocks BIN_REMOVE_LIQUIDITY — asymmetric with CL check
    // For each action in Bin position manager, only BIN_ADD_LIQUIDITY should pass
    // bool passed = tryCall(INFI_BIN_POSITION_CALL, encodeAction(action));
    // if (action != Actions.BIN_ADD_LIQUIDITY) {
    //     assertFalse(passed, "D-04: non-add action allowed through bin position check");
    // }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    CRITICAL asymmetry: CL check blocks INCREASE/DECREASE/BURN (allowlist-by-exclusion of 3
    actions). BIN check blocks only REMOVE (exclusion of 1 action). The CL check also misses
    CL_MINT_POSITION in its blocklist — but that's the intended allowed action. However, the
    CL check does NOT block SETTLE, TAKE, CLOSE_CURRENCY, CLEAR_OR_TAKE, etc. — these are
    non-position-altering actions. The question is whether any of those settlement actions
    can be abused when called through the router's context.

- id: D-05
  tier: 2
  type: property
  description: >
    PERMIT2_TRANSFER_FROM truncates amount to uint160 but the TRANSFER command uses full
    uint256. An amount above type(uint160).max passed to PERMIT2_TRANSFER_FROM would be
    silently truncated by the assembly calldataload (reads 32 bytes but stores in uint160
    variable). However, the assembly reads into a uint160 variable so Solidity's type system
    should handle this. But the raw calldataload reads 32 bytes — need to verify if the
    upper 96 bits are cleaned.
  attack_scenario: >
    1. Attacker crafts PERMIT2_TRANSFER_FROM with amount = (1 << 160) + smallAmount.
    2. Assembly reads full 32 bytes into uint160 — if upper bits are not cleaned, the
       amount could wrap or be misinterpreted.
    3. Permit2.transferFrom receives a different amount than intended.
  impact: "Incorrect transfer amount due to dirty upper bits in assembly"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that amount is properly cleaned to uint160
    // uint160 amount loaded via calldataload should have upper 96 bits zeroed
    // In Solidity, `uint160 x := calldataload(offset)` should auto-clean
    // BUT: calldataload always loads 32 bytes. Assignment to uint160 in Yul may not clean.
    uint256 rawAmount = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF;
    uint160 cleanedAmount = uint160(rawAmount);
    // cleanedAmount should be type(uint160).max, not the full value
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    In Yul/assembly, `amount := calldataload(offset)` loads 32 bytes. The Solidity declaration
    `uint160 amount` means Solidity will clean the value when used in a non-assembly context.
    But the variable is declared as uint160 OUTSIDE the assembly block, then assigned INSIDE.
    Solidity 0.8.26 should handle this correctly, but worth verifying with a concrete test.

