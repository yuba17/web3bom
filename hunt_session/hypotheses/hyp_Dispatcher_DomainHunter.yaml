- id: D-07
  tier: 1
  type: property
  description: >
    StableSwap exactOut uses a two-step process: first calculates amountIn via
    stableSwapExactOutputAmountIn(), then executes stableSwapExactOutput() with that amount.
    If the StableSwap pool state changes between the amountIn calculation and the actual swap
    (e.g., via a hook callback, another command in the same execute(), or flash loan), the
    calculated amountIn may be stale, leading to either overpayment by the user or the swap
    failing. Unlike V2/V3 exactOut which use on-chain callback patterns, StableSwap does
    a read-then-write which is not atomic within the pool itself.
  attack_scenario: >
    1. Attacker monitors mempool for StableSwap exactOut transactions.
    2. Attacker front-runs with a large swap in the same StableSwap pool, moving the price.
    3. Victim's stableSwapExactOutputAmountIn() calculates a higher amountIn due to worse rate.
    4. The swap executes at the worse rate. Attacker back-runs to profit.
    5. The amountInMax check should protect, but if it's set loosely, the user overpays.
  impact: "User overpays on StableSwap exactOut due to non-atomic amountIn calculation"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that stableSwapExactOutput uses the amountIn from stableSwapExactOutputAmountIn
    // and that amountIn <= amountInMax
    uint256 amountIn = stableSwapExactOutputAmountIn(amountOut, amountInMax, path, flag);
    // amountIn is already bounded by amountInMax in the function
    // But: is the pool state consistent between the two calls?
    lte(amountIn, amountInMax, "D-07: amountIn exceeds amountInMax in stable exactOut");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The two-step pattern (calculate then execute) is inherently non-atomic WITHIN the same
    transaction only if pool state can change between the two calls. Within a single external
    call, this should be safe unless there's a callback or re-entrancy. Need to check if
    stableSwapExactOutputAmountIn is a view function or if it modifies state. Also need to
    check if amountInMax is enforced inside stableSwapExactOutputAmountIn.

- id: D-08
  tier: 1
  type: property
  description: >
    The _checkInfiClPositionManagerCall allow-list only checks three specific action bytes
    (CL_INCREASE_LIQUIDITY, CL_DECREASE_LIQUIDITY, CL_BURN_POSITION) and blocks them.
    But it does NOT check for SETTLE, TAKE, CLOSE_CURRENCY, CLEAR_OR_TAKE, or SWEEP actions
    within the modifyLiquidities call. These settlement actions could allow an attacker to
    settle or take tokens from the pool manager in the router's context. Since the router
    may hold approvals or have token balances, SETTLE could be used to settle debts with
    the router's tokens, and TAKE could extract tokens from the pool manager.
  attack_scenario: >
    1. Router has been approved by a user or holds tokens from a previous (same-tx) command.
    2. Attacker crafts INFI_CL_POSITION_CALL with modifyLiquidities containing actions:
       [CL_MINT_POSITION (allowed), SETTLE (not blocked), TAKE (not blocked)].
    3. SETTLE uses the router's token balance to settle a debt.
    4. TAKE extracts tokens from the pool manager to an attacker-controlled address.
    5. The settlement/take actions operate in the router's context since the call originates
       from the router.
  impact: "Unauthorized token extraction via settlement actions not in the action blocklist"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After INFI_CL_POSITION_CALL, verify router balance hasn't decreased for any token
    // that wasn't explicitly part of the mint operation
    uint256 balBefore = ERC20(token).balanceOf(address(router));
    // Execute INFI_CL_POSITION_CALL with TAKE action
    uint256 balAfter = ERC20(token).balanceOf(address(router));
    gte(balAfter, balBefore, "D-08: router lost tokens via position manager call");
  ghost_vars:
    - uint256 internal ghost_routerBalanceBefore;
  validated: false
  priority: high
  confidence: 70
  notes: >
    This is the most promising hypothesis. The position manager check functions are meant to
    prevent users who approved the router from having their positions drained. But the checks
    only block position-altering actions, not settlement actions. The key question is: do
    SETTLE/TAKE in modifyLiquidities operate with the caller's context (the router) or the
    original msg.sender? If the router, then the router's token balances are at risk.
    INFI_CL_POSITION_CALL sends address(this).balance as value — combined with TAKE this
    could drain the router's ETH.

- id: D-09
  tier: 2
  type: property
  description: >
    PAY_PORTION uses bips (basis points, presumably out of 10000) to calculate how much of
    the router's balance to send. If bips > 10000, the calculation could overflow or send
    more than the balance. The assembly block reads bips as uint256 without validation.
    The calculatePortion function in BipsLibrary should validate, but if it doesn't, an
    attacker could specify bips=20000 to get 200% of the balance.
  attack_scenario: >
    1. Router holds 100 USDC from a previous swap command.
    2. Attacker calls PAY_PORTION with bips=20000 (200%).
    3. If calculatePortion doesn't cap at 10000, it calculates amount = 100 * 20000 / 10000 = 200.
    4. Transfer of 200 USDC would fail (insufficient balance), but if there are 200 USDC
       from another user's concurrent tx, the attacker gets double.
  impact: "Over-extraction of router balance via uncapped bips parameter"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify PAY_PORTION with bips > 10000 reverts
    // uint256 bips = 20000;
    // payPortion(token, recipient, bips);
    // Should revert if BipsLibrary.calculatePortion validates bips <= 10000
    uint256 routerBal = ERC20(token).balanceOf(address(router));
    uint256 amount = routerBal * bips / 10000;
    lte(amount, routerBal, "D-09: PAY_PORTION calculated amount exceeds router balance");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    BipsLibrary.calculatePortion likely validates bips <= 10_000. Need to read the library
    source to confirm. If it doesn't validate, this is a real bug. If it does, this is a
    false positive.

- id: D-10
  tier: 1
  type: property
  description: >
    V3_POSITION_MANAGER_CALL forwards raw calldata to V3_POSITION_MANAGER via low-level call.
    The _checkV3PositionManagerCall validates: (a) selector is decreaseLiquidity, collect, or
    burn, and (b) caller is authorized for the tokenId. But the tokenId is extracted at offset
    0x04 from inputs. If the attacker crafts inputs where the first 4 bytes are a valid
    selector but the actual calldata encodes a different function (selector collision or
    calldata manipulation), the check could pass but a different function executes.
    Also: the check validates authorization for ONE tokenId but the actual call could batch
    multiple tokenIds if the V3 position manager supports batching via a single selector.
  attack_scenario: >
    1. Attacker finds a V3 NFT position where the router has approval (from migration flow).
    2. Attacker crafts V3_POSITION_MANAGER_CALL with decreaseLiquidity selector + own tokenId
       (passes auth check) but manipulates calldata to also affect another tokenId.
    3. The _checkV3PositionManagerCall only checks the tokenId at offset 0x04.
    4. If the V3 position manager's decreaseLiquidity can be tricked by extra calldata, the
       attacker could drain another user's position.
  impact: "Unauthorized V3 position manipulation via calldata crafting"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that V3_POSITION_MANAGER_CALL only affects the tokenId checked by
    // _checkV3PositionManagerCall
    // After the call, the position at the checked tokenId should be the only one modified
    // Ghost: track all positions affected by the call
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    The V3 position manager (NonfungiblePositionManager) uses tokenId as the first parameter
    for decreaseLiquidity, collect, and burn. Each function only operates on one tokenId.
    This makes the attack scenario unlikely for the standard V3 NFT PM. However, if PancakeSwap
    uses a custom V3 position manager with different behavior, this could be exploitable.
    Also check if the raw .call(inputs) could hit a fallback function if inputs are crafted.

false_positives:
- hunter: DomainHunter
  id: D-FP-01
  reason: >
    SWEEP command allows anyone to sweep router balance to any recipient. This is by design —
    the router is not meant to hold tokens between transactions. Users must SWEEP at the end
    of their execute() call. Front-running a SWEEP is not a vulnerability in the router, it's
    a user error (not including SWEEP in their command sequence). This is well-documented in
    Uniswap Universal Router and applies here too.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Universal Router SWEEP is permissionless by design — router should never hold tokens
      between transactions. Not a bug, not reportable.
    briefing_update_applied: false

- hunter: DomainHunter
  id: D-FP-02
  reason: >
    The isNotLocked modifier allows self-reentrancy (msg.sender == address(this)). This is
    intentional for EXECUTE_SUB_PLAN to work. The Lock contract explicitly documents this.
    The locker identity is preserved (msgSender() returns original caller), so the sub-plan
    cannot impersonate a different user. This is the same pattern as Uniswap Universal Router.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Universal Router self-reentrancy via EXECUTE_SUB_PLAN is by design. Lock preserves
      original caller identity via Locker storage. Not a reentrancy vulnerability.
    briefing_update_applied: false
