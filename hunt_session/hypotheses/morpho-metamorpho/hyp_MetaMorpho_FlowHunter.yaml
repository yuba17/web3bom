- id: MM-FL-01
  tier: 1
  type: property
  description: 'reallocate() (L368-L417) enforces totalWithdrawn == totalSupplied
    at L416. This ensures no assets are created or destroyed during reallocation.
    However, the check happens AFTER all external calls to MORPHO.withdraw() and MORPHO.supply().
    If Morpho Blue''s withdraw returns fewer assets than expected (e.g., due to rounding
    in share-to-asset conversion), totalWithdrawn could be less than the sum of intended
    withdrawals. The vault tracks totalWithdrawn via the return value of MORPHO.withdraw()
    (withdrawnAssets), which is the actual amount withdrawn. Similarly, totalSupplied
    uses suppliedAssets which is calculated before the MORPHO.supply() call. If supply()
    silently accepts fewer assets, the check would still pass but the vault would
    hold dust. Key concern: the assets == 0 path (L383-385) sets withdrawn = 0 but
    uses shares to withdraw. The withdrawnAssets return could be > 0 while withdrawn
    was set to 0 — this correctly tracks via totalWithdrawn += withdrawnAssets. The
    net-zero invariant is critical: if broken, the vault either leaked tokens or inflated
    its position.

    '
  attack_scenario: 'Attacker cannot directly break this — the revert on L416 prevents
    completion. The real risk is if a Morpho Blue market has unusual rounding that
    causes the invariant check to revert on legitimate reallocations, creating a DoS
    for allocators. For example, if withdrawing all shares from a market returns supplyAssets
    - 1 due to rounding, and the supply target expects exact amounts.

    '
  impact: 'If broken (bypassed): vault leaks or creates assets. If DoS (always reverts):
    allocator cannot rebalance the vault.

    '
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: "function property_mm_fl_01() public {\n  // After any reallocate call,\
