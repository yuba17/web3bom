- id: MM-FL-13
  tier: 1
  type: property
  description: 'For a lending vault, share price (totalAssets / totalSupply) should
    generally not decrease. Interest accrual increases totalAssets → price goes up.
    Fee minting increases totalSupply → price goes down slightly (fee dilution). Withdrawals
    and deposits should maintain price (no arbitrage). Bad debt on Morpho Blue markets
    could decrease totalAssets → price drops. This is a valid market risk, not a bug.
    The key flow invariant: no single user action (deposit, withdraw, mint, redeem)
    should decrease the share price for other users. Rounding should always favor
    the vault (existing shareholders), not the transactor. deposit: shares = assets
    * totalSupply / totalAssets (Floor) → user gets fewer shares → vault benefits
    withdraw: shares = assets * totalSupply / totalAssets (Ceil) → user burns more
    shares → vault benefits mint: assets = shares * totalAssets / totalSupply (Ceil)
    → user pays more → vault benefits redeem: assets = shares * totalAssets / totalSupply
    (Floor) → user gets less → vault benefits All rounding directions are correct
    — they favor the vault.

    '
  attack_scenario: 'If rounding directions were wrong, an attacker could deposit-then-withdraw
    repeatedly, extracting 1 wei per round-trip. With the correct rounding (verified
    above), each round-trip costs the attacker >= 1 wei. No extraction possible. The
    first depositor attack (inflation attack) is mitigated by DECIMALS_OFFSET which
    adds virtual shares. With offset = max(0, 18 - decimals), the initial share price
    is anchored and cannot be manipulated by small deposits.

    '
  impact: No vulnerability — rounding directions are correct.
  impact_rating: Info
  likelihood: None
  severity_final: null
  solidity: "function property_mm_fl_13() public {\n  // Share price should not decrease\
    \ between any two observations\n  // (excluding fee minting and bad debt)\n  uint256\
    \ ta = metamorpho.totalAssets();\n  uint256 ts = metamorpho.totalSupply();\n \
    \ if (ts > 0 && ghost_lastTotalSupply > 0) {\n    // pricePerShare = (ta + 1)\
    \ / (ts + 10^offset)\n    // Using the same formula as the contract for consistency\n\
    \    uint256 offset = metamorpho.DECIMALS_OFFSET();\n    uint256 currentPrice\
    \ = (ta + 1) * 1e18 / (ts + 10 ** offset);\n    uint256 lastPrice = (ghost_lastTotalAssets\
    \ + 1) * 1e18 / (ghost_lastTotalSupply + 10 ** offset);\n    // Allow 1 wei tolerance\
    \ for rounding\n    gte(currentPrice + 1, lastPrice, \"MM-FL-13: share price decreased\"\
    );\n  }\n  ghost_lastTotalAssets = ta;\n  ghost_lastTotalSupply = ts;\n}\n"
  ghost_vars:
  - uint256 internal ghost_lastTotalAssets
  - uint256 internal ghost_lastTotalSupply
  validated: false
  priority: high
  confidence: 85
  notes: 'This is the most important ERC4626 invariant. Fee minting can cause slight
    price decrease (dilution), which is by-design. Bad debt can also decrease it.
    For fuzzing, need to distinguish intentional price changes from bugs.

    '
false_positives:
- id: MM-FL-FP-01
  description: '"infinite approval to Morpho at L135 is dangerous": The forceApprove(morpho,
    max) is set once in constructor. Since Morpho is immutable and the vault NEEDS
    to supply tokens to Morpho, this approval is correct and required. The approval
    is to a trusted immutable contract, not a user-controlled address.

    '
  lesson: Infinite approvals to immutable, trusted protocol contracts are standard
    and safe.
- id: MM-FL-FP-02
  description: '"deposit/withdraw don''t have reentrancy guards": MetaMorpho mitigates
    reentrancy by updating lastTotalAssets early (L536/L549 for deposit/mint, L565/L579
    for withdraw/redeem). Without ERC-777 or callback-enabled tokens, there''s no
    reentrancy vector. Morpho Blue has its own protections. Analyzed reentrant share
    pricing — math actually disfavors reentrant caller.

    '
  lesson: 'Reentrancy guards are unnecessary when: (1) no callback tokens, (2) critical
    state updated before external calls, (3) downstream contracts have own guards.

    '
- id: MM-FL-FP-03
  description: '"skim() can be called by anyone for any token": By design. The function
    sends to skimRecipient (owner-set). If skimRecipient is address(0), skim reverts.
    The vault never holds idle asset tokens (always deployed to Morpho). Permissionless
    skim is safe because the destination is admin-controlled.

    '
  lesson: Permissionless functions are safe when the beneficiary is admin-controlled.
- id: MM-FL-FP-04
  description: '"Fee accrual timing window between setFee/setFeeRecipient": Both setFee
    (L237) and setFeeRecipient (L251) call _updateLastTotalAssets(_accrueFee()) BEFORE
    changing the parameter. All pending fees accrue at old rate to old recipient,
    then parameter changes. Textbook correct implementation.

    '
  lesson: Always accrue pending rewards BEFORE changing reward parameters.
- id: MM-FL-FP-05
  description: '"Deposit/Withdraw lastTotalAssets asymmetry": Deposit writes lastTotalAssets
    twice (L536 early for reentrancy, L676 final). Withdraw writes once before _withdrawMorpho
    (L565). The asymmetry is intentional — deposit needs the early write because super._deposit
    has external call (transferFrom) before _supplyMorpho. Withdraw has the external
    calls (MORPHO.withdraw) first, then super._withdraw. Both paths maintain consistent
    state at all observable points.

    '
  lesson: Asymmetric state update patterns can be correct when the call ordering differs.
