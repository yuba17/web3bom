- id: MM-FL-05
  tier: 1
  type: property
  description: 'MetaMorpho has NO reentrancy guard (no nonReentrant modifier). It
    relies on careful state ordering and Morpho Blue''s own protections. Critical
    deposit() flow: 1. _accrueFee() → mints feeShares, returns newTotalAssets 2. lastTotalAssets
    = newTotalAssets (L536) — early write for reentrancy safety 3. shares computed
    via _convertToSharesWithTotals 4. super._deposit() → SafeERC20.safeTransferFrom(caller,
    vault, assets) then _mint(receiver, shares) 5. _supplyMorpho(assets) → external
    calls to MORPHO 6. lastTotalAssets = lastTotalAssets + assets (L676) If an ERC-777
    tokensToSend callback fires during step 4''s transferFrom, the attacker can re-enter
    deposit(). The reentrant call sees: lastTotalAssets already set to newTotalAssets
    (step 2), but totalSupply() does NOT yet include the first deposit''s shares (not
    yet minted — OZ ERC4626 does transferFrom THEN mint). Wait: checking OZ ERC4626._deposit
    ordering — it does SafeERC20.safeTransferFrom THEN _mint. So during the transferFrom
    callback, shares are NOT yet minted. The reentrant deposit computes shares using
    totalSupply() that excludes first deposit''s shares. With lower totalSupply, each
    share is worth MORE assets, so the reentrant depositor gets FEWER shares — not
    more. Actually: shares = assets * (totalSupply + offset) / (totalAssets + 1) Lower
    totalSupply → fewer shares per asset. So the reentrant depositor gets a WORSE
    rate, not better. The first depositor''s shares (minted after) also use the original
    totalSupply. Both get correct rates for the pre-deposit state. HOWEVER: the _supplyMorpho
    in step 5 of the reentrant call tries to supply to Morpho. If it succeeds, those
    tokens leave the vault. Then the original call''s _supplyMorpho also tries to
    supply. Both see the same caps. This could over-supply past a cap, or the second
    one could fail silently (try/catch). If it reverts at AllCapsReached, the original
    deposit reverts entirely.

    '
  attack_scenario: 'With ERC-777 token: reentrant deposit causes double _supplyMorpho.
    Both try to supply to the same markets. If caps are tight, the second (original)
    deposit''s _supplyMorpho may fail with AllCapsReached, reverting the outer deposit.
    This is a DoS, not a theft — but only affects ERC-777 tokens. For share inflation:
    the math actually DISFAVORS the reentrant depositor (lower totalSupply = fewer
    shares per asset), so no profit extraction.

    '
  impact: 'Potential DoS on deposits with ERC-777 tokens. No share inflation because
    lower totalSupply during reentrant call gives worse rate. Morpho Blue does not
    support ERC-777, so this is theoretical only.

    '
  impact_rating: Low
  likelihood: Low
  severity_final: null
