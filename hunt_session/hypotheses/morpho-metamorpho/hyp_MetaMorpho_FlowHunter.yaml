    should normally have 0 idle assets. During deposit, between super._deposit() (token
    transfer IN) and _supplyMorpho() (supply to Morpho), there IS a window with idle
    tokens. However, skim cannot be called during this window without reentrancy (the
    deposit is a single tx). Via Multicall: deposit() + skim() would execute sequentially
