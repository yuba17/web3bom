- id: MM-FL-03
  tier: 1
  type: property
  description: "lastTotalAssets is a cached value updated in specific places: - deposit/mint:\
    \ L536 sets it to newTotalAssets (accrueFee result), then L676\n  sets it to lastTotalAssets\
    \ + assets. The L536 write is explicitly for reentrancy\n  protection.\n- withdraw/redeem:\
    \ L565/L579 sets it to newTotalAssets.zeroFloorSub(assets). - setFee/setFeeRecipient:\
    \ L237/L251 via _updateLastTotalAssets(_accrueFee()). The invariant: lastTotalAssets\
    \ should approximately equal totalAssets() after any state-changing operation.\
    \ Divergence means fees are miscalculated. If lastTotalAssets > totalAssets(),\
    \ the fee accrual sees negative interest (zeroFloorSub returns 0), so no fees\
    \ are charged even when there IS interest. If lastTotalAssets < totalAssets(),\
    \ extra fees are charged on phantom interest. Critical edge case: when updateWithdrawQueue\
    \ removes a market with non-zero supply, totalAssets() DROPS (removed market no\
    \ longer in loop) but lastTotalAssets is NOT updated. This means lastTotalAssets\
    \ > totalAssets() until interest catches up. During this gap, NO fees accrue —\
    \ feeRecipient loses revenue.\n"
  attack_scenario: 'Malicious curator suppresses fee accrual: 1. Curator sets cap
    to 0 on a market with significant vault supply. 2. Curator submits market removal,
    waits for timelock. 3. Allocator removes market from withdrawQueue (supply still
    in Morpho). 4. totalAssets() drops by the removed market''s supply amount. 5.
    lastTotalAssets stays inflated from before removal. 6. Fee accrual: totalInterest
    = totalAssets().zeroFloorSub(lastTotalAssets) = 0. 7. No fees charged until real
    interest closes the gap. This is a known design trade-off documented in the interface,
    but a malicious curator could exploit it to avoid paying fees.

    '
  impact: 'Fee recipient loses fees when markets are force-removed. Magnitude depends
    on the supply in the removed market relative to total vault assets. Could be significant
    if a large market is removed.

    '
  impact_rating: Medium
  likelihood: Medium
