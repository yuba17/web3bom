state_machine:
  states:
  - UNINITIALIZED
  - EMPTY_NO_MARKETS
  - CONFIGURED
  - ACTIVE
  - PARTIALLY_DRAINED
  - FULLY_ILLIQUID
  - REALLOCATING
  market_states:
  - DISABLED
  - PENDING_CAP
  - ENABLED_CAPPED
  - CAP_ZERO_ENABLED
  - PENDING_REMOVAL
  - REMOVED
  transitions:
  - from: EMPTY_NO_MARKETS
    to: CONFIGURED
    via: submitCap() + acceptCap() — first market enabled
    guard: marketParams.loanToken == asset(), MORPHO.lastUpdate(id) != 0
  - from: CONFIGURED
    to: ACTIVE
    via: deposit() / mint()
    guard: supplyQueue has >=1 market with cap > 0
  - from: ACTIVE
    to: PARTIALLY_DRAINED
    via: 'External: borrowers drain liquidity on Morpho Blue'
    guard: none — automatic by market state
  - from: PARTIALLY_DRAINED
    to: FULLY_ILLIQUID
    via: All markets hit 100% utilization
    guard: none — automatic
  - from: FULLY_ILLIQUID
    to: ACTIVE
    via: Borrowers repay on Morpho Blue, or reallocate() moves funds
    guard: none
  - from: ACTIVE
    to: CONFIGURED
    via: All users redeem/withdraw all shares
    guard: totalSupply() == 0 after withdrawal
  - from: DISABLED
    to: PENDING_CAP
    via: submitCap(mp, newCap) where newCap > 0
    guard: onlyCuratorRole, loanToken == asset()
  - from: PENDING_CAP
    to: ENABLED_CAPPED
    via: acceptCap(mp) after timelock
    guard: block.timestamp >= pendingCap[id].validAt
  - from: ENABLED_CAPPED
    to: CAP_ZERO_ENABLED
    via: submitCap(mp, 0) — instant because newCap < supplyCap
    guard: onlyCuratorRole
  - from: CAP_ZERO_ENABLED
    to: PENDING_REMOVAL
    via: submitMarketRemoval(mp)
    guard: onlyCuratorRole, config[id].enabled, config[id].cap == 0
  - from: PENDING_REMOVAL
    to: REMOVED
    via: updateWithdrawQueue() omitting this market
    guard: block.timestamp >= config[id].removableAt OR supplyShares == 0
  - from: PENDING_CAP
    to: DISABLED
    via: revokePendingCap(id)
    guard: onlyCuratorOrGuardianRole
  anomalies:
  - type: potential_stuck_state
    state: FULLY_ILLIQUID
    description: 'If ALL markets in withdrawQueue have 100% utilization (totalBorrowAssets
      == totalSupplyAssets) AND Morpho singleton has 0 token balance, withdrawals
      revert with NotEnoughLiquidity. Users cannot exit. This is BY DESIGN (lending
      risk), but worth monitoring for edge cases where reallocate() could help but
      allocator is inactive.

      '
  - type: transient_inconsistency
    state: REALLOCATING
    description: 'During reallocate(), between MORPHO.withdraw() and MORPHO.supply()
      calls, the vault holds tokens in its own balance. totalAssets() would be wrong
      during this window. The lastTotalAssets is NOT updated during reallocate — only
      the final totalWithdrawn == totalSupplied check ensures balance. If a callback
      from Morpho.withdraw could trigger a deposit/withdraw on the vault, lastTotalAssets
      would be stale.

      '
  - type: market_removal_with_supply
    state: REMOVED
    description: 'Market can be force-removed via submitMarketRemoval + updateWithdrawQueue
      even with non-zero supplyShares, IF removableAt has elapsed. This permanently
      removes those assets from totalAssets() (no longer in withdrawQueue loop), causing
      instant share price drop. This is documented but creates a grief vector if the
      vault has forced-removal markets with donated supply.

      '
