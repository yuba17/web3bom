# MM-DOS-12: Supply queue with all cap=0 markets blocks deposits
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOS-12
  tier: 1
  type: property
  description: >
    _supplyMorpho() (L771-799) iterates supplyQueue. For each market, if
    cap==0 it continues (skips). If ALL markets in supplyQueue have cap==0,
    the loop completes without supplying anything, and L799 reverts with
    AllCapsReached (assets != 0). This means deposits are blocked.
    The supplyQueue can contain markets with cap=0 because setSupplyQueue()
    at L310-322 checks that cap != 0 for each entry. Wait — L316:
    `if (config[newSupplyQueue[i]].cap == 0) revert UnauthorizedMarket`.
    So setSupplyQueue REQUIRES cap > 0 for all entries. But the cap can
    be set to 0 AFTER the supply queue is set. If curator sets cap=0 on
    a market that's in the supply queue, the supply queue entry remains
    but with cap=0, causing it to be skipped. If ALL markets in supply
    queue get their cap set to 0, deposits are blocked until the allocator
    updates the supply queue.
  attack_scenario: >
    1. supplyQueue = [M1, M2]. Both have cap > 0.
    2. Curator (or owner) calls submitCap(M1, 0) — instant since lowering.
    3. Curator calls submitCap(M2, 0) — instant.
    4. Now supplyQueue = [M1, M2] but both have cap = 0.
    5. Any deposit call → _supplyMorpho skips both → AllCapsReached.
    6. Deposits blocked until allocator calls setSupplyQueue with valid markets.
    SEVERITY: This requires a malicious/compromised curator. Normal
    operation: curator would update supply queue after changing caps.
  impact: >
    Deposits blocked. Existing depositors can still withdraw (withdraw
    queue is separate from supply queue). New deposits impossible until
    allocator fixes the supply queue. Requires trusted role compromise.
  impact_rating: Medium
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dos_12() public view {
      // At least one market in supplyQueue should have cap > 0
      // Otherwise deposits are blocked
      uint256 sqLen = MetaMorpho(address(this)).supplyQueueLength();
      bool hasPositiveCap = false;
      for (uint256 i = 0; i < sqLen; i++) {
        Id id = MetaMorpho(address(this)).supplyQueue(i);
        (uint184 cap,,) = MetaMorpho(address(this)).config(id);
        if (cap > 0) {
          hasPositiveCap = true;
          break;
        }
      }
      // If supply queue is non-empty, at least one market should have cap > 0
      t(sqLen == 0 || hasPositiveCap,
        "MM-DOS-12: all markets in supplyQueue have cap=0 — deposits blocked");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 80
  notes: >
    This requires curator/owner action and is quickly fixable by the
    allocator. Not a permanent DoS. The design separates cap management
    (curator) from queue management (allocator) which creates this
    temporary inconsistency window.
