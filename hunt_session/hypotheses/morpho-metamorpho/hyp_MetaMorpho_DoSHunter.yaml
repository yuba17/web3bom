# MM-DOS-11: reallocate InconsistentReallocation — must balance exactly
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOS-11
  tier: 2
  type: property
  description: >
    reallocate() (L368-416) requires totalWithdrawn == totalSupplied at
    L416, reverting with InconsistentReallocation otherwise. This
    conservation check means the allocator must provide a perfectly
    balanced set of allocations. Due to interest accrual between the
    individual withdraw/supply calls within the same transaction, there
    can be a tiny rounding discrepancy. However, since all accrueInterest
    calls happen within the same block, the interest delta is zero for
    already-accrued markets. The real risk: if a market's accrueInterest
    changes totalSupplyAssets between the allocator's offchain calculation
    and the onchain execution (frontrunning), the exact amounts may
    not balance. The allocator would need to recalculate and retry.
    This is a UX issue, not a security DoS — the allocator can always
    retry with updated values.
  attack_scenario: >
    1. Allocator calculates reallocation offchain.
    2. MEV bot frontruns with a supply/borrow to a market, changing
       interest accrual state.
    3. Allocator's reallocate tx fails with InconsistentReallocation.
    4. Allocator must recalculate and retry.
    5. Repeated frontrunning could delay reallocation but cannot cause
       permanent DoS — the allocator can use Flashbots/private mempool.
  impact: >
    Temporary reallocation failure. Allocator retries with updated
    values or uses private mempool to avoid frontrunning.
  impact_rating: Low
  likelihood: Medium
  severity_final: Info
  solidity: |
    function property_mm_dos_11() public view {
      // reallocate must ensure totalWithdrawn == totalSupplied
      // This is enforced by the contract at L416.
      // No additional invariant needed — the check IS the invariant.
      t(true, "MM-DOS-11: InconsistentReallocation check is built-in");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 85
  notes: >
    The type(uint256).max special case in supply (L395) helps allocators
    handle rounding by making the last supply consume all remaining
    withdrawn assets. This mitigates the rounding issue.

