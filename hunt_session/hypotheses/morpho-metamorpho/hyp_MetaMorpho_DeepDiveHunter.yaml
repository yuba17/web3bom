# ═══════════════════════════════════════════════════════════════════════════
# MM-DD-01: withdraw/redeem uses stale newTotalAssets for lastTotalAssets
#           update, creating cumulative drift exploitable via MEV ordering
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DD-01
  tier: 1
  type: property
  title: "withdraw/redeem lastTotalAssets update uses _accrueFee snapshot, not post-withdrawal reality"
  description: |
    withdraw() (L557-568) and redeem() (L571-582) follow this exact sequence:
      1. newTotalAssets = _accrueFee()           // calls totalAssets(), mints fee shares
      2. shares = convert(assets, totalSupply(), newTotalAssets, ...)
      3. _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets))   // L565/L579
      4. _withdraw(caller, receiver, owner, assets, shares)           // actually withdraws from Morpho

    The critical observation: lastTotalAssets is set to `newTotalAssets - assets` at step 3,
    but `newTotalAssets` was computed at step 1 via totalAssets(). Between step 1 and step 4,
    _withdrawMorpho actually withdraws from Morpho markets, which calls accrueInterest()
    on each market (L708 in _accruedSupplyBalance, called from _withdrawMorpho → _accruedSupplyBalance).

    After the actual withdrawal, the real totalAssets() could differ from `newTotalAssets - assets`
    because accrueInterest() was called again during _withdrawMorpho. The comment at L564/L578
    acknowledges this: "newTotalAssets - assets may be a little off from totalAssets()."

    The "little off" compounds: each withdraw/redeem introduces a tiny delta between
    lastTotalAssets and totalAssets(). Over many operations in the same block (via multicall
    or MEV bundling), this drift accumulates. The direction of drift matters:
    - If lastTotalAssets > totalAssets(): next _accrueFee sees totalInterest = 0 (zeroFloorSub),
      fee accrual is suppressed. Fee recipient loses.
    - If lastTotalAssets < totalAssets(): next _accrueFee sees inflated totalInterest,
      extra fee shares minted. Depositors are diluted.

    The same pattern exists in deposit/mint at L676: lastTotalAssets = lastTotalAssets + assets,
    where the actual post-supply totalAssets() may differ.

    The magnitude per operation is ~1 wei per market (interest accrual rounding). With 30 markets
    and 10 operations batched, drift could be ~300 wei. For large vaults (>$10M), this is dust.
    But for small vaults with high-frequency multicall batches, the cumulative effect on fee
    accrual could be meaningful over time.
  attack_scenario: |
    1. Vault has 30 markets, fee=50%, totalAssets=1000e18
    2. Attacker uses multicall to batch 100 tiny withdraw+deposit cycles
    3. Each cycle: withdraw causes accrueInterest on all 30 markets,
       lastTotalAssets = newTotalAssets - withdrawAmount (stale by ~30 wei)
    4. deposit: lastTotalAssets += depositAmount (compounds staleness)
    5. After 100 cycles: lastTotalAssets drifted ~3000 wei from totalAssets()
    6. If drift is negative (lastTotalAssets < totalAssets): next real operation
       mints excess feeShares on the phantom interest
    7. If drift is positive: fee accrual suppressed for one cycle
  impact: |
    Fee accrual precision degradation. Over thousands of operations, the cumulative
    drift between lastTotalAssets and totalAssets() causes minor fee over/under-accrual.
    Magnitude: ~1 wei per market per operation. For a 30-market vault with 1000 operations
    per day, drift is ~30,000 wei/day ≈ 0.00003 ETH. Dust-level impact.
  impact_rating: Low
  likelihood: Medium
  severity_final: Info
  confidence: 65
  solidity: |
    // Ghost tracking cumulative drift
    uint256 private ghost_cumulativeDrift;

    function property_mm_dd_01() public {
      uint256 lta = vault.lastTotalAssets();
      uint256 ta = vault.totalAssets();
      uint256 drift = lta > ta ? lta - ta : ta - lta;
      ghost_cumulativeDrift += drift;
      // After any single operation, drift should be bounded
      // by numMarkets (1 wei rounding per market per accrueInterest)
      uint256 maxDrift = vault.withdrawQueueLength() + 1;
      t(drift <= maxDrift,
        "MM-DD-01: lastTotalAssets drift exceeds per-operation bound");
    }
  poc_sketch: |
    function test_mm_dd_01_cumulative_drift() public {
      // Setup: vault with 30 markets, some with borrows
      // Loop: 100 iterations of small deposit + withdraw via multicall
      uint256 driftBefore = vault.totalAssets() > vault.lastTotalAssets()
        ? vault.totalAssets() - vault.lastTotalAssets()
        : vault.lastTotalAssets() - vault.totalAssets();
      for (uint256 i = 0; i < 100; i++) {
        vault.deposit(1e6, address(this));
        vault.withdraw(1e6, address(this), address(this));
      }
      uint256 driftAfter = vault.totalAssets() > vault.lastTotalAssets()
        ? vault.totalAssets() - vault.lastTotalAssets()
        : vault.lastTotalAssets() - vault.totalAssets();
      // Assert drift didn't grow unboundedly
      assertLe(driftAfter, vault.withdrawQueueLength() * 2 + 1);
    }
  call_stack: |
    withdraw() L558 _accrueFee() → totalAssets() → expectedSupplyAssets per market
    withdraw() L565 _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets))
    withdraw() L567 _withdraw() → _withdrawMorpho() → _accruedSupplyBalance() → accrueInterest()
    [accrueInterest changes market state AFTER lastTotalAssets was set]
  ghost_vars:
    - ghost_cumulativeDrift
  validated: false
  priority: medium
  notes: |
    The code explicitly acknowledges this at L564: "newTotalAssets - assets may be a little
    off from totalAssets()." This is by design — calling totalAssets() again would cost
    ~30k gas per market. The tradeoff is accepted. Documenting as invariant to catch if
    the drift ever exceeds the expected per-operation bound.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DD-02: _setCap market re-enable — lastTotalAssets double-counts supply
#           if market was removed with supply then re-enabled
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DD-02
  tier: 1
  type: property
  title: "Market re-enable after forced removal can skip fee on recovered phantom assets"
  description: |
    The forced market removal flow:
      1. Curator sets cap=0 (instant, L284-285)
      2. Curator calls submitMarketRemoval → removableAt set (L302)
      3. After timelock, allocator calls updateWithdrawQueue omitting the market (L325)
      4. Market removed from withdrawQueue. config[id] DELETED (L358).
      5. Vault's supplyShares on Morpho REMAIN — these are phantom assets.
      6. totalAssets() no longer counts these (only iterates withdrawQueue).
      7. Share price drops — known and documented (IMetaMorpho.sol L109).

    Now the RE-ENABLE path:
      8. Curator calls submitCap(market, newCap) where newCap > 0
      9. Since cap was deleted (step 4), this is a cap INCREASE → goes through timelock
      10. After timelock, anyone calls acceptCap(market)
      11. _setCap is called (L741) with supplyCap > 0
      12. marketConfig.enabled is FALSE (deleted at step 4), so L745 branch triggers:
          - withdrawQueue.push(id)      — market back in queue
          - marketConfig.enabled = true
          - _updateLastTotalAssets(lastTotalAssets + MORPHO.expectedSupplyAssets(...))  [L753]

    The L753 update adds the phantom assets back to lastTotalAssets. But totalAssets()
    ALSO now includes these assets (market is back in withdrawQueue). So both increase
    by the same amount. The NET effect on fee accrual:

    Before re-enable: totalAssets = X (without phantom), lastTotalAssets = Y
    After re-enable:  totalAssets = X + phantom, lastTotalAssets = Y + phantom
    Interest = (X + phantom) - (Y + phantom) = X - Y (unchanged)

    This is CORRECT — the phantom assets don't generate phantom interest.

    BUT: What if between removal (step 4) and re-enable (step 11), interest accrued
    on the phantom assets in Morpho Blue? The phantom market's supply earned interest
    from borrowers, increasing the vault's supplyShares value. At re-enable, L753 adds
    the CURRENT expectedSupplyAssets (including accrued interest). But lastTotalAssets
    at step 3-4 was already reduced by the removal (totalAssets dropped). So Y was
    already adjusted downward when totalAssets stopped counting the phantom market.

    The issue: lastTotalAssets was NEVER explicitly reduced at removal. The removal
    just changes totalAssets() (by removing market from iteration). The NEXT _accrueFee
    call sees totalAssets() < lastTotalAssets → zeroFloorSub → totalInterest = 0.
    lastTotalAssets stays high until a mutation triggers _accrueFee() which sets
    lastTotalAssets = totalAssets() (indirectly via deposit/withdraw/setFee/setFeeRecipient).

    If NO mutation happens between removal and re-enable, lastTotalAssets was never
    corrected downward. At re-enable, L753 adds phantom assets to the still-high
    lastTotalAssets. The new lastTotalAssets = (old_high_lastTotalAssets) + phantom.
    But totalAssets = (old_totalAssets_without_phantom) + phantom_with_interest.

    If phantom assets earned interest during removal period:
      totalAssets = old_total_without_phantom + (phantom + interest_on_phantom)
      lastTotalAssets = old_high_lta + phantom

    The interest on phantom assets during removal is NOT captured by fee accrual
    because lastTotalAssets was bumped by phantom (without interest), making the
    next totalInterest calculation miss the interest earned during removal.

    Concrete: vault has 100 in market A, 100 in market B. Market B removed.
    lastTotalAssets was 200, now totalAssets = 100. No mutation happens.
    lastTotalAssets still 200. Market B earned 10 interest during removal.
    Re-enable: L753 adds expectedSupplyAssets(B) = 110 to lastTotalAssets.
    lastTotalAssets = 200 + 110 = 310.
    totalAssets = 100 + 110 = 210.
    Next _accrueFee: totalInterest = 210 - 310 → zeroFloorSub → 0.

    The 10 interest on phantom assets AND the 100 original interest on market A
    (that accrued while lastTotalAssets was stale-high at 200) are BOTH skipped.
    Fee recipient loses fees. Depositors benefit (no dilution from fee shares).

    This is only exploitable if the fee recipient is the adversary (they're not —
    they're the ones losing). But it means the owner/protocol loses fee revenue
    when markets are removed and re-enabled without intermediate mutations.
  attack_scenario: |
    1. Vault: market A (100e18), market B (100e18), fee=50%, lastTotalAssets=200e18
    2. No user interacts for a while. Interest accrues: market A now 105e18, B now 105e18
    3. totalAssets()=210e18, lastTotalAssets=200e18 (stale — no mutation yet)
    4. Curator force-removes market B (cap=0, submitMarketRemoval, wait, updateWithdrawQueue)
    5. totalAssets() now = 105e18 (only A). lastTotalAssets still 200e18 (no mutation)
    6. Interest continues: A → 110e18, B → 112e18 (phantom, earning interest in Morpho)
    7. Curator re-enables B: _setCap → L753: lastTotalAssets = 200 + 112 = 312e18
    8. totalAssets() = 110 + 112 = 222e18
    9. Next _accrueFee: totalInterest = 222 - 312 → zeroFloorSub → 0
    10. Fee on the entire 22e18 of interest (10 on A + 12 on B) is SKIPPED
    11. Fee recipient lost ~11e18 in fees (50% of 22e18)
  impact: |
    Fee recipient loses fees on interest accrued during market removal + re-enable
    cycle, especially when no user mutations happen in between. The protocol/owner
    loses revenue. Depositors are NOT harmed (they avoid fee dilution). This is a
    fee-avoidance vector, not a fund-loss vector.
  impact_rating: Medium
  likelihood: Low
  severity_final: Low
  confidence: 70
  solidity: |
    // Track fee accrual correctness across market removal/re-enable cycles
    uint256 private ghost_totalInterestShouldHaveAccrued;
    uint256 private ghost_totalFeeSharesMinted;

    function property_mm_dd_02() public {
      uint256 lta = vault.lastTotalAssets();
      uint256 ta = vault.totalAssets();
      // After any _accrueFee triggered operation, lastTotalAssets should
      // be reasonably close to totalAssets (within rounding of numMarkets)
      // A large gap (lta >> ta) means phantom removal inflated lastTotalAssets
      if (lta > ta) {
        uint256 gap = lta - ta;
        uint256 threshold = ta / 10 + vault.withdrawQueueLength();
        t(gap <= threshold,
          "MM-DD-02: lastTotalAssets >> totalAssets after market re-enable — fee avoidance");
      }
    }
  poc_sketch: |
    function test_mm_dd_02_fee_avoidance_via_removal_reenable() public {
      // 1. Deploy vault with 2 markets (A, B), fee=50%, deposit 200e18
      // 2. Advance time to accrue interest on both markets
      // 3. Force-remove market B (cap=0, submitMarketRemoval, warp, updateWithdrawQueue)
      // 4. DO NOT deposit/withdraw (keep lastTotalAssets stale)
      // 5. Advance time to accrue more interest on phantom market B
      // 6. Re-enable market B (submitCap, warp, acceptCap)
      // 7. Trigger fee accrual via tiny deposit
      // 8. Assert: feeShares minted are LESS than expected for total interest accrued
      // 9. The gap is the fee avoidance amount
      uint256 feeSharesBefore = vault.balanceOf(feeRecipient);
      vault.deposit(1, address(this)); // trigger _accrueFee
      uint256 feeSharesAfter = vault.balanceOf(feeRecipient);
      // feeSharesAfter - feeSharesBefore should reflect ALL interest, but it won't
      // because lastTotalAssets was inflated by the re-enable L753 addition
    }
  call_stack: |
    submitMarketRemoval() → sets removableAt
    updateWithdrawQueue() L358 → delete config[id] [market removed, totalAssets drops]
    [time passes, interest accrues on phantom market in Morpho Blue]
    submitCap(market, newCap) → pendingCap set
    acceptCap() → _setCap() L741
    _setCap L745-753 → withdrawQueue.push, enabled=true, _updateLastTotalAssets(lastTotalAssets + expectedSupply)
    [lastTotalAssets now includes phantom + interest, but was already high from pre-removal stale value]
  ghost_vars:
    - ghost_totalInterestShouldHaveAccrued
    - ghost_totalFeeSharesMinted
  validated: false
  priority: high
  notes: |
    This is the deepest interaction between Convergence 2 (phantom assets) and the fee system.
    The fee-avoidance is a PROTOCOL LOSS, not a user loss. Depositors actually benefit.
    The severity depends on whether "fee recipient loses revenue" is considered a finding
    on Cantina. Likely Low/Medium since the fee recipient is a trusted role set by owner.
    The fix would be: in _setCap, when re-enabling, call _accrueFee() first to settle
    the stale lastTotalAssets, THEN add the phantom assets.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DD-03: reallocate withdrawal by shares (assets==0) breaks conservation
#           check when Morpho rounds withdrawnAssets down
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DD-03
  tier: 1
  type: property
  title: "reallocate assets==0 path: withdrawnAssets from Morpho added to totalWithdrawn but value differs from supplyAssets"
  description: |
    reallocate() (L368-417) has a special case when allocation.assets == 0 (L383):
      shares = supplyShares;
      withdrawn = 0;

    Then MORPHO.withdraw(marketParams, 0, supplyShares, ...) is called, which returns
    (withdrawnAssets, withdrawnShares). withdrawnAssets is computed by Morpho Blue as:
      shares.toAssetsDown(totalSupplyAssets, totalSupplyShares)

    Meanwhile, the supplyAssets computed at L375 via _accruedSupplyBalance uses:
      shares.toAssetsDown(market.totalSupplyAssets, market.totalSupplyShares)

    These SHOULD be the same since _accruedSupplyBalance calls accrueInterest first (L708)
    and the Morpho withdraw also calls accrueInterest. Both use the same market state.

    The conservation check at L416: totalWithdrawn == totalSupplied.
    totalWithdrawn += withdrawnAssets (actual from Morpho).
    totalSupplied += suppliedAssets (computed from allocation parameters).

    If the allocator uses assets==0 for withdrawal AND type(uint256).max for the
    supply target, the supply absorbs everything: suppliedAssets = totalWithdrawn - totalSupplied.
    This always balances. The conservation check cannot fail in this pattern.

    BUT: what if the allocator uses assets==0 for withdrawal and an EXPLICIT amount
    for supply? Then:
    - totalWithdrawn = withdrawnAssets (from Morpho, rounded down)
    - totalSupplied = explicit amount
    - If explicit amount != withdrawnAssets → InconsistentReallocation revert

    The allocator might compute supplyAssets based on _accruedSupplyBalance's supplyAssets
    (L375), but withdrawnAssets from Morpho could differ by 1 wei due to independent
    rounding in Morpho's withdrawal. This is a UX footgun, not a security issue.

    HOWEVER — the deeper issue: when allocation.assets == 0, `withdrawn` is set to 0
    (L385). This means `supplyAssets.zeroFloorSub(allocation.assets)` at L376 computes
    `supplyAssets.zeroFloorSub(0) = supplyAssets`. Since `supplyAssets > 0` (the market
    has supply), the code enters the `withdrawn > 0` branch (L378). Wait — let me re-read.

    L376: `uint256 withdrawn = supplyAssets.zeroFloorSub(allocation.assets);`
    With allocation.assets == 0: withdrawn = supplyAssets (which is > 0).
    L378: `if (withdrawn > 0)` — TRUE.
    L383: `if (allocation.assets == 0)` — TRUE.
    L384: shares = supplyShares; withdrawn = 0;
    So withdrawn is OVERWRITTEN to 0 at L385.
    L388-389: MORPHO.withdraw(marketParams, 0, shares, ...) — withdraws by shares.
    L393: totalWithdrawn += withdrawnAssets — adds actual withdrawn amount.

    OK so the withdrawn variable is local and gets overwritten. The actual amount
    withdrawn from Morpho (withdrawnAssets) is what's added to totalWithdrawn.
    This is correct.

    After thorough analysis, the reallocate conservation is robust. Marking as validated
    design. The invariant tests the conservation property.
  attack_scenario: |
    No attack — conservation check at L416 is robust. The assets==0 special case
    correctly handles share-based withdrawal. The type(uint256).max sentinel in
    supply correctly absorbs any rounding differences. Testing the invariant confirms
    this design is sound. The only UX issue is that explicit amounts must exactly
    match, which is fragile without the max sentinel.
  impact: |
    No impact. Reallocate conservation is correctly enforced. The invariant validates
    this critical property.
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 90
  solidity: |
    uint256 private ghost_totalAssetsBeforeReallocate;

    function beforeReallocate() internal {
      ghost_totalAssetsBeforeReallocate = vault.totalAssets();
    }

    function property_mm_dd_03() public {
      // After successful reallocate, totalAssets must be within rounding of pre-reallocate value
      uint256 ta = vault.totalAssets();
      uint256 before = ghost_totalAssetsBeforeReallocate;
      if (before > 0) {
        uint256 qLen = vault.withdrawQueueLength();
        // Allow 1 wei per market for rounding
        t(ta + qLen >= before && ta <= before + qLen,
          "MM-DD-03: reallocate changed totalAssets beyond rounding tolerance");
      }
    }
  poc_sketch: |
    function test_mm_dd_03_reallocate_conservation() public {
      // Setup vault with 3 markets, supply distributed
      uint256 totalBefore = vault.totalAssets();
      // Reallocate: withdraw all from market A (assets=0), supply to B (max)
      MarketAllocation[] memory allocs = new MarketAllocation[](2);
      allocs[0] = MarketAllocation(marketA, 0);        // withdraw all
      allocs[1] = MarketAllocation(marketB, type(uint256).max); // supply remainder
      vault.reallocate(allocs);
      uint256 totalAfter = vault.totalAssets();
      assertApproxEqAbs(totalAfter, totalBefore, 3); // 1 wei per market
    }
  call_stack: |
    reallocate() L375 _accruedSupplyBalance → accrueInterest
    reallocate() L383-385 assets==0: shares=supplyShares, withdrawn=0
    reallocate() L388 MORPHO.withdraw(mp, 0, shares, ...)
    reallocate() L393 totalWithdrawn += withdrawnAssets
    reallocate() L395-396 type(uint256).max: suppliedAssets = totalWithdrawn - totalSupplied
    reallocate() L416 totalWithdrawn == totalSupplied [enforced]
  ghost_vars:
    - ghost_totalAssetsBeforeReallocate
  validated: true
  priority: medium
  notes: |
    Validated as correct by design. The conservation invariant is the strongest
    property in the contract. Including as a validated invariant for the fuzzing
    harness to confirm.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DD-04: Asymmetric try/catch between deposit/withdraw and totalAssets
#           creates inconsistent ERC4626 behavior during IRM failure
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DD-04
  tier: 1
  type: property
  title: "IRM failure creates asymmetric vault behavior: deposits possible, withdrawals revert, totalAssets reverts"
  description: |
    This deepens Convergence 1 (IRM revert DoS) by examining the FULL behavior matrix
    when one market's IRM starts reverting:

    1. totalAssets() — REVERTS. Iterates all withdrawQueue, calls expectedSupplyAssets
       which calls borrowRateView. No try/catch. (L585-589)

    2. deposit()/mint() — REVERTS. Calls _accrueFee() → _accruedFeeShares() →
       totalAssets(). Reverts at step 1.

    3. withdraw()/redeem() — REVERTS. Same _accrueFee() path. Reverts at step 1.

    4. _supplyMorpho() — NOT REACHED (deposit reverts before getting here). BUT if it
       were reached, individual MORPHO.supply() calls have try/catch (L791). The IRM
       failure is in expectedSupplyAssets (view), not supply (mutative with separate
       accrueInterest). Would the mutative accrueInterest also revert? YES — it calls
       IIrm.borrowRate() (same IRM, just different function). So supply to the affected
       market would revert in try/catch and be skipped. Other markets still work.

    5. _withdrawMorpho() — NOT REACHED (same reason). But the try/catch at L815 would
       handle it similarly.

    6. reallocate() — DOES NOT CALL totalAssets(). It calls _accruedSupplyBalance()
       per market (L375), which calls MORPHO.accrueInterest(). If the affected market's
       IRM reverts, the ENTIRE reallocate reverts (no try/catch). BUT the allocator can
       simply exclude the affected market from the allocation array. Reallocate only
       processes markets in the input array, not all withdrawQueue markets.

    KEY INSIGHT that hunters missed: The allocator CAN still call reallocate() to move
    funds BETWEEN non-affected markets, even while totalAssets() reverts. This means:
    - Users cannot deposit/withdraw (totalAssets reverts)
    - Allocator CAN still reallocate among healthy markets
    - Allocator CANNOT reallocate out of the affected market
    - The affected market's funds are stuck until IRM recovers or market is removed

    The deeper issue: maxWithdraw/maxRedeem/maxDeposit/maxMint ALL revert (they call
    _convertToShares/_convertToAssets which call _accruedFeeShares() → totalAssets()).
    This means ERC4626 integrations (e.g., yield aggregators, routers) that call
    maxWithdraw before withdrawing will see reverts and may interpret this as "vault
    is broken" even though the fix (market removal) is in progress.

    The recovery path requires the curator to:
    a) Set cap to 0 (submitCap → instant for decrease)
    b) Submit market removal (submitMarketRemoval)
    c) Wait timelock (>= 1 day)
    d) Allocator calls updateWithdrawQueue to remove the market

    During steps a-d (minimum 1 day), the vault is COMPLETELY FROZEN. No deposits,
    no withdrawals, no fee accrual. For large vaults ($10M+), this means $10M+
    locked for >1 day due to a single IRM failure.

    IMPORTANT: The IRM is chosen at Morpho Blue market creation time and is immutable
    per market. The curator chose to enable this market in the vault. So the IRM risk
    is a curator trust decision. However, an IRM that works correctly for months could
    develop a revert condition later (e.g., if the IRM reads an external oracle that
    gets deprecated, or if a storage-dependent IRM reaches an edge case).
  attack_scenario: |
    1. Vault has 10 markets including market M with a complex IRM
    2. IRM for market M has a latent edge case: when utilization > 99.99%,
       borrowRateView() reverts due to overflow in rate calculation
    3. A borrower pushes M to 99.99% utilization
    4. totalAssets() now reverts → ALL vault operations frozen
    5. Users cannot withdraw their funds from ANY market
    6. Allocator can reallocate between other 9 markets (doesn't help users)
    7. Curator must: setCap(M, 0) → submitMarketRemoval(M) → wait 1+ day
    8. Only after timelock: updateWithdrawQueue removes M → vault unfreezes
    9. During freeze: no deposits, no withdrawals, no fee accrual on any market
  impact: |
    Complete vault freeze for minimum 1 day (MIN_TIMELOCK). All user funds locked.
    Severity depends on vault TVL and the speed of curator response. For a $50M
    vault, this means $50M locked for 24+ hours with no user recourse. The market's
    own funds in the affected market remain stuck until the IRM recovers (even after
    market removal, the phantom assets stay in Morpho Blue).
  impact_rating: High
  likelihood: Low
  severity_final: Medium
  confidence: 75
  solidity: |
    function property_mm_dd_04() public {
      // If vault has shares outstanding, totalAssets must be callable
      // AND deposit/withdraw must be callable (no total freeze)
      uint256 supply = vault.totalSupply();
      if (supply == 0) return;

      bool totalAssetsWorks;
      try vault.totalAssets() returns (uint256) {
        totalAssetsWorks = true;
      } catch {
        totalAssetsWorks = false;
      }

      if (!totalAssetsWorks) {
        // Vault is frozen — verify no operations work
        bool depositWorks;
        try vault.maxDeposit(address(this)) returns (uint256) {
          depositWorks = true;
        } catch {
          depositWorks = false;
        }
        t(false, "MM-DD-04: vault frozen — totalAssets reverts while shares exist");
      }
    }
  poc_sketch: |
    function test_mm_dd_04_irm_revert_freezes_vault() public {
      // 1. Deploy vault with 2 markets
      // 2. Deploy a mock IRM that can be toggled to revert
      // 3. Deposit funds into both markets
      // 4. Toggle IRM to revert on borrowRateView
      // 5. Assert: totalAssets() reverts
      // 6. Assert: deposit() reverts
      // 7. Assert: withdraw() reverts
      // 8. Assert: reallocate() on healthy market still works
      // 9. Fix: setCap(M, 0), submitMarketRemoval, warp, updateWithdrawQueue
      // 10. Assert: vault operations resume
      mockIrm.setShouldRevert(true);
      vm.expectRevert();
      vault.totalAssets();
      vm.expectRevert();
      vault.deposit(1e18, address(this));
      vm.expectRevert();
      vault.withdraw(1e18, address(this), address(this));
      // Recovery
      vault.submitCap(marketParams, 0); // instant decrease
      vault.submitMarketRemoval(marketParams);
      vm.warp(block.timestamp + vault.timelock() + 1);
      uint256[] memory indexes = new uint256[](1);
      indexes[0] = 0; // keep only healthy market
      vault.updateWithdrawQueue(indexes);
      // Now vault should work again
      uint256 ta = vault.totalAssets(); // should succeed
      vault.withdraw(ta / 2, address(this), address(this)); // should succeed
    }
  call_stack: |
    totalAssets() L585 → loop over withdrawQueue
    totalAssets() L587 → MORPHO.expectedSupplyAssets(marketParams, address(this))
    expectedSupplyAssets → expectedMarketBalances (MorphoBalancesLib L33)
    expectedMarketBalances L44-45 → IIrm(irm).borrowRateView(marketParams, market)
    [If IRM reverts → expectedMarketBalances reverts → expectedSupplyAssets reverts →
     totalAssets reverts → _accruedFeeShares reverts → _accrueFee reverts →
     deposit/mint/withdraw/redeem ALL revert]
  ghost_vars: []
  validated: false
  priority: critical
  notes: |
    This is the convergence of MM-O-01 and MM-DOS-01 with the added insight about
    the FULL behavior matrix (what still works vs what doesn't during a freeze) and
    the minimum recovery time (timelock). The key novel element: the allocator CAN
    still reallocate between healthy markets, but this doesn't help users. The minimum
    1-day freeze with no user recourse is the reportable aspect. Whether this is in-scope
    depends on whether "IRM behavior" is considered an excluded external dependency.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DD-05: _accruedFeeShares L904 subtraction uses unchecked-style math
#           that could theoretically underflow if fee rounds up
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DD-05
  tier: 1
  type: property
  title: "Fee accrual arithmetic: newTotalAssets - feeAssets at L904 is safe but verification-worthy"
  description: |
    _accruedFeeShares() L894-906:
      newTotalAssets = totalAssets();
      totalInterest = newTotalAssets.zeroFloorSub(lastTotalAssets);
      if (totalInterest != 0 && fee != 0) {
        feeAssets = totalInterest.mulDiv(fee, WAD);
        feeShares = _convertToSharesWithTotals(feeAssets, totalSupply(), newTotalAssets - feeAssets, Floor);
      }

    The expression `newTotalAssets - feeAssets` at L904. Can this underflow?

    feeAssets = totalInterest * fee / WAD (rounded down via mulDiv Floor)
    totalInterest = newTotalAssets - lastTotalAssets (we know newTotalAssets >= lastTotalAssets
    because of the zeroFloorSub — if newTotalAssets < lastTotalAssets, totalInterest = 0 and
    we don't enter the if block)

    So: feeAssets = (newTotalAssets - lastTotalAssets) * fee / WAD
    fee <= MAX_FEE = 0.5e18 = WAD/2

    feeAssets <= (newTotalAssets - lastTotalAssets) * (WAD/2) / WAD
             = (newTotalAssets - lastTotalAssets) / 2
             <= newTotalAssets / 2  (since lastTotalAssets >= 0)

    So feeAssets <= newTotalAssets / 2, meaning newTotalAssets - feeAssets >= newTotalAssets / 2 > 0.

    NO UNDERFLOW POSSIBLE. This is safe by construction. The MAX_FEE = 50% cap ensures
    feeAssets can never exceed half of newTotalAssets.

    However, the mulDiv could theoretically round UP if we used Ceil (it uses Floor here,
    so feeAssets is rounded DOWN). Even with Ceil, feeAssets would be at most:
    (newTotalAssets - lastTotalAssets) * fee / WAD + 1, which is still < newTotalAssets
    for any reasonable values.

    This is validated as safe. Including as a high-confidence invariant.
  attack_scenario: |
    No attack possible. The arithmetic is safe by construction:
    1. totalInterest <= newTotalAssets (from zeroFloorSub)
    2. feeAssets <= totalInterest / 2 (from MAX_FEE = 50%)
    3. Therefore feeAssets <= newTotalAssets / 2
    4. newTotalAssets - feeAssets >= newTotalAssets / 2 > 0 (no underflow)
  impact: |
    No impact. Arithmetic is provably safe. Invariant validates this property.
  impact_rating: Info
  likelihood: None
  severity_final: null
  confidence: 95
  solidity: |
    function property_mm_dd_05() public view {
      uint256 ta = vault.totalAssets();
      uint256 lta = vault.lastTotalAssets();
      uint256 fee_ = uint256(vault.fee());
      if (ta > lta && fee_ > 0) {
        uint256 totalInterest = ta - lta;
        uint256 feeAssets = totalInterest * fee_ / 1e18;
        // This MUST hold: feeAssets <= ta (no underflow in L904)
        t(feeAssets <= ta,
          "MM-DD-05: feeAssets > totalAssets — L904 would underflow");
        // Stronger: feeAssets <= ta / 2 (from MAX_FEE constraint)
        t(feeAssets <= ta / 2 + 1,
          "MM-DD-05: feeAssets > totalAssets/2 — MAX_FEE constraint violated");
      }
    }
  poc_sketch: |
    function test_mm_dd_05_fee_underflow_impossible() public {
      // Fuzz across all fee values and totalAssets/lastTotalAssets combinations
      // Verify newTotalAssets - feeAssets never underflows
      uint256 fee = bound(fee, 0, 0.5e18);
      uint256 ta = bound(ta, 1, type(uint128).max);
      uint256 lta = bound(lta, 0, ta);
      uint256 totalInterest = ta - lta;
      uint256 feeAssets = totalInterest * fee / 1e18;
      assertGe(ta, feeAssets, "underflow in newTotalAssets - feeAssets");
    }
  call_stack: |
    _accruedFeeShares() L894-906
    L897: totalInterest = newTotalAssets.zeroFloorSub(lastTotalAssets)
    L900: feeAssets = totalInterest.mulDiv(fee, WAD)
    L904: _convertToSharesWithTotals(feeAssets, totalSupply(), newTotalAssets - feeAssets, Floor)
  ghost_vars: []
  validated: true
  priority: low
  notes: |
    Provably safe. MAX_FEE = 50% ensures feeAssets <= totalInterest/2 <= newTotalAssets/2.
    Including as a formal verification target for Halmos. The invariant confirms the
    safety bound holds for all reachable states.

notes: |
  DeepDiveHunter analysis of MetaMorpho produced 5 hypotheses, ranked by novelty:

  1. MM-DD-02 (NOVEL, Medium): Market re-enable after forced removal causes fee avoidance
     due to lastTotalAssets inflation at _setCap L753. The interest earned on phantom assets
     during the removal period is never captured by fee accrual. Protocol loses fee revenue.
     This is a genuine cross-function state interaction bug that no single hunter caught.

  2. MM-DD-04 (CONVERGENCE, Medium): Full behavior matrix during IRM failure vault freeze.
     Deepens MM-O-01 + MM-DOS-01 with the key insight about allocator capabilities during
     freeze, minimum recovery time (timelock), and ERC4626 integration implications.

  3. MM-DD-01 (NOVEL, Info): Cumulative lastTotalAssets drift from stale snapshots in
     withdraw/deposit. Acknowledged in code comments. Dust-level impact but validates the
     design assumption that drift is bounded per-operation.

  4. MM-DD-03 (VALIDATED): Reallocate conservation is robust. The assets==0 path with
     type(uint256).max sentinel correctly balances. Good invariant for fuzzing harness.

  5. MM-DD-05 (VALIDATED): Fee arithmetic at L904 is provably safe due to MAX_FEE cap.
     Good target for Halmos formal verification.

  Overall assessment: MetaMorpho is well-designed with few exploitable vulnerabilities.
  The strongest finding is MM-DD-02 (fee avoidance via market removal/re-enable), which
  is a genuine protocol revenue loss but does not harm depositors. MM-DD-04 (vault freeze)
  is the highest-impact finding but depends on external IRM behavior.
