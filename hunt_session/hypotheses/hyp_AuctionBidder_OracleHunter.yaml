hunter: OracleHunter
component: AuctionBidder
date: "2026-03-22"
summary: >
  AuctionBidder does not interact with any oracle directly. All pricing is delegated to
  BaseAuction via getAssetOutAmount() and the internal bid() computation. The contract's
  oracle surface is limited to (a) the approval amount in the no-solution path and
  (b) whatever arbitrary calls the AUCTION_BIDDER_ROLE holder includes in the solution.
  No high-confidence oracle-related findings. Low/Informational observations below.

invariants:
  - id: AB-O-01
    title: "Dutch auction price decrease allows validator/MEV timing advantage"
    description: >
      In a Dutch auction, the price (assetOut required per unit of assetIn) decreases linearly
      from startingPriceMultiplier to endingPriceMultiplier over auctionDuration. A block
      producer who also holds AUCTION_BIDDER_ROLE could delay including their own bid()
      transaction to a later block, paying less assetOut for the same assetIn amount.
      However, this is mitigated by: (1) AUCTION_BIDDER_ROLE is access-controlled and
      presumably held by trusted Chainlink solvers, not arbitrary validators; (2) Dutch
      auction price decay is the intended mechanism -- bidders are SUPPOSED to wait for
      their target price; (3) minPriceMultiplier bounds the maximum discount.
      This is BY DESIGN for a Dutch auction. Not a vulnerability.
    confidence: 10
    severity: "Informational"
    status: "by_design"
    attack_scenario: >
      Validator with AUCTION_BIDDER_ROLE delays bid tx from block N to block N+K.
      Price drops from e.g. 1.10x to 1.05x. Bidder pays ~4.5% less assetOut.
      But the role is access-gated to trusted solvers, and the price floor
      (endingPriceMultiplier >= minPriceMultiplier) limits maximum discount.
    code_location: "AuctionBidder.sol:L65-L81, BaseAuction.sol:L793-L795"

  - id: AB-O-02
    title: "No-solution path approval uses view-mode price (withValidation=false)"
    description: >
      When solution.length == 0 (no-solution path, L78), AuctionBidder calls
      s_auction.getAssetOutAmount(assetIn, amount, block.timestamp) to compute the
      approval amount. This view function calls _getAssetPrice with withValidation=false
      (BaseAuction L764, L766->L798). The subsequent auction.bid() call computes the
      actual assetOutAmount using _getAssetPrice with withValidation=true (BaseAuction L429).

      If the price returned by both calls is identical (same block, same state), the
      approval matches the transfer exactly. In the same transaction, no state changes
      occur between L78 and L81, so prices are guaranteed identical.

      Edge case: if Data Streams price is stale and there's no fallback data feed,
      getAssetOutAmount (view) would use stale price and return a value, but bid()
      would revert with StaleFeedData. The tx reverts entirely -- no fund loss.

      If Data Streams price is stale BUT a data feed fallback exists, both paths
      fetch the same fallback price. No mismatch.

      CONCLUSION: No approval mismatch possible within a single transaction. Safe.
    confidence: 5
    severity: "Informational"
    status: "not_vulnerable"
    attack_scenario: >
      No attack possible. Both getAssetOutAmount (view) and bid() execute within
      the same transaction using the same block.timestamp and same oracle state.
      If prices are stale, bid() reverts and the entire tx reverts. No partial
      execution, no leftover approvals that could be exploited.
    code_location: "AuctionBidder.sol:L78, BaseAuction.sol:L749-L767 vs L410-L458"

  - id: AB-O-03
    title: "Arbitrary _multiCall in auctionCallback could include oracle manipulation"
    description: >
      When solution.length > 0, the AuctionBidder receives a callback (auctionCallback, L97)
      which decodes and executes arbitrary Call[] via _multiCall. This happens AFTER
      BaseAuction has already transferred assetIn to msg.sender (BaseAuction L444) and
      BEFORE BaseAuction pulls assetOut (BaseAuction L453). The assetOutAmount is already
      fixed at this point (computed at BaseAuction L442).

      The arbitrary calls COULD include oracle manipulation (e.g., manipulating a DEX
      pool price) to obtain assetOut tokens more cheaply via a DEX swap. But:
      (1) The auction price is already locked -- manipulating an oracle doesn't change
          what the auction charges.
      (2) The _multiCall is the solver's own execution environment -- they're sourcing
          liquidity. Oracle manipulation here would only affect the solver's own swap,
          which is the solver's business (they'd be manipulating against themselves or
          third-party LPs, not against the auction protocol).
      (3) Access is gated by AUCTION_BIDDER_ROLE.

      This is the intended solver/intent pattern. Not a vulnerability in AuctionBidder.
    confidence: 10
    severity: "Informational"
    status: "by_design"
    attack_scenario: >
      Solver includes a DEX price manipulation call in the solution to get cheap tokens
      for the auction payment. The auction protocol itself is unaffected -- it already
      computed and locked the assetOutAmount before the callback. The manipulation
      only affects third-party LP providers on the DEX, not the Chainlink auction.
    code_location: "AuctionBidder.sol:L97-L112, Caller.sol:L49-L63"

  - id: AB-O-04
    title: "getAssetOutAmount returns 0 on stale/invalid auction — approval set to 0"
    description: >
      In the no-solution path (L78), if getAssetOutAmount returns 0 (auction expired,
      not started, or stale price), forceApprove sets approval to 0. The subsequent
      auction.bid() call would revert anyway (InvalidAuction or StaleFeedData), so
      the entire transaction reverts. No state change persists.

      However, if a previous successful bid left a non-zero approval on the auction
      contract, this failed tx doesn't clear it. The leftover approval from a previous
      bid is irrelevant because forceApprove in the next successful bid would overwrite
      it, and BaseAuction uses safeTransferFrom (pulling exactly assetOutAmount).

      No vulnerability.
    confidence: 5
    severity: "Informational"
    status: "not_vulnerable"
    attack_scenario: "N/A — transaction reverts entirely."
    code_location: "AuctionBidder.sol:L78, BaseAuction.sol:L757-L759"

conclusion: >
  AuctionBidder has no oracle-related vulnerabilities. It delegates all pricing to
  BaseAuction, which uses Chainlink Data Streams with data feed fallback. The no-solution
  approval path is safe because view and bid computations execute in the same tx with
  identical state. The solution path (arbitrary _multiCall) is the intended solver pattern
  with proper access control. Dutch auction price decay and MEV timing are inherent to
  the auction design and bounded by minPriceMultiplier.

  No findings warrant further investigation from the OracleHunter perspective.
  Recommend DomainHunter and AccessHunter review the _multiCall surface and role
  management respectively.
