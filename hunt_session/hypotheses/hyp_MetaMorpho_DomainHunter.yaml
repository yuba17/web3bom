# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-01: Supply cap enforcement — reallocate cannot exceed market cap
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-01
  tier: 1
  type: property
  description: >
    En reallocate() (L368), al suministrar a un market, el código verifica
    `supplyAssets + suppliedAssets > supplyCap` (L404). `supplyAssets` se obtiene
    de `_accruedSupplyBalance` que llama MORPHO.accrueInterest y lee estado fresh.
    El cap check usa estado actualizado — correcto.
    El invariante real: después de cualquier llamada a reallocate, deposit, o
    _supplyMorpho, ningún market debe tener el supply del vault por encima de su
    cap configurado. Esto debe mantenerse incluso bajo actividad concurrent de
    deposit/withdraw, ya que _supplyMorpho (L787) hace su propio cap check
    independiente usando estado fresh.
  attack_scenario: >
    Allocator ejecuta reallocate que empuja market X justo al cap.
    Simultáneamente, un depositor deposita y _supplyMorpho también suministra a X.
    Pero _supplyMorpho hace su PROPIO cap check (L787) con estado fresh incluyendo
    lo de reallocate. Así que el segundo supply vería la posición actualizada y
    respetaría el cap. Este invariante confirma que el cap nunca se excede.
  impact: >
    Si se viola, el vault sobre-asignaría a un market riesgoso, exponiendo a
    depositantes a más riesgo crediticio del que el curator pretendía.
  impact_rating: High
  likelihood: Low
  severity_final: Medium
  solidity: |
    function property_mm_dom_01() public returns (bool) {
      uint256 wqLen = vault.withdrawQueueLength();
      for (uint256 i = 0; i < wqLen; i++) {
        Id id = vault.withdrawQueue(i);
        (uint184 cap, bool enabled,) = vault.config(id);
        if (cap == 0) continue;
        uint256 supplyShares = morpho.supplyShares(id, address(vault));
        (uint256 totalSupplyAssets, uint256 totalSupplyShares,,) = morpho.expectedMarketBalances(morpho.idToMarketParams(id));
        uint256 supplyAssets = supplyShares * (totalSupplyAssets + 1) / (totalSupplyShares + 1);
        t(supplyAssets <= uint256(cap) + 1, "MM-DOM-01: vault supply exceeds market cap");
      }
      return true;
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    La tolerancia de +1 es por rounding en la conversión share→asset.
    El interest accrual entre cap check y supply real podría empujar
    levemente por encima del cap, pero el protocolo acepta esto como dust.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-02: Reallocate conservation — totalWithdrawn == totalSupplied
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-02
  tier: 1
  type: property
  description: >
    reallocate() (L368-L417) enforcea totalWithdrawn == totalSupplied en L416.
    Invariante de conservación core — el vault no debe ganar ni perder assets via
    reallocación. Cuando allocation.assets == 0 (L383), el código usa todos los
    supplyShares para withdraw. El withdrawnAssets real (retornado por Morpho.withdraw)
    puede diferir del supplyAssets calculado por rounding. El acumulador usa los
    valores retornados reales, no los esperados. La check en L416 es exacta.
  attack_scenario: >
    Atacante intenta craftar una secuencia de reallocate donde diferencias de
    rounding entre withdraw y supply se acumulan. Como la check es sobre montos
    retornados reales, no esperados, el revert en L416 atraparía cualquier
    discrepancia. Solo se podría bypassear si Morpho.withdraw/supply retornan
    valores incorrectos.
  impact: >
    Si se viola, assets del vault se fugan durante reallocation. Depositors
    pierden fondos pro-rata con cada reallocación.
  impact_rating: Critical
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_02() public returns (bool) {
      uint256 totalBefore = ghost_totalAssets_before_reallocate;
      uint256 totalAfter = ghost_totalAssets_after_reallocate;
      if (totalBefore == 0) return true;
      uint256 tolerance = ghost_markets_touched_in_reallocate;
      t(totalAfter >= totalBefore - tolerance && totalAfter <= totalBefore + tolerance,
        "MM-DOM-02: reallocate changed totalAssets beyond tolerance");
      return true;
    }
  ghost_vars:
    - ghost_totalAssets_before_reallocate
    - ghost_totalAssets_after_reallocate
    - ghost_markets_touched_in_reallocate
  validated: false
  priority: critical
  confidence: 85
  notes: >
    La check on-chain es estricta (igualdad exacta). El invariante de fuzzing
    usa tolerancia porque totalAssets() re-lee desde Morpho que puede incluir
    micro interest accrual entre las dos lecturas.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-03: Withdraw queue completeness — todos los enabled markets en withdrawQueue
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-03
  tier: 1
  type: property
  description: >
    Todo market con config[id].enabled == true DEBE estar en el withdrawQueue.
    Esto es crítico porque totalAssets() (L585-L589) itera SOLO sobre withdrawQueue.
    Si un market enabled con supply no-zero no está en el queue, totalAssets()
    sub-contaría, deflacionando el share price. Mantenido por: (1) _setCap añade
    al queue al habilitar (L746), (2) updateWithdrawQueue solo remueve markets
    que deshabilita (L358 delete config[id]).
  attack_scenario: >
    Si un market pudiera estar enabled pero no en withdrawQueue, deposits a ese
    market via reallocate incrementarían assets reales sin incrementar totalAssets().
    Un depositor subsecuente obtendría shares a tasa inflada, diluyendo existentes.
    El atacante deposita, luego el market se añade al queue (arreglando totalAssets),
    y el atacante redime al rate verdadero (más alto).
  impact: >
    Manipulación de share price. Depositors existentes diluidos si totalAssets
    sub-cuenta. Nuevos depositors sobrepagan si totalAssets sobre-cuenta.
  impact_rating: Critical
  likelihood: Low
  severity_final: High
  solidity: |
    function property_mm_dom_03() public returns (bool) {
      uint256 wqLen = vault.withdrawQueueLength();
      for (uint256 i = 0; i < wqLen; i++) {
        Id id = vault.withdrawQueue(i);
        (, bool enabled,) = vault.config(id);
        t(enabled, "MM-DOM-03: market in withdrawQueue but not enabled");
      }
      for (uint256 i = 0; i < ghost_known_market_ids.length; i++) {
        Id id = ghost_known_market_ids[i];
        (, bool enabled,) = vault.config(id);
        if (!enabled) continue;
        bool found = false;
        for (uint256 j = 0; j < wqLen; j++) {
          if (Id.unwrap(vault.withdrawQueue(j)) == Id.unwrap(id)) {
            found = true;
            break;
          }
        }
        t(found, "MM-DOM-03: enabled market not in withdrawQueue");
      }
      return true;
    }
  ghost_vars:
    - ghost_known_market_ids
  validated: false
  priority: critical
  confidence: 90
  notes: >
    Invariante estructural fundamental. El código lo mantiene via pairing
    cuidadoso de _setCap (añade al queue + habilita) y updateWithdrawQueue
    (remueve del queue + borra config). Cualquier code path que rompa este
    pairing sería un bug crítico.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-04: Supply queue — deposits nunca fluyen a market con cap == 0
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-04
  tier: 1
  type: property
  description: >
    setSupplyQueue() (L310) valida cap != 0 para cada entry (L316). Sin embargo,
    DESPUÉS de setear el queue, el cap puede reducirse a 0 via submitCap (reducción
    instantánea, L284-285). Esto deja un market con cap == 0 en el supply queue.
    En _supplyMorpho (L776), el `if (supplyCap == 0) continue` maneja esto
    correctamente — el market se salta.
    El invariante funcional que importa: deposits NUNCA fluyen a un market con cap == 0.
  attack_scenario: >
    Curator setea supply queue con market X (cap = 100). Luego reduce cap de X a 0.
    Supply queue ahora tiene X con cap 0. Depositor deposita. _supplyMorpho salta X.
    No hay fondos a market no autorizado. Si el check faltara, los fondos irían a un
    market que el curator explícitamente deshabilitó.
  impact: >
    Si _supplyMorpho no re-verificara cap, fondos se asignarían a un market que el
    curator zeroed out, violando la gestión de riesgo del curator.
  impact_rating: High
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_04() public returns (bool) {
      uint256 sqLen = vault.supplyQueueLength();
      for (uint256 i = 0; i < sqLen; i++) {
        Id id = vault.supplyQueue(i);
        (uint184 cap,,) = vault.config(id);
        if (cap == 0) {
          uint256 currentShares = morpho.supplyShares(id, address(vault));
          t(currentShares <= ghost_supply_shares_snapshot[Id.unwrap(id)],
            "MM-DOM-04: supply increased to zero-cap market");
        }
      }
      return true;
    }
  ghost_vars:
    - ghost_supply_shares_snapshot
  validated: false
  priority: high
  confidence: 80
  notes: >
    El invariante estructural (supply queue entries tienen cap > 0) se viola
    transitoriamente por diseño. El invariante funcional (no deposits a cap-0
    markets) es lo que realmente importa.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-05: Market lifecycle — removal requiere zero cap AND no pending cap
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-05
  tier: 1
  type: property
  description: >
    submitMarketRemoval() (L294) requiere: (1) removableAt == 0, (2) cap == 0,
    (3) enabled == true, (4) pendingCap[id].validAt == 0. Esto previene remover
    un market que podría re-habilitarse via pending cap. _setCap (L758) setea
    removableAt = 0 cuando cap > 0 — re-habilitar cancela removal.
    submitCap (L280) revierte si removableAt != 0 — no se puede submitir cap
    nuevo mientras removal está pending. Lifecycle bien protegido.
  attack_scenario: >
    Race condition: curator submite cap = 0 (instantáneo), luego market removal.
    Otro curator submite nuevo cap > 0 — pero submitCap chequea removableAt != 0
    y revierte (L280: PendingRemoval). Bien guardado.
  impact: >
    Si un market pudiera force-removerse con cap activo y supply, depositantes
    perderían acceso a esos fondos permanentemente.
  impact_rating: Critical
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_05() public returns (bool) {
      uint256 wqLen = vault.withdrawQueueLength();
      for (uint256 i = 0; i < wqLen; i++) {
        Id id = vault.withdrawQueue(i);
        (uint184 cap, bool enabled, uint64 removableAt) = vault.config(id);
        if (removableAt != 0) {
          t(cap == 0, "MM-DOM-05: market pending removal has non-zero cap");
          (uint192 pendingCapValue, uint64 pendingCapValidAt) = vault.pendingCap(id);
          t(pendingCapValidAt == 0, "MM-DOM-05: market pending removal has pending cap");
          t(enabled, "MM-DOM-05: market pending removal is not enabled");
        }
      }
      return true;
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 90
  notes: >
    Los guards del lifecycle están bien diseñados. submitCap chequea removableAt,
    submitMarketRemoval chequea cap y pendingCap. _setCap limpia removableAt.
    Este invariante valida toda la state machine del lifecycle.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-06: Pending values — solo un pending value por slot a la vez
# ═══════════════════════════════════════════════════════════════════════════
