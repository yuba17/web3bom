# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-13: Skim no puede drenar posiciones de Morpho del vault
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-13
  tier: 2
  type: property
  description: >
    skim() (L483) transfiere todo el balance del vault de cualquier token al
    skimRecipient. Los assets reales del vault están en Morpho Blue (via supply
    positions), no en el balance del contrato vault. Skim solo debería transferir
    tokens "stray" que terminaron en el vault. El vault approves Morpho por max
    uint256 (L135). Si el asset token tiene transfer hook que llama skim()...
    el flujo de _deposit es: super._deposit → transferFrom → _supplyMorpho →
    MORPHO.supply. Si transferFrom tiene hook que llama skim, el balance se
    enviaría a skimRecipient, y MORPHO.supply fallaría por balance insuficiente.
    La tx revierte — seguro.
  attack_scenario: >
    Atacante envía 1 wei de asset al vault, llama skim(asset). skimRecipient
    obtiene 1 wei. Sin daño — las posiciones de Morpho son seguras.
  impact: >
    skim() solo drena tokens en el contrato vault. Posiciones de Morpho son seguras.
  impact_rating: Low
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dom_13() public returns (bool) {
      if (!ghost_skim_called) return true;
      t(ghost_totalAssets_before_skim == ghost_totalAssets_after_skim,
        "MM-DOM-13: skim changed totalAssets");
      return true;
    }
  ghost_vars:
    - ghost_skim_called
    - ghost_totalAssets_before_skim
    - ghost_totalAssets_after_skim
  validated: false
  priority: medium
  confidence: 90
  notes: >
    Skim está diseñado intencionalmente para sweep tokens stray. El invariante
    confirma que nunca toca posiciones de Morpho.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-14: _supplyMorpho try/catch — skip silencioso de markets fallidos
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-14
  tier: 2
  type: property
  description: >
    _supplyMorpho (L771-L800) usa try/catch con MORPHO.supply (L791).
    Si supply revierte, el market se salta silenciosamente. Mismo patrón en
    _withdrawMorpho (L815). El try/catch traga TODOS los reverts.
    Si el catch se trigger durante deposit, los assets del depositor podrían
    ir todos a un solo market en vez de distribuirse. Concentra riesgo pero
    el depositor obtiene shares al rate correcto.
    CLAVE: si NINGÚN market acepta supply, la función revierte con AllCapsReached.
    Los assets deposited se retornan al caller via revert.
  attack_scenario: >
    Atacante manipula un Morpho market para que revierte en supply (via oracle
    manipulation que hace fallar el oracle call del market). El vault silenciosamente
    salta ese market y suministra al siguiente. Si el "siguiente" tiene mayor
    riesgo, el depositor unknowingly obtiene más risk exposure.
  impact: >
    Concentración de riesgo en deposit flow. No pérdida directa de fondos pero
    exposición a mayor riesgo crediticio.
  impact_rating: Low
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dom_14() public returns (bool) {
      if (ghost_last_deposit_amount == 0) return true;
      t(ghost_totalAssets_after_deposit + 2 >= ghost_totalAssets_before_deposit + ghost_last_deposit_amount,
        "MM-DOM-14: deposited assets not fully accounted in totalAssets");
      return true;
    }
  ghost_vars:
    - ghost_last_deposit_amount
    - ghost_totalAssets_before_deposit
    - ghost_totalAssets_after_deposit
  validated: false
  priority: medium
  confidence: 75
  notes: >
    La tolerancia de +2 es por rounding en supply de Morpho.
    Un supply fallido significaría assets quedando en el contrato vault (no en
    totalAssets) que sería capturado por este invariante.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-15: Queue length bounds — max 30 markets
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-15
  tier: 2
  type: property
  description: >
    MAX_QUEUE_LENGTH = 30. Enforceado en setSupplyQueue (L313) y _setCap (L748).
    Medida de seguridad de gas — totalAssets(), _supplyMorpho, _withdrawMorpho
    iteran sobre las queues. Con 30 markets, el costo de gas es bounded.
  attack_scenario: >
    Si queue length fuera unbounded, un curator podría añadir cientos de markets,
    haciendo que deposit/withdraw/totalAssets excedan el gas limit del bloque.
    DoS efectivo del vault. Con el cap de 30 markets, gas es bounded.
  impact: >
    Prevención de DoS. Si se viola, operaciones del vault podrían ser muy costosas.
  impact_rating: Medium
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_15() public returns (bool) {
      t(vault.supplyQueueLength() <= 30, "MM-DOM-15: supplyQueue exceeds MAX_QUEUE_LENGTH");
      t(vault.withdrawQueueLength() <= 30, "MM-DOM-15: withdrawQueue exceeds MAX_QUEUE_LENGTH");
      return true;
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 99
  notes: >
    Check de bound directo. Enforceado en setSupplyQueue y _setCap. Confianza
    extremadamente alta.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-16: Pending cap increase — cap decrease es instantáneo, increase es pending
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-16
  tier: 1
  type: property
  description: >
    submitCap (L274-L291): si newSupplyCap < supplyCap (decrease), se aplica
    instantáneamente via _setCap (L285). Si newSupplyCap > supplyCap (increase),
    va a pending (L287). Mirrors el patrón de timelock — decrementar caps es
    seguro (reduce riesgo), incrementar es peligroso (más exposición).
    Invariante: si pendingCap[id].validAt != 0, su value DEBE ser > current cap.
  attack_scenario: >
    Si cap increases fueran instantáneos, un curator malicioso podría habilitar
    instantáneamente un market riesgoso con cap enorme. El siguiente deposit
    fluiría allí. Con pending, depositors/guardian tienen tiempo de reaccionar.
  impact: >
    Si cap increase fuera instantáneo sin timelock, depositors no tendrían tiempo
    de salir antes de exposición a un market riesgoso nuevo.
  impact_rating: High
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_16() public returns (bool) {
      for (uint256 i = 0; i < ghost_known_market_ids.length; i++) {
        Id id = ghost_known_market_ids[i];
        (uint192 pcValue, uint64 pcValidAt) = vault.pendingCap(id);
        if (pcValidAt != 0) {
          (uint184 currentCap,,) = vault.config(id);
          t(uint256(pcValue) > uint256(currentCap),
            "MM-DOM-16: pending cap is not an increase");
        }
      }
      return true;
    }
  ghost_vars:
    - ghost_known_market_ids
  validated: false
  priority: high
  confidence: 95
  notes: >
    Claro del if/else en L284-L290. Cap decrease → _setCap instantáneo.
    Cap increase → pending. Muy alta confianza.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-17: Share price monotonicity — deposit/mint NO decrementan share price
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-17
  tier: 1
  type: property
  description: >
    deposit() y mint() NO deben decrementar el share price para holders existentes.
    El share price conceptual = totalAssets / totalSupply. Después de un deposit,
    totalAssets sube por deposited amount, totalSupply sube por minted shares.
    Si las shares se mintean al rate correcto, el price no cambia (o sube levemente
    por rounding en favor del vault).
    _accrueFee() mintea feeShares ANTES del cálculo de shares del depositor.
    Si el rounding de feeShares es off, el nuevo totalSupply podría ser inconsistente
    con newTotalAssets, causando dilución.
  attack_scenario: >
    Si deposit() disminuye share price, un atacante puede hacer deposits repetidos
    para diluir a holders existentes. Relevante con fee accrual timing.
  impact: >
    Dilución gradual de shareholders existentes vía rounding en fee accrual.
  impact_rating: Medium
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dom_17() public returns (bool) {
      uint256 totalAssetsBefore = ghost_totalAssets_before_deposit;
      uint256 totalSupplyBefore = ghost_totalSupply_before_deposit;
      uint256 totalAssetsAfter = ghost_totalAssets_after_deposit;
      uint256 totalSupplyAfter = ghost_totalSupply_after_deposit;
      if (totalSupplyBefore > 0 && totalSupplyAfter > 0) {
        t(totalAssetsAfter * totalSupplyBefore + 1 >= totalAssetsBefore * totalSupplyAfter,
          "MM-DOM-17: share price decreased after deposit");
      }
      return true;
    }
  ghost_vars:
    - ghost_totalAssets_before_deposit
    - ghost_totalSupply_before_deposit
    - ghost_totalAssets_after_deposit
    - ghost_totalSupply_after_deposit
  validated: false
  priority: high
  confidence: 70
  notes: >
    La fee accrual en deposit() mintea feeShares, luego calcula depositor
    shares con totalSupply() post-mint. El +1 tolerance es por rounding.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-18: Market removal con non-zero supply — impacto en share price
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-18
  tier: 1
  type: property
  description: >
    updateWithdrawQueue (L325) puede force-remover un market con supply no-zero SI
    config[id].removableAt != 0 AND block.timestamp >= removableAt (L351-L355).
    Cuando pasa, los supply assets del market ya no cuentan en totalAssets().
    Esto INSTANTÁNEAMENTE reduce el share price para todos los depositors.
    Los supply shares del vault en Morpho Blue NO se retiran — permanecen allocated.
    Los fondos se pueden recuperar re-habilitando el market (submitCap con cap > 0).
    INVARIANTE: totalAssets() debe igualar la suma de supply positions SOLO para
    markets en el withdrawQueue.
  attack_scenario: >
    Curator/allocator malicioso submite removal para market con supply significativo,
    espera timelock, ejecuta updateWithdrawQueue. Share price baja. Atacante deposita
    al precio bajo, luego re-habilita el market, share price se recupera, atacante
    redime con profit. Requiere curator role y timelock patience. Guardian puede
    revocar durante el timelock.
  impact: >
    Caída instantánea de share price para todos los depositors. Potencialmente
    gran pérdida si el market removido tenía supply significativo.
  impact_rating: High
  likelihood: Low
  severity_final: Medium
  solidity: |
    function property_mm_dom_18() public returns (bool) {
      if (!ghost_market_removed_with_supply) return true;
      uint256 ta = vault.totalAssets();
      t(ta < ghost_totalAssets_before_removal,
        "MM-DOM-18: totalAssets did not decrease after removing market with supply");
      uint256 diff = ghost_totalAssets_before_removal - ta;
      t(diff <= ghost_removed_supply_amount + 1e6,
        "MM-DOM-18: totalAssets dropped more than removed supply");
      return true;
    }
  ghost_vars:
    - ghost_market_removed_with_supply
    - ghost_totalAssets_before_removal
    - ghost_removed_supply_amount
  validated: false
  priority: high
  confidence: 80
  notes: >
    Documentado como comportamiento intencional de emergencia. El invariante
    confirma que el impacto en accounting coincide con lo esperado.

