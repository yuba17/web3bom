# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-07: Fee accrual — lastTotalAssets trackea totalAssets correctamente
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-07
  tier: 1
  type: property
  description: >
    lastTotalAssets se actualiza en: _deposit (L676), withdraw/redeem (L565/L579),
    setFee (L237), setFeeRecipient (L251), _setCap (L753 para markets nuevos).
    Entre updates, lastTotalAssets puede divergir de totalAssets() por interest accrual.
    La fee se computa como totalInterest = totalAssets().zeroFloorSub(lastTotalAssets).
    Si lastTotalAssets > totalAssets() (bad debt o market removal), totalInterest = 0.
    CLAVE: si un market se remueve del withdrawQueue con supply, totalAssets() baja
    pero lastTotalAssets NO se actualiza. Esto suprime fee accrual hasta que el
    interest cierre el gap. Documentado como intencional (IMetaMorpho.sol L73-76).
  attack_scenario: >
    Curator malicioso force-remueve market con supply pequeño. lastTotalAssets >
    totalAssets(). No se accrúan fees hasta que el interest cubra el gap.
    Fee recipient pierde income. Depositors no son perjudicados directamente.
  impact: >
    Fee recipient pierde income temporalmente. Documentado como intencional.
  impact_rating: Low
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dom_07() public returns (bool) {
      uint256 lta = vault.lastTotalAssets();
      uint256 ta = vault.totalAssets();
      if (lta > ta) {
        t(lta - ta <= ghost_removed_market_value + 1e18,
          "MM-DOM-07: lastTotalAssets exceeds totalAssets by too much");
      }
      return true;
    }
  ghost_vars:
    - ghost_removed_market_value
  validated: false
  priority: medium
  confidence: 70
  notes: >
    La tolerancia de 1e18 es generosa. En práctica el gap debería ser
    exactamente el supply del market removido. El comportamiento documentado
    significa que esto es informacional.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-08: ERC4626 — deposit/mint roundtrip no debe crear shares gratis
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-08
  tier: 1
  type: property
  description: >
    ERC4626 compliance requiere que deposit(assets) retorne shares tales que
    redeem(shares) <= assets (sin profit por roundtrip). MetaMorpho usa
    DECIMALS_OFFSET = max(0, 18 - decimals) para virtual shares.
    Conversión: shares = assets * (totalSupply + 10^offset) / (totalAssets + 1).
    Por double-flooring, el depositor debería recibir <= assets depositados.
    EDGE CASE: con tokens de 18 decimales, DECIMALS_OFFSET = 0, la protección
    es mínima (virtual share = 1). Un deposit de 1 wei podría dar 0 shares.
  attack_scenario: >
    Atacante deposita 1 wei. Obtiene 0 shares si totalSupply es suficientemente
    grande. Assets donados a shareholders existentes. MetaMorpho mitiga con
    DECIMALS_OFFSET haciendo que 1 wei siempre produzca al menos 1 share
    para tokens con <= 18 decimales.
  impact: >
    Si shares se pueden mintear gratis o assets extraerse via rounding, es
    pérdida directa para depositors.
  impact_rating: Medium
  likelihood: Low
  severity_final: Low
  solidity: |
    function property_mm_dom_08() public returns (bool) {
      if (ghost_roundtrip_deposited == 0) return true;
      t(ghost_roundtrip_redeemed <= ghost_roundtrip_deposited,
        "MM-DOM-08: deposit-redeem roundtrip was profitable");
      return true;
    }
  ghost_vars:
    - ghost_roundtrip_deposited
    - ghost_roundtrip_redeemed
  validated: false
  priority: high
  confidence: 80
  notes: >
    Debe testearse con secuencias reales de deposit+redeem en fuzzing.
    Los ghost variables deben setearse en el handler.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-09: Withdraw queue — sin duplicados después de updateWithdrawQueue
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-09
  tier: 1
  type: property
  description: >
    updateWithdrawQueue (L325) usa bitmap `seen` para prevenir duplicados.
    Si seen[prevIndex] es true, revierte con DuplicateMarket. Crítico porque
    totalAssets() DOBLE-CONTARÍA el supply de un market si aparece dos veces,
    inflando el share price. Supply queue (L310) SÍ permite duplicados
    (solo aumenta costo de gas).
    _setCap (L746) pushea al withdrawQueue al habilitar. El guard
    `if (!marketConfig.enabled)` en L745 previene push doble.
  attack_scenario: >
    Si withdrawQueue contuviera duplicados, totalAssets() sobre-contaría.
    Depositors existentes se beneficiarían (shares valen más). Nuevos depositors
    overpagan. Atacante deposita cuando totalAssets está inflado, obtiene menos
    shares, y cuando se corrige pierde. O bien: atacante es depositor existente,
    manipula queue para inflar, retira a precio inflado.
  impact: >
    Double-counting en totalAssets lleva a pricing incorrecto de shares.
  impact_rating: Critical
  likelihood: None
  severity_final: null
  solidity: |
    function property_mm_dom_09() public returns (bool) {
      uint256 wqLen = vault.withdrawQueueLength();
      for (uint256 i = 0; i < wqLen; i++) {
        Id id_i = vault.withdrawQueue(i);
        for (uint256 j = i + 1; j < wqLen; j++) {
          Id id_j = vault.withdrawQueue(j);
          t(Id.unwrap(id_i) != Id.unwrap(id_j),
            "MM-DOM-09: duplicate market in withdrawQueue");
        }
      }
      return true;
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 95
  notes: >
    El código previene esto via bitmap `seen` y el guard `enabled` en _setCap.
    Este invariante es safety net — si se rompe, es bug crítico de accounting.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-10: Fee shares — fee <= 50% y feeShares diluyen correctamente
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-10
  tier: 1
  type: property
  description: >
    Fee capped a MAX_FEE = 0.5e18 (50%) en setFee (L233). Cálculo de fee shares
    en _accruedFeeShares (L892-906): feeAssets = totalInterest * fee / WAD.
    feeShares = convertToShares(feeAssets, totalSupply, newTotalAssets - feeAssets).
    El denominador usa newTotalAssets - feeAssets (NO newTotalAssets). Esto previene
    que la fee se diluya a sí misma. Correcto.
    VECTOR: si alguien puede manipular totalAssets() para ser muy grande temporalmente
    (via donación a markets de Morpho), el interest spike generaría una fee grande.
    Pero la donación beneficiaría a todos los depositors proporcionalmente, y la fee
    solo se cobra sobre el interest delta.
  attack_scenario: >
    Si el fee calculation usara newTotalAssets (sin restar feeAssets) en el
    denominador, el fee recipient obtendría menos shares de las que debería.
    El código actual resta correctamente feeAssets.
  impact: >
    Si fee shares se calculan incorrectamente, o fee recipient recibe demasiado
    (depositors diluidos) o muy poco (fee recipient underpaid).
  impact_rating: High
  likelihood: Low
  severity_final: Medium
  solidity: |
    function property_mm_dom_10() public returns (bool) {
      uint256 currentFee = vault.fee();
      t(currentFee <= 0.5e18, "MM-DOM-10: fee exceeds MAX_FEE");
      return true;
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    El cálculo de fee está bien diseñado. La resta de feeAssets del denominador
    es el approach estándar para fee minting dilutivo. El MAX_FEE check es directo.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-11: ERC4626 — totalAssets >= sum de todos los claims de depositors
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-11
  tier: 1
  type: property
  description: >
    Invariante de solvencia fundamental de ERC4626: totalAssets() debe ser
    suficiente para cubrir todas las conversiones share→asset. Específicamente:
    convertToAssets(totalSupply) <= totalAssets() + rounding_tolerance.
    En MetaMorpho, totalAssets() = sum de expectedSupplyAssets sobre withdrawQueue.
    Esto representa la posición REAL del vault en Morpho Blue, incluyendo interest.
    Si Morpho Blue experimenta bad debt, totalSupplyAssets podría decrecer, haciendo
    totalAssets() < lastTotalAssets. Manejado por zeroFloorSub (no negative interest).
  attack_scenario: >
    Bad debt en un Morpho market reduce totalAssets() del vault. Si un user redime
    antes de que el bad debt se realize, podría obtener más de su fair share.
    Sin embargo, _withdrawMorpho usa _accruedSupplyBalance que llama
    MORPHO.accrueInterest primero, asegurando que el bad debt se realice antes
    del withdrawal.
  impact: >
    Insolvencia — si totalAssets es manipulable, early redeemers roban de
    late redeemers. El estándar ERC4626 requiere totalAssets honesto.
  impact_rating: Critical
  likelihood: Low
  severity_final: High
  solidity: |
    function property_mm_dom_11() public returns (bool) {
      uint256 ta = vault.totalAssets();
      uint256 ts = vault.totalSupply();
      if (ts == 0) return true;
      uint256 allClaims = vault.convertToAssets(ts);
      t(allClaims <= ta + 1, "MM-DOM-11: total claims exceed totalAssets");
      return true;
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 90
  notes: >
    La tolerancia de +1 es por rounding en convertToAssets.
    convertToAssets(totalSupply) = totalSupply * (totalAssets + 1) / (totalSupply + offset).
    Para offset >> 0, esto es levemente menos que totalAssets.

# ═══════════════════════════════════════════════════════════════════════════
# MM-DOM-12: Timelock decrease es pending, increase es instantáneo
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-DOM-12
  tier: 1
  type: property
  description: >
    submitTimelock (L215-L228): si newTimelock > timelock, se setea INMEDIATAMENTE
    via _setTimelock (L221). Si newTimelock < timelock, va a pending (L224) con el
    timelock ACTUAL como delay. Seguridad: aumentar timelock es más seguro, instantáneo.
    Decrementar es menos seguro, requiere que pase el timelock actual primero.
    Invariante: si pendingTimelock.validAt != 0, su value DEBE ser < timelock actual.
  attack_scenario: >
