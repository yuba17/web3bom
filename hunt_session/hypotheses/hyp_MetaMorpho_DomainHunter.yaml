  tier: 1
  type: property
  description: >
    submitTimelock (L217) chequea pendingTimelock.validAt != 0 y revierte.
    submitGuardian (L261) chequea pendingGuardian.validAt != 0.
    submitCap (L279) chequea pendingCap[id].validAt != 0.
    Invariante: pending con validAt != 0 implica que los valores son válidos
    (dentro de bounds para timelock, no-zero para algunos).
    Si pendingTimelock.validAt != 0, su value debe ser < timelock actual
    (solo decreases son pending, increases son instantáneos L220-L227).
  attack_scenario: >
    Si dos pending values pudieran coexistir para el mismo slot, el segundo
    podría sobreescribir el validAt del primero, permitiendo aceptación más
    temprana. El código previene esto con el check de validAt != 0 antes de update.
  impact: >
    Si múltiples pending values coexistieran, las garantías del timelock se romperían.
  impact_rating: High
  likelihood: None
  severity_final: null
