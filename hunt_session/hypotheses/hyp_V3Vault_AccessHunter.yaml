      uint256 minLoan = vault.minLoanSize();
      // After any setLimits call, verify:
      // For each active loan, full repay path is still available
      // (This is guaranteed by code design - not a real invariant to fuzz)
    ghost_vars: []
    validated: false
    priority: medium
    confidence: 55
    notes: "Investigated: emergencyAdmin is intentionally powerful for emergency situations. Owner can override. The key insight is that full repayment always works because the minLoanSize check is skipped on full repay. Partial repay griefing is possible but temporary. This is within the trust model but worth noting the attack surface."

  - id: VV-AC-04
    tier: 1
    type: property
    description: "unstakePosition() at line 1396-1403 allows msg.sender == tokenOwner[tokenId] OR transformedTokenId == tokenId. The second condition means ANY caller can unstake a position during its transform, not just the transformer. If transform is in progress for tokenId X, any external caller can race to call unstakePosition(X) because transformedTokenId == X and there's no check that msg.sender is the transformer."
    attack_scenario: "Owner starts a transform on token 42 (transformedTokenId = 42). Before the transformer callback completes, an MEV bot or attacker calls unstakePosition(42). This succeeds because transformedTokenId == 42. The position gets unstaked unexpectedly. However: (1) _transform already calls _unstakeIfNeeded at line 539 BEFORE the transformer callback, so the position is already unstaked by the time the transformer runs. (2) The transformer callback is atomic within a single transaction (line 544), so no external call can interleave. CONCLUSION: This is not exploitable because transform is atomic."
    solidity: |
      // Invariant: unstakePosition can only be called by token owner or during transform
      address caller = msg.sender;
      uint256 tokenId = 42; // example
      bool isOwner = (vault.tokenOwner(tokenId) == caller);
      bool isInTransform = (vault.transformedTokenId() == tokenId);
      // If unstakePosition succeeds, one of these must be true
      t(isOwner || isInTransform, "VV-AC-04: unauthorized unstake");
    ghost_vars: []
    validated: false
    priority: medium
    confidence: 30
    notes: "Investigated and DISMISSED. The transform is atomic (single tx). _unstakeIfNeeded is called before the transformer callback. No external interleaving possible. The transformedTokenId == tokenId check in unstakePosition is there so the transformer itself (or code called by it) can unstake if needed during the callback. Not a bug."

  - id: VV-AC-05
    tier: 2
    type: property
    description: "onERC721Received owner override via calldata (lines 416-423). When a Uniswap V3 NFT is sent to the vault via safeTransferFrom, the 'data' parameter can override who becomes the vault-owner of the position. The comment says 'whoever can trigger safeTransferFrom for the NFT can also choose the callback payload'. But consider: an approved operator on the NFT manager can call safeTransferFrom on behalf of the actual NFT owner, setting data to encode their own address as vault-owner."
    attack_scenario: "Alice owns NFT #42 and has approved Bob as operator on the NFT position manager. Bob calls nonfungiblePositionManager.safeTransferFrom(alice, vault, 42, abi.encode(bob)). The vault's onERC721Received receives from=alice but data=abi.encode(bob). Since data.length != 0, owner is set to bob (line 422). Bob now controls the position in the vault. However: this is EXPLICITLY documented as accepted trust assumption (line 418-421). An NFT operator already has full control over the NFT. Granting vault ownership is consistent with that trust level."
    solidity: |
      // Invariant: position vault-owner should be either the NFT sender or the address in calldata
      // This is by design - just verify the encoding works correctly
      // No actual security invariant to test here
    ghost_vars: []
    validated: false
    priority: low
    confidence: 30
    notes: "Investigated and DISMISSED as by-design. The code comment at line 418-421 explicitly acknowledges this. An NFT operator already has equivalent power over the NFT. Setting vault ownership is a natural extension of that trust. The create() function (line 384) uses this mechanism intentionally."

  - id: VV-AC-06
