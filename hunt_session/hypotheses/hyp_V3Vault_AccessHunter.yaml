    validated: false
    priority: high
    confidence: 70
    notes: "INVESTIGATED: _cleanupLoan (line 1147 comment) explicitly says 'the position is kept in the contract, but can be removed with remove() method because loanShares are 0'. This is BY DESIGN. After token replacement, old tokenId stays in ownership with zero debt so user can call remove() to retrieve the (now empty) NFT if the vault still holds it. If the transformer burned it, remove() reverts at safeTransferFrom. The ownedTokens ghost entry inflates loanCount() but has no security impact. DISMISSED as by-design behavior."

