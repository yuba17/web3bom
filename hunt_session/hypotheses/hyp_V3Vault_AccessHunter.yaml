    description: "Token replacement in transform mode (onERC721Received lines 437-462) does not verify that the NEW tokenId's Uniswap position has compatible tokens (token0/token1) with the old position. The debt is copied from old to new, and _updateAndCheckCollateral is called on the new tokenId, which reads the new position's token0/token1. If the new position has different tokens with lower collateral factors, the collateral check may fail. If it has higher collateral factors, the borrower gains leverage. The check at line 461 validates this, but only in one direction (it checks the NEW position)."
    attack_scenario: "A transformer replaces a WETH/USDC position (high collateral factor) with a SHITCOIN/USDC position (zero or low collateral factor). The _updateAndCheckCollateral call at line 461 would subtract debt from WETH config and add to SHITCOIN config. If SHITCOIN has collateralFactorX32=0, the health check at transform end (line 579) would fail. So this is PROTECTED. Conversely, replacing with a higher-factor position is fine (more collateral). The real concern is whether the collateralValueLimit check could be bypassed - but the check runs on the NEW token's configs. DISMISSED: the existing checks handle this correctly."
    solidity: |
      // After token replacement during transform:
      // Verify collateral tracking is consistent
      // Old token's debt shares should be zero
      // New token's debt shares should equal what old token had
      uint256 oldTokenId = 42; // example
      uint256 newTokenId = 99; // example
      // After replacement:
      // eq(vault.loans(oldTokenId), 0, "VV-AC-07: old loan not cleaned");
      // eq(vault.loans(newTokenId), expectedDebt, "VV-AC-07: debt mismatch");
    ghost_vars: []
    validated: false
    priority: medium
    confidence: 40
    notes: "Investigated. The existing _updateAndCheckCollateral and health checks handle token replacement correctly. The collateralValueLimit is checked for the new tokens. The health check runs after transform completes. No gap found."

  - id: VV-AC-08
    tier: 1
    type: property
    description: "Multicall + ERC4626 interaction. V3Vault inherits Multicall, allowing batched calls. A user can batch deposit() + borrow() in a single multicall. The risk: can Multicall be used to bypass checks that depend on sequential state? For example: batch [borrow(tokenId, amount), repay(tokenId, amount, false)] where the borrow would normally fail the health check but the repay in the same multicall would fix it. Answer: NO, because each subcall in Multicall is a full external call with all checks. Borrow at line 631 checks health immediately (when not in transform mode). The Multicall doesn't create a 'deferred check' scenario."
    attack_scenario: "Attacker tries to use Multicall to batch: [borrow(tokenId, hugeAmount), repay(tokenId, hugeAmount, false)] hoping the borrow's health check is somehow deferred. But borrow() at line 631 immediately calls _requireLoanIsHealthy. The borrow would revert before repay executes. However, consider: what if the attacker uses Multicall to call [deposit(amount, attacker), borrow(tokenId, amount)] to deposit-then-borrow atomically? This is legitimate usage, not an attack. No bypass found."
    solidity: |
      // Invariant: Multicall cannot bypass any individual function's access control
      // Each sub-call in Multicall preserves msg.sender correctly (delegatecall)
      // This is guaranteed by OZ Multicall implementation
      // No fuzzable invariant needed - this is a code review conclusion
    ghost_vars: []
    validated: false
    priority: medium
    confidence: 35
    notes: "Investigated. OZ Multicall uses delegatecall, so msg.sender is preserved correctly across all subcalls. Each function's access control and state checks run independently. No batching bypass found. DISMISSED."

