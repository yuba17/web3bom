  - id: VV-AC-01
    tier: 2
    type: property
    description: "Transform approval auto-migration: when a transformer replaces tokenId with newTokenId, the approval for msg.sender is copied to the new token (line 553-556). However, other approved addresses for the OLD tokenId are NOT migrated. This means if owner approved both AddressA and AddressB for tokenId, and AddressA triggers a transform that replaces the token, AddressB loses approval on the new token silently. Not a direct fund loss but breaks user expectations."
    attack_scenario: "Owner approves both AutoCompound (A) and AutoRange (B) for token 42. AutoRange transforms token 42 into token 99. AutoRange's approval migrates to token 99, but AutoCompound's approval for token 42 is now pointing at a token that no longer has debt/ownership. AutoCompound cannot operate on token 99. Impact: operational griefing, not fund loss. Evaluated as tier 2 because it's likely by design (each transformer migrates its own approval)."
    solidity: |
      // After a transform that replaces tokenId:
      // Check that ONLY msg.sender's approval migrates, others are lost
      // This is an awareness check, not a hard fail
      // ghost_preTransformApprovals tracks all approvals before transform
      // Verify: if owner had approved addressX for oldTokenId,
      // and addressX != msg.sender, then addressX has NO approval for newTokenId
      // This is BY DESIGN but worth documenting
    ghost_vars: []
    validated: false
    priority: low
    confidence: 40
    notes: "Investigated: this is intentional. Only the calling transformer's approval migrates. Other approvals remain on the old (now dead) tokenId. Documented for awareness but not a bug."

  - id: VV-AC-02
    tier: 1
    type: property
    description: "Transform mode borrow() skips health check (line 630-632). A whitelisted transformer can borrow any amount against a position without the loan being checked for health, as long as the final health check at line 579 passes after the transform completes. The risk is if a transformer borrows, sends funds out, and then the post-transform health check passes because the transformer modified the position to appear healthy (e.g., added liquidity from borrowed funds)."
    attack_scenario: "A whitelisted transformer (trusted by owner/protocol) calls borrow() during transform for the full available balance. It then uses part of those funds to add liquidity back to the position, making it appear healthy at the post-transform check (line 579). The transformer effectively extracts vault funds while maintaining a seemingly healthy position. However, this requires a MALICIOUS transformer on the allowlist, which requires owner to add it. This is within the trust model: transformers are 'selected audited contracts'."
    solidity: |
      // Invariant: during transform mode, total borrowed <= what position can support
      // This checks post-transform, which is what the code does at line 579
      // The real question is whether a transformer can manipulate position value
      // between borrow() and the final health check
      uint256 tokenId = vault.transformedTokenId();
      if (tokenId != 0) {
          (uint256 debt,,,,) = vault.loanInfo(tokenId);
          (bool isHealthy,,,) = vault._checkLoanIsHealthy(tokenId, debt, true);
          t(isHealthy, "VV-AC-02: unhealthy loan after transform");
      }
    ghost_vars: []
    validated: false
    priority: high
    confidence: 50
    notes: "The real check happens at line 579 after transform completes. A malicious transformer on the allowlist could abuse this, but adding a transformer requires onlyOwner (line 844). This is within the stated trust model. Downgraded confidence because exploiting requires compromised owner or malicious transformer approval."

  - id: VV-AC-03
    tier: 2
    type: property
    description: "emergencyAdmin can call setLimits() (line 870) to set ALL protocol limits including globalLendLimit, globalDebtLimit, minLoanSize to arbitrary values (including 0). Unlike owner, emergencyAdmin has no timelock. Setting globalLendLimit=0 prevents new deposits. Setting globalDebtLimit=0 prevents new borrows. Setting minLoanSize to max prevents partial repayments. Setting dailyLendIncreaseLimitMin=0 and dailyDebtIncreaseLimitMin=0 effectively freezes the protocol."
    attack_scenario: "Compromised emergencyAdmin sets minLoanSize to type(uint256).max. All existing loans with debt < max cannot be partially repaid (line 1046-1050 would revert). Full repayment still works (currentShares == shares skips the check). But emergencyAdmin can also set globalDebtLimit=0, preventing any new borrowing. Combined with setting limits to 0, this is a denial-of-service. However, owner can override by calling setLimits themselves. Impact: temporary DoS until owner reacts."
