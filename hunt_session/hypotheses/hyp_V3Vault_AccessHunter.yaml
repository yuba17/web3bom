    validated: false
    priority: high
    confidence: 55
    notes: "This requires a malicious transformer on the allowlist (onlyOwner to add). The trust model explicitly states transformers are 'selected audited contracts'. However, a compromised or buggy transformer could drain no-debt positions since there's no value-preservation check beyond the health check (which only checks debt vs collateral). For positions WITH debt, the health check protects against value extraction. For positions WITHOUT debt, there is NO protection. This is a real gap in the trust model if a transformer is ever compromised."

  - id: VV-AC-07
