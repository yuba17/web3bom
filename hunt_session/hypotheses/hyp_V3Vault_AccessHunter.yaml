    attack_scenario: "A malicious transformer on the allowlist receives the NFT approval, extracts all liquidity and fees from the position, sends them to an attacker address, then returns the now-empty NFT to the vault. The post-transform health check at line 579 catches this IF there's outstanding debt (empty position = unhealthy). But if there's no debt (debtShares == 0), _requireLoanIsHealthy passes trivially because debt=0 and any collateralValue >= 0. The transformer could drain all liquidity from a no-debt position."
