    attack_scenario: "Owner sets gaugeManager to a seemingly valid contract. Later, a vulnerability is found in that contract. Owner cannot update gaugeManager because of the one-time lock (line 1370-1371). Staked positions could be at risk if the gauge manager is exploitable. However, owner could mitigate by: (1) removing the staking functionality via emergencyAdmin setting limits, (2) users can still unstake their own positions. The one-time lock is documented as 'accepted operational/trust risk' at line 1368."
    solidity: |
      // Invariant: gaugeManager can only be set once
      // After setting, gaugeManager != address(0) always
      address gm = vault.gaugeManager();
      if (gm != address(0)) {
          // Verify it's a contract
          t(gm.code.length > 0, "VV-AC-09: gauge manager not a contract");
          // Verify it cannot be changed (this is enforced by revert at line 1370)
      }
    ghost_vars: []
    validated: false
    priority: low
    confidence: 45
    notes: "This is explicitly documented as an accepted risk at line 1366-1368. The one-time lock is intentional to prevent owner from swapping to a malicious manager after users have staked. It's a tradeoff: immutability protects users from owner swap attacks but prevents fixing bugs. Design choice, not a bug."

