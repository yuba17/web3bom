  id: GPVCA-WC-FP-01
  reason: >
    Dutch auction price staleness across blocks: isValidSignature re-evaluates
    price at settlement time, and the order buyAmount acts as a minimum floor.
    Old orders with high buyAmount are not exploitable — the solver overpays,
    not the protocol. See GPVCA-WC-06 analysis.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Dutch auction EIP-1271 orders with partially fillable flag: stale orders
      in CowSwap order book are not exploitable because isValidSignature re-validates
      at settlement time with current elapsed time. The buyAmount minimum only
      benefits the protocol (seller). Not a bug.
    briefing_update_applied: false
- hunter: WildcardHunter
  id: GPVCA-WC-FP-02
  reason: >
    Self-referential auction (s_assetOut == sellToken): Code at BaseAuction.sol
    line 350-351 explicitly handles this case by sending assetOut directly to
    s_assetOutReceiver instead of starting an auction. isValidSignature cannot
    validate an order where sellToken == s_assetOut because s_auctionStarts
    would be 0 (auction never started). This is by design.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Self-referential auction in Chainlink PA V2: s_assetOut cannot be auctioned.
      performUpkeep sends it directly to receiver (line 350-351). isValidSignature
      rejects because s_auctionStarts[assetOut] == 0. Not a bug — by design.
    briefing_update_applied: false
