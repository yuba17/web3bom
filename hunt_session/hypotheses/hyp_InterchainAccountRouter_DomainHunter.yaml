- id: IAR-07
  tier: 2
  type: property
  description: "Commit-reveal permite replay: un commitment puede ser re-seteado despues de ejecutado, porque setCommitment solo verifica que !commitments[_commitment]"
  attack_scenario: |
    1. Usuario envia commitment C. setCommitment(C) -> commitments[C] = true.
    2. revealAndExecute ejecuta y borra: delete commitments[C].
    3. Ahora commitments[C] == false. Un nuevo setCommitment(C) es posible.
    4. Si un relayer reenvia el mismo mensaje Hyperlane (replay), el commitment se
       re-setea y los calls se ejecutan de nuevo.
    5. La proteccion contra replay debe venir del Mailbox (nonce tracking), no del ICA.
    6. Si el Mailbox no tiene replay protection adecuada, double-execution.
  impact: "Double-execution de calls si el Mailbox no previene replay de mensajes"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que un commitment puede ser re-seteado despues de ser ejecutado
    bytes32 commitment = keccak256("test");
    // Primera vez
    // ica.setCommitment(commitment) -- via owner
    // ica.revealAndExecute(calls, salt) -- ejecuta y borra
    // Segunda vez: deberia poder volver a setear?
    bool canRecommit = !ica.commitments(commitment); // true, porque fue borrado
    t(canRecommit, "IAR-07: commitment can be re-set after execution");
    // Esto es un riesgo si hay replay a nivel de Hyperlane message
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: |
    El Mailbox de Hyperlane SI tiene replay protection (nonce incrementing + delivered mapping).
    Pero si hay algun bypass del nonce (e.g., mensajes con nonce=0, o re-org), este es un vector.
    Marcado tier 2 porque depende de un fallo externo (Mailbox replay protection).

- id: IAR-08
