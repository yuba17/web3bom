  tier: 1
  type: property
  description: "_enrollRemoteRouter en AbstractInterchainAccountRouter enrolla router con ISM=EMPTY_SALT -- llamadas desde Router.enrollRemoteRouter solo setean router sin ISM"
  attack_scenario: |
    1. AbstractInterchainAccountRouter._enrollRemoteRouter override linea 277-286.
    2. Llama _enrollRemoteRouterAndIsm con _ism = EMPTY_SALT (bytes32(0)).
    3. Esto significa que enrollar un router via el metodo estandar Router.enrollRemoteRouter
       siempre setea ISM = 0.
    4. Cuando callRemote usa isms[_destination] que es bytes32(0), y esto se pasa a
       callRemoteWithOverrides como _ism = bytes32(0).
    5. En destino, route() ve ISM = 0 y retorna defaultIsm.
    6. PERO: si el admin queria un ISM especifico y solo uso enrollRemoteRouter
       (no enrollRemoteRouterAndIsm), el ISM queda en 0 y NO se puede cambiar
       (immutabilidad). El dominio queda permanentemente con defaultIsm.
  impact: "Admin error irrecuperable: dominio enrollado sin ISM especifico, immutable despues"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que _enrollRemoteRouter setea ISM a EMPTY_SALT
    // Despues de enrollar via enrollRemoteRouter, isms[domain] deberia ser bytes32(0)
    // Y no se puede re-enrollar con un ISM diferente
    bytes32 ismValue = router.isms(testDomain);
    eq(ismValue, bytes32(0), "IAR-12: ISM should be EMPTY_SALT after enrollRemoteRouter");
    // Intentar re-enrollar con ISM no-zero deberia revertir
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 75
  notes: |
    Combinado con IAR-09. Un admin que usa el metodo heredado enrollRemoteRouter
    (de la clase base Router) sin saber que deberia usar enrollRemoteRouterAndIsm
    pierde la oportunidad de setear un ISM custom permanentemente.

