- id: IAR-01
  tier: 1
  type: property
  description: "callRemoteWithOverrides permite ISM arbitrario controlado por el caller -- el atacante puede especificar un ISM malicioso que siempre retorna true, obteniendo ejecucion incondicional en la ICA destino"
  attack_scenario: |
    1. Atacante llama callRemoteWithOverrides con _ism = address(MaliciousIsm) que siempre retorna true en verify().
    2. En destino, route() lee el ISM del body del mensaje (InterchainAccountMessage.ism), y retorna el ISM malicioso.
    3. El Mailbox usa ese ISM para verificar el mensaje -> siempre pasa.
    4. handle() se ejecuta: despliega ICA con el ISM malicioso en el salt, y ejecuta calls arbitrarios.
    5. PERO: la ICA derivada es unica al (origin, owner, sender/router, ism, salt) -- asi que el atacante
       solo controla una ICA nueva, sin fondos previos. El riesgo real es si alguien envio fondos
       a una ICA derivada con un ISM que no esperaban (e.g. via getLocalInterchainAccount con ISM incorrecto).
    La clave: handle() NO tiene onlyRemoteRouter. Cualquier _sender es aceptado. Combinado con ISM
    arbitrario, un atacante podria ejecutar como cualquier (origin, owner) si el ISM no valida nada.
    Pero el ICA address depende del sender+ISM, asi que no puede tomar control de ICAs existentes
    SALVO que el ISM sea el mismo que el enrollado por defecto.
  impact: "Si un usuario deposita fondos en una ICA cuyo ISM puede ser suplantado, perdida total de esos fondos"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que route() para un mensaje con ISM=0 retorna el defaultIsm, no address(0)
    // y que ISMs no-zero son respetados como estan en el mensaje (by design, pero peligroso)
    bytes memory body = InterchainAccountMessage.encode(
        address(this), bytes32(0), new CallLib.Call[](0), bytes32(0)
    );
    // Simular route con ISM=0 en el body
    address routedIsm = address(router.route(body));
    t(routedIsm != address(0), "IAR-01: zero ISM routed to zero address");
    t(routedIsm == address(mailbox.defaultIsm()), "IAR-01: zero ISM should route to defaultIsm");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: |
    handle() explicitamente dice "Does not need to be onlyRemoteRouter, as this application is
    designed to receive messages from untrusted remote contracts." Esto es BY DESIGN. Pero la
    combinacion con ISM controlado por el caller es el vector. La ICA derivada es unica por
    parametros, asi que no se pueden robar ICAs existentes. Riesgo real: confusion de ICAs.

- id: IAR-02
  tier: 1
  type: property
  description: "callRemoteCommitReveal usa address(this).balance para el segundo dispatch -- un atacante puede front-run con ETH para inflar el valor enviado al reveal message, o el usuario pierde ETH residual del contrato"
  attack_scenario: |
    1. Usuario llama callRemoteCommitReveal con msg.value = X.
    2. El primer dispatch (_commitmentMsgId) consume msg.value completo.
    3. El segundo dispatch (_revealMsgId) usa address(this).balance -- que incluye
       cualquier ETH residual en el contrato (de receive(), de otros usuarios, etc).
    4. Si hay ETH residual en el router, ese ETH se envía como valor del segundo mensaje.
    5. Atacante puede: (a) enviar ETH al contrato antes del call para inflar el gas payment
       del reveal, causando que el hook reciba más de lo esperado; (b) si otro usuario
       deja ETH residual, el siguiente usuario que llama callRemoteCommitReveal lo consume.
    Path concreto: Alice envia 1 ETH, el commit consume 0.5 ETH en gas. Quedan 0.5 ETH en
    address(this).balance. Bob envia 0.1 ETH para su commit-reveal. Su reveal paga
    0.5 + lo que quede = valor inflado. Alice pierde 0.5 ETH.
  impact: "Robo de ETH residual del router -- cualquier ETH que quede en el contrato se lo lleva el siguiente llamador de callRemoteCommitReveal"
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // Track ETH balance antes y despues de callRemoteCommitReveal
    uint256 balanceBefore = address(router).balance;
    uint256 sentValue = 1 ether;
    // Simular: depositar ETH extra en el router
    (bool ok,) = address(router).call{value: 0.5 ether}("");
    require(ok);
    uint256 balanceWithExtra = address(router).balance;
    // Despues de callRemoteCommitReveal, el balance deberia ser 0 o solo el exceso del caller
    // Si address(this).balance incluye fondos de otros, es un bug
    t(balanceWithExtra >= balanceBefore + 0.5 ether, "IAR-02: pre-condition");
    // El invariante es: callRemoteCommitReveal no debe gastar mas de msg.value del caller
    // Esto se viola porque usa address(this).balance en linea 654
  ghost_vars:
  - uint256 internal ghost_routerBalancePre;
  validated: false
  priority: critical
  confidence: 90
  notes: |
    Linea 630 y 654: _dispatchMessageWithValue(..., address(this).balance).
    El primer dispatch ya consumio msg.value. El segundo usa el balance residual.
    Si el hook no consume todo el msg.value del primer dispatch, queda ETH en el router.
    Ademas, el contrato tiene receive() payable, asi que cualquier ETH enviado previamente
    se consume. ESTE ES UN BUG REAL CON ALTO CONFIDENCE.

- id: IAR-03
  tier: 1
  type: property
  description: "ICA salt no incluye la direccion del router destino -- dos routers diferentes en la misma chain producen ICAs con la misma address para el mismo (origin, owner, ism, userSalt)"
  attack_scenario: |
    1. Si existen dos InterchainAccountRouter en la misma chain destino (ej: upgrade, fork, o deploy paralelo).
    2. Ambos usan _getSalt(origin, owner, router_sender, ism, userSalt). PERO _router es el sender
       del mensaje, que SI esta incluido en el salt via _sender param en handle().
    3. Analisis mas detallado: en handle(), _sender viene del mensaje Hyperlane (el router origen).
       Asi que dos mensajes del MISMO router origen a dos routers destino diferentes SI generan
       la misma ICA (si el bytecodeHash y deployer son diferentes, Create2 da address diferente).
    4. PERO: getDeployedInterchainAccount usa Create2.deploy con el router como deployer (address(this)).
       Asi que dos routers destino diferentes despliegan ICAs en addresses diferentes porque el deployer
       es diferente. FALSE POSITIVE para cross-router.
    Sin embargo: si el _sender (router origen) puede ser suplantado en un mensaje cross-chain
    (el Mailbox lo setea desde el message.sender field), un atacante en chain A con un contrato
    cuya address es la misma que un router legitimo en chain B podria obtener la misma ICA.
  impact: "Suplantacion de identidad de ICA si un atacante despliega un contrato con la misma address que un router legitimo en otra chain"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que dos routers diferentes producen ICAs diferentes para el mismo owner
    bytes32 salt1 = keccak256(abi.encodePacked(uint32(1), owner, router1, ism, bytes32(0)));
    bytes32 salt2 = keccak256(abi.encodePacked(uint32(1), owner, router2, ism, bytes32(0)));
    t(salt1 != salt2, "IAR-03: different routers must produce different salts");
    // Verificar que origins diferentes producen ICAs diferentes
    bytes32 salt3 = keccak256(abi.encodePacked(uint32(2), owner, router1, ism, bytes32(0)));
    t(salt1 != salt3, "IAR-03: different origins must produce different salts");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: |
    La inclusion de _router (sender del mensaje) en el salt es correcta. Pero el riesgo es
    cross-chain address collision: en EVM, el mismo private key produce la misma address en
    todas las chains. Si un atacante controla la private key de un router en chain A,
    puede enviar mensajes que parecen venir de ese router en chain B.

- id: IAR-04
  tier: 1
  type: property
  description: "route() permite que el mensaje especifique un ISM arbitrario que sera usado por el Mailbox para verificar -- un atacante puede especificar ISM=address(this) o un contrato que siempre retorna true"
  attack_scenario: |
    1. route() es llamado por el Mailbox durante process() para determinar que ISM usar.
    2. Para mensajes tipo CALLS/COMMITMENT: lee el ISM del body del mensaje (bytes 33:65).
    3. Si ISM != 0, retorna ese ISM directamente sin validacion.
    4. Un atacante craft un mensaje cross-chain con ISM = address de un contrato malicioso
       que implementa verify() retornando true siempre.
    5. El Mailbox usa ese ISM, la verificacion pasa, y handle() ejecuta los calls.
    6. CRITICO: handle() solo tiene onlyMailbox, NO valida el sender contra routers enrollados.
    7. La ICA derivada usa _sender (que es el sender del mensaje, controlado por el atacante)
       y el ISM (controlado por el atacante) en el salt. Asi que la ICA seria nueva, pero
       si alguien envio fondos a esa address precomputada, se roban.
  impact: "Ejecucion arbitraria en ICA con ISM bypass -- fondos en ICAs con ISM no-default en riesgo"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que route() para un mensaje con ISM no-zero retorna exactamente ese ISM
    // Esto es by design pero peligroso -- el test verifica el comportamiento
    bytes memory fakeBody = abi.encodePacked(
        uint8(0), // MessageType.CALLS
        bytes32(uint256(uint160(address(0xdead)))), // owner
        bytes32(uint256(uint160(address(0xbeef)))), // ISM = attacker controlled
        bytes32(0), // salt
        abi.encode(new CallLib.Call[](0)) // empty calls
    );
    // route() should return the ISM from the message body
    // The invariant to test: is this ISM actually trusted?
    address returnedIsm = address(router.route(fakeBody));
    // If returnedIsm == 0xbeef, then attacker controls ISM selection
    t(returnedIsm == address(0xbeef), "IAR-04: ISM from message body is used directly");
    // THIS IS THE VULNERABILITY: route() trusts message-embedded ISM without validation
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 75
  notes: |
    Este es el vector mas critico. La defensa es que el Mailbox solo acepta mensajes que
    pasan la verificacion del ISM, asi que si el ISM es malicioso, el atacante necesita
    que ESE ISM sea el que verifica SU mensaje. Es un chicken-and-egg: el ISM en el body
    determina cual ISM verifica el mensaje, y el atacante controla el body.
    Si el Mailbox permite que el recipient determine el ISM (via interchainSecurityModule()),
    y el recipient es el router que retorna lo que el body dice... hay un circular trust issue.

