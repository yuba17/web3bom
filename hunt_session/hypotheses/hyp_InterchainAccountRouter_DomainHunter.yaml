- id: IAR-10
  tier: 1
  type: property
  description: "CommitmentReadIsm.verify() llama revealAndExecute en una ICA cuya address viene del metadata (controlado por el off-chain service) -- si el service es comprometido, puede apuntar a cualquier ICA"
  attack_scenario: |
    1. CommitmentReadIsm.verify() recibe _metadata = (ica_address, salt, calls).
    2. Linea 65: address _ica = address(bytes20(_metadata[:20])) -- tomado directamente del metadata.
    3. Si el off-chain service (que provee el metadata via CCIP-Read) es comprometido,
       puede apuntar a cualquier ICA que tenga un commitment pendiente.
    4. El verify solo chequea que hash(metadata[20:]) == message.commitment.
    5. PERO el commitment fue seteado por el usuario, asi que el atacante necesitaria que
       el commitment coincida. Sin embargo, si el servicio provee un ICA diferente con el
       mismo commitment (collision), ejecutaria en la ICA equivocada.
    6. Mas realista: el service off-chain es el single point of failure para commit-reveal.
  impact: "Ejecucion en ICA incorrecta si el off-chain commitment service es comprometido"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
