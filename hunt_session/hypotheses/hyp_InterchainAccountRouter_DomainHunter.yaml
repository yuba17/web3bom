    2. El refundAddress es address(this) (el router), no msg.sender.
    3. Si el hook de gas sobrecarga y hay refund, el ETH va al router.
    4. El usuario pago msg.value pero el refund no le llega.
    5. Combinado con IAR-02 (address(this).balance usado para el reveal dispatch),
       el refund del commit se usa para pagar el reveal. PERO si msg.value > commit_cost + reveal_cost,
       el exceso queda en el router permanentemente.
    6. Peor: si otro usuario llama callRemoteCommitReveal despues, consume el refund del primero.
