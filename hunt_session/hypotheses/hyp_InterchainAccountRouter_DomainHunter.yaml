    // siempre que el hash coincida con el commitment
    bytes32 salt = bytes32(uint256(1));
    CallLib.Call[] memory calls = new CallLib.Call[](0);
    bytes32 commitment = keccak256(abi.encodePacked(salt, abi.encode(calls)));
    // Metadata con ICA arbitrario
