# ─── ANÁLISIS PREVIO ───────────────────────────────────────────────────────────
#
# TWAP window: 60 segundos, maxTickDifference = 200 ticks (~2%), maxPriceDiff = 2%.
#
# _validateSwap usa:
#   1. _hasMaxTWAPTickDifference: rechaza el swap si currentTick se desvía > 200 ticks del TWAP(60s)
#   2. amountOutMin derivado de sqrtPriceX96 del SLOT0 (precio ACTUAL, no TWAP) con 2% haircut.
#
# VULNERABILIDAD CRÍTICA IDENTIFICADA (GM-O-01):
#   amountOutMin se calcula a partir de sqrtPriceX96 obtenido del SLOT0 (precio en tiempo real),
#   NO del TWAP. Si un atacante manipula el precio SPOT justo antes del bloque donde se ejecuta
#   compoundRewards (e.g., via sandwich), puede hacer que sqrtPriceX96 sea desfavorable para el
#   compounding, resultando en un amountOutMin efectivamente MÁS BAJO (en la dirección correcta).
#   El check TWAP solo valida que el tick actual no se aleje > 200 ticks del TWAP — pero si el
#   atacante mueve el precio exactamente 199 ticks (dentro del límite), el amountOutMin calculado
#   desde ese precio manipulado aplicará el 2% haircut sobre un precio ya 199 ticks peor.
#   Resultado: el swap acepta menos tokens del esperado → los owners reciben menos compounding.
#   Fondos en riesgo: la diferencia entre precio TWAP justo y precio-manipulado-199-ticks.
#   ~2% por swap sobre el total de AERO rewards. No es fund loss directo pero sí value extraction.
#
# TWO-HOP PATH sin validación compuesta (GM-O-02):
#   En el path AERO → otherToken → targetToken:
#     hop1: _swapThroughPool(intermediatePool, AERO, otherToken, amountIn)  ← validado vs TWAP de intermediatePool
#     hop2: _swapThroughPool(positionPool, otherToken, targetToken, intermediateAmount) ← validado vs TWAP de positionPool
#   Cada hop se valida independientemente. Un atacante que puede mover ambos pools (o solo uno)
#   puede superar el slippage total. El amountOutMin del hop2 se calcula con el precio SPOT del
#   positionPool — si ese pool fue manipulado 199 ticks en la dirección desfavorable, el amountOutMin
#   será ~4% peor que el precio correcto (199 ticks en hop1 + 199 ticks en hop2).
#   No hay invariante que garantice: finalAmount >= TWAP_PRICE_AERO_TO_TARGET * amountIn * (1 - tolerance).
#
# TWO-HOP ASYMMETRY (GM-O-03):
#   _swapAeroForPosition llama a _swapAeroToTarget dos veces: una para token0 y otra para token1.
#   En el path two-hop para token0: AERO → token1 (via intermediatePool) → token0 (via positionPool).
#   En el path two-hop para token1: AERO → token0 (via intermediatePool) → token1 (via positionPool).
#   El positionPool se usa en AMBAS llamadas — en sentidos opuestos. El precio del positionPool es
#   leído dos veces del slot0, potencialmente en el MISMO bloque. Si el pool fue manipulado, ambos
#   swaps se ejecutan con el precio corrompido. Pero más importante: si solo hay directPool para uno
#   de los tokens, se mezclan paths directos y two-hop — sin documentación ni validación de si el
#   escenario mixto fue considerado.
#
# aeroSplitBps = 0 o 10000 edge case (GM-O-04):
#   Si aeroSplitBps = 0, todo el AERO se intenta convertir en token1 (requestedAero0 = 0).
#   _swapAeroToTarget con amountIn = 0 retorna (0, 0) → amount0Out = 0.
#   _addLiquidity con maxAddAmount0 = 0 y maxAddAmount1 > 0 → solo se añade token1.
#   Para una posición Uniswap V3 con un rango específico, añadir solo un token puede resultar en
#   0 liquidez añadida si el precio actual está fuera del rango de ese token. El usuario recibe
#   token1 como leftover pero el AERO se gastó completamente. No hay pérdida de fondos pero hay
#   degradación de la función principal (compounding) que no está documentada.
#   Severidad real: LOW. By design per aeroSplitBps param, pero edge case no testeado.
#
# AERO LEFTOVER ACCOUNTING (GM-O-05):
#   state.spentAero = spentAero0 + spentAero1.
#   En ambos paths (direct y two-hop), spentAero = amountIn (completo), no importa cuánto
#   token realmente se obtuvo. Incluso si amountOut = 0 (improbable pero pool casi vacío),
#   spentAero se marca como gastado y no hay leftover para el owner.
#   MÁS RELEVANTE: si targetToken == aeroToken (shortcut), spentAero = amountIn y amountOut = amountIn
#   — se "gasta" sin swap. El owner no pierde, pero el accounting no refleja que no se hizo swap.
#   El invariante que falla aquí es: spentAero <= aeroAmount siempre (ya verificado en código).
#   El invariante que NO está verificado: amountOut > 0 cuando amountIn > 0 y el swap fue ejecutado.
#
# rewardBasePools CON POOL DE BAJA LIQUIDEZ (GM-O-06):
#   setRewardBasePool verifica que el pool tenga los tokens correctos y sea el pool canónico de la
#   factory (via IAerodromeSlipstreamFactory.getPool). Pero NO verifica liquidez mínima.
#   Un owner malicioso o comprometido puede configurar un pool AERO/TOKEN con 1 wei de liquidez.
#   Cualquier compoundRewards con ese token causaría: swap ejecutado, enorme slippage, amountOut ≈ 0,
#   amountOutMin pasaría (porque se calcula desde el precio SPOT manipulado).
#   El TWAP del pool de 1 wei puede ser manipulado al valor que el atacante quiera.
#   Categoría: TRUSTED OWNER. Por las reglas del bounty, si owner está en trusted roles → OUT OF SCOPE.
#   Lo incluyo como LOW porque documentar el vector es útil y algunos bounties pagan por configs inseguras.
#
# SLOT0 REENTRANCY en multi-hop (GM-O-07):
#   _getPoolSlot0 usa staticcall. No hay reentrancy posible vía este vector.
#   Los swaps usan _poolSwap que llama pool.swap y luego recibe el callback uniswapV3SwapCallback.
#   El callback solo transfiere tokenIn al pool. No hay forma de reentrar compoundRewards desde ahí
#   porque nonReentrant está activo. DESCARTADO como vector.
#
# ─── CONCLUSIÓN DE SEVERIDAD ───────────────────────────────────────────────────
# GM-O-01: MEDIUM (valor extraíble ~2-4% de rewards, requiere MEV/sandwich, no fund loss total)
# GM-O-02: MEDIUM (dos-hop amplifica el vector de GM-O-01)
# GM-O-03: LOW-MEDIUM (edge case mixto, difícil de explotar, más diseño que bug)
# GM-O-04: LOW (by design, baja severidad)
# GM-O-05: LOW/INFO (accounting correcto, pero amountOut = 0 sin revert es silencioso)
# GM-O-06: LOW (trusted owner, out of scope para la mayoría de bounties)

