  - uint256 internal ghost_spentAero;
  - uint256 internal ghost_amount0Out;
  - uint256 internal ghost_amount1Out;
  - uint256 internal ghost_amountAdded0;
  - uint256 internal ghost_amountAdded1;
  - uint256 internal ghost_rewardAmount0;
  - uint256 internal ghost_rewardAmount1;
