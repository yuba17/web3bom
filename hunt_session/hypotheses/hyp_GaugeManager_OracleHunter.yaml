- id: GM-O-03
  tier: 2
  type: property
  description: 'En _swapAeroForPosition, el positionPool es usado en ambas llamadas
    a _swapAeroToTarget: una vez en sentido otherToken→targetToken (para token0) y
    otra en sentido opuesto (para token1). Cada llamada lee el slot0 del positionPool
    por separado. Si en el path two-hop para token0 se usa el directPool para token1
    (o viceversa), se mezclan paths que usan distintos pools, y el precio del positionPool
    se lee en un estado que puede haber cambiado entre los dos swaps (si los swaps
    modifican el positionPool en el mismo bloque — lo cual ocurre en el two-hop de
    token1). Específicamente: si el two-hop de token0 hace swap en positionPool (USDC→WETH),
    el precio del positionPool cambia. Luego el two-hop de token1 valida su slippage
    contra el precio YA MODIFICADO del positionPool (desde el primer swap). El TWAP
    check del segundo hop usa el precio post-primer-swap como referencia.

    '
