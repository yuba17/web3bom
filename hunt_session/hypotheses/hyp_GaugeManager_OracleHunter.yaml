    \ llama _swapAeroForPosition. 2. _swapAeroToTarget(positionPool, WETH, USDC, requestedAero0):\n\
    \   - two-hop: AERO→USDC (aeroUsdcPool) → USDC→WETH (positionPool). Lee slot0\
    \ de positionPool.\n   - Ejecuta el swap en positionPool, moviendo el precio.\n\
    3. _swapAeroToTarget(positionPool, USDC, WETH, requestedAero1):\n   - two-hop:\
    \ AERO→WETH (aeroWethPool) → WETH→USDC (positionPool). Lee slot0 del positionPool\
    \ MODIFICADO.\n   - amountOutMin calculado del precio post-primer-swap. Puede\
    \ ser más favorable o desfavorable.\nEl efecto neto no es una pérdida directa\
    \ de fondos (los swaps son en sentidos opuestos), pero la validación del slippage\
    \ del segundo swap se hace contra un precio que el propio contrato acaba de cambiar\
    \ — haciendo el check TWAP menos preciso. Impacto: LOW. Este comportamiento es\
    \ implícito en el diseño, pero no está documentado.\n"
  solidity: "// Property: después de ambos swaps, el total gastado en AERO no debe\
    \ exceder aeroAmount\n// (ya garantizado por el código, pero verificar que spentAero\
