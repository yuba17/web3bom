invariants:
  - id: AB-D-01
    title: "forceApprove on no-solution path uses stale getAssetOutAmount — race with Dutch auction price decay"
    description: |
      In AuctionBidder.bid() L78, when solution.length == 0, the contract calls
      getAssetOutAmount(assetIn, amount, block.timestamp) to compute the approval amount.
      However, this is a VIEW call that reads the current price. The actual bid() call on L81
      happens in the SAME transaction, so block.timestamp is identical — no race exists within
      a single tx. The getAssetOutAmount view function (BaseAuction L749-767) and the internal
      _getAssetOutAmount called by bid() (L442) use the same elapsedTime = block.timestamp - auctionStart.

      VERDICT: NOT a real issue. Within a single transaction, block.timestamp is constant.
      The approval amount will exactly match what bid() requires. No race condition.
    confidence: 5
    severity: "Info"
    status: "dismissed"
    attack_scenario: "None — block.timestamp is identical for both calls within same tx."
    code_location: "AuctionBidder.sol:L78"

  - id: AB-D-02
    title: "_multiCall in auctionCallback has no target restrictions — trusted role can drain arbitrary tokens"
    description: |
      AuctionBidder.auctionCallback() (L97-112) decodes arbitrary Call[] from data and
      executes them via _multiCall(). The calls can target ANY address with ANY calldata.
      This means a caller with AUCTION_BIDDER_ROLE can craft a solution that:
      1. Calls ERC20.transfer() on any token sitting in AuctionBidder to any address
      2. Calls ERC20.approve() to grant allowances to arbitrary addresses
      3. Calls any contract with any function

      However, the AUCTION_BIDDER_ROLE is a trusted role — only authorized solvers should
      have it. The _multiCall is the core mechanism for the solver to execute swap logic
      (e.g., swap WETH->LINK on Uniswap). Restricting targets would break the design.

      The access control (onlyRole on bid(), msg.sender check on auctionCallback) is the
      security boundary. This is BY DESIGN for a trusted solver pattern.

      Risk: if AUCTION_BIDDER_ROLE is compromised, full drain of AuctionBidder balance.
      But this is standard trusted-role risk, not a code vulnerability.
    confidence: 15
    severity: "Info"
    status: "by-design"
    attack_scenario: |
      Compromised AUCTION_BIDDER_ROLE holder crafts solution with Call{target: anyToken,
      data: transfer(attacker, balance)} to drain AuctionBidder. But this requires role
      compromise, which is out of scope per standard bounty rules.
    code_location: "AuctionBidder.sol:L107-109, Caller.sol:L49-63"

  - id: AB-D-03
    title: "Residual assetOut in AuctionBidder gets swept by BaseAuction._onAuctionEnd (BA-SWEEP-01 interaction)"
    description: |
      BaseAuction._onAuctionEnd() (L393-396) sweeps ALL assetOut (LINK) balance from
      BaseAuction to s_assetOutReceiver. AuctionBidder is a SEPARATE contract (not the
      auction itself), so _onAuctionEnd operates on BaseAuction's own balance, not
      AuctionBidder's balance.

      Flow analysis:
      1. AuctionBidder.bid() calls auction.bid() (L81)
      2. BaseAuction.bid() transfers assetIn to msg.sender (AuctionBidder) on L444
      3. BaseAuction.bid() calls auctionCallback on AuctionBidder (L449)
      4. AuctionBidder executes solution via _multiCall, then approves assetOut to auction (L111)
      5. BaseAuction.bid() pulls assetOut FROM AuctionBidder via safeTransferFrom (L453)
      6. assetOut now sits in BaseAuction contract
      7. Later, _onAuctionEnd sweeps BaseAuction's assetOut balance to assetOutReceiver

      The residual risk is in AuctionBidder itself: after bid() completes (L83-91),
      AuctionBidder checks its OWN assetOut balance and sends any remainder to s_receiver.
      This is a cleanup mechanism. If the solution over-acquires LINK, the excess stays in
      AuctionBidder until bid() transfers it to s_receiver.

      However: if s_receiver is address(0) AND the solution leaves residual assetOut in
      AuctionBidder, those tokens are stuck. The next bid() will transfer them as part of
      the new balance. But this means bid N+1's solver effectively subsidizes the auction
      with leftover LINK from bid N — not a loss, just accounting confusion.

      For BaseAuction (BA-SWEEP-01): the sweep of ALL assetOut balance means if someone
      directly sends LINK to the BaseAuction contract (donation), it gets swept to
      assetOutReceiver on auction end. This is known behavior per BA-SWEEP-01.

      AuctionBidder itself does NOT leave residual assetOut in BaseAuction because
      BaseAuction.bid() pulls EXACTLY assetOutAmount via safeTransferFrom.
    confidence: 25
    severity: "Low"
    status: "known-interaction"
    attack_scenario: |
      1. Solver executes bid with solution that acquires 105 LINK but only 100 LINK needed
      2. AuctionBidder approves exactly 100 LINK to auction (L111 uses amountOut from callback)
      3. BaseAuction pulls exactly 100 LINK
      4. 5 LINK residual sits in AuctionBidder
      5. If s_receiver != 0, transferred there (L89) — working as intended
      6. If s_receiver == 0, stuck until admin calls withdraw() or next bid picks it up
      No fund loss — just residual handling. withdraw() (L119-131) exists as safety valve.
    code_location: "AuctionBidder.sol:L83-91, BaseAuction.sol:L393-396"

  - id: AB-D-04
    title: "MEV: solution calldata is public — sandwich attack on solver's DEX swap"
    description: |
      When AUCTION_BIDDER_ROLE calls bid() with a solution containing DEX swap calls
      (e.g., Uniswap swapExactTokensForTokens), the solution calldata is visible in the
      mempool. A MEV bot can:
      1. See the pending bid() tx with solution containing a Uniswap swap
      2. Frontrun by buying the target token (LINK) to push price up
      3. Let the solver's swap execute at worse price
      4. Backrun by selling LINK at the inflated price

      Impact: the solver gets fewer LINK for the same input, paying more than necessary.
      But the solver is the one absorbing this cost (they provide LINK to the auction).
      The protocol (Chainlink) gets the EXACT amount of LINK required by the auction price
      curve — they don't lose anything.

      The solver can mitigate by:
      - Using Flashbots/MEV-protect RPCs
      - Setting slippage protection in the DEX calls within the solution
      - Using private order flow (CowSwap path via GPV2CompatibleAuction)

      This is standard MEV risk for any on-chain DEX interaction, not a contract bug.
    confidence: 40
    severity: "Low"
    status: "accepted-risk"
    attack_scenario: |
      MEV bot sandwiches solver's Uniswap swap within the _multiCall solution.
      Solver loses ~0.1-1% on the swap. Protocol unaffected because BaseAuction.bid()
      enforces exact assetOutAmount via safeTransferFrom.
    code_location: "AuctionBidder.sol:L65-92 (bid function), Caller.sol:L49-63 (_multiCall)"

  - id: AB-D-05
    title: "AuctionBidder does NOT interact with GPV2CompatibleAuction CowSwap path"
    description: |
      GPV2CompatibleAuction extends BaseAuction and adds EIP-1271 order validation for
      CowSwap settlement. AuctionBidder connects to BaseAuction via the standard bid()
      function (L410-458) which exists on both BaseAuction and GPV2CompatibleAuction.

      If s_auction points to a GPV2CompatibleAuction instance:
      - AuctionBidder.bid() still works fine — it calls auction.bid() which is inherited
      - The CowSwap path (isValidSignature) is a SEPARATE entry point used by CowSwap
        solvers, not by AuctionBidder
      - No conflict: both paths ultimately require the bidder to provide assetOutAmount
        of LINK, just through different mechanisms

      Potential concern: if a CowSwap order and an AuctionBidder bid target the same
      auction simultaneously, they compete for the same assetIn balance. BaseAuction.bid()
      checks `amount > availableBalance` (L438) and reverts if insufficient. This is
      correct behavior — first tx wins, second reverts. No double-spend.

      The reentrancy guard (s_entered) in BaseAuction.bid() also prevents auctionCallback
      from being called during isValidSignature validation (L125-127 checks s_entered).
    confidence: 85
    severity: "Info"
    status: "no-issue"
    attack_scenario: "None — the two paths (AuctionBidder.bid and CowSwap EIP-1271) are independent and correctly guarded."
    code_location: "AuctionBidder.sol:L81, GPV2CompatibleAuction.sol:L119-176"

  - id: AB-D-06
    title: "auctionCallback approves exact amountOut but _multiCall could leave AuctionBidder with dangling approval"
    description: |
      In auctionCallback (L111), AuctionBidder does forceApprove(msg.sender, amountOut)
      where msg.sender is the auction contract. After BaseAuction.bid() pulls amountOut
      via safeTransferFrom (L453), the allowance is fully consumed (exactly amountOut
      approved, exactly amountOut transferred).

      However, if the _multiCall solution includes an approval to the auction contract
      (e.g., as part of its swap logic), this creates a SEPARATE allowance that persists
      after the bid completes. This is unlikely in practice but possible.

      More importantly: the forceApprove on L111 overwrites any existing allowance. If
      AuctionBidder had a prior allowance to the auction (e.g., from a failed tx or
      leftover), it gets overwritten to exactly amountOut. After safeTransferFrom
      consumes it, allowance goes to 0. Clean.

      No residual approval issue found.
    confidence: 10
    severity: "Info"
    status: "no-issue"
    attack_scenario: "None — forceApprove sets exact amount, safeTransferFrom consumes it fully."
    code_location: "AuctionBidder.sol:L111, BaseAuction.sol:L453"

  - id: AB-D-07
    title: "No slippage protection on the no-solution path — bidder trusts auction price entirely"
    description: |
      When solution.length == 0 (L75-79), AuctionBidder assumes it already holds enough
      assetOut (LINK) and simply approves the auction to pull it. There is no minimum
      output check or slippage parameter.

      The Dutch auction price is deterministic at any given block.timestamp, so there's
      no "slippage" per se — the price is known. But the AUCTION_BIDDER_ROLE caller chose
      the (assetIn, amount) parameters, and the auction price might have decayed between
      when they submitted the tx and when it's mined.

      In a Dutch auction, price decay BENEFITS the bidder (they pay less assetOut over
      time). So a delayed tx means the bidder pays LESS, not more. This is fine for
      the bidder. The protocol might get slightly less LINK per unit of assetIn, but
      this is the designed price discovery mechanism.

      No issue — Dutch auction mechanics inherently protect bidders from adverse price
      movement (price only goes down over time).
    confidence: 75
    severity: "Info"
    status: "by-design"
    attack_scenario: "None — Dutch auction price decay favors the bidder, not the protocol."
    code_location: "AuctionBidder.sol:L75-79"

  - id: AB-D-08
    title: "assetIn tokens received during auctionCallback are not forwarded — stuck in AuctionBidder"
    description: |
      BaseAuction.bid() transfers assetIn (e.g., WETH) to msg.sender (AuctionBidder) on
      L444 BEFORE calling auctionCallback. The _multiCall solution is expected to use
      these assetIn tokens to acquire assetOut (LINK), e.g., swap WETH->LINK on Uniswap.

      After bid() completes (L83-91), AuctionBidder only checks and transfers residual
      assetOut balance. It does NOT check for residual assetIn balance.

      If the solution does not fully consume the assetIn tokens (e.g., partial swap, or
      the swap route is WETH->USDC->LINK and leaves some WETH dust), the remaining assetIn
      stays in AuctionBidder.

      This is minor because:
      1. The solver designs the solution and controls how much assetIn to use
      2. Admin can recover via withdraw() (L119-131)
      3. The s_receiver mechanism only handles assetOut, not assetIn

      However, if this happens repeatedly, dust accumulates. Not a vulnerability per se,
      but a design consideration. The solver is incentivized to fully consume assetIn
      since they already "paid" for it via the bid.
    confidence: 50
    severity: "Low"
    status: "design-consideration"
    attack_scenario: |
      Solver bids 10 WETH, solution swaps only 9.99 WETH to LINK. 0.01 WETH dust
      remains in AuctionBidder. Over 100 auctions, 1 WETH accumulates. Not a loss
      (admin can withdraw), but inefficient. Solver is the one losing since they
      provided the WETH and didn't fully convert it.
    code_location: "AuctionBidder.sol:L83-91 (only checks assetOut, not assetIn)"

summary: |
  AuctionBidder is a clean, well-designed solver contract with appropriate trust boundaries.
  The AUCTION_BIDDER_ROLE is the security perimeter — all interesting operations require it.

  No Medium+ findings identified. Key observations:
  - The flash-swap callback pattern (receive assetIn -> execute solution -> approve assetOut)
    is correctly implemented with proper reentrancy and access checks.
  - No real race condition on forceApprove (block.timestamp constant within tx).
  - BA-SWEEP-01 interaction is benign — AuctionBidder and BaseAuction have separate balances.
  - CowSwap path and AuctionBidder path are independent, correctly guarded.
  - MEV risk exists but is standard and borne by the solver, not the protocol.
  - Only residual token handling (assetIn dust) is a minor design consideration.
