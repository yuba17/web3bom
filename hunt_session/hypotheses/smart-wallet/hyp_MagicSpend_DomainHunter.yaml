    severity: informational
    confidence: 95
    status: pending
    solidity: |
      // MagicSpend.sol L7 — imports v0.6 UserOperation
      import {UserOperation} from "account-abstraction/interfaces/UserOperation.sol";
      // MagicSpend.sol L8 — imports v0.6 IPaymaster
      import {IPaymaster} from "account-abstraction/interfaces/IPaymaster.sol";
      // MagicSpend.sol L325-327 — hardcoded v0.6 EntryPoint
      function entryPoint() public pure returns (address) {
          return 0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789;
      }
    attack_scenario: |
      ERC-4337 v0.7 (EntryPoint v0.7 at 0x0000000071727De22E5E9d8BAf0edAc6f37da032):
      - UserOperation is renamed to PackedUserOperation with different field layout
      - paymasterAndData is split into separate paymaster, paymasterVerificationGasLimit,
        paymasterPostOpGasLimit, paymasterData fields
      - postOp signature changes to include (PostOpMode, bytes context, uint256 actualGasCost,
        uint256 actualUserOpFeePerGas)
      - validatePaymasterUserOp receives (PackedUserOperation, bytes32, uint256)
      MagicSpend is built exclusively for v0.6 and will NOT work with v0.7 EntryPoint.
      Any attempt to use it with v0.7 bundlers or accounts will fail silently or revert.
    impact: |
      Informational — this is a known design decision (contract declares "compatible with
      Entrypoint v0.6" in NatSpec). However, as the ecosystem migrates to v0.7, users and
      integrators must be aware that MagicSpend requires a new deployment for v0.7 support.
      The hardcoded entryPoint address makes this explicit.
    references:
      - "Line 15: NatSpec states v0.6 compatibility"
      - "EIP-4337 v0.7 spec changes"

  - id: MS-D-07
    title: "Bundler can grief paymaster reputation via WithdrawTooLarge reverts in validation"
    severity: low
    confidence: 70
    status: pending
    solidity: |
      // MagicSpend.sol L347-349 — _validateRequest
      uint256 maxAllowed = address(this).balance / maxWithdrawDenominator;
      if (withdrawRequest.asset == address(0) && withdrawRequest.amount > maxAllowed) {
          revert WithdrawTooLarge(withdrawRequest.amount, maxAllowed);
      }
    attack_scenario: |
      1. Attacker monitors MagicSpend contract balance.
      2. Attacker obtains valid WithdrawRequest signatures for amounts close to
         balance/maxWithdrawDenominator.
      3. Attacker front-runs the bundle by withdrawing ETH from MagicSpend (via a
         separate valid WithdrawRequest on the withdraw() function) to reduce the balance.
      4. Legitimate UserOps in the bundle now fail validatePaymasterUserOp with
         WithdrawTooLarge because the balance dropped.
      5. Per ERC-4337 reputation system, repeated validation failures hurt the
         paymaster's reputation score with bundlers.
      6. Bundlers may throttle or ban MagicSpend, causing service degradation.
      Note: requires attacker to have valid WithdrawRequest signatures. Coinbase controls
      the signing key, so this requires either a compromised signer or social engineering.
    impact: |
      Paymaster reputation degradation leading to service disruption. Severity is Low
      because the attack requires valid signatures from Coinbase's backend. The
      maxWithdrawDenominator mitigates this by limiting per-withdrawal amounts, but
      the balance-dependent validation check creates a TOCTOU window within a bundle.
    references:
      - "ERC-4337 reputation system: opsSeen vs opsIncluded ratio"
      - "Line 347: balance check is point-in-time"

