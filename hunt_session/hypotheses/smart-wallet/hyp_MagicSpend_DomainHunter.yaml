hypotheses:

  - id: MS-D-01
    title: "Multi-UserOp bundle causes _withdrawable cross-contamination and fund misrouting"
    severity: medium
    confidence: 75
    status: pending
    solidity: |
      // MagicSpend.sol L143 — validatePaymasterUserOp
      _withdrawable[userOp.sender] += withdrawAmount - maxCost;
      // MagicSpend.sol L165-168 — postOp
      uint256 withdrawable = _withdrawable[account] + (maxGasCost - actualGasCost);
      delete _withdrawable[account];
    attack_scenario: |
      1. Bundler includes 2 UserOps for the same sender, both using MagicSpend as paymaster.
      2. EntryPoint calls validatePaymasterUserOp for UserOp1 (withdraw 1 ETH, maxCost 0.5 ETH):
         _withdrawable[sender] = 0.5 ETH
      3. EntryPoint calls validatePaymasterUserOp for UserOp2 (withdraw 1 ETH, maxCost 0.5 ETH):
         _withdrawable[sender] = 1.0 ETH (accumulated)
      4. postOp for UserOp1 runs: withdrawable = 1.0 + (0.5 - actualGas1) = ~1.45 ETH.
         delete _withdrawable[sender]. Sends 1.45 ETH to user.
      5. postOp for UserOp2 runs: _withdrawable[sender] = 0. withdrawable = 0 + (0.5 - actualGas2) = ~0.45 ETH.
         User receives only gas refund, not the 0.5 ETH excess from UserOp2.
      Net effect: user receives correct total (~1.9 ETH) BUT the paymaster's balance check
      (maxWithdrawDenominator) was evaluated on stale balance for UserOp2 validation, since
      UserOp1's funds haven't been deducted from address(this).balance yet (both validations
      run before any postOp). This could bypass the WithdrawTooLarge protection.
    impact: |
      The maxWithdrawDenominator safety check is evaluated against a stale balance during
      validation. A bundler (or colluding user) can include N UserOps each withdrawing
      balance/maxWithdrawDenominator, effectively draining N * (balance/denominator) in a
      single bundle. With denominator=2 and N=3 ops, user can withdraw 1.5x the intended
      max per-tx. This undermines the paymaster reputation protection mechanism.
    references:
      - "ERC-4337 spec: EntryPoint runs all validations before any executions"
      - "Line 347: maxAllowed = address(this).balance / maxWithdrawDenominator"

  - id: MS-D-02
    title: "Nonce permanently consumed on invalid signature in validatePaymasterUserOp"
    severity: low
    confidence: 85
    status: pending
    solidity: |
      // MagicSpend.sol L137-139 — nonce consumed BEFORE sig result checked
      _validateRequest(userOp.sender, withdrawRequest);  // L137 — marks nonce used at L352
      bool sigFailed = !isValidWithdrawSignature(userOp.sender, withdrawRequest);  // L139
      validationData = (sigFailed ? 1 : 0) | (uint256(withdrawRequest.expiry) << 160);  // L140
    attack_scenario: |
      1. Coinbase backend signs a WithdrawRequest for user Alice with nonce=42.
      2. Malicious bundler (or front-runner) observes the UserOp in the mempool.
      3. Bundler crafts a UserOp with Alice as sender, same nonce=42, but with a corrupted
         signature in the WithdrawRequest.
      4. EntryPoint calls validatePaymasterUserOp: _validateRequest marks nonce 42 as used,
         then sigFailed=true is returned via validationData.
      5. EntryPoint rejects the UserOp (sig validation failed), but nonce 42 is burned.
      6. Alice's legitimate UserOp with nonce=42 now reverts with InvalidNonce(42).
      7. Alice needs a new signed WithdrawRequest from Coinbase with a different nonce.
      Note: In practice, EntryPoint v0.6 simulates first and bundlers filter invalid ops.
      But a malicious bundler can bypass simulation. The griefing cost is the bundler's gas.
    impact: |
      DoS griefing: a malicious bundler can permanently burn valid nonces for any user by
      submitting UserOps with tampered signatures. The user must request new signed
      WithdrawRequests from Coinbase. Financial impact is limited to gas costs and UX
      degradation. Paymaster nonce space is uint256 so exhaustion is impractical.
    references:
      - "Line 342-352: _validateRequest marks nonce used unconditionally"
      - "Line 139: signature check happens AFTER nonce consumption"

  - id: MS-D-03
    title: "maxWithdrawDenominator=0 causes permanent DoS on all ETH withdrawals"
    severity: low
    confidence: 90
    status: pending
    solidity: |
      // MagicSpend.sol L329-333 — no zero-check
      function _setMaxWithdrawDenominator(uint256 newDenominator) internal {
          maxWithdrawDenominator = newDenominator;
          emit MaxWithdrawDenominatorSet(newDenominator);
      }
      // MagicSpend.sol L347 — division by zero
      uint256 maxAllowed = address(this).balance / maxWithdrawDenominator;
    attack_scenario: |
      1. Owner (or compromised owner key) calls setMaxWithdrawDenominator(0).
      2. Any subsequent call to _validateRequest with asset=address(0) hits line 347:
         address(this).balance / 0 — EVM reverts with division by zero.
      3. Both validatePaymasterUserOp and withdraw() call _validateRequest, so ALL
         ETH withdrawals are permanently blocked.
      4. ERC-20 withdrawals via withdraw() still work (asset != address(0) skips the check).
      5. Owner can fix by calling setMaxWithdrawDenominator with a non-zero value.
    impact: |
      Owner-triggered DoS on all paymaster and direct ETH withdrawal functionality.
      Severity is Low because it requires owner action (trusted role). However, if the
      owner key is compromised or a governance multisig makes an error, the paymaster
      becomes non-functional for ETH operations until fixed. No fund loss — ETH stays
      in contract and owner can still call ownerWithdraw.
    references:
      - "Line 329-333: _setMaxWithdrawDenominator has no input validation"
      - "Line 347: division uses maxWithdrawDenominator as divisor"

  - id: MS-D-04
    title: "postOp reverts on postOpReverted mode — paymaster pays gas without cleanup"
    severity: informational
    confidence: 80
    status: pending
    solidity: |
      // MagicSpend.sol L157-159
      if (mode == PostOpMode.postOpReverted) {
          revert UnexpectedPostOpRevertedMode();
      }
    attack_scenario: |
      1. User submits UserOp via MagicSpend paymaster.
      2. validatePaymasterUserOp succeeds, credits _withdrawable[user].
      3. User's execution succeeds.
      4. First postOp call attempts forceSafeTransferETH to user but reverts
         (e.g., contract balance insufficient due to concurrent withdrawals in same bundle).
      5. EntryPoint calls postOp again with PostOpMode.postOpReverted.
      6. MagicSpend reverts with UnexpectedPostOpRevertedMode().
      7. Per ERC-4337 spec, if second postOp also reverts, EntryPoint still charges the
         paymaster for gas but the paymaster cannot clean up _withdrawable state.
      8. _withdrawable[user] retains the stale value from validatePaymasterUserOp.
      Result: user can call withdrawGasExcess() to claim the _withdrawable amount,
      effectively getting a "free" withdrawal since the paymaster already paid for gas.
    impact: |
      If this edge case triggers, the paymaster loses gas cost AND the user retains
      _withdrawable funds they can claim via withdrawGasExcess(). The _withdrawable is
      amount - maxCost, so the paymaster eats both gas AND the excess. However, per the
      code comments and the EntryPoint PR #293, this should be extremely rare. The paymaster
      team acknowledges this edge case. Informational because the preconditions are very
      narrow and the devs are aware.
    references:
      - "Line 95-100: comment acknowledges the edge case"
      - "Line 155-156: reference to EntryPoint PR #293"
      - "ERC-4337: second postOp revert means paymaster absorbs cost"

  - id: MS-D-05
    title: "withdrawGasExcess callable during UserOp execution enables double-spend of _withdrawable"
    severity: medium
    confidence: 60
    status: pending
    solidity: |
      // MagicSpend.sol L143 — validatePaymasterUserOp credits _withdrawable
      _withdrawable[userOp.sender] += withdrawAmount - maxCost;
      // MagicSpend.sol L178-185 — withdrawGasExcess has no reentrancy guard
      function withdrawGasExcess() external {
          uint256 amount = _withdrawable[msg.sender];
          if (amount == 0) revert NoExcess();
          delete _withdrawable[msg.sender];
          _withdraw(address(0), msg.sender, amount);
      }
      // MagicSpend.sol L165-168 — postOp also reads _withdrawable
      uint256 withdrawable = _withdrawable[account] + (maxGasCost - actualGasCost);
      delete _withdrawable[account];
    attack_scenario: |
      1. User submits UserOp with MagicSpend paymaster. withdrawAmount=2 ETH, maxCost=1 ETH.
      2. validatePaymasterUserOp: _withdrawable[user] = 1 ETH.
      3. During UserOp EXECUTION phase, user's smart wallet calls withdrawGasExcess():
         - Reads _withdrawable[user] = 1 ETH
         - Deletes _withdrawable[user]
         - Transfers 1 ETH to user
      4. postOp runs: _withdrawable[user] = 0, withdrawable = 0 + (1 ETH - actualGas).
         User receives gas refund of ~1 ETH.
      5. Total user receives: 1 ETH (from withdrawGasExcess) + ~1 ETH (from postOp gas refund).
      This is actually correct — the total is ~2 ETH = withdrawAmount. The user just receives
      it in two transfers. This is by design (see NatSpec on withdrawGasExcess: "Can be called
      back during the UserOperation execution to sponsor funds for non-gas related use cases").
      HOWEVER: if the user calls withdrawGasExcess AND the postOp later reverts (MS-D-04 scenario),
      the user keeps the withdrawGasExcess ETH AND may be able to claim again after _withdrawable
      is not cleaned up.
    impact: |
      In the normal case, this is by design and funds are correctly accounted. But combined
      with MS-D-04 (postOp revert scenario): user gets withdrawGasExcess funds, postOp fails,
      _withdrawable might still have residual from a second UserOp in the same bundle.
      The combined scenario is very unlikely. Confidence is low because the normal path is
      correct by design.
    references:
      - "Line 176-177: NatSpec explicitly allows calling during UserOp execution"
      - "Interaction with MS-D-04 (postOp revert cleanup failure)"

  - id: MS-D-06
