    a un contrato externo via execute (target=X, value=0, data=...) y ese contrato
    hace callback al wallet, msg.sender seria X, no address(this). Esto es correcto.
    Sin embargo, si alguien logra que el wallet haga delegatecall (no call) a un
    contrato que luego llama al wallet, msg.sender SERIA address(this) porque
    delegatecall preserva msg.sender y address(this). _call usa .call, no
    .delegatecall, asi que esto no es directamente posible. PERO: upgradeToAndCall
