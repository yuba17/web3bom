  id: CSW-FP-02
  reason: >
    removeOwnerAtIndex cross-chain replay (H-01 de C4): ya reportado y documentado.
    El fix fue agregar removeLastOwner() y el check de ownerCount() >= 1.
    No re-analizar — es known issue.
  investigated_at: '2026-03-27T00:00:00Z'
  pending_briefing_update:
