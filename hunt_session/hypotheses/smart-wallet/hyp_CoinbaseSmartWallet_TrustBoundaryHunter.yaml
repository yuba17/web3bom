# ============================================================================
# CSW-01: executeWithoutChainIdValidation — upgradeToAndCall code.length check
# es bypasseable con CREATE2 deploy temporal
# ============================================================================
- id: CSW-01
  tier: 1
  type: property
  description: >
    En validateUserOp, cuando se detecta upgradeToAndCall dentro de
    executeWithoutChainIdValidation, se valida que newImplementation.code.length > 0
    en el momento de la validacion. Pero en ERC-4337 v0.6, la validacion y la
    ejecucion ocurren en fases separadas del bundle. Un atacante puede deployar
    un contrato en la address via CREATE2 durante validacion (para pasar el check),
    y luego SELFDESTRUCT antes de la ejecucion, dejando code.length == 0 en el
    momento del upgrade real. Sin embargo, SELFDESTRUCT en post-Cancun ya no borra
    code en la misma tx. Ademas, en ERC-4337 v0.6 validation y execution son en la
    misma tx. Esto hace el ataque impracticable en la practica.
  attack_scenario: >
    1. Atacante firma UserOp con executeWithoutChainIdValidation conteniendo upgradeToAndCall(malicious_addr)
    2. malicious_addr tiene codigo temporal deployado via CREATE2 al momento de validacion
    3. Entre validacion y ejecucion, el codigo desaparece (requiere SELFDESTRUCT pre-Cancun)
    4. upgradeToAndCall apunta a address sin codigo -> proxy queda bricked
    Pero: validation+execution son en la misma tx en v0.6. SELFDESTRUCT deprecated.
    El check real en UUPSUpgradeable._upgradeToAndCallUUPS tambien valida code.
  impact: "Bricking del proxy wallet — fondos atrapados permanentemente. PERO requiere SELFDESTRUCT funcional que ya no existe post-Cancun."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Este invariante verifica que upgradeToAndCall solo puede ejecutarse
    // hacia implementations con codigo valido
    // Simulacion: pre-upgrade, verificar que implementation().code.length > 0
    address impl = CoinbaseSmartWallet(payable(wallet)).implementation();
    gt(impl.code.length, 0, "CSW-01: implementation has no code after upgrade");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 25
  notes: >
    Confidence bajo porque: (1) SELFDESTRUCT ya no borra code en Cancun, (2) validation
    y execution son en la misma tx, (3) UUPSUpgradeable tiene su propio check interno.
    Pero la logica del check en validateUserOp ES redundante/incompleta conceptualmente.
    Mantenemos como referencia de superficie de ataque analizada.
  poc_sketch: ''
  call_stack: 'validateUserOp -> bytes4 == executeWithoutChainIdValidation.selector -> decode calls -> check upgradeToAndCall selector -> mload newImplementation -> code.length check'

# ============================================================================
# CSW-02: payPrefund sends ETH to caller unconditionally — trust boundary violation
# si validateUserOp es llamado por un contrato que NO es el EntryPoint real
# ============================================================================
- id: CSW-02
  tier: 2
  type: property
  description: >
    El modifier payPrefund envia ETH a msg.sender (caller()) incondicionalmente
    al final de validateUserOp. El check onlyEntryPoint compara con la address
    hardcodeada 0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789. Si esta address
    es correcta (es el EntryPoint v0.6 canonico), no hay problema. Pero:
    (1) Si el wallet se deploya en una chain donde el EntryPoint esta en otra
    address, payPrefund enviaria ETH a quien llame. (2) La address esta
    hardcodeada como funcion virtual — un override malicioso podria cambiarla.
    (3) En el contexto de un upgrade via UUPS, una nueva implementation podria
    tener un entryPoint() diferente.
  attack_scenario: >
    Escenario 1 (nueva chain sin EP en esa address): El wallet se deploya en
    una chain donde 0x5FF137D4...2789 no tiene codigo (no es EP). Cualquiera
    puede llamar validateUserOp con missingAccountFunds > 0 y recibir ETH.
    Escenario 2 (upgrade malicioso): Tras upgradeToAndCall, la nueva impl
    overridea entryPoint() a una address controlada. Luego llama validateUserOp
    con missingAccountFunds alto para drenar ETH.
    Mitigacion existente: onlyEntryPoint verifica msg.sender == entryPoint().
    Si no hay codigo en esa address, nadie puede llamar desde ella.
  impact: "Drenaje total del balance ETH del wallet si la address del EntryPoint no es correcta en la chain de deployment."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que entryPoint() tiene codigo (es un contrato real)
    address ep = CoinbaseSmartWallet(payable(wallet)).entryPoint();
    gt(ep.code.length, 0, "CSW-02: entryPoint has no code on this chain");
    // Verificar que es el EntryPoint canonico v0.6
    eq(ep, address(0x5FF137D4b0FDCD49DcA30c7CF57E578a026d2789), "CSW-02: entryPoint is not canonical v0.6");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 30
  notes: >
    El EP v0.6 usa CREATE2 con salt determinista, asi que su address es la misma
    en todas las chains EVM compatibles. Esto reduce enormemente el riesgo. Sin
    embargo, en chains L2 custom o futuras podria no ser asi. Para el bounty
    actual (chains donde ya esta deployado), esto es probably not exploitable.
  poc_sketch: ''
  call_stack: 'validateUserOp [onlyEntryPoint check] -> ... -> payPrefund modifier -> assembly call(gas(), caller(), missingAccountFunds, ...)'

# ============================================================================
# CSW-03: _call permite delegatecall via execute — sin restriccion de target
# ============================================================================
- id: CSW-03
  tier: 1
  type: property
  description: >
    execute() y executeBatch() usan _call() que hace target.call{value}(data).
    No hay restriccion sobre target. Un owner puede llamar execute con
    target=address(wallet) y data=abi.encodeWithSelector(upgradeToAndCall.selector, malicious, "").
    Esto es by design (el wallet se auto-llama). PERO: un owner puede tambien
    hacer execute con target=cualquier_contrato y data conteniendo un callback
    que llame de vuelta al wallet. El wallet NO tiene reentrancy guard.
    Si un owner ejecuta execute(target, 0, data) donde target es un contrato
    que llama back al wallet con execute/executeBatch (como msg.sender es el
    target, no pasaria onlyEntryPointOrOwner SALVO que target sea owner).
    Reentrancy real: el callback tendria msg.sender = target, no el wallet.
    Para pasar _checkOwner, target tendria que ser owner del wallet.
  attack_scenario: >
    1. Owner A registra un contrato malicioso como co-owner (addOwnerAddress)
    2. El contrato malicioso, al ser llamado via execute(), hace callback
       al wallet con executeBatch para drenar todos los fondos
    3. No hay reentrancy guard, asi que el callback se ejecuta normalmente
    4. Pero esto requiere que el contrato sea owner — es self-rug, no un ataque
       a terceros. A menos que un owner haya sido comprometido.
    Mas interesante: execute(address(this), 0, abi.encodeWithSelector(
    this.execute.selector, attacker, balance, "")) — el wallet se llama a si
    mismo. msg.sender == address(this) pasa _checkOwner. Esto es by design.
  impact: "Un owner puede drenar todos los fondos del wallet. Esto es by design para una smart account."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Track ETH balance antes y despues de cada execute
    uint256 balBefore = address(wallet).balance;
    // ... execute happens ...
    uint256 balAfter = address(wallet).balance;
    // No podemos invariar que balance no baja — owners DEBEN poder gastar
    // Lo que si podemos verificar: reentrancy depth never > 1
    // (requiere ghost variable con modifier)
    lte(ghost_callDepth, 1, "CSW-03: reentrancy detected in _call");
  ghost_vars:
    - "uint256 internal ghost_callDepth;"
  validated: false
  priority: low
  confidence: 20
  notes: >
    Despues de analizar profundamente: reentrancy en smart wallets es by design.
    Los owners tienen control total. Un contrato registrado como owner que hace
    callback es un feature, no un bug. La unica amenaza real seria si un owner
    no-contrato pudiera triggear reentrancy — pero EOAs no pueden hacer callbacks.
    Marcado tier 1 solo porque la ausencia de reentrancy guard merece verificacion
    en el contexto de interaccion con MagicSpend.
  poc_sketch: ''
  call_stack: 'execute -> _call -> target.call{value}(data) -> [callback] -> execute -> _call'

# ============================================================================
# CSW-04: isValidSignature (ERC-1271) — replay entre wallets del mismo owner
# sin anti-replay layer correcto
# ============================================================================
- id: CSW-04
  tier: 1
  type: property
  description: >
    ERC1271.isValidSignature aplica replaySafeHash() al hash antes de verificar
    la firma. replaySafeHash usa un domain separator con chainId y address(this).
    Esto previene replay entre diferentes wallets y chains para llamadas via
    isValidSignature. PERO: validateUserOp NO usa replaySafeHash — usa el
    userOpHash directamente (o getUserOpHashWithoutChainId para replayable ops).
    Estos son dos paths de firma completamente separados. Si un protocolo externo
    usa isValidSignature para autorizar una accion, y el hash que firma el owner
    coincide con un userOpHash que el EntryPoint podria computar, habria un
    conflicto. En practica el domain separator de ERC-712 hace esto extremadamente
    improbable. PERO: getUserOpHashWithoutChainId omite chainId intencionalmente.
    Si un protocolo externo no usa EIP-712 y pasa un hash raw a isValidSignature,
    la firma podria ser valida tanto para isValidSignature como para
    executeWithoutChainIdValidation — cross-domain signature confusion.
  attack_scenario: >
    1. Owner firma un UserOp para executeWithoutChainIdValidation (sin chainId)
    2. El hash firmado es getUserOpHashWithoutChainId(userOp) = keccak256(abi.encode(UserOperationLib.hash(userOp), entryPoint()))
    3. isValidSignature recibe hash y aplica replaySafeHash(hash) — resultado diferente
    4. NO hay confusion directa porque isValidSignature siempre wrappea con EIP-712
    5. La unica forma de explotar seria si replaySafeHash(X) == getUserOpHashWithoutChainId(Y) — collision de hash, computacionalmente imposible
  impact: "Si se encontrara una colision: ejecucion de operaciones no autorizadas. Pero requiere collision de keccak256."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que los dos paths de firma producen resultados distintos
    // para el mismo input hash
    bytes32 testHash = keccak256("test");
    bytes32 replaySafe = ERC1271(wallet).replaySafeHash(testHash);
    // getUserOpHashWithoutChainId requiere un UserOp — no se puede comparar directamente
    // Invariante: replaySafeHash(h) != h para todo h
    assertTrue(replaySafe != testHash, "CSW-04: replaySafeHash is identity");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 15
  notes: >
    Tras analisis profundo: los dos paths (isValidSignature con EIP-712 wrapping
    vs validateUserOp con EntryPoint hash) son criptograficamente separados.
    No hay forma practica de explotar esto. La separacion de dominios esta
    correctamente implementada. Confidence muy bajo = probablemente no es un bug.
  poc_sketch: ''
  call_stack: 'isValidSignature -> replaySafeHash(hash) -> _eip712Hash -> keccak256(19 01 || domainSep || hashStruct) vs validateUserOp -> getUserOpHashWithoutChainId -> keccak256(UserOpLib.hash || entryPoint)'

# ============================================================================
# CSW-05: MagicSpend withdrawGasExcess llamado durante UserOp execution
# permite doble-spend del excess via reentrancy en postOp
# ============================================================================
- id: CSW-05
  tier: 1
  type: property
  description: >
    MagicSpend.validatePaymasterUserOp calcula _withdrawable[sender] += amount - maxCost.
    Luego en postOp, calcula withdrawable = _withdrawable[account] + (maxGasCost - actualGasCost)
    y envia todo al account. PERO: entre validatePaymasterUserOp y postOp, el wallet
    ejecuta su UserOp. Si el UserOp incluye una llamada a MagicSpend.withdrawGasExcess(),
    el wallet recibe _withdrawable[wallet] como ETH. Luego en postOp, _withdrawable ya
    fue deleteado, asi que withdrawable = 0 + (maxGasCost - actualGasCost). El wallet
    recibe AMBOS: el excess via withdrawGasExcess Y el gas refund via postOp.
    ESTO ES BY DESIGN segun los docs de MagicSpend — withdrawGasExcess esta pensado
    para ser llamado durante la ejecucion del UserOp para fondear operaciones.
    Pero verificar que no hay double-accounting.
  attack_scenario: >
    1. Wallet envia UserOp con MagicSpend como paymaster, amount = 1 ETH, maxCost = 0.1 ETH
    2. validatePaymasterUserOp: _withdrawable[wallet] += 0.9 ETH
    3. UserOp execution: wallet llama withdrawGasExcess() -> recibe 0.9 ETH, _withdrawable = 0
    4. postOp: withdrawable = 0 + (0.1 - actualGas) = 0.1 - actualGas. Wallet recibe refund.
    5. Total recibido: 0.9 + (0.1 - actualGas) = 1.0 - actualGas. Correcto.
    6. NO hay double spend — el accounting es correcto porque delete se ejecuta antes.
  impact: "Si hubiera double-accounting: drenar MagicSpend de todo su ETH. Pero el accounting parece correcto."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Track MagicSpend balance antes y despues del UserOp completo
    uint256 msBefore = address(magicSpend).balance;
    // ... UserOp con MagicSpend como paymaster ...
    uint256 msAfter = address(magicSpend).balance;
    uint256 expectedCost = withdrawRequest.amount;
    // MagicSpend debe haber perdido exactamente withdrawRequest.amount
    eq(msBefore - msAfter, expectedCost, "CSW-05: MagicSpend balance mismatch");
  ghost_vars:
    - "uint256 internal ghost_magicSpendBalBefore;"
  validated: false
  priority: high
  confidence: 35
  notes: >
    El accounting parece correcto tras analisis manual. withdrawGasExcess deleta
    _withdrawable antes de transferir. postOp recalcula con _withdrawable (ya 0)
    + gas refund. No hay overlap. PERO: si el wallet llama withdraw() (no
    withdrawGasExcess) con un WithdrawRequest separado durante la ejecucion del
    UserOp, podria haber interaccion inesperada con los nonces. Esto merece
    fuzzing dedicado.
  poc_sketch: |
    // Foundry test: UserOp que llama withdrawGasExcess durante ejecucion
    // 1. Deploy wallet + MagicSpend
    // 2. Fund MagicSpend con 10 ETH
    // 3. Crear WithdrawRequest: amount=1 ETH, asset=address(0)
    // 4. UserOp.callData = execute(magicSpend, 0, abi.encodeWithSelector(MagicSpend.withdrawGasExcess.selector))
    // 5. Verificar que MagicSpend.balance disminuyo exactamente en 1 ETH (no mas)
  call_stack: 'EntryPoint.handleOps -> validatePaymasterUserOp [_withdrawable += excess] -> wallet.executeWithoutChainIdValidation/execute -> MagicSpend.withdrawGasExcess [delete _withdrawable, transfer] -> postOp [_withdrawable (now 0) + gas refund]'

# ============================================================================
# CSW-06: MagicSpend _validateRequest — maxWithdrawDenominator division por cero
# o denominator = 1 permite drenar todo el balance en una sola tx
# ============================================================================
- id: CSW-06
  tier: 1
  type: property
  description: >
    MagicSpend._validateRequest calcula maxAllowed = address(this).balance / maxWithdrawDenominator.
    Si maxWithdrawDenominator == 0, esto causa division por cero (revert en Solidity 0.8+).
    Si maxWithdrawDenominator == 1, maxAllowed = address(this).balance entero — un
    solo withdraw puede drenar todo. El constructor acepta cualquier valor para
    maxWithdrawDenominator_ (incluyendo 0 y 1). setMaxWithdrawDenominator tambien
    acepta 0 — lo cual brickearia todas las native asset withdrawals (DoS permanente).
    Pero esto requiere que el owner sea malicioso o comprometido.
  attack_scenario: >
    Path A (DoS): Owner (accidentalmente o maliciosamente) llama setMaxWithdrawDenominator(0).
    Todas las llamadas a withdraw/validatePaymasterUserOp con asset=address(0) revertiran
    por division por cero. ETH queda atrapado (ownerWithdraw sigue funcionando).
    Path B (drain): Owner pone maxWithdrawDenominator=1. Un usuario con un
    WithdrawRequest valido puede drenar todo el balance de MagicSpend en una tx.
    Path C (ataque via compromiso): Si la private key del owner se compromete,
    el atacante puede firmar WithdrawRequests por el balance completo si denom=1.
  impact: "Path A: DoS de withdrawals nativas. Path B: drenaje completo por usuario con request valido."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // maxWithdrawDenominator nunca debe ser 0 (DoS) ni 1 (drain total)
    uint256 denom = MagicSpend(payable(ms)).maxWithdrawDenominator();
    gt(denom, 0, "CSW-06: maxWithdrawDenominator is zero — DoS");
    gt(denom, 1, "CSW-06: maxWithdrawDenominator is 1 — full drain possible");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Esto es mas bien una configuracion insegura que un bug de codigo. El owner
    tiene control total sobre este parametro. Sin embargo, la falta de validacion
    minima en _setMaxWithdrawDenominator es un defecto de defense-in-depth.
    Para un bounty, esto probablemente seria Low/QA porque requiere owner malicioso.
  poc_sketch: ''
  call_stack: '_validateRequest -> address(this).balance / maxWithdrawDenominator'

# ============================================================================
# CSW-07: MagicSpend.withdraw() no verifica asset en _validateRequest para
# non-ETH — bypass de maxWithdraw check para ERC-20
# ============================================================================
- id: CSW-07
  tier: 1
  type: property
  description: >
    En _validateRequest, el check de maxWithdrawDenominator SOLO se aplica cuando
    withdrawRequest.asset == address(0) (ETH). Para ERC-20 tokens, no hay limite
    de withdraw amount. Si MagicSpend tiene un balance grande de un ERC-20 token
    (depositado por el owner via ownerWithdraw o transfer directo), un usuario con
    un WithdrawRequest firmado para ese token por amount = balance total puede
    drenar todo el token en una sola llamada a withdraw().
    El check: if (withdrawRequest.asset == address(0) && withdrawRequest.amount > maxAllowed)
    Solo aplica para ETH. ERC-20 withdrawals no tienen rate limit.
  attack_scenario: >
    1. MagicSpend tiene 1M USDC (depositados por el owner para pagos)
    2. Owner firma WithdrawRequest para user X: asset=USDC, amount=1M, nonce=0
    3. User X llama withdraw(request) — _validateRequest no limita ERC-20 amount
    4. _withdraw(USDC, user, 1M) — transfiere 1M USDC de una vez
    5. No es un bug si el owner firmo intencionalmente por 1M, pero si el signer
       backend tiene un bug y firma amounts sin validar, no hay safety net on-chain.
  impact: "Drenaje total de tokens ERC-20 en MagicSpend con un solo WithdrawRequest firmado. Requiere firma del owner, pero no hay rate limiting on-chain."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el amount de un withdraw ERC-20 esta limitado
    // (Actualmente NO hay limite — esto es un design choice, no necessarily un bug)
    // Si MagicSpend guarda ERC-20:
    uint256 tokenBal = IERC20(token).balanceOf(address(magicSpend));
    // No se puede invariar sin saber el "max intended" — es un admin trust issue
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Esto es by design — el owner firma cada withdraw request individualmente,
    asi que el amount esta implicitamente autorizado. El maxWithdrawDenominator
    solo existe para ETH porque ETH withdrawals afectan la reputation del
    paymaster en el EntryPoint (si se queda sin gas para postOp). Para ERC-20
    no hay esa restriccion. Probablemente Low/QA.
  poc_sketch: ''
  call_stack: 'withdraw -> _validateRequest [asset != address(0) → skip maxAllowed check] -> _withdraw(asset, to, amount) -> SafeTransferLib.safeTransfer'

# ============================================================================
# CSW-08: SignatureCheckerLib.isValidSignatureNow acepta smart contract signers
# — un contrato owner malicioso puede cambiar su firma dinamicamente
# ============================================================================
- id: CSW-08
  tier: 1
  type: property
  description: >
    _isValidSignature usa SignatureCheckerLib.isValidSignatureNow para verificar
    firmas de owners que son Ethereum addresses. Esta libreria primero intenta
    ecrecover, y si falla (porque owner es contrato), hace una llamada ERC-1271
    isValidSignature al owner. Esto significa que un contrato registrado como
    owner puede implementar isValidSignature de forma maliciosa — aceptar firmas
    arbitrarias, cambiar su logica de validacion dinamicamente, o incluso retornar
    true para cualquier hash. Si el wallet tiene un contrato como co-owner,
    ese contrato tiene control total sobre que operaciones se autorizan.
    ADEMAS: esto interactua con el ERC-1271 del propio wallet — si un protocolo
    externo llama wallet.isValidSignature(hash, sig), y sig contiene ownerIndex
    apuntando a un contrato-owner, el wallet delega la validacion al contrato-owner
    via una cadena de ERC-1271 calls.
  attack_scenario: >
    1. Wallet tiene 2 owners: EOA (index 0) y contrato ProxyOwner (index 1)
    2. ProxyOwner es upgradeable y controlado por un tercero
    3. El tercero upgradea ProxyOwner para que isValidSignature retorne true para todo
    4. Ahora cualquiera puede craftar un UserOp con signature={ownerIndex:1, signatureData:anything}
    5. validateUserOp retorna 0 (valid) → el UserOp se ejecuta → fondos drenados
    6. Alternativa: ProxyOwner hace time-bomb — acepta firmas arbitrarias despues de block X
  impact: "Control total del wallet si un contrato-owner es comprometido. Fondos drenados completamente."
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // Para cada owner que es contrato, verificar que su isValidSignature
    // no es trivialmente bypasseable
    // Esto es un test de integracion, no un invariante estatico
    bytes memory ownerBytes = MultiOwnable(wallet).ownerAtIndex(i);
    if (ownerBytes.length == 32) {
        address owner = address(uint160(uint256(bytes32(ownerBytes))));
        if (owner.code.length > 0) {
            // owner es contrato — flag para manual review
            // No se puede verificar automaticamente que su isValidSignature es segura
            ghost_contractOwnerCount++;
        }
    }
    // Invariante: si no hay contract owners, este vector no aplica
    eq(ghost_contractOwnerCount, 0, "CSW-08: contract owner detected — manual review needed");
  ghost_vars:
    - "uint256 internal ghost_contractOwnerCount;"
  validated: false
  priority: high
  confidence: 55
  notes: >
    Este es un vector real pero requiere que el usuario haya registrado un contrato
    como owner deliberadamente. addOwnerAddress no previene registrar contratos.
    Para un bounty, esto podria ser Medium si se demuestra que el SDK/frontend
    de Coinbase permite registrar contratos como owners sin advertencia. Si
    solo EOAs se registran en practica, el impacto es teorico.
    SignatureCheckerLib acepta ERC-1271 por diseno — es un feature documentado.
  poc_sketch: |
    // 1. Deploy MaliciousOwner que acepta cualquier firma
    // 2. Registrarlo como owner del wallet
    // 3. Craftar UserOp con ownerIndex del MaliciousOwner
    // 4. Firmar con cualquier key — la firma sera aceptada
    // 5. UserOp drena todos los fondos
  call_stack: '_isValidSignature -> ownerAtIndex(sigWrapper.ownerIndex) -> [32 bytes] -> SignatureCheckerLib.isValidSignatureNow(owner, hash, signatureData) -> [if owner is contract] -> owner.isValidSignature(hash, sig)'

# ============================================================================
# CSW-09: executeWithoutChainIdValidation — canSkipChainIdValidation whitelist
# puede ser insuficiente si upgradeToAndCall se usa para ejecutar codigo arbitrario
# ============================================================================
- id: CSW-09
  tier: 1
  type: property
  description: >
    canSkipChainIdValidation whitelist permite upgradeToAndCall en modo cross-chain.
    upgradeToAndCall(address newImpl, bytes calldata data) cambia la implementation
    Y llama newImpl.delegatecall(data). El `data` puede ser CUALQUIER funcion de
    la nueva implementation. Esto significa que una operacion cross-chain replayable
    no solo cambia la implementation sino que ejecuta codigo arbitrario via delegatecall
    en el contexto del proxy. Si el owner firma un upgradeToAndCall con data que
    transfiere fondos (ej: execute(attacker, balance, "")), esa operacion se
    replayea en TODAS las chains donde el wallet existe.
    Peor aun: validateUserOp solo verifica code.length > 0 del newImplementation,
    no verifica que sea una CoinbaseSmartWallet valida. El delegatecall con data
    arbitrario podria ejecutar cualquier logica.
  attack_scenario: >
    1. Owner firma UserOp cross-chain: executeWithoutChainIdValidation([
         upgradeToAndCall(legitimateImpl, abi.encodeWithSelector(execute.selector, attacker, 1 ether, ""))
       ])
    2. La nueva implementation tiene execute(), asi que el delegatecall ejecuta
       execute(attacker, 1 ether, "") en el contexto del proxy
    3. Esto transfiere 1 ETH al atacante en CADA chain donde se replayea
