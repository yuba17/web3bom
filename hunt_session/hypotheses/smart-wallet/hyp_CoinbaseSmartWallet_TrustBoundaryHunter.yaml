# ============================================================================
# CSW-12: MagicSpend validatePaymasterUserOp — _withdrawable overflow si
# multiples UserOps del mismo sender en el mismo bundle
# ============================================================================
- id: CSW-12
  tier: 2
  type: property
  description: >
    _withdrawable[userOp.sender] += withdrawAmount - maxCost usa += (acumulacion).
    Si el bundler incluye multiples UserOps del mismo sender con MagicSpend como
    paymaster en el mismo bundle, _withdrawable se acumula. Luego en postOp, CADA
    postOp ejecuta: withdrawable = _withdrawable[account] + (maxGasCost - actualGasCost);
    delete _withdrawable[account]; transfer withdrawable. El primer postOp transferiria
    el acumulado de TODOS los validatePaymasterUserOp, y los siguientes postOps
    transferirian solo el gas refund. Esto podria causar que MagicSpend envie mas
    ETH del que deberia en el primer postOp. Sin embargo, la EIP-4337 specification
    ejecuta validate-execute-postOp por cada UserOp secuencialmente, no validate-all
    luego execute-all. Asi que el primer postOp transferiria el excess del primer
    UserOp correctamente, y _withdrawable se resetea a 0 antes del segundo validate.
    NOTA: En EntryPoint v0.6, handleOps procesa ops secuencialmente. Pero hay un
    edge case: si el primer validate incrementa _withdrawable, y antes de postOp
    el segundo validate tambien incrementa, entonces el primer postOp transferiria
    ambos excesses.
  attack_scenario: >
    1. Atacante crea 2 UserOps: op1 (withdraw 1 ETH, maxCost 0.1) y op2 (withdraw 1 ETH, maxCost 0.1)
    2. Bundler incluye ambos en handleOps([op1, op2])
    3. EntryPoint v0.6: validate op1 → _withdrawable += 0.9; validate op2 → _withdrawable += 0.9 = 1.8
    4. Execute op1 → Execute op2
    5. postOp op1: withdrawable = 1.8 + (0.1 - gasUsed1); delete _withdrawable; transfer 1.8+refund
    6. postOp op2: withdrawable = 0 + (0.1 - gasUsed2); transfer refund solo
    7. Wallet recibe: 1.8 + refund1 + refund2. Deberia recibir: 0.9 + refund1 + 0.9 + refund2 = 1.8 + refunds
    8. Total es el mismo! No hay double spend. Los fondos se redistribuyen pero el total es correcto.
    9. PERO: el maxWithdrawDenominator check se evalua en _validateRequest, y
       address(this).balance va disminuyendo con cada postOp. El segundo validate
       podria pasar el balance check antes de que el primer postOp haya drenado fondos.
  impact: "Posible bypass del maxWithdrawDenominator rate limiting si multiples ops del mismo sender se validan antes de cualquier postOp en el mismo bundle."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que despues de un bundle con N ops del mismo sender,
    // MagicSpend balance disminuyo exactamente en sum(amounts)
    uint256 totalRequested = ghost_op1Amount + ghost_op2Amount;
    uint256 balanceDecrease = ghost_msBefore - address(magicSpend).balance;
    eq(balanceDecrease, totalRequested, "CSW-12: MagicSpend drained more than requested");
  ghost_vars:
    - "uint256 internal ghost_msBefore;"
    - "uint256 internal ghost_op1Amount;"
    - "uint256 internal ghost_op2Amount;"
  validated: false
  priority: high
  confidence: 45
  notes: >
    La pregunta clave es el orden de ejecucion en EntryPoint v0.6 handleOps:
    si es (validate1, validate2, execute1, execute2, postOp1, postOp2) entonces
    HAY un bug en el rate limiting — ambos validates ven el balance completo de
    MagicSpend. Si es (validate1, execute1, postOp1, validate2, execute2, postOp2)
    entonces no hay bug. Segun el codigo del EntryPoint v0.6, la fase de validacion
    es separada de la ejecucion (innerHandleOp). Esto CONFIRMA que multiples
    validates ocurren antes de los postOps — el rate limiting IS bypasseable.
    Este es el invariante mas prometedor para investigar.
  poc_sketch: |
    // 1. Deploy MagicSpend con 10 ETH, maxWithdrawDenominator = 10 (max 1 ETH per op)
    // 2. Crear 10 UserOps del mismo wallet, cada uno con withdraw amount = 1 ETH
    // 3. Bundle todos en handleOps — 10 validates pasan (balance es 10 ETH para cada uno)
    // 4. Despues de todos los postOps: MagicSpend tiene 0 ETH
    // 5. maxWithdrawDenominator fue completamente bypaseado
  call_stack: 'EntryPoint.handleOps -> [VALIDATION LOOP: for each op: validatePaymasterUserOp → _validateRequest checks balance/denom → _withdrawable += excess] -> [EXECUTION LOOP: for each op: innerHandleOp → execute → postOp → transfer]'

# ============================================================================
# CSW-TB-01: EIP-7702 delegated EOA — initialize() frontrunnable si storage vacio
# ============================================================================
- id: CSW-TB-01
  tier: 1
  type: property
  description: >
    Con EIP-7702 (Prague hardfork), las EOAs pueden delegar su ejecucion a la
    implementacion de CoinbaseSmartWallet. Cuando una EOA hace esta delegacion,
    su storage es VACIO — nextOwnerIndex = 0, sin owners registrados.
    La funcion initialize() verifica: if (nextOwnerIndex() != 0) revert Initialized().
    Con storage vacio, nextOwnerIndex == 0, y CUALQUIER persona puede llamar
    initialize([abi.encode(attacker)]) en la EOA delegada ANTES que el dueno
    legitimo inicialice sus owners. El atacante se convierte en owner de la EOA.
    Este es un ataque de front-running atomico: el usuario habilita EIP-7702,
    el atacante en el mismo bloque llama initialize([attacker]), y luego llama
    execute() para drenar todos los fondos del EOA.
  attack_scenario: >
    1. Victima envía tx EIP-7702 para delegar su EOA a CoinbaseSmartWallet impl.
    2. Atacante monitorea mempool. Detecto la tx de EIP-7702.
    3. Atacante front-runea con initialize([abi.encode(attacker_address)]).
    4. nextOwnerIndex era 0 → pasa el guard → attacker registrado como owner.
    5. Atacante llama execute(attacker, eoa.balance, "").
    6. La victima pierde todos sus fondos en el mismo bloque.
  impact: >
    Perdida total de fondos de la EOA comprometida via EIP-7702. Critico porque
    afecta a todos los usuarios que adopten EIP-7702 con CoinbaseSmartWallet
    sin inicializar atomicamente en la misma tx. A medida que EIP-7702 se despliega
    post-Prague, este vector se vuelve extremadamente relevante.
  impact_rating: Critical
  likelihood: High (post-EIP-7702)
  severity_final: Critical
  solidity: |
    // Un wallet EIP-7702 recien delegado debe ser inicializado atomicamente
    // o protegido contra frontrunning de initialize()
    // Invariante: si nextOwnerIndex == 0, nadie puede llamar initialize() excepto
    // el propio EOA owner (msg.sender == address(this))
    if (wallet.nextOwnerIndex() == 0) {
        // VULNERABLE: cualquiera puede inicializar
        t(false, "CSW-TB-01: initialize() callable by anyone when storage is empty (EIP-7702 frontrun)");
    }
    // La mitigacion correcta seria: require msg.sender == address(this) en initialize()
    // O usar un initializer que solo puede ser llamado atomicamente con el set EIP-7702
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 82
  notes: >
    Alta confianza porque: (1) el patron es exactamente igual a otros frontruns de
    inicializacion en proxies, (2) EIP-7702 crea exactamente este estado de storage
    vacio, (3) initialize() no tiene ninguna restriccion de quien puede llamarla
    mas alla del check nextOwnerIndex() != 0. La mitigacion requeriria cambio de codigo.
    IMPORTANTE: Este finding solo es explotable post-EIP-7702 (Prague hardfork ~2025/26).
    Para el bounty actual debe verificarse si el scope incluye EIP-7702.
  poc_sketch: |
    // Foundry fork test (post-EIP-7702):
    // 1. vm.createFork("mainnet_post_prague");
    // 2. address eoa = makeAddr("victim"); deal(eoa, 10 ether);
    // 3. Simular tx EIP-7702: eoa delega codigo a wallet_implementation
    // 4. attacker llama CoinbaseSmartWallet(payable(eoa)).initialize([abi.encode(attacker)])
    // 5. assertTrue(wallet.isOwnerAddress(attacker))
    // 6. attacker llama execute(attacker, 10 ether, "")
    // 7. assertEq(attacker.balance, 10 ether)
  call_stack: 'EIP-7702 delegation → empty storage (nextOwnerIndex=0) → attacker calls initialize([attacker]) → _initializeOwners → attacker is owner → execute(attacker, balance, "") → _call drains funds'

# ============================================================================
# CSW-TB-02: Self-call privilege — address(this) en _checkOwner bypaseable desde
# cualquier path que tenga msg.sender == address(wallet)
# ============================================================================
- id: CSW-TB-02
  tier: 1
  type: property
  description: >
    _checkOwner() en MultiOwnable permite pasar si msg.sender == address(this).
    Esto significa que cualquier llamada originada DESDE el wallet (ej: via execute
    o executeWithoutChainIdValidation) puede a su vez llamar funciones onlyOwner
    del wallet mismo — incluyendo addOwnerAddress, removeOwnerAtIndex, upgradeToAndCall.
    En un escenario multi-owner, un owner individual puede unilateralmente modificar
    el conjunto de owners sin consenso del resto, simplemente llamando:
    execute(address(wallet), 0, abi.encodeCall(addOwnerAddress, [new_owner]))
    O mas destructivo:
    execute(address(wallet), 0, abi.encodeCall(removeOwnerAtIndex, [other_owner_index, other_owner_bytes]))
    Esto contradice la asuncion de que multi-owner implica multi-sig.
    El protocolo NO garantiza multi-sig semantics — cualquier owner puede actuar solo.
  attack_scenario: >
    Escenario — Wallet custodiado por empresa con 3 owners (Alice, Bob, Carol):
    1. Alice se vuelve maliciosa (compromiso de key o insider).
    2. Alice llama execute(wallet, 0, removeOwnerAtIndex(bob_idx, bob_bytes)).
    3. Bob es removido. Alice llama execute(wallet, 0, removeOwnerAtIndex(carol_idx, carol_bytes)).
    4. Carol es removida. Alice queda como unico owner.
    5. Alice drena todos los fondos del wallet.
    Nota: Este es un ataque REAL si aplicaciones asumen que multi-owner = multi-sig.
    Si el frontend/SDK de Coinbase muestra "3 of 3 owners required", pero el contrato
    permite cualquier owner actuar solo, hay una discrepancia de trust model.
  impact: >
    En contextos multi-owner donde se asume multi-sig: robo total de fondos por parte
    de cualquier owner individual. El impacto es proporcional al valor custodiado.
    Para wallets corporativos o DAO treasuries con CoinbaseSmartWallet, esto es critico.
  impact_rating: High
  likelihood: Medium
  severity_final: High (contexto-dependiente)
  solidity: |
    // En un sistema multi-owner, ningun owner individual deberia poder remover a otro
    // sin consenso. Invariante (solo aplicable si el protocolo promete multi-sig):
    uint256 ownerCountBefore = wallet.ownerCount();
    // ... un owner ejecuta removeOwnerAtIndex via execute() ...
    uint256 ownerCountAfter = wallet.ownerCount();
    // Si esto pasa con una sola firma de owner, el modelo multi-sig esta roto
    t(ownerCountAfter == ownerCountBefore, "CSW-TB-02: single owner removed another owner (multi-sig violated)");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    Confidence 75% porque: la explotabilidad depende de si el protocolo/aplicacion
    promete semantica multi-sig. Si el modelo es "any owner can act", esto es by design.
    Pero si Coinbase presenta esto como una cuenta multi-sig (para empresas, por ej),
    es un bug critico de trust model. Requiere investigar la documentacion del producto.
    Solodit H-01 identifica el cross-chain replay como un vector; este es el vector
    dentro de una misma chain que no necesita replay.
  poc_sketch: |
    // test: alice (owner 0) puede remover a bob (owner 1) con una sola tx
    address alice = makeAddr("alice");
    address bob = makeAddr("bob");
    // deploy wallet con alice y bob como owners
    // alice firma execute(wallet, 0, removeOwnerAtIndex(1, bobBytes))
    // verificar que bob ya no es owner — esto debe ser IMPOSIBLE en multi-sig
  call_stack: 'Alice calls execute(address(wallet), 0, removeOwnerAtIndex_calldata) → onlyEntryPointOrOwner (Alice is owner) → _call(address(this), 0, data) → removeOwnerAtIndex → _checkOwner (msg.sender == address(this) → pass) → _removeOwnerAtIndex'

# ============================================================================
# CSW-TB-03: MagicSpend maxWithdrawDenominator bypass via bundle multi-op
# rate limiting es ineficaz en bundles con multiple UserOps del mismo sender
# ============================================================================
- id: CSW-TB-03
  tier: 1
  type: property
  description: >
    MagicSpend implementa rate limiting via maxWithdrawDenominator: el maximo
    withdraw por UserOp es address(this).balance / maxWithdrawDenominator.
    PERO: En EntryPoint v0.6, handleOps() procesa las UserOps en dos fases separadas:
    1. FASE DE VALIDACION: para CADA op, llama validatePaymasterUserOp (y _validateRequest
       que verifica el balance/denom). En esta fase, el balance de MagicSpend NO ha
       cambiado aun — todos los validates ven el mismo balance completo.
    2. FASE DE EJECUCION: para CADA op, ejecuta el calldata del wallet y luego postOp.
    Si un bundler malicioso incluye N UserOps del mismo wallet en un bundle, TODOS los
    N validates pasan con el balance completo (porque postOp no ha corrido aun), pero
    en total el wallet retira N * (balance/denom). Con denom=10 y N=10, retira 100%
    del balance de MagicSpend — el rate limit es completamente bypaseado.
    El bundler podria ser el mismo atacante (bundlers pueden ser permisionless).
  attack_scenario: >
    Setup: MagicSpend tiene 10 ETH, maxWithdrawDenominator = 10 (max 1 ETH / op).
    1. Atacante crea 10 UserOps con WithdrawRequest.amount = 1 ETH cada uno.
    2. Atacante es bundler, incluye todas en handleOps([op1..op10]).
    3. FASE VALIDATE: op1 validate → balance=10, maxAllowed=1 ETH → PASS, _withdrawable += 0.9;
       op2 validate → balance SIGUE siendo 10 ETH (postOp no corrio!) → PASS, _withdrawable += 0.9;
       ... op10 validate → balance=10, maxAllowed=1 → PASS.
       Total _withdrawable[wallet] = 9 ETH (10 ops * 0.9 ETH).
    4. FASE EXECUTE: cada postOp transfiere _withdrawable al wallet.
       postOp1: _withdrawable = 9 ETH → transfiere 9 + refund_gas_1 → delete.
       postOp2..10: _withdrawable = 0 → transfiere solo refund_gas.
    5. Resultado: wallet recibio 9 ETH + gas refunds. MagicSpend perdio ~10 ETH.
    6. El rate limit de 1 ETH/op fue bypaseado — se retiro 10x el limite en una tx.
    NOTA: La suma del _withdrawable es acumulativa — el primer postOp transfiere todo.
    Esto no es un double-spend sino un bypass del rate limiter de single-op.
  impact: >
    Drenaje completo de MagicSpend en una sola transaccion de bundle usando N UserOps.
    El atacante necesita ser bundler o coludirse con uno. Loss directa para Coinbase
    como operador de MagicSpend. Con 10 ETH en MagicSpend, la perdida es 10 ETH.
  impact_rating: High
  likelihood: Medium
  severity_final: High
  solidity: |
    // El rate limiting debe ser efectivo por bundle, no solo por op
    // Invariante: despues de cualquier bundle, MagicSpend.balance >= balance_antes * (1 - 1/denom)
    uint256 balBefore = address(magicSpend).balance;
    uint256 denom = magicSpend.maxWithdrawDenominator();
    // ... bundle procesado ...
    uint256 balAfter = address(magicSpend).balance;
    uint256 maxAllowedDrain = balBefore / denom;
    // Esto FALLA si N ops se bundlean — el drain puede ser N * maxAllowedDrain
    lte(balBefore - balAfter, maxAllowedDrain * 2, "CSW-TB-03: maxWithdrawDenominator bypassed via multi-op bundle");
  ghost_vars:
    - "uint256 internal ghost_msBefore;"
    - "uint256 internal ghost_msAfter;"
  validated: false
  priority: high
  confidence: 72
  notes: >
    Confidence 72% porque: el analisis del EntryPoint v0.6 handleOps muestra que
    la validacion y ejecucion son en loops separados. Sin embargo, el comportamiento
    exacto de _withdrawable con multiples postOps necesita verificacion via fork test.
    Si el primer postOp transfiere el total acumulado y los siguientes transfieren 0,
    el dinero no se duplica — pero el rate limiter SI fue bypaseado. El by design
    del rate limiter es prevenir que una sola op drene demasiado, no que N ops no
    puedan hacer lo mismo. Merece investigacion urgente.
  poc_sketch: |
    // Foundry fork test:
    // 1. vm.createFork("mainnet"); fund MagicSpend(10 ETH), denom=10
    // 2. Crear 10 WithdrawRequests validos (firmados por Coinbase owner) amount=1 ETH each
    // 3. Construir 10 UserOps con MagicSpend como paymaster
    // 4. Llamar EntryPoint.handleOps([op1..op10], bundler)
    // 5. Verificar: address(wallet).balance aumento en ~10 ETH
    //    address(magicSpend).balance = ~0 ETH
    //    El rate limit de 1 ETH/op fue bypaseado completamente
  call_stack: 'handleOps([op1..op10]) → VALIDATION_LOOP: [validatePaymasterUserOp op1 → _validateRequest (balance=10, maxAllowed=1) → PASS → _withdrawable+=0.9; ... op10 → PASS → _withdrawable+=0.9] → EXECUTION_LOOP: [innerHandleOp op1 → postOp → withdrawable=9+refund → transfer → delete; op2..10 → postOp → withdrawable=0+refund → transfer]'

# ============================================================================
# CSW-TB-04: isValidSignature revierte en vez de retornar 0xffffffff para
# ownerIndex apuntando a slot eliminado — viola ERC-1271
# ============================================================================
- id: CSW-TB-04
  tier: 2
  type: property
  description: >
    _isValidSignature (L318-365 en CoinbaseSmartWallet) accede a ownerAtIndex(sigWrapper.ownerIndex).
    Si el ownerIndex corresponde a un owner que fue removido via removeOwnerAtIndex,
    ownerAtIndex[index] retorna bytes vacios (mapping con default value = empty bytes).
    El codigo verifica ownerBytes.length == 32 (no) y ownerBytes.length == 64 (no),
    y luego llama revert InvalidOwnerBytesLength(ownerBytes).
    La funcion publica isValidSignature() en ERC1271.sol llama _isValidSignature —
    si revierte, la funcion entera revierte en vez de retornar 0xffffffff.
    El estandar ERC-1271 NO especifica que isValidSignature puede revert, y muchos
    callers (marketplaces, protocolos DeFi) no usan try/catch. Esto puede causar DoS
    para cualquier protocolo que valide firmas de este wallet cuando el owner fue removido.
  attack_scenario: >
    1. Alice tiene ordenes activas en OpenSea firmadas con su wallet CoinbaseSmartWallet.
    2. Alice es removida del wallet (multi-owner scenario — Bob la remueve).
    3. Alguien intenta liquidar/cancelar la orden de Alice en OpenSea.
    4. OpenSea llama wallet.isValidSignature(orderHash, sig_with_alice_ownerIndex).
    5. _isValidSignature → ownerAtIndex(alice_index) = bytes("") → revert InvalidOwnerBytesLength.
    6. OpenSea no usa try/catch → la tx de cancelacion revierte → la orden queda activa.
    7. Si el precio sube/baja, la orden puede ejecutarse en condiciones desfavorables.
    Alternativa: un atacante guarda firmas validas de owners pasados y las usa para
    causar DoS sistematico en cualquier validacion de firma del wallet.
  impact: >
    DoS de ERC-1271 para contratos que no usan try/catch (mayoria de marketplaces).
    En el peor caso: ordenes activas que no pueden ser canceladas correctamente.
    Perdida potencial por ordenes ejecutadas a precios obsoletos.
  impact_rating: Medium
  likelihood: Medium
  severity_final: Medium
  solidity: |
    // isValidSignature NUNCA debe revertir — debe retornar 0xffffffff para cualquier
    // input invalido incluyendo ownerIndex de owners eliminados
    bytes memory invalidSig = abi.encode(uint256(9999), bytes(""));
    try CoinbaseSmartWallet(payable(wallet)).isValidSignature(bytes32(0), invalidSig) returns (bytes4 result) {
        eq(uint32(result), 0xffffffff, "CSW-TB-04: should return 0xffffffff for invalid owner index");
    } catch {
        t(false, "CSW-TB-04: isValidSignature reverted instead of returning 0xffffffff");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 88
  notes: >
    Alta confianza porque el path de revert es claro en el codigo: ownerAtIndex de
    un slot eliminado devuelve bytes vacios, y _isValidSignature hace revert con
    InvalidOwnerBytesLength para ownerBytes.length != 32 && != 64. El estandar
    ERC-1271 (EIP-1271) no prohibe revert pero la practica comun y el Solady
    reference implementation retornan 0xffffffff. Muchos callers asumen no-revert.
    Severidad depende del ecosistema de callers de este wallet.
  poc_sketch: |
    // Test simple:
    // 1. Deploy wallet con owner Alice
    // 2. Add Bob como owner (index 1)
    // 3. Remove Bob (index 1 ahora es empty)
    // 4. Llamar wallet.isValidSignature(someHash, abi.encode(1, someSignature))
    // 5. ESPERADO: retorna 0xffffffff
    // 6. REAL: revierte con InvalidOwnerBytesLength(bytes(""))
  call_stack: 'isValidSignature(hash, sig) → replaySafeHash(hash) → _isValidSignature(replaySafeHash, sig) → abi.decode(sig, SignatureWrapper) → ownerAtIndex(sigWrapper.ownerIndex) [returns empty bytes for removed owner] → ownerBytes.length != 32 && != 64 → revert InvalidOwnerBytesLength([])'

# ============================================================================
# CSW-TB-05: MagicSpend.withdraw() fee-on-transfer token — nonce consumido
# pero usuario recibe menos que el amount solicitado
# ============================================================================
- id: CSW-TB-05
  tier: 2
  type: property
  description: >
    MagicSpend._validateRequest marca el nonce como usado y emite el evento
    MagicSpendWithdrawal ANTES de ejecutar _withdraw. _withdraw llama
    SafeTransferLib.safeTransfer(asset, to, amount) que transfiere exactamente
    `amount` tokens. Para tokens fee-on-transfer (FoT), el recipient recibe
    amount - fee, no amount.
    El nonce ya fue consumido. El usuario recibio menos que lo prometido. La
    diferencia (el fee) se queda en MagicSpend (no se puede reclamar porque el
    nonce ya se uso). En la practica, Coinbase solo soporta ETH en el contexto
    ERC-4337. Pero withdraw() directo soporta tokens ERC-20 arbitrarios.
    Si algun token FoT es soportado, hay perdida sistematica por fees.
  attack_scenario: >
    1. MagicSpend soporta USDC (no FoT actualmente, pero si algun token FoT es listado).
    2. Coinbase firma WithdrawRequest: asset=FoT_token, amount=1000.
    3. User llama withdraw(request). _validateRequest: nonce marcado como usado.
    4. _withdraw: safeTransfer(FoT_token, user, 1000). FoT tiene 1% fee.
    5. User recibe 990 tokens. Los 10 tokens (fee) quedan en MagicSpend.
    6. El nonce ya fue usado — user no puede reclamar los 10 tokens perdidos.
    7. Estos 10 tokens quedan atrapados en MagicSpend hasta que el owner los rescate
       via ownerWithdraw (perdida temporal/permanente para el usuario).
  impact: >
    Perdida de tokens fee-on-transfer para usuarios. El fee queda atrapado en
    MagicSpend. Solo relevante si MagicSpend soporta tokens FoT (actualmente
    solo ETH en ERC-4337, pero withdraw() acepta cualquier ERC-20).
  impact_rating: Low
  likelihood: Low
  severity_final: Low
  solidity: |
    // Para cada withdraw de token ERC-20, el usuario debe recibir exactamente amount
    uint256 balBefore = IERC20(token).balanceOf(user);
    // ... withdraw(request) ...
    uint256 balAfter = IERC20(token).balanceOf(user);
    eq(balAfter - balBefore, withdrawRequest.amount, "CSW-TB-05: FoT token — received less than requested");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 65
  notes: >
    Confidence moderado porque: el contrato usa SafeTransferLib que no verifica
    el balance delta — solo verifica que el transfer no reverte. Para FoT tokens,
    el usuario recibe menos. La severidad es baja porque (1) actualmente MagicSpend
    solo usa ETH en contexto ERC-4337, y (2) los withdraw() directos de ERC-20
    son edge cases. Si Coinbase expande MagicSpend a multi-token, esto se vuelve
    mas relevante.
  poc_sketch: |
    // Test con token FoT sintetico:
    // 1. Deploy FoT token con 1% fee en transfer
    // 2. Fund MagicSpend con 1000 FoT
    // 3. Owner firma WithdrawRequest: asset=FoT, amount=1000
    // 4. User llama withdraw(request)
    // 5. assertEq(FoT.balanceOf(user), 990) // recibe 990, no 1000
    // 6. assertEq(FoT.balanceOf(magicSpend), 10) // 10 quedan atrapados
    // 7. nonce ya usado — user no puede reclamar los 10
  call_stack: '_validateRequest → _nonceUsed[nonce][account] = true (ANTES del transfer) → _withdraw → SafeTransferLib.safeTransfer(asset, to, amount) → FoT.transfer reduces amount by fee → user receives less'

false_positives:
- hunter: TrustBoundaryHunter
  id: CSW-FP-01
  reason: >
    Reentrancy en _call: analizado y descartado. _call usa .call (no delegatecall),
    y todos los callers estan protegidos por onlyEntryPoint o onlyEntryPointOrOwner.
    Un owner puede hacer reentrancy, pero eso es by design — los owners tienen
    control total. No es una vulnerabilidad.
  investigated_at: '2026-03-27T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: erc4337-smart-accounts.md
    content: "Reentrancy en smart account _call() no es bug — owners tienen control total por diseno. Solo es relevante si un non-owner puede triggear reentrancy."
    briefing_update_applied: false

