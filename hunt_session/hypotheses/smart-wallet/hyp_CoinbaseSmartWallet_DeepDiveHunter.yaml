# ===========================================================================
# DD-01: EIP-7702 delegation to CoinbaseSmartWallet — initialize() takeover
# ===========================================================================
# CONVERGENCE: WildcardHunter CSW-W-08 (65% confidence), AccessHunter CSW-AC-01 (60%)
# NOVEL ANGLE: Neither hunter analyzed the FULL attack chain with EIP-7702
# specifically, and neither checked if the bounty scope covers EIP-7702.
# Post-Pectra (live since May 2025), this is a CURRENT threat.
- id: DD-01
  tier: 1
  type: property
  description: >
    EIP-7702 (live on Ethereum mainnet post-Pectra) permite que un EOA delegue
    su codigo a una implementacion existente. Si un EOA delega a la implementacion
    de CoinbaseSmartWallet (no al proxy, sino al implementation contract directamente),
    el storage del EOA es VIRGEN: nextOwnerIndex() == 0. Esto permite que CUALQUIERA
    llame initialize() en el EOA y se registre como owner. A diferencia del proxy
    pattern donde el constructor bloquea re-inicializacion en la implementation,
    EIP-7702 usa el storage del EOA delegante, no el de la implementation.

    CRUCIALMENTE: el constructor de CoinbaseSmartWallet hace _initializeOwners([address(0)])
    en el IMPLEMENTATION contract. Esto pone nextOwnerIndex=1 en el storage de la
    implementation. Pero con EIP-7702, el EOA tiene su PROPIO storage, donde
    nextOwnerIndex es 0 por defecto. La proteccion del constructor NO aplica.

    DIFERENCIA CON CSW-W-08: El WildcardHunter identifico el concepto pero con
    65% confianza y sin PoC sketch completo. Mi analisis agrega:
    (1) El EOA original PIERDE control porque la wallet abstraction paths (EntryPoint)
        ahora requieren firma via _isValidSignature contra los owners registrados,
        que son del atacante.
    (2) El EOA puede revocar la delegacion 7702 enviando una tx normal (sin 4337),
        pero si no tiene ETH para gas (fue drenado), no puede revocar.
    (3) Si el EOA tenia tokens ERC-20/NFTs, el atacante los drena via execute().

    BRUTALMENTE HONESTO: Este ES un vector real pero depende de que alguien use
    EIP-7702 delegation al implementation de CoinbaseSmartWallet directamente.
    Si Coinbase deploya una version 7702-aware (con initCode check o storage
    sentinel), este vector desaparece. Probabilidad MEDIA si el bounty cubre
    EIP-7702 interactions, BAJA si no.
  attack_scenario: >
    1. Alice (EOA) tiene 10 ETH + tokens. Alice delega su code a CoinbaseSmartWallet
       implementation via EIP-7702 AUTH_LIST.
    2. Alice's storage es virgen: slot para nextOwnerIndex = 0.
    3. Attacker (Bob) observa la delegacion on-chain.
    4. Bob llama Alice.initialize([abi.encode(bob_address)]).
    5. nextOwnerIndex era 0 → pasa el check → Bob es owner del account de Alice.
    6. Bob llama (via EntryPoint o directamente como owner):
       Alice.execute(token_contract, 0, abi.encodeCall(IERC20.transfer, (bob, balance))).
    7. Todos los tokens de Alice son transferidos a Bob.
    8. Alice puede intentar revocar la delegacion 7702, pero si Bob ya dreno
       el ETH, Alice no puede pagar gas para revocar.
    NOTA: Alice tambien podria front-run la initialize con su propia tx, pero
    hay una race condition en el mempool.
  impact: "Perdida total de fondos del EOA que delega via EIP-7702 a CoinbaseSmartWallet implementation sin proteccion"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // Simular EIP-7702 delegation: EOA con storage virgen
    // Verificar que initialize() es llamable por cualquiera
    // cuando nextOwnerIndex() == 0

    // En un EOA con delegacion 7702, el storage es del EOA
    // nextOwnerIndex en el slot ERC-7201 es 0 por defecto
    uint256 noi = wallet.nextOwnerIndex();
    if (noi == 0) {
        // VULNERABLE: cualquiera puede llamar initialize
        bytes[] memory attackerOwners = new bytes[](1);
        attackerOwners[0] = abi.encode(attacker);
        wallet.initialize(attackerOwners);
        bool isOwner = wallet.isOwnerAddress(attacker);
        t(!isOwner, "DD-01: EIP-7702 delegated EOA takeover via initialize()");
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 70
  notes: >
    ALTA CONFIANZA en la mecanica del ataque. La pregunta clave es si el bounty
    scope de Coinbase Onchain cubre EIP-7702 interactions. Si lo cubre, esto es
    un Critical. Si no, es informacional pero extremadamente valioso para Coinbase.
    Verificar: (1) si Coinbase ha deployado una version 7702-aware, (2) si el
    bounty dice "all chains where deployed" (Pectra ya es live en mainnet).
    La mitigacion seria agregar un sentinel value en el constructor que se
    verifique en initialize(), o usar un patron de inicializacion que funcione
