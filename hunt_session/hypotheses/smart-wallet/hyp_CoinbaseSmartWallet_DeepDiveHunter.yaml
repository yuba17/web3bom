    5. EntryPoint ve sigFailed=1. No ejecuta el UserOp. No llama postOp.
    6. Estado de MagicSpend: _withdrawable[attacker] > 0, nonce quemado.
    7. Atacante llama MagicSpend.withdrawGasExcess() directamente.
