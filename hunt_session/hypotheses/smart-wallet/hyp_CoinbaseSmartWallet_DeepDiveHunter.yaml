# ===========================================================================
# DD-07: validateUserOp ABI decode discrepancy —
# abi.decode en memory vs calldata slicing en execution
# ===========================================================================
# CONVERGENCE: AccessHunter CSW-AC-10 (35%)
# NOVEL ANGLE: Solo 1 hunter menciono esto. Es el unico vector que podria
# permitir bypass del code.length check para upgradeToAndCall.
- id: DD-07
  tier: 1
  type: property
  description: >
    En validateUserOp (L170-183), cuando se detecta executeWithoutChainIdValidation:
    1. bytes[] memory calls = abi.decode(userOp.callData[4:], (bytes[]))
    2. Para cada call, extrae bytes4 selector y verifica upgradeToAndCall
    3. Si upgradeToAndCall: extrae newImplementation via assembly mload

    La decodificacion usa abi.decode en MEMORY (copiando desde calldata).

    En la ejecucion real, executeWithoutChainIdValidation recibe bytes[] CALLDATA:
    1. for each call in calls: bytes4 selector = bytes4(call)
    2. _call(address(this), 0, call)

    La pregunta: ¿puede un calldata malformado (non-standard ABI encoding)
    causar que la decodificacion en MEMORY (validateUserOp) vea datos DIFERENTES
    a los que executeWithoutChainIdValidation procesa en CALLDATA?

    ANALISIS PROFUNDO:
    - ABI encoding estandar usa offsets relativos para bytes[] arrays
    - abi.decode en Solidity 0.8.23 es STRICT: verifica bounds, padding, offsets
    - Calldata slicing (bytes calldata call = calls[i]) tambien es strict
    - Ambos paths decodifican el MISMO calldata, solo que uno copia a memory
      y otro opera directamente en calldata
    - En Solidity 0.8.23, NO hay discrepancia conocida entre decodificacion
      de abi.decode(memory) y calldata slicing para bytes[] standard
    - Non-standard ABI (overlapping offsets, dirty padding) podria causar
      diferencias en versiones antiguas de Solidity, pero 0.8.23 es strict

    PERO: hay un detalle sutil. En validateUserOp (L170):
      bytes[] memory calls = abi.decode(userOp.callData[4:], (bytes[]));
    Esto decodifica desde calldata a memory.

    En executeWithoutChainIdValidation (L210):
      bytes calldata call = calls[i];
    Esto accede directamente al calldata.

    Los dos paths LEEN EL MISMO CALLDATA. La unica diferencia es que el primero
    COPIA a memory y el segundo LEE in-place. Para calldata bien formado,
    producen los mismos resultados. Para calldata malformado, Solidity 0.8.23
    revierte en ambos casos (bounds checking).

    CONCLUSIÓN: No hay discrepancia explotable en Solidity 0.8.23.
    El AccessHunter tenia razon en ser cauteloso pero 35% confidence era apropiado.

    BRUTALMENTE HONESTO: Probabilidad de explotacion ~0% en la version actual.
    Podria ser relevante si se cambia a una version de Solidity con decodificacion
    mas laxa, pero eso es especulativo.
  attack_scenario: >
    Requiere encontrar un calldata que abi.decode interprete diferente a
    calldata slicing en Solidity 0.8.23. No se conoce tal payload.
  impact: "Si existiera discrepancia: bypass del code.length check → wallet bricked via cross-chain upgrade a empty address. PERO: no hay discrepancia conocida."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar consistencia de decodificacion:
    // Encode y decode una batch con upgradeToAndCall
    bytes[] memory calls = new bytes[](1);
    calls[0] = abi.encodeWithSelector(
        UUPSUpgradeable.upgradeToAndCall.selector,
        someAddress,
        ""
    );
    bytes memory encoded = abi.encodeWithSelector(
        CoinbaseSmartWallet.executeWithoutChainIdValidation.selector,
        calls
    );
    // Decode como lo hace validateUserOp
    bytes[] memory decoded = abi.decode(encoded[4:], (bytes[]));
    // Extraer address como lo hace validateUserOp
    address impl;
    bytes memory callData = decoded[0];
    assembly { impl := mload(add(callData, 36)) }
    eq(impl, someAddress, "DD-07: decode consistency check");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 20
  notes: >
    Probabilidad extremadamente baja. Solidity 0.8.23 tiene strict ABI decoding.
    El AccessHunter (CSW-AC-10) fue el unico en explorar este angulo con 35%
    confianza. Confirmo que no hay path explotable conocido. Mantener como
    invariante defensivo pero no es reportable.

# ===========================================================================
# DD-08: Interaccion MagicSpend.withdraw() durante UserOp execution +
# _withdrawable doble conteo edge case
# ===========================================================================
# CONVERGENCE: FlowHunter CSW-FL-04 (40%), SignatureHunter CSW-05 (35%),
# WildcardHunter CSW-W-11 (45%)
# NOVEL ANGLE: ¿Que pasa si el UserOp execution llama TANTO
# withdrawGasExcess() COMO withdraw() con un segundo WithdrawRequest?
- id: DD-08
  tier: 1
  type: property
  description: >
    Escenario no analizado por ningun hunter individualmente:

    1. MagicSpend es paymaster del UserOp. validatePaymasterUserOp se ejecuta:
       - WithdrawRequest1: amount=1 ETH, maxCost=0.1 ETH
       - _withdrawable[user] += 0.9 ETH
       - Nonce1 marcado como used

    2. Ejecucion del UserOp (callData):
       a. user llama MagicSpend.withdrawGasExcess() → recibe 0.9 ETH, _withdrawable=0
       b. user llama MagicSpend.withdraw(WithdrawRequest2) con OTRO nonce firmado
          - WithdrawRequest2: amount=2 ETH, asset=address(0), nonce2, expiry
          - withdraw() verifica firma (del owner de MagicSpend), nonce, maxAllowed
          - Si pasa: _withdraw(address(0), user, 2 ETH) via safeTransferETH
          - user recibe 2 ETH adicionales

    3. postOp: _withdrawable[user] = 0 (ya fue deleteado). Gas refund:
       maxGasCost - actualGasCost. user recibe el refund.

    Total recibido: 0.9 + 2.0 + refund = 2.9 + refund ETH.
    Total autorizado: 1 ETH (request1) + 2 ETH (request2) = 3 ETH.
    Total pagado de MagicSpend: 1 ETH (via paymaster) + 2 ETH (via withdraw) = 3 ETH.

    ESTO ES CORRECTO. No hay doble conteo. Las dos operaciones son independientes:
    - PaymasterUserOp con request1 maneja 1 ETH (split entre withdrawGasExcess + refund)
    - withdraw() con request2 maneja 2 ETH

    PERO: ¿que pasa con el check maxAllowed en _validateRequest para request2?
    Al momento de withdraw(request2), el balance de MagicSpend ya disminuyo
    por la transferencia de withdrawGasExcess (0.9 ETH). Si el balance original
    era justo para ambos requests, el segundo podria fallar por WithdrawTooLarge.

    Esto es un edge case de interaccion: el usuario puede quedarse sin poder
    ejecutar el segundo withdraw porque el primero (withdrawGasExcess) ya redujo
    el balance que _validateRequest usa para calcular maxAllowed.

    BRUTALMENTE HONESTO: No es un bug — es el comportamiento correcto del rate
    limiting. El primer withdraw reduce el balance, el segundo ve un balance
    menor. Funciona como se espera. No hay doble conteo ni perdida de fondos.
  attack_scenario: >
    No es un ataque. Es una interaccion normal entre withdrawGasExcess y withdraw
    en la misma tx. El comportamiento es correcto.
  impact: "Ninguno — accounting correcto tras analisis profundo."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que withdrawGasExcess + withdraw en la misma tx
    // no causa doble conteo
    uint256 msBefore = address(magicSpend).balance;
    // ... UserOp con withdrawGasExcess + withdraw(request2) en callData ...
    uint256 msAfter = address(magicSpend).balance;
    uint256 totalRequested = request1.amount + request2.amount;
    uint256 actualDecrease = msBefore - msAfter;
    eq(actualDecrease, totalRequested, "DD-08: total withdrawn matches total requested");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 75
  notes: >
    Analizado y DESCARTADO como vector de ataque. El accounting es correcto.
    Las dos operaciones (paymaster flow y withdraw flow) son independientes
    y correctamente contabilizadas. Mantener como invariante de regression.

