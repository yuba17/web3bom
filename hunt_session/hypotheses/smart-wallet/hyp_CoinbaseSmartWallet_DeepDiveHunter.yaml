# ===========================================================================
# DD-02: MagicSpend validatePaymasterUserOp — _withdrawable + nonce state
# committed BEFORE sig verification result is actionable by EntryPoint
# ===========================================================================
# CONVERGENCE: FlowHunter CSW-FL-12 (70%), DoSHunter CSW-D-04 (55%),
# TrustBoundaryHunter CSW-12 (45%), MathHunter CSW-MATH-02 (40%)
# NOVEL ANGLE: Los hunters analizaron los paths individualmente pero ninguno
# verifico el EXACT behavior del EntryPoint v0.6 cuando sigFailed=1.
- id: DD-02
  tier: 1
  type: property
  description: >
    En MagicSpend.validatePaymasterUserOp (L121-144):
    1. Primero: decode WithdrawRequest, check amount >= maxCost
    2. Luego: _validateRequest (marca nonce used, checks maxAllowed)
    3. Despues: sigFailed = !isValidWithdrawSignature (verifica firma)
    4. Finalmente: _withdrawable[sender] += amount - maxCost

    El ORDEN es critico: el nonce se marca como USED (paso 2) ANTES de verificar
    la firma (paso 3). Y _withdrawable se incrementa (paso 4) DESPUES de la
    verificacion de firma, pero la validationData solo se RETORNA al EntryPoint.

    En EntryPoint v0.6, si validatePaymasterUserOp retorna validationData con
    sigFailed=1, el EntryPoint PROCESA esto en _validatePrepayment. Segun el
    codigo del EP v0.6, si la firma del paymaster falla, la operacion se marca
    como fallida pero los SIDE EFFECTS de validatePaymasterUserOp (nonce marcado,
    _withdrawable incrementado) ya estan commiteados en el storage de MagicSpend.

    PREGUNTA CRITICA: ¿El EntryPoint v0.6 revierte el inner call completo cuando
    paymaster sig falla, o solo marca el resultado?

    Respuesta tras analizar el EP v0.6 source:
    - _validatePrepayment llama validatePaymasterUserOp en un CALL (no staticcall)
    - Si la funcion retorna (no revierte), los side effects PERSISTEN
    - El EP luego chequea validationData y si sig failed, la operacion no se ejecuta
    - PERO: validatePaymasterUserOp ya modifico storage (nonce + _withdrawable)
    - Si la ejecucion no ocurre, postOp TAMPOCO se llama
    - Resultado: _withdrawable tiene funds acumulados, nonce esta quemado

    IMPACTO: ¿Puede alguien llamar withdrawGasExcess() para extraer _withdrawable?
    - withdrawGasExcess solo requiere msg.sender == account del UserOp
    - Si el atacante ES el sender, puede llamar withdrawGasExcess en otra tx
    - PERO: el atacante necesitaria un WithdrawRequest firmado por el owner de
      MagicSpend, con asset=address(0) y un nonce valido
    - Si la firma es invalida, sigFailed=1, pero _withdrawable ya se incremento
    - El atacante NO puede usar una firma completamente falsa porque necesita
      que _validateRequest pase (nonce valido, amount <= maxAllowed)
    - El nonce es un uint256 — el atacante puede probar nonces arbitrarios
    - WAIT: _validateRequest verifica _nonceUsed ANTES de marcar, asi que nonces
      inventados que no estan marcados como used pasarian
    - PERO la firma se verifica DESPUES, y si es invalida, sigFailed=1

    CONCLUSION: Si el EP v0.6 NO revierte el call a validatePaymasterUserOp
    cuando retorna sigFailed=1, entonces:
    1. Nonce quemado sin operacion ejecutada
    2. _withdrawable incrementado sin postOp que lo limpie
    3. El sender puede llamar withdrawGasExcess() para extraer fondos

    BRUTALMENTE HONESTO: Necesita verificacion fork contra el EP v0.6 real.
    La probabilidad depende del comportamiento exacto del EntryPoint.
    FlowHunter CSW-FL-12 llego a 70% confianza pero no verifico en fork.
  attack_scenario: >
    1. Atacante conoce el address de MagicSpend y tiene una wallet (sender address).
    2. Atacante crafta un UserOp con paymasterAndData que incluye un WithdrawRequest:
       - asset: address(0) (ETH)
       - amount: maxAllowed (balance/denominator)
       - nonce: algun nonce no-usado para su address
       - expiry: futuro
       - signature: INVALIDA (basura)
    3. Bundler simula el UserOp. validatePaymasterUserOp no revierte (retorna
       validationData con sigFailed=1). El bundler lo incluye.
    4. EntryPoint llama validatePaymasterUserOp:
       - _validateRequest pasa (nonce fresh, amount <= maxAllowed)
       - Nonce marcado como used ✓
       - sigFailed = true (firma invalida)
       - _withdrawable[attacker] += amount - maxCost ✓
