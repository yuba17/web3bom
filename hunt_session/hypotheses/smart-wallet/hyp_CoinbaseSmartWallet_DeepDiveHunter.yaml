# ===========================================================================
# DD-03: MagicSpend multi-op bundle rate limit bypass — documented but
# potentially more severe than acknowledged
# ===========================================================================
# CONVERGENCE: TrustBoundaryHunter CSW-12 (45%), DoSHunter CSW-D-06 (50%),
# OracleHunter CSW-O-07 (40%), WildcardHunter CSW-W-06 (40%),
# FlowHunter CSW-FL-04 (40%)
# NOVEL ANGLE: 5 hunters converged en este vector. El codigo lo DOCUMENTA
# como known (L153-156), pero la pregunta es si el impacto va mas alla
# de "reputation damage" — ¿puede causar perdida directa de fondos?
- id: DD-03
  tier: 1
  type: property
  description: >
    EntryPoint v0.6 procesa UserOps en un bundle asi:
    FASE 1 (validacion): para CADA op, llama validatePaymasterUserOp
    FASE 2 (ejecucion): para CADA op, ejecuta calldata + postOp

    En FASE 1, TODOS los validatePaymasterUserOp se ejecutan con el MISMO
    balance de MagicSpend (porque los postOps aun no han transferido fondos).
    El check maxAllowed = address(this).balance / maxWithdrawDenominator
    se evalua N veces con el mismo balance.

    Si denominator = 10 y balance = 100 ETH, maxAllowed = 10 ETH por op.
    Un bundler puede incluir 10 UserOps del mismo usuario (diferentes nonces
    de MagicSpend, cada uno por 10 ETH). TODOS pasan la validacion.

    En FASE 2, los postOps intentan enviar 10 ETH cada uno. El primero funciona
    (balance 100 → 90), el segundo (90 → 80)... hasta el decimo (10 → 0).
    TOTAL: 100 ETH drenados. El maxWithdrawDenominator fue COMPLETAMENTE bypaseado.

    Pero ESPERA: cada op necesita un WithdrawRequest firmado por el owner de
    MagicSpend con amount = 10 ETH. El atacante necesita 10 firmas del owner.
    Si el owner solo firma requests por cantidades razonables, no hay ataque.

    ESCENARIO REAL: Un backend de firma automatizada (signer service) que firma
    WithdrawRequests on-demand. Si el backend no tiene rate limiting propio
    (confiando en maxWithdrawDenominator), un usuario malicioso puede obtener
    N requests firmados y luego bundlearlos todos en una tx.

    DIFERENCIA CON LOS 5 HUNTERS: Todos identificaron el mecanismo pero lo
    clasificaron como "known issue, documented". Lo que NINGUNO analizo es:
    - ¿El backend de Coinbase tiene rate limiting adicional?
    - ¿El bundler de Coinbase (que opera en Base) permite N ops del mismo sender?
    - Si MagicSpend se usa con un backend de firma de terceros, ¿hay mas riesgo?

    BRUTALMENTE HONESTO: El codigo DOCUMENTA este comportamiento (L153-156).
    Coinbase probablemente tiene rate limiting en su backend. Pero el contrato
    on-chain NO lo tiene. Si un tercero deploya MagicSpend con un backend
    de firma sin rate limiting, es explotable. Como finding del bounty,
    probablemente Low/Info porque es documented. Pero como finding de seguridad
    general, es Medium.
  attack_scenario: >
    1. Backend de firma automatizado firma N WithdrawRequests para user X,
       cada uno por maxAllowed, con nonces diferentes.
    2. User X bundlea N UserOps con MagicSpend como paymaster en un solo handleOps.
    3. Todas las validaciones pasan (balance no ha cambiado aun).
    4. Todos los postOps ejecutan transfers — balance de MagicSpend drenado.
    5. maxWithdrawDenominator completamente bypaseado.
  impact: "Bypass completo del rate limit on-chain de MagicSpend. Requiere N firmas del owner. Impacto real depende del backend de firma."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Fork test:
    // 1. Deploy MagicSpend con 100 ETH, denominator=10
    // 2. Crear 10 WithdrawRequests firmados por el owner, cada uno por 10 ETH
    // 3. Crear 10 UserOps usando cada request
    // 4. handleOps con los 10 UserOps
    // 5. Verificar: MagicSpend balance == 0 (rate limit bypaseado)

    uint256 balance = address(magicSpend).balance;
    uint256 denom = magicSpend.maxWithdrawDenominator();
    uint256 maxPerOp = balance / denom;
    // Si N >= denom ops se procesan en el mismo bundle:
    uint256 totalDrained = maxPerOp * denom;
    // totalDrained == balance (o cercano, dependiendo de truncamiento)
    lte(totalDrained, balance, "DD-03: rate limit bypass math check");
  ghost_vars:
    - uint256 internal ghost_totalBundleWithdraw;
  validated: false
  priority: medium
  confidence: 60
  notes: >
    DOCUMENTED en el codigo (L153-156). Coinbase probablemente tiene mitigaciones
    off-chain. Como finding del bounty: Low/Info (known, documented).
    Como finding de seguridad: Medium (on-chain rate limiting es insuficiente).
    5 de 9 hunters convergieron en esto — la convergencia confirma que es un
    area de riesgo real, pero la documentacion explicita reduce su novedad.

# ===========================================================================
