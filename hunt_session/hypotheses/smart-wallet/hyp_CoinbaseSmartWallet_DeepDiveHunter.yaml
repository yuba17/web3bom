# LibClone.createDeterministicERC1967 con msg.value cuando alreadyDeployed.
- id: DD-04
  tier: 1
  type: property
  description: >
    CoinbaseSmartWalletFactory.createAccount es payable y pasa msg.value a
    LibClone.createDeterministicERC1967(msg.value, implementation, salt).

    Segun la implementacion de Solady LibClone.createDeterministicERC1967:
    - Si el proxy NO existe: CREATE2 deploya con msg.value → ETH va al proxy. OK.
    - Si el proxy YA existe (alreadyDeployed=true): CREATE2 falla (address collision).
      Solady RETORNA la address existente pero NO hace nada con msg.value.
      El ETH queda en el contrato que llamo CREATE2, que es la FACTORY.

    La factory NO tiene:
    - Una funcion withdraw para recuperar ETH atrapado
    - Un check que revierta si alreadyDeployed && msg.value > 0
    - Un mecanismo para reenviar msg.value al proxy existente

    RESULTADO: Si alguien llama createAccount{value: X}(owners, nonce) y la
    wallet ya existe, los X ETH quedan PERMANENTEMENTE atrapados en la Factory.

    BRUTALMENTE HONESTO: Esto requiere que el usuario envie ETH con createAccount
    cuando la wallet ya existe. Es un error del usuario, no un ataque. Pero la
    funcion es payable sin advertencia, y la Factory no tiene mecanismo de
    recuperacion. Impacto: Loss of user funds por error de UX, no por exploit.
    Severity: Medium si hay usuarios que pre-fundan wallets, Low si no.

    VERIFICACION NECESARIA: Confirmar que LibClone de Solady realmente deja
    el ETH en la Factory y no lo reenvia. La version exacta de Solady importa.
  attack_scenario: >
    1. Alice llama createAccount{value: 1 ETH}(owners, 0). Wallet se crea con 1 ETH. OK.
    2. Bob llama createAccount{value: 5 ETH}(owners, 0) (mismos params).
    3. alreadyDeployed=true. CREATE2 no se ejecuta. Los 5 ETH van a la Factory.
    4. La Factory no tiene withdraw(). Los 5 ETH estan permanentemente atrapados.
    5. Bob pierde 5 ETH irrecuperablemente.
    NOTA: Si Bob es el mismo Alice (re-call por accidente o via un script
    automatizado que re-intenta createAccount con value), los fondos se pierden.
  impact: "Perdida directa de ETH para quien llame createAccount con value cuando la wallet ya existe. Fondos irrecuperables en la Factory."
  impact_rating: Medium
