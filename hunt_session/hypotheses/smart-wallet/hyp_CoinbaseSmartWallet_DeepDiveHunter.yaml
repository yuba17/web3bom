# ===========================================================================
# DD-05: CoinbaseSmartWallet como owner de otro CoinbaseSmartWallet —
# nested ERC-1271 verification chain con gas amplification
# ===========================================================================
# CONVERGENCE: TrustBoundaryHunter CSW-08 (55%), AccessHunter CSW-AC-11 (25%)
# NOVEL ANGLE: Ninguno analizo la CADENA de ERC-1271 calls cuando un
# CoinbaseSmartWallet es owner de otro CoinbaseSmartWallet.
- id: DD-05
  tier: 1
  type: property
  description: >
    Cuando un CoinbaseSmartWallet (WalletA) tiene como owner otro
    CoinbaseSmartWallet (WalletB), la validacion de firma crea una cadena:

    1. WalletA._isValidSignature(hash, sig)
    2. ownerAtIndex(i) = abi.encode(address(WalletB)) → 32 bytes → address path
    3. SignatureCheckerLib.isValidSignatureNow(WalletB, hash, sigData)
    4. WalletB tiene code → ERC-1271 path: WalletB.isValidSignature(hash, sigData)
    5. WalletB.replaySafeHash(hash) → DIFERENTE hash (incluye WalletB.address + chainId)
    6. WalletB._isValidSignature(replaySafeHash(hash), sigData)

    PROBLEMA: En paso 3, SignatureCheckerLib pasa el hash DIRECTO a
    WalletB.isValidSignature. Pero WalletB wrappea ese hash con SU PROPIO
    replaySafeHash (paso 5), que incluye WalletB.address y chainId.

    Esto significa que el firmante original necesita firmar:
    replaySafeHash_WalletB(hash_from_WalletA)

    Pero hash_from_WalletA es:
    - Para validateUserOp: userOpHash (que incluye WalletA.address)
    - Para isValidSignature: replaySafeHash_WalletA(originalHash)

    La cadena completa para ERC-1271 de WalletA con owner WalletB:
    - Protocolo llama WalletA.isValidSignature(H, sig)
    - WalletA wrappea: H' = replaySafeHash_A(H)
    - WalletA verifica: SignatureCheckerLib.isValidSignatureNow(WalletB, H', sigData)
    - → WalletB.isValidSignature(H', sigData)
    - WalletB wrappea: H'' = replaySafeHash_B(H')
    - WalletB verifica: _isValidSignature(H'', sigDataInner)
    - El firmante EOA (owner de WalletB) firmó H''

    ESTO FUNCIONA CORRECTAMENTE pero tiene implicaciones:
    1. GAS: Cada hop agrega ~50K gas (ERC-1271 call + hashing)
    2. Si hay N niveles de nesting, gas = O(N * 50K)
    3. Un atacante puede crear una cadena larga de wallets-como-owners
       para amplificar el gas de validacion
