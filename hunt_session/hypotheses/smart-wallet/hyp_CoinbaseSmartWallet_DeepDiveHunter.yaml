# ===========================================================================
# DD-06: MagicSpend getHash usa EIP-191 v0x45, NO EIP-712 —
# discrepancia con el ecosistema de firma moderna
# ===========================================================================
# CONVERGENCE: Ningun hunter analizo el formato de hash de getHash en detalle
# NOVEL ANGLE: getHash usa toEthSignedMessageHash (EIP-191 personal_sign),
# no un typed hash EIP-712. Esto tiene implicaciones para phishing.
- id: DD-06
  tier: 2
  type: property
  description: >
    MagicSpend.getHash (L300-311) produce un hash usando
    SignatureCheckerLib.toEthSignedMessageHash que es EIP-191 version 0x45
    ("\x19Ethereum Signed Message:\n32"). Esto convierte un hash arbitrario
    en un "personal_sign" hash.

    El owner de MagicSpend firma WithdrawRequests usando personal_sign
    (eth_personalSign en los wallets). El hash firmado es:
    keccak256("\x19Ethereum Signed Message:\n" + len + abi.encode(address(this), account, chainid, asset, amount, nonce, expiry))

    PROBLEMA POTENCIAL: personal_sign es vulnerable a "blind signing" attacks.
    El usuario (owner de MagicSpend) ve un hash opaco en su wallet UI, no un
    mensaje estructurado legible. Con EIP-712, el wallet puede mostrar los
    campos individuales (account, amount, asset, etc.) al firmante.

    PERO: el owner de MagicSpend es Coinbase (un backend automatizado, no un
    humano firmando en MetaMask). El backend sabe exactamente que esta firmando.
    Esto hace que el formato de personal_sign sea aceptable operacionalmente.

    El riesgo seria si el owner de MagicSpend es un EOA humano que firma
    manualmente — podria ser engañado para firmar un WithdrawRequest malicioso
    sin entender el contenido. Pero esto es un edge case de UX, no un bug.

    ADICIONALMENTE: EIP-191 personal_sign y EIP-712 typed data tienen prefijos
    diferentes (\x19Ethereum Signed Message vs \x19\x01), asi que una firma
    para getHash no puede ser usada como firma EIP-712 y viceversa. No hay
    cross-contamination.

    BRUTALMENTE HONESTO: No es un bug explotable. Es una decision de diseño
    aceptable para un backend automatizado. Informational at best.
