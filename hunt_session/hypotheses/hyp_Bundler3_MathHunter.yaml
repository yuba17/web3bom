  - id: B-M-08
    tier: 1
    type: property
    description: >
      MathRayLib rDivUp/rDivDown division-by-zero: Si shares/y == 0, rDivDown
      revierte con panic(0x12), rDivUp revierte con panic(0x11) en (y-1)
      underflow. Ambos casos son DoS, no pérdida de fondos. Morpho Blue y
      ERC4626 estándar nunca retornan 0 shares para >0 assets.
    attack_scenario: >
      1. Atacante llama morphoSupply con assets=X a un mercado Morpho vacío.
      2. Hipotéticamente, Morpho.supply() retorna (X, 0 shares).
      3. rDivUp(X, 0) intenta (X * 1e27 + (0-1)) → underflow en (y-1) → panic.
      4. Tx revierte. No hay pérdida de fondos.
      5. En Morpho Blue, supply con assets>0 siempre retorna shares>0 (usa
         toSharesUp que retorna mínimo 1 share). Caso idéntico para ERC4626.
      6. Solo explotable con vault/market malicioso, donde el usuario elige
         interactuar — se haría daño a sí mismo.
    impact: "DoS temporal (revert). No pérdida de fondos."
    impact_rating: Info
    likelihood: Low
    severity_final: null
    solidity: |
      // Verify: rDivUp and rDivDown revert on y=0
      // Solidity 0.8 checked math guarantees this
      // rDivDown(x, 0) = (x * RAY) / 0 → panic(0x12)
      // rDivUp(x, 0) = (x * RAY + (0-1)) / 0 → panic(0x11) on (y-1)
      if (ghost_suppliedShares == 0 && ghost_suppliedAssets > 0) {
          t(false, "B-M-08: supply returned 0 shares for >0 assets — should have reverted");
      }
    ghost_vars:
      - "uint256 internal ghost_suppliedShares;"
      - "uint256 internal ghost_suppliedAssets;"
    validated: false
    priority: low
    confidence: 90
    notes: >
      Verificado: Solidity 0.8.28 checked arithmetic protege ambos paths.
      rDivDown: division by zero panic. rDivUp: underflow panic en (y-1).
      Morpho Blue toSharesUp siempre retorna ≥1. No es un vector real.

