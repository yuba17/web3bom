  - id: B-M-13
    tier: 1
    type: property
    description: >
      stakeEth transfiere `amount` (ETH enviado) como stETH en vez del stETH
      real recibido. Por el rounding de Lido (1-2 wei), el adapter podría tener
      amount-1 stETH. Si no hay stETH previo, safeTransfer(amount) revierte.
      Comparar con wrapStEth que SÍ usa el valor `received` real.
    attack_scenario: >
      1. Adapter tiene 0 stETH. Usuario llama stakeEth(1e18, maxPrice, ref, receiver).
      2. IStEth.submit{value: 1e18}(referral) → Lido stakea 1 ETH.
      3. Lido mints stETH con shares-based accounting. Balance del adapter podría
         ser 999999999999999999 (1 wei menos por rounding de shares→stETH).
      4. safeTransfer(IERC20(ST_ETH), receiver, 1e18) → revierte: insufficient balance.
      5. Resultado: DoS. stakeEth no funciona si receiver != address(this) y hay
         rounding desfavorable. El usuario pierde gas pero no fondos.
      6. Workaround: usar stakeEth con receiver=address(this), luego wrapStEth
         (que usa `received` correctamente), o pre-cargar 1 wei de stETH.
      7. INCONSISTENCIA con wrapStEth (L130): usa `uint256 received = wrap(amount)`
         y transfiere `received`. stakeEth debería hacer lo mismo con el balance
         de stETH post-submit.
    impact: "DoS (revert) para stakeEth con receiver != adapter. 1-2 wei de discrepancia."
    impact_rating: Low
    likelihood: Medium
    severity_final: null
    solidity: |
      // After stakeEth, verify actual stETH balance >= amount
      uint256 stEthBalance = IERC20(ST_ETH).balanceOf(address(adapter));
      // Lido rounding: stEthBalance could be amount-1 or amount-2
      gte(stEthBalance, ghost_stakeAmount,
          "B-M-13: stETH balance after submit < amount — transfer will revert");
    ghost_vars:
      - "uint256 internal ghost_stakeAmount;"
    validated: false
    priority: medium
    confidence: 60
    notes: >
      Este es el finding más interesante de esta fase. La inconsistencia entre
      stakeEth (transfiere `amount`) y wrapStEth (transfiere `received`) sugiere
      un oversight. Impacto limitado a DoS por 1-2 wei. Lido's known behavior.
      INVESTIGAR: ¿Lido submit siempre retorna balance >= amount? Si tiene el
      conocido "1-2 wei rounding" entonces este es un bug real de DoS.
      SEVERIDAD: Low (DoS, no pérdida de fondos). No amerita finding pipeline.

  - id: B-M-14
    tier: 2
    type: property
    description: >
      ParaswapAdapter offset overlap: si offsets.exactAmount == offsets.limitAmount,
      updateAmounts escribe exactAmount primero, luego lee limitAmount del mismo
      offset (obteniendo el nuevo valor). limitAmount queda corrupto:
      newAmount * mulDiv(newAmount, newAmount, oldAmount) = newAmount²/oldAmount.
    attack_scenario: >
      1. Usuario pasa offsets = {exactAmount: 36, limitAmount: 36, quotedAmount: 0}.
      2. updateAmounts: oldExactAmount = callData[36] = X.
      3. callData.set(36, newAmount) → callData[36] = newAmount.
      4. callData.get(36) para limitAmount → lee newAmount (corrupto).
      5. limitAmount = newAmount.mulDiv(newAmount, X, rounding) = newAmount²/X.
      6. Si newAmount > X, limit se INFLA (menos protección).
         Si newAmount < X, limit se DEFLACTA (más protección, DoS).
      7. El usuario controla los offsets. Self-inflicted footgun.
      8. No hay forma de que un atacante externo explote esto — los offsets son
         parámetros de la llamada del usuario.
    impact: "Slippage corrupto (más o menos permisivo). Auto-infligido."
    impact_rating: Low
    likelihood: Low
    severity_final: null
    solidity: |
      // Verify: offsets don't overlap
      t(offsets.exactAmount != offsets.limitAmount,
          "B-M-14: exactAmount and limitAmount offsets overlap");
      if (offsets.quotedAmount > 0) {
          t(offsets.quotedAmount != offsets.exactAmount,
              "B-M-14: quotedAmount and exactAmount offsets overlap");
          t(offsets.quotedAmount != offsets.limitAmount,
              "B-M-14: quotedAmount and limitAmount offsets overlap");
      }
    ghost_vars: []
    validated: false
    priority: low
    confidence: 80
    notes: >
      El contrato NO valida que los offsets sean distintos. Es responsabilidad
      del SDK/frontend. Un contrato que llama ParaswapAdapter con offsets
      hardcoded correctos nunca tiene este problema. Solo si offsets vienen
      de input del usuario sin validación.

  - id: B-M-15
    tier: 1
    type: property
    description: >
      morphoRepay: si assets=type(uint).max Y shares=type(uint).max, ambos se
      resuelven a valores reales >0 y se pasan a Morpho.repay(). Morpho Blue
      espera que exactamente uno sea 0. Si ambos >0, Morpho revierte.
    attack_scenario: >
      1. Usuario tiene deuda: 100 shares = 105 assets (con interés acumulado).
      2. Adapter tiene 200 loan tokens.
      3. morphoRepay(market, type(uint).max, type(uint).max, maxPrice, onBehalf, data).
      4. assets = balanceOf(adapter) = 200.
      5. shares = borrowShares(onBehalf) = 100.
      6. MORPHO.repay(market, 200, 100, onBehalf, data) — ambos >0.
      7. Morpho Blue: require(iff(assets==0, shares!=0)) → revierte.
      8. Resultado: DoS. El usuario debe pasar uno como 0 y el otro como max.
      9. No pérdida de fondos. Error de UX documentable.
    impact: "DoS cuando usuario pasa ambos como type(uint).max. Error de UX."
    impact_rating: Info
    likelihood: Low
    severity_final: null
    solidity: |
      // After resolving type(uint).max sentinels:
      // Morpho requires exactly one of (assets, shares) to be 0
      if (ghost_repayAssets > 0 && ghost_repayShares > 0) {
          t(false, "B-M-15: both assets and shares > 0 — Morpho will revert");
      }
    ghost_vars:
      - "uint256 internal ghost_repayAssets;"
      - "uint256 internal ghost_repayShares;"
    validated: false
    priority: low
    confidence: 75
    notes: >
      Verificar Morpho Blue code para confirmar que revierte si ambos >0.
      El NatSpec dice "Either assets or shares should be zero" (SHOULD).
      Si MUST, entonces es DoS seguro. Si no, el comportamiento es indefinido.
      Mismo patrón aplica a morphoSupply (assets + shares).

  - id: B-M-16
    tier: 1
    type: property
    description: >
      type(uint256).max sentinel handling es CONSISTENTE en todas las funciones:
      siempre se resuelve a balance real ANTES de cualquier operación math o
      llamada externa. No hay riesgo de que type(uint).max entre en multiplicación.
    attack_scenario: >
      No hay ataque. Verificación exhaustiva de 13 funciones:
      erc4626Deposit(L83), erc4626Redeem(L133), morphoSupply(L191-192),
      morphoRepay(L275-283), morphoWithdraw(L310-311), morphoWithdrawCollateral(L331),
      permit2TransferFrom(L359), erc20TransferFrom(L377), wrapNative(L391),
      unwrapNative(L405), stakeEth(L108), wrapStEth(L123), unwrapStEth(L140),
      morphoWrapperDepositFor(L69), morphoWrapperWithdrawTo(L86).
      En TODOS los casos, type(uint).max → balanceOf/position query ANTES de math.
    impact: "Ninguno — diseño correcto y consistente"
    impact_rating: Info
    likelihood: Low
    severity_final: null
    solidity: |
      // Verify: type(uint).max is always resolved before arithmetic
      // This is a code review finding, not a fuzz invariant.
      t(true, "B-M-16: type(uint).max sentinel verified in all 15 functions");
    ghost_vars: []
    validated: true
    priority: low
    confidence: 99
    notes: >
      Verificado manualmente en cada función. El patrón es consistente:
      if (amount == type(uint256).max) amount = balanceOf(address(this));
      El valor resuelto siempre reemplaza la variable antes de usarla.

  - id: B-M-17
    tier: 2
    type: property
    description: >
      BytesLib bounds check: si data.length < 32, la expresión data.length - 32
      underflows en Solidity 0.8 → panic revert ANTES de evaluar el require.
      Resultado: revert seguro, no OOB access.
    attack_scenario: >
      1. callData tiene 20 bytes.
      2. BytesLib.get(callData, 0): require(0 <= 20 - 32).
      3. 20 - 32 underflows (uint256) → Solidity 0.8 panic(0x11).
      4. Revert antes de llegar al mload. Memoria protegida.
      5. Si data.length >= 32: la sustracción no underflows, y el offset check
         funciona correctamente: offset <= data.length - 32 garantiza que
         mload(add(32, add(data, offset))) lee dentro de bounds.
      6. No hay OOB read/write posible.
    impact: "Ninguno — bounds checking es correcto"
    impact_rating: Info
    likelihood: Low
    severity_final: null
    solidity: |
      // Verify: BytesLib.get never reads OOB
      // Verify: BytesLib.set never writes OOB
      if (data.length >= 32) {
          t(offset <= data.length - 32,
              "B-M-17: offset out of bounds for BytesLib operation");
      } else {
          t(false, "B-M-17: data too short for BytesLib — should revert");
      }
    ghost_vars: []
    validated: true
    priority: low
    confidence: 95
    notes: >
      La assembly es marcada como "memory-safe" y está protegida por el
      require previo. El underflow en data.length - 32 es un edge case de
      Solidity 0.8 que resulta en revert seguro.

false_positives:
- hunter: MathHunter
  id: B-FP-01
  reason: >
    keccak256 collision en reenterHash: la concatenación es de tamaño fijo
    (52 bytes), no hay ambigüedad de parsing. Colisión requiere romper
    keccak256 (2^128 ops). No es una vulnerabilidad.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: multicall.md
    content: >
      bytes.concat con tamaños fijos (bytes20 + bytes32) no tiene ambigüedad
      de parsing — no confundir con ABI encoding de longitud variable donde
      sí puede haber colisiones.
    briefing_update_applied: false
- hunter: MathHunter
  id: B-FP-02
  reason: >
    keccak256("") bypass: keccak256 de bytes vacíos produce 0xc5d246...,
    que es != bytes32(0). El contrato correctamente distingue entre
    "no espera reenter" (callbackHash=0) y "espera reenter con datos
    específicos" (callbackHash!=0). No hay bypass.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: multicall.md
    content: >
      keccak256("") = 0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82273b7bfad8045d85a470,
      que es un valor no-cero. No confundir con bytes32(0). Un callbackHash de
      keccak256("") sí activa el requerimiento de reenter.
    briefing_update_applied: false
- hunter: MathHunter
  id: B-FP-03
  reason: >
    Overflow en sum(bundle[i].value): Solidity 0.8 tiene overflow checks
    nativos. Además, el contrato no suma los values — los gasta uno a uno
    del balance del contrato. No hay aritmética vulnerable a overflow.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: multicall.md
    content: >
      Bundler3 no suma values del bundle — los gasta secuencialmente via
      .call{value:}. El EVM revierte si el balance es insuficiente para una
      call. No hay overflow posible en Solidity 0.8.
    briefing_update_applied: false

# Phase 2 false positives (GeneralAdapter1, ParaswapAdapter, MathRayLib, BytesLib, EthereumGeneralAdapter1)
- hunter: MathHunter
  id: B-FP-04
  reason: >
    rDivUp/rDivDown division-by-zero: Solidity 0.8 checked math revierte
    correctamente. Morpho Blue toSharesUp nunca retorna 0 shares para >0 assets.
    ERC4626 estándar tampoco. Solo un vault malicioso podría triggerear esto,
    y el usuario elige el vault.
  investigated_at: '2026-03-23T00:00:00Z'
- hunter: MathHunter
