      - erc4626Deposit (L93): assets.rDivUp(shares) <= max → CORRECTO (paga assets)
      - erc4626Withdraw (L114): assets.rDivDown(shares) >= min → CORRECTO (recibe assets)
      - erc4626Redeem (L138): assets.rDivDown(shares) >= min → CORRECTO (recibe assets)
      - morphoSupply (L201): supplied.rDivUp(shares) <= max → CORRECTO (paga assets)
      - morphoBorrow (L250): borrowed.rDivDown(shares) >= min → CORRECTO (recibe assets)
      - morphoRepay (L290): repaid.rDivUp(shares) <= max → CORRECTO (paga assets)
      - morphoWithdraw (L318): withdrawn.rDivDown(shares) >= min → CORRECTO (recibe)
      - stakeEth (L113): amount.rDivUp(shares) <= max → CORRECTO (paga ETH)
