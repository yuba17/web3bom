- id: B-M-01
  tier: 1
  type: property
  description: "ETH conservation: la suma de value enviados en un multicall no debe exceder msg.value + ETH residual pre-existente en el contrato"
  attack_scenario: >
    Si el contrato acumula ETH residual (de calls anteriores, selfdestruct, o
    coinbase rewards), un atacante puede llamar multicall con bundle[i].value
    que sumen más que su msg.value, gastando ETH que no le pertenece.
    Patrón idéntico al HIGH de 3DNS (Multicall drena ETH residual).
    En Bundler3 esto es BY DESIGN (el contrato no debe tener approvals ni ETH),
    pero si algún adapter deja ETH residual, es explotable.
  impact: "Robo de ETH residual del contrato. Impacto proporcional al ETH atrapado."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Ghost: track ETH balance before multicall
    uint256 balanceBefore = address(bundler).balance;
    // After multicall with msg.value V:
    // balance should be >= balanceBefore + V - sum(values sent out)
    // Invariant: no user can extract more ETH than they sent in msg.value
    uint256 balanceAfter = address(bundler).balance;
    uint256 totalValueSent = ghost_totalValueSentInBundle;
    // If totalValueSent > msg.value, someone spent residual ETH
    lte(totalValueSent, ghost_msgValue + ghost_preBalance,
        "B-M-01: bundle spent more ETH than msg.value + pre-existing balance");
  ghost_vars:
  - "uint256 internal ghost_totalValueSentInBundle;"
  - "uint256 internal ghost_msgValue;"
  - "uint256 internal ghost_preBalance;"
  validated: false
  priority: high
  confidence: 75
  notes: >
    El contrato dice explícitamente "should not be approved/authorized anywhere",
    lo que implica que residual ETH es considerado riesgo del usuario. Pero si un
    adapter legítimo deja ETH (e.g., unwrap parcial de WETH), esto es explotable.
    Investigar si adapters pueden dejar residual ETH.

- id: B-M-02
  tier: 1
  type: property
  description: "No hay overflow en la iteración del bundle: i < bundle.length con uint256 nunca overflows, pero sum(bundle[i].value) podría overflow si bundle.length es extremo"
  attack_scenario: >
    En Solidity 0.8.28, aritmética tiene overflow checks nativos. Pero el
    acumulado de value se gasta secuencialmente via .call{value:}, no se suma
    explícitamente. El contrato NO suma los values — los gasta uno a uno del
    balance. Esto significa que NO hay overflow posible en la suma, pero sí
    permite gastar más que msg.value si hay balance residual (ver B-M-01).
  impact: "Ninguno directo — overflow protegido por Solidity 0.8. El riesgo real es B-M-01."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: total value dispatched across all calls in bundle
    // cannot exceed contract balance at start of multicall
    uint256 totalDispatched;
    for (uint256 j; j < ghost_callValues.length; ++j) {
        totalDispatched += ghost_callValues[j]; // overflow reverts in 0.8
    }
    lte(totalDispatched, ghost_preBalance + ghost_msgValue,
        "B-M-02: total dispatched exceeds available ETH");
  ghost_vars:
  - "uint256[] internal ghost_callValues;"
  validated: false
  priority: low
  confidence: 90
  notes: >
    Investigado y confirmado: Solidity 0.8 previene overflow. La suma nunca se
    calcula en el contrato — cada call gasta del balance actual. Si el balance
    es insuficiente, la call falla (revert si skipRevert=false, silently fail
    si skipRevert=true). skipRevert=true + insufficient balance = call falla
    silenciosamente, pero no hay pérdida de fondos del contrato.

- id: B-M-03
  tier: 2
  type: property
  description: "reenterHash domain separation: bytes.concat(bytes20(to), callbackHash) tiene 52 bytes fijos, sin ambigüedad de parsing — no hay colisión por pares distintos (to, callbackHash)"
  attack_scenario: >
    Si existiera una colisión donde (addr_A, hash_A) produce el mismo
    reenterHash que (addr_B, hash_B) con addr_A != addr_B o hash_A != hash_B,
    un contrato malicioso en addr_B podría reentrar con datos inesperados.
    Análisis: bytes20(to) ocupa exactamente los primeros 20 bytes, callbackHash
    los últimos 32 bytes. Total = 52 bytes. Para que haya colisión se necesita
    colisión de keccak256 en un input de 52 bytes — computacionalmente inviable
    (2^128 operaciones). NO hay vulnerabilidad aquí.
  impact: "Ninguno — la domain separation es correcta"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // For any two distinct pairs (to_a, hash_a) and (to_b, hash_b):
    // keccak256(bytes.concat(bytes20(to_a), hash_a)) !=
    //   keccak256(bytes.concat(bytes20(to_b), hash_b))
    // This is guaranteed by keccak256 collision resistance.
    // Fuzz test: generate random pairs and verify no collision.
    bytes32 h1 = keccak256(bytes.concat(bytes20(ghost_addr1), ghost_hash1));
    bytes32 h2 = keccak256(bytes.concat(bytes20(ghost_addr2), ghost_hash2));
    if (ghost_addr1 != ghost_addr2 || ghost_hash1 != ghost_hash2) {
        t(h1 != h2, "B-M-03: reenterHash collision found");
    }
  ghost_vars:
  - "address internal ghost_addr1;"
  - "address internal ghost_addr2;"
  - "bytes32 internal ghost_hash1;"
  - "bytes32 internal ghost_hash2;"
  validated: false
  priority: medium
  confidence: 95
  notes: >
    Investigado a fondo. La concatenación es de tamaño fijo (20+32=52 bytes),
    no hay ambigüedad tipo ABI encoding (donde longitudes variables pueden
    crear colisiones). keccak256 collision resistance hace esto seguro.
    Marcado como false positive potencial pero incluido para completitud.

- id: B-M-04
  tier: 2
  type: property
  description: "callbackHash = keccak256('') no crea bypass: keccak256(bytes('')) = 0xc5d2...46b8, que es != bytes32(0), por lo tanto el branch 'else' se ejecuta y reenterHash se setea correctamente"
  attack_scenario: >
    Un atacante podría intentar usar callbackHash = keccak256("") pensando que
    esto bypasea el check de reenterHash (confundirlo con bytes32(0)).
    Análisis: keccak256("") = 0xc5d2460186f7233c927e7db2dcc703c0e500b653ca82
    273b7bfad8045d85a470. Esto es != bytes32(0), por lo tanto el contrato
    entra en el branch 'else' y setea reenterHash = keccak256(concat(to,
    callbackHash)). El callee DEBE llamar reenter con datos que hasheen a
    ese callbackHash. Si no lo hace, la tx revierte con MissingExpectedReenter.
    No hay bypass.
  impact: "Ninguno — el comportamiento es correcto"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: keccak256("") is NOT bytes32(0)
    bytes32 emptyHash = keccak256("");
    t(emptyHash != bytes32(0),
        "B-M-04: keccak256 of empty bytes equals zero — unexpected");
    // Verify: setting callbackHash to keccak256("") triggers reenter requirement
    // (the else branch), not the zero branch
    if (ghost_lastCallbackHash == emptyHash) {
        t(ghost_lastReenterHash != bytes32(0),
            "B-M-04: empty hash treated as zero — bypass possible");
    }
  ghost_vars:
  - "bytes32 internal ghost_lastCallbackHash;"
  - "bytes32 internal ghost_lastReenterHash;"
  validated: false
  priority: medium
  confidence: 95
  notes: >
    Investigado. keccak256("") = 0xc5d246... que es un valor no-cero.
    El contrato correctamente distingue entre callbackHash=0 (no espera
    reenter) y callbackHash=keccak256("") (espera reenter con datos vacíos).
    No hay bypass. Marcando como false positive investigado.

- id: B-M-05
  tier: 2
  type: property
  description: "OOG por bundle.length extremo: no hay límite superior en bundle.length. Un bundle con miles de entries consume gas proporcional a O(n) en el loop."
  attack_scenario: >
    Un atacante crea un bundle con miles de entries donde cada call es a
    address(0) con data vacía y value=0. El loop consume ~5000 gas por
    iteración (SSTORE transient para reenterHash + call overhead). Con
    block gas limit de 30M, se pueden hacer ~6000 iteraciones.
    Impacto: el atacante solo se daña a sí mismo (paga el gas). No hay
    griefing posible porque el atacante es quien llama multicall.
    EXCEPTO: si el bundler se usa como callback target donde OTRO contrato
    llama multicall y el atacante controla el bundle array — entonces podría
    hacer que la tx del otro contrato falle por OOG.
  impact: "Auto-griefing (atacante paga su propio gas). Potencial griefing si bundler es llamado por otro contrato."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: multicall with large bundle doesn't cause unexpected state
    // (only OOG, which is handled by EVM gas mechanics)
    // This is a gas consumption test, not a state invariant
    t(ghost_bundleLength <= 1000,
        "B-M-05: bundle length exceeds reasonable limit");
  ghost_vars:
  - "uint256 internal ghost_bundleLength;"
  validated: false
  priority: low
  confidence: 85
  notes: >
    Investigado. El gas limit del bloque es la protección natural.
    multicall requiere initiator == address(0), por lo que no puede ser
    llamado por otro contrato mid-execution (AlreadyInitiated). Solo
    reenter podría ser usado para griefing, pero requiere conocer el
    reenterHash. Riesgo real: mínimo.

