# ══════════════════════════════════════════════════════════════════
#  ANÁLISIS DE FLUJO — FlowHunter
#  Foco: reentrancy, CEI violations, token flow, callback abuse
#
#  ARQUITECTURA DEL FLUJO BID (crítico para entender los vectores):
#
#  bid(asset, amount, data):
#    1. CHECK:  s_entered? → revert
#    2. EFFECT: s_entered = true
#    3. CHECK:  auctionStart != 0 && elapsedTime <= duration
#    4. CHECK:  bidUsdValue >= minBidUsdValue
#    5. CHECK:  amount <= balanceOf(this)
#    6. COMPUTE: assetOutAmount = _getAssetOutAmount(...)
#    7. INTERACT: IERC20(asset).safeTransfer(msg.sender, amount)  ← assetIn OUT
#    8. INTERACT: if(data) IAuctionCallback(msg.sender).auctionCallback(...) ← CALLBACK
#    9. INTERACT: IERC20(assetOut).safeTransferFrom(msg.sender, this, assetOutAmount) ← assetOut IN
#   10. EFFECT: s_entered = false
#
#  El guard `s_entered` es un bool custom (NO OpenZeppelin nonReentrant).
#  El bid() NO tiene onlyRole — cualquier EOA o contrato puede llamarlo.
#  La reentrancy directa a bid() está bloqueada por s_entered.
#
#  VECTOR CRÍTICO IDENTIFICADO:
#  Durante el callback (paso 8), s_entered=true bloquea re-bid() en BaseAuction.
#  PERO: el callback en AuctionBidder ejecuta _multiCall(calls) con targets arbitrarios.
#  Si en esa secuencia de calls se llama a performUpkeep() o applyAssetParamsUpdates(),
#  esas funciones NO comprueban s_entered. El guard solo protege bid().
#
#  SEGUNDO VECTOR: El `assetOutAmount` se fija en el paso 6 con el timestamp de la tx.
#  Si el callback tarda (no aplica en EVM síncrona), pero el precio computado en paso 6
#  usa _getAssetOutAmount(elapsedTime = block.timestamp - auctionStart). Si el bidder
#  puede manipular el auctionStart (no puede directamente), el precio varía.
#
#  TERCER VECTOR: isValidSignature() en GPV2CompatibleAuction comprueba s_entered.
#  Pero el flujo GPV2 no usa bid() — usa el vault relayer de CoW Protocol.
#  Hay una superficie de interacción: ¿puede alguien iniciar un bid() mientras
#  CoW Protocol liquida, creando un estado inconsistente?
#
#  CUARTO VECTOR: performUpkeep llama _onAuctionEnd() que envía assetOut al receiver.
#  Si se puede manejar el timing: bid() en proceso → performUpkeep() en otra tx (MEV) →
#  auctionStarts[asset] = 0 → bid() sigue y cobra assetOut pero el auction ya terminó.
#  Pero esto es cross-tx, no intra-tx. Checkeable como race condition.
#
#  QUINTO VECTOR: callback en AuctionBidder usa _multiCall() con calls arbitrarias.
#  El AuctionBidder verifica msg.sender == s_auction en auctionCallback(). PERO:
#  un bidder personalizado (no AuctionBidder) no tiene esa validación. El protocolo
#  espera que cualquier contrato con IAuctionCallback pueda ser bidder. La interface
#  no obliga esa validación. Un bidder malicioso puede ignorar el amountOut param
#  y solo hacer approve del mínimo necesario via approve justo antes del safeTransferFrom.
#
#  SEXTO VECTOR (CEI violation): paso 7 transfiere assetIn al bidder ANTES de recibir
#  assetOut (paso 9). Si safeTransferFrom en paso 9 falla (e.g., el bidder no aprobó
#  suficiente), el contrato ya transfirió el assetIn. SafeERC20 revertirá, deshaciendo
#  la tx completa → no hay pérdida. PERO si el token assetOut tiene lógica de revert
#  selectiva (blacklist), el bidder puede poner el auction contract en blacklist y
#  hacer que el safeTransferFrom revierte después de recibir assetIn.
# ══════════════════════════════════════════════════════════════════

invariants:

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-01 (TIER 1 — CRÍTICO)
# Reentrancy parcial: bid() → callback → performUpkeep()
# Durante el callback (step 8), s_entered=true. Pero performUpkeep() NO
# comprueba s_entered. Un bidder malicioso puede llamar performUpkeep()
# desde su auctionCallback, cerrando el auction DURANTE una bid activa.
# Resultado: auctionStarts[asset] = 0 durante el bid, pero bid() continúa
# y ejecuta safeTransferFrom() sin que el auction sea válido post-callback.
# El contrato ya entregó el assetIn (paso 7) y ahora cobra assetOut aunque
# el auction fue artificialmente cerrado mid-flight.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-01
  tier: 1
  type: property
  description: >
    Durante bid(), si el callback llama performUpkeep() para cerrar el mismo auction,
    auctionStarts[asset] queda a 0 mid-flight pero bid() continúa cobrando assetOut.
    El contrato ya entregó assetIn al bidder; el auction fue cerrado; el guard s_entered
    no protege performUpkeep(). Doble drenaje potencial si se explota correctamente.
  attack_scenario: >
    1. Atacante despliega MaliciousBidder que implementa IAuctionCallback.
    2. Llama bid(assetIn, amount, data) en BaseAuction con data != empty.
    3. BaseAuction hace safeTransfer(assetIn, MaliciousBidder, amount). ← assetIn cobrado
    4. BaseAuction llama MaliciousBidder.auctionCallback(...).
    5. Dentro del callback, MaliciousBidder llama BaseAuction.performUpkeep() con
       endedAuctions = [assetIn] (puede forzar fin de auction si elapsed > duration
       o si manipuló el balance para que el USD value caiga por debajo del mínimo).
    6. performUpkeep() ejecuta _onAuctionEnd(assetIn): transfiere assetIn restante
       de vuelta al feeAggregator Y transfiere el assetOut acumulado al assetOutReceiver.
    7. delete s_auctionStarts[assetIn]. Auction cerrada mid-bid.
    8. Control vuelve a bid(). bid() ejecuta safeTransferFrom(assetOut, bidder, assetOutAmount).
    9. Si el bidder ya pre-aprobó assetOut o tiene balance, paga assetOutAmount.
    10. PERO: _onAuctionEnd ya envió el assetOut acumulado al receiver. El contrato recibe
        assetOutAmount sin respaldo real en el sistema (el assetIn ya fue distribuido).
    IMPACTO: Posible extracción de assetIn sin entregar assetOut correctamente al sistema,
    o doble contabilidad si el assetOut se envía dos veces (al receiver via _onAuctionEnd
    + al contrato via safeTransferFrom en bid()).
    NOTA: El éxito depende de si performUpkeep tiene onlyRole(AUCTION_WORKER_ROLE).
    Si el atacante no tiene AUCTION_WORKER_ROLE, este vector directo falla.
    VECTOR ALTERNATIVO: usar checkUpkeep + automation operator o buscar otra función
    sin role que llame _onAuctionEnd indirectamente.
  solidity: |
    // Property: si s_entered=true, auctionStarts[asset] no debe cambiar durante bid()
    // Ghost: capturamos auctionStart antes del bid y verificamos que no cambia post-callback
    // En Chimera: wrapar bid() y medir auctionStarts antes/después del callback
    uint256 ghost_auctionStartBefore;
    address ghost_bidAsset;

    // En handler de bid():
    // ghost_bidAsset = asset;
    // ghost_auctionStartBefore = auction.getAuctionStart(asset);
    // auction.bid(asset, amount, data);
    // uint256 auctionStartAfter = auction.getAuctionStart(asset);
    // eq(ghost_auctionStartBefore, auctionStartAfter,
    //    "BA-FLOW-01: auctionStart mutated during active bid");

    // Versión property directa:
    // El guard s_entered debería ser verificado en performUpkeep también
    if (auction.getAuctionStart(ghost_bidAsset) == 0 && ghost_auctionStartBefore != 0) {
        // Auction cerrada durante una bid activa — VIOLACIÓN
        t(false, "BA-FLOW-01: auction closed mid-bid via callback");
    }
  ghost_vars:
  - uint256 internal ghost_ba_flow01_auctionStartBefore;
  - address internal ghost_ba_flow01_bidAsset;
  - bool internal ghost_ba_flow01_bidActive;
  validated: false
  priority: critical
  confidence: 55
  notes: >
    IMPORTANTE: La precondición crítica es que el atacante tenga AUCTION_WORKER_ROLE
    para llamar performUpkeep(). Sin ese rol, el vector directo falla. Investigar si
    hay otra ruta para cerrar auctions sin ese rol (checkUpkeep no es el problema,
    performUpkeep sí requiere el rol según el código).
    REDUCCIÓN DE CONFIANZA: de 80% a 55% por la barrera de AUCTION_WORKER_ROLE.
    PENDIENTE: verificar si s_entered se comprueba en performUpkeep o cualquier función
    administrativa llamable desde el callback.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-02 (TIER 1 — ALTO)
# CEI Violation: assetIn sale ANTES de que assetOut entre
# La transferencia en paso 7 envía assetIn al bidder antes de recibir
# assetOut en paso 9. Si el token assetOut tiene lógica que puede hacer
# revert selectivo (e.g., USDC blacklist), un bidder podría configurar
# su contrato para recibir el assetIn (paso 7) y luego hacer que el
# safeTransferFrom del paso 9 falle de forma externa.
# En EVM el revert propaga hacia arriba, deshaciendo todo. PERO si el
# token assetOut tiene un callback que permite al bidder ejecutar código
# antes de que el revert se propague (e.g., ERC777 tokensToSend hook
# o un token deflationary con hook en safeTransferFrom del sender),
# hay un window de explotación.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-02
  tier: 1
  type: property
  description: >
    CEI parcial violado: assetIn sale al bidder (línea 444) antes de que assetOut entre
    (línea 453). Con tokens ERC777 como assetOut, el hook tokensToSend del bidder
    se dispara ANTES de que los tokens salgan del bidder, dentro de safeTransferFrom.
    El bidder puede ver que ya recibió assetIn y ejecutar lógica maliciosa.
    Aunque el revert global deshace si el hook falla, si el hook exitoso permite
    reentrancy parcial o manipulación de estado externo, hay daño.
  attack_scenario: >
    Escenario con assetOut = token ERC777:
    1. Atacante despliega MaliciousBidder con interfaz ERC777 tokensToSend.
    2. Llama bid(assetIn, amount, ""). Sin callback, flujo directo.
    3. Paso 7: BaseAuction.safeTransfer(assetIn, MaliciousBidder, amount). ← assetIn cobrado
    4. Paso 9: BaseAuction.safeTransferFrom(assetOut, MaliciousBidder, this, assetOutAmount)
       → ERC777 llama tokensToSend en MaliciousBidder ANTES de transferir.
    5. En tokensToSend: MaliciousBidder ya tiene assetIn. Si hace operaciones externas
       en este punto (e.g., intercambio del assetIn recibido en un DEX), puede extraer
       valor antes de que la transacción complete.
    6. Si tokensToSend retorna sin revert, safeTransferFrom completa, s_entered=false.
    7. MaliciousBidder tiene: assetIn cambiado por valor en DEX + pagó assetOut.
    NOTA: Si assetOut NO es ERC777, este vector específico no aplica.
    Escenario alternativo (blacklist):
    1. Bidder pone al auction contract en la blacklist de USDC (assetOut=USDC).
    2. bid() llega al paso 9, safeTransferFrom falla. Revert completo.
    3. PERO: si el bidder tiene un arreglo con la USDC issuer... poco realista.
    VECTOR MÁS REALISTA: Sin callback y con assetOut estándar ERC20, la secuencia
    es safe porque revert es atómico. El riesgo real es con tokens no-estándar.
  solidity: |
    // Property: el balance de assetIn del contrato debe haber disminuido en `amount`
    // solamente si el balance de assetOut del contrato aumentó en `assetOutAmount`
    // ambas cosas deben ocurrir atomicamente (si una falla, ambas deben fallar)
    uint256 ghost_assetInBefore;
    uint256 ghost_assetOutBefore;
    uint256 ghost_bidAmount;
    uint256 ghost_bidAssetOutAmount;

    // Antes del bid:
    // ghost_assetInBefore = IERC20(assetIn).balanceOf(address(auction));
    // ghost_assetOutBefore = IERC20(assetOut).balanceOf(address(auction));
    // Después del bid exitoso:
    // uint256 assetInAfter = IERC20(assetIn).balanceOf(address(auction));
    // uint256 assetOutAfter = IERC20(assetOut).balanceOf(address(auction));
    // Invariante: si bid exitoso, ambos cambios deben ser coherentes
    if (ghost_bidActive) {
        uint256 assetInDelta = ghost_assetInBefore - IERC20(ghost_bidAsset).balanceOf(address(auction));
        uint256 assetOutDelta = IERC20(auction.getAssetOut()).balanceOf(address(auction)) - ghost_assetOutBefore;
        // assetInDelta debe == ghost_bidAmount, assetOutDelta debe == ghost_bidAssetOutAmount
        eq(assetInDelta, ghost_bidAmount, "BA-FLOW-02: assetIn delta mismatch");
        gte(assetOutDelta, ghost_bidAssetOutAmount, "BA-FLOW-02: assetOut delta mismatch");
    }
  ghost_vars:
  - uint256 internal ghost_ba_flow02_assetInBefore;
  - uint256 internal ghost_ba_flow02_assetOutBefore;
  - uint256 internal ghost_ba_flow02_bidAmount;
  validated: false
  priority: high
  confidence: 45
  notes: >
    El riesgo real depende del token assetOut. Con LINK token estándar ERC20, la
    secuencia es atómica y safe. El vector ERC777 es realista solo si assetOut puede
    ser un token con hooks. Reducido a confianza 45% porque LINK es el assetOut
