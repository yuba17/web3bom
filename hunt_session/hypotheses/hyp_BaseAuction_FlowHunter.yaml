# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-03 (TIER 1 — CRÍTICO)
# Callback arbitrario: _multiCall en AuctionBidder ejecuta calls sin whitelist
# AuctionBidder._multiCall(calls) ejecuta calls a ANY target con ANY data.
# Esto es un vector de control arbitrario que puede afectar al auction contract
# DURANTE el callback (s_entered=true en auction, pero eso no protege al bidder).
# El bidder puede llamar: approve() en tokens del bidder, interactuar con DEXes,
# o llamar funciones del auction que NO comprueban s_entered.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-03
  tier: 1
  type: property
  description: >
    AuctionBidder._multiCall(calls) en auctionCallback() ejecuta llamadas arbitrarias
    a cualquier dirección sin whitelist. Esto permite que el operador del AuctionBidder
    construya secuencias que interactúen con el auction contract en funciones que NO
    tienen el guard s_entered. Funciones vulnerables durante callback: performUpkeep
    (si tiene rol), applyAssetParamsUpdates (si tiene ASSET_ADMIN_ROLE). Las calls
    se ejecutan con el AuctionBidder como msg.sender.
  attack_scenario: >
    Escenario con AuctionBidder como bidder:
    1. Operador de AuctionBidder construye solution = [Call(target=auction, data=performUpkeepCalldata)]
    2. Llama AuctionBidder.bid(assetIn, amount, solution).
    3. AuctionBidder llama auction.bid(assetIn, amount, abi.encode(solution)).
    4. auction.bid() hace safeTransfer(assetIn, AuctionBidder). ← assetIn al bidder
    5. auction.bid() llama AuctionBidder.auctionCallback(from, assetOut, amountOut, data).
    6. AuctionBidder ejecuta _multiCall(calls):
       → Call 1: auction.performUpkeep(endedAuctions=[assetIn]) si AUCTION_WORKER_ROLE
       → Esto cierra el auction: _onAuctionEnd envía assetOut acumulado al receiver
       → delete s_auctionStarts[assetIn]
    7. AuctionBidder hace forceApprove(assetOut, auction, amountOut). ← approve el pago
    8. Control vuelve a auction.bid(). Ejecuta safeTransferFrom(assetOut, bidder, amountOut).
    9. El auction recibe assetOut DESPUÉS de haber cerrado. El assetIn ya fue a bidder.
    RESULTADO: El bidder recibe assetIn y paga assetOut como en un bid normal.
    El problema: _onAuctionEnd también transfirió cualquier assetOut previamente
    acumulado (de bids anteriores) al receiver. Si había assetOut acumulado, ese
    flujo es correcto. El daño real ocurre si el cierre prematuro del auction
    le permite al bidder obtener assetIn a un precio más ventajoso (e.g., el auction
    estaba al principio con priceMultiplier máximo y el bidder cierra y reabre).
    ATAQUE REAL: bid a precio favorable → callback cierra auction → reabre en nueva tx
    → bid de nuevo a precio inicial (más favorable).
  solidity: |
    // Property: si bid() completó exitosamente (s_entered fue true y volvió a false),
    // el auctionStart del asset debe seguir siendo el mismo que cuando empezó el bid
    // (no debe haber sido reseteado a 0 durante el proceso)
    address ghost_ba03_asset;
    uint256 ghost_ba03_auctionStartSnapshot;

    // Capturar antes del bid en el handler:
    // ghost_ba03_asset = asset;
    // ghost_ba03_auctionStartSnapshot = auction.getAuctionStart(asset);

    // Al final del handler (post-bid exitoso):
    uint256 auctionStartPost = auction.getAuctionStart(ghost_ba03_asset);
    if (ghost_ba03_auctionStartSnapshot != 0) {
        // Si el bid fue exitoso, el auction start debería ser el mismo
        // (no debería haber sido reseteado durante la ejecución del bid)
        t(
            auctionStartPost == ghost_ba03_auctionStartSnapshot || auctionStartPost == 0,
            "BA-FLOW-03: auctionStart mutated during bid execution"
        );
    }
  ghost_vars:
  - address internal ghost_ba03_asset;
  - uint256 internal ghost_ba03_auctionStartSnapshot;
  validated: false
  priority: critical
  confidence: 60
  notes: >
    La viabilidad depende de si el operador del AuctionBidder tiene AUCTION_WORKER_ROLE.
    El protocolo está diseñado para que el mismo operador gestione tanto el bidder como
    el keepers. Si AUCTION_WORKER_ROLE y AUCTION_BIDDER_ROLE son asignados al mismo
    entity, este vector es completamente realizable. Verificar en el deployment real.
    La confianza es 60% por esta dependencia.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-04 (TIER 1 — CRÍTICO)
# Bid sin callback: assetOutAmount calculado con elapsedTime de block.timestamp
# pero el precio assetIn viene de _getAssetPrice(asset, true) que usa Data Streams.
# Si el precio del feed puede ser manipulado o está stale, el assetOutAmount
# puede ser incorrecto. Pero este es más del dominio OracleHunter.
# FlowHunter: ¿puede el bidder manipular el `amount` para obtener más assetIn
# de lo que debería, explotando el check `amount <= balanceOf(this)`?
# El contrato tiene: availableBalance = IERC20(asset).balanceOf(address(this))
# if (amount > availableBalance) revert BidAmountTooHigh
# PERO no verifica que `amount` sea el monto correcto según el USD value del auction.
# Un bidder puede bid con amount = 1 wei (mínimo USD value) y recibir 1 wei de assetIn.
# El auction continúa parcialmente. Esto es funcionalidad esperada (partial fills).
# VECTOR: ¿puede el bidder hacer multiple partial bids en la misma tx via callback?
# No — s_entered bloquea re-entrar bid(). Pero bids consecutivos en txs separadas
# son perfectamente válidos. No hay DOS protection por bidder.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-04
  tier: 2
  type: property
  description: >
    El contrato no verifica que el auction siga siendo válido DESPUÉS del callback
    (entre paso 8 y paso 9). La validación de auction está en el paso 3, pero el
    estado puede cambiar durante el callback. Específicamente: si el callback hace
    que el auction expire (por manipulación de timestamp — imposible en EVM) o si
    el auctionStart fue eliminado (requiere rol), la tx continúa igualmente.
    Invariante: el estado de validez del auction al inicio del bid debe mantenerse
    hasta el final del bid.
  attack_scenario: >
    En el estado actual del código (performUpkeep con onlyRole), este vector
    requiere privilegios. Sin embargo, es importante como invariante de diseño:
    el período entre safeTransfer(assetIn) y safeTransferFrom(assetOut) donde
    el callback puede ejecutar lógica arbitraria, es una ventana de estado
    inconsistente que debe ser monitorizada. Si en el futuro se añade cualquier
    función sin role que pueda cerrar auctions, esta ventana se convierte en
    un vector crítico.
  solidity: |
    // Property: entre el inicio y el fin de bid(), la validez del auction no debe cambiar
    // Proxy: si bid() completa sin revert, el assetOut balance debe haber aumentado
    // en exactamente assetOutAmount
    uint256 ghost_ba04_assetOutBefore;
    uint256 ghost_ba04_expectedAssetOutIncrease;

    // Pre-bid snapshot:
    // ghost_ba04_assetOutBefore = IERC20(assetOut).balanceOf(address(auction));
    // ghost_ba04_expectedAssetOutIncrease = auction.getAssetOutAmount(asset, amount, block.timestamp);

    // Post-bid:
    uint256 assetOutAfter = IERC20(auction.getAssetOut()).balanceOf(address(auction));
    uint256 actualIncrease = assetOutAfter - ghost_ba04_assetOutBefore;
    // Permitir pequeña variación por rounding pero no cero
    gte(actualIncrease, ghost_ba04_expectedAssetOutIncrease - 1,
        "BA-FLOW-04: assetOut increase less than expected");
  ghost_vars:
  - uint256 internal ghost_ba04_assetOutBefore;
  - uint256 internal ghost_ba04_expectedAssetOutIncrease;
  validated: false
  priority: medium
  confidence: 70
  notes: >
    Este invariante también detecta bugs de rounding o cálculo en assetOutAmount.
    La confianza es alta para la propiedad básica (assetOut entrada = assetOutAmount)
    pero el vector de ataque específico requiere roles privilegiados.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-05 (TIER 1 — ALTO)
# isValidSignature() en GPV2CompatibleAuction comprueba s_entered
# para evitar que CoW Protocol llame al contrato mientras bid() está activo.
# PERO: isValidSignature() es view — no puede ser llamada durante bid()
# en la misma tx porque s_entered es storage y es true, por lo que revertiría.
# El VECTOR es el inverso: ¿puede isValidSignature() estar activa mientras
# performUpkeep() está en ejecución? isValidSignature() es view, así que
# puede leer s_entered durante performUpkeep() en una llamada separada.
# El timing attack real: CoW Protocol llama isValidSignature() en la misma tx
# donde performUpkeep() está cambiando los allowances (onAuctionStart/End).
# Como son txs separadas, s_entered=false durante isValidSignature() siempre.
# PERO hay un estado inconsistente: _onAuctionEnd revoca el approve al vault relayer,
# pero ¿qué pasa si CoW Protocol ya tiene una orden validada en vuela con ese approve?
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-05
  tier: 1
  type: property
  description: >
    GPV2CompatibleAuction._onAuctionEnd() revoca el approve al vault relayer
    (forceApprove(vaultRelayer, 0)). Si CoW Protocol tiene una orden EIP-1271 firmada
    en-flight (validada por isValidSignature en un bloque anterior) y la liquidación
    ocurre justo después de que _onAuctionEnd revoca el approve, CoW Protocol no puede
    transferir el assetIn del contrato porque el allowance es 0. La orden expira o falla.
    El assetIn queda atrapado en el auction contract (no se vende) pero el auction ya
    está cerrado. _onAuctionEnd() transfiere el assetIn de vuelta al feeAggregator,
    así que el fondo no se pierde, pero la orden CoW Protocol no se ejecuta.
    El problema real es si esto puede explotarse: un MEV puede intentar hacer que
    performUpkeep() cierre el auction ANTES de que CoW Protocol liquide, robando
    la oportunidad de precio favorable.
  attack_scenario: >
    Escenario de timing / MEV:
    1. Auction activa para LINK (assetIn=LINK). GPV2CompatibleAuction aprobó vaultRelayer.
    2. CoW Protocol solver crea una orden: vender LINK del contrato por assetOut.
    3. isValidSignature() retorna MAGIC_VALUE — orden validada.
    4. MEV bot detecta la orden de CoW Protocol pendiente en mempool.
    5. MEV bot llama performUpkeep() con endedAuctions=[LINK] en la misma tx o bloque.
    6. _onAuctionEnd(): revoca approve vaultRelayer → forceApprove(vaultRelayer, 0).
    7. CoW Protocol intenta ejecutar la orden: safeTransferFrom(LINK, auction, amount) → falla (allowance=0).
    8. La orden de CoW Protocol falla. El auction ya está cerrado.
    RESULTADO: El assetIn no se vende en CoW Protocol a precio favorable. La liquidación
    real se pierde. El assetIn vuelve al feeAggregator sin ser vendido eficientemente.
    IMPACTO: Pérdida de precio favorable para el protocolo (no para usuarios externos).
    Depende de si el MEV puede llamar performUpkeep() o si puede manipular el balance
    del contrato para que el checkUpkeep lo detecte como auction terminado.
    NOTA: El timing de checkUpkeep usa balanceOf — si el balance cae por debajo del
    minAuctionSizeUsd (en USD), el auction se marca como terminado. Si hay una bid
    parcial que reduce el balance justo antes de la liquidación CoW, el upkeep cierra.
  solidity: |
    // Property (GPV2): cuando s_entered=false, el approve del vault relayer
    // debe ser coherente con el estado del auction:
    // - Si auctionStart[asset] != 0: approve(vaultRelayer, asset) > 0
    // - Si auctionStart[asset] == 0: approve(vaultRelayer, asset) == 0
    address vaultRelayer = gpv2Auction.getGPV2VaultRelayer();
    address[] memory assets = getAuctionedAssets(); // helper

    for (uint i = 0; i < assets.length; i++) {
        uint256 auctionStart = auction.getAuctionStart(assets[i]);
        uint256 allowance = IERC20(assets[i]).allowance(address(auction), vaultRelayer);

        if (auctionStart != 0) {
            // Auction activa: debe haber allowance para el vault relayer
            gte(allowance, 0, "BA-FLOW-05: active auction but zero vault relayer allowance");
            // NOTA: allowance puede ser 0 si balanceOf=0, pero auctionStart!=0
        } else {
            // Auction cerrada: allowance debe ser 0
            eq(allowance, 0, "BA-FLOW-05: closed auction but non-zero vault relayer allowance");
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 50
  notes: >
    El impacto es sobre la eficiencia del protocolo (precio de venta peor), no sobre
    pérdida de fondos de usuarios. La confianza es 50% porque depende del timing de
    MEV y de si el MEV tiene forma de disparar performUpkeep(). Si AUCTION_WORKER_ROLE
    es solo el keeper de Chainlink Automation, este vector requiere comprometer ese keeper.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-06 (TIER 2 — MEDIO)
# performUpkeep procesa eligibleAssets Y endedAuctions en la misma tx.
# Si el mismo asset está en ambas listas (por construcción maliciosa del
# performData que pasa el AUCTION_WORKER), hay una condición de carrera:
# el asset se cierra (endedAuctions) y luego se intenta abrir (eligibleAssets)
# o viceversa. Actualmente, performUpkeep procesa eligibleAssets PRIMERO,
# luego endedAuctions. Si un asset está en eligibleAssets, se setea
# auctionStarts[asset] = block.timestamp. Luego si está en endedAuctions,
# se comprueba s_auctionStarts[asset] != 0 → pasa → se cierra y delete.
# Resultado: el asset se "abre" y se "cierra" en la misma tx, con todos
# los efectos de _onAuctionStart y _onAuctionEnd ejecutándose ambos.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-06
  tier: 2
  type: property
  description: >
    performUpkeep() permite que el mismo asset aparezca en eligibleAssets (para abrir)
    y en endedAuctions (para cerrar) simultáneamente en el mismo performData. Esto
    ejecutaría _onAuctionStart() (set approve al vaultRelayer) y luego _onAuctionEnd()
    (revoca approve, transfiere fondos) en la misma tx. El asset queda con auctionStart=0
    pero habiéndose transferido los fondos por el inicio del auction (feeAggregator →
    auction contract via transferForSwap). Los fondos quedarían en el auction contract
    sin auction activo.
  attack_scenario: >
    Requiere AUCTION_WORKER_ROLE. El worker malicioso (o comprometido) puede:
    1. Construir performData con eligibleAssets=[LINK] y endedAuctions=[LINK].
    2. performUpkeep() llama transferForSwap(auction, [LINK, amount]) — fondos van al auction.
    3. Loop eligibleAssets: auctionStarts[LINK] = timestamp. _onAuctionStart(LINK) ejecutado.
    4. Loop endedAuctions: auctionStarts[LINK] != 0 → pasa. _onAuctionEnd(LINK): transfiere
       LINK de vuelta al feeAggregator. Transfiere assetOut acumulado al receiver.
       delete auctionStarts[LINK].
    RESULTADO: Los fondos se mueven en círculo (feeAggregator → auction → feeAggregator).
    El assetOut se envía al receiver (potencialmente prematuro). Los approves se revocaron.
    No hay pérdida neta si feeAggregator recupera los fondos, pero puede haber impacto
    en el precio de venta (se perdió la oportunidad de auction) o en assetOut ya acumulado.
  solidity: |
    // Property: después de performUpkeep(), ningún asset que haya sido procesado
    // como eligibleAsset debe aparecer con auctionStart=0 (fue abierto y cerrado)
    // a menos que también estuviera en endedAuctions (lo cual sería un error de lógica)

    // Ghost: rastrear qué assets se procesaron como eligible
    mapping(address => bool) ghost_ba06_processedAsEligible;

    // Después de performUpkeep():
    // Para cada asset procesado como eligible, auctionStart debe ser != 0
    // (a menos que exista una razón legítima para que haya terminado)
    // Invariante: si asset en eligibleAssets Y en endedAuctions → error de input
    // El contrato DEBERÍA revertir si el mismo asset está en ambas listas.
    // Actualmente NO revierte — procesa ambas secuencialmente.
    for (uint i = 0; i < ghost_ba06_eligibleAssets.length; i++) {
        address asset = ghost_ba06_eligibleAssets[i];
        bool isAlsoEnded = ghost_ba06_inEndedList[asset];
        t(!isAlsoEnded, "BA-FLOW-06: same asset in eligible and ended lists");
    }
  ghost_vars:
  - address[] internal ghost_ba06_eligibleAssets;
  - mapping(address => bool) internal ghost_ba06_inEndedList;
  validated: false
  priority: medium
  confidence: 75
  notes: >
    La confianza es alta (75%) porque el código claramente procesa ambas listas
    sin verificar solapamiento. El impacto depende de si un AUCTION_WORKER_ROLE
    malicioso o comprometido construye ese performData. En un sistema con Chainlink
    Automation, el keeper construye el performData desde checkUpkeep, que no debería
    generar este solapamiento. Pero un keeper comprometido o un actor con el rol puede
    crear el input malicioso directamente. VERIFICAR: ¿hay validación de solapamiento?

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-07 (TIER 1 — ALTO)
# El callback de AuctionBidder NO valida que `from` sea un bidder legítimo
# más allá de `from == address(this)`. Cualquiera puede llamar auctionCallback()
# en AuctionBidder con from=address(AuctionBidder) y msg.sender=address(auction).
# PERO: msg.sender debe ser address(s_auction) en AuctionBidder.auctionCallback().
# Si un atacante puede hacer que un contrato se comporte como s_auction (falsificar),
# podría llamar auctionCallback() con calls maliciosas. En la práctica, s_auction
# es un slot de storage inicializado en el constructor. No hay vector de falsificación
# a menos que s_auction sea un proxy upgradeable comprometido.
# El vector real: ¿puede un bidder distinto de AuctionBidder llamar bid() con
# `data` que apunte a un callback malicioso? Sí — bid() no tiene onlyRole.
# Cualquiera puede llamar bid() con su propio callback.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-07
  tier: 1
  type: property
  description: >
    bid() no tiene onlyRole — cualquier contrato puede llamarlo con un callback arbitrario.
    El IAuctionCallback se llama con `msg.sender` como `from` (el caller de bid).
    La única restricción es que el callback DEBE llamar approve(assetOut) de vuelta al
    auction, o de lo contrario safeTransferFrom fallará. Pero el callback puede ejecutar
    CUALQUIER lógica entre recibir assetIn y otorgar el approve. Si el callback tiene
    lógica que permite flash loans o extrae valor de otro protocolo usando el assetIn
    recibido como colateral, hay un vector de extracción de valor DURANTE el callback
    que no está limitado por el guard s_entered (que solo aplica al auction contract).
  attack_scenario: >
    Flash loan del assetIn durante el callback:
    1. MaliciousBidder implementa IAuctionCallback.
    2. Llama bid(assetIn=WETH, amount=10_000e18, data=maliciousData).
    3. bid() hace safeTransfer(WETH, MaliciousBidder, 10_000e18). ← 10K WETH al atacante
    4. bid() llama MaliciousBidder.auctionCallback(this, LINK, linkAmount, data).
    5. MaliciousBidder: deposita 10K WETH en Aave como colateral.
    6. MaliciousBidder: pide prestado 8K WETH adicionales (aprovechando LTV Aave).
    7. MaliciousBidder: intercambia WETH por LINK en un DEX.
    8. MaliciousBidder: forceApprove(LINK, auction, linkAmount).
    9. Control vuelve a bid(). safeTransferFrom(LINK, MaliciousBidder, auction, linkAmount) completa.
    10. Resultado: el atacante obtuvo 10K WETH de la subasta a precio de mercado,
        los usó como colateral para apalancarse, y pagó solo linkAmount de LINK.
    NOTA: Esto no es un exploit per se — el protocolo está diseñado para que bidders
    resuelvan el pago de formas creativas (ese es el punto del callback). El precio
    de la subasta ya incorpora el valor (assetOutAmount calculado según precio y descuento).
    El "riesgo" es si el bidder puede obtener el assetIn a un precio más bajo que el
    mercado spot, lo cual es la intención del protocolo (dutch auction con descuento).
    VECTOR REAL: ¿puede el bidder obtener assetOut (LINK) más barato que el mercado
    usando el assetIn recibido como flash colateral? Solo si el auction price < spot.
    El descuento máximo está bounded por i_minPriceMultiplier. No es un bug — es feature.
    PERO: si el callback permite reentrancy hacia OTRO protocolo que tiene su propia
    vulnerabilidad, el assetIn recibido de la subasta puede amplificar el daño.
  solidity: |
    // Property: la ganancia neta del bidder (en USD) no debe exceder el descuento máximo
    // configurado por el protocolo (i_minPriceMultiplier)
    // Si el bidder gana más que eso, hay un bug de pricing
    uint256 ghost_ba07_bidderAssetInUsdValueBefore;
    uint256 ghost_ba07_bidderAssetOutUsdValueBefore;

    // Calcular: USD recibido (assetIn * priceAssetIn) - USD pagado (assetOut * priceAssetOut)
    // vs maxDiscountAllowed = (1 - minPriceMultiplier/1e18) * amountBid * priceAssetIn

    int256 bidderPnL = int256(assetInUsdReceived) - int256(assetOutUsdPaid);
    uint256 maxAllowedDiscount = (assetInUsdReceived * (1e18 - minPriceMultiplier)) / 1e18;
    lte(uint256(bidderPnL > 0 ? bidderPnL : 0), maxAllowedDiscount,
        "BA-FLOW-07: bidder profit exceeds max allowed auction discount");
  ghost_vars:
  - uint256 internal ghost_ba07_bidderAssetInUsdBefore;
  - uint256 internal ghost_ba07_bidderAssetOutUsdBefore;
  validated: false
  priority: medium
  confidence: 65
  notes: >
    Este invariante es más una verificación de pricing que de reentrancy. La confianza
    es media porque el protocolo está diseñado para permitir descuentos hasta minPriceMultiplier.
    El vector de "callback-as-flash-loan" es funcionalidad esperada en protocolos de
    dutch auction on-chain. No es explotable per se si el pricing es correcto.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-08 (TIER 1 — MUY CRÍTICO)
# HALLAZGO PRINCIPAL: s_entered se resetea a FALSE en el paso 10 de bid().
# Pero si bid() REVIERTE (después del paso 2 donde s_entered=true), ¿se
# resetea s_entered a false? En Solidity, si una función revierte, TODOS
# los cambios de estado se deshacen — incluyendo s_entered=false del paso 10
# Y incluyendo s_entered=true del paso 2. Por lo tanto, s_entered vuelve a
# false en caso de revert. El guard funciona correctamente con revertion.
# SIN EMBARGO: si el callback hace que la tx se quede sin gas (OOG), el
# comportamiento es distinto: la tx completa revierte pero es costoso.
# El VECTOR REAL: el guard s_entered es un storage bool. Una llamada
# estática (view/pure) NO actualiza storage. isValidSignature() en
# GPV2CompatibleAuction comprueba s_entered en modo view. Si bid() está
# en ejecución en una tx y SIMULTÁNEAMENTE otra tx llama isValidSignature()
# (que es view, puede leer el storage mid-tx en otro contexto de ejecución),
# isValidSignature() vería s_entered=true y revertiría con ReentrantCall.
# Esto significa que DURANTE bid(), ninguna orden CoW Protocol puede ser
# validada. Esto es un DOS en el flujo de CoW Protocol mientras hay bids.
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-08
  tier: 1
  type: property
  description: >
    DOS en isValidSignature(): mientras bid() está en ejecución (s_entered=true),
    cualquier llamada a isValidSignature() revierte con ReentrantCall. Si un solver
    de CoW Protocol intenta validar una orden en el mismo bloque donde hay un bid
    en ejecución, la validación falla. Dado que los bloques en Ethereum/L2s procesan
    txs secuencialmente, el impacto real es: si un bidder mantiene múltiples bids
    consecutivos (usando callbacks largos o manipulando el gas), puede temporalmente
    bloquear el flujo de CoW Protocol. Esto no es un DOS permanente pero puede
    crear race conditions entre los dos mecanismos de liquidación.
  attack_scenario: >
    Escenario de race condition entre bid() y CoW Protocol:
    1. Auction activa para WETH. CoW Protocol tiene orden pre-validada en-flight.
    2. Bidder crea bid() con un callback que hace operaciones complejas (tardadas en gas).
    3. Mientras el callback ejecuta, s_entered=true.
    4. CoW Protocol solver intenta llamar isValidSignature() para re-validar la orden.
    5. isValidSignature() lee s_entered=true → revert ReentrantCall.
    6. La orden de CoW Protocol no puede ser validada en esa tx. El solver falla.
    NOTA EN L2: En L2s (Arbitrum, Base) donde las transacciones son secuenciales y
    rápidas, esto es menos problemático porque las txs no se ejecutan en paralelo.
    En mainnet Ethereum, el settlement de CoW Protocol ocurre en bloques distintos
    a los bids normales. El DOS real sería en el settlement tx de CoW donde se llama
    isValidSignature() en el contexto de la settlement tx — que es una tx separada,
    NO durante un bid(). Por tanto este vector es menos crítico de lo que parece.
  solidity: |
    // Property: isValidSignature() no debe revertir cuando s_entered=false
    // Corolario: si bid() no está en progreso, las órdenes CoW pueden validarse
    // Ghost: monitorizar si isValidSignature() falla cuando no hay bid activo
    bool ghost_ba08_bidInProgress;

    // En handler de bid(): ghost_ba08_bidInProgress = true antes, false después
    // Property check: si !ghost_ba08_bidInProgress, isValidSignature() no debe
    // revertir por causa de s_entered

    // En la práctica, esto es difícil de testear en fuzzing porque isValidSignature
    // es view y no muta estado. Se puede verificar el storage slot de s_entered.
    if (!ghost_ba08_bidInProgress) {
        bool entered = auction.getSEntered(); // necesita getter expuesto o slot directo
        t(!entered, "BA-FLOW-08: s_entered=true outside of bid() execution");
    }
  ghost_vars:
  - bool internal ghost_ba08_bidInProgress;
  validated: false
  priority: low
  confidence: 80
  notes: >
    La confianza en la PROPIEDAD es alta (80%): s_entered debe ser false cuando no
    hay bid activo. La confianza en que esto sea un BUG explotable es baja (30%)
    porque los bloques de Ethereum ejecutan txs secuencialmente — s_entered solo
    es true durante la ejecución de una tx específica, y otras txs en el mismo bloque
    las ven ANTES o DESPUÉS de esa tx. No hay paralelismo real en EVM. El guard
    funciona correctamente como se diseñó. Este invariante vale para detectar si
    s_entered queda stuck en true por algún bug de revert handling.

# ─────────────────────────────────────────────────────────────────
# INV-BA-FLOW-09 (TIER 2 — OPTIMIZACIÓN ECHIDNA)
# Maximizar ganancia del bidder usando el callback como flash loan
# para verificar si el sistema de pricing puede ser explotado económicamente
# ─────────────────────────────────────────────────────────────────
- id: BA-FLOW-09
  tier: 3
  type: optimize
  description: >
    Maximizar ganancia del bidder (en USD) en un bid completo, considerando
    que el callback puede ejecutar operaciones arbitrarias. Si la función
    retorna positivo, hay un vector de extracción de valor más allá del descuento
    esperado por el protocolo.
  attack_scenario: >
    Si el profit del bidder excede el descuento máximo configurado (1 - minPriceMultiplier),
    hay una vulnerabilidad de pricing. Echidna en modo optimización puede encontrar
    secuencias de configuración de precios, timing, y amounts que maximicen el profit.
  solidity: |
    // Echidna optimize_ function: maximizar bidder profit
    // return type: int256 (positivo = ganancia, negativo = pérdida)
    uint256 assetInReceived = IERC20(assetIn).balanceOf(attacker) - ghost_ba09_attackerAssetInBefore;
    uint256 assetOutPaid = ghost_ba09_attackerAssetOutBefore - IERC20(assetOut).balanceOf(attacker);
    uint256 assetInUsdValue = (assetInReceived * assetInPrice) / (10 ** assetInDecimals);
    uint256 assetOutUsdValue = (assetOutPaid * assetOutPrice) / (10 ** assetOutDecimals);
    return int256(assetInUsdValue) - int256(assetOutUsdValue);
  ghost_vars:
  - uint256 internal ghost_ba09_attackerAssetInBefore;
  - uint256 internal ghost_ba09_attackerAssetOutBefore;
  validated: false
  priority: medium
  confidence: 60
  notes: >
    Función de optimización para Echidna. Útil para verificar que el sistema de pricing
    (priceMultiplier + oracle) no permite ganancias por encima del descuento máximo.

false_positives:
- hunter: FlowHunter
  id: BA-FP-01
  reason: >
    El flujo CEI "violado" en bid() (assetIn sale antes de assetOut entra) es
    por DISEÑO del protocolo. Es una dutch auction con callback para que el bidder
    encuentre el assetOut. La secuencia Transfer → Callback → TransferFrom es el
    modelo intencional de muchos protocolos de auction on-chain (similar a flash loans).
    No es un bug per se — es el mecanismo de liquidez que permite al bidder resolver
    el pago de forma flexible. La protección viene del guard s_entered y de que
    safeTransferFrom revertirá si el bidder no paga.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_knowledge
    briefing: dex.md
    content: >
      Dutch auctions con callback (tipo "flash bid") son un patrón intencional.
      El flujo Transfer-Callback-TransferFrom no es un CEI violation — es el diseño.
      El guard de reentrancy (s_entered bool) protege contra re-entrar bid() pero
      NO protege contra llamadas a otras funciones del contrato durante el callback.
      Verificar qué otras funciones pueden ser llamadas sin s_entered check cuando
      se evalúa un finding de reentrancy en este patrón.
    briefing_update_applied: false

- hunter: FlowHunter
  id: BA-FP-02
  reason: >
    El vector BA-FLOW-07 ("callback como flash loan para apalancamiento") NO es un bug.
    El protocolo está diseñado para que los bidders sean solvers sofisticados que pueden
    usar el assetIn recibido para financiar el pago de assetOut. Es exactamente el mismo
    modelo que los flash loans de Aave/Uniswap. Si el precio de la subasta es correcto
    (coherente con el oracle), el protocolo recupera el valor esperado. El bidder gana
    solo el descuento configurado — ese descuento es el incentivo para participar.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      En dutch auctions con callback, el uso del assetIn recibido como colateral temporal
      para financiar el pago de assetOut es FUNCIONALIDAD ESPERADA, no un exploit.
      Solo es un problema si el bidder obtiene más valor del que debería según el pricing.
    briefing_update_applied: false

