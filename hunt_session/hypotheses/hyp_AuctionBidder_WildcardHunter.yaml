hunter: WildcardHunter
component: AuctionBidder
date: "2026-03-22"
invariants:
  - id: AB-W-01
    description: "_multiCall has no target or selector restrictions — AUCTION_BIDDER_ROLE can execute arbitrary calls as AuctionBidder, including setting unlimited ERC20 approvals to arbitrary addresses"
    confidence: 70
    severity: "Medium"
    attack_scenario: |
      The `solution` Call[] array passed to `bid()` is forwarded through the auction callback
      into `_multiCall()` without ANY restriction on targets or selectors. An entity with
      AUCTION_BIDDER_ROLE can craft a solution that includes:
        1. Call to USDC.approve(attacker, type(uint256).max) — sets unlimited USDC approval
        2. Call to WETH.approve(attacker, type(uint256).max) — sets unlimited WETH approval
        3. Any other ERC20 approve/transfer calls
      After the bid completes, the attacker can call transferFrom on any approved token to drain
      the AuctionBidder's balance at any future time.

      Attack path:
        1. Attacker compromises the AUCTION_BIDDER_ROLE EOA (i_auctionBidder) or the CRE workflow
        2. Calls bid() with solution = [{target: USDC, data: approve(attackerEOA, MAX)}]
        3. During auctionCallback, _multiCall executes the approval
        4. The bid itself completes normally (legitimate swap)
        5. Later, attacker calls USDC.transferFrom(auctionBidder, attacker, balance)

      Mitigating factor: AUCTION_BIDDER_ROLE is granted to WorkflowRouter (which has its own
      target+selector allowlist) and to a trusted EOA. The risk depends on the trust model for
      this role — if it's considered "restricted but not fully trusted", this is Medium.
      If AUCTION_BIDDER_ROLE is considered fully trusted (same as admin), this is by-design.

      However, the WorkflowRouter path validates target+selector on its side, meaning the
      _multiCall restriction gap only matters for the direct EOA path. The system has two
      different security levels for the same role depending on entry path.
    code_location: "AuctionBidder.sol:L107-L109 (auctionCallback → _multiCall), Caller.sol:L49-L63 (_multiCall no restrictions)"
    notes: |
      Compare with WorkflowRouter.onReport() which validates target+selector allowlists.
      The AuctionBidder._multiCall path has NO such validation — the Call[] is decoded and
      executed verbatim. This creates an asymmetry: WorkflowRouter restricts what can be called,
      but AuctionBidder does not, even though both use the same Caller._multiCall internally.

  - id: AB-W-02
    description: "_multiCall can call AuctionBidder itself — if AuctionBidder ever holds a privileged role on any external contract, the BIDDER_ROLE can invoke that privilege"
    confidence: 40
    severity: "Low"
    attack_scenario: |
      _multiCall can call address(this) with arbitrary calldata. While the AuctionBidder doesn't
      hold DEFAULT_ADMIN_ROLE on itself (so setAuction/setReceiver/withdraw are blocked), the
      risk is about EXTERNAL contracts where AuctionBidder might hold roles:
        - If AuctionBidder is granted a role on any other protocol contract (e.g., a DEX router
          whitelist, a lending protocol depositor role), _multiCall can invoke those privileges.
        - The AuctionBidder contract address is the msg.sender for all _multiCall subcalls.

      This is a latent privilege escalation vector — not exploitable today unless AuctionBidder
      holds external roles, but dangerous if the deployment evolves.

      Self-call to bid() would re-enter but BaseAuction has s_entered guard, so that specific
      path is blocked. Self-call to auctionCallback() would fail because msg.sender != s_auction.
    code_location: "Caller.sol:L27 (target.call with no address filter)"
    notes: |
      No explicit check like `require(target != address(this))` exists in _call or _multiCall.
      This is standard for solver/executor patterns but should be documented as a trust assumption.

  - id: AB-W-03
    description: "ERC165 supportsInterface check for IBaseAuction is trivially spoofable — any contract can claim to implement IBaseAuction"
    confidence: 25
    severity: "Low"
    attack_scenario: |
      In _setAuction (L150-166), the only validation beyond address(0) is:
        IERC165(auction).supportsInterface(type(IBaseAuction).interfaceId)
      A malicious contract can implement supportsInterface to return true for any interfaceId
      while having completely different bid() behavior — e.g., a bid() that calls back
      auctionCallback with manipulated amountOut or assetOut values.

      However, setAuction requires DEFAULT_ADMIN_ROLE, so this is only exploitable if:
        1. Admin is compromised (but then everything is compromised anyway)
        2. Admin accidentally sets a contract that passes ERC165 but behaves differently

      The ERC165 check provides false security — it doesn't verify the contract actually
      implements the expected behavior, only that it claims to.
    code_location: "AuctionBidder.sol:L156"
    notes: |
      This is a known limitation of ERC165 — it checks interface declaration, not implementation.
      Low severity because setAuction is admin-gated. Not a real attack vector unless combined
      with admin compromise. Informational at best.

  - id: AB-W-04
    description: "No reentrancy guard on auctionCallback — relies entirely on BaseAuction's s_entered flag for reentrancy protection"
    confidence: 20
    severity: "Low"
    attack_scenario: |
      auctionCallback (L97-112) has no reentrancy guard of its own. It relies on:
        1. msg.sender == s_auction (only auction can call it)
        2. BaseAuction.bid() sets s_entered = true before the callback

      If a different auction implementation (set via setAuction) does NOT have a reentrancy
      guard, the flow could be:
        1. auctionCallback executes _multiCall
        2. _multiCall calls back into the auction's bid() (no s_entered check in new auction)
        3. The new auction calls auctionCallback again
        4. Nested callbacks could manipulate state or drain extra tokens

      Mitigating factors: requires admin to set a malicious/buggy auction. The current
      BaseAuction has proper reentrancy protection. This is a defense-in-depth concern.
    code_location: "AuctionBidder.sol:L97-L112"
    notes: |
      The AuctionBidder trusts that s_auction implements proper reentrancy protection.
      This is a reasonable trust assumption given admin controls setAuction, but adding
      a reentrancy guard to auctionCallback would be defense-in-depth.

  - id: AB-W-05
    description: "Post-bid assetOut balance sweep sends ALL remaining assetOut to s_receiver — tokens deposited between bid() call and completion could be swept"
    confidence: 15
    severity: "Low"
    attack_scenario: |
      After auction.bid() completes (L81), lines 83-91 check the ENTIRE assetOut balance
      and transfer it all to s_receiver. This means:
        1. If another transaction deposits assetOut tokens to AuctionBidder in the same block
           (before line 83 executes), those tokens get swept to s_receiver
        2. If _multiCall acquires extra assetOut beyond what's needed for the auction payment,
           all excess goes to s_receiver

      This is likely intended behavior (sweep leftover profit to receiver), but it creates a
      subtle issue: any assetOut tokens held by AuctionBidder for any reason other than the
      current bid will be swept. The withdraw() function (admin-only) becomes useless for
      assetOut recovery during active bids.

      In practice, the AuctionBidder shouldn't hold tokens outside of bid execution, so this
      is very low risk. But if operational processes ever park tokens in the contract, they'd
      be swept on the next bid.
    code_location: "AuctionBidder.sol:L83-L91"
    notes: |
      The sweep uses balanceOf(address(this)) which includes any pre-existing balance, not
      just what was acquired during this bid. This is typical for solver patterns but worth
      noting as a trust assumption on operational procedures.

  - id: AB-W-06
    description: "_multiCall with no gas limit per subcall — a single high-gas call in the solution can consume all available gas, causing the entire bid to fail"
    confidence: 30
    severity: "Low"
    attack_scenario: |
      The _call function (Caller.sol L27) forwards ALL remaining gas to each subcall via
      target.call(data). There is no per-call gas limit. An AUCTION_BIDDER_ROLE holder
      can craft a solution with a call that consumes excessive gas (e.g., a contract that
      loops), causing the bid transaction to run out of gas.

      This is a griefing vector: a compromised BIDDER_ROLE can prevent legitimate bids from
      completing by submitting solutions that always OOG. However, the admin can revoke the
      BIDDER_ROLE to stop this.

      More subtly: if the _multiCall is used to interact with external protocols (DEX swaps,
      etc.), a malicious external contract could consume excessive gas in a receive/fallback,
      causing the bid to fail unpredictably.
    code_location: "Caller.sol:L27"
    notes: |
      Standard pattern for solver contracts. Gas griefing is mitigated by the role-based
      access control — only trusted entities can submit solutions. Low severity because it's
      a DoS vector, not a fund-loss vector.
