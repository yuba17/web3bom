- id: PM-O-01
  tier: 1
  type: property
  description: >
    transmit() staleness check (L162) only validates LOWER bound:
    observationsTimestamp >= block.timestamp - stalenessThreshold.
    There is NO upper bound check — a report with observationsTimestamp
    in the FUTURE (> block.timestamp) passes validation. A malicious or
    buggy DON report with a future timestamp would be stored and used as
    a valid price. This future timestamp also means the price cannot become
    "stale" until block.timestamp catches up, effectively locking in
    a price for longer than intended.
  attack_scenario: >
    1. PRICE_ADMIN transmits a report verified by VerifierProxy
    where observationsTimestamp = block.timestamp + 1 day.
    2. Staleness check passes: (block.timestamp + 86400) >= (block.timestamp - threshold) is always true.
    3. Price is stored with timestamp = block.timestamp + 86400.
    4. In _getAssetPrice, updatedAt = future timestamp, so
    updatedAt < minTimestamp is FALSE — Data Streams price is treated as fresh.
    5. This price remains "fresh" for an extra 86400 seconds beyond
    what stalenessThreshold intended.
    6. If the real market price diverges significantly during this
    extended validity window, the protocol operates on a stale price.
    Impact: Auction pricing uses stale prices for extended period,
    enabling arbitrage against the protocol (buy cheap / sell expensive).
  impact: "Protocol uses incorrect price for auctions for an extended period. Arbitrageurs extract value by buying underpriced assets or selling overpriced assets."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After transmit(), verify observationsTimestamp <= block.timestamp
    // This checks the upper bound that the contract misses
    DataStreamsPriceInfo memory priceInfo = s_dataStreamsPrice[asset];
    lte(uint256(priceInfo.timestamp), block.timestamp, "PM-O-01: future timestamp accepted in transmit");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    The VerifierProxy validates the DON signature, so the report must come
    from legitimate DON nodes. The question is whether DON reports can
    ever have observationsTimestamp > block.timestamp. Data Streams
    reports represent off-chain observations and timestamps are set by
    DON nodes, not the blockchain. Clock skew between DON and L1/L2
    could produce slightly future timestamps. The VerifierProxy itself
    may or may not enforce this bound — needs investigation. Confidence
    reduced because DON infrastructure likely prevents large future
    timestamps, but the code-level check is definitively missing.

- id: PM-O-02
  tier: 1
  type: property
  description: >
    Chainlink fallback in _getAssetPrice (L386) calls latestRoundData()
    but does NOT check answeredInRound >= roundId. The classic Chainlink
    staleness pattern requires this check to ensure the answer has been
    finalized for the current round. Without it, a stale answer from a
    previous round could be returned if the current round has not yet
    received enough oracle responses.
  attack_scenario: >
    1. Data Streams price is stale (updatedAt < minTimestamp), triggering fallback.
    2. Chainlink feed's current round has not been answered yet
    (answeredInRound < roundId) — the feed returns the previous round's answer.
    3. _getAssetPrice uses this potentially stale/unfinalized answer.
    4. If the real price has moved significantly since the previous round,
    the protocol operates on an incorrect price.
    5. In auction context (BaseAuction.performUpkeep with withValidation=true),
    this stale price sets auction parameters incorrectly.
    Impact: Auctions start with incorrect pricing, allowing extractors to
    buy assets below market or sell above market.
  impact: "Stale Chainlink fallback price used for auction pricing, enabling value extraction."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Simulate the fallback path and check answeredInRound >= roundId
    FeedInfo memory feedInfo = s_feedInfo[asset];
    if (address(feedInfo.usdDataFeed) != address(0)) {
        (uint80 roundId, int256 answer,, uint256 dataFeedUpdatedAt, uint80 answeredInRound) =
            feedInfo.usdDataFeed.latestRoundData();
        // The contract does NOT perform this check:
        gte(uint256(answeredInRound), uint256(roundId), "PM-O-02: answeredInRound < roundId in Chainlink fallback");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 60
  notes: >
    The answeredInRound >= roundId check is considered best practice by
    Chainlink documentation and is flagged by most audit checklists.
    However, in practice, latestRoundData on modern Chainlink feeds (OCR)
    almost always returns answeredInRound == roundId. The check matters
    more for legacy FluxAggregator feeds. Confidence moderate because
    this is a real missing check but practical exploitability depends
    on the specific feed type used. Additionally, the staleness check
    via updatedAt < minTimestamp provides partial mitigation — if the
    round is truly stale, updatedAt would also be old.

- id: PM-O-03
  tier: 1
  type: property
  description: >
    In _getAssetPrice (L392), the Chainlink fallback uses
    answer.toUint256() (SafeCast) which REVERTS if answer is negative.
    This revert happens even when withValidation=false (the external
    getAssetPrice getter). A negative Chainlink answer (extreme market
    event or feed malfunction) causes a hard revert in the view function,
    making price queries completely unavailable. With withValidation=false,
    the function should return isValid=false instead of reverting.
  attack_scenario: >
    1. Data Streams price is stale, triggering Chainlink fallback.
    2. Chainlink feed returns a negative answer (e.g., during an
    extreme depegging event or feed malfunction — some commodity feeds
    historically returned negative).
    3. answer.toUint256() reverts via SafeCast overflow.
    4. getAssetPrice() (external, withValidation=false) reverts instead
    of returning (0, 0, false).
    5. Any contract depending on getAssetPrice() for non-critical checks
    (e.g., UI display, optional price checks) also reverts.
    6. More critically, internal calls with withValidation=true
    (BaseAuction.performUpkeep) also revert, but this is expected behavior
    for validated paths. The issue is the withValidation=false path reverting.
    Impact: DoS on price queries when Chainlink returns negative price,
    potentially blocking auction operations that check prices before starting.
  impact: "Complete DoS on getAssetPrice for the affected asset. If used in a try/catch pattern, the catch handles it, but direct calls revert unexpectedly."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // The Chainlink fallback should handle negative answers gracefully
    // when withValidation=false, returning isValid=false instead of reverting
    FeedInfo memory feedInfo = s_feedInfo[asset];
    if (address(feedInfo.usdDataFeed) != address(0)) {
        (, int256 answer,,,) = feedInfo.usdDataFeed.latestRoundData();
        // If answer is negative, _getAssetPrice will revert even with withValidation=false
        if (answer < 0) {
            // This call should NOT revert with withValidation=false
            try this.getAssetPrice(asset) returns (uint256, uint256, bool valid) {
                t(!valid, "PM-O-03: negative price should return isValid=false");
            } catch {
                t(false, "PM-O-03: getAssetPrice reverts on negative Chainlink answer");
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: >
    SafeCast.toUint256(int256) reverts if the int256 is negative — this is
    documented OpenZeppelin behavior. The code at L392 unconditionally
    converts: price = answer.toUint256(). For USD price feeds, negative
    answers are extremely rare but not impossible (oil futures went negative
    in 2020, some synthetic asset feeds can go negative). The real question
    is whether Chainlink USD feeds for crypto assets can ever return
    negative — historically they have returned 0 or minAnswer but not
    negative for standard crypto/USD feeds. Still, the code pattern is
    fragile and violates the expected behavior of withValidation=false.

- id: PM-O-04
  tier: 2
  type: property
  description: >
    When BOTH Data Streams AND Chainlink are stale (both updatedAt <
    minTimestamp), _getAssetPrice returns the most recent of the two stale
    prices with isValid=false. With withValidation=false (external
    getAssetPrice), the caller receives a stale price without reverting.
    If a consumer uses price but ignores isValid, they operate on stale data.
    With withValidation=true (auctions), it correctly reverts. However,
    there is a subtle issue: the fallback only triggers if Data Streams
    is stale AND a data feed is configured. If only Data Streams is
    configured (no Chainlink fallback), a stale Data Streams price is
    returned directly with isValid=false — no fallback attempted.
  attack_scenario: >
    1. Asset configured with ONLY Data Streams (usdDataFeed = address(0)).
    2. Data Streams price becomes stale (no transmit for > stalenessThreshold).
    3. _getAssetPrice returns the stale price with isValid=false.
    4. No fallback is attempted since no Chainlink feed is configured.
    5. Consumer calls getAssetPrice, gets stale price. If consumer
    doesn't check isValid, operates on stale data.
    6. For auction paths (withValidation=true), this correctly reverts.
    Impact: Limited — mostly affects external consumers that don't
    check isValid. Auction paths are protected.
  impact: "External consumers may use stale prices if they ignore isValid return value."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that when both sources are stale, isValid is correctly false
    (uint256 price, uint256 updatedAt, bool isValid) = _getAssetPrice(asset, false);
    FeedInfo memory feedInfo = s_feedInfo[asset];
    uint256 minTimestamp = block.timestamp - feedInfo.stalenessThreshold;
    if (updatedAt < minTimestamp) {
        t(!isValid, "PM-O-04: stale price must have isValid=false");
    }
    if (isValid) {
        gte(updatedAt, minTimestamp, "PM-O-04: valid price must not be stale");
        gt(price, 0, "PM-O-04: valid price must be non-zero");
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 85
  notes: >
    This is more of a design observation than a bug. The isValid flag
    correctly signals staleness. The real question is whether any
    consumer in the protocol ignores isValid — BaseAuction uses
    withValidation=true which reverts on stale. External consumers
    calling getAssetPrice should check isValid. Code is correct but
    the lack of a second fallback source is a single point of failure.

- id: PM-O-05
  tier: 2
  type: property
  description: >
    Chainlink fallback does NOT check for minAnswer/maxAnswer circuit
    breaker bounds. Chainlink aggregators have built-in min/max answer
    bounds. If the real price drops below minAnswer, the feed returns
    minAnswer instead of the real price (hidden staleness). The code
    at L386 takes this answer at face value. For assets that crash
    dramatically (e.g., LUNA), the feed would report minAnswer as a
    floor price, causing the protocol to overvalue the asset.
  attack_scenario: >
    1. Asset X's real market price crashes to $0.01.
    2. Chainlink aggregator for X has minAnswer = $1.00.
    3. Feed returns $1.00 instead of $0.01.
    4. Data Streams is also stale or unavailable (DON has issues).
    5. Chainlink fallback kicks in, returns $1.00.
    6. Protocol values asset X at $1.00 (100x overvaluation).
    7. In auction context, asset X is auctioned at grossly inflated price.
    Impact: Auctions accept asset at inflated price, protocol
    overpays for worthless assets.
  impact: "Protocol overvalues crashed assets due to Chainlink minAnswer floor, leading to incorrect auction pricing."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Check that Chainlink price is not at aggregator bounds
    // This requires reading the aggregator's minAnswer/maxAnswer
    FeedInfo memory feedInfo = s_feedInfo[asset];
    if (address(feedInfo.usdDataFeed) != address(0)) {
        (, int256 answer,,,) = feedInfo.usdDataFeed.latestRoundData();
        // We cannot easily access minAnswer/maxAnswer from the proxy
        // but we can check the answer is positive and non-zero
        gt(answer, int256(0), "PM-O-05: Chainlink answer must be positive");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    The minAnswer/maxAnswer bounds are set on the Chainlink aggregator
    contract, not the proxy. Accessing them requires calling the
    aggregator directly (aggregator().minAnswer()). Most protocols
    don't check this, and it's a known class of Chainlink issues.
    However, Data Streams is the primary source — Chainlink is only
    fallback. If Data Streams is working, this doesn't matter.
    The scenario requires BOTH Data Streams to be stale AND the
    Chainlink feed to be at its bounds — a compound failure. Also,
    newer Chainlink OCR feeds may not have minAnswer/maxAnswer in
    the same way. Confidence reduced due to compound failure requirement.

- id: PM-O-06
  tier: 1
  type: property
  description: >
    Feed rotation (L265-278): when a Data Streams feed ID is reassigned
    from asset A to asset B, asset A loses its Data Streams feed
    (dataStreamsFeedId set to bytes32(0), s_dataStreamsPrice deleted).
    After rotation, asset A relies SOLELY on its Chainlink fallback.
    The code checks that previousAssetFeedInfo.usdDataFeed != address(0)
    before allowing rotation (L287-289). However, the stalenessThreshold
    used for Chainlink validation is the SAME threshold that was
    configured for Data Streams. If Data Streams had a shorter
    stalenessThreshold (e.g., 60s) than appropriate for Chainlink
    (which typically has 3600s heartbeat), the Chainlink price will
    almost always appear stale after rotation.
  attack_scenario: >
    1. Asset A configured with Data Streams feed + Chainlink fallback,
    stalenessThreshold = 120s (appropriate for Data Streams, too tight
    for Chainlink).
    2. Admin rotates the Data Streams feed ID from asset A to asset B.
    3. Asset A now has: dataStreamsFeedId=0, usdDataFeed=chainlinkFeed,
    stalenessThreshold=120s.
    4. Chainlink updates every ~3600s (1 hour heartbeat).
    5. _getAssetPrice for asset A: priceInfo.timestamp = 0 (deleted),
    so updatedAt < minTimestamp (stale). Fallback to Chainlink.
    6. Chainlink's dataFeedUpdatedAt is likely 0-3600s old.
    7. With 120s stalenessThreshold, Chainlink is stale most of the time.
    8. isValid = false for most queries. withValidation=true reverts.
    9. Asset A auctions are effectively disabled.
    Impact: Feed rotation can accidentally disable auctions for the
    previous asset if stalenessThreshold is too tight for Chainlink.
  impact: "Auctions for the rotated-from asset become permanently unavailable until admin manually updates stalenessThreshold."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After feed rotation, verify the remaining asset still has valid pricing
    // This checks that after removing Data Streams from an asset,
    // the Chainlink-only path still works with the existing stalenessThreshold
    FeedInfo memory feedInfo = s_feedInfo[asset];
    if (feedInfo.dataStreamsFeedId == bytes32(0) && address(feedInfo.usdDataFeed) != address(0)) {
        // Asset relies solely on Chainlink — staleness threshold must be reasonable
        // Chainlink heartbeat is typically 3600s for most feeds
        gte(uint256(feedInfo.stalenessThreshold), 3600, "PM-O-06: stalenessThreshold too tight for Chainlink-only asset");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 65
  notes: >
    The code at L287-289 correctly ensures the previous asset retains
    a Chainlink feed after rotation. But it does NOT adjust
    stalenessThreshold. The admin would need to separately call
    applyFeedInfoUpdates to increase the threshold. This is an admin
    operational issue more than a code bug — the admin SHOULD update
    the threshold when rotating feeds. But the contract doesn't
    enforce or warn about this mismatch. Confidence moderate because
    a competent admin would handle this, but the code allows a
    dangerous state transition.

- id: PM-O-07
  tier: 2
  type: property
  description: >
    transmit() at L160 casts report.price from int192 to int256 then to
    uint256 via SafeCast. A negative price from the DON report would
    revert here. However, the VerifierProxy verifies the DON signature,
    so negative prices should not occur for legitimate feeds. The
    question is whether the VerifierProxy validates price positivity
    or if that's left to the consumer.
  attack_scenario: >
    1. DON produces a report with negative price (feed malfunction or
    edge case in report generation).
    2. VerifierProxy verifies the signature (report is authentic).
    3. transmit() at L160: int256(report.price).toUint256() reverts.
    4. The entire batch of reports in the transmit call reverts.
    5. Other valid reports in the same batch are also not processed.
    6. If the admin retries without the bad report, other prices update.
    Impact: One bad report can DoS an entire batch transmit, but admin
    can retry excluding the problematic report. Minor operational issue.
  impact: "Temporary DoS on batch price updates. Admin can work around by excluding the problematic report."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After transmit, verify all stored prices are positive
    DataStreamsPriceInfo memory priceInfo = s_dataStreamsPrice[asset];
    if (priceInfo.timestamp > 0) {
        gt(uint256(priceInfo.usdPrice), 0, "PM-O-07: stored price must be positive");
    }
  ghost_vars: []
  validated: true
  priority: low
  confidence: 40
  notes: >
    The zero-price check at L174 catches the case where casting
    produces 0, but the SafeCast revert on negative happens BEFORE
    the zero check. This is actually correct defensive behavior —
    reverting on negative is better than allowing a wrapped value.
    The batch DoS is the only real concern, and it's minor because
    the admin controls what reports to submit. Low confidence as
    a finding because DON reports should never have negative USD prices.

- id: PM-O-08
  tier: 2
  type: property
  description: >
    _getAssetPrice decimals handling for Chainlink fallback (L394-400)
    calls feedInfo.usdDataFeed.decimals() at runtime. This is an
    external call that could revert if the feed contract is
    malfunctioning or has been self-destructed. Unlike Data Streams
    where decimals are stored in feedInfo.dataStreamsFeedDecimals,
    the Chainlink decimals are fetched live every time, adding a
    potential revert point in the fallback path — ironic since the
    fallback exists for reliability.
  attack_scenario: >
    1. Data Streams price is stale.
    2. Chainlink fallback triggers at L385.
    3. latestRoundData() succeeds (returns valid data).
    4. feedInfo.usdDataFeed.decimals() at L394 reverts (feed upgrade
    gone wrong, proxy points to empty implementation, etc).
    5. The entire _getAssetPrice reverts.
    6. Fallback mechanism fails to provide a price when it's needed most.
    Impact: Chainlink fallback path has an additional revert point
    that defeats the purpose of having a fallback.
  impact: "Fallback path can fail due to decimals() revert, leaving the asset without any valid price source."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that decimals() call on Chainlink feed doesn't revert
    FeedInfo memory feedInfo = s_feedInfo[asset];
    if (address(feedInfo.usdDataFeed) != address(0)) {
        try feedInfo.usdDataFeed.decimals() returns (uint8 d) {
            gt(uint256(d), 0, "PM-O-08: decimals must be positive");
        } catch {
            t(false, "PM-O-08: decimals() reverted on Chainlink fallback feed");
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 35
  notes: >
    This is a defensive coding observation more than a real vulnerability.
    Chainlink feed contracts are battle-tested and decimals() is a simple
    view function that essentially never reverts. The risk is theoretical.
    A better pattern would be to store the feed decimals at configuration
    time (like Data Streams does with dataStreamsFeedDecimals) and validate
    they match the on-chain value. But this is a gas optimization / minor
    robustness issue, not a security vulnerability.

false_positives:
- hunter: OracleHunter
  id: PM-FP-01
  reason: >
    Investigated whether transmit() allows replaying old reports to
    overwrite newer prices. The staleness check at L162 prevents very
    old reports, but within the stalenessThreshold window, an older
    report could overwrite a newer one. However, transmit() is gated
    by PRICE_ADMIN_ROLE — only trusted entities can call it. A trusted
    PRICE_ADMIN replaying old reports is an admin trust assumption,
    not a bug. The contract explicitly trusts PRICE_ADMIN to submit
    correct, timely reports.
  investigated_at: '2026-03-22T00:00:00Z'

- hunter: OracleHunter
  id: PM-FP-02
  reason: >
    Investigated potential for L2 sequencer downtime abuse. The
    _getAssetPrice function comment (L363) mentions L2 sequencer
    uptime checks as something inheriting contracts should implement.
    PriceManager itself does NOT implement sequencer checks, but it's
    an abstract contract — the concrete implementation is expected to
    add this via the virtual _getAssetPrice override. This is by
    design, not a missing check in PriceManager.
  investigated_at: '2026-03-22T00:00:00Z'

- hunter: OracleHunter
  id: PM-FP-03
  reason: >
    Investigated whether Chainlink data feed validation misses the
    staleness check on the Chainlink side independently. The code at
    L401-406 checks if Chainlink's dataFeedUpdatedAt > Data Streams'
    updatedAt (uses most recent). Then at L405, the combined updatedAt
    is checked against minTimestamp. This means if both are stale,
    isValid=false is correctly returned. The staleness validation is
    present, just structured differently than the typical pattern.
  investigated_at: '2026-03-22T00:00:00Z'
