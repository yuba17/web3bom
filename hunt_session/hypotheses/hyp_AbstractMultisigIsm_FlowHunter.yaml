component: AbstractMultisigIsm
hunter: FlowHunter
date: '2026-03-24'
scope: Hyperlane Multisig ISM (message flow, replay, ordering, state transitions)
bounty: Immunefi $2.5M critical / $200K high
honest_assessment: |
  The ISM is a PURE verification module — it's view/pure, no state changes.
  All state management (replay protection, delivery tracking) lives in the
  Mailbox contract, which is OUT OF SCOPE for this ISM analysis but critical
  for the overall security. The ISM itself has no flow bugs because it has
  no flow — it's a stateless signature checker. The interesting attack surfaces
  are at the BOUNDARIES: what does the Mailbox assume about ISM behavior?

  I found NO exploitable flow bugs in the ISM contracts themselves.
  The most interesting finding is ISM-F-03 (factory duplicate validators)
  which is a real gap but low practical impact.

invariants:
- id: ISM-F-01
  title: "verify() is stateless — replay protection is Mailbox's responsibility"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    verify() is a pure view function. It does NOT track which messages have
    been verified. The same (metadata, message) pair will return true every
    time. This is BY DESIGN — the Mailbox.process() function is responsible
    for checking `delivered[messageId]` to prevent replay.

    If a custom integration calls ISM.verify() directly without replay
    protection, messages can be replayed. But this is a misuse of the API,
    not an ISM bug.

    Checked: Mailbox.process() sets delivered[_id] = true BEFORE calling
    recipient.handle(). This is correct (CEI pattern).
  solidity: |
    function check_ISM_F01_verify_is_stateless() public {
        // verify() returns same result for same inputs — by design
        bool result1 = ism.verify(validMetadata, validMessage);
        bool result2 = ism.verify(validMetadata, validMessage);
        assert(result1 == result2); // Always true, view function
        // Replay protection is NOT the ISM's job
    }
  validated: true
  status: not_a_bug
  notes: |
    Standard pattern in Hyperlane. ISMs are verification oracles, not
    state machines. Replay protection lives in Mailbox.delivered mapping.

- id: ISM-F-02
  title: "Message ordering — ISM imposes no ordering, Mailbox allows out-of-order"
  tier: 2
  type: property
  confidence: 90
  severity: low
  description: |
    The ISM does not enforce message ordering. Message N+1 can be verified
    before message N. The Mailbox also does not enforce ordering — it only
    checks that a message hasn't been delivered yet (delivered[id] mapping).

    For MerkleRootMultisigIsm specifically: a message with index 5 can be
    proven using a checkpoint at index 100, as long as message 5 is in the
    Merkle tree at that point. This is correct — Merkle trees are append-only,
    so all previous messages remain provable with newer checkpoints.

    Out-of-order delivery is a FEATURE, not a bug. Applications that need
    ordering must implement it themselves (e.g., nonce tracking in the
    recipient contract).
  solidity: |
    function check_ISM_F02_no_ordering_enforced() public {
        // Messages can be verified in any order — by design
        // Message N+1 can be delivered before message N
        bool resultN1 = ism.verify(metadataForMsgN1, messageN1);
        bool resultN = ism.verify(metadataForMsgN, messageN);
        // Both can succeed regardless of order — this is correct behavior
    }
  validated: true
  status: not_a_bug
  notes: |
    Intentional design. Hyperlane is an asynchronous messaging protocol.
    Ordering is application-layer concern.

- id: ISM-F-03
  title: "Factory allows duplicate validators — effective threshold reduction"
  tier: 1
  type: property
  confidence: 75
  severity: medium
  description: |
    The factory deploy() does not check for duplicate addresses in _values.
    If the same validator address appears twice, the two-pointer algorithm
    in verify() will match BOTH occurrences with a single signature from
    that validator. This effectively reduces the threshold.

    Example: validators = [Alice, Alice, Bob], threshold = 3.
    A message signed by only Alice and Bob (2 signatures) would pass:
    - Sig 0 from Alice → matches validators[0] (Alice), validatorIndex = 1
    - Sig 1 from Alice → matches validators[1] (Alice), validatorIndex = 2
    Wait — NO. The two-pointer requires signatures in ASCENDING order of
    validator index. Two signatures from Alice would both recover to the
    same address. The algorithm would:
    - i=0: recover sig[0] → Alice, match validators[0], validatorIndex = 1
    - i=1: recover sig[1] → Alice, match validators[1], validatorIndex = 2
    - i=2: recover sig[2] → Bob, match validators[2], validatorIndex = 3
    This requires 3 valid signatures. BUT sig[0] and sig[1] are both from
    Alice over the same digest, so they're IDENTICAL. ECDSA.recover with the
    same signature returns the same address. So:
    - i=0: recover sig[0] → Alice, match validators[0], index = 1
    - i=1: recover sig[0] → Alice, match validators[1], index = 2
    Wait — sig[0] and sig[1] are different indices into metadata. They CAN
    be the same bytes. If metadata contains [AliceSig, AliceSig, BobSig]:
    - i=0: signatureAt(0) → AliceSig → Alice, match v[0], index = 1
    - i=1: signatureAt(1) → AliceSig → Alice, match v[1], index = 2
    - i=2: signatureAt(2) → BobSig → Bob, match v[2], index = 3
    YES — this works. With duplicates in the validator set, a single
    validator key can count multiple times toward threshold.

    PRACTICAL IMPACT: Low-medium. This is a deployment configuration error,
    not a code logic bug. The factory is permissionless — anyone deploying
    with duplicates gets a weaker ISM than intended. But the deployer
    controls the validator set, so they'd be hurting themselves.

    HOWEVER: if a governance process or automated system constructs the
    validator list with an accidental duplicate, this silently degrades
    security without any warning.
  solidity: |
    function check_ISM_F03_no_duplicate_validators() public view {
        (address[] memory validators, uint8 threshold) = ism.validatorsAndThreshold(testMessage);
        for (uint256 i = 0; i < validators.length; i++) {
            for (uint256 j = i + 1; j < validators.length; j++) {
                assert(validators[i] != validators[j]); // Factory should prevent this
            }
        }
    }
  validated: false
  status: hypothesis
  notes: |
    The factory lacks duplicate checking. Combined with the two-pointer
    algorithm, duplicates allow one key to satisfy multiple threshold slots.
    This IS a real gap, but it's a deployment-time issue. The fix is trivial:
    add a sorted-uniqueness check in deploy(). Trail of Bits likely flagged
    this as Low/Informational. For Immunefi, this might qualify as Medium
    if framed as "governance misconfiguration silently degrades bridge security."

- id: ISM-F-04
  title: "Two-pointer requires sorted signatures — unsorted sigs always revert"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    The verify() two-pointer algorithm requires that recovered signer addresses
    appear in the same order as the validator array (which is sorted by the
    deployer/factory). If a relayer submits signatures in wrong order,
    verify() reverts with "!threshold".

    This is NOT a bug — it's the expected behavior of the algorithm. Relayers
    must sort signatures by validator index before submitting. This is a
    well-documented requirement (same pattern as Gnosis Safe).

    Edge case: what if two different private keys recover to addresses that
    are "out of order" relative to the validator array? The relayer must
    arrange the signature bytes in metadata to match validator ordering.
    This is a relayer implementation detail, not an ISM bug.
  solidity: |
    function check_ISM_F04_sorted_signatures_required() public {
        // Signatures must be ordered by validator index
        // This is enforced by the two-pointer algorithm
        // Out-of-order signatures → revert("!threshold")
        // This is correct and expected behavior
    }
  validated: true
  status: not_a_bug
  notes: |
    Standard two-pointer pattern. Gnosis Safe, Axelar, and other bridge
    protocols use identical approach. Not a finding.

- id: ISM-F-05
  title: "MetaProxy metadata extraction — assembly correctness"
  tier: 1
  type: property
  confidence: 60
  severity: high
  description: |
    The MetaProxy.metadata() function uses inline assembly to extract
    immutable data appended after the proxy bytecode. The pattern:
    1. Read last 32 bytes of calldata → size
    2. Compute dataPtr = calldatasize - 32 - size
    3. Copy `size` bytes from dataPtr into memory

    This assumes the MetaProxy was correctly deployed with the data appended
    in the right format. If a malicious or buggy factory deploys a proxy
    with corrupted metadata size, the assembly could:
    - Read out-of-bounds calldata (returns zeros)
    - Compute a dataPtr that wraps (if size > calldatasize - 32)

    HOWEVER: the factory is the one deploying these proxies, and it uses
    EIP-3448 MetaProxy standard. The metadata is baked into the bytecode
    at deploy time, not supplied per-call. So a correctly deployed proxy
    always has correct metadata.

    The risk is: if someone deploys a MetaProxy manually with wrong size
    encoding, the proxy silently uses garbage data as its validator set.
    But that's a factory/deployment issue, not a runtime issue.
  solidity: |
    function check_ISM_F05_metaproxy_metadata_integrity() public view {
        // Verify that metadata() returns expected validator set
        bytes memory meta = StaticMOfNAddressSetFactory(factory).metadata(address(ism));
        (address[] memory validators, uint8 threshold) = abi.decode(meta, (address[], uint8));
        assert(validators.length > 0);
        assert(threshold > 0);
        assert(threshold <= validators.length);
    }
  validated: false
  status: hypothesis
  notes: |
    The assembly looks correct for EIP-3448 MetaProxy standard. The real
    question is whether calldata manipulation by a malicious caller can
    interfere with the metadata extraction. Since metadata is in bytecode
    (not calldata), and the proxy reads from the END of its own bytecode
    via calldatasize tricks... actually, MetaProxy appends data to the
    contract bytecode, and the assembly reads it via calldatacopy from
    the proxy's own code. Need to verify this more carefully — if metadata
    is in CODE not CALLDATA, the assembly using calldatasize is wrong.

    UPDATE: Re-reading the code — MetaProxy metadata IS in the contract
    bytecode, but accessed via a fallback that copies it to calldata.
    The EIP-3448 standard works by having the proxy delegate and append
    the metadata bytes to the calldata forwarded to the implementation.
    So the implementation's metadata() reads from the tail of calldata,
    which contains the proxy-appended bytes. This is correct for EIP-3448
    but means: the proxy's delegatecall forwards original calldata + appended
    metadata bytes. The assembly reads the appended part. A direct call
    to the implementation (not through proxy) would read garbage from
    calldata tail. But direct calls to implementation are not the intended
    usage pattern.
