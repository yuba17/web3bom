# SIG-01: EIP-712 domain separator missing name and version fields
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-01
  tier: 2
  type: property
  title: EIP-712 DOMAIN_SEPARATOR omits name and version — non-standard but functional
  description: >
    The DOMAIN_TYPEHASH uses "EIP712Domain(uint256 chainId,address verifyingContract)"
    which omits the standard name, version, and salt fields from EIP-712. While this
    means all VaultV2 instances on the same chain with the same address would share a
    domain separator (impossible since addresses are unique), cross-protocol signature
    confusion is possible if another protocol uses the same minimal domain type hash.
    A permit signed for a VaultV2 could be valid on another contract that uses the
    same DOMAIN_TYPEHASH and PERMIT_TYPEHASH if deployed at the same address on a
    different chain (CREATE2 same-address scenario).
  attack_scenario: >
    1. VaultV2 is deployed on chain A at address X via CREATE2.
    2. Another contract with identical DOMAIN_TYPEHASH is deployed at address X on chain B.
    3. User signs permit for VaultV2 on chain A (chainId = A, verifyingContract = X).
    4. Because chainId is included, replay on chain B fails — chainId mismatch protects.
    5. However, if a fork occurs (same chainId temporarily), permits are replayable
       across the fork.
    This is mitigated by chainId inclusion, but the non-standard domain is worth noting.
  impact: >
    Low practical impact due to chainId inclusion. However, wallet UX is degraded —
    wallets cannot display the signing domain name to users since it's omitted. This
    makes phishing easier as users can't distinguish which vault they're signing for.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    function property_sig_01() public {
      // Verify DOMAIN_SEPARATOR is computed with chainId and address only
      bytes32 expected = keccak256(abi.encode(
        keccak256("EIP712Domain(uint256 chainId,address verifyingContract)"),
        block.chainid,
        address(vault)
      ));
      eq(vault.DOMAIN_SEPARATOR(), expected, "SIG-01: DOMAIN_SEPARATOR mismatch");
    }
  ghost_vars:
    - 'uint256 internal ghost_lastChainId'
  affected_functions:
    - DOMAIN_SEPARATOR
    - permit
  validated: false
  priority: low
  confidence: 85
  notes: >
    This is a design choice by Morpho. The chainId field protects against cross-chain
    replay. The missing name/version is non-standard but not exploitable in isolation.
    Wallet display degradation is the main concern.

# ═══════════════════════════════════════════════════════════════════════════
# SIG-02: permit() nonce increments before validation — DoS not possible
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-02
  tier: 1
  type: property
  title: Permit nonce incremented before ecrecover validation — griefing vector
  description: >
    In permit(), the nonce is incremented with `nonces[_owner]++` BEFORE the
    ecrecover check. If ecrecover returns address(0) (invalid signature), the
    nonce is still incremented. However, the function then requires
    `recoveredAddress != address(0) && recoveredAddress == _owner`, so it reverts.
    Since Solidity 0.8.28 reverts undo state changes, the nonce increment is
    rolled back on revert. This is safe. BUT — what if _owner IS address(0)?
    The ecrecover can return address(0) for malformed signatures, and if _owner
    is passed as address(0), the check `recoveredAddress == _owner` passes for
    any invalid signature. This would burn a nonce for address(0) and set an
    allowance for address(0).
  attack_scenario: >
    1. Attacker calls permit(address(0), spender, shares, deadline, v, r, s)
       with a malformed signature that makes ecrecover return address(0).
    2. recoveredAddress = address(0), _owner = address(0).
    3. Check: recoveredAddress != address(0) FAILS — the require catches this.
    4. Actually safe because of the `recoveredAddress != address(0)` check.
    5. The explicit zero-address check protects against this classic attack.
  impact: >
    No impact — the implementation correctly checks recoveredAddress != address(0).
    The nonce increment is rolled back on revert. This hypothesis is SAFE.
  impact_rating: Info
  likelihood: None
  severity_final: null
  solidity: |
    function property_sig_02() public {
      // Nonce must only increment on successful permit calls
      uint256 nonceBefore = vault.nonces(address(0x1234));
      // After a failed permit (invalid sig), nonce should remain unchanged
      // We track via ghost that any nonce change corresponds to a valid permit
      if (ghost_permitCalled && !ghost_permitSucceeded) {
        eq(vault.nonces(ghost_permitOwner), ghost_nonceBeforePermit,
           "SIG-02: nonce incremented on failed permit");
      }
    }
  ghost_vars:
    - 'bool internal ghost_permitCalled'
    - 'bool internal ghost_permitSucceeded'
    - 'address internal ghost_permitOwner'
    - 'uint256 internal ghost_nonceBeforePermit'
  affected_functions:
    - permit
  validated: false
  priority: medium
  confidence: 90
  notes: >
    The implementation is safe. Solidity 0.8 revert semantics ensure nonce is not
    consumed on invalid signatures. The `recoveredAddress != address(0)` check
    prevents the classic ecrecover-returns-zero attack.

# ═══════════════════════════════════════════════════════════════════════════
# SIG-03: Permit replay after chain fork — DOMAIN_SEPARATOR computed dynamically
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-03
  tier: 1
  type: property
  title: DOMAIN_SEPARATOR recomputed per-call protects against fork replay
  description: >
    VaultV2 computes DOMAIN_SEPARATOR() dynamically using block.chainid rather
    than caching it at construction time. This is the correct pattern to protect
    against chain fork replay attacks (e.g., ETH/ETC split, ETH PoW fork).
    If DOMAIN_SEPARATOR were cached at deploy time and a fork happened, permits
    signed on one fork would be valid on the other. The dynamic computation
    ensures chainId divergence invalidates cross-fork permits. Verify this
    invariant holds — that DOMAIN_SEPARATOR always reflects current block.chainid.
  attack_scenario: >
    1. VaultV2 deployed on Ethereum mainnet (chainId=1).
    2. Chain forks — fork chain gets chainId=10001.
    3. User signs permit on mainnet (chainId=1 in domain).
    4. Attacker tries to replay on fork — DOMAIN_SEPARATOR uses block.chainid=10001.
    5. Digest mismatch → ecrecover fails → permit reverts on fork.
    This is the correct behavior. The invariant verifies it.
  impact: >
    No vulnerability — the dynamic DOMAIN_SEPARATOR is the gold standard pattern.
    This invariant verifies the protection remains intact.
  impact_rating: Info
  likelihood: None
  severity_final: null
  solidity: |
    function property_sig_03() public {
      // DOMAIN_SEPARATOR must always use current block.chainid
      bytes32 domainSep = vault.DOMAIN_SEPARATOR();
      bytes32 expected = keccak256(abi.encode(
        keccak256("EIP712Domain(uint256 chainId,address verifyingContract)"),
        block.chainid,
        address(vault)
      ));
      eq(domainSep, expected, "SIG-03: DOMAIN_SEPARATOR not using current chainId");
    }
  ghost_vars:
    - 'bytes32 internal ghost_cachedDomainSep'
  affected_functions:
    - DOMAIN_SEPARATOR
    - permit
  validated: false
  priority: medium
  confidence: 95
  notes: >
    Confirmed safe pattern. Dynamic computation is correct. This invariant exists
    to catch potential regressions if the implementation changes.

