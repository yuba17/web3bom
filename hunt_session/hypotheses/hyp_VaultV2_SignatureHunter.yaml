# SIG-11: Gate bypass via permit — permit does not check gates
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-11
  tier: 1
  type: property
  title: permit() does not check canReceiveShares/canSendShares gates
  description: >
    The permit() function sets allowance without checking any gates. This means
    a gated user (canSendShares returns false) can still sign permits granting
    allowance. Later, if the gate is removed or the spender finds a code path
    that doesn't check gates, the allowance is pre-set. More importantly, the
    approve() function also doesn't check gates. This is expected for ERC-20
    approve semantics, but in a gated vault system, it means approval state can
    be set for users who are currently locked. The gates are checked at
    transfer/withdraw time, not at approve/permit time. Verify gate checks are
    consistently applied at execution time.
  attack_scenario: >
    1. sendSharesGate blocks user A from sending shares.
    2. User A signs permit granting spender allowance for all shares.
    3. Gate is later removed (curator action with timelock).
    4. Immediately after gate removal, spender executes withdraw/transferFrom.
    5. Since permit was signed while gated, user A may not realize their
       pre-signed approval becomes active when gates change.
  impact: >
    Pre-signed permits become active when gates are modified. Users who signed
    permits while gated may not realize those permits are latent. Low impact
    since gates are checked at execution time, but the temporal gap between
    signing and execution creates a window of confusion.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    function property_sig_11() public {
      // Gates must be checked at execution time (transfer/withdraw), not at permit time
      // Verify: if a gate blocks an operation, it blocks regardless of existing allowance
      if (ghost_gateActive && ghost_userGated) {
        // Even with max allowance, gated user should not be able to have shares sent
        uint256 balanceBefore = vault.balanceOf(ghost_gatedUser);
        // If gated user's balance decreased, gate was bypassed
        if (ghost_operationAttempted) {
          gte(vault.balanceOf(ghost_gatedUser), balanceBefore,
              "SIG-11: gated user's shares were sent despite active gate");
        }
      }
    }
  ghost_vars:
    - 'bool internal ghost_gateActive'
    - 'bool internal ghost_userGated'
    - 'address internal ghost_gatedUser'
    - 'bool internal ghost_operationAttempted'
  affected_functions:
    - permit
    - approve
    - transferFrom
    - withdraw
    - redeem
  validated: false
  priority: medium
  confidence: 78
  notes: >
    Gates are correctly enforced at execution time. The concern is about the
    temporal mismatch between permit signing (no gate check) and execution
    (gate check). This is standard — ERC-20 approve never checks transfer
    restrictions. But for gated vaults, integrators should be aware.
