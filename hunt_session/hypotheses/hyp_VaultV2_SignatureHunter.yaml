# SIG-05: Multicall + delegatecall preserves msg.sender for permit bypass
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-05
  tier: 1
  type: property
  title: Multicall delegatecall allows batching permit + withdraw in single tx
  description: >
    VaultV2.multicall() uses delegatecall, which preserves msg.sender context.
    An attacker could batch [permit(...), withdraw(...)] in a single multicall.
    Since delegatecall preserves msg.sender, the permit would set allowance for
    the actual caller, then withdraw would use that allowance. This is actually
    the INTENDED use case — but it means a user who signs a permit is giving
    the spender ability to execute arbitrary vault operations in a single atomic
    tx via multicall. Check: can multicall be used to bypass gates or timelocks
    by combining operations atomically?
  attack_scenario: >
    1. User signs permit(user, attacker, MAX_UINT256, deadline, v, r, s).
    2. Attacker calls multicall([
         permit(user, attacker, MAX_UINT256, deadline, v, r, s),
         withdraw(userBalance, attacker, user)
       ]).
    3. In first delegatecall: msg.sender = attacker, permit sets allowance.
    4. In second delegatecall: msg.sender = attacker, withdraw checks
       allowance[user][attacker] which was just set, burns user shares.
    5. Attacker receives all user assets in one atomic tx.
    This is by design but enables instant drain with a single permit signature.
  impact: >
    A single permit signature gives the spender ability to drain all vault shares
    atomically via multicall. The user must understand that signing a permit for
    max shares to an untrusted spender is equivalent to losing all funds.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    function property_sig_05() public {
      // If permit was called via multicall, the allowance should still be
      // correctly set and msg.sender should be consistent across calls
      if (ghost_multicallActive && ghost_permitInMulticall) {
        // After multicall with permit + withdraw, user balance should decrease
        // only by the permitted amount
        uint256 currentBalance = vault.balanceOf(ghost_permitOwnerSig05);
        lte(ghost_balanceBeforeMulticall - currentBalance,
            ghost_permittedAmount,
            "SIG-05: multicall permit+withdraw drained more than permitted");
      }
    }
  ghost_vars:
    - 'bool internal ghost_multicallActive'
    - 'bool internal ghost_permitInMulticall'
    - 'address internal ghost_permitOwnerSig05'
    - 'uint256 internal ghost_balanceBeforeMulticall'
    - 'uint256 internal ghost_permittedAmount'
  affected_functions:
    - multicall
    - permit
    - withdraw
    - redeem
  validated: false
  priority: high
  confidence: 65
  notes: >
    The multicall + permit combo is a feature, not a bug. But the atomic nature
    means phishing a single permit signature = instant drain. Unlike standard
    approve where the user can race to revoke, permit is off-chain and irrevocable
    once signed. The multicall makes exploitation faster and cheaper (single tx).

# ═══════════════════════════════════════════════════════════════════════════
# SIG-06: Allowance consumed in exit() via shares not assets — accounting mismatch
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-06
  tier: 1
  type: property
  title: exit() consumes allowance in shares while permit/approve set allowance in shares — consistent but confusing
  description: >
    In exit() (called by withdraw/redeem), the allowance check is:
    `allowance[onBehalf][msg.sender] = _allowance - shares`. The allowance is
    denominated in SHARES. The permit also sets allowance in shares (the parameter
    is called "shares"). This is CONSISTENT but differs from ERC-4626 standard
    which uses share allowance for redeem but asset allowance for withdraw.
    VaultV2 uses share-based allowance for BOTH withdraw and redeem. A user who
    permits X shares thinking it covers X assets worth of withdrawal would
    actually be permitting more value if share price > 1.
  attack_scenario: >
    1. Share price = 2 assets/share. User has 100 shares = 200 assets.
    2. User signs permit for 50 "shares" thinking they're allowing 50 assets withdrawal.
    3. Spender calls withdraw(100 assets, attacker, user).
    4. previewWithdraw(100 assets) = 50 shares at 2:1 ratio.
    5. exit() checks allowance >= 50 shares — passes.
    6. Spender drained 100 assets, not the 50 the user thought.
    This is a UX confusion issue, not a code bug. The permit parameter is "shares".
  impact: >
    Users who misunderstand that permit allowance is in shares (not assets) may
    sign permits that allow more value withdrawal than intended. The naming in
    PERMIT_TYPEHASH uses "value" which adds to confusion.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    function property_sig_06() public {
      // Verify allowance is consistently consumed in shares across all paths
      if (ghost_exitCalled && ghost_exitSender != ghost_exitOnBehalf) {
        // The allowance decrease must equal the shares burned, not the assets withdrawn
        uint256 allowanceDecrease = ghost_allowanceBeforeExit - vault.allowance(ghost_exitOnBehalf, ghost_exitSender);
        eq(allowanceDecrease, ghost_sharesBurnedInExit,
           "SIG-06: allowance decrease != shares burned in exit");
      }
    }
  ghost_vars:
    - 'bool internal ghost_exitCalled'
    - 'address internal ghost_exitSender'
    - 'address internal ghost_exitOnBehalf'
    - 'uint256 internal ghost_allowanceBeforeExit'
    - 'uint256 internal ghost_sharesBurnedInExit'
  affected_functions:
    - withdraw
    - redeem
    - exit
    - permit
  validated: false
  priority: medium
  confidence: 80
  notes: >
    The PERMIT_TYPEHASH says "value" but the code parameter is "shares". This
    naming mismatch between the EIP-2612 standard (which uses "value" for token
    amount) and the vault semantics (shares vs assets) creates UX confusion.
    Not a code vulnerability but a footgun for integrators.

# ═══════════════════════════════════════════════════════════════════════════
# SIG-07: PERMIT_TYPEHASH uses "value" but code uses "shares" — signature mismatch
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-07
  tier: 1
  type: property
  title: PERMIT_TYPEHASH field name "value" vs parameter "shares" — potential wallet display confusion
  description: >
    ConstantsLib defines PERMIT_TYPEHASH as keccak256("Permit(address owner,address
    spender,uint256 value,uint256 nonce,uint256 deadline)") using "value" as the
    field name. But in the permit() function signature, the parameter is called
    "shares". The abi.encode in permit uses the same positional encoding regardless
    of name, so the hash is correct. However, wallets displaying the EIP-712 typed
    data will show "value: X" while the user thinks in terms of "shares". This is
    standard EIP-2612 PERMIT_TYPEHASH — the "value" field name is per-spec. But
    for a vault where shares != assets, "value" is ambiguous. Verify the hash
    struct encodes correctly.
  attack_scenario: >
    1. Wallet displays permit signing request: "value: 1000000000000000000".
    2. User sees "value" and thinks it's 1e18 assets (e.g., 1 USDC with 18 decimals).
    3. Actually it's 1e18 shares, which at 2:1 ratio = 2e18 assets worth.
    4. User signs thinking they're permitting 1 unit of value, actually permitting
       2 units worth of withdrawal power.
    5. This is amplified for vaults with high share price appreciation.
  impact: >
    UX confusion for end users signing permit messages. The "value" field in the
    EIP-712 struct is shares, not asset value. Could lead to over-permitting.
    Low severity since this is standard EIP-2612 behavior.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    function property_sig_07() public {
      // Verify the PERMIT_TYPEHASH matches the expected EIP-2612 format
      bytes32 expected = keccak256(
        "Permit(address owner,address spender,uint256 value,uint256 nonce,uint256 deadline)"
      );
      // This is a compile-time constant check — always true if ConstantsLib is correct
      // The real invariant: the hash used in permit() matches PERMIT_TYPEHASH
      bytes32 hashStruct = keccak256(abi.encode(
        expected, address(0x1), address(0x2), uint256(100), uint256(0), uint256(block.timestamp + 1)
      ));
      // Verify structure is consistent
      t(hashStruct != bytes32(0), "SIG-07: PERMIT_TYPEHASH produces zero hash");
    }
  ghost_vars:
    - 'bytes32 internal ghost_computedPermitHash'
  affected_functions:
    - permit
  validated: false
  priority: low
  confidence: 90
  notes: >
    Standard EIP-2612 uses "value" — this is expected. The confusion is inherent
    to using EIP-2612 permit on a vault token where shares != assets. Not a code
    bug but worth documenting for integrators.

# ═══════════════════════════════════════════════════════════════════════════
# SIG-08: forceDeallocate consumes allowance via withdraw — double signature path
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-08
  tier: 1
  type: property
  title: forceDeallocate calls withdraw which consumes allowance — unexpected allowance drain
  description: >
    forceDeallocate(adapter, data, assets, onBehalf) internally calls
    `withdraw(penaltyAssets, address(this), onBehalf)`. If msg.sender != onBehalf,
    the exit() function inside withdraw will consume allowance[onBehalf][msg.sender].
    This means anyone with share allowance from a user can force-deallocate on their
    behalf, burning penalty shares. The user might permit a spender for normal
    withdraw/redeem operations, not expecting the spender can also trigger
    forceDeallocate which has a PENALTY. The allowance consumption path through
    forceDeallocate is an unexpected use of the approval/permit.
  attack_scenario: >
    1. User permits spender for 100 shares (intending normal withdraw).
    2. Spender calls forceDeallocate(adapter, data, largeAmount, user).
    3. deallocateInternal runs (anyone can call — no isAllocator check on forceDeallocate).
    4. penaltyAssets = largeAmount * penalty / WAD.
    5. withdraw(penaltyAssets, address(this), user) consumes allowance and burns user shares.
    6. User loses shares as penalty, shares go to vault (address(this)), not spender.
    7. Spender can't directly profit BUT can grief the user by burning their shares
       as penalty — and if spender also has vault shares, the share price increases
       slightly benefiting them.
  impact: >
    A permitted spender can burn victim's shares as forceDeallocate penalty. The
    penalty goes to the vault (increasing share price for all holders). If the
    spender holds shares, they profit from the increased share price. Max loss per
    call is bounded by penalty rate (max 2%) * deallocated amount.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    function property_sig_08() public {
      // If forceDeallocate was called with onBehalf != msg.sender,
      // allowance must have been consumed, and the consumed amount must equal
      // the penalty shares, not the deallocated amount
      if (ghost_forceDeallocateCalled && ghost_fdSender != ghost_fdOnBehalf) {
        uint256 allowanceConsumed = ghost_allowanceBeforeFD -
          vault.allowance(ghost_fdOnBehalf, ghost_fdSender);
        // Allowance consumed should equal penalty shares, not full amount
        eq(allowanceConsumed, ghost_penaltySharesBurned,
           "SIG-08: forceDeallocate consumed wrong allowance amount");
        // Penalty shares should be bounded by MAX_FORCE_DEALLOCATE_PENALTY
        lte(ghost_penaltySharesBurned, ghost_fdOnBehalfBalanceBefore * 2 / 100,
            "SIG-08: penalty shares exceed 2% cap");
      }
    }
  ghost_vars:
    - 'bool internal ghost_forceDeallocateCalled'
    - 'address internal ghost_fdSender'
    - 'address internal ghost_fdOnBehalf'
    - 'uint256 internal ghost_allowanceBeforeFD'
    - 'uint256 internal ghost_penaltySharesBurned'
    - 'uint256 internal ghost_fdOnBehalfBalanceBefore'
  affected_functions:
    - forceDeallocate
    - withdraw
    - exit
    - permit
  validated: false
  priority: high
  confidence: 72
  notes: >
    This is a real concern — permit/approve is typically understood as "can
    withdraw/redeem on my behalf" not "can trigger forceDeallocate penalty on me".
    The allowance path through forceDeallocate → withdraw → exit is non-obvious.
    Need to verify if forceDeallocate has any access control beyond the allowance check.

