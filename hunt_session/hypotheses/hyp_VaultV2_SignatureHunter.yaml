  ghost_vars:
    - 'bool internal ghost_maxAllowanceSet'
    - 'bool internal ghost_transferFromExecuted'
  affected_functions:
    - permit
    - approve
    - transferFrom
    - exit
  validated: false
  priority: low
  confidence: 88
  notes: >
    Standard ERC-20 infinite approval pattern. Not a bug, but combined with
    permit and multicall, the persistence of max allowance is a known footgun.
    Documenting as invariant for completeness.

# ═══════════════════════════════════════════════════════════════════════════
# SIG-10: Permit signature malleability — explicitly documented as not a concern
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-10
  tier: 2
  type: property
  title: Signature malleability acknowledged but nonce prevents replay
  description: >
    The NatSpec comment says "Signature malleability is not explicitly prevented but
    it is not a problem thanks to the nonce." ECDSA signatures have two valid (v,r,s)
    tuples for the same message. Without malleability protection, an attacker could
    take a valid signature and compute the other valid form. However, since the nonce
    is incremented on successful permit(), replaying the malleable signature would
    fail because the nonce no longer matches. Verify: (1) nonce is always incremented
    on success, (2) the malleable signature would use the same nonce and thus fail.
  attack_scenario: >
    1. User signs permit with nonce=5.
    2. Permit executes successfully, nonce becomes 6.
    3. Attacker computes malleable signature (different v, s' = n - s).
    4. Attacker tries to call permit with malleable signature.
    5. The hash includes nonce=5, but nonces[owner] is now 6.
