# SIG-04: Permit sets absolute allowance — front-running permit to drain
# ═══════════════════════════════════════════════════════════════════════════
- id: SIG-04
  tier: 1
  type: property
  title: Permit sets absolute allowance enabling permit front-run + transferFrom drain
  description: >
    VaultV2.permit() sets `allowance[_owner][spender] = shares` (absolute, not
    incremental). If a user has existing allowance A for spender, and signs a new
    permit for allowance B, the spender can front-run: (1) use existing allowance A
    to transferFrom, (2) then execute the permit to set allowance to B, (3) then
    use allowance B to transferFrom again. Total drained: A + B instead of max(A, B).
    This is the classic ERC-20 approve front-running issue, but in the permit context
    it's harder to mitigate because the user can't cancel the signed message.
  attack_scenario: >
    1. User has allowance[user][spender] = 100 shares.
    2. User signs permit to change allowance to 50 shares (reducing).
    3. Malicious spender sees permit tx in mempool.
    4. Spender front-runs: transferFrom(user, attacker, 100) using old allowance.
    5. Permit tx executes: allowance set to 50.
    6. Spender calls transferFrom(user, attacker, 50) using new allowance.
    7. Total stolen: 150 shares instead of intended max 50.
  impact: >
    Users who sign permit to REDUCE a malicious spender's allowance can lose up to
    oldAllowance + newAllowance shares. This is a known ERC-20 pattern but permit
    makes it worse since the signed message can't be revoked once created.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    function property_sig_04() public {
      // After a permit, the total shares drained by spender in one tx block
      // should never exceed the max of old and new allowance
      if (ghost_permitExecuted) {
        uint256 maxAllowed = ghost_oldAllowance > ghost_newPermitAllowance
          ? ghost_oldAllowance
          : ghost_newPermitAllowance;
        lte(ghost_totalDrainedBySpender, maxAllowed,
            "SIG-04: spender drained more than max(old, new) allowance via permit front-run");
      }
    }
  ghost_vars:
    - 'bool internal ghost_permitExecuted'
    - 'uint256 internal ghost_oldAllowance'
    - 'uint256 internal ghost_newPermitAllowance'
    - 'uint256 internal ghost_totalDrainedBySpender'
  affected_functions:
    - permit
    - transferFrom
    - exit
  validated: false
  priority: high
  confidence: 70
  notes: >
    Known ERC-20 approve front-running issue. The standard mitigation is
    increaseAllowance/decreaseAllowance, which VaultV2 does not implement.
    Permit makes this slightly worse. Likely accepted design — EIP-2612 spec
    uses absolute allowance. But worth flagging if bounty considers it.

