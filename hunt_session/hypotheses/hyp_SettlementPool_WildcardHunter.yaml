- hunter: WildcardHunter
  id: SP-W-FP-02
  reason: >
    Reentrancy via USDC callbacks — USDC is a standard ERC20 without transfer hooks
    (not ERC777). The try/catch pattern with transferFrom and transfer cannot trigger
    reentrancy with standard USDC. Additionally, all external functions have nonReentrant.
    If a non-standard USDC with hooks were used, this would be exploitable, but that's
    outside the threat model for standard USDC deployments.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: none
    briefing: null
    content: null
    briefing_update_applied: false
