    -> require(transfers_processed[0] == false) // ALWAYS true since 0 is never set
    -> transferFrom succeeds
    -> if (transferUuid != 0) { ... } // SKIPPED — never marks processed

- id: SP-W-03
  tier: 1
  type: property
  description: >
    withdrawFees has no balance check — Oracle can withdraw more USDC than the pool
    holds, causing subsequent legitimate withdrawals to fail (griefing/fund theft).
    The function relies on USDC.transfer reverting on insufficient balance, but the
    try/catch catches this and reverts with a generic message. More critically, there
    is no accounting: the pool has no internal tracking of how much belongs to fees
    vs party deposits, so the Oracle can extract party funds as "fees".
  attack_scenario: >
    A compromised or malicious provider calls collectFees with an inflated
    amountRequested that exceeds actual fees owed. Since withdrawFees only checks
    that amountRequested > 0 and fees_batch_id hasn't been processed, but does NOT
    verify that amountRequested <= actual fees owed, the provider can drain the
    entire pool balance. The USDC.transfer will succeed as long as pool has sufficient
    balance, regardless of whether the amount represents real fees.
  impact: >
    Complete pool drainage. All party deposits stolen under the guise of "fee collection".
    The pool has no internal accounting to distinguish fee obligations from party collateral.
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // After withdrawFees, pool balance should still cover all party deposits
    // Since there's no internal accounting, we check that total withdrawals
    // via fees don't exceed a reasonable % of deposits
    uint256 poolBalance = usdc.balanceOf(address(settlementPool));
    uint256 totalFeeWithdrawn = ghost_totalFeesWithdrawn;
    uint256 totalDeposited = ghost_totalDeposited;
    // Fees should never exceed total deposited (conservation)
    lte(totalFeeWithdrawn, totalDeposited, "SP-W-03: fees withdrawn exceed total deposits");
  ghost_vars:
    - uint256 internal ghost_totalFeesWithdrawn;
    - uint256 internal ghost_totalDeposited;
  validated: false
  priority: high
  confidence: 70
  notes: >
    This is a trust assumption issue. The entire system trusts the Oracle (PROVIDER_ROLE)
    to submit correct fee amounts. If the provider is compromised, there is no on-chain
    guardrail. Whether this is "by design" depends on the threat model — if the provider
    is a multisig/EOA controlled by the protocol team, this is a centralization risk.
    If it's a smart contract, it could have its own bugs. Worth flagging as the pool
    has ZERO internal accounting — it's a pure custodial escrow with no balance tracking.
  poc_sketch: ''
  call_stack: >
    Oracle.collectFees -> SettlementPool.withdrawFees(provider, 1000000, batchId)
    -> usdc.transfer(provider, 1000000) // drains entire pool

