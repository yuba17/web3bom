    transferUuid=0 bypasses transfers_processed replay protection in _depositUSDCOnBehalf.
    When transferUuid is 0, the function skips both the duplicate check (line 97 checks
    transfers_processed[0] which is shared/global) AND skips marking it as processed
    (line 106-107: if transferUuid != 0). This means deposits with transferUuid=0 have
    NO replay protection whatsoever.
  attack_scenario: >
    In batchDepositUSDCAtomic, after the first creator deposit, transferUuid is reset to 0
    (line 140). All subsequent creator deposits in the loop use transferUuid=0. The
    _depositUSDCOnBehalf function checks transfers_processed[0] == false (line 97).
    Since transferUuid=0 is never marked as processed (line 106: if transferUuid != 0),
    this check always passes. A malicious provider could also call depositUSDCNoEvent
    with transferUuid=0 (no require != 0 check there!) to deposit on behalf of any
    address without replay protection.
  impact: >
    Funds can be repeatedly pulled from any address that has approved the pool,
    as long as the Oracle calls depositUSDCNoEvent with transferUuid=0.
    No replay protection means same logical transfer can execute multiple times.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a deposit with transferUuid=0, transfers_processed[0] should be true
    // But it won't be, proving the bypass
    // Call _depositUSDCOnBehalf with transferUuid=0 twice
    // Both should succeed — proving no replay protection
    bool processedZero = settlementPool.transfers_processed(0);
    // After deposit with uuid=0, this should be true but will be false
    t(processedZero == false, "SP-W-02: transferUuid=0 is never marked processed — no replay protection");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 90
  notes: >
    depositUSDCNoEvent does NOT require transferUuid != 0, unlike depositUSDC and
    depositUSDCOnBehalfOfParty which do. This creates an inconsistency where the
    Oracle-called path has weaker protections than the party-called path.
    The transferUuid=0 bypass is used intentionally in atomic deposits to avoid
    double-marking, but it creates a systemic weakness.
  poc_sketch: |
    // 1. User approves pool for 1000 USDC
    // 2. Oracle calls depositUSDCNoEvent(user, 500, 0) — succeeds
    // 3. Oracle calls depositUSDCNoEvent(user, 500, 0) again — also succeeds!
    // 4. User has been charged 1000 but only one logical deposit occurred
  call_stack: >
    Oracle.processTreasuryManagementDeposits -> SettlementPool.depositUSDCNoEvent
