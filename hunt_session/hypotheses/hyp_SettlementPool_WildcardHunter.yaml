- id: SP-W-06
  tier: 2
  type: property
  description: >
    Oracle.grantRole override has an inverted check: it calls super.grantRole FIRST
    (which grants the role), then checks require(!hasRole(PROVIDER_ROLE, account)) —
    but by this point hasRole returns TRUE because super.grantRole already granted it.
    This means grantRole for PROVIDER_ROLE ALWAYS reverts, making it impossible to add
    providers via the standard AccessControl grantRole path.
  attack_scenario: >
    Admin tries to add a provider via grantRole(PROVIDER_ROLE, newProvider).
    super.grantRole executes first, granting the role. Then the require checks
    !hasRole(PROVIDER_ROLE, account) which is now false (just granted). Reverts.
    The only way to add providers is via addProvider() which doesn't have this bug.
    If any external system or contract calls grantRole instead of addProvider,
    it will always fail. This could brick provider management in certain upgrade
    scenarios.
  impact: >
    grantRole for PROVIDER_ROLE is permanently broken. numProviders counter can
    become desynced if providers are added/removed via other AccessControl paths
    (renounceRole doesn't decrement numProviders). Over time, numProviders may
    not reflect reality, potentially allowing removal of the last real provider
    (numProviders says 3, reality is 1).
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // numProviders should equal the actual count of addresses with PROVIDER_ROLE
    uint256 claimed = oracle.numProviders();  // Note: numProviders is private, may need accessor
    // If we can enumerate providers (we can't easily), check:
    // claimed == actualCount
    // Alternatively: after renounceRole, numProviders should decrease but it doesn't
    // because renounceRole is inherited from AccessControl and doesn't override
  ghost_vars: []
  validated: false
  priority: high
  confidence: 85
  notes: >
    Looking at Oracle.sol line 438-446: grantRole calls super.grantRole(role, account)
    on line 439, which grants the role. Then line 442 checks !hasRole(PROVIDER_ROLE, account)
    which is now TRUE (just granted), so the require fails. This is a clear bug —
    the check should be BEFORE super.grantRole, or addProvider should be the only path.
    Additionally, renounceRole (inherited, not overridden) allows a provider to
    remove themselves without decrementing numProviders, desyncing the counter.
  poc_sketch: |
    // oracle.grantRole(PROVIDER_ROLE, newAddr) — will revert
    // oracle.addProvider(newAddr) — works
    // provider.renounceRole(PROVIDER_ROLE) — works, numProviders not decremented
    // Now numProviders is wrong
  call_stack: >
    Oracle.grantRole(PROVIDER_ROLE, addr)
    -> super.grantRole(PROVIDER_ROLE, addr) // GRANTS the role
    -> if (role == PROVIDER_ROLE) { require(!hasRole(PROVIDER_ROLE, addr)) } // ALWAYS reverts!

- id: SP-W-07
  tier: 1
  type: property
  description: >
    renounceRole is inherited from AccessControl and NOT overridden in Oracle.
    A provider can call renounceRole(PROVIDER_ROLE, self) to remove their own role
    WITHOUT decrementing numProviders. This desyncs the counter. After enough
    renouncements, numProviders could be >1 while only 1 (or 0) real providers
    exist. The removeProvider function requires numProviders > 1, so with a desynced
    counter, even the last real provider could be removed, bricking the Oracle.
  attack_scenario: >
    1. Admin adds 3 providers via addProvider (numProviders=3).
    2. Provider A calls renounceRole(PROVIDER_ROLE, A) — role removed, numProviders still 3.
    3. Provider B calls renounceRole(PROVIDER_ROLE, B) — role removed, numProviders still 3.
    4. Admin calls removeProvider(C) — requires numProviders > 1, passes (numProviders=3).
       numProviders becomes 2, but C was the LAST real provider.
    5. Oracle is now bricked — no providers, numProviders=2, all operations fail.
    6. All funds in all settlement pools are frozen since only Oracle can call
       withdrawUSDC, withdrawFees, etc.
  impact: >
    Complete Oracle brick. All settlement pools become inoperable — no deposits,
    no withdrawals, no fee collection possible. Funds permanently locked until
    admin adds new providers (if admin key still available).
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After any role change, numProviders should match actual provider count
    // This is hard to check without enumerating, but we can check:
    // numProviders should never be 0 AND at least one address should have PROVIDER_ROLE
    // If numProviders > 0 but no address has the role, it's desynced
    // Alternatively: after renounceRole, we check numProviders decreased
    uint256 providersBefore = ghost_numProvidersBefore;
    uint256 providersAfter = ghost_numProvidersAfter;
    // If a provider was removed (renounceRole), counter should decrease
    if (ghost_providerRenounced) {
        eq(providersAfter, providersBefore - 1, "SP-W-07: renounceRole didn't decrement numProviders");
    }
  ghost_vars:
    - uint256 internal ghost_numProvidersBefore;
    - uint256 internal ghost_numProvidersAfter;
    - bool internal ghost_providerRenounced;
  validated: false
  priority: critical
  confidence: 90
  notes: >
    This is a classic AccessControl override incompleteness bug. The contract
    overrides grantRole and revokeRole but NOT renounceRole. OpenZeppelin's
    renounceRole calls _revokeRole internally, which doesn't go through the
    overridden revokeRole — it's a direct internal call. So numProviders is
    never decremented on renounce. This is a real, exploitable bug.
  poc_sketch: |
    // Add 2 providers, have one renounce, check numProviders
    oracle.addProvider(addr1);  // numProviders = 1
    oracle.addProvider(addr2);  // numProviders = 2
    vm.prank(addr1);
    oracle.renounceRole(PROVIDER_ROLE, addr1);  // numProviders still 2!
    // Now removeProvider(addr2) works even though addr2 is the last provider
  call_stack: >
    provider.renounceRole(PROVIDER_ROLE, self)
    -> AccessControl.renounceRole (NOT overridden)
    -> _revokeRole(PROVIDER_ROLE, self) // internal, bypasses Oracle.revokeRole override
    -> role removed, numProviders unchanged

- id: SP-W-08
  tier: 2
  type: property
  description: >
    The SettlementPool.initialize function can be front-run on the same transaction
    as factory.createPool. Since the pool is deployed via Clones.clone (EIP-1167 minimal
    proxy), the address is deterministic based on the implementation + salt/nonce. An
    attacker who sees the createPool transaction in the mempool could potentially call
    initialize directly on the newly deployed clone BEFORE the factory's initialize call
    executes — BUT the factory checks msg.sender == address(factory), so this is mitigated.
    However, the factory address is passed as a PARAMETER to initialize, not derived.
    If an attacker deploys their own "factory" contract at a predictable address...
  attack_scenario: >
    This is mitigated by the require(msg.sender == address(ISettlementPoolFactory(_factory)))
    check — the caller must BE the factory they're claiming. An attacker cannot spoof this
    because msg.sender is unforgeable. FALSE POSITIVE for direct frontrunning.
    However: Clones.clone uses CREATE opcode, not CREATE2. The address depends on
    the factory's nonce, which is predictable. If someone could call initialize before
    the factory does... but the factory deploys AND initializes in the same transaction,
    so this is not exploitable.
  impact: 'N/A — mitigated by msg.sender check'
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Pool can only be initialized once
    // After initialization, factory should be set and non-zero
    t(settlementPool.factory() != address(0), "SP-W-08: pool initialized");
    // Calling initialize again should revert
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Investigated and confirmed mitigated. The msg.sender == factory check prevents
    unauthorized initialization. The "can only initialize once" check (factory == address(0))
    provides defense-in-depth. Moving to false_positives.
  poc_sketch: ''
  call_stack: ''

