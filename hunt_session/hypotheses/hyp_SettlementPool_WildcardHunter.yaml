- id: SP-W-01
  tier: 1
  type: property
  description: >
    batchDepositUSDCAtomic charges creatorPartyAmountRequested ONCE PER ITEM
    in the batch loop, but the event emits it as a single amount — Oracle/off-chain
    may believe only one deposit of creatorPartyAmountRequested was taken, while
    N*creatorPartyAmountRequested was actually transferred from the creator wallet.
    This is a logic discrepancy: the loop calls _depositUSDCOnBehalf for
    creatorPartyAmountRequested on EVERY iteration, draining the creator N times.
  attack_scenario: >
    Oracle (PROVIDER_ROLE) calls batchAtomicDeposit with creatorPartyAmountRequested=1000
    USDC and items.length=5. The creator is charged 5*1000=5000 USDC total (1000 per
    iteration). However, the BatchDepositedAtomic event only records
    creatorPartyAmountRequested=1000, not the total 5000. Off-chain systems reconciling
    via events will show 1000 deposited while 5000 was taken. Additionally, after the
    first iteration the transferUuid is set to 0 which bypasses the dupe check — so
    iterations 2-N deposit with transferUuid=0 which SKIPS the transfers_processed
    marking (line 106: if transferUuid != 0). This means the same parentQuoteUuid from
    item[0] is marked processed, but items[1..N] creator deposits have no replay
    protection at all. A malicious or buggy provider could re-call with same items
    and drain creator funds again.
  impact: >
    Creator wallet drained of N*amount instead of expected amount. With N=10 batch
    items each requiring 10K USDC creator deposit, creator loses 100K instead of 10K.
    Off-chain reconciliation sees only 10K.
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // Track total USDC transferred from creator across a batchDepositUSDCAtomic call
    // Ghost: ghost_creatorBalanceBefore (set before batch call)
    // Ghost: ghost_creatorBalanceAfter (set after batch call)
    // The event claims creatorPartyAmountRequested was deposited, but
    // actual drain = ghost_creatorBalanceBefore - ghost_creatorBalanceAfter
    uint256 actualDrain = ghost_creatorBalanceBefore - ghost_creatorBalanceAfter;
    // If there were N items and creatorPartyAmountRequested > 0, the creator
    // was charged N * creatorPartyAmountRequested
