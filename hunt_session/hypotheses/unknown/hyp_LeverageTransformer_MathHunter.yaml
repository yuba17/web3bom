  - id: LT-M-01
    title: "leverageDown: SafeCast overflow in fee collection blocks deleverage"
    tier: 2
    type: property
    confidence: 75
    description: >
      leverageDown computes collectParams.amount0Max as SafeCast.toUint128(amount0 + params.feeAmount0).
      If amount0 (uint256 from decreaseLiquidity) + params.feeAmount0 (uint128) exceeds type(uint128).max,
      SafeCast.toUint128 reverts. This permanently DoSes deleverage for positions with very large liquidity
      amounts combined with non-zero feeAmount params. Workaround: use feeAmount = type(uint128).max.
    affected_line: "LeverageTransformer.sol:153-154"
    attack_scenario: >
      Position with very large liquidity (amount0 near 2^127 after decreaseLiquidity) + params.feeAmount0 > 0
      causes overflow revert. Attacker cannot trigger externally but user can accidentally DoS themselves.
    status: hypothesis
    solidity: |
      // INV-LT-M-01: collectParams amounts never overflow uint128
      function invariant_leverageDown_feeAmountNoOverflow() public {
          // If feeAmount != max, amount0 + feeAmount0 <= type(uint128).max
          // Test: decreaseLiquidity returns large amount0, feeAmount0 > 0
          // Expected: either succeeds or feeAmount=max is required
      }

  - id: LT-M-02
    title: "leverageUp: amount0/amount1 underflow if swap spends more than tracked"
    tier: 2
    type: property
    confidence: 60
    description: >
      In leverageUp, when token==token1 and amountIn0 is swapped, `amount1 -= amountIn` is executed.
      Then if amountIn1 != 0 (a swap token1→token1 which is a self-swap), `amount -= amountIn` again.
      With Solidity 0.8 overflow checks, any underflow reverts. But the tracking logic has a subtle
      issue: amount, amount0, amount1 can diverge if both swaps are specified unexpectedly.
    affected_line: "LeverageTransformer.sol:65-82"
    attack_scenario: >
      User calls leverageUp with both amountIn0 and amountIn1 non-zero when token==token1.
      If amountIn0 + amountIn1 > borrowAmount, the transaction reverts due to underflow.
      Not a funds-at-risk bug but a DoS for misconfigured params.
    status: hypothesis
    solidity: |
      // INV-LT-M-02: total swap inputs never exceed borrow amount
      function invariant_leverageUp_swapInputLeqBorrow() public {
          // amountIn0 + amountIn1 <= borrowAmount (when both swaps use lend token as input)
      }

  - id: LT-M-03
    title: "leverageUp: leftover token sent to recipient even when loan health is marginal"
    tier: 2
    type: property
    confidence: 65
    description: >
      After borrow + swaps + addLiquidity, any tokens not added to the position are sent to params.recipient.
      This means borrowed funds that weren't deployed as collateral leave the vault's custody.
      The vault's _requireLoanIsHealthy catches under-collateralization but if the health check
      passes with a margin (e.g., exactly at threshold), those 'leftover' tokens represent real
      economic value extracted from the system's collateral accounting.
    affected_line: "LeverageTransformer.sol:97-105"
    attack_scenario: >
      Owner borrows X, swaps Y (Y < X), adds liquidity, receives X-Y leftover to recipient.
      Position must still pass health check. The X-Y leaked tokens were 'borrowed' from the vault
      and sent out — this is by design but creates scenarios where leverage is used to extract
      value rather than build collateral, potentially increasing systemic risk.
    status: hypothesis
    solidity: |
      // INV-LT-M-03: total value added to position >= borrow amount value
