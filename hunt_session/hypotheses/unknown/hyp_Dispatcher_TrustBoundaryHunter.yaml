- id: D-08
  tier: 1
  type: property
  description: >
    INFI_CL_POSITION_CALL y INFI_BIN_POSITION_CALL: el check valida el selector
    (modifyLiquidities) y las acciones internas. Pero la validacion decodifica
    inputs[4:] como `abi.encode(bytes unlockData, uint256 deadline)` y luego
    `slice.toBytes(0).toBytes(0)` para extraer las acciones. Si el encoding esta
    crafteado maliciosamente (offsets manipulados en ABI encoding), el check podria
    leer acciones diferentes a las que el position manager realmente ejecutara.
  attack_scenario: >
    1. Atacante construye inputs donde el ABI encoding tiene offsets inconsistentes.
    2. _checkInfiClPositionManagerCall decodifica un set de acciones (e.g., [MINT])
       usando CalldataDecoder.toBytes que sigue los offsets.
    3. Pero el position manager decodifica los mismos bytes de forma diferente
       (e.g., usando abi.decode standard) y ve acciones diferentes (e.g., [DECREASE]).
    4. El check pasa pero la accion ejecutada es la peligrosa.
    CONDICION: Esto requiere una discrepancia en como el router y el position manager
    decodifican la misma calldata. Si ambos usan ABI standard, no hay discrepancia.
  impact: "Bypass del denylist via ABI encoding malformado - drenar posiciones de otros usuarios"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Construir calldata con offsets manipulados
    // El check ve accion MINT, el PM ve accion DECREASE
    // Este invariante verifica que el check y la ejecucion ven las MISMAS acciones
    bytes memory craftedInputs = buildMalformedABIEncoding();
    // Capturar que acciones ve el check
    bytes memory actionsFromCheck = extractActionsFromCheck(craftedInputs);
    // Capturar que acciones ejecuta el PM
    bytes memory actionsFromPM = extractActionsFromPM(craftedInputs);
    eq(keccak256(actionsFromCheck), keccak256(actionsFromPM),
       "D-08: check and PM see different actions");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 40
  notes: >
    ABI encoding discrepancies han sido explotados en otros protocolos (e.g., Polygon
    bridge, Wormhole). El vector aqui es: CalldataDecoder.toBytes en el router vs
    abi.decode en el position manager. Si CalldataDecoder usa offsets relativos y
    el PM usa absolutos, hay un gap. REQUIERE analisis profundo del CalldataDecoder.
    Si ambos usan el mismo decoder o ABI standard, este vector NO existe.

- id: D-09
  tier: 2
  type: property
  description: >
    FLAG_ALLOW_REVERT (bit 0x80) permite que un comando falle silenciosamente.
    Si un swap falla pero FLAG_ALLOW_REVERT esta activo, el execute() continua con
    los siguientes comandos. Si el siguiente comando es SWEEP o TRANSFER que asume
    que el swap deposito tokens en el router, el sweep no revertira (sweeps 0 tokens
    si amountMin=0) pero el usuario pierde su input sin recibir output.
  attack_scenario: >
    1. Usuario construye: [PERMIT2_TRANSFER(token, router, 1000), V3_SWAP(payerIsUser=false) | FLAG_ALLOW_REVERT, SWEEP(outputToken, user, 0)]
    2. El swap falla (pool sin liquidez, slippage, etc.) pero no revierte por FLAG_ALLOW_REVERT.
    3. SWEEP transfiere 0 outputTokens al usuario (amountMin=0 no protege).
    4. Los 1000 inputTokens estan en el router y el siguiente caller los puede swept.
    MITIGACION: Esto es user error (no deberian usar FLAG_ALLOW_REVERT en swaps criticos
    con amountMin=0 en sweep). Pero un frontend malicioso podria construir esta secuencia.
  impact: "Perdida de fondos del usuario por FLAG_ALLOW_REVERT en swaps + sweep con amountMin=0"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Pre: usuario envio tokens al router via PERMIT2_TRANSFER_FROM
    uint256 routerInputBalance = ERC20(inputToken).balanceOf(address(router));
    // Post: swap fallo con FLAG_ALLOW_REVERT
    uint256 routerOutputBalance = ERC20(outputToken).balanceOf(address(router));
    // Si el swap fallo, no hay output tokens
    // El SWEEP con amountMin=0 no revertira pero enviara 0
    // Los input tokens quedan en el router
    t(routerInputBalance == 0 || routerOutputBalance > 0,
      "D-09: input stuck in router after failed swap with ALLOW_REVERT");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Esto es un patron conocido de los Universal Routers. Uniswap documenta que
    FLAG_ALLOW_REVERT es para comandos opcionales (e.g., unwrap WETH que puede
    fallar si el swap pago en tokens). El riesgo es de UX, no de smart contract.
    Un frontend honesto nunca pondria FLAG_ALLOW_REVERT en un swap critico.
    PROBABLEMENTE Info/by-design.

- id: D-10
  tier: 1
  type: property
  description: >
    PERMIT2_PERMIT_BATCH: la decodificacion del permitBatch usa assembly para calcular
    el offset del struct variable-length: `permitBatch := add(inputs.offset, calldataload(inputs.offset))`.
    Si calldataload(inputs.offset) contiene un offset malicioso que apunta fuera de los
    bounds del calldata, el permitBatch podria leer datos de memoria no inicializada o
    de otro slot del calldata, causando que el permit se ejecute con parametros inesperados.
  attack_scenario: >
    1. Atacante construye inputs donde el primer word (offset del struct) apunta a una
       region del calldata que contiene datos de otro comando en el batch.
    2. El permit se ejecuta con los parametros de otro comando, potencialmente aprobando
       tokens que el usuario no intento aprobar.
    3. Sin embargo, permit2.permit() valida la firma del usuario, asi que parametros
       manipulados causarian que la firma sea invalida → revert.
    CONCLUSION: La firma EIP-712 protege contra manipulacion de parametros. El offset
    malicioso causaria un revert en permit2, no una ejecucion con parametros incorrectos.
  impact: "Decodificacion insegura de PermitBatch podria causar revert inesperado"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Construir un permitBatch con offset fuera de bounds
    bytes memory malformedInputs = abi.encodePacked(
        uint256(0xFFFF), // offset absurdo
        bytes("garbage data")
    );
    // El dispatch deberia revertir, no ejecutar con datos corruptos
    (bool success, ) = address(router).call(
        abi.encodeCall(Dispatcher.execute,
            (hex"03", toInputsArray(malformedInputs)))
    );
    t(!success, "D-10: malformed permitBatch offset should revert");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    El assembly directo para decodificar structs variables es comun en routers por
    eficiencia de gas. La proteccion real es la firma criptografica en permit2.
    Si la firma no valida, permit2 revierte. PROBABLEMENTE safe but worth verifying
    en fork que permit2.permit() efectivamente revierte con datos corruptos.

