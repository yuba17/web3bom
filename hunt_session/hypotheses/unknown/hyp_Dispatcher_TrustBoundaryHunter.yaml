    lo cual re-entra en execute() con msg.sender == address(this). En Lock.isNotLocked(),
    cuando msg.sender == address(this), el lock NO se verifica. Si la ejecucion del sub-plan
    modifica el locker (via Locker.set), los comandos posteriores al sub-plan usarian un
    msgSender() incorrecto.
  attack_scenario: >
    1. Atacante envia execute() con [CMD_A, EXECUTE_SUB_PLAN, CMD_B].
    2. CMD_A se ejecuta con locker = atacante.
    3. EXECUTE_SUB_PLAN llama this.execute() que NO modifica el locker (porque msg.sender == this).
    4. Dentro del sub-plan, si alguna accion provoca un callback externo que llame execute(),
       el check isNotLocked pasa porque msg.sender == this... NO, el callback vendria de un
       contrato externo, asi que msg.sender != this y el lock SI se verifica.
    El vector real: dentro del sub-plan, _executeActions() llama vault.lock() que llama
    lockAcquired() de vuelta, y msgSender() devuelve el locker original. Esto parece seguro
    pero hay que verificar que vault.lock() no resetea el locker.
  impact: "Confusion de identidad en sub-plans anidados que podria permitir robo de fondos"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que msgSender() es consistente dentro de sub-plans
    // Capturar locker antes y despues de EXECUTE_SUB_PLAN
    address lockerBefore = Locker.get();
    // ejecutar sub-plan
    address lockerAfter = Locker.get();
    eq(lockerBefore, lockerAfter, "D-04: locker changed during sub-plan");
  ghost_vars:
  - address internal ghost_lockerSnapshot;
  validated: false
  priority: high
  confidence: 50
  notes: >
    El Lock.sol es claro: cuando msg.sender == address(this), no se modifica el locker.
    Pero vault.lock() (via _executeActions) llama lockAcquired() donde msg.sender == vault.
    La pregunta es si vault internamente modifica algo que afecte al locker del router.
    Dado que el locker usa transient storage y es un slot especifico del router, vault
