# H-03: Dual pool mapping divergence — Oracle.pools vs Factory.getPool
###############################################################################
- id: VAR-DOM-03
  tier: 1
  type: property
  description: >
    Oracle.createPool writes to BOTH Oracle.pools[poolUuid] (line 379) AND Factory.getPool[poolUuid]
    (via Factory.createPool, line 96). These are the ONLY write paths for both mappings.
    Functions use different lookups: withdrawUSDC/depositUSDC/atomicDeposit use Oracle.getPool()
    (Oracle.pools), while collectFees/batchAtomicDeposit/processTreasuryManagement* use
    factory.getPool(). If setSettlementPoolFactory() is called (line 392-398) to point to a
    NEW factory, the new factory has EMPTY getPool mappings. All functions using factory.getPool()
    would fail, while functions using Oracle.pools would still work. This creates an inconsistent
    state where some operations work and others don't.
  attack_scenario: >
    1. Admin calls setSettlementPoolFactory() to migrate to a new factory (legitimate upgrade).
    2. All existing pools are in Oracle.pools but NOT in newFactory.getPool.
    3. depositUSDC, withdrawUSDC, atomicDeposit still work (use Oracle.pools).
    4. collectFees, batchAtomicDeposit, processTreasuryManagement* all revert with "no pool
       mapping found" because newFactory.getPool returns address(0).
    5. Fees cannot be collected from existing pools. Provider is locked out of fee collection.
    6. Treasury management operations on existing pools are bricked.
  impact: "After factory migration, fee collection and treasury management operations are
    permanently bricked for all pre-existing pools. Fees accumulate but can never be withdrawn."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After factory change, both lookup paths should return the same pool address
    address oraclePool = oracle.getPool(poolUuid);
    address factoryPool = factory.getPool(poolUuid);
    eq(oraclePool, factoryPool,
       "VAR-DOM-03: pool mapping divergence — Oracle and Factory disagree");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    The divergence is structural and verifiable by code inspection. The question is
    whether setSettlementPoolFactory() is ever actually called in practice. If so,
    this is a real Medium. The factory migration has no pool-migration mechanism — there's
    no function to copy getPool mappings from old factory to new factory. Admin-only trigger
    reduces likelihood but impact is real (fees locked forever).
  poc_sketch: |
    function test_factory_migration_breaks_fees() public {
        // Create pool with original factory
        vm.prank(provider);
        oracle.createPool(creator, others, poolUuid, rfqUuid, pqUuid, address(0), 0);
        // Migrate to new factory
        SettlementPoolFactory newFactory = new SettlementPoolFactory(impl, address(usdc));
        vm.prank(admin);
        oracle.setSettlementPoolFactory(address(newFactory));
        // collectFees now reverts
