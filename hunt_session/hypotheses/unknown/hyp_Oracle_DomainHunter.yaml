# H-05: transferUuid=0 bypass in atomic deposits — second party deposit
#        skips replay protection
###############################################################################
- id: VAR-DOM-05
  tier: 1
  type: property
  description: >
    In _depositUSDCOnBehalf (SettlementPool line 106-108), if transferUuid == 0, the transfer
    is NOT marked as processed. In both depositUSDCAtomic (line 196-197) and
    batchDepositUSDCAtomic (line 139-140), after the first party deposit, transferUuid is
    reset to 0 for the second party's deposit. This means the second party's deposit has NO
    replay protection — it cannot be replayed because the provider would need to call the
    function again, and it's the provider who controls calls, not users. But there's a subtler
    issue: the require on line 97 checks transfers_processed[0] which is always false for
    uuid=0. So uuid=0 ALWAYS passes the replay check. The depositUSDCNoEvent function
    (line 285-296, used by processTreasuryManagementDeposits) has NO check for transferUuid != 0.
    A provider could pass transferUuid=0 to processTreasuryManagementDeposits, and
    _depositUSDCOnBehalf would execute with transferUuid=0, skipping replay marking.
    This allows the same deposit to be processed multiple times.
  attack_scenario: >
    1. Provider calls processTreasuryManagementDeposits with deposits containing transferUuid=0.
    2. depositUSDCNoEvent calls _depositUSDCOnBehalf with transferUuid=0.
    3. _depositUSDCOnBehalf: transfers_processed[0] is always false → passes check.
    4. Transfer executes but transfers_processed[0] is never set to true (line 106-108 skips when uuid=0).
    5. Provider can repeat this call infinitely, pulling funds from the requestor each time.
    6. Each call does a real transferFrom, so the requestor's USDC is drained repeatedly
       up to their approval amount.
  impact: "Provider can drain a user's USDC approval by replaying treasury management deposits
    with transferUuid=0. Each replay pulls real funds from the user."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // transferUuid=0 should not bypass replay protection
    // After a deposit with uuid=0, the same deposit should not be processable again
    // But _depositUSDCOnBehalf never marks uuid=0 as processed
    bool canReplay = (transfers_processed[0] == false); // always true
    t(!canReplay, "VAR-DOM-05: transferUuid=0 permanently bypasses replay protection");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 55
  notes: >
    IMPORTANT NUANCE: The real damage depends on whether the victim has approved the Pool for
    enough USDC AND whether the provider is trusted. If PROVIDER_ROLE is a fully trusted
    off-chain service, replay attacks are "by design" trust in the provider. But the replay
    protection mechanism exists precisely to prevent provider bugs/compromises from causing
    double-processing. The transferUuid=0 bypass undermines this safety net.

    depositUSDCOnBehalfOfParty (used by Oracle.depositUSDC) requires transferUuid != 0 (line 238).
    depositUSDCNoEvent (used by processTreasuryManagementDeposits) does NOT require != 0.
    withdrawUSDCNoEvent (used by processTreasuryManagementWithdrawals) flows through
    _withdrawUSDCOnBehalf which DOES require transferUuid != 0 (line 269).

    This inconsistency (deposits allow 0, withdrawals don't) suggests the check was forgotten
    in depositUSDCNoEvent.
  poc_sketch: |
    function test_replay_deposit_uuid_zero() public {
        // User approves pool for 1000 USDC
        vm.prank(user);
        usdc.approve(address(pool), 1000e6);
        // Provider processes deposit with uuid=0
        TreasuryManagement.Deposit[] memory deps = new TreasuryManagement.Deposit[](1);
        deps[0] = TreasuryManagement.Deposit(poolUuid, 0, 100e6);
        vm.prank(provider);
        oracle.processTreasuryManagementDeposits(user, deps);
        // Replay — should fail but doesn't
        vm.prank(provider);
        oracle.processTreasuryManagementDeposits(user, deps);
        // User lost 200 USDC instead of 100
        assertEq(usdc.balanceOf(user), 800e6);
    }
  call_stack: >
    Oracle.processTreasuryManagementDeposits(deps with uuid=0)
    → pool.depositUSDCNoEvent(sender, amount, 0)
    → _depositUSDCOnBehalf(sender, amount, 0, false)
    → transfers_processed[0] == false ✓ (always)
    → transferFrom succeeds
    → if(transferUuid != 0) → false → skip marking
    → transfers_processed[0] still false → replay possible

