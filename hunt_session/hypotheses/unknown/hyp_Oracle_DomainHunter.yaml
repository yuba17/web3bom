# H-10: No balance check before withdrawals — pool can be drained below
#        other users' deposits
###############################################################################
- id: VAR-DOM-10
  tier: 2
  type: property
  description: >
    SettlementPool has NO internal accounting of per-user balances. It tracks total USDC
    via _totalBalance() (raw ERC20 balance). withdrawFees and _withdrawUSDCOnBehalf simply
    call usdc.transfer(requestor, amount) without checking if the pool has sufficient
    balance or if the withdrawal would drain funds belonging to other parties. The
    transfer() will fail if balance is insufficient (ERC20 reverts), but there's no
    concept of "this user deposited X, so they can only withdraw X". The provider
    decides who withdraws how much.
  attack_scenario: >
    1. User A deposits 1000 USDC to pool.
    2. User B deposits 500 USDC to pool. Pool has 1500 USDC total.
    3. Provider calls withdrawUSDC for User A with amount=1500 (full pool balance).
    4. User A gets all 1500 USDC, including User B's 500.
    5. User B tries to withdraw — pool has 0 USDC, transfer fails.
  impact: "Provider-controlled fund redistribution between pool parties. One party can
    receive another party's deposits. Up to full pool balance."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Each party should only be able to withdraw what they deposited (or are owed)
    // But there's no per-party accounting — just total balance
    // This is by-design in a settlement pool model
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 25
  notes: >
    KILL SIGNAL: This is almost certainly by-design. Settlement pools are meant to hold
    funds for settlement between parties, and the provider (trusted off-chain system)
    determines who gets what based on off-chain derivative settlement. The on-chain contract
    is intentionally "dumb" — it just holds USDC and lets the trusted provider move it.
    Per-party accounting would be done off-chain. Very low confidence this is a bug.
  poc_sketch: ''
  call_stack: ''

