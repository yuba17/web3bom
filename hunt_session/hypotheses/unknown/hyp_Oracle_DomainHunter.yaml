###############################################################################
# H-01: grantRole PROVIDER_ROLE — numProviders check AFTER super.grantRole
#        already granted the role → require always reverts → DoS
###############################################################################
- id: VAR-DOM-01
  tier: 1
  type: property
  description: >
    Oracle.grantRole() calls super.grantRole() FIRST (line 439), which grants the role,
    then checks hasRole on line 442. Since super already granted it, hasRole returns true
    and the require("Provider already added") ALWAYS reverts. This means grantRole() for
    PROVIDER_ROLE is permanently broken — only addProvider() works. If admin code or
    external tooling calls the standard AccessControl.grantRole() (which is the OpenZeppelin
    standard path), it will always revert. This is a logic bug but may be Low since
    addProvider() exists as an alternative.
  attack_scenario: >
    Admin or governance contract calls grantRole(PROVIDER_ROLE, newProvider) — the standard
    OZ interface. The call always reverts because super.grantRole runs first, setting the role,
    then the require(!hasRole(...)) fails. The provider is never added via this path.
    numProviders counter stays out of sync if grantRole was expected to work.
  impact: "DoS on standard AccessControl interface for adding providers. If admin tooling
    relies on grantRole instead of addProvider, new providers can never be added."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // grantRole(PROVIDER_ROLE, addr) should succeed for a new provider
    // but it always reverts due to ordering bug
    address newProvider = address(0x1234);
    try oracle.grantRole(oracle.PROVIDER_ROLE(), newProvider) {
        t(false, "VAR-DOM-01: grantRole should have reverted but didn't");
    } catch {
        // Expected: always reverts — this IS the bug
        t(true, "VAR-DOM-01: grantRole permanently broken for PROVIDER_ROLE");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    Line 438-446 of Oracle.sol. super.grantRole(role, account) on line 439 grants the role
    BEFORE the hasRole check on line 442. The require(!hasRole(PROVIDER_ROLE, account))
    will ALWAYS revert for a new grant because super already set it. For revokeRole (lines
    449-457), the pattern is correct because the check happens BEFORE super.revokeRole.
    Similarly, if grantRole is called for an ALREADY-existing provider, super.grantRole is
    a no-op, and hasRole returns true, so it also reverts — meaning grantRole ALWAYS reverts
    for PROVIDER_ROLE regardless of input.
  poc_sketch: |
    function test_grantRole_always_reverts() public {
        address newProvider = makeAddr("newProvider");
        // This should succeed but doesn't
        vm.prank(admin);
        vm.expectRevert("Oracle: Provider already added.");
        oracle.grantRole(oracle.PROVIDER_ROLE(), newProvider);
    }
  call_stack: >
    Oracle.grantRole() → super.grantRole() [grants role] → hasRole() returns true → revert

