# H-08: batchDepositUSDCAtomic — creatorPartyAmountRequested charged PER ITEM
###############################################################################
- id: VAR-DOM-08
  tier: 1
  type: property
  description: >
    In SettlementPool.batchDepositUSDCAtomic (line 122-157), the loop iterates over items
    and for EACH item where creatorPartyAmountRequested > 0, it calls _depositUSDCOnBehalf
    with creatorPartyAmountRequested (line 131-136). This means the creator is charged
    creatorPartyAmountRequested ONCE PER ITEM, not once total. If there are 10 items,
    the creator pays 10x. The first item uses parentQuoteUuid for replay protection, but
    after that, transferUuid is reset to 0 (line 140), so items 2-10 have no replay protection
    AND each pulls the full creatorPartyAmountRequested from the creator.
  attack_scenario: >
    1. Provider calls batchAtomicDeposit with creatorPartyAmountRequested=1000 USDC and
       10 items.
    2. Creator is charged 1000 USDC × 10 = 10,000 USDC total.
    3. Items 2-10 use transferUuid=0, so no replay protection on those transfers.
    4. If the creator only intended to deposit 1000 USDC total (not per-item), they lose 9x.
  impact: "Creator is charged creatorPartyAmountRequested per batch item, potentially much
    more than intended. Combined with transferUuid=0 bypass for items 2+, there's no
    replay protection on the repeated charges."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Creator should not be charged more than creatorPartyAmountRequested total
    uint256 creatorBalanceBefore = usdc.balanceOf(creator);
    // After batchDepositUSDCAtomic with N items:
    uint256 creatorBalanceAfter = usdc.balanceOf(creator);
    uint256 totalCharged = creatorBalanceBefore - creatorBalanceAfter;
    lte(totalCharged, creatorPartyAmountRequested,
        "VAR-DOM-08: creator charged more than requested amount");
  ghost_vars:
  - uint256 internal ghost_creatorTotalCharged;
  validated: false
  priority: critical
  confidence: 70
  notes: >
    This is either a critical bug (creator overcharged N×) or by-design (creator amount IS
    per-item). The naming "creatorPartyAmountRequested" is ambiguous — could mean "per item"
    or "total". The function signature has it as a single uint256 outside the items array,
    which suggests it's a TOTAL amount. But the code charges it per item.

    KILL SIGNAL: If this is intentional (per-item deposit), it's by design. The creator must
    have approved enough USDC — if approval is insufficient, transferFrom will fail
    naturally. But the creator approved based on what they THOUGHT they'd be charged.

    The replay protection issue compounds this: only item[0] has a real parentQuoteUuid
    checked. Items 1..N use transferUuid=0 which is never marked as processed. So even if
    the batch is called twice with the same parentQuoteUuid, only item[0] would be blocked
    — items 1..N would execute again.
  poc_sketch: |
    function test_creator_overcharged_per_item() public {
        vm.prank(creator);
        usdc.approve(address(pool), 10000e6);

        SettlementPools.AtomicDepositBatchItem[] memory items = new SettlementPools.AtomicDepositBatchItem[](5);
        for (uint i = 0; i < 5; i++) {
            items[i] = SettlementPools.AtomicDepositBatchItem(otherAddr, 0, rfqUuid, pqUuid + uint128(i));
        }

        vm.prank(provider);
        oracle.batchAtomicDeposit(poolUuid, creator, 1000e6, items);

        // Creator lost 5000 USDC, not 1000
        assertEq(usdc.balanceOf(creator), startBalance - 5000e6);
    }
  call_stack: >
    Oracle.batchAtomicDeposit(creator, 1000e6, items[5])
    → pool.batchDepositUSDCAtomic(creator, 1000e6, items)
    → loop: item[0] → _depositUSDCOnBehalf(creator, 1000e6, pqUuid[0]) ✓
    →        item[1] → _depositUSDCOnBehalf(creator, 1000e6, 0) — uuid=0, no replay mark
    →        item[2] → _depositUSDCOnBehalf(creator, 1000e6, 0) — same
    →        ... × 5 = 5000 USDC total

