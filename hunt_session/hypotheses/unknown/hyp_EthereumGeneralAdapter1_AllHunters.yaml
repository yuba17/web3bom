  impact: "Ninguno — el rounding direction es correcto"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar rounding direction: rDivUp es conservador para max price check
    // amount.rDivUp(shares) >= amount.rDivDown(shares) siempre
    // Esto protege al usuario (precio calculado >= precio real)
    uint256 up = amount * 1e27;
