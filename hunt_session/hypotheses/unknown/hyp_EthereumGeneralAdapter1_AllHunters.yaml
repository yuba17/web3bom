- id: EGA-09
  tier: 1
  type: property
  hunter: DomainHunter
  description: >
    stETH es un token rebasing — balanceOf() cambia cada bloque con los
    rewards del beacon chain. safeTransfer en stETH internamente convierte
    amount a shares, transfiere shares, y el receiver recibe
    getPooledEthByShares(shares) que puede ser amount - 1 wei por rounding.
    En stakeEth L115, se transfiere `amount` pero el receiver puede recibir
    amount - 1 wei. El delta queda en el adapter como dust.
  attack_scenario: >
    1. Usuario llama stakeEth con 100 ETH
    2. Lido submit retorna stETH balance ~= 100e18 (puede ser 100e18 - 1 wei)
    3. safeTransfer(stETH, receiver, 100e18) — internamente Lido convierte
       100e18 a shares, redondea down, transfiere shares
    4. Receiver recibe getPooledEthByShares(shares) = 100e18 - 1 o 2 wei
    5. Dust (1-2 wei stETH) queda en el adapter
    6. Repetido miles de veces, dust se acumula y puede ser robado
       por alguien que llame stakeEth con receiver=adapter seguido de
       un transfer del dust
  impact: >
    Acumulacion de dust de stETH en el adapter. Impacto economico minimal
    (wei por transaccion) pero es un leak sistematico. En teoria, alguien
    podria reclamar el dust acumulado.
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Tras stakeEth con receiver != adapter:
    // adapter stETH balance deberia ser 0 (o muy cercano)
    uint256 adapterStEth = IERC20(ST_ETH).balanceOf(address(adapter));
    // Permitir 2 wei de dust por el rounding de stETH
    lte(adapterStEth, 2, "EGA-09: adapter retiene > 2 wei stETH post-stakeEth");
  ghost_vars:
    - uint256 internal ghost_stEthDustAccumulated;
  validated: false
  priority: medium
  confidence: 80
  notes: >
    El rounding de 1-2 wei en stETH transfers es bien documentado
    (ver: https://docs.lido.fi/guides/lido-tokens-integration-guide).
    El impacto real depende de si el dust puede ser extraido por un
    tercero. En el flujo normal de Bundler3, el adapter no deberia
    retener fondos entre bundles. Pero si stakeEth deja 1 wei por call,
    y hay miles de calls, el dust se acumula.

