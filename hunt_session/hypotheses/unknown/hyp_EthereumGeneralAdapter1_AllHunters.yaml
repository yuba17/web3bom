# ============================================================
# FLOW HUNTER
# ============================================================

- id: EGA-03
  tier: 1
  type: property
  hunter: FlowHunter
  description: >
    CRITICO: stakeEth() transfiere `amount` (ETH enviado) al receiver, pero
    Lido submit() puede retornar MENOS stETH shares que el ETH enviado.
    La funcion usa safeTransfer(ST_ETH, receiver, amount) en L115, NO usa
    sharesReceived ni el balance real de stETH post-submit.
    Si el adapter no tenia stETH previo, la transferencia puede revertir
    por balance insuficiente (stETH balance = amount - 1 o 2 wei).
    Si el adapter SI tenia stETH residual, transfiere de mas.
  attack_scenario: >
    1. Lido submit(X ETH) retorna stETH balance = X - 1 wei (rounding conocido)
    2. stakeEth intenta safeTransfer(stETH, receiver, X) — X completo
    3. Si adapter balance de stETH < X, revierte (DoS)
    4. Si adapter tenia stETH residual de otra operacion, transfiere ese
       residual + lo recibido, potencialmente robando fondos ajenos
  impact: >
    DoS en el caso comun (revert por 1-2 wei). Robo de stETH residual
    en caso edge (si hay dust de operaciones previas en el adapter).
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Pre: registrar balance stETH del adapter antes de stakeEth
    uint256 stEthBefore = IERC20(ST_ETH).balanceOf(address(adapter));
    // Ejecutar stakeEth con amount X
    // Post: verificar que receiver recibio exactamente lo que Lido dio
    uint256 stEthAfter = IERC20(ST_ETH).balanceOf(address(adapter));
    uint256 receiverGot = IERC20(ST_ETH).balanceOf(receiver);
    // El adapter no deberia tener stETH sobrante ni deficit
    // Si receiver != adapter:
    //   adapter delta = stEthAfter - stEthBefore deberia ser ~0
    //   pero el codigo transfiere `amount` no `sharesReceived`
    // INVARIANTE: amount transferido al receiver <= stETH realmente recibido de Lido
    // Esto se rompera porque el codigo transfiere `amount` (ETH) no stETH recibido
    t(false, "EGA-03: PLACEHOLDER — requiere fork test con Lido real");
  ghost_vars:
    - uint256 internal ghost_stEthPreStake;
  validated: false
  priority: critical
  confidence: 75
  notes: >
    ESTE ES EL FINDING MAS PROMETEDOR. stETH es conocido por tener rounding
    de 1-2 wei en submit(). El codigo transfiere `amount` (el ETH input)
    en vez del stETH realmente recibido. Comparar con wrapStEth (L130-132)
    que SI usa el valor de retorno `received` correctamente.

    IMPORTANTE: Lido stETH.submit() retorna SHARES, no balance. Y stETH
    es rebasing, asi que balanceOf puede diferir de amount por rounding.
    La cantidad de stETH en balance post-submit sera
    getPooledEthByShares(sharesReceived), que tipicamente es amount o
    amount - 1 wei.

    CONTRAARGUMENTO: stETH safeTransfer puede usar transferShares internamente
    y redondear de forma que amount se acepte. Necesita verificacion en fork.

    CONTRAARGUMENTO 2: Si el rounding es solo 1-2 wei, el impacto practico
    es minimal (dust). Pero el pattern es INCORRECTO comparado con
    wrapStEth/unwrapStEth que usan el return value.

