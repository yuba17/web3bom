    retenidos + que el contrato aprobado permita extraccion por terceros.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: tras cualquier operacion completa del bundler3,
    // el adapter no deberia retener fondos significativos
    uint256 ethBal = address(adapter).balance;
    uint256 stEthBal = IERC20(ST_ETH).balanceOf(address(adapter));
    uint256 wstEthBal = IERC20(WST_ETH).balanceOf(address(adapter));
    uint256 morphoBal = IERC20(MORPHO_TOKEN).balanceOf(address(adapter));
    uint256 legacyBal = IERC20(MORPHO_TOKEN_LEGACY).balanceOf(address(adapter));
