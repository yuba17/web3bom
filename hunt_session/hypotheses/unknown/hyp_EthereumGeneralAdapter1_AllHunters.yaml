- id: EGA-06
  tier: 1
  type: property
  hunter: MathHunter
  description: >
    stakeEth L113: amount.rDivUp(sharesReceived) puede revertir por division
    by zero si Lido retorna sharesReceived = 0. rDivUp calcula
    (x * RAY + (y - 1)) / y — con y=0, (y-1) underflows en uint256
    causando revert.
  attack_scenario: >
    Si Lido esta en un estado donde submit() retorna 0 shares (e.g.,
    staking paused internamente pero submit no revierte, o un edge case
    con amount muy pequeno), la transaccion revierte con underflow,
    no con un error claro. DoS para el usuario.
  impact: "DoS — transaccion revierte sin mensaje de error claro"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Edge case: si sharesReceived == 0, rDivUp revierte por underflow
    // En practica, Lido submit() revierte si amount == 0 (ya cubierto
    // por require(amount != 0)) y siempre retorna > 0 shares si amount > 0
    // Pero verificar en fork:
    // uint256 shares = IStEth(ST_ETH).submit{value: 1}(address(0));
    // t(shares > 0, "EGA-06: Lido retorno 0 shares para 1 wei");
    t(true, "EGA-06: requiere fork test — verificar shares > 0 para amount > 0");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: >
    Probabilidad muy baja. Lido submit() siempre retorna shares > 0 si
    msg.value > 0, y el require(amount != 0) ya cubre el caso msg.value == 0.
    Aun asi, el pattern es defensivamente incorrecto — deberia tener
    require(sharesReceived > 0) antes del rDivUp.

- id: EGA-07
  tier: 2
  type: property
  hunter: MathHunter
  description: >
    rDivUp overflow check: amount.rDivUp(sharesReceived) calcula
    (amount * 1e27 + sharesReceived - 1) / sharesReceived.
    Si amount es muy grande, amount * 1e27 puede overflow uint256.
    Max amount sin overflow: type(uint256).max / 1e27 ~ 1.15e50.
    ETH supply es ~120M * 1e18 ~ 1.2e26. No hay riesgo practico.
  attack_scenario: >
    Solo explotable si amount > 1.15e50 wei (~1.15e32 ETH), imposible
    en la practica. El total ETH supply es ~120M ETH.
  impact: "Ninguno practico — overflow imposible con cantidades reales"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que amount * RAY no overflow para valores realistas
    // Max ETH: 120_000_000 ether = 1.2e26 wei
    // 1.2e26 * 1e27 = 1.2e53 < 1.15e77 (uint256 max)
    // SAFE
    uint256 maxRealisticAmount = 120_000_000 ether;
    uint256 product = maxRealisticAmount * 1e27;
    t(product / 1e27 == maxRealisticAmount, "EGA-07: overflow en rDivUp");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: >
    No hay riesgo real. Incluido por completitud del analisis matematico.

