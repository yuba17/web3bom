    evento, este bug se activaria. El fix correcto seria transferir
    min(amount, stEthBalancePost - stEthBalancePre) o directamente
    usar el stETH balance delta como amount de transferencia.
    Este finding esta relacionado con EGA-03 y EGA-04.

