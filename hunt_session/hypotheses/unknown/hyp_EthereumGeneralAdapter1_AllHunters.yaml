    fondos entre transacciones que podrian ser drenados via estas approvals.
  attack_scenario: >
    Si por un bug en el bundler3 flow, stETH o MORPHO tokens quedan en
    el adapter entre transacciones, cualquiera que pueda trigger una
    operacion en WST_ETH o MORPHO_WRAPPER (que ya tienen approval max)
