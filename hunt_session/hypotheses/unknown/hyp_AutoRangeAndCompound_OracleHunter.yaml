  - id: ARC-O-01
    title: "autoCompound: zero amountOutMin in _poolSwap allows MEV sandwich extraction"
    tier: 1
    type: oracle_manipulation
    confidence: 70
    description: >
      autoCompound() line 470: _poolSwap(pool, zeroForOne, amountIn, 0)
      The 4th parameter is amountOutMin = 0. NO slippage protection.
      Contrast: execute() calls _validateSwap() which computes amountOutMin based on
      TWAP price and maxPriceDiffX64.
      autoCompound's ONLY protection is the TWAP tick difference check at line 425:
        _hasMaxTWAPTickDifference() — blocks if |currentTick - TWAP tick| > MAX_TWAP_TICK_DIFFERENCE
        MAX_TWAP_TICK_DIFFERENCE = 200 ticks ≈ 2% price difference
      Attack window: MEV bot can sandwich the autoCompound swap within the 2% window.
      For a $100K fee compound with 1% swap, attacker extracts up to 2% = $2000.
      Over many positions and many compounds, this represents systematic value extraction.
    affected_line: "AutoRangeAndCompound.sol:470 _poolSwap(..., 0)"
    attack_scenario: >
      1. Large position accumulates $100K in fees
      2. Keeper calls autoCompound() — needs to swap 50% token0 → token1
      3. autoCompound passes amountIn = $50K worth of tokens, amountOutMin = 0
      4. MEV bot front-runs: moves pool price 1.9% (within TWAP tolerance)
      5. autoCompound swap executes at worse price: receives $49.05K worth instead of $50K
      6. MEV bot back-runs: extracts ~$950 profit
      7. Position owner's compound is ~$950 less than fair value
      Impact: $950 per $100K compound (0.95%). Systematic MEV extraction on every autoCompound.
      NOTE: This is protocol-level, not user-error. amountOutMin=0 is hardcoded.
    status: hypothesis
    solidity: |
      // INV-ARC-O-01: autoCompound swap should have slippage protection
      // _validateSwap() is already implemented — should be used in autoCompound too
      function invariant_autoCompound_swapSlippage_nonZero() public {
          // amountOutMin passed to _poolSwap must be > 0
          // OR: TWAP-derived minimum must be enforced
      }

  - id: ARC-O-02
    title: "autoCompound: TWAP check insufficient for single-block price manipulation"
    tier: 2
    type: oracle_manipulation
    confidence: 55
    description: >
      _hasMaxTWAPTickDifference() uses a TWAP over a configurable window (twapSeconds).
      If twapSeconds is short (e.g., 60 seconds), a flashboan within the same block
      cannot move the TWAP (TWAP is per-block sampled). However:
      1. If twapSeconds is set very low by operator, TWAP offers minimal protection
      2. Multi-block manipulation over twapSeconds window can move TWAP
      The comparison is |spotTick - twapTick| > MAX_TWAP_TICK_DIFFERENCE.
      If an attacker moves the TWAP over multiple blocks to be near the spot price,
      then manipulates spot within 200 ticks from the (now matching) TWAP, the check passes.
    affected_line: "Automator.sol:_hasMaxTWAPTickDifference(), AutoRangeAndCompound.sol:425"
    status: low_priority
    solidity: |
      // INV-ARC-O-02: TWAP check uses sufficient window to resist manipulation

  - id: ARC-O-03
    title: "execute: baseTick floor relies on pool TWAP — stale pool can give wrong tick"
    tier: 2
    type: oracle_manipulation
    confidence: 60
    description: >
      execute() calculates baseTick from currentTick (pool spot price, not TWAP).
      If the pool price has been manipulated (spot tick far from TWAP), execute() still
      proceeds with the manipulated tick as the basis for the new position range.
      However, execute() does call _validateSwap() which uses TWAP for the swap check,
      and _hasMaxTWAPTickDifference() is called before proceeding.
      If TWAP check fails, execute() reverts. So the price manipulation protection
      works for execute() but NOT for autoCompound().
    affected_line: "AutoRangeAndCompound.sol:240-250 (baseTick calculation)"
    status: low_priority
    solidity: |
      // INV-ARC-O-03: execute() baseTick should use TWAP tick, not spot tick
      // Current code uses currentTick (spot) for range calculation

  - id: ARC-O-04
    title: "autoCompound: slippage asymmetry creates systematic keeper advantage over position owner"
    tier: 1
    type: economic
    confidence: 72
    description: >
      execute() has BOTH: TWAP check AND _validateSwap() amountOutMin protection.
      autoCompound() has ONLY: TWAP check (no amountOutMin protection).
      The execute() function was written with better protection because it moves more value
      (whole position rerange). autoCompound() handles only fee compounding.
      BUT: autoCompound() is called FAR MORE FREQUENTLY (every fee cycle vs. every rerange).
      The cumulative extraction from autoCompound MEV dwarfs the occasional execute() risk.
      Design inconsistency: more frequent operation has WEAKER protection.
    affected_line: "AutoRangeAndCompound.sol:416 autoCompound() vs 162 execute()"
    attack_scenario: >
      For a popular pool with high fee generation:
      - autoCompound called 100x per year
      - Each call: MEV extracts 0.5% of swap amount
      - Average swap amount: $10K
      - Annual extraction: 100 * $10K * 0.5% = $5000 per position
      Scale across 100 positions: $500K/year systematic extraction.
    status: hypothesis
    solidity: |
      // INV-ARC-O-04: autoCompound should use _validateSwap(), not raw _poolSwap()

  - id: ARC-O-05
    title: "execute: reward calculation uses oracle price for conversion — stale oracle risk"
    tier: 3
    type: oracle_manipulation
    confidence: 40
    description: >
      When execute() converts reward from token0/token1 to the vault debt token,
      it uses a price from the pool or oracle. If this price is stale or manipulated,
      the reward amount could be calculated incorrectly.
      The keeper could receive too much or too little reward.
      Not a fund-loss vector (vault health check would catch over-payment), but
      an economic inconsistency in keeper incentives.
    affected_line: "AutoRangeAndCompound.sol:305-320"
    status: low_priority
    solidity: |
      // INV-ARC-O-05: reward conversion uses manipulation-resistant price

  - id: ARC-O-06
    title: "autoCompound: amount0+amount1 from addLiquidity could understate actual deposit if price moved"
    tier: 3
    type: accounting
    confidence: 35
    description: >
      Slipstream addLiquidity returns the actual amounts used.
      If pool price moved between quote and execution, amounts used could differ.
