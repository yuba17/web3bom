- id: BPM-W07
  tier: 1
  type: property
  description: "Multicall with msg.value allows the same ETH to be reused across multiple delegatecall sub-calls — double-spend of msg.value"
  attack_scenario: |
    Multicall uses delegatecall, which preserves msg.value across all iterations. If a user
    sends 1 ETH and multicalls:
    1. modifyLiquidities (payload that wraps 1 ETH and adds liquidity to pool A)
    2. modifyLiquidities (payload that wraps 1 ETH and adds liquidity to pool B)

    Each delegatecall sees msg.value = 1 ETH. However, the actual ETH balance of the contract
    only has 1 ETH total. The WRAP action calls WETH9.deposit{value: amount}() which will
    revert if amount > address(this).balance.

    BUT: what about SETTLE with native currency? _settle calls vault.settle{value: amount}().
    If the contract already has ETH from previous operations (e.g., refunds from WETH unwrap),
    the settle might succeed using stale ETH balance.

    The _mapSettleAmount with CONTRACT_BALANCE uses currency.balanceOfSelf() which returns
    the ACTUAL ETH balance. But if amount is specified directly (not CONTRACT_BALANCE), and
    the contract has enough ETH from previous operations within the multicall, the user
    can settle more than they sent.

    This is the classic Multicall + msg.value double-spend (SushiSwap MISO vulnerability).
  impact: "User can potentially settle native currency debts using the same ETH twice across multicall sub-calls"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // Send 1 ETH via multicall with two modifyLiquidities calls
    // Each tries to settle 1 ETH worth of native currency debt
    // If both succeed, 2 ETH of debt was settled with only 1 ETH
    uint256 vaultBalBefore = address(vault).balance;
    // multicall{value: 1 ether}([
    //   modifyLiquidities(addLiqPool_A_native_1eth),
    //   modifyLiquidities(addLiqPool_B_native_1eth)
    // ])
    uint256 vaultBalAfter = address(vault).balance;
    uint256 settled = vaultBalAfter - vaultBalBefore;
    lte(settled, 1 ether, "BPM-W07: more ETH settled than sent via multicall msg.value reuse");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 50
  notes: |
    This is the SushiSwap MISO pattern. The key question is whether vault.settle{value: amount}()
    will succeed if the BinPositionManager doesn't have enough ETH. The vault.sync + vault.settle
    pattern should protect against this because sync records the balance before, and settle
    checks the balance after — so the actual ETH must have been received. But the delegatecall
    preserves msg.value, not actual balance. Need to verify: does vault.settle check
    address(vault).balance increase, or does it rely on msg.value? If it checks actual balance
    increase (which is the correct pattern), this is safe. If it uses msg.value, it's exploitable.

- id: BPM-W08
  tier: 1
  type: property
  description: "BIN_ADD_LIQUIDITY_FROM_DELTAS uses _getFullCredit which reverts on negative delta — no graceful handling when credit is zero or negative after hook interaction"
  attack_scenario: |
    BIN_ADD_LIQUIDITY_FROM_DELTAS (line 166-183) uses _getFullCredit(currency0/1).toUint128()
    as the amount0/amount1 for addLiquidity. _getFullCredit (DeltaResolver line 68-73) reverts
    with DeltaNotPositive if the currency delta is negative.

    Scenario:
    1. User calls modifyLiquidities with actions: [SETTLE(token0, 100), BIN_ADD_LIQUIDITY_FROM_DELTAS]
    2. They settle 100 token0, creating a positive delta of 100 for token0 in the vault.
    3. But they forgot to settle token1 — delta for token1 is 0.
    4. _getFullCredit for token1 returns 0 (delta == 0, not negative, so no revert).
    5. amount1 = 0. _addLiquidity is called with amount1=0.
    6. This could result in a single-sided liquidity add, which is valid in Bin pools.

    BUT: what if a hook in beforeMint takes tokens from the vault (reducing the delta to negative)?
    The hook executes AFTER the SETTLE action but BEFORE the slippage check. If the hook takes
    enough that the user's delta goes negative, _getFullCredit would have already been called
    and passed. The issue is that _getFullCredit is called BEFORE binPoolManager.mint which
    triggers the hook. So the amounts are fixed before hook interaction.

    This is actually safe by design — amounts are computed pre-hook, and slippage catches post-hook
    delta inflation. But there's a subtle issue: if amount0 and amount1 from _getFullCredit are
    both 0 (user settled nothing), the mint is called with amountIn = 0|0. Does binPoolManager.mint
    handle zero amounts gracefully, or does it mint zero liquidity tokens? If zero liquidity is
    minted, the _mint(to, tokenId, 0) call creates a position entry with zero balance — polluting
    the _positions mapping.
  impact: "Position mapping pollution with zero-balance entries if addLiquidity called with zero amounts"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Call BIN_ADD_LIQUIDITY_FROM_DELTAS with zero credit for both currencies
    // Check if _positions gets populated with a zero-balance entry
    uint256 tokenId = poolId.toTokenId(activeId);
    uint256 balBefore = binPositionManager.balanceOf(address(this), tokenId);
    // Execute addLiquidity with amount0=0, amount1=0
    uint256 balAfter = binPositionManager.balanceOf(address(this), tokenId);
    eq(balBefore, balAfter, "BPM-W08: zero-amount add should not create position");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: |
    Depends on how binPoolManager.mint handles zero amountIn. If it returns empty mintArrays,
    the loop doesn't execute and no position is created. Needs fork testing.

- id: BPM-W09
  tier: 1
  type: property
  description: "ERC1155 _mint with unchecked balance increment can overflow if totalSupply overflows first (balance += amount in unchecked block)"
  attack_scenario: |
    BinFungibleToken._mint (line 113-118):
    ```
    totalSupply[id] += amount;  // checked — reverts on overflow
    unchecked {
        balanceOf[to][id] += amount;  // unchecked — wraps on overflow
    }
    ```
    The rationale is: if totalSupply doesn't overflow, balanceOf can't overflow because
    balanceOf[to][id] <= totalSupply[id]. This holds IF there's only one recipient.

    But consider: _mint is called in a loop for each bin. Different tokenIds have independent
    totalSupply counters. For a single tokenId, multiple _mint calls to the SAME address
    accumulate in balanceOf. Since totalSupply is checked, it will revert before balanceOf
    can overflow. So this is safe.

    However, there's a subtle edge: if _mint is called, then _burn reduces totalSupply (also
    unchecked!), then _mint again — could totalSupply underflow? _burn line 124:
    ```
    unchecked {
        totalSupply[id] -= amount;  // unchecked
        balanceOf[from][id] -= amount;  // unchecked
    }
    ```
    The balanceOf check on line 122 prevents underflow of balanceOf. But totalSupply
    underflow is NOT checked — it relies on totalSupply >= sum(balanceOf) >= amount.
    If someone burns more than their balance... wait, line 122 prevents that.
    So totalSupply -= amount is safe because amount <= balanceOf[from][id] <= totalSupply[id].

    This is safe by invariant. Including as validated false positive.
  impact: "No impact — the checked totalSupply in _mint prevents overflow, and _burn's balance check prevents underflow"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: totalSupply[id] always >= sum of all balanceOf[*][id]
    uint256 ts = binPositionManager.totalSupply(tokenId);
    uint256 sumBal = 0;
    for (uint i = 0; i < actors.length; i++) {
        sumBal += binPositionManager.balanceOf(actors[i], tokenId);
    }
    gte(ts, sumBal, "BPM-W09: totalSupply must >= sum of balances");
  ghost_vars:
  - "uint256 internal ghost_totalMinted;"
  - "uint256 internal ghost_totalBurned;"
  validated: false
  priority: low
  confidence: 30
  notes: |
    After analysis, this appears safe. The checked addition on totalSupply in _mint and the
    balance check in _burn create a valid invariant chain. Including for completeness.

- id: BPM-W10
  tier: 1
  type: property
  description: "cachePoolKey only writes on first call (getBinStep==0 sentinel) — if a pool is re-initialized with different parameters, stale PoolKey is served by positions()"
  attack_scenario: |
    cachePoolKey (line 233-239) writes to _poolIdToPoolKey ONLY if the current entry has
    getBinStep() == 0. Since PoolId = keccak256(abi.encode(PoolKey)), the same PoolKey always
    produces the same PoolId. Two different PoolKeys cannot produce the same PoolId (collision
    resistance). So the "stale" scenario cannot happen — the PoolId is deterministic from PoolKey.

    BUT: what if getBinStep() returns 0 for a VALID PoolKey? The prompt says "binStep=0 is
    invalid for Bin pools", so a stored PoolKey with binStep>0 will never have getBinStep()==0,
    and the sentinel works correctly.

    The real question: can someone pass a PoolKey with binStep=0 to _addLiquidity? The
    binPoolManager.mint would reject it (invalid pool). But cachePoolKey would still be
    called AFTER mint succeeds (line 302). Since mint would revert for binStep=0, the cache
    is never written with a binStep=0 entry. Safe by design.

    However: what about the case where `parameters` field has other bits set alongside binStep=0?
    getBinStep() extracts specific bits from the parameters field. If the extraction is wrong
    or if other bits mask the binStep, a valid pool could have getBinStep()==0 in the cached key.
    This would cause the PoolKey to be overwritable.
  impact: "If getBinStep extraction has edge cases, pool key cache could be overwritten, causing positions() to return wrong pool data"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify cachePoolKey is idempotent — second call with same key doesn't change anything
    PoolId poolId1 = binPositionManager.cachePoolKey(poolKey);
    PoolKey memory cached1 = _poolIdToPoolKey[PoolId.unwrap(poolId1)];
    PoolId poolId2 = binPositionManager.cachePoolKey(poolKey);
    PoolKey memory cached2 = _poolIdToPoolKey[PoolId.unwrap(poolId2)];
    eq(keccak256(abi.encode(cached1)), keccak256(abi.encode(cached2)), "BPM-W10: cache must be idempotent");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: |
    After analysis, this appears safe because PoolId is deterministic from PoolKey, and
    binStep=0 is genuinely invalid for Bin pools. The sentinel works correctly. Low confidence
    because we haven't verified BinPoolParametersHelper.getBinStep() implementation.

