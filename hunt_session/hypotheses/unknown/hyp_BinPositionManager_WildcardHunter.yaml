- id: BPM-W01
  tier: 1
  type: property
  description: "_pay truncates amount to uint160 via permit2.transferFrom — any settlement amount > type(uint160).max silently pays less than owed"
  attack_scenario: |
    The _pay function casts `amount` to uint160 when calling permit2.transferFrom:
      permit2.transferFrom(payer, address(vault), uint160(amount), ...)
    If amount > type(uint160).max (approx 1.46e48), the upper bits are silently truncated.
    In practice, token amounts rarely exceed uint160, BUT: the amount comes from vault.currencyDelta
    which is an int256. If a hook or composability interaction inflates the delta to exceed uint160,
    the user pays far less than owed. The vault would have an unsettled negative delta that gets
    absorbed by the next user who settles.
    Attack: find a path where the delta for a currency exceeds uint160 — e.g., via repeated
    addLiquidity calls within a single lock session that accumulate debt, or via a malicious hook
    that amplifies the delta. The truncation means the user underpays.
  impact: "Vault accounting desync — underpayment by the truncated amount. Other users' settlements cover the gap."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: settle an amount > uint160 max and verify vault receives full amount
    uint256 largeAmount = uint256(type(uint160).max) + 1e18;
    uint256 vaultBalBefore = currency.balanceOf(address(vault));
    // Simulate _pay path with large amount
    // After settlement:
    uint256 vaultBalAfter = currency.balanceOf(address(vault));
    uint256 actualPaid = vaultBalAfter - vaultBalBefore;
    eq(actualPaid, largeAmount, "BPM-W01: _pay truncated amount via uint160 cast");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: |
    The uint160 cast in _pay line 378 is a real truncation risk. However, realistic token supplies
    rarely exceed uint160. The question is whether accumulated deltas within a single lock session
    can reach that threshold. Likely theoretical but worth verifying. Permit2's transferFrom
    signature uses uint160 by design, so this may be an inherent limitation acknowledged by the system.

- id: BPM-W02
  tier: 1
  type: property
  description: "Multicall + modifyLiquiditiesWithoutLock allows re-entering the action loop while vault is locked, bypassing isNotLocked"
  attack_scenario: |
    Multicall uses delegatecall to this contract. The flow:
    1. User calls multicall([modifyLiquidities(payload1, deadline), modifyLiquiditiesWithoutLock(actions2, params2)])
    2. First call: modifyLiquidities passes isNotLocked (locker == address(0)), sets locker = msg.sender,
       calls vault.lock(payload1), which calls lockAcquired, executes actions, clears locker.
    3. Second call: modifyLiquiditiesWithoutLock also checks isNotLocked — since the first call
       cleared the locker, this passes too. BUT this function calls _executeActionsWithoutLock
       which does NOT acquire a vault lock. It executes actions raw.

    The real question: can modifyLiquiditiesWithoutLock be called when vault is NOT locked?
    It has isNotLocked but NOT a check that vault IS locked. It's meant for hooks (called during
    lockAcquired). If called standalone via multicall when vault is unlocked, the actions
    (BIN_ADD_LIQUIDITY, etc.) call binPoolManager.mint which requires the vault to be locked.
    So it would revert at the pool manager level. But SETTLE, TAKE, SWEEP, WRAP, UNWRAP actions
    might succeed without vault lock — specifically SWEEP and WRAP/UNWRAP which don't interact
    with vault.lock state.

    Exploit: multicall with modifyLiquiditiesWithoutLock containing only SWEEP action to drain
    any tokens sitting in the BinPositionManager contract.
  impact: "Theft of any ERC20 tokens stranded in the BinPositionManager contract via SWEEP without lock"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify: can modifyLiquiditiesWithoutLock be called when vault is NOT locked?
    // And can SWEEP execute successfully in that state?
    address posManager = address(binPositionManager);
    // Send some tokens to posManager (simulating stranded tokens)
    token.transfer(posManager, 1 ether);
    // Build multicall: modifyLiquiditiesWithoutLock with SWEEP action
    // If this succeeds, attacker can drain stranded tokens
    uint256 attackerBalBefore = token.balanceOf(attacker);
    // execute multicall...
    uint256 attackerBalAfter = token.balanceOf(attacker);
    gt(attackerBalAfter, attackerBalBefore, "BPM-W02: SWEEP via modifyLiquiditiesWithoutLock drained tokens");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: |
    SWEEP (line 386-388) only checks currency.balanceOfSelf() > 0 and transfers. It does NOT
    interact with the vault at all. If modifyLiquiditiesWithoutLock can be called when vault
    is not locked, SWEEP would succeed. The isNotLocked modifier only checks the ReentrancyLock
    (transient storage locker), NOT the vault lock state. However, any tokens stranded in the
    contract are generally considered "lost" by design in Uniswap v4 architecture. Still, the
    recipient can be set to attacker via _mapRecipient.

- id: BPM-W03
  tier: 1
  type: property
  description: "Position metadata for binId=0 is never stored — _positions[tokenId].binId == 0 used as 'empty' sentinel collides with actual bin 0"
  attack_scenario: |
    In _addLiquidity line 308: `if (_positions[tokenId].binId == 0)` is used as a sentinel to
    check if the position metadata has been set. But binId=0 is a VALID bin in Bin pools
    (bins range from 0 to 2^24-1).

    If a user adds liquidity to binId=0 (activeId=0 with deltaIds[i]=0), the position is stored
    with binId=0. On a SECOND addLiquidity to the same bin, the check `_positions[tokenId].binId == 0`
    is TRUE again (because binId IS 0), so it overwrites the position data. This is harmless for
    the same pool, but consider:

    What if two DIFFERENT pools hash to the same tokenId? That's a keccak256 collision (infeasible).

    The real issue: the `positions()` view function (line 109) reverts with InvalidTokenID when
    `PoolId.unwrap(position.poolId) == 0`. If poolId happens to be bytes32(0), a legitimate
    position would be unretrievable. PoolId is keccak256(abi.encode(PoolKey)) — getting bytes32(0)
    is infeasible.

    However, for binId=0: positions() returns the correct data since poolId != 0. The sentinel
    issue means the position metadata gets re-written on every addLiquidity to bin 0, which is
    idempotent (same poolId, same binId=0). This is a LOW issue — no fund loss, just a code smell.
  impact: "No direct fund loss. Position metadata for binId=0 is re-written on every add, which is idempotent."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Add liquidity to binId 0, verify position is queryable
    // activeId must be 0, deltaIds[0] = 0
    uint256 tokenId = poolId.toTokenId(0);
    // After addLiquidity to bin 0:
    (PoolKey memory key, uint24 binId) = binPositionManager.positions(tokenId);
    eq(uint256(binId), 0, "BPM-W03: binId 0 position should be retrievable");
    // Add liquidity again to same bin — position should still be valid
    // (idempotent overwrite)
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: |
    The sentinel check uses binId==0 as "empty", but binId=0 is valid. In practice the
    overwrite is idempotent so no fund loss occurs. The positions() view uses poolId==0
    as its sentinel, which is safe (keccak256 collision is infeasible).

- id: BPM-W04
  tier: 1
  type: property
  description: "idSlippage underflow — if activeIdDesired < idSlippage, the subtraction activeIdDesired - idSlippage wraps to a huge uint256, making the check always pass"
  attack_scenario: |
    Line 260: `if (activeIdDesired - idSlippage > activeId)` — both are uint256. If
    activeIdDesired < idSlippage, the subtraction underflows (Solidity 0.8.26 will revert
    on underflow by default). Wait — this IS in unchecked? No, it's in a regular context.

    So if activeIdDesired=5 and idSlippage=10, then `5 - 10` reverts with arithmetic underflow.
    This means a user who sets idSlippage > activeIdDesired will have their transaction revert
    even if the activeId is within a valid range. This is a usability issue but not a security bug.

    However, line 257: `activeIdDesired + idSlippage < activeId` — if activeIdDesired + idSlippage
    overflows uint256, it wraps to a small number, making the check incorrectly PASS when it
    should fail. Both are bounded to type(uint24).max by the check on line 250, so
    max sum = 2 * 16777215 = 33554430, which fits in uint256. No overflow possible.

    Verdict: The underflow on line 260 causes unnecessary reverts when idSlippage > activeIdDesired,
    which is a legitimate user input (e.g., activeIdDesired=0, idSlippage=5 should allow activeId
    from 0 to 5, but reverts instead). This could prevent adding liquidity near bin 0.
  impact: "DoS: users cannot add liquidity to low-numbered bins with reasonable idSlippage values"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Try to add liquidity with activeIdDesired=2, idSlippage=5, when activeId=1
    // This should be within slippage but will revert due to underflow on 2-5
    // Call _addLiquidity and expect revert
    // If it reverts with arithmetic underflow (not IdSlippageCaught), it's a bug
    bool success;
    try binPositionManager.modifyLiquidities(...) {
        success = true;
    } catch {
        success = false;
    }
    t(success, "BPM-W04: underflow prevents valid add liquidity near bin 0");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 75
  notes: |
    This is a real edge case. Any user trying to add liquidity near bin 0 with a reasonable
    idSlippage that exceeds the activeIdDesired will get an arithmetic underflow revert
    instead of the intended IdSlippageCaught error. Bin 0 is rarely used in practice
    (it represents an extreme price), but it's still a valid bin. The fix is to add
    a check: if (activeIdDesired >= idSlippage) { check subtraction } else { /* always valid */ }.

- id: BPM-W05
  tier: 1
  type: property
  description: "initializePool silently swallows ALL errors including critical ones — pool can appear initialized but be in broken state"
  attack_scenario: |
    Line 121-124: initializePool uses try/catch {} catch {} which swallows ALL reverts from
    binPoolManager.initialize(). The comment says "if the pool revert due to other error, then
    the follow-up action to the pool will still revert accordingly."

    But consider this composability attack:
    1. Attacker calls initializePool with a carefully crafted PoolKey that causes initialize
       to revert due to an internal error (not currencyOutOfOrder) — e.g., hook deployment issue
    2. The revert is swallowed. The pool is NOT initialized.
    3. In a multicall, the next action is BIN_ADD_LIQUIDITY to this pool.
    4. If binPoolManager.mint reverts for uninitialized pool, the add fails. Fine.

    But the REAL risk: initializePool is external payable. If called with msg.value and the
    initialize call reverts, the ETH is stranded in the BinPositionManager contract forever
    (until someone calls SWEEP for native). This is a minor ETH loss vector.

    Also: a front-runner can call initializePool with a different activeId before the victim's
    tx. The victim's initializePool call gets swallowed (pool already exists), and the pool
    has the attacker's activeId. The victim then adds liquidity at the wrong price.
    This is the classic pool initialization front-running attack.
  impact: "Front-running initializePool to set attacker-chosen activeId, causing victim to add liquidity at wrong price"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Attacker front-runs pool initialization with activeId=1 (extreme price)
    // Victim's initializePool with activeId=8388608 (fair price) silently fails
    // Victim's addLiquidity succeeds at the wrong price
    binPositionManager.initializePool(key, 1); // attacker sets extreme price
    // Victim's initializePool:
    binPositionManager.initializePool(key, 8388608); // silently swallowed!
    (uint24 actualActiveId,,) = binPoolManager.getSlot0(key.toId());
    eq(uint256(actualActiveId), 1, "BPM-W05: pool initialized at attacker's activeId");
    // Now victim adds liquidity thinking activeId is 8388608 but it's 1
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: |
    This is a well-known pattern (pool initialization front-running) but the try/catch {}
    makes it worse because the victim gets NO feedback that their initialization failed.
    The idSlippage check in _addLiquidity should catch SOME cases, but if the victim sets
    wide slippage (common for new pools), the attack succeeds. This is similar to Uniswap v4
    PoolInitializer.initializePool which also silently catches, but Uniswap v4 docs warn
    about this. PCS Infinity may have the same acknowledged design.

