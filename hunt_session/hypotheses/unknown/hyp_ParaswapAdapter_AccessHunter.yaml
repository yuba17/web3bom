    briefing_update_applied: false

- hunter: AccessHunter
  id: PA-FP-02
  reason: >
    Approval residual si augustus.call revierte — NO es posible.
    El EVM revierte atómicamente todo el frame del sub-call, incluyendo la
    forceApprove(max). Incluso con skipRevert=true en Bundler3, la approval
    nunca se persiste porque el revert deshace todo el estado del sub-call.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: trust.md
    content: >
      Approval residual post-revert es imposible en EVM — el revert atómico
      deshace todo el frame incluyendo storage writes previos al punto de fallo.
      No confundir con try/catch dentro del mismo contrato (donde sí persiste el estado).
    briefing_update_applied: false

