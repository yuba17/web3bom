invariants:
- id: PA-01
  tier: 2
  type: property
  description: "sell() y buy() sin onlyBundler3 explícito — verificar que swap() interno bloquea llamadas directas"
  attack_scenario: >
    Si un atacante puede llamar sell() o buy() directamente (sin pasar por Bundler3.multicall()),
    y si swap() no tiene onlyBundler3, podría ejecutar swaps con tokens que están temporalmente
    en el adapter (ej: tokens enviados por otro usuario como parte de un bundle) y redirigir
    destTokens a su propia dirección via receiver.
  impact: "Robo de tokens en tránsito dentro del adapter — pérdida total para el usuario legítimo"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Llamar sell() directamente como EOA (no Bundler3)
    // Esperamos que REVIERTE con UnauthorizedSender
    // Test: desde un address != BUNDLER3, llamar sell() con params válidos
    // Si NO revierte, el invariante está roto
    try adapter.sell(augustus, callData, srcToken, destToken, false, offsets, attacker) {
        t(false, "PA-01: sell() ejecutable sin Bundler3 — access control bypass");
    } catch {}
  ghost_vars: []
  validated: true
  priority: high
  confidence: 95
  notes: >
    INVESTIGADO: swap() tiene modifier onlyBundler3 (L203 — require msg.sender == BUNDLER3).
    sell() y buy() NO tienen el modifier pero SIEMPRE pasan por swap() internamente.
    La protección es INDIRECTA pero EFECTIVA. sell() external → swap() internal onlyBundler3.
    buy() public → swap() internal onlyBundler3.
    buyMorphoDebt() external → buy() → swap() internal onlyBundler3.
    TODAS las rutas están protegidas. No hay bypass posible.
    VEREDICTO: by design, seguro. El Solodit finding (LOW — "Lack of onlyBundler modifier
    inside functions of ParaswapAdapter") reconoce esto mismo — es defense-in-depth, no un bug real.
    La ausencia del modifier en sell/buy no es explotable porque swap() lo tiene.

- id: PA-02
  tier: 2
  type: property
  description: "Augustus malicioso podría drenar tokens durante la ventana de approval type(uint256).max"
  attack_scenario: >
    Entre L181 (forceApprove max) y L186 (forceApprove 0), el augustus tiene approval ilimitado
    sobre srcToken. Si un augustus registrado en AUGUSTUS_REGISTRY es comprometido o malicioso,
    podría transferir TODOS los srcToken del adapter, no solo maxSrcAmount.
    Sin embargo, L194 (require srcAmount <= maxSrcAmount) verifica POST-CALL que no se gastó
    de más. El problema: si augustus transfiere tokens a sí mismo Y devuelve tokens al adapter
    para pasar el balance check, podría ocultar el robo.
  impact: "Robo de srcToken del adapter si Augustus es malicioso — pero requiere que Paraswap registry esté comprometido"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Pre-swap: registrar balance de srcToken
    uint256 srcBefore = IERC20(srcToken).balanceOf(address(adapter));
    // Ejecutar swap via Bundler3
    // Post-swap: verificar que srcToken gastado <= maxSrcAmount declarado
    uint256 srcAfter = IERC20(srcToken).balanceOf(address(adapter));
    uint256 spent = srcBefore - srcAfter;
    lte(spent, maxSrcAmount, "PA-02: augustus gastó más srcToken de lo permitido");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 40
  notes: >
    INVESTIGADO: La protección es SÓLIDA:
    1. forceApprove(max) → call augustus → forceApprove(0) — ventana temporal corta, dentro de una tx
    2. Balance check post-call: srcInitial - srcFinal <= maxSrcAmount (L194)
    3. Balance check post-call: destFinal - destInitial >= minDestAmount (L195)
    Un augustus malicioso tendría que: gastar exactamente maxSrcAmount de srcToken,
    devolver >= minDestAmount de destToken, Y ADEMÁS robar algo extra.
    En una sola tx atómica sin reentrancy, esto es imposible — el balance check atrapa cualquier
    desviación. El approval se revoca a 0 inmediatamente después.
    TRUCO POSIBLE: si srcToken == destToken, el augustus podría manipular los balances para
    que srcFinal y destFinal parezcan correctos. PERO el contrato lee balances ANTES y DESPUÉS
    del call, por lo que la contabilidad es correcta incluso en ese edge case.
    VEREDICTO: confianza en Paraswap registry es by design. Si el registry se compromete,
    el problema es de Paraswap, no de Morpho Bundler3. La approval window está bien protegida.

- id: PA-03
  tier: 2
  type: property
  description: "receiver puede ser cualquier dirección — ¿permite redirección de fondos del initiator?"
  attack_scenario: >
    El caller (via Bundler3 multicall) elige el receiver de destTokens. Si un atacante
    puede crear un bundle donde: (1) otro usuario envía srcTokens al adapter, (2) el atacante
    ejecuta sell/buy con receiver=attacker, roba los destTokens.
    Esto requiere que el atacante sea el initiator del multicall — Bundler3 guarda msg.sender
    como initiator y el adapter puede leerlo. Pero sell/buy NO verifican initiator.
  impact: "Redirección de tokens comprados a dirección arbitraria"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que receiver es el initiator o una dirección autorizada
    // (Este invariante verifica si hay validación)
    address bundlerInitiator = IBundler3(BUNDLER3).initiator();
    // En el flujo normal, el initiator controla su propio bundle
    // No hay validación de receiver vs initiator — pero el initiator ES quien elige receiver
    t(true, "PA-03: check manual — receiver es elegido por el initiator, que es msg.sender de multicall");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 90
  notes: >
    INVESTIGADO: El modelo de seguridad de Bundler3 es:
    - multicall() establece initiator = msg.sender (L31)
    - El initiator construye su propio bundle de Calls
    - Cada Call en el bundle es ejecutada por Bundler3 con msg.sender = Bundler3
    - El initiator es quien elige todos los parámetros incluyendo receiver
    El atacante NO PUEDE insertar calls en el bundle de otro usuario. Cada usuario
    llama multicall() con SU bundle. No hay forma de que un atacante inyecte un sell()
    con receiver=attacker dentro del bundle de la víctima.
    El único vector sería si el initiator firma un bundle que incluye un Call malicioso,
    pero eso es culpa del initiator por firmar algo malicioso (phishing, no bug del protocolo).
    VEREDICTO: by design, seguro. El initiator controla su propio bundle. No hay cross-user attack.

- id: PA-04
  tier: 2
  type: property
  description: "callData offsets arbitrarios — el caller puede apuntar a cualquier posición del calldata"
  attack_scenario: >
    offsets.exactAmount, offsets.limitAmount, offsets.quotedAmount son controlados por el caller.
    Si un atacante configura offsets de modo que exactAmount y limitAmount apunten al mismo
    offset, podría hacer que maxSrcAmount == minDestAmount, potencialmente bypasseando
    las protecciones de slippage.
    En sell(): maxSrcAmount = callData.get(offsets.exactAmount), minDestAmount = callData.get(offsets.limitAmount)
    Si exactAmount == limitAmount → ambos leen el mismo valor → maxSrcAmount == minDestAmount.
    Pero esto solo afecta al propio caller (initiator), no a otros usuarios.
  impact: "Auto-sabotaje de slippage — solo afecta al propio initiator, no es explotable contra terceros"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que offsets no se solapan
    // (si se solapan, updateAmounts podría corromper el callData)
    bool offsetsOverlap = (offsets.exactAmount == offsets.limitAmount) ||
                          (offsets.quotedAmount != 0 && offsets.quotedAmount == offsets.exactAmount) ||
                          (offsets.quotedAmount != 0 && offsets.quotedAmount == offsets.limitAmount);
    t(!offsetsOverlap, "PA-04: offsets solapados — callData corrompido");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    INVESTIGADO: Los offsets son proporcionados por el caller (initiator del bundle).
    Si se solapan, updateAmounts() en L239-248 escribiría un valor y luego lo leería
    como otro campo — el callData enviado a augustus sería inconsistente.
    PERO: esto solo afecta al propio initiator. El initiator es quien construye el bundle,
    elige offsets, y firma la tx. Si elige offsets inválidos, su swap falla o recibe
    peores precios — es auto-sabotaje, no un ataque a terceros.
    No hay ningún mecanismo por el cual un tercero pueda elegir los offsets de otro usuario.
    VEREDICTO: no explotable contra terceros. A lo sumo es un QA/informational sobre validación
    de inputs, pero el protocolo probablemente no valida esto a propósito (gas cost, y el caller
    se haría daño solo a sí mismo).

- id: PA-05
  tier: 1
  type: property
  description: "srcToken == destToken permite manipulación de balance checks en swap()"
  attack_scenario: >
    Si srcToken == destToken, los balance checks en L188-195 comparten el mismo token.
    srcInitial y destInitial serían el mismo balance. Después del swap:
    srcAmount = srcInitial - srcFinal (tokens gastados)
    destAmount = destFinal - destInitial (tokens recibidos)
    Si el swap es un no-op (Augustus devuelve los mismos tokens), srcFinal == srcInitial
    y destFinal == destInitial → srcAmount=0, destAmount=0.
    Pero minDestAmount != 0 es required (L206), así que un swap trivial fallaría.
    Vector real: si Augustus envía tokens extra al adapter como parte del swap routing,
    destFinal > destInitial incluso con srcToken == destToken.
  impact: "Potencial bypass de accounting si srcToken == destToken — pero limitado por balance checks"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Si srcToken == destToken, los deltas deben ser consistentes
    // En una swap real: destAmount recibido debe ≥ minDestAmount
    // Y srcAmount gastado debe ≤ maxSrcAmount
    // Con srcToken == destToken:
    // srcAmount + destAmount debería = net change = 0 si es circular
    // Pero Augustus podría enviar tokens de otra fuente
    if (srcToken == destToken) {
        // net balance change = destAmount - srcAmount
        // Esto debería ser >= 0 (ganamos) o el swap no tiene sentido
        t(destAmount >= srcAmount, "PA-05: srcToken==destToken y perdimos tokens neto");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    INVESTIGADO: El escenario srcToken == destToken es un edge case interesante pero
    probablemente no explotable:
    1. srcInitial = destInitial (mismo token, mismo balance)
    2. Augustus ejecuta el swap — podría ser un self-swap de un token por sí mismo
    3. srcFinal = destFinal (mismo token)
    4. srcAmount = srcInitial - srcFinal
    5. destAmount = destFinal - destInitial = destFinal - srcInitial
    6. Si srcFinal = srcInitial (no se gastaron tokens), srcAmount = 0, destAmount = 0
       → falla require minDestAmount != 0
    7. Si Augustus toma X y devuelve Y del mismo token:
       srcFinal = srcInitial - X + Y, destFinal = srcFinal
       srcAmount = srcInitial - srcFinal = X - Y
       destAmount = destFinal - destInitial = srcFinal - srcInitial = Y - X
       srcAmount + destAmount = 0 → conservativo
    No hay forma de que Augustus genere tokens de la nada — los balance checks son
    aritméticos y capturan el delta real. Incluso con srcToken == destToken, no se
    puede robar nada extra. Tal vez informational pero no explotable.
    VEREDICTO: probablemente by design. Necesita más investigación con tokens fee-on-transfer
    donde balanceOf después de transfer difiere del amount transferido.

- id: PA-06
  tier: 2
  type: property
  description: "buyMorphoDebt() no valida que onBehalf tenga relación con el initiator"
  attack_scenario: >
    buyMorphoDebt() lee la deuda de `onBehalf` en Morpho (L169) y compra exactamente esa cantidad.
    El caller elige `onBehalf` — puede ser cualquier dirección con deuda en Morpho.
    Escenario: Atacante A quiere repagar la deuda de víctima V. A llama buyMorphoDebt con
    onBehalf=V, receiver=A. El swap compra debtAmount de loanToken y los envía a A (no a V).
    A obtiene los tokens de deuda de V pero los recibe él — no repaga la deuda.
    PERO: esto solo gasta los srcTokens que el initiator (A) envió al adapter. A está
    usando SUS propios fondos, así que no hay robo.
  impact: "El initiator puede comprar tokens equivalentes a la deuda de cualquier usuario — pero gasta sus propios fondos, no los de la víctima"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // buyMorphoDebt usa expectedBorrowAssets de onBehalf
    // Verificar que debtAmount > 0 (ya validado por require en L170)
    // El invariante real es: ¿puede un atacante beneficiarse de leer la deuda de otro?
    uint256 debt = MorphoBalancesLib.expectedBorrowAssets(MORPHO, marketParams, onBehalf);
    t(debt > 0, "PA-06: buyMorphoDebt called with zero-debt onBehalf");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    INVESTIGADO: buyMorphoDebt() es una conveniencia que calcula cuánto comprar basado
    en la deuda de alguien en Morpho. El caso de uso legítimo: el propio deudor calcula
    cuánto loanToken necesita para repagar su deuda, lo compra via Paraswap, y luego
    repaga en otro Call del mismo bundle.
    El parámetro onBehalf permite: (1) usar la propia deuda (onBehalf = initiator) o
    (2) repagar la deuda de otro (onBehalf = otro). En caso (2), el initiator gasta
    SUS tokens para comprar loanTokens. No hay robo — el initiator es quien paga.
    El receiver es donde van los destTokens — el initiator necesita recibirlos para
    luego hacer repay en Morpho. Si receiver = attacker pero onBehalf = victim, el
    atacante compra loanTokens con sus propios fondos. No hay impacto en la víctima.
    VEREDICTO: by design. No es una vulnerabilidad.

- id: PA-07
  tier: 2
  type: property
  description: "Residual approval si augustus.call revierte — forceApprove(0) nunca se ejecuta"
  attack_scenario: >
    En swap() L213-214: si augustus.call() falla, UtilsLib.lowLevelRevert(returnData) propaga
    el revert. Esto significa que L216 (forceApprove(srcToken, augustus, 0)) NUNCA se ejecuta.
    PERO: como toda la transacción revierte, el approval max de L211 también se revierte.
    No hay estado residual — el revert es atómico.
    Sin embargo, si skipRevert=true en el Call del bundle (Bundler3 L64), la sub-call failure
    sería ignorada. ¿Pero UtilsLib.lowLevelRevert propaga directamente, no retorna false?
  impact: "Approval residual de type(uint256).max a augustus si el revert no es atómico"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Post-swap (o post-revert): verificar que approval a augustus es 0
    uint256 allowance = IERC20(srcToken).allowance(address(adapter), augustus);
    eq(allowance, 0, "PA-07: approval residual a augustus post-swap");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: >
    INVESTIGADO: La cadena de ejecución es:
    1. Bundler3._multicall() llama adapter.sell() via to.call{value}(data) (L63)
    2. sell() llama swap() que es internal — misma transacción
    3. swap() hace forceApprove(max), augustus.call(), forceApprove(0)
    4. Si augustus.call() falla → UtilsLib.lowLevelRevert() → revierte TODA la sub-call
    5. El revert propaga hasta Bundler3._multicall() L64
    6. Si skipRevert=false → todo revierte, approval se deshace
    7. Si skipRevert=true → Bundler3 captura el revert con (bool success, ...) y continúa

    CASO CRÍTICO: skipRevert=true en el Call del bundle.
    Si el Call a sell() revierte internamente (por augustus.call failure), Bundler3 captura
    el revert porque usa to.call() que no propaga automáticamente. El (bool success, ...)
    en L63 captura el fallo.
    PERO: como el call a adapter.sell() revirtió, TODOS los cambios de estado dentro de
    esa sub-call se deshacen — incluyendo el forceApprove(max). La approval NUNCA se persiste.
    Esto es porque EVM revierte todo el frame del sub-call, no solo hasta el punto de fallo.
    VEREDICTO: SEGURO. El revert atómico del EVM garantiza que la approval no persiste.
    Incluso con skipRevert=true, la approval max nunca se commitea a storage si el call falla.

false_positives:
- hunter: AccessHunter
  id: PA-FP-01
  reason: >
    sell() y buy() sin onlyBundler3 explícito NO es un bug real.
    Ambas funciones SIEMPRE pasan por swap() que tiene onlyBundler3.
    La protección es indirecta pero completa — no existe ruta de ejecución
    que evite swap(). El finding de Solodit (LOW) lo cataloga como defense-in-depth
    faltante, no como vulnerabilidad explotable. Agregar onlyBundler3 a sell/buy
    sería redundante pero más claro — es un estilo, no un bug.
