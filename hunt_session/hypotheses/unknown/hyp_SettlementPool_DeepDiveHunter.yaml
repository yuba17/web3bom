hypotheses:

  - id: SP-DD-01
    title: "CHAIN ATTACK: transferFromOLPToPool drains OLP to arbitrary address — Critical theft via missing pool validation"
    severity: critical
    confidence: 92
    description: |
      Este es el finding mas fuerte del protocolo. Oracle.transferFromOLPToPool() (L267-285)
      acepta un parametro `poolAddress` que NO SE VALIDA contra factory.getPool(poolUuid).
      El poolUuid se usa SOLO para el evento, no para resolver la direccion real del pool.

      Comparar con TODAS las demas funciones del Oracle:
        - atomicDeposit L296: `address poolAddress = getPool(poolUuid);` — VALIDA
        - batchAtomicDeposit L330: `address poolAddress = factory.getPool(poolUuid);` — VALIDA
        - withdrawUSDC L258: `address poolAddress = getPool(poolUuid);` — VALIDA
        - collectFees L103: `address poolAddress = factory.getPool(requests[i].poolUuid);` — VALIDA
        - processTreasuryManagementDeposits L154: `factory.getPool(deposits[i].poolUuid);` — VALIDA
        - processTreasuryManagementWithdrawals L202: `factory.getPool(withdrawals[i].poolUuid);` — VALIDA

      transferFromOLPToPool es la UNICA funcion que recibe poolAddress como parametro libre
      en vez de resolverlo desde el poolUuid via factory.getPool(). Esto permite al provider
      enviar USDC del OLP wallet a CUALQUIER direccion, no solo a pools validos.

      El flujo:
      1. usdc.transferFrom(olpWallet, address(oracle), amount) — mueve USDC de OLP al Oracle
      2. usdc.transfer(poolAddress, amount) — envia USDC a poolAddress (NO VALIDADO)

      Si el OLP wallet tiene un allowance grande al Oracle (probable dado que es la operacion
      normal del protocolo), un provider puede drenar todo el OLP a su propia address.

      SCOPE ANALYSIS: Este finding esta en Oracle.sol. El scope de Immunefi dice SettlementPool
      y Factory son scope directo. Oracle.sol dice "SOLO Critical direct theft via Primacy of Impact".
      Este finding ES critical direct theft — el provider roba USDC del OLP directamente.
      SI es reportable via Primacy of Impact.

      PROVIDER_ROLE ANALYSIS: La zona gris es si PROVIDER_ROLE se considera "trusted" o "privileged".
      El scope de Immunefi dice "access to privileged addresses" = out of scope. PERO el provider
      NO esta listado como privileged NI como trusted en el scope. Es un rol operativo que
      multiples entidades pueden tener. Un provider comprometido o malicioso ES un vector valido
      a menos que Immunefi lo descarte explicitamente. ADEMAS: no se necesita acceso "privileged"
      — el bug es que la funcion no valida el poolAddress, no que el provider pueda llamar la
      funcion. Incluso un provider HONESTO podria enviar fondos a la direccion equivocada por
      un bug off-chain.
    attack_chain:
      - step: 1
        action: "Provider (PROVIDER_ROLE) llama Oracle.transferFromOLPToPool(olpWallet, attackerAddress, amount, poolUuid, rfqUuid, parentQuoteUuid)"
        detail: "attackerAddress es una EOA controlada por el attacker, NO un pool real"
      - step: 2
        action: "Oracle L280: usdc.transferFrom(olpWallet, address(oracle), amount) — exito si OLP tiene allowance"
        detail: "OLP debe tener approved al Oracle para operaciones normales — este allowance ya existe"
      - step: 3
        action: "Oracle L282: usdc.transfer(attackerAddress, amount) — envia al attacker"
        detail: "No hay require(factory.getPool(poolUuid) == poolAddress). Pasa sin validacion."
      - step: 4
        action: "Evento emitido con poolAddress=attackerAddress — off-chain puede detectar pero on-chain no previene"
        detail: "El poolUuid puede ser cualquier valor, no se valida que matchee con poolAddress"
      - step: 5
        action: "Attacker recibe USDC en su address. Repetir hasta drenar todo el OLP allowance."
        detail: "Si OLP tiene 23M USDC approved, el provider puede drenar todo en multiples llamadas"
    affected_functions:
      - "Oracle.transferFromOLPToPool (Oracle.sol L267-285)"
      - "Comparar con Oracle.atomicDeposit L296 que SI valida"
      - "Comparar con Oracle.batchAtomicDeposit L330 que SI valida"
    scope_analysis: |
      REPORTABLE: SI.
      - Oracle.sol esta fuera del scope directo, pero el scope de Immunefi acepta
        "Critical direct theft via Primacy of Impact" para contratos fuera de scope.
      - Este es direct theft: USDC se mueve de OLP a attacker sin consentimiento.
      - Severidad: Critical ($100K max payout via Primacy of Impact).
      - Riesgo de rechazo: si Immunefi clasifica PROVIDER_ROLE como "privileged address",
        se rechazaria. Pero la falta de validacion de poolAddress es un BUG de codigo,
        no un abuso de privilegio — el mismo provider podria enviar fondos a la direccion
        incorrecta por error, sin intencion maliciosa.
    invariant_code: |
      // En Oracle.transferFromOLPToPool, poolAddress debe ser un pool valido del factory
      // Este invariante verifica que NUNCA se envia USDC a una direccion que no sea un pool
      address validPool = factory.getPool(poolUuid);
      require(poolAddress == validPool, "INVARIANT: poolAddress must match factory pool");
      // Alternativamente: validPool != address(0) && poolAddress == validPool

  - id: SP-DD-02
    title: "CHAIN ATTACK: batchDepositUSDCAtomic N*charge + uuid=0 bypass = deposito replay amplificado"
    severity: high
    confidence: 88
    description: |
      Combinacion de dos findings que TODOS los hunters detectaron por separado pero que
      juntos crean un ataque amplificado. La cadena:

      **Bug 1 (N*charge):** batchDepositUSDCAtomic cobra creatorPartyAmountRequested en CADA
      iteracion del loop (L127-150). Con N items, el creator paga N * creatorPartyAmountRequested.

      **Bug 2 (uuid=0 bypass):** Despues del primer deposito del creator en cada iteracion,
      transferUuid se resetea a 0 (L140). Los depositos del creator para items[1..N-1] usan
      items[i].parentQuoteUuid como UUID — pero cada item tiene un UUID diferente, asi que el
      duplicate check pasa independientemente para cada iteracion. El creator es cobrado N veces
      con N UUIDs distintos, cada uno "valido" para transfers_processed.

      **Bug 3 (replay via batchAtomicDeposit repetido):** Si el provider llama batchAtomicDeposit
      OTRA VEZ con los mismos items pero diferentes parentQuoteUuids en cada item, el creator
      paga OTRA VEZ N * creatorPartyAmountRequested. No hay mecanismo que vincule la operacion
      batch como un todo — cada deposito individual tiene replay protection, pero el batch
      como unidad no la tiene.

      **Combinacion:** Un provider malicioso puede cobrar al creator M * N * creatorPartyAmountRequested
      donde M = numero de veces que llama batchAtomicDeposit y N = numero de items por batch.

      SCOPE: SettlementPool.batchDepositUSDCAtomic es scope directo. Oracle.batchAtomicDeposit
      es el caller pero el bug esta en la logica del pool.

      AMBIGUEDAD DE DISEÑO: El counter-argument es que creatorPartyAmountRequested puede ser
      "per-item by design". PERO: (1) es un scalar, no un array — si fuera per-item seria un
      parametro del AtomicDepositBatchItem struct; (2) el evento BatchDepositedAtomic emite el
      valor una vez, no N veces; (3) el nombre es "amountRequested" singular, no "amountPerItem".
    attack_chain:
      - step: 1
        action: "Provider llama Oracle.batchAtomicDeposit(poolUuid, creatorAddr, 10000e6, items[5])"
        detail: "5 items, cada uno con parentQuoteUuid diferente y otherPartyAmounts"
      - step: 2
        action: "Pool.batchDepositUSDCAtomic loop iteration 0: _depositUSDCOnBehalf(creator, 10000e6, items[0].parentQuoteUuid)"
        detail: "Creator pierde 10000 USDC. transfers_processed[items[0].parentQuoteUuid] = true"
      - step: 3
        action: "Loop iterations 1-4: _depositUSDCOnBehalf(creator, 10000e6, items[i].parentQuoteUuid)"
        detail: "Cada iteracion usa un UUID distinto, el duplicate check pasa. Creator pierde 4 * 10000 mas."
      - step: 4
        action: "Total: creator pago 50000 USDC en vez de 10000 USDC"
        detail: "Evento emite creatorPartyAmountRequested=10000 una sola vez"
      - step: 5
        action: "Provider llama batchAtomicDeposit de nuevo con items que tienen UUIDs frescos"
        detail: "El batch como unidad no tiene replay protection. Creator paga otros 50000 USDC."
    affected_functions:
      - "SettlementPool.batchDepositUSDCAtomic (L122-157)"
      - "SettlementPool._depositUSDCOnBehalf (L90-115)"
      - "Oracle.batchAtomicDeposit (Oracle.sol L324-342)"
    scope_analysis: |
      REPORTABLE: SI — batchDepositUSDCAtomic esta en SettlementPool.sol (scope directo).
      Severidad: High si PROVIDER_ROLE es "trusted" (bug logico que drena al creator).
      Severidad: Critical si el provider puede ser cualquier entidad (theft via replay).
      Riesgo de rechazo: si el protocolo dice "creatorPartyAmountRequested es per-item by design",
      el N*charge se anula pero el replay entre batches persiste.
    invariant_code: |
      // Total USDC transferido del creator en un batch debe ser <= creatorPartyAmountRequested
      uint256 creatorBalBefore = usdc.balanceOf(creatorAddress);
      // ... batchDepositUSDCAtomic call ...
      uint256 creatorBalAfter = usdc.balanceOf(creatorAddress);
      uint256 totalCharged = creatorBalBefore - creatorBalAfter;
      lte(totalCharged, creatorPartyAmountRequested, "SP-DD-02: creator overcharged in batch");

  - id: SP-DD-03
    title: "renounceRole desync + removeProvider = Oracle brick → all pool funds frozen"
    severity: high
    confidence: 90
    description: |
      Cadena de ataque que combina dos bugs en Oracle.sol que afectan directamente a
      TODOS los SettlementPools.

      **Bug 1 (grantRole roto):** Oracle.grantRole() (L438-446) llama super.grantRole() ANTES
      del require(!hasRole). Secuencia: super.grantRole grants role → require(!hasRole) checks
      → hasRole is now TRUE → require(false) → REVERT. grantRole para PROVIDER_ROLE SIEMPRE revierte.
      Solo addProvider() funciona para agregar providers.

      **Bug 2 (renounceRole no overridden):** Oracle overrides grantRole y revokeRole para
      mantener numProviders sincronizado, pero NO override renounceRole. AccessControl.renounceRole
      llama _revokeRole internamente (bypass del override). Un provider puede renunciar sin
      decrementar numProviders.

      **Cadena de ataque:**
      1. Admin adds 2 providers via addProvider. numProviders = 2.
      2. Provider A calls renounceRole(PROVIDER_ROLE, A). Role removed, numProviders still 2.
      3. Admin calls removeProvider(B). Checks numProviders > 1 (2 > 1, passes). B removed. numProviders = 1.
      4. RESULTADO: 0 providers activos, numProviders = 1. Oracle bricked.
      5. Admin intenta addProvider(C): funciona (numProviders = 2). Pero si solo tenia 1 provider
         y ese renounce, el admin podria perder la capacidad de operar antes de detectar el problema.

      **Impacto cascada:** Si Oracle queda sin providers activos:
      - Nadie puede llamar withdrawUSDC, withdrawFees, depositUSDC (via oracle), etc.
      - Todos los fondos en todos los SettlementPools quedan frozen
      - Las parties solo pueden depositar (via depositUSDC onlyParties), pero NO pueden retirar
      - La unica recovery es que el admin agregue un nuevo provider via addProvider

      **Severidad real:** El admin puede mitigar agregando nuevos providers. Pero si el admin
      key se pierde o el admin no detecta a tiempo, los fondos quedan permanentemente locked.
      El ataque es simple: un provider malicioso renounce y trigger la cadena.

      SCOPE: Oracle.sol grantRole/renounceRole bugs que afectan directamente la operabilidad
      de los SettlementPools (scope directo). El efecto es freezing de fondos en los pools.
    attack_chain:
      - step: 1
        action: "Admin agrega providerA y providerB via addProvider(). numProviders = 2"
        detail: "Estado normal de operacion"
      - step: 2
        action: "providerA llama renounceRole(PROVIDER_ROLE, providerA)"
        detail: "AccessControl.renounceRole inherited, NOT overridden. Role removed. numProviders NO decrementa — sigue en 2."
      - step: 3
        action: "Admin llama removeProvider(providerB)"
        detail: "require(numProviders > 1) pasa porque numProviders = 2. providerB removed. numProviders = 1."
      - step: 4
        action: "0 providers activos. numProviders muestra 1 (desynced). Oracle bricked."
        detail: "Ninguna funcion onlyRole(PROVIDER_ROLE) puede ejecutarse."
      - step: 5
        action: "Todos los SettlementPools frozen — withdrawals, fee collection, deposits via oracle imposibles"
        detail: "Parties solo pueden depositar via depositUSDC (onlyParties), pero NUNCA retirar."
    affected_functions:
      - "Oracle.grantRole (Oracle.sol L438-446) — siempre revierte para PROVIDER_ROLE"
      - "AccessControl.renounceRole (inherited, not overridden) — no decrementa numProviders"
      - "Oracle.removeProvider (Oracle.sol L422-435) — uses desynced numProviders"
      - "Todas las funciones onlyRole(PROVIDER_ROLE) en Oracle"
      - "Indirectamente: TODAS las funciones onlyOracle en SettlementPool"
    scope_analysis: |
      REPORTABLE: ZONA GRIS.
      - El bug esta en Oracle.sol (fuera de scope directo excepto Critical).
      - El IMPACTO es freezing de fondos en SettlementPool (scope directo).
      - Via Primacy of Impact: freezing of funds >= Critical? Immunefi tipicamente
        clasifica permanent freezing como Critical, temporary freezing como Medium.
      - Si admin puede mitigar (addProvider), es temporary → Medium.
      - Si admin key esta perdido, es permanent → Critical.
      - Recomendacion: reportar como High/Medium con nota sobre mitigacion por admin.
      - Riesgo de rechazo: moderado — el admin puede agregar providers nuevos.
    invariant_code: |
      // numProviders debe ser siempre igual al numero real de providers con PROVIDER_ROLE
      // Despues de renounceRole, numProviders debe decrementar
      uint256 providerCountBefore = ghost_numProviders;
      // ... provider calls renounceRole ...
      uint256 providerCountAfter = ghost_numProviders; // read from oracle
      // Si un provider renuncio, el contador deberia haber bajado
      if (ghost_providerRenounced) {
          eq(providerCountAfter, providerCountBefore - 1, "SP-DD-03: numProviders desynced after renounce");
      }

  - id: SP-DD-04
    title: "CROSS-CONTRACT: Oracle migration resets atomic_deposits_processed → replay de depositos atomicos pre-migracion"
    severity: medium
    confidence: 72
    description: |
      Vector que NINGUN hunter individual detecto completamente. Combina:

      **Observacion 1 (SP-TB-04, SP-O-05):** El Oracle address es mutable via
      factory.setOracleAddress(). Todos los pools confian dinamicamente en factory.oracle().

      **Observacion 2 (SP-TB-08, SP-W-04):** depositUSDCAtomic path (partyOne > 0, partyTwo == 0)
      emite evento + early return SIN actualizar transfers_processed en el pool. La replay
      protection para este path esta SOLO en Oracle.atomic_deposits_processed.

      **Observacion 3:** Oracle.atomic_deposits_processed es un mapping PRIVADO en el Oracle
      contract. Cuando el admin cambia el Oracle via factory.setOracleAddress(newOracle),
      el nuevo Oracle tiene un mapping atomic_deposits_processed VACIO.

      **Cadena de ataque post-migracion:**
      1. Oracle V1 procesa atomicDeposit(partyOne, partyTwo, 1000, 0, poolUuid, rfqUuid, quoteUuid).
      2. Oracle V1: atomic_deposits_processed[quoteUuid] = true. Pool no tiene este UUID registrado.
      3. Admin migra a Oracle V2 via factory.setOracleAddress(oracleV2).
      4. Oracle V2: atomic_deposits_processed[quoteUuid] = false (mapping vacio).
      5. Provider en Oracle V2 llama atomicDeposit con el mismo quoteUuid.
      6. Oracle V2 L299: atomic_deposits_processed[quoteUuid] == false → pasa.
      7. partyOne pierde 1000 USDC OTRA VEZ (transferFrom se ejecuta de nuevo).
      8. El pool's transfers_processed tampoco lo bloquea porque el early return path (L169-180)
         no marca ningun UUID en transfers_processed.

      **Prerequisito:** partyOne debe tener allowance suficiente al Oracle V2 o al pool.
      Post-migracion, los parties probablemente aprueban el nuevo Oracle. El allowance al pool
      persiste (no cambia con la migracion del Oracle).

      NOTA IMPORTANTE: Este ataque requiere un Oracle migration legítimo + un provider
      malicioso/comprometido en el nuevo Oracle. No es self-service — requiere PROVIDER_ROLE
      en el nuevo Oracle.
    attack_chain:
      - step: 1
        action: "Oracle V1 procesa atomicDeposit(partyOne, ..., parentQuoteUuid=X). atomic_deposits_processed[X] = true"
        detail: "Pool.depositUSDCAtomic early return — transfers_processed[X] NOT set en el pool"
      - step: 2
        action: "Admin llama factory.setOracleAddress(oracleV2) — migracion legitima"
        detail: "oracleV2 tiene atomic_deposits_processed vacio — no hereda estado de V1"
      - step: 3
        action: "Provider en V2 llama atomicDeposit con el mismo parentQuoteUuid=X"
        detail: "atomic_deposits_processed[X] == false en V2. No hay bloqueo."
      - step: 4
        action: "Oracle V2 L300-304: transferFrom(partyOne, oracle, 1000) + transfer(pool, 1000)"
        detail: "partyOne pierde 1000 USDC. Pool recibe fondos duplicados."
      - step: 5
        action: "Provider puede repetir para cada parentQuoteUuid procesado en V1"
        detail: "Cada UUID procesado en V1 es replayable en V2."
    affected_functions:
      - "Oracle.atomicDeposit (Oracle.sol L287-322)"
      - "Oracle.atomic_deposits_processed mapping (Oracle.sol L22)"
      - "SettlementPoolFactory.setOracleAddress (SettlementPoolFactory.sol L103)"
      - "SettlementPool.depositUSDCAtomic (L159-216, early return path)"
    scope_analysis: |
      REPORTABLE: ZONA GRIS.
      - Oracle es scope solo para Critical. Este replay podria ser Critical si se drenan
        fondos significativos post-migracion.
      - El prerequisito (migracion + provider malicioso en V2) reduce likelihood.
      - Recomendacion: incluir como finding secundario junto con SP-DD-01 si se reporta.
      - Alternativa: reportar como SettlementPool finding (el pool deberia trackear
        transfers_processed para atomic deposits, no delegar a Oracle).
    invariant_code: |
      // Despues de una migracion de Oracle, los UUIDs procesados en V1 deben seguir
      // siendo reconocidos como procesados. El pool deberia mantener su propio registro.
      // Invariante: pool.transfers_processed[parentQuoteUuid] debe ser true despues de
      // cualquier depositUSDCAtomic, incluyendo el early return path
      if (ghost_atomicDepositExecuted && ghost_earlyReturnPath) {
          t(pool.transfers_processed(ghost_lastParentQuoteUuid),
            "SP-DD-04: atomic deposit early return did not set transfers_processed");
      }

  - id: SP-DD-05
    title: "SCOPE VERDICT: PROVIDER_ROLE findings — analisis de reportabilidad cruzado"
    severity: informational
    confidence: 95
    description: |
      Analisis meta que evalua la reportabilidad de TODOS los findings que dependen de
      PROVIDER_ROLE como vector de ataque. Este no es un finding en si, sino una guia
      de decision para los otros 4 findings.

      **Estado actual del scope:**
      - SettlementPool.sol: scope directo, cualquier severidad
      - SettlementPoolFactory.sol: scope directo, cualquier severidad
      - Oracle.sol: SOLO Critical direct theft via Primacy of Impact
      - "Access to privileged addresses" = out of scope
      - PROVIDER_ROLE: NO listado como trusted NI como privileged explicitamente

      **Clasificacion de findings por dependencia del PROVIDER_ROLE:**

      1. **SP-DD-01 (transferFromOLPToPool, Critical):**
         - Bug: missing poolAddress validation en ORACLE.SOL
         - Vector: provider envía USDC a arbitrary address
         - Reportabilidad: ALTA. Es un bug de codigo (poolAddress no validado), no un
           abuso de privilegio. El mismo bug afectaría a un provider honesto con un typo.
           Primacy of Impact aplica: Critical theft en Oracle.

      2. **SP-DD-02 (batch N*charge, High):**
         - Bug: logica de loop en SETTLEMENTPOOL.SOL
         - Vector: provider llama batch con multiples items
         - Reportabilidad: ALTA. El bug esta en el contrato in-scope (SettlementPool).
           El provider no necesita ser malicioso — el bug se manifiesta con uso normal.
           Un provider honesto que llama batch con 5 items cobra 5x al creator SIN INTENCION.

      3. **SP-DD-03 (renounceRole desync, High):**
         - Bug: missing override en ORACLE.SOL
         - Vector: provider auto-renounce
         - Reportabilidad: MEDIA. Es un bug de codigo en Oracle que causa freeze en pools.
           Immunefi: freeze de fondos podria calificar como Critical via Primacy of Impact.
           Pero el admin puede mitigar (addProvider), lo que lo baja a Medium.

      4. **SP-DD-04 (migration replay, Medium):**
         - Bug: split-brain estado entre Oracle y Pool
         - Vector: requiere migracion + provider malicioso
         - Reportabilidad: BAJA. Demasiados prerequisitos. Incluir como observacion
           secundaria, no como finding principal.

      **Recomendacion de submission order:**
      1. SP-DD-01 → Critical (submission independiente, mas fuerte)
      2. SP-DD-02 → High (submission independiente, bug claro en scope)
      3. SP-DD-03 → Medium (submission independiente, bien documentado)
      4. SP-DD-04 → Low/Info (agregar como observacion en SP-DD-01 o SP-DD-03)
    attack_chain: []
    affected_functions: []
    scope_analysis: |
      Esta hipotesis es un meta-analisis de scope, no un finding reportable por si mismo.
      Los 4 findings anteriores tienen sus propios scope analyses individuales.
    invariant_code: "# N/A — meta-analysis, not a testable invariant"

false_positives:
  - id: SP-DD-FP-01
    description: |
      "withdrawFees no valida party membership" (convergencia 2, 6/7 hunters).
      Investigado en profundidad: Oracle._processFeeRequests L107 pasa msg.sender (el provider)
      como requestor a withdrawFees. Esto es BY DESIGN — los fees van al provider, no a las parties.
      Las fees son la remuneracion del provider por el servicio de clearing/settlement.
      El REAL bug no es "a quien van los fees" sino "cuanto se puede sacar" (no hay cap).
      Este aspecto ya esta cubierto por SP-DD-01 (transferFromOLPToPool) que es un vector
      de theft mas directo y claro. Reportar withdrawFees como bug separado tiene alto riesgo
      de rechazo como "by design".

  - id: SP-DD-FP-02
    description: |
      "depositUSDCNoEvent permite uuid=0 repetido" (convergencia 1, ruta depositUSDCNoEvent).
      Re-evaluado: si bien depositUSDCNoEvent no requiere transferUuid != 0, en la practica
      el Oracle.processTreasuryManagementDeposits pasa deposits[i].transferUuid que viene del
      off-chain system. Si el off-chain system siempre genera UUIDs > 0, el vector uuid=0 requiere
      un provider malicioso. Esto lo hace redundante con SP-DD-01 (transferFromOLPToPool) que es
      un vector de theft mas directo con el mismo prerequisito (provider malicioso). El uuid=0
      bypass es un bug real pero se subsume bajo el riesgo general de "provider malicioso tiene
      demasiado poder sin guardrails on-chain".

convergence_summary: |
  Los 7 hunters convergieron fuertemente en 5 temas. La 2da pasada revela:

  1. **SP-DD-01 es el finding principal** — transferFromOLPToPool sin validacion es el vector
     mas directo de theft. Ningun hunter lo analizo en la profundidad de comparar con TODAS
     las otras funciones del Oracle para demostrar que es la unica sin validacion.

  2. **SP-DD-02 es el segundo finding mas fuerte** — el batch N*charge no requiere malicia,
     se manifiesta con uso normal. Es el unico finding que puede argumentarse como bug sin
     asumir provider malicioso.

  3. **SP-DD-03 es un bug concreto y demostrble** — grantRole siempre revierte + renounceRole
     no decrementa = Oracle brickeable. PoC directo.

  4. **SP-DD-04 es un vector emergente** de la combinacion de migration + split-brain state
     que ningun hunter individual detecto completamente.

  5. **withdrawFees sin party check** (6/7 convergencia) es probablemente by-design y no
     deberia reportarse por separado.
