# ─────────────────────────────────────────────────────────────────
# H8: batchDepositUSDCAtomic — creator deposita N veces en batch
# ─────────────────────────────────────────────────────────────────
- id: ORC-OH-08
  tier: 1
  type: property
  description: >
    En SettlementPool.batchDepositUSDCAtomic (líneas 122-157), si hay N items
    en el batch, el creatorPartyAddress deposita creatorPartyAmountRequested
    N veces (una por cada item). Esto es porque el loop en línea 127 llama
    _depositUSDCOnBehalf para el creator en cada iteración (línea 130-136).

    La primera iteración usa parentQuoteUuid como transferUuid para replay
    protection. Las iteraciones 2..N usan transferUuid=0 (reseteado en línea 140)
    PERO: después de la primera iteración, transfers_processed[parentQuoteUuid]=true.
    En la segunda iteración, transferUuid=items[1].parentQuoteUuid (un UUID DIFERENTE).

    WAIT: Re-leyendo... El transferUuid se asigna en línea 129 DENTRO del loop:
    `uint128 transferUuid = items[i].parentQuoteUuid;` — cada iteración usa
    el parentQuoteUuid del item correspondiente. Y el reset a 0 en línea 140
    es solo para que el segundo _depositUSDCOnBehalf (del otherParty en el mismo item)
    no haga replay check.

    PERO: El creator deposita creatorPartyAmountRequested en CADA iteración del loop.
    Si hay 10 items, el creator deposita 10 * creatorPartyAmountRequested.
    ¿Es esto intencional? El caller (Oracle.batchAtomicDeposit) pasa el mismo
    creatorPartyAmountRequested para todos los items. Esto parece ser by design
    para depositar el margen del creator para cada contraparte.
  attack_scenario: >
    Probablemente by design — el creator deposita margen separado para cada
    contraparte en el batch. Pero un usuario que no entiende que el monto
    se multiplica por N items podría perder más de lo esperado.
    Esto es un riesgo UX, no un bug de contrato.
  impact: "Confusión de usuario sobre monto total depositado — UX issue, no exploit"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que creator deposita N veces el monto
    uint256 balBefore = usdc.balanceOf(creator);
    // Batch con 5 items, cada uno con su UUID
    oracle.batchAtomicDeposit(poolUuid, creator, 100e6, items5);
    uint256 balAfter = usdc.balanceOf(creator);
    // Creator perdió 500e6, no 100e6
    eq(balBefore - balAfter, 500e6, "ORC-OH-08: creator deposita N veces");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: >
    Probablemente by design para mercados bilaterales donde el creator
    mantiene posiciones separadas con cada contraparte. Pero la API es
    confusa — creatorPartyAmountRequested sugiere un monto total, no
    un monto por item. Necesita confirmación del equipo.
  poc_sketch: ''
  call_stack: >
    Oracle.batchAtomicDeposit() → SettlementPool.batchDepositUSDCAtomic()
    → for each item: _depositUSDCOnBehalf(creator, creatorAmount, uuid, false)
    → Creator deposita creatorAmount * items.length total

