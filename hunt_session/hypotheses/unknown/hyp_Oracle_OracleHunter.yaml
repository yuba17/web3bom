    El provider puede llamar esta función repetidamente con los mismos parámetros.
    Los fondos vienen del olpWallet via transferFrom, así que requiere allowance.
  attack_scenario: >
    1. OLP wallet tiene allowance infinita de USDC al Oracle contract.
    2. Provider llama transferFromOLPToPool(olp, pool, 10000e6, ...) repetidamente.
    3. No hay replay check — cada llamada transfiere 10000e6 más.
    4. OLP wallet se drena completamente.
    KILL SIGNAL: Provider trusted, pero este path no tiene NINGUNA protección,
    ni siquiera el check condicional de uuid!=0 que tienen los otros paths.
  impact: "Drenaje completo de OLP wallet si tiene allowance infinita y provider es comprometido"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // transferFromOLPToPool no tiene replay protection
    oracle.transferFromOLPToPool(olp, pool, 1000e6, poolUuid, rfqUuid, parentQuoteUuid);
    oracle.transferFromOLPToPool(olp, pool, 1000e6, poolUuid, rfqUuid, parentQuoteUuid);
    // Ambas pasan sin revert — OLP pierde 2000e6
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 90
  notes: >
    Este es el path con MENOS protección en todo el sistema. Ni siquiera tiene
    el patrón condicional de uuid!=0. rfqUuid y parentQuoteUuid son puramente
    informativos (solo se emiten en evento). Si el provider tiene un bug off-chain
    que envía duplicados, no hay defensa on-chain alguna.

    Comparar con otros paths:
    - depositUSDC: require(transferUuid != 0) + transfers_processed check
    - atomicDeposit: atomic_deposits_processed check (aunque con gap en uuid=0)
    - transferFromOLPToPool: NINGÚN check
  poc_sketch: ''
  call_stack: >
    Oracle.transferFromOLPToPool(olp, pool, amount, poolUuid, rfqUuid, parentQuoteUuid)
