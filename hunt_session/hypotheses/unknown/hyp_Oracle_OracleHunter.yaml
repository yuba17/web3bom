#
# Verificado: CERO cálculos de precio on-chain.
# - No hay Chainlink feeds, no hay TWAP, no hay price calculations.
# - "Oracle" es un nombre engañoso — el contrato es un clearing/settlement engine.
# - Todos los montos (deposits, withdrawals, fees) son pasados por el PROVIDER_ROLE.
# - El provider es la única fuente de verdad para cantidades.
# - _totalBalance() usa balanceOf(address(this)) pero NO hay share/exchange rate system.
#
# TRUST MODEL COMPLETO — Lo que el provider controla:
#   1. Todos los montos de deposit (amount parameter)
#   2. Todos los montos de withdrawal (amountRequested parameter)
#   3. Todos los montos de fees (amountRequested en CollectionRequest)
#   4. Qué direcciones reciben fondos (requestor parameter)
#   5. Creación de pools (creator, other addresses, fees)
#   6. Transferencias OLP→Pool (olpWallet, poolAddress, amount)
#   7. Adición de partes a pools (addOtherParty)
#
# El sistema es fundamentalmente custodial con el provider como trusted intermediary.
# Los ataques de manipulación de precio son off-chain concerns, no smart contract bugs.
#
# ═══════════════════════════════════════════════════════════════════

