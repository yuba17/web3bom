# ─────────────────────────────────────────────────────────────────
# H1: REPLAY PROTECTION GAP — transferUuid=0 bypasses replay check
# ─────────────────────────────────────────────────────────────────
- id: ORC-OH-01
  tier: 1
  type: property
  description: >
    En _depositUSDCOnBehalf (SettlementPool.sol:106-108), cuando transferUuid=0,
    el replay check se SALTA: `if (transferUuid != 0) { transfers_processed[transferUuid] = true; }`.
    Esto significa que el provider puede llamar la misma operación con transferUuid=0
    múltiples veces sin que el contrato lo detecte como replay.
    PERO: el provider ya es trusted y los fondos vienen del sender via transferFrom
    (requiere allowance). El sender perdería fondos solo si tiene allowance infinita
    al pool y el provider llama múltiples veces. En la práctica, el front-end
    probablemente aprueba exactos.
  attack_scenario: >
    1. Usuario aprueba USDC al pool con allowance = type(uint256).max (patrón común en DeFi).
    2. Provider (off-chain) tiene un bug o es malicioso.
    3. Provider llama depositUSDCNoEvent(user, 1000e6, 0) repetidamente.
    4. Cada llamada pasa porque transferUuid=0 nunca marca transfers_processed.
    5. El pool drena toda la allowance del usuario.
    KILL SIGNAL: El provider es trusted, así que esto es "trusted role abuse".
    Immunefi generalmente excluye ataques que requieren provider comprometido.
    Sin embargo, la falta de replay protection para uuid=0 es un gap real en defensa en profundidad.
  impact: "Drenaje de fondos de usuarios con allowance infinita al pool, si el provider es comprometido o tiene un bug off-chain"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Probar que transferUuid=0 permite múltiples depósitos idénticos
    // sin que transfers_processed lo bloquee
    uint256 balBefore = usdc.balanceOf(user);
    pool.depositUSDCNoEvent(user, 100e6, 0); // via Oracle as provider
    pool.depositUSDCNoEvent(user, 100e6, 0); // segunda vez — NO revierte
    uint256 balAfter = usdc.balanceOf(user);
    // Si el user tenía allowance >= 200e6, perdió 200e6 en vez de 100e6
    eq(balBefore - balAfter, 200e6, "ORC-OH-01: doble depósito con uuid=0");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    El código tiene paths donde transferUuid=0 es intencional: en batchDepositUSDCAtomic
    (línea 140), transferUuid se resetea a 0 para el segundo depósito de un atomic pair.
    Esto es "by design" para el caso batch. PERO depositUSDCNoEvent desde Oracle
    (processTreasuryManagementDeposits) no filtra transferUuid=0 — depende del provider
    enviar UUIDs válidos. La pregunta es si el programa de bounty considera provider
    comprometido como in-scope.
  poc_sketch: ''
  call_stack: >
    Oracle.processTreasuryManagementDeposits() → SettlementPool.depositUSDCNoEvent()
    → _depositUSDCOnBehalf(sender, amount, transferUuid=0, false)
    → transfers_processed[0] nunca se marca true (line 106-108)

# ─────────────────────────────────────────────────────────────────
# H2: NO HAY SANITY CHECK DE MONTOS — provider puede pasar amount > balance
# ─────────────────────────────────────────────────────────────────
- id: ORC-OH-02
  tier: 2
  type: property
  description: >
    withdrawFees, _withdrawUSDCOnBehalf, y withdrawUSDC no verifican que
    amountRequested <= _totalBalance(). Dependen del try/catch del transfer ERC20
    para fallar si no hay fondos suficientes. Esto es técnicamente correcto
    (USDC.transfer revertirá si balance insuficiente) pero no hay CAP ni rate limit.
    Un provider comprometido podría intentar extraer todo el balance de un pool
    en una sola llamada.
  attack_scenario: >
    1. Provider llama withdrawFees(providerAddress, pool.totalBalance, feesBatchId).
    2. El transfer de USDC tiene éxito porque amount <= balance.
    3. El pool queda con 0 USDC.
    4. Todos los usuarios del pool pierden sus fondos.
    KILL SIGNAL: Provider es trusted — esto es "admin can rug" por diseño.
    No hay on-chain guardrails (ni timelock, ni rate limit, ni multisig enforcement).
  impact: "Drenaje completo de un pool si el provider es comprometido"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que no hay cap en retiros de fees
    uint256 poolBalance = usdc.balanceOf(address(pool));
    // Provider puede retirar TODO como fees
    pool.withdrawFees(provider, poolBalance, feesBatchId);
    uint256 remaining = usdc.balanceOf(address(pool));
    eq(remaining, 0, "ORC-OH-02: pool drenado completamente via fees");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    Esto es más un finding de diseño que un bug. El sistema es inherentemente
    custodial — el provider tiene control total sobre los fondos. No hay
    mecanismo on-chain que proteja a los usuarios de un provider malicioso.
    Immunefi probablemente lo marca como "by design" o "trusted role".
    Sin embargo, la ausencia TOTAL de guardrails (ni siquiera un daily limit
    o una verificación de que fees_collected <= total_volume * max_fee_rate)
    es notable como hallazgo informativo.
  poc_sketch: ''
  call_stack: >
    Oracle.collectFees() → SettlementPool.withdrawFees(requestor, amount, batchId)
    → usdc.transfer(requestor, amount) — sin check previo de balance

