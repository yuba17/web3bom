- id: ORC-OH-07
  tier: 2
  type: property
  description: >
    SettlementPool.withdrawFees (líneas 247-260) envía USDC a `requestor`
    sin verificar que requestor sea creatorAddress o esté en otherAddresses.
    Comparar con _withdrawUSDCOnBehalf (líneas 270-272) que SÍ verifica:
    `require(requestor == creatorAddress || otherAddresses[requestor] == true)`.

    En withdrawFees, el requestor es msg.sender del Oracle (el provider),
    así que los fees van al provider directamente. Esto parece ser by design
    (el provider cobra fees), pero permite enviar fees a cualquier dirección
    que el provider especifique, no solo al provider mismo.

    WAIT: Re-leyendo el código, en Oracle.collectFees (línea 107), se pasa
    msg.sender como requestor, que es el provider. Así que el requestor
    siempre es el provider. Esto ES by design.
  attack_scenario: >
    No hay ataque — el requestor en withdrawFees siempre es msg.sender
    (el provider) porque Oracle.collectFees pasa msg.sender en línea 107.
    DESCARTADO.
  impact: "Ninguno — requestor es siempre el provider (msg.sender)"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // No aplica — el requestor es siempre msg.sender del provider
  ghost_vars: []
  validated: false
  priority: low
