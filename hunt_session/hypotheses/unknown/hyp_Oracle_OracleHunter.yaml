# ─────────────────────────────────────────────────────────────────
# H4: grantRole PROVIDER_ROLE — numProviders desync bug
# ─────────────────────────────────────────────────────────────────
- id: ORC-OH-04
  tier: 1
  type: property
  description: >
    Oracle.grantRole() (línea 438-446) hace super.grantRole(role, account) ANTES
    del require(!hasRole(PROVIDER_ROLE, account)). Esto significa que cuando se
    llama grantRole(PROVIDER_ROLE, newAddr):
    1. super.grantRole() concede el rol exitosamente.
    2. hasRole(PROVIDER_ROLE, account) ahora retorna TRUE.
    3. El require(!hasRole(...)) SIEMPRE falla porque el rol ya se concedió.
    4. La transacción revierte, pero el efecto neto es: grantRole NUNCA funciona
       para PROVIDER_ROLE a través del path estándar AccessControl.grantRole.
    El admin DEBE usar addProvider() en su lugar.

    IMPACTO REAL: grantRole para PROVIDER_ROLE siempre revierte. numProviders
    nunca se incrementa via grantRole (pero addProvider funciona).
    Esto es un BUG de código muerto/roto, no un exploit, porque addProvider
    es el path correcto. PERO si alguien intenta usar grantRole (el path
    estándar de AccessControl), siempre falla silenciosamente.
  attack_scenario: >
    1. Admin llama grantRole(PROVIDER_ROLE, newProvider).
    2. super.grantRole concede el rol en el mapping interno de AccessControl.
    3. hasRole retorna true → require(!hasRole) revierte toda la transacción.
    4. El nuevo provider NO se añade (toda la tx revierte).
    5. No hay pérdida de fondos, pero el path grantRole está roto para PROVIDER_ROLE.

    NOTA: revokeRole tiene el patrón correcto (check ANTES de super.revokeRole).
    Solo grantRole tiene el bug de ordenamiento.
  impact: "grantRole(PROVIDER_ROLE, ...) siempre revierte — path estándar AccessControl roto para providers. No hay pérdida de fondos."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // grantRole siempre revierte para PROVIDER_ROLE
    // Porque super.grantRole() se ejecuta ANTES del require
    vm.expectRevert("Oracle: Provider already added.");
    oracle.grantRole(PROVIDER_ROLE, newProvider);
    // Pero addProvider funciona correctamente:
    oracle.addProvider(newProvider);
    assertTrue(oracle.hasRole(PROVIDER_ROLE, newProvider));
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    BUG CONFIRMADO por lectura estática. La secuencia en grantRole es:
    L439: super.grantRole(role, account) → concede el rol
    L442: require(!hasRole(PROVIDER_ROLE, account)) → SIEMPRE falla porque L439 ya concedió
    Toda la transacción revierte (incluyendo el super.grantRole).

    Comparar con revokeRole que tiene el patrón correcto:
    L451: require(hasRole(...)) → check PRIMERO
    L453: numProviders--
    L456: super.revokeRole(role, account) → revoca DESPUÉS

    Severidad: Low/QA — addProvider() funciona, no hay pérdida de fondos.
    Pero es un bug real: grantRole es la interfaz estándar de AccessControl
    y un admin podría razonablemente esperar que funcione.
  poc_sketch: |
    function test_grantRole_always_reverts_for_provider() public {
        // Setup: oracle deployed, admin is msg.sender
        address newProvider = makeAddr("newProvider");

        // grantRole reverts
        vm.prank(admin);
        vm.expectRevert("Oracle: Provider already added.");
        oracle.grantRole(oracle.PROVIDER_ROLE(), newProvider);

        // addProvider works
        vm.prank(admin);
        oracle.addProvider(newProvider);
        assertTrue(oracle.hasRole(oracle.PROVIDER_ROLE(), newProvider));
    }
  call_stack: >
    Admin → Oracle.grantRole(PROVIDER_ROLE, account)
    → AccessControl.grantRole (super) → _grantRole → sets role = true
    → require(!hasRole(PROVIDER_ROLE, account)) → hasRole returns true → REVERT

# ─────────────────────────────────────────────────────────────────
# H5: atomicDeposit — parentQuoteUuid=0 bypasses replay protection
# ─────────────────────────────────────────────────────────────────
- id: ORC-OH-05
  tier: 1
  type: property
  description: >
    En Oracle.atomicDeposit (líneas 298-308), cuando partyOneAmountRequested > 0
    y partyTwoAmountRequested == 0, hay replay check via atomic_deposits_processed[parentQuoteUuid].
    PERO si parentQuoteUuid == 0, la línea 305-307 SALTA el marcaje:
    `if (parentQuoteUuid != 0) { atomic_deposits_processed[parentQuoteUuid] = true; }`.
    Esto permite que el provider llame atomicDeposit con parentQuoteUuid=0 múltiples
    veces para el mismo depósito sin replay detection.

    Mismo patrón que ORC-OH-01 pero en atomicDeposit. El depósito requiere
    transferFrom del sender, así que necesita allowance.
  attack_scenario: >
    1. partyOne tiene allowance infinita de USDC al Oracle contract.
    2. Provider llama atomicDeposit(partyOne, partyTwo, 1000e6, 0, poolUuid, rfqUuid, 0).
    3. parentQuoteUuid=0, así que atomic_deposits_processed[0] no se marca.
    4. Provider repite la llamada N veces.
    5. Cada vez transfiere 1000e6 del partyOne al pool.
    6. partyOne pierde N * 1000e6.
    KILL SIGNAL: Misma limitación que ORC-OH-01 — provider es trusted.
  impact: "Drenaje de fondos de partyOne si tiene allowance infinita y parentQuoteUuid=0"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // parentQuoteUuid=0 permite replay de atomicDeposit
    oracle.atomicDeposit(partyOne, partyTwo, 1000e6, 0, poolUuid, rfqUuid, 0);
    // Segunda llamada NO revierte:
    oracle.atomicDeposit(partyOne, partyTwo, 1000e6, 0, poolUuid, rfqUuid, 0);
    // partyOne perdió 2000e6
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    Patrón idéntico a ORC-OH-01. El `if (parentQuoteUuid != 0)` en línea 305
    es intencional para permitir el caso donde no hay parentQuoteUuid,
    pero abre un gap en la replay protection. El require de línea 299
    (`atomic_deposits_processed[parentQuoteUuid] == false`) pasa porque
    transfers_processed[0] por defecto es false (y nunca se marca true).

    NOTA: Para el path donde AMBOS partyOneAmount > 0 Y partyTwoAmount > 0,
    depositUSDCAtomic en SettlementPool tiene `require(parentQuoteUuid != 0)` en línea 181,
    así que ese path está protegido. Solo el path de single-party deposit (linea 298-308)
    permite parentQuoteUuid=0.
  poc_sketch: ''
  call_stack: >
    Oracle.atomicDeposit(partyOne, partyTwo, amount, 0, pool, rfq, parentQuoteUuid=0)
    → L299: atomic_deposits_processed[0] == false ✓ (siempre)
    → L300-304: transferFrom + transfer (mueve fondos)
    → L305: if (0 != 0) → false → NO marca processed
    → Repetible indefinidamente

