- id: BPM-AC-08
  tier: 1
  type: property
  description: "La función _pay usa permit2.transferFrom(payer, vault, amount, token) cuando payer != address(this). El payer se determina por _mapPayer(payerIsUser) donde payerIsUser viene de los calldata params. Si un atacante construye calldata con payerIsUser=true, el payer será msgSender() = _getLocker() = msg.sender del atacante mismo. Verificar que NO hay un path donde payerIsUser=true pero permit2 transfiere de un payer diferente al locker."
  attack_scenario: "Si existe un bug donde _mapPayer retorna una dirección que no es el msg.sender real, permit2.transferFrom podría transferir tokens de una víctima que previamente aprobó permit2 para el BinPositionManager. Sin embargo, _mapPayer(true) retorna msgSender() = _getLocker() = el msg.sender de la llamada original. Esto es correcto siempre que tstore no esté corrupto."
  impact: "Si _mapPayer retorna dirección incorrecta, robo de tokens vía permit2 allowance."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // _pay con payer != address(this) usa permit2.transferFrom
    // payer viene de _mapPayer(payerIsUser) = msgSender() si payerIsUser=true
    // msgSender() = _getLocker() = tload(LOCKED_BY_SLOT)
    // LOCKED_BY_SLOT se setea en isNotLocked a msg.sender
    // VERIFICAR: transient storage no puede ser corrompida por delegatecall en multicall
    address expectedPayer = msg.sender; // el caller original
    address actualPayer = binPositionManager.msgSender();
    eq(expectedPayer, actualPayer, "BPM-AC-08: payer identity mismatch");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: "La cadena de confianza es: msg.sender → tstore(LOCKED_BY_SLOT) → tload = _getLocker() = msgSender(). delegatecall en multicall preserva tstore context. No se ve forma de corromper el payer identity, pero es una hipótesis critical que DEBE ser fuzzeada."

- id: BPM-AC-09
  tier: 2
  type: property
  description: "_addLiquidity tiene una inconsistencia potencial en la verificación del idSlippage: usa aritmética sin unchecked que podría revert por underflow en Solidity 0.8.26. Si activeIdDesired < idSlippage, la resta `activeIdDesired - idSlippage` causa underflow y revert, impidiendo que un usuario añada liquidez a bins con activeId bajo. Esto es un DoS potencial, no un access control issue directo."
  attack_scenario: "Un usuario quiere añadir liquidez con activeIdDesired=5, idSlippage=10. La verificación `activeIdDesired - idSlippage > activeId` causa underflow (5-10 underflows en uint256). Esto revertaría la tx. El atacante no puede explotar esto directamente, pero el usuario no puede protegerse contra downward slippage para activeIds bajos. Nota: activeIdDesired y idSlippage son uint256, la resta es sin unchecked."
  impact: "DoS para addLiquidity en pools con activeId bajo cuando el usuario quiere un idSlippage amplio. Impacto bajo — el usuario puede ajustar idSlippage."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Línea 260: if (activeIdDesired - idSlippage > activeId)
    // Si activeIdDesired < idSlippage → underflow en Solidity 0.8.26 → revert
    // Pero activeIdDesired y idSlippage se validan contra type(uint24).max antes
    // activeIdDesired max = 16777215, idSlippage max = 16777215
    // Si activeIdDesired = 0 y idSlippage = 1 → 0 - 1 overflows → revert
    uint256 activeIdDesired = 5;
    uint256 idSlippage = 10;
    // This will revert with arithmetic underflow
    bool underflows = activeIdDesired < idSlippage;
    t(!underflows, "BPM-AC-09: idSlippage underflow for low activeIdDesired");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: "La aritmética `activeIdDesired - idSlippage` puede underflow si activeIdDesired < idSlippage. En Uniswap V4 CLPositionManager no tienen este patrón exacto. Esto no es un bug de security per se, sino un revert inesperado (DoS). El usuario puede mitigar usando idSlippage <= activeIdDesired. Worth reporting como QA/Low."

- id: BPM-AC-10
  tier: 1
  type: property
  description: "TAKE action permite enviar tokens a un recipient arbitrario (no necesariamente el caller). Si un usuario tiene crédito positivo en el vault (delta > 0), puede dirigir los tokens a CUALQUIER dirección via el param recipient. Verificar que un atacante NO puede take los créditos que pertenecen a otra operación del mismo contrato."
  attack_scenario: "El delta del vault es per-address (address(BinPositionManager)). Dentro de una sesión de vault.lock, el BinPositionManager acumula deltas. Un TAKE action dentro del batch del atacante solo puede take crédito positivo que fue generado por las acciones del MISMO batch (porque vault.lock es atómico y el delta empieza en 0). El atacante no puede take crédito de otro usuario porque cada vault.lock es independiente. Sin embargo, verificar que modifyLiquiditiesWithoutLock respeta los mismos principios cuando se llama fuera de vault.lock."
  impact: "Si un atacante puede take créditos de otro usuario, robo directo de fondos."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // TAKE action: _take(currency, recipient, amount)
    // amount puede ser OPEN_DELTA = _getFullCredit(currency)
    // _getFullCredit lee vault.currencyDelta(address(this), currency)
    // El delta es del BinPositionManager, no del usuario individual
    // Pero cada vault.lock es atómico — el delta acumulado es del batch completo
    // modifyLiquiditiesWithoutLock: NO llama vault.lock, opera directamente
    // ¿El delta del BPM puede tener residuo de un vault.lock anterior?
    // vault.lock DEBE forzar deltas = 0 al final — si no, revert
    int256 deltaAfterLock = vault.currencyDelta(address(binPositionManager), currency);
    eq(deltaAfterLock, 0, "BPM-AC-10: delta not zero after vault.lock");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: "El vault fuerza que todos los deltas se resuelvan al final de lock() (net zero settlement). modifyLiquiditiesWithoutLock opera fuera de vault.lock, lo que significa que los deltas que genera NO están sujetos al settlement automático. ¿Quién fuerza el settlement en ese caso? El caller del hook que originalmente llamó vault.lock. Parece seguro, pero la interacción es sutil."

