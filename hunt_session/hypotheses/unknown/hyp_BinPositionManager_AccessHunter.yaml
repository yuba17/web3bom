  attack_scenario: "Un usuario llama modifyLiquidities (vault.lock activo). Durante el callback, un hook malicioso intenta transferir los LP tokens del usuario via batchTransferFrom. onlyIfVaultUnlocked lo previene. Sin embargo, si el hook puede setear approveForAll para sí mismo... No — approveForAll usa msg.sender directamente, no msgSender(). El hook sería msg.sender, no el usuario. El hook no puede auto-aprobarse como operator del usuario."
  impact: "Si se bypasea onlyIfVaultUnlocked, transferencias no autorizadas de LP tokens durante operaciones de pool."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // batchTransferFrom tiene onlyIfVaultUnlocked
    // approveForAll NO tiene onlyIfVaultUnlocked
    // approveForAll usa msg.sender (correcto, no msgSender)
    // No parece vulnerable — pero verificar que hooks no pueden bypass
    bool vaultLocked = vault.getLocker() != address(0);
    // during lock, batchTransferFrom should revert
    if (vaultLocked) {
        // t(false, "BPM-AC-06: batchTransferFrom should be blocked during vault lock");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: "La separación entre approveForAll (usa msg.sender, no restrictivo por vault lock) y batchTransferFrom (restrictivo por vault lock) parece correcta. El único vector sería si un hook durante vault.lock pudiera llamar approveForAll donde msg.sender = hook address, y luego después del unlock transferir tokens. Pero esto requiere que el usuario haya dado approval al hook, lo cual hooks son trusted."

- id: BPM-AC-07
  tier: 2
  type: property
  description: "La función _sweep envía TODO el balance del contrato de una currency a un recipient arbitrario (mappeado por _mapRecipient). Si quedan tokens ERC20 en el contrato por cualquier razón (dust de operaciones anteriores, donations, tokens enviados por error), cualquier locker puede sweepearlos. Verificar que _sweep no puede ser abusada para robar tokens que pertenecen a otra operación en curso."
  attack_scenario: "Escenario 1: Usuario A envía tokens al BinPositionManager como parte de settle. Antes de que settle se complete, usuario A incluye un SWEEP action en su batch que transfiere TODO el balance del contrato (incluyendo tokens que podrían pertenecer a otros). Sin embargo, dado que isNotLocked previene llamadas concurrentes y el vault.lock es una ejecución atómica, solo hay un locker a la vez. Escenario 2: Tokens residuales de operaciones pasadas se acumulan — el próximo locker puede sweepearlos con SWEEP action."
  impact: "Robo de tokens residuales en el contrato. Impacto depende de cuánto dust se acumula."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
