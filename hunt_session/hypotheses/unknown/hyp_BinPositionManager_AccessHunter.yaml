- id: BPM-AC-01
  tier: 1
  type: property
  description: "_addLiquidity no tiene checkApproval — cualquiera que sea el locker puede mintear tokens ERC1155 a una dirección arbitraria `to` sin que `to` haya aprobado nada. Esto permite que un atacante mintee LP tokens a nombre de una víctima, potencialmente forzándola a tener posiciones no deseadas que luego podrían causar efectos en integraciones downstream (e.g., contratos que calculan NAV basándose en posiciones held)."
  attack_scenario: "Un atacante llama a modifyLiquidities con BIN_ADD_LIQUIDITY y establece `to` = dirección de la víctima. Los ERC1155 tokens se mintean a la víctima sin su consentimiento. Impacto directo limitado porque la víctima no pierde fondos, pero en protocolos que agregan posiciones automáticamente (vaults, aggregators), esto podría manipular cálculos de valor. Probabilidad baja de impacto real — el atacante paga la liquidez."
  impact: "Bajo impacto directo — el atacante paga los tokens para la posición. Impacto indirecto en integraciones que usan balanceOf para calcular valor de portfolio."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que _addLiquidity con to != msgSender() no tiene restricciones
    // Este es el comportamiento esperado en Uniswap V4 / PCS Infinity — mint a cualquier dirección
    // Similar a ERC20 transfer donde el receptor no aprueba
    // PROBABLY BY DESIGN — marcar como false positive si se confirma
    address attacker = address(0xBEEF);
    address victim = address(0xDEAD);
    // attacker calls addLiquidity with to=victim
    uint256 victimBalanceBefore = binFungibleToken.balanceOf(victim, tokenId);
    // ... execute addLiquidity with to=victim
    uint256 victimBalanceAfter = binFungibleToken.balanceOf(victim, tokenId);
    t(victimBalanceAfter > victimBalanceBefore, "BPM-AC-01: tokens minted to non-consenting address");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 25
  notes: "Muy probablemente by-design (igual que en Uniswap V4). El patrón de mint-to-arbitrary-address es estándar en LP tokens. Riesgo real solo en integraciones que no esperan recibir tokens no solicitados."

- id: BPM-AC-02
  tier: 1
  type: property
  description: "initializePool no tiene control de acceso ni deadline — cualquier usuario puede inicializar un pool con cualquier activeId. Además, el try/catch silencia TODOS los errores, lo que significa que si la inicialización falla por cualquier razón (pool ya existe, parámetros inválidos), el tx no revierte y el caller puede creer que el pool fue creado exitosamente."
  attack_scenario: "Un usuario quiere crear un pool y llama initializePool. Un atacante front-runea con initializePool usando un activeId diferente (precio diferente). La llamada del usuario es silenciada por try/catch sin revertir. El usuario luego añade liquidez creyendo que el pool tiene su activeId deseado, pero en realidad tiene el activeId del atacante. Pérdida potencial si el activeId es significativamente diferente."
  impact: "Loss potencial de fondos para el primer LP si añade liquidez inmediatamente después de initializePool sin verificar el activeId real. El slippage check en _addLiquidity (idSlippage) mitiga parcialmente."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Scenario: front-run initializePool con activeId diferente
    // 1. Attacker calls initializePool(key, maliciousActiveId)
    // 2. Victim calls initializePool(key, desiredActiveId) — silently succeeds (catch swallows)
    // 3. Victim calls addLiquidity expecting desiredActiveId
    // MITIGACIÓN: _addLiquidity tiene idSlippage check que compara activeIdDesired vs actual activeId
    // Si idSlippage es tight, el addLiquidity revertirá
    // PERO: si el usuario no sabe que debe setear idSlippage tight, puede perder
    (uint24 actualActiveId,,) = binPoolManager.getSlot0(poolKey.toId());
    t(actualActiveId == desiredActiveId, "BPM-AC-02: pool initialized with unexpected activeId");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: "El try/catch es explícitamente documentado: 'if the pool revert due to other error, then the follow-up action to the pool will still revert accordingly'. Sin embargo, el comentario no cubre el caso de front-running del activeId. La protección idSlippage en addLiquidity es la defensa real, pero depende de que el usuario la configure correctamente."

- id: BPM-AC-03
  tier: 1
  type: property
  description: "_removeLiquidity usa checkApproval(params.from, msgSender()) donde msgSender() es _getLocker() (el caller original de modifyLiquidities). Verificar que NO existe un path donde el locker se fija a una dirección y luego otro usuario puede ejecutar acciones con ese locker como identidad. En particular, modifyLiquiditiesWithoutLock NO adquiere vault lock — ¿podría un actor malicioso usar esto para burn tokens de otro usuario?"
  attack_scenario: "modifyLiquiditiesWithoutLock llama _executeActionsWithoutLock SIN llamar vault.lock(). Esto significa que NO hay callback del vault, y msgSender() retorna _getLocker() que fue seteado por isNotLocked a msg.sender. Si un hook llama modifyLiquiditiesWithoutLock durante un callback, isNotLocked revertaría porque el locker ya está seteado. Pero ¿qué pasa si el locker se setea vía modifyLiquidities (msg.sender = attacker) y dentro del callback del vault, el attacker intenta remove liquidity de otro usuario? El attacker ES el locker, pero checkApproval exige que el locker sea el owner o aprobado. Seguro si la aprobación funciona correctamente."
  impact: "Si se bypasea el checkApproval, un atacante podría quemar LP tokens de cualquier usuario y extraer su liquidez."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariant: solo el owner o un operador aprobado puede burn tokens
    // _removeLiquidity tiene checkApproval(params.from, msgSender())
    // msgSender() = _getLocker() = msg.sender de modifyLiquidities
    // Verificar que no hay path para bypass
    address attacker = address(0xBEEF);
    address victim = address(0xDEAD);
    bool isApproved = binFungibleToken.isApprovedForAll(victim, attacker);
    // attacker intenta removeLiquidity con from=victim
    // Debe revertir con BinFungibleToken_SpenderNotApproved
    t(!isApproved, "BPM-AC-03: attacker should not be approved");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: "La protección parece sólida: checkApproval compara params.from con msgSender(). msgSender() está vinculado al msg.sender original via tstore en isNotLocked. No se ve bypass obvio. Confianza alta de que es seguro, pero worth fuzzing."

- id: BPM-AC-04
  tier: 1
  type: property
  description: "modifyLiquiditiesWithoutLock no tiene deadline check — es callable por hooks durante vault.lock(). Sin embargo, no existe restricción que SOLO hooks puedan llamarla. Cualquier usuario puede llamar modifyLiquiditiesWithoutLock directamente (es external). El modifier isNotLocked verifica que no hay un locker activo y luego setea msg.sender como locker. Esto da funcionalidad completa sin deadline protection."
  attack_scenario: "Un usuario o front-end incorrecto llama modifyLiquiditiesWithoutLock en vez de modifyLiquidities. Las transacciones quedan en el mempool sin deadline protection. Si la tx se ejecuta mucho después de ser enviada, las condiciones del pool pueden haber cambiado significativamente. El idSlippage check en addLiquidity protege parcialmente, pero los min amounts en removeLiquidity podrían ser stale."
  impact: "Pérdida potencial por ejecución tardía sin deadline. Mitigada por slippage checks internos."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // modifyLiquiditiesWithoutLock es callable por CUALQUIERA, no solo hooks
    // No tiene deadline check
    // Verificar si hay un path de uso sin deadline que cause daño
    // La función es external payable con solo isNotLocked modifier
    // NOTA: esto es by-design para hooks que operan dentro de un callback
    // El riesgo es si un usuario regular la usa directamente
    bool hasDeadline = false; // modifyLiquiditiesWithoutLock no tiene deadline param
    t(hasDeadline, "BPM-AC-04: modifyLiquiditiesWithoutLock lacks deadline");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: "Probablemente by-design — la función está diseñada para hooks que ya operan dentro de un contexto con vault lock. Uniswap V4 tiene el mismo patrón. El riesgo es bajo porque los slippage checks internos protegen contra cambios de precio extremos."

- id: BPM-AC-05
  tier: 1
  type: property
  description: "multicall usa delegatecall a sí mismo — permite batch de llamadas en una sola tx. Dentro de delegatecall, msg.sender se preserva. Pero el locker se almacena en transient storage (tstore/tload). Si multicall llama modifyLiquidities y luego otra función, el locker se resetea a address(0) al final de modifyLiquidities (isNotLocked modifier limpia). ¿Es posible que multicall permita re-entrada al combinar modifyLiquidities con permit o sweep de manera que el locker context se corrompa?"
  attack_scenario: "Atacante usa multicall para combinar: (1) permit() para aprobar tokens de una víctima, (2) modifyLiquidities() para remove la liquidez de la víctima. La llamada a permit() podría procesar un permit firmado previamente por la víctima. Sin embargo, permit2 requiere que la firma autorice al BinPositionManager como spender, no al atacante directamente. Y el checkApproval en _removeLiquidity compara params.from con _getLocker() = msg.sender (el atacante), no la víctima. Así que incluso con permit, el atacante no puede impersonar a la víctima en removeLiquidity."
  impact: "Si el locker context se corrompe via multicall+delegatecall, un atacante podría impersonar otro usuario para operaciones de liquidez."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Multicall + delegatecall preserva msg.sender y storage context
    // tstore/tload persiste durante toda la tx (incluyendo delegatecalls)
    // isNotLocked modifier: check locker == 0, set locker = msg.sender, ..., clear locker
    // En multicall: call1 = modifyLiquidities (sets+clears locker), call2 = modifyLiquidities (sets+clears locker)
    // Cada subcall es independiente respecto al locker — no hay leak
    // VERIFICAR: ¿qué pasa si call1 revierte pero multicall continúa? No — multicall propaga reverts
    address lockerAfterMulticall = reentrancyLock._getLocker();
    eq(lockerAfterMulticall, address(0), "BPM-AC-05: locker not cleared after multicall");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: "Transient storage (tstore/tload) persiste durante toda la transacción, incluyendo delegatecalls dentro de multicall. Cada modifyLiquidities llama isNotLocked que limpia el locker al final. No parece haber leak. Pero la combinación de multicall + transient storage es una superficie nueva que merece fuzzing."

