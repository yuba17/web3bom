- id: GA-F04
  tier: 2
  type: property
  description: >
    ETH stuck in Bundler3 via skipRevert: if a call with value > 0 and
    skipRevert=true reverts, the ETH stays in Bundler3. Since Bundler3 has
    no receive() or withdraw, the ETH is stuck... unless a subsequent call
    in the same multicall uses it (call{value: X} draws from contract balance).
    Cross-transaction: leftover ETH in Bundler3 is stealable by anyone.
  attack_scenario: >
    User sends 1 ETH via multicall with one call that has value=1 ETH and
    skipRevert=true. The call reverts. ETH stays in Bundler3. No subsequent
    calls in the bundle. Transaction ends. 1 ETH sits in Bundler3.
    Attacker calls multicall with a call to adapter.nativeTransfer(attacker, 0)
    but this sends from ADAPTER not BUNDLER3. Actually, the attacker needs a
    call with value: bundler3.balance to any address. Since multicall forwards
    value, the attacker could do: multicall([{to: attacker, data: "", value: 1 ETH,
    skipRevert: false, callbackHash: 0}]) — this would send Bundler3's balance
    to attacker. The call target receives the ETH.
  impact: "Theft of ETH stuck in Bundler3 from failed skipRevert calls"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Post-multicall: Bundler3 should hold 0 ETH
    uint256 bundlerBal = address(bundler3).balance;
    eq(bundlerBal, 0, "GA-F04: ETH stuck in Bundler3 after multicall");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: >
    This is a known design property. Bundler3 explicitly does NOT hold state
    between transactions. The value field in Call draws from the contract's
    ETH balance, not just msg.value. This means any leftover ETH is available
    to subsequent callers. This is by design but risky with skipRevert.
    Likely classified as known/accepted risk by Morpho team.

