    User B (attacker/MEV bot) immediately calls multicall with [erc20Transfer(USDC, attacker, max)].
    User B steals User A's 100 USDC. This is a user error but worth documenting.
  impact: "Loss of tokens left in adapter after failed skipRevert calls"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Post-multicall check: adapter balance should be 0 for all tokens used
    // This is a property to verify in integration tests:
    uint256 adapterBal = IERC20(token).balanceOf(address(adapter));
    eq(adapterBal, 0, "GA-F03: tokens stuck in adapter after multicall");
  ghost_vars:
  - "uint256 internal ghost_adapterBalPre;"
  validated: false
  priority: high
  confidence: 70
  notes: >
    This is more of a known design risk than a bug. The Morpho docs warn that
    adapters should not hold tokens between transactions. skipRevert amplifies
    the risk by allowing partial bundle execution. The real question is: can
    a LEGITIMATE bundle leave tokens stuck WITHOUT the user intending it?
