# ============================================================
# ANALYSIS SUMMARY — FlowHunter on GeneralAdapter1
# ============================================================
#
# CONTRACT ARCHITECTURE:
#   GeneralAdapter1 extends CoreAdapter. All public functions are gated by
#   onlyBundler3 (msg.sender == BUNDLER3). The Bundler3 contract stores
#   `initiator` transiently and controls reentrancy via `reenterHash`.
#   Callbacks (onMorphoSupply/SupplyCollateral/Repay/FlashLoan) call
#   morphoCallback() which re-enters Bundler3 via reenterBundler3(data).
#
# KEY FLOW OBSERVATIONS:
#
# 1. APPROVE PATTERN — TWO STRATEGIES:
#    - ERC4626 functions: approve(max) → call → approve(0). CONSISTENT. Safe.
#    - Morpho functions: approve(max) → call → NO RESET. Comment says "trusted".
#      This is BY DESIGN. Morpho is immutable and trusted. The approval is
#      permanently max. This is NOT a bug — Morpho cannot rug these approvals
#      because Morpho only pulls what it needs for the specific operation.
#
# 2. CALLBACKS AND REENTRANCY:
#    - morphoCallback() requires msg.sender == MORPHO. Good.
#    - It calls reenterBundler3(data), which calls BUNDLER3.call(reenter.selector + data).
#    - Bundler3.reenter() checks reenterHash == keccak256(sender || keccak256(data)).
#    - The reenterHash is set by the PREVIOUS call in the bundle (callbackHash field).
#    - This means: only the expected adapter + expected callback data can re-enter.
#    - CRITICAL INSIGHT: The reenterHash mechanism replaces a reentrancy guard.
#      An attacker cannot re-enter with arbitrary data because the hash must match.
#      The initiator pre-commits the callback data in callbackHash.
#
# 3. skipRevert AND STUCK TOKENS:
#    - If a call has skipRevert=true and it fails, tokens transferred to the
#      adapter in prior calls remain in the adapter. BUT the adapter has no
#      auth on who can sweep — CoreAdapter.erc20Transfer is onlyBundler3,
#      meaning only during an active bundle can tokens be moved out.
#    - Anyone can call multicall() and target erc20Transfer to sweep.
#      HOWEVER: erc20Transfer sends to a receiver, and the receiver cannot
#      be address(this). So a subsequent user could sweep leftover tokens.
#    - This is a KNOWN DESIGN PROPERTY. The docs state adapters should not
#      hold tokens between transactions. Any tokens left are sweepable.
#
# 4. FLASH LOAN FLOW:
#    - morphoFlashLoan: approves MORPHO max, calls flashLoan.
#    - Morpho sends tokens to adapter, then calls onMorphoFlashLoan callback.
#    - In callback, adapter re-enters Bundler3 with user-specified sub-bundle.
#    - After callback returns, Morpho pulls back tokens (approved max).
#    - KEY: The sub-bundle data is committed via callbackHash in the original call.
#      An attacker cannot modify the callback data. The initiator controls it.
#    - The flash loan tokens are in the adapter during the callback. The sub-bundle
#      could use them (e.g., supply to Morpho, swap, etc.). This is intentional.
#
# 5. ETH STUCK SCENARIOS:
#    - wrapNative: reads address(this).balance, wraps, transfers WETH out.
#      If receiver == address(this), WETH stays in adapter (for subsequent call).
#    - unwrapNative: reads WRAPPED_NATIVE.balanceOf(this), unwraps, sends ETH.
#      If receiver == address(this), ETH stays in adapter.
#    - CoreAdapter.receive() is payable — accepts ETH from WETH.withdraw().
#    - If user sends ETH to adapter via bundle value but never calls wrapNative,
#      ETH sits in adapter. Sweepable by next multicall via nativeTransfer.
#    - Bundler3 itself has NO receive(). ETH sent to Bundler3 via multicall goes
#      to the Call targets via value field. If the call fails with skipRevert,
#      the ETH stays in... wait, Bundler3 sends it via `to.call{value}(data)`.
#      If the call reverts, the ETH stays in Bundler3. But Bundler3 has no sweep.
#      Actually — Bundler3 CAN pass value on subsequent calls in the same bundle.
#      So ETH isn't permanently stuck in Bundler3 within a single tx.
#      Cross-tx: any ETH left in Bundler3 after multicall can be taken by the
#      next caller who crafts a bundle with value=0 and targets a call that
#      sends ETH out. Actually no — the value field is msg.value from the
#      current tx, not from balance. Let me re-check...
#      `to.call{value: bundle[i].value}(bundle[i].data)` — this uses the
#      contract's ETH balance. If previous skipRevert left ETH, the next call
#      in the same multicall can use it. Cross-tx: leftover ETH in Bundler3
#      IS stealable by anyone calling multicall with a call that has value > 0
#      targeting an adapter's function, since it draws from Bundler3's balance.
#      THIS IS A KNOWN PROPERTY — Bundler3 should never hold ETH between txs.
#
# 6. MALICIOUS VAULT IN ERC4626:
#    - erc4626Mint/Deposit: the vault address is user-controlled (via initiator's bundle).
#    - A malicious vault could: in mint(), re-enter via some path? NO — the adapter
#      is not callable except by Bundler3, and Bundler3 requires reenterHash match.
#    - But the vault.mint() call could do ANYTHING — including calling Morpho or
#      other contracts. The adapter has approved the vault's underlying token max
#      at this point. After mint() returns, approval is reset to 0.
#    - KEY RISK: During vault.mint(), the vault has max approval on underlyingToken.
#      A malicious vault could transferFrom the adapter's entire underlyingToken balance.
#      But the vault address comes from the initiator (the user building the bundle).
#      The initiator would only hurt themselves. This is not an attack vector.
#    - UNLESS: a legitimate user's bundle includes a vault that is actually malicious.
#      But the user signs the bundle, so they chose the vault. Self-inflicted.
#
# 7. MORPHO APPROVAL ACCUMULATION:
#    - Each morphoSupply/SupplyCollateral/Repay/FlashLoan call does
#      forceApprove(token, MORPHO, max). This is idempotent — max is max.
#    - IMPORTANT: Different tokens get approved. morphoSupply approves loanToken.
#      morphoSupplyCollateral approves collateralToken. morphoFlashLoan approves
#      any token. ALL to MORPHO. Since MORPHO is trusted and immutable, this is safe.
#    - If MORPHO had an upgrade path or was a proxy, this would be critical.
#      Morpho Blue is immutable (no proxy). Confirmed safe.
#
# CONCLUSION: The contract is well-designed with consistent patterns.
# The main security boundary is the Bundler3 reenterHash mechanism for callbacks,
# the onlyBundler3 modifier for all entry points, and the approve-reset pattern
# for untrusted ERC4626 vaults (vs permanent approval for trusted Morpho).
# I found NO exploitable reentrancy or token-stuck vulnerabilities with
# high confidence. The hypotheses below capture edge cases worth fuzzing.

