- id: GA-F01
  tier: 2
  type: property
  description: >
    ERC4626 approval is always reset to 0 after vault interaction. If a vault's
    mint() or deposit() reverts internally but is caught (impossible in current
    code since no try/catch), the approval could remain at max. In current code,
    if vault.mint() reverts, the entire call reverts — approve(0) is never reached
    but the tx also fails, so no dangling approval. SAFE by revert propagation.
    Invariant: after any successful erc4626Mint or erc4626Deposit, the adapter's
    allowance of underlyingToken to vault is 0.
  attack_scenario: >
    If approval were not reset, a malicious or compromised vault could later call
    transferFrom on the adapter to steal tokens deposited by a subsequent user.
    In practice this cannot happen because (a) the vault is chosen by the initiator
    and (b) the reset always runs on success. But worth verifying in fuzzing.
  impact: "Loss of all tokens held by adapter during subsequent bundles"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // After calling erc4626Mint or erc4626Deposit, check allowance == 0
    // Setup: call erc4626Deposit(vault, amount, maxPrice, receiver)
    // Then check:
    address underlying = IERC4626(vault).asset();
    uint256 allowance = IERC20(underlying).allowance(address(adapter), vault);
    eq(allowance, 0, "GA-F01: ERC4626 approval not reset after deposit/mint");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 90
  notes: >
    High confidence this is safe. The forceApprove(0) always runs after a
    successful vault.mint()/deposit(). If the vault call reverts, the entire
    tx reverts. No path exists where approval stays dangling.

- id: GA-F02
  tier: 2
  type: property
  description: >
    Morpho callback reentrancy: the reenterHash mechanism in Bundler3 ensures
    that only the expected adapter with the expected data can call reenter().
    Invariant: it is impossible to call reenter() with data that was not
    pre-committed in the callbackHash of the triggering call.
  attack_scenario: >
    If an attacker could bypass reenterHash, they could inject arbitrary calls
    during a Morpho callback. For example, during onMorphoFlashLoan, the
    flash-loaned tokens sit in the adapter. If the attacker could re-enter
    with their own bundle, they could call erc20Transfer to steal those tokens.
    The reenterHash prevents this: the callback data hash must match what the
    initiator committed.
  impact: "Theft of flash-loaned tokens during callback"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // This is more of an architecture property than a fuzzable assertion.
    // Verify: after a morphoFlashLoan completes, no tokens remain in adapter
    // unless explicitly kept by the sub-bundle.
    uint256 tokenBal = IERC20(token).balanceOf(address(adapter));
    eq(tokenBal, 0, "GA-F02: tokens stuck in adapter after flash loan");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 85
  notes: >
    The reenterHash mechanism is sound. keccak256(sender || keccak256(data))
    is pre-committed. Only MORPHO (as msg.sender to the callback) can trigger
    morphoCallback, and only the committed data can pass through reenter().
    A third party cannot inject different callback data.

