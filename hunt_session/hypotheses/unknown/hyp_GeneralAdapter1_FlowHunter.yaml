    However, if the LAST call is the one that fails with skipRevert, tokens remain
    in the adapter and are sweepable by the next multicall caller.
    Invariant: after a full multicall completes, the adapter should hold zero
    balance of any token that was transferred in during that multicall.
  attack_scenario: >
