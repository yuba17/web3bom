- id: GA-F07
  tier: 1
  type: property
  description: >
    Malicious ERC4626 vault reentrancy during approval window. Between
    forceApprove(max) and forceApprove(0), the vault.mint()/deposit() call
    executes. If vault is malicious, it has unlimited approval on the
    underlying token. It could transferFrom the adapter's ENTIRE balance
    of underlying token, not just what's needed for the mint/deposit.
    Question: is the vault address user-controlled? YES — it comes from
    the bundle. The initiator chooses the vault.
  attack_scenario: >
    Scenario requires social engineering or a compromised frontend:
    1. Attacker deploys MaliciousVault that in mint() calls
       underlyingToken.transferFrom(adapter, attacker, adapter.balance)
    2. Victim's frontend is compromised to include erc4626Deposit(maliciousVault, ...)
       in the bundle, preceded by a transferFrom that sends tokens to adapter.
    3. During deposit(), MaliciousVault steals all underlying tokens.
    This is really a frontend/phishing attack, not a contract bug. The user
    signs the bundle containing the malicious vault address.
    BUT: if the adapter is used as a shared infrastructure where multiple
    users' tokens are in-flight simultaneously... wait, Bundler3 processes
    one multicall atomically per tx. No interleaving. So only the current
    initiator's tokens are at risk, and they chose the vault. SELF-INFLICTED.
  impact: "Loss of tokens in adapter during malicious vault interaction"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: after erc4626Deposit/Mint, adapter balance of underlying
    // decreased by exactly the assets consumed (not more).
    // preBalance - postBalance == assets returned by vault.deposit()
    uint256 preBal = IERC20(underlying).balanceOf(address(adapter));
    // ... call erc4626Deposit ...
    uint256 postBal = IERC20(underlying).balanceOf(address(adapter));
    uint256 consumed = preBal - postBal;
    // consumed should equal the assets value from deposit()
    eq(consumed, assetsConsumed, "GA-F07: vault consumed more tokens than reported");
  ghost_vars:
  - "uint256 internal ghost_preDepositBalance;"
  validated: false
  priority: medium
  confidence: 60
  notes: >
    This is by design — the user chooses the vault. A malicious vault chosen
    by the user is the user's fault. However, if there's a way for a third
    party to influence the vault parameter (e.g., via callback data injection),
    this becomes critical. The reenterHash mechanism prevents data injection.
    Marking confidence 60 because it's worth double-checking but likely not a bug.

- id: GA-F08
  tier: 1
  type: property
  description: >
    Morpho callback data injection via callbackHash collision. The reenterHash
    is keccak256(bytes20(to) || callbackHash), where callbackHash is
    keccak256(msg.data[4:]). For an attacker to inject different callback data,
    they'd need a keccak256 collision — computationally infeasible.
    Invariant: no two different Call[] arrays produce the same reenterHash.
  attack_scenario: >
    If an attacker found a callbackHash collision, they could make the adapter
    re-enter Bundler3 with malicious calls during a Morpho callback. During
    a flash loan, this would allow stealing the flash-loaned tokens.
    This requires breaking keccak256, which is not feasible.
  impact: "Complete theft of flash-loaned tokens"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // This is a cryptographic property, not practically fuzzable.
    // The security relies on keccak256 collision resistance.
    t(true, "GA-F08: reenterHash collision resistance — cryptographic assumption");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    keccak256 collision resistance is a standard cryptographic assumption.
    No practical attack exists. This invariant is here for completeness.

