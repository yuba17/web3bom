      5. Vault health check must still pass, but attacker extracted value via price impact
    status: hypothesis
    solidity: |
      // INV-LT-D-07: slippage protection prevents zero-liquidity addLiquidity
      function invariant_leverageUp_nonZeroSlippage() public {
