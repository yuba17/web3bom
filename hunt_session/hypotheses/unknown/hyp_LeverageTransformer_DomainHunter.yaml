invariants:
  - id: LT-D-01
    title: "leverageDown: SafeCast.toUint128 overflow in collectParams (line 153-154)"
    tier: 1
    type: property
    confidence: 85
    description: >
      collectParams.amount0Max = SafeCast.toUint128(amount0 + params.feeAmount0).
      amount0 is uint256 from decreaseLiquidity. params.feeAmount0 is uint128.
      If amount0 > type(uint128).max - params.feeAmount0, SafeCast reverts.
      Real scenario: position with very large liquidity. A Uniswap V3 position
      can accumulate up to ~type(uint128).max in token0 from decreaseLiquidity
      if ticks are extremely wide and liquidity is near max. With any nonzero
      feeAmount0, this overflows. The DoS is permanent for that position.
    affected_line: "LeverageTransformer.sol:153-154"
    attack_scenario: >
      1. Position has liquidity such that decreaseLiquidity returns amount0 > 2^127
      2. Caller sets params.feeAmount0 = 1 (nonzero)
      3. SafeCast.toUint128(amount0 + 1) overflows → revert
      4. Position cannot be deleveraged via leverageDown
      5. Workaround: set feeAmount0 = type(uint128).max (collects max fees)
      but this prevents targeted fee collection
    status: hypothesis
    solidity: |
      // INV-LT-D-01: collectParams amounts never overflow uint128
      function invariant_collectAmounts_noOverflow() public {
          // amount0 + feeAmount0 <= type(uint128).max
          // amount1 + feeAmount1 <= type(uint128).max
      }

