  - id: LT-D-03
    title: "leverageUp: same-token pool — borrow token equals both token0 and token1"
    tier: 3
    type: property
    confidence: 45
    description: >
      If someone creates a position with token0==token1 (non-standard, but pools technically
      allow address comparison tricks), and the borrow token equals both, the swap paths
      would double-count. This is an edge case that Uniswap V3 effectively prevents by
      requiring token0 < token1 in pool address ordering.
    affected_line: "LeverageTransformer.sol:35-45"
    attack_scenario: >
      Unlikely in practice due to Uniswap V3 pool invariant (token0 < token1 by address).
      No realistic attack path.
    status: low_priority
    solidity: |
