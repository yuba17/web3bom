  - id: LT-D-04
    title: "leverageDown: underflow in amount tracking when swap output < expected"
    tier: 2
    type: property
    confidence: 70
    description: >
      leverageDown builds `amount` (the repay amount) by starting from swap output.
      If the swap from token0/token1 to debt token returns amountOut, and feeAmount
      adjustments are wrong, amount could be zero or near-zero when vault.repay is called.
      The vault would then repay 0 debt shares, leaving the full leverage in place.
      Not a security bug per se but a functional failure for the user.
    affected_line: "LeverageTransformer.sol:155-178"
    attack_scenario: >
      Extreme slippage: swap converts token → debtToken but amountOut = 0 (e.g., pool
      has no liquidity). amount = 0. vault.repay(tokenId, 0, false) is called.
      Transaction succeeds but position remains fully leveraged.
    status: hypothesis
    solidity: |
      // INV-LT-D-04: amount > 0 before vault.repay()
      function invariant_leverageDown_positiveRepayAmount() public {
          // amount > 0 after swaps, before repay
      }

  - id: LT-D-05
    title: "leverageUp: insufficient liquidity added — health check passes with minimal collateral"
    tier: 2
    type: property
    confidence: 65
    description: >
      After borrow+swap+addLiquidity, vault._requireLoanIsHealthy checks that collateral
      value > debt * collateralFactor. The addLiquidity operation may add near-zero liquidity
      if slippage is extreme (amount0Min=0, amount1Min=0 not validated in LeverageTransformer).
      The user ends up with: borrowed amount + position value just barely passing health.
      Next price movement could immediately liquidate. Not a bug in LeverageTransformer
      per se (vault enforces health), but poor UX with no slippage protection on addLiquidity.
    affected_line: "LeverageTransformer.sol:85-95"
    attack_scenario: >
      User sets amount0Min=0, amount1Min=0 for addLiquidity. Sandwich attack: manipulate
      pool price, addLiquidity adds minimal liquidity, price restored. Position has large
      debt + tiny collateral. Immediately liquidatable.
    status: hypothesis
    solidity: |
      // INV-LT-D-05: liquidity added >= minimum viable (not zero)
      function invariant_leverageUp_liquidityAdded_notZero() public {
          // added0 + added1 > 0 after addLiquidity
      }

  - id: LT-D-06
    title: "leverageUp/Down: deadline = 0 or deadline < block.timestamp accepted"
    tier: 2
    type: property
    confidence: 72
    description: >
      LeverageTransformer does not validate params.deadline before passing it to
      Uniswap calls. If deadline < block.timestamp, the Uniswap call reverts with
      "Transaction too old". This is the M-21 pattern. For keeper-automated calls,
      deadline should be block.timestamp. User-specified deadlines risk staleness.
    affected_line: "LeverageTransformer.sol:65, 88, 153, 163"
    attack_scenario: >
      Keeper submits leverageUp with deadline set at creation time (5 min ago).
      By execution time deadline has passed. All leverage operations fail.
      For protocol-owned automation (AutoRangeAndCompound etc.), this could
      DoS automated rebalancing during high-gas periods.
    status: hypothesis
    solidity: |
      // INV-LT-D-06: deadline >= block.timestamp
      function invariant_deadline_notStale() public {
          // params.deadline >= block.timestamp
      }

