- id: D-03
  tier: 1
  type: property
  description: >
    INFI_CL_POSITION_CALL y INFI_BIN_POSITION_CALL envían address(this).balance como
    value en el .call{value: address(this).balance}(). Cualquier ETH en el router
    (de otros usuarios en comandos previos de la misma ejecución, o ETH enviado por
    mistake) se envía íntegramente al position manager. Un atacante puede usar esto
    para robar ETH de otros usuarios en una ejecución multi-command.
  attack_scenario: >
    1. Usuario A ejecuta un batch con WRAP_ETH + swap, enviando 10 ETH al router.
    2. Si por algún motivo el WRAP_ETH falla con FLAG_ALLOW_REVERT, el ETH permanece
       en el router.
    3. Atacante (o el mismo batch si hay un sub-plan malicioso) ejecuta
       INFI_CL_POSITION_CALL, que envía TODO address(this).balance al position manager.
    4. El ETH del Usuario A se pierde.
  impact: "Pérdida directa de ETH enviado al router que no se consumió en comandos previos."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Pre: depositar ETH en el router (via receive o WRAP con ALLOW_REVERT que falla)
    // Luego ejecutar INFI_CL_POSITION_CALL
    uint256 routerBalanceBefore = address(router).balance;
    // Ejecutar INFI_CL_POSITION_CALL con inputs mínimos válidos
    // El .call{value: address(this).balance} envía TODO el ETH
    uint256 routerBalanceAfter = address(router).balance;
    eq(routerBalanceAfter, 0, "D-03: router ETH drained by position call");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    El impacto depende de si es posible que haya ETH residual en el router entre
    comandos. En un batch normal, los comandos son atómicos. Pero EXECUTE_SUB_PLAN
    permite nested execution, y FLAG_ALLOW_REVERT permite que comandos fallen sin
    revertir todo. Combinación: WRAP_ETH (revert allowed) + INFI_CL_POSITION_CALL
    podría drenar ETH.

- id: D-04
  tier: 1
  type: property
  description: >
    EXECUTE_SUB_PLAN (0x21) llama a address(this).call(abi.encodeCall(Dispatcher.execute, ...))
    lo que permite reentrancia controlada. El Lock modifier en isNotLocked() permite
    la re-entrada si msg.sender == address(this). Un sub-plan puede ejecutar CUALQUIER
    comando, incluyendo otro EXECUTE_SUB_PLAN (recursión ilimitada). Esto podría usarse
    para manipular estado intermedio entre comandos.
  attack_scenario: >
    1. Atacante construye un execute() con un sub-plan anidado profundamente.
    2. En cada nivel de anidamiento, el locker sigue siendo el msg.sender original
       (correcto), pero la recursión no tiene límite de profundidad.
    3. Gas griefing: recursión profunda consume gas del bloque y puede causar OOG
       en transacciones compartidas.
    4. Más crítico: si algún estado temporal del router se expone entre niveles
       de anidamiento, un sub-plan puede explotarlo.
  impact: "DoS por gas griefing. Potencial manipulación de estado intermedio si
    existe state leakage entre niveles de execute."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Test: verificar que sub-plans anidados mantienen el locker correcto
    // y que no hay stack overflow
    address locker = _getLocker();
    // Después de EXECUTE_SUB_PLAN anidado 10 niveles:
    address lockerAfter = _getLocker();
    eq(locker, lockerAfter, "D-04: locker changed after nested sub-plan");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    El Lock usa transient storage y el locker se preserva correctamente en la
    re-entrada porque address(this) branch del modifier no modifica el locker.
    El riesgo real es bajo pero el patrón de recursión ilimitada merece investigación.

