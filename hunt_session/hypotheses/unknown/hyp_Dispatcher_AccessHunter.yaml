- id: D-08
  tier: 1
  type: property
  description: >
    SWEEP, TRANSFER y PAY_PORTION permiten enviar tokens del router a un recipient
    arbitrario. La dirección recipient NO se valida contra msgSender() — cualquier
    dirección es aceptada (excepto map() que traduce sentinels). Si hay tokens
    residuales en el router, cualquier usuario puede sweep/transfer a su propia
    dirección. En un batch normal esto es benigno (el usuario solo accede a sus
    propios fondos), pero combinado con FLAG_ALLOW_REVERT puede haber condiciones
    donde tokens de otro usuario quedan expuestos.
  attack_scenario: >
    1. Usuario A ejecuta batch: [PERMIT2_TRANSFER (deposita 100 USDC al router),
       V3_SWAP (con ALLOW_REVERT — falla)]
    2. El swap falla pero no revierte (ALLOW_REVERT). Los 100 USDC siguen en el router.
    3. El batch de Usuario A termina. Los 100 USDC quedan en el router.
    4. Atacante ejecuta: [SWEEP(USDC, atacante, 0)] → recibe los 100 USDC.
  impact: "Robo de tokens residuales dejados por otros usuarios cuyas operaciones
    fallaron con ALLOW_REVERT. Impacto directo en fondos."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Pre-condición: router tiene balance de algún token
    uint256 routerBalance = ERC20(token).balanceOf(address(router));
    // Cualquier usuario puede llamar SWEEP para drenar
    // No hay check de que el caller sea quien depositó los tokens
    gte(routerBalance, 0, "D-08: check if attacker can sweep residual tokens");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    En Uniswap Universal Router esto es un known issue / by-design: los tokens
    residuales en el router son "lost" y cualquiera puede sweep. La mitigación
    es que cada batch debe sweep al final. Si PancakeSwap adoptó el mismo diseño,
    esto es by-design. Pero vale confirmar que los usuarios son conscientes.

- id: D-09
  tier: 2
  type: property
  description: >
    INFI_CL_INITIALIZE_POOL y INFI_BIN_INITIALIZE_POOL no tienen restricción de caller.
    Cualquier usuario puede inicializar un pool en el CLPoolManager o BinPoolManager
    a través del router sin autorización. Si el pool manager no tiene sus propias
    validaciones, esto permite grief attacks como front-running la inicialización
    de un pool con un precio manipulado (sqrtPriceX96 o activeId malicioso).
  attack_scenario: >
    1. Protocolo legítimo planea crear un pool CL con sqrtPriceX96 correspondiente
       al precio de mercado correcto.
    2. Atacante observa la tx en mempool y front-runs con INFI_CL_INITIALIZE_POOL
       usando un sqrtPriceX96 extremo (precio muy desviado).
    3. El pool se inicializa con precio manipulado.
    4. El protocolo legítimo no puede re-inicializar (pools son únicos por PoolKey).
    5. Primera liquidez del protocolo se añade a precio incorrecto, causando
       arbitraje inmediato y pérdida.
  impact: "Griefing de inicialización de pools. La víctima pierde fondos al añadir
    liquidez al pool con precio manipulado."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // No hay check de autorización para inicializar pools
    // Cualquier address puede llamar INFI_CL_INITIALIZE_POOL
    // Verificar que el pool manager tiene sus propios checks
    t(false, "D-09: pool initialization has no access control in router");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    La protección real probablemente está en el PoolManager, no en el router.
    Pool initialization sin restricciones es un patrón común en Uniswap V4 / forks.
    Pero si PancakeSwap Infinity tiene pools permissioned, este es un bypass.
    Necesita verificación del CLPoolManager.initialize() y BinPoolManager.initialize().

- id: D-10
  tier: 1
  type: property
  description: >
    _checkInfiClPositionManagerCall verifica que selector == modifyLiquidities.selector
    pero luego parsea el unlockData y actions de los inputs. El parseo usa
    slice.toBytes(0).toBytes(0) — dos niveles de ABI decoding encadenados.
    Si un atacante crafts inputs donde el ABI encoding tiene offsets manipulados,
    podría hacer que toBytes(0) apunte a datos controlados que pasen el check
    de acciones pero que el position manager interprete de forma diferente
    (ABI decoding divergence).
  attack_scenario: >
    1. Atacante construye inputs donde el selector es modifyLiquidities (pasa check).
    2. Los datos después del selector usan offsets ABI que hacen que el router
       lea las actions como [CL_MINT_POSITION] (pasa el denylist check).
    3. Pero el position manager, al decodificar los mismos bytes, interpreta
       actions como [CL_DECREASE_LIQUIDITY] porque usa un decoding path diferente.
    4. El position manager ejecuta decrease liquidity, drenando la posición.
  impact: "Bypass total del filtro de acciones. El atacante puede ejecutar cualquier
    acción bloqueada (decrease, burn) si hay divergencia de interpretación."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Este invariante es conceptual — requiere un PoC de ABI crafting
    // Verificar que el router y el position manager decodifican las mismas
    // actions de los mismos bytes
    // bytes memory craftedInputs = ...
    // actions_router = decode como lo hace el router
    // actions_pm = decode como lo hace el position manager
    // for each i: eq(actions_router[i], actions_pm[i], "D-10: ABI decoding divergence");
    t(true, "D-10: placeholder - needs manual ABI crafting PoC");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 40
  notes: >
    ABI decoding divergence es un vector real documentado en auditorías previas
    (e.g., Uniswap Universal Router de Trail of Bits). La pregunta es si
    CalldataDecoder.toBytes(0) y el decoding interno del position manager usan
    el mismo path. Requiere análisis profundo de CalldataDecoder y de
    CLPositionManager._handleAction(). Si ambos usan abi.decode estándar, es
    probable que no haya divergencia.

