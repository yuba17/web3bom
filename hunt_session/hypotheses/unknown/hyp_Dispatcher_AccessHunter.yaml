- id: D-06
  tier: 1
  type: property
  description: >
    COMMAND_TYPE_MASK es 0x3f (6 bits), lo que permite 64 command types. El bit 7
    (FLAG_ALLOW_REVERT = 0x80) se usa para controlar si el revert es obligatorio.
    El bit 6 (0x40) NO se usa para nada — se descarta en el mask. Esto significa que
    los command values 0x00-0x3F se mapean correctamente, pero si alguna extensión
    futura usa el bit 6 sin actualizar el mask, habría colisiones de comandos.
    Actualmente NO es explotable pero es un riesgo de diseño.
  attack_scenario: >
    En estado actual, no explotable. El mask 0x3f descarta los bits 6 y 7,
    así que command byte 0xC0 (bits 7+6 set) se mapea a command 0x00 (V3_SWAP_EXACT_IN)
    con FLAG_ALLOW_REVERT set. No hay command aliasing explotable porque todos los
    paths legítimos caen en el rango 0x00-0x3F.
  impact: "Ninguno actualmente. Riesgo futuro si se añaden comandos sin actualizar mask."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que dos command bytes distintos no mapean al mismo command
    uint256 cmd1 = uint8(bytes1(0x00) & bytes1(0x3f));
    uint256 cmd2 = uint8(bytes1(0x40) & bytes1(0x3f));
    // cmd1 == cmd2 == 0x00 — aliasing confirmado pero inofensivo
    eq(cmd1, cmd2, "D-06: command aliasing exists but check if exploitable");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Esto es informational. El diseño es similar a Uniswap Universal Router donde
    el bit 7 es allow-revert y bits 0-6 son el command. Aquí bits 0-5 son command
    y bit 6 se ignora. No hay impacto actual.

