- id: GA-D10
  tier: 1
  type: property
  description: >
    HIPÓTESIS PRINCIPAL: En erc4626Mint/erc4626Deposit, el vault address es user-supplied
    y recibe forceApprove(underlyingToken, vault, max) donde underlyingToken = vault.asset().
    Un vault malicioso puede retornar CUALQUIER token como asset(). Si retorna un token que
    el adapter tiene en balance (de un paso previo del bundle), el vault recibe approval
    para drainarlo. Dentro de vault.deposit()/mint(), el vault puede llamar
    underlyingToken.transferFrom(adapter, attacker, adapter.balanceOf(underlyingToken)).
    Esto FUNCIONA porque el approval se da ANTES del external call al vault.

    PERO: esto solo drena tokens del PROPIO initiator (mismo bundle). No hay cross-user
    theft porque el adapter es stateless entre bundles y initiator controla todos los calls.

    EXCEPCIÓN CRÍTICA: Si tokens quedaron stuck en el adapter de un bundle anterior
    (skipRevert edge case, o tokens enviados directamente al adapter por error),
    CUALQUIER usuario podría drenarlos con un vault malicioso.
  attack_scenario: |
    1. Víctima envía USDC directamente al adapter por error (no via bundle) — o tokens quedan
       de un bundle anterior con skipRevert failure
    2. Atacante ve tokens en el adapter (balanceOf público)
    3. Atacante deploys MaliciousVault:
       - asset() retorna USDC
       - deposit(amount, receiver) llama USDC.transferFrom(adapter, attacker, amount), retorna 1 share
    4. Atacante envía bundle: [erc4626Deposit(MaliciousVault, max, type(uint256).max, attacker)]
    5. Adapter: underlyingToken = USDC (de MaliciousVault.asset())
    6. Adapter: assets = USDC.balanceOf(adapter) = stuck tokens
    7. Adapter: forceApprove(USDC, MaliciousVault, max)
    8. Adapter: MaliciousVault.deposit(stuckAmount, attacker) → vault drena USDC
    9. Adapter: forceApprove(USDC, MaliciousVault, 0) — too late, tokens gone
    10. Slippage check: stuckAmount.rDivUp(1) vs type(uint256).max → passes
    11. Resultado: atacante robó tokens stuck del adapter

    VECTOR ALTERNATIVO con erc20Transfer de CoreAdapter:
    erc20Transfer(USDC, attacker, max) también drenaría tokens stuck.
    Pero el vault malicioso es más sofisticado y puede bypass logging.
  impact: "Robo de tokens stuck/residuales en el adapter via vault malicioso + max pattern"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: erc4626Deposit/Mint con vault arbitrario no debe poder drenar
    // tokens que no fueron enviados por el initiator actual
    // Pre-bundle adapter balance de underlyingToken debe ser 0
    uint256 preBundleBalance = IERC20(underlyingToken).balanceOf(address(adapter));
    eq(preBundleBalance, 0, "GA-D10: adapter has pre-existing token balance — drain risk");
  ghost_vars:
  - "mapping(address => uint256) internal ghost_preBundleBalances;"
  validated: false
  priority: high
  confidence: 50
  notes: >
    La probabilidad depende de si tokens pueden quedarse stuck en el adapter.
    El diseño del Bundler3 asume que el adapter es un transit point y nunca
    retiene tokens entre bundles. Si esto es cierto al 100%, el finding se cae.
    Necesita verificación: ¿hay algún path donde tokens queden en el adapter
    después de un multicall completo? skipRevert + revert parcial es el candidato.
    TAMBIÉN: erc20Transfer de CoreAdapter ya permite que CUALQUIERA drene tokens
    residuales (no necesita vault malicioso), así que este vector es redundante
    con un design feature existente. Eso sí, erc20Transfer tiene el check
    require(receiver != address(this)) que previene self-drain del adapter.
    CONCLUSIÓN: Los tokens stuck son por diseño "de quien los tome primero"
    (MEV/frontrun), pero NO es un bug del adapter — es consecuencia del modelo
    stateless. La documentación de Bundler3 dice explícitamente que "it should
    not be approved/authorized anywhere" — precisamente por esto.

