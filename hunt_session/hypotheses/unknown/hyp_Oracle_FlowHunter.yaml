# H-05: try/catch in batch functions — selective failure exploitation
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-05
  tier: 2
  type: property
  description: >
    collectFees (Oracle:28-43) and processTreasuryManagement (Oracle:142-233)
    use try/catch so individual items can fail without reverting the batch.
    If a pool reverts on withdrawFees, it's logged as a failure and the loop
    continues. Question: can a malicious pool cause selective failures?
  attack_scenario: >
    1. Pools are created by the factory via Clones.clone(implementation), so
       the implementation is fixed — a malicious pool contract cannot be injected
       unless the factory's implementation is changed by the owner.
    2. The pool address is resolved via factory.getPool(poolUuid) in collectFees
       (line 103), NOT passed as parameter — so provider cannot supply an
       arbitrary malicious contract.
    3. A legitimate pool could revert withdrawFees if: insufficient balance,
       fees_batch_id already processed, or amount == 0. These are all legitimate
       failure conditions.
    4. Selective failure = some fees collected, some not. But the provider controls
       which requests are in the batch. A malicious provider could intentionally
       include requests they know will fail to create misleading events.
    No fund loss vector. The try/catch is a standard batch processing pattern.
  impact: >
    No fund loss. Misleading events at most (if provider is malicious, but
    provider is already trusted role).
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: ''
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    KILL SIGNALS:
    - Pool addresses come from factory.getPool() — not user-supplied.
    - Pool implementation is cloned — attacker can't inject arbitrary code.
    - Provider is trusted role — if compromised, there are bigger problems (H-01).
    VERDICT: Not a bug. Standard batch pattern, no exploitation vector.

