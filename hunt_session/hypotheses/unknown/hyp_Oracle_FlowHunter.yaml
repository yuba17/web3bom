# H-02: grantRole override — permanently broken for PROVIDER_ROLE
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-02
  tier: 1
  type: property
  description: >
    Oracle.grantRole() (line 438-446) calls super.grantRole(role, account) BEFORE
    checking require(!hasRole(PROVIDER_ROLE, account)). Since super.grantRole()
    already grants the role, hasRole() returns true at the require check, making
    !hasRole() always false. The require ALWAYS reverts for PROVIDER_ROLE, making
    the standard OZ grantRole() path permanently broken. The addProvider() function
    still works as an alternative path.
  attack_scenario: >
    1. Admin calls grantRole(PROVIDER_ROLE, newProvider) — the standard OZ interface.
    2. super.grantRole grants the role on line 439.
    3. Line 442: require(!hasRole(PROVIDER_ROLE, account)) — hasRole is now TRUE
       because super.grantRole just set it, so !true = false → REVERT.
    4. The role grant is reverted. numProviders is NOT incremented.
    5. Admin must use addProvider() instead, which works correctly.
    This is a logic bug — the grantRole code path for PROVIDER_ROLE is dead code
    that always reverts. Impact is Low because addProvider() provides a working
    alternative. But if any integration/frontend uses the standard grantRole interface,
    it will always fail.
  impact: >
    The standard AccessControl.grantRole() interface is broken for PROVIDER_ROLE.
    No fund loss, but operational disruption if admin/integrations rely on
    the standard OZ grantRole interface. addProvider() works as workaround.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // The bug is at Oracle.sol lines 438-446:
    // function grantRole(bytes32 role, address account) public override ... {
    //     super.grantRole(role, account);    // ← GRANTS the role first
    //     if (role == PROVIDER_ROLE) {
    //         require(!hasRole(PROVIDER_ROLE, account), "...");  // ← ALWAYS false now
    //         numProviders++;
    //         emit ProviderAdded(account);
    //     }
    // }
    // Fix: move the hasRole check BEFORE super.grantRole, or remove grantRole override
    // and rely solely on addProvider().
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    KILL SIGNALS:
    - Impact is LOW — addProvider() works fine. No funds at risk.
    - Similarly, revokeRole (line 449-457) has the OPPOSITE pattern: it checks
      hasRole BEFORE super.revokeRole, and decrements numProviders BEFORE revoking.
      This is correct ordering for revoke but creates an asymmetry with grant.
    - The revokeRole correctly checks BEFORE calling super, while grantRole
      incorrectly checks AFTER calling super. Classic order-of-operations bug.
    VERDICT: Valid bug, Low severity. Likely accepted as QA/Low on Immunefi.

# ═══════════════════════════════════════════════════════════════════════
# H-03: atomicDeposit — funds sent directly, not via Pool deposit method
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-03
  tier: 2
  type: property
  description: >
    atomicDeposit (Oracle:287-322) transfers USDC to the pool via raw
    usdc.transfer(poolAddress, amount) instead of calling pool.depositUSDCOnBehalfOfParty().
    The pool then calls depositUSDCAtomic() which, when partyOneAmountRequested > 0
    && partyTwoAmountRequested == 0, just emits an event and returns (SettlementPool:169-180)
    WITHOUT doing any accounting update. The pool relies on _totalBalance()
    (= balanceOf(address(this))) for balance checks, so the raw transfer IS reflected
    in the balance. However, transfers_processed is NOT updated for the partyOne
    transfer in this path — it's only checked via atomic_deposits_processed on the
    Oracle side.
  attack_scenario: >
    The split accounting between Oracle.atomic_deposits_processed and
    Pool.transfers_processed creates a consistency gap. The Oracle marks
    parentQuoteUuid as processed in atomic_deposits_processed (line 306),
    but the Pool never marks anything in transfers_processed for this deposit.
    This means Pool-level queries to transfers_processed will show this
    transfer as never having happened, while Oracle-level shows it as processed.
    Unlikely to cause fund loss directly since Pool uses balanceOf for balance
    tracking, but could confuse off-chain accounting/indexers that rely on
    Pool events/state.
  impact: >
    No direct fund loss. Potential accounting inconsistency between Oracle and Pool
    state. Off-chain systems that query Pool.transfers_processed for deposit
    confirmation will not see atomicDeposit transfers.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Check: after atomicDeposit with partyOne only, Pool.transfers_processed is NOT set
    // Oracle.atomic_deposits_processed IS set
    // This is by design but creates split state
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: >
    KILL SIGNALS:
    - Pool uses balanceOf(address(this)) for actual balance, not internal accounting.
      So raw transfer IS reflected. No phantom balance.
    - The dual-tracking (Oracle.atomic_deposits_processed vs Pool.transfers_processed)
      is likely intentional — atomic deposits are a special path.
    - No fund loss vector identified. Downgrading to informational.
    VERDICT: Informational at best. The design choice is intentional.

