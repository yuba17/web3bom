# H-04: withdrawFees — CEI pattern analysis
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-04
  tier: 2
  type: property
  description: >
    withdrawFees (SettlementPool:247-260) does the USDC transfer BEFORE setting
    transfers_processed[fees_batch_id] = true (line 256). The transfer is inside
    a try/catch, and the state update happens in the try success block. This is
    technically an Interaction-before-Effect pattern. However, USDC on Arbitrum is
    a standard ERC20 with no callbacks (not ERC777), and the function has nonReentrant.
    Additionally, the Oracle calling this function also has nonReentrant, so there
    are TWO mutex locks active.
  attack_scenario: >
    For reentrancy to work:
    1. The requestor would need a receive/fallback that re-enters — but USDC transfer
       does not trigger receive/fallback (it's a contract call to USDC, not ETH transfer).
    2. USDC on Arbitrum (Bridged USDC or native) has no transfer hooks.
    3. Pool has nonReentrant, so even if somehow re-entered, it would revert.
    4. Oracle also has nonReentrant on collectFees that calls this.
    NO VIABLE ATTACK PATH.
  impact: 'None — theoretical CEI concern mitigated by multiple defenses.'
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // withdrawFees pattern:
    // try usdc.transfer(requestor, amount) {
    //     transfers_processed[fees_batch_id] = true;  // state after interaction
    // } catch { revert; }
    // Mitigations: nonReentrant on Pool + nonReentrant on Oracle + USDC has no hooks
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: >
    KILL SIGNALS:
    - USDC = no callbacks. Full stop.
    - Double nonReentrant (Oracle + Pool). Even if token had hooks, blocked.
    - The _withdrawUSDCOnBehalf (line 262-283) has the SAME pattern. Same conclusion.
    VERDICT: Not a bug. CEI non-conformance is real but fully mitigated. Informational.

