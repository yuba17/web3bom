# H-06: USDC dust stuck in Oracle contract
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-06
  tier: 2
  type: property
  description: >
    Oracle acts as a pass-through for USDC in transferFromOLPToPool and atomicDeposit:
    it does transferFrom(sender, oracle, amount) then transfer(pool, amount).
    If the second transfer fails, the entire transaction reverts, so no USDC should
    remain in Oracle. However, if someone directly transfers USDC to the Oracle
    contract (donation), there is NO rescue function to recover those funds.
  attack_scenario: >
    1. User accidentally sends USDC directly to Oracle contract address.
    2. No function exists in Oracle to sweep/recover arbitrary ERC20 tokens.
    3. Funds are permanently stuck.
    This is a standard "no rescue function" issue — common in many contracts but
    generally Low/Informational.
  impact: >
    Any USDC (or other ERC20) directly sent to Oracle contract is permanently stuck.
    No mechanism to recover. Only affects accidental transfers.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: ''
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    KILL SIGNALS:
    - This is an extremely common pattern — most contracts lack rescue functions.
    - No intentional fund flow leaves USDC in Oracle — it's always pass-through.
    - Only accidental transfers are affected.
    VERDICT: Informational. Standard missing-rescue-function issue.

# ═══════════════════════════════════════════════════════════════════════
# H-07: Oracle.pools vs Factory.getPool — dual pool registry inconsistency
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-07
  tier: 1
  type: property
  description: >
    Oracle maintains its OWN pool registry (mapping pools, line 21) AND the factory
    also maintains a pool registry (getPool mapping). Oracle.createPool() (line 359-380)
    writes to BOTH: factory.createPool() writes to factory.getPool, and then line 379
    writes to Oracle.pools[poolUuid]. Some Oracle functions use Oracle.getPool()
    (which reads Oracle.pools) while others use factory.getPool(). If these ever
    diverge, fund routing could break.

    Functions using Oracle.pools (via getPool): withdrawUSDC (258), atomicDeposit (296),
    depositUSDC (350).

    Functions using factory.getPool: collectFees (103), processTreasuryManagementDeposits (154),
    processTreasuryManagementWithdrawals (203), batchAtomicDeposit (330), addOtherParty (386).

    transferFromOLPToPool: uses NEITHER — takes poolAddress as raw parameter.
  attack_scenario: >
    1. If factory.setOracleAddress() is called to point to a NEW Oracle contract,
       the new Oracle's pools mapping is empty, but factory.getPool still has all pools.
    2. Functions using Oracle.getPool() (withdrawUSDC, atomicDeposit, depositUSDC) will
       fail with "Pool not found" for all existing pools.
    3. Functions using factory.getPool() (collectFees, treasury management) will continue
       to work.
    4. This creates a split where some operations work and others don't after Oracle migration.
    This is an UPGRADE/MIGRATION issue, not exploitable by external attacker. But it
    could cause operational disruption during Oracle contract replacement.
  impact: >
    After Oracle contract replacement, some functions break while others work.
    No direct fund loss but operational disruption. Funds in pools are NOT at risk
    (pools are independent contracts).
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariant: Oracle.pools[uuid] MUST equal factory.getPool(uuid) for all created pools
    // This holds as long as createPool is the only path that adds pools.
    // Breaks during Oracle migration (new Oracle has empty pools mapping).
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 75
  notes: >
    KILL SIGNALS:
    - Dual registry is a design smell but not exploitable by external attackers.
    - Only relevant during Oracle contract migration — an admin operation.
    - Pools are independent contracts with their own USDC. Not at risk.
    - The inconsistency between which functions use which registry is concerning
      from a maintenance perspective but doesn't create a direct attack vector.
    VERDICT: Low/Informational. Design improvement recommendation.

# ═══════════════════════════════════════════════════════════════════════
# H-08: batchAtomicDeposit — no duplicate protection for parentQuoteUuid
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-08
  tier: 2
  type: property
  description: >
    batchAtomicDeposit (Oracle:324-342) calls pool.batchDepositUSDCAtomic() which
    uses the item's parentQuoteUuid as the transferUuid for _depositUSDCOnBehalf.
    The dupe check in _depositUSDCOnBehalf (line 97) uses Pool.transfers_processed.
    BUT: for the first item with creatorPartyAmountRequested > 0, after the creator
    deposit, transferUuid is reset to 0 (line 140). When transferUuid == 0,
    _depositUSDCOnBehalf still checks transfers_processed[0], but transferUuid 0
    is never set to true (line 106-108: only set if transferUuid != 0).
    This means ALL second-party deposits with transferUuid=0 BYPASS the dupe check.
    If provider submits the same batch twice, the creator deposits will be caught
    by the dupe check (parentQuoteUuid is real), but the other party deposits with
    transferUuid=0 will succeed again.
  attack_scenario: >
    1. Provider calls batchAtomicDeposit with items containing valid parentQuoteUuids.
    2. For each item, creator deposit uses parentQuoteUuid → dupe protected.
    3. Other party deposit uses transferUuid=0 → _depositUSDCOnBehalf checks
       transfers_processed[0] which is always false (never set to true).
    4. If provider replays the batch, creator deposits revert (parentQuoteUuid already
       processed), but if creatorPartyAmountRequested is set to 0 on replay,
       only other party deposits execute — and they pass because transferUuid=0
       is never marked as processed.
    5. Other party gets double-charged.
    KILL SIGNAL: Provider is trusted. Provider controls the batch inputs. If provider
    is honest, they won't replay. If compromised, there are bigger issues (H-01).
    BUT: the other party's approval to the pool is what enables the charge.
    Double-charging requires the other party to still have sufficient allowance.
  impact: >
    Trusted provider could double-charge the other party's USDC deposits in
    batchAtomicDeposit. Requires provider to craft a replay with modified parameters.
    Limited by other party's USDC allowance to the pool contract.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // In batchDepositUSDCAtomic, after creator deposit:
    // transferUuid = 0;  // reset
    // Then for other party:
    // _depositUSDCOnBehalf(otherAddr, amount, 0, false);
    //   → require(transfers_processed[0] == false) → always true (0 never set)
    //   → transferFrom succeeds
    //   → if (transferUuid != 0) transfers_processed[transferUuid] = true; → SKIPPED (uuid is 0)
    // Result: no dupe protection for other party deposits
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    KILL SIGNALS:
    - Provider is trusted role — can already steal via H-01 if compromised.
    - Other party must have approved the pool for USDC. Approval is per-pool,
      so the attack is limited to the other party's allowance to that specific pool.
    - The same pattern exists in depositUSDCAtomic (line 159-216) — same risk.
    - This is a DEFENSE-IN-DEPTH issue: even trusted roles should not be able to
      double-charge parties. The transferUuid=0 bypass undermines the entire
      dupe-prevention system for the second party in atomic deposits.
    VERDICT: Medium if trusted-role bugs are in scope, Low/Info otherwise.
    Depends on Immunefi scope rules for this program.
  poc_sketch: |
    function test_batchAtomicDeposit_double_charge_other_party() public {
        // Setup: other party approves pool for 2000 USDC
        vm.prank(otherParty);
        usdc.approve(address(pool), 2000e6);

        // First call: creator deposits 100, other deposits 100
        SettlementPools.AtomicDepositBatchItem[] memory items = new SettlementPools.AtomicDepositBatchItem[](1);
        items[0] = SettlementPools.AtomicDepositBatchItem({
            otherPartyAddress: otherParty,
            otherPartyAmountRequested: 100e6,
            rfqUuid: 1,
            parentQuoteUuid: 42
        });
        vm.prank(provider);
        oracle.batchAtomicDeposit(poolUuid, creator, 100e6, items);

        // Second call: creator amount = 0, other party = 100 again
        // parentQuoteUuid 42 is already processed for creator path,
        // but other party path uses transferUuid=0 → no dupe check
        vm.prank(provider);
        oracle.batchAtomicDeposit(poolUuid, creator, 0, items);
        // Other party charged TWICE: 200 USDC total for what should be 100
    }
  call_stack: ''

