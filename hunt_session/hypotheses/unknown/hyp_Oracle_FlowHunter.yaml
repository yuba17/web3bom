# ═══════════════════════════════════════════════════════════════════════
# H-01: transferFromOLPToPool — poolAddress NOT validated against factory
# ═══════════════════════════════════════════════════════════════════════
- id: FLOW-01
  tier: 1
  type: property
  description: >
    transferFromOLPToPool (Oracle:267-285) accepts a raw `poolAddress` parameter
    and sends USDC directly to it via `usdc.transfer(poolAddress, amount)` WITHOUT
    validating that poolAddress == factory.getPool(poolUuid). A malicious/compromised
    provider can route OLP funds to ANY arbitrary address. This is the ONLY function
    in Oracle that takes poolAddress as a direct parameter — all other functions
    resolve poolAddress from poolUuid via getPool() or factory.getPool().
  attack_scenario: >
    1. Provider (PROVIDER_ROLE) calls transferFromOLPToPool with a legitimate
       olpWallet (who has approved Oracle for USDC), a valid poolUuid, but sets
       poolAddress to the attacker's own wallet.
    2. Oracle pulls USDC from OLP via transferFrom(olpWallet, oracle, amount).
    3. Oracle sends USDC to attacker via transfer(poolAddress=attacker, amount).
    4. Funds are stolen. The poolUuid parameter is only used in the event emission,
       providing no on-chain validation.
    KILL SIGNAL CHECK: The function is gated by PROVIDER_ROLE. If provider is a
    trusted off-chain service with a hot wallet, compromise of that key = full drain
    of all approved OLP balances. Even if provider is a multisig, the poolAddress
    parameter should STILL be validated — defense in depth.
  impact: >
    Direct theft of all USDC approved by any OLP wallet to the Oracle contract.
    The amount at risk equals sum of all OLP USDC allowances to Oracle.
    On Arbitrum with USDC, this could be significant.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariant: poolAddress passed to transferFromOLPToPool MUST match factory.getPool(poolUuid)
    // This cannot be tested as a fuzz invariant — it's a static code analysis finding.
    // The fix is to add: require(poolAddress == factory.getPool(poolUuid), "pool mismatch");
    // OR remove poolAddress param entirely and resolve from poolUuid.
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 85
  notes: >
    KILL SIGNALS:
    - Provider is a trusted role. If it's an EOA hot wallet, risk is HIGH (key compromise).
    - If provider is a multisig, risk is MEDIUM (social engineering, but poolAddress
      validation still missing = defense-in-depth violation).
    - The poolUuid param exists in the function but is ONLY used in the event — zero
      on-chain validation. This is suspicious design.
    - Compare with ALL other Oracle functions: depositUSDC (line 350), withdrawUSDC (line 258),
      atomicDeposit (line 296), processTreasuryManagementDeposits (line 154),
      processTreasuryManagementWithdrawals (line 203) — ALL resolve poolAddress from
      factory.getPool(poolUuid) or pools[poolUuid]. transferFromOLPToPool is the ONLY exception.
    - Immunefi scope: if trusted roles are excluded, this may be out of scope. CHECK RULES.
    VERDICT: Valid code defect. Reportability depends on Immunefi scope re: trusted roles.
  poc_sketch: |
    // Foundry PoC
    function test_transferFromOLPToPool_arbitrary_recipient() public {
        // Setup: OLP approves Oracle for 1000 USDC
        vm.prank(olpWallet);
        usdc.approve(address(oracle), 1000e6);

        // Attack: provider routes funds to attacker instead of pool
        address attacker = makeAddr("attacker");
        vm.prank(provider);
        oracle.transferFromOLPToPool(
            olpWallet,
            attacker,          // <-- NOT a real pool, just attacker address
            1000e6,
            poolUuid,
            rfqUuid,
            parentQuoteUuid
        );

        // Verify: attacker got the funds
        assertEq(usdc.balanceOf(attacker), 1000e6);
        // Pool got nothing
        assertEq(usdc.balanceOf(realPoolAddress), 0);
    }
  call_stack: >
    Oracle.transferFromOLPToPool(olpWallet, ATTACKER_ADDR, amount, poolUuid, ...)
      → usdc.transferFrom(olpWallet, oracle, amount)  // OLP → Oracle
      → usdc.transfer(ATTACKER_ADDR, amount)           // Oracle → ATTACKER (not pool!)
      → emit OLPToPoolTransfer(...)                     // event logged but funds gone

