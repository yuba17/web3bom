  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    En Solmate ERC721, safeTransferFrom llama transferFrom internamente, así que
    el override de transferFrom en CLPositionManager SÍ aplica. Esto significa
    que onlyIfVaultUnlocked y auto-unsubscribe se aplican a safeTransferFrom también.
    Sin embargo, necesito verificar que Solmate no tiene un path alternativo que
    bypass el override. Si Solmate's safeTransferFrom es: transferFrom(...) +
    onERC721Received check, entonces está protegido. Confidence 55% porque necesita
    verificación del código de Solmate.

- id: CLPM-AC-09
  tier: 1
  type: property
  description: >
    _pay() usa permit2.transferFrom con uint160 cast — si amount > type(uint160).max
    (que es ~1.46e48), el cast trunca silently. SafeCast se usa en otros lugares
    pero NO en _pay(). Un token con supply > 2^160 podría causar un underflow en
    la cantidad transferida: el usuario paga menos de lo que debería al vault,
    creando un deficit.
  attack_scenario: >
    1. Token con supply > 2^160 (extremadamente improbable pero teóricamente posible).
    2. Usuario llama modifyLiquidities para add liquidity con amount = 2^160 + 1.
    3. _pay() castea a uint160: amount = 1 (truncado).
    4. Solo 1 wei se transfiere al vault, pero el pool manager registra el delta completo.
    5. El vault tiene un deficit de (2^160) tokens.
    6. Cuando otros usuarios intentan withdraw, no hay suficientes tokens.
    Impacto: draining del vault. Pero el pre-requisito (token con supply > 2^160) es
    extremadamente improbable — ERC20 standard usa uint256 para balances pero en
    práctica ningún token tiene supply cercana a 2^160.
  impact: "Potencial draining del vault si se usa token con supply > 2^160."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: amount pasado a permit2.transferFrom no pierde precisión
    uint256 largeAmount = uint256(type(uint160).max) + 1;
    uint160 truncated = uint160(largeAmount);
    t(truncated == largeAmount, "CLPM-AC-09: amount truncated in _pay()");
    // Esto SIEMPRE falla para amounts > type(uint160).max
    // La pregunta es si el sistema permite llegar aquí con esos amounts
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    Permit2 usa uint160 para amounts por diseño (Uniswap's allowance architecture).
    Esto significa que tokens con amounts > 2^160 no son soportados por el sistema
    permit2 en general, no solo por CLPositionManager. Es una limitación conocida
    del ecosistema Permit2. Probablemente informational/by-design, pero vale
    documentar como limitación del sistema.

false_positives:
- hunter: AccessHunter
  id: CLPM-FP-01
  reason: >
    _mint() internal acepta owner arbitrario del calldata, pero esto es by-design.
    El caller es quien paga los tokens (via SETTLE). El owner del NFT recibe la
    posición pero no extrae valor — solo tiene el derecho a modificar/quemar la
    posición después. El caller decide a quién asignar la posición, similar a
    ERC721.mint(to). No hay explotación posible porque el que paga elige quién
    recibe, que es el flujo estándar.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      En position managers estilo Uniswap V4, _mint con owner arbitrario es
      by-design — el caller paga y elige a quién asignar el NFT. No es un
      access control bug.
    briefing_update_applied: false

- hunter: AccessHunter
  id: CLPM-FP-02
  reason: >
    TAKE/TAKE_PAIR sin restricción de recipient parece peligroso, pero es seguro
    porque TAKE solo mueve CREDIT positivo del CLPositionManager en el vault.
    El credit solo se genera por acciones que requieren onlyIfApproved (decrease,
    burn). Un atacante sin approval no puede generar credit para luego TAKE-arlo.
    El recipient arbitrario es by-design — el owner decide a dónde van sus tokens.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      TAKE sin restricción de recipient en position managers es seguro si todas
      las acciones que generan credit (decrease, burn) verifican ownership. El
      credit-generation step es el gate, no el TAKE step.
    briefing_update_applied: false

- hunter: AccessHunter
  id: CLPM-FP-03
  reason: >
    Permit2Forwarder.permit() acepta cualquier owner parameter y no verifica que
    msg.sender == owner. Esto parece un bug pero es by-design: la firma del owner
    en el signature parameter es la verificación. Permit2 internamente verifica
    que la firma corresponde al owner. El front-running de permits es handled por
    try/catch (DOS resistance).
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Permit2Forwarder.permit() con owner arbitrario es by-design — la firma
      criptográfica ES la verificación, no el msg.sender. El try/catch protege
      contra front-running DOS.
    briefing_update_applied: false
