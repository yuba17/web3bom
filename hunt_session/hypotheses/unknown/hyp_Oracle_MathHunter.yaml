component: Oracle
hunter: MathHunter
date: 2026-03-23
target: Variational (Immunefi, $100K max, Arbitrum)
files_analyzed:
  - src/Oracle.sol (468 lines)
  - src/SettlementPool.sol (332 lines)
  - src/SettlementPoolFactory.sol (112 lines)
  - src/library/Fees.sol (10 lines)
