- id: D-01
  tier: 1
  type: property
  description: "INFI_CL_POSITION_CALL y INFI_BIN_POSITION_CALL envían address(this).balance completo — un comando anterior puede depositar ETH que será reenviado a un position manager sin control del usuario"
  attack_scenario: |
    Secuencia de ataque multi-comando:
    1. Usuario A envía tx con msg.value=10 ETH. Primer comando falla con FLAG_ALLOW_REVERT (el ETH queda en el router).
    2. Segundo comando es INFI_CL_POSITION_CALL — envía address(this).balance (los 10 ETH) al position manager.
    3. Si hay ETH residual de txs anteriores (donations, refunds de swaps fallidos, etc.), ese ETH TAMBIÉN se envía.

    Riesgo concreto: el usuario no controla cuánto ETH se envía al position manager. Si hay ETH residual de otro usuario
    en el contrato, se mezcla. Si hay MENOS del esperado (porque otro comando lo consumió), el position call puede fallar
    o crear una posición con menos liquidez de la esperada.

    Dirección de análisis: ¿El position manager devuelve exceso? ¿O se lo queda todo?
  impact: "ETH residual de otros usuarios podría ser capturado por el siguiente usuario que ejecute INFI_*_POSITION_CALL. Pérdida directa de fondos para el usuario anterior."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Antes de INFI_CL_POSITION_CALL, guardar balance ETH del router
    uint256 ethBefore = address(router).balance;
    // Ejecutar una secuencia que deje ETH residual + INFI_CL_POSITION_CALL
    // Verificar que no se envió más ETH del que el usuario aportó
    uint256 ethSent = ethBefore - address(router).balance;
    lte(ethSent, userMsgValue, "D-01: position call sent more ETH than user provided");
  ghost_vars:
  - uint256 internal ghost_ethResidualBeforePositionCall;
  validated: false
  priority: high
  confidence: 70
  notes: |
    Líneas 312 y 316: `address(INFI_CL_POSITION_MANAGER).call{value: address(this).balance}(inputs)`
    El patrón {value: address(this).balance} es conocido de Uniswap Universal Router — Uniswap lo usa
    porque asume que el router se vacía al final de cada tx. PancakeSwap parece seguir el mismo patrón.
    Pero si hay ETH residual (por donate, selfdestruct, o comando fallido con FLAG_ALLOW_REVERT),
    el invariante se rompe. Verificar si el router tiene sweep final obligatorio.

- id: D-02
  tier: 1
  type: property
  description: "FLAG_ALLOW_REVERT permite que un comando falle silenciosamente, dejando ETH/tokens en el router sin que el usuario lo sepa, disponible para el siguiente caller"
  attack_scenario: |
    1. Usuario construye secuencia: [WRAP_ETH(10 ETH), V3_SWAP(con FLAG_ALLOW_REVERT), SWEEP(token de salida)]
    2. El swap falla silenciosamente (slippage, pool vacío, etc.)
    3. WRAP_ETH ya convirtió 10 ETH a WETH y lo envió al router
    4. El SWEEP del token de salida transfiere 0 (si amountMin=0, pasa sin revert)
    5. Los 10 WETH quedan en el router — el siguiente usuario puede hacer SWEEP(WETH) y robarlos

    La clave: FLAG_ALLOW_REVERT suprime el error pero NO revierte el estado de los comandos anteriores.
    Los comandos se ejecutan secuencialmente, y los anteriores al fallo YA modificaron estado.
  impact: "Pérdida total de los fondos del usuario cuando un swap falla con FLAG_ALLOW_REVERT y no hay sweep final del token de entrada."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Al final de execute(), verificar que no quedaron fondos en el router
    // (excepto ETH residual de msg.value que el usuario eligió no retirar)
    uint256 wethLeft = WETH9.balanceOf(address(router));
    eq(wethLeft, 0, "D-02: WETH left in router after execute with failed command");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: |
    Esto es un patrón conocido de Universal Router — la responsabilidad de sweep es del integrador/frontend.
    Pero si un usuario construye manualmente su calldata (o un integrador tiene un bug), esto es explotable.
    Verificar si PancakeSwap tiene algún mecanismo de protección post-execute que Uniswap no tiene.
    Probablemente "by design" pero vale la pena investigar si hay MEV bot que monitorea esto.

- id: D-03
  tier: 1
  type: property
  description: "PAY_PORTION con bips calculados sobre address(this).balance/balanceOf puede incluir fondos de otros usuarios si hay ETH/tokens residuales"
  attack_scenario: |
    1. Existe ETH residual en el router (por selfdestruct, comando previo, refund, etc.)
    2. Usuario ejecuta secuencia que incluye PAY_PORTION con bips=10000 (100%)
    3. PAY_PORTION calcula: balance = address(this).balance, amount = balance * bips / 10000
    4. El amount incluye los fondos residuales de otro usuario
    5. El receptor recibe más de lo que le corresponde

    Combinación peligrosa: Si un usuario A deja 5 ETH residuales, y usuario B hace
    PAY_PORTION(ETH, B, 10000), usuario B recibe los 5 ETH de A más sus propios fondos.
  impact: "Robo de fondos residuales. Impacto limitado por la cantidad de ETH/tokens que queden en el router entre txs."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: PAY_PORTION nunca debería enviar más que lo que el usuario aportó en esta tx
    uint256 ethBalanceBefore = address(router).balance;
    // ... usuario envía msg.value y ejecuta comandos ...
    // Al final, lo enviado por PAY_PORTION <= msg.value + tokens recibidos por swaps
    uint256 portionSent = ghost_payPortionAmount;
    lte(portionSent, ghost_userContribution, "D-03: PAY_PORTION sent more than user contributed");
  ghost_vars:
  - uint256 internal ghost_payPortionAmount;
  - uint256 internal ghost_userContribution;
  validated: false
  priority: medium
  confidence: 50
  notes: |
    Payments.payPortion (línea 44-53) usa address(this).balance o ERC20.balanceOf(address(this))
    sin distinguir de quién son esos fondos. Esto es by design en routers tipo Uniswap — se asume
    que el router está vacío entre txs. Pero selfdestruct (deprecated pero existe) puede forzar ETH.
    En la práctica, es difícil dejar tokens ERC20 residuales sin que alguien los sweepee primero.

- id: D-04
  tier: 1
  type: property
  description: "EXECUTE_SUB_PLAN hace self-call a execute() — el Lock permite self-reentrancy, lo que podría permitir secuencias que manipulan estado intermedio"
  attack_scenario: |
    1. Lock.isNotLocked() permite self-reentrancy (línea 16-23 de Lock.sol: if msg.sender == address(this), skip lock)
    2. EXECUTE_SUB_PLAN (línea 327): `(address(this)).call(abi.encodeCall(Dispatcher.execute, ...))`
    3. Esto ejecuta execute() de nuevo con msg.sender == address(this), bypaseando el lock
    4. Dentro del sub-plan se puede ejecutar CUALQUIER comando, incluyendo otro EXECUTE_SUB_PLAN (recursión)

    Vectores de ataque potenciales:
    a) Sub-plan que modifica balance del router entre comandos del plan padre
    b) Sub-plan que consume ETH que el plan padre esperaba usar
    c) Recursión profunda para gas griefing (¿hay límite de profundidad?)
    d) Sub-plan con FLAG_ALLOW_REVERT que deja estado inconsistente

    Pregunta clave: ¿El msgSender() dentro del sub-plan sigue retornando al usuario original?
    Sí — _getLocker() retorna al locker original porque el lock no se reescribe en self-reentry.
  impact: "Gas griefing por recursión ilimitada. Posible manipulación de balances intermedios entre plan padre y sub-plan."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que EXECUTE_SUB_PLAN no permite recursión más allá de N niveles
    // Y que msgSender() retorna consistentemente al usuario original
    address lockerBefore = Locker.get();
    // ... ejecutar sub-plan ...
    address lockerAfter = Locker.get();
    eq(lockerBefore, lockerAfter, "D-04: locker changed after sub-plan execution");
  ghost_vars:
  - uint256 internal ghost_subPlanDepth;
  validated: false
  priority: medium
  confidence: 45
  notes: |
    La recursión ilimitada es limitada por gas en la práctica — cada nivel consume ~50K gas.
    Con block gas limit de 30M, máximo ~600 niveles. Pero el impacto real es bajo — es gas griefing
    contra uno mismo. El vector más interesante es si el sub-plan puede dejar estado que el plan
    padre no espera (e.g., consumir WETH del router que el padre iba a usar en un swap posterior).
    Esto es "by design" — el usuario construye toda la secuencia.

- id: D-05
  tier: 1
  type: property
  description: "WRAP_ETH con amount != CONTRACT_BALANCE puede dejar ETH residual si amount < address(this).balance, y ese residual va a INFI_*_POSITION_CALL"
  attack_scenario: |
    1. Usuario envía 10 ETH (msg.value = 10 ETH)
    2. Comando 1: WRAP_ETH(recipient=router, amount=5 ETH) — wraps 5 ETH, 5 ETH quedan en router
    3. Comando 2: V3_SWAP con WETH (usa los 5 WETH)
    4. Comando 3: INFI_CL_POSITION_CALL — envía address(this).balance = 5 ETH residuales al position manager

    Si el usuario NO quería que esos 5 ETH fueran al position manager, los pierde.
    Si el usuario SÍ lo quería, el flujo es correcto pero frágil — depende del orden exacto.

    Caso problemático: si entre comando 1 y 3, otro actor (via callback) modifica el balance ETH
    del router. Pero los callbacks van al usuario, no al router (Lock previene reentrada externa).
  impact: "Pérdida de ETH residual no wrapeado si la secuencia de comandos no está cuidadosamente construida."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Después de WRAP_ETH con amount específico, verificar que el residual ETH es manejado
    uint256 ethAfterWrap = address(router).balance;
    uint256 expectedResidual = ghost_msgValue - ghost_wrapAmount;
    eq(ethAfterWrap, expectedResidual, "D-05: unexpected ETH residual after WRAP_ETH");
  ghost_vars:
  - uint256 internal ghost_msgValue;
  - uint256 internal ghost_wrapAmount;
  validated: false
  priority: medium
  confidence: 40
  notes: |
    Payments.wrapETH (línea 76-88): si amount != CONTRACT_BALANCE, solo wraps `amount` exacto.
    El residual queda en el router. Esto es by design — el usuario puede usar el residual en
    otro comando. Pero si no lo hace, queda para el siguiente usuario. Bajo riesgo porque el
    frontend normalmente construye la secuencia correctamente.

- id: D-06
  tier: 1
  type: property
  description: "SWEEP con amountMin=0 permite vaciar cualquier token/ETH del router sin verificación mínima — un atacante puede front-run para robar fondos residuales"
  attack_scenario: |
    1. Usuario A ejecuta secuencia compleja que deja 1000 USDC en el router temporalmente
       (e.g., swap con recipient=ADDRESS_THIS para usar en un segundo swap)
    2. Entre el bloque donde A envía la tx y su ejecución, un atacante ve la tx en el mempool
    3. Atacante envía tx con SWEEP(USDC, attacker, 0) — amountMin=0, así que acepta cualquier balance
    4. Si la tx del atacante se ejecuta primero... NO — el router tiene Lock, el atacante no puede
       entrar mientras A está ejecutando.

    Pero si A deja fondos después de su execute() (por FLAG_ALLOW_REVERT + swap fallido):
    5. Atacante en el siguiente bloque hace SWEEP(USDC, attacker, 0) y roba los USDC

    Esto es conocido y "by design" — el router NO debe tener fondos entre transacciones.
    Pero el vector es real si un integrador construye mal la secuencia.
  impact: "Robo de fondos residuales post-transacción. Limitado a fondos que queden en el router por error del integrador."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Cualquier usuario puede hacer SWEEP de cualquier token del router
    // Verificar que después de execute(), el router está vacío
    uint256 tokenBalance = ERC20(token).balanceOf(address(router));
    eq(tokenBalance, 0, "D-06: tokens left in router after execute");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: |
    Conocido de Uniswap UR — hay bots de MEV que monitorean el router para tokens residuales.
    No es un bug del contrato sino un riesgo de integración. amountMin=0 es el caso peligroso.
    Probablemente "by design" — el SWEEP es justamente la herramienta para que el usuario
    recupere fondos. El problema es que CUALQUIER usuario puede SWEEP, no solo el original.

- id: D-07
  tier: 1
  type: property
  description: "V3_POSITION_MANAGER_CALL pasa inputs directamente como calldata al position manager — la validación _checkV3PositionManagerCall puede ser bypassable con calldata crafteada"
  attack_scenario: |
    1. _checkV3PositionManagerCall valida que el caller es el owner del NFT o tiene approval
    2. Pero los inputs vienen directamente del usuario como bytes calldata
    3. Si _checkV3PositionManagerCall lee el tokenId de una posición en el input, pero el
       call real al position manager usa un tokenId diferente (por offset manipulation)...
    4. El check pasaría para tokenId X, pero la acción se ejecutaría sobre tokenId Y

    Vector específico: el assembly calldataload en dispatch() usa offsets fijos. Si los inputs
    están malformados (e.g., abi.encodePacked en vez de abi.encode), los offsets no coinciden
    con lo que _checkV3PositionManagerCall espera leer.

    NOTA: el contrato advierte "inputs must be ABI encoded using abi.encode()" pero no lo enforce.
  impact: "Si el check es bypassable, un atacante podría manipular posiciones NFT de otros usuarios a través del router."
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el tokenId que _checkV3PositionManagerCall valida
    // es el mismo que el position manager procesa
    // Esto requiere inspeccionar _checkV3PositionManagerCall — análisis estático
    // No se puede fuzzear sin ver la implementación del check
  ghost_vars: []
  validated: false
  priority: high
  confidence: 30
  notes: |
    Necesito leer _checkV3PositionManagerCall y _checkInfiClPositionManagerCall para evaluar.
    Si la validación parsea los mismos bytes que se envían al PM, es seguro.
    Si parsea de forma diferente (distinto offset, distinta interpretación), hay un gap.
    Los audits de Zellic/OtterSec/Hexens/Cyfrin probablemente cubrieron esto — confianza baja.

- id: D-08
  tier: 2
  type: property
  description: "TRANSFER con token=ETH (address(0)) y value=CONTRACT_BALANCE envía todo el ETH del router — no hay control de que el recipient sea el usuario original"
  attack_scenario: |
    1. pay() con token=Constants.ETH hace `recipient.safeTransferETH(value)`
    2. El recipient viene del input del usuario, mapeado por map()
    3. map() solo traduce sentinels (MSG_SENDER, ADDRESS_THIS) — cualquier otra address pasa tal cual
    4. Un usuario puede transferir ETH del router a CUALQUIER dirección
    5. Combinación: si hay ETH residual de otro usuario, TRANSFER(ETH, attacker, CONTRACT_BALANCE)
       envía todo a attacker

    Sin embargo: Payments.pay() con ETH NO soporta CONTRACT_BALANCE (solo ERC20 lo hace, línea 32-33).
    Con ETH, value se usa tal cual. Si value > balance, la tx reverts.

    Pero si value = balance exacto del router... el atacante necesitaría saber cuánto hay.
    Con SWEEP es más fácil (sweep envía todo el balance).
  impact: "Redundante con D-06 (SWEEP). TRANSFER requiere conocer el monto exacto, SWEEP no."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // TRANSFER con ETH: verificar que value <= msg.value del caller actual
    // (no fondos residuales de otros)
    // En la práctica esto es equivalente a D-06 pero más difícil de explotar
  ghost_vars: []
  validated: false
  priority: low
  confidence: 25
  notes: |
    Menor prioridad que D-06. SWEEP es el vector más directo para drenar el router.
    TRANSFER requiere especificar el monto exacto, lo cual es más difícil para un atacante.
    Incluido por completitud pero probablemente no es un finding independiente.

- id: D-09
  tier: 1
  type: property
  description: "UNWRAP_WETH envía todo el WETH balance del router como ETH — si hay WETH residual de otro usuario, el caller actual lo recibe"
  attack_scenario: |
    1. Usuario A ejecuta V3_SWAP con recipient=ADDRESS_THIS, recibe 1000 WETH en el router
    2. La tx de A tiene FLAG_ALLOW_REVERT en el siguiente comando (UNWRAP_WETH) que falla
    3. Los 1000 WETH quedan en el router
    4. Usuario B (o bot MEV) ejecuta: UNWRAP_WETH(recipient=B, amountMin=0)
    5. unwrapWETH9 llama WETH9.balanceOf(address(this)) = 1000 WETH
    6. Unwraps TODO y envía 1000 ETH a B

    Idéntico patrón a D-06 pero específico para WETH→ETH.
    La función unwrapWETH9 SIEMPRE unwraps el balance COMPLETO (línea 94).
    No acepta un monto específico — siempre es el full balance.
  impact: "Robo de WETH residual convertido a ETH. Impacto = cantidad de WETH que quede en el router."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // unwrapWETH9 siempre procesa el balance completo de WETH
    uint256 wethBefore = WETH9.balanceOf(address(router));
    // Después de unwrap por usuario B:
    uint256 wethAfter = WETH9.balanceOf(address(router));
    // El invariante: B solo debería unwrapear WETH que B depositó
    // Pero esto no se puede enforce a nivel de contrato — el router no trackea ownership
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: |
    Payments.unwrapWETH9 (línea 93-104) siempre hace balanceOf y unwraps todo.
    No hay parámetro para limitar el monto (solo amountMin como mínimo, no máximo).
    Es by design — el router asume que está vacío entre txs.
    El riesgo real es para integradores que dejen WETH en el router accidentalmente.

- id: D-10
  tier: 1
  type: property
  description: "INFI_SWAP ejecuta _executeActions con inputs arbitrarios — no hay validación de que las acciones del infinity swap sean coherentes con el flujo de fondos del plan padre"
  attack_scenario: |
    1. INFI_SWAP (línea 276) pasa `inputs` directamente a `_executeActions(inputs)` (BaseActionsRouter)
    2. _executeActions ejecuta un plan de acciones del Infinity pool (settle, take, swap, etc.)
    3. Dentro de _executeActions, el router interactúa con el Vault (infiVault)
    4. El router adquiere un lock del Vault y ejecuta acciones que modifican balances del Vault

    Pregunta clave: ¿_executeActions puede ser reentered desde un hook malicioso?
    Los hooks del Infinity pool se ejecutan durante el swap. Si un hook hace callback al router,
    y el Lock permite self-reentrancy... ¿puede el hook inyectar comandos extra?

    El hook llama al pool, que llama al router, que tiene Lock con self-reentry permitido.
    Pero el callback vendría del pool manager (no de address(this)), así que Lock lo bloquearía.

    A menos que el hook use EXECUTE_SUB_PLAN vía address(this)... pero el hook no tiene acceso
    a address(this).call directamente.
  impact: "Si un hook malicioso puede reentrar al router durante INFI_SWAP, podría manipular el estado de la tx en curso."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que durante _executeActions, no se puede reentrar al Dispatcher
    // desde un hook u otro contrato externo
    // El Lock debería prevenir esto, pero verificar edge cases
    bool locked = Locker.isLocked();
    t(locked, "D-10: router unlocked during _executeActions");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 35
  notes: |
    Este es un análisis que requiere leer BaseActionsRouter y cómo interactúa con el Vault.
    El Lock.isNotLocked() debería prevenir reentrada externa, pero hooks de Infinity pools
    son un vector menos obvio. Necesita investigación adicional del flujo completo.
    Los 4 audits previos probablemente cubrieron esto — confianza baja de que sea explotable.

false_positives:
- hunter: FlowHunter
  id: D-FP-01
  reason: "msg.value double-spend via multiple commands: DEBUNKED. El EVM previene esto — si un comando consume X ETH del balance, los siguientes comandos solo ven el balance reducido. msg.value es un valor informativo que no se 'consume', pero las operaciones reales usan address(this).balance. Intentar gastar más de lo disponible reverts."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "msg.value en Universal Routers NO es double-spendable. Las operaciones (WETH.deposit, safeTransferETH) usan el balance real del contrato, no msg.value. Si el balance es insuficiente, la tx reverts."
    briefing_update_applied: false

- hunter: FlowHunter
  id: D-FP-02
  reason: "Reentrancy via V2 swap callback (pancakeCall): V2 swaps hacen callback al router para recibir tokens. Pero el Lock está activo durante execute(), y el callback viene del par V2 (no de address(this)), así que Lock lo bloquearía si intentara reentrar execute(). La función v2SwapExactInput probablemente maneja el callback internamente sin pasar por dispatch()."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
