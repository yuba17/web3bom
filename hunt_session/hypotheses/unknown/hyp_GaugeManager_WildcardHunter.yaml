  - id: GM-W-08
    tier: 1
    type: property
    description: >
      NOVEL HIGH-VALUE FINDING: compoundRewards adds liquidity with amount0Min=0 and amount1Min=0
      in the increaseLiquidity call (line 491). This means the position owner accepts ANY outcome
      from addLiquidity, including being given zero liquidity even when tokens are provided.

      The attack scenario from AccessHunter GM-A-03 identified the 0 slippage issue.
      This hypothesis extends it: specifically, the SEQUENCE of operations creates a sandwich window.

      Timeline of compoundRewards:
      1. gauge.withdraw(tokenId) — NFT leaves gauge, goes to GM
      2. _swapAeroForPosition — N swaps happen with TWAP protection (good)
      3. _addLiquidity:
         a. safeIncreaseAllowance(NPM, maxAdd0/1) — GM approves NPM
         b. NPM.increaseLiquidity(tokenId, maxAdd0, maxAdd1, 0, 0, deadline) — adds at current price
         c. safeApprove(NPM, 0) — allowance reset
      4. gauge.deposit(tokenId) — NFT back to gauge

      The sandwich window is step 3b: after the swap protections in step 2, but before the
      liquidity add. An MEV bot can:
      a. Let step 2 (swap) complete — can't front-run the whole tx atomically in Solidity
      b. Observe the pending tx, front-run step 3b specifically by executing between blocks
      — but this is impossible since steps 2 and 3 are in the same transaction.

      HOWEVER: the positionPool used in two-hop routing IS the same pool that addLiquidity
      uses. The two-hop swap at step 2 MOVES the positionPool price. Then addLiquidity at step 3
      uses the NEW (post-swap) price. If the two-hop swap moved the price out of the position's
      tick range, addLiquidity adds 0 of one token (as noted in GM-W-02). No sandwich needed.
      The position pool self-interference creates the slippage without any external attacker.

      THE REAL NOVEL FINDING: The `deadline` parameter in compoundRewards controls ONLY the
      increaseLiquidity deadline, NOT the swaps. The swaps in _swapThroughPool use
      sqrtPriceLimitX96 = MIN/MAX_SQRT_RATIO ± 1 (no price limit on the swap itself).
      The TWAP check happens BEFORE the swap in _validateSwap. But if the block timestamp
      advances past the deadline BETWEEN the TWAP check and the increaseLiquidity call,
      the liquidity add reverts but the swaps have already executed — AERO was already spent
      on token0/token1, the NFT is withdrawn from gauge but not re-deposited.

      Wait — the revert propagates and undoes everything (EVM atomicity). So deadline expiry
      still reverts the whole transaction. The deadline only affects the final state of
      increaseLiquidity, and since it all reverts, the position is safe.

      BUT: if deadline == block.timestamp and a slow block includes the tx AFTER the deadline,
      the whole compound reverts with expired deadline. The position remains staked (all reverted),
      but the user passed a deadline they thought was valid. This is standard deadline behavior.
    attack_scenario: >
      The deadline parameter only checks at increaseLiquidity time. If set to block.timestamp,
      a block producer could deliberately include the tx late (after deadline) to make it fail,
      preventing compounding of a competitor's position. With deadline = block.timestamp + N,
      the N-second window protects against this. This is standard MEV and not a GaugeManager bug.
      The more interesting case: the deadline passed by compoundRewards to increaseLiquidity
      is a USER-PROVIDED value. If the user passes deadline = 0 (or type(uint256).max),
      the liquidity add is deadline-unlimited. This is valid for owner-initiated compounds.
      No protocol enforcement of minimum deadline.
    solidity: |
      // Property: deadline passed to compoundRewards must be > block.timestamp
      // Otherwise the increaseLiquidity call will revert with "Transaction too old"
      // For fuzzing: ensure deadline is always > block.timestamp when testing compound.
      //
      // Observed gap: no minimum deadline enforcement in compoundRewards parameter.
      // A user can pass deadline = 0, which will always fail increaseLiquidity.
      // This creates a "compound that always reverts" state if the owner is confused.
      //
      // But since EVM reverts everything atomically, this is just user error, not a bug.
      function invariant_deadline_gt_timestamp(uint256 deadline) public view returns (bool) {
          return deadline > block.timestamp;
      }
    validated: true
    priority: low
    confidence: 40
    notes: >
      The deadline issue is standard and well-known. The novel angle (self-interference of
      positionPool two-hop swap with addLiquidity price) is covered better in GM-W-02.
      This hypothesis confirms no additional deadline-specific vulnerability beyond user error.
      The key finding from this analysis: the swaps use NO deadline (only sqrtPriceLimit),
      so a tx that is delayed in the mempool executes the swaps at whatever current price
      the TWAP allows, but the addLiquidity is time-bounded. The combination means:
      swaps execute but liquidity add fails if too delayed → entire tx reverts. Safe.

