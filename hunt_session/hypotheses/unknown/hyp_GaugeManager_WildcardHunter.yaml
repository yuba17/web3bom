  - id: GM-W-04
    tier: 1
    type: property
    description: >
      _addLiquidity skips increaseLiquidity entirely when BOTH maxAddAmount0 == 0 AND
      maxAddAmount1 == 0. This happens when amount0Out == 0 AND amount1Out == 0, which
      occurs when aeroSplitBps == 0 AND token1 == aeroToken (the passthrough returns
      (amountIn, amountIn) = (aeroAmount, aeroAmount) for amount0Out=0 because requestedAero0=0,
      and amount1Out = aeroAmount as passthrough), OR when all swaps produced zero output.

      ACTUALLY: Let's trace aeroSplitBps=0 precisely:
      - requestedAero0 = 0, requestedAero1 = aeroAmount
      - _swapAeroToTarget(positionPool, token0, token1, 0) → returns (0, 0) [amountIn=0 early return]
      - _swapAeroToTarget(positionPool, token1, token0, aeroAmount) → swaps aeroAmount for amount1Out
      - state.amount0Out = 0, state.amount1Out = amount1Out
      - maxAddAmount0 = 0 * Q64 / ... = 0
      - maxAddAmount1 = amount1Out * Q64 / (reward + Q64) > 0
      - Condition: maxAddAmount0 != 0 || maxAddAmount1 != 0 → TRUE (maxAddAmount1 > 0)
      - So addLiquidity IS called with amount0Desired=0, amount1Desired=maxAddAmount1
      - NPM handles this correctly (adds only token1 liquidity if position favors it)

      The TRUE skip case is when amount0Out=0 AND amount1Out=0, which requires:
      aeroSplitBps=0 AND token1 has a configured base pool BUT the swap produced zero output
      (e.g., price is at a limit and amountOutMin > 0 causes SlippageError before reaching zero).
      Actually if swap reverts, compoundRewards reverts — the skip case is unreachable normally.

      REAL EDGE CASE: position is fully out of range on BOTH sides. increaseLiquidity is called
      with amount0Desired > 0 and amount1Desired > 0 but the NPM returns amountAdded0=0 and
      amountAdded1=0 (position at a tick boundary where both are zero). Then:
      rewardAmount0 = 0, rewardAmount1 = 0.
      leftover0 = amount0Out - 0 - 0 = amount0Out (ALL sent to owner as leftover).
      leftover1 = amount1Out - 0 - 0 = amount1Out (ALL sent to owner as leftover).
      Protocol earns ZERO fee. Position gets ZERO added liquidity.
      The compound "succeeds" but adds nothing. Owner gets everything back as leftovers.
      minAeroReward only protects the AERO claim threshold, not the position outcome.
    attack_scenario: >
      An out-of-range position staked in GaugeManager can be compounded indefinitely.
      Each compound: claims AERO rewards, swaps to token0/token1, adds 0 liquidity
      (position out of range), returns all tokens to owner as leftover.
      Protocol fee = 0 (rewardAmount = 0 when amountAdded = 0).
      The compound function works correctly (no fund loss) but the protocol earns nothing.

      More interestingly: if a BORROWER has an out-of-range staked position, they can call
      compoundRewards (as owner, directly on GaugeManager) to continuously extract AERO rewards
      as token0/token1 leftovers WITHOUT the vault's health check. The compound converts AERO
      to token0/token1 and sends them directly to the owner. For a leveraged borrower, this
      extracts value from the position (reduces future yield) without the vault detecting it.

      HOWEVER: the position's liquidity value does NOT decrease (NPM added nothing, so nothing
      was removed). The tokens sent to owner were AERO rewards converted to other tokens.
      The vault's collateral value (based on LP position NFT) is unchanged.
      So health is maintained. This is by design — AERO is not part of the collateral anyway.
    solidity: |
      // Property: if compound call adds zero liquidity (amountAdded0=0 AND amountAdded1=0),
      // the position must be out of range (this is the only legitimate reason).
      // If in-range position has both amountAdded = 0, there's an accounting bug.
      //
      // Note: this requires position tick data from NPM.
      // Simplified: after compound, if both amountAdded are 0, position should be confirmed OOR.
      function invariant_zero_liquidity_add_implies_out_of_range(
          uint256 tokenId,
          uint256 amountAdded0,
          uint256 amountAdded1
      ) public view returns (bool) {
          if (amountAdded0 == 0 && amountAdded1 == 0) {
              // Verify position is out of range
              (,, address token0, address token1, uint24 fee, int24 tickLower, int24 tickUpper,,,,,) =
                  npm.positions(tokenId);
              IUniswapV3Pool pool = IUniswapV3Pool(factory.getPool(token0, token1, fee));
              (, int24 currentTick,,,,) = pool.slot0();
              return currentTick < tickLower || currentTick >= tickUpper;
          }
          return true;
      }
    validated: true
    priority: medium
    confidence: 75
    notes: >
      The zero-add case is a real edge case that produces correct behavior (no fund loss) but
      zero protocol fee and no position improvement. Worth testing to confirm behavior matches
      expectation. The owner-direct compound path extracting AERO as leftovers without vault
      health check is by design and not exploitable since AERO rewards don't affect LP collateral value.

  - id: GM-W-05
    tier: 1
    type: property
    description: >
      _swapAeroToTarget intermediate routing asymmetry: when called for the token0 leg,
      the "other token" is token1. When called for the token1 leg, the "other token" is token0.
      If NEITHER rewardBasePools[token0] NOR rewardBasePools[token1] is set, both legs revert.
      If ONLY rewardBasePools[token0] is set:
      - token0 leg: direct AERO→token0 via rewardBasePools[token0]. OK.
      - token1 leg: no direct pool, uses intermediate = rewardBasePools[token0] (otherToken=token0).
        Does AERO→token0 via rewardBasePools[token0], then token0→token1 via positionPool.

      This means for the token1 leg using the two-hop path, the positionPool is used for
      token0→token1 swap. SIMULTANEOUSLY, for the token0 leg (if it uses direct route),
      no positionPool usage. So only the token1 leg uses the positionPool.

      BUT: if the pool between AERO and token0 (rewardBasePools[token0]) has low liquidity,
      both legs hammering it in the same transaction create high slippage:
      - token0 leg: buys token0 with X aero → moves price
      - token1 leg: buys token0 with Y aero (for intermediate) → moves price MORE

      The token1 leg's TWAP check (for the AERO→token0 pool) is done at call time for
      that specific _swapThroughPool invocation, but the TWAP (60-second time-weighted average)
      doesn't change within the same block. Both calls use the same TWAP but different
      current prices (second call is post-first-swap). The 200-tick tolerance means a
      ~2% move doesn't fail the check, but both calls hitting the same low-liquidity pool
      can cause the second call to exceed the tolerance if the first already moved it significantly.
    attack_scenario: >
      Attack vector: Depleted base pool griefing.
      1. Pool AERO/token0 has low liquidity (recently initialized or drained).
      2. Large compound call routes both legs through it:
         - Direct token0 leg buys token0 (moves pool price).
         - Two-hop token1 leg tries to buy token0 via same pool.
      3. If the first swap moved the price by > 200 ticks (REWARD_MAX_TWAP_TICK_DIFFERENCE),
         the second call fails the TWAP check → compoundRewards reverts.
      4. Position is temporarily unstaked (gauge.withdraw already called at line 276).
         tokenIdToGauge[tokenId] is still set.
      5. The compound reverts. But wait: the revert bubbles up from _swapAeroForPosition.
         This is BEFORE _addLiquidity and gauge.deposit. The gauge.withdraw at line 276
         already happened (NFT left gauge). The revert at line 277 (_swapAeroForPosition)
         propagates to compoundRewards() which reverts the entire transaction.
         Since EVM reverts undo all state changes, gauge.withdraw is also reverted.
         NFT is back in gauge. tokenIdToGauge is unchanged. State is clean.

      CONCLUSION: The revert in the swap step is actually safe due to EVM atomicity.
      The compound fails but leaves no permanent state damage. This is a DoS/liveness
      concern when the base pool has insufficient depth, not a fund-loss scenario.

      THE REAL ISSUE: An attacker can deliberately drain the base pool before a large compound
      call to grief the compound and force it to fail repeatedly. This is economically
      rational for a competitor who wants the position to NOT earn compound rewards.
    solidity: |
      // Property: if rewardBasePools[token0] is set but rewardBasePools[token1] is not,
      // a large compound call must not revert due to accumulated price impact on shared pool.
      // Observable via: both legs must succeed independently AND in sequence.
      //
      // Test: configure only rewardBasePools[token0], run compoundRewards with large aeroAmount.
      // If the second leg (two-hop via rewardBasePools[token0]) fails TWAP check after first leg
      // already moved the price, the compound reverts. Measure at what aeroAmount threshold this occurs.
      //
      // Invariant to fuzz:
      function invariant_compound_not_blocked_by_shared_pool_price_impact(
          uint256 aeroAmount
      ) public view returns (bool) {
          // After a compound with a given aeroAmount, if only one base pool is configured,
          // the compound must succeed OR explicitly report NotEnoughReward/SlippageError
          // rather than TWAPCheckFailed (the latter indicates the shared pool was moved too much).
          // Cannot express statically — requires call interception.
          // Fuzz target: track whether TWAPCheckFailed occurs specifically on the second
          // _swapThroughPool call when both legs share a base pool.
          return true; // placeholder
      }
    validated: false
    priority: high
    confidence: 70
    notes: >
      This is the shared-base-pool compound griefing attack. Novel angle: the SAME pool is
      used sequentially by both swap legs when only one base pool is configured. The first
      swap's price impact can cause the second swap's TWAP check to fail if the pool is
      thin. An attacker can drain the base pool to make large compounds revert (DoS).
      Since rewards continue accruing but cannot be claimed via compound, the owner is forced
      to use claimRewards instead (losing compounding benefits). Not a permanent lock
      (plain unstake + claim works), but a griefing attack on compounding efficiency.

  - id: GM-W-06
    tier: 1
    type: property
    description: >
      _claimRewardsToSelf uses balance delta measurement: aeroBefore = balanceOf(GM),
      IGauge.getReward(tokenId), aeroAmount = balanceAfter - aeroBefore.
      This correctly isolates ONLY the newly received AERO from this specific claim.

      However, _claimRewardsToSelfBestEffort (used in unstake) has an extra check:
        try IGauge(gauge).getReward(tokenId) {
            uint256 aeroAfter = aeroToken.balanceOf(address(this));
            if (aeroAfter > aeroBefore) { aeroAmount = aeroAfter - aeroBefore; }
        } catch {}

      The `if (aeroAfter > aeroBefore)` guard means: if aeroAfter == aeroBefore (the gauge
      returned 0 rewards), aeroAmount = 0. Correct.

      BUT: the guard also means: if a malicious gauge or reentrancy during getReward() causes
      GaugeManager's AERO balance to DECREASE (by transferring AERO out of GM via some external
      mechanism during the try block), then aeroAfter < aeroBefore. The guard catches this
      (returns 0 instead of underflowing). This is a defense. Good.

      The ACTUAL edge case: what if getReward() succeeds but transfers LESS AERO than expected
      (e.g., gauge has a reserve that reduces payouts)? aeroAfter > aeroBefore is true,
      aeroAmount = actual received amount. This is handled correctly.

      REAL ISSUE: If the gauge's getReward emits AERO to an intermediate contract first,
      and THAT contract then transfers to GaugeManager, the balance delta is still correct
      (it measures what landed in GM, not what the gauge emitted). If the intermediate
      contract skims some AERO before forwarding, the owner loses rewards. This is a
      gauge trust assumption, not a GaugeManager bug.

      THE NOVEL ANGLE: During compoundRewards, _claimRewardsToSelf is called FIRST. If this
      claim returns aeroAmount > 0, then later when the same tokenId is part of an unstake
      (e.g., vault.liquidate during the same block as a failed compound from a prior attempt),
      _claimRewardsToSelfBestEffort will find 0 rewards (already claimed). This is correct
