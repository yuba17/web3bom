      as msg.sender = vault. Inside that call, the compound does gauge.withdraw(tokenId) then
      gauge.deposit(tokenId). After gauge.deposit, the gauge calls NPM.collect() which triggers
      NPM callbacks. At this point, the gauge-NFT is being deposited and the vault's
      transformedTokenId is set.

      NOW: what if the vault's onERC721Received is triggered during this flow?
      - gauge.deposit calls NPM.safeTransferFrom(msg.sender=GaugeManager, gauge, tokenId)
      - NPM records the new owner as gauge
      - No onERC721Received called on vault (NFT is going TO the gauge, not the vault)

      The vault's onERC721Received is only triggered when an NFT is transferred TO the vault.
      During compound, the NFT goes GaugeManager→gauge, not to vault.

      HOWEVER: in _transform, AFTER the compound (line 536) and AFTER _unstakeIfNeeded (line 539),
      the vault does nonfungiblePositionManager.approve(transformer, tokenId) (line 542).
      But wait — if compoundRewardsFirst ran and the position was re-staked during compound
      (compound leaves it in gauge), then _unstakeIfNeeded (line 539) calls unstakeIfStaked
      which calls _unstakePosition → gauge.withdraw → NFT comes back to GaugeManager →
      GaugeManager.safeTransferFrom(GM, vault, tokenId) → vault.onERC721Received is triggered
      with transformedTokenId already set to tokenId.

      In vault.onERC721Received with oldTokenId == tokenId (same token being returned):
        `if (tokenId != oldTokenId)` → FALSE → the if block is skipped.

      WAIT — the code checks `uint256 oldTokenId = transformedTokenId`. If transformedTokenId == tokenId,
