    validated: false
    priority: medium
    confidence: 50
    notes: >
      This is a gauge trust assumption vulnerability. With standard Aerodrome CLGauge, safe.
      With a non-standard gauge that calls safeTransferFrom(GaugeManager, ...) during deposit,
