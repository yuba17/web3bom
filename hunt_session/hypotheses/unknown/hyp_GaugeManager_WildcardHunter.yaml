  - id: GM-W-03
    tier: 1
    type: property
    description: >
      compoundRewards has this sequence:
        1. _claimRewardsToSelf → AERO lands in GaugeManager
        2. IGauge.withdraw(tokenId)
        3. _swapAeroForPosition → AERO spent, token0/token1 land in GaugeManager
        4. _addLiquidity → token0/token1 approved to NPM, NPM pulls amountAdded0/1
        5. [ALLOWANCE RESET] safeApprove(NPM, 0) called if maxAddAmount != 0
        6. token0BeforeDeposit = balanceOf(token0) ← snapshot AFTER NPM pulled tokens
        7. IGauge.deposit(tokenId) → triggers NPM.collect, fees land in GaugeManager
        8. _sendDepositDeltas(token0Before=step6) → sends delta to owner
        9. _sendLeftoversAndRewards → sends (amount0Out - amountAdded0 - rewardAmount0) to owner

      PROBLEM: In step 6, token0BeforeDeposit = balanceOf(token0) includes any protocol fees
      (rewardAmount0) from THIS compound call that are NOT yet sent anywhere (they stay in GM
      as protocol fee). The snapshot at step 6 is AFTER addLiquidity removed amountAdded0 from GM.
      At this point, GM holds: (amount0Out - amountAdded0) = rewardAmount0 + leftover0.

      When gauge.deposit fires NPM.collect and sends fees to GM (step 7), the delta =
      token0After - token0Before = depositFees0 (correct, fees attributed to owner).

      THEN in step 9: leftover0 = amount0Out - amountAdded0 - rewardAmount0 is ALSO sent to owner.

      BOTH depositFees0 (via sendDepositDeltas) AND leftover0 (via sendLeftoversAndRewards)
      are sent to owner. BUT rewardAmount0 stays in GM. If depositFees0 + leftover0 + rewardAmount0
      > token0 balance in GM before step 9, the transfer in step 9 (leftover0) REVERTS.

      For this to happen: the gauge deposit must return FEWER tokens than the balance snapshot
      would imply. Specifically: if gauge.deposit() calls NPM.collect() which returns LESS than
      what the snapshot expected (e.g., another concurrent call already collected those fees),
      the balance at step 7 could be lower than step 6, making delta NEGATIVE (underflow in
      _sendDepositDeltas since it only transfers when token0After > token0Before — no negative).
      So sendDepositDeltas is safe. But the OVERALL balance after sendDepositDeltas might be
      less than rewardAmount0 + leftover0 needed by sendLeftoversAndRewards.
    attack_scenario: >
      Scenario: Protocol fees (rewardAmount0) from a PREVIOUS compound are sitting in GaugeManager.
      A new compound for a DIFFERENT position (same token0) is initiated.

      Assume (simplified):
      - Prior protocol fees in GM: 1000 token0
      - Current compound: amount0Out = 500, amountAdded0 = 400, rewardAmount0 = 8, leftover0 = 92

      Step 6 snapshot: token0Before = 1000 (prior fees) + (500 - 400) = 1000 + 100 = 1100
      (GM holds: prior_fees(1000) + post-add-leftover(100) = 1100)

      Step 7: gauge.deposit triggers collect, adds depositFees0 = 50 token0 to GM
      token0After = 1150. delta = 50 → sent to owner. GM now holds 1100.

      Step 9: _sendLeftoversAndRewards sends leftover0 = 92 to owner. GM goes from 1100 to 1008.
      rewardAmount0 = 8 stays in GM as protocol fee. Final GM balance = 1008.
      Total expected protocol fee accumulation = prior_fees(1000) + new_fee(8) = 1008. Correct.

      This seems fine. But what if step 7 (gauge deposit) CONSUMES from GM instead of sending?
      For example, if the Slipstream gauge.deposit does NOT call collect for this specific position
      (e.g., position has 0 accumulated fees), token0After = token0Before, delta = 0.
      Then step 9: GM holds 1100 - 0 = 1100. leftover0 = 92 sent → GM = 1008. Correct.

      The actual exploit requires a gauge implementation where deposit TAKES tokens FROM GM
      rather than sending to it. With the standard Aerodrome CLGauge, this cannot happen.
      However: if a gauge implementation pulls extra tokens from msg.sender during deposit
      (e.g., some fee-on-deposit gauge), the balance would DROP at step 7, potentially making
      the total tokens in GM insufficient for the leftover0 transfer in step 9.

      This is a TRUST ASSUMPTION on gauge behavior: gauge.deposit() must not pull tokens from
      GaugeManager beyond approving the NFT. If a malicious/buggy gauge pulls token0/token1
      during deposit, _sendLeftoversAndRewards will revert, permanently locking the compound.
    solidity: |
