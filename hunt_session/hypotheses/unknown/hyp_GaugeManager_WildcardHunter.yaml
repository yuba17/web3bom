    description: >
      AERO double-counting when token0=AERO. Initial concern: spentAero includes AERO not
      physically transferred, and leftover0 sends AERO as token0 leftovers. Full trace:
      spentAero = requestedAero0 + requestedAero1 = aeroAmount (always by construction).
      leftoverAero = 0. leftover0 = amount0Out - amountAdded0 - rewardAmount0 is sent
      as token0 (= AERO). rewardAmount0 stays in GM as protocol fee (also AERO).
      Total AERO dispensed: amountAdded0 (into position) + rewardAmount0 (protocol fee) +
      leftover0 (owner leftover) = amount0Out = requestedAero0. Plus requestedAero1 went
      to the AERO→token1 swap. Grand total = requestedAero0 + requestedAero1 = aeroAmount.
      BALANCED. No double-counting.
