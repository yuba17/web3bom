      migration block is skipped. The function just returns the selector. But this means:
      when the staked NFT returns to the vault during _unstakeIfNeeded within a _transform call,
      the vault's onERC721Received does NOTHING (just returns selector). The position IS in the
      vault now (NFT received), but onERC721Received didn't re-initialize any state. This is fine
      because the position was already tracked in tokenOwner[tokenId] from its original deposit.

      THE ACTUAL ISSUE: if compoundRewards produces a NEW tokenId (it doesn't — it uses the same
      tokenId throughout), but what if a future integration uses range-and-compound that mints a
      new position? AutoRangeAndCompound is a separate transformer, not part of GaugeManager.compound.
