      // must be sufficient to cover (leftover0 + rewardAmount0).
      // This is equivalent to: (amount0Out - amountAdded0) <= GM.token0Balance after deposit.
      //
      // Since _sendDepositDeltas sends depositFees and sendLeftoversAndRewards sends leftover:
      // GM balance post-compound = prior_fees + rewardAmount0 (only retained amount)
      //
      // Ghost tracking:
      uint256 ghost_prior_fees_token0; // accumulated from previous compounds
      // After compound, GM must hold >= ghost_prior_fees_token0 + rewardAmount0
      function invariant_gm_balance_covers_rewards_after_compound() public view returns (bool) {
          // After compoundRewards returns:
          return IERC20(token0).balanceOf(address(gaugeManager)) >=
