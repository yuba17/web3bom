# ============================================================================
# H-11: Pause traps funds — no emergency withdrawal mechanism
# ============================================================================
- id: ORC-W-11
  tier: 2
  type: property
  description: >
    Oracle.pause() (line 460) pauses all provider operations. While paused: depositUSDC,
    withdrawUSDC, createPool, atomicDeposit, collectFees ALL revert (whenNotPaused modifier).
    However, SettlementPool functions only check onlyOracle (msg.sender == oracle address).
    The pause is on the ORACLE, not on the pools. If the admin pauses the oracle, all funds
    in pools are trapped — no one can withdraw. The parties themselves can still call
    depositUSDC(amount, transferUuid) directly on the pool (onlyParties modifier), but there
    is NO party-callable withdrawal function. ALL withdrawal paths go through the Oracle.

    So: pause = all pool funds frozen. If admin key is lost while paused, funds are
    permanently frozen.
  attack_scenario: >
    1. Admin pauses Oracle (legitimate emergency action).
    2. While paused, no withdrawals from any pool are possible.
    3. Admin loses key or is compromised → cannot unpause.
    4. All USDC across all pools is permanently frozen.

    Alternatively: malicious admin pauses to hold funds hostage.
  impact: "Medium: pause creates a fund-trapping scenario with no emergency escape hatch"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // All withdrawal paths require whenNotPaused on Oracle:
    // - withdrawUSDC: line 257 whenNotPaused
    // - processTreasuryManagementWithdrawals: line 194 whenNotPaused
    // - collectFees: line 30 whenNotPaused
    //
    // Parties can deposit directly (SettlementPool.depositUSDC, line 223, onlyParties)
    // But NO party-callable withdrawal exists
    // All withdrawals are onlyOracle -> Oracle is paused -> blocked
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    This is a centralization risk. Most Immunefi programs exclude admin-can-rug scenarios.
    However, the LACK of an emergency withdrawal mechanism for parties is a design concern.
    Parties deposited their USDC and have no self-service way to retrieve it.
  poc_sketch: ''
  call_stack: 'admin -> pause() -> all Oracle functions revert -> pool.withdrawUSDC only callable by oracle -> oracle is paused -> funds frozen'
  kill_signals:
    - "Centralization risk — likely excluded by Immunefi scope"
    - "Pause is a standard safety mechanism; inability to withdraw while paused is often by design"
    - "Check if there's a timelock on the admin role"

