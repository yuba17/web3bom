# ============================================================================
# H-01: grantRole PROVIDER_ROLE override always reverts — numProviders desync
# ============================================================================
- id: ORC-W-01
  tier: 1
  type: property
  description: >
    Oracle.grantRole() override for PROVIDER_ROLE always reverts due to ordering bug.
    Line 439 calls super.grantRole() FIRST (which grants the role via _grantRole internally),
    then line 442 checks require(!hasRole(PROVIDER_ROLE, account)) — but the role is ALREADY
    granted, so hasRole returns true, !hasRole is false, and the require reverts.
    This means grantRole(PROVIDER_ROLE, addr) is a dead code path. Only addProvider() works
    (it calls _grantRole directly, bypassing the override). While the immediate impact is that
    grantRole reverts (so no state change occurs), the real concern is that the developer
    INTENDED this to keep numProviders in sync — the broken logic reveals the counter is fragile
    and depends on all callers using addProvider/removeProvider exclusively. See ORC-W-02 for
    the actual exploit.
  attack_scenario: >
    Admin calls grantRole(PROVIDER_ROLE, newProvider) expecting it to work (it's a standard
    OZ pattern). Transaction reverts unexpectedly. Admin must use addProvider() instead.
    The broken override is evidence of incomplete provider counter management — see ORC-W-02.
  impact: "Low direct impact (revert = no state change), but reveals systemic counter desync risk"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // In test: call grantRole(PROVIDER_ROLE, addr) and expect revert
    // This proves the override is broken
    vm.prank(admin);
    vm.expectRevert("Oracle: Provider already added.");
    oracle.grantRole(PROVIDER_ROLE, newProvider);
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    Line 438-446 of Oracle.sol. The order is: super.grantRole (grants role) then
    require(!hasRole) (checks AFTER grant). Should be: check FIRST, then grant.
    This is a confirmed logic bug but with low direct impact since the tx just reverts.
  poc_sketch: ''
  call_stack: 'grantRole() -> super.grantRole() -> _grantRole() [role granted] -> hasRole() returns true -> require(!true) -> REVERT'
  kill_signals:
    - "If the protocol never intends anyone to call grantRole directly (only addProvider), this is informational"
    - "Check if any off-chain system or multisig calls grantRole instead of addProvider"

# ============================================================================
# H-02: renounceRole bypasses numProviders counter — permanent system brick
# ============================================================================
- id: ORC-W-02
  tier: 1
  type: property
  description: >
    Oracle overrides grantRole and revokeRole to track numProviders, but does NOT override
    renounceRole(). OpenZeppelin's AccessControl.renounceRole() calls _revokeRole() directly,
    which bypasses the numProviders decrement in the revokeRole override.
    A provider can call renounceRole(PROVIDER_ROLE, self) to remove their own provider role
    WITHOUT decrementing numProviders. If the last provider does this:
    1. numProviders remains 1 (stale)
    2. Zero actual providers exist
    3. All PROVIDER_ROLE functions (deposit, withdraw, createPool, etc.) are permanently
       inaccessible — no one has the role to call them
    4. Admin can addProvider(newAddr) — numProviders goes to 2 (should be 1)
    5. Now removeProvider has numProviders=2, so it can remove this provider — numProviders
       goes to 1, but there are again 0 real providers
    6. The "Cannot remove the only provider" guard is permanently broken
  attack_scenario: >
    Step 1: Only one provider exists (numProviders=1).
    Step 2: Provider calls renounceRole(PROVIDER_ROLE, self) — succeeds via OZ base.
    Step 3: numProviders is still 1, but no address actually has PROVIDER_ROLE.
    Step 4: All pool operations (deposits, withdrawals, settlements) are blocked.
    Step 5: Funds in existing SettlementPools are trapped — withdrawUSDC requires PROVIDER_ROLE.
    Step 6: Admin adds new provider — numProviders becomes 2 (wrong, should be 1).
    Step 7: Counter is permanently desynced. The "minimum 1 provider" invariant is broken.

    MALICIOUS SCENARIO: A compromised or rogue provider can brick the entire system by
    renouncing, especially if they are the sole provider. Even with multiple providers,
    each renounce desync the counter by -1, eventually allowing removal of the truly last provider.
  impact: >
    Critical: all USDC in all SettlementPools becomes permanently inaccessible if sole
    provider renounces. The Oracle controls ALL pool operations. No provider = no withdrawals,
    no deposits, no settlements. Funds are trapped until admin adds a new provider, but
    the counter remains desynced permanently.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Prove renounceRole bypasses numProviders
    // Setup: admin deploys Oracle, adds 1 provider
    oracle.addProvider(provider1); // numProviders = 1

    // Provider renounces via OZ base function
    vm.prank(provider1);
    oracle.renounceRole(PROVIDER_ROLE, provider1);

    // numProviders is STILL 1, but no one has the role
    assertFalse(oracle.hasRole(PROVIDER_ROLE, provider1));
    // numProviders getter not public, but the effect is:
    // admin can now removeProvider on the NEXT provider added (guard passes with numProviders > 1)

    // All pool operations revert — no one has PROVIDER_ROLE
    vm.expectRevert(); // AccessControl revert
    oracle.withdrawUSDC(user, 1000, poolUuid, transferUuid);
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 92
  notes: >
    Lines 448-457 override revokeRole. Lines 438-446 override grantRole. But renounceRole
    in OZ AccessControl is: function renounceRole(bytes32 role, address account) public virtual override {
    require(account == _msgSender()); _revokeRole(role, account); }
    _revokeRole does NOT go through revokeRole override — it's internal.
    This is a CLASSIC AccessControl override incompleteness bug.
  poc_sketch: |
    function test_renounceRole_bricks_system() public {
        oracle.addProvider(provider1);
        assertEq(oracle.hasRole(PROVIDER_ROLE, provider1), true);

        vm.prank(provider1);
        oracle.renounceRole(PROVIDER_ROLE, provider1);

        // Provider role removed but numProviders not decremented
        assertEq(oracle.hasRole(PROVIDER_ROLE, provider1), false);

        // Try to use any provider function - should revert
        vm.prank(provider1);
        vm.expectRevert();
        oracle.depositUSDC(user, 100e6, poolUuid, transferUuid);
    }
  call_stack: 'renounceRole() [OZ base] -> _revokeRole() [internal, bypasses revokeRole override] -> role removed, numProviders unchanged'
  kill_signals:
    - "If Immunefi considers provider a trusted role and renounce is self-sabotage, may be downgraded"
    - "Check if renounceRole is disabled in the deployed version (not in current source)"
    - "Counter desync is factual even if the DoS scenario requires malicious provider"

