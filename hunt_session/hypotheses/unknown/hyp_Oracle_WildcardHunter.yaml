    Flash loan + approval attack (focus area #8) is NOT viable. The deposit flow requires
    the user to have approved USDC to the pool AND the provider to call the Oracle function.
    An attacker cannot control both timing and the provider call. Flash loans don't help
    because the attacker's USDC would be flash-loaned and returned in the same tx, but
