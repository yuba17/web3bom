# ============================================================================
# H-04: Factory.setOracleAddress can orphan existing pools
# ============================================================================
- id: ORC-W-04
  tier: 2
  type: property
  description: >
    Factory.setOracleAddress(newOracle) (line 103) updates the oracle reference. All existing
    pools derive their oracle via factory.oracle(). So changing the oracle immediately changes
    access control for ALL existing pools. The new oracle can call all onlyOracle functions
    on existing pools (withdraw, deposit, addOtherParty). The old oracle loses access instantly.
    Combined with Oracle.pools[] mapping: the OLD Oracle has pool addresses cached in its
    pools[] mapping, but calling getPool then operating on those pools will fail because
    the pools now check msg.sender against the NEW oracle.
    If the new oracle is malicious or misconfigured, it can drain all pools.
  attack_scenario: >
    1. Factory owner sets new oracle to attacker-controlled address.
    2. Attacker's oracle contract calls pool.withdrawUSDC() to drain all USDC.
    3. Or: factory owner accidentally sets oracle to address(0) — no zero-address check in
       setOracleAddress. All onlyOracle modifiers would compare msg.sender to address(0),
       permanently locking all pool operations.
    Wait — actually setOracleAddress has NO zero-address check (unlike the Oracle's
    setSettlementPoolFactory which does check). This is a gap.
  impact: >
    Critical if factory owner is compromised: all pool funds can be drained via malicious oracle.
    Medium if accidental: setting oracle to zero address bricks all pool operations permanently.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Factory.setOracleAddress has NO zero address check
    // Line 103-106 of SettlementPoolFactory.sol
    function setOracleAddress(address newAddress) external onlyOwner {
        oracle = IOracle(newAddress);
        emit OracleAddressChanged(newAddress);
    }
    // Compare with Oracle.setSettlementPoolFactory which DOES check:
    // require(factoryAddress != address(0), "Factory address cannot be zero");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 80
  notes: >
    The missing zero-address check is factual. The centralization risk (owner changes oracle)
    may be considered acceptable by Immunefi. However, the lack of zero-check compared to
    Oracle's own setFactory function suggests an oversight.
  poc_sketch: ''
  call_stack: 'owner -> setOracleAddress(address(0)) -> oracle = address(0) -> all pool onlyOracle checks fail -> funds locked'
  kill_signals:
    - "Centralization risk — Immunefi typically excludes owner-can-rug scenarios"
    - "The zero-address check gap is more interesting as a concrete code quality issue"
    - "Check if there's a timelock or multisig on the factory owner"

