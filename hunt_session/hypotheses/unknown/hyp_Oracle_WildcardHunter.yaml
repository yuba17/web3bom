    3. Provider calls atomicDeposit again with same params and parentQuoteUuid=0.
    4. No replay check fires (atomic_deposits_processed[0] was never set to true).
    5. partyOne's USDC is drained up to their allowance to the pool.
    Note: this requires a MALICIOUS PROVIDER (trusted role). The question is whether
    the protocol considers this a valid trust boundary concern.
