# ============================================================================
# H-10: EIP-1167 clone initialization frontrunning
# ============================================================================
- id: ORC-W-10
  tier: 2
  type: property
  description: >
    SettlementPoolFactory.createPool() deploys a clone via Clones.clone() (line 85) and then
    calls initialize() on it (line 88). These are two separate transactions within the same
    transaction. A frontrunner CANNOT insert a call between clone deployment and initialization
    within the same transaction.

    However, the initialize() check is: require(msg.sender == address(ISettlementPoolFactory(_factory))).
    The _factory parameter is passed BY THE CALLER to initialize(). So if someone could call
    initialize() before the factory does, they'd need to pass _factory=factoryAddress. But
    the clone address is not known before the CREATE opcode executes, and both clone+initialize
    happen in the same tx. So frontrunning is NOT possible.

    KILLED: clone() + initialize() are in the same transaction. No frontrun vector.
  attack_scenario: "None — clone deployment and initialization happen atomically in one tx."
  impact: "None"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: ""
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: >
    The factory == address(0) check on line 60 of SettlementPool.sol provides additional
    protection. Even if somehow initialize were called twice, the second call would revert.
    KILLED: no frontrun possible within single transaction.
  poc_sketch: ''
