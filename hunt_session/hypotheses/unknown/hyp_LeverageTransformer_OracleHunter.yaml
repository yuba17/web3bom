component: LeverageTransformer
hunter: OracleHunter
date: "2026-03-21"

invariants:
  - id: LT-O-01
    title: "leverageUp: oracle manipulation can pass health check with inflated collateral"
    tier: 2
    type: property
    confidence: 65
    description: >
      vault._requireLoanIsHealthy() uses V3Oracle.getValue() to price the position.
      V3Oracle uses TWAP + Chainlink hybrid pricing. If an attacker can manipulate
      the TWAP between borrow and the health check (within one transaction via flash loans),
      they could temporarily inflate position value, pass health check, then let TWAP decay.
      In practice: TWAP is manipulation-resistant over short windows, and flash loans
      within a single block can't move TWAP (TWAP samples are per-block).
      Risk is LOW for single-block manipulation but worth documenting.
    affected_line: "V3Vault.sol:_requireLoanIsHealthy(), V3Oracle.sol:getValue()"
    attack_scenario: >
      1. Attacker holds large position, calls leverageUp to borrow maximum
      2. Before leverageUp tx: manipulate TWAP pool price over multiple blocks
      3. inflated TWAP inflates position value → health check passes with more debt
      4. After multi-block manipulation, TWAP decays → position suddenly underwater
      5. Protocol must liquidate, but if liquidation is slow, bad debt accumulates
      NOTE: Multi-block TWAP manipulation is expensive and monitored. Low practical risk.
    status: low_priority
    solidity: |
      // INV-LT-O-01: health check uses manipulation-resistant oracle (TWAP + CL)
      // V3Oracle already has TWAP window protection — this is by design

  - id: LT-O-02
    title: "leverageDown: oracle price used for swap slippage — price divergence risk"
    tier: 2
    type: property
    confidence: 55
    description: >
      When leverageDown specifies a swap from token0/token1 to debt token, the
      amountOutMin parameter is user-specified (not derived from oracle). The vault's
      oracle is NOT consulted during the swap itself. If oracle price and actual pool
      price diverge significantly, the user could receive far less than oracle suggests.
      This is a UX issue rather than a security bug in LeverageTransformer itself.
    affected_line: "LeverageTransformer.sol:160-170, Swapper.sol:_routerSwap()"
    attack_scenario: >
      Oracle says 1 ETH = 3000 USDC. Pool spot is 2500 USDC (oracle lagging or manipulated).
      User sets amountOutMin based on oracle price (3000). Swap fails due to slippage check.
      Alternatively: user sets amountOutMin=0. Swap executes at 2500. User repays less.
    status: low_priority
    solidity: |
      // INV-LT-O-02: oracle-derived amountOutMin for swaps
      // LeverageTransformer doesn't enforce this — user's responsibility

  - id: LT-O-03
    title: "leverageUp: post-leverage health check with stale oracle allows overborrowing"
    tier: 2
    type: property
    confidence: 60
    description: >
      vault._requireLoanIsHealthy() is called AFTER addLiquidity completes. The oracle
      value is fetched at that moment. If the oracle is stale (Chainlink heartbeat lag),
      the health check uses an outdated price. In a falling market:
      - Real position value: decreasing
      - Oracle-reported value: stale (higher than reality)
      - Health check: passes with more debt than it should
      The vault has a maxOracleDeviationX96 check to catch extreme deviations, but
      gradual staleness within the deviation window can still create undercollateralization.
    affected_line: "V3Vault.sol:579, V3Oracle.sol:getValue()"
    attack_scenario: >
      1. Market crashes 5% (within maxOracleDeviation threshold)
      2. Chainlink feed is within heartbeat window (not stale enough to trigger fallback)
      3. Attacker calls leverageUp at maximum CF during the 5% price lag window
      4. Position is already 5% undercollateralized by real prices
      5. Next oracle update → position immediately liquidatable
    status: low_priority
    solidity: |
      // This is a known limitation of oracle-based health checks.
      // V3Oracle.sol already has deviation checks — protocol accepts this risk.

  - id: LT-O-04
    title: "leverageDown: repay amount denominated in wrong token if oracle price different"
    tier: 3
    type: property
    confidence: 45
    description: >
      leverageDown repays `amount` (denominated in debt token, e.g., USDC).
      The debt is also in USDC. No oracle interaction needed for repayment.
      This invariant confirms that leverageDown repayment is oracle-independent
      (it's token-amount based, not value-based), which is correct behavior.
    affected_line: "LeverageTransformer.sol:178-180"
    attack_scenario: >
      No attack. Confirming correct design: repay uses token amounts, not oracle values.
    status: confirmed_correct_design
    solidity: |
      // INV-LT-O-04: repay amount is in debt token units, not oracle value units
      // CORRECT: vault.repay(tokenId, amount, false) — amount is token count

  - id: LT-O-05
    title: "leverageUp: value of added liquidity < borrowed amount (oracle-based)"
    tier: 2
    type: property
    confidence: 62
    description: >
      After leverageUp, the increase in position value (as measured by oracle) should
      be >= the amount borrowed. Otherwise the net effect of leverageUp is value-destructive:
      the position's collateral increased by less than the debt increased.
      This creates a "leverage decay" scenario where each leverageUp call degrades
      the collateral ratio even if prices don't move.
    affected_line: "LeverageTransformer.sol:85-105"
    attack_scenario: >
      Slippage + pool fees + tick range inefficiency causes addLiquidity to add position
      value that's worth less than the borrow cost. Net result: borrower is poorer after
      leveraging up. Not a security bug but an economic design consideration.
    status: low_priority
    solidity: |
      // INV-LT-O-05: oracle.getValue(tokenId after) - oracle.getValue(tokenId before) >= borrowAmount
      function invariant_leverageUp_valueAdded_geq_borrowed() public {
          // Requires oracle calls — fork test only
      }
