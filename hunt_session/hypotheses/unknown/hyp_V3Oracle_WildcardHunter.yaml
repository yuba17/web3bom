  #   config = TokenConfig(feed, ..., Mode.CHAINLINK, 0)  // TWAP disabled
  # So referenceToken ALWAYS uses CHAINLINK mode, never TWAP. Good.
  #
  # REAL SUBTLE BUG FOUND:
  # What if BOTH token0 and token1 in a collateral position are the referenceToken?
  # Impossible as stated above (Uniswap constraint). But what about:
  # token0 == referenceToken AND the collateral factor for referenceToken is 0?
  # No — the oracle doesn't check collateral factors. That's in V3Vault.
  #
  # ACTUAL BUG: feeValue inconsistency between getValue() and getLiquidityAndFees().
