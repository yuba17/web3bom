  # ============================================================
  # VECTOR 6 — getLiquidityAndFees vs getValue inconsistency
  # ============================================================
  #
  # FINDING: REAL BUG — HIGH CONFIDENCE — TIER 1
  #
  # In V3Vault.liquidate() (lines 742-771):
  #   Step 1: _checkLoanIsHealthy() calls oracle.getValue(tokenId, asset, ignoreFees)
  #           Returns: fullValue, feeValue (using oracle price at oracle time T1)
  #   Step 2: _calculateLiquidation() computes liquidationValue from fullValue/feeValue
  #   Step 3: _sendPositionValue() calls oracle.getLiquidityAndFees(tokenId)
  #           Returns: actual fees0, fees1 from pool state at time T2
  #
  # The CRITICAL issue:
  # getValue() calls _getFees() which calls _getUncollectedFees() using:
  #   pool.feeGrowthGlobal0X128(), pool.feeGrowthGlobal1X128()
  #   and the tick from _getPoolSlot0() at the time of the getValue() call.
  #
  # getLiquidityAndFees() also calls _getUncollectedFees() with:
  #   pool.feeGrowthGlobal0X128(), pool.feeGrowthGlobal1X128()
  #   and the tick from _getPoolSlot0() at the time of the getLiquidityAndFees() call.
  #
  # BETWEEN THE TWO CALLS, a swap in the pool can:
  #   1. Change feeGrowthGlobal0X128 / feeGrowthGlobal1X128 (new fees accrued)
  #   2. Change the current tick (price moved)
  #
  # This means:
  #   feeValue in _checkLoanIsHealthy() = fees computed at T1
  #   fees0/fees1 in _sendPositionValue() = fees computed at T2 > T1
  #
  # If fees increased between T1 and T2:
  #   feeValue (from getValue) underestimates actual fees
  #   _sendPositionValue() will collect MORE fees than expected
  #   The liquidator gets more than priced, at the expense of the borrower's remaining equity
  #
  # If fees decreased (e.g., tick moved out of range, reducing inside fee growth):
  #   feeValue overestimates actual fees
  #   _calculateLiquidation() computed liquidationValue based on inflated feeValue
  #   In _sendPositionValue() line 1123: if (liquidationValue <= feeValue) [stale feeValue]
  #   But the actual fees are lower, so the pro-rata fee collection:
  #     fees0 = liquidationValue * fees0 / feeValue [both from getLiquidityAndFees]
  #   ...is actually using the FRESH fees0 and the STALE feeValue from getValue.
  #   Wait — let me re-read _sendPositionValue more carefully.
  #
  # _sendPositionValue() parameters include `feeValue` from _checkLoanIsHealthy (STALE).
  # And it calls oracle.getLiquidityAndFees() for fresh fees0/fees1 raw amounts.
  # At line 1131:
  #   liquidity = (liquidationValue - feeValue) * liquidity / (fullValue - feeValue)
  # Here fullValue and feeValue are BOTH from the first call (STALE).
  # liquidity is from getLiquidityAndFees (FRESH) — but liquidity does not change between
  # calls unless someone decreases liquidity mid-liquidation (impossible, vault holds NFT).
  # At lines 1125-1126:
  #   fees0 = liquidationValue * fees0 / feeValue
  # fees0 here is FRESH (from getLiquidityAndFees), feeValue is STALE (from getValue).
  # If actual fees grew: fees0 grew but feeValue didn't -> ratio is WRONG.
  # Example:
  #   At T1: feeValue = $100, fees0 = 50 USDC, fees1 = 50 USDC (in tokens)
  #   At T2: feeValue_real = $150 (fees grew), fees0 = 75 USDC, fees1 = 75 USDC
  #   liquidationValue = $90 (<= feeValue_stale=$100), so liquidity=0
  #   fees0_to_collect = 90 * 75 / 100 = 67.5 USDC   [uses FRESH fees0 but STALE feeValue]
  #   But at real T2 prices: should have been 90 * 75 / 150 = 45 USDC
  #   Liquidator gets 67.5 instead of 45 — OVERCOLLECTS by 50%.
  #   The position owner is shortchanged by the overcollection.
  #
  # SEVERITY ASSESSMENT:
  # This requires a MEV-style sandwich: attacker triggers large swap in pool AFTER liquidate()
  # is in the mempool but before it executes, to increase fees between T1 and T2.
  # In practice, fees accrued between two sequential operations in the SAME transaction
  # would be zero (no swaps between calls in same tx). BUT liquidate() is a SINGLE tx —
  # _checkLoanIsHealthy and _sendPositionValue are both in the same transaction!
  # Therefore, T1 == T2 within the same transaction. No pool state changes between them.
  # The inconsistency requires a CROSS-TRANSACTION scenario, but liquidation is atomic.
  #
  # WAIT — re-reading the liquidate() function:
  # Lines 742-743: _checkLoanIsHealthy() — internal call, uses oracle.getValue()
  # Lines 750-751: _calculateLiquidation() — pure math
  # Lines 770-772: _sendPositionValue() — uses oracle.getLiquidityAndFees()
  # These are ALL in the same transaction. No pool state changes possible between them.
  # The oracle calls are view functions that read live chain state — but within the SAME tx,
  # the chain state does not change (no re-entrant swaps possible since oracle is a view call).
  #
  # VERDICT: False positive for the "same tx" scenario. The two oracle calls within
  # a single liquidate() transaction read the same pool state (no state changes between them).
  # The inconsistency concern is VALID but practically unexploitable within a single tx.
  # Reentrant scenarios also don't apply to view functions.
  #
  # BUT THERE IS A REAL ISSUE: The values (fullValue, feeValue) from _checkLoanIsHealthy
  # are passed as parameters to _sendPositionValue, which also calls oracle.getLiquidityAndFees.
  # Both oracles read pool.feeGrowthGlobal at the same block — CONSISTENT.
  # The redundant oracle call in _sendPositionValue could be eliminated, but it's not a bug.

  - id: VO-W-06-FEES
    tier: 2
    type: false_positive
    severity: INFO
    title: "getValue vs getLiquidityAndFees in same liquidation tx — investigated and dismissed"
    description: >
      Investigated whether the dual oracle reads in liquidate() (getValue in _checkLoanIsHealthy
      and getLiquidityAndFees in _sendPositionValue) could return inconsistent fee values.
      Analysis: both calls occur within the same atomic transaction, meaning pool state
      (feeGrowthGlobal, tick) cannot change between them. The values are consistent.
      The architectural concern (that two calls exist at all) is noted, but is not exploitable.
    attack_scenario: >
      Dismissed — same-transaction atomicity prevents pool state divergence between calls.
    confidence: high
    verdict: "FALSE POSITIVE — dismissed. Both calls read identical pool state within same tx."
    solidity: |
      // No actionable property — dismissed


  # ============================================================
  # VECTOR 7 — factory.getPool() Aerodrome/Uniswap selector collision
  # ============================================================
  #
  # FINDING: REAL ARCHITECTURAL BUG — MEDIUM CONFIDENCE — TIER 1
  #
  # _getPool() tries Aerodrome FIRST, then Uniswap:
  #   Call 1: IAerodromeSlipstreamFactory.getPool(tokenA, tokenB, int24(fee))
  #           selector: keccak256("getPool(address,address,int24)")[0:4]
  #   Call 2: IUniswapV3Factory.getPool(tokenA, tokenB, uint24(fee))
  #           selector: keccak256("getPool(address,address,uint24)")[0:4]
  #
  # The factory is the address from nonfungiblePositionManager.factory() — set at construction.
  # For Uniswap V3 on Base: factory is the Uniswap V3 Factory.
  # For Aerodrome Slipstream: factory is the Aerodrome factory.
  # ONE factory is set — not both.
  #
  # If factory is the UNISWAP V3 factory:
  #   Call 1: staticcall with int24 selector -> Uniswap factory has no such function ->
  #            success=false (revert) -> proceeds to Call 2 -> CORRECT
  #
  # If factory is the AERODROME factory:
  #   Call 2: staticcall with uint24 selector -> Aerodrome factory has getPool(addr,addr,int24),
  #            not getPool(addr,addr,uint24). Different ABI selectors.
  #            keccak256("getPool(address,address,int24)") != keccak256("getPool(address,address,uint24)")
  #            So Call 2 would also fail (function not found) -> returns IUniswapV3Pool(address(0))
  #
  # BUT WAIT: _toTickSpacing converts uint24 fee to int24 tickSpacing via assembly:
  #   tickSpacing := fee   (direct bitcast)
  # This is correct — Aerodrome stores tickSpacing in the `fee` field of the NFT position.
  # So for Aerodrome, the fee field contains tickSpacing (e.g., 100 for tight pools).
  #
  # CRITICAL SELECTOR CHECK:
  # IAerodromeSlipstreamFactory.getPool(address,address,int24): selector = ?
  # IUniswapV3Factory.getPool(address,address,uint24): selector = ?
  # int24 vs uint24 — different ABI types — DIFFERENT selectors.
  #
  # For a Uniswap factory, Call 1 (int24) fails -> Call 2 (uint24) succeeds. CORRECT.
  # For an Aerodrome factory, Call 1 (int24) succeeds -> returns pool. CORRECT.
  # No collision possible because the factory can only respond to one selector.
  #
  # SUBTLE ISSUE: What if both selectors HAPPEN TO COLLIDE?
  # keccak256("getPool(address,address,int24)")[0:4] = 0x1698ee82
  # keccak256("getPool(address,address,uint24)")[0:4] = 0x1698ee82 ???
  # Let me verify: int24 and uint24 are DIFFERENT ABI types.
  # ABI encoding: "int24" vs "uint24" — these produce DIFFERENT keccak256 hashes.
  # So there is NO selector collision. The dual-try approach is safe.
  #
  # ACTUAL RISK FOUND: What if the factory is a PROXY that delegates to different
  # implementations based on selector? A malicious or upgraded factory that responds
  # to BOTH selectors could confuse _getPool. But this requires a malicious factory,
  # which is a trusted admin-controlled component. Out of scope for this analysis.
  #
  # REAL BUG: What happens when _getPool returns address(0)?
  # Line 686-688: return IUniswapV3Pool(abi.decode(data, (address)));
  # This can return address(0) if Uniswap factory has no pool for these tokens.
  # Then _getPoolSlot0(IUniswapV3Pool(address(0))) is called.
  # Line 623: staticcall to address(0). In EVM, address(0) is a precompile range.
  # staticcall to address(0) returns (success=true, data="") — empty data.
  # data.length = 0 < 64 -> revert InvalidPool(). SAFE.
  #
  # BUT: What about the Aerodrome path when data is valid but address is non-zero?
  # Lines 675-680: if (poolAddress != address(0)) -> return it.
  # What if pool is a valid Aerodrome pool but the token config in feedConfigs uses
  # a DIFFERENT pool (e.g., a manually configured TWAP pool vs the actual position pool)?
  # The collateral position's pool is determined by _getPool(token0, token1, fee).
  # The TWAP oracle pool (in feedConfigs[token].pool) is separately configured.
  # These are DIFFERENT lookups — one is for position valuation, one is for price.
  # This is by design and correct.
  #
  # VERDICT: No exploitable bug in factory.getPool() logic. Dual-selector approach is sound.

  - id: VO-W-07-FACTORY
    tier: 2
    type: false_positive
    severity: INFO
    title: "factory.getPool() dual-selector Aerodrome/Uniswap — investigated and verified sound"
