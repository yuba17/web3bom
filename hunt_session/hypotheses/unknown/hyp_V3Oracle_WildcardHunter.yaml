  # NET NEW FINDINGS THIS PASS:
  # VO-W-08-FEEOFFSET: MEDIUM — field offset vulnerability in ticks() struct decode (silent wrong values on reorder)
  # VO-W-02-AERODROME: LOW — Aerodrome staked liquidity reduces TWAP manipulation cost
  # VO-W-03-SEQ: LOW — sequencer recovery does not enforce Chainlink freshness beyond maxFeedAge
