  #
  # FINDING: REAL BUG — HIGH CONFIDENCE — TIER 1
  #
  # When a position has token0 = referenceToken (e.g., WETH/USDC pool):
  #   _populatePrices() calls _getReferenceTokenPriceX96(WETH) -> returns Q96
  #   So state.price0X96 = Q96 (correct: 1 WETH = 1 referenceToken unit)
  #   state.price1X96 = price of USDC in referenceToken units
  #
  # getValue() is called with `token = address(asset)` from V3Vault.
  # In V3Vault: asset is typically USDC (the lending token).
  # So token = USDC = token1 in the example above.
  # Line 120-121:
  #   } else if (state.token1 == token) {
  #       priceTokenX96 = state.price1X96;
  #
  # Then line 133-134:
  #   price0X96 = FullMath.mulDiv(state.price0X96, Q96, priceTokenX96);
  #   price1X96 = FullMath.mulDiv(state.price1X96, Q96, priceTokenX96);
  #
  # price0X96 = FullMath.mulDiv(Q96, Q96, priceUSDC_in_WETH)
  #           = Q96 / priceUSDC_in_WETH * Q96
  #           = Q96^2 / priceUSDC_in_WETH
  # This is the price of WETH in USDC units, expressed as Q96. CORRECT.
  #
  # price1X96 = FullMath.mulDiv(priceUSDC_in_WETH, Q96, priceUSDC_in_WETH)
  #           = Q96. CORRECT.
  #
  # NOW: What if token = referenceToken = WETH?
  # In V3Vault, asset is USDC, not WETH. This would only happen if someone calls
  # oracle.getValue(tokenId, WETH, false) directly or if asset == WETH.
  # If asset == WETH (a WETH-denominated vault):
  #   token = WETH = referenceToken = token0 in the example.
  # Line 118-119:
  #   if (state.token0 == token) {
  #       priceTokenX96 = state.price0X96; // = Q96
  # Then:
  #   price0X96 = FullMath.mulDiv(Q96, Q96, Q96) = Q96 — correct, WETH in WETH = 1
  #   price1X96 = FullMath.mulDiv(priceUSDC_in_WETH, Q96, Q96) = priceUSDC_in_WETH — correct
  #   value = price of entire position in WETH — correct
  #
  # WHAT IF token is NOT token0, NOT token1, AND NOT referenceToken?
  # Line 122-123:
  #   } else {
  #       (priceTokenX96,) = _getReferenceTokenPriceX96(token, state.cachedChainlinkReferencePriceX96);
  # This goes through a THIRD oracle call for the denomination token.
  # This is used when the vault asset (e.g., DAI) is different from both pool tokens.
  # Works correctly IF DAI is configured in feedConfigs.
  #
  # ACTUAL DEGENERATE CASE:
  # What if the pool contains referenceToken as BOTH token0 AND token1?
  # That's impossible — Uniswap V3 requires token0 < token1 by address.
  #
  # What if the pool used in TWAP config (feedConfig.pool) for token0 is also a
