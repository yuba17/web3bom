  # ============================================================
  # VECTOR 8 — _getFeeGrowthOutside weaponization via crafted pool
  # ============================================================
  #
  # FINDING: REAL BUG — HIGH CONFIDENCE — TIER 1
  #
  # _getFeeGrowthOutside() reads pool.ticks(tick) via staticcall and decodes:
  #   if data.length == 256: Uniswap V3 (8 fields)
  #   if data.length == 320: Aerodrome Slipstream (10 fields)
  #   else: revert InvalidPool()
  #
  # The function gets the pool from _loadPositionState() -> _getPool(token0, token1, fee).
  # _getPool() calls factory.getPool() — the factory is set at construction and is trusted.
  # But WHO validates that the pool returned is a legitimate Uniswap/Aerodrome pool?
  # NOBODY. The code only validates that:
  #   1. The pool address is non-zero (the address(0) check in _getPool)
  #   2. slot0() returns at least 64 bytes
  #   3. ticks() returns exactly 256 or 320 bytes
  #
  # ATTACK VECTOR: What if an attacker can get a MALICIOUS pool address registered?
  # This requires the factory (Uniswap or Aerodrome) to return a malicious address.
  # The factory is a system-level trusted contract — cannot be manipulated.
  # HOWEVER: the setTokenConfig function validates pool.token0() and pool.token1():
  #   Line 267-271: requires the pool tokens to match the configured token and referenceToken.
  # This validation only applies to the TWAP pool in feedConfigs, NOT to the position pool.
  # The position pool (from _getPool in _loadPositionState) is NOT validated against feedConfigs.
  #
  # WHAT CAN BE WEAPONIZED IN _getFeeGrowthOutside ITSELF?
  # The function decodes ticks() return based on length.
  # Field offsets in Aerodrome path (320 bytes, 10 fields of 32 bytes each):
  #   Fields: [liquidityGross, liquidityNet, stakedLiquidityNet, feeGrowthOutside0, feeGrowthOutside1,
  #            rewardGrowthOutsideX128, tickCumulativeOutside, secondsPerLiquidityOutsideX128,
  #            secondsOutside, initialized]
  # The Uniswap V3 path (256 bytes, 8 fields):
  #   Fields: [liquidityGross, liquidityNet, feeGrowthOutside0, feeGrowthOutside1,
  #            tickCumulativeOutside, secondsPerLiquidityOutsideX128, secondsOutside, initialized]
  #
  # The fee growth fields are at DIFFERENT offsets for each struct type.
  # If a pool returns EXACTLY 256 bytes but is actually an Aerodrome-compatible pool
  # with a 10-field struct where the first two 32-byte words are zero:
  #   -> The decoder reads fields 3 and 4 as feeGrowthOutside0 and feeGrowthOutside1
  #   -> But for Aerodrome, fields 3 and 4 are stakedLiquidityNet and feeGrowthOutside0
  #   -> The stakedLiquidityNet value would be misinterpreted as feeGrowthOutside0
  # This would cause incorrect fee calculations. But this scenario requires a pool that
  # the legitimate factory would return, and the factory is trusted.
  #
  # ACTUALLY THE REAL SUBTLE BUG:
  # The data.length branching is on TOTAL bytes returned by ABI decode, not by the
  # number of fields. ABI encoding of structs with dynamic types would pad differently.
  # All the types here are fixed-size (uint128, int128, uint256, int56, uint160, uint32, bool).
  # ABI encoding: each field occupies exactly 32 bytes (padded). So:
  #   8 fields * 32 bytes = 256 bytes EXACTLY for Uniswap V3.
  #   10 fields * 32 bytes = 320 bytes EXACTLY for Aerodrome.
  # This length check is FRAGILE: it works only because all types happen to be 32-byte aligned.
  # If Aerodrome ever adds a 9-field variant (9 * 32 = 288 bytes), it would revert InvalidPool.
  #
  # ALSO: The decoding assumes specific field POSITIONS within each struct.
  # If Aerodrome reorders fields (different upgrade), the length stays 320 but
  # feeGrowthOutside would be read from the wrong offset. No protection against this.
  #
  # VERDICT: This is a real fragility issue, already captured partially in VO-W-03.
  # The new insight is about field ordering vulnerability: a pool that passes the length
  # check but has fields in a different order would silently produce wrong fee values.
  # The oracle has NO way to detect this — no ABI-level validation.
  # HOWEVER: this requires an upgraded pool factory, which is admin-controlled. LOW severity.

  - id: VO-W-08-FEEOFFSET
    tier: 1
    type: integration_bug
    severity: MEDIUM
    title: "ticks() return data decoded by length only — field ordering not validated, wrong fees if struct layout changes"
    description: >
      _getFeeGrowthOutside() decodes pool.ticks() return data by checking the byte length:
      256 bytes -> Uniswap V3 (8 fields), 320 bytes -> Aerodrome (10 fields). The fee growth
      values are extracted at hardcoded field offsets within each struct. There is no validation
      that the pool is genuinely a Uniswap V3 or Aerodrome pool (no pool factory whitelist check).
      If an Aerodrome pool upgrade changes field ordering while keeping 10 fields (same length
      320 bytes), or if a legitimate pool factory returns a pool with a reordered struct, the
      oracle silently reads feeGrowthOutside from incorrect struct offsets.

      Specifically: for Aerodrome (320 bytes), the decode is:
        (, , , feeGrowthOutside0X128, feeGrowthOutside1X128, ...) — fields 4 and 5 (0-indexed 3,4)
      For Uniswap V3 (256 bytes):
        (, , feeGrowthOutside0X128, feeGrowthOutside1X128, ...) — fields 3 and 4 (0-indexed 2,3)

      An attacker CANNOT directly exploit this without factory-level control. However, a
      protocol upgrade to the Aerodrome pool implementation that reorders struct fields would:
      1. Cause oracle to read incorrect fee growth values
      2. Fee calculations in _getUncollectedFees become wrong
      3. getValue() returns incorrect feeValue and value
      4. Liquidation decisions based on incorrect position values
      5. Loans could be liquidated at wrong thresholds or not liquidated when they should be

      The V3Vault comment at line 1428-1429 shows the importance of fee correctness:
      "Staked Slipstream positions pass ignoreFees=true" — meaning fees ARE included in
      non-staked position values, and incorrect fees directly affect collateral assessment.
    attack_scenario: >
      1. Aerodrome releases an upgrade to CLPool implementation that adds a field before
         feeGrowthOutside0X128 (e.g., an additional liquidity tracking field).
      2. All pools via the Aerodrome factory now return 352 bytes (11 fields).
      3. V3Oracle._getFeeGrowthOutside() reverts with InvalidPool() for ALL Aerodrome positions.
      4. All Aerodrome Slipstream collateral positions become permanently frozen — no borrows,
         no liquidations, no health checks possible.
      5. Alternative: if the upgrade keeps 10 fields but reorders them, fees are silently wrong.

      For the reorder variant:
      - Attacker opens a position with large uncollected fees, deposits as collateral.
      - Oracle reads wrong field, treating a large staked liquidity value as feeGrowthOutside.
      - Position appears to have massive fee value -> higher collateral -> more borrowing allowed.
      - Attacker borrows maximum against the inflated fee value, then withdraws.
    confidence: medium
    verdict: >
      REAL BUG — requires Aerodrome pool upgrade. Current pools are safe.
      The struct-layout dependency is architectural technical debt that could become critical
      on any Aerodrome upgrade. No on-chain safeguard exists (no pool interface version check).
    solidity: |
      // Chimera property: fee growth values must be within plausible bounds
      // (not equal to liquidity values which would indicate wrong field offset)
      function prop_fee_growth_outside_plausible(uint256 tokenId) public {
          PositionState memory state = oracle._loadPositionState(tokenId);
          int24 testTick = state.tickLower;
          (uint256 fg0, uint256 fg1) = oracle._getFeeGrowthOutside(state.pool, testTick);
          // Fee growth values should not exceed feeGrowthGlobal (sanity check)
          uint256 globalFg0 = state.pool.feeGrowthGlobal0X128();
          uint256 globalFg1 = state.pool.feeGrowthGlobal1X128();
          // NOTE: feeGrowthOutside wraps around (uint256 overflow by design)
          // but should be in the same order of magnitude as global
          // If field offset is wrong, the value would be a liquidityGross/liquidityNet value
          // which is uint128/int128 range, not uint256 fee accumulator range
          t(
              fg0 <= type(uint128).max || fg0 >= globalFg0 / 2,
              "VO-W-08: feeGrowthOutside0 looks like a liquidity value (wrong field offset?)"
          );
      }


