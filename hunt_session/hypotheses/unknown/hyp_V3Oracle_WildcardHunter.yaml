  # ============================================================
  # VECTOR 3 — Sequencer downtime + Chainlink staleness window
  # ============================================================
  #
  # FINDING: REAL BUG — HIGH CONFIDENCE
  #
  # The sequencer grace period check uses block.timestamp - startedAt <= 600s.
  # startedAt is the timestamp when the sequencer CAME BACK UP.
  # During sequencer downtime, Chainlink price updates could not be published on L2.
  # maxFeedAge is checked separately: updatedAt + maxFeedAge < block.timestamp.
  #
  # THE RACE: When sequencer comes back up:
  #   - block.timestamp - startedAt <= 600s -> revert SequencerGracePeriodNotOver()
  # After 600 seconds:
  #   - Grace period check passes
  #   - But Chainlink feed was NOT updated during downtime
  #   - updatedAt is still the last update BEFORE the outage started
  #   - If downtime lasted D seconds, the feed is D+0..600 seconds old at the moment it passes grace period
  #
  # EXAMPLE: Sequencer down for 2 hours (7200s), maxFeedAge = 3600s (1 hour)
  #   t=0:     Sequencer goes down. Last Chainlink update was at t=0.
  #   t=7200:  Sequencer comes back up. startedAt = t=7200.
  #   t=7800:  Grace period over (600s elapsed). block.timestamp - startedAt = 600.
  #            BUT: updatedAt + maxFeedAge = t=0 + 3600 = t=3600.
  #            block.timestamp = t=7800 > t=3600 -> ChainlinkPriceError() -> reverts.
  #
  # So far so good — the staleness check correctly blocks stale data.
  #
  # BUT: What if maxFeedAge is set GENEROUSLY (e.g., 24 hours = 86400s)?
  #   t=0:     Sequencer down. Last update at t=0.
  #   t=7200:  Back up. startedAt = 7200.
  #   t=7800:  Grace passed. updatedAt + maxFeedAge = 0 + 86400 = 86400.
  #            block.timestamp = 7800 < 86400 -> PASSES THE STALENESS CHECK.
  #            Price used is 2h+ old. This is INTENTIONAL by design? Or a gap?
  #
  # CONCLUSION: This is by design — maxFeedAge is a configurable parameter that owners set.
  # If they set it generous, stale prices pass. The sequencer check doesn't add a MINIMUM
  # freshness guarantee beyond the grace period itself.
  #
  # THE REAL SUBTLE BUG: The grace period check (600s) does NOT interact with maxFeedAge.
  # The two checks are completely independent. An operator who sets maxFeedAge=86400 (24h)
  # does NOT get 10 extra minutes of freshness protection from the sequencer check.
  # After a long outage, the price that passes is as old as (outage_duration - grace_period + epsilon).
  # For maxFeedAge=86400, a price up to 86400 seconds (minus grace period) stale can pass.
  # This is architecturally correct but potentially dangerous if operators misunderstand the interaction.
  #
  # VERDICT: This is a configuration risk / documentation gap, NOT an exploitable bug independent
  # of admin configuration. The code does what it's supposed to do. Downgraded to LOW.

  - id: VO-W-03-SEQ
    tier: 2
    type: integration_risk
    severity: LOW
    title: "Sequencer grace period and Chainlink maxFeedAge are independently checked — post-outage stale price window"
    description: >
      The sequencer uptime check (SEQUENCER_GRACE_PERIOD_TIME = 600s) and the Chainlink staleness
      check (updatedAt + maxFeedAge < block.timestamp) are completely independent. After a sequencer
      outage, the grace period ensures 10 minutes pass before oracle resumes. However, if
      maxFeedAge is set generously (e.g., 24 hours), a price that is (outage_duration - 600s) old
      can immediately pass all checks once the grace period ends. For a 4-hour outage with
      maxFeedAge=86400, a 3.5-hour-old price passes as valid. There is no mechanism to force
      Chainlink feeds to be refreshed post-outage before oracle use resumes. The price used
      immediately after grace period is the last pre-outage price, not a fresh price.
    attack_scenario: >
      1. L2 sequencer goes down for 4 hours during a volatile market event (ETH price moves 30%).
      2. Sequencer comes back up. startedAt = T.
      3. At T+601 seconds, an attacker calls liquidate() or borrow() against positions with
         stale oracle valuations from pre-outage.
      4. If maxFeedAge=86400, the oracle accepts the 4-hour-old price.
      5. Attacker exploits the price discrepancy: positions that became liquidatable during
         the outage (at real prices) show as healthy at stale pre-outage prices, preventing
         legitimate liquidations. OR positions that are healthy at real prices show as
         liquidatable at stale prices, allowing predatory liquidations.
      Impact: liquidation accuracy depends entirely on how fresh maxFeedAge enforcement is.
      The sequencer check provides false security comfort without enforcing actual freshness.
    confidence: medium
    verdict: "REAL RISK but depends on admin-controlled maxFeedAge config. Not independently exploitable."
    solidity: |
      function prop_post_sequencer_recovery_price_freshness() public view {
          // After sequencer recovery, oracle should not use prices older than grace period
          if (oracle.sequencerUptimeFeed() != address(0)) {
              (, int256 seqAnswer, uint256 startedAt,,) =
                  AggregatorV3Interface(oracle.sequencerUptimeFeed()).latestRoundData();
              if (seqAnswer == 0 && startedAt > 0) {
                  uint256 timeSinceUp = block.timestamp - startedAt;
                  if (timeSinceUp > SEQUENCER_GRACE_PERIOD_TIME) {
                      // Oracle is active. Any configured token should have fresh price.
                      // Property: price should be no older than the outage start
                      // (i.e., updatedAt >= startedAt for chainlink feeds)
                      // This property currently has NO enforcement in the code.
                      t(false, "VO-W-03-SEQ: no freshness guarantee post-sequencer-recovery");
                  }
              }
          }
      }


  # ============================================================
  # VECTOR 4 — cachedChainlinkReferencePriceX96 inconsistency
  # ============================================================
  #
  # FINDING: REAL INCONSISTENCY — MEDIUM CONFIDENCE
  #
  # getTokenValue() uses cachedChainlinkReferencePriceX96 correctly:
  #   Line 152-154:
  #     (priceInX96, cachedChainlinkReferencePriceX96) = _getReferenceTokenPriceX96(tokenIn, 0)
  #     (priceOutX96,) = _getReferenceTokenPriceX96(tokenOut, cachedChainlinkReferencePriceX96)
  #   Here: referenceToken price is computed ONCE and reused for tokenOut. CONSISTENT.
  #
  # getValue() uses _populatePrices() which calls:
  #   Line 516-519:
  #     (state.price0X96, state.cachedChainlinkReferencePriceX96) =
  #         _getReferenceTokenPriceX96(state.token0, state.cachedChainlinkReferencePriceX96);
  #     (state.price1X96, state.cachedChainlinkReferencePriceX96) =
  #         _getReferenceTokenPriceX96(state.token1, state.cachedChainlinkReferencePriceX96);
  #   Same pattern — cache is passed through. CONSISTENT internally.
  #
  # THEN in getValue() line 123:
  #     (priceTokenX96,) = _getReferenceTokenPriceX96(token, state.cachedChainlinkReferencePriceX96)
  #   The `token` parameter is the "denomination" token (e.g., USDC) — a THIRD call to
  #   _getReferenceTokenPriceX96 that REUSES the same cache from the first two calls.
  #   This is ALSO consistent — same Chainlink reference price throughout the call.
  #
  # EDGE CASE FOUND:
  # If token0 IS the referenceToken (e.g., WETH):
  #   _getReferenceTokenPriceX96(WETH, 0) returns (Q96, 0) — it does NOT compute the
  #   Chainlink reference price. The cache remains 0.
  # Then for token1 (e.g., USDC):
  #   _getReferenceTokenPriceX96(USDC, 0) — cache is still 0.
  #   So BOTH calls compute _getChainlinkPriceX96(referenceToken) independently.
  #   This is wasteful (2 external calls instead of 1) but not inconsistent.
  #
  # REAL BUG: What if _getChainlinkPriceX96(referenceToken) is called TWICE in the same
  # external call and returns DIFFERENT values? In a view function, this is impossible
  # unless the chainlink feed itself is reentrancy-manipulable, which it isn't (external
  # read-only oracle).
  #
  # VERDICT: No exploitable inconsistency found. The caching logic is correct.
  # The referenceToken shortcut (returning Q96 without computing chainlink price)
  # means the cache is not populated when token0 IS the referenceToken, causing
  # double chainlink calls — but the values are identical. Low severity at most.

  - id: VO-W-04-CACHE
    tier: 2
    type: efficiency
    severity: INFO
    title: "cachedChainlinkReferencePriceX96 not populated when referenceToken is token0"
    description: >
      In _populatePrices(), when token0 is the referenceToken, the call
      _getReferenceTokenPriceX96(referenceToken, 0) short-circuits and returns (Q96, 0),
      leaving cachedChainlinkReferencePriceX96 = 0 in the state. The subsequent call for
      token1 then has cache=0, causing _getChainlinkPriceX96(referenceToken) to be called
      again unnecessarily. This is a gas inefficiency: two external Chainlink calls instead
      of one. In Chainlink V3 aggregator, latestRoundData() is a simple storage read, so
      no security issue. However, if chainlink feed reports different values between the
      two calls (edge case: round update mid-tx in a future aggregator design), price1X96
      would use a different reference price than price0X96, which would cause minor
      valuation inconsistency. For the current Chainlink implementation, this cannot happen
      within a single atomic transaction.
    attack_scenario: >
      Theoretical only — requires the Chainlink aggregator to update its answer between
      two staticcalls within the same transaction. Currently impossible. Documenting as
      a latent architectural risk.
    confidence: low
    verdict: "INFORMATIONAL. Not exploitable with current Chainlink design."
    solidity: |
      // No actionable Chimera property — informational only


  # ============================================================
  # VECTOR 5 — referenceToken as token0 or token1 in position
