  # ============================================================
  # VECTOR 2 — Aerodrome vs Uniswap V3 abstraction leaks
  # ============================================================
  #
  # FINDING: REAL SUBTLE BUG — HIGH CONFIDENCE — TIER 1
  #
  # The code handles two pool types via _getFeeGrowthOutside (length-based dispatch)
  # and _getPool (selector-based dispatch). These are the integration boundaries.
  #
  # AERODROME-SPECIFIC LEAK:
  # Aerodrome Slipstream uses tickSpacing where Uniswap uses fee.
  # The NFT position's `fee` field stores tickSpacing for Aerodrome.
  # _toTickSpacing(fee) does a DIRECT BITCAST: tickSpacing := fee.
  # For uint24 fee values that are valid Uniswap fee tiers (500, 3000, 10000),
  # these are also VALID tickSpacing values for Aerodrome (or nearby ones).
  # So a Uniswap V3 position with fee=100 would try Aerodrome getPool(t0, t1, 100)
  # BEFORE trying Uniswap getPool(t0, t1, 100).
  #
  # CRITICAL: If both Uniswap AND Aerodrome factories are deployed (on Base they are),
  # and if the factory address used is the Uniswap factory:
  #   Call 1: Uniswap factory.staticcall(IAerodromeSlipstreamFactory.getPool, int24 selector)
  #   The Uniswap factory has no getPool(address,address,int24) function.
  #   staticcall returns success=false (no function with that selector) -> skip to Call 2.
  # If factory is the Aerodrome factory:
  #   Call 1: Aerodrome factory.staticcall(int24 selector) -> returns pool or zero.
  #   If zero returned -> Call 2 with uint24 selector also fails (Aerodrome has no uint24 getter).
  #   Returns address(0) -> later reverts in _getPoolSlot0.
  #
  # BUT the constructor sets factory = nonfungiblePositionManager.factory().
  # There is ONE nonfungiblePositionManager. On Base, this is the Aerodrome Slipstream NonfungiblePositionManager.
  # So factory = Aerodrome factory. The Uniswap fallback in _getPool is dead code for this deployment.
  #
  # ACTUAL LEAK: The Aerodrome slot0() return format.
  # Aerodrome Slipstream pool.slot0() returns:
  #   (sqrtPriceX96, tick, observationIndex, observationCardinality, observationCardinalityNext,
  #    feeProtocol, unlocked, stakedLiquidity, gauge)   <- 9 values on some versions
  # OR:
  #   (sqrtPriceX96, tick, ...) — same first 2 fields as Uniswap V3
  #
  # _getPoolSlot0() reads:
  #   word0 = first 32 bytes = sqrtPriceX96 (uint160 in first 160 bits, padded to 256)
  #   word1 = second 32 bytes = tick (int24 padded to 256 with sign extension)
  # These first two words are identical in both Uniswap V3 and Aerodrome slot0().
  # So the slot0 reading is safe regardless of format.
  #
  # BUT: pool.observe() for TWAP.
  # Aerodrome Slipstream uses a different oracle mechanism than Uniswap V3.
  # Does Aerodrome's observe() return the same format as Uniswap's?
  # If yes: TWAP calculation works. If no: TWAP could be wrong or revert.
  # The code at line 450:
  #   (int56[] memory tickCumulatives,) = pool.observe(secondsAgos);
  # This calls IUniswapV3Pool.observe() interface. Aerodrome Slipstream does implement
  # an observe() function compatible with this interface (it's a Uniswap V3 fork).
  # So this should work.
  #
  # REAL AERODROME ABSTRACTION LEAK — FOUND:
  # The _getFeeGrowthOutside for Aerodrome (320 bytes) decodes:
  #   (, , , feeGrowthOutside0X128, feeGrowthOutside1X128, ...)
  # Field 3 (0-indexed) = feeGrowthOutside0X128 for Aerodrome
  #
  # Aerodrome Slipstream Tick struct:
  #   struct Info {
  #     uint128 liquidityGross;    // [0]
  #     int128 liquidityNet;       // [1]
  #     int128 stakedLiquidityNet; // [2]  <-- AERODROME ONLY
  #     uint256 feeGrowthOutside0X128; // [3]
  #     uint256 feeGrowthOutside1X128; // [4]
  #     uint256 rewardGrowthOutsideX128; // [5]
  #     int56 tickCumulativeOutside; // [6]
  #     uint160 secondsPerLiquidityOutsideX128; // [7]
  #     uint32 secondsOutside; // [8]
  #     bool initialized; // [9]
  #   }
  # ABI-encoded: 10 * 32 = 320 bytes. Fields [3] and [4] are feeGrowthOutside0 and feeGrowthOutside1.
  # The code decodes (, , , feeGrowthOutside0X128, feeGrowthOutside1X128, ...) = fields at index 3,4.
  # That matches the Aerodrome struct. CORRECT.
  #
  # But the ABI decode syntax:
  #   (, , , feeGrowthOutside0X128, feeGrowthOutside1X128,,,,,) =
  #       abi.decode(data, (uint128, int128, int128, uint256, uint256, uint256, int56, uint160, uint32, bool));
  # The TYPES must match exactly. Field [2] is int128 (stakedLiquidityNet), which is decoded as int128.
  # If a future upgrade makes it uint256 (or any other size), the decode would fail or misinterpret.
  #
  # VERDICT: The current implementation is correct for the current Aerodrome Slipstream struct.
  # Already captured as VO-W-08-FEEOFFSET. No additional new bug here.
  #
  # NEW FINDING FROM VECTOR 2:
  # The setTokenConfig() validation at line 267-271 checks pool.token0() and pool.token1().
  # For Aerodrome TWAP pools configured via setTokenConfig(), the pool must have
  # one of {token0, token1} == referenceToken.
  # But what if the Aerodrome pool that is configured as the TWAP reference pool is
  # ALSO a gauge-managed pool where liquidity is staked?
  # Staked liquidity in Aerodrome affects the active liquidity (stakedLiquidityNet),
  # which changes tick math and therefore TWAP cumulative ticks.
  # If the TWAP pool has most of its liquidity staked, the observe() tick cumulatives
  # reflect weighted-average ticks based on STAKED liquidity, not total liquidity.
  # This could create a TWAP price that diverges from the actual token price
  # due to concentration of staked vs unstaked liquidity.
  # This is an Aerodrome-specific behavior that Uniswap V3 TWAP does not have.
  # No mitigation in the oracle code for this distinction.
  #
  # HOWEVER: The TWAP oracle is a REFERENCE pool (configured by owner), not the position pool.
  # The owner presumably picks a reliable, liquid pool for TWAP reference.
  # If they pick a highly-staked Aerodrome pool, TWAP quality degrades. Admin risk, not exploitable.

  - id: VO-W-02-AERODROME
    tier: 2
    type: integration_risk
    severity: LOW
    title: "Aerodrome TWAP reference pools affected by staked liquidity concentration — TWAP quality risk"
    description: >
      For Aerodrome Slipstream pools configured as TWAP reference pools in setTokenConfig(),
      the pool.observe() tick cumulatives reflect tick weighting by ACTIVE (unstaked) liquidity,
      not total liquidity. If a significant portion of the pool's liquidity is staked to a gauge,
      the active liquidity depth is reduced, making the TWAP more susceptible to manipulation
      (smaller capital required to move the price and thus distort tick cumulatives over time).
      Standard Uniswap V3 pools don't have this distinction since all liquidity is active.
      The oracle has no mechanism to detect the ratio of staked vs unstaked liquidity in the
      TWAP reference pool.
    attack_scenario: >
      1. For a token with TWAP_CHAINLINK_VERIFY mode, attacker identifies the configured TWAP
         reference pool (an Aerodrome Slipstream pool).
      2. Attacker stakes all liquidity in the pool to a gauge (using the gauge's stake() function
         if accessible), draining active in-range liquidity.
      3. With minimal active liquidity, attacker executes swaps to move tick cumulatives.
      4. After twapSeconds, the TWAP reflects the manipulated tick.
      5. If TWAP deviates from Chainlink by more than maxDifference, oracle reverts (DoS).
      6. Or: if mode is TWAP (no Chainlink verify), the manipulated TWAP is accepted as price.
      Impact: In TWAP-primary mode, price manipulation blocks or enables illegitimate liquidations.
    confidence: low
    verdict: >
      REAL RISK but requires: (a) attacker can mass-stake others' liquidity (not typical),
      or (b) attacker has own large position in the TWAP reference pool.
      More realistic as a TWAP manipulation vector than an exploit.
      Mitigated by Chainlink cross-check in CHAINLINK_TWAP_VERIFY mode.
    solidity: |
      // Property: TWAP pool should have sufficient active liquidity to resist manipulation
      function prop_twap_pool_active_liquidity_sufficient(address token) public view {
          TokenConfig memory cfg = oracle.feedConfigs(token);
          if (address(cfg.pool) != address(0) && cfg.twapSeconds > 0) {
              // Check that active liquidity (tick range containing current price) is meaningful
              // This is a monitoring property, not a hard invariant
              (uint160 sqrtPriceX96, int24 tick) = _getPoolSlot0(cfg.pool);
              // For full validation, would need to check liquidity at current tick
              // Approximate: pool.liquidity() should be > 0
              t(cfg.pool.liquidity() > 0,
                "VO-W-02: TWAP reference pool has zero active liquidity -> manipulation risk");
          }
      }


