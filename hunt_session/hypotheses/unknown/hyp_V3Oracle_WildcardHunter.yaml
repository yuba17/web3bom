  # VECTOR 9 — price0X96 vs price1X96 ordering correctness
  # ============================================================
  #
  # FINDING: VERIFIED CORRECT — No bug
  #
  # In _getTWAPPriceX96():
  #   priceX96 = _getReferencePoolPriceX96(pool) which returns sqrtPrice^2/Q96
  #   This is the ratio of token1/token0 amounts = price of token0 in terms of token1, in Q96.
  #   So priceX96 = price(token0) in token1 units * Q96
  #
  # If feedConfig.isToken0 == true (the configured token IS token0):
  #   poolTWAPPriceX96 = priceX96  [price of token0 in token1 = price of "token" in referenceToken]
  # If feedConfig.isToken0 == false (the configured token IS token1):
  #   poolTWAPPriceX96 = Q96^2 / priceX96  [invert: price of token1 in token0 = price of "token" in referenceToken]
  #
  # This is correct. The referenceToken is always the "other" token in the pool.
  # The pool validation in setTokenConfig ensures exactly one of {token0, token1} is referenceToken.
  #
  # In _populatePrices():
  #   state.price0X96 = price of position.token0 in referenceToken units
  #   state.price1X96 = price of position.token1 in referenceToken units
  # These are INDEPENDENT lookups based on each token's feedConfig.
  # The position's token0 and token1 may be DIFFERENT from the feedConfig pool's token0/token1.
  # Example: ETH/USDC position has token0=ETH, token1=USDC.
  #          USDC feedConfig pool might be USDC/WETH where token0=USDC, token1=WETH.
  #          isToken0=true for USDC in its feedConfig pool.
  #          So price of USDC = priceX96 of that pool.
  #          state.price1X96 (USDC price in WETH) = priceX96 = USDC price in WETH. CORRECT.
  #
  # VERDICT: Ordering is consistently handled. No bug.

