  - id: ARC-F-01
    title: "autoCompound: AERO/reward deduction BEFORE swap creates incentive misalignment"
    tier: 2
    type: ordering
    confidence: 70
    description: >
      In autoCompoundWithVaultAndRewardCompound(), AERO rewards are unstaked and added
      to the compound amounts BEFORE the swap occurs. The compound fee is calculated on
      total amounts including AERO.
      If the AERO→token swap yields less than expected (slippage), the fee is based on
      inflated input, not actual output. Keeper earns higher fee than the value added.
    affected_line: "AutoRangeAndCompound.sol:~390 executeWithVaultAndRewardCompound"
    status: low_priority
    solidity: |
      // INV-ARC-F-01: compoundFee based on actual liquidity added, not input amounts

  - id: ARC-F-02
    title: "execute: direct call on staked position skips GaugeManager unstake"
    tier: 1
    type: flow
    confidence: 80
    description: >
      execute() at line 162 can be called directly (not via vault.transform()).
      If a position is currently staked in GaugeManager (stakeToken=true config),
      and execute() is called directly (not via executeWithVault), the function
      will try to call vault.transform() which handles unstake internally.
      BUT: if VAULT strategy is used and execute() is called by the vault transformer path,
      the staking/unstaking is handled by GaugeManager integration.
      Question: what happens if execute() is called directly on a staked position
      where the NFT is held by GaugeManager, not by AutoRangeAndCompound?
      decreaseLiquidity would fail because the caller doesn't own the NFT.
    affected_line: "AutoRangeAndCompound.sol:162"
    attack_scenario: >
      1. Position staked in GaugeManager (NFT held by gauge)
      2. Direct execute() call bypassing vault.transform()
      3. npm.decreaseLiquidity() fails: AutoRangeAndCompound doesn't own the NFT
      4. Revert. No damage, but DoS until unstaked.
    status: confirmed_safe
    solidity: |
      // INV-ARC-F-02: execute() on staked position (held by gauge) fails gracefully

  - id: ARC-F-03
    title: "execute: staking state not restored on partial failure in vault strategy"
    tier: 1
    type: atomicity
    confidence: 75
    description: >
      For vault strategy with GaugeManager integration:
      1. vault.transform() calls execute()
      2. execute() unstakes from gauge (via _unstakeToken or vault.transform internals)
      3. execute() mints newTokenId, transfers to vault
      4. vault.onERC721Received migrates loan to newTokenId
      5. If step 3 or 4 fails, oldTokenId is already unstaked but newTokenId not created
      Result: position is unstaked (not accruing rewards) but the error was in execute(),
      not in the unstaking. The vault's transform mechanism should revert the whole thing.
      V3Vault._transform() has a revert path if health check fails.
      Is the unstaking within _transform() atomic? If GaugeManager state updates happened
      before the revert, they won't be rolled back (they're in a separate call).
    affected_line: "AutoRangeAndCompound.sol:162-360 execute(), V3Vault.sol:505-582 _transform()"
    attack_scenario: >
      Execute() is called via vault.transform(). GaugeManager._unstakePosition() succeeds.
      execute() then fails at npm.mint() (e.g., ticks out of range).
      V3Vault._transform() reverts (health check fails or execute revert propagates).
      But: GaugeManager._unstakePosition() already executed in a subcall.
      Does Solidity revert unwind cross-contract state changes in subcalls?
      YES — Solidity reverts ARE atomic across call stack. All subcall state reverts too.
      CONFIRMED SAFE — revert unwinds everything.
    status: confirmed_safe
    solidity: |
      // INV-ARC-F-03: Solidity atomicity ensures unstake is reverted if execute() fails

  - id: ARC-F-04
    title: "autoCompound: collect then addLiquidity ordering — fees collected before liquidity check"
    tier: 2
    type: ordering
    confidence: 65
    description: >
      autoCompound():
      1. Collect fees from position
      2. Check if amounts >= minThreshold (OR condition — see ARC-D-01)
      3. Optionally swap one token for the other
      4. addLiquidity
      5. Send compound fee to withdrawer
      If step 2 always passes for an out-of-range position with one-sided fees,
      the flow proceeds. But the OR condition means:
      - amount0 collected but min1 > 0 → amount1=0 < min1 → REVERT at step 2
      - fees were already collected (step 1), but the revert unwinds them (EVM atomicity)
      - Net effect: no fees collected, no compounding. Just gas waste.
      This confirms ARC-D-01 (OR condition DoS) without token loss.
    affected_line: "AutoRangeAndCompound.sol:438-445"
    status: confirms_ARC_D_01
    solidity: |
      // INV-ARC-F-04: out-of-range positions with one-sided fees cannot autoCompound
      // due to OR condition in min threshold check

  - id: ARC-F-05
    title: "execute: newTokenId config must be set before next keeper call"
    tier: 2
    type: ordering
    confidence: 70
    description: >
      After execute() creates newTokenId and sets positionConfigs[newTokenId],
      the old tokenId's config is still in positionConfigs[oldTokenId].
      If execute() is called again on oldTokenId (now burned/replaced), it would use
      the stale config but mint would fail since oldTokenId no longer exists.
      The _validateOwner check would also fail for burned oldTokenId.
      Self-protecting: burned tokens don't have owners.
    affected_line: "AutoRangeAndCompound.sol:350"
    status: low_priority
    solidity: |
      // INV-ARC-F-05: oldTokenId config is orphaned after execute() but poses no risk
