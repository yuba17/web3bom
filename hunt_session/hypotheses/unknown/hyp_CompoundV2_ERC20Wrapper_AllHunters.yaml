- id: CV2-04
  tier: 1
  type: property
  hunter: FlowHunter
  description: >
    compoundV2RedeemErc20 transfiere `received` (pre-calculado) no el balance
    real recibido. Con fee-on-transfer tokens como underlying, el adapter
    recibe menos que `received` del redeem, pero intenta transferir `received`
    al receiver — tomando fondos residuales o revertiendo.
  attack_scenario: >
    1. cToken tiene un fee-on-transfer token como underlying (ej: USDT con fee activado).
    2. Usuario llama compoundV2RedeemErc20 con N cTokens.
    3. Compound redeem entrega X underlying al adapter, pero fee-on-transfer
       causa que adapter reciba X - fee.
    4. adapter.safeTransfer(receiver, received) donde received > X - fee.
    5. Si hay dust de otro usuario: robo. Si no: revert.
  impact: "Robo de fondos residuales o DoS en redeem de tokens con fee"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Con fee-on-transfer token:
    uint256 balBefore = IERC20(underlying).balanceOf(address(adapter));
    adapter.compoundV2RedeemErc20(cToken, amount, receiver);
    uint256 balAfter = IERC20(underlying).balanceOf(address(adapter));
    // Adapter balance should never decrease (no funds should be taken from residual)
    gte(balAfter, balBefore, "CV2-04: adapter lost residual funds on redeem");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    Depende de si Compound V2 lista tokens con fee-on-transfer como cToken
    underlying. USDT tiene un mecanismo de fee (actualmente 0% pero puede
    activarse). Si algun cToken tiene un underlying con fee, esto es explotable.

