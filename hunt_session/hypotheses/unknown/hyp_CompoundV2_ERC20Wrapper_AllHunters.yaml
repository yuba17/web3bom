  description: >
    Maximizar la diferencia entre received (calculado por wMulDown) y el
    underlying realmente recibido del redeem de Compound V2.
  attack_scenario: >
    Si el delta es positivo, el adapter transfiere mas de lo recibido (roba dust).
    Si es negativo, tokens quedan stuck.
  solidity: |
    uint256 balBefore = IERC20(underlying).balanceOf(address(adapter));
    uint256 exchangeRate = ICToken(cToken).exchangeRateCurrent();
    uint256 calculated = MathLib.wMulDown(exchangeRate, cTokenAmount);
    ICToken(cToken).redeem(cTokenAmount);
    uint256 actualReceived = IERC20(underlying).balanceOf(address(adapter)) - balBefore;
    // Maximize the absolute difference
    int256 delta = int256(calculated) - int256(actualReceived);
    return delta > 0 ? delta : -delta;
