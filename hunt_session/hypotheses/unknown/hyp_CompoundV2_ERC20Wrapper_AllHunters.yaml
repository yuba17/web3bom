# ---------------------------------------------------------------------------
# MathHunter — Foco: delta entre received calculado y received real
# ---------------------------------------------------------------------------

- id: CV2-01
  tier: 1
  type: property
  hunter: MathHunter
  description: >
    compoundV2RedeemErc20 calcula received = wMulDown(exchangeRateCurrent, amount)
    ANTES del redeem. Si Compound V2 internamente redondea de forma distinta a
    wMulDown (mulDivDown(x, y, 1e18)), el adapter puede intentar transferir MAS
    tokens de los que realmente recibio del redeem, causando revert o robo de
    tokens residuales de otros usuarios en el adapter.
  attack_scenario: >
    1. Atacante u otro usuario deja dust de underlying en el adapter (de una operacion previa).
    2. Un usuario llama compoundV2RedeemErc20 con N cTokens.
    3. exchangeRateCurrent devuelve R. El adapter calcula received = R*N/1e18 (round down).
    4. Compound V2 internamente hace truncate(Exp({mantissa: R}) * N) que puede dar
       un resultado X donde X < received (rounding difference de 1-2 wei).
    5. El adapter transfiere `received` al receiver, pero solo recibio X del redeem.
    6. Delta (received - X) se toma del dust residual, robando fondos de otro usuario.
    Alternativamente, si no hay dust, la transferencia revierte silenciosamente dejando
    tokens stuck.
  impact: "Robo de dust residual de otros usuarios o tokens stuck en el adapter"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Pre-redeem: snapshot balances
    uint256 underlyingBefore = IERC20(underlying).balanceOf(address(adapter));
    uint256 cTokenAmount = ICToken(cToken).balanceOf(address(adapter));
    uint256 exchangeRate = ICToken(cToken).exchangeRateCurrent();
    uint256 calculatedReceived = MathLib.wMulDown(exchangeRate, cTokenAmount);

    // Execute redeem
    adapter.compoundV2RedeemErc20(cToken, cTokenAmount, receiver);

    uint256 underlyingAfter = IERC20(underlying).balanceOf(address(adapter));
    uint256 actualReceived = underlyingAfter - underlyingBefore + calculatedReceived; // what was sent out

    // The adapter must never transfer more than it actually received from redeem
    // actualReceived from Compound >= calculatedReceived transferido
    gte(actualReceived, calculatedReceived, "CV2-01: adapter transferred more than received from redeem");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 75
  notes: >
    Compound V2 usa Exp math con truncate (CarefulMath.sol). wMulDown usa
    mulDivDown(x, y, WAD). Ambos redondean abajo pero las implementaciones
    internas pueden diferir por 1 wei en edge cases. El riesgo es real cuando
    hay dust residual de operaciones previas. Necesita fork test con cUSDC/cDAI
    reales para confirmar si hay delta.

- id: CV2-02
  tier: 1
  type: property
  hunter: MathHunter
  description: >
