- id: EW-01
  tier: 1
  type: property
  hunter: FlowHunter
  description: >
    erc20WrapperWithdrawTo L57-58 hace un round-trip: adapter->initiator->adapter.
    Con fee-on-transfer wrapped tokens, el safeTransferFrom en L58 recibiria
    menos que `amount`, causando que withdrawTo(receiver, amount) falle o
    queme mas tokens wrapped de los que el adapter tiene.
  attack_scenario: >
    1. Wrapper token tiene fee-on-transfer (o el wrapper mismo aplica fee).
    2. Usuario llama erc20WrapperWithdrawTo con amount N.
    3. L57: adapter transfiere N wrapped tokens al initiator (initiator recibe N-fee1).
    4. L58: safeTransferFrom(initiator, adapter, N) — pero initiator solo tiene N-fee1.
    5. Revert por insufficient balance, o si initiator tenia tokens extra,
       se transfieren mas tokens de los esperados.
  impact: "DoS permanente para unwrap de wrapped tokens con fee, o perdida de tokens del initiator"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 initBalBefore = IERC20(wrapper).balanceOf(initiator);
    uint256 adapterBalBefore = IERC20(wrapper).balanceOf(address(adapter));

    adapter.erc20WrapperWithdrawTo(wrapper, receiver, amount);

    uint256 initBalAfter = IERC20(wrapper).balanceOf(initiator);
    // Initiator should not lose any wrapped tokens in the round-trip
    eq(initBalAfter, initBalBefore, "EW-01: initiator lost tokens in round-trip");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 60
  notes: >
    El round-trip existe para compliance con permissioned wrappers que verifican
    msg.sender. Si el wrapped token tiene fee-on-transfer, el flujo se rompe.
    La pregunta clave: existen ERC20 wrappers permissioned que tambien tienen
    fee-on-transfer? Si si, esto es un bug real.

- id: EW-02
  tier: 1
  type: property
  hunter: FlowHunter
  description: >
    erc20WrapperDepositFor hace forceApprove(max) antes del depositFor y
    forceApprove(0) despues. Con fee-on-transfer underlying, el wrapper
    recibe menos que `amount`, pero depositFor podria mintear wrapped
    tokens basado en el amount parametro, no el amount recibido.
    Resultado: inflacion del wrapped token.
  attack_scenario: >
    1. Underlying tiene 1% fee-on-transfer.
    2. Usuario deposita 1000 tokens via erc20WrapperDepositFor.
    3. Wrapper recibe 990 tokens pero mintea 1000 wrapped tokens al initiator.
    4. Wrapper tiene mas wrapped supply que underlying backing → insolvencia.
  impact: "Insolvencia del wrapper si el underlying tiene fee-on-transfer"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 underlyingInWrapper = underlying.balanceOf(address(wrapper));
    uint256 wrappedSupply = IERC20(wrapper).totalSupply();

    adapter.erc20WrapperDepositFor(wrapper, amount);

    uint256 underlyingInWrapperAfter = underlying.balanceOf(address(wrapper));
    uint256 wrappedSupplyAfter = IERC20(wrapper).totalSupply();

    uint256 underlyingDelta = underlyingInWrapperAfter - underlyingInWrapper;
    uint256 wrappedDelta = wrappedSupplyAfter - wrappedSupply;

    // Wrapped minted should not exceed underlying actually received
    lte(wrappedDelta, underlyingDelta,
        "EW-02: wrapper minted more than underlying received (fee-on-transfer)");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    Esto es un bug del WRAPPER, no del adapter. Pero el adapter facilita
    el path. OZ ERC20Wrapper.depositFor() usa _mint(account, amount) directamente
    sin verificar balance delta. Si el underlying tiene fee, el wrapper es
    insolvente. El adapter es el vector de ataque, el wrapper es el vulnerable.

# ---------------------------------------------------------------------------
# TrustBoundaryHunter — Foco: wrapper malicioso, initiator hardcoded
# ---------------------------------------------------------------------------

- id: EW-03
  tier: 1
  type: property
  hunter: TrustBoundaryHunter
  description: >
    erc20WrapperDepositFor L35 deposita al initiator() hardcoded. Esto es
    correcto para el uso normal, pero wrapper es user-supplied. Un wrapper
    malicioso podria: (a) no mintear nada, robando el underlying, (b) mintear
    a otra direccion, (c) hacer reentrancy via depositFor callback.
  attack_scenario: >
    1. Atacante crea un contrato malicioso que implementa la interfaz ERC20Wrapper.
    2. underlying() devuelve USDC real.
    3. depositFor() roba los USDC aprobados (forceApprove(max) en L33) y no mintea nada.
    4. Victima llama erc20WrapperDepositFor con el wrapper malicioso.
    5. USDC del adapter van al wrapper malicioso via transferFrom (el wrapper tiene approval).
    NOTA: Esto requiere que la victima pase un wrapper malicioso como parametro.
    En Bundler3, el initiator es quien construye el bundle, asi que se estaria
    atacando a si mismo. Solo explotable si el bundle se construye por un
    frontend comprometido.
  impact: "Perdida total del underlying si el usuario interactua con wrapper malicioso"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // El adapter no valida que wrapper sea un contrato confiable
    // No hay whitelist ni registry check
    // Invariante: underlying balance del adapter no debe disminuir mas que amount
    uint256 balBefore = underlying.balanceOf(address(adapter));
    adapter.erc20WrapperDepositFor(wrapper, amount);
    uint256 balAfter = underlying.balanceOf(address(adapter));
    // Should have decreased by exactly amount (sent to wrapper)
    eq(balBefore - balAfter, amount,
       "EW-03: unexpected underlying loss in depositFor");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: >
    El riesgo es mitigado porque el initiator construye su propio bundle.
    Un usuario no pasaria un wrapper malicioso a menos que el frontend
    este comprometido o sea un ataque de phishing. Probablemente by design
    (el bundler es permissionless y el usuario es responsable de los params).

- id: EW-04
  tier: 2
  type: property
  hunter: TrustBoundaryHunter
  description: >
    erc20WrapperWithdrawTo L58 hace safeTransferFrom(initiator, adapter, amount).
    Esto requiere que el initiator haya aprobado al adapter para el wrapped token.
    Si el initiator no aprobo, la tx revierte. Esto podria ser un DoS si el
    usuario no sabe que necesita aprobar.
  attack_scenario: >
    1. Usuario llama erc20WrapperWithdrawTo sin haber aprobado al adapter.
    2. L57: adapter transfiere wrapped tokens al initiator (exito).
    3. L58: safeTransferFrom(initiator, adapter, amount) revierte por falta de approval.
    4. Toda la tx revierte, incluyendo L57, asi que no hay perdida.
    Pero: si el bundle tenia acciones previas con side-effects externos
    (ej: ya repago deuda en Compound), esas acciones se revierten tambien.
  impact: "DoS si usuario no pre-aprueba. No perdida directa por atomicidad."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que el adapter tiene approval del initiator para el wrapped token
    uint256 allowance = IERC20(wrapper).allowance(initiator, address(adapter));
    gte(allowance, amount,
        "EW-04: initiator has not approved adapter for wrapped token withdrawTo");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: >
    El bundler probablemente incluye un paso de approval previo en el bundle.
    Pero si se omite, todo el bundle revierte. Verificar si hay documentacion
    que lo aclare. Probablemente known behavior / by design.

