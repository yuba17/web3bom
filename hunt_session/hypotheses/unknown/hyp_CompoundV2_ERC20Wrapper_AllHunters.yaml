    received = wMulDown(exchangeRateCurrent, amount) puede diferir del ETH
    realmente recibido del redeem de cETH. sendValue transfiere received,
    no el ETH real recibido.
  attack_scenario: >
    Identico a CV2-01 pero con ETH. Si received > actual ETH del redeem,
    sendValue puede usar ETH residual del adapter de otra operacion,
    o revertir si no hay suficiente.
  impact: "Robo de ETH residual o operacion stuck"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 ethBefore = address(adapter).balance;
    uint256 cEthAmount = ICEth(cEth).balanceOf(address(adapter));
    uint256 exchangeRate = ICEth(cEth).exchangeRateCurrent();
    uint256 calculatedReceived = MathLib.wMulDown(exchangeRate, cEthAmount);

    adapter.compoundV2RedeemEth(cEthAmount, receiver);

    uint256 ethAfter = address(adapter).balance;
    // adapter should not have lost more ETH than it gained from redeem
    gte(ethBefore + calculatedReceived - ethAfter, calculatedReceived,
        "CV2-02: adapter sent more ETH than received from cETH redeem");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 75
  notes: Misma raiz que CV2-01, aplicada a la variante ETH.

- id: CV2-03
  tier: 2
  type: property
  hunter: MathHunter
  description: >
    borrowBalanceCurrent() accrues interest como side-effect. Si se llama
    multiples veces en la misma transaccion, el balance puede cambiar entre
    llamadas. En compoundV2RepayErc20, amount se capea al borrowBalance
    en L46, pero el repay en L52 podria ver un balance ligeramente diferente
    si hay interacciones intermedias.
  attack_scenario: >
    En una misma transaccion bundled: (1) accion que causa interest accrual
    en el cToken, (2) compoundV2RepayErc20. El borrowBalanceCurrent en paso 2
    ya accrued en paso 1, pero si el order of operations causa un segundo accrual
    el amount podria ser incorrecto.
  impact: "Repay parcial inesperado, dust de deuda residual"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // En la misma tx: verificar que el amount repaid == amount calculado
    uint256 debtBefore = ICToken(cToken).borrowBalanceCurrent(onBehalf);
    adapter.compoundV2RepayErc20(cToken, type(uint256).max, onBehalf);
    uint256 debtAfter = ICToken(cToken).borrowBalanceCurrent(onBehalf);
    // Debt should be fully repaid when passing max
    eq(debtAfter, 0, "CV2-03: debt not fully repaid with max amount");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    borrowBalanceCurrent es idempotente dentro del mismo bloque (accrueInterest
    se ejecuta una vez por bloque en Compound V2). Probablemente no explotable,
    pero necesita verificacion en fork.

