- id: CV2-07
  tier: 2
  type: property
  hunter: DomainHunter
  description: >
    Si el cToken esta pausado en Compound V2 (comptroller.redeemGuardianPaused),
    redeem() revierte. Pero exchangeRateCurrent() ya se ejecuto y accrued
    interest (side effect). No causa perdida de fondos pero gasta gas
    innecesariamente y el error message puede ser confuso.
  attack_scenario: >
    Usuario intenta migrar de Compound V2 pausado. exchangeRateCurrent
    ejecuta accrueInterest (exito), luego redeem falla. La tx revierte
    limpiamente gracias al require, pero el usuario paga gas por el
    accrueInterest innecesario.
  impact: "Gas waste, no perdida de fondos"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Si cToken esta pausado, la funcion debe revertir limpiamente
    // No hay invariante de Solidity util aqui, es un test de integracion
    // Verificar que no queda estado corrupto tras revert
    uint256 cBal = ICToken(cToken).balanceOf(address(adapter));
    // intentar redeem (esperamos revert si pausado)
    // post-revert: balance de cToken sin cambio
    eq(ICToken(cToken).balanceOf(address(adapter)), cBal,
       "CV2-07: cToken balance changed despite paused redeem");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Compound V2 pausa via comptroller. El revert es limpio y no deja
    estado inconsistente. Informational.

