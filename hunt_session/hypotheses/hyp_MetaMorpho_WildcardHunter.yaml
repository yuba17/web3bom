- id: MM-WC-08
  tier: 1
  type: property
  description: '_supplyMorpho (L791) and _withdrawMorpho (L815) use try/catch around
    Morpho supply/withdraw calls. If a market reverts (paused, oracle failure, etc.),
    the vault silently skips it and tries the next market in the queue. Key safety:
    inside the try block, assets -= toSupply (L792) only executes on success. On catch,
    assets remains unchanged and the loop continues. If ALL markets fail or hit caps,
    the function reverts at L799/L823. The concern: a temporarily failing market could
    cause funds to be deposited into a less optimal market without the depositor''s
    knowledge. The depositor expected their funds to go to market A (first in supplyQueue)
    but it went to market B (lower APY, higher risk). But: the depositor has no guarantee
    about which market receives their deposit. The supplyQueue order is set by the
    allocator. The depositor trusts the vault''s allocation strategy. Skipping a reverting
    market is strictly better than DoS-ing all deposits. More interesting: _withdrawMorpho
    with try/catch at L815. If a market reverts on withdraw, the vault tries the next
    market. If enough liquidity exists across other markets, the withdrawal succeeds.
    But if the reverting market has the majority of vault''s funds, withdrawal may
    partially fail and L823 reverts with NotEnoughLiquidity. In this case, the try/catch
    does NOT help the user — it''s equivalent to the market being illiquid.

    '
  attack_scenario: '1. Market A (80% of vault''s funds) has oracle failure → withdraw
    reverts 2. User tries to withdraw 100K from vault 3. _withdrawMorpho tries A →
    catch → tries B (20% of funds) 4. B has only 20K available → withdraws 20K, remaining
    80K 5. L823 reverts: NotEnoughLiquidity 6. User can only withdraw up to B''s liquidity
    This is the correct behavior — the vault cannot conjure liquidity. The try/catch
    just ensures OTHER markets are still accessible.

    '
  impact: 'Low. The try/catch pattern is a safety feature, not a vulnerability. It
