- id: MM-WC-14
  tier: 1
  type: property
  description: 'In reallocate() (L395-396), when allocation.assets == type(uint256).max
    for a supply entry, suppliedAssets = totalWithdrawn.zeroFloorSub(totalSupplied).
    This is the "supply all remaining" pattern for the last entry. Edge case: if totalWithdrawn
    < totalSupplied when reaching the max entry, zeroFloorSub returns 0, and the entry
    is skipped (L399: continue). Then at L416: totalWithdrawn != totalSupplied → revert.
    This could happen if the allocator miscalculated or if market conditions changed
    between the tx creation and execution (e.g., interest accrual during the tx changed
    supply amounts). More interesting: the type(uint256).max entry doesn''t check
    the cap at L401-404 because L395 computes the exact remaining amount, which might
    be within cap. But if the exact remaining exceeds the cap, L404 reverts with SupplyCapExceeded.
    The allocator must ensure the last market has enough cap headroom. Grief vector:
    someone front-runs the reallocate tx by supplying on behalf of the vault to the
    target market, filling its cap. The reallocate then reverts. But the allocator
    can retry or use a different market as the catch-all.

    '
  attack_scenario: '1. Allocator prepares: withdraw from A, supply to B (type(uint256).max)
    2. Front-runner: MORPHO.supply(B, hugeAmount, 0, vaultAddr, "") 3. B''s cap is
    now full (vault''s supplyAssets >= supplyCap) 4. Allocator''s reallocate: suppliedAssets
    for B = remaining 5. supplyAssets + suppliedAssets > supplyCap → revert SupplyCapExceeded
    6. Allocator''s reallocation fails This is a griefing attack on the allocator,
    not on depositors. The funds remain in market A (withdrawal reverted atomically).

    '
