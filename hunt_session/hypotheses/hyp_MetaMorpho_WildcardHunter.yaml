- id: MM-WC-13
  tier: 1
  type: property
  description: "withdraw() (L565) and redeem() (L579) update lastTotalAssets as:\n\
    \  _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets))\nThe code comments\
    \ acknowledge this \"may be a little off from totalAssets()\". The gap comes from:\
    \ newTotalAssets is computed at the START of the function via _accrueFee(). By\
    \ the time _withdrawMorpho executes, Morpho may have accrued a tiny bit more interest\
    \ (if another tx intervened in the same block, or due to block timestamp rounding).\
    \ More importantly: Morpho's share→asset conversion rounds down (L712: toAssetsDown).\
    \ The withdrawal amount may not exactly match what Morpho actually withdraws due\
    \ to rounding. The gap is at most 1 wei per market. Over thousands of withdrawals,\
    \ the accumulated rounding in lastTotalAssets could be up to (num_withdrawals)\
    \ wei. At 1M withdrawals, that's 1M wei ≈ 0.000000000001 ETH. Negligible. The\
    \ zeroFloorSub prevents underflow if assets > newTotalAssets (e.g., due to socialized\
    \ bad debt reducing totalAssets between _accrueFee and the actual withdrawal).\n"
