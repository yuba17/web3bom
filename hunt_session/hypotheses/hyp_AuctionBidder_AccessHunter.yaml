hunter: AccessHunter
component: AuctionBidder
date: "2026-03-22"
scope_files:
  - src/AuctionBidder.sol
  - src/Caller.sol
  - src/PausableWithAccessControl.sol
  - src/BaseAuction.sol

# ═══════════════════════════════════════════════════════════════
# ACCESS CONTROL ANALYSIS SUMMARY
# ═══════════════════════════════════════════════════════════════
#
# Role map:
#   DEFAULT_ADMIN_ROLE → withdraw(), setAuction(), setReceiver(), grantRole(), revokeRole()
#   AUCTION_BIDDER_ROLE → bid()
#   PAUSER_ROLE → emergencyPause()
#   UNPAUSER_ROLE → emergencyUnpause()
#   (no role) → auctionCallback() — guarded by msg.sender == s_auction && from == address(this)
#
# Admin transfer: uses AccessControlDefaultAdminRules (2-step with timelock delay)
#
# Key observations:
#   1. withdraw() has no whenNotPaused — admin can withdraw even when paused
#   2. _multiCall has NO target restrictions — can call ANY address including self
#   3. auctionCallback guard relies on s_auction being trusted, which admin controls via setAuction()
#   4. Caller._call uses target.call(data) with no value, no target whitelist
#

invariants:
  - id: AB-A-01
    title: "_multiCall can self-call AuctionBidder to escalate AUCTION_BIDDER_ROLE to admin"
    description: |
      The _multiCall function in Caller.sol performs arbitrary low-level calls with NO
      restriction on the target address. When called from auctionCallback(), which is
      triggered during bid(), the call chain is:
        AUCTION_BIDDER_ROLE → bid() → auction.bid() → auctionCallback() → _multiCall(calls)

      The AUCTION_BIDDER_ROLE controls the `solution` parameter passed to bid(), which
      becomes the `data` parameter in auctionCallback(), which is decoded as Call[] and
      executed via _multiCall.

      CRITICAL QUESTION: Can a Call target address(this) (the AuctionBidder contract itself)?

      If yes, the AUCTION_BIDDER_ROLE could craft a solution that calls:
        target: address(AuctionBidder)
        data: abi.encodeWithSelector(AuctionBidder.setAuction.selector, maliciousAuction)
      or even:
        data: abi.encodeWithSelector(AccessControl.grantRole.selector, DEFAULT_ADMIN_ROLE, attacker)

      HOWEVER: These calls would execute as address(this) calling itself. The msg.sender
      for the self-call would be address(AuctionBidder) itself. For grantRole, the caller
      needs DEFAULT_ADMIN_ROLE. The AuctionBidder contract does NOT have DEFAULT_ADMIN_ROLE
      granted to itself (it's granted to the admin EOA in the constructor).

      So the self-call to grantRole would revert with AccessControlUnauthorizedAccount.

      Similarly, setAuction requires DEFAULT_ADMIN_ROLE, and the contract doesn't have
      that role on itself.

      VERDICT: NOT exploitable for privilege escalation because the AuctionBidder contract
      itself does not hold DEFAULT_ADMIN_ROLE. The self-call's msg.sender is address(this)
      which lacks admin privileges.
    confidence: 15
    severity: "Info"
    status: "likely_safe"
    attack_scenario: |
      1. Attacker has AUCTION_BIDDER_ROLE
      2. Attacker calls bid() with solution containing Call{target: address(AuctionBidder), data: grantRole(DEFAULT_ADMIN_ROLE, attacker)}
      3. During auctionCallback, _multiCall executes this self-call
      4. Self-call reverts because msg.sender (= AuctionBidder address) lacks DEFAULT_ADMIN_ROLE
      RESULT: Attack fails. No escalation possible via this path.
    code_location: "Caller.sol:L27 (_call), AuctionBidder.sol:L109 (_multiCall in auctionCallback)"

  - id: AB-A-02
    title: "_multiCall arbitrary external calls — AUCTION_BIDDER_ROLE can drain approved tokens"
    description: |
      While self-call escalation fails (AB-A-01), the _multiCall has a REAL and significant
      capability: the AUCTION_BIDDER_ROLE can make the AuctionBidder contract call ANY
      external contract with ANY calldata, as msg.sender = AuctionBidder.

      This means if any ERC20 token has approved the AuctionBidder contract as a spender
      (e.g., via forceApprove in the bid flow at line 78 or line 111), the AUCTION_BIDDER_ROLE
      can craft a solution that calls:
        target: tokenAddress
        data: abi.encodeWithSelector(IERC20.transferFrom.selector, someVictim, attacker, amount)

      More concretely, in auctionCallback at line 111:
        IERC20(assetOut).forceApprove(msg.sender, amountOut);
      This approves the AUCTION contract to pull assetOut. But before this line executes,
      _multiCall runs at line 109, and the AUCTION_BIDDER_ROLE controls those calls.

      The AUCTION_BIDDER_ROLE could call ERC20.transfer() on any token held by the contract
      to drain its balance to any address.

      HOWEVER: This is BY DESIGN. The AuctionBidder contract is explicitly described as
      executing "arbitrary logic to solve the auction" (line 19). The AUCTION_BIDDER_ROLE
      is a TRUSTED role — it's expected to perform swaps, DEX interactions, etc. to source
      the assetOut needed to pay the auction.

      The trust model assumes AUCTION_BIDDER_ROLE is a trusted bot/solver, not an adversary.
      If this role is compromised, arbitrary calls are the least of the problems.
    confidence: 20
    severity: "Low"
    status: "by_design"
    attack_scenario: |
      1. Compromised AUCTION_BIDDER_ROLE calls bid() with solution = [Call{target: USDC, data: transfer(attacker, balance)}]
      2. During auctionCallback, _multiCall transfers all USDC from AuctionBidder to attacker
      3. But this requires the role to already be compromised — the role IS the trust boundary
    code_location: "AuctionBidder.sol:L107-L109, Caller.sol:L27"
    trust_assumption: "AUCTION_BIDDER_ROLE is a trusted solver/bot operated by the protocol team"

  - id: AB-A-03
    title: "withdraw() lacks whenNotPaused modifier — admin can withdraw during emergency pause"
    description: |
      The withdraw() function at line 119-131 has onlyRole(DEFAULT_ADMIN_ROLE) but does NOT
      have the whenNotPaused modifier. Compare with bid() (line 69) and auctionCallback()
      (line 102) which both have whenNotPaused.

      This means the admin can withdraw all tokens even when the contract is paused.

      ANALYSIS: This is almost certainly INTENTIONAL and good security practice.
      The emergency pause is meant to stop auction operations (bid, callback). But the admin
      should still be able to rescue funds during an emergency. If withdraw() were also
      paused, a pause would lock funds with no recovery path (the admin would need to
      unpause, which requires UNPAUSER_ROLE — a different role).

      This follows the standard pattern: pause stops user-facing operations, admin rescue
      functions remain available during emergencies.
    confidence: 5
    severity: "Info"
    status: "by_design"
    attack_scenario: "N/A — this is correct behavior. Admin rescue should work during pause."
    code_location: "AuctionBidder.sol:L119-L131"

  - id: AB-A-04
    title: "auctionCallback auth bypass via malicious auction set by compromised admin"
    description: |
      auctionCallback() guards access with:
        if (msg.sender != address(s_auction) || from != address(this)) revert;

      The admin can call setAuction() to point s_auction to a malicious contract.
      A malicious auction could call auctionCallback() with from=address(AuctionBidder)
      and arbitrary data, triggering _multiCall with attacker-controlled calls.

      HOWEVER: This requires DEFAULT_ADMIN_ROLE to be compromised. If the admin is
      compromised, they can already call withdraw() directly to drain all funds.
      Setting a malicious auction to exploit _multiCall is strictly worse than just
      calling withdraw().

      setAuction also validates:
        1. auction != address(0) (line 153)
        2. auction.supportsInterface(IBaseAuction) (line 156) — attacker contract must implement this
        3. auction != current auction (line 159)

      The ERC165 check is trivially bypassable (attacker contract returns true).

      VERDICT: Redundant attack path. Compromised admin has simpler ways to steal funds.
    confidence: 10
    severity: "Info"
    status: "by_design"
    attack_scenario: |
      1. Compromised admin calls setAuction(maliciousContract)
      2. maliciousContract calls AuctionBidder.auctionCallback(address(AuctionBidder), token, amount, maliciousData)
      3. _multiCall executes attacker-controlled calls as AuctionBidder
      4. But: admin could just call withdraw() instead — same outcome, simpler path
    code_location: "AuctionBidder.sol:L97-L112, L140-L166"
    trust_assumption: "DEFAULT_ADMIN_ROLE is the highest trust boundary — if compromised, all bets are off"

  - id: AB-A-05
    title: "auctionCallback from parameter trust — BaseAuction passes msg.sender as from"
    description: |
      In BaseAuction.bid() at line 449:
        IAuctionCallback(msg.sender).auctionCallback(msg.sender, assetOut, assetOutAmount, data);

      The `from` parameter is msg.sender (the bidder contract). In AuctionBidder, the check is:
        from != address(this)  → revert

      This means the callback ONLY succeeds when from == address(AuctionBidder), which
      happens when msg.sender to BaseAuction.bid() is the AuctionBidder contract.

      The flow is:
        AuctionBidder.bid() → auction.bid() → auction calls back AuctionBidder.auctionCallback()

      In this flow, msg.sender to auction.bid() IS address(AuctionBidder), so from == address(this).

      Can anyone else trigger this? They would need:
        1. Call BaseAuction.bid() from address X
        2. BaseAuction calls IAuctionCallback(X).auctionCallback(X, ...) on X
        3. X would need to be AuctionBidder... but X is msg.sender calling auction.bid()

      So the only way to reach auctionCallback with valid from is if AuctionBidder itself
      called auction.bid(). This can only happen through AuctionBidder.bid() which requires
      AUCTION_BIDDER_ROLE.

      VERDICT: The access control chain is sound. No bypass possible.
    confidence: 5
    severity: "Info"
    status: "safe"
    attack_scenario: "N/A — the msg.sender == s_auction AND from == address(this) combination is unforgeable."
    code_location: "AuctionBidder.sol:L97-L105, BaseAuction.sol:L449"

  - id: AB-A-06
    title: "_multiCall can approve arbitrary spenders — leftover approval after auctionCallback"
    description: |
      After _multiCall executes at line 109, line 111 does:
        IERC20(assetOut).forceApprove(msg.sender, amountOut);

      This approves the auction contract to pull exactly amountOut of assetOut.

      But during _multiCall, the AUCTION_BIDDER_ROLE-controlled calls could have:
        1. Called IERC20(someToken).approve(attackerContract, type(uint256).max)
        2. Left a dangling infinite approval on a token the AuctionBidder holds

      After the bid completes, the attacker contract could pull those tokens later.

      HOWEVER: Same trust model as AB-A-02. The AUCTION_BIDDER_ROLE is trusted to perform
      legitimate solver operations. The _multiCall is designed for DEX swaps which DO
      require approvals. This is the intended use case.

      A real concern would be if AUCTION_BIDDER_ROLE is a semi-trusted role (e.g., a third
      party solver). In that case, leftover approvals after bid completion could be a vector.
      But the contract sends leftover assetOut to s_receiver at lines 85-91, and there's
      no mechanism to leave other tokens stranded.
    confidence: 25
    severity: "Low"
    status: "design_tradeoff"
    attack_scenario: |
      1. AUCTION_BIDDER_ROLE calls bid() with solution containing approve(attacker, MAX) for a token
      2. Bid completes normally
      3. Later, attacker uses the dangling approval to pull tokens sent to AuctionBidder
      4. Risk: only if tokens accumulate in AuctionBidder between bids
    code_location: "AuctionBidder.sol:L107-L111, Caller.sol:L27"
    trust_assumption: "AUCTION_BIDDER_ROLE is trusted. If semi-trusted, leftover approvals are a risk."

  - id: AB-A-07
    title: "No reentrancy guard on auctionCallback — but BaseAuction has s_entered"
    description: |
      auctionCallback() has no explicit reentrancy guard. However, it's called from
      BaseAuction.bid() which sets s_entered = true before the callback (line 418) and
      clears it after (line 457).

      If _multiCall tried to re-enter BaseAuction.bid() (to get a second callback),
      it would hit the s_entered check at line 415-416 and revert.

      If _multiCall tried to call AuctionBidder.bid() directly (to start a new bid flow),
      it would succeed as a self-call IF the contract has AUCTION_BIDDER_ROLE on itself
      (it doesn't by default). Even if it did, the inner bid() would call auction.bid()
      which would revert due to s_entered.

      VERDICT: Reentrancy is properly prevented by BaseAuction's s_entered flag.
    confidence: 5
    severity: "Info"
    status: "safe"
    attack_scenario: "N/A — BaseAuction.s_entered prevents reentrancy into auction.bid()."
    code_location: "BaseAuction.sol:L415-L418,L457, AuctionBidder.sol:L97-L112"

summary: |
  AuctionBidder access control is well-designed for a TRUSTED role model:

  1. AUCTION_BIDDER_ROLE has powerful capabilities via _multiCall (arbitrary external calls),
     but this is BY DESIGN for solver/MEV bot operations. The role MUST be trusted.

  2. withdraw() without whenNotPaused is CORRECT — admin rescue during emergencies.

  3. auctionCallback auth (msg.sender == s_auction && from == address(this)) is SOUND —
     the combination is unforgeable given BaseAuction passes msg.sender as from.

  4. Self-call via _multiCall cannot escalate privileges because the contract itself
     does not hold DEFAULT_ADMIN_ROLE.

  5. The only real concern is AB-A-06 (leftover approvals from _multiCall), which is
     Low severity and only matters if AUCTION_BIDDER_ROLE is semi-trusted.

  NO HIGH/CRITICAL ACCESS CONTROL FINDINGS. The trust model is intentionally permissive
  for the AUCTION_BIDDER_ROLE because it needs to execute arbitrary solver logic.

  Key trust assumption to validate: Is AUCTION_BIDDER_ROLE intended to be a Chainlink-operated
  bot, or could third-party solvers receive this role? If the latter, AB-A-02 and AB-A-06
  escalate to Medium.
