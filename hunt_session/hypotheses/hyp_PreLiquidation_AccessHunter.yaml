- id: PL-AC-03
  tier: 1
  type: property
  description: >
    Autorizar un PreLiquidation contract en Morpho otorga acceso global: withdraw supply,
    borrow, withdrawCollateral en CUALQUIER mercado — no solo pre-liquidación.
    Si el borrower tiene supply shares en otros mercados, el PreLiquidation contract
    (o cualquiera que pueda hacer que PreLiquidation actúe como msg.sender hacia Morpho)
    podría drenar esos fondos.
  attack_scenario: >
    1. Borrower autoriza PreLiquidation contract via morpho.setAuthorization(preLiquidation, true)
    2. El PreLiquidation contract solo llama withdrawCollateral y repay en su código.
    3. PERO: isAuthorized[borrower][preLiquidation] = true permite que preLiquidation
       también llame withdraw(), borrow() on behalf of borrower en CUALQUIER mercado.
    4. El PreLiquidation contract NO tiene funciones para llamar withdraw/borrow —
       PERO si existe un vector para hacer que PreLiquidation ejecute código arbitrario
       (e.g., via callback, delegatecall, o proxy upgrade), podría explotar esta autorización.
    5. Vector concreto: el callback onPreLiquidate(liquidator) da control al liquidator
       DURANTE la ejecución donde PreLiquidation es msg.sender en Morpho. Sin embargo,
       después del callback, PreLiquidation solo hace safeTransferFrom del liquidator,
       no interactúa más con Morpho. El callback ocurre DESPUÉS de withdrawCollateral
       y ANTES de la transferencia — el liquidator tiene control pero no puede hacer que
       PreLiquidation llame más funciones de Morpho.
    6. Conclusión: el contrato PreLiquidation no expone funciones para explotar la autorización
       global, pero la autorización global ES un riesgo de diseño si el borrower también tiene
       posiciones en otros mercados.
  impact: "Potencial drenaje de fondos del borrower en otros mercados si se encuentra un vector de ejecución"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que PreLiquidation NO puede llamar withdraw/borrow en Morpho
    // El contrato no expone estas funciones, pero verificamos que no hay paths ocultos
    // Este invariante se verifica por inspección de código: PreLiquidation solo interactúa
    // con Morpho via repay() y withdrawCollateral() — ambas hardcodeadas.
    // No hay fallback, no hay receive, no hay delegatecall, no hay selfdestruct.
    // El callback onPreLiquidate va al LIQUIDATOR, no al PreLiquidation contract.
    t(true, "PL-AC-03: verified by code inspection - no arbitrary Morpho interaction paths");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    Este es un finding de diseño, no un bug de código. Morpho's authorization model es
