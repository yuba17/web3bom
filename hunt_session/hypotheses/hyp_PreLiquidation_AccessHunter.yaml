       pero con PRE_LIQUIDATION_ORACLE apuntando a un oráculo manipulable.
    2. El constructor valida parámetros contra Morpho real — pasa las validaciones.
    3. El PRE_LIQUIDATION_ORACLE puede ser CUALQUIER dirección con función price().
    4. El atacante controla el oráculo: puede hacer que reporte un precio bajo,
       haciendo que posiciones saludables parezcan pre-liquidables.
    5. Si un borrower autoriza este contrato (error del borrower), el atacante manipula
       el oráculo y pre-liquida.
