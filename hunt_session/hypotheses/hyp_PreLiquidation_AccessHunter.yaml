- id: PL-AC-06
  tier: 1
  type: property
  description: >
    El callback onPreLiquidate al liquidator ocurre DURANTE la ejecución de onMorphoRepay,
    DESPUÉS de withdrawCollateral pero ANTES de safeTransferFrom del liquidator.
    Si el liquidator es un contrato malicioso, tiene control de ejecución en un estado
    intermedio donde el colateral ya fue transferido pero el repago aún no se cobró.
  attack_scenario: >
    1. Liquidator malicioso llama preLiquidate con data no vacío
    2. Flujo: preLiquidate -> MORPHO.repay -> callback onMorphoRepay
    3. En onMorphoRepay: withdrawCollateral transfiere colateral al liquidator
    4. onPreLiquidate(liquidator) da control al liquidator
    5. Estado intermedio: liquidator tiene el colateral, pero aún no ha pagado
    6. El liquidator podría intentar re-entrar preLiquidate o interactuar con Morpho
    7. Pero después del callback, safeTransferFrom cobra el repago — si el liquidator
       no tiene fondos, revierte toda la tx.
    8. Morpho tiene reentrancy protection? Verificar.
    Re-entrancy via preLiquidate: preLiquidate -> MORPHO.accrueInterest + repay.
    Si Morpho tiene reentrancy guard, re-entrar en repay/withdrawCollateral fallaría.
    Si NO tiene guard, el liquidator podría explotar el estado inconsistente.
  impact: "Potencial reentrancy si Morpho no tiene guard — doble withdrawCollateral"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que no se puede re-entrar preLiquidate durante el callback
    // El invariante es: después de un preLiquidate exitoso, los balances son consistentes
    uint256 borrowerCollateralBefore = morpho.position(id, borrower).collateral;
    uint256 borrowerDebtBefore = morpho.position(id, borrower).borrowShares;

    // Execute preLiquidate
    (uint256 seized, uint256 repaid) = preLiquidation.preLiquidate(borrower, seizedAmount, 0, bytes(""));

    uint256 borrowerCollateralAfter = morpho.position(id, borrower).collateral;
    uint256 borrowerDebtAfter = morpho.position(id, borrower).borrowShares;

    // Colateral debe haber disminuido exactamente en seized
    eq(borrowerCollateralBefore - borrowerCollateralAfter, seized, "PL-AC-06: collateral mismatch");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    INVESTIGACIÓN PENDIENTE: ¿Morpho Blue tiene reentrancy guard?
    Revisando Morpho.sol — NO hay modifier nonReentrant visible. Las funciones repay,
    withdrawCollateral, borrow, withdraw NO tienen reentrancy guard explícito.
    Sin embargo, Morpho usa el patrón checks-effects-interactions de forma estricta:
    en repay(), primero actualiza state (borrowShares, totalBorrowShares, totalBorrowAssets),
    luego hace callback, luego safeTransferFrom. El state ya está actualizado cuando el
    callback ocurre, así que re-entrar no duplicaría el repago.
    Para withdrawCollateral: actualiza collateral, verifica health, luego transfiere.
    El state está actualizado ANTES del transfer.
    Conclusión: NO hay reentrancy guard explícito pero el patrón CEI protege contra
    reentrancy simple. Sin embargo, cross-function reentrancy podría ser posible.
    Marcado confidence 55% — necesita más investigación.
  poc_sketch: |
    // Malicious liquidator contract:
    // In onPreLiquidate callback:
    //   - Try to call preLiquidate again on same borrower
    //   - Try to call morpho.borrow on behalf of borrower (if authorized)
    //   - Try to withdraw supply on behalf of borrower
  call_stack: >
    liquidator -> preLiquidation.preLiquidate -> MORPHO.repay (updates state) ->
