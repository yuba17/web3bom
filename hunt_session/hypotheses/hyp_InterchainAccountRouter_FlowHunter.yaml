- id: IAR-10
  tier: 1
  type: property
  description: >
    The commit-reveal flow has a race condition: the commitment message and reveal message
    are dispatched sequentially in the SAME transaction, but they are processed as separate
    messages on the destination chain. If the reveal message is processed BEFORE the commitment
    message (e.g., different relayer priority, reorg), the reveal will fail because no
    commitment exists yet. More critically, if an attacker replays the commitment after the
    reveal fails, the commitment stays pending forever (stuck state).
  attack_scenario: >
    1. User calls callRemoteCommitReveal. Two messages dispatched: commitment + reveal.
    2. On destination, relayer processes reveal first. CommitmentReadIsm.verify() calls
       ica.revealAndExecute() which checks commitments[hash] — it's false → reverts.
    3. Reveal message permanently fails. Commitment message then processes successfully,
       setting commitment to pending.
    4. No one can trigger the reveal again (the reveal message was already "processed" or
       failed). The commitment is stuck forever.
  impact: "Permanent DoS: user's intended cross-chain calls never execute, commitment stuck."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Commitment must be set before reveal can execute
    // Track ordering: ghost_commitmentSet[hash] must be true before revealAndExecute
    bool commitmentPending = ica.commitments(commitmentHash);
    // Before reveal, this must be true
    t(commitmentPending, "IAR-10: reveal attempted before commitment was set");
  ghost_vars:
    - mapping(bytes32 => bool) internal ghost_commitmentSetBeforeReveal;
  validated: false
  priority: high
  confidence: 70
  notes: >
    The protocol relies on message ordering (commitment processed before reveal). Hyperlane
    does not guarantee cross-message ordering. The mailbox processes messages independently.
    If the commitment uses a different ISM path than the reveal, processing order is not
    guaranteed.
  poc_sketch: ""
  call_stack: >
    callRemoteCommitReveal() → dispatch(commitment) → dispatch(reveal)
    [destination] → process(reveal) BEFORE process(commitment) → FAIL

