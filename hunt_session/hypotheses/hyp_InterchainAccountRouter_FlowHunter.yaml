    concern is type=1 (COMMITMENT) from an untrusted sender — this is covered by IAR-02
    already. Marking as lower priority.
  poc_sketch: ""
  call_stack: >
    handle() L139-167 → MessageType(uint8(_message[0]))

- id: IAR-12
  tier: 1
  type: property
  description: >
    _dispatchMessageWithHook (line 759) passes msg.value to _dispatchMessageWithValue.
    But callRemoteWithOverrides (the 7-param version at line 554) also calls
    _dispatchMessageWithHook. If a user calls callRemoteWithOverrides with a custom
    hook that charges a fee AND sends msg.value, the entire msg.value goes to the
    mailbox dispatch. But _dispatchMessageWithValue also does safeTransferFrom for
    ERC20 fees if feeToken != address(0). This means the user pays BOTH native ETH
    and ERC20 — double payment.
  attack_scenario: >
    1. User calls callRemoteWithOverrides with hookMetadata that specifies a feeToken.
    2. _dispatchMessageWithValue quotes the fee in feeToken, transfers it from user.
    3. It also passes msg.value to mailbox.dispatch.
    4. User pays fee in ERC20 AND in native ETH. The native ETH may be lost.
  impact: "Users double-pay fees (native + ERC20) when using feeToken. Native ETH portion may be unrecoverable."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // When feeToken is set, msg.value should be 0 or should not be forwarded to dispatch
    address feeToken = hookMetadata.feeToken();
    if (feeToken != address(0)) {
        eq(msg.value, 0, "IAR-12: msg.value sent alongside feeToken payment");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    _dispatchMessageWithValue line 246 sends _value (which is msg.value) to
    mailbox.dispatch{value: _value}. Line 241 also does safeTransferFrom for ERC20 fee.
    If feeToken is set, the msg.value is still forwarded. This could be intentional
    (some hooks need both) or a bug.
  poc_sketch: ""
  call_stack: >
    callRemoteWithOverrides() → _dispatchMessageWithHook() L759 →
    _dispatchMessageWithValue(msg.value) L743 →
    [safeTransferFrom for ERC20 fee] L241 +
    [mailbox.dispatch{value: msg.value}] L246

flash_loan_analysis:
  handle:
    q1_reads_manipulable_state: false
    q2_affects_fund_movement: true
    q3_same_tx_consumable: true
    q4_post_action_verification: false
    q5_reentrancy_guard: false
    q6_callback_verifies_initiator: false
    q7_spot_vs_twap: N/A
    q8_reward_by_balance: false
    q9_threshold_crossable: false
    q10_self_liquidation: false
    q11_fee_rounding_zero: false
    q12_checkpoint_storage_or_memory: storage
    verdict: >
      handle() has no reentrancy guard (Q5=no) and executes arbitrary external calls
      via multicall (Q2=yes, Q3=yes). The ICA multicall could callback into the router.
      However, handle is onlyMailbox so re-entry through handle requires going through
      the mailbox again. The real risk is re-entry into other router functions during
      multicall execution.

  callRemoteCommitReveal:
    q1_reads_manipulable_state: true
    q2_affects_fund_movement: true
    q3_same_tx_consumable: true
    q4_post_action_verification: false
    q5_reentrancy_guard: false
    q6_callback_verifies_initiator: N/A
    q7_spot_vs_twap: N/A
    q8_reward_by_balance: false
    q9_threshold_crossable: false
    q10_self_liquidation: false
    q11_fee_rounding_zero: false
    q12_checkpoint_storage_or_memory: N/A
    verdict: >
      Reads address(this).balance (Q1=yes, manipulable via donations/receive).
      Sends that balance in the reveal dispatch (Q2=yes). No post-verification (Q4=no).
      Classic flash-loan compatible: donate ETH to router → call commit-reveal →
      reveal dispatch takes extra ETH. Key finding: IAR-01.

  callRemoteWithOverrides:
    q1_reads_manipulable_state: false
    q2_affects_fund_movement: true
    q3_same_tx_consumable: true
    q4_post_action_verification: false
    q5_reentrancy_guard: false
    q6_callback_verifies_initiator: N/A
    q7_spot_vs_twap: N/A
    q8_reward_by_balance: false
    q9_threshold_crossable: false
    q10_self_liquidation: false
    q11_fee_rounding_zero: false
    q12_checkpoint_storage_or_memory: N/A
    verdict: >
      Relatively clean — uses msg.value directly, no balance reads. The main risk is
      the feeToken double-payment (IAR-12). No reentrancy concerns since it only
      dispatches to mailbox.

  approveFeeTokenForHook:
    q1_reads_manipulable_state: false
    q2_affects_fund_movement: true
    q3_same_tx_consumable: true
    q4_post_action_verification: false
    q5_reentrancy_guard: false
    q6_callback_verifies_initiator: N/A
    q7_spot_vs_twap: N/A
    q8_reward_by_balance: false
    q9_threshold_crossable: false
    q10_self_liquidation: false
    q11_fee_rounding_zero: false
    q12_checkpoint_storage_or_memory: N/A
    verdict: >
      CRITICAL: No access control (Q4=no). Anyone can approve infinite tokens to any
      address. If router holds any ERC20 balance, this enables immediate drainage.
      Key finding: IAR-06.

false_positives:
- hunter: FlowHunter
  id: IAR-FP-01
  reason: >
    handle() not checking onlyRemoteRouter is INTENTIONAL per NatSpec comment. The design
    allows untrusted senders — each sender gets a unique ICA. This is not a vulnerability
    per se, but it changes the security model. The real risk is in ISM selection (IAR-03).
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: >
      Hyperlane InterchainAccountRouter intentionally accepts messages from untrusted senders.
      Each (origin, sender, owner, ism, salt) tuple derives a unique ICA. Do NOT flag the
      missing onlyRemoteRouter as a bug — instead focus on ISM selection trust model.
    briefing_update_applied: false

- hunter: FlowHunter
  id: IAR-FP-02
  reason: >
    OwnableMulticall.revealAndExecute() having no onlyOwner is INTENTIONAL for the
    commit-reveal scheme. The ISM calls it during verify(). The security relies on
    commitment secrecy, not access control. However, this is still a trust assumption
    worth noting (IAR-04).
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: none
    briefing: null
    content: null
    briefing_update_applied: false
