protocol: hyperlane
component: InterchainAccountRouter
file: solidity/contracts/middleware/InterchainAccountRouter.sol
domain: trust
hunter: FlowHunter
generated_at: '2026-03-24T00:00:00Z'

state_machine:
  states:
    - ICA_NOT_DEPLOYED
    - ICA_DEPLOYED_IDLE
    - ICA_EXECUTING_CALLS
    - ICA_COMMITMENT_PENDING
    - ICA_COMMITMENT_REVEALED
    - ROUTER_UNCONFIGURED
    - ROUTER_CONFIGURED
  transitions:
    - from: ICA_NOT_DEPLOYED
      to: ICA_DEPLOYED_IDLE
      via: "getDeployedInterchainAccount() — Create2 deploy on first handle()"
      guard: "Address.isContract(_account) == false"
    - from: ICA_DEPLOYED_IDLE
      to: ICA_EXECUTING_CALLS
      via: "handle() with MessageType.CALLS → ica.multicall{value}(calls)"
      guard: "onlyMailbox"
    - from: ICA_EXECUTING_CALLS
      to: ICA_DEPLOYED_IDLE
      via: "multicall completes (all calls succeed)"
      guard: "none — atomic"
    - from: ICA_DEPLOYED_IDLE
      to: ICA_COMMITMENT_PENDING
      via: "handle() with MessageType.COMMITMENT → ica.setCommitment()"
      guard: "onlyMailbox, commitment not already pending"
    - from: ICA_COMMITMENT_PENDING
      to: ICA_COMMITMENT_REVEALED
      via: "CommitmentReadIsm.verify() → ica.revealAndExecute()"
      guard: "keccak256(salt, calls) == commitment"
    - from: ICA_COMMITMENT_REVEALED
      to: ICA_DEPLOYED_IDLE
      via: "revealAndExecute completes, commitment deleted"
      guard: "none — atomic"
    - from: ROUTER_UNCONFIGURED
      to: ROUTER_CONFIGURED
      via: "enrollRemoteRouterAndIsm()"
      guard: "onlyOwner, router and ISM must be EMPTY_SALT (immutable once set)"
  anomalies:
    - type: no_sender_validation
      description: >
        handle() removes the onlyRemoteRouter check from Router base. Any _sender from
        any origin is accepted as long as it comes through the mailbox. This is by design
        (documented in NatSpec) but means the _sender value is attacker-controlled and
        directly used in ICA salt derivation. A malicious remote router can create ICAs
        that the real owner never intended.
    - type: reentrancy_via_multicall
      description: >
        handle() → ica.multicall() executes arbitrary external calls. If any call targets
        a contract that calls back into the router (or mailbox), there is no reentrancy
        guard. The multicall itself has no nonReentrant modifier.
    - type: value_leak_commit_reveal
      description: >
        callRemoteCommitReveal sends msg.value for the commitment dispatch, then sends
        address(this).balance for the reveal dispatch. If the router holds ETH from other
        sources (receive() is open), that ETH gets sent with the reveal message.
    - type: stuck_commitment
      description: >
        If a commitment is set via handle() but the reveal message never arrives or fails
        ISM verification, the commitment remains pending forever. There is no timeout or
        cancellation mechanism. The same commitment hash cannot be reused.

invariants:
- id: IAR-01
  tier: 1
  type: property
  description: >
    callRemoteCommitReveal uses address(this).balance for the reveal dispatch, which
    includes the router's pre-existing ETH balance plus any leftover from the commitment
    dispatch. An attacker can front-run or donate ETH to the router to inflate the value
    sent with the reveal, or conversely, a concurrent callRemoteCommitReveal can drain
    the balance leaving the second reveal underfunded.
  attack_scenario: >
    1. User A calls callRemoteCommitReveal with 1 ETH. Commitment dispatch uses 0.5 ETH for gas.
    2. Before the reveal dispatch line executes (same tx, sequential), address(this).balance
       includes 0.5 ETH leftover. Reveal sends 0.5 ETH.
    3. But if the router already held 10 ETH (from receive()), the reveal dispatch sends
       10.5 ETH instead of 0.5 ETH. Those 10 ETH belong to other users/operations.
    4. Conversely: two concurrent commit-reveal calls in a block — the first takes all
       balance, the second gets 0.
  impact: "Theft/loss of ETH held by router. Any ETH donated or accumulated is drained by next commit-reveal caller."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track balance before and after callRemoteCommitReveal
    uint256 balBefore = address(router).balance;
    uint256 sentValue = 1 ether;
    // If router had pre-existing balance, the reveal takes more than msg.value
    uint256 balAfter = address(router).balance;
    // The router should never send more than msg.value total across both dispatches
    gte(balBefore + sentValue, balBefore - balAfter + sentValue,
        "IAR-01: commit-reveal consumed more than msg.value from router");
  ghost_vars:
    - uint256 internal ghost_routerBalanceBefore;
  validated: false
  priority: high
  confidence: 85
  notes: >
    Line 630 (address(this).balance) is the key. The receive() function at
    AbstractInterchainAccountRouter L107 accepts arbitrary ETH. The balance read
    is NOT msg.value but the full contract balance. This is a classic pattern for
    fund theft — using address(this).balance instead of tracking a specific amount.
  poc_sketch: ""
  call_stack: >
    callRemoteCommitReveal() L603-656 →
      _dispatchMessageWithValue(msg.value) L606 →
      _dispatchMessageWithValue(address(this).balance) L624-631

- id: IAR-02
  tier: 1
  type: property
  description: >
    handle() accepts messages from ANY sender (no onlyRemoteRouter check). An attacker on
    a remote chain can deploy a malicious contract, dispatch a message through the mailbox
    targeting this router with a crafted _sender, and force creation of an ICA they control.
    The ICA address depends on (origin, owner, sender, ism, salt) — attacker controls sender.
  attack_scenario: >
    1. Attacker deploys contract on chain A.
    2. Attacker dispatches message through mailbox to InterchainAccountRouter on chain B.
    3. The _sender in the message is the attacker's contract address.
    4. handle() creates an ICA derived from (origin=A, owner=attacker, sender=attacker_contract, ism, salt).
    5. This ICA is distinct from any ICA the real remote router would create, so no collision.
    6. But: the ICA executes arbitrary calls. If the ICA had been pre-funded (e.g., via
       getLocalInterchainAccount prediction + direct ETH send), attacker drains those funds.
  impact: "Arbitrary code execution via ICA from untrusted sender. Fund theft if ICA pre-funded."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After handle from untrusted sender, verify ICA owner isolation
    // Ghost: track all senders that triggered handle
    // The ICA created should NOT be the same as one from the enrolled router
    bytes32 trustedRouter = router.routers(originDomain);
    bytes32 maliciousSender = bytes32(uint256(uint160(attacker)));
    // These must derive different ICAs
    address icaTrusted = address(router.getLocalInterchainAccount(
        originDomain, owner32, trustedRouter, ism));
    address icaMalicious = address(router.getLocalInterchainAccount(
        originDomain, owner32, maliciousSender, ism));
    t(icaTrusted != icaMalicious, "IAR-02: untrusted sender created same ICA as trusted router");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    The NatSpec explicitly says "designed to receive messages from untrusted remote contracts."
    The security model relies on each (origin, sender, owner, ism) tuple producing a unique
    ICA. The real question is whether an attacker can trick a user into sending funds to an
    ICA that the attacker's messages control. This depends on ISM choice — if ISM is address(0),
    it defaults to mailbox.defaultIsm() which may or may not validate the sender.
  poc_sketch: ""
  call_stack: >
    handle() L134-168 → getDeployedInterchainAccount(origin, owner, _sender_, ism, salt)

- id: IAR-03
  tier: 1
  type: property
  description: >
    The route() function returns an ISM address directly from the message body for non-REVEAL
    messages (InterchainAccountMessage.ism). A malicious message can specify ISM=address(0) to
    fall back to mailbox.defaultIsm(), or specify a custom ISM that always returns true. The
    attacker controls which ISM verifies their message, enabling bypass of security checks.
  attack_scenario: >
    1. Attacker crafts message with _ism field set to an attacker-deployed contract that
       always returns true from verify().
    2. route() returns that ISM address.
    3. The mailbox calls ism.verify() which always passes.
    4. handle() executes the attacker's arbitrary calls through the ICA.
  impact: "Complete bypass of ISM security — arbitrary remote execution if attacker-controlled ISM is accepted."
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // The ISM used for verification must be either the enrolled ISM or defaultIsm
    // not an arbitrary attacker-supplied address
    bytes32 msgIsm = InterchainAccountMessage.ism(messageBody);
    address resolvedIsm = address(router.route(fullMessage));
    address enrolledIsm = router.isms(originDomain).bytes32ToAddress();
    address defaultIsm = address(mailbox.defaultIsm());
    // resolvedIsm should be one of the trusted ISMs
    bool isTrusted = (resolvedIsm == enrolledIsm) || (resolvedIsm == defaultIsm);
    t(isTrusted, "IAR-03: route() returned untrusted ISM from message body");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    This is THE critical question for this router. The router itself IS the ISM
    (implements AbstractRoutingIsm). The route() function is called by the mailbox to
    determine which ISM to use. If the mailbox trusts whatever route() returns, and
    route() returns whatever the message says... that's circular trust. The security
    depends on whether the mailbox validates that the ISM returned by route() is
    actually trusted. Need to check Mailbox.process() flow.
  poc_sketch: ""
  call_stack: >
    Mailbox.process() → recipient.interchainSecurityModule() → returns address(this) →
    AbstractRoutingIsm.verify() → route() → returns ISM from message body →
    ism.verify() with attacker-controlled ISM

- id: IAR-04
  tier: 2
  type: property
  description: >
    revealAndExecute in OwnableMulticall has NO onlyOwner modifier. Anyone can call it
    if they know the commitment hash (salt + calls). The commit-reveal scheme's security
    relies on the commitment being secret until reveal time. But the commitment hash is
    emitted on-chain via CommitmentSet event, and if the off-chain CCIP service is compromised
    or the calls are guessable, anyone can front-run the reveal.
  attack_scenario: >
    1. User submits commitment via callRemoteCommitReveal. Commitment dispatched on-chain.
    2. handle() on destination sets commitment in ICA via setCommitment().
    3. CommitmentSet event emits the commitment hash publicly.
    4. The calls and salt must be revealed via CCIP read. If an attacker intercepts the
       CCIP response or can guess salt+calls, they call revealAndExecute directly.
    5. Since revealAndExecute has no access control beyond knowing the preimage,
       front-running the ISM verify is possible.
  impact: "Front-running of commit-reveal execution. MEV extraction from user's intended operations."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Commitment should only be executable by the ISM verify flow, not by arbitrary callers
    // Check that revealAndExecute doesn't revert when called by non-owner
    bool reverted = false;
    try ica.revealAndExecute(calls, salt) {
        // If this succeeds from non-owner, the commit-reveal has no access control
    } catch {
        reverted = true;
    }
    // Note: this is intentional design — anyone with the preimage can reveal.
    // The security relies on CCIP-read keeping the data secret until the ISM verifies.
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    The CommitmentReadIsm.verify() calls ica.revealAndExecute() directly. revealAndExecute
    is external with no onlyOwner. The DESIGN is that the ISM is the one calling it during
    mailbox.process(). But nothing prevents a direct call if the preimage is known. This is
    potentially by design for the commit-reveal scheme but creates MEV risk.
  poc_sketch: ""
  call_stack: >
    CommitmentReadIsm.verify() → ica.revealAndExecute(calls, salt)
    OR: attacker.directCall() → ica.revealAndExecute(calls, salt)

- id: IAR-05
  tier: 1
  type: property
  description: >
    handle() forwards msg.value to ica.multicall{value: msg.value}(calls). However, the
    calls themselves specify individual values (CallLib.Call.value). There is no validation
    that sum(calls[i].value) <= msg.value. If msg.value < sum of call values, the multicall
    uses the ICA's pre-existing ETH balance to cover the deficit.
  attack_scenario: >
    1. ICA holds 10 ETH from previous operations.
    2. Attacker dispatches message with calls that transfer 10 ETH to attacker's address,
       each call specifying value > 0.
    3. handle() is called with msg.value = 0 (relayer sends no ETH).
    4. multicall{value: 0} is called, but individual calls use ICA's balance.
    5. Attacker drains ICA's accumulated ETH.
  impact: "Drainage of ICA's ETH balance via crafted calls. Depends on ICA having accumulated ETH."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track ICA balance before and after handle
    uint256 icaBalBefore = address(ica).balance;
    // After handle with msg.value=0, ICA balance should not decrease
    // unless the calls were authorized by the legitimate owner
    uint256 icaBalAfter = address(ica).balance;
    // The balance decrease should not exceed msg.value forwarded
    lte(icaBalBefore - icaBalAfter, msgValueSent,
        "IAR-05: ICA lost more ETH than msg.value forwarded");
  ghost_vars:
    - uint256 internal ghost_icaBalancePreHandle;
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is mitigated by the fact that only the ICA owner (remote sender) can trigger
    calls through the ICA. But combined with IAR-02 (untrusted sender), if an attacker
    can create a message targeting an ICA that holds funds, they can drain it. The
    multicall in CallLib.sol does individual Address.functionCallWithValue() which uses
    the contract's balance, not just the forwarded value.
  poc_sketch: ""
  call_stack: >
    handle() → ica.multicall{value: msg.value}(calls) →
    CallLib.multicall → CallLib.call → Address.functionCallWithValue(to, data, call.value)

