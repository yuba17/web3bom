component: AbstractMultisigIsm
hunter: MathHunter
date: '2026-03-24'
scope: Hyperlane Multisig ISM (verify, digest, metadata encoding, factory)
bounty: Immunefi $2.5M critical / $200K high
honest_assessment: |
  This is a ~330 LOC verification-only module. The math surface is minimal.
  Trail of Bits already audited. The two-pointer signature verification is
  a well-known pattern (Gnosis Safe uses similar). Most "math" concerns here
  are encoding correctness, not arithmetic. I found NO critical/high math bugs.
  The findings below are low-confidence edge cases and informational observations.

invariants:
- id: ISM-M-01
  title: "abi.encodePacked in domainHash has no collision risk (fixed-size types)"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    domainHash uses abi.encodePacked(_origin, _merkleTreeHook, "HYPERLANE").
    _origin is uint32 (4 bytes), _merkleTreeHook is bytes32 (32 bytes),
    "HYPERLANE" is a fixed 9-byte string literal. Total: 45 bytes, all
    fixed-width. NO collision possible — abi.encodePacked is only dangerous
    when adjacent dynamic-length or variable-width fields can shift boundaries.
    This is secure by design.
  solidity: |
    // INFORMATIONAL — this is NOT a bug, documenting correctness
    function check_ISM_M01_domainHash_no_collision() public pure {
        // All fields are fixed-width, no adjacent dynamic types
        // uint32 = 4 bytes, bytes32 = 32 bytes, "HYPERLANE" = 9 bytes
        // Total encoding is always exactly 45 bytes — no ambiguity
        bytes32 h1 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(0xAA)), "HYPERLANE"));
        bytes32 h2 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(0xBB)), "HYPERLANE"));
        assert(h1 != h2); // trivially true, fields are unambiguous
    }
  validated: true
  status: not_a_bug
  notes: |
    Checked: uint32 is left-padded to 4 bytes, bytes32 is 32 bytes, string literal
    is fixed. No dynamic types adjacent. This is a common false positive in audits.

- id: ISM-M-02
  title: "signatureAt offset calculation — potential OOB read on crafted metadata"
  tier: 2
  type: property
  confidence: 40
  severity: medium
  description: |
    signatureAt(_metadata, i) computes offset as SIGNATURES_OFFSET + i * 65.
    If metadata is shorter than expected, calldataload will read zeros (EVM pads
    calldataload with zeros beyond calldatasize). This means ECDSA.recover gets
    a malformed signature filled with zeros. ECDSA.recover with an all-zero
    signature returns address(0). If address(0) is NOT in the validator set
    (which it shouldn't be — but the factory doesn't check), this just fails
    the validator matching and reverts with "!threshold". However, if address(0)
    IS somehow in the validator set (factory allows it), a zero-padded signature
    could match. The factory has no address(0) check.

    REALISTIC IMPACT: Very low. No sane deployer puts address(0) in validators.
    But the factory code explicitly lacks this check.
  solidity: |
    function check_ISM_M02_no_zero_address_validator() public view {
        // Factory should reject address(0) validators
        // Currently it does NOT — this is the gap
        (address[] memory validators, uint8 threshold) = ism.validatorsAndThreshold(testMessage);
        for (uint256 i = 0; i < validators.length; i++) {
            assert(validators[i] != address(0)); // If this fails, zero-sig bypass possible
        }
    }
  validated: false
  status: hypothesis
  notes: |
    The factory deploy() checks 0 < threshold <= values.length but does NOT
    check for address(0) or duplicates. address(0) in validator set + truncated
    metadata = signature bypass. Likelihood: extremely low in practice.
    Trail of Bits likely flagged this as informational.

- id: ISM-M-03
  title: "signatureCount derived from metadata length — modulo edge case"
  tier: 2
  type: property
  confidence: 30
  severity: low
  description: |
    signatureCount is computed as (metadata.length - SIGNATURES_OFFSET) / 65.
    If metadata.length < SIGNATURES_OFFSET, this underflows in Solidity 0.8
    and reverts. If (metadata.length - SIGNATURES_OFFSET) % 65 != 0, the
    division truncates — extra bytes at the end are silently ignored. This is
    not exploitable because verify() only reads exactly _threshold signatures
    via signatureAt(i) for i in [0, threshold). The count isn't used in verify.

    For MessageIdMultisigIsm: SIGNATURES_OFFSET = 68. So metadata must be at
    least 68 + threshold * 65 bytes. Shorter metadata → ECDSA.recover reads
    zero-padded calldataload → returns address(0) → fails validator match.

    NOT A BUG — just documenting the implicit length requirement.
  solidity: |
    function check_ISM_M03_metadata_length_sufficient() public view {
        // Metadata must be at least SIGNATURES_OFFSET + threshold * 65
        uint256 minLen = 68 + uint256(threshold) * 65;
        assert(metadata.length >= minLen); // If violated, verify reverts (safe)
    }
  validated: true
  status: not_a_bug
  notes: |
    Solidity 0.8 overflow protection on the subtraction, plus ECDSA.recover
    returning address(0) on garbage input, makes this safe. The only concern
    would be if signatureCount is used elsewhere to gate logic — it's not in
    verify(), verify uses threshold directly.

- id: ISM-M-04
  title: "uint8 threshold caps at 255 — no overflow risk but limits validator set"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    Threshold is uint8, max 255. Validator array can also have max 255 entries
    (since threshold <= validators.length and threshold is uint8). This is a
    design choice, not a bug. 255 validators is more than sufficient for any
    realistic multisig ISM. The two-pointer loop gas cost with 255 validators
    and 255 signatures is ~255 * (ECDSA.recover cost + loop iterations) which
    is expensive but bounded. See DoSHunter for gas analysis.
  solidity: |
    function check_ISM_M04_threshold_nonzero() public view {
        (, uint8 threshold) = ism.validatorsAndThreshold(testMessage);
        assert(threshold > 0); // Already enforced by require in verify()
    }
  validated: true
  status: not_a_bug
  notes: |
    The require(_threshold > 0) in verify() handles this. uint8 overflow is
    not possible because Solidity 0.8 checks. Factory also enforces
    0 < threshold <= values.length.

- id: ISM-M-05
  title: "MerkleLib.branchRoot — fixed 32-depth Merkle proof, correct for Hyperlane"
  tier: 2
  type: property
  confidence: 90
  severity: low
  description: |
    branchRoot always processes exactly 32 levels of proof. This matches
    Hyperlane's MerkleTree implementation which uses a fixed depth of 32
    (supporting 2^32 messages). The messageIndex is used to determine
    left/right placement at each level. If messageIndex >= 2^32, the upper
    bits are ignored (only bottom 32 bits matter since the loop runs 32 times
    and shifts right each iteration). messageIndex is read as uint32 from
    metadata, so it's already bounded to [0, 2^32-1]. No issue here.
  solidity: |
    function check_ISM_M05_merkle_proof_depth() public pure {
        // branchRoot always processes 32 levels — matches tree depth
        // messageIndex is uint32, fits in 32 levels
        // This is correct by construction
        assert(true); // Structural correctness, no runtime check needed
    }
  validated: true
  status: not_a_bug
  notes: |
    Fixed-depth Merkle trees are standard in bridge protocols. The proof
    array in metadata is exactly 32 * 32 = 1024 bytes, matching 32 levels
    of bytes32 siblings. Correct.

- id: ISM-M-06
  title: "MerkleRoot digest requires messageIndex <= signedIndex — validated"
  tier: 1
  type: property
  confidence: 70
  severity: medium
  description: |
    MerkleRootMultisigIsm.digest() requires messageIndex <= signedIndex.
    This ensures the message being verified was included in a checkpoint
    that the validators actually signed. If this check were missing or
    bypassable, an attacker could forge proofs for messages not yet
    checkpointed. The check IS present as a require statement.

    HOWEVER: the check only verifies messageIndex <= signedIndex, not that
    messageIndex is actually IN the tree at signedIndex. The Merkle proof
    itself provides that guarantee — if the proof is invalid, branchRoot
    produces a different root than what validators signed, and ECDSA.recover
    returns wrong signers. So the system is doubly protected.

    Edge case: messageIndex == signedIndex is valid (message is the latest
    in the checkpoint). messageIndex == 0 is valid (first message).
  solidity: |
    function check_ISM_M06_merkle_index_ordering() public view {
        uint32 messageIndex = uint32(bytes4(_metadata[32:36]));
        uint32 signedIndex = uint32(bytes4(_metadata[1092:1096]));
        assert(messageIndex <= signedIndex); // Enforced by require in digest()
    }
  validated: true
  status: not_a_bug
  notes: |
    The require is correct and sufficient. Even without it, invalid proofs
    would produce wrong roots → wrong digests → wrong recovered signers →
    revert on "!threshold". Defense in depth.
