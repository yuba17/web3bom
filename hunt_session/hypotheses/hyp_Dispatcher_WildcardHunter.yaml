- id: D-W-03
  tier: 1
  type: property
  description: >
    EXECUTE_SUB_PLAN with FLAG_ALLOW_REVERT enables silent failure of entire sub-plans. Combined
    with BALANCE_CHECK_ERC20 (also allow-revert), an attacker can build conditional execution
    flows: "if balance condition met, execute swap; otherwise skip silently." This creates a
    gas-griefing vector and a MEV extraction tool — a searcher can craft a tx that only executes
    profitably (the losing path silently reverts) at the expense of other users' gas.
  attack_scenario: >
    1. Attacker submits tx: [BALANCE_CHECK_ERC20(token, pool, targetBalance) with allowRevert,
       V3_SWAP_EXACT_IN(profitable params)].
    2. If pool balance is at expected level (post-victim-swap), BALANCE_CHECK succeeds, swap executes.
    3. If conditions aren't met, BALANCE_CHECK fails (allowRevert), but swap still runs.
    4. Better: wrap in SUB_PLAN with allowRevert: [SUB_PLAN(allowRevert=true, [CHECK, SWAP])].
       Sub-plan failure = no swap happens, tx succeeds, attacker pays minimal gas.
    This is a toolbox for sophisticated sandwich attacks — probe-then-execute atomically.
  impact: "Enhanced MEV extraction capability; gas-efficient sandwich attacks"
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Invariant: if a sub-plan with allowRevert fails, no state changes from that sub-plan persist
    // (this should be guaranteed by the EVM call semantics, but verify)
    uint256 balBefore = ERC20(token).balanceOf(address(router));
    // Execute SUB_PLAN with allowRevert=true, containing a swap that should fail
    // After execution:
    uint256 balAfter = ERC20(token).balanceOf(address(router));
    eq(balBefore, balAfter, "D-W-03: sub-plan revert did not roll back state");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    The EVM guarantees that a failed CALL reverts all state changes in the sub-context. So the
    state-change concern is likely unfounded (EVM-level protection). But the MEV concern is real:
    this design is a building block for advanced sandwich bots. This is likely "by design" for
    the Universal Router — similar to Uniswap's design. Low confidence as a reportable finding
    but worth investigating the conditional-execution angle.

- id: D-W-04
  tier: 1
  type: property
  description: >
    COMMAND_TYPE_MASK = 0x3f masks 6 bits, FLAG_ALLOW_REVERT = 0x80 uses bit 7. Bit 6 (0x40)
    is silently masked away. A command byte of 0x40 | actualCommand would produce the same
    command dispatch as actualCommand alone but with bit 6 set. If any off-chain system or
    indexer uses the full byte (not masked) to determine command type, it would misinterpret
    the command. More critically: if a future upgrade uses bit 6 for a new flag but doesn't
    update the mask, existing commands could have unintended behavior.
  attack_scenario: >
    Current state: bit 6 is wasted — setting it changes nothing because the mask strips it.
    A user sending command 0x40 gets V3_SWAP_EXACT_IN (0x00) executed. If an off-chain monitoring
    system doesn't apply the mask, it might not detect a V3 swap was executed. This is more of
    an integrity/monitoring concern than a direct exploit. However: if the protocol adds a second
    flag on bit 6 in a future upgrade without updating all existing command handlers, it could
    create dual-flag ambiguity.
  impact: "Low — off-chain monitoring bypass, potential future upgrade hazard"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that bit 6 has no effect on command execution
    bytes1 cmdNormal = bytes1(uint8(0x00)); // V3_SWAP_EXACT_IN
    bytes1 cmdBit6 = bytes1(uint8(0x40));   // Same after masking
    uint256 masked1 = uint8(cmdNormal & Commands.COMMAND_TYPE_MASK);
    uint256 masked2 = uint8(cmdBit6 & Commands.COMMAND_TYPE_MASK);
    eq(masked1, masked2, "D-W-04: bit 6 should not affect command routing");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    This is likely by design — the Uniswap Universal Router uses the same pattern. Bit 6 is
    reserved/unused. Low confidence as a finding but flagging for completeness.

- id: D-W-05
  tier: 1
  type: property
  description: >
    payerIsUser=false in swap commands (V3_SWAP_EXACT_IN, V2_SWAP_EXACT_IN, etc.) causes the
    router to pay from its own balance. Combined with PERMIT2_TRANSFER_FROM (which transfers
    tokens from user to router) in a multi-command sequence, an attacker can cause the router
    to spend tokens that were deposited by a PREVIOUS command from another user's permit. The
    attack requires tokens to be sitting in the router between commands within the same tx —
    but since EXECUTE_SUB_PLAN creates a self-call that re-enters execute(), tokens deposited
    in an outer command are available to an inner sub-plan's swap with payerIsUser=false.
  attack_scenario: >
    1. Victim creates a multi-command tx: [PERMIT2_TRANSFER_FROM(tokenA, ADDRESS_THIS, 1000),
       V3_SWAP_EXACT_IN(recipient=MSG_SENDER, amountIn=1000, payerIsUser=false)].
    2. Between these commands, if the router can be reentered (it can't from external, but
       SUB_PLAN allows self-reentrancy), another command sequence could drain the deposited tokens.
    3. More realistically: a single-tx attack where attacker crafts commands that route through
       the router's balance to redirect tokens. E.g., [PERMIT2_TRANSFER_FROM(tokenA, ADDRESS_THIS, X),
       V3_SWAP_EXACT_IN(recipient=ATTACKER, amountIn=X, payerIsUser=false)] — this is just the
       normal flow, but if the attacker can somehow inject commands mid-execution...
    The real risk: leftover tokens from a previous user's failed/partial execution sitting in the
    router. Next user's payerIsUser=false would spend them.
  impact: "Theft of residual tokens left in router from previous executions"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After any execute() call, router should not hold any ERC20 tokens
    uint256 routerBal = ERC20(token).balanceOf(address(router));
    eq(routerBal, 0, "D-W-05: tokens left in router after execute");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 50
  notes: >
    Universal Router design assumes atomic execution — tokens should never persist across
    transactions. But if a command fails with allowRevert, tokens from earlier commands stay
    in the router for remaining commands. This is the intended "pipe" pattern. The real question
    is whether cross-transaction residual tokens can be stolen. Since execute() is atomic,
    this is safe unless someone sends tokens directly to the router.

