- id: D-W-07
  tier: 2
  type: property
  description: >
    PERMIT2_PERMIT and PERMIT2_PERMIT_BATCH with FLAG_ALLOW_REVERT can silently fail. A user
    might send a multi-command tx: [PERMIT2_PERMIT(allowRevert=true), SWAP(payerIsUser=true)].
    If the permit has already been used (nonce consumed) or is expired, it fails silently.
    The swap then tries to use the EXISTING (possibly stale) Permit2 allowance, which might
    be from a previous interaction with a different protocol or have different parameters
    (higher amount, longer expiration).
  attack_scenario: >
    1. User previously approved tokenA on Permit2 with allowance = 10,000 to some spender.
    2. User sends tx to UniversalRouter: [PERMIT2_PERMIT(allowRevert=true, allowance=100),
       V3_SWAP_EXACT_IN(amountIn=100, payerIsUser=true)].
    3. If PERMIT2_PERMIT fails silently (expired/replayed), the swap uses the OLD allowance
       of 10,000. The user intended to limit to 100, but the old 10,000 allowance is used.
    4. An attacker front-runs with a tx that consumes the new permit's nonce (by submitting
       the same permit data to Permit2 directly), forcing the router's permit to fail silently.
    5. Then the attacker sandwiches the swap, which now has 100x the intended allowance exposed.
  impact: "User exposed to higher-than-intended Permit2 allowance due to silent permit failure"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Before execute with PERMIT2_PERMIT(allowRevert=true) + SWAP:
    // Record allowance BEFORE
    (uint160 allowanceBefore,,) = PERMIT2.allowance(user, token, address(router));
    // Execute the multi-command
    // After execute:
    // The swap should have used the NEW allowance, not the old one
    // If permit failed, allowance is unchanged = old allowance was used
    (uint160 allowanceAfter,,) = PERMIT2.allowance(user, token, address(router));
    // If permit succeeded, allowanceAfter should reflect new value
    // If permit failed silently, allowanceBefore == allowanceAfter AND swap still executed
    t(permitSucceeded || !swapExecuted, "D-W-07: swap executed with stale permit allowance");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is a subtle interaction between allowRevert on permits and subsequent commands.
    The user's intent is "set allowance to X, then swap X" but the outcome can be
    "fail to set allowance, swap with old (potentially larger) allowance." The front-end
    should not use allowRevert for permits, but the contract doesn't prevent it.

- id: D-W-08
  tier: 1
  type: property
  description: >
    The `map()` function uses sentinel values address(1) = MSG_SENDER and address(2) = ADDRESS_THIS.
    If a user specifies a recipient as the literal address 0x0000...0001 or 0x0000...0002
    (actual addresses, not sentinels), tokens would be sent to msgSender() or address(this)
    instead. While these addresses are unlikely to be used by normal users, they ARE valid
    Ethereum addresses. If any ERC20 or protocol uses address(1) or address(2) as a special
    address (e.g., burn address, fee collector), the mapping would redirect tokens incorrectly.
  attack_scenario: >
    1. A token protocol uses address(1) as a fee collector or burn address.
    2. User calls TRANSFER(token, address(1), amount) intending to send to that address.
    3. map(address(1)) returns msgSender() — tokens go back to the user instead of the
       intended fee collector. Not a direct exploit, but a potential fund misdirection.
    More critically: SWEEP with recipient=address(2) maps to address(this), creating a no-op
    that leaves tokens in the router. A subsequent SWEEP or TRANSFER from another user could
    then claim those tokens.
  impact: "Token misdirection if sentinel address values are used as real recipients"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    address sentinel1 = address(1); // ActionConstants.MSG_SENDER
    address sentinel2 = address(2); // ActionConstants.ADDRESS_THIS
    address mapped1 = router.map(sentinel1);
    address mapped2 = router.map(sentinel2);
    // mapped1 should be msg.sender, mapped2 should be address(router)
    // This is by design, but verify no real protocol uses these addresses
    t(mapped1 != sentinel1, "D-W-08: sentinel address(1) is remapped (expected)");
    t(mapped2 != sentinel2, "D-W-08: sentinel address(2) is remapped (expected)");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 25
  notes: >
    This is the standard Uniswap Universal Router pattern. Very low probability of real-world
    impact since address(1) and address(2) are precompile addresses (ecrecover and SHA256)
    and cannot receive tokens. Marking as low priority but noting for completeness.

- id: D-W-09
  tier: 1
  type: property
  description: >
    V3_POSITION_MANAGER_CALL forwards raw calldata to V3_POSITION_MANAGER via low-level call.
    The _checkV3PositionManagerCall validates the selector (must be decreaseLiquidity, collect,
    or burn) and the tokenId ownership. However, the remaining calldata parameters are NOT
    validated. For decreaseLiquidity, the attacker-controlled params include `liquidity`,
    `amount0Min`, `amount1Min`, and `deadline`. For collect, the `recipient` field is attacker-
    controlled and not validated against msgSender(). An attacker who has approval on a victim's
    position could call collect() with recipient=attacker_address, directing collected fees to
    themselves.
  attack_scenario: >
    1. Victim approves UniversalRouter as operator on V3_POSITION_MANAGER (required for migration).
    2. Attacker crafts V3_POSITION_MANAGER_CALL with: selector=collect, tokenId=victim's token,
       recipient=attacker, amount0Max=type(uint128).max, amount1Max=type(uint128).max.
    3. _checkV3PositionManagerCall checks: selector is `collect` (valid), tokenId ownership
       requires caller to be owner/approved — but the attacker is NOT the caller, msgSender() is
       the ATTACKER's address. So _isAuthorizedForToken(attacker, tokenId) would fail because
       attacker is not approved for victim's token.
    4. HOWEVER: if the attacker IS approved for ALL of the victim's tokens (isApprovedForAll),
       and the router is approved for the specific token, then both checks pass.
    Result: attacker collects victim's accumulated fees to their own address.
  impact: "Theft of accumulated V3 position fees via collect() recipient manipulation"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Craft a collect call with arbitrary recipient
    bytes memory collectCall = abi.encodeWithSelector(
        IV3NonfungiblePositionManager.collect.selector,
        IV3NonfungiblePositionManager.CollectParams({
            tokenId: victimTokenId,
            recipient: attacker,
            amount0Max: type(uint128).max,
            amount1Max: type(uint128).max
        })
    );
    // If _checkV3PositionManagerCall passes AND recipient != msgSender(), fees are stolen
    // The check only validates tokenId ownership, not the recipient parameter
    t(collectRecipient == msgSender() || collectRecipient == address(router),
      "D-W-09: collect recipient must be caller or router");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 40
  notes: >
    The auth check in _isAuthorizedForToken uses msgSender() (which is _getLocker(), i.e., the
    original external caller). So the attacker would need to be approved for the victim's tokens
    AND call through the router. The V3_POSITION_MANAGER itself may enforce recipient==msg.sender
    for collect — need to verify. If V3 PM doesn't enforce this, the Dispatcher's check is
    insufficient because it validates WHO calls but not WHERE tokens go.

- id: D-W-10
  tier: 1
  type: property
  description: >
    EXECUTE_SUB_PLAN performs address(this).call(abi.encodeCall(Dispatcher.execute, ...)).
    This is a self-CALL (not delegatecall), which means msg.sender becomes address(this).
    The Lock modifier's isNotLocked check has a special branch: if msg.sender == address(this),
    skip the lock entirely. This means sub-plans run without any reentrancy protection.
    If a sub-plan contains an INFI_SWAP command that triggers a callback to the router
    (e.g., via a malicious hook), the callback could call execute() again, and the lock
    would be bypassed because msg.sender == address(this) during the sub-plan execution.
    Wait — the callback would come from the hook, not from address(this). So msg.sender would
    be the hook address, not address(this), and the lock WOULD apply. The self-reentrancy
    bypass is specifically for SUB_PLAN's self-call pattern. But: what if a malicious
    Infinity pool hook calls back to the router? The lock is checked (hook != address(this)),
    so it's protected. The actual risk is: during sub-plan execution, the locker is still set
    to the original caller. msgSender() returns the correct user. No bypass possible from
    external callbacks. This is likely safe by design.
    REVISED HYPOTHESIS: The actual risk is NESTED sub-plans. A sub-plan can contain another
    EXECUTE_SUB_PLAN. Each nesting level creates a new CALL context. With deep nesting
    (e.g., 100+ levels), this could cause stack overflow / out-of-gas, which with allowRevert
    on outer sub-plans, could cause partial execution where early commands succeed but
    later commands (like slippage checks) fail silently.
  attack_scenario: >
    1. Attacker creates deeply nested sub-plans: SUB_PLAN(SUB_PLAN(SUB_PLAN(...SWAP...))).
    2. The swap executes at the deepest nesting level, consuming most gas.
    3. The final BALANCE_CHECK_ERC20 (slippage protection) at an outer level runs out of gas.
    4. If the outer SUB_PLAN has allowRevert=true, the balance check failure is swallowed.
    5. The swap executed but slippage protection did not — user gets sandwiched.
    The key insight: commands within a sub-plan either ALL succeed or ALL revert (call semantics).
    But commands OUTSIDE the sub-plan are independent. So the pattern
    [SUB_PLAN(allowRevert=true, [SWAP]), BALANCE_CHECK] — if sub-plan succeeds but CHECK fails,
    the swap already happened. The allowRevert flag is on the COMMAND level, not the sub-plan.
  impact: "Slippage protection bypass via gas manipulation in nested sub-plans"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that nested sub-plans cannot bypass slippage checks
    // After a swap within a sub-plan:
    uint256 received = ERC20(tokenOut).balanceOf(user);
    gte(received, amountOutMin, "D-W-10: slippage check must be enforced even with sub-plans");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: >
    The EVM call stack limit is 1024. Each SUB_PLAN nesting uses one level. Gas forwarding
    follows the 63/64 rule — each nesting level retains 1/64 of gas. After ~30 nesting levels,
    available gas drops significantly. Need to verify if the gas retained at outer levels is
    sufficient for balance check operations. The actual risk depends on whether frontends/SDKs
    ever place slippage checks OUTSIDE a sub-plan containing the swap.

false_positives:
- hunter: WildcardHunter
  id: D-W-FP-01
  reason: >
    Considered whether the COMMAND_TYPE_MASK (0x3f) could allow command injection via the upper
    2 bits (0x40 and 0x80). Bit 7 (0x80) is FLAG_ALLOW_REVERT — well documented and intentional.
    Bit 6 (0x40) is masked away and has no effect. This is identical to Uniswap's Universal
    Router design and is by design. No command injection possible because the mask is applied
    before the switch/case logic.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Universal Router COMMAND_TYPE_MASK 0x3f strips upper 2 bits. Bit 7 = allowRevert flag,
      bit 6 = unused/reserved. No command injection possible. Same pattern as Uniswap v4.
    briefing_update_applied: false

- hunter: WildcardHunter
  id: D-W-FP-02
  reason: >
    Considered reentrancy via INFI_SWAP → Infinity pool hook callback → router.execute().
    The Lock uses transient storage (tstore/tload) and checks isLocked() for external callers.
    A hook callback would have msg.sender = hook_address (not address(this)), so the lock
    IS enforced. The Locker is already set (to the original user), so the callback would
    revert with ContractLocked(). Transient storage also resets after the transaction, so
    no cross-tx state leakage. Safe by design.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      PancakeSwap Infinity Universal Router uses transient storage for reentrancy lock.
      Self-calls (SUB_PLAN) bypass the lock intentionally. External callbacks (hooks) are
      blocked by the lock. Safe pattern.
    briefing_update_applied: false
