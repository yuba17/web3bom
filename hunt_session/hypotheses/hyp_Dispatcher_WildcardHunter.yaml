- id: D-W-01
  tier: 1
  type: property
  description: >
    INFI_CL_POSITION_CALL and INFI_BIN_POSITION_CALL forward address(this).balance as msg.value.
    If a user sends ETH with execute() but an earlier command (e.g. WRAP_ETH) does NOT consume
    all of it, or if ETH is left over from a previous user's partial execution, the position
    manager call forwards ALL remaining ETH — potentially donating user A's ETH to user B's
    position mint, or sending it to a position manager that returns surplus to the router
    (where it can be swept by an attacker in a later command).
  attack_scenario: >
    Attacker crafts a multi-command tx: [WRAP_ETH(recipient=ADDRESS_THIS, amount=1 wei),
    INFI_CL_POSITION_CALL(mint with msg.value forwarded)]. The WRAP_ETH only wraps 1 wei,
    but INFI_CL_POSITION_CALL forwards address(this).balance (all remaining ETH minus 1 wei)
    to the position manager. If there is leftover ETH from other users (dust from failed sweeps,
    or ETH sent directly to router), attacker captures it in their position. Even without other
    users' ETH, if the position manager returns surplus ETH to the router, a second call with
    SWEEP(ETH) would capture it.
  impact: "Theft of residual ETH sitting in the router contract"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Before INFI_CL_POSITION_CALL: record balance
    uint256 balBefore = address(router).balance;
    // After full execute: router should have 0 ETH (all consumed or returned to sender)
    uint256 balAfter = address(router).balance;
    // Invariant: no ETH permanently lost or donated unintentionally
    eq(balAfter, 0, "D-W-01: ETH left in router after execution");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    The pattern `call{value: address(this).balance}` is extremely aggressive — it sends
    EVERYTHING, not just what the user deposited. This is a known anti-pattern in Universal
    Router designs. Check if position managers return surplus to msg.sender (the router) or
    to the original caller.

- id: D-W-02
  tier: 1
  type: property
  description: >
    Incomplete action blocklist in _checkInfiClPositionManagerCall: the check blocks
    CL_INCREASE_LIQUIDITY (0x00), CL_DECREASE_LIQUIDITY (0x01), and CL_BURN_POSITION (0x03)
    but does NOT block CL_INCREASE_LIQUIDITY_FROM_DELTAS (0x04), CL_MINT_POSITION_FROM_DELTAS (0x05),
    TAKE (0x0e), TAKE_ALL (0x0f), TAKE_PORTION (0x10), SETTLE (0x0b), SWEEP (0x14), or
    CLOSE_CURRENCY (0x12). If an attacker tricks a user into approving the router for their
    position (e.g., via phishing or a deceptive dApp), these unblocklisted actions could allow
    fee extraction or fund drainage through TAKE/TAKE_ALL.
  attack_scenario: >
    1. User approves UniversalRouter on INFI_CL_POSITION_MANAGER (common for migration flows).
    2. Attacker crafts INFI_CL_POSITION_CALL with actions = [TAKE_ALL(currency, attacker_address)].
    3. _checkInfiClPositionManagerCall iterates actions but TAKE_ALL (0x0f) is not in the blocklist.
    4. The call executes on the position manager, taking tokens owed to the router/user.
    However: TAKE_ALL acts on deltas in the vault, not on positions directly. The attack
    requires an existing positive delta — less likely but possible if combined with other actions
    in the same modifyLiquidities call (e.g., CL_MINT_POSITION_FROM_DELTAS then TAKE_ALL).
  impact: "Potential theft of position fees or tokens via unblocklisted actions if router is approved"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that ALL position-altering and token-extracting actions are blocked
    // The following actions should be blocked in addition to INCREASE/DECREASE/BURN:
    // CL_INCREASE_LIQUIDITY_FROM_DELTAS (0x04), CL_MINT_POSITION_FROM_DELTAS (0x05)
    // TAKE (0x0e), TAKE_ALL (0x0f), TAKE_PORTION (0x10)
    // For each action in the allowed set:
    bytes memory actions = new bytes(1);
    actions[0] = bytes1(uint8(0x0f)); // TAKE_ALL
    // Build inputs that embed this action and call INFI_CL_POSITION_CALL
    // If it does NOT revert -> blocklist is incomplete
    t(!success, "D-W-02: TAKE_ALL should be blocked in CL position call");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    The blocklist approach (block known-bad) is inherently weaker than an allowlist approach
