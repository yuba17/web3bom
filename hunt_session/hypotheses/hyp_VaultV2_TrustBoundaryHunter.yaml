      uint96 perfFee = vault.performanceFee();
      address perfRecipient = vault.performanceFeeRecipient();
      if (perfFee > 0 && perfRecipient != address(0)) {
        t(
          vault.canReceiveShares(perfRecipient),
          "TB-10: performance fee recipient blocked by gate"
        );
      }
      uint96 mgmtFee = vault.managementFee();
      address mgmtRecipient = vault.managementFeeRecipient();
      if (mgmtFee > 0 && mgmtRecipient != address(0)) {
        t(
          vault.canReceiveShares(mgmtRecipient),
          "TB-10: management fee recipient blocked by gate"
        );
      }
    }
  ghost_vars: []
  affected_functions:
    - accrueInterestView
    - accrueInterest
    - canReceiveShares
    - setReceiveSharesGate
  validated: false
  priority: medium
  notes: >
    Likely by-design to prevent gate DoS on vault operations. But creates silent
    fee loss. Fee recipients may not realize they're blocked.

# ═══════════════════════════════════════════════════════════════════════════
# TB-11: Adapter deallocate negative change can DoS via revert or underflow
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-11
  tier: 1
  type: property
  title: Adapter returns excessive negative change — allocation underflow reverts
  description: >
    deallocateInternal() (L635): _caps.allocation = (int256(_caps.allocation) + change).toUint256().
    If adapter returns change more negative than allocation, the result is a negative int256.
    toUint256() should revert on negative values (safe cast). This means a malicious adapter
    can DoS deallocate for any id by returning overly negative changes, locking funds in
    that adapter permanently.
  attack_scenario: >
    1. Adapter has allocation=100 for id X.
    2. Adapter returns change = -200 on deallocate.
    3. int256(100) + (-200) = -100. toUint256(-100) reverts.
    4. deallocateInternal reverts. Funds locked in adapter.
    5. All withdrawals that need to deallocate from this adapter fail.
  impact: >
    DoS on deallocate for affected ids. If this is the liquidityAdapter,
    all exit() calls that need liquidity are blocked.
  impact_rating: High
  likelihood: Low
  severity: Medium
  confidence: 55
  solidity: |
    function property_tb_11() public {
      // No allocation should exceed _totalAssets
      uint256 totalAssets = uint256(vault._totalAssets());
      for (uint256 i = 0; i < ghost_trackedIds.length; i++) {
        uint256 alloc = vault.allocation(ghost_trackedIds[i]);
        t(
          alloc <= totalAssets + 1,
          "TB-11: id allocation exceeds _totalAssets — overflow or corruption"
        );
      }
    }
  ghost_vars:
    - bytes32[] internal ghost_trackedIds;
  affected_functions:
    - deallocateInternal
    - allocateInternal
  validated: false
  priority: medium
  notes: >
    Depends on MathLib.toUint256() behavior. If safe cast (revert on negative),
    this is a DoS. Need to verify MathLib implementation.

