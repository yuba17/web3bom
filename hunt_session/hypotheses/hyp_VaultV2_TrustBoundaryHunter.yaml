    2. Curator sets receiveSharesGate blocking feeAddr.
    3. Interest accrues but canReceiveShares(feeAddr) = false.
    4. performanceFeeAssets = 0. No fee shares minted.
    5. Fee recipient loses all performance fees.
    6. Depositors benefit (higher share price) — perverse incentive.
  impact: >
    Fee recipient loses all entitled fees. Loss of funds for fee recipient.
    Depositors benefit, creating incentive for curators to block fee recipients.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 75
  solidity: |
