# ═══════════════════════════════════════════════════════════════════════════
# TB-01: Adapter returns arbitrary ids corrupting cap tracking
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-01
  tier: 1
  type: property
  title: Adapter returns arbitrary ids to inflate/deflate cap allocation tracking
  description: >
    In allocateInternal() (L597), the vault calls IAdapter(adapter).allocate() which
    returns (bytes32[] ids, int256 change). The vault blindly applies this change to
    caps[ids[i]].allocation. A malicious adapter can return ids belonging to OTHER
    adapters, corrupting their allocation tracking. Nothing enforces that adapters
    return only their own ids. The NatSpec says "Returned ids must not repeat" but
    does not say "ids must belong to this adapter only."
  attack_scenario: >
    1. Adapter A manages id_A with allocation=100, absoluteCap=200.
    2. Malicious adapter B is added via timelock.
    3. Allocator calls allocate(B, data, 50). B returns ids=[id_A], change=50.
    4. caps[id_A].allocation = 150 but actual assets went to B not A.
    5. Legitimate allocation to A via id_A is now falsely constrained.
    6. B can also return negative change on deallocate to underflow allocations.
  impact: >
    Cap accounting corruption for any id. Over-allocation to risky markets
    or DoS of legitimate adapters. Combined with malicious adapter, enables drain.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 70
  solidity: |
    mapping(address => mapping(bytes32 => bool)) internal ghost_adapterOwnedIds;
    address[] internal ghost_trackedAdapters;
    bytes32[] internal ghost_trackedIds;

    function property_tb_01() public {
      // Each id should only be modified by one adapter
      for (uint256 i = 0; i < ghost_trackedIds.length; i++) {
        bytes32 id = ghost_trackedIds[i];
        uint256 ownerCount = 0;
        for (uint256 j = 0; j < ghost_trackedAdapters.length; j++) {
          if (ghost_adapterOwnedIds[ghost_trackedAdapters[j]][id]) ownerCount++;
        }
        t(ownerCount <= 1, "TB-01: same id returned by multiple adapters");
      }
    }
  ghost_vars:
    - mapping(address => mapping(bytes32 => bool)) internal ghost_adapterOwnedIds;
    - address[] internal ghost_trackedAdapters;
    - bytes32[] internal ghost_trackedIds;
  affected_functions:
    - allocateInternal
    - deallocateInternal
  validated: false
  priority: high
  notes: >
    Documented trust assumption. Vault trusts adapters to return correct ids.
    NatSpec "loose specification" — ids can be reused across adapters intentionally,
    but a malicious adapter exploits this to corrupt others' tracking.

# ═══════════════════════════════════════════════════════════════════════════
# TB-02: Gate reverts permanently DoS user withdrawals
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-02
  tier: 1
  type: property
  title: Malicious gate contract blocks withdrawals via revert or gas griefing
  description: >
    exit() calls canSendShares(onBehalf) and canReceiveAssets(receiver) which make
    external calls to gate contracts without try/catch or gas limits. NatSpec says
    "Gates must never revert, nor consume too much gas" but this is NOT enforced.
    A reverting gate permanently blocks all withdrawals. If setSendSharesGate is
    abdicated after setting a malicious gate, funds are PERMANENTLY locked.
  attack_scenario: >
    1. Curator submits setSendSharesGate(maliciousGate) via submit(), waits timelock.
    2. maliciousGate.canSendShares() always reverts.
    3. All exit/withdraw/redeem/transfer/transferFrom calls revert.
    4. forceDeallocate calls withdraw internally — also fails.
    5. If setSendSharesGate is abdicated, gate cannot be changed ever.
    6. User funds permanently locked.
  impact: >
    Complete DoS of all withdrawals. If gate selector abdicated, permanent fund lock.
    Otherwise locked for timelock duration until gate is replaced.
  impact_rating: Critical
  likelihood: Low
  severity: High
  confidence: 85
  solidity: |
    function property_tb_02() public {
      // Gate calls should never revert for any user with shares
      if (vault.balanceOf(address(this)) > 0) {
        try vault.canSendShares(address(this)) returns (bool) {
        } catch {
          t(false, "TB-02: canSendShares reverted — gate DoS on withdrawals");
          return;
        }
        try vault.canReceiveAssets(address(this)) returns (bool) {
        } catch {
          t(false, "TB-02: canReceiveAssets reverted — gate DoS on withdrawals");
        }
      }
    }
  ghost_vars: []
  affected_functions:
    - exit
    - canSendShares
    - canReceiveAssets
    - withdraw
    - redeem
    - transfer
    - transferFrom
    - forceDeallocate
  validated: false
  priority: high
  notes: >
    receiveAssetsGate has partial mitigation: address(this) always passes (L947),
    but canSendShares has zero fallback. High confidence — clear enforcement gap.

# ═══════════════════════════════════════════════════════════════════════════
# TB-03: Donation via direct transfer inflates realAssets in accrueInterestView
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-03
  tier: 1
  type: property
  title: Direct token donation inflates share price beyond maxRate when rate is high
  description: >
    accrueInterestView() (L683) reads IERC20(asset).balanceOf(address(this)) to compute
    realAssets. A direct asset.transfer() to the vault inflates balanceOf without going
    through deposit. The maxRate caps growth: newTotalAssets = min(realAssets, maxTotalAssets).
    But if maxRate is high (allocator-controlled, up to MAX_MAX_RATE) or elapsed time is
    large, a donation can inflate share price significantly, enabling sandwich attacks.
    Known Solodit HIGH: "Side effects of underlying directly donated to VaultV2."
  attack_scenario: >
    1. Vault: _totalAssets=1000, totalSupply=1000, maxRate is high.
    2. Attacker deposits 100, gets ~100 shares.
    3. Attacker donates 10000 tokens directly: asset.transfer(vault, 10000).
    4. accrueInterest sees realAssets=11100, capped by maxRate. If maxRate allows even
       partial pass-through, share price increases.
    5. Attacker redeems 100 shares at inflated price, extracting from depositors.
  impact: >
    Depositors lose value. Attacker extracts donated amount minus dust via redeem
    at inflated price. maxRate is the mitigation but allocator controls it.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 65
  solidity: |
    uint256 internal ghost_sumDeposited;
    uint256 internal ghost_sumWithdrawn;

    function property_tb_03() public {
      uint256 totalAssets = vault.totalAssets();
      uint256 netDeposits = ghost_sumDeposited > ghost_sumWithdrawn
        ? ghost_sumDeposited - ghost_sumWithdrawn : 0;
      uint256 elapsed = block.timestamp - vault.lastUpdate();
      uint256 maxGrowth = (netDeposits * elapsed * vault.maxRate()) / 1e18;
      t(
        totalAssets <= netDeposits + maxGrowth + 1e6,
        "TB-03: totalAssets exceeds deposits + maxRate growth — donation attack"
      );
    }
  ghost_vars:
    - uint256 internal ghost_sumDeposited;
    - uint256 internal ghost_sumWithdrawn;
  affected_functions:
    - accrueInterestView
    - accrueInterest
    - deposit
    - withdraw
  validated: false
  priority: high
  notes: >
    Known Solodit finding for Morpho VaultV2. maxRate is the primary defense.
    The trust boundary: balanceOf(address(this)) is externally influenceable.

# ═══════════════════════════════════════════════════════════════════════════
# TB-04: Adapter realAssets() returns inflated value — phantom interest
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-04
  tier: 1
  type: property
  title: Adapter realAssets() trusted without validation — phantom interest accrual
  description: >
    accrueInterestView() (L684-686) sums IAdapter(adapters[i]).realAssets() for ALL
    adapters. The vault completely trusts return values. A malicious adapter can return
    inflated realAssets(), causing phantom interest. This mints performance fee shares
    to performanceFeeRecipient, diluting depositors. maxRate caps growth but a persistent
    inflated return extracts value at maxRate pace every block.
  attack_scenario: >
    1. Curator adds malicious adapter via timelock.
    2. Adapter.realAssets() returns type(uint128).max.
    3. accrueInterest: realAssets huge, capped by maxRate → still mints fee shares.
    4. If curator = performanceFeeRecipient, they extract via dilution.
    5. Each interaction mints more fee shares at maxRate.
  impact: >
    Performance fee shares minted on phantom interest dilute all depositors.
    At high maxRate over weeks, significant extraction possible.
  impact_rating: High
  likelihood: Low
  severity: Medium
  confidence: 55
  solidity: |
    uint256 internal ghost_totalAllocatedToAdapters;

    function property_tb_04() public {
      uint256 reported = 0;
      uint256 adLen = vault.adaptersLength();
      for (uint256 i = 0; i < adLen; i++) {
        reported += IAdapter(vault.adapters(i)).realAssets();
      }
      t(
        reported <= ghost_totalAllocatedToAdapters * 2 + 1e18,
        "TB-04: adapters report realAssets far exceeding total allocated"
      );
    }
  ghost_vars:
    - uint256 internal ghost_totalAllocatedToAdapters;
  affected_functions:
    - accrueInterestView
    - accrueInterest
    - allocateInternal
    - deallocateInternal
  validated: false
  priority: medium
  notes: >
    Documented trust assumption. maxRate is mitigation. Requires malicious curator.

