# TB-05: Reverting adapter realAssets() bricks entire vault
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-05
  tier: 1
  type: property
  title: Single reverting adapter.realAssets() DoS-es all vault operations
  description: >
    accrueInterestView() (L684) loops ALL adapters calling realAssets(). If ANY adapter
    reverts, the entire function reverts. Since accrueInterest() is called in deposit(),
    mint(), withdraw(), redeem(), allocate(), setMaxRate(), and fee functions, a single
    reverting adapter completely bricks the vault. NatSpec says "Adapters should not
    revert on realAssets" — trust assumption not enforced.
  attack_scenario: >
    1. Vault has 5 adapters. One adapter's underlying market gets paused.
    2. Adapter's realAssets() calls paused market → reverts.
    3. accrueInterestView() reverts → ALL vault functions that call accrueInterest fail.
    4. No deposits, no withdrawals, no interest accrual.
    5. removeAdapter requires timelock → vault frozen for days/weeks.
  impact: >
    Complete vault freeze. No deposits or withdrawals. User funds locked for
    at minimum the timelock duration for removeAdapter.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 80
  solidity: |
    function property_tb_05() public {
      // accrueInterest should never revert
      try vault.accrueInterest() {
        // Success — vault not bricked
      } catch {
        t(false, "TB-05: accrueInterest reverted — vault bricked by adapter");
      }
    }
  ghost_vars: []
  affected_functions:
    - accrueInterestView
    - accrueInterest
    - deposit
    - mint
    - withdraw
    - redeem
  validated: false
  priority: high
  notes: >
    Realistic scenario — DeFi market pauses happen regularly. No try/catch in
    the adapter loop means zero fault tolerance.

# ═══════════════════════════════════════════════════════════════════════════
# TB-06: forceDeallocate also fails when accrueInterest is bricked
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-06
  tier: 1
  type: property
  title: Emergency forceDeallocate fails when accrueInterest reverts — zero escape
  description: >
    forceDeallocate() (L850-859) calls deallocateInternal() then withdraw().
    withdraw() calls accrueInterest(). If ANY adapter's realAssets() reverts (TB-05),
    the internal withdraw() also reverts, making forceDeallocate unusable. The supposed
    emergency mechanism fails in the exact scenario where it's most needed.
  attack_scenario: >
    1. Adapter X's realAssets() reverts (market paused).
    2. accrueInterest() → all deposit/withdraw/redeem fail.
    3. User calls forceDeallocate(healthyAdapterY, ..., user) to escape.
    4. deallocateInternal(Y) succeeds.
    5. withdraw(penaltyAssets, address(this), user) calls accrueInterest() → REVERTS.
    6. Entire forceDeallocate tx reverts. ZERO escape mechanism works.
  impact: >
    No user-accessible escape when vault is DoS-ed by reverting adapter.
    Funds locked until removeAdapter timelock completes.
  impact_rating: Critical
  likelihood: Medium
  severity: Critical
  confidence: 85
  solidity: |
    function property_tb_06() public {
      // forceDeallocate should work even when accrueInterest is bricked
      // We verify the dependency: if accrueInterest reverts, forceDeallocate also reverts
      bool accrueWorks = true;
      try vault.accrueInterest() {} catch { accrueWorks = false; }
      if (!accrueWorks && vault.adaptersLength() > 0) {
        t(false, "TB-06: accrueInterest bricked — forceDeallocate also unusable");
      }
    }
  ghost_vars: []
  affected_functions:
    - forceDeallocate
    - withdraw
    - accrueInterest
  validated: false
  priority: high
  notes: >
    Most critical trust boundary finding. The emergency mechanism has the same
    dependency on accrueInterest as regular operations. Combined with TB-05,
    creates a complete lockup scenario.

# ═══════════════════════════════════════════════════════════════════════════
# TB-07: firstTotalAssets transient manipulation via flash deposit
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-07
  tier: 1
  type: property
  title: Transient firstTotalAssets inflated by flash deposit enables relative cap bypass
  description: >
    firstTotalAssets is transient storage — resets to 0 each tx. Relative cap check
    (L612): allocation <= firstTotalAssets.mulDivDown(relativeCap, WAD). In a single
    tx: flash deposit inflates _totalAssets → accrueInterest sets firstTotalAssets
    high → allocator allocates beyond real relative limits → deposit withdrawn. The
    NatSpec acknowledges "Relative caps can still be manipulated by allocators."
  attack_scenario: >
    1. Vault TVL = 100K. Relative cap for risky adapter = 50% → max 50K.
    2. Colluding allocator flash deposits 10M. firstTotalAssets = ~10M.
    3. Allocator allocates 5M to risky adapter. 5M <= 10M * 50% → passes.
    4. Colluding depositor withdraws 10M in same tx.
    5. Now: 5M in risky adapter, 100K real TVL. Effective allocation = 5000%.
  impact: >
    Relative cap bypass. Vault funds concentrated in risky market far beyond
    intended percentage. Depositors exposed to single-market risk.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 60
  solidity: |
    uint256 internal ghost_realTotalAssetsPreTx;

    function property_tb_07() public {
      // After allocate, check that allocation doesn't exceed relativeCap * real assets
      // (not transient firstTotalAssets)
      for (uint256 i = 0; i < ghost_trackedIds.length; i++) {
        bytes32 id = ghost_trackedIds[i];
        uint256 alloc = vault.allocation(id);
        uint256 relCap = vault.relativeCap(id);
        uint256 realAssets = uint256(vault._totalAssets());
        if (relCap < 1e18 && realAssets > 0) {
          t(
            alloc <= (realAssets * relCap) / 1e18 + 1,
            "TB-07: allocation exceeds real relative cap (flash deposit bypass)"
          );
        }
      }
    }
  ghost_vars:
    - uint256 internal ghost_realTotalAssetsPreTx;
    - bytes32[] internal ghost_trackedIds;
  affected_functions:
    - allocateInternal
    - accrueInterest
    - deposit
    - enter
  validated: false
  priority: medium
  notes: >
    Documented and partially mitigated. Requires colluding allocator with capital.
    Flash loan within same tx is mitigated by firstTotalAssets, but across-tx deposits
    with allocator collusion bypass the mechanism.

# ═══════════════════════════════════════════════════════════════════════════
# TB-08: exit() raw balanceOf read — donation disrupts deallocate path
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-08
  tier: 1
  type: property
  title: exit() reads raw balanceOf for idle check — donation prevents needed deallocate
  description: >
    exit() (L825): idleAssets = IERC20(asset).balanceOf(address(this)). If assets >
    idleAssets, it deallocates from liquidityAdapter. An attacker can donate tokens
    to inflate idleAssets, preventing deallocate when it should happen. After the
    donated idle is sent to withdrawer, vault balance drops below _totalAssets tracking.
    Next accrueInterest sees higher realAssets (adapters still hold funds + donated
    idle is gone) → may create accounting mismatch.
  attack_scenario: >
    1. Vault: 100 idle + 900 in adapter. _totalAssets = 1000.
    2. User wants to withdraw 500. Normally: idle=100<500, deallocate 400.
    3. Attacker donates 500 to vault: idle now 600.
    4. exit(): idle=600 >= 500. No deallocate.
    5. 500 sent to user. Vault balance: 100 idle + 900 adapter = 1000.
    6. _totalAssets = 500 (1000-500). But realAssets = 100+900 = 1000.
    7. Next accrueInterest: interest = 1000-500 = 500 phantom → fee shares minted.
  impact: >
    Phantom interest accrual from donation-inflated idle balance. Performance fees
    extracted from depositors on non-existent yield.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 65
  solidity: |
    function property_tb_08() public {
      uint256 idleAssets = IERC20(vault.asset()).balanceOf(address(vault));
      uint256 totalAssets = uint256(vault._totalAssets());
      // Idle balance should never significantly exceed totalAssets
      // (which would indicate external donation)
      t(
        idleAssets <= totalAssets + 1e6,
        "TB-08: idle balance exceeds _totalAssets — donation detected"
      );
    }
  ghost_vars: []
  affected_functions:
    - exit
    - accrueInterestView
    - withdraw
    - redeem
  validated: false
  priority: high
  notes: >
    Related to TB-03 but targets exit path specifically. The maxRate caps
    the phantom interest growth rate, but it still accumulates over time.

# ═══════════════════════════════════════════════════════════════════════════
# TB-09: AdapterRegistry deregistration leaves active adapter in vault
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-09
  tier: 2
  type: property
  title: AdapterRegistry removal after addAdapter leaves non-registry adapter active
  description: >
    addAdapter() (L447) checks isInRegistry at addition time. If the registry later
    removes the adapter, the vault keeps using it. NatSpec (L125-126) acknowledges:
    "The invariant holds only if the registry cannot remove adapters (is add only)."
    If registry is not add-only, a compromised adapter stays active in vault.
  attack_scenario: >
    1. Registry R approved adapter A. Curator adds A to vault.
    2. R removes A (vulnerability found, or R governance compromised).
    3. Vault still uses A: isAdapter[A]=true, allocate/deallocate work.
    4. If A is compromised, funds allocated to A can be stolen.
    5. No automatic enforcement removes A from vault.
  impact: >
    Deregistered (potentially compromised) adapter remains active. Funds can be
    allocated to it and its realAssets() is still trusted.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 70
  solidity: |
    function property_tb_09() public {
      address registry = vault.adapterRegistry();
      if (registry != address(0)) {
        uint256 adLen = vault.adaptersLength();
        for (uint256 i = 0; i < adLen; i++) {
          address adapter = vault.adapters(i);
          bool inReg = IAdapterRegistry(registry).isInRegistry(adapter);
          t(inReg, "TB-09: active adapter not in registry — desync detected");
        }
      }
    }
  ghost_vars: []
  affected_functions:
    - addAdapter
    - setAdapterRegistry
    - allocateInternal
  validated: false
  priority: medium
  notes: >
    Documented limitation. Real risk depends on whether registry is add-only.
    setAdapterRegistry retroactively checks, but only at set time.

