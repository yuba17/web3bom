    - mint
  validated: false
  priority: low
  notes: >
    Documented exclusion per NatSpec. Low priority as a finding. Included because
    USDT fee-enable scenario is a known edge case that has affected vaults before.

# ═══════════════════════════════════════════════════════════════════════════
# TB-13: Adapter reentrancy during deallocate — no guard enforced
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-13
  tier: 1
  type: property
  title: Adapter can reenter vault during deallocateInternal — stale state exploitable
  description: >
    deallocateInternal() (L630) calls IAdapter(adapter).deallocate() BEFORE pulling
    tokens back (L638). During the adapter call, vault state is inconsistent: caps
    updated but _totalAssets/totalSupply unchanged. NatSpec says adapters "must not
    re-enter" but no reentrancy guard exists. The transient firstTotalAssets != 0
    makes accrueInterest a no-op (L681), providing SOME protection, but direct
    state reads (_totalAssets, totalSupply) are stale during reentrant calls.
  attack_scenario: >
    1. Malicious adapter added via timelock.
    2. exit() triggers deallocateInternal(adapter, ...).
    3. In deallocate(), adapter reenters vault.deposit() with another account.
    4. accrueInterest() returns early (firstTotalAssets!=0). Good.
    5. But previewDeposit uses _totalAssets which hasn't been updated yet.
    6. If _totalAssets is stale-high, reentrant depositor gets fewer shares
       (actually hurts the attacker). If stale-low, gets more shares.
    7. Depends on exact state — needs case analysis per operation.
  impact: >
    Stale exchange rate during reentrant call. Direction of exploitation depends
    on specific state. Could favor attacker or defender.
  impact_rating: Medium
  likelihood: Low
  severity: Medium
  confidence: 50
  solidity: |
    bool internal ghost_inDeallocate;
    bool internal ghost_reenteredDuringDeallocate;

    function property_tb_13() public {
      t(
        !ghost_reenteredDuringDeallocate,
        "TB-13: vault reentered during deallocateInternal"
      );
    }
  ghost_vars:
    - bool internal ghost_inDeallocate;
    - bool internal ghost_reenteredDuringDeallocate;
  affected_functions:
    - deallocateInternal
    - exit
    - deposit
    - mint
  validated: false
  priority: medium
  notes: >
    The firstTotalAssets transient provides significant protection — accrueInterest
    becomes a no-op. But other paths may still be exploitable. Low confidence because
    the protection is substantial but not proven complete.

# ═══════════════════════════════════════════════════════════════════════════
# TB-14: Upgradeable adapter proxy can be changed after addAdapter check
# ═══════════════════════════════════════════════════════════════════════════
- id: TB-14
  tier: 2
  type: property
  title: Upgradeable adapter proxy can be changed to malicious after vault addition
  description: >
    The vault does not check if added adapters are upgradeable proxies. An adapter
    that passes registry+timelock review can later be upgraded to a malicious
    implementation. The timelock on addAdapter protects against initial malicious
    addition but not post-addition upgrades.
  attack_scenario: >
    1. Curator adds legitimate adapter (proxy). Community reviews the implementation.
    2. Allocator sends 5M to adapter via allocate().
    3. Adapter admin upgrades proxy to malicious implementation.
    4. Malicious: realAssets() returns 5M (hiding theft), allocate() steals tokens.
    5. Vault accounting shows 5M allocated but funds are stolen.
    6. On deallocate, malicious adapter returns tokens from different source or reverts.
  impact: >
    Complete loss of funds allocated to upgradeable adapter if its admin is
    compromised. No vault-side defense against post-addition upgrades.
  impact_rating: Critical
  likelihood: Low
  severity: Medium
  confidence: 35
  solidity: |
    function property_tb_14() public {
      // Verify adapters' realAssets matches actual token holdings
      // A proxy upgrade would break this relationship
      uint256 adLen = vault.adaptersLength();
      for (uint256 i = 0; i < adLen; i++) {
        address adapter = vault.adapters(i);
        uint256 reported = IAdapter(adapter).realAssets();
        uint256 adapterBalance = IERC20(vault.asset()).balanceOf(adapter);
        // reported should be >= adapterBalance (adapter may have external positions)
        // but reported should not be wildly larger than what was allocated
        t(
          reported <= ghost_totalAllocatedToAdapters + 1e18,
          "TB-14: adapter realAssets exceeds total allocated — possible proxy upgrade"
        );
      }
    }
  ghost_vars:
    - uint256 internal ghost_totalAllocatedToAdapters;
  affected_functions:
    - addAdapter
    - allocateInternal
    - accrueInterestView
  validated: false
  priority: medium
  notes: >
    Governance/operational risk. Vault cannot prevent external proxy upgrades.
    Mitigation: only use non-upgradeable adapters. Low confidence as reportable
    finding since it's inherent to proxy trust model.
