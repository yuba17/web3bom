# ═══════════════════════════════════════════════════════════════════════════
# MM-TB-10: reallocate() strict equality — totalWithdrawn == totalSupplied
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-TB-10
  tier: 1
  type: property
  description: >
    reallocate() at L416: if (totalWithdrawn != totalSupplied) revert InconsistentReallocation.
    Strict equality — no tolerance. The type(uint256).max sentinel at L395-396 allows
    the last supply entry to absorb rounding: suppliedAssets = totalWithdrawn.zeroFloorSub(totalSupplied).
    This makes the last supply exactly balance the withdrawn total. Without the max sentinel,
    Morpho's share→asset rounding could cause 1-wei discrepancy: withdraw returns actual
    (possibly less than requested), but supply takes exact requested amount. If all amounts
    are explicit, the strict equality check could revert due to rounding. The max sentinel
    is the designed solution. This invariant validates that reallocate never creates or
    destroys vault value — it's net-neutral.
  attack_scenario: >
    1. Allocator calls reallocate with all explicit amounts (no max)
    2. Market A: withdraw 1000 → Morpho returns 999 (1 wei rounding)
    3. Market B: supply 1000 → supplies exactly 1000
    4. totalWithdrawn=999, totalSupplied=1000 → REVERT InconsistentReallocation
    5. Allocator must use max for balancing entry
    6. UX issue, not security — no fund loss
  impact: >
    Strict equality prevents value creation/destruction during reallocation.
    The max sentinel absorbs rounding. No fund loss possible — either
    reallocate succeeds with exact balance, or it reverts.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    function property_mm_tb_10() public {
      // After successful reallocate, totalAssets should remain approximately unchanged
      uint256 totalBefore = ghost_totalAssetsBeforeReallocate;
      uint256 totalAfter = vault.totalAssets();
      uint256 queueLen = vault.withdrawQueueLength();
      if (totalBefore > 0) {
        t(
          totalAfter + queueLen >= totalBefore && totalAfter <= totalBefore + queueLen,
          "MM-TB-10: reallocate changed totalAssets beyond rounding tolerance"
        );
      }
    }
  ghost_vars:
    - ghost_totalAssetsBeforeReallocate
  validated: false
  priority: high
  confidence: 75
  notes: >
    The type(uint256).max sentinel is the designed mechanism to absorb rounding.
    The invariant validates reallocate is net-neutral for vault value.

# ═══════════════════════════════════════════════════════════════════════════
# MM-TB-11: Guardian griefing — can permanently block timelock/guardian changes
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-TB-11
  tier: 2
  type: property
  description: >
    revokePendingTimelock() (L422-426) is onlyGuardianRole (guardian OR owner).
    revokePendingGuardian() (L429-433) is onlyGuardianRole. A malicious guardian
    can call revoke on every pending timelock reduction and guardian replacement,
    permanently blocking the owner from changing these values. The owner IS in
    onlyGuardianRole and can also call revoke, but cannot FORCE acceptance before
    validAt. The race: owner submits → guardian revokes before validAt → repeat.
    However, the owner can call submitTimelock(0 < new < current) which creates
    a pending with validAt = now + current_timelock. The guardian must revoke before
    validAt. If the guardian doesn't monitor, the change goes through (permissionless
    acceptTimelock). This is a game of monitoring: guardian must be MORE active than
    the accept caller. In practice, guardian is typically a multisig or DAO — slow to
    react. A MEV bot calling acceptTimelock at the exact validAt block could beat the
    guardian's revoke. This is the designed trust model — guardian has veto power but
    must exercise it within the timelock window.
  attack_scenario: >
    1. Guardian key compromised or guardian becomes malicious
    2. Owner submits new guardian → pendingGuardian set with validAt
    3. Malicious guardian calls revokePendingGuardian() before validAt
    4. Repeat — owner can never replace guardian
    5. Guardian can also revoke pending timelock reductions
    6. Owner can still: set curator, set allocator, set fee, set feeRecipient, set skimRecipient
    7. Owner CANNOT: reduce timelock, replace guardian (without guardian cooperation)
    8. Deposits/withdrawals still work — no fund loss
  impact: >
    Governance DoS — guardian becomes irrevocable. No fund loss. Owner retains
    most administrative capabilities. This is a known design tradeoff.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    function property_mm_tb_11() public view {
      // Timelock must always be within bounds
      uint256 tl = vault.timelock();
      t(tl >= 1 days, "MM-TB-11: timelock below MIN_TIMELOCK");
      t(tl <= 2 weeks, "MM-TB-11: timelock above MAX_TIMELOCK");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 85
  notes: >
    Known design tradeoff. Guardian veto power is intentional. With 444+
