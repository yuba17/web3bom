# ═══════════════════════════════════════════════════════════════════════════
# MM-TB-12: Curator instant cap-zero DoS — blocks all deposits
# ═══════════════════════════════════════════════════════════════════════════
- id: MM-TB-12
  tier: 2
  type: property
  description: >
    Cap decreases are instant (L284: newSupplyCap < supplyCap → _setCap directly).
    A malicious curator can set all caps to 0, making _supplyMorpho skip all markets
    (L776: if supplyCap == 0 continue) and revert with AllCapsReached. This blocks
    deposits entirely. Withdrawals still work (_withdrawMorpho doesn't check caps).
    Recovery: owner submits new caps (increases require timelock, >= 1 day). Recovery
    takes at least MIN_TIMELOCK. If guardian colludes with curator, guardian can revoke
    the owner's cap submissions (revokePendingCap is onlyCuratorOrGuardianRole).
    But owner is also in onlyCuratorOrGuardianRole (inherits from owner checks in
    all modifiers). Actually checking L167: onlyCuratorOrGuardianRole checks
    _msgSender() == guardian || curator || owner. So owner CAN revoke caps too.
    But to INCREASE caps, owner must go through timelock (submitCap → wait → acceptCap).
    Guardian could revoke the pending cap... but acceptCap is permissionless after validAt.
    Race condition: owner submits cap increase → waits timelock → MEV bot calls acceptCap
    at validAt → guardian can't revoke in time. Deposits resume.
  attack_scenario: >
    1. Malicious curator calls submitCap(market, 0) for all markets → instant
    2. All deposits revert with AllCapsReached
    3. Owner submits new caps → waits timelock (>= 1 day)
    4. acceptCap is permissionless after validAt → deposits resume
    5. Total deposit DoS: at least 1 day (MIN_TIMELOCK)
  impact: >
    1-day deposit freeze. No fund loss (withdrawals work). Requires
    compromised/malicious curator. Owner can recover via timelocked cap increase.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    function property_mm_tb_12() public view {
      // At least one market in supplyQueue should have cap > 0
      // (otherwise deposits are blocked)
      uint256 len = vault.supplyQueueLength();
      bool anyNonZeroCap = false;
      for (uint256 i = 0; i < len; i++) {
        Id id = vault.supplyQueue(i);
        (uint184 cap,,) = vault.config(id);
        if (cap > 0) {
          anyNonZeroCap = true;
          break;
        }
      }
      // If supplyQueue is non-empty, at least one market should accept deposits
      if (len > 0) {
        t(anyNonZeroCap, "MM-TB-12: all markets in supplyQueue have cap=0, deposits blocked");
      }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: >
    Known curator trust assumption. Likely excluded as "deployer/curator choices."
    The timelock recovery mechanism limits DoS duration.

notes: |
  Comprehensive trust boundary analysis of MetaMorpho.sol (907 lines). Key findings:

  1. MORPHO TRUST (MM-TB-02, MM-TB-03, MM-TB-09): The vault has infinite approval to
     Morpho Blue and trusts it completely. Morpho is immutable — this is safe IF Morpho
     has no vulnerabilities. The try/catch pattern in _supplyMorpho/_withdrawMorpho
     provides graceful degradation for individual market failures.

  2. PHANTOM ASSETS (MM-TB-07): The most significant trust boundary issue. Removing a
     market from withdrawQueue while supply > 0 causes totalAssets to understate reality.
     Protected by timelock but weaponizable by malicious curator+allocator. Likely excluded
     as trusted role behavior.

  3. REENTRANCY (MM-TB-04): Well-mitigated by the lastTotalAssets pre-update at L536/L549.
     ERC777 reentrancy during deposit is handled correctly. Standard ERC20 has no reentrancy.

  4. SUPPLY CAP ENFORCEMENT (MM-TB-05): Robust across both deposit and reallocate paths.
     +1 tolerance for inter-block interest. No bypass found.

  5. GOVERNANCE GRIEFING (MM-TB-11, MM-TB-12): Guardian can block timelock/guardian changes,
     curator can zero all caps. Both are known design tradeoffs within the trust model.
     Recovery mechanisms exist but introduce delay (MIN_TIMELOCK = 1 day).

  6. FOT TOKENS (MM-TB-08): Causes transient lastTotalAssets overstatement but no share
     price impact. Morpho Blue doesn't support FOT tokens — known limitation.

  OVERALL: The MetaMorpho trust model is well-designed. No exploitable vulnerabilities found
  outside the trusted role assumptions. The most interesting invariants to fuzz are MM-TB-01
  (residual balance), MM-TB-02 (totalAssets vs lastTotalAssets), MM-TB-05 (cap enforcement),
  MM-TB-07 (phantom assets), and MM-TB-10 (reallocate neutrality).
