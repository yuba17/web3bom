    content: >
      En CLPool/UniV3-style: cuando un zeroForOne swap aterriza exactamente en un tick
      boundary, tick se decrementa a tickNext-1. Es by-design para el swap loop.
      NO es una inconsistencia tick/price explotable. donate() debe verificar
      BOTH price AND tick para distribuir fees correctamente.
