    by design — documentado en comentario L314-317. El decrement asegura que el
    siguiente swap empiece buscando en el tick correcto. donate() incluso tiene
    un warning específico sobre verificar BOTH price and tick. No es un bug.
  investigated_at: '2026-03-23T02:00:00Z'
  pending_briefing_update:
