# CLPM-F02: Donate Does NOT Use Hook Delta System
# donate() calls vault.accountAppBalanceDelta (no hookDelta overload).
# Meanwhile swap() and modifyLiquidity() call vault.accountAppDeltaWithHookDelta.
# donate() calls beforeDonate/afterDonate hooks BUT these hooks CANNOT return
# deltas — they use callHook (not callHookWithReturnDelta).
# This means a hook cannot intercept/redirect donated tokens, unlike in swap.
# This asymmetry is worth testing: if a hook expects to capture fees from
# donate (like it can from swap), it gets nothing — potential design flaw.
###############################################################################
- id: CLPM-F02
  tier: 2
  type: property
  description: >
    Donate bypasses the hook delta system entirely. The beforeDonate and
    afterDonate hooks use callHook() (no return delta), and donate() settles
    directly via vault.accountAppBalanceDelta without hookDelta. This means
    hooks cannot intercept or redirect donated tokens. If a hook expects to
    take a cut of donations (as it can with swaps), the assumption is violated.
  attack_scenario: >
    A pool has a hook that is designed to take a fee on all token flows
    (swap, liquidity, donate). The hook correctly takes fees on swap via
    beforeSwap/afterSwap return deltas. But for donate, the hook's afterDonate
    callback fires but CANNOT return a delta. The donated tokens go 100%
    to LPs. If the hook protocol assumes it can capture donation fees, this
    breaks its fee model. Not directly exploitable for fund theft, but
    could cause incorrect fee accounting in hook protocols.
  impact: "Hook fee model broken for donations — hook receives 0% of donated amount"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a donate call, verify that the hook address has zero delta change
    // (confirming hooks cannot intercept donations)
    // In a test wrapper:
    // 1. Record hook's vault delta before donate
    // 2. Execute donate
    // 3. Verify hook's vault delta unchanged
    int256 hookDeltaBefore0 = vault.currencyDelta(address(key.hooks), key.currency0);
    int256 hookDeltaBefore1 = vault.currencyDelta(address(key.hooks), key.currency1);
    // ... donate happens ...
    int256 hookDeltaAfter0 = vault.currencyDelta(address(key.hooks), key.currency0);
    int256 hookDeltaAfter1 = vault.currencyDelta(address(key.hooks), key.currency1);
    eq(hookDeltaBefore0, hookDeltaAfter0, "CLPM-F02: hook captured donate delta0");
    eq(hookDeltaBefore1, hookDeltaAfter1, "CLPM-F02: hook captured donate delta1");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    This is by design — the code clearly does not give donate hooks return
    delta capability. The question is whether this creates an exploitable
    inconsistency for hook contracts that assume uniform delta handling.

