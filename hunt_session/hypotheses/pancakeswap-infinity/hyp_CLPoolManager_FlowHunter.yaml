    // Hook extraction = hookDelta.specified + hookDelta.unspecified
    // Invariant: hook extraction <= MAX_HOOK_FEE_BPS * |amountSpecified| / 10000
    // NOTE: This invariant is aspirational — the protocol does NOT enforce it.
    // A failing test here means: the protocol allows unlimited hook extraction.
    int256 hookTake0 = int256(ghost_lastHookDelta0);
    int256 hookTake1 = int256(ghost_lastHookDelta1);
    int256 totalHookTake = hookTake0 + hookTake1; // simplified
    // If hook take is positive (hook is receiving), flag it
    if (hookTake0 > 0 || hookTake1 > 0) {
