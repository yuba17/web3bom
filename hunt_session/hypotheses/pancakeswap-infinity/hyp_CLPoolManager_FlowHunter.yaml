# CLPM-F03: beforeSwap + afterSwap Combined Extraction
# A hook with BOTH beforeSwap and afterSwap return delta permissions can
# extract value from swappers. beforeSwap reduces amountToSwap (takes tokens),
# afterSwap adds to hookDeltaUnspecified (takes output tokens too).
# The combined effect: user pays more, gets less, hook profits.
# The only constraint is HookDeltaExceedsSwapAmount (CLHooks.sol:158):
#   if (exactInput ? amountToSwap > 0 : amountToSwap < 0) revert
# This prevents the hook from REVERSING the swap direction, but does NOT
# cap how much the hook takes. A hook taking 99.9% is valid.
###############################################################################
