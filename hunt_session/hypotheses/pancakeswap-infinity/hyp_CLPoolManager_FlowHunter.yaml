    // was not drastically less than what the user specified.
    // ghost_userAmountSpecified vs ghost_actualAmountToSwap
    if (ghost_userAmountSpecified != 0) {
        int256 ratio;
        if (ghost_userAmountSpecified < 0) {
            // exactInput: both should be negative
            ratio = (ghost_actualAmountToSwap * 10000) / ghost_userAmountSpecified;
        } else {
            ratio = (ghost_actualAmountToSwap * 10000) / ghost_userAmountSpecified;
