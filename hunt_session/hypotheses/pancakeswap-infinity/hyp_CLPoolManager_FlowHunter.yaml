# CLPM-F04: Protocol Fee Outside Delta System
# Protocol fees accrue in protocolFeesAccrued[currency] (ProtocolFees.sol:19)
# but are NOT part of the BalanceDelta returned by pool.swap(). The delta
# already includes the fee — the protocol fee is carved out of the LP fee
# within CLPool.swap() (line 292-303). The protocol fee is tracked SEPARATELY.
# collectProtocolFees() calls vault.collectFee() which decrements
# reservesOfApp and transfers tokens.
# Invariant: protocolFeesAccrued should NEVER exceed reservesOfApp for
# the pool manager. If it does, collectProtocolFees would underflow.
###############################################################################
