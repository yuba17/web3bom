  ghost_vars:
    - int128 internal ghost_lastHookDelta0;
    - int128 internal ghost_lastHookDelta1;
  validated: false
  priority: high
  confidence: 90
  notes: >
    This is partially by design — hooks are trusted by the pool creator. But
