    (delta + feeDelta) as the combined caller delta. The hook can return a
    hookDelta that effectively captures the LP's accrued fees. Since feeDelta
    represents fees owed TO the LP (negative values = tokens owed to user),
    a hook returning hookDelta = feeDelta would redirect all LP fees to itself.
