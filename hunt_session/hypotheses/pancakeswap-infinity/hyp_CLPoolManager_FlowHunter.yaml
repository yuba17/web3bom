###############################################################################
# CLPM-F10: Flash Loan Hypothesis — donate + collect in same lock
# Flash loan pattern: borrow → manipulate → profit → repay.
# With vault.lock():
# 1. Attacker calls vault.lock()
# 2. In lockAcquired: vault.take(token, attacker, amount) — borrows for free
# 3. Attacker adds liquidity to pool (sole LP)
# 4. Attacker donates borrowed tokens back into pool (feeGrowthGlobal increases)
# 5. Attacker removes liquidity (collects donated fees)
# 6. Attacker calls vault.settle() — repays the borrowed amount
# Net: attacker has the same tokens, feeGrowthGlobal is inflated, and if
# there were other LPs, the attacker diluted their fee share.
#
# KEY: vault.take() and vault.settle() act as a free flash loan.
# The comment in the code (IVault.sol:95): "Can also be used as a mechanism
# for free flash loans" — this is intentional!
#
# So the question is: can feeGrowthGlobal inflation via free flash loan
# + donate harm other LPs? YES — if an attacker rapidly inflates
# feeGrowthGlobal, existing LPs who haven't collected fees see their
# feeGrowthInside values distorted by the wrapping behavior of uint256.
###############################################################################
- id: CLPM-F10
  tier: 1
  type: property
  description: >
    Free flash loans via vault.take()/settle() combined with donate() allow
    an attacker to inflate feeGrowthGlobal without cost. If the attacker
    is the sole LP, they recover 100% of the donation. The risk is
    feeGrowthGlobal wrapping (uint256 overflow) which corrupts fee
    calculations for positions that span the wrap boundary.
  attack_scenario: >
    1. Attacker calls vault.lock().
    2. In lockAcquired: vault.take(USDC, attacker, 2^200).
    3. Attacker adds liquidity = 1 wei in active tick range.
    4. Attacker calls donate(2^200, 0).
       feeGrowthGlobal0X128 += 2^200 * 2^128 / 1 = 2^328 which wraps uint256.
    5. Attacker removes liquidity (collects fees — wrapping means ~0 due to
       underflow in fee calculation).
    6. vault.settle() — repays the 2^200.

    Other LPs: position.feeGrowthInside is based on the OLD feeGrowthGlobal.
    When they try to collect, the subtraction (currentFeeGrowth - lastFeeGrowth)
    wraps, giving them either 0 or a huge phantom balance.
    If phantom balance > actual pool reserves: LP withdraw fails (vault underflow).
    If phantom balance = 0: LP loses all accrued fees.
  impact: "Fee growth overflow can cause LPs to lose accrued fees or receive phantom fees"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // After any donate, check that feeGrowthGlobal hasn't grown by more than
    // a reasonable amount relative to pool liquidity.
    // MAX_SAFE_FEE_GROWTH_DELTA = 2^128 (one full Q128 unit per liquidity)
    (uint256 fg0, uint256 fg1) = poolManager.getFeeGrowthGlobals(poolId);
    if (ghost_prevFeeGrowth0 > 0) {
        // In unchecked math, wrapping is expected. But rapid growth indicates attack.
        uint256 delta0;
        unchecked { delta0 = fg0 - ghost_prevFeeGrowth0; }
        // Flag if delta exceeds reasonable bounds (e.g., > 2^200)
        if (delta0 > (1 << 200)) {
            t(false, "CLPM-F10: feeGrowthGlobal0 spike detected — possible donate attack");
        }
    }
    ghost_prevFeeGrowth0 = fg0;
    ghost_prevFeeGrowth1 = fg1;
  ghost_vars:
    - uint256 internal ghost_prevFeeGrowth0;
    - uint256 internal ghost_prevFeeGrowth1;
  validated: false
  priority: high
  confidence: 65
  notes: >
    The code explicitly acknowledges this in CLPool.sol:52-54. The question is
    whether the Uniswap V3 "designed to overflow" approach actually works
    safely in PancakeSwap's context. In Uniswap V3, fee growth wrapping is
    safe because all fee calculations use unchecked subtraction, and positions
    are updated when interacted with. BUT: positions that are never interacted
    with (abandoned positions) accumulate wrapping risk. This needs fork
    testing with real positions to determine practical impact.

###############################################################################
# FLASH LOAN HYPOTHESIS — Per-Function Analysis
###############################################################################
# FUNCTION: swap()
# 1. Reads state manipulable? YES — slot0 (price, tick), liquidity
# 2. Affects fund movement? YES — delta determines token flows
# 3. Same-tx read+consume? YES — within vault.lock()
# 4. Post-action verification? YES — vault.lock() checks all deltas settle to 0
# 5. Reentrancy guard? NO explicit guard — relies on vault single-locker
# 6. Callback initiator check? N/A (hooks are pool-selected, not user callbacks)
# 7. Spot vs TWAP? Uses spot price (sqrtPriceX96) — manipulable within lock
# 8. Reward by instant balance? YES — feeGrowthGlobal updated during swap
# 9. Cap/threshold crossable atomically? NO liquidation mechanics
# 10. Self-liquidation? N/A
# 11. Fee rounding to zero? YES — with tiny swap amounts, fee can round to 0
# 12. Checkpoint: storage (feeGrowthGlobal persists)
# RISK: Questions 1+2+3 = YES → strong flash loan candidate.
#        BUT vault settlement check (Q4) prevents theft. The risk is
#        manipulation of PRICE state during a lock for external protocols
#        that read this pool's price (read-only reentrancy pattern).
#
# FUNCTION: donate()
# 1. Reads state: YES — liquidity (to distribute fees)
# 2. Affects funds: YES — feeGrowthGlobal inflation
# 3. Same-tx: YES
# 4. Post-action: vault settlement only (no donate-specific check)
# 5. Reentrancy: vault single-locker
# 6. N/A
# 7. N/A
# 8. YES — fees distributed by liquidity ratio
# 9. N/A
# 10. N/A
# 11. YES — small donation with high liquidity rounds feeGrowthGlobal to 0
# 12. Storage (feeGrowthGlobal)
# RISK: Q1+Q2+Q3 = YES. Donate can inflate feeGrowthGlobal for free.
#        Combined with flash loan (vault.take), this is the CLPM-F10 vector.
#
# FUNCTION: modifyLiquidity()
# 1. YES — reads feeGrowthGlobal, tick, positions
# 2. YES — delta includes tokens + fees
# 3. YES — within lock
# 4. YES — vault settlement
# 5. vault single-locker
# 6. N/A
# 7. N/A
# 8. YES — fee collection based on feeGrowthInside (manipulable via donate)
# 9. NO
# 10. N/A
# 11. YES — small positions can have zero fee accrual
# 12. Storage
# RISK: Q1+Q2+Q3 = YES. Combined with donate manipulation: add liquidity,
#        donate, remove liquidity = fee extraction cycle (CLPM-F05/F10).

false_positives:
- hunter: FlowHunter
  id: CLPM-FP-01
  reason: >
    Considered whether hook delta sign convention allows a hook to claim tokens
    it doesn't owe. Analysis: callerDelta = delta - hookDelta; if hookDelta is
    negative (hook receives), callerDelta increases (user pays more). The vault
    then debits the user and credits the hook. The hook must SETTLE its delta
    (via vault.settle or vault.burn). If it doesn't, the lock reverts. So the
    hook cannot steal without sourcing the tokens from somewhere. This is
    by design — the settlement guard prevents theft.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Hook delta sign convention: negative hookDelta = hook receives tokens.
      callerDelta = delta - hookDelta. Vault settlement guard ensures all
      deltas net to zero. Hooks cannot steal without settling — but they CAN
      redirect value from users to themselves within the settlement constraint.
    briefing_update_applied: false

- hunter: FlowHunter
  id: CLPM-FP-02
  reason: >
    Investigated whether protocol fees could be double-counted (once in
    the swap delta, once in protocolFeesAccrued). Analysis: pool.swap()
    returns a balanceDelta that INCLUDES the total swap fee (LP fee +
    protocol fee). The protocol fee is then separately tracked in
    protocolFeesAccrued. But the pool's reserves (via vault.reservesOfApp)
    include both the LP and protocol portions. When collectProtocolFees
    is called, it decrements reservesOfApp. So there's no double-counting;
    the protocol fee is carved from the existing reserves, not added on top.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      Protocol fee is included in swap delta (user pays it as part of the
      total fee). protocolFeesAccrued is a separate tracker for how much
      of the reserve belongs to the protocol. collectProtocolFees deducts
      from reservesOfApp — no double counting.
    briefing_update_applied: false
