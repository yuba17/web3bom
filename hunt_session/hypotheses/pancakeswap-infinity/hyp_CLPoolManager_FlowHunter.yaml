# CLPM-F09: donate() Settles Directly to msg.sender (No Hook Interception)
# In CLPoolManager.donate() line 245:
#   vault.accountAppBalanceDelta(key.currency0, key.currency1, delta, msg.sender);
# This uses the 4-arg overload (no hookDelta). Compare to swap/modifyLiquidity
# which use accountAppDeltaWithHookDelta (6-arg via VaultAppDeltaSettlement).
#
# If a hook calls donate() within its own callback (e.g., afterSwap), the
# msg.sender is the CLPoolManager (since it's the one calling the hook).
# Wait — no. The hook is called by CLPoolManager, so within the hook callback,
# msg.sender for the hook is CLPoolManager. But donate() is called on
# CLPoolManager, so msg.sender there is whoever called it — NOT the hook.
# Hooks can't call donate() directly through the CLPoolManager because they're
# called BY the pool manager.
#
# BUT: within a vault.lock() callback, any contract can call donate(). If a
# hook contract also acquires lock, it can call donate() with msg.sender = hook.
# In that case, the hook pays for the donation (its own delta), and LP fees
# increase. This is legitimate behavior, not an attack.
###############################################################################
- id: CLPM-F09
  tier: 2
  type: property
  description: >
    donate() uses direct settlement (no hookDelta pathway). Hooks cannot
    intercept or redirect donations. Combined with the fact that hooks CAN
    call donate() from within a lock callback, this creates an asymmetry:
    hooks can inject fees into the pool (via donate) but cannot extract
    fees from donations made by others.
  attack_scenario: >
    1. Hook acquires vault.lock() in a separate transaction.
    2. Hook calls donate(pool, large_amount, 0) to inflate feeGrowthGlobal0.
    3. Within the same lock, hook removes its LP position, collecting the
       inflated fees.
    4. Net: hook donated and collected its own donation — neutral.
    5. BUT: if other LPs are in range, the donated fees are split
       proportionally. The hook loses funds to other LPs.
    6. This is NOT profitable for the hook unless it's the sole LP.
    This is the same issue as CLPM-F05 viewed from the hook's perspective.
  impact: "No direct fund loss — hook bears the cost of its own donations"
  impact_rating: Low
  likelihood: Low
  severity_final: null
