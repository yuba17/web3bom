# CLPM-F07: beforeSwap amountToSwap Modification Without Upper Bound
# CLHooks.beforeSwap can modify amountToSwap via hookDeltaSpecified (line 157).
# The ONLY check is that the swap direction doesn't reverse (line 158).
# This means a beforeSwap hook can reduce amountToSwap to 1 wei, effectively
# DOSing the swap while still executing. The user thinks they swapped X,
# but only 1 wei went through the AMM, and the hook took X-1.
# Combined with: the hook must settle its debt. If it doesn't, vault.lock()
# reverts. So the hook needs a way to source the tokens.
###############################################################################
- id: CLPM-F07
  tier: 2
  type: property
  description: >
    beforeSwap can reduce the swap amount to near-zero without reverting.
    The only check prevents direction reversal, not magnitude reduction.
    Combined with the hook taking the difference via hookDeltaSpecified,
    the hook effectively converts the user's swap into a transfer to the hook.
  attack_scenario: >
    1. User initiates exactInput swap of 1000 USDC for ETH.
    2. beforeSwap hook returns hookDeltaSpecified = -999 (takes 999).
    3. amountToSwap = -1000 + (-999) = ... wait, specified is negative for
       exactInput. hookDeltaSpecified must be positive to reduce magnitude.
       amountToSwap = -1000 + 999 = -1. Only 1 wei enters AMM.
    4. User gets ~0 ETH output. Hook owes 999 USDC to settle.
    5. The hook settles by using tokens from another source (or its own reserves).
    6. Net: user paid 1000, got ~0 output. Hook gained 999 USDC.
    This is only possible if: (a) hook has reserves to settle, or (b) the
    lock callback provides settlement. Either way, the user is robbed.
  impact: "beforeSwap hook can reduce swap amount to near-zero, extracting user funds"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
