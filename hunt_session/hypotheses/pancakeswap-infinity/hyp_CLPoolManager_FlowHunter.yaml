    the specified side (via beforeSwapDelta.specified) AND from the unspecified
    side (via afterSwap return + beforeSwapDelta.unspecified). The only
    validation is that the swap direction doesn't reverse. There is NO cap
    on total hook extraction as a percentage of the swap.
