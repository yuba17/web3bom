# The hook receives (delta + feeDelta) as the total delta. It can return a
# hookDelta. Then callerDelta = (delta + feeDelta) - hookDelta.
# The vault settles: callerDelta for msg.sender, hookDelta for hook.
#
# CRITICAL: feeDelta is INCLUDED in the delta passed to the hook. The hook
# can therefore claim the user's accrued fees by returning a hookDelta that
# matches the feeDelta. For remove liquidity, feeDelta is negative (tokens
# owed to user). If hookDelta matches feeDelta, the hook gets the fees.
