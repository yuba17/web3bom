# CLPM-F05: Donate + Collect Fees in Same Lock (Flash Loan Pattern)
# The code comment in CLPool.State says: "atomically donating and collecting
# fees in the same lockAcquired callback may make the inflated value more
# extreme." This is an ACKNOWLEDGED risk.
#
# Attack: Within a single vault.lock() callback:
# 1. Add liquidity (become sole LP in range)
# 2. Donate large amount to the pool (increases feeGrowthGlobal)
# 3. Remove liquidity (collect the donated fees as feeDelta)
# Net: donated tokens flow back to the attacker.
# This is NOT free money — the attacker donates and gets back what they
# donated. BUT if there are OTHER LPs in range, the attacker dilutes their
# own donation across all LPs. So the attack only works profitably if the
# attacker is the SOLE LP.
#
# The real risk: feeGrowthGlobal inflation affects all future fee calculations.
# If feeGrowthGlobal0X128 overflows (uint256 wrapping), positions that haven't
# collected fees could see incorrect feeGrowthInside calculations.
###############################################################################
