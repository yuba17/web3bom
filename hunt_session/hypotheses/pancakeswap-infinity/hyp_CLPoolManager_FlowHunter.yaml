###############################################################################
# CLPM-F01: Hook Delta Conservation in Swap
# The sum (callerDelta + hookDelta) settled to the vault must equal the raw
# pool.swap() output (amountIn/amountOut). A malicious hook returning arbitrary
# beforeSwapDelta + afterSwapDelta could break this if the arithmetic in
# CLHooks.afterSwap does not conserve value.
#
# KEY INSIGHT: In CLHooks.afterSwap, hookDelta is constructed from
# (hookDeltaSpecified, hookDeltaUnspecified), where hookDeltaSpecified comes
# from beforeSwapDelta and hookDeltaUnspecified = beforeSwapDelta.unspecified +
# afterSwap return. Then delta = delta - hookDelta. So the vault sees
# (delta - hookDelta) for the user and hookDelta for the hook.
# The app-level reserve change is: delta0 + hookDelta0 and delta1 + hookDelta1
# (from Vault.accountAppBalanceDelta). This should equal the ORIGINAL pool
# delta (pre-hook adjustment). If the hook can inflate hookDelta without
# the vault enforcing conservation, value leaks.
#
# ANALYSIS: Vault._accountDeltaForApp takes (delta0 + hookDelta0) which
# equals the original pool delta because delta = originalDelta - hookDelta,
# so delta + hookDelta = originalDelta. This IS conserved algebraically.
# BUT: the beforeSwap hook can CHANGE amountToSwap (line 157 of CLHooks.sol),
# which changes what pool.swap() processes. The hookDeltaSpecified from
# beforeSwap is then added back in afterSwap. The question is whether
# the hook can return a hookDeltaSpecified that doesn't match the actual
# amount it withheld.
#
# VERDICT: The hook is trusted (pool creator chose it). BUT if the hook is
# poorly implemented, it can steal from swappers. This is a systemic risk
# for all pools with hooks. The invariant is: for any pool, the net tokens
# flowing through the system must be conserved.
###############################################################################
- id: CLPM-F01
  tier: 1
  type: property
  description: >
    Swap delta conservation: vault app reserve change must equal the raw pool
    swap output. For each swap, (callerDelta + hookDelta).amount0 and
    (callerDelta + hookDelta).amount1 must equal what pool.swap() returned
    before hook adjustments. If a hook inflates hookDeltaSpecified beyond
    what it actually withheld from the swap, the app reserve diverges from
    real token balances.
  attack_scenario: >
    A malicious beforeSwap hook returns hookDeltaSpecified = -X (pretending
    to subsidize X tokens to the swap), reducing amountToSwap. pool.swap()
    processes less. In afterSwap, hookDeltaSpecified is added to hookDelta,
    meaning the hook is credited X tokens it never provided. The user pays
    less, but the pool also swaps less, and the hook owes X to the vault
    (negative delta). If the hook never settles, the vault.lock() reverts
    with CurrencyNotSettled. So the attack vector is: can the hook return
    a delta that it then settles from the pool's own reserves? If the hook
    IS an LP and can collect fees atomically, it could settle its own debt
    from fee collection.
  impact: "Potential fund extraction from pool reserves through hook delta manipulation"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Track raw pool delta before hook adjustments vs final settled amounts
    // This requires ghost vars set in a wrapper around swap()
    // After swap: callerDelta + hookDelta should == rawPoolDelta
    int128 reconstructed0 = int128(ghost_lastCallerDelta0) + int128(ghost_lastHookDelta0);
    int128 reconstructed1 = int128(ghost_lastCallerDelta1) + int128(ghost_lastHookDelta1);
    eq(reconstructed0, ghost_rawPoolDelta0, "CLPM-F01: swap delta0 not conserved");
    eq(reconstructed1, ghost_rawPoolDelta1, "CLPM-F01: swap delta1 not conserved");
  ghost_vars:
    - int128 internal ghost_lastCallerDelta0;
    - int128 internal ghost_lastCallerDelta1;
    - int128 internal ghost_lastHookDelta0;
    - int128 internal ghost_lastHookDelta1;
    - int128 internal ghost_rawPoolDelta0;
    - int128 internal ghost_rawPoolDelta1;
  validated: false
  priority: high
  confidence: 70
  notes: >
    Algebraically conserved in the happy path. The real risk is hooks that
    game the settlement system. Need to verify with a malicious hook contract
    in fuzz testing.

