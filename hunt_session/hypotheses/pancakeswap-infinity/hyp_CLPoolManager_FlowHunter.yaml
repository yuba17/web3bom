    4. User paid 100, gets ~5 output. Hook profited 90 input + 5 output.
    The pool is untouched (it processed a fair 10-for-10 swap).
    If beforeSwapDelta.unspecified is also set, the hook can take even more.
    Net: user is sandwiched by the hook. All within protocol rules.
  impact: "Users can lose up to 100% of swap value to malicious hooks"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
