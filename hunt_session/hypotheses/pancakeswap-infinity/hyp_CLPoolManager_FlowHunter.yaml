  tier: 1
  type: property
  description: >
    Protocol fees are tracked in a separate mapping (protocolFeesAccrued)
    outside the delta/settlement system. They accumulate via unchecked
    addition in swap(). collectProtocolFees() decrements and calls
    vault.collectFee(). The invariant is: protocolFeesAccrued[currency]
    must never exceed vault.reservesOfApp[poolManager][currency].
