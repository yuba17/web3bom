    try binPoolManager.burn(poolKey, burnParams, hookData) returns (BalanceDelta delta) {
        // burn succeeded while paused — flag if this is unintended
        t(!ghost_isPaused, "BPM-F03: burn succeeded while contract is paused");
    } catch {
        // burn reverted — expected if whenNotPaused is supposed to be there
    }
  ghost_vars:
    - bool internal ghost_isPaused;
  validated: true
  priority: high
  confidence: 90
  notes: >
    Confirmed by code review: burn() has NO whenNotPaused modifier. This is likely
