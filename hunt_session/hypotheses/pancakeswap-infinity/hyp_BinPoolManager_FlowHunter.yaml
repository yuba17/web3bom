- id: BPM-F07
  tier: 1
  type: property
  description: >
    Bin tree consistency after burn: the tree removal at L338 triggers when
    supply - amountToBurn == MINIMUM_SHARE. But what if a user burns to
    exactly 0 remaining shares? supply - amountToBurn = 0, which != MINIMUM_SHARE.
    The tree would NOT be updated, leaving a phantom bin with 0 shares but
    present in the tree. Swaps would route through this bin, find 0 reserves,
    and waste gas or revert.
  attack_scenario: >
    1. First minter creates bin with shares = S, shareOfBin = S, user position = S - 1000.
    2. Second minter adds shares = T, shareOfBin = S + T.
    3. Both users burn ALL their shares: user1 burns (S-1000), user2 burns T.
    4. Remaining shareOfBin = S + T - (S - 1000) - T = 1000 = MINIMUM_SHARE.
    5. The LAST burn triggers tree removal (1000 == MINIMUM_SHARE). Correct.
    BUT: if only user1 burns (S-1000), remaining = T + 1000.
    Then user2 burns T, remaining = 1000. supply - amountToBurn = (T+1000) - T = 1000
    = MINIMUM_SHARE. Tree removal triggers. Still correct.
    EDGE CASE: What if someone transfers shares directly? BinPosition.subShare can
    underflow (0.8.26 reverts). No external transfer function exists for shares.
    So the only way to reduce shares is via burn, which always hits the MINIMUM_SHARE check.
    This seems safe but needs verification for edge paths.
  impact: "Phantom bins in tree cause swap routing inefficiency and potential reverts."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After any burn, verify tree consistency:
    // If shareOfBin == MINIMUM_SHARE, bin should NOT be in tree
    // If shareOfBin > MINIMUM_SHARE, bin SHOULD be in tree
    for (uint256 i = 0; i < ghost_burnBinIds.length; i++) {
        uint24 binId = ghost_burnBinIds[i];
        uint256 supply = binPoolManager.pools(poolId).shareOfBin[binId];
        if (supply <= MINIMUM_SHARE) {
            // Bin should be removed from tree — verify via getNextNonEmptyBin
            uint24 nextRight = binPoolManager.getNextNonEmptyBin(poolId, true, binId - 1);
            t(nextRight != binId, "BPM-F07: dead bin still in tree after burn");
        }
    }
  ghost_vars:
    - uint24[] internal ghost_burnBinIds;
  validated: false
  priority: medium
  confidence: 70
  notes: >
    After extensive analysis, the MINIMUM_SHARE mechanism appears correctly implemented.
    The only remaining concern is the addBinIdToTree condition at L476 during mint:
    supply <= MINIMUM_SHARE triggers add. If supply == MINIMUM_SHARE (bin was drained
    to dead shares), a new mint correctly re-adds it to the tree. If supply == 0
    (impossible — MINIMUM_SHARE stays forever once minted), first mint adds to tree.
    The real question: can shareOfBin ever reach 0? Only if _subShare is called on
    MINIMUM_SHARE itself, which requires someone to own those shares — but nobody does.

- id: BPM-F08
  tier: 2
  type: property
  description: >
    donate() settles with vault BEFORE calling afterDonate hook (BinPoolManager L300-305).
    This is a different pattern from swap/mint/burn which call vault.accountAppDeltaWithHookDelta
    AFTER the afterHook. donate uses vault.accountAppBalanceDelta directly (no hook delta),
    then calls afterDonate. This means the vault state is committed before the hook executes.
    Within the same Vault lock context, the hook could observe the donated state and act on it.
  attack_scenario: >
    1. Pool has afterDonate hook that calls swap on the same pool.
    2. User calls donate(100 tokenX, 100 tokenY).
    3. vault.accountAppBalanceDelta commits the donation delta.
    4. pool.donate() already updated reserveOfBin with the donated amounts.
    5. afterDonate hook fires — calls swap() on the same pool.
    6. Swap sees inflated reserves in active bin (100 extra X and Y).
    7. Hook-triggered swap gets better output because the bin has more liquidity.
    8. But: hooks are TRUSTED per contest rules, so this is out of scope.
    Still worth noting the CEI divergence from the other operations.
  impact: "Within trusted hook context, donation state is observable before afterDonate. Out of scope per trusted-hook rule."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify donate settlement order doesn't cause state inconsistency
    // After donate, active bin reserves should reflect donation
    if (ghost_donateOccurred) {
        (uint128 rx, uint128 ry,,) = binPoolManager.getBin(poolId, ghost_donateActiveBinId);
        gte(uint256(rx), ghost_preDonateBinReserveX, "BPM-F08: bin X reserves decreased after donate");
        gte(uint256(ry), ghost_preDonateBinReserveY, "BPM-F08: bin Y reserves decreased after donate");
        // Shares should be unchanged
        eq(ghost_postDonateShares, ghost_preDonateBinShares, "BPM-F08: shares changed during donate");
    }
  ghost_vars:
    - bool internal ghost_donateOccurred;
    - uint24 internal ghost_donateActiveBinId;
    - uint256 internal ghost_preDonateBinReserveX;
    - uint256 internal ghost_preDonateBinReserveY;
    - uint256 internal ghost_preDonateBinShares;
    - uint256 internal ghost_postDonateShares;
  validated: false
  priority: low
  confidence: 70
  notes: >
    donate() CEI violation is real (Effect before Interaction with afterDonate) but
    the impact is limited by: (1) hooks are trusted, (2) vault lock prevents external
    reentrancy, (3) within lock context, deltas must net to zero. The divergence from
    swap/mint/burn patterns is worth flagging as a design inconsistency even if not
    exploitable.

- id: BPM-F09
  tier: 1
  type: property
  description: >
    exactOutput swap with dust amounts: in getAmountsIn (BinHelper L229-253),
    amountInWithoutFee is computed via shiftDivRoundUp or mulShiftRoundUp, which
    rounds UP. For 1 wei output, the input rounds up to at least 1 wei + fee.
    However, getFeeAmount on 1 wei: fee = (1 * feeBips * 1e12 + denominator - 1) / denominator.
    For small feeBips (e.g., 1 = 0.0001%), fee = (1 * 1e12 + denom - 1) / denom which
    rounds up to 1. So minimum input for 1 wei output = 2 wei. But what about
    amountOutOfBin capping at binReserveOut? If binReserveOut < amountOutLeft, only
    binReserveOut is used. For nearly-empty bins, this means partial fills with
    potentially unfavorable rounding.
  attack_scenario: >
    1. Attacker finds a bin with 1 wei of reserve in the output token.
    2. Calls exactOutput swap requesting 1 wei.
    3. getAmountsIn: amountOutOfBin = min(1, binReserveOut=1) = 1.
    4. amountInWithoutFee = shiftDivRoundUp(1, ...) could be 0 for certain prices.
    5. If amountInWithoutFee = 0, feeAmount = 0, total input = 0.
    6. Attacker gets 1 wei for free.
    This depends on the price: for swapForY, amountInWithoutFee = amountOutOfBin * SCALE / price.
    If price > SCALE (Y is cheaper than X at 1:1), then 1 * 2^128 / price could round to 0
    for very high prices. shiftDivRoundUp: (1 << 128 + price - 1) / price. For price = 2^128,
    result = (2^128 + 2^128 - 1) / 2^128 = 1. For price = 2^256 (impossibly high), result
    would be 0 after rounding. But price is uint256 from getPriceFromId, which is bounded.
  impact: "Free token extraction via zero-input exactOutput swaps. Requires specific price conditions."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After exactOutput swap, verify input amount is non-zero
    if (ghost_lastSwapExactOutput) {
        // The paying side should be non-zero
        if (ghost_lastSwapForY) {
            t(ghost_lastSwapDelta0 < 0, "BPM-F09: exactOutput swapForY with zero X input");
        } else {
            t(ghost_lastSwapDelta1 < 0, "BPM-F09: exactOutput swap!ForY with zero Y input");
        }
    }
  ghost_vars:
    - bool internal ghost_lastSwapExactOutput;
    - bool internal ghost_lastSwapForY;
  validated: false
  priority: medium
  confidence: 50
  notes: >
    shiftDivRoundUp rounds UP, which should prevent zero results for non-zero inputs.
    (a << offset + b - 1) / b where a=1, offset=128: (2^128 + price - 1) / price >= 1
    for any price >= 1. Since price is always >= 1 (from getPriceFromId), the minimum
    amountInWithoutFee is 1. Then fee on 1 = at least 1 for any non-zero fee. So
    minimum input = 2 for any non-zero fee. This seems safe. Lower confidence on
    exploitability but worth fuzzing at extreme bin IDs and steps.

