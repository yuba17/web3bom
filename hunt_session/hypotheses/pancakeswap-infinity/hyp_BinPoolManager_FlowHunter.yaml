- id: BPM-F05
  tier: 1
  type: property
  description: >
    Swap delta sign correctness: in all 4 branches of delta construction (BinPool.sol L207-221),
    exactly one component must be negative (user pays) and one positive (user receives).
    The 4 branches are: exactInput+swapForY, exactInput+!swapForY, exactOutput+swapForY,
    exactOutput+!swapForY. A sign error in any branch means the Vault credits the user
    instead of debiting (or vice versa).
  attack_scenario: >
    If the delta sign is inverted (e.g., user receives both tokens), a single swap call
    drains the pool of both token types. This would be a critical accounting error.
    Trace: exactInput swapForY (L209-210): result = (-amount, +amountsUnspecified.decodeY).
    User pays amount of X, receives amountsUnspecified of Y. amountsUnspecified accumulated
    via add(amountsOutOfBin). decodeY extracts Y component. Correct only if amountsOutOfBin
    encodes output in Y for swapForY case — confirmed by getAmountsOut (BinHelper L308-309):
    amountsOutOfBin = amountOut128.encodeSecond() for swapForY. encodeSecond = Y slot. Correct.
