    burn() is callable when contract is paused — no whenNotPaused modifier.
    swap() (L161), mint() (L207), and donate() (L283) all have whenNotPaused,
    but burn() at L249 does not. This means during an emergency pause, users can
    still burn LP and withdraw tokens while trading is halted.
  attack_scenario: >
    1. Protocol pauses due to detected exploit or price manipulation.
    2. Attacker, aware of the vulnerability that triggered the pause, calls burn()
       to exit their positions at the manipulated/incorrect price.
    3. All other users cannot swap to adjust their positions (swap is paused).
    4. Attacker front-runs the un-pause, having already exited at the favorable state.
    5. When the pool un-pauses, remaining LPs absorb the loss because reserves are
       depleted by the attacker's burn while they couldn't rebalance.
  impact: "Unfair advantage during emergency — attacker exits at manipulated prices while honest users are locked in."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
