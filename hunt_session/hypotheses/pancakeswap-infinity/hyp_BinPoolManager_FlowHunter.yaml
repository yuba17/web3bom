        t(!(d0 > 0 && d1 > 0), "BPM-F05: swap gave user both tokens — critical sign error");
        // Never both zero (should have reverted via InsufficientAmountUnSpecified)
        t(!(d0 == 0 && d1 == 0), "BPM-F05: swap produced zero delta");
        // For exactInput: the specified side (input) should be negative
        // For exactOutput: the specified side (output) should be positive
    }
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 65
