- id: BPM-F01
  tier: 1
  type: property
  description: >
    Token conservation across swap: the sum of all bin reserve changes plus
    protocol fees extracted must exactly equal the delta reported to the Vault.
    In BinPool.swap, each bin's reserves are updated as
    reserves += (amountsInWithFees - pFee) - amountsOutOfBin. The protocol fee
    (pFee) is computed per-bin via integer division (totalFee * protocolFee / swapFee),
    which rounds DOWN independently per bin. Over a multi-bin swap, the cumulative
    rounding loss means total pFee collected < what would be collected on the aggregate.
    The difference stays in bin reserves as an LP windfall. Verify no tokens vanish.
  attack_scenario: >
    If reserve updates and delta construction use inconsistent rounding, tokens could
    be created or destroyed. Created tokens = pool insolvency when LPs burn. Destroyed
    tokens = permanent lockup. Multi-bin swaps amplify per-bin rounding: N bins traversed
    means up to N wei of rounding drift between reserves and delta. While each individual
    amount is small, this creates a systematic bias.
  impact: "Cumulative accounting drift between reserves and Vault-settled deltas. Small per-swap but compounds over millions of swaps."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After any swap, verify:
    // sum(reserveChange_per_bin) + totalProtocolFee == |inputDelta| - |outputDelta|
    // Ghost: track total reserves before/after swap across all traversed bins
    // Track protocol fee accrued during this swap
    // Track delta returned by swap
    if (ghost_lastSwapOccurred) {
        // reserveChangeX + reserveChangeY + protocolFeeX + protocolFeeY should equal
        // the net tokens entering the pool (delta negative = user pays = pool receives)
        int256 poolReceived0 = -ghost_lastSwapDelta0;
        int256 poolReceived1 = -ghost_lastSwapDelta1;
        int256 reserveChange0 = ghost_swapReserveChangeX;
        int256 reserveChange1 = ghost_swapReserveChangeY;
        int256 pFee0 = int256(ghost_swapProtocolFeeX);
        int256 pFee1 = int256(ghost_swapProtocolFeeY);
        eq(reserveChange0 + pFee0, poolReceived0, "BPM-F01: X token conservation violated in swap");
        eq(reserveChange1 + pFee1, poolReceived1, "BPM-F01: Y token conservation violated in swap");
    }
  ghost_vars:
    - bool internal ghost_lastSwapOccurred;
    - int256 internal ghost_lastSwapDelta0;
    - int256 internal ghost_lastSwapDelta1;
    - int256 internal ghost_swapReserveChangeX;
    - int256 internal ghost_swapReserveChangeY;
    - uint256 internal ghost_swapProtocolFeeX;
    - uint256 internal ghost_swapProtocolFeeY;
  validated: false
  priority: critical
  confidence: 70
  notes: >
    At BinPool.sol L176: reserves = binReserves + amountsInWithFees - amountsOutOfBin.
    amountsInWithFees has already had pFee subtracted (L173). So reserve increase =
    amountsInWithFees_postPFee - amountsOutOfBin. Delta is constructed from the original
    amount (exactInput) or accumulated amountsUnspecified (exactOutput). The mapping
    from per-bin operations to the final delta should be exact. Verify with multi-bin
    swaps at edge prices.

- id: BPM-F02
  tier: 1
  type: property
  description: >
    Composition fee double-charge in _updateBin: when minting to the active bin
    with imbalanced token ratio, the code (1) computes feesAmount from the
    imbalanced portion, then (2) RECALCULATES shares using the fee-adjusted
    binLiquidity. The user's effective amountsIn is reduced by feesAmount, AND
    their shares are recalculated against inflated bin reserves (reserves + fees).
    This compounds: the user pays the fee via reduced input AND gets fewer shares
    because the denominator grew by the fee amount.
  attack_scenario: >
    1. Active bin has 100 tokenX, 100 tokenY, 1000 shares.
    2. User mints with 50 tokenX only (0 tokenY) — highly imbalanced.
    3. getSharesAndEffectiveAmountsIn computes initial shares based on liquidity ratio.
    4. getCompositionFeesAmount computes fee on the "implicitly swapped" Y portion.
    5. L460: userLiquidity = (amountsIn - feesAmount).getLiquidity(price) — reduced numerator.
    6. L462: binLiquidity = (binReserves + feesAmount - pFee).getLiquidity(price) — increased denominator.
    7. L463: shares = userLiquidity * supply / binLiquidity — double reduction.
    8. Existing LPs earn from BOTH the composition fee AND the reduced share issuance.
    9. New minter is over-penalized relative to a fair composition fee.
  impact: "Systematic overcharge on imbalanced mints to active bin. New depositors receive fewer shares than warranted."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After mint to active bin with composition fee:
    // Verify user's share value post-mint >= (amountsIn - expectedFee) * totalShares_pre / totalReserves_pre
    // Where expectedFee = compositionFee on the swapped portion only
    if (ghost_compositionFeeCharged) {
        uint256 shareValue = ghost_mintSharesReceived * ghost_postMintBinLiquidity / ghost_postMintTotalShares;
        uint256 inputValue = ghost_mintInputLiquidity;
        uint256 fairFee = ghost_compositionFeeValue;
        // User's share value should approximate inputValue - fairFee (with rounding tolerance)
        uint256 expectedMinValue = inputValue > fairFee ? inputValue - fairFee : 0;
        // Allow 1% tolerance for rounding
        uint256 tolerance = expectedMinValue / 100 + 1;
        t(shareValue + tolerance >= expectedMinValue, "BPM-F02: composition fee overcharged — double deduction");
    }
  ghost_vars:
    - bool internal ghost_compositionFeeCharged;
    - uint256 internal ghost_mintSharesReceived;
    - uint256 internal ghost_postMintBinLiquidity;
    - uint256 internal ghost_postMintTotalShares;
    - uint256 internal ghost_mintInputLiquidity;
    - uint256 internal ghost_compositionFeeValue;
  validated: false
  priority: high
  confidence: 55
  notes: >
    This is the most complex accounting in BinPool. At L458-463, when feesAmount != 0,
    shares are recalculated with BOTH a reduced numerator (userLiquidity uses amountsIn - feesAmount)
    and an inflated denominator (binLiquidity uses binReserves + feesAmount - pFee). If the
    composition fee was already "priced in" by getCompositionFeesAmount's computation of
    receivedAmountX/Y, then the second adjustment at L463 may be double-counting. Need
    mathematical proof that the two adjustments are complementary, not multiplicative.

- id: BPM-F03
