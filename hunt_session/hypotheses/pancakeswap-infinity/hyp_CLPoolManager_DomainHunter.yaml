      try poolManager.initialize(newPoolKey, sqrtPriceX96) returns (int24) {
        // If we get here during pause, the invariant is violated
        t(false, "CLPM-D05: initialize succeeded while system is paused");
      } catch {
        // Expected behavior if pause should block initialize
      }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: >
    This is a design question more than a definitive bug. The argument for allowing
    initialize during pause is that initialization doesn't move funds. The argument
    against is that a compromised hook could be deployed via initialize during an
    emergency pause. Need to check if PancakeSwap considers this intentional.
    Symmetric pairs analyzed: modifyLiquidity(add/remove), swap/donate (both whenNotPaused),
    initialize (no check). The add/remove asymmetry is CORRECT (users can exit during pause).

# ============================================================================
# CLPM-D06: Protocol fee accumulation in unchecked block - potential overflow
# ============================================================================
- id: CLPM-D06
  tier: 2
  type: property
  description: >
    In CLPoolManager.swap() lines 203-206, protocolFeesAccrued is updated inside
    an unchecked block: `protocolFeesAccrued[currency] += state.feeAmountToProtocol`.
    The comment says "cannot overflow due to limits on the size of protocolFee and
    params.amountSpecified". protocolFeesAccrued is a mapping(Currency => uint256).
    Over time, if protocolFeesAccrued is never collected (or collected infrequently),
    this value accumulates across ALL swaps. For a high-volume pool, the cumulative
    protocol fees could theoretically approach uint256 max over the pool's lifetime.
    However, since protocol fee per swap is limited to 0.4% of amountSpecified
    (which is int256, max ~1.15e77), each swap adds at most ~4.6e74. To overflow
    uint256 (~1.16e77), you'd need ~252 swaps at maximum size - extremely unlikely
    but the unchecked block removes the safety net.
  attack_scenario: >
    Extremely unlikely in practice. Would require ~252 maximum-size swaps without
    any protocol fee collection. More of a theoretical concern. The real risk is
    if a malicious protocolFeeController never collects, allowing accumulation.
    But even then, 252 swaps of type(int256).max each is unrealistic.
  impact: "Info - theoretical overflow in protocol fee accumulation, practically unreachable"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Track protocolFeesAccrued growth and verify no overflow
    uint256 feesBefore = poolManager.protocolFeesAccrued(currency0);
    // Execute swap
    poolManager.swap(key, swapParams, "");
    uint256 feesAfter = poolManager.protocolFeesAccrued(currency0);
    // Fees should only increase (no overflow wrapping)
    gte(feesAfter, feesBefore, "CLPM-D06: protocolFeesAccrued decreased (overflow)");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    The comment in the code addresses this: "cannot overflow due to limits on the
    size of protocolFee and params.amountSpecified". This is correct for any
    reasonable number of swaps. Marking as tier 2 / low priority. Would need
    formal verification (Halmos) to prove the upper bound definitively.

# ============================================================================
# CLPM-D07: beforeSwap hook can modify amountSpecified to 0, causing early return
#           with no swap but delta still settled
# ============================================================================
- id: CLPM-D07
  tier: 1
  type: property
  description: >
    In CLHooks.beforeSwap(), the hook can return a hookDeltaSpecified that modifies
    amountToSwap. At line 157: `amountToSwap += hookDeltaSpecified`. If the hook
    returns hookDeltaSpecified = -amountToSwap (exactly canceling the original),
    amountToSwap becomes 0. Back in CLPool.swap() line 247:
    `if (params.amountSpecified == 0) return (ZERO_DELTA, state)` - early return.
    BUT this check uses params.amountSpecified (the MODIFIED value from beforeSwap),
    not the original. So the swap returns ZERO_DELTA, but the hookDelta from
    beforeSwap is still processed in afterSwap. The hook has effectively consumed
    the user's input without executing any swap.
  attack_scenario: >
    1. User initiates swap with amountSpecified = -100e18 (exact input, 100 tokens).
    2. Malicious hook's beforeSwap returns hookDeltaSpecified = +100e18.
    3. amountToSwap = -100e18 + 100e18 = 0.
    4. CLPool.swap returns early with ZERO_DELTA.
    5. In CLPoolManager.swap, afterSwap is called. The beforeSwapDelta is processed.
    6. hookDelta includes the +100e18 specified delta.
    7. Via accountAppDeltaWithHookDelta, the user is charged for the hook's delta
       but receives zero output from the swap.
    8. The hook effectively stole the user's 100 tokens.
    NOTE: This requires a malicious hook, which users choose to interact with.
    But if the hook is upgradeable or its behavior is not transparent, users may
    not realize the risk. The check at line 158 prevents TYPE change
    (exact input becoming exact output) but not reduction to zero.
  impact: "Medium - malicious hook can consume user's swap input without executing swap. Requires user to use a pool with malicious hook."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a swap, verify that if delta is non-zero, the swap actually executed
    // (price moved or output was generated)
    (uint160 sqrtPriceBefore,,,) = poolManager.getSlot0(poolId);
    BalanceDelta delta = poolManager.swap(key, params, hookData);
    (uint160 sqrtPriceAfter,,,) = poolManager.getSlot0(poolId);
    int128 amount0 = delta.amount0();
    int128 amount1 = delta.amount1();
    // If user paid something (amount0 > 0 or amount1 > 0), price should have moved
    // OR output should be non-zero
    bool userPaid = (amount0 > 0 || amount1 > 0);
    bool userReceived = (amount0 < 0 || amount1 < 0);
    bool priceMoved = (sqrtPriceBefore != sqrtPriceAfter);
    t(!userPaid || userReceived || priceMoved, "CLPM-D07: user paid but got nothing and price unchanged");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    The key insight is that beforeSwap can reduce amountSpecified to 0 (but not flip sign,
    line 158 prevents that). A 0 amountSpecified causes early return with ZERO_DELTA from
    the pool, but the hook's delta is still settled. This is by design for hooks that want
    to handle swaps differently (e.g., a TWAMM hook). However, it creates a trust assumption
    that users must understand: the hook can redirect their entire swap input.
    The original CLPoolManager.swap checks amountSpecified != 0 at line 168, but this is
    the ORIGINAL amount, before hook modification. The pool.swap check at line 247 uses the
    MODIFIED amount. So the flow is: (1) original != 0 check passes, (2) hook modifies to 0,
    (3) pool returns early with zero, (4) hook delta still applies.

# ============================================================================
# CLPM-D08: donate() has no hook return delta, unlike swap/modifyLiquidity
# ============================================================================
- id: CLPM-D08
  tier: 2
  type: property
  description: >
    Constraint inference across functions: swap() and modifyLiquidity() both call
    vault.accountAppDeltaWithHookDelta() which handles hook return deltas.
    donate() calls vault.accountAppBalanceDelta() directly (line 229), with NO
    hook delta handling. This means donate() hooks (beforeDonate/afterDonate)
    cannot return deltas to modify the caller's obligation.
    Additionally, donate() settles delta to msg.sender directly, not through the
    hook delta path. This is an intentional simplification but creates an asymmetry:
    a hook that wants to subsidize donations or modify donation amounts cannot do so
    through the standard return delta mechanism.
  attack_scenario: >
    Limited direct attack. The asymmetry means hooks have less control over donate
    operations than over swaps or liquidity modifications. A hook designed to
    redistribute or modify donations cannot use the return delta mechanism.
    However, a hook could still revert in beforeDonate to block unwanted donations.
    The risk is more about unexpected behavior for hook developers who assume
    consistent delta-return capabilities across all operations.
  impact: "Info - design asymmetry, donate hooks cannot return deltas unlike swap/modifyLiquidity hooks"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that donate settles to msg.sender directly (not through hook delta path)
    // This is more of a documentation/design invariant than a fuzz target
    // The concrete test: after donate, the hook's balance should be unchanged
    // (donate delta goes entirely to the caller, not split with hook)
    uint256 hookBalance0Before = vault.balanceOf(address(hook), currency0);
    poolManager.donate(key, amount0, amount1, "");
    uint256 hookBalance0After = vault.balanceOf(address(hook), currency0);
    eq(hookBalance0Before, hookBalance0After, "CLPM-D08: donate affected hook balance");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 80
  notes: >
    This is a design observation from constraint inference. All three external
    state-changing functions (swap, modifyLiquidity, donate) call hooks but only
    swap and modifyLiquidity support hook return deltas. donate is the outlier.
    Confirmed by comparing lines 227-229 (donate) vs 224-228 (swap) and 170-174
    (modifyLiquidity).

# ============================================================================
# CLPM-D09: Active liquidity invariant across tick crossings
# ============================================================================
- id: CLPM-D09
  tier: 1
  type: property
  description: >
    DEX-INV-010 adapted for PancakeSwap: pool.liquidity must equal the sum of
    liquidityNet values for all initialized ticks from MIN_TICK up to and including
    the current tick. After any swap that crosses ticks, the liquidity must be
    updated correctly by adding/subtracting liquidityNet at each crossed tick.
    This is the fundamental invariant of concentrated liquidity pools.
  attack_scenario: >
    If the liquidity tracking diverges from the actual sum of position liquidities
    in the active range, swaps will use the wrong liquidity for price calculation.
    This means either: (1) too much output for a given input (pool drained), or
    (2) too little output (LPs extract value from swappers). The swap loop at
    CLPool.sol line 318-337 handles tick crossing. If state.liquidity is not
    updated correctly after crossing, all subsequent swap steps in the same
    transaction use wrong liquidity. Critical for multi-tick swaps.
  impact: "Critical - incorrect liquidity after tick crossing means wrong price calculation, potential pool drain"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // After any swap, verify that pool.liquidity matches the sum of liquidityNet
    // for all initialized ticks <= current tick
    (uint160 sqrtPrice, int24 currentTick,,) = poolManager.getSlot0(poolId);
    uint128 reportedLiquidity = poolManager.getLiquidity(poolId);
    // Calculate expected liquidity by traversing all initialized ticks up to currentTick
    // (This requires iterating the tick bitmap - expensive but correct)
    int128 cumulativeLiquidityNet = 0;
    // Traverse from MIN_TICK to currentTick, summing liquidityNet at each initialized tick
    // ... bitmap traversal ...
    uint128 expectedLiquidity = uint128(int128(cumulativeLiquidityNet));
    eq(uint256(reportedLiquidity), uint256(expectedLiquidity),
       "CLPM-D09: active liquidity != sum of liquidityNet up to current tick");
  ghost_vars:
  - int128 internal ghost_cumulativeLiquidityNet;
  validated: false
  priority: critical
  confidence: 85
  notes: >
    This is the most fundamental invariant of any concentrated liquidity AMM.
    The swap loop at CLPool.sol lines 318-337 handles tick crossing. Key line:
    state.liquidity = state.liquidity.addDelta(liquidityNet) (line 332).
    For zeroForOne, liquidityNet is negated (line 329). This matches Uniswap v4.
    The invariant should be fuzzed with multi-tick swaps across many initialized
    ticks to catch off-by-one errors in tick crossing logic.

