#           have different pause behavior
# ============================================================================
- id: CLPM-D05
  tier: 2
  type: property
  description: >
    Symmetric inspection reveals an asymmetry in pause behavior:
    - modifyLiquidity: blocks ADDING liquidity when paused (line 148), but
      ALLOWS removing liquidity when paused (correct - users should be able to exit)
    - swap: uses whenNotPaused modifier (line 165) - completely blocked when paused
    - donate: uses whenNotPaused modifier (line 182) - completely blocked when paused
    - initialize: NO pause check at all - can initialize new pools when paused

    The asymmetry of interest: initialize has no pause check. If the system is
    paused due to a discovered vulnerability, an attacker can still initialize
    new pools. If the vulnerability is in the initialization path itself, pausing
    provides no protection.
  attack_scenario: >
    1. A vulnerability is discovered in CLPoolManager (e.g., in hook validation).
    2. Owner pauses the system to prevent exploitation.
    3. Attacker can still call initialize() because it has no pause check.
    4. If the vulnerability is in the initialize path or in hook deployment,
       the attacker can still exploit it despite the pause.
    5. For the modifyLiquidity asymmetry: when paused, users CAN remove liquidity
       (good), but cannot add. This is correct behavior for emergency situations.
       The initialize gap is the real concern.
  impact: "Low - initialize callable during pause, limited direct impact but reduces pause effectiveness"
  impact_rating: Low
  likelihood: Low
  severity_final: null
