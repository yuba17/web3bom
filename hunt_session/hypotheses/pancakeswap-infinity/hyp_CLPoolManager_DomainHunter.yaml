  reason: >
    The preemptive tick decrement for zeroForOne swaps (CLPool.sol line 336:
    `state.tick = zeroForOne ? step.tickNext - 1 : step.tickNext`) is NOT a bug.
    This is the standard Uniswap v3/v4 pattern. When price moves left (zeroForOne),
    reaching the exact price of a tick boundary means the current tick should be
    one below that boundary (since tick represents the range [tick, tick+1)).
    The comment at lines 314-317 explains this correctly. This is critical for
