# ============================================================================
# CLPM-D11: UnsafeMath.simpleMulDiv truncation in feeGrowthGlobal update
# ============================================================================
- id: CLPM-D11
  tier: 1
  type: property
  description: >
    In CLPool.swap() line 309-310 and CLPool.donate() line 458, feeGrowthGlobal
    is updated using UnsafeMath.simpleMulDiv(feeAmount, Q128, liquidity).
    UnsafeMath.simpleMulDiv uses assembly `div(mul(a, b), c)` which SILENTLY
    TRUNCATES on overflow of mul(a, b). This is a critical difference from
    FullMath.mulDiv which handles 512-bit intermediates correctly.

    The overflow happens when: feeAmount * Q128 > 2^256.
    Q128 = 2^128, so feeAmount > 2^128 causes overflow.

    Is feeAmount > 2^128 possible? feeAmount per step is bounded by the swap
    input for that step. For an exact input swap with amountSpecified close to
    type(int256).max, and a 100% fee, feeAmount for a single step could be
    close to 2^255. This ABSOLUTELY overflows when multiplied by Q128.

    However, with LOW liquidity, the swap step might not consume that much.
    The critical path: large exactInput swap + high fee + low liquidity in one
    tick range.
  attack_scenario: >
    1. Pool has tickSpacing=1, a narrow position with liquidity = small value.
    2. Attacker submits exact input swap with very large amountSpecified.
    3. In a single swap step, amountIn could be large (up to the full range of
       the tick). feeAmount is proportional to amountIn.
    4. If feeAmount * Q128 > 2^256, simpleMulDiv silently truncates.
    5. feeGrowthGlobal gets a WRONG (smaller than correct) increment.
    6. LPs receive LESS fees than they're owed. The "missing" fees are permanently
       lost (not tracked anywhere).
    7. With FullMath.mulDiv this wouldn't happen - it handles 512-bit intermediates.
    8. NOTE: Uniswap v4 uses the same UnsafeMath pattern. This may be intentional
       with the reasoning that the truncation amount is dust relative to the actual
       value. But with extreme parameters, the truncation could be significant.
  impact: "Medium - fee underaccounting due to silent overflow truncation in feeGrowthGlobal, LPs lose fees"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Compare UnsafeMath.simpleMulDiv result with FullMath.mulDiv for same inputs
    // If they differ, simpleMulDiv has overflowed and truncated
    uint256 feeAmount = ghost_lastFeeAmount;
    uint128 liquidity = ghost_lastLiquidity;
    if (feeAmount > 0 && liquidity > 0) {
      uint256 unsafeResult = UnsafeMath.simpleMulDiv(feeAmount, FixedPoint128.Q128, liquidity);
      uint256 safeResult = FullMath.mulDiv(feeAmount, FixedPoint128.Q128, liquidity);
      eq(unsafeResult, safeResult,
         "CLPM-D11: simpleMulDiv truncated vs FullMath.mulDiv - fee underaccounting");
    }
  ghost_vars:
  - uint256 internal ghost_lastFeeAmount;
  - uint128 internal ghost_lastLiquidity;
  validated: false
  priority: high
  confidence: 75
  notes: >
    The code comments at CLPool.State struct (lines 52-54) mention that
    feeGrowthGlobal "can be artificially inflated" but doesn't mention the
    truncation issue. UnsafeMath.simpleMulDiv is intentionally unsafe for gas
    savings. The question is whether the inputs are bounded tightly enough that
    overflow never happens in practice. With maxFee = 100% and large swaps,
    feeAmount can be very large. A Halmos proof would definitively answer whether
    overflow is reachable given the input constraints.

