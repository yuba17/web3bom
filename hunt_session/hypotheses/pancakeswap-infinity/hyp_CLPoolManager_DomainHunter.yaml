# ============================================================================
# CLPM-D01: Hook-as-msg.sender bypasses its own hook callbacks
# ============================================================================
# KEY FINDING: Hooks.shouldCall() returns false when msg.sender == hook address.
# This means a hook contract calling CLPoolManager.swap/modifyLiquidity/donate
# directly SKIPS its own before/after callbacks. This is a PancakeSwap-specific
# design choice (Uniswap v4 does NOT have this bypass). A malicious or buggy hook
# that calls pool operations on itself can operate without its own safety checks.
- id: CLPM-D01
  tier: 1
  type: property
  description: >
    Hook contract acting as msg.sender bypasses all its own hook callbacks.
    Hooks.shouldCall() at line 72 of Hooks.sol returns false when
    address(hook) == msg.sender. If a hook calls CLPoolManager.swap() directly,
    beforeSwap/afterSwap are NEVER invoked for that hook. A hook that relies on
    its own callbacks for invariant enforcement (e.g., TWAP check in beforeSwap,
    fee accounting in afterSwap) can be completely bypassed when it is the caller.
    This is a PancakeSwap-specific divergence from Uniswap v4.
  attack_scenario: >
    1. Hook contract H is designed with a beforeSwap that enforces a max price
       impact check and an afterSwap that updates an internal accounting variable.
    2. H also has a function that calls CLPoolManager.swap() directly (e.g., for
       rebalancing, compounding, or arbitrage).
    3. When H calls swap, shouldCall returns false for H's own hooks.
    4. The beforeSwap price impact check is SKIPPED entirely.
    5. The afterSwap accounting update is SKIPPED entirely.
    6. H's internal state becomes inconsistent. Attacker triggers H's rebalance
       function with carefully crafted parameters to move price without limit checks,
       then profits from the price distortion on the other side.
    Impact: Complete bypass of hook-enforced safety invariants when hook is the caller.
    For hooks that manage user funds (vault-like hooks), this can mean direct fund loss.
  impact: "High - hook safety invariants bypassed, potential fund extraction via price manipulation through hook's own call path"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Ghost tracking: record if hook callbacks were actually invoked
    // This invariant checks that ANY swap that changes price also triggered hook callbacks
    // Test: deploy a hook that calls swap() on itself and verify callbacks are skipped
    uint160 priceBefore = poolManager.getSlot0(poolId).sqrtPriceX96;
    // Trigger swap via hook contract (msg.sender = hook)
    hookContract.executeSwapDirectly(key, swapParams, "");
    uint160 priceAfter = poolManager.getSlot0(poolId).sqrtPriceX96;
    // If price changed, hook callbacks SHOULD have been called
    // but they weren't because shouldCall returned false
    t(priceBefore == priceAfter || ghost_hookBeforeSwapCalled, "CLPM-D01: swap changed price without hook callback");
  ghost_vars:
  - bool internal ghost_hookBeforeSwapCalled;
  - bool internal ghost_hookAfterSwapCalled;
  validated: false
  priority: high
  confidence: 85
  notes: >
    Confirmed by reading Hooks.sol line 72: `return hasOffsetEnabled(parameters, offset) && address(hook) != msg.sender`.
    This is intentional design to prevent infinite recursion, but creates a class of
    vulnerabilities for any hook that assumes its callbacks are always called. Uniswap v4
    does not have this same bypass. Need to check if PancakeSwap documentation warns
    hook developers about this. If not, it's a systemic risk for the entire hook ecosystem.

# ============================================================================
# CLPM-D02: Donate to self-inflate feeGrowthGlobal atomically
# ============================================================================
# The CLPool.State struct comment explicitly warns about this at line 52-54:
# "For pools with a single liquidity position, actors can donate to themselves
# to freely inflate feeGrowthGlobal. Atomically donating and collecting fees
# in the same lockAcquired callback may make the inflated value more extreme."
- id: CLPM-D02
  tier: 1
  type: property
  description: >
    A sole LP in a pool can donate tokens to themselves via donate(), then
    immediately collect the donated amount as fees via modifyLiquidity (removing
    and re-adding liquidity to collect accrued fees). The feeGrowthGlobal value
    is inflated but the LP recovers the donated tokens minus rounding.
    If ANY external contract reads feeGrowthGlobal as a proxy for pool volume,
    TVL quality, or reward distribution, the inflated value causes incorrect
    calculations. This is acknowledged in code comments but NOT mitigated.
  attack_scenario: >
    1. Attacker is the sole LP in a pool (or has overwhelming majority of liquidity
       in the active tick range).
    2. Within a single vault.lock() callback, attacker:
       a) Calls donate(key, 1e18, 0) - pays 1e18 token0 to the pool
       b) feeGrowthGlobal0X128 increases by (1e18 * Q128) / liquidity
       c) Calls modifyLiquidity with liquidityDelta = -currentLiquidity (remove all)
       d) Collects feesOwed0 = ~1e18 (minus dust from rounding)
       e) Calls modifyLiquidity with liquidityDelta = +currentLiquidity (re-add)
    3. Net cost: ~0 (rounding dust only). Net effect: feeGrowthGlobal0X128 is
       permanently inflated by an arbitrary amount.
    4. Repeat N times in one transaction to inflate feeGrowthGlobal0X128 to any value.
    5. External reward distributor, farming contract, or UI that uses feeGrowthGlobal
       as input will distribute incorrect rewards or display false volume metrics.
  impact: "Medium - feeGrowthGlobal inflation is free for sole LPs, breaks external integrations that trust this value"
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Track net token balance of attacker across donate + collect cycle
    uint256 attackerToken0Before = token0.balanceOf(attacker);
    uint256 feeGrowthBefore = poolManager.getFeeGrowthGlobals(poolId);
    // Attacker executes: donate -> remove liquidity (collect fees) -> re-add liquidity
    // all within one lock callback
    attackerContract.executeDonateAndCollectCycle(key, donateAmount);
    uint256 attackerToken0After = token0.balanceOf(attacker);
    uint256 feeGrowthAfter = poolManager.getFeeGrowthGlobals(poolId);
    // Invariant: feeGrowthGlobal should not increase without real external swap volume
    // If attacker's balance is roughly unchanged but feeGrowth increased massively, it's inflation
    uint256 balanceDelta = attackerToken0Before > attackerToken0After ?
      attackerToken0Before - attackerToken0After : 0;
    uint256 feeGrowthDelta = feeGrowthAfter - feeGrowthBefore;
    // The cost to inflate should be proportional to the inflation, not dust
    t(feeGrowthDelta == 0 || balanceDelta > donateAmount / 2, "CLPM-D02: feeGrowthGlobal inflated for free");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 90
  notes: >
    Code explicitly acknowledges this in CLPool.sol line 52-54. The question is whether
    any PancakeSwap ecosystem contract (farming, gauge, or third-party) reads
    feeGrowthGlobal to make economic decisions. If so, that's the real vulnerability.
    The donate function itself works correctly - the issue is downstream consumers.

# ============================================================================
# CLPM-D03: Tick boundary precision loss (KyberSwap-style, $48M class)
# ============================================================================
# KyberSwap's $48M exploit was caused by precision loss at tick boundaries in
# concentrated liquidity math. The critical question: does PancakeSwap's implementation
# of getTickAtSqrtRatio and getSqrtRatioAtTick maintain the round-trip invariant
# sqrtPrice -> tick -> sqrtPrice' where sqrtPrice' <= sqrtPrice?
- id: CLPM-D03
  tier: 1
  type: property
  description: >
    Tick-to-sqrtPrice and sqrtPrice-to-tick conversions must be monotonic and
    consistent. getTickAtSqrtRatio returns the GREATEST tick where
    getSqrtRatioAtTick(tick) <= sqrtPriceX96. If this invariant breaks for any
    sqrtPriceX96 value (especially at tick boundaries where sqrtPrice exactly equals
    getSqrtRatioAtTick(N)), the swap loop can miscalculate which liquidity ranges
    are active, leading to the KyberSwap-class vulnerability where liquidity is
    double-counted or skipped.
  attack_scenario: >
    1. Attacker crafts a swap that lands the price exactly at a tick boundary
       sqrtPriceX96 = getSqrtRatioAtTick(tickN).
    2. If getTickAtSqrtRatio(sqrtPriceX96) returns tickN instead of tickN-1
       (for zeroForOne), the swap loop's tick state is off by one.
    3. In the next swap step, the wrong liquidity is used because the current
       tick is misclassified relative to initialized tick boundaries.
    4. With carefully positioned liquidity, the attacker extracts more output
       tokens than mathematically possible, draining the pool.
    5. In PancakeSwap's swap loop (CLPool.sol line 336): for zeroForOne swaps
       reaching a tick boundary, tick is set to tickNext - 1. This preemptive
       decrement is critical. If it interacts incorrectly with getTickAtSqrtRatio
       on the boundary, the state becomes inconsistent.
  impact: "Critical - KyberSwap-class exploit, potential complete pool drain via tick boundary precision error"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // For every tick in range, verify round-trip consistency
    // tick -> sqrtPrice -> tick' must satisfy tick' == tick
    int24 tick = ghost_randomTick;
    uint160 sqrtPrice = TickMath.getSqrtRatioAtTick(tick);
    int24 tickBack = TickMath.getTickAtSqrtRatio(sqrtPrice);
    eq(int256(tick), int256(tickBack), "CLPM-D03a: tick round-trip inconsistency");

    // Also verify: for sqrtPrice at boundary, zeroForOne swap sets tick = boundary - 1
    // This is the KyberSwap-critical check
    uint160 boundaryPrice = TickMath.getSqrtRatioAtTick(tick);
    int24 expectedTick = tick; // getTickAtSqrtRatio returns greatest tick <= price
    int24 actualTick = TickMath.getTickAtSqrtRatio(boundaryPrice);
    eq(int256(expectedTick), int256(actualTick), "CLPM-D03b: boundary tick mismatch");
  ghost_vars:
  - int24 internal ghost_randomTick;
  validated: false
  priority: critical
  confidence: 70
  notes: >
    PancakeSwap's TickMath appears to be a direct copy of Uniswap v4's implementation.
    Uniswap v4 fixed the tick boundary issues that affected earlier versions. However,
    KyberSwap's bug was in their CUSTOM modification to the tick math, not in the
    vanilla Uniswap code. Need to diff PancakeSwap's TickMath against Uniswap v4's
    to identify any deviations. The swap loop's preemptive decrement at line 336
    (state.tick = zeroForOne ? step.tickNext - 1 : step.tickNext) follows the same
    pattern as Uniswap v4, which is correct. Confidence is 70% because the code
    LOOKS correct but the $48M precedent demands thorough fuzzing.

# ============================================================================
# CLPM-D04: Liquidity = 1 wei extreme edge case in fee calculation
# ============================================================================
- id: CLPM-D04
  tier: 1
  type: property
  description: >
    When pool liquidity is exactly 1 wei, the feeGrowthGlobal update uses
    UnsafeMath.simpleMulDiv(feeAmount, Q128, 1) which is just feeAmount * Q128.
    For any non-trivial feeAmount, this value can overflow uint256 silently
    because simpleMulDiv uses assembly `div(mul(a, b), c)` which wraps on
    overflow. The feeGrowthGlobal would be set to a truncated (wrong) value,
    causing LPs to receive incorrect fees. Similarly in donate(), the same
    UnsafeMath.simpleMulDiv is used with state.liquidity as denominator.
  attack_scenario: >
    1. Attacker creates a position with liquidity = 1 at a very narrow tick range.
    2. Attacker executes a swap with a large enough amount that feeAmount > 0.
    3. feeGrowthGlobal update: simpleMulDiv(feeAmount, Q128, 1) = feeAmount * Q128.
       If feeAmount >= 2^128, the mul overflows in assembly, producing a truncated value.
    4. Actually, feeAmount is capped by the swap input amount which is int256,
       so feeAmount < 2^255. With Q128 = 2^128, the product is < 2^383 which
       DOES overflow uint256 (max 2^256). The result is silently truncated.
    5. feeGrowthGlobal is now wrong. Future fee calculations for this and other
       positions in the same tick range will be incorrect.
    6. Note: This also applies to donate() at CLPool.sol line 458.
  impact: "High - silent overflow in fee accumulation when liquidity is extremely low, leading to incorrect fee distribution"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Test with liquidity = 1 and a swap that generates fees
    // Verify that feeGrowthGlobal is calculated correctly (no overflow truncation)
    uint128 liquidity = poolManager.getLiquidity(poolId);
    if (liquidity > 0 && liquidity <= 10) {
      // Get feeGrowthGlobals before swap
      (uint256 fg0Before, uint256 fg1Before) = poolManager.getFeeGrowthGlobals(poolId);
      // Execute a swap
      // ... swap execution ...
      (uint256 fg0After, uint256 fg1After) = poolManager.getFeeGrowthGlobals(poolId);
      // The feeGrowthGlobal delta should be feeAmount * Q128 / liquidity
      // If this overflowed, fg0After might be LESS than fg0Before (wrapping)
      // For liquidity=1, any feeAmount > 2^128 causes overflow
      // feeAmount is bounded by swap size, so check if swap was large enough
      t(fg0After >= fg0Before, "CLPM-D04: feeGrowthGlobal decreased (overflow)");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    UnsafeMath.simpleMulDiv uses `div(mul(a, b), denominator)` in assembly.
    The `mul(a, b)` wraps silently if a*b > 2^256. With liquidity=1 and Q128=2^128,
    feeAmount * 2^128 overflows when feeAmount > 2^128. In practice, a single swap's
    feeAmount is limited by the swap input (max int256), so feeAmount < 2^255.
    feeAmount * Q128 = up to 2^383 which DEFINITELY overflows. The question is
    whether liquidity=1 is practically achievable given the position math. With
    tickSpacing=1, a single-tick position can have liquidity=1. This is a real
    edge case. Uniswap v4 has the same code pattern - check if they have a
    minimum liquidity requirement.

