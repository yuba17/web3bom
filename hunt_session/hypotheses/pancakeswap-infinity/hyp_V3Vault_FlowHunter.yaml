state_machine:
  states:
    - EMPTY           # No position in vault for this tokenId
    - COLLATERAL_ONLY # Position deposited, debtShares == 0
    - BORROWING       # Position deposited, debtShares > 0, healthy
    - UNDERWATER      # Position deposited, debtShares > 0, collateralValue < debt (not yet liquidatable due to buffer)
    - LIQUIDATABLE    # Position deposited, collateralValue < debt (past buffer)
    - LIQUIDATED      # Position liquidated, loan cleaned up, but token still owned by vault
    - STAKED          # Position staked in gauge (NFT not held by vault directly)
    - TRANSFORM_MODE  # transformedTokenId != 0, mid-transform callback
  transitions:
    - from: EMPTY
      to: COLLATERAL_ONLY
      via: "create() -> onERC721Received() with oldTokenId==0"
      guard: "tokenOwner[tokenId] == address(0)"
    - from: COLLATERAL_ONLY
      to: BORROWING
      via: "borrow()"
      guard: "debt >= minLoanSize, healthy, within limits"
    - from: BORROWING
      to: COLLATERAL_ONLY
      via: "repay() with full amount"
      guard: "shares >= currentShares"
    - from: BORROWING
      to: UNDERWATER
      via: "oracle price drop (external)"
      guard: "none -- automatic by price"
    - from: UNDERWATER
      to: LIQUIDATABLE
      via: "further price drop"
      guard: "collateralValue < debt (no buffer)"
    - from: LIQUIDATABLE
      to: LIQUIDATED
      via: "liquidate()"
      guard: "!isHealthy"
    - from: LIQUIDATED
      to: EMPTY
      via: "remove()"
      guard: "debtShares == 0, owner == msg.sender"
    - from: COLLATERAL_ONLY
      to: EMPTY
      via: "remove()"
      guard: "debtShares == 0"
    - from: COLLATERAL_ONLY
      to: STAKED
      via: "stakePosition()"
      guard: "gaugeManager set, tokenOwner == msg.sender"
    - from: BORROWING
      to: STAKED
      via: "stakePosition()"
      guard: "loan must remain healthy post-stake (fees excluded)"
    - from: STAKED
      to: COLLATERAL_ONLY
      via: "unstakePosition()"
      guard: "tokenOwner == msg.sender OR transformedTokenId == tokenId"
    - from: ANY_WITH_TOKEN
      to: TRANSFORM_MODE
      via: "_transform()"
      guard: "transformedTokenId == 0, transformer in allowList, owner or approved"
    - from: TRANSFORM_MODE
      to: BORROWING
      via: "transformer.call -> borrow() callback"
      guard: "isTransformMode && transformerAllowList[msg.sender]"
  anomalies:
    - type: illegal_transition
      from: TRANSFORM_MODE
      to: ANY
      via: "transformer.call(data) -- arbitrary external call"
      description: >
        During transform, the vault makes transformer.call(data) with no reentrancy guard
        on other functions besides borrow(). The transformedTokenId sentinel blocks
        liquidate(), decreaseLiquidityAndCollect(), and new transforms, but does NOT
        block deposit/withdraw/mint/redeem ERC4626 operations. A malicious transformer
        could call deposit() or withdraw() to manipulate exchange rates mid-transform.
    - type: stuck_state
      state: LIQUIDATED
      description: >
        After liquidation, if the NFT position has zero liquidity and zero fees,
        the owner must still call remove() to get the empty NFT back. The position
        is stuck in the vault with no economic value but consuming gas for enumeration.
    - type: race_condition
      from: BORROWING
      to: LIQUIDATABLE
      description: >
        Between _unstakeIfNeeded and _requireLoanIsHealthy in decreaseLiquidityAndCollect,
        the position is unstaked (fees realized), collateral withdrawn, then restaked.
        If oracle price changes within the same block, the health check uses post-withdrawal
        collateral but the stake/unstake may have different fee accounting.

invariants:
- id: VV-F-01
  tier: 1
  type: property
  description: "Vault asset balance must always cover lender claims minus outstanding debt -- inflows >= outflows when accounting for debt"
  attack_scenario: >
    If this breaks, the vault is insolvent. An attacker could drain funds via
    a sequence of borrow+withdraw where the vault sends out more assets than it received.
    Specifically: if transform callback allows manipulating balanceOf(vault) via donation
    or if liquidation _sendPositionValue sends collateral tokens but _handleReserveLiquidation
    miscalculates the haircut, lenders lose funds.
  impact: "Total insolvency -- all lender deposits at risk"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    (uint256 debt, uint256 lent, uint256 balance, uint256 reserves,,) = vault.vaultInfo();
    uint256 totalOwed = lent;
    uint256 totalBacking = balance + debt;
    // The vault's balance + outstanding debt should always cover what lenders are owed
    // Allow tolerance for rounding: 1 wei per operation
    uint256 tolerance = ghost_numOps > 0 ? ghost_numOps : 1;
    gte(totalBacking + tolerance, totalOwed, "VV-F-01: vault insolvent -- backing < lent");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: >
    totalAssets() = balanceOf(vault) + debt. lent = convertToAssets(totalSupply).
    The difference is reserves. If reserves go negative, lenders are haircut.
    This is the fundamental solvency invariant for the vault.
  poc_sketch: ''
  call_stack: ''

