- id: VV-F-03
  tier: 1
  type: property
  description: "Deposit-withdraw roundtrip must never be profitable -- redeem(deposit(X)) <= X"
  attack_scenario: >
    If a user can deposit X assets and immediately withdraw more than X, they extract
    value from other lenders. This could happen if exchange rate rounding favors the
    depositor: _convertToShares rounds Down on deposit (fewer shares = less favorable)
    but _convertToAssets rounds Down on withdraw too. The key is that deposit gives
    shares = assets * Q96 / rate (Down), and withdraw gives assets = shares * rate / Q96 (Down).
    Roundtrip: assets_out = floor(floor(X * Q96 / rate) * rate / Q96) <= X. Safe by math.
    But if rate changes between deposit and withdraw (interest accrual in same block),
    and the rate was already updated this block, it wont change. Check atomic roundtrip.
  impact: "Lender value extraction -- share price manipulation"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    if (ghost_lastDepositAssets > 0 && ghost_lastDepositShares > 0) {
        (,,,,, uint256 lendRate) = vault.vaultInfo();
        // What we'd get back if we redeemed the shares we just got
        uint256 redeemAssets = ghost_lastDepositShares * lendRate / Q96;
        lte(redeemAssets, ghost_lastDepositAssets + 1, "VV-F-03: roundtrip profitable -- deposit then redeem gains assets");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: >
    Q96 = 2**96. The rounding directions in V3Vault are: deposit->shares rounds Down,
    withdraw->assets rounds Down. This should be safe for atomic roundtrip.
    Risk increases if exchange rate can be manipulated between deposit and withdraw.
  poc_sketch: ''
  call_stack: ''

- id: VV-F-04
  tier: 1
  type: property
  description: "debtSharesTotal must equal sum of all individual loan.debtShares"
  attack_scenario: >
    If debtSharesTotal drifts from the sum of individual loans, the vault's
    interest calculation and collateral limit checks become incorrect.
    In borrow(): debtSharesTotal += shares, loan.debtShares += shares.
    In repay(): debtSharesTotal -= shares, loan.debtShares -= shares.
    In liquidate(): debtSharesTotal -= debtShares (full loan shares).
    In onERC721Received (replacement): old loan zeroed, new loan gets same shares -- debtSharesTotal unchanged.
    If any path mismatches, the global accounting breaks.
  impact: "Interest miscalculation, potential bad debt creation or blocked liquidations"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 sumShares = 0;
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 20; i++) {
        (uint256 s) = vault.loans(ghost_allTokenIds[i]);
        sumShares += s;
    }
    eq(sumShares, vault.debtSharesTotal(), "VV-F-04: debtSharesTotal != sum of individual loan shares");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: >
    This is the core accounting invariant. _cleanupLoan deletes loans[tokenId]
    but debtSharesTotal is decremented in the caller (liquidate at line 806).
    In repay, both are decremented in _repay. Need to verify all paths match.
  poc_sketch: ''
  call_stack: ''

