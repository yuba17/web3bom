flash_loan_analysis:
  deposit:
    reads_manipulable_state: true  # totalSupply(), lendExchangeRateX96
    affects_fund_movement: true    # pulls assets, mints shares
    same_tx_read_consume: true     # no timelock
    post_action_verification: false # no post-deposit check besides limits
    reentrancy_guard: false        # no explicit guard
    flash_candidate: true
    notes: >
      Deposit reads totalSupply and exchange rate. Exchange rate is cached per block
      so cant be manipulated via repeated calls in same tx. But totalSupply changes
      with each deposit/mint. Multiple deposits in same tx would increase totalSupply,
      potentially hitting globalLendLimit. Not a direct flash loan vector.

  withdraw:
    reads_manipulable_state: true  # balanceOf(vault), exchange rate
    affects_fund_movement: true    # burns shares, sends assets
    same_tx_read_consume: true
    post_action_verification: false
    reentrancy_guard: false
    flash_candidate: true
    notes: >
      Withdraw checks balance >= assets. If vault balance was inflated via donation,
      more could be withdrawn. But shares are burned proportionally so the exchange
      rate controls the assets-per-share ratio. Donation would increase totalAssets
      which benefits all shareholders, not just the attacker.

  borrow:
    reads_manipulable_state: true  # oracle price, exchange rates
    affects_fund_movement: true    # sends borrowed assets
    same_tx_read_consume: true
    post_action_verification: true  # _requireLoanIsHealthy (unless transform mode)
    reentrancy_guard: false         # transformedTokenId sentinel partially guards
    flash_candidate: true
    notes: >
      HIGHEST RISK. Borrow reads oracle price for health check. If oracle uses
      spot price, flash loan can inflate collateral value. V3Oracle likely uses
      TWAP which is resistant. Transform mode skips health check during borrow
      but checks after transform completes. The gap between borrow and final check
      is the key attack window.

  liquidate:
    reads_manipulable_state: true  # oracle price, exchange rates
    affects_fund_movement: true    # pulls liquidator payment, sends collateral
    same_tx_read_consume: true
    post_action_verification: false
    reentrancy_guard: true          # transformedTokenId != 0 check blocks liquidation during transform
    flash_candidate: true
    notes: >
      Flash loan liquidation: borrow flash loan -> manipulate oracle down ->
      liquidate position at discount -> profit from penalty. Requires oracle manipulation.
      Self-liquidation: user with position + flash loan could force own liquidation
      if bonus > flash fee, extracting value from reserves via _handleReserveLiquidation.

  transform:
    reads_manipulable_state: true  # all state during callback
    affects_fund_movement: true    # transformer.call can do anything
    same_tx_read_consume: true
    post_action_verification: true  # custody check + health check after
    reentrancy_guard: true          # transformedTokenId sentinel
    flash_candidate: true
    notes: >
      Transform is the most complex flow. The transformer gets full control via
      arbitrary call(data). The vault trusts the transformer (allowlisted).
      But if a trusted transformer has a vulnerability, it becomes the vault's
      vulnerability. The transformer can borrow, manipulate state, and return.
      Post-transform checks: NFT custody (line 603-606) and health (line 621).
