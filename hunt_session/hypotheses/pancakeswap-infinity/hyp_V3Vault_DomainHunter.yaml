    eq(currentDebtSharesTotal, sumDebtShares, "VV-D-19: debtSharesTotal mismatch after transform");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "El replacement path en onERC721Received NO modifica debtSharesTotal directamente -- solo mueve shares entre loans y token configs. _cleanupLoan(old) sets loan to 0 and calls _updateAndCheckCollateral(old, oldShares, 0). _updateAndCheckCollateral(new, 0, debtShares). Neto: debtSharesTotal no cambia. Pero _cleanupLoan deletes loans[oldTokenId], lo cual podria causar ghost_allTokenIds to have stale entries."
  poc_sketch: ''
  call_stack: ''

- id: VV-D-20
  tier: 2
  type: property
  description: "Multicall reentrancy safety: V3Vault hereda Multicall de OZ, permitiendo batch calls. Verificar que Multicall no permite bypasear el reentrancy guard de transformedTokenId"
  attack_scenario: >
    V3Vault hereda Multicall, que permite llamar multiples funciones en una tx.
    Un atacante podria usar Multicall para: (1) llamar transform() que setea
    transformedTokenId, (2) en la misma batch, llamar borrow() con isTransformMode=true
    para un token diferente. PERO: borrow verifica tokenId == transformedTokenId,
    asi que solo funciona para el mismo token. Sin embargo, Multicall ejecuta
    delegatecall a si mismo, lo cual preserva msg.sender como el caller original.
    Si el caller es un transformer aprobado, podria borrowear via Multicall
    durante transform mode.
  impact: "Borrow no autorizado via Multicall batch durante transform mode"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // After any batch of calls, transformedTokenId must be 0
    eq(vault.transformedTokenId(), 0, "VV-D-20: transformedTokenId non-zero after multicall batch");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 65
  notes: "Multicall usa delegatecall(address(this), ...), lo cual mantiene msg.sender y msg.value del caller original. transform() verifica transformedTokenId == 0 al inicio (linea 559), asi que no se puede entrar en transform mode dos veces. El riesgo es si alguien combina transform + otra funcion en un batch."
  poc_sketch: ''
  call_stack: ''

