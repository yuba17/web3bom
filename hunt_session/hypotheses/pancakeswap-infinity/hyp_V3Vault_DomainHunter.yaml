  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        (uint256 debt,,,uint256 liqCost, uint256 liqValue) = vault.loanInfo(tokenId);
        if (liqCost > 0 && liqValue > 0 && debt > 0) {
            // liquidationValue = debt * (Q32 + penaltyX32) / Q32
