  attack_scenario: >
    Si debtExchangeRateX96 decrece, los borrowers deben menos de lo que pidieron prestado
    (el protocolo regala dinero). Si lendExchangeRateX96 decrece sin haircut,
    los lenders pierden valor sin que haya habido liquidacion de reservas.
    Un atacante podria explotar un decrecimiento en debtRate prestando pre-decrecimiento
    y repagando post-decrecimiento, extrayendo la diferencia.
  impact: "Lenders pierden yield o principal; borrowers extraen valor del protocolo"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    (,,,,uint256 debtRate, uint256 lendRate) = vault.vaultInfo();
    if (ghost_lastDebtRateX96 > 0) {
        gte(debtRate, ghost_lastDebtRateX96, "VV-D-02: debtExchangeRate decreased");
    }
    // lendRate puede decrecer por haircut, pero solo durante liquidacion
    if (ghost_lastLendRateX96 > 0 && !ghost_liquidationInProgress) {
        gte(lendRate, ghost_lastLendRateX96, "VV-D-02: lendExchangeRate decreased without haircut");
    }
    ghost_lastDebtRateX96 = debtRate;
    ghost_lastLendRateX96 = lendRate;
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "El haircut en _handleReserveLiquidation reduce lendExchangeRateX96. ghost_liquidationInProgress debe setearse en el handler de liquidate."
  poc_sketch: ''
  call_stack: ''

