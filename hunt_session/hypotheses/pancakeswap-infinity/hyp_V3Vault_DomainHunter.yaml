- id: VV-D-01
  tier: 1
  type: property
  description: "Solvencia global: balance + deuda >= lent (el vault nunca tiene patrimonio neto negativo)"
  attack_scenario: >
    Si balance + debt < lent, significa que los lenders tienen claims sobre assets que no existen.
    Un atacante podria forzar esto via liquidacion con reserveCost que no se cubre adecuadamente,
    o via manipulacion de exchange rates. El resultado seria que los ultimos lenders no pueden
    retirar sus fondos (bank run).
  impact: "Insolvencia del vault -- lenders pierden fondos proporcional al deficit"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    (uint256 debt, uint256 lent, uint256 balance, uint256 reserves,,) = vault.vaultInfo();
    // Solvency: balance + debt >= lent (total claims)
    gte(balance + debt, lent, "VV-D-01: vault insolvent -- balance + debt < lent");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: "La funcion _handleReserveLiquidation puede reducir lendExchangeRate via haircut, lo cual deberia mantener solvencia. Verificar que el haircut no tiene off-by-one."
  poc_sketch: ''
  call_stack: ''

