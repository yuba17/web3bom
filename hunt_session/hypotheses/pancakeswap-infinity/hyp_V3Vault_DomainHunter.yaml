  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Global debtSharesTotal should be conserved during transforms
    // (checked after every handler call)
    uint256 currentDebtSharesTotal = vault.debtSharesTotal();
    uint256 sumDebtShares = 0;
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 20; i++) {
        (uint256 s) = vault.loans(ghost_allTokenIds[i]);
        sumDebtShares += s;
