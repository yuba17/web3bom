  type: property
  description: "Transform replacement integrity: al reemplazar tokenId en onERC721Received, la deuda se transfiere correctamente sin creacion ni destruccion"
  attack_scenario: >
    En onERC721Received con oldTokenId != 0 (replacement mode), el codigo:
    1. Copia debtShares de old a new
    2. Llama _cleanupLoan(oldTokenId) que reduce totalDebtShares de old tokens
    3. Llama _updateAndCheckCollateral(newTokenId) que incrementa totalDebtShares de new tokens
    Si los pares de tokens de old y new son diferentes, los totalDebtShares per-token
    cambian. Verificar que debtSharesTotal global no cambia (solo se mueve entre tokens).
    Edge case: si el nuevo token ya tiene debtShares (check en linea 482 deberia prevenir esto).
