- id: VV-D-04
  tier: 1
  type: property
  description: "Roundtrip safety: deposit(X) seguido de redeem(shares) nunca extrae mas de X assets"
  attack_scenario: >
    Si un usuario deposita X assets, recibe S shares, y luego redeem(S) le devuelve
    mas de X assets, hay una extraccion gratuita. Esto puede ocurrir si el rounding
    en _convertToShares (Down en deposit) y _convertToAssets (Down en redeem) no esta
    correctamente alineado, o si hay un cambio de estado entre deposit y redeem
    que favorece al usuario (ej: interest accrual en el mismo bloque).
  impact: "Extraccion gradual de fondos del vault por cada roundtrip, drenando reserves"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    if (ghost_lastDepositAssets > 0 && ghost_lastDepositShares > 0) {
        (,,,,, uint256 lendRate) = vault.vaultInfo();
        uint256 redeemAssets = ghost_lastDepositShares * lendRate / Q96;
        // En el mismo bloque (sin interest), redeem no debe dar mas de lo depositado
        // Tolerancia de 1 wei por rounding
        lte(redeemAssets, ghost_lastDepositAssets + 1, "VV-D-04: roundtrip extraction -- redeem > deposit");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: "deposit usa Math.Rounding.Down para shares (menos shares al depositar), redeem usa Math.Rounding.Down para assets (menos assets al retirar). Ambos favorecen al vault. Pero si lendExchangeRate cambia entre calls, el resultado puede diferir. Testear dentro del mismo bloque."
  poc_sketch: ''
  call_stack: ''

