- hunter: TrustBoundaryHunter
  id: VV-TB-FP-02
  reason: >
    Investigated first-depositor / share inflation attack. V3Vault uses exchange rate based
    accounting (lastLendExchangeRateX96) not totalAssets/totalSupply ratio. Donations to the vault
    increase balanceOf but do NOT affect the lend exchange rate. The exchange rate only changes via
    _updateGlobalInterest which uses the interest rate model. Therefore the classic share inflation
    attack does not apply here.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: vault.md
    content: "V3Vault uses exchange-rate accounting (Q96), NOT totalAssets/totalSupply. Donation attack does not affect share pricing -- excess tokens become reserves."
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: VV-TB-FP-03
  reason: >
    Investigated ERC777 token hook reentrancy. V3Vault uses SafeERC20 for all transfers and the
    asset is set once in constructor (immutable). If the asset were ERC777, transfer hooks could
    re-enter. However, (1) the vault is designed for standard ERC20 tokens like USDC/WETH,
    (2) SafeERC20 does not prevent reentrancy from ERC777 hooks, but (3) all critical state changes
    happen BEFORE external transfers (checks-effects-interactions pattern in most functions).
    Borrow at L679 transfers after state update. Withdraw at L1039-L1040 burns before transfer.
    Deposit at L1005-L1007 transfers before mint -- this could be a reentrancy vector if asset
    were ERC777, but it is not a practical concern for standard ERC20 assets.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: vault.md
    content: "V3Vault _deposit does transferFrom before _mint (L1005-1007). If asset were ERC777, this would be a reentrancy vector. Not practical for standard ERC20 assets (USDC, WETH)."
    briefing_update_applied: false
