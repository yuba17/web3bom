- id: VV-TB-12
  tier: 2
  type: property
  description: "InterestRateModel is immutable -- a buggy IRM can permanently break the vault by returning extreme rates"
  attack_scenario: >
    interestRateModel is set in constructor and is immutable. _calculateGlobalInterest at L1314
    calls interestRateModel.getRatesPerSecondX64(balance, debt). If the IRM returns an extremely
    high borrowRateX64, the debt exchange rate at L1318 could overflow uint256 or grow so fast
    that all positions become instantly liquidatable. Since the IRM is immutable, this cannot be
    fixed. The vault has no rate cap on the returned values.
  impact: "Extreme interest rates could make all loans instantly liquidatable or overflow accounting."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Exchange rates should be monotonically non-decreasing and bounded
    (,,,,uint256 debtRate, uint256 lendRate) = vault.vaultInfo();
    // Rates start at Q96 and only grow
    gte(debtRate, 2**96, "VV-TB-12: debt exchange rate below Q96");
    gte(lendRate, 2**96, "VV-TB-12: lend exchange rate below Q96");
    // Rates should not grow more than 100x in any reasonable scenario
    lte(debtRate, 100 * 2**96, "VV-TB-12: debt exchange rate unreasonably high");
    lte(lendRate, 100 * 2**96, "VV-TB-12: lend exchange rate unreasonably high");
    // Debt rate must always be >= lend rate (borrowers pay more than lenders receive)
    gte(debtRate, lendRate, "VV-TB-12: debt rate less than lend rate");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: "The IRM is a trust boundary. No validation on returned rates in _calculateGlobalInterest. But IRM is typically a simple contract with bounded math."
