- id: VV-TB-04
  tier: 1
  type: property
  description: "onERC721Received during transform mode cannot overwrite an existing active loan -- replacement token must be fresh (no prior owner or debt)"
  attack_scenario: >
    During transform mode, onERC721Received at L479 checks tokenOwner[tokenId] == address(0) &&
    loans[tokenId].debtShares == 0 for the replacement token. If an attacker can send a token that
    already has an active loan in the vault (through a different path), the check at L482 should catch it.
    However, if the attacker first removes the token (setting tokenOwner to 0, debtShares already 0
    because remove() requires debtShares == 0), then re-sends it during transform, the token passes the
    check. The old debt from the transformed token gets copied to this recycled tokenId at L494.
    This is actually safe by design since removed tokens have no debt.
  impact: "Potential accounting corruption if a previously-used tokenId with residual state is reintroduced."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Every token tracked by vault must have consistent ownership
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tokenId);
        (uint256 debtShares) = vault.loans(tokenId);
        // If token has no owner in vault, it must have no debt
        if (owner == address(0)) {
            eq(debtShares, 0, "VV-TB-04: orphaned debt -- token has no owner but has debt shares");
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: "L482 checks both tokenOwner and debtShares. The _cleanupLoan at L500 deletes the old loan. This invariant catches if the cleanup ever fails."
  poc_sketch: ''
  call_stack: ''

