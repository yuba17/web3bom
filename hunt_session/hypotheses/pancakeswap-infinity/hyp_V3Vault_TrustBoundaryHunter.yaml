  attack_scenario: >
    At L459-464, when data.length != 0, the owner is decoded from data instead of using `from`.
    This means whoever triggers safeTransferFrom can set any address as the loan owner.
    The comment at L460-463 says this is intentional. But consider: if an approved operator calls
    safeTransferFrom for someone else's NFT with data encoding their own address as owner, they
    become the loan owner in the vault. This is documented as an accepted trust assumption, but
    it means any NFT operator/approved address can claim ownership of positions in the vault.
  impact: "NFT operator can claim vault loan ownership, then borrow against stolen collateral."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Position ownership should only change through legitimate vault operations
    // Track that created positions belong to expected actors
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tokenId);
        // Owner must be a known actor (alice, bob, carol) or address(0) if removed
        t(
            owner == address(0) || owner == alice || owner == bob || owner == carol || owner == admin,
            "VV-TB-14: position owned by unknown address -- possible owner hijack"
        );
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 70
  notes: "Documented as intentional at L460-463. The trust model assumes whoever can trigger safeTransferFrom has authority to choose the owner. This is standard for integrator flows but could surprise users who approve operators."
  poc_sketch: ''
  call_stack: ''

