- id: VV-TB-01
  tier: 1
  type: property
  description: "Transformer call cannot leave NFT outside vault custody after transform completes -- the vault MUST own the newTokenId NFT at the end of _transform"
  attack_scenario: >
    A malicious transformer (whitelisted by owner but buggy/upgradeable) receives the approved NFT,
    transfers it to an attacker address, then sends a different NFT back to the vault. The vault checks
    ownerOf(newTokenId) == address(this) at L603, but if the transformer manipulates transformedTokenId
    via onERC721Received to point to the new NFT while the original (with debt) is gone, the vault loses
    collateral. The check at L604 uses newTokenId (read from transformedTokenId at L592) not the original
    tokenId -- so the debt migrates to the new token but old collateral is stolen.
  impact: "Loss of collateral NFT worth the full position value. Attacker steals the LP position."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After any transform, vault must still own the active token
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tokenId);
        if (owner != address(0)) {
            // If vault tracks this token, the NFT manager must report vault as owner
            // (or gauge manager if staked)
            address nftOwner;
            try npm.ownerOf(tokenId) returns (address o) {
                nftOwner = o;
            } catch {
                continue; // burned token
            }
            t(
                nftOwner == address(vault) || nftOwner == address(mockGaugeManager),
                "VV-TB-01: vault-tracked token not in vault or gauge custody"
            );
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: "The _transform function checks ownerOf(newTokenId) at L603 but the transformer has full control during the call. The key trust assumption is that whitelisted transformers are audited contracts."
  poc_sketch: ''
  call_stack: ''

