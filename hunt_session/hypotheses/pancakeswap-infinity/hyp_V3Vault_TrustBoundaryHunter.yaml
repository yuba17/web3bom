- id: VV-TB-09
  tier: 2
  type: property
  description: "Multicall inheritance allows batching of state-changing operations -- combined calls may bypass per-function checks"
  attack_scenario: >
    V3Vault inherits Multicall from OpenZeppelin. This allows batching multiple calls in a single tx.
    An attacker could batch: (1) deposit to get shares, (2) borrow against a position, (3) withdraw
    all shares -- all atomically. Each individual call passes its checks, but the combined effect
    may create an inconsistent state. For example, the daily limit checks use state that changes
    within the multicall but the limit reset only happens once per day. Multicall uses delegatecall
    internally, so msg.sender is preserved and all calls share the same transaction context.
  impact: "Potential bypass of daily limits or other per-transaction checks via batched operations."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Daily limits should never go negative (underflow protection)
    // After any sequence of operations, limits should be consistent
    uint256 dailyLendLeft = vault.dailyLendIncreaseLimitLeft();
    uint256 dailyDebtLeft = vault.dailyDebtIncreaseLimitLeft();
    // These are uint256, so they can't go negative, but they could be
    // manipulated to be artificially large via deposit+withdraw cycling
    uint256 dailyLendMin = vault.dailyLendIncreaseLimitMin();
    uint256 dailyDebtMin = vault.dailyDebtIncreaseLimitMin();
    // Lend limit left should not exceed the calculated maximum
    // max = max(minLimit, totalLent * 10%)
    (,uint256 lent,,,,uint256 lendRate) = vault.vaultInfo();
    uint256 maxLendLimit = lent / 10;
    if (dailyLendMin > maxLendLimit) { maxLendLimit = dailyLendMin; }
    // Add tolerance for replenishment from withdrawals
    lte(
        dailyLendLeft,
        maxLendLimit + ghost_totalWithdrawn + ghost_numOps + 1,
        "VV-TB-09: daily lend limit exceeded theoretical maximum"
    );
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 55
  notes: "Multicall + daily limits: withdraw replenishes dailyLendIncreaseLimitLeft (L1043). An attacker could cycle deposit/withdraw to keep the limit high. This is by design but worth verifying bounds."
  poc_sketch: ''
  call_stack: ''

