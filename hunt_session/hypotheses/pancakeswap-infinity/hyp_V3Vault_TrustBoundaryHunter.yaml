- id: VV-TB-06
  tier: 1
  type: property
  description: "totalAssets uses balanceOf(address(this)) which is manipulable via direct token transfer (donation attack) -- share price can be inflated"
  attack_scenario: >
    totalAssets() at L288 returns IERC20(asset).balanceOf(address(this)) + debt. An attacker can
    directly transfer asset tokens to the vault (donation) to inflate balanceOf without going through
    deposit(). This inflates totalAssets, which inflates the exchange rate for existing shares.
    Combined with first-depositor attack: deposit 1 wei, donate large amount, next depositor gets
    0 shares due to rounding. The vault does NOT use virtual shares offset (_decimalsOffset).
    However, the vault uses internal debt tracking + exchange rates (lastLendExchangeRateX96) which
    are only updated through _updateGlobalInterest, so donation does NOT affect the exchange rate
    directly. The balanceOf reading only affects _getBalanceAndReserves for liquidity checks, not
    share pricing. Share pricing uses exchange rates.
  impact: "If exploitable: first depositor steals subsequent deposits. But exchange rate based pricing may mitigate."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // totalAssets should be consistent with internal accounting
    (uint256 debt, uint256 lent, uint256 balance, uint256 reserves,,) = vault.vaultInfo();
    uint256 totalAssets = vault.totalAssets();
    // totalAssets = balanceOf(vault) + debt -- which should approximate lent + reserves
    // But donations can make balance > lent + reserves - debt
    // The key invariant: share price should not be manipulable
    if (vault.totalSupply() > 0 && ghost_totalDeposited > 0) {
        uint256 sharePrice = vault.convertToAssets(1e18);
        // Share price should not exceed deposited + reasonable interest
        // Using a generous 2x bound (100% interest)
        lte(
            sharePrice,
            2e18 + ghost_numOps,
            "VV-TB-06: share price suspiciously high -- possible donation attack"
        );
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 60
  notes: "Exchange rate is internally tracked, not derived from balanceOf. Donation affects reserves calculation but not share price directly. Likely a false positive for share inflation, but the balanceOf dependency in totalAssets is still a trust boundary concern."
  poc_sketch: ''
  call_stack: ''

