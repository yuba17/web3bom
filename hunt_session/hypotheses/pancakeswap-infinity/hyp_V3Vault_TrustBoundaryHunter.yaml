    all deposited funds. Similarly, if a borrower's address is blocklisted, they cannot repay
    (safeTransferFrom from their address reverts), making their position permanently unliquidatable
    via the normal path (liquidation pulls from liquidator, not borrower, so this specific path
    is not blocked -- but repayment is).
  impact: "Permanent fund lock if vault is blocklisted. Borrower DoS if borrower address is blocklisted."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
