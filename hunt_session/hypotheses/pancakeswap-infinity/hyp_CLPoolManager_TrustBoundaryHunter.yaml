# ============================================================================
# CLPM-TB-01: Hook Delta Accounting Conservation
# ============================================================================
# The core trust boundary: hooks return arbitrary BalanceDelta values that get
# applied to the caller's and hook's accounting in the Vault. If hookDelta is
# not properly constrained, a malicious hook can steal from callers.
#
# Key insight: callerDelta = delta - hookDelta, so a positive hookDelta REDUCES
# what the caller receives (or increases what they pay). The hook's own debt in
# the Vault is hookDelta. So the Vault enforces that hookDelta is settled by
# the hook address. But the question is: can a hook return a hookDelta that
# makes the CALLER pay more than the pool actually computed?
#
# In afterModifyLiquidity (line 172): delta + feeDelta is passed as the base,
# then hookDelta is subtracted from it → callerDelta = (delta+feeDelta) - hookDelta.
# The hook is charged hookDelta via vault.accountAppDeltaWithHookDelta.
# This is zero-sum IF the vault settlement enforces it. The vault does enforce
# that hook address must settle its own delta by end of lock(). So a hook that
# returns a crazy hookDelta just creates a debt for itself.
#
# HOWEVER: if the hook IS the locker (hook calls vault.lock, then calls
# poolManager operations from within lockCallback), the hook settles its own
# deltas. A malicious hook could return a large negative hookDelta (meaning
# "the pool owes me tokens"), which would credit the hook and debit the caller.
# The caller then owes MORE to the vault. Since the caller is the hook itself
# (msg.sender in the vault context), this is self-referential.
#
# After deep analysis: the vault tracks deltas per address. hookDelta is
# accounted to address(key.hooks), callerDelta to msg.sender. If hook == locker
# == msg.sender, both go to the same address and net out. NOT exploitable.
#
# BUT: if a ROUTER calls on behalf of a user, msg.sender is the router.
# hookDelta goes to address(key.hooks). callerDelta goes to the router.
# The router must settle callerDelta. The hook must settle hookDelta.
# These are separate addresses → zero-sum is enforced by vault lock().
#
# VALIDATED: This is by-design. Zero-sum accounting in vault prevents theft.
# Keeping as Tier 2 to verify in fuzz that the invariant actually holds.
- id: CLPM-TB-01
  tier: 2
  type: property
  description: "After swap/modifyLiquidity/donate, the sum of callerDelta + hookDelta must equal the pool's computed delta. No tokens can be created or destroyed by hook return values."
  attack_scenario: "A malicious hook returns a large negative hookDelta (pool owes hook), inflating its credit. If vault accounting doesn't enforce settlement, hook drains vault."
  impact: "Total vault drain — hook extracts tokens without depositing"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // After each swap call, verify:
    // vault.currencyDelta(settler, currency0) + vault.currencyDelta(hookAddr, currency0) == expected pool delta0
    // This must be checked across the entire lock() lifecycle
    int256 settlerDelta0 = vault.currencyDelta(settler, key.currency0);
    int256 settlerDelta1 = vault.currencyDelta(settler, key.currency1);
    int256 hookDelta0 = vault.currencyDelta(address(key.hooks), key.currency0);
    int256 hookDelta1 = vault.currencyDelta(address(key.hooks), key.currency1);
    // The vault must revert on lock() exit if any of these are nonzero
    // So after lock() completes: all deltas must be zero
    eq(settlerDelta0 + hookDelta0, 0, "CLPM-TB-01: currency0 delta not zero-sum after lock");
    eq(settlerDelta1 + hookDelta1, 0, "CLPM-TB-01: currency1 delta not zero-sum after lock");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: "By-design the vault lock() reverts if unsettled deltas remain. But worth fuzzing to confirm no edge case allows partial settlement."

# ============================================================================
# CLPM-TB-02: Hook beforeSwap Can Modify amountToSwap Without Bound
# ============================================================================
# In CLHooks.beforeSwap (line 150-159), if HOOKS_BEFORE_SWAP_RETURNS_DELTA_OFFSET
# is set, the hook returns a BeforeSwapDelta with a specifiedDelta.
# amountToSwap += hookDeltaSpecified
#
# The ONLY check is: if the sign flips (exact input becomes exact output or
# vice versa), revert HookDeltaExceedsSwapAmount.
#
# But a hook can return hookDeltaSpecified that REDUCES amountToSwap to near
# zero (e.g., user wants to swap -1000 tokens, hook returns +999, so only
# -1 token actually swaps). The hook then "takes" 999 tokens via its hookDelta.
#
# This is actually the intended design for hooks that implement custom routing,
# TWAMM, limit orders, etc. The key question: does the user lose funds?
# The user's callerDelta accounts for delta (from the tiny swap) MINUS hookDelta.
# The hook's delta is tracked separately. So the user pays based on callerDelta.
#
# POTENTIAL ISSUE: if hookDeltaSpecified reduces amountToSwap but the
# hookDeltaUnspecified is not proportionally adjusted, the user could get
# less output than expected for their input. The hook essentially takes the
# user's specified tokens and gives nothing back on the unspecified side.
#
# This IS a trust boundary issue: users interacting with pools that have
# beforeSwapReturnsDelta hooks are TRUSTING that hook to handle their tokens
# fairly. A malicious hook can absorb the user's input without providing output.
- id: CLPM-TB-02
  tier: 1
  type: property
  description: "A hook with beforeSwapReturnsDelta can reduce amountToSwap to near-zero, absorbing user's specified tokens via hookDelta without providing proportional unspecified output."
  attack_scenario: "1) Attacker deploys malicious hook with beforeSwapReturnsDelta. 2) Hook returns hookDeltaSpecified = amountSpecified - 1 (reduces swap to 1 wei). 3) Hook does NOT return any unspecified delta. 4) User's callerDelta: pays full input, gets 1 wei of output from pool + 0 from hook. 5) Hook profits: receives the specified tokens, pays nothing."
  impact: "Users lose nearly all swap input when interacting with malicious hook pools"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // For a swap with beforeSwapReturnsDelta, verify the user is not worse off
    // than a no-hook swap would produce
    // ghost_preSwapBalance0 and ghost_preSwapBalance1 captured before swap
    int256 callerDelta0 = delta.amount0();
    int256 callerDelta1 = delta.amount1();
    // In an exact input swap (amountSpecified < 0, zeroForOne=true):
    // callerDelta0 should be negative (user pays), callerDelta1 positive (user receives)
    // If hookDeltaSpecified absorbed most of the input, callerDelta1 will be tiny
    // This is "by design" for trusted hooks but a trap for users
    // Invariant: if hook absorbs >50% of specified, it must provide >50% of unspecified
    // (This invariant is exploratory — may be by-design)
    if (hookDeltaSpecified > amountToSwap / 2) {
        gt(hookDeltaUnspecified, 0, "CLPM-TB-02: hook absorbed input but gave no output");
    }
  ghost_vars:
    - "int256 internal ghost_preSwapBalance0;"
    - "int256 internal ghost_preSwapBalance1;"
  validated: false
  priority: high
  confidence: 55
  notes: "This may be by-design — hooks like TWAMM legitimately absorb swap amounts. The real risk is to users who don't realize a pool has this hook. Frontend/router responsibility to warn. But if hook is upgradeable, it could turn malicious after deployment."

