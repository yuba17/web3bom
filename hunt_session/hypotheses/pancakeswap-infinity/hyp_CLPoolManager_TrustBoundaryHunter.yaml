# ============================================================================
# CLPM-TB-06: Cross-App Trust — CL and BIN Pool Managers Share Vault
# ============================================================================
# Both CLPoolManager and BinPoolManager are registered apps in the same Vault.
# They share:
# - The same Vault contract (settlement, token custody)
# - The same lock() mechanism (only one locker at a time)
# - The same reservesOfApp tracking (but separated by app address)
#
# Key trust assumption: CLPoolManager trusts that the Vault correctly isolates
# its reserves from BinPoolManager's reserves. This is enforced by
# reservesOfApp[msg.sender][currency] — each app has its own reserve bucket.
#
# POTENTIAL ISSUE: During lock(), a callback can interact with BOTH pool
# managers in the same transaction. The deltas are tracked per settler address,
# not per pool manager. So a single lock() callback could:
# 1) Swap on CLPoolManager (creates delta for settler)
# 2) Swap on BinPoolManager (creates delta for settler)
# 3) Settle ONCE in the vault
#
# The settlement is currency-level, not pool-level. So positive delta from
# CLPool can offset negative delta from BinPool. This is INTENTIONAL — it
# enables cross-pool routing efficiency.
#
# But it means: if CLPoolManager has a bug that miscalculates delta, the
# settler can make up the difference via BinPoolManager (or vice versa).
# The vault won't catch the bug because total deltas still sum to zero.
- id: CLPM-TB-06
  tier: 2
  type: property
  description: "CLPoolManager and BinPoolManager share the same Vault. A bug in one app's delta calculation can be masked by the other app's correct calculation, as settlement is per-currency not per-app."
  attack_scenario: "1) CLPoolManager has a rounding bug that gives the user 1 wei extra of token0 per swap. 2) User does 1M swaps via CLPool, accumulating 1M wei of free token0. 3) User offsets by providing 1M wei of token0 via BinPool deposit. 4) Vault settles both — total delta is zero. 5) CLPoolManager's reservesOfApp is drained by 1M wei. 6) Eventually CLPool becomes insolvent (reserves < obligations)."
  impact: "Cross-app reserve drainage via delta calculation bugs masked by vault-level settlement"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Track CLPoolManager reserves independently
    uint256 clReserve0_before = vault.reservesOfApp(address(clPoolManager), currency0);
    uint256 clReserve1_before = vault.reservesOfApp(address(clPoolManager), currency1);
    // After a swap:
    uint256 clReserve0_after = vault.reservesOfApp(address(clPoolManager), currency0);
    uint256 clReserve1_after = vault.reservesOfApp(address(clPoolManager), currency1);
    // CLPool reserves should NEVER go negative (underflow would revert)
    // But they should also track consistently with pool state
    // This invariant monitors for slow drainage
    gte(clReserve0_after + clReserve1_after, ghost_minReserveSum, "CLPM-TB-06: CLPool reserves draining below minimum");
  ghost_vars:
    - "uint256 internal ghost_minReserveSum;"
  validated: false
  priority: medium
  confidence: 50
  notes: "This is more of a systemic risk than a specific bug. The vault architecture intentionally allows cross-app settlement for efficiency. The risk is that it also masks per-app accounting bugs. Would need to monitor reservesOfApp per pool manager over many operations."

# ============================================================================
# CLPM-TB-07: Fee-on-Transfer / Rebasing Tokens in Pools
# ============================================================================
# CLPoolManager does NOT handle actual token transfers — the Vault does.
# CLPoolManager only computes deltas (BalanceDelta) and reports them to the Vault.
# The Vault uses sync/settle pattern: sync() snapshots balance, settle() measures
# the difference.
#
# For fee-on-transfer tokens:
# - User transfers 100 FOT to vault (vault receives 98 after fee)
# - settle() sees paid = balanceNow - reservesBefore = 98
# - User gets credit for 98, not 100
# - This is CORRECT — the sync/settle pattern handles FOT tokens properly
#
# For rebasing tokens (e.g., stETH):
# - Between sync() and settle(), the vault balance could change due to rebase
# - If positive rebase: paid = balanceNow - reservesBefore includes rebase profit
# - Settler gets credited for the rebase amount they didn't deposit
# - This is a FREE MONEY vector for rebasing tokens
#
# HOWEVER: rebase between sync and settle within the same tx is unlikely
# (rebase happens at specific times, not per-block for most tokens).
# The real risk: rebase between lock() start and settle(). If stETH rebases
# mid-transaction... this is extremely unlikely in a single tx.
#
# Cross-block risk: if sync() is called in one tx and settle() in another...
# but lock() requires both in the same callback, so this can't happen.
- id: CLPM-TB-07
  tier: 2
  type: property
  description: "Rebasing tokens (stETH, AMPL) can cause sync/settle accounting mismatch if a rebase occurs between sync() and settle() within the same lock() callback."
  attack_scenario: "1) Pool uses stETH as token0. 2) Attacker calls vault.lock(). 3) In lockCallback: sync(stETH), then trigger a stETH rebase (if possible), then settle(). 4) settle() credits attacker with rebase amount on top of their deposit. 5) Attacker profits from free stETH rebase credit."
  impact: "Free token credit from rebase occurring between sync and settle"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // For rebasing tokens, verify that settle amount equals actual transfer
    uint256 balanceBefore = currency.balanceOfSelf();
    vault.sync(currency);
    // Transfer happens here
    vault.settle();
    uint256 balanceAfter = currency.balanceOfSelf();
    uint256 actualReceived = balanceAfter - balanceBefore;
    // With rebasing tokens, actualReceived might differ from what was credited
    // This invariant checks the vault's accounting matches reality
    eq(vault.reservesOfApp(address(clPoolManager), currency), ghost_expectedReserve, "CLPM-TB-07: reserve mismatch with rebasing token");
  ghost_vars:
    - "uint256 internal ghost_expectedReserve;"
  validated: false
  priority: medium
  confidence: 45
  notes: "Intra-transaction rebase is extremely unlikely for most tokens. stETH rebases once per day at a specific time. AMPL rebases once per day. Risk is theoretical but worth documenting. The bigger risk is simply that protocols shouldn't use rebasing tokens in these pools."

# ============================================================================
# CLPM-TB-08: donate() Does Not Settle Through Hook Delta Path
# ============================================================================
# Unlike swap() and modifyLiquidity(), donate() calls:
#   vault.accountAppBalanceDelta(key.currency0, key.currency1, delta, msg.sender)
# Instead of:
#   vault.accountAppDeltaWithHookDelta(key, delta, hookDelta)
#
# This means donate() does NOT support hook return deltas. The afterDonate
# hook is called but its return value is ignored (it returns bytes4 only,
# not BalanceDelta).
#
# CONSISTENCY ISSUE: If a hook expects to receive a delta from donate()
# (e.g., taking a cut of donations), it cannot. This is by-design but creates
# an asymmetry: hooks can take a cut of swaps and liquidity operations but
# NOT donations.
#
# This means: if a hook is designed to take fees on ALL pool operations,
# donations bypass the hook fee mechanism. An attacker could use donate()
# to add liquidity to a pool's fee growth without paying hook fees.
- id: CLPM-TB-08
  tier: 2
  type: property
  description: "donate() settles directly via vault.accountAppBalanceDelta without hook delta support, unlike swap() and modifyLiquidity() which use accountAppDeltaWithHookDelta. Hooks cannot take a cut of donations."
  attack_scenario: "1) Hook charges a 1% fee on all pool operations via afterSwap/afterModifyLiquidity return delta. 2) User donates to pool instead of swapping — donation goes directly to LPs without hook fee. 3) Hook's fee model is bypassed for donation operations. 4) If the hook relies on fee revenue for security (e.g., insurance fund), donations reduce the hook's income while still benefiting LPs."
  impact: "Hook fee bypass via donate() — hooks cannot capture donation revenue"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
