    // In the test, call donate on a pool with returnsDelta hooks
    // Verify hook's vault delta is unchanged after donate
    int256 hookDelta0Before = vault.currencyDelta(address(key.hooks), key.currency0);
    // ... donate() ...
    int256 hookDelta0After = vault.currencyDelta(address(key.hooks), key.currency0);
    eq(hookDelta0Before, hookDelta0After, "CLPM-TB-08: donate should not produce hook delta");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: "This is by-design — donate interface returns (bytes4) only, no BalanceDelta. But creates an asymmetry in the hook fee model. Low severity because donate() is a specialized function and hooks should be aware of this limitation."

# ============================================================================
# CLPM-TB-09: updateDynamicLPFee Caller Check — Only hooks Address
# ============================================================================
# updateDynamicLPFee (line 270-277) checks:
#   msg.sender != address(key.hooks) → revert UnauthorizedDynamicLPFeeUpdate
#
# The fee is validated: newDynamicLPFee.validate(ONE_HUNDRED_PERCENT_FEE)
# So the hook can set fee up to 100% but not above.
#
# TRUST ISSUE: The hook can set LP fee to 100% at any time (even between
# user's approval and execution). This is a known MEV vector:
# 1) User submits swap tx to mempool
# 2) Hook front-runs: sets LP fee to 100%
# 3) User's swap executes: pays 100% fee, gets 0 output
# 4) Hook back-runs: sets LP fee back to normal
#
# The ONLY protection is: key.fee must have isDynamicLPFee flag set at init.
# So users can see from the pool key that this pool has dynamic fees.
# But users interacting via routers may not check this.
- id: CLPM-TB-09
  tier: 1
  type: property
  description: "A hook can call updateDynamicLPFee to set LP fee to 100% at any time, causing all swap output to go to LPs and zero to the swapper. Only dynamic fee pools are affected."
  attack_scenario: "1) Pool has dynamic LP fee enabled. 2) User submits swap via mempool. 3) Hook (or hook owner) sees pending swap, calls updateDynamicLPFee(100%). 4) User's swap executes with 100% fee — receives 0 output tokens. 5) Hook resets fee to normal. 6) LP (possibly the hook owner) collects the entire swap input as fees."
  impact: "Complete loss of swap output for users — 100% of input goes to LP fees"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After any swap, verify that the effective fee was not 100%
    // delta.amount0() and delta.amount1() should both not be the same sign
    // (user pays one token, receives the other)
    int128 amount0 = delta.amount0();
    int128 amount1 = delta.amount1();
    // In a valid swap, one is positive and one is negative
    // If fee is 100%, the output side would be 0 or near-0
    if (amount0 < 0) {
        // User paid token0, should receive token1
        gt(amount1, int128(0), "CLPM-TB-09: swap output is zero — possible 100% fee attack");
    } else {
        gt(amount0, int128(0), "CLPM-TB-09: swap output is zero — possible 100% fee attack");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: "This is a known pattern in Uniswap v4 as well. Dynamic fee pools are inherently trusted — users should verify the hook before swapping. But routers/aggregators may not check, leading to user losses. The mitigation is slippage protection (sqrtPriceLimitX96), but if the user doesn't set it tightly, they're vulnerable."

# ============================================================================
# CLPM-TB-10: protocolFeesAccrued Unchecked Overflow
# ============================================================================
# In swap() line 203-206:
#   unchecked {
#       if (state.feeAmountToProtocol > 0) {
#           protocolFeesAccrued[...] += state.feeAmountToProtocol;
#       }
#   }
#
# This uses unchecked addition. If protocolFeesAccrued overflows uint256,
# it wraps to zero. After overflow, collectProtocolFees could extract
# more than actually accrued (if the mapping value wraps to a small number
# and then new fees accumulate past it).
#
# HOWEVER: uint256 max is 2^256 ≈ 1.15e77. Even at $1T/day in fees for
# 1 billion years, you wouldn't overflow. This is practically impossible.
- id: CLPM-TB-10
  tier: 3
  type: property
  description: "protocolFeesAccrued uses unchecked addition in swap(). Theoretical overflow would wrap the fee counter, but uint256 overflow is practically impossible."
  attack_scenario: "Attacker performs 2^256 / feeAmount swaps to overflow protocolFeesAccrued. After overflow, protocol can collect fees that wrap around. Practically impossible — would cost more gas than exists."
  impact: "None — uint256 overflow is impossible in practice"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify protocolFeesAccrued never decreases (monotonically increasing)
    uint256 feesBefore = clPoolManager.protocolFeesAccrued(currency);
    // ... swap ...
    uint256 feesAfter = clPoolManager.protocolFeesAccrued(currency);
    gte(feesAfter, feesBefore, "CLPM-TB-10: protocolFeesAccrued decreased");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: "Not a real vulnerability. The unchecked block is a gas optimization. Including for completeness as it's a trust boundary (unchecked arithmetic) but the risk is zero."

false_positives:
- hunter: TrustBoundaryHunter
  id: CLPM-FP-01
  reason: "PoolKey substitution attack — initially suspected that a caller could pass a modified PoolKey to swap() with different hook parameters. Investigation showed PoolId is a hash of the FULL PoolKey, so any parameter change produces a different PoolId pointing to an uninitialized pool (reverts)."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "PancakeSwap v4 / Uniswap v4 PoolId includes full PoolKey hash — cannot substitute parameters for same pool"
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: CLPM-FP-02
  reason: "Extsload private storage exposure — initially flagged as a trust boundary violation. Investigation showed this is an intentional EIP-2330 pattern adopted by Uniswap v4 and PancakeSwap. All on-chain data is already public; extsload just makes it more gas-efficient to read. Not a vulnerability."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Extsload (arbitrary storage read) is intentional in v4 pool managers — not a vulnerability, just a convenience for integrators"
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: CLPM-FP-03
  reason: "Hook self-settlement when hook == locker — initially suspected hookDelta could be used to steal from callers when hook is the locker. Analysis showed that when hook == msg.sender, both callerDelta and hookDelta go to the same address in vault accounting, netting to zero. When hook != msg.sender (router pattern), they're separate addresses and vault.lock() enforces both settle independently."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "v4 hook delta accounting is zero-sum by construction — vault.lock() forces all addresses to settle their deltas before unlocking"
    briefing_update_applied: false
