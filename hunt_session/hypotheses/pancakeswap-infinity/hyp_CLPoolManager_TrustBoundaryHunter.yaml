#
# This means: if the HOOK ITSELF calls CLPoolManager.swap(), the hook
# callbacks are SKIPPED. This prevents infinite recursion.
#
# TRUST BOUNDARY ISSUE: A hook can call CLPoolManager.swap() or modifyLiquidity()
# from within its own callback (e.g., during beforeSwap, the hook calls
# poolManager.swap() on the same pool). The second swap would skip all hook
# callbacks because msg.sender == hook.
#
# This could be exploited if the hook is designed to enforce invariants via
# its callbacks. A re-entrant call from the hook itself would bypass those
# invariants.
#
# In practice: the hook is calling swap ON ITSELF (its own pool), skipping
# its own hooks. This is intentional — it lets hooks do internal swaps without
# recursion. But it means the hook's beforeSwap price manipulation checks
# (if any) don't apply to its own internal swaps.
- id: CLPM-TB-05
  tier: 1
  type: property
  description: "When a hook calls CLPoolManager directly (msg.sender == hook), all hook callbacks are skipped via the shouldCall guard. A malicious or buggy hook can perform unchecked swaps/liquidity operations on its own pool."
