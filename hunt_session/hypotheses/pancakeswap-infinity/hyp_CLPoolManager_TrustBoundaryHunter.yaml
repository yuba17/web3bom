# ============================================================================
# CLPM-TB-04: Hook Validation Only at Initialize — Not Enforced at Runtime
# ============================================================================
# In initialize(), two validations happen:
# 1) Hooks.validateHookConfig(key) — checks that the hook's getHooksRegistrationBitmap()
#    matches the bitmap in key.parameters
# 2) CLHooks.validatePermissionsConflict(key) — checks that returnsDelta flags
#    require the corresponding hook call flag
#
# These checks happen ONLY at pool initialization. At runtime (swap, modifyLiquidity,
# donate), the code trusts key.parameters from poolIdToPoolKey[id].
#
# CRITICAL QUESTION: Can a hook's getHooksRegistrationBitmap() change after init?
# If the hook is an upgradeable proxy, the implementation could change, making
# the bitmap return different values. But this doesn't matter because the
# STORED key.parameters in poolIdToPoolKey is what's used at runtime.
#
# HOWEVER: The PoolKey is stored in poolIdToPoolKey at init, but callers of
# swap/modifyLiquidity pass PoolKey as a MEMORY parameter. The code uses
# key.toId() to look up the pool state, but uses the CALLER-PROVIDED key
# for hook calls! If the caller provides a PoolKey with different parameters
# (different hook flags), it could enable/disable hooks.
#
# Wait — PoolId is computed from the full PoolKey (hash of all fields including
# parameters and hooks). So a different key.parameters would produce a different
# PoolId, which would point to an uninitialized pool → revert at checkPoolInitialized.
#
# VALIDATED: The PoolId includes all PoolKey fields, so you can't substitute
# a different key.parameters for the same pool. Safe by design.
- id: CLPM-TB-04
  tier: 2
  type: property
  description: "Hook permissions are validated only at initialize() via getHooksRegistrationBitmap(). If hook is a proxy that changes its bitmap post-init, the stored pool key still controls which hooks fire at runtime."
  attack_scenario: "1) Hook is upgradeable proxy. 2) At init, bitmap matches. 3) Post-init, hook upgrades to add returnsDelta capability. 4) Attacker creates new pool with same tokens but new parameters matching upgraded bitmap. 5) Original pool is unaffected (parameters locked in PoolId). New pool works as expected. No exploit."
  impact: "None — PoolId includes full key, preventing parameter substitution"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that a swap with a modified PoolKey reverts
    PoolKey memory fakeKey = key;
    fakeKey.parameters = bytes32(uint256(key.parameters) | (1 << HOOKS_BEFORE_SWAP_RETURNS_DELTA_OFFSET));
    PoolId fakeId = fakeKey.toId();
    // fakeId != original id, so pool lookup fails
    t(PoolId.unwrap(fakeId) != PoolId.unwrap(key.toId()), "CLPM-TB-04: modified key produces different PoolId");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: "Confirmed safe. PoolId is deterministic hash of entire PoolKey. Cannot substitute parameters."

