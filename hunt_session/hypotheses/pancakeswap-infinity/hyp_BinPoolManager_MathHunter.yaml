- id: BPM-M07
  tier: 1
  type: property
  description: >
    getSharesAndEffectiveAmountsIn effective amounts calculation: when a user deposits more
    liquidity than their shares represent (due to rounding), the function computes
    effectiveLiquidity = shares.mulDivRoundUp(binLiquidity, totalSupply) and returns the
    "excess" to the user by reducing amountsIn. The excess is first removed from Y (quote),
    then from X (base). But the conversion from deltaLiquidity to deltaY uses
    deltaY = deltaLiquidity >> SCALE_OFFSET (line 86 BinHelper), and deltaX = deltaLiquidity / price
    (line 96). These are both truncating divisions. If deltaLiquidity < SCALE (2^128),
    deltaY = 0 and the full deltaLiquidity is tried against price. If deltaLiquidity < price,
    deltaX = 0 too. Result: effective amounts are NOT reduced despite being over-represented.
    The user deposits more than their shares warrant, gifting the excess to the pool.
  attack_scenario: >
    Not directly exploitable by an attacker (the overpayer is the depositor, not a victim).
    But: if a protocol integrates with BinPool and assumes effectiveAmountsIn is always
    tightly bounded, this dusty excess could accumulate and be extracted by other LPs via
    subsequent withdrawals. The excess is small (< 1 SCALE in liquidity terms, which for
    18-dec tokens is < 1 wei). But for tokens with very high value per unit and low decimals,
    this could matter.
  impact: "Depositors overpay by dust amounts that accrue to other LPs"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // After mint: verify depositor's share value <= deposited amounts
    // shares = userLiquidity * supply / binLiquidity (roundDown)
    // effectiveLiquidity = shares * binLiquidity / supply (roundUp)
    // The gap = userLiquidity - effectiveLiquidity should be minimized
    uint256 gap = ghost_userLiquidity - ghost_effectiveLiquidity;
    // Gap should be < price + SCALE (bounded by one unit of each conversion)
    lte(gap, ghost_binPrice + (1 << 128), "BPM-M07: excessive liquidity gap in deposit");
  ghost_vars:
    - uint256 internal ghost_userLiquidity;
    - uint256 internal ghost_effectiveLiquidity;
    - uint256 internal ghost_binPrice;
  validated: false
  priority: low
  confidence: 60
  notes: >
    The effective amounts reduction (BinHelper.sol:80-103) tries to return excess to user
    but is bounded by integer division precision. The max unreturned excess is
    SCALE + price - 2 in liquidity terms. For typical prices (around 2^128 for 1:1 pair),
