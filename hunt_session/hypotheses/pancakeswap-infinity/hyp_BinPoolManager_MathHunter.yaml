  validated: false
  priority: high
  confidence: 65
  notes: >
    Rounding analysis:
    - getAmountsOut: amountOut = (amountIn-fee) * price >> 128 rounds DOWN -> good for LP
    - getAmountsIn: amountIn = amountOut << 128 / price rounds UP -> good for LP
    - getFeeAmountFrom: rounds UP -> more fee -> good for LP
    - getFeeAmount: rounds UP -> more fee -> good for LP
    - getProtocolFeeAmt: rounds DOWN -> less protocol fee -> good for LP
