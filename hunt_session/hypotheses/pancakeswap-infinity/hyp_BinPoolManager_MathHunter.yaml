    if (supply > 0 && binReserves != bytes32(0)) {
        uint256 price = uint24(binId).getPriceFromId(binStep);
        uint256 currentLiquidity = binReserves.getLiquidity(price);
        uint256 liquidityPerShare = currentLiquidity / supply;
        gte(liquidityPerShare, ghost_lastLiqPerShare[binId],
