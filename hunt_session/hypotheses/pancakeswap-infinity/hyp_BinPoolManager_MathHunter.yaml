    bytes32 newRes = binReserves.add(amountsIn);
    uint256 newSupply = totalSupply + shares;
    (uint128 recX, uint128 recY) = BinHelper.getAmountOutOfBin(newRes, shares, newSupply).decode();
    (uint128 inX, uint128 inY) = amountsIn.decode();
    bool bothGreater = (recX > inX) && (recY > inY);
