    to reserves (fee stays in bin after protocol fee deduction). The rounding directions
    are: exactIn output rounds DOWN (less out = good for LPs), exactOut input rounds UP
    (more in = good for LPs). Protocol fee rounds DOWN via getProtocolFeeAmt (less taken
    from LP = good for LPs). All directions favor the pool. But verify that the COMBINATION
    at extreme values (1-wei swaps, max-price bins) doesn't produce a net decrease.
  attack_scenario: >
    If share price decreases after a swap, an attacker can sandwich:
    1. Mint into bin before a swap that decreases share price.
    2. After swap, share price is lower.
    3. Wait for next swap that restores/increases share price.
    4. Burn for profit.
    More realistically: at very small reserve amounts with high binStep, price precision
    loss in getPriceFromId combined with mulShiftRoundDown could produce amountOut
    slightly higher than theoretical, decreasing reserves-per-share by dust.
    Over thousands of swaps this could accumulate.
  impact: "LP share value dilution through accumulated rounding in swap output"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // For each bin, track liquidity/shares ratio after every swap
