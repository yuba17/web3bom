    2. Many swaps route through this bin, accumulating LP fees in reserves.
    3. Attacker withdraws all but MINIMUM_SHARE.
    4. Bin removed from tree. Reserves proportional to MINIMUM_SHARE are stranded.
    5. Reserves = (MINIMUM_SHARE / totalSupply_before_burn) * reserves_before_burn.
       With inflated reserves from fees, this could be non-trivial.
    Not profitable for the attacker (they benefit from the fees before burning).
    But the stranded reserves are a permanent loss of pool value.
  impact: "Permanent reserve locking in depleted bins — grief vector for token supply"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
