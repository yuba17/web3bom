- id: BPM-M02
  tier: 1
  type: property
  description: >
    Composition fee is structurally less than swap fee at ALL fee levels.
    getCompositionFee = amt * f * (f + P) / P^2 where f = feeBips * 1e12, P = 1e18.
    Equivalent swap fee via getFeeAmount = amt * f / (P - f).
    Ratio: composition/swap = (f + P)(P - f) / P^2 = 1 - (f/P)^2.
    Since f > 0 always, this ratio is ALWAYS < 1. The composition fee is ALWAYS cheaper
    than a direct swap. This enables fee arbitrage: implicit swap via mint/burn pays less
    than a direct swap. At max fee (10%, f=1e17): ratio = 0.99, composition is 1% cheaper.
  attack_scenario: >
    Attacker identifies a pool with high LP fee (approaching 10% max).
    Instead of swapping X->Y directly (paying swap fee), attacker mints into active bin
    with all X and no Y, triggering composition fee on the Y component.
    Then immediately burns all shares to receive both X and Y.
    Net cost = composition fee < swap fee. Profit = swap fee - composition fee.
    For 1000 USDC implicitly swapped at 10% fee:
    Swap fee = amt * 1e17 / (1e18 - 1e17) = 1000 * 1e17 / 9e17 = 111.11 USDC.
    Composition fee = 1000 * 1e17 * 1.1e18 / 1e36 = 110 USDC.
    Profit = 1.11 USDC per operation.
    Must account for MINIMUM_SHARE lockup cost and gas. On existing bins (not first deposit),
    no MINIMUM_SHARE cost. Gas on L2s is negligible.
  impact: "Fee arbitrage via mint/burn at high-fee pools — LP value extraction."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a mint into active bin with composition fee:
    // Compare composition fee paid vs what a swap would have cost
    if (ghost_compositionFeeAmt > 0 && ghost_swapFeeBips > 0) {
        uint256 totalFee = uint256(ghost_swapFeeBips) * 1e12;
        uint256 equivalentSwapFee = (uint256(ghost_implicitSwapAmt) * totalFee +
            (1e18 - totalFee) - 1) / (1e18 - totalFee);
        gte(ghost_compositionFeeAmt, equivalentSwapFee,
            "BPM-M02: composition fee < swap fee — arbitrage via mint");
    }
  ghost_vars:
    - uint128 internal ghost_compositionFeeAmt;
    - uint128 internal ghost_implicitSwapAmt;
    - uint24 internal ghost_swapFeeBips;
  validated: false
  priority: high
  confidence: 80
  notes: >
    MATHEMATICALLY PROVEN: composition/swap ratio = 1 - (f/P)^2 < 1 for all f > 0.
    This is not a rounding issue — it's a formula design issue. The quadratic composition
    fee formula structurally undercharges relative to the swap fee. At low fees (0.01%),
    the difference is negligible (~0.0001%). At high fees (10%), it's ~1%.
    This was likely accepted as a tradeoff in the Trader Joe v2 design, but may not have
    been explicitly acknowledged. Prior audits (Zellic, OtterSec, Hexens, Cyfrin) may have
    noted this as by-design, but it's worth verifying.

- id: BPM-M03
