    mulDivRoundDown for BOTH X and Y independently. In theory, rounding could make BOTH
    receivedAmountX >= amountX AND receivedAmountY >= amountY simultaneously for specific
    (shares, totalSupply, reserves) values. If receivedAmountY > amountY here, the
    subtraction underflows and reverts — DoS on minting into that bin.
    The opposite case (BinHelper.sol:203, amountX - receivedAmountX) has the same risk.
