    The reserves proportional to MINIMUM_SHARE / original_supply remain in the bin forever.
    Nobody can burn the MINIMUM_SHARE (they're not assigned to any user). If swap fees or
    donations inflated reserves before the withdrawal, the stranded amount could be material.
  attack_scenario: >
