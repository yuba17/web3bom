    2. Any user trying to mint into the active bin with a ratio that triggers composition
       fee will have their transaction revert.
    3. This creates a permanent DoS on the active bin for composition-fee mints.
    4. The attacker can manipulate the bin state to trigger this (via precise deposits/withdrawals).
