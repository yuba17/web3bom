invariants:

- id: CLPM-AC-01
  tier: 1
  type: property
  description: "Hook contract calling CLPoolManager directly bypasses ALL hook callbacks via shouldCall(). When msg.sender == address(hook), shouldCall returns false, so beforeSwap/afterSwap/beforeModifyLiquidity/afterModifyLiquidity are all skipped. A malicious hook can swap/add/remove liquidity without any of its own hook logic executing."
  attack_scenario: >
    A malicious hook contract is registered for a pool with beforeSwap and afterSwap enabled.
    The hook itself calls CLPoolManager.swap() directly. Because Hooks.shouldCall() checks
    `address(hook) != msg.sender` (Hooks.sol L72), it returns false — ALL hook callbacks are
    skipped. If the hook was supposed to enforce custom access control, fee logic, or position
    limits in beforeSwap/afterSwap, the hook bypasses its own protections. This is by design
    to prevent infinite recursion, but pools that RELY on hook callbacks for security invariants
    (e.g., whitelist enforcement, custom fee charging, position size limits) are silently
    unprotected when the hook itself acts as caller. The pool creator and LPs may not realize
    the hook can self-call and bypass all its own logic.
  impact: "Hook-enforced invariants (whitelists, fee overrides, position limits) can be bypassed by the hook contract itself calling the pool manager directly. Users who deposit into pools trusting the hook's restrictions could lose funds if the hook is malicious or compromised."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Test: if hook calls swap directly, shouldCall returns false
    // This verifies the bypass exists. In a real setup, deploy a hook that
    // calls poolManager.swap() from within its own code and verify no hook
    // callbacks fire.
    bool hookIsRegistered = key.parameters.hasOffsetEnabled(HOOKS_BEFORE_SWAP_OFFSET);
    bool hookIsCaller = (msg.sender == address(key.hooks));
    bool shouldCallResult = key.parameters.shouldCall(HOOKS_BEFORE_SWAP_OFFSET, key.hooks);
    // If hook is registered AND hook is caller, shouldCall MUST be false
    if (hookIsRegistered && hookIsCaller) {
        t(!shouldCallResult, "CLPM-AC-01: shouldCall must be false when hook is caller");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    This is by-design to prevent infinite recursion (hook calls swap -> beforeSwap calls hook
    -> hook calls swap -> ...). However the security implication is that ANY logic in hook
    callbacks is completely bypassable by the hook itself. This is a known Uniswap v4 pattern
    but worth flagging for pools where users trust hook-enforced restrictions. The real risk is
    for LPs who deposit assuming the hook enforces certain rules — a malicious/compromised hook
    can bypass them all.

- id: CLPM-AC-02
  tier: 1
  type: property
  description: "initialize() has no access control — anyone can create pools with arbitrary parameters including malicious hooks, extreme tick spacings (within bounds), and 100% LP fees."
  attack_scenario: >
    Anyone can call initialize() to create a pool with: (1) a malicious hook contract that
    steals from swappers/LPs via afterSwap/afterModifyLiquidity return deltas, (2) extreme
    but valid tick spacing (MAX_TICK_SPACING), (3) LP fee at exactly 100% (1_000_000) which
    takes the entire swap amount as fee. While each pool is identified by its PoolKey so users
    must opt-in, the risk is that a front-end or aggregator routes through these pools without
    adequate checks. The hook validation only checks that the bitmap matches the hook's
    self-reported bitmap — a malicious hook can report whatever bitmap it wants.
  impact: "Users routed through malicious pools via aggregators lose 100% of swap amount to fees or hook delta theft. No direct fund loss to existing pools — only to users who interact with attacker-created pools."
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Verify: initialize is callable by any address (no access restriction)
    // This is inherent — no modifier restricts caller on initialize()
    // The invariant checks that a pool with 100% fee can be created
    uint24 maxFee = LPFeeLibrary.ONE_HUNDRED_PERCENT_FEE; // 1_000_000
    // If pool is initialized with fee == 1_000_000, validate() passes
    // because validate checks self > maxFee (strict greater than)
    t(maxFee <= LPFeeLibrary.ONE_HUNDRED_PERCENT_FEE, "CLPM-AC-02: 100% fee is valid");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 85
  notes: >
    Permissionless pool creation is standard for Uniswap v4 forks. The 100% fee is validated
    as valid (fee <= ONE_HUNDRED_PERCENT_FEE passes). This is by design for CL pools but
    creates griefing vectors via aggregator routing. Low severity because users must opt-in
    to interact with these pools.

- id: CLPM-AC-03
  tier: 1
  type: property
  description: "paused() blocks addLiquidity (liquidityDelta > 0) and swap (whenNotPaused), but does NOT block removeLiquidity (liquidityDelta <= 0) or donate. Asymmetric pause creates inconsistent emergency behavior."
  attack_scenario: >
    When the owner pauses CLPoolManager: (1) swap() reverts via whenNotPaused modifier,
    (2) modifyLiquidity with liquidityDelta > 0 reverts via explicit check on line 148.
    BUT: modifyLiquidity with liquidityDelta <= 0 (remove liquidity) is NOT blocked —
    there's no paused() check for negative liquidityDelta. Also donate() has whenNotPaused
    but that blocks donations during pause. The asymmetry means during an emergency pause,
    LPs can still withdraw (which is good for user safety), but an attacker who found an
    exploit in the removeLiquidity path can still execute it during pause. If the pause was
    triggered BECAUSE of a removeLiquidity exploit, the pause doesn't help.
  impact: "If an exploit exists in the remove liquidity code path, pausing the contract does NOT prevent it. The emergency mechanism is ineffective for that class of bugs. This is likely intentional (let users withdraw during emergency) but creates a blind spot."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify asymmetric pause behavior
    // When paused: addLiquidity blocked, removeLiquidity allowed
    bool isPaused = paused();
    if (isPaused) {
        // liquidityDelta > 0 would revert (checked on line 148)
        // liquidityDelta <= 0 should still work
        // This invariant documents the asymmetry — not necessarily a bug
        t(true, "CLPM-AC-03: pause asymmetry documented");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 90
  notes: >
    This is almost certainly intentional — allowing withdrawals during emergency pause is
    standard DeFi practice (Aave, Compound do the same). However, donate() IS blocked during
    pause (via whenNotPaused), which is slightly inconsistent since donate is a deposit-like
    operation. The real question is whether any exploit in the removeLiquidity path exists
    that the pause was meant to stop. Marking as Low/Info.

- id: CLPM-AC-04
  tier: 1
  type: property
  description: "updateDynamicLPFee allows hook to set LP fee up to 100% (1_000_000). A compromised or malicious hook can set fee to 100%, making all subsequent swaps lose their entire input amount to fees."
  attack_scenario: >
    1. Pool is created with dynamic fee flag (fee == 0x800000).
    2. Hook calls updateDynamicLPFee(key, 1_000_000) — validation passes because
       validate() checks `self > maxFee` (strict), and 1_000_000 == ONE_HUNDRED_PERCENT_FEE.
    3. All subsequent swaps in this pool pay 100% LP fee — swapper receives 0 output tokens.
    4. The fee goes to LPs, but if the hook IS an LP (or colluding with one), they extract
       100% of all swap volume.
    Attack path: malicious hook deploys pool, adds liquidity, sets fee to 100%, then waits
    for aggregator routing or front-end to route swaps through the pool.
  impact: "Swappers routed to this pool lose 100% of input. LPs (controlled by attacker) extract all value. Up to the routed swap amount."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track that fee can reach 100%
    (,,, uint24 currentLpFee) = clPoolManager.getSlot0(poolId);
    // After updateDynamicLPFee(key, 1_000_000):
    lte(currentLpFee, LPFeeLibrary.ONE_HUNDRED_PERCENT_FEE, "CLPM-AC-04: fee within bounds");
    // The REAL check: if fee == 1_000_000, swapper gets 0 output
    if (currentLpFee == LPFeeLibrary.ONE_HUNDRED_PERCENT_FEE) {
        // This pool is extracting 100% of swap input as fee
        // Flag as suspicious but technically valid
        t(false, "CLPM-AC-04: 100% LP fee detected — all swap input goes to LPs");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 80
  notes: >
    The 100% fee cap for CL pools is explicitly documented in LPFeeLibrary (vs 10% for bin
    pools). This is by design. The access control on updateDynamicLPFee is correct — only
    the hook can call it, and only for dynamic fee pools. The risk is that users/aggregators
    don't verify the current fee before swapping. The hook's ability to change fee at any
    time (including front-running a large swap) is the real attack vector.

- id: CLPM-AC-05
  tier: 2
  type: property
  description: "Extsload exposes ALL storage slots of CLPoolManager to external reads — including the private `pools` mapping. Any contract or off-chain actor can read pool state, positions, tick data, and fee growth without going through getter functions."
  attack_scenario: >
    Extsload (inherited by CLPoolManager) exposes extsload(bytes32 slot) and
    extsload(bytes32[] slots) as external view functions with NO access control.
    An attacker can: (1) compute the storage slot for any pool's slot0 (sqrtPriceX96, tick,
    protocolFee, lpFee), (2) read position data for any user (liquidity, feeGrowthInside),
    (3) read tick bitmap and tick info. While all this data is already readable via public
    getters, Extsload allows reading data that has NO public getter — like internal accounting
    variables. This could leak information that helps an attacker craft MEV or sandwich
    attacks more precisely. Also, if any future upgrade adds sensitive storage (e.g., a nonce
    or authorization flag), Extsload would expose it immediately.
  impact: "Information leakage of all internal state. No direct fund loss, but enables more precise MEV extraction and sandwich attacks. Future storage additions are automatically exposed."
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Extsload is always available — no access control
    // Read the pools mapping slot for a known pool
    bytes32 poolSlot = keccak256(abi.encode(poolId, uint256(0))); // slot 0 is pools mapping
    bytes32 data = clPoolManager.extsload(poolSlot);
    // data contains slot0 packed data — always readable
    t(true, "CLPM-AC-05: extsload exposes all storage — info leak confirmed");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 90
  notes: >
    Extsload is a deliberate design choice (EIP-2930 pattern) used by Uniswap v4 and forks
    for gas-efficient state reads. This is NOT a bug — it's by design. However, marking it
    because: (1) the `pools` mapping is declared `private` which gives a false sense of
    encapsulation, (2) any future storage variable is automatically exposed. This is
    informational — not reportable as a vulnerability.

- id: CLPM-AC-06
  tier: 1
  type: property
  description: "collectProtocolFees is gated by protocolFeeController check but NOT by onlyOwner. If protocolFeeController is set to a malicious/compromised contract, it can drain all accrued protocol fees to any recipient."
  attack_scenario: >
    1. Owner calls setProtocolFeeController(maliciousController) — this IS onlyOwner gated.
    2. maliciousController calls collectProtocolFees(attacker, currency, 0) — passing amount=0
       triggers collection of ALL accrued fees: `amountCollected = protocolFeesAccrued[currency]`.
    3. All protocol fees are sent to attacker's address.

    The access control chain is: owner -> sets controller -> controller collects.
    This is a standard 2-step trust chain. The risk is: (a) owner sets a bad controller
    (admin trust issue), or (b) the controller contract itself has a vulnerability that allows
    unauthorized calls to collectProtocolFees.

    Also notable: collectProtocolFees does NOT validate that `amount <= protocolFeesAccrued[currency]`
    — the subtraction on line 93 would underflow and revert (Solidity 0.8.26), so there's no
    theft beyond accrued fees. But amount=0 collecting everything is a design choice worth noting.
  impact: "If protocolFeeController is compromised, all accrued protocol fees are drained. No user funds at risk — only protocol revenue."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: only protocolFeeController can call collectProtocolFees
    // AND owner can change protocolFeeController at any time
    address controller = address(clPoolManager.protocolFeeController());
    // If controller is compromised, all accrued fees are at risk
    uint256 accruedFee = clPoolManager.protocolFeesAccrued(currency);
    // After collectProtocolFees(attacker, currency, 0):
    uint256 accruedAfter = clPoolManager.protocolFeesAccrued(currency);
    if (msg.sender == controller) {
        eq(accruedAfter, 0, "CLPM-AC-06: amount=0 collects all fees");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    The 2-step trust chain (owner -> controller -> collect) is standard. The real risk is
    admin key compromise or a vulnerable controller contract. The amount=0 collecting
    everything is a convenience feature, not a bug. This is an admin trust issue — not
    reportable on most platforms unless the controller is a specific contract in scope with
    a vulnerability.

- id: CLPM-AC-07
  tier: 1
  type: property
  description: "Hook's beforeSwap can override LP fee on dynamic fee pools without upper bound check on the override value itself — only the final fee after removing override flag is validated. A hook returning fee with OVERRIDE_FEE_FLAG set but containing a value > ONE_HUNDRED_PERCENT_FEE after flag removal will revert, but a fee exactly at 100% passes."
  attack_scenario: >
    In CLHooks.beforeSwap (line 145-147), for dynamic fee pools, `result.parseFee()` extracts
    the fee from the hook's return value. This fee can have the OVERRIDE_FEE_FLAG (0x400000)
    set. The fee override is then passed to pool.swap() which calls
    `removeOverrideAndValidate(lpFeeOverride, ONE_HUNDRED_PERCENT_FEE)` — this removes the
    flag and validates. A hook can return 0x400000 | 1_000_000 = 0x4F4240, which after
    removing override flag becomes 0x0F4240 = 999_488... wait, let me recalculate.

    Actually: OVERRIDE_MASK = 0xBFFFFF. So fee & OVERRIDE_MASK removes bit 22.
    0x400000 | 1_000_000(=0x0F4240) = 0x4F4240. After & 0xBFFFFF = 0x0F4240 = 999_488.

    For exact 100%: 1_000_000 = 0x0F4240. With override: 0x4F4240. After mask: 0x0F4240 = 1_000_000.
    validate checks self > maxFee, so 1_000_000 > 1_000_000 is false — PASSES.

    So a hook CAN set a per-swap fee of exactly 100% via the override mechanism, extracting
    all swap input as LP fee. This could be used to front-run specific large swaps.
  impact: "Hook can dynamically set fee to 100% on a per-swap basis, potentially front-running large swaps to extract maximum value. The hook could selectively target only large swaps."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a swap, check if the effective fee was 100%
    // state.swapFee from the Swap event tells us the effective fee
    // If swapFee == 1_000_000, the swapper lost everything to fees
    if (state_swapFee == LPFeeLibrary.ONE_HUNDRED_PERCENT_FEE) {
        t(false, "CLPM-AC-07: swap executed with 100% fee via hook override");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 75
  notes: >
    The per-swap fee override is a powerful mechanism. Combined with CLPM-AC-01 (hook can
    bypass its own callbacks), a malicious hook has nearly unlimited control over the pool.
    The question is whether this is accepted risk (users trust the hook when they LP/swap
    in a hooked pool) or whether there should be a hard cap below 100%. Uniswap v4 has the
    same design.

- id: CLPM-AC-08
  tier: 2
  type: property
  description: "modifyLiquidity uses msg.sender as position owner unconditionally — no delegation mechanism. But since this is called via Vault, the msg.sender is always the Vault's caller (router/user), not an intermediary. Combined with hooks that can return hookDelta, the hook can effectively redirect LP tokens/value."
  attack_scenario: >
    In modifyLiquidity (line 158), `owner: msg.sender` means the position is always attributed
    to whoever called the pool manager. In Uniswap v4 architecture, users call through a
    router which calls the Vault which calls the PoolManager. The msg.sender at PoolManager
    level is the Vault (or router depending on architecture). If the architecture ensures
    msg.sender is the actual user, this is fine. But if msg.sender is a shared router contract,
    ALL positions would be attributed to the router, not individual users.

    The afterModifyLiquidity hook can return a hookDelta that modifies the callerDelta
    (line 106, 120: callerDelta = callerDelta - hookDelta). A malicious hook could return a
    hookDelta that reduces the LP's received tokens on removal, effectively stealing from LPs.
  impact: "If msg.sender at PoolManager level is a shared contract (router), position ownership is broken. Hook can steal from LPs via hookDelta manipulation."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Track that position owner matches the actual caller
    // After modifyLiquidity, the position should be owned by msg.sender
    address positionOwner = msg.sender; // this is what gets stored
    // Verify this is not a shared contract
    t(positionOwner != address(0), "CLPM-AC-08: position owner is not zero address");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    Need to verify who msg.sender is at the PoolManager level in PancakeSwap's architecture.
    In Uniswap v4, the PoolManager is called within a Vault.lock() callback, so msg.sender
    is the locker (usually a router or user's contract). The hookDelta manipulation is the
    more interesting vector — a hook returning large hookDelta can drain LPs. But users
    opt-in to hooked pools, so this is accepted risk.

false_positives:
- hunter: AccessHunter
  id: CLPM-FP-01
  reason: >
    Extsload exposing private storage is by design (EIP-2930/Extsload pattern). The `private`
    keyword on `pools` mapping only prevents Solidity-level access, not storage-level reads.
    This is a known and accepted pattern in Uniswap v4 and all forks. Not a vulnerability.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Extsload pattern in Uniswap v4 forks — `private` mapping does NOT mean storage is inaccessible. extsload() exposes all slots. Not a bug."
    briefing_update_applied: false

- hunter: AccessHunter
  id: CLPM-FP-02
  reason: >
    Permissionless initialize() is standard for Uniswap v4 / PancakeSwap Infinity. Anyone
    can create pools — this is by design. The pool key uniquely identifies each pool, so
    malicious pools don't affect legitimate ones. Users must opt-in to interact with any pool.
    Not a vulnerability — the risk is at the aggregator/front-end layer, not the protocol.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Permissionless pool creation in Uniswap v4 forks is by design. Malicious pools only affect users who interact with them. Don't flag as access control issue."
    briefing_update_applied: false

- hunter: AccessHunter
  id: CLPM-FP-03
  reason: >
    paused() not blocking removeLiquidity is intentional — during emergency, users MUST be
    able to withdraw their funds. Blocking withdrawals during a pause would be worse (users
    trapped in a potentially exploited contract). This follows standard DeFi emergency patterns
    (Aave, Compound, MakerDAO all allow withdrawals during pause).
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Asymmetric pause (block deposits, allow withdrawals) is standard DeFi practice. Not a bug — it's a safety feature."
    briefing_update_applied: false

