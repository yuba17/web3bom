- id: VV-W-14
  tier: 1
  type: property
  description: "Staked position fee exclusion creates arbitrage -- stake before price drop, unstake after, fees buffer the loss"
  attack_scenario: >
    _checkLoanIsHealthy at L1429 uses ignoreFees=true for staked positions.
    This means staked positions are valued WITHOUT accumulated fees.
    But when unstaked, fees are included in the valuation.

    An attacker can exploit this asymmetry:
    1. Have a position with large accumulated fees
    2. Position is unhealthy if fees excluded, healthy if fees included
    3. Unstake to include fees in valuation (healthy)
    4. Borrow max against the higher (fee-inclusive) valuation
    5. Stake again (fees excluded from health check)
    6. The position is now unhealthy (debt based on fee-inclusive value, health based on fee-exclusive)

    Wait: stakePosition at L1390-1393 checks health AFTER staking. So step 5 would revert
    if the position is unhealthy. But the timing window between unstake and restake
    allows borrowing against fees that disappear from the health calculation.
  impact: "Fee inclusion/exclusion asymmetry between staked/unstaked states creates arbitrage window for over-borrowing"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // For staked positions, verify that the health margin accounts for fee exclusion
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 5; i++) {
        uint256 tid = ghost_allTokenIds[i];
        (uint256 debt, uint256 fullValue, uint256 collateralValue,,) = vault.loanInfo(tid);
        if (debt > 0 && fullValue > 0) {
            // Health ratio should be > 1 with sufficient margin
            // If collateralValue is barely above debt, the fee exclusion matters
            if (collateralValue > 0) {
                uint256 healthRatio = collateralValue * 100 / debt;
                // If health ratio is between 100-105%, the fee exclusion could tip it
                if (healthRatio >= 100 && healthRatio <= 105) {
                    t(true, "VV-W-14: position at critical health margin -- fee exclusion risk");
                }
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 65
  notes: "The stakePosition health check (L1390-1393) should prevent this by verifying health post-stake. But the window is: unstake (fees visible) -> borrow max -> stake (fees hidden, health checked with buffer). The BORROW_SAFETY_BUFFER_X32 (95%) provides some margin. Need to verify if the buffer is sufficient to cover typical fee accumulation."
  poc_sketch: ''
  call_stack: ''

- id: VV-W-15
  tier: 1
  type: property
  description: "Liquidation sends collateral to recipient before cleaning up loan -- potential reentrancy via token callback"
  attack_scenario: >
    In liquidate() at L812-821:
    1. _sendPositionValue (L812) decreases liquidity and collects to recipient
    2. _cleanupLoan (L821) removes the loan

    The collect sends tokens to params.recipient. If recipient is a contract that
    implements token receive callbacks (e.g., ERC777 tokens or a contract with
    onERC1155Received if somehow involved), it could re-enter the vault.

    However: SafeERC20 is used for the main asset, and the collected tokens are
    Uniswap V3 pool tokens (not necessarily ERC777). The reentrancy guard is
    transformedTokenId != 0 check at L770 which blocks re-liquidation.
    But other functions like deposit/withdraw are NOT guarded by transformedTokenId.

    If the collected token0/token1 has a transfer callback (ERC777), the recipient
    could re-enter via deposit() to manipulate exchange rates before _cleanupLoan.
  impact: "Reentrancy during liquidation token collection could manipulate exchange rates before debt cleanup"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that loan cleanup is always consistent after liquidation
    if (ghost_liquidationInProgress && ghost_lastLiquidatedTokenId > 0) {
        (uint256 debtShares) = vault.loans(ghost_lastLiquidatedTokenId);
        eq(debtShares, 0, "VV-W-15: liquidated position still has debt shares");
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 40
  notes: "The standard Uniswap V3 collect sends ERC20 tokens which typically do not have transfer callbacks. However, if either token in the pair is ERC777 or has hooks, this becomes exploitable. The transformedTokenId guard only blocks transform/liquidate reentrancy, not deposit/withdraw. Low confidence because standard V3 pools use standard ERC20s."
  poc_sketch: ''
  call_stack: ''

false_positives:
- hunter: WildcardHunter
  id: VV-FP-W-01
  reason: >
    totalAssets() donation attack (VV-W-03) is likely mitigated by the reserves mechanism.
    A direct transfer increases balanceOf which increases reserves (balance + debt - lent),
    NOT the lend exchange rate. The donation goes to protocol reserves, not to share price.
    However, this needs verification that withdrawReserves cannot be called atomically
    after donation to extract the donated amount.
  investigated_at: '2026-03-24T00:00:00Z'
