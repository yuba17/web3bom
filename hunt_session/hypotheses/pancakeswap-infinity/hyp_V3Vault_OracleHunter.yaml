- id: VV-O-13
  tier: 1
  type: property
  description: "TWAP with twapSeconds=0 falls back to spot price (slot0), which is manipulable in a single tx. If any token is configured with Mode.TWAP and twapSeconds=0, the oracle is using instantaneous spot price without TWAP protection."
  attack_scenario: "Admin (or misconfigured deployment) sets twapSeconds=0 with Mode.TWAP. The _getReferencePoolPriceX96 function uses slot0 spot price directly. An attacker flash-loans tokens, manipulates the pool price, borrows against inflated collateral, then repays the flash loan. The maxPoolPriceDifference check may not catch this if the oracle-derived price itself comes from the manipulated spot price."
  impact: "Flash loan price manipulation allows borrowing against artificially inflated collateral values"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    // This is a configuration-level check -- verify oracle is not in pure spot mode
    // In fuzzing, we verify that position values don't swing wildly between calls
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 5; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        (uint256 shares) = vault.loans(tokenId);
        if (shares > 0) {
            (uint256 debt, uint256 fullValue,,,) = vault.loanInfo(tokenId);
            if (ghost_lastSharePrice > 0 && fullValue > 0) {
                // Position value should not change by more than 50% between consecutive checks
                // (generous bound to account for legitimate price moves)
                uint256 maxSwing = ghost_lastSharePrice * 3 / 2;
                lte(fullValue, maxSwing, "VV-O-13: position value swung >50% -- possible spot price manipulation");
            }
            if (fullValue > 0) {
                ghost_lastSharePrice = fullValue;
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 60
  notes: "V3Oracle._getReferencePoolPriceX96 with twapSeconds=0 uses (sqrtPriceX96,) = _getPoolSlot0(pool) directly. This is the spot price and is trivially manipulable with flash loans. The CHAINLINK_TWAP_VERIFY mode cross-checks against Chainlink, but TWAP mode alone with twapSeconds=0 has no protection."
  poc_sketch: ''
  call_stack: ''

- id: VV-O-14
  tier: 2
  type: property
  description: "Liquidation penalty fraction calculation must not underflow or produce zero penalty when fullValue is between maxPenaltyValue and startLiquidationValue"
  attack_scenario: "In _calculateLiquidation, when fullValue >= maxPenaltyValue and collateralValue > 0: penaltyFractionX96 = Q96 - ((fullValue - maxPenaltyValue) * Q96 / (startLiquidationValue - maxPenaltyValue)). If startLiquidationValue == maxPenaltyValue (possible when debt * fullValue / collateralValue == debt * 1.1), division by zero occurs. If startLiquidationValue < maxPenaltyValue, the subtraction underflows."
  impact: "Liquidation reverts due to arithmetic error, making underwater positions unliquidatable and creating bad debt"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        (uint256 debt, uint256 fullValue, uint256 collateralValue, uint256 liquidationCost, uint256 liquidationValue) = vault.loanInfo(tokenId);
        if (debt > 0 && collateralValue > 0 && fullValue > 0) {
            // If position is liquidatable, verify the calculation did not revert
            // by checking that loanInfo returned valid values
            if (liquidationCost > 0 || liquidationValue > 0) {
                // Penalty should be between MIN (2%) and MAX (10%)
                // liquidationValue = debt * (1 + penalty), so penalty = (liquidationValue - debt) / debt
                if (liquidationValue > debt) {
                    uint256 penaltyBps = (liquidationValue - debt) * 10000 / debt;
                    gte(penaltyBps, 200, "VV-O-14: liquidation penalty below 2% minimum");
                    lte(penaltyBps, 1000, "VV-O-14: liquidation penalty above 10% maximum");
                }
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 75
  notes: "The edge case is when startLiquidationValue approaches maxPenaltyValue. startLiquidationValue = debt * fullValue / collateralValue. With collateral factor at 90%, startLiquidationValue = debt * fullValue / (fullValue * 0.9) = debt / 0.9 = 1.111*debt. maxPenaltyValue = 1.1*debt. So startLiquidationValue > maxPenaltyValue always when factor < 100%. But with very low collateral factors, the gap shrinks."
  poc_sketch: ''
  call_stack: ''

