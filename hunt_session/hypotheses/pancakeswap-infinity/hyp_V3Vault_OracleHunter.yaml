  impact: "Borrower games staking/unstaking to manipulate health check outcomes"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that staked positions are not in a worse health state than expected
    // (ignoreFees reduces fullValue, so staked positions should have lower or equal fullValue)
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 5; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        (uint256 shares) = vault.loans(tokenId);
        if (shares > 0) {
            (uint256 debt, uint256 fullValue, uint256 collateralValue,,) = vault.loanInfo(tokenId);
            if (debt > 0 && collateralValue > 0) {
                // Basic sanity: position should not be in a state where it has debt but zero value
                gt(fullValue, 0, "VV-O-15: staked position with debt has zero value");
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 55
  notes: "ignoreFees=true means fees are excluded from valuation. This is conservative (lower value). The risk is the opposite direction: unstaking to INCLUDE fees as collateral. But unstakePosition in V3Vault re-checks health after unstaking, and the transform path also re-checks. So the protocol handles this correctly."
  poc_sketch: ''
  call_stack: ''

