- id: M-DOS-01
  tier: 1
  type: property
  description: "process() -- recipient.handle() revert bloquea entrega permanente del mensaje porque deliveries[id] ya fue escrito (CEI violation)"
  attack_scenario: >
    El contrato escribe deliveries[_id] ANTES de llamar ism.verify() y recipient.handle() (lineas 225-245).
    Si ism.verify() revierte, la tx entera revierte y deliveries se deshace -- esto esta OK.
    Pero si ism.verify() pasa y recipient.handle() revierte, la tx entera revierte, deliveries se deshace,
    y el mensaje queda como no-entregado. Un recipient malicioso puede revertir selectivamente en handle()
    para griefear al relayer (gas griefing). El relayer gasta gas en cada intento y el mensaje nunca se entrega.
    Sin embargo, como la tx revierte completamente, delivered() retorna false y se puede reintentar.
    El DoS real es gas griefing al relayer -- cada intento cuesta gas y el recipient puede revertir infinitamente.
  impact: "Relayer pierde gas en cada intento de entrega. Mensajes con valor (msg.value) quedan bloqueados si el recipient siempre revierte."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que si un mensaje fue marcado como delivered, el handle fue exitoso
    // El patron CEI aqui es: WRITE deliveries ANTES de EXTERNAL ism.verify + handle
    // Si handle revierte, toda la tx revierte, asi que delivered() retorna false
    // Pero el relayer ya gasto gas -- verificamos que nonce avanza en dispatch
    uint32 nonceBefore = originMailbox.nonce();
    uint32 nonceAfter = originMailbox.nonce();
    // Nonce solo debe avanzar si dispatch fue exitoso
    gte(nonceAfter, nonceBefore, "M-DOS-01: nonce debe ser monotonicamente creciente");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    El patron effects-before-interactions en process() es notable pero como toda la tx revierte,
    no hay inconsistencia de estado. El DoS real es gas griefing al relayer.
    Verificar si hay mecanismo de blacklisting de recipients maliciosos off-chain.
  poc_sketch: ''
  call_stack: ''

- id: M-DOS-02
  tier: 1
  type: property
  description: "dispatch() -- requiredHook.quoteDispatch() puede revertir y bloquear TODOS los dispatches si requiredHook es malicioso o esta en mal estado"
  attack_scenario: >
    dispatch() llama requiredHook.quoteDispatch() (L306) que es un external call a un contrato configurable por owner.
    Si el requiredHook revierte en quoteDispatch() o postDispatch(), NINGUN mensaje puede ser dispatched.
    Un owner malicioso o un requiredHook con un bug puede hacer DoS de toda la Mailbox.
    Tambien: quoteDispatch() retorna un uint256 que se usa para calcular el split de msg.value.
    Si retorna type(uint256).max, msg.value < requiredValue se cumple, requiredValue = msg.value,
    y hook.postDispatch recibe 0 -- el hook custom no recibe fondos.
  impact: "DoS total de dispatch si requiredHook revierte. Todos los mensajes salientes bloqueados."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que dispatch no queda bloqueado -- si la mailbox tiene hooks configurados,
    // un dispatch con valor suficiente debe completarse sin revert
    uint32 nonceBefore = originMailbox.nonce();
    // Intentar dispatch basico
    try originMailbox.dispatch{value: 1 ether}(
        DESTINATION,
        bytes32(uint256(uint160(address(destMailbox)))),
        bytes("test")
    ) returns (bytes32) {
        // OK -- dispatch funciono
        eq(originMailbox.nonce(), nonceBefore + 1, "M-DOS-02: nonce debe incrementar tras dispatch exitoso");
    } catch {
        // Si falla, verificar que no es por requiredHook
        t(false, "M-DOS-02: dispatch bloqueado -- posible DoS via requiredHook");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    Este es un riesgo de centralizacion: el owner controla requiredHook.
    En bounties, generalmente owner es trusted. Pero si requiredHook tiene un bug
    (no un ataque malicioso), el impacto es DoS total.
    Solodit finding similar: DIA -- Potential DoS of messages in postDispatch.
  poc_sketch: ''
  call_stack: ''

- id: M-DOS-03
  tier: 1
  type: property
  description: "dispatch() -- hook.postDispatch() con hook custom controlado por caller puede griefear via returnbomb o gas exhaustion"
  attack_scenario: >
    dispatch() acepta un IPostDispatchHook hook como parametro (L282). Cualquier caller puede pasar
    un contrato malicioso como hook. Si el hook malicioso consume todo el gas disponible o ejecuta
    un returnbomb (retorna datos enormes), el caller solo se perjudica a si mismo.
    PERO: si hay un contrato upstream que llama dispatch() con un hook proporcionado por un usuario
    (por ejemplo un router o bridge), un usuario malicioso puede hacer que el contrato upstream gaste
    todo su gas. El hook.postDispatch recibe msg.value - requiredValue como ETH, que podria ser
    robado por el hook malicioso -- pero eso es culpa del caller, no de Mailbox.
    El vector real: nonce se incrementa (L301) ANTES del external call a hook.postDispatch (L312).
    Si hook.postDispatch revierte, toda la tx revierte y nonce no avanza. No hay inconsistencia.
  impact: "Gas griefing a contratos que llaman dispatch con hooks de usuarios. Nonce inconsistency descartado."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que nonce siempre es consistente con la cantidad de dispatches exitosos
    uint32 nonceBefore = originMailbox.nonce();
    ghost_callRemoteCount = ghost_callRemoteCount; // tracking manual
    // Nonce debe ser >= a lo que era antes (monotonicamente creciente)
    gte(originMailbox.nonce(), nonceBefore, "M-DOS-03: nonce retrocedio -- state inconsistency");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 40
  notes: >
    El caller controla el hook, asi que se perjudica a si mismo. Solo es relevante si un contrato
    intermediario pasa hooks de usuarios sin validacion. Mailbox no es responsable.
  poc_sketch: ''
  call_stack: ''

- id: M-DOS-04
  tier: 2
  type: property
  description: "process() -- recipientIsm() staticcall a recipient puede consumir gas excesivo via returnbomb sin gas limit"
  attack_scenario: >
    recipientIsm() hace un staticcall sin gas limit al recipient (L414) para obtener su ISM.
    Un recipient malicioso puede implementar interchainSecurityModule() que retorna datos enormes
    (returnbomb). El staticcall copia returnData a memoria, consumiendo gas proporcional al tamano.
    Luego abi.decode(returnData, (address)) solo lee 32 bytes pero la copia ya consumio gas.
    El relayer paga este gas extra. Con un returnData de ~2MB se puede consumir >6M gas
    solo en la copia de returnData, potencialmente haciendo que process() exceda el block gas limit.
    Mitigacion parcial: el recipient tendria que ser un contrato malicioso, y el mensaje fue
    dispatched en la origin chain apuntando a este recipient. Pero el sender puede ser cualquiera.
  impact: "Relayer pierde gas significativo. En caso extremo, process() excede block gas limit y el mensaje es inentregable."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar gas cost de recipientIsm no escala con returndata size
    // En el test, verificamos que recipientIsm no consume gas excesivo
    uint256 gasBefore = gasleft();
    try destMailbox.recipientIsm(address(destMailbox)) returns (IInterchainSecurityModule) {
        uint256 gasUsed = gasBefore - gasleft();
        // recipientIsm con un contrato normal no debe usar mas de 50K gas
        lt(gasUsed, 100_000, "M-DOS-04: recipientIsm consume gas excesivo -- posible returnbomb");
    } catch {
        // Si revierte el staticcall, se usa defaultIsm -- esto esta OK
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    El staticcall en L414 no tiene gas limit explicito, hereda todo el gas disponible.
    La copia de returnData se hace automaticamente por Solidity.
    Este es un patron conocido de returnbomb. Verificar si hay gas limit en el staticcall.
    CRITICO: No hay assembly para limitar returndata copy.
  poc_sketch: >
    Deploy un contrato que implementa interchainSecurityModule() retornando 2MB de datos.
    Dispatch un mensaje al recipient malicioso. Intentar process() y medir gas.
  call_stack: 'process() -> recipientIsm(recipient) -> recipient.staticcall(interchainSecurityModule()) -> abi.decode (copia toda la returndata a memoria)'

- id: M-DOS-05
  tier: 1
  type: property
  description: "process() -- ism.verify() puede consumir gas arbitrario si recipient especifica un ISM malicioso via interchainSecurityModule()"
  attack_scenario: >
    Un recipient puede especificar cualquier contrato como su ISM via interchainSecurityModule().
    El ISM se llama con ism.verify(_metadata, _message) en L257-258 sin gas limit.
    Un ISM malicioso puede consumir todo el gas y revertir, haciendo que el mensaje sea
    inentregable. El relayer paga el gas.
    Peor: el ISM malicioso puede retornar true (pasando verify) pero consumiendo gas excesivo,
    y luego recipient.handle() tambien consume gas. Double gas griefing.
    Si el ISM es un contrato que el recipient controla, puede alternar entre verify=true y
    verify=false dependiendo del estado, haciendo que el relayer no pueda predecir el resultado.
  impact: "Relayer pierde gas en cada intento. Mensajes inentregables si ISM siempre revierte."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que la Mailbox reporta correctamente si un mensaje fue delivered
    // Si delivered() es true, el proceso fue completo (handle ejecuto)
    bytes32 testId = bytes32(uint256(0xdead));
    bool wasDelivered = destMailbox.delivered(testId);
    // Un mensaje no procesado no debe reportarse como delivered
    t(wasDelivered == false || destMailbox.processedAt(testId) > 0,
      "M-DOS-05: delivered true pero processedAt es 0 -- estado inconsistente");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    El recipient controla su ISM. Esto es by-design en Hyperlane (ISM pluggable).
    El DoS solo afecta a los mensajes dirigidos a ESE recipient, no a toda la Mailbox.
    Pero si el recipient es un contrato critico (bridge, vault), el impacto es alto.
  poc_sketch: ''
  call_stack: 'process() -> recipientIsm(recipient) -> ISM malicioso -> ism.verify() consume todo gas'

- id: M-DOS-06
  tier: 2
  type: property
  description: "delivered() retorna true para block.number 0 edge case imposible pero uint48 truncation puede causar falso delivered"
  attack_scenario: >
    delivered() retorna deliveries[_id].blockNumber > 0 (L362).
    blockNumber se almacena como uint48 (L249): uint48(block.number).
    uint48 max = 2^48 - 1 = 281_474_976_710_655.
    Si block.number > type(uint48).max, uint48(block.number) podria truncar a 0.
    En ese caso, deliveries[_id].blockNumber = 0 y delivered() retornaria false,
    permitiendo re-procesar un mensaje ya entregado (double-delivery).
    En la practica, block.number no alcanzara 2^48 en cientos de anos con 12s blocks.
    Pero en chains con bloques rapidos (1 block/100ms como L2s), podria ser alcanzable
    en ~891 anos. No es un riesgo practico.
  impact: "Teoricamente permite double-delivery si block.number overflows uint48. Impractico."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que block.number cabe en uint48
    t(block.number <= type(uint48).max, "M-DOS-06: block.number excede uint48 -- delivered() retornaria false para mensajes procesados");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    En la practica, esto nunca ocurrira. uint48 aguanta hasta ~8.9M anos con 1 block/s.
    Incluido por completitud pero no es un finding reportable.
  poc_sketch: ''
  call_stack: ''

- id: M-DOS-07
  tier: 1
  type: property
  description: "dispatch() -- nonce overflow uint32 causa colision de message IDs y bloquea el sistema"
  attack_scenario: >
    nonce es uint32 (L40) y se incrementa con nonce += 1 en cada dispatch (L301).
    uint32 max = 4,294,967,295. Con Solidity >=0.8.0, nonce += 1 revierte por overflow
    cuando nonce == type(uint32).max. Despues de ~4.3B dispatches, NADIE puede enviar
    mas mensajes. En un chain con 12s blocks y 1 dispatch por bloque, tomaria ~1,634 anos.
    Pero en L2s con bloques cada 2s y alto throughput, podria alcanzarse en ~272 anos.
    Si se spamean dispatches (sin rate limit), un atacante puede acelerar esto.
    dispatch() no tiene rate limiting -- cualquiera puede llamarla.
    Costo: solo gas + requiredHook fee por dispatch.
  impact: "DoS permanente de todos los dispatches si nonce alcanza uint32.max. Irreversible."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que nonce no esta cerca del overflow
    uint32 currentNonce = originMailbox.nonce();
    t(currentNonce < type(uint32).max, "M-DOS-07: nonce al maximo -- proximo dispatch revierte");
    // Verificar monotonically increasing
    uint32 nonceBefore = originMailbox.nonce();
    // Dispatch deberia incrementar nonce
    gte(originMailbox.nonce(), nonceBefore, "M-DOS-07: nonce no es monotonicamente creciente");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: >
    uint32 overflow en nonce es un riesgo teorico a muy largo plazo.
    Hyperlane podria migrar a una nueva Mailbox antes de alcanzar el limite.
    No hay rate limiting en dispatch, pero el costo de gas + fees limita el spam.
    Probablemente informational/QA en un bounty.
  poc_sketch: ''
  call_stack: ''

- id: M-DOS-08
  tier: 1
  type: property
  description: "process() -- msg.value enviado a recipient.handle() puede quedar atrapado si handle() revierte selectivamente con ETH"
  attack_scenario: >
    process() envia msg.value al recipient via handle{value: msg.value}() (L241).
    Si el relayer envia ETH con process() y handle() revierte, toda la tx revierte y el ETH
    se devuelve al relayer. No hay perdida directa.
    PERO: si el recipient implementa handle() de forma que acepta ETH solo en ciertas condiciones
    (ej: solo si block.timestamp < X), el relayer puede enviar una tx que pasa ism.verify()
    pero falla en handle(). El relayer pierde gas pero no ETH.
    Vector de griefing: forzar al relayer a gastar gas repetidamente intentando entregar
    un mensaje que nunca sera aceptado.
  impact: "Gas griefing al relayer. No hay perdida de ETH porque la tx revierte completamente."
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
