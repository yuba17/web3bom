- id: M-DOS-09
  tier: 2
  type: property
  description: "quoteDispatch() puede revertir si requiredHook o defaultHook revierten en quoteDispatch -- callers no pueden estimar fees"
  attack_scenario: >
    quoteDispatch() suma requiredHook.quoteDispatch() + hook.quoteDispatch() (L352-353).
    Si alguno revierte, quoteDispatch() revierte. Los callers no pueden estimar el fee
    necesario para dispatch(). Si no saben cuanto enviar, no pueden dispatchar.
    Esto es DoS indirecto: la Mailbox funciona pero los usuarios no pueden calcular el fee.
    Ademas: si la suma de ambos quotes causa overflow (requiredHook retorna near-max uint256),
    la suma revierte y quoteDispatch() es inutilizable.
  impact: "Usuarios no pueden estimar fees. dispatch() aun funciona si adivinan el valor correcto."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que quoteDispatch no revierte para un dispatch valido
    try originMailbox.quoteDispatch(
        DESTINATION,
        bytes32(uint256(uint160(address(destMailbox)))),
        bytes("test")
    ) returns (uint256 fee) {
        // OK -- quote funciona
        gte(fee, 0, "M-DOS-09: fee negativo imposible en uint256");
    } catch {
        t(false, "M-DOS-09: quoteDispatch revierte -- usuarios no pueden estimar fees");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    Si el requiredHook esta mal configurado, quoteDispatch() puede revertir.
    Pero dispatch() con msg.value < requiredValue asigna requiredValue = msg.value (L308-309),
    asi que dispatch() no revierte por el mismo problema. Solo quoteDispatch() sufre.
  poc_sketch: ''
  call_stack: ''

false_positives:
- hunter: DoSHunter
  id: M-DOS-FP-01
  reason: >
    El patron effects-before-interactions en process() (escribir deliveries antes de verify+handle)
    parece un bug CEI pero no lo es: si verify o handle revierten, toda la tx revierte y
    deliveries se deshace. No hay estado inconsistente. Es un false positive comun en auditorias.
  investigated_at: '2026-03-24T18:30:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: >
      Mailbox.process() escribe deliveries ANTES de ism.verify() y recipient.handle(), pero
      como toda la tx revierte si alguno falla, no hay CEI violation real. Solo gas griefing
      al relayer, no state inconsistency.
    briefing_update_applied: false

- hunter: DoSHunter
  id: M-DOS-FP-02
  reason: >
    dispatch() permite hook=address(0) que se reemplaza por defaultHook (L284-286).
    Parece que podria causar DoS si defaultHook no esta configurado, pero setDefaultHook()
    requiere Address.isContract(), asi que defaultHook siempre es un contrato valido
    despues de initialize(). No es un vector de DoS.
  investigated_at: '2026-03-24T18:30:00Z'
  pending_briefing_update:
    action: none
    briefing: ''
    content: ''
