      Hook address determines permisos via shouldCall() and bitmap in parameters.
    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-02
  reason: >
    activeId=0 as initialization sentinel is safe. initialize() calls
    PriceHelper.getPriceFromId(0, binStep) which computes base.pow(-8388608).
    In Uint128x128Math.pow(), absY >= 0x100000, the bit-shifting loop is skipped,
    result stays 0, and line 153 reverts with Uint128x128Math__PowUnderflow.
    Therefore activeId=0 cannot be set, and the sentinel is safe.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

