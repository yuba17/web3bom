    relevant to BinPoolManager because it never handles token transfers. All token
    accounting is via BalanceDelta + vault settlement. BinPoolManager only tracks
    internal accounting (reserves, shares). Token transfer issues are vault-level concerns.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: >
      PCS Infinity BinPoolManager does not handle token transfers — all settlement
