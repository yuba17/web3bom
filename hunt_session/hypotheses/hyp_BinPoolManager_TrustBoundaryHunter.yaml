    briefing_update_applied: false

- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-04
  reason: >
    PoolKey passed by memory in swap/mint/burn — seems like caller could falsify the key.
    But PoolId = keccak256(abi.encode(key)), so any modification produces a different PoolId
    pointing to a non-initialized pool (reverts on checkPoolInitialized). Not exploitable.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-05
  reason: >
    Reentrancy via hook callbacks into BinPoolManager: hooks execute within the vault lock
    context. The vault enforces single-entrant locking (LockerAlreadySet revert). However,
    within the SAME lock context, the hook CAN call BinPoolManager functions directly
    (they only check isLocked, not reentrancy). This is by-design — hooks are trusted
    and expected to interact with the pool manager. The settlement invariant at lock
    release ensures all accounting nets to zero regardless of call ordering.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
