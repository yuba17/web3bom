- id: BPM-TB-01
  tier: 1
  type: property
  description: "Hook afterSwap/afterMint/afterBurn hookDelta conservation: callerDelta + hookDelta must equal the raw pool delta — vault settles them independently, so violation means fund extraction"
  attack_scenario: >
    In BinHooks.afterSwap (line 213): delta = delta - hookDelta. The vault then settles
    callerDelta for msg.sender and hookDelta for hook address independently via
    accountAppDeltaWithHookDelta. The conservation holds algebraically because
    callerDelta = rawDelta - hookDelta, so callerDelta + hookDelta = rawDelta.
    BUT: the vault.accountAppBalanceDelta with hookDelta sums (delta0 + hookDelta0)
    for _accountDeltaForApp (reservesOfApp), which IS conserved. The separate
    SettlementGuard.accountDelta calls track (settler, delta) and (hook, hookDelta)
    independently. The settlement invariant requires ALL deltas to net zero at lock release.
    A malicious hook can return arbitrary hookDelta, but the caller must pay the difference.
    Real risk: if hookDelta is crafted so that caller gets a credit (positive delta, meaning
    vault owes caller) while hook also gets credit, the pool's reservesOfApp would underflow
    (revert). If hookDelta is negative (hook pays), it must be settled by the hook or the
    lock release will revert on unsettled deltas. The invariant is: for each operation,
    sum of all delta0 changes to _accountDeltaForApp == 0.
  impact: "Hook could attempt fund extraction but vault's reservesOfApp arithmetic underflow protects against it"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Conservation invariant: after swap/mint/burn, the pool's reservesOfApp
    // must not decrease by more than what was actually withdrawn
    uint256 vaultReserve0_before = vault.reservesOfApp(address(binPoolManager), currency0);
    uint256 vaultReserve0_after = vault.reservesOfApp(address(binPoolManager), currency0);
    // delta + hookDelta applied to reservesOfApp must conserve
    // The vault does: _accountDeltaForApp(currency0, delta0 + hookDelta0)
    // So if delta0 + hookDelta0 > 0 (pool is owed), reservesOfApp decreases
    // If delta0 + hookDelta0 < 0 (pool owes), reservesOfApp increases
    // Conservation: sum(bin reserves) <= reservesOfApp always
    t(true, "BPM-TB-01: delta conservation check requires pre/post operation snapshot");
  ghost_vars:
    - "uint256 internal ghost_vaultReserve0_before;"
    - "uint256 internal ghost_vaultReserve1_before;"
  validated: false
  priority: high
  confidence: 70
  notes: >
    Algebraically, the delta conservation holds because callerDelta = rawDelta - hookDelta.
    The vault sums delta + hookDelta for reservesOfApp, which equals rawDelta.
    The individual settlement tracking (caller vs hook) is separate.
    The real protection is that the vault's reservesOfApp uses uint256, so underflow reverts.
    A hook cannot extract more than what the pool has. BUT: the hook can shift costs from
    itself to the caller (caller pays more, hook pays less). This is by-design for hooks.

- id: BPM-TB-02
  tier: 1
  type: property
  description: "beforeSwap hook can reduce amountToSwap to exactly zero, bypassing the amountSpecified==0 early check and producing a no-op swap that still emits events and triggers afterSwap"
  attack_scenario: >
    BinPoolManager.swap() line 164 checks amountSpecified==0 and reverts. But after
    beforeSwap hook (line 170), amountToSwap can be modified. In BinHooks.beforeSwap
    line 180: amountToSwap += hookDeltaSpecified. Line 181 only reverts if the sign
    flips (exactInput becomes positive, or exactOutput becomes negative). amountToSwap==0
    exactly passes through. BinPool.swap line 132 returns early with zero delta.
    The hook's beforeSwapDelta is then processed in afterSwap, where hookDeltaSpecified
    contributes to hookDelta. Net effect: hook absorbs the full swap amount via
    beforeSwapDelta, pool does nothing, caller pays the hook's delta. A malicious hook
    could use this to steal the full swap input with no actual swap execution.
    However: hooks are trusted by design. The question is whether this creates an
    unexpected asymmetry vs the documented behavior.
  impact: "Hook can intercept full swap amount with no pool execution — trusted hook design issue"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After swap, if amountToSwap was zeroed by hook, the pool delta is zero
    // but the hook delta may be non-zero — verify accounting
    if (ghost_amountSpecified != 0) {
        // If delta is zero but amountSpecified was non-zero, hook absorbed everything
        bool deltaIsZero = (delta.amount0() == 0 && delta.amount1() == 0);
        if (deltaIsZero) {
            // This is only OK if hookDelta accounts for the full amount
            t(false, "BPM-TB-02: zero pool delta with non-zero amountSpecified — hook intercept");
        }
    }
  ghost_vars:
    - "int128 internal ghost_amountSpecified;"
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is by-design for hooks — the HOOKS_BEFORE_SWAP_RETURNS_DELTA_OFFSET flag
    explicitly allows hooks to modify swap amounts. Users interacting with a pool
    that has this flag enabled accept the trust assumption. However, this creates a
    non-obvious attack surface if users don't understand the hook permissions.

- id: BPM-TB-03
  tier: 2
  type: property
  description: "burn() lacks whenNotPaused modifier — attackers can withdraw manipulated positions during emergency pause, after swap/mint are blocked"
  attack_scenario: >
    swap() (line 161), mint() (line 209), donate() (line 263) have whenNotPaused.
    burn() (line 249) does NOT. Scenario: 1) Attacker manipulates oracle/reserves
    via swap. 2) Owner detects and pauses contract. 3) Attacker still calls burn()
    to withdraw inflated share value. Since swap is paused, no further manipulation
    is possible, but the already-inflated positions can still be cashed out.
    Counter: this is likely by-design (users should always exit). The question is
    whether the emergency response model accounts for this gap.
  impact: "Attacker can cash out manipulated positions even after owner pauses the contract"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    bool isPaused = binPoolManager.paused();
    if (isPaused) {
        // burn should be callable (by design) — but verify reserves are not inflated
        // In practice, this is a design review point, not a runtime invariant
        t(true, "BPM-TB-03: burn callable while paused — design review needed");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Likely by-design (same as Uniswap v4 removeLiquidity). Users should always be
    able to exit. The real mitigation is that pausing stops further manipulation
    (no more swaps to inflate reserves). Existing positions reflect actual reserves.

- id: BPM-TB-04
  tier: 1
  type: property
  description: "protocolFeeController can be changed instantly by owner without timelock — new controller can immediately set max fees (0.4%) and drain accumulated fees via collectProtocolFees"
  attack_scenario: >
    1) Owner calls setProtocolFeeController(maliciousController). No timelock.
    2) maliciousController calls setProtocolFee(key, maxFee=4000|4000<<12) on every pool.
    3) All subsequent swaps pay 0.4% protocol fee.
    4) maliciousController calls collectProtocolFees() to drain fees.
    Impact limited by MAX_PROTOCOL_FEE = 0.4%. But with sufficient volume,
    this is a significant revenue extraction. Also: the old controller's accumulated
    fees are still claimable by the old controller because collectProtocolFees checks
    msg.sender == protocolFeeController, so after the change, only the new controller
    can claim. If the old controller had uncollected fees, they're effectively locked
    (can only be claimed by the new controller).
  impact: "Owner/compromised-key can extract 0.4% of all swap volume without timelock delay"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify protocol fee never exceeds MAX_PROTOCOL_FEE per direction
    (uint24 activeId, uint24 protocolFee, uint24 lpFee) = binPoolManager.getSlot0(poolId);
    uint16 fee0 = uint16(protocolFee & 0xfff);
    uint16 fee1 = uint16(protocolFee >> 12);
    lte(uint256(fee0), 4000, "BPM-TB-04: protocol fee 0->1 exceeds max");
    lte(uint256(fee1), 4000, "BPM-TB-04: protocol fee 1->0 exceeds max");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Standard centralization risk. MAX_PROTOCOL_FEE limits damage to 0.4% per swap.
    Verify if owner has timelock in deployment — if yes, this is mitigated.
    If no timelock, this is a valid centralization finding (likely Low/Info on most platforms).

- id: BPM-TB-05
  tier: 1
  type: property
  description: "beforeDonate hook executes BEFORE minBinShareForDonate check — hook could manipulate active bin shares between hook call and validation, either DoSing donations or bypassing the protection"
  attack_scenario: >
    donate() execution order: 1) checkPoolInitialized (line 288). 2) BinHooks.beforeDonate
    (line 290). 3) Read pool.shareOfBin[activeId] and check >= minBinShareForDonate (lines 293-296).
    4) pool.donate (line 298). If the beforeDonate hook can trigger a burn of the active bin's
    shares (reentrancy), the share could drop below minBinShareForDonate between steps 2 and 3.
    However: vault locking prevents reentrancy. The hook runs within the same lock context,
    and vault.lock enforces single-entrant. But the hook COULD call burn() on the pool manager
    directly (it's within the same lock). BinPoolManager.burn has no reentrancy guard beyond
    the vault lock (which is already held). So: hook calls BinPoolManager.burn() in
    beforeDonate → shares decrease → donate's share check fails → DoS.
    Conversely: hook mints before the check → shares increase → bypasses minimum.
  impact: "Hook can DoS donations by burning active bin shares, or bypass minBinShareForDonate by minting"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track active bin shares before and after donate to detect hook manipulation
    uint24 activeId = pools[poolId].slot0.activeId();
    uint256 sharesBefore = pools[poolId].shareOfBin[activeId];
    // ... donate happens ...
    uint256 sharesAfter = pools[poolId].shareOfBin[activeId];
    // shares should only change by the donate itself (donate doesn't change shares)
    eq(sharesBefore, sharesAfter, "BPM-TB-05: active bin shares changed during donate");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    Key question: can a hook call BinPoolManager.burn() within the beforeDonate callback?
    The vault lock is already held (single-entrant), but BinPoolManager functions don't
    check if they're being called recursively — they only need the vault to be locked.
    If the hook IS the msg.sender of the outer vault.lock(), it can call BinPoolManager
    functions directly. But hooks are trusted by design, so this is expected behavior.
    The finding is that the ordering (hook before check) creates an exploitable window,
    but only for the trusted hook. For pools without hooks, this is not relevant.

