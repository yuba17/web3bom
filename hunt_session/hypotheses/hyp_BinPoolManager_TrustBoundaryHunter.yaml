- id: BPM-TB-09
  tier: 1
  type: property
  description: "Vault↔PoolManager trust boundary: BinPoolManager reports deltas to vault without vault cross-checking against pool reserves — a bug in BinPool math could report incorrect deltas"
  attack_scenario: >
    BinPoolManager calls vault.accountAppDeltaWithHookDelta or vault.accountAppBalanceDelta
    after each operation. The vault trusts the reported deltas entirely — it only checks:
    1) msg.sender is registered app (onlyRegisteredApp)
    2) vault is locked (isLocked)
    The vault does NOT verify that the reported delta matches the actual pool state change.
    If BinPool.swap has a math bug in getAmountsOut/getAmountsIn (e.g., overflow in
    PackedUint128Math operations, incorrect price calculation), the delta reported to
    vault could give the trader more tokens than the pool actually has.
    The vault's reservesOfApp[poolManager] would decrease (underflow protection via uint256
    arithmetic), but individual bins could have their reserves drained beyond what was
    actually deposited. Critical invariant: for every currency, sum of all bin reserves
    for that currency across all pools <= vault.reservesOfApp[binPoolManager][currency].
  impact: "Math bug in BinPool could cause incorrect deltas, draining pool reserves via vault settlement"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Fundamental solvency invariant: vault reserves >= sum of all bin reserves
    // This requires iterating all bins which is gas-prohibitive on-chain
    // Approximate: after each operation, vault reserves should not decrease more than the delta
    uint256 vaultRes0 = vault.reservesOfApp(address(binPoolManager), currency0);
    uint256 vaultRes1 = vault.reservesOfApp(address(binPoolManager), currency1);
    gte(vaultRes0, 0, "BPM-TB-09: vault reserves for currency0 should be non-negative");
    gte(vaultRes1, 0, "BPM-TB-09: vault reserves for currency1 should be non-negative");
  ghost_vars:
    - "uint256 internal ghost_cumulativeSwapIn0;"
    - "uint256 internal ghost_cumulativeSwapOut0;"
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is the fundamental trust boundary between Vault and PoolManager.
    The Vault's reservesOfApp underflow protection (uint256) is the last line of defense.
    If a BinPool math function returns inflated output amounts, the vault will attempt
    to reduce reservesOfApp by that amount — if it underflows, the tx reverts.
    So the system fails-safe (revert) rather than fails-open (drain).
    The real risk is subtle bugs that don't cause underflow but shift value unfairly.

- id: BPM-TB-10
  tier: 2
  type: property
  description: "minBinShareForDonate default (2^128) is settable by owner to 0 — if reduced, first-depositor donation attack becomes viable on bins with only MINIMUM_SHARE"
  attack_scenario: >
    Default minBinShareForDonate = 2^128, making donate() practically unusable on normal bins.
    Owner can call setMinBinSharesForDonate(0) to allow donations to any bin.
    Attack if minBinShareForDonate is lowered:
    1) Wait for a bin where all LPs withdrew, leaving only MINIMUM_SHARE (1e3) locked.
    2) Donate a large amount to that bin, inflating reserves per share enormously.
    3) When a new user mints into that bin, their shares are calculated based on
       inflated reserves, giving them far fewer shares than expected.
    4) The locked MINIMUM_SHARE absorbs all the donated value.
    The BinPool._addShare deducts MINIMUM_SHARE (1e3) from first depositor (line 503),
    which is the existing mitigation against share inflation.
    Question: is MINIMUM_SHARE = 1e3 sufficient protection against donation attacks
    when combined with lowered minBinShareForDonate?
  impact: "If owner reduces minBinShareForDonate, share inflation attack via donate becomes viable"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 minShare = binPoolManager.minBinShareForDonate();
    // Default is 2^128 — very protective
    // If reduced below a safe threshold, donation attacks are possible
    gte(minShare, 1e3, "BPM-TB-10: minBinShareForDonate dangerously low");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The MINIMUM_SHARE = 1e3 deduction in _addShare is designed to prevent share inflation.
    Whether 1e3 is sufficient depends on token decimals. For 18-decimal tokens,
    1e3 shares represent 1e-15 tokens — trivially small. A donation of 1e18 tokens
    to a bin with 1e3 shares would create 1e15 value per share, making new depositors
    receive dust shares for significant deposits. The current 2^128 threshold prevents
    this entirely. The finding is about the owner's ability to lower it.

false_positives:
- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-01
  reason: >
    Hooks are fully trusted by design in PCS Infinity (same as Uniswap v4).
    A malicious hook can manipulate fees, deltas, and state. This is the intended
    trust model — users who enter a hooked pool accept the hook's trust assumptions.
    The hook address determines permissions via shouldCall() and the bitmap in parameters.
    Do not report hook trust as a finding.
  investigated_at: '2026-03-23T00:00:00Z'
