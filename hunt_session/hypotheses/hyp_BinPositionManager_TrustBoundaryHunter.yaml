  attack_scenario: >
    A contract or integration calls modifyLiquiditiesWithoutLock to add/remove liquidity. Since
    there is no deadline parameter, the transaction can sit in the mempool indefinitely and be
    executed when market conditions have changed significantly. For addLiquidity, the
    amountMax slippage check provides some protection. For removeLiquidity, amount0Min/amount1Min
    provide protection. But the activeId slippage check (idSlippage) is based on the activeId
    at execution time vs activeIdDesired at submission time — without a deadline, the activeId
    could have moved far beyond idSlippage range and then moved back, making the check pass
    but at a different price level than intended. However, modifyLiquiditiesWithoutLock is
    designed for composability (called by other contracts that already have their own deadline).
  impact: "Stale transactions executed at unfavorable prices, potential value extraction from LP"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // This is a design choice — modifyLiquiditiesWithoutLock trusts the caller to enforce deadlines
    // Invariant: if modifyLiquiditiesWithoutLock is called directly by an EOA, there's no deadline protection
    // We can't test this as a property invariant easily — it's a design observation
    // But we can verify that amountMax/amountMin slippage checks still work
    t(ghost_slippageCheckPassed, "BPM-TB-07: slippage check must still be enforced without deadline");
  ghost_vars:
  - bool internal ghost_slippageCheckPassed;
  validated: false
  priority: medium
  confidence: 50
  notes: >
    This is likely by design. The function is meant for contract-to-contract composability where
