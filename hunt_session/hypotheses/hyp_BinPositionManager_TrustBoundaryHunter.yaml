- id: BPM-TB-08
  tier: 1
  type: property
  description: "cachePoolKey only stores the poolKey on first use (when binStep == 0). If the same poolId maps to two different poolKeys (hash collision or a bug in toId()), the second poolKey is silently ignored — positions() returns stale/wrong poolKey data."
  attack_scenario: >
    PoolId is computed as keccak256 of the PoolKey struct. If two different PoolKeys hash to the
    same PoolId (practically impossible with keccak256), the second one's poolKey would not be
    cached. More realistically: if the pool parameters change (e.g., via governance or pool
    migration), the cached poolKey would be stale. The getBinStep() == 0 check assumes that
    a valid pool always has binStep > 0. If a pool could have binStep == 0 (unlikely but
    depends on BinPoolParametersHelper), the poolKey would be overwritten on every call.
    The practical risk: the positions() view function returns the cached poolKey, which could
    be stale if the pool was somehow reconfigured. However, PoolKey in Uniswap v4 / PCS Infinity
    is immutable for a given pool — pools are not reconfigured.
  impact: "Stale poolKey in positions() view — integration contracts may use wrong parameters"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariant: cached poolKey must match the actual pool parameters
    PoolId poolId = poolKey.toId();
    PoolKey memory cached = _poolIdToPoolKey[PoolId.unwrap(poolId)];
    // If cached, it must match
    if (cached.parameters.getBinStep() != 0) {
        eq(Currency.unwrap(cached.currency0), Currency.unwrap(poolKey.currency0),
           "BPM-TB-08: cached poolKey currency0 mismatch");
        eq(Currency.unwrap(cached.currency1), Currency.unwrap(poolKey.currency1),
           "BPM-TB-08: cached poolKey currency1 mismatch");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 35
  notes: >
    PoolKey → PoolId is a deterministic hash. Two different PoolKeys cannot have the same PoolId
    (barring keccak256 collision). This is safe by design. The only edge case is if getBinStep()
    could return 0 for a valid pool, causing the cache to be refreshed every time. Low priority.

- id: BPM-TB-09
  tier: 1
  type: property
  description: "_sweep sends entire contract balance of any token to any recipient (via _mapRecipient). If tokens are accidentally sent to BinPositionManager (e.g., fee-on-transfer dust, direct transfer), anyone can sweep them by including a SWEEP action in their modifyLiquidities call."
  attack_scenario: >
    Step 1: Fee-on-transfer token is used in a pool. During _settle, the actual amount transferred
    is less than the amount specified (fee-on-transfer). Over many operations, dust accumulates
    in the BinPositionManager contract. Step 2: Any user calls modifyLiquidities with a SWEEP
    action, specifying the fee-on-transfer token and their own address as recipient. They receive
    all accumulated dust. This is intentional behavior (sweep is a cleanup mechanism), but the
    trust boundary question is: should ANY user be able to sweep ANY token? In Uniswap v4,
    sweep is similarly permissionless. The risk is if the BinPositionManager ever holds tokens
    that belong to a specific user (e.g., mid-transaction via multicall).
  impact: "Theft of accumulated token dust from the contract — Low value in isolation but could be significant over time for high-volume pools"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track: contract balance before and after sweep
    uint256 balanceBefore = currency.balanceOfSelf();
    // After sweep:
    uint256 balanceAfter = currency.balanceOfSelf();
    eq(balanceAfter, 0, "BPM-TB-09: sweep should drain entire balance");
    // The question is whether balanceBefore belonged to anyone specific
  ghost_vars: []
  validated: false
  priority: low
  confidence: 45
  notes: >
    This is by design in Uniswap v4 architecture. The PositionManager should not hold tokens
    between transactions (all tokens are settled to the vault). Sweep is a safety mechanism
    for recovering stuck tokens. However, during a multicall, tokens COULD temporarily reside
    in the contract (e.g., after UNWRAP and before SETTLE). If a malicious second call in
    multicall sweeps tokens that the first call deposited, there could be an issue. But
    multicall uses delegatecall so msg.sender is preserved and the locker check prevents
    interleaving with other users' calls.

- id: BPM-TB-10
  tier: 2
  type: property
  description: "activeIdDesired underflow in slippage check — if activeIdDesired < idSlippage, the subtraction `activeIdDesired - idSlippage` underflows (both are uint256), producing a very large number that will always be > activeId, causing a revert. This means users cannot add liquidity to very low bin IDs with any slippage tolerance."
  attack_scenario: >
    User wants to add liquidity around binId=5 with idSlippage=10. activeIdDesired=5, idSlippage=10.
    Line 276: `activeIdDesired - idSlippage` = 5 - 10 = underflow in uint256 = very large number.
    This is always > activeId (which is a uint24), so it reverts with IdSlippageCaught.
    The user cannot add liquidity to low bin IDs with meaningful slippage tolerance.
    The check on line 266 validates both are <= type(uint24).max, so both fit in uint24, but
    the subtraction is done on uint256 values. If activeIdDesired=0 and idSlippage=1, the
    subtraction underflows. This is a DoS for low bin ID pools, not a fund loss.
    Note: the code checks `activeIdDesired + idSlippage < activeId` first (line 273), and
    `activeIdDesired - idSlippage > activeId` second (line 276). The underflow on line 276
    means the second check always reverts for activeIdDesired < idSlippage, even if the
    first check would have been sufficient to validate the range.
  impact: "DoS: cannot add liquidity to bins near ID 0 with any slippage tolerance"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Test: addLiquidity with activeIdDesired < idSlippage should not revert if activeId is within valid range
    // This will demonstrate the underflow DoS
    uint256 activeIdDesired = 5;
    uint256 idSlippage = 10;
    // The subtraction underflows:
    uint256 lowerBound = activeIdDesired - idSlippage; // UNDERFLOW → huge number
    // lowerBound > activeId is always true → revert
    // Expected: should succeed if activeId is between 0 and 15
    t(false, "BPM-TB-10: cannot test inline, need foundry PoC");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 75
  notes: >
    This is a genuine edge case bug. In Solidity 0.8.26, uint256 subtraction reverts on underflow
    (checked arithmetic). So `activeIdDesired - idSlippage` when activeIdDesired < idSlippage
    will REVERT, not wrap around. This means: if a user sets activeIdDesired=5 and idSlippage=10,
    the transaction reverts even if the actual activeId IS within the intended range [0, 15].
    The fix would be to cast to int256 or add a conditional check. This is likely a valid Low/QA
    finding — DoS for a subset of valid inputs. Checking if Uniswap v4 has the same issue in
    their CL equivalent.

false_positives:
- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-01
  reason: >
    Hook attacks were considered but explicitly excluded from scope per instructions:
    "Hooks are FULLY TRUSTED — don't report hook attacks". The beforeMint/afterMint hooks
    could manipulate activeId, steal tokens, or cause reentrancy, but these are by design
    in the hook trust model.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "PCS Infinity hooks are FULLY TRUSTED by design — no point fuzzing hook attack vectors"
    briefing_update_applied: false
- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-02
  reason: >
    Multicall + msg.value duplication was investigated. In Uniswap v4, multicall with
    msg.value could allow double-spending of ETH across multiple calls. However, the vault's
    sync/settle mechanism tracks actual balance changes, not msg.value. Each settle call
    does vault.sync (snapshots balance) then vault.settle (compares current balance to snapshot).
    So even if msg.value is "reused" across delegatecalls, the vault only credits the actual
    ETH received. This is safe by design.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "Multicall + msg.value is safe in PCS Infinity because vault.sync/settle tracks actual balance, not msg.value"
    briefing_update_applied: false
- hunter: TrustBoundaryHunter
  id: BPM-TB-FP-03
  reason: >
    ERC1155 token ID collision was investigated. tokenId = keccak256(poolId, binId). Two different
    (poolId, binId) pairs cannot produce the same tokenId barring keccak256 collision. This is
    cryptographically secure.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
