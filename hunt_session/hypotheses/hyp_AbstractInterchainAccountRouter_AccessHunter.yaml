  type: property
  description: "receive() accepts ETH with no access control and no accounting -- ETH can be trapped or stolen via callRemoteWithOverrides msg.value forwarding"
  attack_scenario: |
    The receive() function at line 132 accepts ETH from anyone with no restrictions. ETH sent
    directly to the router (not via callRemoteWithOverrides) sits in the contract with no
    accounting. callRemoteWithOverrides forwards msg.value to mailbox.dispatch{value: _value},
