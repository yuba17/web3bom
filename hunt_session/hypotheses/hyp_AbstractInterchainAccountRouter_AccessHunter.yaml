- id: AIAR-AC-06
  tier: 1
  type: property
  description: "Router.enrollRemoteRouter and Router.enrollRemoteRouters (plural) bypass the immutability check because _enrollRemoteRouter is virtual-overridden but enrollRemoteRouters calls the parent _enrollRemoteRouter in a loop"
  attack_scenario: |
    Wait -- re-checking. AbstractInterchainAccountRouter overrides _enrollRemoteRouter (line 302)
    to call _enrollRemoteRouterAndIsm. The parent Router.enrollRemoteRouters calls
    _enrollRemoteRouter in a loop, which IS the overridden version. So the immutability check
    IS enforced. The ISM would be set to EMPTY_SALT (bytes32(0)). This is actually fine for
    the router-only enrollment path.

    BUT: there is a subtle issue. If owner calls Router.enrollRemoteRouter(domain, routerAddr)
    (the parent's external function), it calls the overridden _enrollRemoteRouter which calls
    _enrollRemoteRouterAndIsm(domain, routerAddr, EMPTY_SALT). This sets ISM to EMPTY_SALT.
    If the domain was never enrolled, both router and ISM are EMPTY_SALT, so the require passes.
    After enrollment: routers(domain) = routerAddr, isms[domain] = EMPTY_SALT.
    Now the owner cannot call enrollRemoteRouterAndIsm because routers(domain) != EMPTY_SALT.
    The ISM for this domain is permanently EMPTY_SALT. This means any ICA for this domain
    has ISM = address(0), which may disable security verification.
  impact: "Medium -- if owner uses parent enrollRemoteRouter instead of enrollRemoteRouterAndIsm, the ISM is permanently zero (no ISM verification)"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // If a domain has a router but ISM is bytes32(0), the security model may be broken
    bytes32 routerVal = originRouter.routers(DESTINATION);
    bytes32 ismVal = originRouter.isms(DESTINATION);
    if (routerVal != bytes32(0)) {
        // If router is set, ISM should also be set (non-zero) for security
        t(
            ismVal != bytes32(0),
            "AIAR-AC-06: domain has router but ISM is zero -- no security verification"
        );
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: |
    The parent Router.enrollRemoteRouter is external onlyOwner and calls the overridden
    _enrollRemoteRouter which sets ISM to EMPTY_SALT. Once set, the domain router is
    immutable and cannot be re-enrolled with a proper ISM. The owner MUST use
    enrollRemoteRouterAndIsm, never the parent enrollRemoteRouter. But there is no
    mechanism to prevent the owner from calling the wrong function.
  poc_sketch: |
    1. Owner calls Router.enrollRemoteRouter(42, validRouter) -- parent function
    2. This calls overridden _enrollRemoteRouter -> _enrollRemoteRouterAndIsm(42, validRouter, 0)
    3. isms[42] = bytes32(0), routers(42) = validRouter
    4. Owner realizes mistake, tries enrollRemoteRouterAndIsm(42, validRouter, realIsm)
    5. REVERTS: routers(42) != EMPTY_SALT
    6. Domain 42 permanently has ISM=0 -- security module is address(0)
  call_stack: "Router.enrollRemoteRouter -> _enrollRemoteRouter (overridden, line 302) -> _enrollRemoteRouterAndIsm(dest, addr, EMPTY_SALT)"

