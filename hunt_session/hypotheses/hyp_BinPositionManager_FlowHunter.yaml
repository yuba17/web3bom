- id: BPM-FL-01
  tier: 1
  type: property
  description: "_pay() truncates amount to uint160 via permit2.transferFrom — if amount > type(uint160).max, the vault receives fewer tokens than the delta expects, leaving the vault insolvent"
  attack_scenario: >
    The _pay() function casts amount to uint160 when calling permit2.transferFrom(payer, vault, uint160(amount), token).
    If amount exceeds type(uint160).max (~1.46e48), the high bits are silently truncated. The vault.settle() call
    would register the full delta as settled via sync-then-settle pattern, but the actual transfer is only
    uint160(amount). In practice, ERC20 totalSupply rarely exceeds uint160, so this is unlikely for standard tokens.
    However, for tokens with extreme supply (rebasing, high-decimal, or custom tokens), this could allow settling
    a debt with fewer tokens than owed. The attacker adds liquidity, creates a large debt, then settles with
    truncated payment, keeping the difference.
  impact: "Vault receives fewer tokens than accounted — potential insolvency for that currency"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // In a handler that calls _settle with a large amount:
    // Verify that the amount passed to permit2 never exceeds uint160 max
    // or that the full amount is actually transferred
    uint256 debtBefore = vault.currencyDelta(address(positionManager), currency);
    uint256 vaultBalBefore = IERC20(Currency.unwrap(currency)).balanceOf(address(vault));
    // ... execute settle action ...
    uint256 vaultBalAfter = IERC20(Currency.unwrap(currency)).balanceOf(address(vault));
    uint256 debtAfter = vault.currencyDelta(address(positionManager), currency);
    // The actual transfer must match the delta reduction
    uint256 deltaReduced = uint256(-int256(debtBefore)) - uint256(-int256(debtAfter));
    uint256 actualTransferred = vaultBalAfter - vaultBalBefore;
    eq(deltaReduced, actualTransferred, "BPM-FL-01: settle amount != actual transfer (uint160 truncation)");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    The truncation is real in the code (line 394: uint160(amount)), but in practice ERC20 amounts
    rarely exceed uint160. The vault.sync()/settle() pattern uses balance diffs, so if the transfer
    is less than expected, settle() would only credit what was actually received. Need to verify
    whether vault.settle() credits based on balance diff (safe) or based on the reported amount (vulnerable).
    If vault uses balance diff via sync, this is NOT exploitable — it's a self-grief at most.

- id: BPM-FL-02
  tier: 1
  type: property
  description: "modifyLiquiditiesWithoutLock has no deadline check — actions can be executed at any time after signing, enabling stale-state exploitation"
  attack_scenario: >
    modifyLiquidities() has checkDeadline(deadline) modifier, but modifyLiquiditiesWithoutLock() has NO
    deadline check at all. If a user signs a multicall that includes modifyLiquiditiesWithoutLock, a keeper
    or relayer could hold the transaction and execute it much later when market conditions have changed
    drastically. For add liquidity, the user's activeIdDesired + idSlippage might still pass but at very
    unfavorable rates. For remove liquidity, amount0Min/amount1Min might still pass but with value loss
    due to IL. This is a design choice (the function is meant for vault-already-locked scenarios), but
    the lack of ANY time-bounding is a slippage concern.
  impact: "Users adding/removing liquidity via WithoutLock path have no time protection — stale execution possible"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // This is a design-level check — verify that modifyLiquiditiesWithoutLock
    // is only callable in contexts where deadline is enforced upstream
    // The test would be: can a user directly call modifyLiquiditiesWithoutLock?
    // If yes, there's no deadline protection.
    bool canCallDirectly = true; // modifyLiquiditiesWithoutLock is external
    // It has isNotLocked modifier — so it requires vault to NOT be locked
    // But it doesn't lock the vault itself either — it calls _executeActionsWithoutLock
    // which just loops through actions without vault.lock()
    t(canCallDirectly, "BPM-FL-02: modifyLiquiditiesWithoutLock callable without deadline");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    modifyLiquiditiesWithoutLock is designed for use when the vault is already locked by another
    contract. But it's external and has no caller restriction beyond isNotLocked. If a user calls
    it directly (vault not locked), actions execute without vault.lock() — meaning no delta
    accounting via the vault's transient storage. This would likely revert when trying to settle/take
    because there's no active locker. The real question is: can this be called in a context where
    the lack of deadline matters? Need to verify vault.lock() requirements.

- id: BPM-FL-03
  tier: 1
  type: property
  description: "initializePool silently swallows ALL reverts via try/catch — pool initialization failures are invisible, leading users to add liquidity to non-existent or misconfigured pools"
  attack_scenario: >
    initializePool uses `try binPoolManager.initialize(key, activeId) {} catch {}` which catches ALL
    errors silently. If initialization fails (e.g., currencyOutOfOrder, invalid binStep, pool already exists),
    the function returns success. A user calling initializePool + addLiquidity in a multicall could
    believe the pool was initialized when it wasn't. The addLiquidity would then either:
    (a) revert if the pool doesn't exist — safe but confusing
    (b) succeed if someone front-ran pool creation with different parameters — user adds liquidity
    to an attacker-configured pool with malicious hooks or parameters.
    Attack: Attacker monitors mempool for initializePool calls, front-runs with their own initialize
    using the same poolKey but with a malicious hook address in the PoolKey. The user's initialize
    fails silently, and their subsequent addLiquidity goes to the attacker's pool.
  impact: "User liquidity deposited into attacker-controlled pool with malicious hooks"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Cannot directly test silent failure in an invariant — this is a design-level issue
    // Test: call initializePool with invalid params, verify it doesn't revert
    // Then verify the pool actually exists
    // The invariant: if initializePool was called, the pool MUST exist afterward
    // (poolId, activeId, protocolFee, hookRegistration) = binPoolManager.getSlot0(key.toId());
    // If activeId == 0 and we called initializePool, the init was silently swallowed
    (uint24 poolActiveId,,) = binPoolManager.getSlot0(poolKey.toId());
    t(poolActiveId != 0, "BPM-FL-03: initializePool succeeded but pool doesn't exist");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    The code comment says "if the pool revert due to other error, then the follow-up action to the
    pool will still revert accordingly" — meaning they rely on downstream calls to fail. But if the
    user's multicall only contains initializePool (no addLiquidity), they get silent success on a
    failed init. The front-running attack with different PoolKey hook is the real concern — PoolKey
    includes hook address, so different hooks = different poolId. Actually, if the PoolKey is the SAME,
    the front-runner can't change the hook because it's part of the key. So the attack requires
    the SAME key — but then initialize just returns "already initialized" silently. The user's
    addLiquidity would go to the front-runner's pool with the SAME params. This weakens the attack.
    Revisit: the real risk is user confusion, not fund theft.

- id: BPM-FL-04
  tier: 1
  type: property
  description: "LP token totalSupply must equal sum of all user balances for every tokenId — _mint and _burn use unchecked arithmetic that could desync if overflow/underflow occurs"
  attack_scenario: >
    In BinFungibleToken._mint(), totalSupply[id] += amount is checked (can overflow-revert), but
    balanceOf[to][id] += amount is unchecked. If totalSupply[id] is near type(uint256).max and a mint
    pushes it over, it reverts. But balanceOf is unchecked — meaning if a single user's balance overflows
    uint256, it wraps to zero silently. This requires an astronomically large number of mints to a single
    address for the same tokenId, which is practically impossible. In _burn(), both totalSupply and
    balanceOf subtractions are unchecked (after a balance check). The balance check prevents underflow
    of balanceOf, and since totalSupply >= balanceOf by construction, totalSupply underflow is prevented.
    The invariant is: totalSupply[id] == sum(balanceOf[user][id]) for all users.
  impact: "If totalSupply desyncs from actual balances, users could burn more LP tokens than they own proportionally"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // For each tracked tokenId, verify totalSupply == sum of known balances
    uint256 tokenId = poolId.toTokenId(binId);
    uint256 supply = bft.totalSupply(tokenId);
    uint256 sumBalances = 0;
    for (uint256 i = 0; i < actors.length; i++) {
        sumBalances += bft.balanceOf(actors[i], tokenId);
    }
    eq(supply, sumBalances, "BPM-FL-04: totalSupply != sum(balances)");
  ghost_vars:
  - "uint256[] internal ghost_trackedTokenIds;"
  - "address[] internal actors;"
  validated: false
  priority: high
  confidence: 75
  notes: >
    The unchecked block in _mint for balanceOf is standard ERC1155 pattern — justified by the fact
    that totalSupply is checked first (if totalSupply doesn't overflow, no single balance can overflow
    since balance <= totalSupply). This is mathematically sound IF no other code path modifies
    balanceOf without going through _mint/_burn. batchTransferFrom also uses unchecked but with a
    balance check first. The invariant is sound but likely won't break — still worth fuzzing as a
    solvency invariant.

- id: BPM-FL-05
  tier: 1
  type: property
  description: "Delta accounting conservation: after a full modifyLiquidities call completes, the vault's currencyDelta for BinPositionManager must be zero for all currencies touched"
  attack_scenario: >
    The vault uses transient storage for delta accounting. When BinPositionManager calls vault.lock(),
    executes actions (addLiquidity creates negative deltas, settle resolves them), and returns, all
    deltas must net to zero. If a user crafts an action sequence that leaves a non-zero delta, the
    vault.lock() should revert (the vault enforces zero-delta on lock release). But if there's a path
    where deltas leak (e.g., via CLEAR_OR_TAKE forfeiting tokens, or via the FROM_DELTAS variant
    consuming credit without full settlement), the vault might not catch it. A positive leftover delta
    means the vault owes tokens that were never paid — an attacker could drain the vault.
  impact: "Non-zero delta after lock release = vault insolvency or locked funds"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // After modifyLiquidities returns, check all deltas are zero
    // This is enforced by the vault, but we verify it as a meta-invariant
    int256 delta0 = vault.currencyDelta(address(positionManager), currency0);
    int256 delta1 = vault.currencyDelta(address(positionManager), currency1);
    eq(uint256(delta0), 0, "BPM-FL-05: currency0 delta non-zero after lock release");
    eq(uint256(delta1), 0, "BPM-FL-05: currency1 delta non-zero after lock release");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 50
  notes: >
    The vault itself enforces this via its lock mechanism — if deltas are non-zero when lock() returns,
    it reverts. So this invariant is really testing the vault's enforcement. The interesting case is
    CLEAR_OR_TAKE which explicitly forfeits positive deltas (vault.clear) — this IS intentional leakage
    but the clear function should properly zero out the delta. The BIN_ADD_LIQUIDITY_FROM_DELTAS variant
    consumes existing credit — if credit is consumed but not fully, the remainder needs to be taken or
    cleared. If the user forgets, the vault catches it. This is more of a meta-invariant.

- id: BPM-FL-06
  tier: 1
  type: property
  description: "BIN_ADD_LIQUIDITY_FROM_DELTAS uses _getFullCredit which reverts on negative delta — but if credit is zero, amount0/amount1 are zero, and mint() might mint zero-liquidity LP tokens"
  attack_scenario: >
