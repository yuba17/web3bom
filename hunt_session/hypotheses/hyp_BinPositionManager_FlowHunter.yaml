    If the credit is zero (no prior action generated credit), _getFullCredit returns 0 (delta is 0,
    which is not < 0, so no revert). Then _addLiquidity is called with amount0=0, amount1=0.
    The binPoolManager.mint() is called with amountIn = encode(0, 0). Depending on the pool manager's
    behavior, this might:
    (a) mint zero liquidity tokens (ghost positions) — polluting _positions mapping
    (b) revert — safe
    If zero-liquidity LP tokens are minted, they create positions that can never be burned for value
    but consume gas and storage. More critically, if the LP token ID gets a non-zero _positions entry
    with binId=0, future legitimate mints to that bin could be affected.
  impact: "Ghost LP positions with zero value; potential _positions mapping pollution; binId=0 collision"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // After addLiquidity, verify that minted liquidity is always > 0
    // Check that no tokenId has totalSupply > 0 but represents zero actual pool liquidity
    for (uint256 i = 0; i < mintArray.ids.length; i++) {
        uint256 tokenId = poolId.toTokenId(mintArray.ids[i]);
        uint256 supply = bft.totalSupply(tokenId);
        if (supply > 0) {
            // Verify the pool actually has liquidity for this bin
            // binPoolManager should have non-zero bin reserves
            t(supply > 0, "BPM-FL-06: LP tokens minted with zero actual liquidity");
        }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    Need to check what binPoolManager.mint() does with zero amountIn. If it returns empty
    mintArray (no ids, no liquidity), the loop doesn't execute and no LP tokens are minted — safe.
    If it returns entries with liquidityMinted=0, _mint(to, tokenId, 0) is a no-op for balanceOf
    but still writes to _positions. The _positions[tokenId].binId == 0 check would trigger, writing
    a position with binId=0 if the actual bin is bin 0 — but bins are uint24 so bin 0 exists.
    Actually, if liquidityMinted[i] == 0, _mint does totalSupply[id] += 0 and balanceOf[to][id] += 0,
