- id: BPM-FL-07
  tier: 1
  type: property
  description: "_positions[tokenId].binId uses uint24 — bin 0 is a valid bin but is also the default/uninitialized value, making positions(tokenId) unable to distinguish 'not initialized' from 'bin 0'"
  attack_scenario: >
    The positions() view function checks `if (PoolId.unwrap(position.poolId) == 0) revert InvalidTokenID()`.
    This protects against uninitialized poolId. But for a valid position in bin 0 (activeId=0 is
    technically valid for uint24), the check passes. More importantly, in _addLiquidity line 308:
    `if (_positions[tokenId].binId == 0)` — this condition is used to decide whether to write the
    position. For bin 0, this means the position is ALWAYS overwritten on every addLiquidity call
    to bin 0, even if it was already set. This is a minor inefficiency but not a bug since the
    values written are identical. However, if two different pools happen to produce the same tokenId
    (hash collision in BinTokenLibrary.toTokenId), the second pool's position would overwrite the first.
    This is astronomically unlikely (keccak256 collision) but the code doesn't guard against it.
  impact: "Bin 0 positions always re-written (gas waste); theoretical hash collision could corrupt position mapping"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that _positions is consistent: for any tokenId with totalSupply > 0,
    // the stored poolId and binId must match the actual pool/bin
    uint256 tokenId = poolId.toTokenId(binId);
    (PoolKey memory storedKey, uint24 storedBinId) = positionManager.positions(tokenId);
    // storedBinId must match the binId we minted to
    eq(uint256(storedBinId), uint256(binId), "BPM-FL-07: stored binId mismatch");
    // storedKey.toId() must match poolId
    bytes32 storedPoolId = PoolId.unwrap(storedKey.toId());
    bytes32 expectedPoolId = PoolId.unwrap(poolId);
    eq(uint256(storedPoolId), uint256(expectedPoolId), "BPM-FL-07: stored poolId mismatch");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: >
    The binId == 0 re-write is benign because it writes the same values. The real concern is whether
    binId can legitimately be 0. In Liquidity Book (Trader Joe) style, the active bin starts at 2^23,
    so bin 0 is far from active. In PancakeSwap's implementation, activeId is uint24 set at
    initializePool — if someone initializes with activeId=0, bins around 0 are valid. The sentinel
    value issue is cosmetic, not security-critical.

- id: BPM-FL-08
  tier: 1
  type: property
  description: "Reentrancy via BinFungibleToken.batchTransferFrom during vault-locked state — batchTransferFrom requires vault to be UNLOCKED (onlyIfVaultUnlocked), but this prevents composability with other vault-locked operations"
  attack_scenario: >
    batchTransferFrom has the onlyIfVaultUnlocked modifier, which reverts if vault.getLocker() != address(0).
    During a modifyLiquidities call, the vault IS locked (BinPositionManager is the locker). This means
    LP tokens CANNOT be transferred during a multicall/modifyLiquidities execution. This is a design
    choice to prevent reentrancy. But it also means: if a hook or callback during addLiquidity/removeLiquidity
    tries to transfer LP tokens, it will revert. Since hooks are trusted (per instructions), this is
    acceptable. However, the INVERSE is the concern: can batchTransferFrom be called OUTSIDE of
    vault lock to manipulate LP balances between two steps of a multicall? Since multicall is atomic,
    this isn't possible within a single tx. Cross-tx MEV is the vector: attacker transfers LP tokens
    away from a user between the user's approve and removeLiquidity transactions.
  impact: "LP tokens locked during vault operations — potential composability issues but not direct fund loss"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that batchTransferFrom conserves totalSupply (no mint/burn side effect)
    uint256 supplyBefore = bft.totalSupply(tokenId);
    // ... execute batchTransferFrom ...
    uint256 supplyAfter = bft.totalSupply(tokenId);
    eq(supplyBefore, supplyAfter, "BPM-FL-08: batchTransferFrom changed totalSupply");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    The onlyIfVaultUnlocked on batchTransferFrom is a deliberate anti-reentrancy pattern. It prevents
    any LP token movement during vault-locked operations, which is safe. The real question is whether
    this is sufficient — or whether there's a path to move LP tokens DURING a vault lock that doesn't
    go through batchTransferFrom. _mint and _burn are internal and only called from _addLiquidity and
    _removeLiquidity, which are inside the vault lock. This looks sound.

- id: BPM-FL-09
  tier: 1
  type: property
  description: "_removeLiquidity burns LP tokens from params.from but delta credit goes to BinPositionManager (address(this)) — if the caller doesn't TAKE the credit to the correct recipient, tokens are stuck in the vault"
  attack_scenario: >
    In _removeLiquidity, binPoolManager.burn() creates a positive delta for BinPositionManager (the caller
    of burn). The LP tokens are burned from params.from. But the underlying tokens (the positive delta)
    are NOT automatically sent to params.from — they remain as a credit in the vault's transient storage
    for BinPositionManager. The user must include a TAKE_PAIR or TAKE or CLOSE_CURRENCY action AFTER
    BIN_REMOVE_LIQUIDITY to actually receive the tokens. If the user forgets or misconfigures the
    recipient in the TAKE action, the tokens either:
    (a) remain as credit and vault.lock() reverts (delta non-zero) — safe, tx fails
    (b) are taken to the wrong address — fund loss for the LP token burner
    The key issue: removeLiquidity checks approval from params.from, burns their LP tokens, but the
    delta credit is positional to BinPositionManager, not to params.from. An approved operator could
    burn someone's LP tokens and then TAKE to themselves.
  impact: "Approved operator can burn LP tokens from a user and redirect underlying tokens to themselves"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After removeLiquidity + take, verify that the recipient of tokens
    // is the same as the owner of burned LP tokens (or explicitly approved)
    // This requires tracking the from address in removeLiquidity and the recipient in take
    // Ghost variable tracks the last removeLiquidity from address
    address burnFrom = ghost_lastRemoveLiquidityFrom;
    address takeRecipient = ghost_lastTakeRecipient;
    // If they differ, an operator redirected funds
    if (burnFrom != address(0) && takeRecipient != address(0)) {
        // This is BY DESIGN for approved operators — but is the user aware?
        // The invariant: if from != msgSender, then recipient should be from
        if (ghost_lastMsgSender != burnFrom) {
            eq(takeRecipient, burnFrom, "BPM-FL-09: operator redirected remove liquidity funds");
        }
    }
  ghost_vars:
  - "address internal ghost_lastRemoveLiquidityFrom;"
  - "address internal ghost_lastTakeRecipient;"
  - "address internal ghost_lastMsgSender;"
  validated: false
  priority: high
  confidence: 60
  notes: >
    This is actually BY DESIGN in Uniswap V4 and PCS Infinity architecture. Approved operators
    can manage liquidity on behalf of users. The approval mechanism (isApprovedForAll) is the
    user's consent. However, the approval is for LP token operations — the user might not expect
    that approving LP token transfers also allows the operator to burn LP tokens AND redirect the
    underlying tokens. In standard ERC1155, approval only allows transfers. Here, approval
    allows burn + redirect. This is an expanded trust assumption that may not be obvious to users.
    Severity depends on whether protocols integrating BinPositionManager understand this.

- id: BPM-FL-10
  tier: 2
  type: property
  description: "cachePoolKey only writes on first use (binStep == 0 check) — if a PoolKey with binStep=0 is somehow valid, the cache is never populated, breaking positions() lookups"
  attack_scenario: >
    cachePoolKey checks `if (_poolIdToPoolKey[...].parameters.getBinStep() == 0)` to decide whether
    to cache. If a valid pool has binStep=0 in its parameters, the cache entry is never populated
    because the condition always evaluates to true (the stored value is always 0). But getBinStep
    extracts bits from the parameters field — if binStep=0 is invalid and prevented by
    binPoolManager.initialize(), this is not exploitable. If binStep=0 IS valid (e.g., for special
    pool types), then _poolIdToPoolKey never stores the key, and positions(tokenId) would return
    a zeroed PoolKey — misleading for off-chain consumers but not directly exploitable on-chain.
  impact: "positions() returns empty PoolKey for pools with binStep=0 — off-chain consumer confusion"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After addLiquidity, verify that the poolKey is cached
    PoolId poolId = poolKey.toId();
    PoolKey memory cached = _poolIdToPoolKey[PoolId.unwrap(poolId)];
    // The cached key should have non-zero parameters
    t(cached.parameters.getBinStep() != 0, "BPM-FL-10: poolKey not cached (binStep=0)");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    BinPoolManager likely validates binStep > 0 during initialize(). If so, this is unreachable.
    Need to verify the core pool manager's validation. If binStep=0 is rejected at init time,
    this hypothesis is invalid. Mark as needs-verification.

false_positives:
- hunter: FlowHunter
  id: BPM-FP-01
  reason: >
    Hook-based attacks (beforeMint/afterMint callbacks manipulating state) are excluded per
    instructions — hooks are FULLY TRUSTED in PancakeSwap Infinity. The IdSlippage check before
    mint protects against hook-induced activeId changes, which is the correct design. Not a finding.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: FlowHunter
  id: BPM-FP-02
  reason: >
    ReentrancyLock uses transient storage (tstore/tload) for the locker address. This is safe in
    Solidity 0.8.26 with EIP-1153 support. The isNotLocked modifier on both entry points
    (modifyLiquidities, modifyLiquiditiesWithoutLock) prevents reentrant calls. The lock is
    released at the end of the modifier. Standard pattern, no vulnerability.
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null

- hunter: FlowHunter
  id: BPM-FP-03
  reason: >
    _sweep() sends the contract's entire balance to a recipient without access control — but it's
    internal and only callable through _handleAction within a vault.lock() callback. The recipient
    is controlled by the caller (msgSender = locker). This is by design for collecting dust/leftovers
    after operations. Not exploitable because the contract should not hold funds between transactions
    (all funds flow through vault).
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
