# ============================================================================
# B-AC-10: MORPHO CALLBACKS — ¿Quién puede trigger onMorphoSupply/etc?
# ============================================================================
- id: B-AC-10
  tier: 2
  type: property
  description: "Los Morpho callbacks solo verifican msg.sender == MORPHO. Si Morpho se llama con data que apunta al adapter, el adapter ejecutará un reenter con la data proporcionada."
  attack_scenario: |
    Los callbacks (onMorphoSupply, onMorphoSupplyCollateral, onMorphoRepay, onMorphoFlashLoan)
    hacen:
    1. require(msg.sender == address(MORPHO)) — solo Morpho puede llamarlos
    2. reenterBundler3(data) — llama Bundler3.reenter(data)

    ¿Puede un atacante explotar esto?
    - Atacante llama MORPHO.supply(market, assets, shares, onBehalf, malicious_data)
    - Morpho llama adapter.onMorphoSupply(assets, malicious_data)
    - PERO: ¿el atacante es el que llama supply? Sí, cualquiera puede llamar MORPHO.supply.
    - El callback se ejecuta DENTRO del contexto del multicall del atacante.
    - reenterBundler3(data) llama Bundler3.reenter(data).
    - PERO: reenter() verifica reenterHash. ¿Cuál es el reenterHash activo?
    - Si no hay multicall activo en Bundler3, initiator == 0, y reenter fallará?
      No — reenter() no verifica initiator, solo reenterHash.
      Si reenterHash == bytes32(0) (no hay multicall activo), el keccak256 del msg.sender+data
      no será bytes32(0), así que FALLA con IncorrectReenterHash.

    ESCENARIO DURANTE MULTICALL:
    - User llama multicall → adapter.morphoSupply(market, assets, shares, price, onBehalf, data)
    - morphoSupply llama MORPHO.supply() que llama adapter.onMorphoSupply(assets, data)
    - El callback llama reenterBundler3(data) → Bundler3.reenter(data)
    - Para que reenter funcione, la Call que ejecutó morphoSupply debe tener callbackHash
      = keccak256(data) y to = adapter_address
    - El usuario controla data y callbackHash — esto es el flujo normal/esperado

    VEREDICTO: Seguro. Los callbacks son correctamente gated por msg.sender == MORPHO
    y el reenter está gated por reenterHash matching.
  impact: "N/A — callbacks correctamente protegidos"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Los callbacks solo deben ser llamables por MORPHO
    // vm.prank(attacker);
    // vm.expectRevert(ErrorsLib.UnauthorizedSender.selector);
    // adapter.onMorphoSupply(0, bytes(""));
    t(true, "B-AC-10: morpho callbacks auth — test negativo en Foundry");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: |
    Correcto. Los 4 callbacks tienen morphoCallback(data) que verifica msg.sender == MORPHO.
    La data es controlada por el caller de supply/repay/flashloan en Morpho, que es el adapter
    (que a su vez recibe la data del usuario via multicall).

# ============================================================================
# B-AC-11: ERC20WRAPPER ROUNDTRIP — ¿abuse via allowance del initiator?
# ============================================================================
- id: B-AC-11
  tier: 2
  type: property
  description: "erc20WrapperWithdrawTo hace un roundtrip transfer: adapter→initiator→adapter. ¿Puede un atacante explotar este patrón?"
  attack_scenario: |
    ERC20WrapperAdapter.erc20WrapperWithdrawTo (L49-61):
    1. L57: safeTransfer(wrapper, initiator, amount) — envía wrapped tokens al initiator
    2. L58: safeTransferFrom(wrapper, initiator, adapter, amount) — los trae de vuelta
    3. L60: ERC20Wrapper(wrapper).withdrawTo(receiver, amount) — unwrap

    El propósito: verificar que el initiator tiene allowance para este wrapper (permissioned).
    El adapter necesita los tokens para unwrap, pero primero verifica que el initiator
    los "aprueba" haciéndole un roundtrip.

    ¿Explotable?
    - Para que safeTransferFrom funcione, el initiator debe haber aprobado al adapter
    - El initiator ES msg.sender del multicall — es el usuario que quiere unwrap
    - Si el usuario aprobó al adapter, este roundtrip funciona
    - Un atacante que llama multicall tiene initiator = atacante, no la víctima
    - El atacante necesitaría que la VÍCTIMA aprobara al adapter Y tuviera los tokens
    - PERO el transfer va adapter→initiator, y initiator es el atacante, no la víctima
    - Así que los tokens irían al atacante, luego de vuelta (atacante ya los tendría)

    VEREDICTO: Seguro. El roundtrip verifica que el initiator (= msg.sender) consiente
    el unwrap. Un atacante no puede usar esto para drenar a otro usuario.
  impact: "N/A — roundtrip pattern es seguro"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    t(true, "B-AC-11: erc20wrapper roundtrip — seguro por initiator = msg.sender");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: |
    Patrón de seguridad interesante para wrappers con permisos (e.g., permissioned tokens).
    El roundtrip asegura que el initiator consiente la operación.

# ============================================================================
# B-AC-12: SKIPREV + CALLBACKHASH — ¿se puede bypassear MissingExpectedReenter?
# ============================================================================
- id: B-AC-12
  tier: 1
  type: property
  description: "Si una call con callbackHash != 0 falla y skipRevert=true, ¿se limpia el reenterHash? Si no, la siguiente call hereda un reenterHash stale."
  attack_scenario: |
    Código en _multicall() L54-67:
    ```
    for (uint256 i; i < bundle.length; ++i) {
        if (callbackHash == bytes32(0)) reenterHash = bytes32(0);     // L60
        else reenterHash = keccak256(bytes20(to) + callbackHash);     // L61

        (bool success, bytes memory returnData) = to.call{value}(data); // L63
        if (!skipRevert && !success) revert(returnData);                // L64

        require(reenterHash == bytes32(0), MissingExpectedReenter);     // L66
    }
    ```

    Escenario:
    1. Call[0]: to=X, callbackHash=H, skipRevert=true
    2. L61: reenterHash = keccak256(bytes20(X) + H)
    3. L63: X.call() FALLA (reverts)
    4. L64: skipRevert=true → no revert, continue
    5. L66: require(reenterHash == bytes32(0)) → FALLA con MissingExpectedReenter

    ¡REVERT! Incluso con skipRevert=true, el require en L66 va a revertir porque
    la call que se esperaba que hiciera reenter() nunca ejecutó (reverted).

    ¿Qué pasa si la call NO revierte pero tampoco llama reenter()?
    - Mismo resultado: reenterHash != 0, L66 revierte con MissingExpectedReenter.

    ¿Qué pasa si skipRevert=true en la MISMA call con callbackHash != 0?
    - skipRevert solo afecta el revert de la call (L64)
    - NO afecta el require de L66
    - L66 SIEMPRE revierte si reenterHash != 0

    CONCLUSIÓN: skipRevert NO puede bypassear MissingExpectedReenter.
    Si pones callbackHash != 0, el target DEBE llamar reenter() exitosamente, o todo revierte.
    Esto es correcto y previene que un reenterHash stale se quede para la siguiente iteración.

    PERO: ¿y si la call exitosa llama reenter() que pone reenterHash=0,
    y luego la SIGUIENTE call en el bundle tiene callbackHash != 0?
    - Cada iteración del loop resetea reenterHash en L60-61
    - Cada iteración verifica reenterHash == 0 en L66
    - No hay carry-over entre iteraciones

    VEREDICTO: Correcto. Cada call en el bundle es atómica respecto al reenterHash.
  impact: "N/A — MissingExpectedReenter no es bypasseable con skipRevert"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Después de cada call en el bundle, reenterHash debe ser 0
    // Si la call tenía callbackHash != 0 pero no llamó reenter, debe revertir
    eq(uint256(bundler3.reenterHash()), 0, "B-AC-12: reenterHash stale post-call");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 98
  notes: |
    Investigado a fondo. L66 require es INDEPENDIENTE de skipRevert.
    skipRevert solo controla si el revert de to.call() se propaga (L64).
    MissingExpectedReenter es un check separado que SIEMPRE se ejecuta.

# ============================================================================
# B-AC-13: BUNDLER3 → ADAPTER TRUST BOUNDARY — call vs delegatecall
# ============================================================================
- id: B-AC-13
  tier: 2
  type: property
  description: "Bundler3 usa call (no delegatecall) para llamar a los adapters. Los adapters son contratos independientes con su propio storage y balance."
  attack_scenario: |
    La diferencia es CRÍTICA para la seguridad:
    - call: msg.sender = Bundler3, execution context = adapter
    - delegatecall: msg.sender = original caller, execution context = Bundler3

    Con call (actual diseño):
    - Los adapters tienen su propio balance de ETH/tokens → tokens residuales están en el adapter
    - Las allowances se dan DESDE el adapter (adapter.approve), no desde Bundler3
    - msg.sender visto por el adapter es Bundler3 → onlyBundler3 funciona
    - El adapter lee initiator() vía external call a Bundler3

    Si fuera delegatecall (hipotético):
    - Los tokens estarían en Bundler3 → mucho más peligroso (Bundler3 es abierto)
    - Las allowances serían desde Bundler3 → cualquiera podría drenarlas via multicall
    - msg.sender sería el usuario original → onlyBundler3 no funcionaría

    VEREDICTO: call es la elección correcta. delegatecall sería catastrófico en este diseño.
    No es un bug — es confirmación de diseño correcto.
  impact: "N/A — diseño correcto"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    t(true, "B-AC-13: call vs delegatecall — design verification");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 99
  notes: Diseño correcto. call aísla el contexto de ejecución.

# ============================================================================
# B-AC-14: REENTER DURING MULTICALL — timing window
# ============================================================================
- id: B-AC-14
  tier: 1
  type: property
  description: "Durante la ejecución de _multicall, entre L61 (set reenterHash) y L63 (call), hay un window donde reenterHash está seteado. ¿Un contrato externo puede explotar este window?"
  attack_scenario: |
    Timing en _multicall:
    L60-61: reenterHash se setea (si callbackHash != 0)
    L63: to.call{value}(data) — ejecución del target
    L66: require(reenterHash == 0) — verificación post-call

    WINDOW: entre L61 y L63, reenterHash es no-zero.
    ¿Quién puede observar reenterHash en este window?
    - reenterHash es transient storage, public getter
    - Cualquier contrato puede leer bundler3.reenterHash() durante esta ventana
    - PERO: solo el target (to) puede llamar reenter() porque:
      a) reenter() verifica msg.sender vía bytes20(msg.sender) en el hash
      b) El target es el que recibe la call en L63

    ¿El target puede llamar reenter() ANTES de que L63 lo llame?
    - No — L63 es la call al target. Antes de L63, el target no tiene ejecución.
    - El target obtiene ejecución SOLO durante L63.

    ¿Un contrato EXTERNO (no el target) puede explotar el window?
    - Solo si también tiene ejecución durante este window
    - Eso solo es posible si la EVM permite preemption (no lo permite)
    - La EVM es single-threaded: L60→L61→L63 son atómicos desde la perspectiva de otros contratos
    - Solo el target (to) obtiene ejecución vía la call en L63

    VEREDICTO: No hay timing vulnerability. La EVM es secuencial.
  impact: "N/A — EVM sequential execution prevents timing attacks"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    t(true, "B-AC-14: timing window — no exploitable due to EVM sequential model");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 99
  notes: EVM es single-threaded. No hay timing attacks dentro de una transacción.

# ============================================================================
# B-AC-15: TRANSIENT STORAGE CROSS-TX — ¿se persiste algo?
# ============================================================================
- id: B-AC-15
  tier: 2
  type: property
  description: "initiator y reenterHash usan transient storage. Se resetean automáticamente al final de la tx. ¿Hay algún state que persista entre transacciones?"
  attack_scenario: |
    Transient storage (EIP-1153):
    - initiator: transient → resetea a address(0) al final de la tx
    - reenterHash: transient → resetea a bytes32(0) al final de la tx

    Bundler3 NO tiene regular storage. El contrato es completamente stateless entre txs.
    Los adapters tienen immutables (BUNDLER3, MORPHO, etc.) pero no state variables mutables.

    ¿Puede un atacante explotar state de la tx anterior?
    - No — transient storage se borra al final de cada tx (EIP-1153 guarantee)
    - Incluso si el tx de Alice falla mid-execution, transient storage se revierte

    ¿Y las allowances del adapter?
    - Las allowances de Morpho son permanentes (by design) — estas SÍ persisten
    - Las allowances de vaults/augustus se revocan después de cada operación
    - Ver B-AC-09 para el riesgo de allowances permanentes

    VEREDICTO: Transient storage es correcto. No hay cross-tx state leakage.
  impact: "N/A — transient storage aísla correctamente entre transacciones"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Post-tx: initiator y reenterHash deben ser 0
    eq(bundler3.initiator(), address(0), "B-AC-15: initiator persists post-tx");
    eq(uint256(bundler3.reenterHash()), 0, "B-AC-15: reenterHash persists post-tx");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 99
  notes: EIP-1153 guarantee. Transient storage = auto-cleared at tx end.

false_positives:
- hunter: AccessHunter
  id: B-AC-FP-01
  reason: |
    "Falta de access control en multicall — cualquiera puede llamarlo."
    BY DESIGN. Bundler3 es un contrato de utilidad abierto. Natspec L13 dice explícitamente:
    "Anybody can do arbitrary calls with this contract." La seguridad reside en que Bundler3
    NO debe tener tokens/aprobaciones/autorizaciones. No es un bug.

- hunter: AccessHunter
  id: B-AC-FP-02
  reason: |
    "initiator no se verifica en reenter()."
    By design. reenter() es para callbacks. El target fue elegido por el initiator al poner
    callbackHash != 0. La autenticación es via reenterHash (msg.sender + data hash), no via
    initiator check. El initiator no cambia durante reenter.

- hunter: AccessHunter
  id: B-AC-FP-03
  reason: |
    "sell()/buy() sin onlyBundler3 en ParaswapAdapter."
    No explotable. swap() interno tiene onlyBundler3. sell/buy SIEMPRE revertirán si se llaman
    directamente. Es una inconsistencia de patrón pero no un bug funcional.

- hunter: AccessHunter
  id: B-AC-FP-04
  reason: |
    "receive() en CoreAdapter sin access control."
    By design. El adapter necesita recibir ETH de WETH.withdraw() y otros contratos.
    El ETH que llegue es robable via nativeTransfer (onlyBundler3), pero eso aplica a todos
    los tokens residuales (ver B-AC-07).

summary: |
  ANÁLISIS COMPLETO DE ACCESS CONTROL — Morpho Bundler3
  =====================================================

  FINDINGS POTENCIALMENTE REPORTABLES:
  - B-AC-01 (ETH stranding): ALTA confianza. No hay refund de ETH residual. Cualquiera puede
    drenar ETH que quede en Bundler3 después de un multicall. Patrón confirmado en 3DNS bounty.
    PERO: podría ser "known/by design" para Morpho.

  - B-AC-07 (Residual tokens): MEDIA confianza. Tokens residuales en adapters son robables.
    Probablemente documented behavior pero no enforced en código.

  CONFIRMADOS SEGUROS:
  - Initiator identity (B-AC-03): transient storage, solo set en multicall, no spoofable
  - ERC4626 owner check (B-AC-04): correcto, owner = initiator = msg.sender
  - Reenter hash (B-AC-05): criptográficamente correcto, msg.sender binding
  - Reentrancy guard (B-AC-06): AlreadyInitiated previene recursión
  - Callback auth (B-AC-10): msg.sender == MORPHO correctamente verificado
  - skipRevert + MissingExpectedReenter (B-AC-12): independientes, no bypasseable

  INFORMATIONAL:
  - ParaswapAdapter sell/buy sin onlyBundler3 (B-AC-02): no explotable pero inconsistente
  - Permanent Morpho allowances (B-AC-09): by design, riesgo solo si Morpho se compromete

  PRIORIDADES PARA FUZZING:
  1. B-AC-01: ETH stranding — PoC con Foundry fork
  2. B-AC-07: Residual tokens — PoC con Foundry fork
  3. B-AC-04: ERC4626 owner check — test negativo
