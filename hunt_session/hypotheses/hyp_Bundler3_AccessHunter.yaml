# =============================================================================
# MAPA COMPLETO DE CONTROL DE ACCESO
# =============================================================================
# Bundler3.sol:
#   multicall()   → external payable, NO access control (by design)
#   reenter()     → external, guarded by reenterHash (msg.sender + data hash)
#   _multicall()  → internal
#   initiator     → transient, set ONLY by multicall(), read by adapters
#   reenterHash   → transient, set in _multicall loop, checked in reenter()
#
# CoreAdapter.sol:
#   onlyBundler3  → modifier, msg.sender == BUNDLER3
#   nativeTransfer() → onlyBundler3
#   erc20Transfer()  → onlyBundler3
#   initiator()      → internal view, reads from Bundler3
#   reenterBundler3()→ internal, calls Bundler3.reenter()
#   receive()        → external payable, NO access control
#
# GeneralAdapter1.sol:
#   erc4626Mint()          → onlyBundler3
#   erc4626Deposit()       → onlyBundler3
#   erc4626Withdraw()      → onlyBundler3, owner == this || initiator()
#   erc4626Redeem()        → onlyBundler3, owner == this || initiator()
#   onMorphoSupply()       → external, msg.sender == MORPHO
#   onMorphoSupplyCollateral() → external, msg.sender == MORPHO
#   onMorphoRepay()        → external, msg.sender == MORPHO
#   onMorphoFlashLoan()    → external, msg.sender == MORPHO
#   morphoSupply()         → onlyBundler3, onBehalf != this
#   morphoSupplyCollateral() → onlyBundler3, onBehalf != this
#   morphoBorrow()         → onlyBundler3, uses initiator() as onBehalf
#   morphoRepay()          → onlyBundler3, onBehalf != this
#   morphoWithdraw()       → onlyBundler3, uses initiator() as onBehalf
#   morphoWithdrawCollateral() → onlyBundler3, uses initiator() as onBehalf
#   morphoFlashLoan()      → onlyBundler3
#   permit2TransferFrom()  → onlyBundler3, from = initiator()
#   erc20TransferFrom()    → onlyBundler3, from = initiator()
#   wrapNative()           → onlyBundler3
#   unwrapNative()         → onlyBundler3
#
# ParaswapAdapter.sol:
#   sell()              → external, NO onlyBundler3 (swap internal is onlyBundler3)
#   buy()               → public, NO onlyBundler3 (swap internal is onlyBundler3)
#   buyMorphoDebt()     → external, NO onlyBundler3 (calls buy → swap)
#   swap()              → internal onlyBundler3
#
# EthereumGeneralAdapter1.sol:
#   morphoWrapperDepositFor() → onlyBundler3
#   morphoWrapperWithdrawTo() → onlyBundler3
#   stakeEth()          → onlyBundler3
#   wrapStEth()         → onlyBundler3
#   unwrapStEth()       → onlyBundler3
#
# ERC20WrapperAdapter.sol:
#   erc20WrapperDepositFor() → onlyBundler3, receiver = initiator()
#   erc20WrapperWithdrawTo() → onlyBundler3, roundtrip transfer to/from initiator

invariants:

# ============================================================================
# B-AC-01: ETH STRANDING — Anybody can steal residual ETH from Bundler3
# ============================================================================
- id: B-AC-01
  tier: 1
  type: property
  description: "El balance de ETH de Bundler3 debe ser 0 después de cada multicall. ETH residual es robable por el siguiente caller."
  attack_scenario: |
    1. Alice llama multicall{value: 1 ETH} con bundle donde sum(bundle[i].value) = 0.5 ETH
    2. 0.5 ETH residual queda en Bundler3 (NO hay mecanismo de refund en L28-36)
    3. Bob llama multicall{value: 0} con [{to: bob, value: 0.5 ETH, data: "", skipRevert: false, callbackHash: bytes32(0)}]
    4. L63: to.call{value: bundle[i].value}(data) usa address(bundler3).balance, NO msg.value
    5. Bob recibe los 0.5 ETH de Alice

    Vector complementario (skipRevert):
    - Alice usa skipRevert=true con call que revierte. El EVM devuelve el ETH al caller (Bundler3),
      no al usuario original. El ETH queda stranded.

    Vector complementario (adapter receive()):
    - CoreAdapter.receive() es external payable sin access control.
    - Si un contrato envía ETH al adapter durante una operación, queda en el adapter.
    - Un multicall posterior puede drenar vía nativeTransfer o erc20Transfer.
    - PERO: nativeTransfer requiere onlyBundler3, así que solo se drena via multicall.

    INVESTIGADO: ¿Hay refund al final de multicall()? NO.
    L28-36: multicall solo hace initiator=msg.sender, _multicall(bundle), initiator=0. Sin refund.
  impact: "Pérdida directa de ETH para usuarios que envíen más ETH del consumido por el bundle"
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // Invariant: balance de Bundler3 no debe aumentar después de un multicall ajeno
    uint256 balBefore = address(bundler3).balance;
    // ... ejecutar multicall ...
    uint256 balAfter = address(bundler3).balance;
    // Si msg.value > sum(values_consumidos), la diferencia queda stranded
    eq(balAfter, 0, "B-AC-01: ETH residual en Bundler3 — robable");
  ghost_vars:
    - uint256 internal ghost_ethBalanceBefore;
  validated: false
  priority: critical
  confidence: 85
  notes: |
    PATRÓN CONFIRMADO en 3DNS bounty (2 findings HIGH pagados por este mismo bug).
    Diferencia con 3DNS: allí usaban delegatecall (mismo contexto), aquí call (contexto separado).
    El efecto es idéntico: ETH stranded = ETH robable por frontrunner.
    MITIGACIÓN ESPERADA: que el frontend calcule msg.value == sum(values). Pero el contrato
    debe ser seguro independientemente del frontend.
    CONTRAARGUMENTO: Morpho podría argumentar que es responsabilidad del usuario no enviar
    ETH de más. El natspec no promete refund. Necesita verificar la postura del equipo.
    CLAVE: Bundler3 NO tiene receive()/fallback(), así que ETH solo entra via multicall payable.

# ============================================================================
# B-AC-02: PARASWAP SELL/BUY SIN onlyBundler3 — ¿Explotable?
# ============================================================================
- id: B-AC-02
  tier: 2
  type: property
  description: "ParaswapAdapter.sell() y buy() son external/public SIN onlyBundler3. swap() interno sí tiene el modifier. ¿Hay un path de ataque que no pase por swap()?"
  attack_scenario: |
    Análisis detallado:
    - sell() L54-77: external, NO onlyBundler3. Llama updateAmounts() (pure, sin efecto) luego swap().
    - buy() L93-115: public, NO onlyBundler3. Llama updateAmounts() luego swap().
    - buyMorphoDebt() L130-150: external, NO onlyBundler3. Lee deuda de Morpho, llama buy().
    - swap() L165-200: internal onlyBundler3. AQUÍ está el guard real.

    Intento de ataque:
    1. Atacante llama sell() directamente (sin pasar por Bundler3)
    2. sell() ejecuta updateAmounts() — esto es pure, sin side effects
    3. sell() llama swap() — swap() tiene onlyBundler3
    4. msg.sender del sell() es el atacante, NO Bundler3
    5. PERO: swap() es INTERNAL, no external. msg.sender en swap() es el mismo que en sell().
    6. onlyBundler3 en swap() verifica msg.sender == BUNDLER3 → msg.sender es atacante → REVERT

    CONCLUSIÓN: sell()/buy()/buyMorphoDebt() son llamables por cualquiera pero SIEMPRE REVERTIRÁN
    porque swap() (internal) hereda el msg.sender del caller externo.

    ¿HAY SIDE EFFECTS ANTES DE SWAP()?
    - sell(): updateAmounts() modifica callData en MEMORY (no storage). Sin efecto persistente.
    - buy(): mismo — updateAmounts() modifica memory.
    - buyMorphoDebt(): lee MorphoBalancesLib.expectedBorrowAssets (view call). Sin side effect.

    VEREDICTO: No explotable. Pero es una DESVIACIÓN del patrón de seguridad (todos los demás
    adapters usan onlyBundler3 en las funciones externas). Puede ser un QA/informational.
  impact: "No explotable — swap() interno bloquea ejecución. Gas waste para el caller."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Test negativo: sell() debe revertir cuando se llama directamente
    // vm.prank(attacker);
    // vm.expectRevert(ErrorsLib.UnauthorizedSender.selector);
    // paraswapAdapter.sell(augustus, callData, srcToken, destToken, false, offsets, receiver);
    t(true, "B-AC-02: sell/buy sin onlyBundler3 — verificar en Foundry test negativo");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 90
  notes: |
    La falta de onlyBundler3 en sell/buy es INCONSISTENTE con el resto de adapters pero NO es
    explotable gracias a swap() interno. El comentario en swap() L155-156 confirma la intención:
    "Even if this adapter holds no approval, swaps are restricted to Bundler3 here as in all
    adapters in order to simplify the security model."
    PERO: si un futuro refactor mueve swap() a external o elimina onlyBundler3 de swap(),
    sell/buy quedarían completamente abiertos. Riesgo de regresión.
    VEREDICTO: Informational (inconsistencia de patrón).

# ============================================================================
# B-AC-03: MORPHO AUTHORIZATION — Initiator delegation abuse
# ============================================================================
- id: B-AC-03
  tier: 1
  type: property
  description: "Si el usuario autorizó al adapter en Morpho (isAuthorized(user, adapter)=true), un atacante podría explotar esta autorización via multicall si el initiator se pudiera spoof."
  attack_scenario: |
    Pre-condición: Alice ha hecho MORPHO.setAuthorization(adapter, true) para usar morphoBorrow.

    Intento de ataque:
    1. Bob llama bundler3.multicall([{to: adapter, data: morphoBorrow(market, 1000e18, 0, 0, bob)}])
    2. morphoBorrow L248: MORPHO.borrow(market, 1000e18, 0, initiator(), bob)
    3. initiator() = msg.sender de multicall = Bob (NO Alice)
    4. Morpho verifica: isAuthorized(Bob, adapter)? → NO (Bob nunca autorizó el adapter)
    5. REVERT: Morpho rechaza porque Bob no autorizó al adapter

    CONCLUSIÓN: El ataque FALLA porque initiator() = msg.sender del multicall, que es el
    atacante Bob, no la víctima Alice. Bob tendría que ser el initiator, y Morpho verifica
    que el initiator (onBehalf) autorizó al adapter.

    ATAQUE ALTERNATIVO — ¿Se puede hacer que initiator() devuelva Alice cuando Bob llama?
    - initiator es transient storage, set en L31 de multicall() a msg.sender
    - Solo multicall() modifica initiator. No hay setter público.
    - reenter() no modifica initiator — se mantiene el original
    - No hay forma de que Bob haga que initiator sea Alice

    ATAQUE VIA CALLBACK:
    - Bob llama multicall → call a ContractMalicioso con callbackHash → reenter()
    - Durante reenter, initiator SIGUE SIENDO Bob (nunca cambió)
    - Operaciones de Morpho en el reenter usan initiator()=Bob
    - No puede operar como Alice

    VEREDICTO: SEGURO. La identidad del initiator está correctamente protegida por
    transient storage + multicall being the only setter.
  impact: "N/A — initiator identity is sound. No se puede impersonar a otro usuario."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: initiator() SIEMPRE es msg.sender del multicall actual
    // Durante un multicall de address(X):
    address currentInitiator = bundler3.initiator();
    eq(currentInitiator, expectedCaller, "B-AC-03: initiator no es msg.sender de multicall");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 95
  notes: |
    CRÍTICO CONFIRMAR que initiator es inmutable durante todo el ciclo de vida de un multicall.
    Transient storage + L29 require(initiator == address(0)) + L31 initiator=msg.sender + L35
    initiator=0 garantizan que solo hay un initiator activo y es el caller original.

# ============================================================================
# B-AC-04: ERC4626 OWNER CHECK — ¿Se puede abusar owner == initiator()?
# ============================================================================
- id: B-AC-04
  tier: 1
  type: property
  description: "erc4626Withdraw y erc4626Redeem permiten owner == initiator(). Si el user (initiator) aprobó vault shares al adapter, un atacante podría drenar sus shares."
  attack_scenario: |
    Pre-condición: Alice aprobó vault.approve(adapter, MAX) para poder usar erc4626Redeem.
    Alice tiene 1000 shares en el vault.

    Intento:
    1. Bob llama multicall([{to: adapter, data: erc4626Redeem(vault, MAX, 0, bob, initiator())}])
    2. Pero espera — los parámetros se encodean ANTES del multicall. Bob no conoce
       quién será initiator() en el momento de encoding.
    3. Bob pone owner = alice_address directamente en la calldata.
    4. erc4626Redeem L131: require(owner == address(this) || owner == initiator())
    5. initiator() = Bob (él llamó multicall). owner = alice. alice != adapter && alice != Bob.
    6. REVERT con UnexpectedOwner.

    BOB NO PUEDE PONER owner = initiator() dinámicamente — owner es un parámetro fijo en calldata.
    Para que owner == initiator() sea true, owner debe ser la dirección de Bob.
    Pero las shares de Bob, no de Alice.

    ¿Y si Bob pone owner = address(adapter)?
    - L131: owner == address(this) → TRUE
    - L133: shares = IERC4626(vault).balanceOf(address(adapter))
    - Esto redime las shares DEL ADAPTER, no de Alice
    - Si el adapter tiene shares (residuales de otra operación), Bob podría drenarlas
    - VECTOR: tokens residuales en el adapter son robables por cualquier multicall

    VEREDICTO: El owner check es correcto para proteger al initiator. PERO tokens residuales
    en el adapter son robables (ver B-AC-09).
  impact: "El owner check protege correctamente al initiator. El riesgo está en tokens residuales en el adapter."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Test negativo: no se puede redimir shares de otro usuario
    // vm.prank(bob);
    // multicall([erc4626Redeem(vault, MAX, 0, bob_as_receiver, alice_address_as_owner)])
    // → debe revertir con UnexpectedOwner si bob != alice
    t(true, "B-AC-04: erc4626 owner check — test negativo en Foundry");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 90
  notes: |
    El check owner == address(this) || owner == initiator() es correcto.
    initiator() es el msg.sender del multicall, no un parámetro manipulable.
    El riesgo real no es el owner check sino tokens residuales en el adapter.

# ============================================================================
# B-AC-05: REENTER HASH PREDICTABILITY — msg.sender binding
# ============================================================================
- id: B-AC-05
  tier: 2
  type: property
  description: "reenter() es llamable por quien sepa el hash. El hash incluye msg.sender (bytes20(to)), así que solo el target puede reentrar."
  attack_scenario: |
    El esquema de autenticación de reenter():
    - En _multicall, L61: reenterHash = keccak256(bytes20(to) + callbackHash)
    - callbackHash es puesto por el usuario en Call.callbackHash
    - En reenter, L44: require(reenterHash == keccak256(bytes20(msg.sender) + keccak256(msg.data[4:])))

    Para que reenter() funcione:
    - msg.sender debe ser el `to` original
    - keccak256(msg.data[4:]) debe ser el callbackHash original
    - Ambos son fijados por el initiator al construir el bundle

    ¿Puede un frontrunner explotar esto?
    - El frontrunner ve la tx en el mempool con to=X y callbackHash=H
    - Pero NO puede llamar reenter() como X (no es X)
    - Y la tx del frontrunner crearía su propio multicall con su propio initiator
    - El reenterHash es transient — solo existe DURANTE la ejecución del multicall

    ¿Puede X (el target) abusar?
    - Sí, X puede hacer lo que quiera en el reenter bundle
    - PERO el initiator ELIGIÓ llamar a X con ese callbackHash
    - Es consentimiento explícito. Si X es malicioso, es culpa del initiator.

    VEREDICTO: Seguro. El binding de msg.sender al hash es criptográficamente correcto.
  impact: "N/A — solo el target pre-aprobado puede reentrar"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: address != to no puede llamar reenter con el hash correcto
    // vm.prank(attacker); // attacker != to
    // vm.expectRevert(ErrorsLib.IncorrectReenterHash.selector);
    // bundler3.reenter(bundle);
    t(true, "B-AC-05: reenter hash binding — test negativo");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 95
  notes: |
    El diseño es correcto. La preimage del hash incluye:
    1. bytes20(msg.sender) — autentica QUIÉN puede reentrar
    2. keccak256(msg.data[4:]) — autentica QUÉ datos se ejecutan
    Ambos son necesarios. Sin 1, cualquiera podría reentrar. Sin 2, el target podría
    ejecutar un bundle diferente al esperado por el initiator.

# ============================================================================
# B-AC-06: REENTRANCY GUARD — AlreadyInitiated
# ============================================================================
- id: B-AC-06
  tier: 2
  type: property
  description: "multicall() no es reentrable — require(initiator == address(0)) lo bloquea. Ni directamente ni via callbacks."
  attack_scenario: |
    Intento 1: multicall recursivo directo
    - User llama multicall([{to: bundler3, data: multicall(...)}])
    - L29: require(initiator == address(0)) — FALLA (initiator = user desde L31)

    Intento 2: multicall via callback
    - User llama multicall → call a ContractX → ContractX llama bundler3.multicall()
    - L29: FALLA — initiator sigue siendo user

    Intento 3: multicall via reenter
    - reenter() llama _multicall() que incluye call a bundler3.multicall()
    - L29: FALLA — initiator nunca se limpió (solo se limpia en L35, después de _multicall)

    CONCLUSIÓN: No reentrable. El guard transient es correcto.
  impact: "N/A — guard funciona correctamente"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que initiator != address(0) durante cualquier ejecución activa
    // Intentar multicall recursivo debe revertir con AlreadyInitiated
    t(true, "B-AC-06: reentrancy guard — test negativo en Foundry");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 98
  notes: Confirmado seguro. Transient storage + explicit check.

# ============================================================================
# B-AC-07: RESIDUAL TOKENS IN ADAPTER — robables via multicall
# ============================================================================
- id: B-AC-07
  tier: 1
  type: property
  description: "Cualquier token (ERC20, ETH) que quede en un adapter después de una operación puede ser drenado por el SIGUIENTE multicall de cualquier usuario."
  attack_scenario: |
    Escenario concreto:
    1. Alice llama multicall para hacer morphoSupply. Envía 1000 USDC al adapter via erc20TransferFrom.
    2. morphoSupply con assets=900 USDC → solo consume 900 USDC del adapter.
    3. 100 USDC residuales quedan en el adapter.
    4. Alice NO incluye un erc20Transfer(USDC, alice, MAX) al final de su bundle.
    5. Bob monitorea el balance del adapter. Ve 100 USDC.
    6. Bob llama multicall([{to: adapter, data: erc20Transfer(USDC, bob, MAX)}])
    7. erc20Transfer L63-70: onlyBundler3 ✓ (llamado via multicall), amount=MAX → balance del adapter
    8. Bob recibe los 100 USDC de Alice.

    Vectores de acumulación de residuales:
    - morphoSupply con assets < transferido
    - erc4626Deposit con rounding que deja dust
    - swap con positive slippage (dest tokens de más)
    - unwrapNative con amount < balance
    - Cualquier operación con type(uint256).max que no consume todo

    NOTA IMPORTANTE: Los docs y natspec dicen consistentemente "tokens must have been previously
    sent to the adapter" — el diseño ASUME que el adapter es un pass-through efímero. Los tokens
    no deben quedarse. Pero si lo hacen, son robables.

    CONTRAARGUMENTO: Esto es by design. Los SDKs/frontends deben incluir "skim" al final.
    Pero el contrato no lo enforce.
  impact: "Pérdida de tokens residuales para usuarios que no limpien el adapter en su bundle"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Después de cada multicall, el adapter no debe tener tokens residuales
    uint256 adapterBalance = IERC20(token).balanceOf(address(adapter));
    eq(adapterBalance, 0, "B-AC-07: tokens residuales en adapter — robables");
  ghost_vars:
    - "mapping(address => uint256) internal ghost_adapterBalanceBefore;"
  validated: false
  priority: critical
  confidence: 75
  notes: |
    Probablemente "by design" / known risk. El natspec lo implica al decir "tokens must have
    been previously sent to the adapter". Pero la pregunta es: ¿es un finding reportable?
    En contexto de bug bounty, si los SDKs/frontends cometen errores, los fondos se pierden.
    Depende de si Morpho considera esto in-scope o "user error".
    VERIFICAR: ¿Hay documentación que diga "siempre skim al final"?

# ============================================================================
# B-AC-08: ARBITRARY CALL — Bundler3 como proxy de ataque
# ============================================================================
- id: B-AC-08
  tier: 2
  type: property
  description: "Bundler3 ejecuta call arbitrario a cualquier dirección. Si alguien erróneamente le da allowance o autorización, es drainable instantáneamente."
  attack_scenario: |
    Pre-condición: Un protocolo/usuario hace token.approve(bundler3, MAX) por error.
    1. Atacante llama multicall([{to: token, data: transferFrom(victima, atacante, balance)}])
    2. L63: token.call(transferFrom(...)) — msg.sender es Bundler3
    3. Token ve que Bundler3 tiene allowance de la victima → transfer exitoso
    4. Atacante drena todos los tokens aprobados

    PERO ESPERA: transferFrom(from, to, amount) — from es la víctima que aprobó al Bundler3,
    no el Bundler3 mismo. Si la víctima aprobó al Bundler3, el atacante usa Bundler3 como proxy.

    Variante con autorización Morpho:
    Si un usuario hace MORPHO.setAuthorization(bundler3, true):
    1. Atacante llama multicall([{to: morpho, data: borrow(market, amount, 0, victim, attacker)}])
    2. Morpho ve msg.sender=bundler3, isAuthorized(victim, bundler3)=true
    3. Borrow ejecuta en nombre de victim, funds van a attacker

    NATSPEC L13: "Anybody can do arbitrary calls with this contract, so it should not be
    approved/authorized anywhere." — DOCUMENTADO pero no enforced en código.
  impact: "Pérdida total de fondos si Bundler3 recibe aprobaciones/autorizaciones por error"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Monitoreo: Bundler3 no debe tener allowances ni autorizaciones
    // No es fuzzeable — es un invariante operacional
    t(true, "B-AC-08: arbitrary call risk — documentado, no enforced");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: |
    Documentado explícitamente en natspec. No es un "bug" per se — es un riesgo operacional.
    PERO: los adapters dejan allowances max a Morpho (L197: forceApprove(..., max)) y NUNCA
    las revocan ("Morpho's allowance is not reset as it is trusted"). Esto es en el ADAPTER,
    no en Bundler3. Si Morpho es comprometido, los tokens en el adapter son drenables.
    Separar del riesgo de Bundler3 — crear hipótesis específica para adapter allowances.

# ============================================================================
# B-AC-09: ADAPTER PERMANENT APPROVALS — forceApprove sin reset
# ============================================================================
- id: B-AC-09
  tier: 1
  type: property
  description: "GeneralAdapter1 deja allowances permanentes (type(uint256).max) hacia Morpho y NUNCA las revoca. Si Morpho se compromete, todos los tokens en el adapter son drenables."
  attack_scenario: |
    Código relevante:
    - L197: SafeERC20.forceApprove(IERC20(loanToken), address(MORPHO), type(uint256).max);
    - Comentario L196: "Morpho's allowance is not reset as it is trusted."
    - Igual en L225 (collateral), L286 (repay), L344 (flashloan)

    El adapter le da MAX allowance a Morpho para CADA token que toca. Nunca la revoca.

    Riesgo directo: bajo, porque el adapter no debería tener tokens residuales.
    Riesgo indirecto: si Morpho tiene un bug que permite drenar allowances, cualquier token
    que pase por el adapter queda expuesto.

    Comparar con ERC4626 en el mismo contrato:
    - L60: forceApprove(underlyingToken, vault, MAX)
    - L64: forceApprove(underlyingToken, vault, 0) ← SÍ REVOCA
    - Patrón inconsistente: Morpho = trusted (no revoca), vaults = untrusted (sí revoca)

    Comparar con ParaswapAdapter:
    - L181: forceApprove(srcToken, augustus, MAX) ← antes del swap
    - L186: forceApprove(srcToken, augustus, 0) ← REVOCA después del swap
    - Augustus = untrusted (revoca después de cada swap)

