  - id: ARC-W-07
    title: "autoCompound: reentrancy NOT possible — confirmed by nonReentrant modifier"
    tier: 1
    type: reentrancy
    confidence: 95
    description: >
      autoCompound() has `nonReentrant` (Automator inherits ReentrancyGuard).
      Any callback during autoCompound (e.g., from ERC777 token transfer, or
      Slipstream pool callback) would be blocked by the reentrancy lock.
      execute() does NOT have nonReentrant — potential issue but lower practical risk
      since execute() is typically called by vault.transform() which doesn't re-enter.
    affected_line: "AutoRangeAndCompound.sol:416 autoCompound() modifier"
    status: confirmed_safe
    solidity: |
      // INV-ARC-W-07: autoCompound reentrancy blocked by ReentrancyGuard
      // execute() missing nonReentrant is asymmetric but low practical risk

  - id: ARC-W-08
    title: "autoCompound with vault: tokenId health check after compound — position could be unhealthy"
    tier: 2
    type: economic
    confidence: 65
    description: >
      autoCompoundWithVault() integrates with V3Vault.
      After compound, should a health check be performed?
