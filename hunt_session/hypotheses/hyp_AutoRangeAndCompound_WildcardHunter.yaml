  - id: ARC-W-05
    title: "autoCompound: leftover sent to withdrawer, not position owner — wrong recipient"
    tier: 2
    type: accounting
    confidence: 75
    description: >
      After autoCompound adds liquidity, any remaining tokens (leftover) are sent to
      'withdrawer' or 'rewardConversion' address, not necessarily to the position owner.
      The withdrawer is set by the operator configuration.
      If the position owner expected leftovers to go back to them, they lose this value.
      Attack: operator configures withdrawer to be their own address, extracts all leftovers.
      This is operator privilege abuse (requires trusted operator), so severity is lower.
    affected_line: "AutoRangeAndCompound.sol:~525 (leftover transfer)"
    status: low_priority
    solidity: |
      // INV-ARC-W-05: leftover recipients are transparently configured

