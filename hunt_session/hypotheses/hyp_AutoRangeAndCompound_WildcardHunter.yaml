invariants:
  - id: ARC-W-01
    title: "execute: transformedTokenId stuck if execute() reverts after vault unstakes position"
    tier: 1
    type: atomicity
    confidence: 85
    description: >
      V3Vault._transform() sequence:
      1. Sets transformedTokenId = tokenId (line 521)
      2. Calls transformer.execute() (line 535)
      3. Reads newTokenId = transformedTokenId (line 550) — could have been updated by onERC721Received
      4. Runs _requireLoanIsHealthy(newTokenId) (line 579)
      5. Resets transformedTokenId = 0 (line 581)

      For GaugeManager integration with AutoRangeAndCompound:
      - Before _transform(), GaugeManager._unstakePosition() unstakes from gauge
      - execute() runs: mints newTokenId, but if health check (step 4) fails,
        vault reverts at step 4 with transformedTokenId NOT reset to 0.

      Wait — step 5 resets it, but if step 4 reverts, step 5 never executes.
      So if _requireLoanIsHealthy fails, transformedTokenId remains set.

      Consequence: tokenId is permanently in "transform mode". All vault operations
      that check transformedTokenId != 0 will be blocked.
      CRITICAL: liquidate(), borrow(), transform() all check or use transformedTokenId.
      If this is stuck, the position cannot be liquidated → bad debt.
    affected_line: "V3Vault.sol:521-581 _transform()"
    attack_scenario: >
      1. Position has debt near max collateral factor
      2. Keeper calls vault.transform(tokenId, address(autoRangeAndCompound), params)
      3. GaugeManager unstakes position (outside _transform scope)
      4. V3Vault._transform() sets transformedTokenId = tokenId
      5. autoRangeAndCompound.execute() runs: mints newTokenId, transfers to vault
      6. V3Vault.onERC721Received sets transformedTokenId = newTokenId, migrates loan
      7. Health check on newTokenId fails (price moved, position now undercollateralized)
      8. _transform() reverts at step 4 (health check revert)
      9. transformedTokenId is now STUCK at newTokenId

      Wait — if the revert propagates up from step 4, all state changes in the current
      call stack revert. But what about the onERC721Received at step 6?
      That was a CALLBACK from npm.safeTransferFrom — also in the call stack → reverts.

      So the revert should unwind everything including transformedTokenId.
      NEED TO VERIFY: is there a case where GaugeManager state doesn't revert?
    verification_needed: >
      Check if GaugeManager._unstakePosition() is called BEFORE V3Vault._transform()
      (outside the EVM call stack) or WITHIN it. If outside, the unstake persists on revert.
    status: needs_verification
    solidity: |
      // INV-ARC-W-01: transformedTokenId always returns to 0 after transform attempt
      function invariant_transformedTokenId_alwaysZeroAfterTransform() public view virtual {}

  - id: ARC-W-02
    title: "autoCompound: MEV keeper extracts value via amountOutMin=0 on every compound"
    tier: 1
    type: economic
    confidence: 80
    description: >
      Confirmed independently from OracleHunter (ARC-O-01) perspective.
      From WildcardHunter angle: this is a SYSTEMIC keeper-MEV pattern.
      Any entity that becomes an approved keeper can:
      1. Monitor positions with accumulated fees
      2. Front-run their own autoCompound call with a pool manipulation
      3. Call autoCompound (gets keeper reward + extracts MEV from zero-slippage swap)
      4. Back-run to restore price

      Double extraction: keeper reward (legitimate) + MEV extraction (illegitimate).
      The compound fee goes to the protocol, but the MEV extraction goes to the attacker.

      This is NOT a theoretical risk — it's the standard behavior for any keeper that is
      also an MEV bot, which is the rational economic strategy.
    affected_line: "AutoRangeAndCompound.sol:470 _poolSwap(..., 0)"
    attack_scenario: >
      Keeper bot strategy:
      1. Monitor AutoRangeAndCompound events for pending compounds
      2. Calculate: can I sandwich this swap and still pass TWAP check?
         (TWAP check passes if |spot - twap| < 200 ticks)
      3. If yes: front-run to move spot price ~1.9% (just under 200 ticks)
      4. Submit autoCompound transaction (gets keeper reward)
      5. Back-run to restore price
      6. Net profit = MEV extraction - front-run cost - gas

      For competitive keeper market: keepers undercut each other on speed,
      but all have same MEV opportunity due to hardcoded amountOutMin=0.
    severity: MEDIUM
    status: confirmed_reportable
    solidity: |
      // INV-ARC-W-02: autoCompound must pass amountOutMin derived from TWAP
      // Fix: compute amountOutMin = amountIn * twapPrice * (1 - maxSlippage)
