  - id: ARC-W-03
    title: "execute: config ordering — config set AFTER NFT transfer to vault"
    tier: 2
    type: ordering
    confidence: 68
    description: >
      Independently confirms ARC-A-03. The window between NFT transfer and config setup
      is a single transaction (atomic), so re-entry within that tx would need a malicious
      vault. With the standard V3Vault, this window is not exploitable.
      However: the config for newTokenId is copied from oldTokenId's config.
      If the old config had different parameters than intended for the new range,
      the new position starts with wrong configuration.
      This is a UX concern: users expect the config to automatically adapt to the new range.
      lowerTickDelta/upperTickDelta in the new config still relative to the new baseTick,
      which is different from the old baseTick — so the deltas should still work correctly.
    affected_line: "AutoRangeAndCompound.sol:~350 (config copy)"
    status: low_priority
    solidity: |
      // INV-ARC-W-03: config migration is correct (deltas are relative, not absolute)

  - id: ARC-W-04
    title: "execute: position becomes permanently frozen if vault.transform() reverts on health check"
    tier: 1
    type: atomicity
    confidence: 85
    description: >
      Deep analysis of the V3Vault._transform() + GaugeManager interaction.

      Key question: Is GaugeManager._unstakePosition() called inside or outside _transform()?

      Looking at V3Vault code path:
      - vault.transform() → _transform() → calls transformer.execute()
      - BUT: for staked positions, V3Vault._transform() calls GaugeManager._unstakePosition()
        at line ~520 (before calling transformer)
      - This unstake is WITHIN the _transform() call stack → reverts atomically on failure

      ALTERNATIVE PATH (more dangerous):
      - GaugeManager.beforeTransform() or similar hook called by V3Vault BEFORE _transform()
      - If this is a separate transaction or OUTSIDE the revert scope, unstake persists

      Need to check: does V3Vault call GaugeManager for unstake WITHIN _transform(), or
      is there a separate preparatory call that precedes _transform()?
    affected_line: "V3Vault.sol:_transform(), GaugeManager.sol:_unstakePosition()"
    verification_needed: >
      Read V3Vault lines 505-582 carefully and trace ALL GaugeManager calls.
      Determine if _unstakePosition is called (a) inside _transform() or (b) as a prerequisite.
      If (b): failing health check after rerange means unstaked position with no autoRange config.
    status: needs_verification
    solidity: |
