# ═══════════════════════════════════════════════════════════════════════════
# FL-10: Fee share rounding to zero on small interest — fee theft via frequent accruals
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-10
  tier: 2
  type: property
  title: Fee shares round to zero on small interest amounts — griefable by frequent accruals
  description: >
    accrueInterestView() at L675-678 computes fee shares using mulDivDown with
    denominator (newTotalAssetsWithoutFees + 1). For small interest amounts, the
    result rounds to 0 — fee recipient gets nothing. An attacker can trigger
    accrueInterest() very frequently (every block) to ensure interest per call
    is always tiny, stealing fees from the fee recipient via rounding.
  attack_scenario: >
    1. Vault has small total assets (1e6 USDC). performanceFee = 50%.
    2. Interest per block is ~100 wei. performanceFeeAssets = 50 wei.
    3. feeShares = 50 * (totalSupply + virtualShares) / (999950 + 1).
    4. With small totalSupply, result rounds to 0.
    5. Attacker calls accrueInterest every block — fees always round to 0.
    6. Fee recipient gets nothing despite interest accruing.
  impact: >
    Fee recipient griefed out of expected fees. Low-decimal tokens (USDC) more
    vulnerable. Economically viable only if gas < expected fee value.
  impact_rating: Low
  likelihood: Medium
  severity: Low
  confidence: 60
  solidity: |
    uint256 internal ghost_totalFeeSharesMinted;
    uint256 internal ghost_totalInterestAccrued;

    function property_fl_10() public {
      // Over time, fee shares should be proportional to interest
      if (ghost_totalInterestAccrued > 1e6) {
        // At least some fee shares should have been minted
        t(ghost_totalFeeSharesMinted > 0, "FL-10: interest accrued but zero fee shares minted");
      }
    }
  affected_functions:
    - accrueInterest
    - accrueInterestView
  ghost_vars:
    - 'uint256 internal ghost_totalFeeSharesMinted'
    - 'uint256 internal ghost_totalInterestAccrued'
  validated: false
  priority: low
  notes: >
    Docs say "Both fees are rounded down, so fee recipients could receive less than
    expected." Acknowledged. The griefing angle via frequent small accruals may not
    be documented explicitly.

# ═══════════════════════════════════════════════════════════════════════════
# FL-11: Management fee can exceed total assets on stale vaults — permanent DoS
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-11
  tier: 1
  type: property
  title: Management fee overflow on stale vault — accrueInterest reverts permanently bricking vault
  description: >
    managementFeeAssets at L670 = (newTotalAssets * elapsed).mulDivDown(managementFee, WAD).
    Docs warn "Interest should be accrued at least every 10 years." If uninteracted for
    >10 years with MAX_MANAGEMENT_FEE (5% APR), managementFeeAssets can approach
    newTotalAssets. At L674: newTotalAssetsWithoutFees = newTotalAssets - fees. If fees >
    newTotalAssets, arithmetic underflow reverts in 0.8.x. Vault permanently bricked —
    every interaction calls accrueInterest which always reverts.
  attack_scenario: >
    1. Vault with managementFee = MAX_MANAGEMENT_FEE, small balance.
    2. No interaction for 11 years. elapsed = 11 * 365 days.
    3. managementFeeAssets = newTotalAssets * 11y * 0.05/y = 0.55 * newTotalAssets.
    4. Combined with performanceFee: total fees > newTotalAssets.
    5. L674 underflows. Every function calling accrueInterest reverts.
    6. All depositor funds locked forever.
  impact: >
    Permanent DoS and fund lock if vault uninteracted for extended period with
    high fees. Documented liveness requirement but could trap unaware users.
  impact_rating: High
  likelihood: Low
  severity: Medium
  confidence: 65
  solidity: |
    function property_fl_11() public {
      // accrueInterestView should never revert — if it does, vault is bricked
      (uint256 newTotalAssets, uint256 perfShares, uint256 mgmtShares) = vault.accrueInterestView();
      gte(newTotalAssets, 0, "FL-11: accrueInterestView should succeed");
      uint256 totalFeeShares = perfShares + mgmtShares;
      lte(totalFeeShares, vault.totalSupply() * 10, "FL-11: fee shares exceed 10x totalSupply");
    }
  affected_functions:
    - accrueInterest
    - accrueInterestView
  ghost_vars: []
  validated: false
  priority: medium
  notes: >
    Documented liveness requirement. Vault must be pinged at least every 10 years.
    Worth confirming exact threshold and whether any keeper mechanism exists.

# ═══════════════════════════════════════════════════════════════════════════
# FL-12: Adapter allocation tracking diverges from real positions over time
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-12
  tier: 1
  type: property
  title: Caps allocation tracking relies on adapter-reported change values — diverges from real positions
  description: >
    allocateInternal L579 and deallocateInternal L607 update caps[id].allocation
    using (int256(allocation) + change) where change comes from the adapter. If
    the adapter has entry/exit fees, rounding, or bugs, the reported change diverges
    from actual position value. Over many cycles, allocation tracking drifts, making
    caps ineffective. An over-reporting adapter allows more allocation than intended.
  attack_scenario: >
    1. Adapter with 0.1% entry fee. Vault allocates 100e18.
    2. Adapter reports change = +100e18 but real position is 99.9e18.
    3. caps[id].allocation = 100e18, real exposure = 99.9e18.
    4. Over 1000 cycles: allocation says 100000e18 in/out but real position drifted.
    5. Caps checks against inflated allocation values — may be too restrictive or loose.
  impact: >
    Cap enforcement becomes inaccurate. Could allow over-concentration in risky
    markets or prevent allocation to safe markets.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 55
  solidity: |
    uint256 internal ghost_cumulativeAllocated;
    uint256 internal ghost_cumulativeDeallocated;

    function property_fl_12() public {
      for (uint256 i = 0; i < vault.adaptersLength(); i++) {
        address adapter = vault.adapters(i);
        uint256 realAssets = IAdapter(adapter).realAssets();
        // Adapter realAssets should be positive and bounded
        gte(realAssets + 1, 1, "FL-12: adapter realAssets sanity check");
      }
    }
  affected_functions:
    - allocateInternal
    - deallocateInternal
    - allocate
    - deallocate
  ghost_vars:
    - 'uint256 internal ghost_cumulativeAllocated'
    - 'uint256 internal ghost_cumulativeDeallocated'
  validated: false
  priority: medium
  notes: >
    Adapter spec says "sum of changes must be exactly the current estimated position."
    Trust assumption. Testing with real adapters would reveal drift magnitude.

# ═══════════════════════════════════════════════════════════════════════════
# FL-13: Roundtrip deposit-withdraw should never profit the user
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-13
  tier: 1
  type: property
  title: Atomic deposit-then-withdraw roundtrip must never yield profit for the depositor
  description: >
    A user depositing X assets and immediately withdrawing should get back <= X assets
    (minus rounding in vault's favor). previewDeposit rounds shares DOWN, previewWithdraw
    rounds shares UP — both favor the vault. But if the exchange rate changes between
    the two operations (e.g., via fee share minting in accrueInterest, or via
    allocateInternal side effects in enter()), the user could extract value.
  attack_scenario: >
    1. Attacker calls deposit(X) in same tx as redeem(all_shares).
    2. Between deposit and redeem, accrueInterest only runs once (transient).
    3. enter() calls allocateInternal which updates caps — could this change rate?
    4. allocateInternal doesn't change _totalAssets or totalSupply directly.
    5. BUT: adapter.allocate() returns (ids, change) — change is for cap tracking only.
    6. If the adapter somehow returns assets to vault (unlikely), rate changes.
  impact: >
    If roundtrip is profitable, infinite extraction loop. Fundamental ERC4626 invariant.
  impact_rating: Critical
  likelihood: Low
  severity: High
  confidence: 75
  solidity: |
    uint256 internal ghost_userBalanceBefore;
    uint256 internal ghost_userSharesBefore;

    function property_fl_13() public {
      // After deposit+redeem in same block, user should not have more assets than started
      // Track via ghost: if deposit happened, then redeem happened, compare
      uint256 userAssets = IERC20(vault.asset()).balanceOf(msg.sender);
      if (ghost_userBalanceBefore > 0) {
        lte(userAssets, ghost_userBalanceBefore, "FL-13: user profited from deposit-withdraw roundtrip");
      }
    }
  affected_functions:
    - deposit
    - withdraw
    - redeem
    - enter
    - exit
  ghost_vars:
    - 'uint256 internal ghost_userBalanceBefore'
    - 'uint256 internal ghost_userSharesBefore'
  validated: false
  priority: critical
  notes: >
    Fundamental ERC4626 property. Rounding directions should protect vault.
    Fuzz extensively with edge case amounts (0, 1, type(uint256).max).

# ═══════════════════════════════════════════════════════════════════════════
# FL-14: forceDeallocate penalty burns shares from onBehalf via withdraw allowance
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-14
  tier: 1
  type: property
  title: forceDeallocate burns onBehalf shares via withdraw — approved spenders can grief
  description: >
    forceDeallocate(adapter, data, assets, onBehalf) at L828 calls
    withdraw(penaltyAssets, address(this), onBehalf). exit() checks if msg.sender != onBehalf
    and requires allowance. So a third party calling forceDeallocate with onBehalf=victim
    needs victim's share allowance. Routers/bundlers commonly have max approval.
    A malicious or compromised router can call forceDeallocate repeatedly to drain
    victim's shares as penalty, with the assets going to the vault (address(this))
    benefiting remaining depositors.
  attack_scenario: >
    1. User approves bundler contract for max shares (common pattern).
    2. Malicious bundler calls forceDeallocate(adapter, data, maxAmount, user).
    3. penaltyAssets = maxAmount * penalty / WAD. penalty = 2% max.
    4. withdraw(penaltyAssets, vault, user) — burns user's shares, assets stay in vault.
    5. User loses shares. Value socialized to remaining depositors.
    6. Bundler repeats until user has no shares left.
  impact: >
    Approved spenders can drain victim's shares via penalty burns. Requires existing
    max approval which is common with bundlers/routers. Value not stolen but
    redistributed.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 70
  solidity: |
    uint256 internal ghost_sharesBurnedAsPenalty;
    address internal ghost_lastPenaltyVictim;

    function property_fl_14() public {
      // forceDeallocate should only burn proportional penalty shares
      // The penalty must be bounded by MAX_FORCE_DEALLOCATE_PENALTY (2%)
      if (ghost_sharesBurnedAsPenalty > 0) {
        gte(ghost_sharesBurnedAsPenalty, 0, "FL-14: penalty shares burned sanity");
      }
    }
  affected_functions:
    - forceDeallocate
    - withdraw
    - exit
  ghost_vars:
    - 'uint256 internal ghost_sharesBurnedAsPenalty'
    - 'address internal ghost_lastPenaltyVictim'
  validated: false
  priority: high
  notes: >
    By design — forceDeallocate penalizes onBehalf. But third-party invocation
    with existing allowance is a griefing vector. Check bundler/router patterns.

false_positives:
- hunter: FlowHunter
  id: FL-FP-01
  reason: >
    Fee-on-transfer token support: VaultV2 uses SafeERC20Lib.safeTransfer and
    safeTransferFrom. Docs at L115-116 EXPLICITLY state tokens with fees on
    transfer are not supported. Documented design decision, not a bug.
  investigated_at: '2026-03-25T00:00:00Z'

- hunter: FlowHunter
  id: FL-FP-02
  reason: >
    multicall reentrancy via delegatecall: delegatecall executes in vault's own
    context — equivalent to calling functions in sequence. Transient firstTotalAssets
    correctly prevents double interest accrual. Interest-once-per-tx is by design (L37).
  investigated_at: '2026-03-25T00:00:00Z'

- hunter: FlowHunter
  id: FL-FP-03
  reason: >
    enter() ordering — createShares before allocateInternal: This is the SAFE ordering.
    Shares and assets are recorded BEFORE external call to adapter. If adapter reenters,
    exchange rate is already correct. allocateInternal is a "use of funds" step. If it
    reverts, entire deposit reverts atomically.
  investigated_at: '2026-03-25T00:00:00Z'

- hunter: FlowHunter
  id: FL-FP-04
  reason: >
    forceDeallocate double-deallocate from same adapter: MAX_FORCE_DEALLOCATE_PENALTY
    = 0.02e18 (2%). penaltyAssets = assets * 2% = at most 2% of deallocated amount.
    Since full deallocated amount enters idle, idle always covers penalty withdrawal.
    Double-deallocate from same adapter impossible.
  investigated_at: '2026-03-25T00:00:00Z'
