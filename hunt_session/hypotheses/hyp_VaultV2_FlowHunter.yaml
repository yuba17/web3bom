# FL-09: forceDeallocate with zero penalty — free allocation manipulation
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-09
  tier: 1
  type: property
  title: forceDeallocate costs nothing if forceDeallocatePenalty[adapter] == 0 (default)
  description: >
    forceDeallocate() at L827 computes penaltyAssets = assets.mulDivUp(forceDeallocatePenalty[adapter], WAD).
    Default forceDeallocatePenalty is 0 for all adapters. If curator never sets it,
    anyone can forceDeallocate at zero cost, arbitrarily moving funds from adapters
    back to idle. This griefs the vault's allocation strategy.
  attack_scenario: >
    1. Adapter X has forceDeallocatePenalty = 0 (never configured).
    2. Attacker calls forceDeallocate(X, data, 1000e18, attacker).
    3. penaltyAssets = 0, penaltyShares = 0. Zero cost.
    4. 1000e18 pulled from adapter X to vault idle. Zero yield on idle.
    5. Repeated griefing disrupts vault allocation strategy, reducing yield for all depositors.
  impact: >
    Free allocation griefing. Attacker disrupts investment strategy at zero cost.
    Vault earns less yield, harming all depositors.
  impact_rating: Medium
  likelihood: High
  severity: Medium
  confidence: 80
  solidity: |
    uint256 internal ghost_penaltyPaid;

    function property_fl_09() public {
      for (uint256 i = 0; i < vault.adaptersLength(); i++) {
        address adapter = vault.adapters(i);
        uint256 penalty = vault.forceDeallocatePenalty(adapter);
        t(penalty > 0, "FL-09: adapter has zero forceDeallocatePenalty — free griefing possible");
      }
    }
  affected_functions:
    - forceDeallocate
    - deallocateInternal
  ghost_vars:
    - 'uint256 internal ghost_penaltyPaid'
  validated: false
