# ═══════════════════════════════════════════════════════════════════════════
# FL-01: CEI violation in exit() — deallocate before state update
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-01
  tier: 1
  type: property
  title: CEI violation in exit() — deallocateInternal external call before deleteShares and _totalAssets update
  description: >
    exit() at L793-811 calls deallocateInternal() (external call to adapter at L602)
    BEFORE deleteShares() at L807 and _totalAssets -= at L808. If the adapter
    reenters vault during deallocate callback, shares are minted/burned at inflated
    rate because totalSupply and _totalAssets haven't been reduced yet. No reentrancy
    guard exists — only the adapter trust assumption.
  attack_scenario: >
    1. Malicious adapter on deallocate() calls back into vault.deposit().
    2. deposit() → accrueInterest() returns early (firstTotalAssets set).
    3. previewDeposit() uses current totalSupply (NOT yet reduced) and _totalAssets (NOT yet reduced).
    4. Attacker gets shares at PRE-withdrawal rate, then exit completes burning original shares.
    5. Net: extra shares minted at favorable rate, diluting other depositors.
  impact: >
    Fund theft via share dilution. Depends on whether curator-approved adapters can reenter.
    Docs say they MUST NOT but it's not enforced on-chain.
  impact_rating: High
  likelihood: Low
  severity: Medium
  confidence: 40
  solidity: |
    uint256 internal ghost_exitReentrancyDepth;

    function property_fl_01() public {
      // After any exit operation, totalAssets decreased implies totalSupply decreased
      uint256 supplyAfter = vault.totalSupply();
      uint256 totalAssetsAfter = uint256(vault._totalAssets());
      if (totalAssetsAfter < ghost_totalAssetsBeforeExit) {
        t(supplyAfter < ghost_totalSupplyBeforeExit, "FL-01: totalAssets decreased but totalSupply did not");
      }
    }
  affected_functions:
    - exit
    - withdraw
    - redeem
    - deallocateInternal
  ghost_vars:
    - 'uint256 internal ghost_totalSupplyBeforeExit'
    - 'uint256 internal ghost_totalAssetsBeforeExit'
    - 'uint256 internal ghost_exitReentrancyDepth'
  validated: false
  priority: high
  notes: >
    Adapter trust model says adapters must not reenter. No mutex/nonReentrant modifier.
    firstTotalAssets only prevents double interest accrual, not reentrant deposit/withdraw.

# ═══════════════════════════════════════════════════════════════════════════
# FL-02: forceDeallocate double external call chain — stale state between calls
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-02
  tier: 1
  type: property
  title: forceDeallocate executes deallocateInternal then withdraw with stale interest state
  description: >
    forceDeallocate() at L822-831 calls deallocateInternal() (external call #1 to adapter)
    then withdraw() which calls exit() potentially triggering deallocateInternal() again
    (external call #2 to liquidityAdapter). The first deallocateInternal does NOT call
    accrueInterest() — interest is only accrued when withdraw() runs. Caps allocation
    tracking is updated with pre-interest-accrual values.
  attack_scenario: >
    1. Significant interest has accrued since last interaction (realAssets >> _totalAssets).
    2. Anyone calls forceDeallocate(adapter, data, amount, victim).
    3. deallocateInternal runs with stale _totalAssets, updates caps[id].allocation.
    4. withdraw() then calls accrueInterest(), updating _totalAssets to real value.
    5. Caps allocation is now inconsistent — set against stale state.
    6. Subsequent allocate() calls may bypass intended cap ratios.
  impact: >
    Cap enforcement inaccuracy after forceDeallocate during high interest periods.
    Allocators could over-allocate to risky markets.
  impact_rating: Medium
  likelihood: Low
  severity: Medium
  confidence: 35
  solidity: |
    uint256 internal ghost_totalAssetsPreForceDeallocate;

    function property_fl_02() public {
      uint256 totalAssetsAfter = uint256(vault._totalAssets());
      uint256 supplyAfter = vault.totalSupply();
      if (ghost_totalAssetsPreForceDeallocate > 0) {
        // After forceDeallocate, totalAssets should have decreased by penaltyAssets
        lte(totalAssetsAfter, ghost_totalAssetsPreForceDeallocate, "FL-02: totalAssets increased after forceDeallocate");
        // totalSupply must also have decreased (penalty shares burned)
        t(supplyAfter <= ghost_totalSupplyBeforeExit, "FL-02: no shares burned in forceDeallocate");
      }
    }
  affected_functions:
    - forceDeallocate
    - deallocateInternal
    - withdraw
    - exit
  ghost_vars:
    - 'uint256 internal ghost_totalAssetsPreForceDeallocate'
  validated: false
  priority: high
  notes: >
    Stale _totalAssets during first deallocateInternal is concerning but impact
    limited because deallocateInternal uses adapter-returned change values, not
    _totalAssets directly.

# ═══════════════════════════════════════════════════════════════════════════
# FL-03: allocateInternal accrues interest but deallocateInternal does not
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-03
  tier: 1
  type: property
  title: Asymmetric accrueInterest between allocate and deallocate paths
  description: >
    allocateInternal() at L572 calls accrueInterest() before transferring assets.
    deallocateInternal() does NOT call accrueInterest(). In forceDeallocate flow,
    the first deallocateInternal at L826 executes with stale interest. The caps
    allocation update uses pre-interest values. This asymmetry means cap enforcement
    is based on different time snapshots depending on the operation direction.
  attack_scenario: >
    1. Time passes, adapters earn interest. _totalAssets is stale.
    2. Attacker calls forceDeallocate(adapter, data, amount, self).
    3. deallocateInternal: allocation -= change (against stale _totalAssets).
    4. withdraw → accrueInterest → _totalAssets jumps up to real value.
    5. Attacker then calls allocate with stale allocation values — relative cap
       check uses firstTotalAssets (now updated) vs allocation (stale).
    6. More allocation allowed than intended because allocation was reduced
       against stale values but cap check uses fresh totalAssets.
  impact: >
    Cap bypass via allocation tracking inconsistency. Risk concentrated in
    scenarios with large interest accrual between interactions.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 50
  solidity: |
    uint256 internal ghost_lastAccrueTimestamp;

    function property_fl_03() public {
      uint256 idle = IERC20(vault.asset()).balanceOf(address(vault));
      uint256 totalAssets = uint256(vault._totalAssets());
      uint256 sumAllocations = 0;
      for (uint256 i = 0; i < vault.adaptersLength(); i++) {
        sumAllocations += IAdapter(vault.adapters(i)).realAssets();
      }
      uint256 realTotal = idle + sumAllocations;
      uint256 deviation = realTotal > totalAssets
        ? realTotal - totalAssets
        : totalAssets - realTotal;
      lte(deviation, totalAssets / 1000 + 1, "FL-03: allocation tracking deviates >0.1% from real assets");
    }
  affected_functions:
    - allocateInternal
    - deallocateInternal
    - forceDeallocate
  ghost_vars:
    - 'uint256 internal ghost_lastAccrueTimestamp'
  validated: false
  priority: medium
  notes: >
    The caps system uses adapter-returned change values, not realAssets(). The
    asymmetry creates drift potential. Needs fork testing with real adapters.

# ═══════════════════════════════════════════════════════════════════════════
# FL-04: Donation attack — direct transfer inflates balanceOf in accrueInterestView
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-04
  tier: 1
  type: property
  title: Direct token donation inflates realAssets in accrueInterestView via balanceOf read
  description: >
    accrueInterestView() at L655 reads IERC20(asset).balanceOf(address(this)) to
    compute realAssets. A direct transfer to the vault inflates this value. While
    maxRate caps growth via min(realAssets, maxTotalAssets) at L660, the cap allows
    _totalAssets * elapsed * maxRate / WAD of growth. With MAX_MAX_RATE = 200% APR
    and long elapsed periods, substantial donations can be absorbed. An attacker
    front-runs with deposit, then donation takes effect on next accrueInterest.
  attack_scenario: >
    1. Vault idle for 30 days, _totalAssets = 100e18, maxRate = MAX_MAX_RATE.
    2. maxTotalAssets = 100e18 + 100e18 * 30days * MAX_MAX_RATE / WAD ≈ 116.4e18.
    3. Attacker deposits 100e18, gets ~100e18 shares (50% of supply).
    4. Attacker donates 50e18 directly via asset.transfer(vault, 50e18).
    5. Next accrueInterest: realAssets = 250e18, newTotalAssets = min(250, 216.4) = 216.4e18.
    6. Interest = 16.4e18 distributed to all shareholders including attacker.
    7. Attacker extracts value from existing depositors proportional to their share.
  impact: >
    Share price manipulation via donation. maxRate mitigates but does not prevent
    if vault is stale or maxRate is high. Known Solodit HIGH finding for VaultV2.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 65
  solidity: |
    uint256 internal ghost_totalAssetsBeforeDonation;

    function property_fl_04() public {
      uint256 currentTotal = uint256(vault._totalAssets());
      uint256 elapsed = block.timestamp - vault.lastUpdate();
      if (ghost_totalAssetsBeforeDonation > 0 && elapsed > 0) {
        uint256 maxGrowth = (ghost_totalAssetsBeforeDonation * elapsed * vault.maxRate()) / 1e18;
        uint256 maxAllowed = ghost_totalAssetsBeforeDonation + maxGrowth;
        lte(currentTotal, maxAllowed + 1, "FL-04: totalAssets jumped beyond maxRate allows");
      }
    }
  affected_functions:
    - accrueInterest
    - accrueInterestView
    - deposit
    - redeem
  ghost_vars:
    - 'uint256 internal ghost_totalAssetsBeforeDonation'
  validated: false
  priority: high
  notes: >
    Known Solodit HIGH: "Side effects of underlying directly donated to VaultV2
    or adapters positions." maxRate is the mitigation but edge cases with stale
    vaults remain exploitable.

# ═══════════════════════════════════════════════════════════════════════════
# FL-05: Share conservation — totalSupply must equal sum of all balanceOf
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-05
  tier: 1
  type: property
  title: Share conservation — totalSupply must always equal sum of individual balanceOf entries
  description: >
    createShares() and deleteShares() update both balanceOf[account] and totalSupply.
    transfer/transferFrom move between balances without changing totalSupply.
    accrueInterest() mints fee shares via createShares(). If any path creates or
    destroys shares without atomically updating both, totalSupply diverges from
    the real sum of balances, breaking the exchange rate for everyone.
  attack_scenario: >
    1. Any code path where balanceOf is updated but totalSupply is not (or vice versa).
    2. This breaks share-to-asset conversion for all users.
    3. Specific concern: fee share minting in accrueInterest — if recipient address
       changes between computation and execution (impossible in single tx but defensive check).
  impact: >
    Broken share accounting. If totalSupply != sum(balanceOf), share price wrong
    for all users. Fundamental ERC20 invariant.
  impact_rating: Critical
  likelihood: Low
  severity: Critical
  confidence: 85
  solidity: |
    uint256 internal ghost_sumBalances;

    function property_fl_05() public {
      eq(vault.totalSupply(), ghost_sumBalances, "FL-05: totalSupply != sum of balanceOf");
    }
  affected_functions:
    - createShares
    - deleteShares
    - transfer
    - transferFrom
    - enter
    - exit
    - accrueInterest
  ghost_vars:
    - 'uint256 internal ghost_sumBalances'
  validated: false
  priority: critical
  notes: >
    Fundamental ERC20 invariant. ghost_sumBalances tracked in handlers on every
    transfer/mint/burn.

# ═══════════════════════════════════════════════════════════════════════════
# FL-06: Asset conservation — _totalAssets must not exceed real backing
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-06
  tier: 1
  type: property
  title: Asset conservation — _totalAssets must never exceed real asset backing (idle + adapter positions)
  description: >
    _totalAssets is updated in accrueInterest() as min(realAssets, maxTotalAssets),
    and directly by enter() (+= assets) and exit() (-= assets). If _totalAssets
    exceeds the real backing (idle balance + sum of adapter realAssets()), the vault
    is insolvent — shares are worth less than advertised. This can happen if an
    adapter's underlying market suffers bad debt between accrueInterest calls.
  attack_scenario: >
    1. _totalAssets = 100e18, adapter reports realAssets = 100e18.
    2. Underlying market suffers bad debt, adapter real value drops to 80e18.
    3. No one calls accrueInterest. _totalAssets still 100e18.
    4. User deposits 50e18 → _totalAssets = 150e18. Shares priced at 100e18 rate.
    5. Next accrueInterest: realAssets = 130e18, newTotalAssets = min(130, maxAllowed).
    6. 20e18 loss realized. Depositor got shares at inflated rate, diluting existing holders.
  impact: >
    Late loss realization allows new depositors to enter at inflated rates,
    socializing losses to existing depositors. Core solvency invariant.
  impact_rating: High
  likelihood: Medium
  severity: High
  confidence: 70
  solidity: |
    uint256 internal ghost_realTotalBacking;

    function property_fl_06() public {
      uint256 totalAssets = uint256(vault._totalAssets());
      uint256 idle = IERC20(vault.asset()).balanceOf(address(vault));
      uint256 adapterAssets = 0;
      for (uint256 i = 0; i < vault.adaptersLength(); i++) {
        adapterAssets += IAdapter(vault.adapters(i)).realAssets();
      }
      uint256 realBacking = idle + adapterAssets;
      lte(totalAssets, realBacking + 1, "FL-06: _totalAssets exceeds real backing — vault insolvent");
    }
  affected_functions:
    - accrueInterest
    - accrueInterestView
    - enter
    - exit
  ghost_vars:
    - 'uint256 internal ghost_realTotalBacking'
  validated: false
  priority: high
  notes: >
    maxRate bounds growth speed but between accrueInterest calls, _totalAssets is stale.
    Core solvency invariant that must always hold.

# ═══════════════════════════════════════════════════════════════════════════
# FL-07: No reentrancy guard — adapter callback window in both enter and exit
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-07
  tier: 1
  type: property
  title: No reentrancy guard on vault — adapter callbacks create reentrant windows in enter/exit
  description: >
    The vault has no mutex or nonReentrant modifier. enter() calls allocateInternal()
    which makes external call to adapter.allocate(). exit() calls deallocateInternal()
    which makes external call to adapter.deallocate(). Both paths have state already
    partially updated when the external call happens. firstTotalAssets transient var
    prevents double interest accrual but does NOT prevent reentrant deposit/withdraw.
  attack_scenario: >
    1. Attacker calls withdraw(). exit() → deallocateInternal → adapter.deallocate().
    2. Adapter reenters vault.deposit(Y, attacker).
    3. deposit() runs: accrueInterest no-op, previewDeposit uses stale totalSupply/totalAssets,
       enter() mints shares and updates _totalAssets.
    4. Returns to exit(): deleteShares, _totalAssets -= original assets.
    5. Rate = totalAssets/totalSupply. Both inflated proportionally, rate similar.
    6. Small discrepancy from rounding/fees could be exploited at scale.
  impact: >
    Proportional inflation limits impact, but non-proportional distributions (fees,
    donations, losses) create exploitable windows. Dust-level unless specific
    conditions met.
  impact_rating: Medium
  likelihood: Low
  severity: Medium
  confidence: 45
  solidity: |
    uint256 internal ghost_enterExitDepth;

    function property_fl_07() public {
      lte(ghost_enterExitDepth, 1, "FL-07: reentrant call detected in vault");
    }
  affected_functions:
    - enter
    - exit
    - deposit
    - withdraw
    - redeem
    - allocateInternal
    - deallocateInternal
  ghost_vars:
    - 'uint256 internal ghost_enterExitDepth'
  validated: false
  priority: high
  notes: >
    Adapter trust model explicitly says adapters must not reenter. Worth testing
    if proportional inflation still leaks value through rounding at scale.

# ═══════════════════════════════════════════════════════════════════════════
# FL-08: exit() reads balanceOf before deallocate — stale idle leads to over-deallocate
# ═══════════════════════════════════════════════════════════════════════════
- id: FL-08
  tier: 1
  type: property
  title: exit() reads idle balance before deallocate — can request more than needed if balance changes
  description: >
    exit() at L797 reads idleAssets = IERC20(asset).balanceOf(address(this)).
    If assets > idleAssets, it deallocates (assets - idleAssets) from liquidity
    adapter. But if the vault's balance changes between the read and the final
    safeTransfer at L809 (e.g., via adapter callback or concurrent interaction),
    the vault may over-deallocate or the transfer at L809 may fail. Also, if the
    liquidity adapter's underlying market is fully utilized, the deallocate reverts
    and the entire withdrawal fails — DoS vector.
  attack_scenario: >
    1. Vault has 10e18 idle, 90e18 in liquidity adapter. Market fully utilized.
    2. User withdraws 50e18. exit() sees idle=10, deficit=40.
    3. deallocateInternal for 40e18 reverts — market has no available liquidity.
    4. Entire withdrawal reverts. User funds locked.
    5. forceDeallocate exists as escape but requires penalty payment.
  impact: >
    DoS on withdrawals when underlying markets illiquid. Users locked out until
    liquidity returns. Partially mitigated by forceDeallocate.
  impact_rating: Medium
  likelihood: Medium
  severity: Medium
  confidence: 60
  solidity: |
    uint256 internal ghost_lastWithdrawAttempt;

    function property_fl_08() public {
      uint256 idle = IERC20(vault.asset()).balanceOf(address(vault));
      uint256 totalAssets = uint256(vault._totalAssets());
      // If vault has totalAssets > 0, idle portion should always be withdrawable
      if (totalAssets > 0 && idle > 0) {
        gte(idle, 1, "FL-08: idle assets should allow at least partial withdrawal");
      }
    }
  affected_functions:
    - exit
    - withdraw
    - redeem
    - deallocateInternal
  ghost_vars:
    - 'uint256 internal ghost_lastWithdrawAttempt'
  validated: false
  priority: medium
  notes: >
    Known ERC4626 limitation with external lending. forceDeallocate is the escape.
    Worth confirming DoS scenario with fork test.

