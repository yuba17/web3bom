# VV2-DD-02: forceDeallocate double-accrual avoidance creates stale pricing
# ═══════════════════════════════════════════════════════════════════════════
- id: VV2-DD-02
  title: "forceDeallocate penalty computed on stale share price due to transient firstTotalAssets"
  description: |
    CROSS-FUNCTION STATE: forceDeallocate (L822) -> deallocateInternal -> withdraw -> accrueInterest

    forceDeallocate flow:
    1. L826: deallocateInternal() — this does NOT call accrueInterest. Assets come from adapter.
    2. L827: penaltyAssets = assets.mulDivUp(forceDeallocatePenalty[adapter], WAD)
    3. L828: withdraw(penaltyAssets, address(this), onBehalf)
       - withdraw() calls accrueInterest() at L778
       - But if forceDeallocate was called after ANY other vault interaction in the same tx,
         firstTotalAssets is already set, so accrueInterest returns early (L653).
       - The penalty shares are computed with previewWithdraw which uses the STALE _totalAssets
         that doesn't reflect the just-deallocated assets sitting idle.

    After deallocateInternal returns assets to the vault, the vault's idle balance increases
    but _totalAssets hasn't changed (deallocateInternal doesn't modify _totalAssets — it only
    updates cap allocations). So the share price used for penalty calculation is correct
    in that sense. BUT: if the adapter's realAssets() now returns less (because we deallocated),
    the NEXT accrueInterest will see lower realAssets, potentially causing a loss event that
    hits the penalty payer unfairly.

    More critically: if forceDeallocate is the FIRST call in a tx, accrueInterest runs fully.
    If it's the SECOND call (after deposit/withdraw), it uses stale data. This means the
    penalty in shares differs depending on call ordering within a multicall batch.
  severity: medium
  confidence: 70
  solidity: |
    function property_vv2_dd_02() public {
      // The penalty shares burned from onBehalf should be consistent regardless
      // of whether forceDeallocate is first or second call in a tx
      if (ghost_forceDeallocateCalled && ghost_penaltyShares > 0) {
        uint256 expectedPenaltyAssets = ghost_forceDeallocateAmount * ghost_penalty / 1e18;
        uint256 actualAssetsValue = vault.previewRedeem(ghost_penaltyShares);
        // Penalty shares should represent approximately penaltyAssets worth
        uint256 tolerance = expectedPenaltyAssets / 100; // 1% tolerance
        t(
          actualAssetsValue >= expectedPenaltyAssets - tolerance &&
          actualAssetsValue <= expectedPenaltyAssets + tolerance,
          "DD-02: penalty shares mispriced due to stale accrual"
        );
      }
    }
  poc_sketch: |
    function test_VV2_DD_02_penalty_pricing_inconsistency() public {
      // Setup vault with assets in adapter
      vault.deposit(1_000_000e18, alice);
      vm.prank(allocator);
      vault.allocate(adapterA, data, 500_000e18);

      // Warp to accumulate interest
      vm.warp(block.timestamp + 7 days);

      // Scenario A: forceDeallocate as first call (fresh accrual)
      uint256 snapshot = vm.snapshot();
      vm.prank(alice);
      uint256 penaltySharesA = vault.forceDeallocate(adapterA, data, 100_000e18, alice);
      vm.revertTo(snapshot);

      // Scenario B: deposit first (sets firstTotalAssets), then forceDeallocate
      vm.prank(bob);
      vault.deposit(1e18, bob); // triggers accrueInterest, sets firstTotalAssets
      vm.prank(alice);
      uint256 penaltySharesB = vault.forceDeallocate(adapterA, data, 100_000e18, alice);

      // penaltySharesA != penaltySharesB due to stale firstTotalAssets
      assertEq(penaltySharesA, penaltySharesB, "Penalty differs based on call order");
    }
  call_stack: "forceDeallocate -> deallocateInternal -> withdraw -> accrueInterest (early return if firstTotalAssets set) -> previewWithdraw -> exit"
  affected_functions:
    - forceDeallocate
    - withdraw
    - accrueInterest
    - accrueInterestView
    - deallocateInternal
  attack_scenario: |
    1. Attacker observes vault with accumulated interest (7 days since lastUpdate).
    2. Attacker calls deposit(1 wei) to trigger accrueInterest and set firstTotalAssets.
    3. Interest accrual increases _totalAssets and mints fee shares.
    4. Attacker immediately calls forceDeallocate — penalty shares computed with
       post-fee share price (different from fresh-accrual scenario).
    5. Depending on fee configuration, the penalty in shares can be more or less
       favorable vs a standalone forceDeallocate call.

