# VV2-DD-01: Stale firstTotalAssets allows over-allocation after exit
# ═══════════════════════════════════════════════════════════════════════════
- id: VV2-DD-01
  title: "Stale firstTotalAssets after exit() allows allocator to bypass relative caps"
  description: |
    DESIGN ASSUMPTION VIOLATED: firstTotalAssets reflects actual vault state for cap checks.

    In a single transaction via multicall or sequential calls:
    1. User calls exit() which decreases _totalAssets (L808) but firstTotalAssets (transient)
       stays at the value set by the FIRST accrueInterest() of the tx.
    2. Allocator calls allocate() in the same tx (or later in same tx via multicall).
    3. allocateInternal() L584 checks: _caps.allocation <= firstTotalAssets.mulDivDown(relativeCap, WAD)
    4. But firstTotalAssets > _totalAssets because exit reduced _totalAssets.
    5. The relative cap allows MORE allocation than what current _totalAssets would permit.

    Example: vault has 1M _totalAssets, firstTotalAssets = 1M, relativeCap = 50% (0.5 WAD).
    Max allocation = 500K. User exits 400K. Now _totalAssets = 600K but relative cap still
    allows up to 500K (50% of 1M), which is 83% of actual assets. An allocator can concentrate
    83% of real assets into one adapter, far exceeding the intended 50% limit.

    This is NOT the known donation finding — this is about cap bypass via normal exit flow.
  severity: medium
  confidence: 80
  solidity: |
    function property_vv2_dd_01() public {
      uint256 currentTotalAssets = uint256(vault._totalAssets());
      uint256 fta = vault.firstTotalAssets();
      // If firstTotalAssets is set (within a tx), it should not be MORE than
      // 2x the current _totalAssets. A larger gap means caps are stale.
      if (fta > 0 && currentTotalAssets > 0) {
        // After exits, firstTotalAssets can be much larger than _totalAssets
        // which makes relative caps overly permissive
        t(fta <= currentTotalAssets * 2, "DD-01: firstTotalAssets > 2x _totalAssets, caps stale");
      }
    }
  poc_sketch: |
    function test_VV2_DD_01_stale_cap_after_exit() public {
      // Setup: vault with 1M assets, adapter with relativeCap=50%
      vault.deposit(1_000_000e18, alice);
      // Allocator allocates 400K to adapterA
      vm.prank(allocator);
      vault.allocate(adapterA, data, 400_000e18);

      // Alice exits 500K in same tx context (or via multicall)
      // Now _totalAssets = 500K but firstTotalAssets = 1M
      vm.prank(alice);
      vault.withdraw(500_000e18, alice, alice);

      // Allocator can now allocate up to 500K (50% of 1M firstTotalAssets)
      // but that's 100% of current _totalAssets (500K)
      vm.prank(allocator);
      vault.allocate(adapterA, data, 100_000e18); // This should fail at 50% but passes

      // Assert: adapterA allocation = 500K = 100% of real assets
      assertGt(vault.allocation(idA), currentTotalAssets * 50 / 100);
    }
  call_stack: "exit -> _totalAssets -= assets | allocateInternal -> caps check uses firstTotalAssets"
  affected_functions:
    - exit
    - withdraw
    - redeem
    - allocateInternal
    - allocate
  attack_scenario: |
    1. Vault: 10M assets, adapter X has relativeCap=30% (3M max).
    2. In one tx: large depositor exits 7M. _totalAssets drops to 3M.
    3. Allocator (compromised or colluding) calls allocate(X, data, 3M).
    4. Cap check: 3M <= firstTotalAssets(10M) * 30% = 3M. PASSES.
    5. But 3M is 100% of current _totalAssets. All vault assets in one adapter.
    6. If adapter X is risky, all depositors bear concentrated risk.

