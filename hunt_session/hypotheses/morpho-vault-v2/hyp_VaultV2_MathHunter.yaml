        // This is a structural invariant: after exit, vault balance >= 0
        // We verify indirectly: idle + allocated should be consistent
        uint256 idle = IERC20(vault.asset()).balanceOf(address(vault));
        uint256 ta = vault._totalAssets();
        // idle should be <= _totalAssets (rest is in adapters)
