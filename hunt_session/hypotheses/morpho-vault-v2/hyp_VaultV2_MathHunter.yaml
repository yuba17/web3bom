  - id: VV2-MATH-01
    title: "Donation attack inflates share price via balanceOf read in accrueInterestView"
    description: |
      accrueInterestView() at L655 reads IERC20(asset).balanceOf(address(this)) to compute realAssets.
      A direct token transfer (donation) before accrueInterest() inflates realAssets, but is capped by
      maxRate. However, if maxRate is set high (up to 200% APR) and elapsed time is large, the cap may
      not be effective. An attacker can donate tokens, then deposit to get shares at a price that hasn't
      fully reflected the donation (since it's rate-limited), then later redeem when the donation is
      fully accrued. The key math: newTotalAssets = min(realAssets, _totalAssets + _totalAssets*elapsed*maxRate/WAD).
      If realAssets >> maxTotalAssets the donation is partially absorbed, but the attacker who deposits
      RIGHT AFTER the donation gets shares priced at maxTotalAssets, not realAssets. The excess sits as
      unaccounted idle balance until future accruals.
    severity: high
    confidence: 65
    solidity: |
      function crytic_donation_does_not_inflate_share_price() public returns (bool) {
        uint256 totalAssetsBefore = vault.totalAssets();
        uint256 supplyBefore = vault.totalSupply();
        if (supplyBefore == 0 || totalAssetsBefore == 0) return true;
        uint256 sharePriceBefore = (totalAssetsBefore * 1e18) / supplyBefore;
        uint256 totalAssetsAfter = vault.totalAssets();
        uint256 supplyAfter = vault.totalSupply();
        if (supplyAfter == 0) return true;
        uint256 sharePriceAfter = (totalAssetsAfter * 1e18) / supplyAfter;
        uint256 elapsed = block.timestamp - vault.lastUpdate();
        uint256 maxIncrease = (sharePriceBefore * elapsed * vault.maxRate()) / 1e18;
        return t(sharePriceAfter <= sharePriceBefore + maxIncrease + 1, "MATH-01: donation inflated share price beyond maxRate");
      }
    affected_functions:
      - accrueInterestView
      - accrueInterest
      - deposit
      - previewDeposit
    attack_scenario: |
      1. Attacker observes vault with 1M assets, 1M shares (1:1 ratio)
      2. Attacker donates 100K tokens directly via transfer
      3. accrueInterestView sees realAssets=1.1M but caps at maxTotalAssets based on maxRate
      4. Attacker deposits immediately — gets shares priced at capped rate
      5. Over time, the donated 100K gradually accrues, increasing share price
      6. Attacker redeems later at higher share price, extracting value from existing depositors

