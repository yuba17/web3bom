      The intermediate (_totalAssets * elapsed) is computed before mulDivDown.
      mulDivDown does (x * y) / d, so the full computation is: (_totalAssets * elapsed * maxRate) / WAD.
      _totalAssets is uint128 (max ~3.4e38). elapsed could be large if lastUpdate is stale.
      MAX_MAX_RATE = 200%/year ~ 6.34e9/sec.
      Worst case: 3.4e38 * 3.15e8 * 6.34e9 = ~6.8e56, which exceeds uint256.max (~1.15e77).
      Wait — this fits. But if _totalAssets is near max AND elapsed is very large (billions of seconds),
      the multiplication inside mulDivDown (x*y where x = _totalAssets*elapsed, y = maxRate) could overflow.
