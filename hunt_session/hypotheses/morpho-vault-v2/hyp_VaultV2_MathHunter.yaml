  - id: VV2-MATH-10
    title: "Management fee double-taxes interest — fee on total including already-taxed interest"
    description: |
      accrueInterestView L665: performanceFeeAssets = interest * performanceFee / WAD.
      L670: managementFeeAssets = (newTotalAssets * elapsed * managementFee) / WAD.
      newTotalAssets includes the interest. So management fee taxes the interest that performance
      fee already taxed. Combined extraction from interest:
      performanceFee * interest + managementFee * elapsed * interest (approximately).
      Also: management fee is on newTotalAssets (post-interest), not on _totalAssets (pre-interest).
      If interest is small but elapsed is large, managementFee alone can exceed interest,
      making depositors lose principal even when the underlying position is profitable.
