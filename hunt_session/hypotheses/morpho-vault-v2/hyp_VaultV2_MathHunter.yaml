      2. User redeems shares worth 500 assets
      3. exit() sees idle=100, requests 400 from adapter
      4. Adapter returns 399 due to rounding in underlying protocol
      5. Vault has 100 + 399 = 499 < 500 needed
      6. safeTransfer(500) reverts — user blocked from withdrawing
