      2. After 1 year with 10% yield: interest = 10 ETH
      3. performanceFeeAssets = 10 * 0.5 = 5 ETH
      4. managementFeeAssets = 110 * 365d * rate ≈ 5.5 ETH (on post-interest total)
      5. Total fees = 10.5 ETH > interest of 10 ETH — depositors lose 0.5 ETH of principal
