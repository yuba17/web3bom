  - id: VV2-MATH-07
    title: "firstTotalAssets transient storage enables stale share price within multicall"
    description: |
      firstTotalAssets is `transient` (L218), resets to 0 at tx end.
      accrueInterest() L640: if (firstTotalAssets == 0) firstTotalAssets = newTotalAssets.
      accrueInterestView() L653: if (firstTotalAssets != 0) return (_totalAssets, 0, 0).
      Interest accrues only ONCE per tx. But deposit at L770 does _totalAssets += assets.toUint128().
      In a multicall: deposit changes _totalAssets, but subsequent previewDeposit/previewWithdraw
      calls accrueInterestView which returns STALE _totalAssets (from before the deposit).
      Wait — it returns current _totalAssets (which WAS updated by the deposit). The key is that
      accrueInterestView returns (_totalAssets, 0, 0) when firstTotalAssets != 0, so it returns
      the CURRENT _totalAssets (which includes deposit changes). So this is actually correct.
      BUT: the share price for the second operation reflects the first operation's _totalAssets change.
      This means depositing twice in one tx: first deposit inflates _totalAssets, second deposit
      gets fewer shares because _totalAssets is higher. This is expected behavior.
    severity: low
    confidence: 50
    solidity: |
      function crytic_interest_accrual_idempotent_within_tx() public returns (bool) {
        vault.accrueInterest();
        uint256 taAfter1 = vault._totalAssets();
        vault.accrueInterest();
        uint256 taAfter2 = vault._totalAssets();
        return t(taAfter1 == taAfter2, "MATH-07: second accrueInterest changed _totalAssets within same tx");
      }
    affected_functions:
      - accrueInterest
      - accrueInterestView
      - multicall
    attack_scenario: |
      1. Attacker uses multicall: deposit(huge) + withdraw(huge) in same tx
      2. First deposit accrues interest and sets firstTotalAssets
      3. Deposit increases _totalAssets
      4. Second withdraw sees higher _totalAssets → different share price
      5. Net effect: attacker's withdraw uses a share price computed with inflated _totalAssets
      6. Potential extraction if the share-to-asset conversion is more favorable

