      - accrueInterest
    attack_scenario: |
      1. Vault accumulates large _totalAssets (close to uint128 max)
      2. Nobody calls accrueInterest for extended period
      3. (_totalAssets * elapsed) * maxRate in mulDivDown overflows uint256
