  id: OR-FP-01
  reason: >
    Classic ERC4626 inflation attack (deposit 1 wei, donate large amount) is
    mitigated by maxRate cap. When _totalAssets is tiny (1 wei), maxRate limits
    growth to ~0/second (1 * maxRate / WAD ≈ 0). Attacker must wait years for
    donation to absorb. virtualShares for 18-decimal tokens is just 1 (weak) but
    maxRate is the real defense. NatSpec recommends seeding. NOT exploitable in
    practice due to maxRate when _totalAssets is near-zero.
  investigated_at: '2026-03-25T00:00:00Z'

- hunter: OracleHunter
  id: OR-FP-02
  reason: >
    accrueInterest() called multiple times per tx — transient storage pattern
    (firstTotalAssets != 0 at L653) correctly prevents double-accrual. Early return
    means no fee shares minted and no adapter re-reads. Deposits/withdrawals that
    modify _totalAssets directly (L770, L808) are separate from interest accrual
    and are correct. This is clean design, not a bug.
  investigated_at: '2026-03-25T00:00:00Z'

- hunter: OracleHunter
  id: OR-FP-03
  reason: >
    Management fee underflow within 10 years is impossible. MAX_MANAGEMENT_FEE =
    5%/year. After 10y: fee = 50% of TA. MAX_PERFORMANCE_FEE = 50% of interest.
    Even max interest = maxRate * 10y ≈ 2000% of TA → perf fee = 1000% of TA.
    Wait — performance fee is on INTEREST not TA. Max interest after 10y with
    MAX_MAX_RATE = TA * 20 (2000%). Perf fee = 10 * TA. This WOULD underflow.
    Revisiting: the actual calculation is bounded because newTotalAssets itself
    can't grow beyond maxTotalAssets = _totalAssets * (1 + elapsed * maxRate / WAD).
    After 10y: maxTotalAssets = TA * 21. Interest = 20 * TA. PerfFee = 10 * TA.
    MgmtFee = 0.5 * TA (on the maxTotalAssets 21*TA basis... actually mgmt fee
    is on newTotalAssets). So mgmtFeeAssets = 21*TA * 10y * 5%/y / WAD... this
    needs careful numerical analysis. Keeping as potential real issue in OR-06.
  investigated_at: '2026-03-25T00:00:00Z'
