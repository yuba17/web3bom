component: LeverageTransformer
hunter: TrustBoundaryHunter
date: "2026-03-24"

invariants:
  - id: LT-TB-01
    title: "0x swapData can execute arbitrary calls — token drain via residual approvals"
    tier: 2
    type: property
    confidence: 35
    description: >
      In _routerSwap (0x path, Swapper.sol:108-113), the contract does
      safeIncreaseAllowance to zeroxAllowanceHolder, then calls
      zeroxAllowanceHolder.call(params.swapData) with arbitrary calldata.
      The AllowanceHolder contract is trusted, but swapData controls which
      external contract the AllowanceHolder delegates to. If a malicious
      swapData can cause the AllowanceHolder to route tokens differently
      than expected (e.g., partial swap + leave approval dangling), the
      balance-before/after check (line 116-117) would catch output shortfall,
      but the INPUT side only measures delta — it does not verify that
      exactly amountIn was consumed. If the 0x router consumes less than
      amountIn, the remaining allowance is cleared on line 113
      (safeApprove to 0). This appears safe. However: if the swapData
      encodes a call that transfers tokenIn to an attacker AND returns
      tokenOut from the attacker (a wash), the balance checks pass.
      The caller controls swapData, so this is self-harm unless the
      caller is a vault calling on behalf of an NFT owner who crafted
      malicious params. In the vault path, the NFT owner provides params
      — so the owner controls swapData for their own position.
      LOW CONFIDENCE: the AllowanceHolder contract likely restricts what
      calls can be made, and vault health check limits damage.
    affected_line: "Swapper.sol:108-113, LeverageTransformer.sol:60-62"
    attack_scenario: >
      1. NFT owner calls vault.transform(tokenId, leverageTransformer, leverageUpData)
      2. swapData0 encodes a call that routes borrowed tokens to attacker address
         instead of performing a real swap
      3. Balance check: tokenIn balance decreases (tokens left the contract),
         tokenOut balance must increase by amountOut0Min — if attacker sends
         amountOut0Min of token0 back, check passes
      4. Net effect: attacker receives borrowed tokens, sends back token0
      5. But: this is the NFT OWNER crafting the call, so they're stealing
         from themselves (their own position gets more leveraged with less collateral)
      6. Vault health check after transform() catches under-collateralization
      VERDICT: protected by health check + self-harm. Not exploitable by third parties.
    status: hypothesis
    solidity: |
      // INV-LT-TB-01: swapData cannot cause net token loss beyond expected swap
      function invariant_LT_TB_01_swapDataNoExtraLoss() public view {
          // After leverageUp: total value in position + leftover >= borrowed amount
          // (modulo slippage within amountOutMin bounds)
          // This is enforced by vault health check, not by LT itself
          // Test: craft swapData that sends tokens to external address
          // Verify: vault.transform reverts due to health check failure
      }

  - id: LT-TB-02
    title: "leverageDown: repay amount approved to msg.sender (vault) — vault trust assumption"
    tier: 2
    type: property
    confidence: 25
    description: >
      In leverageDown (line 179), the contract does
      safeIncreaseAllowance(token, msg.sender, amount) then calls
      IVault(msg.sender).repay(). The trust assumption is that msg.sender
      IS the vault (validated by _validateCaller path (a)). But in path (b)
      of _validateCaller, msg.sender is the NFT owner — not the vault.
      If the NFT owner calls leverageDown directly, line 136 does
      IVault(msg.sender).asset() — this calls asset() on the owner address.
      If owner is a contract that returns a valid token address from asset(),
      and implements repay() to drain the approved tokens, the owner
      could steal tokens that LeverageTransformer holds.
      BUT: LT should not hold tokens between calls (no persistent balance).
      The tokens come from decreaseLiquidity + collect in the same tx.
      The owner already owns the position, so these are their own tokens.
      Self-harm scenario only.
    affected_line: "LeverageTransformer.sol:179-181, Transformer.sol:51-63"
    attack_scenario: >
      1. Attacker deploys contract that implements asset() returning USDC
         and repay() that transfers approved USDC to attacker
      2. Attacker is NFT owner, calls leverageDown directly (path b)
      3. LT collects fees + removed liquidity (attacker's own position)
      4. LT approves attacker contract for the collected amount
      5. Attacker's repay() takes the tokens
      6. Result: attacker gets their own tokens — no theft from others
      VERDICT: self-harm, not exploitable against other users.
    status: hypothesis
    solidity: |
      // INV-LT-TB-02: only vault can receive repay approval
      function invariant_LT_TB_02_repayOnlyToVault() public view {
          // In vault-mediated path: msg.sender is always the vault
          // In direct path: msg.sender is NFT owner (self-harm)
          // Property: tokens approved via safeIncreaseAllowance are
          // always consumed by repay() or recovered by safeApprove(0)
      }

  - id: LT-TB-03
    title: "Universal Router path: tokens transferred before execute — reentrancy window"
    tier: 2
    type: property
    confidence: 20
    description: >
      In _routerSwap Universal Router path (Swapper.sol:104-105),
      tokens are transferred to universalRouter BEFORE execute() is called.
      If universalRouter.execute() has any callback mechanism that calls
      back into LeverageTransformer or the vault, there could be a
      reentrancy window where the contract state is inconsistent
      (tokens sent but swap not completed). However: (1) Universal Router
      is an immutable trusted contract, (2) the execute function does not
      have arbitrary callbacks to the caller, (3) balance checks after
      the call would catch any discrepancy. The Uniswap Universal Router
      is audited and does not re-enter callers.
      VERY LOW CONFIDENCE: theoretical only.
    affected_line: "Swapper.sol:104-105"
    attack_scenario: >
      1. Hypothetical: if Universal Router had a callback to msg.sender
         during execute(), attacker could re-enter leverageUp
      2. Second leverageUp would borrow more, using the same position
      3. But: Universal Router does not callback, and vault.transform
         sets transformedTokenId preventing concurrent transforms
      VERDICT: not exploitable with current Universal Router implementation.
    status: hypothesis
    solidity: |
      // INV-LT-TB-03: no reentrancy during router swap
      function invariant_LT_TB_03_noReentrancyDuringSwap() public view {
          // Universal Router execute() does not callback to caller
          // Even if it did, vault.transformedTokenId lock prevents re-entry
          // This is a defense-in-depth check, not a real vulnerability
      }

notes: >
  HONEST ASSESSMENT: The trust boundaries in LeverageTransformer are well-designed.
  The contract sits between trusted components (Vault, NPM, Universal Router, 0x AllowanceHolder)
  and the main attack surface (swapData manipulation) is protected by balance-before/after
  checks plus vault health check post-transform. All three hypotheses above are LOW confidence
  because the existing protections are sound. The 6 prior hunters already covered the
  meaningful attack surface (direct call bypass, malicious swapData, arbitrary recipient).
  No new HIGH/MEDIUM trust boundary issues identified.
