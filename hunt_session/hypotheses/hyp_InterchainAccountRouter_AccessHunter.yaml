    _dispatchMessageWithValue(..., address(this).balance);
    Esto significa que TODO el ETH del router se envia con el segundo mensaje.
    Si el router tiene ETH acumulado de otros usuarios (via receive(), refunds, etc.),
    el atacante se lleva ese ETH extra gratis en su reveal message.
    Ataque:
    1. Multiples usuarios envian ETH al router (via receive() o como gas payment sobrante)
    2. Atacante llama callRemoteCommitReveal con msg.value = X
    3. Primer dispatch usa msg.value = X
    4. Segundo dispatch usa address(this).balance que incluye ETH de OTROS usuarios
    5. El ETH extra se envia al hook/Mailbox como value del mensaje del atacante
    El atacante no puede recuperar el ETH directamente, pero puede causar que el gas payment
    del segundo mensaje sea financiado por otros usuarios (theft of gas fees).
  impact: "Robo de ETH acumulado en el router. Cualquier ETH en el contrato se drena con cada callRemoteCommitReveal."
  impact_rating: High
