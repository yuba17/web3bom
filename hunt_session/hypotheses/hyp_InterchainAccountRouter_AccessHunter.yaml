- id: IAR-05
  tier: 2
  type: property
  description: "revealAndExecute en OwnableMulticall no tiene onlyOwner — cualquiera puede ejecutar calls si conoce el commitment"
  attack_scenario: |
    OwnableMulticall.revealAndExecute() es external payable sin modifier onlyOwner.
    multicall() tiene onlyOwner pero revealAndExecute() NO.
    Esto permite que CUALQUIERA ejecute las calls si conoce el salt y los calls que producen el commitment.
    En el flujo commit-reveal, el objetivo es ocultar el calldata hasta la ejecucion.
    Pero si un observador puede extraer el calldata del offchain service o de la mempool,
    puede front-run la ejecucion llamando revealAndExecute directamente.
    Esto podria reordenar la ejecucion (e.g., ejecutar un swap antes que el usuario original,
    sandwich attacks).
    Sin embargo, el commitment se borra despues de la ejecucion (delete commitments[revealedHash]),
    asi que solo se puede ejecutar una vez.
    El riesgo es: quien ejecuta primero controla el MEV/timing de la ejecucion.
  impact: "Front-running de commit-reveal calls. Atacante puede ejecutar las calls del usuario en un contexto de MEV diferente."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
