    require(routers(_destination) == EMPTY_SALT && isms[_destination] == EMPTY_SALT,
    "router and ISM defaults are immutable once set");
    Si el router o ISM de un dominio remoto se compromete, el owner NO puede actualizar
    la configuracion. El unico recurso seria desplegar un nuevo InterchainAccountRouter.
    Esto crea un riesgo de que una configuracion comprometida no pueda corregirse.
    Sin embargo, unenrollRemoteRouter() existe en Router.sol y es onlyOwner.
    Necesita verificacion: puede unenrollRemoteRouter + enrollRemoteRouterAndIsm funcionar?
    Si unenroll limpia _routers pero NO limpia isms[], el re-enroll fallaria por el check de isms.
  impact: "Router o ISM comprometido no puede reemplazarse. Fondos de ICAs en ese dominio quedan en riesgo permanente."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el owner puede actualizar un router/ISM comprometido
    uint32 domain = 1;
    bytes32 router1 = bytes32(uint256(1));
    bytes32 ism1 = bytes32(uint256(2));
    bytes32 router2 = bytes32(uint256(3));
    bytes32 ism2 = bytes32(uint256(4));
    // Primera enrollment
    vm.prank(owner);
    router.enrollRemoteRouterAndIsm(domain, router1, ism1);
    // Intentar re-enrollment (deberia fallar)
    vm.prank(owner);
    try router.enrollRemoteRouterAndIsm(domain, router2, ism2) {
        // Si no falla, la immutabilidad no se enforce
    } catch {
        // Verificar que tampoco podemos unenroll + re-enroll
        vm.prank(owner);
        router.unenrollRemoteRouter(domain);
        vm.prank(owner);
        try router.enrollRemoteRouterAndIsm(domain, router2, ism2) {
            // Si funciona despues de unenroll, la mitigacion existe
        } catch {
            t(false, "IAR-07: compromised router/ISM cannot be replaced");
        }
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: |
    unenrollRemoteRouter() remueve de _routers pero isms[] es un mapping separado
    que NO se limpia en unenroll. Esto significa que isms[domain] seguira != EMPTY_SALT
    y el re-enroll fallara. Esto es un DOS permanente de la configuracion del dominio.
  poc_sketch: ''
  call_stack: 'owner -> enrollRemoteRouterAndIsm -> [OK] -> unenrollRemoteRouter -> [removes router] -> enrollRemoteRouterAndIsm -> [REVERTS because isms[domain] != 0]'

- id: IAR-08
  tier: 2
  type: property
  description: "getDeployedInterchainAccount es public sin restriccion — cualquiera puede desplegar ICAs para cualquier owner/origin/ism"
  attack_scenario: |
    getDeployedInterchainAccount() es public y no tiene access control.
    Cualquiera puede llamarlo para desplegar un ICA para cualquier combinacion de
    (origin, owner, router, ism, salt).
    Esto por si solo no es un bug — el ICA se despliega de forma determinista via Create2.
    Pero permite a un atacante PRE-DESPLEGAR un ICA antes de que el owner real lo use.
    El ICA desplegado es un MinimalProxy al implementation del router, y su owner es el router.
    El riesgo es limitado porque el router controla el ICA, no el caller de getDeployedInterchainAccount.
    Sin embargo, si hay algun estado que se inicializa de forma diferente en el primer despliegue
    vs. en despliegues subsecuentes, podria haber un vector.
  impact: "Bajo impacto directo. Pre-deploy de ICAs puede causar gas griefing o unexpected state."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que un pre-deploy por un tercero no afecta la funcionalidad del owner real
    address attacker = address(0xbabe);
    uint32 origin = 1;
    bytes32 owner = bytes32(uint256(uint160(address(0xcafe))));
    bytes32 routerB = bytes32(uint256(uint160(address(router))));
    address ism = address(defaultIsm);
    // Atacante pre-despliega el ICA
    vm.prank(attacker);
    OwnableMulticall ica1 = router.getDeployedInterchainAccount(origin, owner, routerB, ism);
    // Owner real despliega (deberia retornar el mismo ICA)
    OwnableMulticall ica2 = router.getDeployedInterchainAccount(origin, owner, routerB, ism);
    eq(address(ica1), address(ica2), "IAR-08: pre-deployed ICA differs from owner-deployed");
    // Verificar que el ICA funciona correctamente
    eq(ica1.owner(), address(router), "IAR-08: ICA owner should be router");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: |
    Probablemente by-design. El ICA es determinista y su owner es siempre el router.
    El pre-deploy no da ninguna ventaja al atacante.

- id: IAR-09
  tier: 1
  type: property
  description: "CommitmentReadIsm.verify() ejecuta calls via revealAndExecute sin validar que el ICA pertenece al mensaje"
  attack_scenario: |
    CommitmentReadIsm.verify() recibe _metadata que contiene (ica_address, salt, calls).
    Verifica que hash(salt, calls) == commitment del mensaje.
    Luego llama ica.revealAndExecute(calls, salt).
    PERO: la address del ICA se extrae de _metadata[:20], que es proporcionada por el
    servicio CCIP offchain. Si el servicio es malicioso o comprometido, puede:
    1. Proporcionar un ICA address diferente al esperado
    2. El commitment hash se valida contra el mensaje, pero el ICA es arbitrario
    3. Las calls se ejecutan en un ICA que tiene un commitment pendiente con el mismo hash
    4. Si dos ICAs diferentes tienen commitments con el mismo hash (collision o reuso),
       el atacante puede redirigir la ejecucion
    Ademas, el ICA address no se valida contra los parametros del mensaje (origin, sender, etc.).
    El verify() confía completamente en la metadata offchain para el ICA address.
  impact: "Ejecucion de calls en un ICA diferente al esperado si el servicio CCIP esta comprometido."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
