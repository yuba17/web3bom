- id: IAR-10
  tier: 2
  type: property
  description: "callRemoteWithOverrides permite enviar mensajes a routers arbitrarios (no enrollados) — bypass de router table"
  attack_scenario: |
    callRemoteWithOverrides toma _router como parametro y lo pasa directamente a
    _dispatchMessageWithValue. La unica validacion es require(_router != bytes32(0)).
    No verifica que _router este enrollado en la tabla de routers.
    Un atacante puede enviar mensajes a CUALQUIER address en el destino, no solo al router enrollado.
    Si la address destino es un contrato que implementa handle() y tiene fondos,
    el mensaje podria ejecutar acciones inesperadas.
    PERO: en el destino, el Mailbox entrega el mensaje al recipient (que es _router),
    y ese recipient procesaria el mensaje. Si el recipient no es un InterchainAccountRouter,
    simplemente fallaria o haria algo inesperado.
    El riesgo real: el atacante puede enviar mensajes a una version antigua o comprometida
    del router que no esta en la tabla de routers actual.
  impact: "Bypass de la tabla de routers enrollados. Mensajes enviados a addresses arbitrarios en el destino."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que callRemoteWithOverrides valida que el router esta enrollado
    uint32 destination = 1;
    bytes32 fakeRouter = bytes32(uint256(uint160(address(0xdead))));
    bytes32 ism = bytes32(0);
    CallLib.Call[] memory calls = new CallLib.Call[](0);
    vm.prank(attacker);
    try router.callRemoteWithOverrides{value: 0.1 ether}(destination, fakeRouter, ism, calls) {
        t(false, "IAR-10: callRemoteWithOverrides accepts non-enrolled router");
    } catch {}
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: |
    Esto es por diseno — "WithOverrides" implica que el usuario puede especificar su propia
    configuracion. Pero permite bypass de la configuracion del owner.
    El modelo de confianza parece ser que el USUARIO asume el riesgo de sus propios overrides.
  poc_sketch: ''
  call_stack: 'callRemoteWithOverrides(dest, fakeRouter, ism, calls) -> _dispatchMessageWithValue(dest, fakeRouter, body, ...) -> mailbox.dispatch(dest, fakeRouter, body)'

- id: IAR-11
  tier: 1
  type: property
  description: "callRemoteWithOverrides permite especificar un hook arbitrario — hook malicioso puede robar msg.value"
  attack_scenario: |
    La variante de callRemoteWithOverrides que acepta IPostDispatchHook _hook permite que
    CUALQUIER usuario especifique un hook arbitrario. El msg.value se pasa al mailbox.dispatch
    que luego interactua con el hook.
    Un hook malicioso podria:
    1. No forwarded correctamente el value
    2. Revertir selectivamente para causar DoS
    3. Implementar logica que beneficia al atacante
    Sin embargo, el hook se ejecuta en el contexto del Mailbox, no del router.
    Y el value se pasa como {value: _value} al mailbox.dispatch.
    El riesgo principal es un usuario inocente que copia un tx con un hook malicioso,
    o un frontend comprometido que inyecta un hook malicioso.
    Mas importante: este es un self-harm vector, no un attack-on-others vector,
    ya que el caller es quien especifica el hook y paga el msg.value.
  impact: "Self-harm: usuario pierde msg.value si especifica un hook malicioso. No es un vector de ataque sobre otros usuarios."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que hooks custom no pueden robar value de OTROS usuarios
    // Este es principalmente un self-harm vector
    uint256 routerBalBefore = address(router).balance;
    address attacker = address(0xbabe);
    vm.deal(attacker, 1 ether);
    vm.prank(attacker);
    // Atacante usa su propio hook — solo pierde su propio ETH
    router.callRemoteWithOverrides{value: 1 ether}(
        1, routers(1), isms[1], new CallLib.Call[](0), bytes(""), bytes32(0), IPostDispatchHook(maliciousHook)
    );
    uint256 routerBalAfter = address(router).balance;
    // El router no deberia perder fondos de otros por el hook del atacante
    gte(routerBalAfter, routerBalBefore, "IAR-11: custom hook drained router funds");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 55
  notes: |
    Self-harm vector. El caller elige su hook y paga su propio msg.value.
    No hay impacto sobre otros usuarios a menos que el router tenga fondos acumulados
    (que se combina con IAR-04).

false_positives:
- hunter: AccessHunter
  id: IAR-FP-01
  reason: |
    handle() sin onlyRemoteRouter: Es by-design segun el comment del codigo.
    El modelo de seguridad recae enteramente en el ISM, no en la verificacion del sender.
    Cada combinacion (origin, owner, sender, ism, salt) produce un ICA diferente,
    asi que un sender malicioso solo afecta a su propio ICA, no al de otros.
    SIN EMBARGO, esto solo es seguro si el ISM no es controlado por el atacante (ver IAR-06).
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "Hyperlane ICA: handle() sin onlyRemoteRouter es by-design. La seguridad recae en ISM. Pero ISM se lee del mensaje (sender-controlled), lo cual es un vector critico."
    briefing_update_applied: false

