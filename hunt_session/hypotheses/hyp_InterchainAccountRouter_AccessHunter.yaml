    vm.deal(address(router), 10 ether);
    // Atacante llama callRemoteCommitReveal con solo 0.1 ETH
    uint256 attackerValue = 0.1 ether;
    vm.deal(attacker, attackerValue);
    vm.prank(attacker);
    uint256 totalSent = attackerValue; // lo que el atacante aporto
