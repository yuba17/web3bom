- id: IAR-01
  tier: 1
  type: property
  description: "ISM especificado por el sender en el mensaje puede ser un contrato malicioso que siempre retorna true, bypaseando toda verificacion de seguridad cross-chain"
  attack_scenario: |
    El route() en InterchainAccountRouter lee el ISM directamente del body del mensaje (InterchainAccountMessage.ism()).
    Un atacante en chain A llama callRemoteWithOverrides con _ism = address(MaliciousISM) que siempre retorna true en verify().
    En la chain destino, el router actua como su propio ISM (interchainSecurityModule() retorna address(this)).
    El Mailbox llama this.verify() -> route() -> lee ISM del body del mensaje -> MaliciousISM.verify() retorna true.
    El handle() se ejecuta con el _ism del atacante, desplegando un ICA con parametros controlados por el atacante.
    PERO: el ICA se despliega con un salt que incluye el _ism, asi que el atacante solo controla su PROPIO ICA.
    El RIESGO REAL: si alguien ya envio fondos a la direccion precomputada del ICA con un ISM especifico,
    un atacante que conozca el ISM puede desplegar el ICA con un ISM malicioso y robar esos fondos.
    El ICA address depende de (origin, owner, router, ism, salt) — si el atacante es el mismo owner, controla su propio ICA.
    VECTOR CRITICO: callRemoteWithOverrides es PUBLIC sin restriccion — cualquiera puede enviar mensajes
    con ISM arbitrario al destino. Si el ISM es un contrato que retorna true sin validacion,
    se bypasea la seguridad del Mailbox completamente.
  impact: "Bypass completo del modelo de seguridad ISM. Ejecucion de calls arbitrarios en ICAs sin verificacion de validators."
  impact_rating: Critical
  likelihood: High
  severity_final: null
  solidity: |
    // En el contexto del test: verificar que route() NO retorna un ISM controlado por el sender
    // cuando el mensaje viene de un origen no confiable
    bytes memory fakeBody = abi.encodePacked(
        uint8(0), // MessageType.CALLS
        bytes32(uint256(uint160(address(this)))), // owner
        bytes32(uint256(uint160(address(maliciousIsm)))), // ISM malicioso
        bytes32(0), // salt
        abi.encode(new CallLib.Call[](0)) // calls vacios
    );
    // Construir mensaje completo con header
    bytes memory fullMsg = abi.encodePacked(
        uint8(3), // version
        uint32(0), // nonce
        uint32(1), // origin
        bytes32(uint256(uint160(address(attacker)))), // sender
        uint32(2), // destination
        bytes32(uint256(uint160(address(router)))), // recipient
        fakeBody
    );
    IInterchainSecurityModule routedIsm = router.route(fullMsg);
    // Si el ISM ruteado es el malicioso, el atacante controla la verificacion
    t(address(routedIsm) != address(maliciousIsm), "IAR-01: attacker-controlled ISM routed");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 85
  notes: |
    ESTO ES BY DESIGN segun el comment en handle(): "Does not need to be onlyRemoteRouter,
    as this application is designed to receive messages from untrusted remote contracts."
    Sin embargo, el hecho de que el ISM sea elegido por el SENDER del mensaje es el vector.
    El modelo de seguridad asume que el ISM es de confianza del RECEPTOR, pero aqui el sender elige el ISM.
    Si un usuario configura isms[domain] = 0 (no enrolla ISM), el fallback es mailbox.defaultIsm(),
    que SI es seguro. PERO si el usuario usa callRemoteWithOverrides directamente con un ISM custom,
    el destino usara ESE ISM para verificar.
  poc_sketch: ''
  call_stack: 'callRemoteWithOverrides -> encode(msg.sender, _ism, _calls, _salt) -> dispatch -> [destination] Mailbox.process -> route() reads ISM from body -> ISM.verify()'

- id: IAR-02
  tier: 1
  type: property
  description: "handle() no tiene onlyRemoteRouter — cualquier sender en cualquier origin puede ejecutar calls via ICA"
  attack_scenario: |
    La funcion handle() en InterchainAccountRouter OVERRIDE la de Router y solo tiene onlyMailbox.
    Router.handle() tiene: onlyMailbox + require(_router == _sender).
    InterchainAccountRouter.handle() tiene SOLO: onlyMailbox.
    Esto significa que CUALQUIER contrato en CUALQUIER chain puede enviar un mensaje al Mailbox
    que sera procesado por handle(). El _sender NO se valida contra la tabla de routers.
    El ICA se despliega con _sender como parte del salt (via getDeployedInterchainAccount con _sender=_sender).
    Asi que un atacante random desplegaria un ICA DIFERENTE al del router legitimo.
    PERO: si el atacante conoce la address del router legitimo en otra chain, puede enviar un mensaje
    con _sender = router_address (si puede spoofear el sender en el Mailbox de origen).
    En Hyperlane, el Mailbox fija msg.sender como sender del mensaje, asi que no es trivial spoofear.
    El riesgo real: un contrato malicioso desplegado en chain A puede crear ICAs en chain B
    que ejecutan calls arbitrarios, siempre que pasen la verificacion ISM.
    Y como vimos en IAR-01, el ISM se lee del propio mensaje.
  impact: "Creacion y ejecucion de ICAs sin restriccion de origen. El atacante puede ejecutar calls arbitrarios."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que handle() rechaza mensajes de senders no-enrollados
    // NOTA: Este test DEBERIA fallar en el diseno actual — eso es el finding
    address nonEnrolledSender = address(0xdead);
    uint32 origin = 1;
    bytes memory message = abi.encodePacked(
        uint8(0), // CALLS
        bytes32(uint256(uint160(address(attacker)))), // owner
        bytes32(0), // ism = 0 -> default
        bytes32(0), // salt
        abi.encode(new CallLib.Call[](0))
    );
    // Simular llamada desde Mailbox con sender no-enrollado
    // Si no revierte, cualquier sender puede invocar handle()
    try router.handle{gas: 500000}(origin, bytes32(uint256(uint160(nonEnrolledSender))), message) {
        // El ICA se despliega y ejecuta — sin verificacion de sender
        t(false, "IAR-02: handle accepts non-enrolled sender");
    } catch {}
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 75
  notes: |
    El comment dice explicitamente: "Does not need to be onlyRemoteRouter, as this application
    is designed to receive messages from untrusted remote contracts."
    Esto es INTENCIONAL pero potencialmente peligroso. El modelo de seguridad recae ENTERAMENTE
    en el ISM. Si el ISM es debil o controlado por el atacante (IAR-01), esto amplifica el impacto.
    Necesita validacion: es el ISM SIEMPRE suficiente como unica capa de seguridad?
  poc_sketch: ''
  call_stack: 'Mailbox.process() -> router.handle(origin, sender, message) -> [no sender check] -> getDeployedInterchainAccount -> ica.multicall(calls)'

- id: IAR-03
  tier: 1
  type: property
  description: "approveFeeTokenForHook() es external sin access control — cualquiera puede forzar max approval a cualquier hook"
  attack_scenario: |
    AbstractInterchainAccountRouter.approveFeeTokenForHook(address _feeToken, address _hook) es external
    sin ningun modifier (no onlyOwner, no access control).
    Un atacante puede llamar approveFeeTokenForHook(USDC, attackerContract) para que el router
    apruebe type(uint256).max de USDC a un contrato controlado por el atacante.
    Si el router tiene balance de USDC (por ejemplo, de fee refunds, stuck tokens, o dust),
    el atacante puede drenar todos esos tokens.
    Ademas, el atacante puede front-run una transaccion de fee payment:
    1. Usuario envia callRemote con feeToken USDC
    2. _dispatchMessageWithValue hace safeTransferFrom(msg.sender, address(this), _fee) y forceApprove(hook, max)
    3. Atacante llama approveFeeTokenForHook(USDC, attackerAddress) ANTES del dispatch real
    4. El router ya tiene los USDC del paso 2 y la nueva approval permite al atacante drenarlos
    Nota: forceApprove en _dispatchMessageWithValue sobrescribe la approval del atacante,
    pero el timing window existe entre transferFrom y el dispatch al hook.
  impact: "Drenaje de cualquier token ERC20 que el router tenga en balance. Router actua como passthrough de fees asi que el exposure puede ser bajo en condiciones normales."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que un usuario no-owner no puede aprobar tokens a un address arbitrario
    address attacker = address(0xbabe);
    address fakeHook = address(0xdead);
    uint256 routerBalanceBefore = mockToken.balanceOf(address(router));
    // Atacante llama approveFeeTokenForHook
    vm.prank(attacker);
    router.approveFeeTokenForHook(address(mockToken), fakeHook);
    uint256 allowance = mockToken.allowance(address(router), fakeHook);
    // Si allowance es max, el access control falla
    t(allowance == 0, "IAR-03: non-owner can set token approval to arbitrary address");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 90
  notes: |
    Esta funcion claramente carece de access control. La intencion parece ser que cualquiera
    pueda pre-aprobar un hook para facilitar pagos de gas con ERC20. Pero la falta de validacion
    sobre _hook permite aprobar a CUALQUIER address, no solo hooks registrados.
    Si el router NUNCA tiene balance propio, el impacto es nulo. Pero recibe ETH via receive()
    y procesa fees ERC20 via _dispatchMessageWithValue.
  poc_sketch: |
    1. Deploy router con USDC como fee token
    2. Enviar 100 USDC al router (simular stuck fees)
    3. Atacante llama approveFeeTokenForHook(USDC, attacker)
    4. Atacante llama USDC.transferFrom(router, attacker, 100)
    5. Verificar que atacante tiene los 100 USDC
  call_stack: 'attacker -> router.approveFeeTokenForHook(token, attacker) -> IERC20.forceApprove(attacker, MAX) -> attacker.transferFrom(router, attacker, balance)'

- id: IAR-04
