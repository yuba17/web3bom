    calls[0] = CallLib.Call(bytes32(uint256(uint160(target))), 0, abi.encodeWithSignature("foo()"));
    bytes32 salt = bytes32(uint256(1));
    bytes32 commitment = keccak256(abi.encodePacked(salt, abi.encode(calls)));
    // Setup: commitment ya existe en el ICA
    // NonOwner intenta ejecutar
    vm.prank(nonOwner);
    try ica.revealAndExecute(calls, salt) {
        t(false, "IAR-05: non-owner executed revealAndExecute");
    } catch {}
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: |
    Puede ser by-design para el flujo CCIP-read donde el ISM es quien llama revealAndExecute.
    El CommitmentReadIsm.verify() llama ica.revealAndExecute() directamente.
    Si esto es intencional, el "access control" es el knowledge del commitment preimage.
    Pero en la practica, el preimage se transmite al offchain service, que puede leakearse.
  poc_sketch: ''
  call_stack: 'CommitmentReadIsm.verify() -> ica.revealAndExecute(calls, salt) -> CallLib.multicall(calls)'

- id: IAR-06
  tier: 1
  type: property
  description: "route() permite que el sender elija un ISM custom en el body del mensaje — ISM bypass via attacker-controlled ISM"
  attack_scenario: |
    La funcion route() (que InterchainAccountRouter hereda al ser AbstractRoutingIsm) lee el ISM
    del BODY del mensaje:
    - Para CALLS/COMMITMENT: InterchainAccountMessage.ism(_body) -> bytes32 en offset [33:65]
    - Para REVEAL: InterchainAccountMessageReveal.revealIsm(_body) -> bytes32 en offset [1:33]
    Si el ISM es address(0), se usa el default (mailbox.defaultIsm() o CCIP_READ_ISM).
    Si el ISM es NO-ZERO, se usa directamente sin ninguna validacion de que sea un ISM confiable.
    Un atacante puede:
    1. Desplegar un contrato en la chain destino que implementa IInterchainSecurityModule
    2. Su verify() siempre retorna true
    3. Enviar un mensaje cross-chain con ese ISM en el body
    4. El Mailbox llama router.verify() -> route() -> attackerISM.verify() -> true
    5. El Mailbox llama router.handle() -> ejecuta calls arbitrarios
    El ICA desplegado usara el ISM del atacante en el salt, asi que sera un ICA distinto
    al del ISM legitimo. Pero el atacante controla COMPLETAMENTE su ICA y puede ejecutar
    cualquier call desde el.
  impact: "Bypass completo de ISM verification. Ejecucion arbitraria de calls cross-chain sin autorizacion de validators."
  impact_rating: Critical
  likelihood: High
  severity_final: null
  solidity: |
    // Verificar que route() no permite ISM arbitrarios controlados por el sender
    // Deploy malicious ISM que siempre retorna true
    // Construir mensaje con ISM malicioso en el body
    bytes memory body = abi.encodePacked(
        uint8(0), // CALLS
        bytes32(uint256(uint160(attacker))), // owner
        bytes32(uint256(uint160(address(maliciousIsm)))), // ISM controlado
        bytes32(0), // salt
        abi.encode(new CallLib.Call[](0))
    );
    bytes memory fullMsg = _buildHyperlaneMessage(1, address(attacker), 2, address(router), body);
    IInterchainSecurityModule ism = router.route(fullMsg);
    // Si route retorna el ISM malicioso, la seguridad esta comprometida
    // El ISM deberia ser uno de confianza, no uno elegido por el sender
    bool isTrustedIsm = (address(ism) == address(defaultIsm) || address(ism) == address(ccipReadIsm));
    t(isTrustedIsm, "IAR-06: route() returned attacker-controlled ISM");
  ghost_vars: []
  validated: false
  priority: critical
  confidence: 90
  notes: |
    Este es el finding mas critico. El diseno permite que el SENDER del mensaje elija el ISM
    que verificara su propio mensaje. Esto es fundamentalmente inseguro.
    La unica proteccion es que el ICA desplegado incluye el ISM en el salt, creando un ICA
    diferente por ISM. Pero eso no impide la ejecucion de calls arbitrarios.
    POSIBLE MITIGACION BY DESIGN: El modelo de Hyperlane ICA asume que cada ICA es independiente
    y que el owner acepta el riesgo del ISM que elige. Pero esto permite que cualquiera cree
    ICAs con ISMs inseguros y ejecute codigo arbitrario en la chain destino.
  poc_sketch: |
    1. Attacker deploys TrueISM on destination chain (verify() always returns true)
    2. Attacker sends callRemoteWithOverrides with _ism = TrueISM
    3. On destination, route() returns TrueISM
    4. Mailbox calls TrueISM.verify() -> true
    5. Mailbox calls handle() -> deploys ICA with TrueISM salt -> executes calls
    6. Result: arbitrary code execution without validator approval
  call_stack: 'Mailbox.process(metadata, message) -> router.verify(metadata, message) -> route(message) -> IInterchainSecurityModule(attackerISM) -> verify() returns true -> handle()'

- id: IAR-07
  tier: 2
  type: property
  description: "enrollRemoteRouterAndIsm es inmutable una vez configurado — no se puede actualizar router/ISM comprometido"
  attack_scenario: |
