    id: VV-FP-01
    reason: "First depositor inflation attack is mitigated by design. Revert Lend uses exchange-rate-based share pricing (lendExchangeRateX96) rather than balance-based totalAssets(). Direct token donations increase balance but NOT the exchange rate, so they go to reserves. The share price is only affected by interest accrual through _calculateGlobalInterest. This means the classic ERC4626 inflation vector does not apply."
    investigated_at: "2026-03-20T00:00:00Z"
    pending_briefing_update:
      action: add_to_trampas
      briefing: lending.md
      content: "Revert Lend V3Vault uses exchange-rate-based ERC4626 -- NOT balance-based totalAssets for share pricing. First depositor inflation attack does not apply because donations go to reserves, not share price."

  - hunter: DomainHunter
    id: VV-FP-02
    reason: "Transform borrow() health-check skip is safe. While borrow() skips health check in transform mode (line 630), the health check IS performed at the end of _transform (line 579) after the transformer returns. The transformedTokenId sentinel prevents reentrancy into transform. The only risk would be if a transformer could cause the vault to call itself, but the transformer allowlist is admin-controlled."
    investigated_at: "2026-03-20T00:00:00Z"
