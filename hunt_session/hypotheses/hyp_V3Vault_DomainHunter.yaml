protocol: revert-lend
component: V3Vault
file: src/V3Vault.sol
domain: lending
hunter: DomainHunter
generated_at: "2026-03-20T00:00:00Z"

invariants:
  - id: VV-D01
    tier: 1
    type: property
    description: "Solvency invariant: vault balance + outstanding debt >= total lent amount (lender claims)"
    attack_scenario: "If balance + debt < lent, lenders cannot be made whole. An attacker who finds a way to extract more assets than their share (e.g. via rounding exploit on repeated deposit/withdraw) would break this, causing protocol insolvency. This is the fundamental lending protocol invariant."
    solidity: |
      // After every state-changing operation:
      uint256 balance = IERC20(vault.asset()).balanceOf(address(vault));
      uint256 debt = _convertToAssets(vault.debtSharesTotal(), vault.lastDebtExchangeRateX96(), Math.Rounding.Up);
      uint256 lent = _convertToAssets(vault.totalSupply(), vault.lastLendExchangeRateX96(), Math.Rounding.Up);
      // Allow tolerance for rounding: 1 wei per operation
      gte(balance + debt + ghost_numOps, lent, "VV-D01: solvency violated");
      ghost_numOps++;
    ghost_vars:
      - "uint256 internal ghost_numOps;"
    validated: true
    priority: high
    confidence: 90
    notes: "Core solvency. Rounding tolerance needed (1 wei per op). This catches any asset extraction bug."

  - id: VV-D02
    tier: 1
    type: property
    description: "debtSharesTotal == sum of all individual loan.debtShares across all tokenIds in the vault"
    attack_scenario: "If debtSharesTotal diverges from the sum of individual loans, interest distribution becomes incorrect. An attacker could borrow with a manipulated position where debt shares are not properly tracked, leading to under-collateralized positions or free borrowing. The _updateAndCheckCollateral function tracks token-level debt shares separately from debtSharesTotal."
    solidity: |
      uint256 sumDebtShares = 0;
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          (uint256 shares) = vault.loans(ghost_allTokenIds[i]);
          sumDebtShares += shares;
      }
      eq(vault.debtSharesTotal(), sumDebtShares, "VV-D02: debtSharesTotal != sum of loan shares");
    ghost_vars:
      - "uint256[] internal ghost_allTokenIds;"
    validated: true
    priority: high
    confidence: 95
    notes: "Track all tokenIds added to vault. Critical accounting invariant."

  - id: VV-D03
    tier: 1
    type: property
    description: "tokenConfigs[token].totalDebtShares == sum of debtShares of all loans whose Uni V3 position includes that token"
    attack_scenario: "If per-token totalDebtShares diverges from actual loan debt shares, the collateralValueLimit check (_updateAndCheckCollateral) becomes inaccurate. An attacker could bypass collateral concentration limits by manipulating positions so totalDebtShares undercount, allowing excessive borrowing against a single collateral type. This is especially relevant during transform (position replacement) where old debt is cleaned and new debt assigned."
    solidity: |
      // For each tracked token:
      // sum all loan.debtShares where position has this token as token0 or token1
      // compare with tokenConfigs[token].totalDebtShares
      // This requires tracking position tokens per loan
      uint256 sumForToken = 0;
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          uint256 tid = ghost_allTokenIds[i];
          (uint256 shares) = vault.loans(tid);
          if (ghost_tokenHasAsset[tid][targetToken]) {
              sumForToken += shares;
          }
      }
      (uint32 cf, uint32 cvl, uint192 tds) = vault.tokenConfigs(targetToken);
      eq(uint256(tds), sumForToken, "VV-D03: per-token totalDebtShares mismatch");
    ghost_vars:
      - "uint256[] internal ghost_allTokenIds;"
      - "mapping(uint256 => mapping(address => bool)) internal ghost_tokenHasAsset;"
    validated: false
    priority: high
    confidence: 75
    notes: "Complex to track in fuzzing. Transform/replacement flows are the most likely source of divergence. Needs handler-level ghost tracking of token0/token1 per position."

  - id: VV-D04
    tier: 1
    type: property
    description: "Exchange rates are monotonically non-decreasing: debtExchangeRate and lendExchangeRate can only increase over time (outside of bad debt socialization for lend rate)"
    attack_scenario: "If debtExchangeRate decreases, borrowers pay less interest than owed. If lendExchangeRate decreases outside of explicit socialization, lenders lose funds silently. An attacker who can manipulate the interest rate model or time-travel the exchange rate update could steal interest."
    solidity: |
      (uint256 newDebtRate, uint256 newLendRate) = vault._calculateGlobalInterest();
      gte(newDebtRate, ghost_lastDebtRate, "VV-D04: debtExchangeRate decreased");
      // lendRate can decrease ONLY during _handleReserveLiquidation (bad debt socialization)
      // Outside of that, it must be non-decreasing
      if (!ghost_liquidationInProgress) {
          gte(newLendRate, ghost_lastLendRate, "VV-D04: lendExchangeRate decreased outside socialization");
      }
      ghost_lastDebtRate = newDebtRate;
      ghost_lastLendRate = newLendRate;
    ghost_vars:
      - "uint256 internal ghost_lastDebtRate = 79228162514264337593543950336;"
      - "uint256 internal ghost_lastLendRate = 79228162514264337593543950336;"
      - "bool internal ghost_liquidationInProgress;"
    validated: true
    priority: high
    confidence: 90
    notes: "Q96 initial value. Debt rate must ALWAYS increase (interest compounds). Lend rate can decrease only during socialization."

  - id: VV-D05
    tier: 1
    type: property
    description: "After staking a position, the health check must use ignoreFees=true valuation, and the loan must still be healthy. A borrower who borrows at max against fee-inclusive value then stakes should become unhealthy or be blocked."
    attack_scenario: "Borrower deposits a position with large accumulated fees. Borrows maximum amount using fee-inclusive collateral valuation. Then stakes the position, which switches to fee-exclusive valuation. If the health check after staking is missing or uses wrong valuation, the loan becomes under-collateralized and the fees are lost to the gauge. Attacker profits by extracting borrowed funds while position is effectively underwater."
    solidity: |
      // After any stakePosition call:
      // Verify the health check was done with staked (ignoreFees=true) valuation
      if (vault.loans(tokenId).debtShares > 0) {
          bool isStaked = IGaugeManager(vault.gaugeManager()).tokenIdToGauge(tokenId) != address(0);
          if (isStaked) {
              (uint256 fullValue,,,) = oracle.getValue(tokenId, vault.asset(), true); // ignoreFees=true
              uint32 cf = vault._calculateTokenCollateralFactorX32(tokenId);
              uint256 collateralValue = fullValue * cf / Q32;
              uint256 debt = _convertToAssets(vault.loans(tokenId).debtShares, vault.lastDebtExchangeRateX96(), Math.Rounding.Up);
              gte(collateralValue * BORROW_SAFETY_BUFFER_X32 / Q32, debt, "VV-D05: staked loan unhealthy");
          }
      }
    ghost_vars: []
    validated: true
    priority: high
    confidence: 85
    notes: "V3Vault.stakePosition() does check health post-stake (lines 1390-1393). But the check calls loanInfo() which calls _checkLoanIsHealthy which uses _isStaked. Need to verify the staking state is visible within the same tx. Cross-component with GaugeManager. UPDATE from wildcard-hunter collaboration: liquidation flow for staked positions is internally consistent -- health check, liquidation calc, and _sendPositionValue all use fee-excluded view. The fullValue passed through is fee-excluded (ignoreFees=true), feeValue=0, so partial liquidation formula (liquidationValue * liquidity / fullValue) is correct. Focus fork testing on whether fee-excluded fullValue accurately represents actual post-unstake position value."

  - id: VV-D06
    tier: 1
    type: property
    description: "No position can be borrowed against if both tokens have collateralFactorX32 == 0"
    attack_scenario: "If a position with unconfigured tokens (factor=0) can somehow have debt, it means the collateral check is bypassed. The _calculateTokenCollateralFactorX32 takes the min of both factors, so min(0, anything)=0. But _requireLoanIsHealthy checks collateralValue >= debt, and collateralValue=fullValue*0/Q32=0. So any debt>0 should fail. However, in transform mode, borrow() skips the health check. A transformer could borrow against a zero-collateral-factor position."
    solidity: |
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          uint256 tid = ghost_allTokenIds[i];
          (uint256 debtShares) = vault.loans(tid);
          if (debtShares > 0) {
              uint32 cf = _calculateTokenCollateralFactorX32(tid);
              t(cf > 0, "VV-D06: debt on zero-collateral-factor position");
          }
      }
    ghost_vars:
      - "uint256[] internal ghost_allTokenIds;"
    validated: true
    priority: high
    confidence: 70
    notes: "Transform mode skips health check in borrow() (line 630). The check happens after transform completes (line 579). But if the transformer itself is malicious or compromised... Requires trusted transformer assumption."

  - id: VV-D07
    tier: 2
    type: property
    description: "After liquidation, the position's debt shares must be zero and the loan must be cleaned up"
    attack_scenario: "If liquidation does not fully clear debt, the position could be liquidated multiple times (similar to Frax Finance H-01 from Solodit). Each liquidation extracts reserves, draining the protocol. The _cleanupLoan function deletes the loan entirely, but if called incorrectly or state is corrupted, debt could persist."
    solidity: |
      // After liquidate() call on tokenId:
      (uint256 debtShares) = vault.loans(ghost_lastLiquidatedTokenId);
      eq(debtShares, 0, "VV-D07: debt remains after liquidation");
    ghost_vars:
      - "uint256 internal ghost_lastLiquidatedTokenId;"
    validated: true
    priority: high
    confidence: 85
    notes: "Inspired by Frax Finance finding. V3Vault liquidation always clears full debt (_cleanupLoan at line 779). But verify with fuzzing."

  - id: VV-D08
    tier: 2
    type: property
    description: "dailyDebtIncreaseLimitLeft should never exceed the daily cap computed by _calculateDailyIncreaseLimit"
    attack_scenario: "Liquidation replenishes dailyDebtIncreaseLimitLeft (line 767) by adding liquidatorCost back. If multiple large liquidations happen in one day, the cumulative replenishment could exceed the daily cap, effectively removing the borrow limit. An attacker could: (1) create many positions, (2) make them liquidatable, (3) liquidate them all to inflate the daily limit, (4) borrow beyond intended limits."
    solidity: |
      uint256 dailyLeft = vault.dailyDebtIncreaseLimitLeft();
      uint256 dailyCap = _calculateDailyIncreaseLimit(
          vault.lastLendExchangeRateX96(), vault.dailyDebtIncreaseLimitMin(), MAX_DAILY_DEBT_INCREASE_X32
      );
      lte(dailyLeft, dailyCap, "VV-D08: daily debt limit exceeded via liquidation replenishment");
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 75
    notes: "Line 767 adds liquidatorCost to dailyDebtIncreaseLimitLeft without checking cap. Same for dailyLendIncreaseLimitLeft on withdraw (line 1001). Could accumulate beyond initial daily limit."

  - id: VV-D09
    tier: 2
    type: property
    description: "Reserve socialization (lendExchangeRate haircut) must not reduce the rate below the minimum needed for existing shares to cover remaining deposits"
    attack_scenario: "If bad debt socialization reduces lendExchangeRateX96 too aggressively (e.g., totalLent is very small due to mass withdrawals before liquidation), the rate could crash. An attacker could: (1) deposit and borrow max, (2) withdraw most lending (via another account), (3) let position go bad, (4) liquidation socializes across few remaining lenders who lose disproportionately."
    solidity: |
      uint256 lendRate = vault.lastLendExchangeRateX96();
      // Lend exchange rate should never go below some reasonable fraction of initial Q96
      // A 99% haircut means the protocol has essentially failed
      gte(lendRate, Q96 / 100, "VV-D09: catastrophic lend rate collapse");
    ghost_vars: []
    validated: true
    priority: medium
    confidence: 65
    notes: "Edge case. _handleReserveLiquidation line 1216: newRate = (totalLent - missing) * rate / totalLent. If missing ~ totalLent, rate -> 0. Requires specific sequence of events."

  - id: VV-D10
    tier: 1
    type: property
    description: "No ERC4626 first-depositor share inflation attack: a small initial deposit should not allow an attacker to steal subsequent deposits via share rounding"
    attack_scenario: "Classic ERC4626 inflation attack: (1) Attacker deposits 1 wei, gets 1 share. (2) Attacker donates large amount directly to vault. (3) Victim deposits, gets 0 shares due to rounding. Revert Lend uses custom exchange rate math (not balance-based totalAssets for share calc), which uses lendExchangeRateX96. The exchange rate starts at Q96 (1:1). A direct donation increases balance but NOT lendExchangeRateX96, so it goes to reserves, not share price. This means the classic attack does NOT work here. However, need to verify there is no path to manipulate lendExchangeRateX96 directly."
    solidity: |
      // After deposit: shares received must be > 0 if assets > 0
      // This catches the inflation attack
      if (ghost_lastDepositAssets > 0) {
          t(ghost_lastDepositShares > 0, "VV-D10: zero shares for non-zero deposit");
      }
    ghost_vars:
      - "uint256 internal ghost_lastDepositAssets;"
      - "uint256 internal ghost_lastDepositShares;"
    validated: true
    priority: high
    confidence: 80
    notes: "Revert Lend is likely safe because exchange rate is tracked independently (not balance-based). Donations go to reserves. But verify with large rate manipulation scenarios."

  - id: VV-D11
    tier: 1
    type: property
    description: "Transform position replacement must preserve debt accounting: old position debt must equal new position debt, and global debtSharesTotal must not change"
    attack_scenario: "During transform, when a new NFT replaces the old one (onERC721Received, lines 437-462), debt is copied from old to new. If _cleanupLoan on the old position reduces debtSharesTotal but the new position's debt was already added, there's double-counting. Or if the cleanup subtracts from tokenConfig.totalDebtShares for token0/token1 of the OLD position, but _updateAndCheckCollateral adds to the NEW position's token0/token1, the per-token tracking could diverge if the positions have different token pairs."
    solidity: |
      // Before and after transform:
      uint256 debtSharesBefore = vault.debtSharesTotal();
      // ... transform executes ...
      uint256 debtSharesAfter = vault.debtSharesTotal();
      eq(debtSharesBefore, debtSharesAfter, "VV-D11: debtSharesTotal changed during transform");
    ghost_vars: []
    validated: true
    priority: high
    confidence: 80
    notes: "Transform replacement: _cleanupLoan deletes old loan, new loan gets debtShares assigned. debtSharesTotal should not change because cleanup only deletes loan struct (not debtSharesTotal). Actually looking closer: _cleanupLoan calls _updateAndCheckCollateral with (oldShares, 0) which subtracts from tokenConfig.totalDebtShares, and the new position calls _updateAndCheckCollateral with (0, debtShares) which adds. But debtSharesTotal itself is only modified in borrow/repay/liquidation. During transform replacement, debtSharesTotal is NOT modified. Correct by design."

false_positives:
