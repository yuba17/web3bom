  # ─────────────────────────────────────────────────────────────────
  # H12: sell() — srcToken == destToken permite auto-swap accounting bypass
  # ─────────────────────────────────────────────────────────────────
  - id: H-ORACLE-12
    title: "ParaswapAdapter.swap: si srcToken == destToken, el accounting de balance se rompe"
    severity_proposed: Medium
    confidence: 55
    tier: 1
    category: accounting-mismatch
    status: unverified
    contracts:
      - ParaswapAdapter.sol (líneas 165-200)
    description: |
      swap() calcula:
      ```
      uint256 srcInitial = IERC20(srcToken).balanceOf(address(this));   // línea 178
      uint256 destInitial = IERC20(destToken).balanceOf(address(this)); // línea 179
      // ... call to Augustus ...
      uint256 srcFinal = IERC20(srcToken).balanceOf(address(this));     // línea 188
      uint256 destFinal = IERC20(destToken).balanceOf(address(this));   // línea 189

      uint256 srcAmount = srcInitial - srcFinal;                        // línea 191
      uint256 destAmount = destFinal - destInitial;                     // línea 192
      ```

      Si srcToken == destToken:
      - srcInitial == destInitial (mismo balance)
      - srcFinal == destFinal (mismo balance)
      - srcAmount = srcInitial - srcFinal
      - destAmount = srcFinal - srcInitial (= -srcAmount si srcFinal < srcInitial)

      Caso 1: Augustus "swap" resulta en pérdida neta (balance final < inicial):
      - srcAmount = initial - final > 0 (positivo)
      - destAmount = final - initial < 0 → underflow → revert (Solidity 0.8)

      Caso 2: Augustus "swap" resulta en ganancia neta (balance final > inicial):
      - srcAmount = initial - final → underflow → revert

      Caso 3: Balance no cambia:
      - srcAmount = 0, destAmount = 0
      - require(destAmount >= minDestAmount) con minDestAmount != 0 → revert

      En TODOS los casos, si srcToken == destToken, la función reverts.
      Esto es un DoS auto-infligido (¿quién haría un swap de un token consigo mismo?).

      PERO: ¿hay un escenario donde Augustus pueda hacer algo útil con
      srcToken == destToken? Sí — un "swap" que en realidad es una
      operación de routing compleja que pasa por varios pools y vuelve
      al mismo token con profit (arbitrage loop). Pero esto fallaría
      con el accounting de balance descrito arriba.
    attack_scenario: |
      1. Usuario intenta arb loop: USDC → WETH → DAI → USDC via Augustus
      2. srcToken = USDC, destToken = USDC
      3. Augustus ejecuta el loop exitosamente, adapter tiene más USDC
      4. srcAmount = initial - final → underflow → revert (porque final > initial)
      5. El usuario no puede ejecutar arb loops via Bundler3
    why_it_might_not_work: |
      - Nadie haría srcToken == destToken intencionalmente para un swap
      - Augustus probablemente no soporta este caso tampoco
      - Es un DoS del usuario, no una pérdida de fondos
      - No hay un tercero que pueda forzar srcToken == destToken
    conclusion: |
      Edge case que causa DoS auto-infligido. No es explotable por terceros.
      Podría merecer un require(srcToken != destToken) para mejor UX,
      pero no es una vulnerabilidad de seguridad. Informational como máximo.

