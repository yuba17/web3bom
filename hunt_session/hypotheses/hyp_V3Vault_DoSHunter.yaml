  attack_scenario: "V3Vault hereda de Multicall (OpenZeppelin). Un usuario puede batch multiples calls en una transaccion. Si una call intermedia setea transformedTokenId (via transform) y luego otra call intenta liquidate, la segunda call revierte con TransformNotAllowed. Esto es by design (reentrancy guard). Sin embargo, un atacante podria usar multicall para combinar operaciones de formas no previstas. La atomicidad de multicall protege contra estados parcialmente aplicados."
  impact: "No hay DoS real gracias a la atomicidad de multicall. Si una sub-call revierte, toda la multicall revierte."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Multicall is inherited -- all sub-calls are atomic
    // transformedTokenId guard protects against cross-function reentrancy within multicall
    uint256 tId = vault.transformedTokenId();
    eq(tId, 0, "VV-DOS-15: transformedTokenId must be 0 after any complete transaction");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: "Multicall + transformedTokenId guard es seguro. La atomicidad de la transaccion garantiza que transformedTokenId se resetea. No hay vector de DoS via multicall que no sea self-DoS."
