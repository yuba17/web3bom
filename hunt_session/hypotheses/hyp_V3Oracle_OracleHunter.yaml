  - id: VO-O-04
    tier: 1
    type: property
    description: >
      CRITICAL. _populatePrices() at line 529 checks:
        _requireMaxDifference(priceX96, derivedPoolPriceX96, maxPoolPriceDifference)
      where priceX96 = current pool slot0 spot price of the COLLATERAL POSITION's
      Uniswap pool (from _getPoolSlot0, line 511), and derivedPoolPriceX96 is
      computed from the oracle prices of token0/token1. If an attacker moves the
      pool's spot price (via a large swap) so that it deviates from the oracle-
      derived price by more than maxPoolPriceDifference, EVERY call to getValue()
      reverts with PriceDifferenceExceeded(). This blocks ALL liquidations that
      involve positions in that pool. The attacker is typically the borrower
      themselves, who has economic incentive to avoid liquidation. The attack is
      profitable when: cost_of_swap_manipulation < liquidation_penalty_saved.
      For a 5% liquidation penalty on a $1M position ($50K at risk), the attacker
      can afford significant pool manipulation costs. The comment in the code
      itself (lines 523-524) acknowledges this: "when a pool is in this state,
      liquidations will be disabled" — but assumes arbitrageurs will restore
      price. This assumption FAILS when: (a) the attacker can afford to maintain
      the manipulation longer than arbitrageurs can respond, or (b) the pool has
      low external liquidity, making manipulation cheap.
    attack_scenario: >
      Step 1: Attacker has a large underwater position using WBTC/USDC Uniswap
      NFT as collateral. Position debt > collateral value, liquidation imminent.
      Step 2: Attacker flashloans a large amount of USDC, swaps into the WBTC/USDC
      pool (the same pool as the collateral NFT), moving the spot price of WBTC
      by more than maxPoolPriceDifference (e.g., 2% on a 200bps threshold).
      Step 3: Liquidator calls vault.liquidate(tokenId). Vault calls oracle.getValue().
      oracle._populatePrices() computes derivedPoolPriceX96 from Chainlink WBTC
      and USDC prices, then reads pool.slot0() → manipulated spot. The difference
      exceeds maxPoolPriceDifference → revert PriceDifferenceExceeded().
      Step 4: Liquidation fails. Attacker unwinds the swap (loses only swap fees).
      Net result: attacker pays ~0.05-0.3% in pool fees to avoid 2-10% liquidation
      penalty. FOR DEEP POOLS (e.g. ETH/USDC 0.05%), the cost of moving price 2%
      may be prohibitively high. FOR THIN POOLS (long-tail assets), extremely cheap.
    solidity: |
      // Invariant: if a position is underwater (debt > collateral), liquidation
      // must be callable (oracle must not revert) regardless of pool spot price
      // This is the core invariant — its violation IS the attack.
      function invariant_underwater_positions_are_always_liquidatable() public returns (bool) {
          for (uint256 i = 0; i < trackedTokenIds.length; i++) {
              uint256 tokenId = trackedTokenIds[i];
              uint256 debtShares = vault.loans(tokenId);
              if (debtShares == 0) continue;
              // Check if debt exceeds collateral (using cached safe price)
              bool isUnderwater = _isUnderwater(tokenId);
              if (isUnderwater) {
                  // Oracle MUST succeed for liquidation to work
                  try oracle.getValue(tokenId, vault.asset(), false) returns (
                      uint256 value, uint256, uint256, uint256
                  ) {
                      // If oracle succeeds, check that vault confirms liquidatable
                      t(vault.isLiquidatable(tokenId), "underwater position not liquidatable despite valid oracle");
                  } catch {
                      // Oracle REVERTED — liquidation is blocked — CRITICAL VIOLATION
                      t(false, "oracle reverted for underwater position — liquidation blocked by pool price manipulation");
                  }
              }
          }
          return true;
      }

  - id: VO-O-05
    tier: 1
    type: property
    description: >
