  - id: VO-O-06
    tier: 2
    type: property
    description: >
      _getFeeGrowthOutside() (lines 642-667) uses staticcall on pool.ticks(tick)
      and accepts ONLY two exact response lengths: 256 bytes (Uniswap v3 standard,
      8 return values) or 320 bytes (Aerodrome Slipstream, 10 return values). Any
      other ABI response length causes InvalidPool() revert. This creates a liveness
      risk: any Uniswap v3 fork or future pool upgrade that adds/removes a field
      from ticks() will cause every position in that pool to fail getValue() and
      getLiquidityAndFees() permanently. The fee calculation path (_getFees) calls
      this function, and when it fails, the entire getValue() reverts. This blocks
      liquidation for ALL positions in the affected pool. For current deployments
      on Base (Aerodrome Slipstream) and mainnet (Uniswap v3), this is fine. But
      the protocol aims for multi-chain support, and any integration of pools with
      non-standard ticks() ABI creates a liquidation DoS for all positions therein.
    attack_scenario: >
      A pool factory supported by the oracle (Aerodrome or Uniswap fork) upgrades
      its tick structure to add a new field. All pools deployed by the new factory
      return 352-byte responses from ticks(). Every call to getValue() for positions
      in those pools hits the final revert InvalidPool() at line 666. Liquidations
      for all such positions are permanently blocked until oracle is upgraded.
      Alternatively: a malicious pool is somehow passed as a reference pool during
      setTokenConfig() that returns unexpected ABI from ticks(). However,
      setTokenConfig() validates that the pool has the right token pair (line 269),
      providing some protection.
    solidity: |
      // Invariant: _getFeeGrowthOutside must not revert for any pool that is
      // registered as a reference pool in TokenConfig
      function invariant_fee_growth_outside_never_reverts_for_configured_pools() public view returns (bool) {
          for (uint256 i = 0; i < configuredPools.length; i++) {
              IUniswapV3Pool pool = IUniswapV3Pool(configuredPools[i]);
              int24 testTick = 0; // initialized tick
              // getFeeGrowthOutside should succeed for any initialized tick in configured pool
              (bool success,) = address(oracle).staticcall(
                  abi.encodeWithSignature("_getFeeGrowthOutside(address,int24)", address(pool), testTick)
              );
              // Note: internal function, test via getValue indirectly
              // If getValue reverts for a position in this pool, check if ticks() ABI is the cause
              t(success, "getFeeGrowthOutside reverts for configured pool — liquidation DoS possible");
          }
          return true;
      }

  - id: VO-O-07
    tier: 2
    type: property
    description: >
      _getTWAPPriceX96() (lines 428-437) computes:
        if (!isToken0): poolTWAPPriceX96 = Q96 * Q96 / priceX96
      where priceX96 = mulDiv(sqrtPriceX96, sqrtPriceX96, Q96).
      For a token with an extremely low price (very cheap relative to referenceToken),
      priceX96 can approach 1 (when sqrtPriceX96 ≈ TickMath.MIN_SQRT_RATIO).
      The division Q96 * Q96 / 1 = 2^192 which fits in uint256 (max ~1.15e77),
      but the resulting price for the cheap token (isToken0=false case) would be
      astronomically large — 2^192 — representing the referenceToken as nearly
      worthless relative to the cheap token. This inversion compounds with decimal
      scaling. In extreme tick values (near MIN_TICK), the TWAP price computed in
      _getReferencePoolPriceX96 could cause a computed collateral value that is
      wildly inaccurate when the token is at the edges of Uniswap's valid tick range.
      More practically: if the pool is near TickMath.MIN_TICK (-887272), the
      computed TWAP price for the non-referenceToken (isToken0=false) yields a
      price that overvalues the collateral token massively.
    attack_scenario: >
      Attacker creates or finds a low-liquidity pool for token X (isToken0=false
      relative to referenceToken). The pool is thinly traded and the current tick
      is near MIN_TICK (token X is nearly worthless vs referenceToken). Because
      _getTWAPPriceX96 computes Q96^2 / priceX96, when priceX96 is tiny, the
      returned poolTWAPPriceX96 is enormous. If the oracle is in TWAP mode for X,
      it reports X as extremely valuable. Attacker deposits X NFT as collateral,
      borrows maximum against it, defaults. This requires either a misconfigured
      oracle pool or the ability to manipulate a thin pool to MIN_TICK.
    solidity: |
      // Invariant: TWAP price must be bounded within realistic price ranges
      // for any configured token
      function invariant_twap_price_within_bounds() public view returns (bool) {
          for (uint256 i = 0; i < configuredTokens.length; i++) {
              address token = configuredTokens[i];
              TokenConfig memory cfg = oracle.feedConfigs(token);
              if (cfg.mode == IV3Oracle.Mode.CHAINLINK) continue;
              // Price should be within [2^-64, 2^64] of referenceToken (rough sanity bound)
              try oracle.getTokenValue(token, 1e18, referenceToken) returns (uint256 value) {
                  // 1e18 tokens should be worth between 1e-6 and 1e30 referenceToken units
                  t(value >= 1 && value <= type(uint128).max,
                    "TWAP price outside realistic bounds — possible pool at extreme tick");
              } catch {}
          }
          return true;
      }

  - id: VO-O-08
    tier: 2
    type: property
    description: >
      cachedChainlinkReferencePriceX96 caching in getValue() and getTokenValue().
      In _populatePrices() (lines 516-519), cachedChainlinkReferencePriceX96 is
      populated when token0 is priced and reused for token1. The cache is only
      set when _getReferenceTokenPriceX96 returns a non-zero chainlinkReferencePriceX96,
      which happens only when the token uses a Chainlink-based mode (usesChainlink=true).
      If token0 uses TWAP-only mode, the cache stays 0, and token1 re-fetches the
      Chainlink reference price independently. This is logically correct but creates
      an asymmetry: token0 TWAP + token1 CHAINLINK_TWAP_VERIFY will call the
      Chainlink reference feed TWICE. In a single block, both calls should return
      the same value (Chainlink is deterministic per block). However, at a block
      boundary (if the call spans two blocks — impossible in EVM), they could differ.
      Actual risk: INFORMATIONAL. No exploit path found. Document for completeness.
      The more interesting observation: if token0 == referenceToken, the first call
      returns (Q96, 0), leaving cache=0. Token1's Chainlink path then fetches
      referenceToken price fresh — this is CORRECT behavior. No bug here.
    attack_scenario: >
      No direct attack path found. The caching is correct: if the first token
      does not use Chainlink, no cache is set, and the second token fetches fresh.
      Within a single EVM transaction, Chainlink feeds are deterministic (same
      block = same answer), so two independent calls return identical values.
      The only theoretical scenario is if a Chainlink proxy contract is reentrancy-
      susceptible and returns different values on recursive calls — not a Chainlink
      design pattern and not applicable here (getValue is view).
    solidity: |
      // Invariant: getValue must be idempotent — calling twice in same block returns same result
      function invariant_getValue_idempotent() public view returns (bool) {
          if (trackedTokenIds.length == 0) return true;
          uint256 tokenId = trackedTokenIds[0];
          (uint256 v1, uint256 fv1, uint256 p0_1, uint256 p1_1) =
              oracle.getValue(tokenId, referenceToken, false);
          (uint256 v2, uint256 fv2, uint256 p0_2, uint256 p1_2) =
              oracle.getValue(tokenId, referenceToken, false);
          t(v1 == v2, "getValue not idempotent — cachedChainlinkReferencePriceX96 race");
          t(p0_1 == p0_2, "price0X96 not idempotent");
          t(p1_1 == p1_2, "price1X96 not idempotent");
          return true;
      }
