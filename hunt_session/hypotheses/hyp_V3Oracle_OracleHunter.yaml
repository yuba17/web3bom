    solidity: |
      // Invariant: in TWAP_CHAINLINK_VERIFY mode, the oracle must not be
      // permanently blocking while a position is underwater
      function invariant_twap_chainlink_verify_cannot_block_liquidation() public returns (bool) {
          // If any token in TWAP_CHAINLINK_VERIFY mode has TWAP deviated from
          // Chainlink by more than maxDifference, and there are underwater positions
          // containing that token, this is a critical violation.
          for (uint256 i = 0; i < configuredTokens.length; i++) {
