focus: "Oracle price manipulation, TWAP window attacks, Chainlink staleness edge cases, mode-switch during liquidation, maxPoolPriceDifference griefing, dual-oracle bypass, _getFeeGrowthOutside ABI length, decimal misconfiguration, cachedChainlinkReferencePriceX96 stale cache"

# ─── ANALYSIS NOTES ────────────────────────────────────────────────────────────
#
# KEY FINDINGS SUMMARY:
#
# 1. TWAP MANIPULATION (twapSeconds): The oracle accepts twapSeconds as a
#    per-token config set by the owner. If twapSeconds is set to a SHORT value
#    (e.g. 60s or even 0), the price is trivially manipulable within one block
#    (0 = spot price!). There is NO minimum enforcement in setTokenConfig().
#    An owner misconfiguration or a compromised owner → TWAP is useless.
#    Additionally, twapSeconds=0 explicitly uses the CURRENT slot0 price (line
#    444-445), meaning it is 100% manipulable by any large swap in the same block.
#
# 2. CHAINLINK STALENESS BOUNDARY: Line 420:
#      if (updatedAt + feedConfig.maxFeedAge < block.timestamp || answer <= 0)
#    If updatedAt = type(uint256).max and maxFeedAge > 0, the addition wraps
#    around in Solidity 0.8+ (reverts with overflow). However the real edge case
#    is the BOUNDARY: when updatedAt + maxFeedAge == block.timestamp exactly, the
#    condition is FALSE — the feed is accepted as fresh when it is EXACTLY at the
#    expiry boundary. This is a ±1s off-by-one. Severity: Low.
#    The overflow scenario (updatedAt = MAX_UINT): Solidity 0.8 will REVERT the
#    staleness check, making Chainlink-based prices permanently inaccessible.
#    If a malicious/buggy Chainlink feed returns updatedAt=MAX_UINT, the oracle
#    reverts on every call — DoS on all prices using that feed.
#
# 3. MODE SWITCHING DURING PENDING LIQUIDATION: setOracleMode() can be called
#    by emergencyAdmin at any time with no delay. If a position is underwater and
#    a liquidation tx is in the mempool, emergencyAdmin (or an attacker who
#    compromised emergencyAdmin) can front-run the liquidation by switching the
#    oracle mode for a collateral token from CHAINLINK_TWAP_VERIFY (which is
#    accurate) to TWAP (which uses the manipulable pool price). If the TWAP pool
#    is then manipulated to show a higher collateral value, the position appears
#    healthy and the liquidation reverts. This is a governance/trust boundary
#    attack, but emergencyAdmin is NOT necessarily the same as owner.
#
# 4. maxPoolPriceDifference GRIEFING (CRITICAL - Tier 1):
#    _populatePrices() at line 529 calls:
#      _requireMaxDifference(priceX96, derivedPoolPriceX96, maxPoolPriceDifference)
#    where priceX96 is the CURRENT pool slot0 price and derivedPoolPriceX96 is
#    derived from oracle prices. If an attacker moves the POOL's spot price away
#    from the oracle-derived price by more than maxPoolPriceDifference, ALL calls
#    to getValue() revert. This blocks:
#      - liquidation() in V3Vault (calls oracle.getValue())
#      - borrow health checks
#      - any collateral valuation
#    The attacker can prevent liquidation of an underwater position by performing
#    a large swap in the Uniswap pool (of the COLLATERAL tokens, not the lending
#    asset pool). This is profitable if the attacker is the borrower AND their
#    position is about to be liquidated: cost of manipulating pool < liquidation
#    penalty saved.
#    Note: the check uses the COLLATERAL POSITION's pool (from _loadPositionState,
#    which calls pool.slot0 directly), not the oracle's reference pool.
#
# 5. DUAL-ORACLE BYPASS - TWAP_CHAINLINK_VERIFY borrower weaponization (Tier 1):
#    In TWAP_CHAINLINK_VERIFY mode, TWAP is the primary price and Chainlink is
#    the verify price. _requireMaxDifference() reverts if the gap > maxDifference.
#    A borrower CAN manipulate the Uniswap TWAP pool of a collateral token OVER
#    TIME (across multiple blocks) so that TWAP > real price. This inflates the
#    reported collateral value. The Chainlink verify price will eventually diverge
#    from the manipulated TWAP, causing _requireMaxDifference() to REVERT.
#    This means: the oracle reverts when called → getValue() reverts → liquidation
#    is blocked. Simultaneously, if the borrower can keep the TWAP-vs-Chainlink
#    gap JUST BELOW maxDifference during the borrow phase (when borrowing against
#    inflated collateral), then widen it after → the position is unliquidatable.
#    This is a 2-step attack: (a) slowly pump TWAP, borrow at inflated value,
#    (b) widen gap further to block liquidation.
#
# 6. _getFeeGrowthOutside UNEXPECTED ABI LENGTH (Tier 2):
#    Line 648-666: the function staticcalls pool.ticks(tick) and expects either
#    256 bytes (Uniswap v3) or 320 bytes (Aerodrome Slipstream). Any other length
#    causes a revert with InvalidPool().
#    Risk: if a future Uniswap v3 fork or Aerodrome upgrade adds/removes a field
#    from ticks(), all positions in that pool permanently fail getValue(). This
#    is a availability/liveness risk rather than a fund-loss risk at protocol
#    level. However, it could block liquidation for positions using such pools.
#    Current exploitability: LOW unless a pool is configured that returns a
#    different ticks() ABI (e.g. a custom/malicious pool passed in via position).
#
# 7. DECIMAL MISCONFIGURATION — price0X96/price1X96 distortion:
#    In _getReferenceTokenPriceX96 (lines 355-363), decimal adjustment uses
#    feedConfig.tokenDecimals vs referenceTokenDecimals. If tokenDecimals is
#    WRONG in the config (e.g. configured as 18 but real token is 6), the price
#    is off by 10^12. setTokenConfig() reads decimals on-chain (line 257:
#    IERC20Metadata(token).decimals()), so this cannot be misconfigured for
#    standard ERC20s. However, feedDecimals is read from feed.decimals() (line
#    256). If a Chainlink feed is configured for the wrong pair (e.g. WBTC/ETH
#    instead of WBTC/USD), feedDecimals is correct but the price semantics are
#    wrong. This is an admin configuration error, not a code bug.
#    The real vulnerability: if a token has decimals() that returns a different
#    value than the actual on-chain precision (non-standard ERC20), the math is
#    wrong. But this is a token-level issue.
#    MORE INTERESTING: TWAP price in _getTWAPPriceX96 (line 435):
#      poolTWAPPriceX96 = Q96 * Q96 / priceX96
#    If priceX96 is near 0 (extremely cheap token), this could be astronomically
#    large, but FullMath handles 512-bit intermediate values so no overflow.
#    If priceX96 overflows uint256... priceX96 = mulDiv(sqrtP, sqrtP, Q96).
#    sqrtPriceX96 max is TickMath.MAX_SQRT_RATIO ≈ 2^128, so priceX96 max is
#    2^256/Q96 ≈ 2^160. Within uint256. No overflow.
#
# 8. cachedChainlinkReferencePriceX96 STALE WITHIN A CALL:
#    In _populatePrices() (lines 516-519), cachedChainlinkReferencePriceX96 is
#    fetched once when pricing token0 and reused for token1. This is correct IF
#    token0 uses Chainlink (so the cache is populated). BUT: if token0 is the
#    referenceToken itself, _getReferenceTokenPriceX96 returns (Q96, 0) — the
#    cache remains 0. Then when pricing token1, cachedChainlinkReferencePriceX96
#    is still 0, so token1's Chainlink path fetches the referenceToken price
#    fresh. This is CORRECT behavior but causes 2 Chainlink calls instead of 1.
#    The stale cache scenario: in getTokenValue() (lines 152-154), if tokenIn
#    is NOT referenceToken and does NOT use Chainlink (mode=TWAP), the cache
#    remains 0. Then tokenOut's Chainlink path fetches referenceToken price
#    again — two independent calls at potentially different block timestamps.
#    In a multi-block scenario this is fine, but within a single transaction on
#    a chain where Chainlink can return different answers per call (e.g., if a
#    round update happens mid-execution), the two prices could differ.
#    HOWEVER: in a single EVM transaction, block.timestamp is fixed, and
#    Chainlink is deterministic within a block. So this is NOT exploitable in
#    normal conditions. Only if Chainlink feed can return non-deterministic
#    results within a block — not possible with standard Chainlink.
#    VERDICT: Not exploitable. Document as informational.
#
# ─── CRITICAL PATHS ──────────────────────────────────────────────────────────
# Most dangerous path: VO-O-04 (pool spot price manipulation → block liquidation)
# This is the most actionable attack because:
#   - No governance/admin cooperation needed
#   - Attacker is the borrower, who has economic incentive
#   - Cost is only the swap fee + slippage for moving pool price
#   - Benefit is avoiding liquidation penalty (2-10% of position value)
#   - The pool being manipulated is the COLLATERAL token pool (token0/token1 of
#     the Uniswap NFT position), NOT the lending asset pool
# ─────────────────────────────────────────────────────────────────────────────

hypotheses:
  - id: VO-O-01
    tier: 2
    type: property
    description: >
      twapSeconds=0 in TokenConfig causes _getReferencePoolPriceX96() (line 444)
      to use the CURRENT pool slot0 price instead of a TWAP. There is NO minimum
      twapSeconds enforcement in setTokenConfig(). If an owner (or a governance
      attack) sets twapSeconds=0 for a token in TWAP or CHAINLINK_TWAP_VERIFY
      mode, the TWAP price becomes the live spot price, trivially manipulable
      within a single block via a large swap. The vulnerability is that the oracle
      silently degrades to a spot oracle with ZERO manipulation resistance.
    attack_scenario: >
      Owner (malicious or compromised) calls setTokenConfig(WBTC, ..., twapSeconds=0,
      mode=TWAP_CHAINLINK_VERIFY, ...). Attacker (who controls WBTC/USDC pool
      liquidity) front-runs a victim's borrow: (1) flashloan large WBTC, (2) swap
      into WBTC/USDC pool to inflate WBTC/USDC spot price, (3) victim's borrow
      call uses inflated WBTC price as collateral value → victim can borrow more
      than truly collateralized, (4) attacker unwinds in same block. With
      TWAP_CHAINLINK_VERIFY, Chainlink verify could catch this IF maxDifference
      is tight. But if twapSeconds=0 AND mode=TWAP (no verify), attack is clean.
    solidity: |
      // Invariant: twapSeconds must be non-zero for any mode that uses TWAP
      // In Chimera Properties.sol:
      function invariant_twapSeconds_nonzero_when_twap_used() public view returns (bool) {
          // For each configured token, if mode uses TWAP, twapSeconds must be > 0
          // (Cannot enumerate all tokens from Properties — use ghost tracking)
          // Ghost: track all configured tokens via handler
          for (uint256 i = 0; i < configuredTokens.length; i++) {
              address token = configuredTokens[i];
              (IV3Oracle.TokenConfig memory cfg) = oracle.feedConfigs(token);
              IV3Oracle.Mode mode = cfg.mode;
              bool usesTWAP = (mode == IV3Oracle.Mode.CHAINLINK_TWAP_VERIFY ||
                               mode == IV3Oracle.Mode.TWAP_CHAINLINK_VERIFY ||
                               mode == IV3Oracle.Mode.TWAP);
              if (usesTWAP) {
                  t(cfg.twapSeconds > 0, "twapSeconds must be > 0 when TWAP is used");
              }
          }
          return true;
      }

  - id: VO-O-02
    tier: 2
    type: property
    description: >
      Chainlink staleness check at line 420:
        if (updatedAt + feedConfig.maxFeedAge < block.timestamp || answer <= 0)
      contains an off-by-one: when updatedAt + maxFeedAge == block.timestamp
      exactly, the condition evaluates to FALSE and the stale feed is ACCEPTED
      as fresh. The feed is exactly at its expiry boundary but passes the check.
      Additionally, if a Chainlink feed returns updatedAt = type(uint256).max,
      Solidity 0.8 checked arithmetic causes the addition to REVERT with overflow,
      making all prices dependent on that feed permanently inaccessible (DoS).
      The overflow DoS is more severe: it requires a malicious/buggy feed but
      results in a permanent oracle halt for all tokens using that feed.
    attack_scenario: >
      Overflow DoS: A Chainlink feed (whether legitimately broken or configured
      to a malicious aggregator) returns updatedAt = type(uint256).max. Every
      call to _getChainlinkPriceX96() reverts. Any token configured with
      CHAINLINK, CHAINLINK_TWAP_VERIFY, or TWAP_CHAINLINK_VERIFY mode becomes
      unpriceable. getValue() reverts → all liquidations blocked → bad debt
      accumulates. Off-by-one: adversary times a borrow or collateral withdrawal
      to the exact block where updatedAt + maxFeedAge == block.timestamp, getting
      slightly stale price data accepted.
    solidity: |
      // Invariant: staleness check must reject feeds at or past their age limit
      function invariant_chainlink_staleness_strict() public view returns (bool) {
          // After calling _getChainlinkPriceX96 succeeds, the returned price
          // must have been from a round where updatedAt + maxFeedAge > block.timestamp
          // Test: mock a feed with updatedAt = block.timestamp - maxFeedAge
          // and assert oracle reverts (currently it does NOT revert — off-by-one)
          uint256 updatedAt = block.timestamp - uint256(maxFeedAge);
          // Expected: revert. Actual: passes (< check fails, == is not caught)
          // The correct check should be: updatedAt + maxFeedAge <= block.timestamp
          t(false, "staleness check accepts feed exactly at expiry boundary");
          return true;
      }

  - id: VO-O-03
    tier: 2
    type: property
    description: >
      setOracleMode() (lines 292-303) can be called by emergencyAdmin WITHOUT
