      // Invariant: oracle mode changes should not cause previously-unhealthy
      // positions to appear healthy (i.e., mode switch must not rescue bad debt)
      function invariant_mode_switch_cannot_rescue_bad_debt() public view returns (bool) {
          // Ghost: track positions that were liquidatable before mode switch
