oracle_deep_check:
  summary: |
    This contract has NO Chainlink/price oracle dependency. The "Oracle" is a clearing engine
    (Oracle.sol) with PROVIDER_ROLE access control. No latestRoundData, no TWAP, no price feeds.
    The only external data dependency is balanceOf(address(this)) via _totalBalance(), which is
    private and unused in any on-chain calculation. Price manipulation vectors are N/A.
  latestRoundData_calls: 0
  twap_usage: false
  sequencer_check: "N/A"
  minmax_answer: "N/A"

false_positives:
  - id: FP-SP-O-01
    description: "Reentrancy via USDC transfer callback"
    reason: |
      USDC is not ERC777 and has no transfer callbacks. All external-facing functions use
      nonReentrant. Even if a malicious token were substituted, the ReentrancyGuard would
      prevent re-entry. Not exploitable.
  - id: FP-SP-O-02
    description: "First depositor / share inflation attack"
    reason: |
      SettlementPool has no share/token math. There are no shares, no exchange rates, no
      virtual balances. Deposits and withdrawals are tracked by UUID in a boolean mapping.
      The classic first-depositor attack vector does not apply here.
  - id: FP-SP-O-03
    description: "_totalBalance donation causing incorrect pricing"
    reason: |
      _totalBalance() is private and never used in any on-chain calculation that affects
      fund distribution. There's no share price, no collateral ratio, no liquidation threshold.
      Donations to the pool don't affect any on-chain logic — only off-chain reconciliation.
