invariants:
- id: GPVCA-AC-01
  tier: 1
  type: property
  description: "bid() is callable by ANY address without role restriction — CowSwap vault relayer can pull sell tokens during a bid() callback via the approval set in _onAuctionStart, enabling a race between direct bid() and CowSwap settlement"
  attack_scenario: >
    bid() in BaseAuction has no onlyRole modifier — anyone can call it.
    Meanwhile, _onAuctionStart approves the CowSwap vault relayer for the FULL
    balance. If an attacker calls bid() with a callback (data != empty), the callback
    executes BEFORE the LINK is pulled. During this callback window, the attacker
    could trigger a CowSwap settlement that uses the existing approval to pull
    sell tokens — effectively double-spending the auctioned asset. However, the
    s_entered reentrancy guard blocks isValidSignature during bid(), so CowSwap
    cannot validate a NEW order during the callback. The guard only protects if
    CowSwap settlement calls isValidSignature synchronously — a pre-signed valid
    order (validated before bid) could still be settled during the callback since
    settlement doesn't re-call isValidSignature for already-validated orders.
    INVESTIGATE: Can CowSwap settlement be triggered without calling isValidSignature
    again? If yes, the s_entered guard is insufficient.
  impact: "Potential double-spend of auctioned tokens — sell tokens go to both the bid() caller AND the CowSwap solver"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Track total tokens sent out during bid vs balance change
    uint256 balanceBefore = IERC20(asset).balanceOf(address(auction));
    // After bid() completes:
    uint256 balanceAfter = IERC20(asset).balanceOf(address(auction));
    uint256 tokensOut = balanceBefore - balanceAfter;
    // tokensOut should equal exactly the bid amount
    eq(tokensOut, bidAmount, "GPVCA-AC-01: more tokens left auction than bid amount");
  ghost_vars:
  - "uint256 internal ghost_preBidBalance;"
  validated: false
  priority: high
  confidence: 40
  notes: >
    Requires deep understanding of CowSwap settlement flow. The key question is
    whether GPv2Settlement.settle() calls isValidSignature for EACH trade or only
    once during order placement. If it calls isValidSignature during settlement
    execution, s_entered blocks it. If not, the guard is bypassable. Confidence
    low because CowSwap likely re-validates on every settlement.

- id: GPVCA-AC-02
  tier: 1
  type: property
  description: "Approval in _onAuctionStart is capped at balanceOf(this) at start time — tokens received AFTER auction start (e.g., direct transfers, fee aggregator drip) are NOT approved for CowSwap vault relayer"
  attack_scenario: >
    _onAuctionStart sets forceApprove(vaultRelayer, balanceOf(this)). If additional
    tokens of the same asset arrive at the contract after auction start (e.g., a
    second performUpkeep call, direct transfer, or fee aggregator sending more),
    CowSwap cannot pull them because the approval is already consumed. This means
    isValidSignature checks order.sellAmount <= balanceOf(this) but the vault
    relayer may not have enough approval to actually transfer that amount. The
    CowSwap settlement would revert, effectively DoS-ing the auction for that
    token. This is more of a griefing/DoS than fund loss.
  impact: "DoS of CowSwap settlement path — auction cannot be filled via CowSwap for amounts above original approval"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After _onAuctionStart, check approval vs actual balance
    uint256 approval = IERC20(asset).allowance(address(auction), vaultRelayer);
    uint256 balance = IERC20(asset).balanceOf(address(auction));
    // If balance > approval, CowSwap settlement will fail for full balance orders
    gte(approval, balance, "GPVCA-AC-02: vault relayer approval < contract balance");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    The approval is set once at auction start. performUpkeep cannot be called
    again for the same asset (s_auctionStarts[asset] != 0 check). But direct
    ERC20 transfers to the contract would increase balance without increasing
    approval. isValidSignature would validate the order (sellAmount <= balance)
    but settlement would fail (insufficient approval). Impact is DoS, not fund
    loss. The bid() path is unaffected since it uses safeTransfer directly.

- id: GPVCA-AC-03
  tier: 1
  type: property
  description: "isValidSignature has no caller restriction — any address can call it, and it returns the magic value if order params match. An attacker could craft a valid-looking order to manipulate CowSwap solver behavior"
  attack_scenario: >
    isValidSignature is external view with no access control. Anyone can call it
    to probe which orders the contract would approve. More importantly, CowSwap
    solvers use isValidSignature to validate EIP-1271 orders. If a solver submits
    a batch that includes an order against this contract, isValidSignature validates
    it. The concern is: can an attacker submit a crafted order that passes all
    checks but exploits the price at auction end (maximum discount)? The price
    decay means at elapsedTime == auctionDuration, the price is at endingPriceMultiplier
    (maximum discount). This is by design. However, since anyone can submit orders
    to CowSwap's off-chain orderbook claiming to be from this contract, and
    isValidSignature will validate them if params are correct, a front-running
    solver could always take the best price, leaving the protocol with the
    worst fill. This is inherent to the Dutch auction + CowSwap design.
  impact: "MEV extraction — solvers wait for maximum discount before filling, protocol consistently gets worst price"
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Track the elapsed time at which orders are actually filled
    // If orders consistently fill near auctionDuration, the auction design is suboptimal
    uint256 elapsedAtFill = block.timestamp - s_auctionStarts[asset];
    uint256 duration = s_assetParams[asset].auctionDuration;
    // Flag if fill happens in the last 10% of auction duration
    t(elapsedAtFill < (duration * 90 / 100), "GPVCA-AC-03: order filled in last 10% of auction — max discount");
  ghost_vars:
  - "uint256 internal ghost_fillTimestamp;"
  validated: false
  priority: medium
  confidence: 50
  notes: >
    This is likely "by design" for Dutch auctions — the price decays to attract
    fillers. But the lack of any solver restriction means MEV bots will
    always capture the maximum discount. Compare with protocols that use
    private solvers or time-weighted filling. Marking as Low since it's
    inherent to the auction mechanism.

- id: GPVCA-AC-04
  tier: 1
  type: property
  description: "invalidateOrders requires ORDER_MANAGER_ROLE but has no check on whether the orders being invalidated actually belong to this contract — a compromised ORDER_MANAGER could invalidate arbitrary UIDs on GPv2Settlement"
  attack_scenario: >
    invalidateOrders passes orderUids directly to i_gpV2Settlement.invalidateOrder()
    without any validation that these UIDs correspond to orders from this contract.
    The GPv2Settlement.invalidateOrder function only invalidates orders for
    msg.sender (the auction contract). So this is safe — GPv2Settlement restricts
    invalidation to orders where the order owner == msg.sender. The contract
    can only invalidate its own orders. FALSE POSITIVE — GPv2Settlement's
    invalidateOrder uses msg.sender as the order owner.
  impact: "None — GPv2Settlement restricts invalidation to msg.sender's orders"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // This would need to verify on GPv2Settlement side
    // The invariant is: only orders owned by this contract can be invalidated
    // GPv2Settlement enforces this via msg.sender check
    t(true, "GPVCA-AC-04: placeholder — GPv2Settlement enforces owner check");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    After investigation, this is safe. GPv2Settlement.invalidateOrder marks
    filledAmount[orderUid] = type(uint256).max, where orderUid encodes the
    owner address. Since the auction contract is msg.sender, only its orders
    are affected. Moving to false_positives.

- id: GPVCA-AC-05
  tier: 1
  type: property
  description: "bid() has no role restriction and allows callback execution — an attacker can use the callback to execute arbitrary logic while holding the auctioned tokens before paying LINK"
  attack_scenario: >
    bid() sends auctioned tokens to msg.sender FIRST (line 444: safeTransfer),
    then calls auctionCallback on msg.sender if data is provided (line 449),
    then pulls LINK from msg.sender (line 453: safeTransferFrom). This is a
    classic callback pattern. The s_entered flag prevents reentering bid()
    and blocks isValidSignature. But the attacker holds the tokens during the
    callback and can use them freely (e.g., swap on Uniswap, arbitrage) before
    paying LINK. This is by design for flash-swap patterns. However, if the
    attacker's callback reverts, the entire tx reverts — no risk. The real
    concern: can the attacker manipulate the oracle price during the callback
    to reduce the LINK amount owed? _getAssetPrice is called BEFORE the
    transfer (line 429), so the price is already fixed. Safe.
  impact: "Flash-swap functionality is by design — attacker must pay LINK at end or tx reverts"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that assetOutAmount is computed BEFORE the callback
    // and that safeTransferFrom pulls exactly that amount after callback
    uint256 linkBefore = IERC20(assetOut).balanceOf(address(auction));
    // After bid completes:
    uint256 linkAfter = IERC20(assetOut).balanceOf(address(auction));
    uint256 linkReceived = linkAfter - linkBefore;
    gte(linkReceived, expectedAssetOutAmount, "GPVCA-AC-05: less LINK received than computed");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    The price computation happens at line 429-442, before the transfer at 444
    and callback at 449. The assetOutAmount is fixed before any external call.
    This is safe against price manipulation during callback. The callback
    pattern is intentional (flash-swap). Likely false positive but worth
    verifying the exact execution order in a test.

- id: GPVCA-AC-06
  tier: 2
  type: property
  description: "applyAssetParamsUpdates can modify auction parameters for a token during a LIVE auction of a DIFFERENT token — potential mid-auction config change for shared parameters"
  attack_scenario: >
    applyAssetParamsUpdates checks if the specific asset being updated has a live
    auction (s_auctionStarts[asset] != 0). But it does NOT prevent updating the
    assetOut's parameters while other auctions are live (it only blocks if
    asset == assetOut AND _liveAuctionExists()). Consider: ASSET_ADMIN updates
    assetOut's minAuctionSizeUsd while a WETH auction is live. The _onAuctionEnd
    for WETH checks assetBalance against minAuctionSizeUsd. If minAuctionSizeUsd
    was changed mid-auction, the end condition changes. Similarly, s_assetOut
    decimals are used in _getAssetOutAmount. Changing decimals mid-auction would
    corrupt price calculations. HOWEVER: the code DOES check
    (asset == assetOut && _liveAuctionExists()) so this IS protected.
  impact: "None if the assetOut check works correctly — mid-auction config changes for assetOut are blocked"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: during a live auction, assetOut params cannot be changed
    // Try to call applyAssetParamsUpdates for assetOut while auction is live
    // Expect revert with LiveAuction()
    t(true, "GPVCA-AC-06: placeholder — protected by assetOut live auction check");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    After code review, the check at line 628 correctly prevents assetOut
    parameter changes during any live auction. And individual asset params
    are blocked if that specific asset has a live auction. However, updating
    params for asset C while asset D has a live auction IS allowed — but this
    is fine since C's params don't affect D's auction. Moving to false_positives.

- id: GPVCA-AC-07
  tier: 1
  type: property
  description: "isValidSignature validates order.receiver == address(this) but _onAuctionEnd sends assetOut to s_assetOutReceiver — if assetOutReceiver is changed between order validation and settlement, LINK goes to wrong address"
  attack_scenario: >
    isValidSignature requires order.receiver == address(this) (line 154). This
    means the CowSwap settlement sends the buyToken (LINK) TO THE CONTRACT.
    Then _onAuctionEnd transfers LINK from the contract to s_assetOutReceiver.
    The concern: setAssetOutReceiver requires no live auctions (_whenNoLiveAuctions).
    So during a live auction, s_assetOutReceiver CANNOT be changed. The LINK
    accumulates in the contract during the auction and is swept to the receiver
    only at auction end. Safe because: (1) receiver can't change during auction,
    (2) LINK goes to contract first, then to receiver at end.
    BUT: what if LINK accumulates from multiple CowSwap fills, and the auction
    ends — does _onAuctionEnd sweep ALL assetOut balance? Yes, line 393-396
    sweeps the entire LINK balance. This means LINK from OTHER auctions
    (different sell tokens) would also be swept. This is actually correct
    behavior — all LINK should go to the receiver.
  impact: "None — receiver is immutable during auctions and LINK is correctly swept at auction end"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // After _onAuctionEnd, the contract should have 0 assetOut balance
    uint256 assetOutBalance = IERC20(assetOut).balanceOf(address(auction));
    eq(assetOutBalance, 0, "GPVCA-AC-07: assetOut not fully swept after auction end");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: >
    This is safe by design. The important subtlety: _onAuctionEnd is called
    per-asset (each ended auction triggers it), and each call sweeps ALL
    assetOut balance. If multiple auctions end in the same performUpkeep,
    the first _onAuctionEnd sweeps everything, and subsequent ones find 0
    balance. This is fine — no LINK is lost.

- id: GPVCA-AC-08
  tier: 1
  type: property
  description: "CowSwap vault relayer approval persists for the FULL auction duration — if auction ends via performUpkeep calling _onAuctionEnd, the approval is revoked. But if the auction contract is paused, _onAuctionEnd may never be called, leaving a permanent approval to the vault relayer"
  attack_scenario: >
    When the contract is paused, performUpkeep (which has whenNotPaused) cannot
    be called. This means _onAuctionEnd is never called and the vault relayer
    approval is never revoked. If the contract holds tokens and is paused
    indefinitely, the CowSwap vault relayer retains approval to transfer those
    tokens. The vault relayer is a trusted CowSwap contract, but if CowSwap
    is compromised, those tokens could be drained. The admin can use
    emergencyWithdraw (requires paused + DEFAULT_ADMIN_ROLE) to rescue tokens,
    but the approval remains. After unpausing and calling performUpkeep to end
    the auction, the approval would be revoked. Risk: during the paused window,
    tokens are exposed via the vault relayer approval.
  impact: "During pause, approved tokens remain exposed to CowSwap vault relayer — if CowSwap is compromised, tokens drainable"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // If contract is paused AND has live auctions, check that vault relayer approval > 0
    // This is the vulnerable state
    bool isPaused = auction.paused();
    uint256 approval = IERC20(asset).allowance(address(auction), vaultRelayer);
    if (isPaused && approval > 0) {
      t(false, "GPVCA-AC-08: paused contract has non-zero vault relayer approval");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    The severity depends on trust assumptions about CowSwap infrastructure.
    In practice, the vault relayer is a well-audited, trusted contract. But
    defense-in-depth says approvals should not persist when the contract is
    paused and unable to interact. emergencyWithdraw can rescue the tokens
    but does not revoke the approval. A PAUSER_ROLE holder could grief by
    pausing during an auction, but they are trusted. This is likely an
    accepted risk but worth flagging.

