component: LeverageTransformer
hunter: SignatureHunter
date: "2026-03-24"

invariants: []

notes: >
  LeverageTransformer does NOT use any signature verification, permits (EIP-2612),
  EIP-712 typed data, ecrecover, or any form of off-chain authorization.
  Access control is purely on-chain via _validateCaller (ownership check or vault check).
  The swapData parameter is opaque bytes passed to external routers — it may contain
  signatures internally (e.g., 0x order signatures), but LeverageTransformer does not
  parse, verify, or depend on them. No signature-related attack surface exists in this
  contract. SignatureHunter has nothing to analyze here.
