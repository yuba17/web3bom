    distinguish between "pool already initialized" (benign) and "invalid pool key"
    or "malicious hook reverted" (dangerous). Subsequent actions that depend on the
    pool being initialized may behave unexpectedly.
  attack_scenario: >
    1. User calls multicall([initializePool, mintPosition]) expecting the pool
       to be created then a position minted.
    2. initializePool fails silently (e.g., pool already exists with different
       parameters, or hook rejects initialization).
    3. Returns type(int24).max instead of reverting.
    4. mintPosition proceeds with the existing pool state which may have a
       different sqrtPriceX96 than the user expected.
    5. User mints position at unexpected price, losing value.
    The trust boundary violation: the caller trusts that initializePool either
    succeeds or reverts. The swallowed error breaks this assumption.
  impact: >
    User may mint positions at unexpected prices if initializePool silently fails.
    Slippage checks (amount0Max/amount1Max) provide some protection, but the user
    calculated those based on the expected initialization price.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify: if initializePool returns type(int24).max, the pool was NOT
