- hunter: TrustBoundaryHunter
  id: CLPM-FP-01
  reason: >
    Investigated reentrancy via Multicall delegatecall: multicall uses delegatecall
    to self, which preserves msg.sender. However, the ReentrancyLock (transient
    storage based) prevents re-entering modifyLiquidities/modifyLiquiditiesWithoutLock
    during a callback. The isNotLocked modifier correctly blocks reentrant calls.
    Additionally, vault.lock itself has LockerAlreadySet protection. Double reentrancy
    protection makes this a non-issue.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update: null

- hunter: TrustBoundaryHunter
  id: CLPM-FP-02
  reason: >
    Investigated ERC721 approval front-running: a user could front-run an approved
    operator's transaction by removing approval. But this is standard ERC721 behavior
    and not specific to CLPositionManager. The onlyIfApproved check correctly
    validates at execution time. Not a vulnerability — by design.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update: null

- hunter: TrustBoundaryHunter
  id: CLPM-FP-03
  reason: >
    Investigated _clearOrTake (line 427-436): if delta <= amountMax, the delta is
    cleared (forfeit). This looks like it could be used to steal from the contract,
    but clear() only forfeits POSITIVE deltas (credit owed TO the caller). The caller
    is choosing to forfeit their own credit. The vault.clear function verifies the
    exact amount. Not exploitable — the caller only hurts themselves.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update: null

- hunter: TrustBoundaryHunter
  id: CLPM-FP-04
  reason: >
    Investigated rebasing token handling: rebasing tokens (stETH, AMPL) would cause
    the vault's actual balance to diverge from its accounting. But this is the same
    class as fee-on-transfer (CLPM-TB-08) and is typically documented as a known
    limitation. Most DEX position managers explicitly exclude rebasing tokens.
    Merging with CLPM-TB-08 analysis — not a separate finding.
  investigated_at: '2026-03-23T07:00:00Z'
  pending_briefing_update: null
