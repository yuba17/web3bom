- id: CLPM-TB-01
  tier: 1
  type: property
  description: >
    modifyLiquiditiesWithoutLock has NO deadline check, unlike modifyLiquidities.
    A transaction calling modifyLiquiditiesWithoutLock can be held in the mempool
    indefinitely and executed at an arbitrarily later time when pool conditions
    (price, liquidity, fees) have changed drastically. This is especially dangerous
    for mint/increase actions where the user may add liquidity at a very different
    price than intended, or for decrease/burn where the returned amounts reflect
    stale expectations.
  attack_scenario: >
    1. User (or composing contract) calls modifyLiquiditiesWithoutLock to mint a
       position with amount0Max/amount1Max based on current price.
    2. Transaction sits in mempool for hours/days (L1) or is delayed on L2.
    3. Price moves significantly. The mint executes at the new price.
    4. Although slippage params exist (amount0Max/amount1Max), the user set them
       relative to the old price. If they were generous (as is common to avoid
       reverts), the user mints at a much worse ratio.
    5. Attacker front-runs/sandwiches the stale tx for profit.
    Note: modifyLiquidities (line 124) HAS checkDeadline. The without-lock variant
    (line 135) explicitly omits it. This is a design inconsistency — any contract
    composing via modifyLiquiditiesWithoutLock inside a vault.lock callback loses
    deadline protection unless it implements its own.
  impact: >
    Users or composing contracts that use modifyLiquiditiesWithoutLock lose funds
    to stale execution or sandwich attacks. Severity depends on whether callers
    are expected to implement their own deadline — but the asymmetry with
    modifyLiquidities is a trust boundary violation.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // This is a design-level check — verify that composing contracts calling
    // modifyLiquiditiesWithoutLock implement their own deadline.
    // Cannot be directly fuzzed as a property, but can be verified via grep:
    // All callers of modifyLiquiditiesWithoutLock MUST check block.timestamp.
    // Invariant: if action is mint/increase via WithoutLock path, deadline was checked externally.
    // Pseudo-assertion (manual review required):
    // assert(block.timestamp <= userDeadline, "CLPM-TB-01: no deadline on WithoutLock path");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    This mirrors Uniswap V4 PositionManager which also has this split. The design
    intent is that modifyLiquiditiesWithoutLock is for composing contracts that
    already hold the vault lock and manage their own deadlines. However, nothing
    enforces that the caller actually checks a deadline. If a hook or router
    contract calls this without its own deadline check, the user is exposed.
    Confidence 70% because it depends on how callers use it — it's a trust boundary
    that may or may not be violated by specific integrators.

- id: CLPM-TB-02
  tier: 1
  type: property
  description: >
    Subscriber (CLNotifier) external calls can revert and block critical position
    operations. notifySubscribe, notifyBurn, and notifyModifyLiquidity all revert
    if the subscriber call fails (via bubbleUpAndRevertWith). A malicious or buggy
    subscriber can permanently block decrease, increase, and burn operations on a
    subscribed position.
  attack_scenario: >
    1. Position owner subscribes to a malicious contract as subscriber.
    2. The malicious subscriber's notifyModifyLiquidity always reverts.
    3. Now _modifyLiquidity always reverts for this tokenId (line 463-465).
    4. The owner cannot decrease liquidity or collect fees.
    5. The owner CAN unsubscribe (notifyUnsubscribe uses try/catch on line 79
       of CLNotifier.sol), but only if the vault is unlocked and they are approved.
    6. However, notifyBurn (line 98-104) also reverts if subscriber reverts.
       So burning is blocked until unsubscribe.
    7. transferFrom forces unsubscribe (line 490), so transfer is an escape path.
    Key trust boundary: the subscriber is an untrusted external contract that can
    DoS the position owner's core operations (modify, burn) until they unsubscribe
    or transfer. If the subscriber was set by an approved operator (not the owner
    themselves), the owner may not realize they need to unsubscribe first.
  impact: >
    Temporary DoS on position operations. Owner can always escape via unsubscribe()
    or transferFrom(). Not fund loss but can delay fee collection or force
    suboptimal timing of liquidity removal. Griefing vector if an approved operator
    subscribes to a malicious contract.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that a subscribed position can always be unsubscribed
    // even if the subscriber is malicious.
    // Setup: subscribe tokenId to a contract that reverts on all calls.
    // Then: unsubscribe should still succeed (uses try/catch).
    // Then: decrease/burn should work after unsubscribe.
    bool canUnsubscribe = true;
    try positionManager.unsubscribe(tokenId) {
        canUnsubscribe = true;
    } catch {
        canUnsubscribe = false;
    }
    t(canUnsubscribe, "CLPM-TB-02: cannot unsubscribe from malicious subscriber");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: >
    The escape hatch (unsubscribe uses try/catch, transferFrom auto-unsubscribes)
    mitigates this to Low. But the trust boundary is real: subscribe() lets an
    approved address attach an untrusted contract that can DoS the owner. The owner
    must know to unsubscribe before they can modify/burn. Confidence 60% because
    the escape paths exist — this is more of a UX/griefing issue than a fund loss bug.

- id: CLPM-TB-03
  tier: 1
  type: property
  description: >
    _pay uses permit2.transferFrom to pull tokens from the payer (msg.sender).
    The uint160 cast of amount (line 472) silently truncates amounts larger than
    type(uint160).max. If amount exceeds 2^160, the actual transfer is for
    amount mod 2^160, but the vault accounting expects the full amount.
  attack_scenario: >
    1. A hypothetical scenario where amount > type(uint160).max is passed to _pay.
    2. permit2.transferFrom receives uint160(amount) which is truncated.
    3. The vault's sync/settle expects the full amount but only receives the
       truncated amount.
    4. The delta accounting is off — the settler gets credited for paying more
       than they actually transferred.
    In practice, no ERC20 token has totalSupply > 2^160 (that's ~1.46e48), so this
    is extremely unlikely. However, the SafeCast library is used elsewhere in the
    contract for safe conversions — the inconsistency here is notable.
  impact: >
    Theoretical: attacker could settle debts by paying less than owed.
    Practical: no known ERC20 has supply > 2^160, making this unexploitable
    in practice. The permit2 interface enforces uint160 amounts by design.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that amount passed to _pay never exceeds uint160 max
    // In practice this is enforced by token supplies, but the truncation is silent.
    // This is a code quality / defense-in-depth check.
    uint256 amount = vault.currencyDelta(address(this), currency);
    if (amount > 0) {
        t(amount <= type(uint160).max, "CLPM-TB-03: amount exceeds uint160 in _pay");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    This is by design — permit2 uses uint160 for amounts, and no real token
    exceeds this. The cast is intentional to match the permit2 interface.
    Marking confidence 40% — very unlikely to be exploitable. Including for
    completeness of trust boundary analysis.

- id: CLPM-TB-04
  tier: 1
  type: property
  description: >
    Multicall uses delegatecall to self, which preserves msg.sender and msg.value.
    In a multicall batch, msg.value is reusable across all subcalls. If multiple
    actions in a multicall batch each read msg.value (e.g., multiple WRAP actions
    or multiple modifyLiquidities with native ETH settlement), the same ETH can
    be "spent" multiple times in the accounting, creating phantom credit.
  attack_scenario: >
    1. Attacker calls multicall([modifyLiquidities_A, modifyLiquidities_B]) with
       msg.value = 1 ETH.
    2. Both modifyLiquidities calls go through vault.lock separately (each has
       isNotLocked — but multicall resets the lock between calls since isNotLocked
       sets locker to msg.sender at start and clears at end).
    3. Actually: isNotLocked checks _getLocker() != address(0) and reverts if
       already locked. So the first modifyLiquidities sets locker, executes, clears.
       The second modifyLiquidities then sets locker again, executes, clears. OK.
    4. But within each call, if the action is SETTLE with native currency,
       vault.settle{value: amount}() is called. The contract's balance includes
       msg.value. After the first settle, the ETH is in the vault. The second
       call's settle would fail because the contract no longer has the ETH.
    5. HOWEVER: if the first call only does a WRAP (deposits msg.value to WETH9),
       and the second call also does a WRAP... _wrap calls WETH9.deposit{value: amount}.
       After first wrap, the ETH is gone. Second wrap would revert with insufficient balance.
    Conclusion: The vault.settle and WETH9.deposit actually consume the ETH, so
    double-spend of msg.value is prevented by balance checks. But the SWEEP action
    (line 439-442) can sweep the contract's balance to any recipient. If SWEEP
    is combined with SETTLE in a multicall, the order matters and could leak value.
  impact: >
    After deeper analysis: msg.value double-spend is prevented because settle/wrap
    actually transfer the ETH out. The real risk is in the SWEEP action: if tokens
    are left in the contract between multicall subcalls, SWEEP can be used to
    extract them. But this requires tokens to be sitting in the contract, which
    shouldn't happen in normal flows.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that multicall with msg.value cannot double-count ETH
    // Test: multicall with two WRAP actions, each for msg.value
    // Expected: second WRAP should revert (insufficient balance)
    // If it doesn't revert, msg.value is being double-counted.
    uint256 contractBalanceBefore = address(positionManager).balance;
    // After multicall with 1 ETH and two WRAPs of 1 ETH each:
    // The second should revert. If total WETH minted > msg.value, it's a bug.
    uint256 wethBalance = WETH9.balanceOf(address(positionManager));
    lte(wethBalance, msg.value, "CLPM-TB-04: msg.value double-counted in multicall");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    After analysis, msg.value double-spend is mitigated by actual ETH transfers
    consuming the balance. The Uniswap V4 PositionManager has the same pattern.
    However, the multicall+delegatecall pattern remains a known attack surface
    (see Sushiswap RouteProcessor exploit). Confidence 55% — the specific double-
    spend is likely prevented, but edge cases in action ordering within multicall
    deserve fuzzing. Lowering to potential false positive but keeping for fuzz validation.

