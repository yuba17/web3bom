    int24 result = positionManager.initializePool(poolKey, sqrtPriceX96);
    if (result == type(int24).max) {
        // Pool was not initialized — either already exists or invalid params.
        // Subsequent mint should still respect slippage.
        // Get actual pool price:
        (uint160 actualSqrt,,,) = clPoolManager.getSlot0(poolKey.toId());
        // If actualSqrt != sqrtPriceX96, the user is minting at a different price.
        // This is the trust boundary violation.
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    The comment in the code says "Swallow any error" — this is intentional design
    to make multicall(initializePool + mint) idempotent. The risk is real but
    mitigated by slippage checks on the subsequent mint. Confidence 55% because
    the slippage checks provide a safety net, but the silent failure is still a
    trust boundary issue for integrators who check the return value.

- id: CLPM-TB-07
  tier: 1
  type: property
  description: >
    _mint (line 300-335) allows the owner parameter to be any address via
    _mapRecipient. A caller can mint an NFT position directly to any address.
    Combined with the hookData parameter (which is passed to clPoolManager and
    potentially to a pool hook), a malicious hook could use the mint flow to
    execute arbitrary logic in the context of the vault lock.
  attack_scenario: >
    1. Attacker deploys a malicious pool with a hook that, on beforeModifyLiquidity
       or afterModifyLiquidity, calls back into CLPositionManager via
       modifyLiquiditiesWithoutLock (since vault is locked, but CLPositionManager's
       ReentrancyLock blocks this — isNotLocked would revert because the locker
       is already set).
    2. Actually: the hook callback happens inside the vault.lock context. The
       CLPositionManager's transient LOCKED_BY_SLOT is set to msg.sender. A
       reentrant call to modifyLiquidities or modifyLiquiditiesWithoutLock
       would hit isNotLocked and revert (locker != address(0)).
    3. However, the hook CAN call other external contracts during the callback.
       The hookData is user-controlled and passed directly to the pool manager.
    4. If the hook is a legitimate hook (e.g., fee-taking hook), but the hookData
       contains unexpected parameters, the hook may behave differently than the
       user expects.
    Trust boundary: hookData is an opaque blob passed from user → CLPositionManager
    → clPoolManager → hook. CLPositionManager does not validate or inspect it.
  impact: >
    If a user interacts with a pool whose hook is malicious, the hook can execute
    arbitrary logic during the vault lock. However, the reentrancy lock prevents
    re-entering CLPositionManager. The risk is limited to what the hook can do
    within its own scope. This is by design — hooks are trusted by the pool creator.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Reentrancy test: during a modifyLiquidity callback from a hook,
    // attempting to call modifyLiquidities should revert.
    // This verifies the ReentrancyLock protects against hook reentrancy.
    // (Test setup required: deploy malicious hook that tries to re-enter)
    // After the hook callback, verify no unexpected state changes occurred.
    uint256 tokenIdBefore = positionManager.nextTokenId();
    // ... execute modifyLiquidity with malicious hook ...
    uint256 tokenIdAfter = positionManager.nextTokenId();
    // Only the expected number of positions should be minted.
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    The ReentrancyLock effectively prevents hook reentrancy into CLPositionManager.
    The hookData trust boundary is by design — Infinity (like Uniswap V4) treats
    hooks as trusted by the pool deployer. Users should not interact with pools
    whose hooks they don't trust. Confidence 50% — this is a known design pattern,
    not a bug, but documenting the trust assumption.

- id: CLPM-TB-08
  tier: 1
  type: property
  description: >
    Fee-on-transfer tokens: _pay uses permit2.transferFrom to send tokens to the
    vault. For fee-on-transfer tokens, the vault receives less than `amount`.
    However, vault.sync() + vault.settle() measures the actual balance change.
    So if sync() is called before _pay, and settle() after, the delta credited
    should match actual tokens received. But in _settle (DeltaResolver line 35-44),
    sync is called BEFORE _pay, and settle AFTER — this is the correct order.
    The trust boundary is that the vault's settle() returns the actual paid amount,
    and the delta accounting respects it. If the pool manager uses the `amount`
    parameter (not the settle return value) for accounting, fee-on-transfer tokens
    would break the invariant.
  attack_scenario: >
    1. Pool is created with a fee-on-transfer token (2% fee).
    2. User mints position, _settle is called with amount = 100.
    3. sync() snapshots vault balance. _pay transfers 100 tokens but vault
       receives 98. settle() credits 98 to the delta.
    4. But _modifyLiquidity already computed the liquidity based on the original
       amounts from the pool manager (which expected 100 tokens).
    5. The 2-token shortfall means the vault's actual reserves don't match
       the pool's accounting. Over time this accumulates.
    6. Last withdrawer gets less than owed (classic fee-on-transfer bug).
  impact: >
    Gradual fund loss for LPs in pools with fee-on-transfer tokens. Each
    deposit/withdrawal leaks value equal to the transfer fee. Eventually the
    pool becomes insolvent — last withdrawers get nothing.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify: for fee-on-transfer tokens, vault actual balance matches
    // pool accounting after mint+burn cycle.
    uint256 vaultBalanceBefore = feeOnTransferToken.balanceOf(address(vault));
    // ... user mints position with feeOnTransferToken ...
    // ... user burns position ...
    uint256 vaultBalanceAfter = feeOnTransferToken.balanceOf(address(vault));
    // Vault should have at least as much as the pool manager thinks it has.
    uint256 poolReserves = vault.reservesOfApp(address(clPoolManager), currency);
    gte(vaultBalanceAfter, poolReserves, "CLPM-TB-08: fee-on-transfer token breaks vault solvency");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    This is a CLASSIC DeFi bug pattern. The question is whether PancakeSwap Infinity
    explicitly excludes fee-on-transfer tokens (many protocols do). Need to check
    docs/known issues. If fee-on-transfer tokens are explicitly out of scope, this
    is a known issue. If they're in scope, this is High severity.
    The vault's sync/settle pattern DOES measure actual received amounts, which
    partially mitigates this. But the pool manager's liquidity math may still
    use the pre-fee amounts. Need to trace the full flow through clPoolManager.

