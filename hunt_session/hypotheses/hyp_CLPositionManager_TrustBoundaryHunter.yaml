- id: CLPM-TB-10
  tier: 1
  type: property
  description: >
    transferFrom is overridden (line 488-491) to auto-unsubscribe when a position
    NFT is transferred, but ONLY calls unsubscribe via the internal _unsubscribe
    (not the external unsubscribe which requires onlyIfApproved). The unsubscribe
    uses try/catch for notifyUnsubscribe, so a malicious subscriber cannot block
    the transfer. However, the onlyIfVaultUnlocked modifier IS applied to
    transferFrom. This means position NFTs CANNOT be transferred while the vault
    is locked (during a vault.lock callback). This could block legitimate
    operations where a composing contract needs to transfer a position NFT as
    part of an atomic operation within a vault lock.
  attack_scenario: >
    1. A DeFi protocol builds a "position migration" contract that, in a single
       vault.lock callback, decreases liquidity from position A, transfers the
       NFT, and mints a new position.
    2. The transferFrom call reverts because vault.getLocker() != address(0)
       (the vault IS locked during the callback).
    3. The entire migration transaction reverts.
    4. This is by design to prevent subscriber notification issues during locked
       state, but creates a trust boundary for composing contracts.
  impact: >
    Composing contracts cannot transfer position NFTs during vault.lock callbacks.
    This limits composability. Not a direct fund loss but constrains protocol design.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify: transferFrom reverts when vault is locked.
    // This documents the trust boundary for composing contracts.
    // During vault.lock:
    //   positionManager.transferFrom(from, to, tokenId) should revert
    //   with VaultMustBeUnlocked()
  ghost_vars: []
  validated: false
  priority: low
  confidence: 80
  notes: >
    This is intentional design — the vault must be unlocked for transfers to
    ensure subscriber notifications happen in a clean state. But it's a meaningful
    trust boundary that composing protocols must be aware of. They need to
    structure their operations to transfer NFTs outside of vault.lock callbacks.

