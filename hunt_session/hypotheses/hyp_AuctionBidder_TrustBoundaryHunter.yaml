hunter: TrustBoundaryHunter
component: AuctionBidder
date: "2026-03-22"
audit: "Chainlink Payment Abstraction V2 (Code4rena, $65K)"

invariants:

  - id: AB-TB-01
    description: >
      _multiCall has no target restrictions — AUCTION_BIDDER_ROLE can make AuctionBidder
      call ANY external contract with ANY calldata via the solution parameter. This includes
      calling token contracts to transfer/approve arbitrary amounts of any ERC20 held by the
      contract. The blast radius is: any token balance or approval held by AuctionBidder can
      be drained by the AUCTION_BIDDER_ROLE holder through crafted Call[] entries.
    confidence: 85
    severity: "Low"
    rationale: >
      This is by design — AUCTION_BIDDER_ROLE is a trusted role meant to execute solver
      strategies. However, the trust assumption is NOT documented in the contract (no NatSpec
      warns that this role can drain all tokens). In a multisig/keeper setup, a compromised
      bidder key drains everything. The _multiCall in Caller.sol (L49-63) iterates Call[]
      with no allowlist, no target blacklist, no self-call prevention. The calls execute as
      the AuctionBidder contract itself (msg.sender = AuctionBidder for the target).
      Severity is Low because trusted roles with broad power are common in Chainlink systems,
      but the undocumented blast radius is worth flagging.
    attack_scenario: >
      1. AUCTION_BIDDER_ROLE holder (EOA or compromised keeper) calls bid() with a solution
         containing Call{target: USDC, data: transfer(attacker, fullBalance)}.
      2. During auctionCallback, _multiCall executes the transfer, draining USDC.
      3. The forceApprove at L111 still executes but the contract may not have enough
         assetOut to cover the safeTransferFrom at BaseAuction L453, causing revert.
      4. Alternative: solution approves a different token to attacker address, who front-runs
         the next transaction to pull it. This does NOT revert the current bid.
    code_location: "AuctionBidder.sol:L107-L109, Caller.sol:L49-63"
    mitigation: >
      Document in NatSpec that AUCTION_BIDDER_ROLE has full control over contract balances.
      Consider adding a target allowlist or at minimum blocking self-calls and calls to
      s_auction to prevent reentrancy or state corruption.

  - id: AB-TB-02
    description: >
      _multiCall can call AuctionBidder itself — no self-call prevention. During
      auctionCallback execution, the AUCTION_BIDDER_ROLE's solution can include a call
      to AuctionBidder.withdraw() or AuctionBidder.setAuction() if the contract has
      granted itself the relevant roles.
    confidence: 30
    severity: "Low"
    rationale: >
      In practice, AuctionBidder would not grant itself DEFAULT_ADMIN_ROLE, so self-calls
      to admin functions would revert with AccessControl errors. The external functions
      bid() requires AUCTION_BIDDER_ROLE (which the contract itself wouldn't have), and
      auctionCallback requires msg.sender == s_auction. So self-call exploitation requires
      an unusual role configuration. Low confidence because the preconditions are unlikely
      in normal deployment, but the absence of a self-call check is a defense-in-depth gap.
    attack_scenario: >
      1. If AuctionBidder is ever granted DEFAULT_ADMIN_ROLE on itself (misconfiguration),
         a solution could include Call{target: self, data: setAuction(maliciousAuction)}.
      2. Subsequent bids would interact with the malicious auction.
      3. Highly unlikely in practice — requires misconfigured roles.
    code_location: "AuctionBidder.sol:L109, Caller.sol:L27"
    mitigation: >
      Add `require(calls[i].target != address(this))` in _multiCall or _call to prevent
      self-calls as defense-in-depth.

  - id: AB-TB-03
    description: >
      Malicious s_auction can call auctionCallback with arbitrary assetOut and amountOut,
      causing AuctionBidder to approve arbitrary token amounts to the malicious auction.
      Since s_auction is set by DEFAULT_ADMIN_ROLE, this requires admin compromise.
    confidence: 40
    severity: "Medium"
    rationale: >
      auctionCallback (L97-112) trusts msg.sender == s_auction and uses the assetOut and
      amountOut parameters directly in forceApprove (L111). A malicious auction contract
      could: (a) call auctionCallback with assetOut = WETH and amountOut = type(uint256).max,
      causing AuctionBidder to approve unlimited WETH to the malicious auction, then
      (b) transferFrom that WETH to itself. The attack requires admin to setAuction() to
      a malicious contract first, so this is an admin trust assumption. Medium because admin
      compromise is a realistic threat model in bug bounties, and the impact is full token drain.
    attack_scenario: >
      1. Admin (compromised or malicious) calls setAuction(maliciousAuction).
      2. maliciousAuction implements IBaseAuction interface (passes supportsInterface check).
      3. AUCTION_BIDDER_ROLE holder calls bid() — auction.bid() is called on malicious contract.
      4. Malicious auction calls auctionCallback(from=AuctionBidder, assetOut=WETH,
         amountOut=type(uint256).max, data=validCallsEncoded).
      5. AuctionBidder executes _multiCall (possibly no-op) then forceApprove(maliciousAuction, max).
      6. Malicious auction calls WETH.transferFrom(AuctionBidder, attacker, balance).
    code_location: "AuctionBidder.sol:L103-L111"
    mitigation: >
      This is inherent to admin trust. Consider a timelock on setAuction() to give
      AUCTION_BIDDER_ROLE holders time to react to auction changes. Or cap approval to
      actual required amount (already done — amountOut is the cap, but amountOut comes from
      the untrusted auction).

  - id: AB-TB-04
    description: >
      Receiver griefing via safeTransfer revert. If s_receiver is set to a contract that
      reverts on ERC20 receive (or a contract with a reverting fallback), the entire bid()
      transaction reverts, blocking all auction participation.
    confidence: 55
    severity: "Low"
    rationale: >
      After a successful bid, AuctionBidder transfers remaining assetOut balance to s_receiver
      (L85-91). If s_receiver is a contract that reverts on token receipt (e.g., a paused
      contract, a contract with a reverting tokensReceived hook for ERC777-compatible tokens),
      the entire bid reverts. This is a griefing vector. However, s_receiver is set by
      DEFAULT_ADMIN_ROLE, so a malicious receiver requires admin misconfiguration. The impact
      is denial-of-service on bidding. Standard ERC20 safeTransfer won't trigger receiver
      hooks (only ERC777 would), so for pure ERC20 tokens this requires the receiver to
      have no code that would revert. Realistic scenario: receiver is a multisig or contract
      that gets paused/upgraded to reject transfers.
    attack_scenario: >
      1. Admin sets s_receiver to a contract address.
      2. That contract gets paused or upgraded, now reverting on token receipt.
      3. Every bid() call reverts at L89 because safeTransfer fails.
      4. Bidding is completely blocked until admin updates s_receiver.
    code_location: "AuctionBidder.sol:L85-L91"
    mitigation: >
      Use a pull pattern instead of push for receiver funds, or wrap the transfer in a
      try-catch so bid completion is not dependent on receiver behavior.

  - id: AB-TB-05
    description: >
      Flash-swap model is sound — BaseAuction's reentrancy guard prevents the callback
      from re-entering bid(). The trust model where BaseAuction sends assetIn first and
      expects approval back is protected by safeTransferFrom (L453) which will revert if
      AuctionBidder does not approve sufficient assetOut. AuctionBidder cannot profitably
      "keep" the assetIn because the tx would revert.
    confidence: 95
    severity: "Info"
    rationale: >
      NOT a finding — documenting that this trust boundary was analyzed and is sound.
      BaseAuction L444 transfers assetIn to AuctionBidder, then L449 calls auctionCallback,
      then L453 pulls assetOut via safeTransferFrom. If AuctionBidder doesn't approve,
      L453 reverts, which reverts the entire transaction including the L444 transfer.
      The s_entered guard (L415-417, L457) prevents reentrancy. The only way to "keep"
      assetIn would be if the callback somehow caused the safeTransferFrom to succeed
      without actual token movement, which is impossible with standard ERC20.
    attack_scenario: "N/A — trust boundary is correctly implemented."
    code_location: "BaseAuction.sol:L410-L458"
    mitigation: "None needed."
