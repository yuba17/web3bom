- hunter: DomainHunter
  id: PA-FP-02
  reason: >
    La falta de onlyBundler3 en sell(), buy(), y buyMorphoDebt() fue reportada como LOW
    en Solodit (finding conocido). Sin embargo, swap() interno SÍ tiene onlyBundler3,
    así que cualquier llamada externa a estas funciones eventualmente revierte si msg.sender
    no es Bundler3. Las funciones externas sin modifier son un patrón deliberado para
    permitir que el Bundler3 delegatecall o call directamente. No es un bug.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: trust.md
    content: >
      ParaswapAdapter: sell/buy/buyMorphoDebt sin onlyBundler3 en la función externa es
      by-design porque swap() interno sí lo tiene. No perder tiempo re-reportando esto.
    briefing_update_applied: false

