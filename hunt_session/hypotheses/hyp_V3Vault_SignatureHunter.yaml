  attack_scenario: >
    V3Vault hereda ERC20 de OpenZeppelin pero NO ERC20Permit. Esto significa que no hay funcion
    permit() para las shares del vault. Un atacante NO puede usar una firma para obtener allowance
    sobre shares de otro usuario y llamar withdraw/redeem. Esto es una decision de seguridad
    correcta. Invariante: verificar que no hay bypass de allowance via permit.
  impact: "Si permit() existiera sin protecciones, permitiria drenar fondos de lenders via firmas"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el total de shares en circulacion es consistente con deposits/withdrawals
    uint256 totalShares = vault.totalSupply();
    // total shares debe ser >= 0 (siempre true por uint, pero verificamos no-overflow)
    t(totalShares < type(uint256).max / 2, "VV-SIG-08: total shares suspiciously large -- possible overflow");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Confirmado: V3Vault NO hereda ERC20Permit. La linea de herencia es:
    ERC20, Multicall, Ownable2Step, IVault, IERC721Receiver, Constants.
    No hay funciones permit(), nonces(), DOMAIN_SEPARATOR() en el contrato.
    Esto es seguro contra ataques de firma sobre shares.
  poc_sketch: ''
  call_stack: ''

- id: VV-SIG-09
  tier: 1
  type: property
  description: "Multicall heredado permite batching de operaciones -- un atacante puede batch approveTransform + transform en una sola tx para evitar deteccion"
  attack_scenario: >
    V3Vault hereda Multicall de OpenZeppelin, que permite ejecutar multiples llamadas en una tx.
    Un owner podria batch: approveTransform(tokenId, maliciousAddr, true) + transform(tokenId, transformer, data)
    en una sola tx. Esto no es un bug per se, pero Multicall con delegatecall preserva msg.sender,
    lo que significa que msg.sender es consistente en todas las llamadas del batch. El riesgo es
    que Multicall + msg.value puede causar problemas si alguna funcion usa msg.value (double-spending
    de ETH). V3Vault no usa msg.value en ninguna funcion, asi que esto no es explotable.
  impact: "Si msg.value se usara, Multicall permitiria double-spend de ETH en una sola tx"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el vault no tiene balance de ETH inesperado
    // (indicaria que alguien envio ETH via Multicall o directamente)
    uint256 ethBalance = address(vault).balance;
    // V3Vault no deberia manejar ETH directamente
    lte(ethBalance, 1 ether, "VV-SIG-09: vault has unexpected ETH balance");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: >
    V3Vault hereda Multicall pero no tiene funciones payable (excepto posiblemente receive/fallback
    heredados). Las funciones del vault operan con ERC20 tokens via SafeERC20, no ETH directo.
    El riesgo de Multicall msg.value double-spend no aplica aqui.
  poc_sketch: ''
  call_stack: ''

- id: VV-SIG-10
  tier: 1
  type: property
  description: "approveTransform es per-token y per-target -- revocar approval para un token no afecta otros tokens del mismo owner"
  attack_scenario: >
    El mapping transformApprovals[owner][tokenId][target] es granular por token.
    Si alice tiene tokens 42 y 43, y aprueba bob para token 42, bob NO puede llamar transform
    para token 43. Invariante: la granularidad de approvals se respeta.
    Un posible ataque: si _transform migra la approval del viejo token al nuevo (L553-556),
    un caller aprobado para token 42 obtiene automaticamente approval para el newTokenId
    sin consentimiento explicito del owner para ese nuevo token.
  impact: "Auto-migracion de approval a nuevo token sin consentimiento explicito del owner"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que approvals son granulares y no se propagan inesperadamente
    // Despues de operaciones, cada token solo debe tener approvals explicitas
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 5; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tokenId);
        if (owner != address(0)) {
            // Verificar que el owner sigue siendo valido
            uint256 loanCount = vault.loanCount(owner);
            t(loanCount > 0, "VV-SIG-10: owner has token but loanCount is 0");
        }
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: >
    La auto-migracion de approval en L553-556 es por design para UX (el transformer sigue
    funcionando despues de un token swap). Pero el owner no consiente explicitamente la
    approval para el nuevo token. Esto es un trade-off de usabilidad vs seguridad aceptado.
  poc_sketch: ''
  call_stack: ''

- id: VV-SIG-11
  tier: 1
  type: property
  description: "unstakePosition permite transformedTokenId==tokenId como alternativa a owner check -- durante transform, el transformer puede unstake sin ser owner"
  attack_scenario: >
    unstakePosition() L1398: if (tokenOwner[tokenId] != msg.sender && transformedTokenId != tokenId) revert.
    Esto permite que CUALQUIER address llame unstakePosition(tokenId) si transformedTokenId==tokenId.
    Durante un transform, transformedTokenId esta seteado. Si un tercero (no el transformer, no el owner)
    llama unstakePosition en el mismo bloque/tx donde transform esta activo, podria unstakear el token.
    PERO: en la practica, dentro de un transform call, solo el transformer recibe el call. Un tercero
    no puede interferir en la misma tx a menos que el transformer lo llame. El riesgo real es si el
    transformer es malicioso y unstakea tokens de otros.
  impact: "Unstake no autorizado durante transform mode podria afectar el collateral valuation"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que transformedTokenId es siempre 0 fuera de transform
    // (ya cubierto por VV-SIG-05, refuerzo aqui)
    uint256 transformedId = vault.transformedTokenId();
    eq(transformedId, 0, "VV-SIG-11: transform mode active outside of transform call");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 75
  notes: >
    El check en unstakePosition es relajado durante transform mode por design.
    _unstakeIfNeeded es llamado internamente por _transform, decreaseLiquidityAndCollect, liquidate, remove.
    unstakePosition es la version publica que puede ser llamada por el owner o durante transform mode.
    El riesgo es bajo porque transform mode es atomico dentro de una tx.
  poc_sketch: ''
  call_stack: ''

false_positives:
- hunter: SignatureHunter
  id: VV-SIG-FP-01
  reason: >
    V3Vault NO tiene ERC20Permit, asi que no hay ataque de signature replay sobre shares.
    No hay ecrecover, ECDSA, EIP-712, ni nonces en el contrato. Los unicos mecanismos de
    autorizacion son: (1) msg.sender checks, (2) ERC20 allowance via _spendAllowance,
    (3) transformApprovals mapping, (4) NFT approve() via nonfungiblePositionManager.
    Ninguno involucra firmas criptograficas. La unica firma relevante esta en V3Utils.executeWithPermit
    que es un contrato separado.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: vault.md
    content: >
      V3Vault hereda ERC20 pero NO ERC20Permit. No hay superfice de ataque de firmas/permit
      directamente en el vault. Los ataques de firma solo aplican a V3Utils.executeWithPermit
      y al NFT permit del nonfungiblePositionManager.
    briefing_update_applied: false

- hunter: SignatureHunter
  id: VV-SIG-FP-02
  reason: >
    onERC721Received owner override via data es by design (documented in audit notes L460-463).
    Quien puede triggear safeTransferFrom para el NFT necesita ser el NFT owner o approved,
    asi que el trust model es: si puedes mover el NFT, puedes elegir quien lo recibe en el vault.
    Esto no es un bypass de autorizacion sino un trust assumption explicito.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: vault.md
    content: >
      onERC721Received con data override de owner es intencional en protocolos que usan NFT como
      colateral. No reportar como bug si el protocolo documenta la trust assumption explicitamente.
    briefing_update_applied: false
