    elija el owner. El comment en L460-463 dice que esto es intencional. PERO: si un usuario aprueba
    a un operador malicioso en el NPM, ese operador puede transferir el NFT al vault con data=abi.encode(attacker),
    registrando el loan bajo el atacante en vez del usuario real. El usuario pierde su NFT y el atacante
    obtiene control del colateral.
  impact: "Robo de NFT: operador malicioso transfiere NFT de victima al vault bajo nombre del atacante"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que cada token en el vault tiene un owner valido (no address(0))
    for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
        uint256 tokenId = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tokenId);
        t(owner != address(0), "VV-SIG-06: token in vault with zero owner");
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 60
  notes: >
    El comentario en L460-463 dice "NOTE FOR AUDITS: Raw ERC721 deposits may override owner via callback data.
