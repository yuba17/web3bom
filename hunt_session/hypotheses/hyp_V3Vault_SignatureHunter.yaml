  poc_sketch: ''
  call_stack: ''

- id: VV-SIG-07
  tier: 1
  type: property
  description: "NPM approve al gaugeManager en _stake no deja approval residual si stake falla -- safety gate verifica que NFT salio del vault"
  attack_scenario: >
    En _stake() L1406: approve(gaugeManager, tokenId) se ejecuta ANTES de stakePosition().
    Si stakePosition() revierte, la approval queda. Pero _stake es llamada solo desde _transform
    (L619) y stakePosition (L1389). Si stakePosition revierte, toda la tx revierte, asi que la
    approval no persiste. PERO si el gaugeManager es malicioso y NO mueve el NFT, L1412 verifica
    que ownerOf(tokenId) != address(this), revirtiendo si el NFT sigue en el vault. Esto mitiga
    el caso de gaugeManager que acepta la approval pero no transfiere.
  impact: "Approval residual al gaugeManager permitiria extraer NFTs del vault sin autorizacion"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que si gaugeManager esta seteado, los tokens staked no estan en el vault
    address gm = vault.gaugeManager();
    if (gm != address(0) && ghost_allTokenIds.length > 0) {
        for (uint256 i = 0; i < ghost_allTokenIds.length && i < 10; i++) {
            uint256 tokenId = ghost_allTokenIds[i];
            address owner = vault.ownerOf(tokenId);
            if (owner != address(0)) {
                try npm.ownerOf(tokenId) returns (address nftOwner) {
                    // Si el NFT esta en el vault, no deberia tener approval a nadie excepto address(0)
                    if (nftOwner == address(vault)) {
                        try npm.getApproved(tokenId) returns (address approved) {
                            t(
                                approved == address(0),
                                "VV-SIG-07: residual NFT approval on vaulted token"
                            );
                        } catch {}
                    }
                } catch {}
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    La safety gate en L1412-1414 es critica. Sin ella, un gaugeManager malicioso que acepta
    approve pero no transfiere el NFT dejaria una approval colgante. Con el check, la tx
    revierte si el NFT no se movio, asi que la approval no persiste.
  poc_sketch: ''
  call_stack: ''

- id: VV-SIG-08
