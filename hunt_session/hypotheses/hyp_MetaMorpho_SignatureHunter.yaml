    parameters from calldata, front-runs with a standalone permit() call. The victim''s
    multicall then reverts because the nonce was already consumed by the front-runner''s
    permit call. This is a known griefing vector (Solodit, OpenZeppelin advisory).
    The attacker gains nothing (permit still sets the approval as the victim intended),
    but the victim''s bundled tx fails. The victim can recover by re-submitting deposit()
    alone (allowance is set). MetaMorpho''s withdraw/redeem use _spendAllowance on
    SHARE allowance, not asset allowance, so the permit-granted allowance can only
    be used via transferFrom or third-party withdraw/redeem with the owner parameter.

    '
  attack_scenario: "1. Alice submits multicall([permit(alice, vault, 1000, deadline,\
    \ v, r, s),\n   deposit(1000, alice)]) to mempool.\n2. Bob extracts permit params\
