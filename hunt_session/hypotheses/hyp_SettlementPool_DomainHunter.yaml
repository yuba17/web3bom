- id: SP-D-07
  tier: 2
  type: property
  description: >
    Oracle.grantRole() override at L438-446 has a logic bug: it calls super.grantRole()
    first (which grants the role), then checks `!hasRole(PROVIDER_ROLE, account)` — but
    the role was ALREADY granted by super.grantRole(), so hasRole returns true, and the
    require reverts. This means grantRole() for PROVIDER_ROLE always reverts when used
    through the standard AccessControl.grantRole() path. Only addProvider() works.
    However, if grantRole is called for an account that ALREADY has the role,
    super.grantRole succeeds (no-op), then the require fails. If the account does NOT
    have the role, super.grantRole grants it, then require(!hasRole) fails because
    now they DO have it. So grantRole for PROVIDER_ROLE ALWAYS reverts.
  attack_scenario: >
    1. Admin calls Oracle.grantRole(PROVIDER_ROLE, newProvider) via standard AccessControl interface.
    2. super.grantRole(PROVIDER_ROLE, newProvider) executes — role is granted.
    3. Line 442: hasRole(PROVIDER_ROLE, newProvider) returns TRUE (just granted).
    4. require(!true) => require(false) => REVERT.
    5. The role grant is reverted. numProviders is not incremented.
    6. This is a DoS on the standard AccessControl interface for provider management.
    The only working path is addProvider(). If integrations or multisig UIs use
    grantRole(), provider management breaks.
  impact: "Standard AccessControl.grantRole() interface is broken for PROVIDER_ROLE. Integrations using grantRole() silently fail."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // grantRole for PROVIDER_ROLE should succeed for new accounts
    // but due to ordering bug, it always reverts
    // Test: call grantRole(PROVIDER_ROLE, newAddr) and verify it doesn't revert
    // If it reverts, the invariant is broken
    // t(grantRoleSucceeded, "SP-D-07: grantRole for PROVIDER_ROLE always reverts");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 95
  notes: >
    The fix would be to check hasRole BEFORE calling super.grantRole(). Currently the order is:
    super.grantRole (grants) -> require(!hasRole) (always fails). This is a clear logic bug.
    Note: this is in Oracle.sol but directly affects SettlementPool security since providers
    are the sole authorized callers for most pool operations.

- id: SP-D-08
  tier: 2
  type: property
  description: >
    In batchDepositUSDCAtomic() L122-157, creatorPartyAmountRequested is deposited in EVERY
    loop iteration (L130-141) using the same amount. If items.length > 1 and
    creatorPartyAmountRequested > 0, the creator deposits creatorPartyAmountRequested * items.length
    total USDC. The first iteration uses items[0].parentQuoteUuid as transferUuid, which gets
    marked in transfers_processed. Subsequent iterations use items[i].parentQuoteUuid — each
    is a different UUID, so each passes the dupe check independently. The creator is charged
    N times for N batch items, which may not be the intended behavior (the event at L151-156
    only emits creatorPartyAmountRequested once, suggesting single charge was intended).
  attack_scenario: >
    1. Provider calls Oracle.batchAtomicDeposit with creatorPartyAmountRequested = 100 USDC
    and items array of length 5 (each with different otherPartyAddress and parentQuoteUuid).
    2. batchDepositUSDCAtomic loops 5 times. Each iteration: creator deposits 100 USDC.
    3. Creator is charged 500 USDC total (5 * 100).
    4. But BatchDepositedAtomic event emits creatorPartyAmountRequested = 100 (single value).
    5. Off-chain systems may track only 100 USDC deposited for creator, but 500 was actually taken.
    6. Creator overpays by 400 USDC. These excess funds sit in the pool but may not be
    attributable to the creator in off-chain accounting.
  impact: "Creator overcharged by factor of batch size. Event emission understates actual USDC pulled from creator."
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // Total creator deposit should equal creatorPartyAmountRequested (not multiplied by batch size)
    // ghost_creatorTotalDeposited tracks actual transferFrom amounts for creator in batch
    // ghost_creatorIntendedDeposit tracks the creatorPartyAmountRequested parameter
    t(ghost_creatorTotalDeposited == ghost_creatorIntendedDeposit,
      "SP-D-08: creator charged more than intended in batch deposit");
  ghost_vars:
  - uint256 internal ghost_creatorTotalDeposited;
  - uint256 internal ghost_creatorIntendedDeposit;
  validated: false
  priority: high
  confidence: 88
  notes: >
    This could be intentional — maybe the creator IS supposed to deposit per-item. But the
    event emitting a single creatorPartyAmountRequested strongly suggests the intention was
    a single creator deposit + N other-party deposits. If so, this is a fund loss bug.
    The Oracle.batchAtomicDeposit at L333-341 validates creator address and other addresses
    but does NOT adjust the amount — it passes creatorPartyAmountRequested directly.

false_positives:
- hunter: DomainHunter
  id: SP-FP-01
  reason: >
    ReentrancyGuard (nonReentrant modifier) is applied on ALL external functions. USDC is a
    standard ERC20 without callbacks (not ERC777). transferFrom and transfer on USDC do not
    invoke any receiver hooks. Therefore direct reentrancy via USDC transfers is not possible.
    Cross-function reentrancy is also blocked since all externals share the same ReentrancyGuard lock.
