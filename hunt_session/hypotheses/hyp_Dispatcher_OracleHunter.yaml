- id: D-O-08
  tier: 2
  type: property
  description: "StableSwap exact output calcula amountIn via stableSwapExactOutputAmountIn() y luego ejecuta el swap en dos pasos separados (lineas 365-366). Si el precio del stable pool cambia entre el calculo y la ejecucion (en la misma tx via otro comando previo o sub-plan), el amountIn calculado puede ser insuficiente o excesivo. Dentro de la misma tx, un comando previo podria manipular las reserves del stable pool."
  attack_scenario: "Atacante ejecuta: execute([STABLE_SWAP_EXACT_IN (manipula reserves del stable pool), STABLE_SWAP_EXACT_OUT (calcula amountIn sobre reserves ya manipuladas)]). El primer swap mueve el precio del stable pool. El segundo swap calcula amountIn basandose en el nuevo estado. Si el atacante es quien ejecuta ambos comandos, puede beneficiarse de la discrepancia. Pero ambos son en la misma tx del mismo usuario — el atacante se sandwichea a si mismo? Solo tiene sentido si el recipient del primer swap es diferente."
  impact: "Precio distorsionado en stable swap si se combinan comandos que manipulan el mismo pool"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // El amountIn calculado debe ser <= amountInMax
    // Este check ya esta en stableSwapExactOutputAmountIn (asumiendo que valida)
    // Verificar que el calculo y la ejecucion son atomicos
    uint256 calculatedAmountIn = stableSwapExactOutputAmountIn(amountOut, amountInMax, path, flag);
    lte(calculatedAmountIn, amountInMax, "D-O-08: stable swap amountIn within max");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: "Los dos pasos (calculo + ejecucion) son en la misma tx interna, sin posibilidad de intervencion externa entre ellos. El riesgo es que un comando ANTERIOR en la misma execute() manipule el stable pool. Pero eso requiere que el atacante controle la secuencia de comandos, lo cual significa que es su propia tx — dificil argumentar como finding."

- id: D-O-09
  tier: 1
  type: property
  description: "INFI_CL_POSITION_CALL y INFI_BIN_POSITION_CALL envian address(this).balance como value (lineas 312, 316). Si un comando previo deposita ETH en el router (via receive() o WRAP_ETH parcial), el position call consumiria ese ETH. Un atacante podria combinar esto con manipulacion de precio del pool para que la provision de liquidez se haga a un precio desfavorable."
  attack_scenario: "Paso 1: Usuario envia ETH al router via msg.value. Paso 2: Primer comando WRAP_ETH parcial (wrap solo una parte). Paso 3: Segundo comando es un swap que manipula el precio del pool. Paso 4: INFI_CL_POSITION_CALL envia TODO el balance ETH restante al position manager. Si el precio fue manipulado en el paso 3, la provision de liquidez se hace a un precio peor. El usuario pierde por impermanent loss inmediato."
  impact: "ETH del usuario se usa para provision de liquidez a precio manipulado"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Track: ETH balance del router antes y despues de cada comando
    uint256 ethBefore = address(router).balance;
    // Despues de INFI_CL_POSITION_CALL, todo el ETH se envia
    // Verificar que el usuario consintio el monto de ETH enviado
    uint256 ethSent = ethBefore; // se envia TODO
    // El usuario podria no haber querido enviar todo su ETH restante al position manager
    t(ethSent <= expectedEthForPosition, "D-O-09: unexpected ETH sent to position manager");
  ghost_vars:
  - "uint256 internal ghost_expectedEthForPosition;"
  validated: false
  priority: high
  confidence: 50
  notes: "El value: address(this).balance en las lineas 312 y 316 es un patron que envia TODO el ETH del router al position manager. Si el usuario envio mas ETH del necesario (o si otro comando no consumio todo el ETH esperado), el excedente se va al position manager. Esto no es directamente manipulacion de oracle/precio pero interactua con la provision de liquidez a un precio potencialmente manipulado. Clave: los checks estan en _checkInfiClPositionManagerCall — investigar que valida."

false_positives:
- hunter: OracleHunter
  id: D-O-FP-01
  reason: "Los swaps V2/V3/StableSwap todos tienen checks de slippage (amountOutMin / amountInMax) en los routers subyacentes. El Dispatcher NO bypasea estos checks — los propaga fielmente. El riesgo de sandwich existe pero es mitigado por slippage del usuario. Esto es by-design en TODOS los DEX routers (Uniswap, Sushiswap, PancakeSwap). 4 auditorias previas lo han revisado."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: dex.md
    content: "El Dispatcher de PancakeSwap Infinity delega completamente la proteccion de slippage a los sub-routers (V2/V3/Stable/Infinity). No intenta enforcer slippage a nivel de Dispatcher — esto es by-design y consistente con Uniswap Universal Router."
    briefing_update_applied: false
- hunter: OracleHunter
  id: D-O-FP-02
  reason: "EXECUTE_SUB_PLAN permite recursion pero no crea nuevas oportunidades de manipulacion de precio que no existirian con comandos planos. Cada swap individual tiene sus propios checks. La recursion solo permite agrupacion logica con revert atomico — no cambia la semantica de precio de ningun swap."
  investigated_at: '2026-03-23T00:00:00Z'
  pending_briefing_update: null
