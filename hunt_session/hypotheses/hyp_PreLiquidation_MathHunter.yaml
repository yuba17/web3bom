    pre-liquidated due to rounding. The three-layer rounding inflates LTV by up to
    3 wei in WAD precision. For a borrower near the PRE_LLTV boundary, this means
    they can be pre-liquidated 3 wei of LTV earlier than intended. Impact is minimal
    in value terms but constitutes a correctness violation.
  impact: "Borrower pre-liquidated slightly earlier than intended — minimal value impact"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
