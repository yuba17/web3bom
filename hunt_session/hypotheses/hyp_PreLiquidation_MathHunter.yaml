- id: PL-M01
  tier: 1
  type: property
  description: >
    Rounding asymmetry between seizedAssets-path and repaidShares-path:
    when liquidator specifies seizedAssets, repaidShares is computed rounding UP
    (liquidator pays more). When liquidator specifies repaidShares, seizedAssets
    is computed rounding DOWN (liquidator gets less collateral). This is correct
    protocol-favoring behavior. But the BORROWER perspective must also be consistent:
    the value of collateral seized must always be >= value of debt repaid (after preLIF).
    If preLIF rounds down too aggressively on small amounts, the seized collateral
    could be worth LESS than what the liquidator repaid, meaning the borrower loses
    collateral without proportional debt reduction.
  attack_scenario: >
    With dust-sized positions (e.g., 1 wei of borrow shares) and low-decimal tokens
    (6 decimals), toAssetsDown could round borrowed amount to 0, then wMulDown(preLIF)
    is still 0, and mulDivDown gives 0 seizedAssets. Liquidator repays debt for free
    (0 collateral seized) — effectively a gift to the borrower. Not a loss for borrower,
    but the liquidator wastes gas and the borrower gets free debt reduction. However,
    Morpho's repay with 0 collateral seizure would still work — the question is whether
    this creates a griefing vector where someone can reduce a borrower's debt for free.
  impact: "Dust-level: liquidator loses gas cost, borrower gets tiny free debt reduction"
  impact_rating: Low
  likelihood: Low
  severity_final: null
