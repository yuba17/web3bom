- id: PL-M09
  tier: 1
  type: property
  description: >
    Overflow risk in mulDivDown/mulDivUp with large values. Line 144:
    position.collateral * collateralPrice could overflow uint256 if both are large.
    MathLib.mulDivDown uses unchecked (x * y) / d — Solidity 0.8.27 has overflow checks
    on by default, so x * y WILL revert on overflow. ORACLE_PRICE_SCALE = 1e36.
    If collateral = type(uint128).max (~3.4e38) and collateralPrice = 1e36,
    product = 3.4e38 * 1e36 = 3.4e74, which exceeds uint256.max (~1.15e77).
    Actually 3.4e74 < 1.15e77, so this is fine. But if collateralPrice > 1e38 and
    collateral > 1e38, the product exceeds uint256.max. In practice, Morpho positions
    use uint128 for collateral (~3.4e38 max). With standard oracle prices (~1e36),
    3.4e38 * 1e36 = 3.4e74 — safe. But if PRE_LIQUIDATION_ORACLE returns abnormally
    high prices, the multiplication could overflow and revert, DOSing pre-liquidation.
  attack_scenario: >
    A malicious or buggy PRE_LIQUIDATION_ORACLE returns price = type(uint256).max.
    collateral * price overflows, preLiquidate reverts. Pre-liquidation is permanently
    DOSed. The position can only be liquidated via normal Morpho liquidation (which uses
    the main ORACLE, not PRE_LIQUIDATION_ORACLE). If PRE_LIQUIDATION_ORACLE is
    manipulable (e.g., spot price oracle), an attacker could manipulate it to DOS
    pre-liquidations on their own position, forcing the position to skip pre-liquidation
    and go directly to full Morpho liquidation.
  impact: "DoS of pre-liquidation mechanism — positions can only be liquidated normally"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that collateral * collateralPrice does not overflow
    // This is implicitly checked by Solidity 0.8.x, but we want to verify
    // that realistic values are safe
    uint256 maxCollateral = type(uint128).max;
    uint256 maxReasonablePrice = 1e54; // way above any real oracle price
    // maxCollateral * maxReasonablePrice = 3.4e38 * 1e54 = 3.4e92 < 1.15e77 ... OVERFLOW
    // So even moderately high prices can cause overflow with max collateral
    // Test: can we find collateral and price values within Morpho's realistic range
    // that cause overflow?
    bool overflows = false;
    if (collateralPrice > 0 && uint256(position.collateral) > type(uint256).max / collateralPrice) {
        overflows = true;
    }
    t(!overflows, "PL-M09: multiplication overflow in collateralQuoted computation");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 55
  notes: >
    Morpho Blue stores collateral as uint128, which limits the max to ~3.4e38.
    With ORACLE_PRICE_SCALE = 1e36, the oracle price is typically around 1e36 for
    equal-value tokens. The product 3.4e38 * 1e36 = 3.4e74 is well within uint256.max.
    Overflow requires price > ~3.4e38 (uint256.max / 3.4e38), which is unrealistic
    for any real token pair. This is likely safe but depends on PRE_LIQUIDATION_ORACLE
    being well-behaved.
  poc_sketch: ''
  call_stack: ''

