    But the repaidAssets returned by Morpho.repay from repaidShares could be
    lower than expected (shares → assets rounding in Morpho).
    Net: collateral seized (real value) vs debt repaid (real value). The gap is the
    liquidator's profit. Maximize this gap via input selection.
  attack_scenario: >
    Liquidator optimizes seizedAssets input to maximize (collateralValue - debtRepaid).
    The preLIF is supposed to bound this, but rounding at each step could create
    a situation where the effective incentive exceeds preLIF for specific input values.
  impact: "Liquidator extracts more than preLIF-warranted value from borrower"
  impact_rating: Medium
