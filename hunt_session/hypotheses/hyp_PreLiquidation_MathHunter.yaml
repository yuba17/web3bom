    Line 152: ltv = borrowed.wDivUp(collateralQuoted) (rounds UP — inflates LTV).
    Three consecutive roundings all in the direction that makes LTV higher.
    For a position exactly at PRE_LLTV boundary, these roundings could push
    ltv above PRE_LLTV when the "true" (infinite precision) LTV is exactly at or below it.
  attack_scenario: >
