    from a desired repaidShares amount, the on-chain computation when using seizedAssets
    as input may produce a DIFFERENT repaidShares (higher, due to all-round-up in that path).
    This means the liquidator can be forced to repay MORE shares than expected.
    Conversely, using repaidShares as input always gives LESS seized collateral.
    The asymmetry is protocol-favoring but creates a slippage-like risk for liquidators.
  attack_scenario: >
    Liquidator wants to seize exactly X collateral. They call preLiquidate(borrower, X, 0, "").
    The computed repaidShares = seizedAssetsQuoted.wDivUp(preLIF).toSharesUp(...) rounds UP.
    The repaidAssets from Morpho's repay could be significantly more than expected for
    low-liquidity markets. If the liquidator has exactly enough loan tokens for the
    expected repayment but not the rounded-up amount, the safeTransferFrom in
    onMorphoRepay will revert. No loss, but failed pre-liquidation.
    More critically: if PRE_LCF is small and the rounded-up repaidShares exceeds
    repayableShares (line 172), the pre-liquidation reverts even though the liquidator
