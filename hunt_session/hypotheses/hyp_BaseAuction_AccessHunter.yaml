# ============================================================
# MODELO DEL PROTOCOLO — AccessHunter
# ============================================================
# BaseAuction es un sistema de subasta dutch auction para convertir
# tokens acumulados en FeeAggregator (assetIn) a un token de salida
# (assetOut, probablemente LINK/ETH). Los precios decaen linealmente
# desde un multiplier alto (premium) hasta uno bajo (descuento máximo).
#
# FLUJO DE FONDOS:
#   FeeAggregator → transferForSwap() → BaseAuction → bid() caller (assetIn)
#   bid() caller → safeTransferFrom (assetOut) → BaseAuction → assetOutReceiver
#
# ROLES CRÍTICOS:
#   DEFAULT_ADMIN_ROLE  → setAssetOutReceiver, setFeeAggregator, withdraw
#   ASSET_ADMIN_ROLE    → applyAssetParamsUpdates, setMinBidUsdValue, setAssetOut, applyFeedInfoUpdates
#   AUCTION_WORKER_ROLE → performUpkeep (inicia/cierra subastas)
#   PRICE_ADMIN_ROLE    → transmit (actualiza precios)
#   ORDER_MANAGER_ROLE  → invalidateOrders (GPV2CompatibleAuction)
#   FORWARDER_ROLE      → WorkflowRouter.onReport() → _call(target, data)
#   AUCTION_BIDDER_ROLE → AuctionBidder.bid()
#   PAUSER_ROLE         → emergencyPause
#   UNPAUSER_ROLE       → emergencyUnpause
#
# NO RESTRINGIDO (cualquier address):
#   BaseAuction.bid() — sin modifier de rol, solo whenNotPaused
#   GPV2CompatibleAuction.isValidSignature() — external view, sin rol
# ============================================================

invariants:

# ─────────────────────────────────────────────────────────────
# AC-BA-01: bid() sin restricción de rol — cualquier EOA/contrato puede pujar
# TIER 1: vector de extracción si la lógica de precio falla
# ─────────────────────────────────────────────────────────────
- id: AC-BA-01
  tier: 1
  type: property
  description: >
    bid() no tiene restricción de rol. Cualquier address puede llamarlo si
    hay una subasta activa. Esto es intencional por diseño (mercado abierto),
    pero crea superficie: un atacante puede llamar bid() con data.length != 0
    para triggear el auctionCallback en cualquier contrato que implemente IAuctionCallback,
    incluso si ese contrato no es el AuctionBidder oficial.
  attack_scenario: >
    Atacante despliega un contrato malicioso que implementa IAuctionCallback.
    Llama bid(asset, amount, data) donde data es no-vacío. BaseAuction llama
    IAuctionCallback(msg.sender).auctionCallback(msg.sender, assetOut, assetOutAmount, data).
    El contrato malicioso puede ejecutar lógica arbitraria durante el callback
    (e.g., llamar de vuelta al auction — protegido por s_entered, pero puede
    interactuar con otros contratos del sistema).
    El atacante solo necesita tener los assetOut tokens para el pago final
    — sin rol requerido.
  solidity: |
    // Verifica que bid() puede ser llamado por cualquier address sin rol especial
    // La propiedad es descriptiva — el invariante que DEBE romperse es:
    // si el caller de bid() no tiene AUCTION_BIDDER_ROLE, los fondos del protocolo
    // no deben poder ser drenados por precio manipulado
    address asset = ghost_lastAuctionedAsset;
    if (asset == address(0)) return;
    uint256 auctionStart = baseAuction.getAuctionStart(asset);
    if (auctionStart == 0) return;
    // Invariante: el assetOut obtenido siempre es >= minBidUsdValue-worth
    // Si alguien paga menos de minBidUsdValue en assetOut, es un bug
    uint256 assetOutBefore = IERC20(assetOut).balanceOf(address(baseAuction));
    // (llamada real al bid en el handler — ver handler_bid_open)
    uint256 assetOutAfter = IERC20(assetOut).balanceOf(address(baseAuction));
    gte(assetOutAfter - assetOutBefore, ghost_minExpectedAssetOut, "AC-BA-01: bid pago insuficiente");
  ghost_vars:
    - address internal ghost_lastAuctionedAsset;
    - uint256 internal ghost_minExpectedAssetOut;
  validated: false
  priority: high
  confidence: 75
  notes: >
    bid() es intencionalmente abierto. El riesgo no es que cualquiera pueda pujar,
    sino que el callback recibe assetIn antes del pago — patrón "optimistic transfer".
    El reentrancy guard (s_entered) protege contra re-bid, pero NO protege contra
    interacciones con otros contratos del sistema desde el callback.

# ─────────────────────────────────────────────────────────────
# AC-BA-02: performUpkeep acepta performData arbitrario del caller
# TIER 1: AUCTION_WORKER_ROLE puede iniciar subastas con assets/amounts no validados
# ─────────────────────────────────────────────────────────────
- id: AC-BA-02
  tier: 1
  type: property
  description: >
    performUpkeep() decodifica eligibleAssets y endedAuctions directamente desde
    performData sin verificar que coincidan con el output de checkUpkeep(). Un actor
    con AUCTION_WORKER_ROLE puede construir performData manualmente y pasar:
    (a) amounts arbitrarios para eligibleAssets (distintos a los balances reales del FeeAggregator)
    (b) assets en endedAuctions que todavía tienen tiempo restante
    El contrato hace validaciones internas, pero la cantidad de tokens transferida
    desde FeeAggregator usa el amount del performData, no el balance actual.
  attack_scenario: >
    Actor con AUCTION_WORKER_ROLE construye performData con:
      eligibleAssets = [{asset: tokenX, amount: 999_999_999e18}]
    performUpkeep llama s_feeAggregator.transferForSwap(address(this), eligibleAssets)
    con ese amount. Si FeeAggregator tiene balance suficiente, transfiere todo.
    Si el transferForSwap usa el amount del input (sin cap al balance real), el
    AUCTION_WORKER_ROLE puede drenar el FeeAggregator en una transacción.
    NOTA: requiere analizar FeeAggregator.transferForSwap() — si usa min(amount, balance),
    el riesgo baja a bajo. Si usa el amount directamente, es crítico.
  solidity: |
    // Invariante: el amount transferido desde FeeAggregator no puede exceder
    // el balance real del FeeAggregator en el momento de performUpkeep
    address feeAgg = address(baseAuction.getFeeAggregator());
    for (uint256 i = 0; i < ghost_eligibleAssetsInput.length; i++) {
        address asset = ghost_eligibleAssetsInput[i].asset;
        uint256 inputAmount = ghost_eligibleAssetsInput[i].amount;
        uint256 feeAggBalance = IERC20(asset).balanceOf(feeAgg);
        // Si el amount en performData excede el balance, debería revertir o ser capado
        lte(inputAmount, feeAggBalance, "AC-BA-02: performData amount excede balance FeeAggregator");
    }
  ghost_vars:
    - Common.AssetAmount[] internal ghost_eligibleAssetsInput;
  validated: false
  priority: critical
  confidence: 70
  notes: >
    Depende de la implementación de FeeAggregator.transferForSwap(). Si no cappea
    por balance, AUCTION_WORKER_ROLE puede drenar el FeeAggregator completamente.
    Investigar src/FeeAggregator.sol::transferForSwap() ANTES de escalar severidad.
    Si está protegido → bajar a Low (misconfiguration por admin privilegiado).

# ─────────────────────────────────────────────────────────────
# AC-BA-03: WorkflowRouter puede llamar setAssetOut / applyAssetParamsUpdates en Auction
# TIER 1: FORWARDER_ROLE → onReport() → _call(auctionAddress, adminSelector)
# ─────────────────────────────────────────────────────────────
- id: AC-BA-03
  tier: 1
  type: property
  description: >
    WorkflowRouter.onReport() ejecuta _call(target, data) donde target y selector
    son verificados contra el allowlist de (workflowId, target, selector). Si el admin
    añade el BaseAuction como target allowlistado con selectores de funciones admin
    (setAssetOut, applyAssetParamsUpdates, transmit), entonces cualquier holder de
    FORWARDER_ROLE puede ejecutar esas funciones admin sobre el BaseAuction sin tener
    ASSET_ADMIN_ROLE ni DEFAULT_ADMIN_ROLE directamente.
    FORWARDER_ROLE es un rol de menor privilegio (automation nodes), pero si el
    allowlist del WorkflowRouter está mal configurado, escala a privilegios de admin.
  attack_scenario: >
    1. Admin configura incorrectamente WorkflowRouter:
       applyAllowlistedWorkflowsUpdates([], [{workflowId: X, targetSelectors: [{
         target: baseAuction, selectors: [setAssetOut.selector, applyAssetParamsUpdates.selector]
       }]}])
    2. Atacante con FORWARDER_ROLE llama:
       onReport(metadata={workflowId: X}, report=abi.encode(baseAuction, setAssetOut(maliciousToken)))
    3. BaseAuction.setAssetOut() se ejecuta con un token malicioso controlado por el atacante
    4. La próxima subasta distribuye assetOut a un token que el atacante controla
    RESULTADO: robo de todos los fondos de las subastas futuras via precio manipulado
  solidity: |
    // Invariante: WorkflowRouter NO debe tener BaseAuction en su allowlist con
    // selectores de funciones admin críticas
    bytes4[] memory dangerousSelectors = new bytes4[](4);
    dangerousSelectors[0] = IBaseAuction.performUpkeep.selector;   // inicia subastas
    dangerousSelectors[1] = bytes4(keccak256("setAssetOut(address)"));
    dangerousSelectors[2] = bytes4(keccak256("setAssetOutReceiver(address)"));
    dangerousSelectors[3] = bytes4(keccak256("applyAssetParamsUpdates((address,(uint96,uint64,uint64,uint24,uint8))[],address[])"));

    bytes32[] memory workflowIds = workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < workflowIds.length; i++) {
        address[] memory targets = workflowRouter.getAllowlistedTargets(workflowIds[i]);
        for (uint256 j = 0; j < targets.length; j++) {
            if (targets[j] == address(baseAuction)) {
                bytes4[] memory selectors = workflowRouter.getAllowlistedSelectors(workflowIds[i], targets[j]);
                for (uint256 k = 0; k < selectors.length; k++) {
                    for (uint256 l = 0; l < dangerousSelectors.length; l++) {
                        t(selectors[k] != dangerousSelectors[l],
                          "AC-BA-03: WorkflowRouter tiene selector admin del auction allowlistado");
                    }
                }
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    Este es un riesgo de configuración más que de código. La invariante es preventiva:
    si el allowlist está bien configurado (solo selectores de auction start/trigger),
    no hay problema. El riesgo es que el sistema de configuración permite este error.
    Verificar la configuración de despliegue para determinar si está activo.

# ─────────────────────────────────────────────────────────────
# AC-BA-04: AuctionBidder.auctionCallback — verificación insuficiente del from
# TIER 1: cualquier EOA puede hacer que bid() llame auctionCallback con from=EOA
# ─────────────────────────────────────────────────────────────
- id: AC-BA-04
  tier: 1
  type: property
  description: >
    En BaseAuction.bid(), el callback se hace como:
      IAuctionCallback(msg.sender).auctionCallback(msg.sender, assetOut, assetOutAmount, data)
    El parámetro `from` que recibe el callback es `msg.sender` de bid() — el bidder.
    AuctionBidder.auctionCallback() verifica:
      if (msg.sender != address(s_auction) || from != address(this)) revert AccessForbidden()
    La condición `from == address(this)` asegura que solo AuctionBidder mismo puede
    iniciar el flow (bid() fue llamado desde AuctionBidder). Esto parece correcto.
    PERO: si un atacante despliega un contrato que implementa IAuctionCallback y llama
    bid() directamente, bid() llama auctionCallback(attacker, assetOut, amount, data)
    — el callback recibe assetIn ANTES del pago. El atacante puede usar los tokens
    recibidos para financiar el pago (como flash loan), extrayendo valor al precio
    mínimo si la lógica de precio tiene algún error.
  attack_scenario: >
    1. Atacante despliega MaliciousCallback que implementa IAuctionCallback
    2. Llama BaseAuction.bid(tokenX, maxAmount, arbitraryData)
    3. BaseAuction transfiere tokenX al atacante (línea 444: IERC20(asset).safeTransfer(msg.sender, amount))
    4. BaseAuction llama MaliciousCallback.auctionCallback(attacker, assetOut, assetOutAmount, data)
    5. Dentro del callback, el atacante usa los tokenX recibidos para comprar assetOut en DEX
    6. Aprueba assetOutAmount al BaseAuction
    7. BaseAuction completa safeTransferFrom
    Esto es un flash loan interno legítimo del protocolo. El riesgo es si
    assetOutAmount está calculado incorrectamente (ver MathHunter).
  solidity: |
    // Invariante: después de cualquier bid(), el protocolo siempre recibe >= assetOutAmount
    // calculado al precio correcto. El callback no puede reducir la cantidad recibida.
    uint256 assetOutBefore = IERC20(s_assetOut).balanceOf(address(baseAuction));
    uint256 assetInBefore = IERC20(ghost_lastBidAsset).balanceOf(address(baseAuction));
    // handler ejecuta bid(...)
    uint256 assetOutAfter = IERC20(s_assetOut).balanceOf(address(baseAuction));
    uint256 assetInAfter = IERC20(ghost_lastBidAsset).balanceOf(address(baseAuction));
    // El protocolo siempre debe ganar assetOut y perder assetIn en un bid exitoso
    gte(assetOutAfter, assetOutBefore, "AC-BA-04: protocolo perdió assetOut en bid");
    lte(assetInAfter, assetInBefore, "AC-BA-04: protocolo no entregó assetIn en bid");
  ghost_vars:
    - address internal ghost_lastBidAsset;
  validated: false
  priority: medium
  confidence: 60
  notes: >
    El diseño flash-loan-like es probablemente intencional. El riesgo real depende
    de si hay un error en el cálculo del precio (ver AC-BA-06 y MathHunter).
    Sin error de precio, este patrón es correcto. Investigar conjuntamente con
    OracleHunter y MathHunter.

# ─────────────────────────────────────────────────────────────
# AC-BA-05: isValidSignature — no tiene restricción de caller, executa en contexto de subasta real
# TIER 2: vector de frontrunning / manipulación de órdenes CowSwap
# ─────────────────────────────────────────────────────────────
- id: AC-BA-05
  tier: 2
  type: property
  description: >
    GPV2CompatibleAuction.isValidSignature() es external view sin restricción de rol.
    Cualquiera puede llamarla con cualquier hash/signature para verificar si una orden
    CowSwap sería válida. Esto es por diseño (EIP-1271 requiere ser callable por settlement).
    El riesgo es la combinación:
    1. isValidSignature verifica que sellAmount <= balance del auction (línea 145)
    2. El balance del auction puede ser vaciado entre el check y la ejecución del settlement
    3. Si el settlement llama isValidSignature en un momento diferente al settle,
       puede haber race conditions
    ADICIONALMENTE: isValidSignature no verifica que el caller sea GPv2Settlement.
    Cualquier contrato puede llamarla para "prevalidar" una orden y luego ejecutar
    acciones basadas en esa información (front-running del precio de la subasta).
  attack_scenario: >
    1. Atacante monitorea la mempool para transacciones a performUpkeep (inicio de subasta)
    2. Al ver el inicio de subasta, llama isValidSignature con diferentes sellAmounts
       para determinar el precio exacto del mercado ANTES de que otros bidders lo vean
    3. Usa esa información para colocar la orden óptima en CowSwap con ventaja informativa
    Impacto bajo-medio: ventaja informativa, no pérdida directa de fondos del protocolo.
  solidity: |
    // Invariante: isValidSignature solo debe retornar magic value si la subasta está activa
    // y el orden es económicamente válido para el protocolo
    // No hay invariante de Chimera directa — es un análisis estático de acceso
    t(true, "AC-BA-05: isValidSignature es view-only, riesgo de información");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: >
    Riesgo informativo, no de fondos. En CowSwap el settlement tiene MEV protection
    integrada. Clasificar como Informacional a menos que haya un vector de extracción
    de valor concreto. No escalar sin evidencia de explotación real.

# ─────────────────────────────────────────────────────────────
# AC-BA-06: s_entered guard — protección de reentrancy incompleta en el sistema cross-contrato
# TIER 1: el reentrancy guard solo vive en BaseAuction, no en GPV2CompatibleAuction.isValidSignature
# ─────────────────────────────────────────────────────────────
- id: AC-BA-06
  tier: 1
  type: property
  description: >
    BaseAuction usa un reentrancy guard manual (s_entered bool) en bid(). Este guard
    es seteado a true al inicio y a false al final. GPV2CompatibleAuction.isValidSignature()
    también comprueba s_entered y revierte si es true.
    PROBLEMA: isValidSignature() es `view` — si el settlement contract ejecuta isValidSignature
    durante el callback (desde auctionCallback), s_entered es true y revierte.
    PERO hay un gap: si un solver de CowSwap hace una llamada al settlement que
    internamente llama isValidSignature DURANTE la ejecución de bid() (en el callback),
    la protección funciona correctamente.
    El riesgo real: si hay un path donde s_entered se queda en `true` por un revert
    inesperado en el callback, el contrato queda bloqueado permanentemente.
  attack_scenario: >
    1. Atacante llama bid() con data.length != 0 y un contrato que revierte en auctionCallback
       DESPUÉS de que s_entered = true pero ANTES de que se complete la transacción
    2. La transacción revierte — s_entered vuelve a false (revert deshace el storage)
    3. No hay DOS permanente por reentrancy guard — Solidity reverts deshacen storage
    PERO: si el contrato del callback usa try/catch para envolver la llamada y el
    callback interno revierte, s_entered puede quedar en true si hay un bug de Solidity
    en el manejo de excepciones en assembly.
    MÁS RELEVANTE: AuctionBidder._multiCall() puede llamar CUALQUIER target arbitrario
    (sin whitelist) cuando solución tiene elementos. Un attacker con AUCTION_BIDDER_ROLE
    puede pasar calls que interactúan con el propio auction durante el callback.
  solidity: |
    // Invariante: s_entered siempre debe ser false después de cualquier transacción completada
    // No se puede leer s_entered directamente (internal), pero se puede verificar
    // que bid() no está bloqueado intentando una llamada a bid() desde un punto externo
    // Si s_entered quedó true, todas las bid() subsecuentes revertirían
    // Proxy: intentar bid() con amount=0 (revertirá por lógica, no por reentrancy)
    // Si revierte con ReentrantCall, el guard está roto
    bool canBid = false;
    try baseAuction.bid(ghost_lastAuctionedAsset, 1, "") {
        canBid = true;
    } catch Error(string memory reason) {
        // Puede revertir por InvalidAuction u otras razones válidas — OK
        canBid = true;
    } catch (bytes memory lowLevelData) {
        // Verificar si revirtió por ReentrantCall (selector 0x...)
        bytes4 reentrantSelector = Errors.ReentrantCall.selector;
        if (lowLevelData.length >= 4) {
            bytes4 errorSelector;
            assembly { errorSelector := mload(add(lowLevelData, 32)) }
            t(errorSelector != reentrantSelector, "AC-BA-06: s_entered bloqueado post-transaccion");
        }
    }
  ghost_vars:
    - address internal ghost_lastAuctionedAsset;
  validated: false
  priority: high
  confidence: 55
  notes: >
    El guard de reentrancy parece correcto para el caso nominal. El riesgo es
    AuctionBidder._multiCall() sin whitelist de targets. Un AUCTION_BIDDER_ROLE
    malicioso puede ejecutar calls arbitrarios durante el callback. Esto es un
    riesgo de trusted role, no un bug de acceso sin restricciones.

# ─────────────────────────────────────────────────────────────
# AC-BA-07: applyAssetParamsUpdates — asset out puede ser removido con subasta activa (condición incorrecta)
# TIER 1: condición de live auction para assetOut es incorrecta
# ─────────────────────────────────────────────────────────────
- id: AC-BA-07
  tier: 1
  type: property
  description: >
    En _applyAssetParamsUpdates(), la condición para proteger contra cambios durante
    live auction es:
      if ((asset == assetOut && _liveAuctionExists()) || s_auctionStarts[asset] != 0)
    Para assetOut, la condición es `_liveAuctionExists()` — correcto.
    Para otros assets, la condición es `s_auctionStarts[asset] != 0` — correcto.
    PERO: un ASSET_ADMIN_ROLE puede llamar applyAssetParamsUpdates con removes=[assetX]
    donde assetX tiene una subasta activa (s_auctionStarts[assetX] != 0).
    La condición revierte correctamente en ese caso.
    PROBLEMA POTENCIAL: ¿qué pasa si assetX está en removes Y en adds en la misma llamada?
    Primero se ejecuta removes (delete s_assetParams[assetX]), luego adds (s_assetParams[assetX] = newParams).
    Si el remove pasa la validación (auctionStart == 0) pero luego se añade con params diferentes,
    y ENTRE el remove y el add hay una subasta que inicia... no, es atómica. Sin riesgo aquí.
    RIESGO REAL: assetOut puede ser removido de assetParams si no hay subastas activas,
    lo que hace que whenAssetOutConfigured() reverta en checkUpkeep/performUpkeep.
    El ASSET_ADMIN_ROLE puede efectivamente "pausar" las subastas removiendo assetOut params.
  attack_scenario: >
    1. ASSET_ADMIN_ROLE comprometido llama applyAssetParamsUpdates([], [assetOut])
    2. s_assetParams[assetOut].decimals = 0
    3. whenAssetOutConfigured() revierte en checkUpkeep() y performUpkeep()
    4. El sistema queda incapaz de iniciar nuevas subastas
    5. Cualquier subasta activa existente puede seguir siendo bid(), pero no se pueden
       iniciar nuevas ni cerrar las existentes via performUpkeep
    Impacto: DOS temporal de las subastas. No hay pérdida de fondos directa.
  solidity: |
    // Invariante: si s_assetParams[assetOut].decimals == 0, checkUpkeep debe revertir
    // (esto es el comportamiento esperado — la invariante es que NUNCA debe quedar
    //  assetOut sin params cuando hay subastas activas)
    address assetOut = baseAuction.getAssetOut();
    BaseAuction.AssetParams memory assetOutParams = baseAuction.getAssetParams(assetOut);
    bool hasLiveAuction = false;
    address[] memory allowlistedAssets = baseAuction.getAllowlistedAssets();
    for (uint256 i = 0; i < allowlistedAssets.length; i++) {
        if (baseAuction.getAuctionStart(allowlistedAssets[i]) != 0) {
            hasLiveAuction = true;
            break;
        }
    }
    if (hasLiveAuction) {
        t(assetOutParams.decimals != 0, "AC-BA-07: assetOut params removidos durante subasta activa");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 80
  notes: >
    La validación en removes ya protege contra esto para assets con subasta activa.
    Para assetOut, _liveAuctionExists() protege si HAY subasta activa. Si no hay
    subasta activa, puede ser removido — intencional. El riesgo es la ventana donde
    assetOut está sin params pero no hay subasta activa, y se intenta iniciar una.
    whenAssetOutConfigured() protege de forma efectiva. Clasificar como Low/Info.

# ─────────────────────────────────────────────────────────────
# AC-BA-08: AuctionBidder._multiCall — targets sin whitelist, cualquier call arbitrario
# TIER 1: AUCTION_BIDDER_ROLE puede ejecutar calls arbitrarios desde AuctionBidder
# ─────────────────────────────────────────────────────────────
- id: AC-BA-08
  tier: 1
  type: property
  description: >
    AuctionBidder.bid() con solution.length > 0 pasa los calls a auctionCallback(),
    que ejecuta _multiCall(calls) sin restricción sobre los targets de los calls.
    Un holder de AUCTION_BIDDER_ROLE puede pasar calls arbitrarios que se ejecutan
    como AuctionBidder (msg.sender = AuctionBidder en esas llamadas).
    Si AuctionBidder tiene aprobaciones ERC20 activas (e.g., aprobaciones residuales
    al auction contract), estos calls pueden drenar esos tokens.
    Más crítico: si el receiver del AuctionBidder es una dirección de alto valor,
    _multiCall puede usarse para redirigir fondos.
  attack_scenario: >
    1. AuctionBidder tiene aprobación residual de assetOut al auction (línea 78:
       IERC20(assetOut).forceApprove(..., assetOutAmount) puede dejar aprobaciones)
    2. Actor con AUCTION_BIDDER_ROLE llama AuctionBidder.bid() con solution=[
         Call(target=assetOut, data=transferFrom(auctionBidder, attacker, balance))
       ]
    3. _multiCall ejecuta transferFrom desde AuctionBidder hacia el atacante
    4. AuctionBidder queda sin fondos para completar el bid al auction
    5. bid() en auction revierte — pero el atacante ya extrajo los tokens via transferFrom
    NOTA: el flow es bid(solution) → auction.bid(data) → auctionCallback(_multiCall) →
    call(assetOut.transferFrom). Si la aprobación existe, el transferFrom funciona.
  solidity: |
    // Invariante: después de auctionCallback con solution, los balances del AuctionBidder
    // no deben disminuir en assets que no son assetOut (los assetIn recibidos del auction)
    // Verificar que _multiCall no puede drenar assetOut de AuctionBidder
    uint256 assetOutBalanceBefore = IERC20(assetOut).balanceOf(address(auctionBidder));
    // handler ejecuta AuctionBidder.bid() con solution maliciosa
    uint256 assetOutBalanceAfter = IERC20(assetOut).balanceOf(address(auctionBidder));
    // El balance de assetOut en AuctionBidder debe ser 0 o haberse incrementado
    // (los fondos van al receiver, no disminuyen)
    // Un decremento SIN un bid exitoso correspondiente es el bug
    t(assetOutBalanceAfter >= 0, "AC-BA-08: placeholder - ver notas");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    El riesgo depende de si hay aprobaciones residuales en AuctionBidder.
    En el caso sin solution (else branch), se hace forceApprove al auction
    por el assetOutAmount exacto. En el caso con solution, la aprobación
    la hace el propio _multiCall. Si hay aprobaciones stale de runs anteriores,
    el vector existe. Investigar si forceApprove se revoca después de cada bid.
    El bid() del AuctionBidder NO tiene revoke-after-use explícito.

# ─────────────────────────────────────────────────────────────
# AC-BA-09: transmit() — PRICE_ADMIN_ROLE puede actualizar precios para manipular assetOutAmount
# TIER 2: precio manipulado → menos assetOut requerido en bid → pérdida para protocolo
# ─────────────────────────────────────────────────────────────
- id: AC-BA-09
  tier: 2
  type: property
  description: >
    transmit() en PriceManager acepta unverifiedReports verificados via VerifierProxy.
    Solo permite PRICE_ADMIN_ROLE. El precio afecta directamente a _getAssetOutAmount().
    Si el precio del assetIn sube artificialmente → el bidder paga MÁS assetOut (OK para protocolo).
    Si el precio del assetOut sube artificialmente → el divisor aumenta → bidder paga MENOS assetOut.
    Si el precio del assetIn baja artificialmente → bidder paga MENOS assetOut.
    Un PRICE_ADMIN_ROLE comprometido puede manipular precios para que el auction
    acepte ofertas extremadamente baratas.
    La protección: stalenessThreshold y VerifierProxy (datos firmados por DON).
  attack_scenario: >
    1. PRICE_ADMIN_ROLE comprometido (o colusión con un DON node)
    2. Transmite un precio de assetIn muy bajo (o assetOut muy alto)
    3. El próximo bid() calcula assetOutAmount como casi 0
    4. Bidder cómplice llama bid() y recibe todos los tokens de la subasta
       pagando casi nada de assetOut
    Impacto: vaciado total de la subasta activa. Requiere comprometer PRICE_ADMIN_ROLE
    + capacidad de generar reportes firmados por el DON (o PRICE_ADMIN_ROLE puede transmitir
    cualquier cosa que pase por VerifierProxy).
  solidity: |
    // Invariante: el precio de assetIn nunca debe caer más del X% entre bloques
    // (precio razonable = no manipulado)
    address asset = ghost_lastAuctionedAsset;
    if (asset == address(0)) return;
    (uint256 currentPrice,,) = baseAuction.getAssetPrice(asset);
    if (ghost_lastAssetPrice[asset] > 0 && currentPrice > 0) {
        // No debe caer más del 50% en una sola actualización
        uint256 minAcceptablePrice = ghost_lastAssetPrice[asset] / 2;
        gte(currentPrice, minAcceptablePrice, "AC-BA-09: precio cayó >50% en un update");
    }
    ghost_lastAssetPrice[asset] = currentPrice;
  ghost_vars:
    - mapping(address => uint256) internal ghost_lastAssetPrice;
    - address internal ghost_lastAuctionedAsset;
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Requiere comprometer PRICE_ADMIN_ROLE. El VerifierProxy es la defensa principal.
    Si el VerifierProxy está bien implementado (firma DON válida requerida), este
    vector no es explotable sin comprometer el DON. Clasificar como Medium/Info
    a menos que el VerifierProxy tenga vulnerabilidades.

# ─────────────────────────────────────────────────────────────
# AC-BA-10: forceStart — función ausente — cualquier amount puede quedar varado
# TIER 2: gap de funcionalidad — no hay mecanismo para forzar inicio sin checkUpkeep
# ─────────────────────────────────────────────────────────────
- id: AC-BA-10
  tier: 2
  type: property
  description: >
    El sistema solo puede iniciar subastas via performUpkeep() con AUCTION_WORKER_ROLE.
    No existe un mecanismo de "forceStart" sin pasar por checkUpkeep primero.
    Si el oracle price es stale (isValid=false), checkUpkeep retorna upkeepNeeded=false
    aunque haya fondos disponibles. Esto significa que fondos pueden quedar atrapados
    en FeeAggregator indefinidamente si el oracle falla.
    Además, performUpkeep() verifica el precio on-chain — si el precio se vuelve
    stale entre el checkUpkeep y el performUpkeep, la transacción revierte.
  attack_scenario: >
    1. Oracle de assetIn se vuelve stale (no hay nuevos reportes por >stalenessThreshold)
    2. FeeAggregator acumula grandes cantidades de assetIn
    3. checkUpkeep() retorna false → no se pueden iniciar subastas
    4. La única salida es: (a) esperar que el oracle se recupere, (b) ASSET_ADMIN_ROLE
       configure un usdDataFeed de fallback, (c) emergencyWithdraw por DEFAULT_ADMIN_ROLE
    Este es un riesgo de disponibilidad, no de seguridad directa.
  solidity: |
    // Invariante: si hay fondos en FeeAggregator y el oracle está fresco,
    // checkUpkeep siempre debe retornar true (hay trabajo disponible)
    address feeAgg = address(baseAuction.getFeeAggregator());
    address[] memory assets = baseAuction.getAllowlistedAssets();
    for (uint256 i = 0; i < assets.length; i++) {
        address asset = assets[i];
        if (asset == baseAuction.getAssetOut()) continue;
        uint256 balance = IERC20(asset).balanceOf(feeAgg);
        BaseAuction.AssetParams memory params = baseAuction.getAssetParams(asset);
        if (params.decimals == 0) continue;
        (uint256 price,, bool isValid) = baseAuction.getAssetPrice(asset);
        if (!isValid || price == 0) continue;
        uint256 usdValue = (balance * price) / (10 ** params.decimals);
        if (usdValue >= params.minAuctionSizeUsd && baseAuction.getAuctionStart(asset) == 0) {
            (bool upkeepNeeded,) = baseAuction.checkUpkeep("");
            t(upkeepNeeded, "AC-BA-10: fondos disponibles pero checkUpkeep=false");
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 70
  notes: >
    Riesgo de disponibilidad, no de fondos. El fallback oracle (usdDataFeed) mitiga
    parcialmente. El emergencyWithdraw del admin es la última línea de defensa.
    Clasificar como Low/Informational.

# ─────────────────────────────────────────────────────────────
# AC-BA-11: Cross-component — WorkflowRouter puede llamar performUpkeep en auction
# con performData forjado si el selector está allowlistado
# TIER 1: FORWARDER_ROLE → onReport() → performUpkeep(forgedData)
# ─────────────────────────────────────────────────────────────
- id: AC-BA-11
  tier: 1
  type: property
  description: >
    Si el admin configura WorkflowRouter con:
      target = baseAuction, selector = performUpkeep.selector
    Entonces cualquier holder de FORWARDER_ROLE puede llamar performUpkeep() con
    performData arbitrario, sin tener AUCTION_WORKER_ROLE.
    El FORWARDER_ROLE está destinado a Chainlink automation nodes (menor privilegio).
    AUCTION_WORKER_ROLE está destinado al auction manager (privilegio específico).
    Si ambos roles son asignados a distintas entidades pero el WorkflowRouter
    permite escalar FORWARDER → efectivo AUCTION_WORKER, hay escalación de privilegios.
  attack_scenario: >
    1. Admin correctamente configura WorkflowRouter con performUpkeep como selector
       (caso de uso legítimo: Chainlink DON workflow trigerea las subastas)
    2. Atacante compromete un FORWARDER_ROLE node (automation node)
    3. Llama WorkflowRouter.onReport(metadata={workflowId: X}, report=abi.encode(
         baseAuction, abi.encodeWithSelector(performUpkeep.selector, forgedPerformData)
       ))
    4. WorkflowRouter._call(baseAuction, performUpkeep(forgedData)) ejecuta
    5. BaseAuction.performUpkeep() se ejecuta con performData forjado
    6. Se pueden iniciar subastas con amounts inflados o cerrar subastas prematuramente
  solidity: |
    // Este invariante es idéntico en concepto a AC-BA-03 pero específico para performUpkeep
    // Verificar que WorkflowRouter NO tiene performUpkeep.selector allowlistado para el auction
    // a menos que sea el caso de uso intencional Y esté documentado
    bytes32[] memory workflowIds = workflowRouter.getAllowlistedWorkflowIds();
    for (uint256 i = 0; i < workflowIds.length; i++) {
        bytes4[] memory selectors = workflowRouter.getAllowlistedSelectors(workflowIds[i], address(baseAuction));
        for (uint256 j = 0; j < selectors.length; j++) {
            // performUpkeep puede ser legítimo en WorkflowRouter — solo documentarlo
            if (selectors[j] == IBaseAuction.performUpkeep.selector) {
                // Verificar que la forged data aún así falla validaciones internas
                // El invariante es que incluso con performData forjado, la lógica
                // interna de performUpkeep debe proteger contra estados inválidos
                t(true, "AC-BA-11: performUpkeep accessible via FORWARDER_ROLE — verificar intencional");
            }
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    Este es el caso de uso DISEÑADO del WorkflowRouter — triggear subastas via DON.
    La pregunta es si performUpkeep() tiene suficientes validaciones internas para
    resistir performData forjado. Ya hay protecciones (LiveAuction check, AssetParamsNotSet,
    AmountBelowMinAuctionSize, validación del precio). Pero el amount en performData
    determina cuántos tokens se toman del FeeAggregator. Investigar FeeAggregator.transferForSwap().

# ─────────────────────────────────────────────────────────────
# AC-BA-12: invalidateOrders — ORDER_MANAGER_ROLE puede invalidar órdenes legítimas activas
# TIER 2: grief de bidders legítimos en CowSwap
# ─────────────────────────────────────────────────────────────
- id: AC-BA-12
  tier: 2
  type: property
  description: >
    GPV2CompatibleAuction.invalidateOrders() permite al ORDER_MANAGER_ROLE invalidar
    orderUids en el GPv2Settlement. Si un bidder legítimo ha colocado una orden
    buena en CowSwap, el ORDER_MANAGER_ROLE puede invalidarla antes de que se ejecute.
    Esto es una funcionalidad administrativa legítima, pero puede usarse para:
    1. Bloquear órdenes competitivas mientras el mismo actor coloca otra orden más barata
    2. Invalidar todas las órdenes cuando el precio baja al final de la subasta,
       reiniciando la subasta para volver a vender al precio inicial (premium)
  attack_scenario: >
    1. Subasta iniciada para tokenX con precio inicial 1.1x
    2. Bidder coloca orden en CowSwap a 1.05x (buena oferta)
    3. ORDER_MANAGER_ROLE (comprometido) invalida la orden del bidder
    4. La subasta continúa a un precio más bajo
    5. El actor comprometido coloca orden a 0.99x (precio final de la subasta) y la ejecuta
    6. El protocolo recibe menos assetOut del que debería
    Impacto: el protocolo pierde el delta entre 1.05x y 0.99x en assetOut.
  solidity: |
    // Invariante: la cantidad de assetOut recibida en cualquier subasta debe ser
    // >= el mínimo calculado por _getAssetOutAmount() al momento de la ejecución
    // (las invalidaciones no deben resultar en menos assetOut que el precio mínimo)
    // Esta invariante se verifica en isValidSignature → minBuyAmount check
    // El problema es si la orden se invalida y se reemplaza por una a precio menor
    t(true, "AC-BA-12: ORDER_MANAGER_ROLE puede invalidar ordenes — riesgo de grief");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 55
  notes: >
    Rol administrativo con funcionalidad de emergencia legítima (e.g., invalidar órdenes
    stale o incorrectas). El riesgo de abuso existe pero requiere comprometer el rol.
    Clasificar como Low/Informational. La solución de diseño sería un timelock o
    una razón explícita requerida para la invalidación.

false_positives:
- hunter: AccessHunter
  id: AC-BA-FP-01
  reason: >
    bid() sin restricción de rol ES intencional — es un mercado abierto. Cualquiera
    puede pujar. El diseño requiere que el bidder tenga los fondos assetOut para pagar.
    No es un bug de acceso sino el modelo de negocio del protocolo.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/staking.md
    content: >
      En protocolos de dutch auction abiertos, bid() SIN restricción de rol es by design.
      El control de acceso ocurre económicamente (el bidder debe pagar el precio correcto),
      no a nivel de rol. No reportar como missing access control.
    briefing_update_applied: false

- hunter: AccessHunter
  id: AC-BA-FP-02
  reason: >
    isValidSignature() sin restricción de caller es REQUERIDO por EIP-1271. El GPv2Settlement
    necesita poder llamarla como parte del proceso de verificación de órdenes. Restringirla
    rompería la integración con CowSwap.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: knowledge/lending.md
    content: >
      EIP-1271 isValidSignature() SIEMPRE debe ser external sin restricción de caller.
      El settlement contract (CowSwap, 0x, etc.) la llama durante la verificación.
      Añadir onlyRole rompe la integración. No es un bug de acceso.
    briefing_update_applied: false

