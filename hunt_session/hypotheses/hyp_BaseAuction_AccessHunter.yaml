# - AuctionBidder.bid(): AUCTION_BIDDER_ROLE → _multiCall sin restricción
# - isValidSignature(): ABIERTO (correcto por EIP-1271)
# - Config functions: ASSET_ADMIN_ROLE o DEFAULT_ADMIN_ROLE
