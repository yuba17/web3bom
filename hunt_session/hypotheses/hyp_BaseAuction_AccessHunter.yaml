# ─────────────────────────────────────────────────────────────
#
# HALLAZGOS CRÍTICOS PARA INVESTIGAR (requires deeper analysis):
#
# 1. AC-BA-02 (CRITICAL candidate): performUpkeep acepta amounts arbitrarios
#    → Depende de FeeAggregator.transferForSwap() implementation
#    → Si no cappea por balance real, AUCTION_WORKER_ROLE puede drenar FeeAggregator
#
# 2. AC-BA-08 (HIGH): AuctionBidder._multiCall sin whitelist de targets
