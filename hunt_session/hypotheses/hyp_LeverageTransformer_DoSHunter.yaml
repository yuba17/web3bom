  - id: LT-DOS-03
    title: "External router downtime blocks leverageUp/Down for all users"
    tier: 2
    type: property
    confidence: 25
    description: >
      Both leverageUp and leverageDown depend on _routerSwap which calls either
      universalRouter or zeroxAllowanceHolder. If both external routers are down,
      paused, or upgraded to reject calls, any leverageUp/Down that requires a swap
      will revert. This is a protocol-level dependency DoS. However:
      (1) universalRouter and zeroxAllowanceHolder are immutable in the constructor —
      if they become unusable, LeverageTransformer must be redeployed.
      (2) Users can still call with amountIn0=0 and amountIn1=0 to skip swaps entirely
      (useful for leverageDown to just remove liquidity and repay without swapping).
      (3) This affects ALL users equally — it's not an attacker-triggered DoS.
      Known design tradeoff of depending on external routers.
    affected_line: "Swapper.sol:77-124, constructor"
    attack_scenario: >
      1. Universal Router is paused or upgraded (governance action)
      2. 0x AllowanceHolder is also unavailable
      3. All leverageUp/Down calls that require swaps revert
      4. Users cannot leverage/deleverage positions that need token conversion
      5. Positions may become liquidatable if they can't deleverage
      6. Mitigation: users can deleverage without swap if asset == token0 or token1
      VERDICT: external dependency risk, known design tradeoff. Not a vulnerability
      in LeverageTransformer itself.
    status: hypothesis
    solidity: |
      // INV-LT-DOS-03: leverageDown works without swap when asset matches position token
      function check_LT_DOS_03_deleverageWithoutSwap() public {
          // Setup: vault.asset == token0
