  - id: LT-DOS-01
    title: "leverageUp revert if vault asset is neither token0 nor token1 and no swap configured"
    tier: 2
    type: property
    confidence: 40
    description: >
      In leverageUp, line 56-57: amount0 = (token == token0) ? amount : 0, and
      amount1 = (token == token1) ? amount : 0. If the vault's lend asset is
      NEITHER token0 nor token1 of the Uniswap position, both amount0 and amount1
      start at 0. If the user does not configure swaps (amountIn0 == 0 and
      amountIn1 == 0), the function proceeds to increaseLiquidity with (0, 0) which
      will revert in the NPM (cannot add zero liquidity). The borrowed tokens
      (amount > 0) sit in the contract and are sent to recipient on line 103-105.
      This is not a DoS against others — the user simply misconfigured their params.
      However: if a legitimate use case exists where token != token0 && token != token1
      (e.g., a three-token leverage strategy), the user MUST configure at least one swap
      or the tx reverts. The borrow already happened at this point (line 52), but since
      the entire tx reverts, the borrow is also reverted. No funds at risk, just a
      confusing UX where the user must always swap if asset != position tokens.
    affected_line: "LeverageTransformer.sol:56-57, 84-91"
    attack_scenario: >
      1. Vault asset is WETH, position is USDC/DAI
      2. User calls leverageUp with borrowAmount=1000, amountIn0=0, amountIn1=0
      3. amount0=0, amount1=0, borrow succeeds, increaseLiquidity(0,0) reverts
      4. Entire tx reverts including the borrow — no funds lost
      5. Not a DoS against others, just user error
      VERDICT: informational at best, not exploitable.
    status: hypothesis
    solidity: |
      // INV-LT-DOS-01: leverageUp reverts cleanly when asset != token0 && asset != token1
      // and no swaps are configured
      function check_LT_DOS_01_noSwapRevert() public {
          // Setup: vault.asset != token0 && vault.asset != token1
          // Call leverageUp with amountIn0=0, amountIn1=0
          // Expect: revert (full tx rollback, no partial state)
      }

  - id: LT-DOS-02
    title: "leverageDown with liquidity=0 and feeAmount0/1=0 — collect returns 0, swaps skip, repay(0)"
    tier: 2
    type: property
    confidence: 30
    description: >
      In leverageDown, if params.liquidity == 0, decreaseLiquidity is skipped (line 142).
      amount0 and amount1 remain 0. Then collect is called with
      SafeCast.toUint128(0 + params.feeAmount0). If feeAmount0 and feeAmount1 are also 0,
      collect returns (0, 0). No swaps execute (amountIn0/1 would need to be 0 to avoid
      underflow). repay(tokenId, 0, false) is called — this may succeed as a no-op or
      revert depending on vault implementation. If it succeeds, no debt is repaid,
      and the function completes as a no-op. This wastes gas but does not affect
      other users. Not a meaningful DoS vector.
    affected_line: "LeverageTransformer.sol:142-156"
    attack_scenario: >
      1. User calls leverageDown with liquidity=0, feeAmount0=0, feeAmount1=0
      2. No liquidity removed, no fees collected, no swap, repay(0)
      3. Transaction succeeds as expensive no-op
      4. No impact on other users or protocol state
      VERDICT: gas waste only, user's own cost.
    status: hypothesis
    solidity: |
      // INV-LT-DOS-02: leverageDown with all-zero params is a no-op, not a DoS
      function check_LT_DOS_02_zeroParamsNoOp() public {
