# [VO-M-04] Chainlink price calculation — division order precision loss
#   Líneas 356-363
#   Caso: referenceTokenDecimals == feedConfig.tokenDecimals (línea 362):
#     chainlinkPriceX96 = chainlinkPriceX96 * Q96 / chainlinkReferencePriceX96
