#   Si answer es pequeño (e.g., 1 for a very cheap token) y feedDecimals=8:
#     _getChainlinkPriceX96 retorna: 1 * Q96 / 1e8 = 2^96 / 1e8 ≈ 7.9e28 / 1e8 = 7.9e20
#   Luego: 7.9e20 * Q96 = 7.9e20 * 7.9e28 ≈ 6.2e49 → dentro de uint256 antes de dividir.
#   La multiplicación (chainlinkPriceX96 * Q96) puede overflow si chainlinkPriceX96 > 2^160.
#   chainlinkPriceX96 = answer * Q96 / 10^feedDecimals
#   Para overflow en línea 362: answer * Q96 / 10^feedDecimals > 2^160
#   → answer > 2^160 * 10^feedDecimals / Q96 = 2^64 * 10^feedDecimals
#   Con feedDecimals=8: answer > 2^64 * 1e8 ≈ 1.8e27 — imposible para Chainlink prices.
#   NO hay overflow en práctica.
#
#   Caso: referenceTokenDecimals > feedConfig.tokenDecimals (línea 356):
#     chainlinkPriceX96 = (10^diff) * chainlinkPriceX96 * Q96 / chainlinkReferencePriceX96
#   (10^diff) puede ser large (hasta diff=18: 10^18)
#   chainlinkPriceX96 ≈ 7.9e20 (de arriba)
#   10^18 * 7.9e20 * Q96 ≈ 10^18 * 7.9e20 * 7.9e28 ≈ 4.9e67 — overflow potencial en uint256!
#   uint256 max ≈ 1.1e77, así que 4.9e67 está dentro. Safe para diff<=18.
#   Para diff=20 (teórico): 10^20 * 7.9e20 * 7.9e28 ≈ 4.9e69 — aún dentro de uint256.
#   La expresión completa (10^diff * chainlinkPriceX96 * Q96) requiere diff ≈ 38+ para overflow.
#   En práctica, decimals diff <= 18. No hay overflow.
