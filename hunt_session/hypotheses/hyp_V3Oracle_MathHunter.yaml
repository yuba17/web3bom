#   Línea 532
#   derivedPoolPriceX96 = mulDiv(price0X96, Q96, price1X96)
#   Si price0X96 >> price1X96 (token0 much more valuable), derivedPoolPriceX96 → large.
#   Math.sqrt(derivedPoolPriceX96) está en [0, 2^128] approximately
#   Multiplicar * 2^48 puede dar hasta 2^176 — dentro de uint256
#   SafeCast.toUint160 reverts si valor > 2^160-1.
#   ATAQUE: Si price0X96 / price1X96 ratio > (2^160 / 2^48)^2 / Q96 ≈ 2^224 / Q96 = 2^128
#   es decir: price0X96 > price1X96 * 2^128 — ratio de 2^128 entre precios
#   Esto ocurre con tokens de EXTREMA diferencia de valor (e.g., 1 BTC vs 1 dust token).
#   Si SafeCast reverts → getValue() reverts → posición NO LIQUIDABLE.
#   IMPACTO: DoS en liquidaciones para posiciones con tokens de precio extremo.
#   Pero: oráculos deben estar configurados, owner controla qué tokens entran.
#   Probabilidad real: BAJA, pero el revert en liquidación es crítico si ocurre.
#   TIER 2 — el owner puede configurar tokens extremos; el revert DoS-ea liquidaciones.
#
# [VO-M-03] _requireMaxDifference: overflow en (priceX96 - verifyPriceX96) * 10000
#   Línea 167
#   differenceX10000 = |priceX96 - verifyPriceX96| * 10000
#   priceX96 puede ser hasta ~2^200 (para tokens de alta diferencia de precio)
#   * 10000 = * ~2^13 → potencialmente ~2^213 — dentro de uint256 (max 2^256-1)
#   No hay overflow en práctica para valores de precio reales.
#   Pero hay otro bug: si verifyPriceX96 == 0, la condición short-circuits a revert.
#   Si verifyPriceX96 > 0 pero MUY PEQUEÑO (1 wei), differenceX10000/verifyPriceX96
#   podría ser artificialmente large, forzando revert aunque las diferencias son pequeñas
