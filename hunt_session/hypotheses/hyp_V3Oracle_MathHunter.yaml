#   Si denominator > 2^255: r1+r2 puede overflow. Pero priceTokenX96 es un precio
#   en Q96 format, tipicamente < 2^200. Para que desborde need denominator > 2^255.
#   Conclusión: teóricamente posible si priceTokenX96 es un valor astronomico (~2^255),
