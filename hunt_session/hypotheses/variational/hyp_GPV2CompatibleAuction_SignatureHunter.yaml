hypotheses:

  - id: GPVCA-SIG-01
    title: "WILD-10: isValidSignature missing minBidUsdValue check"
    description: |
      isValidSignature validates token pair, receiver, amounts, and auction state, but does NOT check if the order meets the minBidUsdValue threshold. This means CowSwap orders below the minimum bid size can be validated and settled, bypassing the minimum bid protection that exists in bid().
    confidence: 80
    severity: low
    status: needs_review
    attack_scenario: |
      1. Auction has minBidUsdValue = $100. 2. Solver crafts a CowSwap order for $0.01 worth of tokens. 3. isValidSignature validates the order (no minBid check). 4. Settlement fills the tiny order. 5. Many tiny fills could cause excessive gas consumption and unfavorable fills for the protocol.
    solidity: |
      // Invariant: CowSwap orders should respect minBidUsdValue
      function property_GPVCA_SIG_01() public view returns (bool) {
      // MISSING: isValidSignature does not check minBidUsdValue
      // This allows sub-minimum orders through CowSwap path
      return false; // Potential finding
      }

  - id: GPVCA-SIG-02
    title: "ERC-1271 magic value returned correctly"
    description: |
      isValidSignature returns the correct ERC-1271 magic value (0x1626ba7e) when validation passes. Incorrect magic values would cause CowSwap settlement to reject the order. The magic value is a constant, not computed.
    confidence: 98
    severity: informational
    status: safe
    attack_scenario: |
      N/A — magic value is a compile-time constant matching ERC-1271 spec.
    solidity: |
      // Invariant: ERC-1271 magic value is correct
      function property_GPVCA_SIG_02() public view returns (bool) {
      // Returns 0x1626ba7e on valid signature
      return true;
      }

  - id: GPVCA-SIG-03
    title: "No replay protection needed — CowSwap handles nonces"
    description: |
      isValidSignature is stateless — it validates based on current auction state. Replay protection is handled by CowSwap's settlement contract (order UIDs, nonces). The auction contract doesn't need its own replay protection.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Attacker tries to replay a previously valid order. CowSwap settlement tracks filled orders and prevents double-fill. The auction contract doesn't need to track this.
    solidity: |
      // Invariant: replay protection delegated to CowSwap
      function property_GPVCA_SIG_03() public view returns (bool) {
      // CowSwap settlement handles order uniqueness
      return true;
      }

