    severity: informational
    status: safe
    attack_scenario: |
      Data Streams price becomes stale at exactly the moment of a bid. The bid's price read checks staleness, finds it stale, reads Chainlink, gets fresh price. Bid executes with Chainlink price. No stale price window.
    solidity: |
