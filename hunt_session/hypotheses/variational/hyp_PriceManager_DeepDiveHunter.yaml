    severity: informational
    status: safe
    attack_scenario: |
      Compromised PRICE_ADMIN sets price to $0. But Chainlink fallback still works. Auctions use Chainlink price (Data Streams detected as anomalous by staleness). Compromised ASSET_ADMIN removes Chainlink feed — but cannot push prices. Both needed for full exploitation.
