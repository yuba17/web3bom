hypotheses:

  - id: AB-AC-01
    title: "bid() requires AUCTION_BIDDER_ROLE"
    description: |
      The bid() function in AuctionBidder is gated by AUCTION_BIDDER_ROLE. Only authorized bidder addresses (typically automated systems) can initiate bids through this contract.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Unauthorized address calls bid(). Reverts due to missing AUCTION_BIDDER_ROLE. No unauthorized bidding possible.
    solidity: |
      // Invariant: bid() requires AUCTION_BIDDER_ROLE
      function property_AB_AC_01() public view returns (bool) {
      // onlyRole(AUCTION_BIDDER_ROLE) on bid()
      return true;
      }

  - id: AB-AC-02
    title: "Callback validates caller is the auction contract and from is self"
    description: |
      The flash-swap callback in AuctionBidder validates that msg.sender is the expected auction contract and that the 'from' parameter matches address(this). This prevents unauthorized contracts from triggering the callback.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Malicious contract calls the callback directly. Validation fails because msg.sender is not the registered auction. Callback reverts.
    solidity: |
      // Invariant: callback validates caller identity
      function property_AB_AC_02() public view returns (bool) {
      // msg.sender == auction && from == address(this)
      return true;
      }

