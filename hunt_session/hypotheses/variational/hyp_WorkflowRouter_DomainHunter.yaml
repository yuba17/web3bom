hypotheses:

  - id: WR-D-01
    title: "3-level allowlist check: workflowId → target → selector"
    description: |
      onReport() performs three nested checks: 1) Is workflowId allowlisted? 2) Is the target address allowlisted for this workflowId? 3) Is the function selector allowlisted for this target? All three must pass for execution.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Forwarder sends a report with allowlisted workflowId but non-allowlisted target or selector. Check fails at the appropriate level with a specific error. No bypass possible — all three levels are checked in sequence.
    solidity: |
      // Invariant: all 3 allowlist levels must pass
      function property_WR_D_01() public view returns (bool) {
      // workflowId + target + selector all checked
      return true;
      }

  - id: WR-D-02
    title: "Selector extraction from calldata via assembly is correct"
    description: |
      The assembly block extracts the first 4 bytes of the call data as the function selector. Using mload(add(data, 32)) reads the first 32 bytes of the data content (after length prefix), and bytes4 truncation takes the first 4 bytes. This correctly extracts the selector.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Forwarder crafts data with misleading selector. Assembly extraction always takes bytes[0:4] of the data payload, which IS the function selector. No way to cause a different 4 bytes to be extracted.
    solidity: |
      // Invariant: selector extraction matches first 4 bytes of data
      function property_WR_D_02() public view returns (bool) {
      // mload(add(data, 32)) >> 224 == bytes4(data)
      return true;
      }

summary:
