    title: "Target revert does not block future workflow execution"
    description: |
      If a target call reverts, the revert is propagated to the caller (forwarder). But WorkflowRouter's state is not corrupted — no storage changes occur on revert. Future calls to different (or the same) targets work normally.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Target contract always reverts. Forwarder's transaction fails. Next forwarder call to a different target succeeds. No cascading failure.
    solidity: |
