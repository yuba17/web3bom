hypotheses:

  - id: PM-TB-01
    title: "PRICE_ADMIN is fully trusted — can set any price"
    description: |
      PRICE_ADMIN can call transmit() with any price value. There are no sanity checks on the price itself (e.g., no max deviation from previous price). The trust assumption is that PRICE_ADMIN is the Chainlink DON, which provides its own data quality guarantees.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Compromised PRICE_ADMIN submits price of $0 or $999999999. The auction would use this price. However, PRICE_ADMIN compromise is outside the threat model — it represents Chainlink infrastructure.
    solidity: |
      // Invariant: PRICE_ADMIN can set arbitrary prices (trusted)
      function property_PM_TB_01() public view returns (bool) {
      // No price sanity checks — trust delegated to Chainlink DON
      return true;
      }

  - id: PM-TB-02
    title: "No price deviation circuit breaker"
    description: |
      PriceManager does not implement a circuit breaker for large price deviations (e.g., > 50% change from previous price). This is by design — the Chainlink DON handles data quality. Adding a circuit breaker here would risk blocking legitimate large price moves.
    confidence: 85
    severity: informational
    status: safe
    attack_scenario: |
      Price spikes 80% between two transmit() calls. No circuit breaker triggers. Auction uses the new price. This is correct behavior — the protocol trusts Chainlink's data quality.
    solidity: |
      // Invariant: no deviation circuit breaker (by design)
      function property_PM_TB_02() public view returns (bool) {
      // Price changes accepted without deviation limits
      return true;
      }

summary:
  total_hypotheses: 2
  safe:
    - PM-TB-01 — PRICE_ADMIN is fully trusted — can set any price
    - PM-TB-02 — No price deviation circuit breaker
