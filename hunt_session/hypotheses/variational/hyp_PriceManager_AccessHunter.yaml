# AccessHunter Analysis — PriceManager.sol
# Contract: src/PriceManager.sol
# Focus: access control, role checks, permissioned functions, privilege escalation
# Analyst: AccessHunter
# Date: 2026-03-26

hypotheses:

  - id: PM-AC-01
    title: "transmit() requires PRICE_ADMIN role"
    description: |
      transmit() is gated by onlyRole(PRICE_ADMIN). This role is used by Chainlink DON infrastructure to push Data Streams prices. Without this role, no external party can set prices.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Attacker calls transmit() without PRICE_ADMIN. Reverts immediately. No price manipulation possible from unauthorized callers.
    solidity: |
      // Invariant: transmit requires PRICE_ADMIN
      function property_PM_AC_01() public view returns (bool) {
      // onlyRole(PRICE_ADMIN) on transmit()
      return true;
      }

  - id: PM-AC-02
    title: "Feed configuration requires ASSET_ADMIN role"
    description: |
      Adding, updating, or removing price feeds requires ASSET_ADMIN role. This separates feed configuration (ASSET_ADMIN) from price updates (PRICE_ADMIN), providing defense in depth.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Attacker tries to add a malicious price feed. Without ASSET_ADMIN, the call reverts. Even a compromised PRICE_ADMIN cannot add new feeds.
    solidity: |
      // Invariant: feed config requires ASSET_ADMIN
      function property_PM_AC_02() public view returns (bool) {
      // onlyRole(ASSET_ADMIN) on feed management functions
      return true;
      }

  - id: PM-AC-03
    title: "Role separation between PRICE_ADMIN and ASSET_ADMIN is correct"
    description: |
      PRICE_ADMIN can only push prices. ASSET_ADMIN can only configure feeds. Neither can perform the other's actions. DEFAULT_ADMIN_ROLE manages both. This two-role model provides good separation of concerns.
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      PRICE_ADMIN tries to add malicious feed — reverts. ASSET_ADMIN tries to push manipulated price — reverts. Both roles would need to be compromised for full price manipulation.
    solidity: |
      // Invariant: PRICE_ADMIN and ASSET_ADMIN are disjoint capabilities
      function property_PM_AC_03() public view returns (bool) {
      // transmit: PRICE_ADMIN only, feedConfig: ASSET_ADMIN only
      return true;
      }

summary:
  total_hypotheses: 3
  safe:
    - PM-AC-01 — transmit() requires PRICE_ADMIN role
    - PM-AC-02 — Feed configuration requires ASSET_ADMIN role
    - PM-AC-03 — Role separation between PRICE_ADMIN and ASSET_ADMIN is correct
