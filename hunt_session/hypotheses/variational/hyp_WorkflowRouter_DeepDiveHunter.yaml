  - id: WR-DD-05
    title: "Deep dive: gas limit on forwarded calls could cause silent failures"
    description: |
      The forwarded call to the target uses the remaining gas (no explicit gas limit). If the transaction has insufficient gas, the target call may fail but the revert is propagated. No silent failure — the entire onReport() call reverts.
    confidence: 88
    severity: informational
    status: safe
    attack_scenario: |
      Forwarder submits transaction with low gas. Target call runs out of gas. Entire transaction reverts. Forwarder must retry with more gas. No partial execution.
    solidity: |
      // Invariant: no silent call failure — reverts propagate
      function property_WR_DD_05() public view returns (bool) {
      // Low gas => full revert, not silent failure
      return true;
      }

