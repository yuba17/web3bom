hypotheses:

  - id: AB-FL-01
    title: "Token flow: assetOut received → swapped → assetIn returned"
    description: |
      Token flow in callback: 1) assetOut arrives (from auction.bid transfer). 2) _multiCall swaps assetOut → assetIn on DEXes. 3) assetIn remains in AuctionBidder. 4) BaseAuction's post-callback balance check verifies assetIn received. Clean flow with no residual tokens.
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      Tokens get stuck in AuctionBidder between transactions. Analysis: the flash-swap is atomic. If swap succeeds, assetIn is used for repayment. If fails, everything reverts. No residual tokens.
    solidity: |
      // Invariant: no residual tokens in AuctionBidder after bid
      function property_AB_FL_01() public view returns (bool) {
      // Atomic flow — no tokens held between transactions
      return true;
      }

  - id: AB-FL-02
    title: "Approval for _multiCall DEX calls managed correctly"
    description: |
      AuctionBidder must approve DEX routers to spend assetOut before swapping. This approval is part of the _multiCall sequence. If approval is too broad, it persists after the transaction. However, AuctionBidder is not meant to hold tokens, so stale approvals have no impact.
    confidence: 85
    severity: informational
    status: safe
    attack_scenario: |
      Stale approval remains after bid. DEX router could pull tokens if AuctionBidder held any. But AuctionBidder balance is 0 after successful bid. Stale approval on empty balance has no impact.
    solidity: |
      // Invariant: stale approvals are harmless (zero balance)
      function property_AB_FL_02() public view returns (bool) {
      // AuctionBidder holds no tokens between transactions
      return true;
      }

summary:
  total_hypotheses: 2
  safe:
    - AB-FL-01 — Token flow: assetOut received → swapped → assetIn returned
    - AB-FL-02 — Approval for _multiCall DEX calls managed correctly
