# FlowHunter Analysis — BaseAuction.sol
# Contract: src/BaseAuction.sol
# Focus: token flows, fund transfers, approval patterns, reentrancy, callback safety
# Analyst: FlowHunter
# Date: 2026-03-26

hypotheses:

  - id: BA-FL-01
    title: "bid() transfers assetOut before callback — flash-swap pattern"
    description: |
      bid() sends assetOut tokens to the bidder BEFORE the callback. The bidder receives tokens, can use them (e.g., DEX swap), and then must provide assetIn in the callback. This is the intended flash-swap pattern, similar to Uniswap V2/V3.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Bidder receives assetOut, callback fails to return assetIn. The bid() function checks assetIn balance after callback and reverts the entire transaction if insufficient. Atomic — no partial state.
    solidity: |
      // Invariant: after bid(), contract received >= expected assetIn
      function property_BA_FL_01() public view returns (bool) {
      // balance check after callback ensures atomicity
      return true;
      }

  - id: BA-FL-02
    title: "BA-SWEEP-01: _onAuctionEnd sweeps ALL assetOut balance, not just auction remainder"
    description: |
      _onAuctionEnd transfers the entire assetOut balance of the contract, not just the amount allocated to the current auction. If multiple auctions deposit assetOut tokens, or if tokens are sent directly, _onAuctionEnd sweeps everything to the configured receiver.
    confidence: 85
    severity: low
    status: needs_review
    attack_scenario: |
      1. Auction A ends with 50 tokens remaining unsold. 2. Before sweep, someone sends 10 tokens directly to contract. 3. _onAuctionEnd sweeps all 60 tokens. The extra 10 go to the auction receiver, not the sender. In practice, the receiver is the protocol treasury so this is by design, but worth documenting.
    solidity: |
      // Invariant: _onAuctionEnd sweeps total balance (by design)
      function property_BA_FL_02() public view returns (bool) {
      // After _onAuctionEnd: assetOut.balanceOf(address(this)) == 0
      return true;
      }

  - id: BA-FL-03
    title: "No reentrancy in bid() due to balance check after external call"
    description: |
      bid() makes an external callback to the bidder, but checks assetIn balance after the callback returns. A reentrant call to bid() would require providing assetIn for BOTH bids, which is economically unprofitable. The check-effects-interactions pattern is not strictly followed, but the balance check provides equivalent protection.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Bidder reenters bid() during callback. Second bid also requires assetIn payment. Both balance checks must pass independently. No economic advantage from reentrancy.
    solidity: |
      // Invariant: reentrancy in bid() provides no advantage
      function property_BA_FL_03() public view returns (bool) {
      // Each bid independently checks assetIn balance
      return true;
      }

summary:
  total_hypotheses: 3
  findings:
    - BA-FL-02 (Low) — BA-SWEEP-01: _onAuctionEnd sweeps ALL assetOut balance, not just auction remainder
  safe:
    - BA-FL-01 — bid() transfers assetOut before callback — flash-swap pattern
    - BA-FL-03 — No reentrancy in bid() due to balance check after external call
