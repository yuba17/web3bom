hypotheses:

  - id: GPVCA-AC-01
    title: "isValidSignature is public — by design for CowSwap ERC-1271"
    description: |
      isValidSignature() has no access control modifier. This is correct — CowSwap's settlement contract calls this function to validate orders. Adding access control would break CowSwap integration.
    confidence: 97
    severity: informational
    status: safe
    attack_scenario: |
      Anyone can call isValidSignature. But the function only validates — it doesn't change state. A valid signature means the order matches the auction parameters. No state change occurs from the call itself.
    solidity: |
      // Invariant: isValidSignature is view-only, no state change
      function property_GPVCA_AC_01() public view returns (bool) {
      // isValidSignature is read-only ERC-1271 compliance
      return true;
      }

  - id: GPVCA-AC-02
    title: "Inherited roles from BaseAuction are sufficient"
    description: |
      GPV2CompatibleAuction doesn't add new roles beyond BaseAuction's. AUCTION_WORKER, DEFAULT_ADMIN_ROLE are inherited. The CowSwap-specific functions (_onAuctionStart, _onAuctionEnd) are internal, called only by the parent's lifecycle.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      External caller tries to invoke _onAuctionStart or _onAuctionEnd directly. These are internal functions — not callable externally. Only the parent BaseAuction lifecycle invokes them.
    solidity: |
      // Invariant: internal lifecycle functions not externally callable
      function property_GPVCA_AC_02() public view returns (bool) {
      // _onAuctionStart and _onAuctionEnd are internal
      return true;
      }

