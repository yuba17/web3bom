hypotheses:

  - id: BA-W-01
    title: "BA-SWEEP-01: Cross-auction assetOut sweep in _onAuctionEnd"
    description: |
      _onAuctionEnd uses balanceOf(address(this)) to determine sweep amount, not the auction's remaining assetOut. If tokens from a different source accumulate in the contract, they get swept along with the auction remainder. This is the primary wildcard finding for BaseAuction.
    confidence: 85
    severity: low
    status: needs_review
    attack_scenario: |
      1. Auction A starts with 100 tokenX. 2. External party accidentally sends 50 tokenX to the contract. 3. Auction A ends. 4. _onAuctionEnd sweeps 150 tokenX (100 remaining + 50 accidental) to the receiver. The extra 50 is captured by the protocol. Low severity because receiver is protocol treasury and accidental sends are user error.
    solidity: |
      // Invariant: _onAuctionEnd sweeps balanceOf, not tracked amount
      function property_BA_W_01() public view returns (bool) {
      // sweepAmount == assetOut.balanceOf(address(this)), not auctionRemaining
      return true; // By design, but documents the behavior
      }

  - id: BA-W-02
    title: "Fee-on-transfer tokens could cause assetIn balance check to fail"
    description: |
      If assetIn is a fee-on-transfer token, the actual received amount after transferFrom is less than the expected amount. The post-callback balance check compares against expected (pre-fee) amount, causing all bids to revert.
    confidence: 75
    severity: low
    status: safe
    attack_scenario: |
      Protocol configures a fee-on-transfer token as assetIn. Every bid fails because received < expected. Auction becomes unbiddable. However, this is a configuration error — the protocol controls which tokens are used.
    solidity: |
      // Invariant: fee-on-transfer tokens break balance check
      function property_BA_W_02() public view returns (bool) {
      // If token has transfer fee: receivedAmount < expectedAmount => revert
      return true; // Configuration responsibility
      }

  - id: BA-W-03
    title: "Rebasing tokens could cause accounting mismatches"
    description: |
      If assetOut is a rebasing token, the balance could change between auction start and bid execution, leading to more or fewer tokens being available than expected. The contract doesn't track rebasing.
    confidence: 70
    severity: low
    status: safe
    attack_scenario: |
      Protocol uses a positive-rebasing token as assetOut. Balance increases between bids. _onAuctionEnd sweeps more than originally deposited. Low impact — extra goes to protocol treasury.
    solidity: |
      // Invariant: rebasing tokens not explicitly supported
      function property_BA_W_03() public view returns (bool) {
      // No rebasing accounting — uses spot balance
      return true; // Token selection responsibility
      }

