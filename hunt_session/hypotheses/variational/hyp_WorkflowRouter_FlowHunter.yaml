hypotheses:

  - id: WR-FL-01
    title: "onReport() forwards calldata to target — delegatecall not used"
    description: |
      onReport() uses a regular call (not delegatecall) to the target address with the allowlisted calldata. This means the target executes in its own context, not in WorkflowRouter's context. No storage corruption risk from malicious targets.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Malicious target tries to modify WorkflowRouter's storage via delegatecall. Not possible — regular call is used. Target only modifies its own storage.
    solidity: |
      // Invariant: regular call, not delegatecall
      function property_WR_FL_01() public view returns (bool) {
      // target.call(data) — not delegatecall
      return true;
      }

  - id: WR-FL-02
    title: "No token flow in WorkflowRouter — pure routing"
    description: |
      WorkflowRouter does not transfer tokens. It only routes calldata to allowlisted targets. Any token flow happens in the target contract, not in the router.
    confidence: 98
    severity: informational
    status: safe
    attack_scenario: |
      N/A — WorkflowRouter has no token operations.
    solidity: |
      // Invariant: no token transfers in WorkflowRouter
      function property_WR_FL_02() public view returns (bool) {
      // Pure calldata routing — no token operations
      return true;
      }

