hypotheses:

  - id: BA-TB-01
    title: "AUCTION_WORKER can craft arbitrary performData"
    description: |
      AUCTION_WORKER calls performUpkeep(bytes performData) where performData encodes the action (start/end auction, parameters). The worker can craft any valid performData, controlling auction start prices, durations, and asset pairs. This is by design — the worker is a trusted Chainlink Automation node.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Malicious AUCTION_WORKER starts an auction with extremely favorable parameters (low start price). However, AUCTION_WORKER is a trusted role managed by the protocol. The trust assumption is documented and intentional.
    solidity: |
      // Invariant: AUCTION_WORKER is trusted to craft valid performData
      function property_BA_TB_01() public view returns (bool) {
      // Trust assumption: AUCTION_WORKER acts honestly
      return true;
      }

  - id: BA-TB-02
    title: "Bidder callback is untrusted — balance check provides safety"
    description: |
      The bid callback invokes arbitrary code on the bidder's contract. The bidder is untrusted, but the post-callback balance check ensures the protocol receives the expected assetIn regardless of what the callback does.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Malicious bidder callback tries to steal tokens or manipulate state. The balance check after callback ensures assetIn was received. If not, entire transaction reverts atomically.
    solidity: |
      // Invariant: untrusted callback cannot steal funds
      function property_BA_TB_02() public view returns (bool) {
      // Post-callback balance check: assetIn.balanceOf >= expected
      return true;
      }

  - id: BA-TB-03
    title: "External token transfers use SafeERC20"
    description: |
      All token transfers in BaseAuction use SafeERC20 (safeTransfer, safeTransferFrom), handling non-standard ERC20 tokens that don't return bool. This prevents silent transfer failures.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      A non-standard ERC20 token (no return value on transfer) is used as assetIn/assetOut. SafeERC20 handles this correctly, reverting if the transfer actually fails.
    solidity: |
      // Invariant: all transfers use SafeERC20
      function property_BA_TB_03() public view returns (bool) {
      // SafeERC20 prevents silent transfer failures
      return true;
      }

summary:
  total_hypotheses: 3
  safe:
