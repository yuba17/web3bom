hypotheses:

  - id: GPVCA-TB-01
    title: "Vault relayer address is immutable — cannot be changed post-deployment"
    description: |
      The CowSwap vault relayer address is set in the constructor and stored as immutable. No admin function can change it. This prevents a compromised admin from redirecting token approvals.
    confidence: 97
    severity: informational
    status: safe
    attack_scenario: |
      Admin tries to change vault relayer to a malicious address. No setter function exists — the address is immutable. Approval always goes to the legitimate CowSwap infrastructure.
    solidity: |
      // Invariant: vault relayer is immutable
      function property_GPVCA_TB_01() public view returns (bool) {
      // vaultRelayer set in constructor, cannot be changed
      return true;
      }

  - id: GPVCA-TB-02
    title: "Settlement contract address is immutable"
    description: |
      The CowSwap settlement contract address is also immutable, set at deployment. This is the contract that calls isValidSignature. While any address CAN call isValidSignature (it's public), only settlement can actually execute trades.
    confidence: 97
    severity: informational
    status: safe
    attack_scenario: |
      Attacker deploys fake settlement contract and calls isValidSignature. The function returns a valid signature hash, but only the real settlement can pull tokens via the vault relayer. No fund loss.
    solidity: |
      // Invariant: settlement address is immutable
      function property_GPVCA_TB_02() public view returns (bool) {
      // settlement set in constructor, cannot be changed
      return true;
      }

summary:
