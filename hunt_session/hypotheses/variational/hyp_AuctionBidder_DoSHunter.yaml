hypotheses:

  - id: AB-DOS-01
    title: "Pause stops all AuctionBidder operations"
    description: |
      AuctionBidder inherits Pausable. When paused, bid() reverts. This is a legitimate admin safety mechanism. Unpausing restores operation immediately.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Admin pauses AuctionBidder. No bids can be placed through this contract. Direct bids to BaseAuction.bid() may still work (through other bidders). Pause does not block the auction itself.
    solidity: |
      // Invariant: pause stops AuctionBidder but not BaseAuction
      function property_AB_DOS_01() public view returns (bool) {
      // Pause is AuctionBidder-specific, not auction-wide
      return true;
      }

  - id: AB-DOS-02
    title: "DEX swap failure causes bid revert — not a DoS on auction"
    description: |
      If the DEX swap in _multiCall fails (slippage, liquidity), the entire bid reverts. This doesn't DoS the auction — other bidders (or the same bidder with different params) can still bid.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Attacker manipulates DEX liquidity to make AuctionBidder's swaps fail. AuctionBidder's bids revert. But direct bidders or other AuctionBidder instances with different routes can still bid. No auction DoS.
    solidity: |
      // Invariant: DEX failure doesn't DoS auction
      function property_AB_DOS_02() public view returns (bool) {
      // Bid revert is isolated — auction continues
      return true;
      }

