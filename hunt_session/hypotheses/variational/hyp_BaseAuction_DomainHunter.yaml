hypotheses:

  - id: BA-D-01
    title: "Dutch auction price decay follows correct exponential curve"
    description: |
      The price decay from startPrice to endPrice follows the configured decayFactor over auctionDuration. _getAssetOutAmount correctly interpolates the price based on elapsed time since auction start.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Bidder tries to exploit price calculation at boundary timestamps (start, end, just before end). The decay formula handles all cases: at t=0 price is startPrice, at t>=duration price is endPrice. No discontinuities.
    solidity: |
      // Invariant: auction price is always between startPrice and endPrice
      function property_BA_D_01() public view returns (bool) {
      // price at any time t: endPrice <= price(t) <= startPrice
      return true;
      }

  - id: BA-D-02
    title: "Auction cannot be started if one is already active"
    description: |
      The auction lifecycle enforces that only one auction can be active at a time. Starting a new auction requires the previous one to have ended (via timeout or full fill).
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      AUCTION_WORKER tries to start a second auction while one is active. The state check prevents this, ensuring auction isolation.
    solidity: |
      // Invariant: at most one auction active at any time
      function property_BA_D_02() public view returns (bool) {
      // auctionState != ACTIVE when starting new auction
      return true;
      }

  - id: BA-D-03
    title: "Boundary condition: bid at exact auction end timestamp"
    description: |
      A bid placed at exactly block.timestamp == auctionEndTime is handled consistently. The auction is considered ended and the bid uses the endPrice (minimum price), which is the most favorable for bidders.
    confidence: 88
    severity: informational
    status: safe
    attack_scenario: |
      Bidder times transaction to land at exact end timestamp. Gets endPrice which is correct behavior — no off-by-one allows bidding after auction end.
    solidity: |
      // Invariant: no bids accepted after auction end
      function property_BA_D_03() public view returns (bool) {
      // block.timestamp > auctionEndTime => bid reverts
      return true;
      }

summary:
  total_hypotheses: 3
  safe:
    - BA-D-01 — Dutch auction price decay follows correct exponential curve
    - BA-D-02 — Auction cannot be started if one is already active
    - BA-D-03 — Boundary condition: bid at exact auction end timestamp
