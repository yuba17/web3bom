hypotheses:

  - id: PM-D-01
    title: "Staleness threshold correctly enforced on stored prices"
    description: |
      When reading a price, PriceManager checks (block.timestamp - price.timestamp) <= stalenessThreshold. If stale, it falls back to Chainlink aggregator. The threshold is per-feed configurable.
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      PRICE_ADMIN stops pushing prices. After stalenessThreshold, Data Streams price is considered stale. System falls back to Chainlink aggregator. No stale price used for auction.
    solidity: |
      // Invariant: stale Data Streams price triggers fallback
      function property_PM_D_01() public view returns (bool) {
      // block.timestamp - priceTimestamp > staleness => use Chainlink
      return true;
      }

  - id: PM-D-02
    title: "Price decimals are stored and used consistently"
    description: |
      Each feed stores its price decimals. When consuming prices, BaseAuction scales correctly between different decimal representations. No implicit assumption about 18 decimals.
    confidence: 88
    severity: informational
    status: safe
    attack_scenario: |
      New feed with unusual decimals (e.g., 8) is added. Price scaling uses stored decimals, not hardcoded 18. Calculation is correct regardless of decimal count.
    solidity: |
      // Invariant: price decimals tracked per feed
      function property_PM_D_02() public view returns (bool) {
      // feedConfig.decimals used in all price scaling
      return true;
      }

summary:
  total_hypotheses: 2
  safe:
    - PM-D-01 — Staleness threshold correctly enforced on stored prices
    - PM-D-02 — Price decimals are stored and used consistently
