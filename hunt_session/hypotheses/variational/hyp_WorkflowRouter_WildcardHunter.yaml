hypotheses:

  - id: WR-W-01
    title: "Zero selector blocked by allowlist add validation"
    description: |
      bytes4(0) cannot be added to the selector allowlist. The add function rejects zero selectors, preventing accidental or malicious allowlisting of the zero selector (which would match empty calldata).
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Admin tries to add bytes4(0) as an allowlisted selector. The add function reverts. Empty calldata cannot match any allowlisted selector.
    solidity: |
      // Invariant: bytes4(0) cannot be allowlisted
      function property_WR_W_01() public view returns (bool) {
      // Zero selector rejected at add time
      return true;
      }

  - id: WR-W-02
    title: "EnumerableSet ordering is non-deterministic but harmless"
    description: |
      The EnumerableSet used for workflows, targets, and selectors does not guarantee ordering. The getter functions (getAllowlistedWorkflowIds, etc.) return elements in arbitrary order. This is cosmetic — the allowlist check uses contains(), which is O(1) regardless of ordering.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      N/A — ordering is irrelevant for security. Only affects off-chain display.
    solidity: |
      // Invariant: EnumerableSet order is irrelevant for security
      function property_WR_W_02() public view returns (bool) {
      // contains() is O(1) — order doesn't matter
      return true;
      }

