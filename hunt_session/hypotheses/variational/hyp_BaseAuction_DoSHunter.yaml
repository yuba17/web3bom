hypotheses:

  - id: BA-DOS-01
    title: "Auction cannot be permanently blocked by failed bids"
    description: |
      If all bids fail (revert), the auction simply continues until timeout. checkUpkeep detects ended auctions and triggers cleanup via performUpkeep. No bid failure can permanently lock the auction system.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Attacker submits bids that always revert in callback. Other bidders are unaffected — each bid is independent. Auction ends by timeout and _onAuctionEnd sweeps remaining assets.
    solidity: |
      // Invariant: auction always terminable via timeout
      function property_BA_DOS_01() public view returns (bool) {
      // checkUpkeep returns true when block.timestamp > auctionEndTime
      return true;
      }

  - id: BA-DOS-02
    title: "checkUpkeep handles ended auctions without gas griefing"
    description: |
      checkUpkeep is a view function that checks auction state. It correctly identifies ended auctions and returns appropriate performData. No unbounded loops or expensive storage reads that could cause gas griefing.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Off-chain automation calls checkUpkeep repeatedly. Gas cost is bounded and predictable. No state-dependent gas amplification.
    solidity: |
      // Invariant: checkUpkeep gas is bounded
      function property_BA_DOS_02() public view returns (bool) {
      // No unbounded loops in checkUpkeep
      return true;
      }

  - id: BA-DOS-03
    title: "Pause mechanism stops all operations cleanly"
    description: |
      The pause mechanism (inherited from OpenZeppelin Pausable) stops bid() and performUpkeep(). When paused, no state changes occur. Unpausing resumes normal operation. No state corruption from pause/unpause cycles.
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      Admin pauses contract during active auction. Auction timer continues but no bids accepted. On unpause, if auction timed out, checkUpkeep triggers cleanup. No stuck state.
    solidity: |
      // Invariant: pause/unpause leaves no corrupted state
      function property_BA_DOS_03() public view returns (bool) {
      // Pausable + timeout ensures eventual cleanup
      return true;
      }

