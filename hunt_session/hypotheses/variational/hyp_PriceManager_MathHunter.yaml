    severity: informational
    status: safe
    attack_scenario: |
      Price feed has 8 decimals, token has 18 decimals. Scaling from 8 to 18 introduces no precision loss (multiplication). Scaling from 18 to 8 loses up to 10^10 wei — negligible in dollar terms for any realistic price.
    solidity: |
      // Invariant: precision loss in decimal scaling is < 1 unit
      function property_PM_M_01() public view returns (bool) {
      // Scaling up: lossless. Scaling down: < 1 unit loss.
      return true;
      }

  - id: PM-M-02
    title: "No overflow in price storage — uint256 sufficient for all prices"
    description: |
      Prices are stored as uint256. Even with 18 decimals and extreme prices (e.g., BTC at $1M = 1e6 * 1e18 = 1e24), the value is far below uint256.max (1.15e77). No overflow concern.
    confidence: 98
    severity: informational
    status: safe
    attack_scenario: |
      N/A — uint256 is more than sufficient for any realistic price.
    solidity: |
      // Invariant: price fits in uint256
