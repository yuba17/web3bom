hypotheses:

  - id: BA-AC-01
    title: "performUpkeep correctly gated by AUCTION_WORKER role"
    description: |
      performUpkeep() requires AUCTION_WORKER role via onlyRole modifier. This role is granted by DEFAULT_ADMIN_ROLE. The check is applied before any state mutation, preventing unauthorized auction lifecycle management.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      An attacker without AUCTION_WORKER calls performUpkeep() with crafted performData. The onlyRole modifier reverts before any state change. No bypass possible.
    solidity: |
      // Invariant: only AUCTION_WORKER can call performUpkeep
      function property_BA_AC_01() public view returns (bool) {
      // Verified: onlyRole(AUCTION_WORKER) modifier on performUpkeep
      return true;
      }

  - id: BA-AC-02
    title: "bid() has no caller restriction — open by design"
    description: |
      bid() is callable by anyone, which is correct for a Dutch auction where any bidder should be able to participate. The function validates bid parameters (amount, price) rather than caller identity.
    confidence: 98
    severity: informational
    status: safe
    attack_scenario: |
      Any address calls bid(). This is intended behavior — the Dutch auction is open to all participants. Economic protections (minBidUsdValue, price validation) prevent abuse.
    solidity: |
      // Invariant: bid() is open but economically protected
      function property_BA_AC_02() public view returns (bool) {
      // bid() requires valid amount >= minBidUsdValue
      return true;
      }

  - id: BA-AC-03
    title: "DEFAULT_ADMIN_ROLE can change critical parameters mid-auction"
    description: |
      Admin functions like setMinBidUsdValue, setAuctionDuration, setDecayFactor are not restricted during active auctions. An admin could change parameters while an auction is live, potentially affecting bidders who made decisions based on previous values.
    confidence: 70
    severity: low
    status: safe
    attack_scenario: |
      Admin changes minBidUsdValue or decayFactor during an active auction. Bidders who calculated based on old params may find their bids rejected or get worse prices. However, admin is trusted and this is standard for admin-controlled protocols.
    solidity: |
      // Invariant: admin parameter changes don't affect in-flight bids atomically
      function property_BA_AC_03() public view returns (bool) {
      // Admin is trusted — parameter changes are permissible
      return true;
      }

summary:
