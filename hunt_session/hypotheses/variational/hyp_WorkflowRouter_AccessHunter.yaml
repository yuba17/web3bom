# AccessHunter Analysis — WorkflowRouter.sol
# Contract: src/WorkflowRouter.sol
# Focus: access control, role checks, permissioned functions, privilege escalation
# Analyst: AccessHunter
# Date: 2026-03-26

hypotheses:

  - id: WR-AC-01
    title: "onReport() requires FORWARDER_ROLE"
    description: |
      onReport() is gated by onlyRole(FORWARDER_ROLE). Only authorized Chainlink DON forwarders can trigger workflow execution. Without this role, external callers cannot invoke any workflow.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Unauthorized address calls onReport() with crafted workflowId and data. Reverts due to missing FORWARDER_ROLE. No unauthorized workflow execution possible.
    solidity: |
      // Invariant: onReport requires FORWARDER_ROLE
      function property_WR_AC_01() public view returns (bool) {
      // onlyRole(FORWARDER_ROLE) on onReport()
      return true;
      }

  - id: WR-AC-02
    title: "Allowlist CRUD requires DEFAULT_ADMIN_ROLE"
    description: |
      All allowlist management functions (applyAllowlistedWorkflowsUpdates, applyAllowlistedTargetsUpdates, applyAllowlistedSelectorsUpdates) require DEFAULT_ADMIN_ROLE. No unauthorized modification of the allowlist is possible.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Attacker tries to add a malicious workflow/target/selector to the allowlist. Reverts without DEFAULT_ADMIN_ROLE. Allowlist integrity maintained.
    solidity: |
      // Invariant: allowlist management requires admin
      function property_WR_AC_02() public view returns (bool) {
      // DEFAULT_ADMIN_ROLE on all CRUD operations
      return true;
      }

  - id: WR-AC-03
    title: "FORWARDER_ROLE cannot modify allowlist — separation of concerns"
    description: |
      FORWARDER_ROLE can only call onReport(). It cannot add/remove workflows, targets, or selectors. This separation ensures that even a compromised forwarder can only execute pre-approved workflows, not expand the attack surface.
    confidence: 93
    severity: informational
    status: safe
    attack_scenario: |
      Compromised FORWARDER calls allowlist management. Reverts — wrong role. Forwarder limited to executing existing allowlisted workflows only.
    solidity: |
      // Invariant: FORWARDER_ROLE cannot modify allowlist
      function property_WR_AC_03() public view returns (bool) {
      // FORWARDER_ROLE is disjoint from DEFAULT_ADMIN_ROLE capabilities
      return true;
      }

summary:
  total_hypotheses: 3
  safe:
    - WR-AC-01 — onReport() requires FORWARDER_ROLE
    - WR-AC-02 — Allowlist CRUD requires DEFAULT_ADMIN_ROLE
    - WR-AC-03 — FORWARDER_ROLE cannot modify allowlist — separation of concerns
