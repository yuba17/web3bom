hypotheses:

  - id: PM-O-01
    title: "EDGE-5: Feed rotation bypasses LiveAuction guard"
    description: |
      When ASSET_ADMIN rotates a price feed (remove old, add new), the transition period may leave the auction without a valid price. If an auction is active during feed rotation, the price read could fail or return stale data. No explicit check prevents feed rotation during active auctions.
    confidence: 75
    severity: low
    status: needs_review
    attack_scenario: |
      1. Auction is active using feedId X. 2. ASSET_ADMIN removes feedId X and adds feedId Y. 3. Next bid reads price — feedId X no longer configured. 4. Price read fails, bid reverts. Auction becomes unbiddable until timeout. Low severity: admin action, not attacker-exploitable.
    solidity: |
      // Invariant: feed rotation during active auction causes bid failure
      function property_PM_O_01() public view returns (bool) {
      // EDGE-5: no LiveAuction guard on feed management
      return false; // Potential finding (Low)
      }

  - id: PM-O-02
    title: "Data Streams price can have future timestamp — accepted by transmit()"
    description: |
      transmit() stores the price with its original timestamp from Data Streams. If the Data Streams report has a timestamp slightly in the future (due to clock skew), it is accepted. The staleness check uses (block.timestamp - price.timestamp), which could underflow if future. However, Solidity 0.8 would revert on underflow, causing the price to be treated as always-fresh until block.timestamp catches up.
    confidence: 70
    severity: low
    status: needs_review
    attack_scenario: |
      PRICE_ADMIN submits a price with timestamp 1 minute in the future. For 1 minute, the staleness check arithmetic would revert (underflow), forcing Chainlink fallback. After 1 minute, normal operation resumes. Impact: temporary fallback to Chainlink, not a security issue.
    solidity: |
      // Invariant: future timestamps in transmit not explicitly rejected
      function property_PM_O_02() public view returns (bool) {
      // transmit() does not validate price.timestamp <= block.timestamp
      return true; // Handled by underflow revert
      }

  - id: PM-O-03
    title: "Chainlink aggregator latestRoundData return values fully validated"
    description: |
      When reading from Chainlink aggregator, the contract checks: price > 0, updatedAt is recent enough, roundId is valid. All standard Chainlink data quality checks are present.
    confidence: 88
    severity: informational
    status: safe
    attack_scenario: |
      Chainlink returns stale round, zero price, or incomplete round. All cases are caught by validation checks. Price read fails gracefully.
    solidity: |
      // Invariant: Chainlink return values fully validated
      function property_PM_O_03() public view returns (bool) {
      // price > 0, updatedAt checked, roundId validated
      return true;
      }

