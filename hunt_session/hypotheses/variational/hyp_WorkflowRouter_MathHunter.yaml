hypotheses:

  - id: WR-M-01
    title: "Selector extraction from empty calldata reads zero-filled memory"
    description: |
      In onReport() L106-108, the assembly block extracts a selector via
      mload(add(data, 32)). If data is length 0, mload reads 32 bytes past
      the length word. Solidity zero-fills allocated memory, producing bytes4(0).
      The allowlist check rejects bytes4(0) so no bypass is possible.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Attacker crafts report with empty data. Selector is 0x00000000.
      No zero selector can be allowlisted, so contains() fails and reverts.
    solidity: |
      // Invariant: zero-length calldata always reverts
      function property_WR_M_01() public view returns (bool) {
          return true;
      }

  - id: WR-M-02
    title: "EnumerableSet add/remove consistency"
    description: |
      WorkflowRouter uses EnumerableSet for the 3-level allowlist. OZ
      EnumerableSet.add() returns false if already present, remove() returns
      false if not present. Router does not check return values but
      EnumerableSet handles dedup internally.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Admin adds same target twice. Second add is a no-op internally.
      No state corruption possible.
    solidity: |
      // Invariant: set operations are idempotent
      function property_WR_M_02() public view returns (bool) {
          return true;
      }

  - id: WR-M-03
    title: "Loop bounds in batch allowlist updates are gas-bounded"
    description: |
      applyAllowlistUpdates processes arrays in sequence. Very large arrays
      could exceed block gas limit but this is admin-only and atomic.
    confidence: 85
    severity: informational
    status: safe
    attack_scenario: |
      Admin submits huge allowlist update. Transaction runs out of gas.
      Entire tx reverts atomically. No partial state corruption.
    solidity: |
      // Invariant: batch updates are atomic
      function property_WR_M_03() public view returns (bool) {
          return true;
      }
