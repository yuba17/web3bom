hypotheses:

  - id: WR-TB-01
    title: "FORWARDER_ROLE is trusted — can execute any allowlisted workflow"
    description: |
      FORWARDER_ROLE represents the Chainlink DON forwarder infrastructure. It can trigger any workflow that is in the allowlist. The allowlist is the security boundary, not the forwarder identity.
    confidence: 92
    severity: informational
    status: safe
    attack_scenario: |
      Compromised FORWARDER executes all allowlisted workflows. Impact limited to what the allowlist permits. Admin responsibility to keep allowlist minimal.
    solidity: |
      // Invariant: FORWARDER_ROLE bounded by allowlist
      function property_WR_TB_01() public view returns (bool) {
      // Forwarder can only execute allowlisted workflows
      return true;
      }

  - id: WR-TB-02
    title: "Target contracts are trusted — allowlisted by admin"
    description: |
      Target addresses in the allowlist are vetted by DEFAULT_ADMIN_ROLE. The router trusts these targets to handle forwarded calls correctly. A malicious target could consume gas or revert, but not affect the router's state.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      Admin adds a malicious target. Router forwards call to it. Malicious target reverts or consumes gas. Router's state is unaffected (regular call, not delegatecall). Admin configuration error.
    solidity: |
      // Invariant: targets are admin-vetted
      function property_WR_TB_02() public view returns (bool) {
      // Allowlisted targets are trusted by admin decision
      return true;
      }

summary:
  total_hypotheses: 2
  safe:
    - WR-TB-01 — FORWARDER_ROLE is trusted — can execute any allowlisted workflow
    - WR-TB-02 — Target contracts are trusted — allowlisted by admin
