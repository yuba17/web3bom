hypotheses:

  - id: GPVCA-FL-01
    title: "_onAuctionStart approves vault relayer for assetOut"
    description: |
      When an auction starts, _onAuctionStart approves the CowSwap vault relayer to spend assetOut tokens. This approval is necessary for CowSwap to pull tokens during settlement.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      Vault relayer pulls tokens outside of a valid settlement. Not possible — CowSwap settlement contract controls when relayer pulls, and isValidSignature gate prevents unauthorized orders.
    solidity: |
      // Invariant: approval only active during auction
      function property_GPVCA_FL_01() public view returns (bool) {
      // _onAuctionStart: approve, _onAuctionEnd: revoke
      return true;
      }

  - id: GPVCA-FL-02
    title: "_onAuctionEnd revokes vault relayer approval"
    description: |
      When an auction ends, _onAuctionEnd sets the vault relayer approval to 0. This ensures no tokens can be pulled after the auction concludes. The approve-revoke lifecycle is correct.
    confidence: 95
    severity: informational
    status: safe
    attack_scenario: |
      After auction ends, vault relayer tries to pull remaining tokens. Approval is 0, transfer reverts. Tokens are safe and swept by _onAuctionEnd's balance transfer.
    solidity: |
      // Invariant: approval revoked after auction ends
      function property_GPVCA_FL_02() public view returns (bool) {
      // After _onAuctionEnd: allowance(vaultRelayer) == 0
      return true;
      }

  - id: GPVCA-FL-03
    title: "Race between CowSwap settlement and auction end"
    description: |
      If a CowSwap settlement is in-flight when the auction ends, the approval revocation in _onAuctionEnd could cause the settlement to revert. This is the intended behavior — orders should not settle after auction end.
    confidence: 85
    severity: informational
    status: safe
    attack_scenario: |
      CowSwap solver submits settlement transaction. In the same block, AUCTION_WORKER ends the auction. If end tx executes first, settlement reverts (approval revoked). If settlement first, it succeeds normally. Both orderings are safe.
    solidity: |
      // Invariant: settlement after approval revoke reverts cleanly
      function property_GPVCA_FL_03() public view returns (bool) {
      // Approval = 0 => transferFrom reverts => settlement fails atomically
      return true;
      }

