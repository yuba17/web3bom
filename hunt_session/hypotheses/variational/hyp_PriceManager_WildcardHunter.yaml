hypotheses:

  - id: PM-W-01
    title: "Future timestamp accepted in transmit() — minor edge case"
    description: |
      transmit() does not validate that price.timestamp <= block.timestamp. A small clock skew in Data Streams could produce a future timestamp. The staleness calculation (block.timestamp - price.timestamp) would underflow in Solidity 0.8, causing a revert and fallback to Chainlink.
    confidence: 70
    severity: informational
    status: safe
    attack_scenario: |
      Data Streams clock is 5 seconds ahead. Price timestamp is block.timestamp + 5. Staleness check: block.timestamp - (block.timestamp + 5) underflows → revert. Chainlink fallback used. Self-corrects when block.timestamp catches up.
    solidity: |
      // Invariant: future timestamp causes underflow → fallback
      function property_PM_W_01() public view returns (bool) {
      // Solidity 0.8 underflow protection acts as implicit guard
      return true;
      }

  - id: PM-W-02
    title: "Multiple transmit() calls in same block — last write wins"
    description: |
      If PRICE_ADMIN calls transmit() multiple times in the same block, each call overwrites the previous price. The last write wins. No accumulation, no averaging, no TWAP. This is correct for Data Streams where each report is authoritative.
    confidence: 90
    severity: informational
    status: safe
    attack_scenario: |
      PRICE_ADMIN submits two prices in the same block: first $100, then $50. Storage holds $50. Next auction bid uses $50. This is correct behavior — latest report is authoritative.
    solidity: |
      // Invariant: multiple transmit() in same block: last wins
      function property_PM_W_02() public view returns (bool) {
      // Each transmit() overwrites previous — correct for Data Streams
      return true;
      }

