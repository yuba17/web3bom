  attack_scenario: >
    delivered() L361-363 retorna deliveries[_id].blockNumber > 0. Si un mensaje
    se procesa en el bloque 0 (genesis block de la chain), blockNumber seria 0
    y delivered() retornaria false, permitiendo re-procesar el mensaje.
    Aunque block 0 es el genesis y normalmente no ejecuta transacciones de usuario,
    en chains L2 custom o chains de test esto podria ser posible.
    Un uint48 truncation de block.number (L227) tambien es relevante: si block.number
    excede 2^48 (~281T bloques), trunca a un valor menor, potencialmente 0.
  impact: "En chains donde block 0 es ejecutable, o si block.number excede uint48, un mensaje procesado se marca como no-delivered, habilitando replay."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que delivered() es consistente con el estado de deliveries
    // Si un mensaje fue procesado, delivered debe retornar true
    // Nota: block.number en test environment es > 0, asi que este invariante
    // verifica la consistencia basica
    uint256 currentBlock = block.number;
    t(currentBlock > 0, "M-TB-06: block number must be > 0 for delivered() to work correctly");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 35
  notes: >
    block.number == 0 en genesis es extremadamente raro para transacciones de usuario.
    uint48 overflow requiere ~281 trillon de bloques (imposible en la practica incluso
    con bloques de 1 segundo durante miles de anios). Confianza baja pero el patron
    de usar > 0 como proxy para "existe" es un anti-pattern conocido.
  poc_sketch: ''
  call_stack: 'process() -> uint48(block.number) -> delivered() -> blockNumber > 0'

- id: M-TB-07
  tier: 1
  type: property
  description: "dispatch() escribe latestDispatchedId antes de llamar hooks externos -- reentrancy en hooks puede leer stale latestDispatchedId"
  attack_scenario: >
    En dispatch() L300-312, latestDispatchedId se escribe ANTES de llamar
    requiredHook.postDispatch() y hook.postDispatch(). Si un hook hace re-entrancy
    llamando dispatch() de nuevo, latestDispatchedId se sobreescribe con el nuevo ID.
    El hook original que esta ejecutandose ve un latestDispatchedId diferente al
    que corresponde a su dispatch. Si algun hook usa latestDispatchedId para auth
    (comentario L42-43: "used for auth in post-dispatch hooks"), un dispatch
    re-entrante puede confundir la autenticacion del hook.
  impact: "Un hook re-entrante puede hacer que latestDispatchedId no corresponda al mensaje actual, rompiendo la autenticacion en hooks que dependen de este valor."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que latestDispatchedId corresponde al ultimo mensaje dispatched
    bytes32 latestId = originMailbox.latestDispatchedId();
    if (ghost_callRemoteCount > 0) {
        // Si hubo dispatches, latestDispatchedId no debe ser zero
        t(latestId != bytes32(0), "M-TB-07: latestDispatchedId must not be zero after dispatch");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    Este es el hallazgo mas interesante. latestDispatchedId se usa explicitamente
    "for auth in post-dispatch hooks" (comentario L42-43). Si requiredHook llama
    dispatch() re-entrante, el segundo dispatch sobreescribe latestDispatchedId
    ANTES de que el primer dispatch termine sus hooks. Esto es un CEI violation
    con impacto concreto en auth de hooks.
  poc_sketch: |
    // 1. Crear MaliciousHook que en postDispatch() llama mailbox.dispatch()
    // 2. dispatch() con MaliciousHook como custom hook
    // 3. En el callback, el segundo dispatch sobreescribe latestDispatchedId
    // 4. requiredHook.postDispatch del primer dispatch ve el ID del segundo
  call_stack: 'dispatch() -> latestDispatchedId = id1 -> requiredHook.postDispatch() -> [reentrancy] dispatch() -> latestDispatchedId = id2 -> hook.postDispatch() [ve id2, no id1]'

- id: M-TB-08
  tier: 2
  type: property
  description: "setDefaultIsm/setDefaultHook/setRequiredHook no tienen timelock -- owner puede cambiar ISM/hooks instantaneamente"
  attack_scenario: >
    El owner puede llamar setDefaultIsm(), setDefaultHook(), setRequiredHook()
    sin timelock ni delay. Un owner comprometido puede:
    1) Cambiar defaultIsm a un ISM que siempre retorna true -> aceptar mensajes falsos
    2) Cambiar requiredHook a uno que roba el msg.value de todos los dispatches
    3) Front-run un process() cambiando el ISM justo antes para aceptar un msg fabricado
    El unico check es isContract(). No hay validacion de que el nuevo ISM/hook
    implementa la interfaz correctamente.
  impact: "Owner malicioso puede comprometer toda la seguridad del Mailbox instantaneamente, aceptando mensajes falsos o robando fees de dispatch."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que defaultIsm, defaultHook, requiredHook son contratos validos
    address ismAddr = address(destMailbox.defaultIsm());
    address defaultHookAddr = address(originMailbox.defaultHook());
    address requiredHookAddr = address(originMailbox.requiredHook());
    t(ismAddr != address(0), "M-TB-08: defaultIsm must not be zero");
    t(defaultHookAddr != address(0), "M-TB-08: defaultHook must not be zero");
    t(requiredHookAddr != address(0), "M-TB-08: requiredHook must not be zero");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    Centralizacion risk -- generalmente out of scope en bounties.
    Pero la ausencia de timelock es notable dado que el owner controla
    la seguridad de TODOS los mensajes cross-chain.
  poc_sketch: ''
  call_stack: 'setDefaultIsm() [onlyOwner, no timelock] -> defaultIsm = maliciousISM'

- id: M-TB-09
  tier: 1
  type: property
  description: "dispatch() value split: si requiredHook.quoteDispatch reverts, todo dispatch falla -- DoS via requiredHook"
  attack_scenario: >
    En dispatch() L306, requiredHook.quoteDispatch(metadata, message) se llama
    para determinar cuanto ETH va al requiredHook. Si requiredHook es un contrato
    que reverts en quoteDispatch (bug o actualizacion maliciosa), NINGUN dispatch
    puede ejecutarse. Esto es un single point of failure.
    Adicionalmente, si quoteDispatch retorna un valor > msg.value, la linea L308-309
    ajusta requiredValue = msg.value, enviando TODO al requiredHook y 0 al custom hook.
    El custom hook puede revertir si espera recibir ETH.
  impact: "requiredHook.quoteDispatch() que revierte causa DoS completo del Mailbox -- ningun mensaje puede ser dispatched."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el Mailbox puede dispatchar mensajes (no esta en DoS)
    // Si nonce avanza, dispatch funciona
    uint32 nonceBefore = originMailbox.nonce();
    // Nonce debe ser >= que el nonce anterior registrado
    if (ghost_lastNonce > 0) {
        gte(uint256(nonceBefore), uint256(ghost_lastNonce), "M-TB-09: nonce must not decrease -- potential DoS");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    Referencia Solodit: Potential DoS of messages in postDispatch (DIA).
    El requiredHook es un single point of failure. Si el owner lo cambia a un
    contrato buggy, todo el Mailbox se bloquea. Mitigacion: owner puede cambiar
    requiredHook, pero eso requiere que el owner actue rapido.
  poc_sketch: ''
  call_stack: 'dispatch() -> requiredHook.quoteDispatch() [reverts] -> entire dispatch reverts'

- id: M-TB-10
  tier: 2
  type: property
  description: "recipientIsm() usa abi.decode sin validar returnData.length >= 32 -- returnData corrupto puede decodificar a address inesperado"
  attack_scenario: >
    En recipientIsm() L421-426, se verifica returnData.length != 0 pero NO que
    length >= 32 (tamano de un address encoded). Si el recipient retorna datos
    con length entre 1 y 31 bytes, abi.decode(returnData, (address)) se comporta
    de forma inesperada: en Solidity >=0.8 deberia revertir por ABI decoding error,
    pero el staticcall wrapper podria no propagar esto correctamente.
    En la practica, abi.decode con datos < 32 bytes revierte, y el catch implicito
    del if(success) no aplica porque el decode esta fuera del staticcall.
    Entonces si returnData tiene 1-31 bytes, abi.decode revierte y recipientIsm() revierte,
    causando DoS en process() para ese recipient.
  impact: "Un recipient que retorna datos malformados (1-31 bytes) en interchainSecurityModule() causa revert en recipientIsm(), bloqueando la entrega de mensajes a ese recipient."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que recipientIsm no revierte para recipients que no implementan la interfaz
    // Un EOA o contrato sin interchainSecurityModule() debe retornar defaultIsm
    address defaultIsmAddr = address(destMailbox.defaultIsm());
    IInterchainSecurityModule resultIsm = destMailbox.recipientIsm(address(0x1234));
    eq(uint256(uint160(address(resultIsm))), uint256(uint160(defaultIsmAddr)), "M-TB-10: non-implementing recipient must use defaultIsm");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    Investigacion adicional: si returnData.length es entre 1 y 31, abi.decode
    revierte. Esto esta FUERA del try/catch (no hay try/catch, es un if/success check
    sobre el staticcall). El abi.decode(returnData, (address)) se ejecuta
    incondicionalmente si success && returnData.length != 0. Si length < 32,
    abi.decode revierte -> recipientIsm() revierte -> process() revierte.
    Un recipient malicioso puede hacer esto intencionalmente para bloquear mensajes.
  poc_sketch: |
    // Contrato que retorna 16 bytes en interchainSecurityModule()
    // fallback() { assembly { mstore(0, 0xDEAD); return(0, 16) } }
    // Llamar process() con este recipient -> revert en abi.decode
  call_stack: 'recipientIsm() -> staticcall(interchainSecurityModule) -> returnData.length=16 -> abi.decode reverts'

false_positives:
- hunter: TrustBoundaryHunter
  id: M-TB-FP-01
  reason: >
    dispatch() es permissionless por diseno -- cualquier address puede dispatchar mensajes.
    Esto NO es un bug de access control. La seguridad en el destino viene del ISM.
    El sender se registra como msg.sender en el mensaje, y el recipient/ISM deciden
    si confiar en ese sender.
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: access
    content: "dispatch() en Mailbox es intencionalmente permissionless -- no es missing access control"
    briefing_update_applied: false
- hunter: TrustBoundaryHunter
  id: M-TB-FP-02
  reason: >
    process() sin access control es by design. Hyperlane permite que cualquier
    relayer procese mensajes. La seguridad viene del ISM verification, no del
    control de acceso en process(). Esto es un patron comun en messaging protocols.
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "process() en cross-chain mailboxes es permissionless by design -- ISM provee seguridad, no access control"
