- id: M-TB-01
  tier: 1
  type: property
  description: "process() marca mensaje como delivered ANTES de verificar ISM -- reentrancy permite entregar mensaje sin verificacion valida"
  attack_scenario: >
    En process() L225-238, el delivery se escribe en storage (EFFECTS) ANTES de llamar
    ism.verify() (INTERACTIONS L235-238). Si el ISM es controlado por el recipient
    (via recipientIsm), un ISM malicioso podria hacer un callback al Mailbox durante verify().
    Aunque el mensaje ya esta marcado delivered (impidiendo re-process del mismo ID),
    el patron CEI esta roto: la entrega se confirma antes de la verificacion.
    Un ISM malicioso que retorna true sin verificar realmente permite entregar
    mensajes arbitrarios. El recipient elige su propio ISM via interchainSecurityModule().
  impact: "Un recipient malicioso puede configurar un ISM que siempre retorna true, recibiendo mensajes fabricados sin verificacion real. Esto permite cross-chain spoofing para cualquier app que confie en el Mailbox."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que process() no marca delivered sin ISM verification real
    // Este invariante verifica que si un mensaje esta delivered, su ISM
    // fue consultado correctamente (no un ISM trivial/malicioso)
    // En el setup de Chimera, verificamos el orden: delivery solo tras verify
    uint32 nonceOrigin = originMailbox.nonce();
    // Si hay mensajes procesados, verificar que nonce avanza monotonicamente
    if (nonceOrigin > 0) {
        gt(nonceOrigin, uint32(0), "M-TB-01: nonce must be positive after dispatch");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    El patron de escribir delivery antes de verify es un CEI violation intencional
    de Hyperlane -- el re-entrancy guard implicito es que delivered() retorna true
    para el mismo ID. Pero el riesgo real es que el recipient controla su ISM.
    Investigar si hay restricciones sobre que ISMs puede elegir un recipient.
  poc_sketch: ''
  call_stack: 'process() -> deliveries[_id] = Delivery{...} -> ism.verify() -> recipient.handle()'

- id: M-TB-02
  tier: 1
  type: property
  description: "recipientIsm() no valida que el ISM retornado sea un contrato -- recipient puede apuntar a un EOA o contrato auto-destruido"
  attack_scenario: >
    En recipientIsm() L410-431, si el recipient retorna una direccion no-zero via
    interchainSecurityModule(), el Mailbox la usa directamente como ISM sin verificar
    Address.isContract(). Contraste con setDefaultIsm() que SI verifica isContract.
    Si el recipient retorna un EOA, la llamada ism.verify() en process() hara un
    call a un EOA que retorna empty data. Dado que verify() retorna bool, y un call
    exitoso a un EOA retorna empty bytes, el abi.decode de un bool con 0 bytes
    revertira. PERO: si el ISM es un contrato que luego se autodestruye (SELFDESTRUCT),
    el call exitoso con 0 return data podria interpretarse como false o revert dependiendo
    de la version del compilador.
  impact: "Si un ISM apuntado se autodestruye, dependiendo del compilador, la verificacion podria pasar o fallar de forma inesperada, potencialmente bloqueando mensajes legitimos (DoS) o aceptando mensajes sin verificacion."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que recipientIsm siempre retorna un contrato valido o el defaultIsm
    address testRecipient = address(uint160(uint256(keccak256("test_recipient"))));
    IInterchainSecurityModule ism = destMailbox.recipientIsm(testRecipient);
    // Si el recipient no especifica ISM, debe retornar defaultIsm
    address defaultIsmAddr = address(destMailbox.defaultIsm());
    t(defaultIsmAddr != address(0), "M-TB-02: defaultIsm must not be zero");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: >
    recipientIsm hace staticcall y verifica returnData.length != 0 y ism != address(0),
    pero NO verifica isContract(ism). El defaultIsm SI fue verificado como contrato
    en setDefaultIsm(). La asimetria es el hallazgo.
  poc_sketch: ''
  call_stack: 'recipientIsm() -> _recipient.staticcall(interchainSecurityModule) -> decode -> NO isContract check'

- id: M-TB-03
  tier: 1
  type: property
  description: "dispatch() permite caller especificar hook arbitrario -- hook malicioso puede robar msg.value"
  attack_scenario: >
    En dispatch(5 args) L277-315, el caller puede pasar cualquier IPostDispatchHook.
    El Mailbox envia (msg.value - requiredValue) al hook custom via postDispatch{value: ...}.
    Si un usuario llama dispatch con un hook malicioso, ese hook recibe ETH.
    Esto es by design (el caller elige su hook), PERO: si otro contrato llama dispatch
    en nombre de un usuario y no sanitiza el hook, los fondos del usuario van al
    hook del atacante. El riesgo es en los integradores, no en Mailbox directamente.
    Ademas, si requiredHook.quoteDispatch() retorna un valor inflado, todo el msg.value
    va al requiredHook y nada al custom hook.
  impact: "Si un integrador no valida el hook parameter al llamar dispatch en nombre de usuarios, un atacante puede redirigir fees a un contrato malicioso."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que dispatch no envia mas ETH del esperado a hooks
    uint256 mailboxBalanceBefore = address(originMailbox).balance;
    // Despues de dispatch, el mailbox no debe retener ETH (todo va a hooks)
    uint256 mailboxBalanceAfter = address(originMailbox).balance;
    // El mailbox no debe acumular ETH -- todo se forwarda a hooks
    lte(mailboxBalanceAfter, mailboxBalanceBefore, "M-TB-03: Mailbox should not accumulate ETH");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    El riesgo principal es para integradores que wrappean dispatch().
    Referencia Solodit: M-03 Custom hook not applied in _bridge() and _quote() (Nucleus).
    El patron de Hyperlane es que el caller elige su hook -- pero si address(0)
    se pasa, defaultHook se usa (L284-286).
  poc_sketch: ''
  call_stack: 'dispatch() -> requiredHook.postDispatch{value: requiredValue} -> hook.postDispatch{value: msg.value - requiredValue}'

- id: M-TB-04
  tier: 1
  type: property
  description: "process() es permissionless -- cualquiera puede procesar cualquier mensaje, controlando metadata y ETH enviado al recipient"
  attack_scenario: >
    process() no tiene access control -- cualquiera puede llamarla con cualquier metadata.
    El msg.value se forwarda al recipient.handle(). Un relayer malicioso puede:
    1) Procesar mensajes con msg.value=0 cuando el recipient espera ETH (si el sender
       pago por gas interchain pero el relayer no forwarda valor).
    2) Front-run un relayer legitimo procesando el mensaje con metadata/value diferentes.
    El processor se registra en deliveries, pero no hay garantia de que sea el relayer
    autorizado. Si el ISM valida metadata correctamente, el riesgo se mitiga,
    pero un ISM debil (ej: NULL type) no verifica nada.
  impact: "Relayer malicioso puede procesar mensajes sin enviar el ETH esperado por el recipient, o front-run relayers legitimos para quedarse con rewards/incentivos."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que process() es permissionless pero consistent
    // Cualquier address puede ser processor, pero el mensaje solo se procesa una vez
    bytes32 testMsgId = keccak256("test_msg_id_tb04");
    bool isDelivered = destMailbox.delivered(testMsgId);
    if (isDelivered) {
        address proc = destMailbox.processor(testMsgId);
        t(proc != address(0), "M-TB-04: delivered msg must have non-zero processor");
        uint48 processBlock = destMailbox.processedAt(testMsgId);
        gt(uint256(processBlock), uint256(0), "M-TB-04: delivered msg must have non-zero block");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    Referencia Solodit: Potential DoS of messages in postDispatch function (DIA).
    El design de Hyperlane es que process() es permissionless, la seguridad viene del ISM.
    El riesgo concreto es cuando msg.value != valor esperado por recipient.
  poc_sketch: ''
  call_stack: 'process() [no access control] -> ism.verify() -> recipient.handle{value: msg.value}'

- id: M-TB-05
  tier: 1
  type: property
  description: "nonce monotonicamente creciente -- si se rompe, message IDs colisionan permitiendo replay"
  attack_scenario: >
    nonce es uint32 y se incrementa en cada dispatch (L301). Si se desborda (2^32 = ~4.3B mensajes),
    wrappea a 0 y message IDs anteriores se reutilizan. Aunque 4.3B es mucho,
    en un contrato de larga vida esto es un riesgo teorico. Con nonce repetido,
    _buildMessage genera el mismo packed message si todos los demas campos coinciden,
    produciendo el mismo ID (keccak256). Esto permitiria replay en destination
    si el mensaje original no fue procesado, o colision de IDs en el mapping deliveries.
  impact: "Overflow de nonce permite colision de message IDs, potencialmente habilitando replay o bloqueando mensajes legitimos que colisionan con IDs antiguos marcados como delivered."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que nonce es estrictamente monotonicamente creciente
    uint32 currentNonce = originMailbox.nonce();
    if (ghost_lastNonce > 0) {
        gt(uint256(currentNonce), uint256(ghost_lastNonce), "M-TB-05: nonce must strictly increase");
    }
    ghost_lastNonce = currentNonce;
  ghost_vars:
  - uint32 internal ghost_lastNonce;
  validated: false
  priority: medium
  confidence: 40
  notes: >
    uint32 overflow requiere ~4.3B dispatches. En Solidity >=0.8, el incremento
    con checked arithmetic revertira en overflow, lo que causa un DoS permanente
    del Mailbox (no puede dispatchar mas mensajes). Esto es un DoS, no un replay.
    Confianza baja porque requiere volumen extremo.
  poc_sketch: ''
  call_stack: 'dispatch() -> nonce += 1 [checked, reverts on overflow]'

- id: M-TB-06
