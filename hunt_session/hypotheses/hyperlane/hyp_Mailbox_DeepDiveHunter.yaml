overall_assessment: 'The Mailbox is well-designed with one notable class of vulnerability:
  hooks that check _isLatestDispatched but have no deduplication are vulnerable to
  external direct calls to postDispatch after dispatch returns. MerkleTreeHook is
  the primary victim — double-insert corrupts the merkle tree. The 7-hunter convergence
  on latestDispatchedId reentrancy is a FALSE POSITIVE because requiredHook runs before
  the custom hook (where reentrancy originates), and hooks use the message parameter,
  not latestDispatchedId, for their operations.

  The recipientIsm returnbomb is a confirmed LOW finding (gas griefing only). All
  other convergence zones are safe by design.

  '
hypotheses:
- id: M-DD-01
  title: MerkleTreeHook.postDispatch publicly callable — double-insert corrupts merkle
    tree
  description: 'AbstractPostDispatchHook.postDispatch() is `external payable` with
    NO access control beyond supportsMetadata (passes for empty metadata). MerkleTreeHook._postDispatch
    checks _isLatestDispatched(id) but has NO deduplication (no messageValidated mapping
    like RateLimitedHook has).

    After dispatch() returns, latestDispatchedId still equals the last message''s
    ID. An attacker contract can: (1) call dispatch() which inserts message into MerkleTree
    at index N, then (2) in the SAME TX, call MerkleTreeHook.postDispatch(empty_metadata,
    pre_computed_message) which inserts the SAME message at index N+1.

    The message bytes are predictable: VERSION (constant) + nonce (readable before
    dispatch) + localDomain (immutable) + msg.sender (the attacker contract) + destination
    + recipient + body (all attacker-controlled).

    Result: MerkleTree.count diverges from Mailbox.nonce. Every double-insert shifts
    subsequent messages'' tree indices by 1. Validators sign checkpoints based on
    tree state, and relayers that assume nonce == treeIndex will construct incorrect
    merkle proofs.

    '
  component: Mailbox
  file: contracts/hooks/MerkleTreeHook.sol
  line: 63-77
  severity: high
  confidence: 80
  validated: true
  category: state_inconsistency
  attack_vector: '1. Attacker deploys contract that pre-computes message bytes

    2. Contract reads mailbox.nonce() to predict the message format

    3. Contract calls mailbox.dispatch(dest, recipient, body) — MerkleTree inserts
    at index N

    4. In same tx, contract calls merkleTreeHook.postDispatch(bytes(""), pre_computed_message)

    5. _isLatestDispatched(id) passes — latestDispatchedId still matches

    6. MerkleTree inserts SAME id at index N+1 — DUPLICATE

    7. Tree.count = N+2, Mailbox.nonce = N+1 — DIVERGED

    8. Repeat for every dispatch to compound the divergence

    '
  impact: 'Merkle tree corruption: tree.count permanently diverges from Mailbox.nonce.
    Validators sign checkpoints over corrupted tree. Relayer software that assumes
    message_index == nonce_at_dispatch constructs wrong merkle proofs, causing message
    delivery failures on destination chains. This is griefing — no direct fund loss,
    but cross-chain message delivery is disrupted.

    Mitigation: relayers that read actual tree state (not assuming nonce==index) are
    unaffected. But the protocol invariant (one tree entry per dispatch) is violated.

    '
  preconditions:
  - MerkleTreeHook is deployed and used as requiredHook or defaultHook
  - Attacker can predict message bytes (all inputs are public/deterministic)
  - No other dispatch occurs between attacker's dispatch and direct postDispatch call
    (same-tx attack)
  call_stack: "AttackerContract.attack()\n  → mailbox.dispatch(dest, recipient, body)\n\
    \    → latestDispatchedId = id\n    → nonce += 1\n    → requiredHook(MerkleTree).postDispatch\
    \ → _isLatestDispatched(id) ✓ → tree.insert(id) [index N]\n    → hook.postDispatch\
    \ → returns\n  → merkleTreeHook.postDispatch(bytes(\"\"), message)\n    → supportsMetadata(bytes(\"\
    \")) → true (empty metadata passes)\n    → _postDispatch:\n      → require(msg.value\
    \ == 0) ✓\n      → id = message.id()\n      → _isLatestDispatched(id) → mailbox.latestDispatchedId()\
    \ == id ✓ (still set from dispatch)\n      → tree.insert(id) [index N+1] — DUPLICATE\n"
  solidity: '// M-DD-01: MerkleTree count must equal Mailbox nonce

    // A double-insert would cause count > nonce

    uint32 mailboxNonce = originMailbox.nonce();

    uint32 treeCount = merkleTreeHook.count();

    eq(uint256(treeCount), uint256(mailboxNonce), "M-DD-01: MerkleTree count != Mailbox
    nonce — possible double-insert");

    '
  poc_sketch: "contract MerkleDoubleInsert is Test {\n    Mailbox mailbox;\n    MerkleTreeHook\
    \ merkleHook;\n\n    function test_doubleInsert() public {\n        uint32 nonceBefore\
    \ = mailbox.nonce();\n        uint32 countBefore = merkleHook.count();\n     \
    \   assertEq(nonceBefore, countBefore, \"pre: nonce == count\");\n\n        //\
    \ Pre-compute message bytes\n        bytes memory message = Message.formatMessage(\n\
    \            mailbox.VERSION(), nonceBefore, mailbox.localDomain(),\n        \
    \    bytes32(uint256(uint160(address(this)))),\n            42, bytes32(uint256(0xBEEF)),\
    \ bytes(\"hello\")\n        );\n\n        // Step 1: dispatch — inserts into tree\
    \ at index countBefore\n        mailbox.dispatch{value: 0}(42, bytes32(uint256(0xBEEF)),\
    \ bytes(\"hello\"));\n        assertEq(merkleHook.count(), countBefore + 1, \"\
    one insert from dispatch\");\n\n        // Step 2: direct call to postDispatch\
    \ — double-insert\n        merkleHook.postDispatch(bytes(\"\"), message);\n  \
    \      assertEq(merkleHook.count(), countBefore + 2, \"BUG: double-insert succeeded\"\
    );\n\n        // Divergence: nonce advanced by 1, tree count by 2\n        assertEq(mailbox.nonce(),\
    \ nonceBefore + 1, \"nonce +1\");\n        assertEq(merkleHook.count(), nonceBefore\
    \ + 2, \"count +2 — DIVERGED\");\n    }\n}\n"
  escalation_verdict: 'ESCALATED Medium→High: merkle tree corruption affects ALL cross-chain
    delivery, including warp route token transfers (temporary freezing of funds)'
  redteam_verdict: REPORT — 7/7 triage questions passed. Permissionless exploit, gas-only
