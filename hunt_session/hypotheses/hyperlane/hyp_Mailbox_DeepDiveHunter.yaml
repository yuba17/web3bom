- id: M-DD-03
  title: recipientIsm() returnbomb — unbounded staticcall returndata griefs relayer
    gas
  description: 'recipientIsm() at L414 makes a staticcall to _recipient.interchainSecurityModule()
    without gas limit. Solidity copies ALL returndata into memory automatically. A
    malicious recipient can implement interchainSecurityModule() that returns a large
    byte array (~100KB+), causing quadratic memory expansion gas cost (EVM memory
    cost scales O(n²) above 724 bytes).

    The caller (relayer calling process()) pays this gas. With 30M block gas limit,
    a malicious recipient returning ~100KB forces ~3M+ gas consumption just for returndata
    handling, before ism.verify() or handle() even execute.

    Unlike standard returnbomb attacks via low-level call, this uses Solidity''s automatic
    returndata copy in high-level staticcall, making it harder to detect.

    '
  component: Mailbox
  file: contracts/Mailbox.sol
  line: 414-428
  severity: low
  confidence: 65
  validated: true
  category: gas_griefing
  call_stack: "relayer.process(metadata, message)\n  → Mailbox.process(metadata, message)\n\
    \    → recipientIsm(recipient) [L221]\n      → _recipient.staticcall(abi.encodeCall(interchainSecurityModule,\
    \ ())) [L414]\n      → recipient returns ~100KB+ of returndata\n      → Solidity\
    \ copies ALL returndata into memory — gas consumed for expansion\n      → abi.decode(returnData,\
    \ (address)) — only reads 32 bytes but memory already expanded\n    → ism.verify()\
    \ — additional gas\n    → recipient.handle() — additional gas\nTotal gas: possibly\
    \ exceeding what relayer budgeted\n"
  solidity: '// M-DD-03: recipientIsm gas cost should be bounded

    uint256 gasBefore = gasleft();

    IInterchainSecurityModule ism = destMailbox.recipientIsm(address(destMailbox));

    uint256 gasUsed = gasBefore - gasleft();

    lt(gasUsed, 200_000, "M-DD-03: recipientIsm consumed excessive gas — possible
    returnbomb");

    '
  poc_sketch: "contract ReturnBombRecipient {\n    function interchainSecurityModule()\
    \ external pure returns (bytes memory) {\n        // Return ~100KB of data — forces\
    \ quadratic memory expansion in caller\n        assembly {\n            let ptr\
    \ := mload(0x40)\n            mstore(ptr, 0x20) // offset\n            mstore(add(ptr,\
    \ 0x20), 100000) // length\n            // Fill with zeros (already zero in memory)\n\
    \            return(ptr, add(100032, 0x40))\n        }\n    }\n}\n// Deploy ReturnBombRecipient,\
    \ dispatch message to it, call process()\n// Measure gas: should be ~3M+ vs normal\
    \ ~50K\n"
  impact: 'Gas griefing of relayers. A malicious recipient can make process() consume
    3-6M+ gas just in the recipientIsm() call, leaving less gas for ism.verify() and
    handle(). Relayer loses gas on every attempt. In extreme cases, process() could
    exceed block gas limit and the message becomes undeliverable.

    Mitigated by: relayer can eth_estimateGas and skip expensive messages. Only affects
    messages to the specific malicious recipient, not all messages.

    '
  preconditions:
  - Malicious recipient contract deployed on destination chain
  - Message dispatched targeting this recipient (sender can be anyone)
  variant_hunt_done: false
