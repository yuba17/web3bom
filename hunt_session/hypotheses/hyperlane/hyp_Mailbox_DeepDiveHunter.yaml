- id: M-DD-02
  title: AbstractMessageIdAuthHook.postDispatch publicly callable — double cross-chain
    notification
  description: 'Same root cause as M-DD-01 but affecting AbstractMessageIdAuthHook.
    This hook also has no deduplication — _isLatestDispatched is the only authorization
    gate. An attacker can call postDispatch directly after dispatch, causing _sendMessageId
    to execute twice. This sends a DUPLICATE notification to the destination ISM via
    the third-party bridge (LayerZero, Wormhole, CCTP, etc.).

    While standard AbstractMessageIdAuthIsm is idempotent (sets verifiedMessages[id]
    = true), custom ISMs that COUNT notifications or accumulate state could be corrupted.
    The bridge also receives duplicate messages, wasting bridge capacity and fees.

    TokenBridgeCctpBase is also affected (same pattern, no deduplication).

    '
