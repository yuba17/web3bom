design_assumption_analysis:
  _isLatestDispatched_as_auth:
    assumptions:
    - Only the Mailbox calls postDispatch on hooks during dispatch()
    - latestDispatchedId is a reliable single-use authorization token
    - Each message ID triggers postDispatch exactly once
    violations:
    - assumption: Only Mailbox calls postDispatch
      scenario: 'AbstractPostDispatchHook.postDispatch is `external payable` with
        NO access control. The ONLY authorization is _isLatestDispatched(id) inside
        _postDispatch. After dispatch() returns, latestDispatchedId still holds the
        last message''s ID. Anyone can call hook.postDispatch(empty_metadata, pre_computed_message)
        directly before the next dispatch changes latestDispatchedId.

        '
      exploitable: true
    - assumption: Each message triggers postDispatch exactly once
      scenario: 'MerkleTreeHook has NO deduplication check. Calling postDispatch twice
        with the same message inserts the ID twice into the merkle tree. RateLimitedHook
        IS protected (validateMessageOnce modifier). AbstractMessageIdAuthHook is
        NOT protected but ISM is idempotent.

        '
      exploitable: true
  recipientIsm_staticcall:
    assumptions:
    - Recipient's interchainSecurityModule() returns a small, well-formed response
    - The gas cost of the staticcall is bounded
    violations:
    - assumption: Gas cost is bounded
      scenario: 'recipientIsm() L414 uses high-level staticcall with no gas limit.
        Solidity copies ALL returndata to memory. A malicious recipient returning
