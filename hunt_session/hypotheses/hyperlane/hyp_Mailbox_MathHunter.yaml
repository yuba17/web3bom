- id: M-MATH-01
  tier: 2
  type: property
  description: "Nonce (uint32) es monotonicamente creciente y nunca wrappea a 0 -- un overflow causa colision de message IDs"
  attack_scenario: "Si nonce alcanza type(uint32).max y wrappea a 0, un nuevo dispatch genera un message con nonce=0 que colisiona con el message ID del primer dispatch historico. En Solidity >=0.8, esto revierte por overflow, causando DoS permanente del Mailbox -- nadie puede enviar mensajes."
  impact: "DoS permanente del Mailbox tras ~4.29 mil millones de dispatches. En chains con gas barato (L2s) esto es alcanzable en meses/anios."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    uint32 currentNonce = originMailbox.nonce();
    // nonce debe ser menor que el maximo antes de dispatch
    // Si ya esta en max, el siguiente dispatch revertira por overflow
    t(currentNonce < type(uint32).max, "M-MATH-01: nonce at uint32 max -- next dispatch will revert permanently");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: "En Solidity >=0.8, nonce += 1 cuando nonce == type(uint32).max causa revert por checked arithmetic. No hay mecanismo de recovery -- el Mailbox queda inutilizable. La pregunta es si 4.29B dispatches es alcanzable. En L2s con gas <0.01 USD por tx, a 100 tx/s = ~1.36 anios. Probable en lifetime del contrato."
  poc_sketch: ''
  call_stack: ''

- id: M-MATH-02
  tier: 1
  type: property
  description: "La suma de requiredValue + hookValue en dispatch() siempre debe ser exactamente msg.value -- no se pierden ni crean fondos"
  attack_scenario: "Si la aritmetica de fee split es incorrecta, ETH queda atrapado en el Mailbox (requiredValue demasiado bajo) o la tx revierte innecesariamente. Linea 312: hook.postDispatch{value: msg.value - requiredValue} puede underflow si requiredHook.quoteDispatch devuelve un valor que luego cambia entre quote y postDispatch."
  impact: "ETH atrapado permanentemente en el contrato Mailbox sin mecanismo de rescue, o DoS de dispatch."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 mailboxBalanceBefore = address(originMailbox).balance;
    // Despues de cada dispatch, el balance del Mailbox no debe aumentar
    // (no debe retener fondos)
    uint256 mailboxBalanceAfter = address(originMailbox).balance;
    lte(mailboxBalanceAfter, mailboxBalanceBefore, "M-MATH-02: Mailbox retained ETH after dispatch -- funds trapped");
  ghost_vars:
  - uint256 internal ghost_mailboxBalanceBeforeDispatch;
  validated: false
  priority: high
  confidence: 75
  notes: "El patron en L308-312 es: si msg.value < requiredValue, baja requiredValue a msg.value. Luego envia requiredValue a requiredHook y (msg.value - requiredValue) a hook. La resta no puede underflow porque requiredValue <= msg.value por la guarda. Pero si requiredHook.postDispatch NO consume todo el value enviado y lo devuelve, queda en el Mailbox. No hay mecanismo de rescue."
  poc_sketch: ''
  call_stack: ''

- id: M-MATH-03
