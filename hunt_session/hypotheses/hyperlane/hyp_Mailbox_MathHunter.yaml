    // indicando fondos atrapados por errores de aritmetica en fee split
    uint256 balance = address(originMailbox).balance;
    lte(balance, ghost_totalMsgValueSent, "M-MATH-07: Mailbox balance exceeds total msg.value ever sent -- funds trapped");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 60
  notes: "requiredValue es variable local, inmune a reentrancy. La guarda en L308-309 garantiza requiredValue <= msg.value. La resta en L312 es safe. Este invariante es mas de verificacion que de bug real. Low confidence porque la proteccion ya esta en el codigo."
  poc_sketch: ''
  call_stack: ''

