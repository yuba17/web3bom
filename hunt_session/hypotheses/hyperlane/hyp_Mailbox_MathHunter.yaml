  impact: "DoS de quoteDispatch para cualquier usuario que use un hook especifico. No hay perdida de fondos directa pero bloquea UX."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // quote no debe revertir por overflow con hooks legitimos
    // Verificar que el quote es consistente con lo que dispatch realmente cobra
    uint256 quotedFee = originMailbox.quoteDispatch(
      DESTINATION,
      bytes32(uint256(uint160(address(destMailbox)))),
      bytes("test"),
      bytes(""),
      IPostDispatchHook(address(originMailbox.defaultHook()))
    );
    // El quote debe ser un valor razonable (no overflow)
    t(quotedFee < type(uint256).max, "M-MATH-03: quoteDispatch returned near-max value -- overflow risk");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 50
  notes: "En practica, los hooks legitimos devuelven fees razonables. El riesgo solo existe con hooks custom maliciosos, que es self-inflicted. Pero integradores terceros podrian construir sobre quoteDispatch sin manejar el revert."
  poc_sketch: ''
  call_stack: ''

- id: M-MATH-04
  tier: 2
  type: property
  description: "blockNumber truncado a uint48 en delivery -- si block.number > type(uint48).max, delivered() devuelve false para mensajes procesados en block 0 (truncado)"
  attack_scenario: "uint48 max = 281,474,976,710,655. Si block.number excede esto (improbable en la mayoria de chains, pero posible en L2s con bloques frecuentes), uint48(block.number) trunca silenciosamente. Si trunca a 0, delivered() retorna false (L362: blockNumber > 0), permitiendo re-procesar un mensaje ya entregado. Double-spend de mensajes cross-chain."
  impact: "Re-procesamiento de mensajes cross-chain -- double-spend, double-execution de acciones arbitrarias. Critico si ocurre."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // block.number truncado a uint48 nunca debe ser 0 (a menos que block.number sea realmente 0)
    uint48 truncated = uint48(block.number);
    if (block.number > 0) {
      t(truncated > 0, "M-MATH-04: block.number truncation to uint48 produced 0 -- delivered() bypass");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: "uint48 max ~= 281 trillon. A 1 block/segundo = ~8.9 millones de anios. A 0.25s/block (L2 agresivo) = ~2.2 millones de anios. Practicamente imposible. Pero la truncacion silenciosa (no unchecked, pero downcast en Solidity >=0.8 NO revierte para tipos menores que 256 bits via explicit cast) es un patron peligroso. En Solidity >=0.8.0, uint48(x) donde x > type(uint48).max SI trunca silenciosamente en versiones < 0.8.19. Verificar version del compilador."
  poc_sketch: ''
  call_stack: ''

- id: M-MATH-05
  tier: 1
  type: property
  description: "Consistencia quote vs dispatch: el monto cobrado por dispatch debe ser <= quoteDispatch para los mismos parametros"
  attack_scenario: "Si requiredHook.quoteDispatch devuelve un valor X en quoteDispatch, pero requiredHook.postDispatch cobra mas que X durante dispatch, el usuario paga mas de lo esperado. Vice versa: si dispatch cobra menos, el hook puede revertir por fondos insuficientes. Inconsistencia entre vista (quote) y mutacion (dispatch) permite front-running del quote."
  impact: "Usuarios pagan mas de lo cotizado, o sus transacciones revert inesperadamente. MEV extractable via manipulacion de quote."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que el nonce es monotonicamente creciente tras cada dispatch
    uint32 nonceBefore = originMailbox.nonce();
    // Tras un dispatch exitoso, nonce debe incrementar exactamente en 1
    uint32 nonceAfter = originMailbox.nonce();
    if (nonceAfter > nonceBefore) {
      eq(uint256(nonceAfter), uint256(nonceBefore) + 1, "M-MATH-05: nonce incremented by more than 1");
    }
  ghost_vars:
  - uint256 internal ghost_lastQuotedFee;
  validated: false
  priority: high
  confidence: 65
  notes: "El invariante real es quote >= actual cost. Pero en el test Chimera no podemos hacer dispatch+quote atomicamente. Usamos nonce monotonicity como proxy -- si nonce salta mas de 1, indica reentrancy o corruption. La inconsistencia quote vs dispatch es mas un concern de integracion que de math pura del Mailbox."
  poc_sketch: ''
  call_stack: ''

- id: M-MATH-06
  tier: 1
  type: property
  description: "Nonce es estrictamente monotonicamente creciente -- nunca puede disminuir ni saltar"
  attack_scenario: "Si un atacante logra decrementar nonce (via reentrancy en hooks que callback al Mailbox, o storage collision en upgrade), puede generar mensajes con IDs duplicados. Dos mensajes diferentes con el mismo nonce producen el mismo ID, y solo uno puede ser procesado (el otro es 'already delivered'). Censura selectiva de mensajes."
  impact: "Censura de mensajes cross-chain -- un atacante puede invalidar mensajes legitimos creando colisiones de nonce."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint32 currentNonce = originMailbox.nonce();
    gte(uint256(currentNonce), uint256(ghost_lastNonce), "M-MATH-06: nonce decreased -- possible reentrancy or storage corruption");
    ghost_lastNonce = currentNonce;
  ghost_vars:
  - uint32 internal ghost_lastNonce;
  validated: false
  priority: high
  confidence: 80
  notes: "dispatch() hace nonce += 1 ANTES de llamar a hooks externos (L301 antes de L306-312). Esto sigue CEI. Pero si un hook reentra a dispatch(), nonce ya fue incrementado, asi que el segundo dispatch usara nonce+1. Esto no causa decremento, pero si un salto inesperado. El invariante verifica que nonce nunca disminuye."
  poc_sketch: ''
  call_stack: ''

