  attack_scenario: "En dispatch(), L306 obtiene requiredValue del hook. L308-309 clampea requiredValue a msg.value si este es menor. Luego L312 calcula msg.value - requiredValue. Si entre L306 y L312 el estado cambia (via reentrancy del requiredHook.postDispatch en L311), requiredValue podria no estar clampeado correctamente. Sin embargo, requiredValue es una variable local, no de storage."
  impact: "Revert de dispatch por underflow -- DoS temporal. No hay perdida de fondos directa."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
