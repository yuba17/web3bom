hypotheses:
- id: AIAR-DD-01
  radar_id: cmn4w4x5y0001ps01u1lnnth2
  poc: test/chimera/aiar/ForkPoC_AIAR-DD-01.sol
  title: unenrollRemoteRouter leaves isms[domain] dirty — permanent domain brick
  description: 'Router._unenrollRemoteRouter(domain) removes the router from _routers
    mapping

    but does NOT clear isms[domain]. AbstractInterchainAccountRouter does NOT override

    _unenrollRemoteRouter to clean up the ISM.


    After unenroll: routers(domain) == bytes32(0) but isms[domain] == oldIsmValue.


    When owner tries to re-enroll via enrollRemoteRouterAndIsm, the check at line
    298-302

    requires BOTH routers(domain) == EMPTY_SALT AND isms[domain] == EMPTY_SALT. Since

    isms[domain] is still the old value, the require ALWAYS reverts.


    Result: the domain is permanently unusable. No function exists to clear isms[domain]

    independently. The contract must be redeployed and all state migrated.

    '
  component: AbstractInterchainAccountRouter
  file: contracts/middleware/AbstractInterchainAccountRouter.sol
  line: 293-305
  severity: high
  confidence: 90
  validated: true
  category: state_inconsistency
  attack_vector: "1. Owner enrolls domain 42 with router=0xABC, ism=0xDEF via enrollRemoteRouterAndIsm\n\
    2. Later, owner needs to change the router (key rotation, migration, etc.)\n3.\
    \ Owner calls unenrollRemoteRouter(42) — inherited from Router.sol\n4. _unenrollRemoteRouter:\
    \ _routers.remove(42) succeeds\n5. isms[42] still == 0xDEF (NOT cleared)\n6. Owner\
    \ calls enrollRemoteRouterAndIsm(42, newRouter, newIsm)\n7. REVERTS: \"router\
    \ and ISM defaults are immutable once set\"\n   because isms[42] != EMPTY_SALT\n\
    8. Domain 42 is permanently bricked — no way to re-enroll\n"
  impact: 'Permanent denial of service for any domain that needs re-configuration.

    The owner cannot update the router or ISM for that domain. All cross-chain

    communication to/from that domain via this router is permanently broken.

    The only fix is deploying a new router contract and migrating all state.


    For Hyperlane with $2.5M bounty, this affects core cross-chain infrastructure.

    If the Polygon InterchainAccountRouter needs to update a domain configuration,

    it would be permanently stuck.

    '
  preconditions:
  - Owner must have previously enrolled a domain with non-zero ISM
  - Owner must call unenrollRemoteRouter (legitimate admin operation)
  immunefi_assessment:
    reportable: true
    likely_severity: high
    risk_of_duplicate: MEDIUM (50%) — requires understanding the interaction between
      Router base and AbstractInterchainAccountRouter
    exclusion_risk: MEDIUM — uses owner function, but it's a bug not an attack
  escalation_verdict: MAINTAIN
