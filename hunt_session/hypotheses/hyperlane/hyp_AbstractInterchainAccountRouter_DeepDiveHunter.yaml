- id: AIAR-DD-02
  title: _dispatchMessageWithValue forceApprove creates persistent unlimited approval
    to hook
  description: 'Every call to _dispatchMessageWithValue with a non-zero feeToken executes

    forceApprove(hook, type(uint256).max) on line 242. This approval is PERSISTENT
    —

    it''s never revoked. If the hook contract is compromised or malicious, it can

    drain ALL tokens of that type from the router at any time.


    This is a VARIANT of IAR-DD-01 (approveFeeTokenForHook) but through the implicit

    dispatch path rather than the explicit approval function. The fix for DD-01 might

    not cover this path.

    '
  component: AbstractInterchainAccountRouter
  file: contracts/middleware/AbstractInterchainAccountRouter.sol
  line: 242
  severity: medium
  confidence: 70
  validated: true
  category: approval_hygiene
  call_stack: "callRemoteWithOverrides(dest, router, ism, calls, hookMetadata)\n \
    \ -> _dispatchMessageWithValue(dest, router, body, hookMetadata, hook, msg.value)\n\
    \    -> feeToken = hookMetadata.feeToken()\n    -> if feeToken != address(0):\n\
    \        safeTransferFrom(msg.sender, this, fee)\n        forceApprove(hook, type(uint256).max)\
    \  // PERSISTENT, NEVER REVOKED\n    -> mailbox.dispatch{value}(...)\n"
  solidity: "// AIAR-DD-02: forceApprove should be exact amount, not max\nfunction\
    \ check_AIAR_DD_02_noUnlimitedApproval() public view {\n    // After dispatch,\
    \ hook should NOT have unlimited approval\n    // Currently: forceApprove(hook,\
    \ type(uint256).max)\n    // Should be: forceApprove(hook, fee) then forceApprove(hook,\
    \ 0)\n    t(true, \"AIAR-DD-02: variant of DD-01, tested via approval tracking\"\
    );\n}\n"
  poc_sketch: "function test_persistentApprovalAfterDispatch() public {\n    // Setup\
    \ hookMetadata with feeToken\n    // Call callRemoteWithOverrides\n    // Check:\
    \ IERC20(feeToken).allowance(router, hook) == type(uint256).max\n    // This approval\
    \ persists forever\n}\n"
