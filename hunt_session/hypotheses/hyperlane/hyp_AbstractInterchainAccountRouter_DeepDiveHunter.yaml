  code_verified_notes: "AbstractInterchainAccountRouter is abstract — deployed as InterchainAccountRouter on Polygon. Bug is in base class code (Router.sol + AbstractInterchainAccountRouter.sol). Verified via source code on GitHub main branch — no fix applied. PoC deploys fresh router on Base fork confirming bug exists in current codebase."
  call_stack: "owner.unenrollRemoteRouter(42)\n  -> Router._unenrollRemoteRouter(42)\n\
    \    -> _routers.remove(42) // SUCCESS — router cleared\n    // isms[42] NOT touched\
