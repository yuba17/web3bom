  attack_scenario: >
    En callRemoteCommitReveal (L610-615), el commitment se despacha con:
    StandardHookMetadata.formatMetadata(0, COMMIT_TX_GAS_USAGE, address(this), bytes(""))
    El refund address es address(this) — el router mismo recibe el refund.
    El reveal (L648-655) usa _hookMetadata del caller, que podría especificar un refund
    address diferente (o ninguno).
    Si el hook cobra gas y luego refund, el refund del commit va al router (no al caller).
    El ETH refundado al router queda en el router y puede ser capturado por el SIGUIENTE
    caller de callRemoteCommitReveal (porque address(this).balance incluye refunds previos).
    COMBINADO con IAR-M-03: el reveal envía address(this).balance que incluiría refunds
    de commits de OTROS usuarios.
  impact: "ETH refundado de commits anteriores se filtra a usuarios posteriores vía address(this).balance en el reveal dispatch — redistribución incorrecta de gas refunds"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track: refund del commit va al router, no al caller
    // El reveal envía address(this).balance que puede incluir refunds acumulados
    uint256 routerBalanceBefore = address(router).balance;
    // Después de callRemoteCommitReveal:
    // commit refund → router (no caller)
    // reveal value = address(this).balance (incluye refunds)
    uint256 routerBalanceAfter = address(router).balance;
    // El router no debería acumular ETH entre llamadas
    eq(routerBalanceAfter, 0, "IAR-M-11: router should not accumulate ETH from refunds");
  ghost_vars:
  - uint256 internal ghost_routerEthBefore;
  validated: false
  priority: high
  confidence: 70
  notes: >
    Este es el complemento de IAR-M-03. El refund address del commit es address(this),
    lo que causa acumulación de ETH en el router. Ese ETH se envía con el reveal del
    SIGUIENTE usuario. Esto es un leak de valor entre usuarios.
  poc_sketch: |
    // 1. Alice llama callRemoteCommitReveal con 2 ETH
    // 2. El hook cobra 0.5 ETH para commit, refund 1.5 ETH al router
    // 3. El reveal se intenta enviar con address(this).balance = 1.5 ETH
    // 4. Bob llama callRemoteCommitReveal con 1 ETH
    // 5. Si queda algo del balance de Alice, Bob's reveal se beneficia
  call_stack: 'callRemoteCommitReveal → formatMetadata(refund=address(this)) → dispatch(commit) → refund → address(this).balance → dispatch(reveal)'

false_positives:
- hunter: MathHunter
  id: IAR-FP-01
  reason: >
    abi.encodePacked en _getSalt con tipos fijos (uint32, bytes32, bytes32, bytes32, bytes32)
    NO tiene ambiguity de packing. Cada tipo tiene tamaño fijo, así que no hay posibilidad
    de que bytes de un campo se "desplacen" a otro. Sería diferente si usara strings o
    bytes dinámicos. Este es un patrón seguro.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: >
      abi.encodePacked con TODOS los tipos de tamaño fijo (uintN, bytesN, address) es seguro
      contra colisiones de packing. Solo es peligroso con tipos dinámicos (string, bytes, arrays).
    briefing_update_applied: false

- hunter: MathHunter
  id: IAR-FP-02
  reason: >
    REVEAL message type bypass de ISM investigado: aunque route() lee ISM de offset diferente
    para REVEAL vs CALLS, handle() ignora mensajes REVEAL (retorna inmediatamente).
    No hay ejecución de calls, así que no hay impacto directo. El único efecto es que el ISM
    CommitmentReadIsm podría ejecutar revealAndExecute durante verify(), pero eso requiere
    un commitment previamente almacenado en la ICA — lo cual requiere haber pasado por el
    flujo legítimo primero.
  investigated_at: '2026-03-24T00:00:00Z'
