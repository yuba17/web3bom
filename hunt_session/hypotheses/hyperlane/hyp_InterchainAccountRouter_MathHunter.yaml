- id: IAR-M-01
  tier: 1
  type: property
  description: "Salt collision en _getSalt: abi.encodePacked con tipos de longitud variable-fija puede producir colisiones si origin+owner se alinean con router+ism diferente"
  attack_scenario: >
    _getSalt usa abi.encodePacked(_origin, _owner, _router, _ism, _userSalt).
    _origin es uint32 (4 bytes), el resto son bytes32. Total = 4+32+32+32+32 = 132 bytes.
    Como todos los campos son de tamaño fijo, NO hay colisión por packing ambiguity.
    Sin embargo, si un atacante puede elegir _userSalt para que el hash coincida con
    una ICA existente de otro owner, obtendría control sobre esa cuenta.
    Esto requiere una preimage collision en keccak256, computacionalmente infeasible.
    PERO: el verdadero riesgo es que en handle(), _sender (la dirección del router remoto)
    se usa como _router en la derivación del salt, y _sender NO está validado contra
    routers enrollados (diseño intencional según comments). Cualquier _sender arbitrario
    desde cualquier chain genera una ICA diferente — esto es correcto pero amerita verificación.
  impact: "Si dos combinaciones diferentes de inputs producen el mismo salt, un atacante controlaría la ICA de otro usuario — robo total de fondos en la ICA"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que salts diferentes para inputs diferentes
    bytes32 salt1 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(0xA)), bytes32(uint256(0xB)), bytes32(uint256(0xC)), bytes32(0)));
    bytes32 salt2 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(0xD)), bytes32(uint256(0xB)), bytes32(uint256(0xC)), bytes32(0)));
    t(salt1 != salt2, "IAR-M-01: different owners must produce different salts");
    // Verify fixed-size packing doesn't allow shifting bytes between fields
    bytes32 salt3 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(0xA)), bytes32(uint256(0xB)), bytes32(uint256(0xC)), bytes32(uint256(1))));
    t(salt1 != salt3, "IAR-M-01: different userSalt must produce different salts");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 40
  notes: >
    abi.encodePacked con todos tipos fijos (uint32, bytes32, bytes32, bytes32, bytes32) es seguro
    contra colisiones de empaquetado. El riesgo real sería una colisión keccak256 que es infeasible.
    Marcado como validated=true porque el encoding es correcto por diseño.
  poc_sketch: ''
  call_stack: ''

- id: IAR-M-02
  tier: 1
  type: property
  description: "Encode/decode roundtrip: los campos owner, ism, salt y calls deben ser idénticos después de encode→decode en InterchainAccountMessage"
  attack_scenario: >
    InterchainAccountMessage.encode() usa abi.encodePacked para prefix (1 byte type + 3x bytes32)
    y abi.encode para calls, luego bytes.concat. El decode usa hardcoded offsets:
    [0:1] = type, [1:33] = owner, [33:65] = ism, [65:97] = salt, [97:] = calls.
    Si el encode produce un layout diferente al esperado por decode, un atacante podría
    craftar un mensaje donde el owner decodificado es diferente al codificado, obteniendo
    control de una ICA ajena. El abi.encodePacked de un enum (uint8) produce 1 byte,
    y de bytes32 produce 32 bytes, por lo tanto el layout es exactamente:
    1 + 32 + 32 + 32 = 97 bytes prefix. Esto coincide con los offsets de decode.
  impact: "Si encode/decode no son simétricos, un atacante podría hacer que handle() derive una ICA con owner/ism/salt diferentes a los que el sender original especificó — controlando fondos ajenos"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Simular el roundtrip encode/decode
    // MessageType.CALLS = 0, ocupa 1 byte en encodePacked
    bytes32 testOwner = bytes32(uint256(0xdeadbeef));
    bytes32 testIsm = bytes32(uint256(0xcafe));
    bytes32 testSalt = bytes32(uint256(42));
    // Verificar que el byte 0 es 0x00 (MessageType.CALLS)
    bytes memory prefix = abi.encodePacked(uint8(0), testOwner, testIsm, testSalt);
    eq(prefix.length, 97, "IAR-M-02: prefix must be exactly 97 bytes");
    // Verificar que decode offsets match
    eq(bytes32(bytes(abi.encodePacked(testOwner))), testOwner, "IAR-M-02: owner roundtrip");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: >
    El encoding es correcto: encodePacked(uint8, bytes32, bytes32, bytes32) = 1+32+32+32 = 97 bytes,
    que coincide exactamente con los offsets de decode. Sin embargo, este es un invariante
    crítico de seguridad que debe ser fuzz-testeado exhaustivamente.
  poc_sketch: ''
  call_stack: ''

- id: IAR-M-03
  tier: 1
  type: property
  description: "callRemoteCommitReveal envía address(this).balance como value del reveal message, que puede incluir ETH de otros usuarios"
  attack_scenario: >
    En callRemoteCommitReveal() (L603-631), el commitment message se envía con msg.value,
    y el reveal message se envía con address(this).balance. Si el contrato tiene ETH residual
    (de receive(), refunds previos, o envíos directos), ese ETH se envía como valor del
    reveal dispatch. Esto significa que:
    1. Usuario A envía 1 ETH para commit-reveal
    2. El commit consume parte del msg.value para gas
    3. El reveal envía address(this).balance que puede incluir ETH de terceros
    4. Un atacante podría depositar ETH al router y luego llamar callRemoteCommitReveal
       para que el reveal se pague con ETH del contrato
    MÁS GRAVE: el primer dispatch (_commitmentMsgId) usa msg.value, y el segundo
    (_revealMsgId) usa address(this).balance. Si el primer dispatch NO consume todo
    msg.value (el hook devuelve cambio), el segundo dispatch captura ese cambio
    MÁS cualquier ETH residual del contrato.
  impact: "Pérdida de ETH residual en el contrato del router — cualquier usuario que use commit-reveal puede drenar el balance del contrato enviándolo como gas fee del reveal message"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Track: el balance del contrato antes y después de callRemoteCommitReveal
    // debe decrementar solo por msg.value del caller, no más
    uint256 balanceBefore = address(router).balance;
    uint256 callerValue = 1 ether;
    // Simular: alguien depositó ETH al router previamente
    // Después del call, el balance debería ser balanceBefore - callerValue (o 0 si insufficient)
    // PERO el código envía address(this).balance en el reveal, que incluye ETH residual
    uint256 balanceAfter = address(router).balance;
    // Si hay ETH residual pre-existente, se pierde
    lte(balanceBefore - balanceAfter, callerValue, "IAR-M-03: router should not spend more than msg.value");
  ghost_vars:
  - uint256 internal ghost_routerBalanceBefore;
  validated: false
  priority: high
  confidence: 75
  notes: >
    Este es el finding más prometedor. La línea 630 address(this).balance es peligrosa
    porque captura todo el ETH del contrato, no solo el remanente del msg.value del caller.
    El router tiene receive() external payable, así que puede acumular ETH.
    Sin embargo, hay que verificar si mailbox.dispatch consume value o lo guarda — si el primer
    dispatch consume todo msg.value, entonces address(this).balance solo tendría ETH residual.
  poc_sketch: |
    // 1. Enviar 1 ETH directo al router (via receive)
    // 2. Llamar callRemoteCommitReveal con 0.1 ETH
    // 3. Verificar que el reveal dispatch envía 1.1 ETH (0.1 residual del commit + 1.0 pre-existente)
    // 4. Ese 1 ETH pre-existente no era del caller
  call_stack: 'callRemoteCommitReveal → _dispatchMessageWithValue(msg.value) → _dispatchMessageWithValue(address(this).balance)'

- id: IAR-M-04
