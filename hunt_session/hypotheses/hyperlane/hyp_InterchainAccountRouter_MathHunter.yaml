    remoto para derivar la dirección de implementación: Create2.computeAddress(bytes32(0),
    keccak256(_implementationBytecode(_router)), _router). Esto asume que el router remoto
    tiene EXACTAMENTE el mismo creationCode de OwnableMulticall. Si el router remoto es una
    versión diferente del contrato (upgrade, fork), el bytecodeHash calculado será incorrecto
    y la dirección retornada no coincidirá con la ICA real.
    Impacto: usuarios envían fondos a una dirección donde no existe contrato o existe un
    contrato diferente. Los fondos quedan atrapados.
