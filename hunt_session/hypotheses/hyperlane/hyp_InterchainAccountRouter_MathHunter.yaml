    uint256 commitQuote = router.quoteGasPayment(destination);
    uint256 revealQuote = router.quoteGasPayment(destination, gasLimit);
    // La suma debe ser >= cada parte (no overflow)
    uint256 total = commitQuote + revealQuote;
    gte(total, commitQuote, "IAR-M-05: overflow in quoteGasForCommitReveal");
    gte(total, revealQuote, "IAR-M-05: overflow in quoteGasForCommitReveal");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 30
  notes: >
