- id: IAR-M-07
  tier: 1
  type: property
  description: "handle() no valida que _sender corresponda a un router enrollado — cualquier _sender genera una ICA válida, potencialmente desplegando proxy a dirección impredecible con ownership del router"
  attack_scenario: >
    En handle() (L134-167), _sender se usa directamente como _router en getDeployedInterchainAccount
    sin verificar que sea un router enrollado. Esto es intencional (ver comment L131:
    "Does not need to be onlyRemoteRouter, as this application is designed to receive
    messages from untrusted remote contracts"). Sin embargo, la ICA desplegada tiene
    owner = address(this) (el router local), y se inicializa con un _sender arbitrario
    en el salt. El riesgo: un atacante en chain A envía un mensaje al router en chain B
    con _sender = dirección arbitraria, desplegando una ICA en chain B que es owned por
    el router. El atacante elige owner/ism/salt en el mensaje, así que controla qué ICA
    se despliega y ejecuta calls en ella.
    WAIT: El owner del OwnableMulticall es el ROUTER (address(this)), no el _owner del mensaje.
    Las calls se ejecutan a través del router. Esto está bien — el router es el único que puede
    llamar multicall en la ICA. Pero: como handle() ejecuta las calls inmediatamente
    (ica.multicall{value}(calls)), y _sender puede ser cualquiera, un atacante controla
    QUÉ calls se ejecutan en la ICA que corresponde a (_origin, _owner, _sender, _ism, _salt).
    Si la ICA ya tiene fondos, el atacante puede drenarlos.
  impact: "Si una ICA acumula fondos (ETH o tokens) y alguien envía un mensaje con el mismo (origin, owner, sender, ism, salt), puede ejecutar calls arbitrarias en esa ICA — drenando fondos"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // La ICA se despliega determinísticamente basada en (origin, owner, sender, ism, salt)
    // Verificar que solo mensajes legítimos pueden ejecutar calls en una ICA dada
    // Si el mailbox valida el origin y sender correctamente, solo el sender real del
    // origin domain puede generar mensajes con ese (origin, sender)
    // PERO: si el ISM es permisivo, cualquiera podría fabricar un mensaje
    address ica1 = address(router.getLocalInterchainAccount(
        uint32(1), bytes32(uint256(0xA)), bytes32(uint256(0xB)), address(0), bytes32(0)
    ));
    address ica2 = address(router.getLocalInterchainAccount(
        uint32(1), bytes32(uint256(0xA)), bytes32(uint256(0xC)), address(0), bytes32(0)
    ));
    t(ica1 != ica2, "IAR-M-07: different senders must produce different ICAs");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: >
    La seguridad de esto depende enteramente del ISM. Si el ISM verifica correctamente que
    el mensaje fue realmente enviado por _sender en _origin, entonces solo el legítimo
    owner puede ejecutar calls en su ICA. Si el ISM es débil o no configurado, esto es
    un bug crítico. Este es más un trust boundary issue que math, pero la derivación del
    salt y la falta de validación de _sender son relevantes.
  poc_sketch: ''
  call_stack: 'handle() → getDeployedInterchainAccount(_origin, _owner, _sender, _ism, _salt) → multicall(calls)'

- id: IAR-M-08
  tier: 2
  type: property
  description: "route() usa InterchainAccountMessage.ism() y InterchainAccountMessageReveal.revealIsm() con diferentes offsets — si un mensaje es malinterpretado como el tipo incorrecto, se lee un ISM incorrecto"
  attack_scenario: >
    En route() (L170-191):
    - Para REVEAL: revealIsm lee _body[1:33] como ISM
    - Para CALLS/COMMITMENT: ism lee _body[33:65] como ISM
    El messageType se determina por _body[0]. Si un atacante crafta un mensaje donde
    byte 0 = 2 (REVEAL) pero el contenido real es un CALLS message, el ISM se lee de
    [1:33] en vez de [33:65]. Esto significa que el owner field (que está en [1:33] para
    CALLS) se interpreta como el ISM address.
    Esto permitiría al atacante elegir qué ISM verifica el mensaje, potencialmente usando
    un ISM permisivo que acepta todo.
    CRITICAL: Si el atacante pone su dirección controlada como owner (bytes [1:33]),
    y envía el mensaje como tipo REVEAL, route() interpretará esa dirección como el ISM.
    Si el atacante deploya un contrato en esa dirección que implementa ISM y retorna true,
    el mensaje se verifica con el ISM del atacante.
    PERO: handle() también lee messageType. Si es REVEAL, handle() retorna inmediatamente
    sin ejecutar nada (L141-147). Así que el atacante no puede ejecutar calls.
    CONCLUSION: El tipo REVEAL solo es "procesado" por el ISM verification, no por handle().
    Si un atacante usa tipo REVEAL para bypass ISM, handle() ignora el mensaje.
  impact: "Un atacante podría usar REVEAL type para seleccionar ISM arbitrario, pero handle() ignora mensajes REVEAL — no hay ejecución de calls, solo un noop"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Para mensajes REVEAL, route() lee ISM de offset [1:33]
    // Para mensajes CALLS, route() lee ISM de offset [33:65]
    // Verificar que los offsets son correctos y no se confunden
    bytes memory revealMsg = abi.encodePacked(uint8(2), bytes32(uint256(0xISM)), bytes32(uint256(0xCOMMIT)));
    // Byte 0 = 2 (REVEAL), [1:33] = ISM, [33:65] = commitment
    // Si esto se interpretara como CALLS: [1:33] = owner, [33:65] = ism
    // El ism de CALLS sería 0xCOMMIT en vez de 0xISM
    t(true, "IAR-M-08: verify offset separation between message types");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 65
  notes: >
    Investigado y descartado parcialmente. Aunque route() lee diferentes offsets según
    messageType, handle() también despacha por messageType. Para REVEAL, handle() retorna
    inmediatamente sin ejecutar nada. Así que abusar del tipo REVEAL para elegir ISM no
    tiene beneficio práctico — el mensaje no ejecuta calls.
    SIN EMBARGO, el commitment en un REVEAL message sí se procesa por el ISM — si el ISM
    es CommitmentReadIsm, podría ejecutar revealAndExecute. Esto necesita más investigación.
  poc_sketch: ''
  call_stack: 'route() → reads messageType → selects ISM based on type'

