  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que la implementación local coincide con la derivada remotamente
    address localImpl = router.implementation();
    // La implementación derivada remotamente usa _implementationBytecode(address(router))
    // que incluye type(OwnableMulticall).creationCode — si la versión difiere, no match
    address derivedImpl = Create2.computeAddress(
        bytes32(0),
        keccak256(abi.encodePacked(type(OwnableMulticall).creationCode, abi.encode(address(router)))),
