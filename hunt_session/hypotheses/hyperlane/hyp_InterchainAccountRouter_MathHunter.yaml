    eq(localImpl, derivedImpl, "IAR-M-04: local implementation must match Create2 derivation");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    Esto es más un riesgo operacional que un bug explotable. El bytecode de OwnableMulticall
