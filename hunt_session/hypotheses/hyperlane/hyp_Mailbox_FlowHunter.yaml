  notes: "recipientIsm() L443-450: if staticcall succeeds AND returnData is non-empty AND decoded address != 0, use it. Otherwise return defaultIsm. The check is thorough. The only risk is if defaultIsm itself is address(0) -- but setDefaultIsm requires isContract. However, before initialize() is called, defaultIsm IS address(0). If process() is called before initialize(), recipientIsm falls back to address(0). But OwnableUpgradeable would likely block this path."
  poc_sketch: ''
