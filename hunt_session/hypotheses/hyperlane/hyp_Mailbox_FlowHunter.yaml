state_machine:
  states: [UNINITIALIZED, IDLE, DISPATCHING, PROCESSING, DELIVERED]
  transitions:
    - from: UNINITIALIZED, to: IDLE, via: "initialize()", guard: "initializer modifier"
    - from: IDLE, to: DISPATCHING, via: "dispatch()", guard: "none -- permissionless"
    - from: DISPATCHING, to: IDLE, via: "dispatch() returns", guard: "hooks complete"
    - from: IDLE, to: PROCESSING, via: "process()", guard: "!delivered(id) && version && destination"
    - from: PROCESSING, to: DELIVERED, via: "process() completes", guard: "ism.verify && handle succeeds"
    - from: DELIVERED, to: DELIVERED, via: "process() reverts on replay", guard: "delivered(id) == true"
  anomalies:
    - type: cei_violation, state: PROCESSING, description: "deliveries[_id] is written BEFORE ism.verify() and recipient.handle() -- if ism.verify reverts, the delivery record persists as dirty state? No -- revert rollbacks storage. But if ism.verify() has a side effect that reads delivered() during the call, it sees true before verification."
    - type: reentrancy_window, state: DISPATCHING, description: "nonce and latestDispatchedId updated BEFORE external calls to requiredHook.postDispatch and hook.postDispatch -- reentrancy into dispatch() would use incremented nonce (safe for uniqueness but latestDispatchedId would be overwritten)"
    - type: illegal_transition, from: PROCESSING, to: PROCESSING, via: "recipient.handle() calls process() reentrantly for a different message -- no reentrancy guard"

invariants:
- id: M-F-01
  tier: 1
  type: property
  description: "Nonce must be strictly monotonically increasing -- each dispatch increments by exactly 1"
  attack_scenario: "If nonce skips or repeats, message IDs could collide or be predicted incorrectly, breaking deduplication on destination chains. A reentrant call to dispatch() from a hook could cause nonce to increment multiple times in a single user tx, which is fine for uniqueness but breaks sequential expectations."
  impact: "Message ID collision could allow replay attacks on destination or skip messages"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    uint32 currentNonce = originMailbox.nonce();
    gte(uint256(currentNonce), uint256(ghost_lastNonce), "M-F-01: nonce decreased");
    if (ghost_lastNonce > 0) {
      lte(uint256(currentNonce), uint256(ghost_lastNonce) + ghost_callRemoteCount + 10, "M-F-01: nonce jumped unexpectedly");
    }
    ghost_lastNonce = currentNonce;
  ghost_vars:
  - uint32 internal ghost_lastNonce;
  validated: false
  priority: high
  confidence: 75
  notes: "dispatch() does nonce += 1 before external calls to hooks. Reentrancy from hook.postDispatch back into dispatch() would increment nonce again -- safe for uniqueness but latestDispatchedId would be overwritten to the reentrant message's ID."
  poc_sketch: ''
  call_stack: ''

- id: M-F-02
  tier: 1
  type: property
  description: "A message marked as delivered (deliveries[id].blockNumber > 0) must never be processable again"
  attack_scenario: "If delivered() returns true but process() does not revert, an attacker could replay a cross-chain message to double-execute recipient.handle(), draining funds from the recipient contract."
  impact: "Double-spend on cross-chain transfers, duplicate governance executions"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // After any process call, delivered must be true and re-processing must revert
    // This is tested by tracking all processed IDs
    if (ghost_lastProcessedId != bytes32(0)) {
      t(destMailbox.delivered(ghost_lastProcessedId), "M-F-02: processed msg not marked delivered");
    }
  ghost_vars:
  - bytes32 internal ghost_lastProcessedId;
  validated: false
  priority: high
  confidence: 85
  notes: "The check `require(delivered(_id) == false)` happens BEFORE the EFFECTS block that writes deliveries[_id]. This is correct CEI for the replay check. However, the EFFECTS happen BEFORE ism.verify() -- so if ism.verify() reverts, the entire tx reverts and storage is rolled back. The invariant holds because EVM reverts roll back all state."
  poc_sketch: ''
  call_stack: ''

- id: M-F-03
  tier: 1
  type: property
  description: "process() writes delivery record BEFORE ism.verify() -- effects before interactions. If ism.verify() calls back into Mailbox, delivered() returns true for this message."
  attack_scenario: "A malicious ISM could call process() reentrantly with a DIFFERENT message during verify(). Since there is no reentrancy guard, this second process() would succeed. The ISM for the second message could be the same malicious ISM, creating a chain of message injections without proper verification. The first message's ISM never actually returns true, but the delivery record already exists."
  impact: "If ism.verify() reverts after a reentrant process() succeeds, the reentrant message IS delivered but the original message's delivery is rolled back. However the reentrant message used a potentially malicious ISM path."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Track that deliveries only increase, never decrease
    // After process, the count of delivered messages should match ghost_handleCount
    uint256 totalDelivered = 0;
    for (uint256 i = 0; i < ghost_processedIds.length; i++) {
      if (destMailbox.delivered(ghost_processedIds[i])) {
        totalDelivered++;
      }
    }
    eq(totalDelivered, ghost_handleCount, "M-F-03: delivered count != handle count");
  ghost_vars:
  - bytes32[] internal ghost_processedIds;
  validated: false
  priority: high
  confidence: 60
  notes: "The real question is: can ism.verify() reenter process() with a different message? Yes -- no reentrancy guard. But the second message also needs its ISM to verify. If both ISMs are controlled by attacker, this is a governance/configuration issue, not a Mailbox bug per se. The ISM is trusted for that recipient. HOWEVER: if the recipient specifies no ISM and falls back to defaultIsm, and defaultIsm is the malicious one (set by compromised owner), then all messages to all recipients can be force-delivered."
  poc_sketch: ''
  call_stack: ''

- id: M-F-04
  tier: 1
  type: property
  description: "ETH value sent to dispatch() must be fully forwarded to hooks -- no ETH stuck in Mailbox"
  attack_scenario: "If requiredHook.quoteDispatch returns a value and the arithmetic msg.value - requiredValue underflows or leaves dust, ETH could be permanently locked in the Mailbox contract. Since Mailbox has no sweep/withdraw function, any stuck ETH is lost forever."
  impact: "Permanent loss of ETH stuck in Mailbox -- no recovery function exists"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 mailboxBalance = address(originMailbox).balance;
    lte(mailboxBalance, ghost_totalMsgValueSent, "M-F-04: Mailbox accumulated ETH beyond sent value");
    // Ideally Mailbox should hold 0 ETH after each dispatch
    // but hooks may forward back. Check it does not grow unboundedly.
    lte(mailboxBalance, 1 ether, "M-F-04: Mailbox holding significant ETH");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: "In dispatch(): requiredValue is clamped to msg.value if underpaying (L308-309). Then requiredHook gets requiredValue, hook gets msg.value - requiredValue. Total = msg.value. Arithmetic is safe. But if either hook reverts or does not accept the ETH, the entire dispatch reverts. If a hook accepts ETH but does not use it (no payable fallback forwards), the ETH sits in the hook, not Mailbox. The real risk is if a hook sends ETH back to Mailbox via a callback -- Mailbox has no receive/fallback so it would revert. Safe by design."
  poc_sketch: ''
  call_stack: ''

- id: M-F-05
  tier: 1
  type: property
  description: "process() forwards all msg.value to recipient.handle() -- no value retained by Mailbox"
  attack_scenario: "If process() is called with msg.value but handle() does not receive it (or receives partial), the ETH is stuck in Mailbox. Since Mailbox lacks receive/fallback/withdraw, the ETH is permanently lost."
  impact: "ETH loss for relayers who send value with process() calls"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    uint256 destMailboxBal = address(destMailbox).balance;
    // destMailbox should not accumulate ETH from process() calls
    lte(destMailboxBal, 1 ether, "M-F-05: destMailbox holding significant ETH");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 65
  notes: "L241: handle{value: msg.value} forwards ALL msg.value. If handle reverts, entire process() reverts. If handle succeeds, all value is in the recipient. The only way ETH stays in Mailbox is if handle() sends it back, which is unlikely but possible."
  poc_sketch: ''
  call_stack: ''

- id: M-F-06
  tier: 1
  type: property
  description: "latestDispatchedId must match the ID of the most recently dispatched message, and must not be corrupted by reentrancy"
  attack_scenario: "If hook.postDispatch reenters dispatch(), latestDispatchedId gets overwritten to the reentrant message's ID. Any post-dispatch hook that relies on latestDispatchedId for auth (e.g., MerkleTreeHook checks latestDispatchedId == message.id()) would authorize the wrong message, potentially allowing unauthorized merkle insertions."
  impact: "Reentrant dispatch could corrupt latestDispatchedId, breaking hooks that rely on it for authorization. MerkleTreeHook.postDispatch uses latestDispatchedId to authenticate the message being inserted."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a dispatch, latestDispatchedId should be the ID of the last dispatched message
    // Reentrancy would overwrite this -- check it matches last known
    bytes32 currentLatest = originMailbox.latestDispatchedId();
    t(currentLatest != bytes32(0) || originMailbox.nonce() == 0, "M-F-06: latestDispatchedId is zero after dispatch");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 72
  notes: "This is the most interesting FlowHunter finding. In dispatch() L300-312: latestDispatchedId = id; nonce += 1; then INTERACTIONS with hooks. If requiredHook.postDispatch or hook.postDispatch calls dispatch() reentrantly, latestDispatchedId is overwritten. When the reentrant dispatch returns, the ORIGINAL hook.postDispatch (L312) continues but latestDispatchedId now points to the REENTRANT message. If requiredHook uses latestDispatchedId for auth (MerkleTreeHook does: require(mailbox.latestDispatchedId() == id)), the reentrant call's requiredHook.postDispatch would see the reentrant ID and pass. But when we return to the outer requiredHook.postDispatch, it already ran before the reentrancy (L311). The optional hook.postDispatch (L312) runs after -- if IT checks latestDispatchedId, it sees the wrong one."
  poc_sketch: |
    // 1. Deploy MaliciousHook that calls dispatch() in postDispatch()
    // 2. Call dispatch() with MaliciousHook as custom hook
    // 3. In postDispatch, MaliciousHook calls dispatch() again
    // 4. latestDispatchedId is overwritten
    // 5. Any subsequent hook reading latestDispatchedId sees wrong ID
  call_stack: ''

- id: M-F-07
  tier: 2
  type: property
  description: "recipientIsm() must never return address(0) as ISM -- always falls back to defaultIsm"
  attack_scenario: "If recipientIsm() returns an ISM at address(0) or a non-contract address, ism.verify() would call into a zero/EOA address. Solidity high-level calls to non-contracts succeed with empty return data (for functions returning void) or revert. For bool-returning verify(), calling address(0) would return false (empty returndata decoded as false) and process would revert."
  impact: "DoS -- messages to recipients with broken ISM specification cannot be delivered"
  impact_rating: Low
