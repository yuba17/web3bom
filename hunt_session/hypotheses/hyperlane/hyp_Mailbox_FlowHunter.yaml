- id: M-F-09
  tier: 1
  type: property
  description: "No reentrancy guard on process() -- reentrant process() with different message ID during recipient.handle() callback can process arbitrary additional messages"
  attack_scenario: "A malicious recipient's handle() function calls process() with a different message+metadata. If the attacker controls an ISM that returns true for verify(), they can force-deliver arbitrary messages during the handle callback. The outer process() has already written deliveries[originalId] and will complete normally. This is bounded by the fact that each message needs its own ISM to verify, but if defaultIsm is permissive or the recipient specifies a malicious ISM, this enables message injection."
  impact: "Arbitrary message delivery during handle callback if ISM is compromised for the target recipient"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Process should not be reenterable for the SAME message ID
    // Different message IDs are OK by design (no reentrancy guard)
    // Verify that a processed ID stays processed
    if (ghost_lastProcessedId != bytes32(0)) {
      t(destMailbox.delivered(ghost_lastProcessedId), "M-F-09: previously processed ID no longer delivered");
      uint48 processedBlock = destMailbox.processedAt(ghost_lastProcessedId);
      t(processedBlock > 0, "M-F-09: processedAt returned 0 for delivered message");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: "No ReentrancyGuard on process(). Reentrancy from recipient.handle() -> process() with different ID would succeed. This is arguably by design -- the Mailbox is a message bus and each message has independent delivery state. The security boundary is the ISM, not the Mailbox itself. However, read-only reentrancy could be an issue if any external contract reads Mailbox state (nonce, latestDispatchedId) during a callback."
  poc_sketch: ''
  call_stack: ''

- id: M-F-10
  tier: 2
  type: property
  description: "delivered() uses blockNumber > 0 as sentinel -- block 0 messages appear undelivered"
  attack_scenario: "If a message is processed at block.number == 0 (genesis block or certain L2s), delivered() returns false even though the message was processed. An attacker could replay this message. On mainnet block 0 is unreachable, but on some L2s (Arbitrum, zkSync) block.number can behave differently."
  impact: "Message replay on chains where block.number can be 0 during process()"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that block.number > 0 in the test environment
    // This is a chain-specific concern
    t(block.number > 0, "M-F-10: block.number is 0 -- delivered() sentinel would fail");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: "L362: delivered() returns blockNumber > 0. L227: blockNumber = uint48(block.number). If block.number == 0, the message is stored but delivered() returns false, allowing replay. In practice, block 0 is the genesis block and no user transactions occur there. On L2s, block.number is typically > 0 by the time user txs execute. This is a theoretical edge case but worth noting for exotic chains."
  poc_sketch: ''
  call_stack: ''

false_positives:
- hunter: FlowHunter
  id: M-F-FP-01
  reason: "dispatch() has no reentrancy guard, but reentrancy through hooks does not violate any critical invariant -- nonce still increments (uniqueness preserved), latestDispatchedId overwrite is intentional (hooks read it per-call). The only concern is if a hook caches latestDispatchedId before the reentrant call and uses the stale value after -- but hooks read it fresh. This is by design per Hyperlane architecture."
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "Hyperlane Mailbox dispatch() is intentionally reentrancy-safe through nonce monotonicity and per-call latestDispatchedId reads in hooks. No reentrancy guard needed."
    briefing_update_applied: false

- hunter: FlowHunter
  id: M-F-FP-02
  reason: "process() writing deliveries BEFORE ism.verify() looks like a CEI violation, but if verify() reverts, the entire tx reverts and storage is rolled back. The pre-write only matters if verify() does NOT revert but has side effects that observe the delivery state -- which is ISM-specific behavior, not a Mailbox bug."
  investigated_at: '2026-03-24T19:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "Mailbox process() writes delivery before ISM verify -- this is intentional to prevent reentrancy-based double-processing. If verify reverts, EVM rollback undoes the write. Not a CEI violation in the traditional sense."
    briefing_update_applied: false
