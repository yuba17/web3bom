- id: IAR-DD-03
  title: CommitmentReadIsm.verify does not validate ICA address against message —
    CCIP redirect
  tier: 1
  type: property
  confidence: 70
  severity: high
  description: 'CommitmentReadIsm.verify() at line 52-78 extracts the ICA address
    from _metadata[:20]

    (provided by the off-chain CCIP-read service), NOT from the message itself. The
    verify

    function checks that keccak256(_metadata[20:]) matches the commitment in the message,

    but NEVER validates that the ICA address corresponds to the message''s origin/sender/ISM.


    A malicious or compromised CCIP-read service can provide a DIFFERENT ICA address
    in the

    metadata. If that ICA has a pending commitment with the SAME hash (same salt+calls),
    the

    calls execute on the WRONG ICA.


    More critically: the ICA address validation is completely absent. The CCIP service
    is a

    TRUSTED third party that can redirect execution to ANY ICA contract. This breaks
    the

    security model where only the ISM validators should be trusted.


    The fix is trivial: derive the expected ICA address from the message fields (origin,

    sender, ISM, salt) and require it matches _metadata[:20].

    '
  affected_line: CommitmentReadIsm.sol:52-78
  attack_scenario: '1. UserA commits (salt=X, calls=Y) → ICA_A.setCommitment(hash(X,Y))

    2. UserB commits SAME (salt=X, calls=Y) → ICA_B.setCommitment(hash(X,Y))

    3. CCIP service (compromised) receives reveal for UserA

    4. CCIP returns metadata = [ICA_B_ADDRESS, X, Y] instead of [ICA_A_ADDRESS, X,
    Y]

    5. verify(): keccak256(X,Y) == commitment ✓ (hash matches)

    6. verify(): ica = ICA_B, calls revealAndExecute on ICA_B instead of ICA_A

    7. UserB''s commitment is consumed, UserA''s commitment stuck permanently

    VERDICT: HIGH — requires compromised CCIP service but NO validator collusion

    '
  poc: hyperlane-monorepo/solidity/test/IAR-DD-03_CcipRedirect.t.sol
  escalation_verdict: 'MAINTAINS HIGH. CCIP service is a trusted third party that
    can redirect execution

    to any ICA with matching commitment hash. No validator collusion needed.

    ICA address extracted from metadata without validation against message fields.

    Requires compromised CCIP service — external trust assumption.

    '
  variant_hunt: 'CommitmentReadIsm is the only ISM that uses unvalidated metadata
    for ICA address.

    Other ISMs (multisig, aggregation, routing) don''t have this pattern.

    VERDICT: No additional variants.

    '
  onchain_verified: true
  onchain_notes: 'callRemoteCommitReveal confirmed in deployed Polygon router (selector
    0x802d0616).

    CommitmentReadIsm deployed as part of router constructor.

    '
