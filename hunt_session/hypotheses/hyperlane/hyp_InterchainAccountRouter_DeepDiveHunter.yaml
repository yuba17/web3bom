  redteam_notes: 'Ronda 0: L65 extracts ICA from metadata[:20], no validation. Confirmed.

    Atacante 1: Requires compromised CCIP service — trust assumption.

    Atacante 2: Two ICAs with same commitment is unlikely but constructible.

    Atacante 3: Not patched. Fix is trivial (derive ICA from message).

    Atacante 4: In-scope Immunefi. PoC 2/2. Trust assumption may lower severity.

    VERDICT: REPORT — missing validation is a design flaw regardless of CCIP trust.

    '
  status: hypothesis
  validated: true
  call_stack: "Mailbox.process(revealMessage)\n  → router.route(message) → returns\
    \ CommitmentReadIsm\n  → CommitmentReadIsm.getOffchainVerifyInfo() → CCIP off-chain\
    \ lookup\n  → relayer fetches from CCIP service → gets (ica, salt, calls)\n  →\
    \ CommitmentReadIsm.verify(_metadata=[ica,salt,calls], _message)\n    → keccak256(_metadata[20:])\
    \ == msgCommitment  // checks hash only\n    → address(_metadata[:20])  // ICA\
    \ NOT validated against message\n    → ica.revealAndExecute(calls, salt)  // executes\
