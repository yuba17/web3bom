- id: IAR-DD-05
  title: Atomic multicall in handle() — single reverting call permanently blocks message
  tier: 1
  type: property
  confidence: 65
  severity: medium
  description: 'InterchainAccountRouter.handle() at line 163 calls ica.multicall{value:
    msg.value}(calls).

    Inside CallLib.multicall(), calls are executed sequentially and atomically — if
    ANY call

    reverts, the entire multicall reverts, and handle() reverts, and Mailbox.process()
    reverts.


    In Hyperlane, a reverted process() means the message cannot be delivered. There
    is no

    built-in retry mechanism for the same message ID. The relayer will retry, but
    if the call

    always reverts (e.g., target contract paused, or call requires specific state
    that no longer

    exists), the message is permanently stuck.


    This is a known pattern in cross-chain messaging but is particularly dangerous
    here because:

    1. The ICA owner on the origin chain cannot cancel or modify the pending message

    2. The calls were encoded at dispatch time on the origin chain

    3. If the target contract state changes between dispatch and delivery, the call
    may always fail

    4. There is no fallback or error-handling path in handle()


    Combined with the commit-reveal pattern: a stuck COMMITMENT message means the
    REVEAL cannot

    execute either, permanently locking any value associated with the commit-reveal
    flow.

    '
  affected_line: InterchainAccountRouter.sol:161-163, OwnableMulticall.sol:25-29
  attack_scenario: '1. User dispatches callRemote with calls = [approve(token, spender,
    amount)]

    2. Before delivery, the target token pauses all transfers (e.g., USDC blacklist)

    3. Relayer tries to process() — multicall reverts on approve() because token is
    paused

    4. Message cannot be delivered, no retry with different calls possible

    5. If ETH was sent with msg.value, it remains in the Mailbox

    6. If the user had a sequence of operations depending on this ICA call, everything
    is stuck

    Adversarial variant:

    1. Attacker monitors pending ICA messages for a target ICA

    2. Attacker front-runs delivery by changing target contract state

    3. The ICA call now always reverts — permanent DoS of the ICA

    VERDICT: MEDIUM — permanent message stuck, no recovery mechanism

    '
  poc: hyperlane-monorepo/solidity/test/IAR-DD-05_StuckMessage.t.sol
