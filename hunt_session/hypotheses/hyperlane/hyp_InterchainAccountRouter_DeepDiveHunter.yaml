    This inconsistency is clearly a bug, not a design choice.

    Deployed on Polygon: OwnableMulticall per-ICA, callRemoteCommitReveal selector
    exists.

    '
  variant_hunt: 'revealAndExecute is the ONLY function in OwnableMulticall without
