- id: IAR-DD-04
  title: revealAndExecute has no access control — front-running breaks commit-reveal
    privacy
  tier: 1
  type: property
  confidence: 75
  severity: high
  description: 'OwnableMulticall.revealAndExecute() at line 52 has NO access control
    modifier. It is

    designed to be called by CommitmentReadIsm.verify() during the CCIP-read flow,
    but ANYONE

    can call it if they know the (calls, salt) matching a pending commitment.


    The commit-reveal pattern exists specifically to protect swap calldata from front-running

    (see line 565: "Useful for when we want to keep calldata secret, e.g. when executing
    a swap").

    But the reveal happens via CCIP callback, which means:


    1. The relayer calls Mailbox.process() with metadata from the CCIP service

    2. This metadata contains the PLAINTEXT (ica, salt, calls)

    3. A mempool observer sees this transaction BEFORE it''s mined

    4. The observer extracts (calls, salt) from the calldata

    5. The observer front-runs by calling ica.revealAndExecute(calls, salt) directly

    6. The commitment is consumed, the original CCIP verify() fails


    This completely breaks the privacy guarantee of commit-reveal. The intended MEV
    protection

    (hiding swap details) is negated because the reveal transaction itself leaks the
    data.


    Combined with the multicall execution: the front-runner executes the user''s swap
    calls,

    potentially extracting MEV that the commit-reveal was designed to prevent.

    '
  affected_line: OwnableMulticall.sol:52-71
  attack_scenario: '1. User commits a DEX swap via callRemoteCommitReveal (hiding
    swap details)

    2. Relayer picks up the REVEAL message, fetches (ica, salt, calls) from CCIP service

    3. Relayer submits Mailbox.process() tx with plaintext metadata

    4. MEV bot sees the tx in mempool, extracts (calls, salt)

    5. Bot calls ica.revealAndExecute(calls, salt) in a bundle BEFORE the process()
    tx

    6. Bot sandwiches: front-run the swap reveal with their own trades

    7. Original Mailbox.process() fails because commitment already consumed

    VERDICT: MEDIUM — breaks core security property of commit-reveal

    '
  poc: hyperlane-monorepo/solidity/test/IAR-DD-04_RevealFrontRun.t.sol
