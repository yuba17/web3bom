component: AbstractMultisigIsm
hunter: DoSHunter
date: '2026-03-24'
scope: Hyperlane Multisig ISM (gas griefing, permanent blocking, DoS vectors)
bounty: Immunefi $2.5M critical / $200K high
honest_assessment: |
  verify() is a view function with bounded gas costs. The main gas consumers
  are ECDSA.recover (ecrecover precompile, ~3000 gas each) and the two-pointer
  loop. With max 255 validators and 255 threshold, worst case is
  255 * 3000 + 255 * 255 pointer iterations ≈ 830K gas. High but well within
  block gas limits (30M+). There is no permanent DoS vector because the ISM
  has no mutable state — it can't be "bricked."

  The only interesting DoS vector is at the Mailbox level: if an ISM is
  configured that always reverts, messages to that recipient are permanently
  undeliverable. But that's a configuration issue, not an ISM code bug.

  I found NO critical or high DoS bugs.

invariants:
- id: ISM-D-01
  title: "verify() gas is bounded by O(threshold * validatorCount)"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    The two-pointer algorithm in verify() has worst-case complexity of
    O(threshold + validatorCount) for the pointer traversal, plus
    O(threshold) ECDSA.recover calls. Total gas:

    - ECDSA.recover: ~3000 gas per call (ecrecover precompile)
    - Loop iterations: at most validatorCount total (pointer only moves forward)
    - Memory: validators array allocation ~validatorCount * 32 bytes

    Worst case (threshold=255, validators=255):
    - 255 * 3000 = 765,000 gas for ecrecover
    - 255 loop iterations for pointer = ~25,500 gas
    - Memory: ~8,160 bytes = negligible
    - Total: ~800K gas — well within any block gas limit

    This is NOT a DoS concern. Even the worst case is <3% of a 30M block.
  solidity: |
    function check_ISM_D01_verify_gas_bounded() public {
        uint256 gasBefore = gasleft();
        bool result = ism.verify(validMetadata, validMessage);
        uint256 gasUsed = gasBefore - gasleft();
        // Even worst case should be under 1M gas
        assert(gasUsed < 1_000_000);
    }
  validated: true
  status: not_a_bug
  notes: |
    The two-pointer is O(n) not O(n^2). Each pointer only moves forward.
    The inner while loop's total iterations across all outer loop iterations
    is bounded by validatorCount. This is efficient and gas-safe.

- id: ISM-D-02
  title: "Malformed metadata causes revert, not infinite loop"
  tier: 2
  type: property
  confidence: 90
  severity: low
  description: |
    Various malformed metadata scenarios:

    1. Empty metadata: signatureAt reads zeros → ECDSA.recover returns
       address(0) → not in validator set → revert("!threshold"). SAFE.

    2. Truncated metadata: same as empty — zero-padded calldataload.
       SAFE — reverts.

    3. Extra bytes after signatures: ignored. verify() only reads
       threshold signatures. SAFE — no effect.

    4. metadata.length < SIGNATURES_OFFSET: Solidity 0.8 reverts on
       underflow when computing signatureCount. But verify() doesn't
       use signatureCount — it uses threshold directly. signatureAt
       with offset beyond calldata just reads zeros. SAFE — reverts.

    5. Signatures that recover to address(0): treated as invalid signer,
       fails validator match (assuming no address(0) in set). SAFE.

    No infinite loop possible — the outer loop runs exactly threshold times,
    the inner loop moves validatorIndex strictly forward and is bounded
    by validatorCount.
  solidity: |
    function check_ISM_D02_malformed_metadata_reverts() public {
        // Empty metadata should revert, not hang
        bytes memory emptyMeta = new bytes(0);
        try ism.verify(emptyMeta, validMessage) returns (bool) {
            assert(false); // Should not succeed with empty metadata
        } catch {
            // Expected — revert on malformed metadata
        }
    }
  validated: true
  status: not_a_bug
  notes: |
    All malformed metadata paths lead to revert, never to infinite loops
    or excessive gas consumption. The two-pointer has strict termination
    guarantees.

- id: ISM-D-03
  title: "Validator set can't be changed after deployment — no griefing via set manipulation"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    MetaProxy ISMs have their validator set baked into the contract bytecode
    at deployment time. There is no setter function, no admin key, no way
    to modify the validator set after deployment. This means:

    1. No griefing by modifying validators to cause verify() to always fail
    2. No rug pull by reducing threshold after deployment
    3. No front-running of configuration changes

    To change the validator set, a new ISM must be deployed and the Mailbox
    must be reconfigured to use it. This reconfiguration is a Mailbox
    governance action, not an ISM vulnerability.
  solidity: |
    function check_ISM_D03_immutable_validator_set() public {
        // Validator set is immutable (in bytecode via MetaProxy)
        (address[] memory v1, uint8 t1) = ism.validatorsAndThreshold(msg1);
        // ... some time passes, other transactions happen ...
        (address[] memory v2, uint8 t2) = ism.validatorsAndThreshold(msg1);
        assert(t1 == t2);
        assert(v1.length == v2.length);
        for (uint256 i = 0; i < v1.length; i++) {
            assert(v1[i] == v2[i]);
        }
    }
  validated: true
  status: not_a_bug
  notes: |
    Immutability is guaranteed by MetaProxy design. The "set" is in bytecode,
    not storage. This is a strong security property.

- id: ISM-D-04
  title: "MerkleLib.branchRoot has fixed 32 iterations — no gas variability"
  tier: 2
  type: property
  confidence: 95
  severity: low
  description: |
    branchRoot always loops exactly 32 times regardless of input. Each
    iteration does one keccak256 of 64 bytes (~36 gas) plus comparison
    and shift operations. Total: ~32 * 50 = ~1,600 gas. This is constant
    and negligible. No DoS vector here.
  solidity: |
    function check_ISM_D04_branchRoot_fixed_gas() public {
        // branchRoot always costs the same regardless of inputs
        uint256 gas1 = gasleft();
        MerkleLib.branchRoot(bytes32(0), proof, 0);
        uint256 cost1 = gas1 - gasleft();

        uint256 gas2 = gasleft();
        MerkleLib.branchRoot(bytes32(uint256(1)), proof, type(uint32).max);
        uint256 cost2 = gas2 - gasleft();

        // Gas should be identical (or very close due to memory expansion)
        assert(cost1 == cost2);
    }
  validated: true
  status: not_a_bug
  notes: Fixed loop, fixed gas. Not exploitable.

- id: ISM-D-05
  title: "Relayer-level DoS — crafted metadata wastes gas but always reverts"
  tier: 2
  type: property
  confidence: 85
  severity: low
  description: |
    A malicious relayer could submit metadata with invalid signatures,
    causing verify() to consume gas (ecrecover calls) before reverting.
    The caller (Mailbox.process()) pays the gas.

    Impact analysis:
    - Mailbox.process() is called by relayers, who pay their own gas
    - A malicious relayer griefing themselves is not a vulnerability
    - If a third party calls process() with bad metadata, they waste
      their own gas — again, not a vulnerability
    - The recipient's message remains undelivered but can be retried
      with correct metadata by any other relayer

    There is no permanent DoS: the message can always be delivered later
    with valid metadata. The ISM has no state to corrupt.
  solidity: |
    function check_ISM_D05_no_permanent_dos() public {
        // Bad metadata fails but doesn't prevent future delivery
        bytes memory badMeta = hex"deadbeef";
        try mailbox.process(badMeta, validMessage) {
            assert(false);
        } catch {}

        // Good metadata still works after bad attempt
        mailbox.process(validMetadata, validMessage);
        assert(mailbox.delivered(messageId));
    }
  validated: true
  status: not_a_bug
  notes: |
    Temporary gas waste is not a DoS in the Immunefi sense. No funds at
    risk, no permanent blocking. Relayer redundancy is a core Hyperlane
    design assumption.

- id: ISM-D-06
  title: "ecrecover precompile failure returns address(0) — handled correctly"
  tier: 2
  type: property
  confidence: 90
  severity: low
  description: |
    If ecrecover fails (invalid v value, s > secp256k1n/2, etc.),
    OpenZeppelin's ECDSA.recover reverts with "ECDSA: invalid signature".
    It does NOT return address(0) silently — it actively checks for
    recovery failures.

    This means malformed signatures cause immediate revert, not a
    silent match against address(0) validators. This is SAFER than
    raw ecrecover.

    Checked: OpenZeppelin ECDSA.recover includes:
    - v must be 27 or 28
    - s must be in lower half of curve order (malleable sig protection)
    - recovered address must not be address(0)
  solidity: |
    function check_ISM_D06_ecdsa_recover_reverts_on_invalid() public {
        bytes memory invalidSig = new bytes(65); // all zeros
        try ECDSA.recover(bytes32(0), invalidSig) returns (address) {
            assert(false); // Should revert, not return address(0)
        } catch {
            // Expected — OZ ECDSA reverts on invalid signatures
        }
    }
  validated: true
  status: not_a_bug
  notes: |
    OpenZeppelin ECDSA is battle-tested. The address(0) concern from
    MathHunter ISM-M-02 is actually mitigated here — OZ ECDSA.recover
    reverts if ecrecover returns address(0). So even with address(0) in
    the validator set, you can't match it with a zero signature because
    ECDSA.recover would revert before returning address(0).

    This INVALIDATES ISM-M-02 — the factory's lack of address(0) check
    is even less impactful than initially assessed.
