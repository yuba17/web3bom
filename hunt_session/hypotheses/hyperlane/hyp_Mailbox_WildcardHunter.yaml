- id: M-W-01
  tier: 1
  type: property
  description: "process() marca delivery ANTES de verificar ISM -- un ISM malicioso o reentrante puede explotar el estado 'delivered' prematuro para manipular logica dependiente"
  attack_scenario: >
    El patron CEI esta violado en process(): deliveries[_id] se escribe (EFFECTS) ANTES de
    ism.verify() (INTERACTIONS). Si el ISM callback reingresa o consulta delivered() durante
    verify(), ve el mensaje como ya entregado. Un recipient malicioso que es consultado por
    recipientIsm() podria devolver un ISM que, durante verify(), llama a otro contrato que
    depende de delivered()==true para liberar fondos o cambiar estado. Si verify() luego
    revierte, la tx entera revierte y el delivery se deshace, pero el estado externo
    modificado durante la reentrancia podria haber causado side-effects (ej: eventos emitidos,
    logs indexados por relayers off-chain que ven el ProcessId event emitido antes del revert).
  impact: "Side-effects observables off-chain (eventos Process/ProcessId emitidos antes de ISM verification) podrian enganyar a indexers/relayers. Estado on-chain se revierte, pero off-chain no."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que el nonce y delivery tracking son consistentes
    // Si un mensaje fue procesado, su delivery debe tener blockNumber > 0
    uint32 currentNonce = originMailbox.nonce();
    // After any dispatch, nonce must have incremented
    if (ghost_callRemoteCount > 0) {
        gt(uint256(currentNonce), 0, "M-W-01: nonce should be > 0 after dispatches");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    El patron effects-before-interactions es una violacion clara de CEI.
    L225-228 escribe deliveries ANTES de L257 ism.verify() y L241 recipient.handle().
    Sin embargo, si verify() o handle() revierte, todo se revierte (atomico en EVM).
    El riesgo real es: (1) off-chain indexers que ven eventos emitidos en txs que luego
    fallan parcialmente via try/catch en un wrapper, (2) un ISM que lee delivered() durante
    verify y toma decisiones basadas en ello.
  poc_sketch: ''
  call_stack: 'process() -> deliveries[_id] = Delivery{...} -> emit Process -> emit ProcessId -> ism.verify() -> recipient.handle()'

- id: M-W-02
  tier: 1
  type: property
  description: "recipientIsm() no valida que el ISM retornado sea un contrato -- un recipient puede devolver un EOA como ISM, y staticcall a EOA retorna success con empty returndata para verify()"
  attack_scenario: >
    Un recipient malicioso implementa interchainSecurityModule() retornando una direccion
    de un contrato que luego se autodestruye (pre-Dencun) o una direccion donde aun no
    se ha deployado codigo (CREATE2 address pre-deployment). recipientIsm() solo verifica
    ism != address(0), NO verifica isContract(). En process(), ism.verify() se llama como
    HIGH_LEVEL_CALL -- en Solidity >=0.8, llamar a una direccion sin codigo con una funcion
    que retorna bool revertira porque no hay returndata para decodear. PERO: si el address
    tiene codigo que simplemente retorna true sin verificar nada (un contrato trivial),
    esto bypass toda la seguridad del mensaje. La falta de isContract check en recipientIsm()
    es inconsistente con setDefaultIsm() que SI verifica isContract.
  impact: "Un recipient puede especificar un ISM trivial que aprueba cualquier mensaje, bypaseando la verificacion de seguridad. Cualquier mensaje fabricado seria aceptado como valido."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // recipientIsm debe retornar un contrato valido o el defaultIsm
    // No podemos llamar recipientIsm directamente con un address arbitrario en el setup
    // pero podemos verificar que defaultIsm siempre es un contrato
    address defaultIsmAddr = address(originMailbox.defaultIsm());
    t(defaultIsmAddr != address(0), "M-W-02: defaultIsm should not be zero");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 45
  notes: >
    Analisis mas profundo: Solidity high-level calls a addresses sin codigo revert en >=0.8
    (extcodesize check implicito). Asi que un EOA puro no funcionaria como ISM bypass.
    Sin embargo, un contrato minimo que retorna true en verify() SI funcionaria.
    Esto es by-design: el recipient ELIGE su propio ISM. Si elige uno inseguro,
    solo se danya a si mismo. Pero si un protocolo upstream asume que todos los mensajes
    procesados pasaron un ISM "real", esto rompe esa asuncion.
  poc_sketch: ''
  call_stack: 'process() -> recipientIsm(recipient) -> recipient.staticcall(interchainSecurityModule()) -> returns attacker-controlled ISM -> ism.verify() returns true'

- id: M-W-03
  tier: 1
  type: property
  description: "nonce usa uint32 -- overflow a 0 despues de 2^32 dispatches, causando colision de message IDs y replay potencial"
  attack_scenario: >
    uint32 nonce tiene un maximo de 4,294,967,295. Despues de ese numero de dispatches,
    nonce overflow a 0 en Solidity <0.8, pero en >=0.8 revertira por overflow check.
    Sin embargo, si el pragma es >=0.8.0 con unchecked, o si se usa un compilador que
    no chequea overflow en uint32 increment, el nonce volveria a 0. Con nonce=0 y el
    mismo sender+domain+destination+recipient, el message ID (keccak256 del mensaje
    formateado) seria identico a un mensaje anterior, permitiendo replay en destino.
    En Solidity >=0.8.0 sin unchecked, nonce += 1 revertira en overflow, causando DoS
    permanente del Mailbox despues de ~4B mensajes.
  impact: "DoS permanente del Mailbox despues de 2^32 dispatches (nonce overflow reverts en >=0.8). En un Mailbox de alto trafico, esto es un deadline previsible."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Nonce must be strictly monotonically increasing
    uint32 currentNonce = originMailbox.nonce();
    if (ghost_callRemoteCount > 0) {
        // nonce should equal total number of dispatches
        eq(uint256(currentNonce), ghost_callRemoteCount, "M-W-03: nonce should equal dispatch count");
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: >
    4B mensajes es un numero enorme. A 1 msg/bloque en Ethereum (12s), tomaria
    ~1,600 anyos. En L2s con bloques rapidos, podria ser mas rapido pero aun asi
    decadas. Riesgo teorico, no practico. Solidity >=0.8 revertira el overflow,
    asi que no hay replay, pero si DoS eventual.
  poc_sketch: ''
  call_stack: 'dispatch() -> nonce += 1 (L301) -> reverts after 2^32'

- id: M-W-04
  tier: 1
  type: property
  description: "dispatch() permite caller pasar hook=address(0) que se reemplaza por defaultHook, pero un caller puede pasar un hook malicioso arbitrario que robe msg.value"
  attack_scenario: >
    La funcion dispatch(5 params) es public, y acepta un IPostDispatchHook arbitrario.
    Un caller puede pasar su propio hook malicioso. El Mailbox le envia
    msg.value - requiredValue via hook.postDispatch{value: ...}. El hook malicioso
    simplemente se queda con el ETH. PERO: esto no es un ataque al protocolo -- el
    caller se lo hace a si mismo. El riesgo real es si un contrato upstream llama
    dispatch() con un hook proporcionado por un usuario no confiado, sin sanitizar.
    Esto es un composability risk: cualquier protocolo que wrappea Mailbox.dispatch()
    y deja que el usuario elija el hook esta expuesto.
  impact: "ETH enviado como fee podria ser robado por un hook malicioso si un protocolo upstream no valida el hook parameter."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that after dispatch, the Mailbox does not retain ETH
    // All msg.value should be forwarded to hooks
    uint256 mailboxBalance = address(originMailbox).balance;
    // Mailbox should not accumulate ETH -- it forwards everything to hooks
    lte(mailboxBalance, 1 ether, "M-W-04: Mailbox should not accumulate large ETH balance");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    El dispatch() no tiene ningun check sobre el hook excepto el fallback a defaultHook
    si es address(0). No verifica isContract ni ningun registry. Esto es by-design para
    flexibilidad, pero es un footgun para integradores. Solodit finding M-03 (Nucleus)
    confirma que custom hooks no aplicados es un patron de bug real.
  poc_sketch: ''
  call_stack: 'dispatch(domain, recipient, body, metadata, MALICIOUS_HOOK) -> hook.postDispatch{value: msg.value - requiredValue}(metadata, message)'

- id: M-W-05
  tier: 1
  type: property
  description: "latestDispatchedId es un singleton global que se sobreescribe en cada dispatch -- en un mismo bloque, multiples dispatches causan que hooks que dependen de latestDispatchedId lean el ID incorrecto"
  attack_scenario: >
    latestDispatchedId se actualiza en L300 ANTES de llamar a los hooks (L306-312).
    Si requiredHook.postDispatch() o hook.postDispatch() internamente consultan
    mailbox.latestDispatchedId (como se sugiere en el comentario L42-43: "used for auth
    in post-dispatch hooks"), y otro dispatch ocurre en el mismo bloque via reentrancia
    o batch, el hook podria autenticar contra el ID equivocado. Concretamente: si
    hook.postDispatch() reentra en dispatch(), latestDispatchedId se sobreescribe con
    el nuevo ID, y el hook original que aun no termino de ejecutarse ahora ve un ID
    diferente al que deberia autenticar.
  impact: "Hooks que usan latestDispatchedId para autenticacion podrian autenticar contra el mensaje equivocado, permitiendo que un mensaje obtenga el tratamiento post-dispatch de otro."
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // latestDispatchedId should correspond to the most recent dispatch
    bytes32 latestId = originMailbox.latestDispatchedId();
    if (ghost_callRemoteCount > 0) {
        // latestDispatchedId should not be zero after at least one dispatch
        t(latestId != bytes32(0), "M-W-05: latestDispatchedId should not be zero after dispatch");
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 65
  notes: >
    Este es un race condition clasico con estado mutable global. latestDispatchedId
    es explicitamente documentado como "used for auth in post-dispatch hooks" (L42-43).
    Si un hook reentra en dispatch, o si hay un batch multicall que dispatcha multiples
    mensajes, cada dispatch sobreescribe el ID. El hook del primer dispatch, que puede
    ejecutarse despues del segundo dispatch, leera el ID equivocado. Esto es un vector
    real si algun hook usa este campo para autorizacion.
  poc_sketch: |
    // 1. Attacker calls dispatch(msg1) -> latestDispatchedId = id1
    // 2. requiredHook.postDispatch() is called
    // 3. Inside requiredHook, it re-enters dispatch(msg2) -> latestDispatchedId = id2
    // 4. hook.postDispatch() for msg1 now sees latestDispatchedId = id2
    // 5. If hook uses latestDispatchedId for auth, msg1 gets msg2's auth context
  call_stack: 'dispatch(msg1) -> latestDispatchedId=id1 -> nonce++ -> requiredHook.postDispatch() -> [REENTRANT] dispatch(msg2) -> latestDispatchedId=id2 -> ... -> hook.postDispatch() for msg1 reads id2'

- id: M-W-06
  tier: 2
  type: property
  description: "delivered() usa blockNumber > 0 como indicador de entrega -- un mensaje procesado en block 0 (genesis) se reportaria como no entregado"
  attack_scenario: >
    delivered() retorna deliveries[_id].blockNumber > 0. Si un mensaje se procesa en
    block.number == 0 (bloque genesis), el uint48 truncation de 0 es 0, y delivered()
    retornaria false. Esto permitiria re-procesar el mismo mensaje en block > 0,
    causando double-delivery. En la practica, ningun mensaje se procesaria en genesis
    porque el contrato necesita ser deployado primero. Pero en chains custom, forks,
    o L2s donde block.number puede tener semantica diferente, esto podria ser un edge case.
  impact: "Replay de mensaje en edge case de block 0. Potencial double-spend si el recipient maneja tokens."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // delivered() must return true for any processed message
    // block.number should be > 0 for any practical tx
    t(block.number > 0, "M-W-06: block.number should be > 0 for delivery tracking to work");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: >
    Edge case extremadamente teorico. En Ethereum y la mayoria de chains, ningun
    contrato puede ejecutar transacciones en block 0. Sin embargo, en Arbitrum,
    block.number reporta el L1 block number que podria tener semantica diferente.
    Aun asi, 0 no es un valor practico. Posible false positive.
  poc_sketch: ''
  call_stack: 'process() -> deliveries[_id] = Delivery{blockNumber: uint48(block.number)} -> delivered(_id) returns blockNumber > 0'

- id: M-W-07
  tier: 1
  type: property
  description: "process() reenvia todo msg.value al recipient.handle() sin limite -- un relayer que envia ETH extra por error pierde fondos irrecuperablemente"
  attack_scenario: >
    process() pasa msg.value completo al recipient via handle{value: msg.value}().
    No hay mecanismo para que el processor/relayer recupere ETH no consumido.
    Si un relayer envia mas ETH del necesario, el exceso queda en el recipient contract.
    Si el recipient no tiene funcion de retiro para ETH excedente, los fondos se pierden
    permanentemente. Esto es un griefing vector: un atacante puede llamar process()
    con ETH excesivo hacia un recipient que no puede devolver ETH.
  impact: "Perdida de ETH para relayers que envian msg.value excesivo. Sin mecanismo de refund."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Track ETH sent to process vs what recipient actually needs
    // Mailbox should not hold ETH after process()
    uint256 mailboxBal = address(destMailbox).balance;
    lte(mailboxBal, 0, "M-W-07: destMailbox should not hold ETH after processing");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: >
    El relayer elige cuanto ETH enviar. En teoria, deberia enviar exactamente lo necesario.
    Pero no hay guardrails en el contrato. Si el recipient's handle() no usa todo el ETH
    y no tiene fallback para devolver, se pierde. Esto es mas un QA/design issue que un
    exploit, pero podria causar perdida de fondos para relayers.
  poc_sketch: ''
  call_stack: 'process{value: X}() -> recipient.handle{value: X}() -> ETH trapped in recipient if handle() does not use it'

- id: M-W-08
  tier: 1
  type: property
  description: "dispatch() acepta msg.value < requiredValue y lo pasa tal cual al requiredHook -- el requiredHook puede no revertir y aceptar pago parcial, dejando el mensaje sub-pagado"
  attack_scenario: >
    En L308-310: si msg.value < requiredValue, el codigo hace requiredValue = msg.value.
    El comentario dice "defer to required hook's reverting behavior". Pero si el
    requiredHook NO revierte con pago parcial (acepta cualquier valor), el mensaje
    se dispatcha con fee insuficiente. El hook.postDispatch() recibe 0 ETH
    (msg.value - requiredValue donde requiredValue = msg.value). Un atacante puede
    dispatcher mensajes pagando 0 fee si el requiredHook es permisivo. Esto podria
    causar DoS del sistema de relay si mensajes sin fee saturan la cola.
  impact: "Mensajes dispatched sin fee adecuado podrian no ser relayed, o saturar la cola del relayer con mensajes no rentables."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After dispatch, nonce should have incremented
    uint32 nonceBefore = originMailbox.nonce();
    // We can verify the nonce invariant holds after any state change
    // The fee logic is internal to hooks, but we can check nonce consistency
    t(nonceBefore == uint32(ghost_callRemoteCount), "M-W-08: nonce should match dispatch count");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: >
    El patron "defer to hook's reverting" asume que el requiredHook siempre revierte
    con pago insuficiente. Pero el Mailbox no enforce esto. Si un owner configura un
    requiredHook que no valida fees (ej: un hook de testing que acepta todo), cualquier
    mensaje se dispatcha gratis. Esto es un trust assumption sobre el requiredHook.
    Solodit finding HIGH (DIA) sobre postDispatch sin access control es relevante aqui.
  poc_sketch: |
    // 1. Owner sets a permissive requiredHook that never reverts
    // 2. Attacker calls dispatch{value: 0}(domain, recipient, body, metadata, hook)
    // 3. requiredHook.quoteDispatch returns X > 0
    // 4. msg.value (0) < X, so requiredValue = 0
    // 5. requiredHook.postDispatch{value: 0}() -- does not revert
    // 6. hook.postDispatch{value: 0}() -- does not revert
    // 7. Message dispatched without any fee
  call_stack: 'dispatch{value:0}() -> requiredHook.quoteDispatch() returns X -> 0 < X -> requiredValue = 0 -> requiredHook.postDispatch{value:0}() -> hook.postDispatch{value:0}()'

false_positives:
- hunter: WildcardHunter
  id: M-W-FP-01
  reason: >
    dispatch() being permissionless (anyone can call) is by design -- Hyperlane's Mailbox
    is intentionally open for any contract/EOA to send messages. Access control is at the
    ISM layer on the receiving side, not the sending side.
  investigated_at: '2026-03-24T18:30:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: "dispatch() es permissionless by design en Hyperlane -- no es un bug de access control"
    briefing_update_applied: false
