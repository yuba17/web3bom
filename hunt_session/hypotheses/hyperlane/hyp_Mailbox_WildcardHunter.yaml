  id: M-W-FP-02
  reason: >
    setDefaultIsm/setDefaultHook/setRequiredHook being onlyOwner without timelock is a
    centralization concern but is out of scope for most bounties. The isContract check
    prevents setting to EOA which is sufficient on-chain validation.
  investigated_at: '2026-03-24T18:30:00Z'
