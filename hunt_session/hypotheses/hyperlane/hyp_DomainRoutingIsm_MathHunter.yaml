hypotheses:

  - id: DRI-MATH-01
    title: "uint32Keys() silent truncation si key > uint32.max insertado via storage"
    description: |
      EnumerableMapExtended.uint32Keys() trunca uint256 a uint32: `uint32(uint256keys[i])`.
      Si un key con valor > type(uint32).max existiera en el mapa, uint32Keys() devolvería
      un dominio truncado, colisionando potencialmente con otro dominio legítimo.

      Sin embargo, la ÚNICA ruta de escritura pública es _set(uint32 _domain, address _module)
      que recibe uint32, garantizando que el key nunca excede uint32.max. La escritura directa
      a storage requeriría un bug de storage collision en un contrato heredero o un delegatecall
      malicioso — escenarios fuera del scope del contrato mismo.
    confidence: 5
    severity: informational
    status: dismissed
    attack_scenario: |
      1. Atacante necesitaría inyectar un key > uint32.max directamente en storage
      2. uint32Keys() truncaría el key, retornando dominio incorrecto
      3. Podría causar confusión en off-chain consumers que leen la lista de dominios

      PERO: No hay ruta de escritura que lo permita. _set() toma uint32. Descartado.
    dismissal_reason: |
      Sin ruta de escritura que permita keys > uint32.max. El parámetro _domain
      es uint32 en todas las funciones públicas e internas. Solidity implicit widening
      uint32→uint256 es lossless. Solo explotable con storage collision (fuera de scope).
    solidity:
      location: "EnumerableMapExtended.sol:34"
      code: "_keys[i] = uint32(uint256keys[i]);"
      type_flow: "uint32 → uint256 (set) → bytes32 (inner) → uint256 (keys) → uint32 (uint32Keys)"

  - id: DRI-MATH-02
    title: "domains() retorna uint256[] en vez de uint32[] — inconsistencia de interfaz"
    description: |
      DomainRoutingIsm.domains() retorna uint256[] via _modules.keys(). Los dominios
      de Hyperlane son uint32. Un consumer off-chain o on-chain que itere sobre domains()
      y los trate como uint32 sin verificación podría tener problemas si algún valor
      excediera uint32.max. En práctica, todos los valores insertados son uint32 widened,
      así que los uint256 siempre cabrán en uint32.

      No hay pérdida de fondos. Es una inconsistencia de tipos que podría confundir
      a integradores pero no constituye una vulnerabilidad.
    confidence: 10
    severity: informational
    status: dismissed
    attack_scenario: "N/A — inconsistencia de interfaz sin impacto de seguridad"
    dismissal_reason: |
      Todos los valores en el mapa provienen de uint32 inputs. domains() devuelve
      uint256[] por simplicidad de la lib. uint32Keys() existe como alternativa tipada.
      Sin impacto de seguridad.
    solidity:
      location: "DomainRoutingIsm.sol:85-87"
      code: |
        function domains() external view returns (uint256[] memory) {
            return _modules.keys();
        }

  - id: DRI-MATH-03
    title: "TypeCasts.bytes32ToAddress overflow check — valor corrupto causaría revert en module()"
    description: |
      bytes32ToAddress() tiene un require que revierte si uint256(_buf) > uint160.max.
      Si un valor bytes32 con bits superiores set se almacenara como ISM module,
      module(origin) revertería al intentar convertir el bytes32 a address.

      La única ruta de escritura es _set() que llama addressToBytes32() sobre una address,
      que siempre produce bytes32 con los 96 bits superiores en 0. Por lo tanto,
      bytes32ToAddress() nunca revertirá por overflow en este contexto.

      El check es defensive programming correcto — protege contra uso erróneo en
      otros contextos donde bytes32 podría no venir de una address.
    confidence: 5
    severity: informational
    status: dismissed
    attack_scenario: |
      1. Valor bytes32 con upper bits set se almacena como ISM module
      2. module(origin) llama bytes32ToAddress() → revert "overflow"
      3. Mensajes de ese dominio serían imposibles de verificar (DoS)

      PERO: addressToBytes32() siempre produce valores seguros. No hay ruta.
    dismissal_reason: |
      addressToBytes32() es la inversa exacta de bytes32ToAddress(). La composición
      bytes32ToAddress(addressToBytes32(addr)) es identity. No hay ruta para inyectar
      bytes32 con upper bits set en _modules.
    solidity:
      location: "TypeCasts.sol:11-16"
      code: |
        function bytes32ToAddress(bytes32 _buf) internal pure returns (address) {
            require(uint256(_buf) <= uint256(type(uint160).max), "TypeCasts: bytes32ToAddress overflow");
            return address(uint160(uint256(_buf)));
        }

  - id: DRI-MATH-04
    title: "Message.origin() parsing — offset correctness en encodePacked"
    description: |
      Message.origin() extrae bytes [5:9] del mensaje encodePacked y castea a uint32.
      El formato es: uint8(1) + uint32(4) + uint32(4) + bytes32(32) + uint32(4) + bytes32(32) + bytes.
      Offsets: version=0, nonce=1, origin=5, sender=9. La extracción es correcta.

      Si un mensaje malformado (más corto) se pasara, el slice revertería por out-of-bounds.
      Esto es comportamiento correcto — no hay silent truncation.
    confidence: 3
    severity: informational
    status: dismissed
    attack_scenario: "N/A — parsing correcto verificado manualmente"
    dismissal_reason: |
      Los offsets son consistentes con el formato encodePacked definido en formatMessage().
      uint32(bytes4(slice)) es la forma correcta de extraer un uint32 big-endian de bytes.
    solidity:
      location: "Message.sol:86-88"
      code: |
        function origin(bytes calldata _message) internal pure returns (uint32) {
            return uint32(bytes4(_message[ORIGIN_OFFSET:SENDER_OFFSET]));
        }

  - id: DRI-MATH-05
    title: "Domain 0 como dominio válido — potencial confusión con valor default"
    description: |
      No hay validación que impida set(0, someISM). Domain 0 en Hyperlane no está
      asignado a ninguna chain real. Si un owner configura domain 0, un mensaje
      con origin=0 sería ruteado a ese ISM. En DefaultFallbackRoutingIsm, domain 0
      configurado explícitamente NO caería al fallback (defaultIsm), sino al ISM
      configurado — comportamiento potencialmente inesperado.

      Sin embargo, origin=0 en un mensaje requeriría que el Mailbox de origen lo
      dispatcheara con localDomain=0, lo cual no corresponde a ningún deployment
      real de Hyperlane. El riesgo es puramente teórico y depende de configuración
      errónea del owner (que es trusted).
    confidence: 8
    severity: informational
    status: dismissed
    attack_scenario: |
      1. Owner configura ISM para domain 0 por error
      2. Mensaje con origin=0 llegaría (si existiera chain con domain 0)
      3. Se verificaría con el ISM configurado en vez de defaultIsm

      Escenario no explotable: origin=0 no existe en deployments reales.
      Owner es trusted y puede reconfigurar.
    dismissal_reason: |
      Domain 0 no existe en Hyperlane real. Owner es trusted. No hay pérdida de fondos.
      Configurar domain 0 es un error de admin, no una vulnerabilidad del contrato.
    solidity:
      location: "DomainRoutingIsm.sol:70-75"
      code: |
        function set(uint32 _domain, IInterchainSecurityModule _module) external onlyOwner {
            _set(_domain, address(_module));
        }

summary: |
  Análisis exhaustivo de math/encoding en DomainRoutingIsm y librerías asociadas.

  RESULTADO: No se encontraron vulnerabilidades explotables.

  El código es defensivamente correcto:
  - TypeCasts tiene overflow protection en bytes32ToAddress
  - EnumerableMapExtended usa tipos consistentes (uint32 input → uint256 storage → uint32 output)
  - Message.origin() parsing es correcto con offsets verificados
  - Todas las rutas de escritura al mapa pasan por _set(uint32, address) que constraña ambos tipos

  Las únicas observaciones son de calidad de código (domains() retorna uint256[] vs uint32[])
  y edge cases teóricos (domain 0, uint32Keys truncation) que requieren condiciones imposibles
  o configuración errónea de un owner trusted para manifestarse.

  Confianza en "no hay bug": 95%. El 5% restante cubriría escenarios de storage collision
  en contratos herederos que no podemos analizar sin ver todos los posibles herederos.
