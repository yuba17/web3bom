  # =========================================================================
  # HIPOTESIS 1: InterchainAccountRouter.route() - ISM controlado por atacante
  # =========================================================================
  - id: DR-DD-01
    title: "InterchainAccountRouter.route() permite ISM arbitrario controlado por mensaje"
    hunter: DeepDiveHunter
    component: DomainRoutingIsm + InterchainAccountRouter
    severity: critical
    confidence: 75
    status: investigate
    convergence_source: "Cross-component: InterchainAccountRouter hereda AbstractRoutingIsm"

    description: |
      InterchainAccountRouter hereda AbstractRoutingIsm y overridea route().
      En su route() (linea 170-191), el ISM se extrae DIRECTAMENTE del body del mensaje:

        _ism = InterchainAccountMessage.ism(_body).bytes32ToAddress();
        _ism = _ism == address(0) ? address(mailbox.defaultIsm()) : _ism;

      El body del mensaje es crafteado por el SENDER en la chain origen. Esto significa
      que un atacante puede enviar un mensaje con _ism apuntando a un contrato que
      SIEMPRE retorna true en verify().

      PERO: AbstractInterchainAccountRouter.interchainSecurityModule() retorna
      address(this), lo que significa que el Mailbox usara el Router COMO ISM.
      El flujo es:
      1. Mailbox.process() llama recipientIsm(router) -> router.interchainSecurityModule() -> address(this)
      2. Mailbox llama router.verify(_metadata, _message)
      3. AbstractRoutingIsm.verify() llama route(_message).verify(_metadata, _message)
      4. route() extrae ISM del body -> ISM controlado por atacante
      5. ISM malicioso retorna true
      6. Mailbox llama router.handle() -> ejecuta calls en ICA

      Si esto funciona, el atacante puede ejecutar calls arbitrarias en cualquier ICA
      sin autorizacion real. El ICA seria uno nuevo (derivado del ISM malicioso en el salt),
      pero si ese ICA tiene fondos o permisos, es critico.

    attack_scenario: |
      1. Atacante despliega MaliciousIsm que retorna true en verify()
      2. Atacante crafta mensaje Hyperlane con:
         - origin: cualquier dominio
         - sender: cualquier address
         - recipient: InterchainAccountRouter en chain destino
         - body: CALLS message con _ism = address(MaliciousIsm), calls = [transferir fondos]
      3. Atacante (o relayer) llama Mailbox.process() con metadata vacia
      4. Mailbox -> router.verify() -> route() devuelve MaliciousIsm -> MaliciousIsm.verify() = true
      5. Mailbox -> router.handle() -> despliega ICA y ejecuta calls

      MITIGACION POTENCIAL: El ICA se despliega con un salt que incluye el ISM address.
      Si el ISM es malicioso, el ICA sera uno NUEVO sin fondos. PERO si la ICA
      tiene alguna allowance previa o es un contrato con permisos especiales, sigue siendo explotable.

      PREGUNTA CRITICA: Puede el atacante hacer que el ICA resultante sea uno
      que YA tenga fondos? Solo si logra colision de salt con un ICA legitimo.
      Salt = keccak256(origin, owner, router, ism, userSalt) - el ism diferente
      genera ICA diferente. LIMITACION IMPORTANTE.

      CONTRAARGUMENTO: Si el objetivo es ejecutar calls como un ICA NUEVO, el ataque
      no tiene valor directo. Pero el ICA nuevo podria ser usado para interactuar con
      protocolos que confian en "cualquier ICA de Hyperlane".

    preconditions:
      - InterchainAccountRouter desplegado y activo
      - MaliciousIsm desplegado en la misma chain
      - Relayer dispuesto a relayear (o atacante usa process() directamente)

    affected_functions:
      - "InterchainAccountRouter.route() [linea 170-191]"
      - "AbstractRoutingIsm.verify() [linea 38-43]"
      - "AbstractInterchainAccountRouter.interchainSecurityModule() [linea 74-82]"

    solidity: |
      // Invariante: ISM usado para verificar debe ser trusted
      // Si route() retorna ISM del body del mensaje, el atacante controla la verificacion
      function invariant_route_returns_trusted_ism() public {
          // Craftar mensaje con ISM malicioso
          bytes memory body = abi.encodePacked(
