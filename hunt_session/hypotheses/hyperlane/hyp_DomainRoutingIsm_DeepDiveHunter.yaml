    description: |
      Escenario complejo de cadena de interacciones:

      1. Recipient R usa DefaultFallbackRoutingIsm como ISM
      2. DefaultFallbackRoutingIsm tiene rutas para dominios [1, 2, 3]
      3. InterchainAccountRouter en dominio 1 envia mensaje a R
