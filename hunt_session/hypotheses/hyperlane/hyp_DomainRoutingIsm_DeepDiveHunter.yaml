  # =========================================================================
  # HIPOTESIS 2: DefaultFallbackRoutingIsm + StaticMultisigIsm con MetaProxy
  # =========================================================================
  - id: DR-DD-02
    title: "DefaultFallbackRoutingIsm fallback a defaultIsm NO valida per-domain - bypass si defaultIsm es domain-agnostic"
    hunter: DeepDiveHunter
    component: DefaultFallbackRoutingIsm + AbstractMultisigIsm
    severity: high
    confidence: 40
    status: investigate
    convergence_source: "Convergencia 1 refinada - 6 hunters"

    description: |
      La Convergencia 1 identifico que DefaultFallbackRoutingIsm cae a mailbox.defaultIsm()
      para dominios no registrados. La pregunta clave es: que pasa cuando defaultIsm
      es un MultisigIsm?

      ANALISIS VERIFICADO:
      - AbstractMultisigIsm.verify() linea 104: require(_threshold > 0, ...) -> BLOQUEA threshold=0
      - StaticMultisigIsm usa MetaProxy: validatorsAndThreshold() retorna datos fijos del proxy metadata
      - StorageMultisigIsm: require(0 < _threshold) en setValidatorsAndThreshold

      El defaultIsm de un Mailbox tipicamente verifica con un set FIJO de validators/threshold
      que NO depende del origin domain. Esto significa que:

      1. Si defaultIsm es StaticMessageIdMultisigIsm con validators [V1, V2, V3] y threshold=2
      2. Un mensaje de CUALQUIER dominio (incluso uno fake) se verifica contra esos mismos validators
      3. Los validators V1, V2, V3 firman checkpoints para dominios ESPECIFICOS
      4. El digest en CheckpointLib incluye _origin en el domainHash

      PUNTO CRITICO: CheckpointLib.domainHash(origin, merkleTreeHook) es per-origin.
      Si los validators nunca firmaron checkpoints para el dominio falso del atacante,
      no existen firmas validas. El ataque FALLA para MultisigIsm.

      PERO: Si defaultIsm NO es MultisigIsm sino otro tipo (e.g., TrustedRelayerIsm,
      NullIsm), el ataque funciona. El riesgo depende de la configuracion operacional.

    attack_scenario: |
      ESCENARIO (requiere configuracion especifica):
      1. Mailbox.defaultIsm = algon ISM debil (TrustedRelayerIsm, NullIsm)
      2. Recipient usa DefaultFallbackRoutingIsm
      3. Atacante envia mensaje desde dominio 999999 (no registrado)
      4. DefaultFallbackRoutingIsm.module(999999) -> mailbox.defaultIsm() -> ISM debil
      5. ISM debil acepta el mensaje sin verificacion real
      6. Mensaje se procesa como si fuera de un dominio legitimo

      MITIGACION: MultisigIsm como defaultIsm hace esto seguro gracias a:
      - require(_threshold > 0)
      - Digest per-domain via CheckpointLib.domainHash
      - Validators no firman para dominios inexistentes

    preconditions:
      - Recipient usa DefaultFallbackRoutingIsm
      - mailbox.defaultIsm es ISM debil (no MultisigIsm)
      - Dominio del atacante no registrado en el routing ISM

    affected_functions:
      - "DefaultFallbackRoutingIsm.module() [linea 21-30]"
      - "Mailbox.process() [linea 202-246]"

    solidity: |
      // Invariante: fallback ISM no debe aceptar mensajes de dominios desconocidos
      function invariant_fallback_rejects_unknown_domains(uint32 _fakeDomain) public {
          // Precondicion: _fakeDomain no registrado
          require(!isRegisteredDomain(_fakeDomain));

          IInterchainSecurityModule _ism = defaultFallbackRoutingIsm.module(_fakeDomain);
          // El ISM de fallback deberia ser lo suficientemente fuerte
          // para rechazar dominios desconocidos
          bytes memory fakeMetadata = bytes("");
          bytes memory fakeMessage = _buildMessage(_fakeDomain, bytes32(0), address(recipient), bytes(""));

          // Esto NO debe pasar
