          try _ism.verify(fakeMetadata, fakeMessage) returns (bool v) {
              verified = v;
          } catch {}
          t(!verified, "Fallback ISM accepted unknown domain with empty metadata");
      }

  # =========================================================================
  # HIPOTESIS 3: revealAndExecute en CommitmentReadIsm - sin access control
  # =========================================================================
  - id: DR-DD-03
    title: "CommitmentReadIsm.verify() llama revealAndExecute sin validar caller chain - frontrunning de reveal"
    hunter: DeepDiveHunter
    component: DomainRoutingIsm + CommitmentReadIsm + OwnableMulticall
    severity: high
    confidence: 65
    status: investigate
    convergence_source: "Cross-component: InterchainAccountRouter commit-reveal + routing ISM"

    description: |
      CommitmentReadIsm.verify() (linea 52-79) ejecuta las calls del commitment
      DENTRO de la verificacion ISM, antes de que handle() se ejecute.

      Flujo:
      1. Mailbox.process() marca el mensaje como delivered (linea 225-228)
      2. Mailbox llama ism.verify() -> CommitmentReadIsm.verify()
      3. CommitmentReadIsm.verify() llama ica.revealAndExecute(calls, salt) [linea 76]
      4. revealAndExecute ejecuta las calls
      5. CommitmentReadIsm retorna true
      6. Mailbox llama router.handle() -> handle() ve REVEAL type y simplemente retorna

      PROBLEMA: revealAndExecute en OwnableMulticall (linea 52-71) NO tiene modifier
      onlyOwner. CUALQUIERA puede llamar revealAndExecute si conoce el commitment.

      Pero espera - el commitment se setea via setCommitment() que SI es onlyOwner.
      Y revealAndExecute verifica que commitments[revealedHash] == true.

      El verdadero riesgo es de FRONTRUNNING:
      1. Atacante observa la tx de Mailbox.process() con el reveal en el mempool
      2. El metadata contiene (ica, salt, calls) en texto plano
      3. Atacante extrae las calls y ejecuta revealAndExecute directamente
      4. Cuando la tx original se ejecuta, el commitment ya fue consumido -> revert

      Esto es exactamente lo que commit-reveal intenta prevenir, pero el reveal
      se transmite en la metadata de la tx de process(). Ironia: el mecanismo
      anti-frontrun ES frontrunnable.

    attack_scenario: |
      1. Usuario legitimo envia commit-reveal para ejecutar un swap
      2. El commitment se almacena en el ICA via setCommitment
      3. Relayer envia Mailbox.process() con metadata que contiene las calls reales
      4. Atacante ve la tx en mempool, extrae (salt, calls) de la metadata
      5. Atacante llama directamente ica.revealAndExecute(calls, salt) con mas gas
      6. Las calls se ejecutan para beneficio del atacante (e.g., sandwich el swap)
      7. La tx del relayer falla porque commitment ya fue consumido

      IMPACTO: Las calls del usuario se ejecutan en un contexto donde el atacante
      ya manipulo el estado (e.g., movio precio en AMM).

      NOTA: revealAndExecute ejecuta las calls con msg.sender = ICA address,
      no el atacante. Pero el atacante puede sandwich la ejecucion.

    preconditions:
      - Usuario usa commit-reveal via InterchainAccountRouter
      - Calls incluyen operacion sensible a frontrunning (swap, liquidacion)
      - Chain destino tiene mempool publico (no Flashbots/MEV-protected)

    affected_functions:
      - "CommitmentReadIsm.verify() [linea 52-79]"
      - "OwnableMulticall.revealAndExecute() [linea 52-71]"
      - "InterchainAccountRouter.callRemoteCommitReveal() [linea 579-632]"

