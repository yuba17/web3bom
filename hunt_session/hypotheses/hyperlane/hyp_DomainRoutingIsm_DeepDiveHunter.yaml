  # =========================================================================
  # HIPOTESIS 6: Race condition en owner set() + Mailbox.process()
  # =========================================================================
  - id: DR-DD-06
    title: "TOCTOU en DomainRoutingIsm: owner cambia ISM entre route() y verify()"
    hunter: DeepDiveHunter
    component: DomainRoutingIsm + Mailbox
    severity: medium
    confidence: 25
    status: investigate
    convergence_source: "Novel - analisis de flujo cross-contract"

    description: |
      AbstractRoutingIsm.verify() linea 42:
        return route(_message).verify(_metadata, _message);

      Este es un SINGLE call que hace:
      1. route(_message) -> lee _modules mapping -> retorna ISM address
      2. .verify(_metadata, _message) -> llama verify en el ISM

      En una UNICA transaccion, el owner no puede cambiar el mapping entre
      los pasos 1 y 2 (no hay reentrancy path).

      PERO hay un escenario mas sutil con el Mailbox:
      1. Relayer A llama Mailbox.process() con metadata para ISM_old
      2. Entre que A simula la tx y la mina, owner llama set(domain, ISM_new)
      3. A la tx se mina: route() retorna ISM_new, pero metadata es para ISM_old
      4. ISM_new.verify() con metadata incorrecta -> revert o false
      5. Mensaje no se procesa aunque era valido -> DoS temporal

      Esto no es un bug de codigo sino un riesgo operacional. La falta de
      eventos en set()/remove() (Convergencia 5) agrava esto: relayers no
      pueden detectar cambios y re-fetch metadata.

      IMPACTO: DoS temporal para mensajes in-flight. No perdida de fondos.

    attack_scenario: |
      1. Owner cambia ISM para dominio X (legitimo: rotacion de validators)
      2. Mensajes en pipeline del relayer tienen metadata para ISM viejo
      3. Todos esos mensajes fallan en process()
      4. Relayer debe detectar cambio, re-fetch metadata, re-submit
      5. Sin eventos de set(), deteccion es por polling (lento)
      6. Ventana de DoS = tiempo hasta re-fetch (minutos a horas)

      AGRAVANTE: Si owner es malicioso y cambia ISM rapidamente,
      puede crear DoS sostenido.

    preconditions:
      - DomainRoutingIsm owner cambia ISM para un dominio
      - Mensajes en pipeline del relayer para ese dominio
      - Relayer no monitorea cambios de ISM en tiempo real

    affected_functions:
      - "DomainRoutingIsm.set() [linea 70-75]"
      - "DomainRoutingIsm.remove() [linea 81-83]"
      - "AbstractRoutingIsm.verify() [linea 38-43]"

    solidity: |
      // Invariante: set/remove deberian emitir eventos
      // (no es un invariante de fuzzing sino de best practices)
      // Verificar que metadata stale causa revert predecible
      function invariant_stale_metadata_fails_gracefully(uint32 domain) public {
          // Simular: route() retorna ISM nuevo, metadata es para ISM viejo
          IInterchainSecurityModule oldIsm = domainRoutingIsm.module(domain);
          // Owner cambia ISM
          vm.prank(owner);
          domainRoutingIsm.set(domain, address(newIsm));

          IInterchainSecurityModule currentIsm = domainRoutingIsm.module(domain);
          t(address(currentIsm) == address(newIsm), "ISM should be updated");

          // Metadata para oldIsm no deberia pasar en newIsm
          bool verified = false;
          try currentIsm.verify(oldMetadata, message) returns (bool v) {
              verified = v;
          } catch {}
          t(!verified, "Stale metadata should not verify");
      }

