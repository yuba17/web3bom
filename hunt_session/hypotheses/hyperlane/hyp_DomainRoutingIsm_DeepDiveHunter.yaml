  # =========================================================================
  # HIPOTESIS 4: Call a ISM destruido retorna datos vacios -> revert en ABI decode
  # =========================================================================
  - id: DR-DD-04
    title: "ISM destruido causa DoS permanente para el dominio afectado - mensajes no procesables"
    hunter: DeepDiveHunter
    component: DomainRoutingIsm
    severity: medium
    confidence: 55
    status: investigate
    convergence_source: "Convergencia 4 refinada - ISM self-destruct"

    description: |
      Analisis de que pasa cuando un ISM registrado en DomainRoutingIsm es destruido:

      FLUJO:
      1. _set() verifica isContract() solo al momento de registro (linea 134)
      2. ISM se destruye (pre-Cancun) o su implementation se destruye (MinimalProxy)
      3. AbstractRoutingIsm.verify() llama route(_message).verify(_metadata, _message)
      4. route() retorna la address del ISM destruido (sigue en el mapping)
      5. La llamada verify() en un address sin codigo...

      EN SOLIDITY 0.8:
      - CALL a address sin codigo retorna success=true, returndata=empty
      - Pero Solidity 0.8 ABI decoder para `bool` sobre returndata vacia:
        NO revierte automaticamente. La interfaz IInterchainSecurityModule.verify()
        tiene returns(bool). Con returndata vacia, el decoder retorna false.

      WAIT - verificando: En Solidity >=0.8.0, las llamadas externas que retornan
      datos son decodificadas. Si returndata esta vacia y se espera un bool:
      - abi.decode de datos vacios REVIERTE (out of bounds)
      - Esto causa que verify() propague un revert

      IMPACTO REAL:
      - El dominio afectado queda bloqueado: ningun mensaje puede procesarse
      - owner puede arreglarlo con set() o remove(), pero mientras tanto es DoS
      - Si el owner es un multisig lento o un timelock, el DoS puede durar dias

      ESCENARIO MINIMALPROXY:
      - DomainRoutingIsmFactory crea proxies con MinimalProxy.create(implementation)
      - Si la implementation del proxy se destruye, el proxy hace DELEGATECALL
        a codigo inexistente -> retorna success=true, empty data -> mismo problema
      - Post-Cancun (EIP-6780): SELFDESTRUCT solo funciona en la misma tx de create
      - Pre-Cancun: SELFDESTRUCT es permanente

    attack_scenario: |
      Pre-Cancun escenario:
      1. Atacante explota vulnerabilidad en un ISM contract para llamar SELFDESTRUCT
      2. O: ISM es un proxy cuya implementation tiene SELFDESTRUCT accesible
      3. ISM se destruye pero sigue registrado en DomainRoutingIsm._modules
      4. Todos los mensajes del dominio asociado fallan con revert en ABI decode
      5. DoS permanente hasta que owner actualice el mapping

      Post-Cancun:
      6. SELFDESTRUCT solo funciona en misma tx de deploy
      7. El ataque requiere que el ISM sea desplegado Y destruido en misma tx
      8. Escenario: factory que deploya ISM y luego lo destruye atomicamente
      9. Improbable pero no imposible si factory es maliciosa

      PROBABILIDAD REAL: Baja. Requiere control sobre un ISM para destruirlo.

    preconditions:
      - ISM registrado tiene SELFDESTRUCT accesible (pre-Cancun)
      - O ISM es proxy cuya implementation puede destruirse
      - DomainRoutingIsm en uso activo para ese dominio

    affected_functions:
      - "DomainRoutingIsm._set() [linea 133-136]"
      - "AbstractRoutingIsm.verify() [linea 38-43]"
      - "DomainRoutingIsm.module() [linea 89-97]"

    solidity: |
