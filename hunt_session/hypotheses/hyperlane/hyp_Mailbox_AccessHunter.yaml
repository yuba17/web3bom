- id: M-AC-03
  tier: 1
  type: property
  description: "dispatch() con hook custom arbitrario no puede ser usado para reentrancy que corrompa nonce o latestDispatchedId"
  attack_scenario: "Un atacante deploya un hook malicioso que re-entra dispatch() durante hook.postDispatch(). Dentro de la reentrada, latestDispatchedId se sobreescribe con un nuevo ID. Cuando la primera dispatch retorna, el requiredHook o defaultHook del primer dispatch podria haber operado sobre el ID incorrecto. En MerkleTreeHook y AbstractMessageIdAuthHook, la auth depende de _isLatestDispatched(id), que lee latestDispatchedId -- si fue sobreescrito por reentrada, el primer dispatch podria fallar o insertar el mensaje equivocado en el merkle tree."
  impact: "Corrupcion del merkle tree (mensajes insertados con ID incorrecto), DoS de mensajes legitimos, potencial bypass de auth en hooks que dependen de latestDispatchedId"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que nonce es estrictamente creciente y no se salta valores
    uint32 nonceBefore = originMailbox.nonce();
    // Si el nonce actual es mayor que ghost_callRemoteCount + 1 (baseline), hay salto anomalo
    // Verificar monotonically increasing
    t(nonceBefore >= ghost_callRemoteCount, "M-AC-03: nonce inconsistent with dispatch count");
  ghost_vars:
    - "uint32 ghost_lastNonce"
  validated: true
  priority: high
  confidence: 70
  notes: "dispatch() es public payable virtual sin reentrancy guard. La secuencia es: latestDispatchedId = id -> nonce++ -> requiredHook.postDispatch -> hook.postDispatch. Si hook.postDispatch re-entra dispatch(), latestDispatchedId se sobreescribe. MerkleTreeHook usa _isLatestDispatched(id) que compara con el valor global -- la primera dispatch veria su propio check fallar si el hook que re-entro ya cambio latestDispatchedId. El impacto depende de que hooks estan configurados."
  poc_sketch: 'Deployar un MaliciousHook que en postDispatch() llama dispatch() de nuevo. Observar que latestDispatchedId cambia entre las dos llamadas a hook dentro del primer dispatch.'
  call_stack: 'dispatch -> hook.postDispatch -> [reentrant] dispatch -> latestDispatchedId = newId -> return -> primera dispatch requiredHook.postDispatch ya fue llamado con id viejo'

- id: M-AC-04
  tier: 2
  type: property
  description: "recipientIsm() no valida que el ISM retornado por el recipient sea un contrato -- un recipient malicioso puede retornar un EOA como ISM"
  attack_scenario: "Un recipient malicioso implementa interchainSecurityModule() retornando una EOA (no un contrato). Cuando process() llama ism.verify(), la llamada a un EOA retorna success=true con returndata vacio. Pero verify() retorna bool -- si el ABI decode de returndata vacio falla, revierte. Si NO falla (phantom function con empty return), verify devuelve false y el require falla. Sin embargo, el delivery ya fue marcado como processed (L225-228), y el require en L235-238 revertira toda la tx incluyendo el write. Analizar si hay edge cases donde la staticcall returnData se interpreta incorrectamente."
  impact: "Potencial bypass de ISM verification si la llamada a verify() en un EOA se interpreta como true. Permite procesar mensajes no verificados."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que recipientIsm nunca retorna address(0) -- fallback es defaultIsm
    address testRecipient = address(originRouter);
    IInterchainSecurityModule ism = originMailbox.recipientIsm(testRecipient);
    t(address(ism) != address(0), "M-AC-04: recipientIsm returned zero address");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 55
  notes: "recipientIsm() en L410-431 hace staticcall al recipient. Si retorna un address != 0, lo usa sin verificar isContract. Pero ism.verify() en un EOA haria una CALL a un address sin code -- en Solidity >=0.8, esto revierte por default en high-level calls si el address no es un contrato (extcodesize check). Asi que este path probablemente revierte, causando DoS del mensaje pero no un bypass. Aun asi, vale verificar que defaultIsm siempre sea un contrato valido."
  poc_sketch: 'Deployar recipient que retorna EOA como ISM. Intentar process() con un mensaje para ese recipient.'
  call_stack: 'process -> recipientIsm(recipient) -> staticcall interchainSecurityModule() -> returns EOA -> ism.verify() -> call to EOA -> revert (no code)'

- id: M-AC-05
  tier: 1
  type: property
  description: "Un mensaje procesado (delivered=true) no puede ser re-procesado"
  attack_scenario: "Si un mensaje puede ser procesado dos veces, el recipient recibe handle() dos veces. Para token bridges, esto duplica la mint/transfer -- double spend. Para governance, ejecuta una accion dos veces."
  impact: "Double-spend en token bridges, doble ejecucion de governance actions, duplicacion de cualquier efecto del handle()"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que delivered() es monotonica -- una vez true, siempre true
    // Si tenemos un messageId que fue procesado, verificar que sigue delivered
    bytes32 testId = originMailbox.latestDispatchedId();
    if (testId != bytes32(0) && originMailbox.delivered(testId)) {
        t(originMailbox.delivered(testId), "M-AC-05: delivered message became undelivered");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 95
  notes: "Check en L217: require(delivered(_id) == false). delivered() retorna blockNumber > 0. Una vez seteado en L225-228, blockNumber nunca vuelve a 0 (no hay funcion que borre deliveries). Solido, pero el invariante confirma que no hay path de reset."
  poc_sketch: ''
  call_stack: 'process -> require(!delivered(_id)) -> deliveries[_id] = Delivery{...} -> delivered(_id) = true'

- id: M-AC-06
  tier: 2
  type: property
  description: "dispatch() con hook=address(0) debe usar defaultHook, no ejecutar con un hook nulo"
  attack_scenario: "Si alguien llama dispatch con hook=address(0) y el fallback a defaultHook no funciona, el postDispatch se llama en address(0) lo que revierte. Pero si defaultHook tampoco esta seteado (address(0)), ambos calls serian a address(0). En initialize() se requiere que hooks sean contratos, pero si el owner cambia defaultHook a un contrato que luego se selfdestructs, defaultHook apunta a address(0) de facto."
  impact: "DoS de dispatch si defaultHook apunta a contrato destruido"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que defaultHook y requiredHook son contratos validos (no address(0))
    address dh = address(originMailbox.defaultHook());
    address rh = address(originMailbox.requiredHook());
    t(dh != address(0), "M-AC-06: defaultHook is zero");
    t(rh != address(0), "M-AC-06: requiredHook is zero");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: "dispatch() L284: if hook == 0, usa defaultHook. Pero si defaultHook es 0 tambien, se llama postDispatch en address(0) que revierte. setDefaultHook requiere isContract, pero un contrato puede ser selfdestructed post-set. Post-Cancun selfdestruct no borra code en la misma tx, pero en Dencun+ si se deploya con CREATE2 y se selfdestruct, el code desaparece."
  poc_sketch: ''
  call_stack: 'dispatch(hook=0) -> hook = defaultHook -> if defaultHook destroyed -> hook.postDispatch reverts'

- id: M-AC-07
  tier: 1
  type: property
  description: "process() marca delivery ANTES de verificar ISM -- si ISM verify falla, la tx completa revierte y delivery no persiste (CEI violation seguro)"
  attack_scenario: "process() escribe deliveries[_id] en L225-228 ANTES de llamar ism.verify() en L235-238. Si ism.verify() falla, el require revierte toda la tx incluyendo el write -- correcto. PERO si ism.verify() tiene un side-effect que lee deliveries[_id] (eg para evitar doble-verificacion), veria el mensaje como ya delivered durante la misma tx. Esto podria causar un bypass si un ISM custom chequea delivered() del mailbox como parte de su logica."
  impact: "ISM que lee delivered() durante verify() veria el mensaje como ya procesado, potencial bypass de verificacion en ISMs custom que confian en este estado"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que un mensaje no se marca como delivered si ISM verification falla
    // Esto es inherente al revert, pero verificamos la invariante explicitamente
    bytes32 randomId = keccak256(abi.encodePacked(block.timestamp, block.number));
    t(!originMailbox.delivered(randomId), "M-AC-07: random message ID shows as delivered");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 60
  notes: "La CEI violation en process() es intencional segun el comment de Hyperlane. El revert en ism.verify() deshace el write. Pero el patron es riesgoso: durante la ejecucion de ism.verify(), el estado temporal muestra el mensaje como delivered. Si el ISM hace un callback al mailbox o chequea delivered(), podria confundirse. Este es un anti-patron conocido."
  poc_sketch: 'Deployar ISM que en verify() llama mailbox.delivered(id) y retorna true si ya esta delivered. Observar que durante process(), el ISM veria delivered=true ANTES de que verify complete.'
  call_stack: 'process -> deliveries[_id] = Delivery{...} -> ism.verify() [ISM lee delivered(_id) = true] -> return true -> handle()'

- id: M-AC-08
  tier: 2
  type: property
  description: "El nonce del Mailbox debe ser estrictamente monotonicamente creciente y nunca decrementar o resetear"
  attack_scenario: "Si el nonce puede ser reseteado o decrementado, dos mensajes distintos podrian tener el mismo nonce, generando el mismo message ID (via keccak del message que incluye nonce). Esto causaria colision: el segundo mensaje con el mismo ID seria rechazado por delivered() en el destino, o peor, ambos serian considerados el mismo mensaje."
  impact: "Colision de message IDs -- DoS de mensajes legitimos, potencial replay si dos mensajes con el mismo ID son interpretados como uno"
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que nonce solo crece
    uint32 currentNonce = originMailbox.nonce();
    gte(uint256(currentNonce), uint256(ghost_lastNonce), "M-AC-08: nonce decreased");
    ghost_lastNonce = currentNonce;
  ghost_vars:
    - "uint32 ghost_lastNonce"
  validated: true
  priority: high
  confidence: 90
  notes: "nonce solo se modifica en dispatch() L301: nonce += 1. No hay funcion que decremente. Es uint32, asi que wraps at 2^32. Si se envian 4B+ mensajes, wrap a 0 causaria colision. Improbable en practica pero el invariante detecta cualquier anomalia."
  poc_sketch: ''
  call_stack: 'dispatch -> nonce += 1 (solo incremento, nunca decremento)'

- id: M-AC-09
  tier: 1
  type: property
  description: "dispatch() permite pasar cualquier IPostDispatchHook arbitrario -- un hook malicioso puede recibir ETH (msg.value) y no retornarlo"
  attack_scenario: "Cualquier usuario llama dispatch() con un hook malicioso que en postDispatch() simplemente se queda con el ETH enviado. El Mailbox envia msg.value - requiredValue al hook custom. Si un usuario envia mas ETH del necesario, el exceso va al hook malicioso del caller. Esto es by-design (el caller elige su propio hook), pero un front-end malicioso podria enganyar a un usuario para usar un hook que roba su exceso de ETH."
  impact: "Perdida de ETH excedente enviado con dispatch() si el hook custom no retorna fondos"
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que el balance del mailbox no acumula ETH indebidamente
    uint256 mailboxBal = address(originMailbox).balance;
    // El mailbox no deberia retener ETH -- todo se envia a hooks/recipients
    lte(mailboxBal, 1 ether, "M-AC-09: mailbox retaining excessive ETH");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 50
  notes: "Esto es by-design: el caller de dispatch() elige el hook. Si el caller pasa un hook malicioso, es self-inflicted. No es un bug del Mailbox sino un riesgo de UX. Clasificado bajo porque el atacante solo se perjudica a si mismo."
  poc_sketch: ''
  call_stack: 'dispatch -> hook.postDispatch{value: msg.value - requiredValue}(metadata, message) -> hook retiene ETH'

