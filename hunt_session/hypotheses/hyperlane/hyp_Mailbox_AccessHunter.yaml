false_positives:
- description: "dispatch() es permissionless -- cualquiera puede enviar mensajes"
  reason: "By design. Dispatch es como enviar un email -- cualquiera puede hacerlo. La seguridad esta en el ISM de verificacion del lado receptor. No es un bug de access control."

- description: "process() es permissionless -- cualquiera puede entregar mensajes"
  reason: "By design. El relayer es permissionless. La seguridad depende de ism.verify() que valida el mensaje. No necesita access control en el caller de process()."

- description: "quoteDispatch() no tiene access control"
  reason: "Es una funcion view que solo calcula fees. No modifica estado. No necesita restriccion."

- description: "recipientIsm() es publica y cualquiera puede consultar el ISM de un recipient"
  reason: "Es informacion publica necesaria para que los relayers sepan que metadata enviar. No es un leak de seguridad."

trust_boundary_map:
  dispatch:
    caller_trust: "Permissionless -- by design. Cualquier address puede dispatch."
    callee_trust: "Llama a requiredHook y hook custom con ETH. El hook custom es elegido por el caller."
    value_trust: "msg.value se divide entre requiredHook y hook. Si msg.value < requiredValue, defer al hook para revertir."
    state_trust: "Depende de que nonce no overflow (uint32), defaultHook/requiredHook sean contratos validos."
  process:
    caller_trust: "Permissionless -- seguridad delegada a ISM verify."
    callee_trust: "Llama a ism.verify() y recipient.handle(). ISM es elegido por recipient o es defaultIsm. Recipient es el address en el mensaje."
    state_trust: "delivered() check previene replay. CEI violation: delivery se marca ANTES de verify."
    value_trust: "msg.value se envia al recipient via handle(). No hay validacion de que el valor sea correcto."
  setDefaultIsm:
    caller_trust: "onlyOwner -- correcto."
    callee_trust: "Solo verifica isContract. No verifica que el ISM implementa la interface correctamente."
    admin_trust: "Owner puede cambiar ISM a cualquier contrato sin timelock ni delay."
