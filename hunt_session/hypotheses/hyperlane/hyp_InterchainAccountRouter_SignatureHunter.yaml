- id: IAR-SIG-01
  tier: 1
  type: property
  description: "revealAndExecute carece de control de acceso: cualquiera que conozca salt+calls puede front-runnear el reveal del CCIP read callback y ejecutar las calls directamente en el ICA"
  attack_scenario: >
    1. Usuario envia callRemoteCommitReveal con un swap secreto (commit).
    2. El commitment llega al ICA via handle() y se almacena.
    3. El CCIP read server devuelve (ica, salt, calls) al relayer para el reveal.
    4. Un atacante observa la tx del relayer en el mempool con el metadata (salt, calls) visible en calldata.
    5. El atacante front-runnea llamando ica.revealAndExecute(calls, salt) directamente.
    6. Las calls se ejecutan con el front-runner como contexto de transaccion (puede sandwich el swap).
    7. El reveal original del relayer falla porque el commitment ya fue borrado.
    Impacto: El proposito del commit-reveal (secreto de calldata) se anula completamente.
    El atacante puede sandwich swaps que el usuario intento proteger.
  impact: "Perdida del secreto de calldata en commit-reveal. Swaps protegidos son sandwicheables. Valor en riesgo = valor de cada swap protegido por commit-reveal."
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // Simular que cualquiera puede ejecutar un commitment pendiente
    // Setup: commitment fue seteado por el owner (router)
    bytes32 testSalt = bytes32(uint256(1));
    CallLib.Call[] memory calls = new CallLib.Call[](1);
    calls[0] = CallLib.Call({to: address(0xdead), data: "", value: 0});
    bytes32 commitHash = keccak256(abi.encodePacked(testSalt, abi.encode(calls)));
    // Pre-condition: commitment exists
    t(ica.commitments(commitHash), "IAR-SIG-01: commitment should exist pre-reveal");
    // Attack: non-owner calls revealAndExecute
    vm.prank(attacker);
    ica.revealAndExecute(calls, testSalt);
    // Post-condition: commitment consumed by attacker
    t(!ica.commitments(commitHash), "IAR-SIG-01: commitment consumed by non-owner");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 92
  notes: >
    revealAndExecute en OwnableMulticall.sol L52-71 no tiene modifier onlyOwner.
    Cualquiera puede llamarla. El commit-reveal pattern depende de que las calls
    sean secretas, pero el metadata del CCIP callback las expone en calldata on-chain.

