- id: IAR-SIG-08
  tier: 1
  type: property
  description: "CommitmentReadIsm.verify() confia en el metadata provider para el address del ICA sin validar que corresponde al mensaje - un relayer malicioso puede redirigir calls a otro ICA"
  attack_scenario: >
    1. Mensaje de reveal llega con commitment C y ISM = CommitmentReadIsm.
    2. CommitmentReadIsm.verify() recibe metadata = (ica_address, salt, calls).
    3. El ISM valida que hash(salt, calls) == commitment del mensaje.
    4. PERO: el ica_address en metadata[0:20] NO se valida contra el mensaje.
    5. Un CCIP server malicioso o un relayer que controla el metadata puede poner
       ica_address = ICA_de_victima que tiene un commitment pendiente con el mismo hash.
    6. Si dos ICAs tienen commitments con el mismo hash (posible si same salt+calls),
       el atacante redirige la ejecucion al ICA equivocado.
    7. El ICA de la victima ejecuta calls que fueron autorizadas por ella pero con timing
       controlado por el atacante.
  impact: "Ejecucion de calls en ICA equivocado si dos ICAs comparten el mismo commitment hash. El atacante controla el timing pero no las calls. Medium porque requiere colision de commitment hash."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that CommitmentReadIsm does NOT validate ICA address against message origin
    // The metadata ICA address is taken at face value
    address wrongIca = address(0xBEEF);
    bytes memory maliciousMetadata = abi.encodePacked(
        bytes20(wrongIca),  // wrong ICA address
        salt,
        abi.encode(calls)
    );
    bytes32 metadataHash = keccak256(maliciousMetadata[20:]);
    // If commitment matches, verify will call wrongIca.revealAndExecute
    // This should NOT be allowed
    t(metadataHash == commitment, "IAR-SIG-08: hash matches but ICA is wrong");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 78
  notes: >
    CommitmentReadIsm.sol L57: revealedHash = keccak256(_metadata[20:]) valida salt+calls.
    L65: ica = address(bytes20(_metadata[:20])) toma el ICA sin validacion.
    El ica address NO es parte del commitment hash. Un metadata provider malicioso
    puede redirigir a cualquier ICA que tenga un commitment pendiente con el mismo hash.

- id: IAR-SIG-09
  tier: 2
  type: property
  description: "CheckpointLib.digest usa abi.encodePacked con tipos mixtos (uint32, bytes32, bytes32, uint32, bytes32) - sin riesgo de colision porque los tipos son fixed-size, pero domainHash incluye string literal sin length prefix"
  attack_scenario: >
    1. domainHash = keccak256(abi.encodePacked(origin, merkleTreeHook, "HYPERLANE")).
    2. abi.encodePacked con un string literal concatena los bytes directamente.
    3. Si un atacante puede controlar merkleTreeHook tal que los ultimos bytes de
       merkleTreeHook + primeros bytes de "HYPERLANE" forman un hash diferente...
    4. Pero merkleTreeHook es bytes32 (32 bytes fijos) y "HYPERLANE" es constante.
    5. No hay ambiguedad en el packing porque bytes32 siempre ocupa 32 bytes.
    Conclusion: No hay colision posible. abi.encodePacked es seguro aqui porque
    todos los tipos son fixed-size excepto el string literal que es constante.
  impact: "Sin impacto. El uso de abi.encodePacked es seguro en este contexto."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify no collision in domainHash with different origins
    bytes32 hash1 = CheckpointLib.domainHash(1, bytes32(uint256(0xABC)));
    bytes32 hash2 = CheckpointLib.domainHash(2, bytes32(uint256(0xABC)));
    t(hash1 != hash2, "IAR-SIG-09: different origins must produce different domain hashes");
    bytes32 hash3 = CheckpointLib.domainHash(1, bytes32(uint256(0xDEF)));
    t(hash1 != hash3, "IAR-SIG-09: different merkleTreeHooks must produce different hashes");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 95
  notes: >
    CheckpointLib.sol L39: abi.encodePacked(domainHash, root, index, messageId)
    todos fixed-size. L90: abi.encodePacked(origin, merkleTreeHook, "HYPERLANE")
    origin=uint32(4), merkleTreeHook=bytes32(32), "HYPERLANE"=9 bytes constante.
    No hay ambiguedad.

- id: IAR-SIG-10
  tier: 2
  type: property
  description: "MultisigIsm verify() con threshold=0 revierte pero threshold=1 con un solo validador permite que un unico validador comprometido apruebe cualquier mensaje"
  attack_scenario: >
    1. validatorsAndThreshold configura threshold=1 con [validatorA].
    2. validatorA es comprometido (clave privada robada).
    3. Atacante firma un checkpoint fraudulento para un mensaje malicioso.
    4. verify() acepta la firma unica y el mensaje se procesa.
    5. Para ICA: el atacante ejecuta calls arbitrarias en el ICA de la victima
       (si el ISM del ICA usa este multisig con threshold 1).
  impact: "Control total del ICA si el unico validador es comprometido. Severity depende del threshold configurado - con threshold >= 2 requiere comprometer multiples validadores."
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that threshold=0 is rejected
    // This is enforced at AbstractMultisigIsm.sol L104
    // require(_threshold > 0, "No MultisigISM threshold present for message");
    (address[] memory validators, uint8 threshold) = multisigIsm.validatorsAndThreshold(message);
    t(threshold > 0, "IAR-SIG-10: threshold must be > 0");
    t(validators.length >= threshold, "IAR-SIG-10: enough validators for threshold");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: >
    AbstractMultisigIsm.sol L104: threshold > 0 check existe.
    El riesgo es configuracion, no codigo. Pero vale verificar que no existe un path
    donde threshold puede ser 0 tras deployment.

- id: IAR-SIG-11
  tier: 1
  type: property
  description: "MultisigIsm verify() no verifica que las firmas sean unicas - el mismo validador podria firmar con s-value malleability para producir dos firmas 'diferentes' que recoveran al mismo address"
  attack_scenario: >
    1. threshold = 2, validators = [A, B].
    2. Atacante solo tiene la clave de A.
    3. Atacante firma digest con s en lower half -> firma1, recover = A.
    4. OZ ECDSA.recover normaliza s, asi que firmar con s en upper half tambien
       recovera a A (OZ convierte a lower half internamente).
    5. PERO: el two-pointer technique en verify() requiere que las firmas esten
       ordenadas por validator index. Despues de matchear A en indice 0,
       _validatorIndex se incrementa a 1. La segunda firma (tambien A) necesitaria
       matchear un validator en indice >= 1. Solo B esta ahi, y A != B.
    6. Conclusion: El two-pointer previene reuso del mismo validador.
    PERO: si validators = [A, B, A] (A aparece dos veces por configuracion erronea),
    el atacante con solo la clave de A puede satisfacer threshold=2.
  impact: "En configuracion correcta (sin duplicados en validator set), no hay bypass. Con duplicados, un solo validador comprometido puede satisfacer threshold > 1."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that duplicate validators in the set would allow single-key bypass
    // Pre-condition: validator set should not have duplicates
    (address[] memory validators, ) = multisigIsm.validatorsAndThreshold(message);
    for (uint i = 0; i < validators.length; i++) {
        for (uint j = i + 1; j < validators.length; j++) {
            t(validators[i] != validators[j], "IAR-SIG-11: duplicate validator in set");
        }
    }
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 80
  notes: >
    AbstractMultisigIsm.sol L109-121: two-pointer technique es correcto para
    validadores unicos. No hay check on-chain de duplicados en el validator set.
    OZ ECDSA.recover normaliza s-value, previniendo signature malleability.

