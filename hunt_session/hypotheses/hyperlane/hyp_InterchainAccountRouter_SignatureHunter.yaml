- id: IAR-SIG-03
  tier: 1
  type: property
  description: "route() permite que un atacante especifique un ISM arbitrario en el body del mensaje, incluyendo un ISM trivial que siempre retorna true"
  attack_scenario: >
    1. Atacante en chain A envia un mensaje al router en chain B con _ism = address(TrivialISM) en el body.
    2. El router hereda AbstractRoutingIsm y usa route() para determinar el ISM.
    3. route() lee el ISM del body del mensaje y lo usa directamente.
    4. TrivialISM.verify() siempre retorna true.
    5. El Mailbox acepta el mensaje como verificado y llama handle().
    6. handle() crea/accede un ICA cuyo salt incluye el ISM trivial.
    7. Pero: el ICA resultante es DIFERENTE del ICA del usuario legitimo (porque salt incluye ISM).
    Conclusion: By design, el ISM es parte del salt de derivacion del ICA.
    Un atacante solo obtiene acceso a un ICA vacio, no al ICA del victim.
    PERO: si el atacante pre-carga fondos al ICA derivado con ISM trivial y luego
    usa ese mismo ISM para ejecutar calls, tiene un ICA con fondos controlable
    sin validadores reales. Esto es by design.
  impact: "Bajo impacto directo - el atacante solo controla ICAs derivados con su ISM trivial. No puede acceder a ICAs de otros usuarios que usan ISMs legitimis."
  impact_rating: Low
  likelihood: High
  severity_final: null
  solidity: |
    // Verificar que diferentes ISMs producen diferentes ICAs
    address ism1 = address(0x1111);
    address ism2 = address(0x2222);
    address ica1 = address(router.getLocalInterchainAccount(origin, owner, routerAddr, ism1));
    address ica2 = address(router.getLocalInterchainAccount(origin, owner, routerAddr, ism2));
    t(ica1 != ica2, "IAR-SIG-03: different ISMs must produce different ICAs");
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 95
  notes: >
    El diseno es intencional ("designed to receive messages from untrusted remote contracts").
    El ISM en el salt previene cross-contamination entre ICAs de diferentes ISMs.
    Pero vale documentar que no hay validacion del ISM en route() - se confia en que
    el ISM especificado sea seguro. Un usuario que configura ISM=0 usara defaultIsm.

- id: IAR-SIG-04
  tier: 2
  type: property
  description: "CommitmentReadIsm.verify() ejecuta side effects (state changes + external calls) durante la verificacion del ISM, rompiendo la asuncion de que verify() es pure/view"
  attack_scenario: >
    1. El Mailbox llama ism.verify(metadata, message) esperando que sea una operacion de lectura.
    2. CommitmentReadIsm.verify() es `external` (no view), y llama ica.revealAndExecute().
    3. revealAndExecute() borra el commitment del storage Y ejecuta external calls arbitrarias.
    4. Si alguna de esas calls revierte parcialmente o tiene reentrancy, el estado del ISM
       verification queda inconsistente.
    5. Mas grave: si el Mailbox tiene logica post-verify que asume estado limpio, las calls
       ejecutadas dentro de verify() pueden manipular ese estado.
  impact: "Side effects durante ISM verification. Potencial reentrancy si las calls en el reveal interactuan con el Mailbox o el router. Dificil de explotar pero rompe invariante fundamental de ISMs."
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que verify() modifica state (no es view)
    // Pre-condition: commitment exists in ICA
    bytes32 commitHash = keccak256(abi.encodePacked(salt, abi.encode(calls)));
    t(ica.commitments(commitHash), "IAR-SIG-04: commitment should exist before verify");
    // Call verify via the ISM
    commitmentReadIsm.verify(metadata, message);
    // Post-condition: commitment was deleted DURING verify
    t(!ica.commitments(commitHash), "IAR-SIG-04: verify() should have caused state change");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: >
    CommitmentReadIsm.verify() en L52-79 es external (no view/pure).
    Llama ica.revealAndExecute() que modifica storage y hace external calls.
    Esto es by design para el commit-reveal pattern pero es anomalo para ISMs.

