- id: AIAR-SIG-01
  tier: 2
  type: property
  description: "_getSalt uses abi.encodePacked with uint32 + four bytes32 -- no collision risk because all fixed-size types, but verify determinism is correct"
  attack_scenario: |
    _getSalt(uint32 _origin, bytes32 _owner, bytes32 _router, bytes32 _ism, bytes32 _userSalt)
    uses abi.encodePacked. Since ALL parameters are fixed-size types (uint32=4 bytes, bytes32=32
    bytes each), there is NO collision risk from encodePacked. The total packed size is
    4 + 32 + 32 + 32 + 32 = 132 bytes, which is deterministic and unambiguous.

    However, the interesting angle is: can two DIFFERENT sets of parameters produce the same salt?
    Since keccak256 of 132 distinct bytes is collision-resistant, this is not practically exploitable.

    The real concern: _origin is uint32 (4 bytes) packed adjacent to _owner (bytes32). The first
    4 bytes of _owner could theoretically be confused with _origin in some off-chain tooling
    that reconstructs the salt, but on-chain the encoding is deterministic.
  impact: "None -- no collision possible with all fixed-size types in encodePacked"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that different parameters produce different salts (no collision)
    bytes32 salt1 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(1)), bytes32(uint256(2)), bytes32(uint256(3)), bytes32(uint256(4))));
    bytes32 salt2 = keccak256(abi.encodePacked(uint32(1), bytes32(uint256(1)), bytes32(uint256(2)), bytes32(uint256(3)), bytes32(uint256(5))));
    t(salt1 != salt2, "AIAR-SIG-01: different params must produce different salts");
    // Also verify origin=1,owner=X is different from origin=2,owner=Y
    bytes32 salt3 = keccak256(abi.encodePacked(uint32(2), bytes32(uint256(1)), bytes32(uint256(2)), bytes32(uint256(3)), bytes32(uint256(4))));
    t(salt1 != salt3, "AIAR-SIG-01: different origins must produce different salts");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: "abi.encodePacked with all fixed-size types is safe. This is a non-issue but documented for completeness."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-SIG-02
  tier: 1
  type: property
  description: "InterchainAccountMessage.encode uses abi.encodePacked for prefix (uint8+bytes32+bytes32+bytes32) concatenated with abi.encode for calls -- the boundary is unambiguous but the message has no replay protection (no nonce, no chainId)"
  attack_scenario: |
    The cross-chain message body contains: MessageType (1 byte) + owner (32 bytes) + ISM (32 bytes)
    + userSalt (32 bytes) + abi.encode(calls). There is NO nonce, NO chainId, NO timestamp in the
    message body itself. Replay protection relies entirely on the Hyperlane Mailbox and ISM.

    If the ISM is misconfigured (e.g., set to address(0) via AIAR-AC-06), a relayer could
    replay a previously delivered message. The Mailbox has its own delivered mapping, but if
    a different mailbox instance is used (e.g., after an upgrade or on a fork), old messages
    could be replayed.

    Specific to the abstract base: callRemoteWithOverrides encodes msg.sender as the owner.
    There is no nonce incrementing. If the same user sends the same calls to the same destination
    with the same overrides, the message body is IDENTICAL. The Mailbox nonce prevents replay
    within the same mailbox, but the message body itself is replayable across mailbox instances.
  impact: "Medium -- message replay possible if Mailbox/ISM protections fail (defense in depth missing)"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that two dispatches from the same sender with same params produce messages
    // that are distinguishable (they should differ due to mailbox nonce, not message body)
    // The message body itself has no nonce -- this is by design (mailbox handles it)
    // We verify the mailbox nonce increments after each dispatch
    uint32 nonceBefore = originMailbox.nonce();
    // After a dispatch, nonce should increment
    gte(
        uint256(originMailbox.nonce()),
        uint256(nonceBefore),
        "AIAR-SIG-02: mailbox nonce must not decrease"
    );
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 65
  notes: |
    The message body has no intrinsic replay protection. This is standard for Hyperlane --
    the Mailbox's delivered mapping is the replay guard. But if ISM is address(0) (AIAR-AC-06),
    message verification is skipped, and relay+replay becomes trivial.
  poc_sketch: ''
  call_stack: "callRemoteWithOverrides -> InterchainAccountMessage.encode -> _dispatchMessageWithValue -> mailbox.dispatch"

- id: AIAR-SIG-03
  tier: 1
  type: property
  description: "forceApprove in _dispatchMessageWithValue grants max allowance based on hookMetadata.feeToken() -- attacker-controlled hookMetadata can specify any token address"
  attack_scenario: |
    In callRemoteWithOverrides, _hookMetadata is a user-supplied bytes parameter. The feeToken
    is extracted from _hookMetadata via StandardHookMetadata.feeToken(). If the caller crafts
    hookMetadata to specify a feeToken that the router holds (e.g., from previous operations),
    the flow is:
    1. _fee = _Router_quoteDispatch(...) -- may return 0 if hook doesn't charge for that token
    2. safeTransferFrom(msg.sender, router, _fee) -- transfers 0 tokens
    3. forceApprove(hook, type(uint256).max) -- grants hook max allowance on that token

    If _fee is 0, the safeTransferFrom is a no-op (transfers 0), but the forceApprove still
    executes, granting the hook unlimited allowance on the specified feeToken. Combined with
    a compromised or malicious hook, this drains the router's balance of that token.

    NOTE: The hook is `hook` (the contract's configured hook, not user-specified in
    callRemoteWithOverrides). So the attacker cannot specify an arbitrary hook here. But they
    CAN specify an arbitrary feeToken, granting the legitimate hook max allowance on any token
    the router holds.
  impact: "Medium -- grants router's configured hook unlimited allowance on ANY ERC20 token the router holds, controlled by attacker-specified hookMetadata"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After a callRemoteWithOverrides, the hook should not have allowance on tokens
    // that were not actually used as fee tokens
    address hookAddr = address(originRouter.hook());
    uint256 feeTokenAllowance = feeToken.allowance(address(originRouter), hookAddr);
    uint256 routerFeeBalance = feeToken.balanceOf(address(originRouter));
    // If router has tokens and hook has unlimited allowance, this is exploitable
    if (routerFeeBalance > 0) {
        // Allowance should not exceed what was actually transferred for fees
        lte(
            feeTokenAllowance,
            ghost_totalMsgValueSent + routerFeeBalance,
            "AIAR-SIG-03: hook has excessive allowance on fee token"
        );
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: |
    Distinct from DD-01 (approveFeeTokenForHook is permissionless). This is the internal path
    where attacker controls hookMetadata.feeToken() but the hook is the contract's configured hook.
    The risk is that the hook gets max approval on tokens it should not have access to.
  poc_sketch: |
    1. Someone sends ERC20 X to the router (donation, airdrop, fee residual)
    2. Attacker calls callRemoteWithOverrides with hookMetadata encoding tokenX as feeToken
    3. Hook quotes 0 fee for tokenX (it doesn't use tokenX)
    4. safeTransferFrom(attacker, router, 0) -- no-op
    5. forceApprove(hook, type(uint256).max) for tokenX
    6. If hook is upgradeable or has a drain function, it can now pull all tokenX from router
  call_stack: "callRemoteWithOverrides -> _dispatchMessageWithValue (line 257-267)"

- id: AIAR-SIG-04
  tier: 2
  type: property
  description: "InterchainAccountMessage encodes ISM as bytes32 from callRemoteWithOverrides -- the ISM in the message can differ from the enrolled ISM, allowing per-message ISM override"
  attack_scenario: |
    callRemoteWithOverrides takes _ism as a parameter and encodes it directly into the message:
    InterchainAccountMessage.encode(msg.sender, _ism, _calls). On the destination side, the
    handler uses this ISM to determine which security module verifies the message for the ICA.

    An attacker can specify _ism = bytes32(0) (no ISM) in the message body. The destination
    handler creates/fetches an ICA with ISM=address(0). If the destination router's handle()
    uses the message-embedded ISM for the ICA (which it does -- getDeployedInterchainAccount
    uses the ISM from the message), then the ICA is created with a zero ISM.

    Different ISM values produce different ICA addresses (different Create2 salt). So specifying
    ISM=0 creates a DIFFERENT ICA than ISM=realIsm. The attacker gets their own ICA with no
    ISM protection, but it's a different address -- they can't access the victim's ICA.
  impact: "Low -- each ISM value produces a unique ICA address, so ISM override only affects the caller's own account"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Different ISM values must produce different ICA addresses
    address ica1 = address(destRouter.getLocalInterchainAccount(
        ORIGIN, USER1, address(originRouter), address(destRouter)
    ));
    address ica2 = address(destRouter.getLocalInterchainAccount(
        ORIGIN, USER1, address(originRouter), address(0)
    ));
    t(ica1 != ica2, "AIAR-SIG-04: different ISMs must produce different ICA addresses");
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: "ISM is part of the Create2 salt, so different ISMs produce different ICAs. This is by design -- no cross-ICA attack possible."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-SIG-05
  tier: 2
  type: property
  description: "interchainSecurityModule() returns address(this) -- the router IS its own ISM, meaning verify() is called on the router itself for incoming messages"
  attack_scenario: |
    interchainSecurityModule() returns IInterchainSecurityModule(address(this)). This means
    when the mailbox calls process() to deliver a message to this contract, it asks the
    recipient for its ISM, gets address(this), and calls verify() on the router itself.

    The abstract contract does NOT implement IInterchainSecurityModule.verify(). The child
    contract MUST implement it. If a child contract inherits AbstractInterchainAccountRouter
    but forgets to implement verify(), the call would revert (no matching function selector)
    or call a fallback if one exists.

    More importantly: since the router IS its own ISM, anyone who can manipulate the router's
    state can affect message verification. The verify() function shares the same contract
    storage as the router logic. If there's a storage collision between ISM state and router
    state, verification could be bypassed.
  impact: "Medium -- self-ISM pattern means verification logic shares storage with business logic, increasing attack surface"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verify that interchainSecurityModule returns address(this)
    address ism = address(destRouter.interchainSecurityModule());
    eq(
        uint256(uint160(ism)),
        uint256(uint160(address(destRouter))),
        "AIAR-SIG-05: ISM must be the router itself"
    );
  ghost_vars: []
  validated: true
  priority: medium
  confidence: 70
  notes: |
    The self-ISM pattern is intentional for Hyperlane ICA routers. The child contract must
    implement verify(). The storage sharing is a design choice that increases attack surface
    but simplifies deployment.
  poc_sketch: ''
  call_stack: "interchainSecurityModule() -> address(this)"

