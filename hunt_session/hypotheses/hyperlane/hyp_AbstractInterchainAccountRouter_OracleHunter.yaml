- id: AIAR-O-01
  tier: 1
  type: property
  description: "quoteGasPayment uses empty body (new bytes(0)) for quote but actual dispatch sends non-empty body -- fee quote may be inaccurate if hook prices based on message size"
  attack_scenario: "1. User calls quoteGasPayment(dest, gasLimit) to estimate fee. Quote uses new bytes(0) as message body. 2. User calls callRemoteWithOverrides with msg.value = quoted amount. 3. Actual message body includes encoded InterchainAccountMessage (owner + ism + calls array) which can be large. 4. If the hook's quoteDispatch() prices based on message body size, the actual fee is higher than the quote. 5. dispatch() reverts with insufficient fee, or the hook silently undercharges. If hook uses msg.value and user sent quoted amount, the dispatch could fail or succeed with underpayment."
  impact: "Users systematically underpay for cross-chain messages. If hook reverts on underpayment -- DoS. If hook accepts underpayment -- relayer subsidy drain."
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // Quote should be >= actual cost for the same parameters
    // quoteGasPayment uses empty body, but real dispatch uses encoded message
    // We compare the two quotes
    uint256 quoteEmpty = originRouter.quoteGasPayment(DESTINATION, 200000);
    // The quote with empty body should be a lower bound -- if actual message is larger,
    // the real cost could be higher. We just verify the quote is non-zero as a sanity check.
    gte(quoteEmpty, 0, "AIAR-O-01: quote should be non-negative");
    // The real test: ghost tracks if any dispatch failed due to insufficient value
    t(!ghost_dispatchFailedInsufficientFee, "AIAR-O-01: dispatch failed due to fee mismatch from quote");
  ghost_vars:
  - bool internal ghost_dispatchFailedInsufficientFee;
  validated: false
  priority: high
  confidence: 75
  notes: "quoteGasPayment (line 204-215) passes new bytes(0) as messageBody to _Router_quoteDispatch. But the actual dispatch in _dispatchMessageWithValue passes the full encoded body. If the hook (e.g., InterchainGasPaymaster) quotes based on message size, there is a discrepancy. Most Hyperlane hooks quote based on gas limit metadata only, not body size -- so this may be a non-issue for current hooks. But future hooks or custom hooks could break."
  poc_sketch: ''
  call_stack: 'quoteGasPayment -> _Router_quoteDispatch(dest, new bytes(0), gasLimitMetadata, hook) vs _dispatchMessageWithValue -> mailbox.dispatch(dest, router, fullBody, metadata, hook)'

- id: AIAR-O-02
  tier: 1
  type: property
  description: "_dispatchMessageWithValue quotes fee then transfers exact amount, but fee could change between quote and dispatch in same tx if hook state is mutable"
  attack_scenario: "1. _dispatchMessageWithValue calls _Router_quoteDispatch to get _fee. 2. Transfers _fee from msg.sender to router. 3. Approves hook for type(uint256).max. 4. Calls mailbox.dispatch which calls hook.postDispatch. 5. If between steps 1 and 4, the hook's internal state changes (e.g., via reentrancy from safeTransferFrom on a malicious feeToken, or concurrent tx), the actual fee charged by hook could differ from _fee. 6. If actual fee > _fee, dispatch reverts. If actual fee < _fee, excess tokens stuck in router."
  impact: "Excess fee tokens permanently stuck in router contract if actual fee < quoted fee. No sweep mechanism exists."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // After any dispatch with feeToken, the router should not accumulate excess fee tokens
    uint256 routerFeeBalance = feeToken.balanceOf(address(originRouter));
    lte(routerFeeBalance, ghost_maxAcceptableDust, "AIAR-O-02: excess fee tokens stuck in router");
  ghost_vars:
  - uint256 internal ghost_maxAcceptableDust;
  validated: false
  priority: medium
  confidence: 60
  notes: "The forceApprove is type(uint256).max so hook can take any amount. But only _fee was transferred in. If hook takes less than _fee, the remainder stays in router. If hook takes more, it reverts (no balance). The real issue: forceApprove(hook, max) persists after the call -- any leftover tokens from this or previous dispatches can be drained by the hook at any time. See AIAR-O-03."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-O-03
  tier: 1
  type: property
  description: "forceApprove(hook, type(uint256).max) in _dispatchMessageWithValue is persistent -- hook retains unlimited allowance to drain any feeToken balance from router forever"
  attack_scenario: "1. User dispatches message with feeToken=USDC, hook=H1. Router calls forceApprove(H1, max) for USDC. 2. Later, someone sends USDC to router (e.g., via another dispatch that overpays, or direct transfer). 3. Hook H1 can call USDC.transferFrom(router, attacker, entireBalance) at any time since approval is max. 4. This is compounded by receive() which accepts ETH, and the fact that approveFeeTokenForHook is permissionless -- anyone can grant max approval to any address for any token held by the router."
  impact: "Permanent unlimited token approvals to hooks. Combined with permissionless approveFeeTokenForHook (already IAR-DD-01), any token balance in router is drainable."
  impact_rating: High
  likelihood: High
  severity_final: null
  solidity: |
    // After dispatch, the router should NOT have persistent max approval to the hook
    // Check: feeToken allowance from router to any hook should be 0 after dispatch completes
    uint256 allowance = feeToken.allowance(address(originRouter), address(igp));
    // If there is an allowance AND router has balance, tokens are at risk
    uint256 routerBal = feeToken.balanceOf(address(originRouter));
    t(allowance == 0 || routerBal == 0, "AIAR-O-03: persistent approval with non-zero balance -- drain risk");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "Line 267: forceApprove(address(_hook), type(uint256).max) is called every time a feeToken dispatch happens. This approval is never revoked. Combined with the permissionless receive() (line 132), any ETH/tokens that accumulate in the router are at risk. Note: approveFeeTokenForHook (IAR-DD-01) covers the explicit approval path. This finding covers the IMPLICIT approval in _dispatchMessageWithValue which happens on every fee-token dispatch. Different root cause, same effect."
  poc_sketch: ''
  call_stack: '_dispatchMessageWithValue -> IERC20(_feeToken).forceApprove(address(_hook), type(uint256).max) [line 267, never revoked]'

