invariants:
- id: IAR-O-01
  tier: 1
  type: property
  description: >
    CommitmentReadIsm verify() no valida que el ICA address en metadata corresponda
    al ICA derivado del mensaje original. Un off-chain provider malicioso puede
    inyectar una ICA address arbitraria para ejecutar calls en un ICA ajeno.
  attack_scenario: >
    1. Usuario A envía callRemoteCommitReveal con commitment H = hash(salt, calls).
    2. El CCIP-read off-chain provider (fuente de datos "oracle") retorna metadata con
       ICA address = ICA_de_victima (en vez de ICA_de_A).
    3. CommitmentReadIsm.verify() solo valida que keccak256(metadata[20:]) == commitment
       del mensaje REVEAL. No verifica que metadata[:20] (ICA address) sea el ICA correcto.
    4. revealAndExecute se llama en ICA_de_victima — si la victima tiene un commitment
       pendiente con el mismo hash, se ejecutan las calls del atacante en el contexto de
       la victima.
    LIMITACION: Requiere hash collision en commitment (salt+calls) O que ambos ICAs tengan
    el MISMO commitment pendiente. En la practica, el atacante controla salt y calls asi que
    puede crafted un commitment identico si conoce el de la victima.
  impact: >
    Ejecucion arbitraria de calls en ICA ajena si el off-chain data provider es
    comprometido o malicioso. Perdida total de fondos del ICA victima.
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Tras un verify() exitoso, el ICA en metadata debe corresponder al ICA
    // derivable del mensaje original (origin, owner, router, ism, salt).
    // Ghost: guardar ICA esperado cuando se procesa COMMITMENT en handle().
    // Verificar que revealAndExecute solo se llama en el ICA correcto.
    if (ghost_lastCommitmentICA != address(0)) {
        eq(
            ghost_revealExecutedOnICA,
            ghost_lastCommitmentICA,
            "IAR-O-01: reveal executed on wrong ICA"
        );
    }
  ghost_vars:
  - address internal ghost_lastCommitmentICA;
  - address internal ghost_revealExecutedOnICA;
  validated: false
  priority: high
  confidence: 55
  notes: >
    El ICA address en metadata[:20] de CommitmentReadIsm NO se valida contra nada
    derivado del mensaje. revealAndExecute en OwnableMulticall no tiene onlyOwner,
    cualquiera puede llamarlo si conoce el commitment. El unico check es que
    commitments[hash] == true en ese ICA especifico. La pregunta clave es si un
    off-chain provider comprometido puede redirigir la ejecucion a otro ICA.

- id: IAR-O-02
  tier: 1
  type: property
  description: >
    revealAndExecute() en OwnableMulticall no tiene modifier onlyOwner — cualquier
    address puede llamar revealAndExecute si conoce el salt y las calls que producen
    un commitment pendiente. Esto permite front-running del reveal para ejecutar las
    calls antes de que el relayer lo haga.
  attack_scenario: >
    1. Usuario envia commitment via callRemoteCommitReveal. Commitment se almacena en
       ICA.commitments[hash] = true via handle().
    2. Atacante observa el commitment hash en el evento CommitmentSet.
    3. El off-chain provider publica las calls (salt + calls) como respuesta CCIP-read.
    4. Atacante lee la respuesta CCIP-read (publica por naturaleza de EIP-3668) y llama
       revealAndExecute() directamente en el ICA ANTES de que el relayer procese el reveal.
    5. Las calls se ejecutan. Cuando el relayer intenta, el commitment ya fue eliminado.
    IMPACTO: El atacante puede front-run reveals para manipular el orden de ejecucion,
    sandwichear swaps que el usuario queria mantener secretos (ironia del commit-reveal).
  impact: >
    El proposito del commit-reveal (secreto de calldata) se anula. Atacante puede
    sandwichear swaps revelados via CCIP-read, MEV extraction completo.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Si revealAndExecute fue llamado, el caller debe ser el router o el ISM
    // (indicando flujo normal), no un address arbitrario.
    // Ghost: capturar msg.sender en revealAndExecute
    if (ghost_revealCaller != address(0)) {
        bool calledByRouter = ghost_revealCaller == address(router);
        bool calledByISM = ghost_revealCaller == address(ccipReadIsm);
        t(
            calledByRouter || calledByISM,
            "IAR-O-02: revealAndExecute called by unauthorized party"
        );
    }
  ghost_vars:
  - address internal ghost_revealCaller;
  validated: false
  priority: high
  confidence: 75
  notes: >
    revealAndExecute en OwnableMulticall (linea 52-71) es external payable sin
    restriccion de caller. Cualquiera puede llamarlo. Esto es BY DESIGN para que el
    ISM pueda llamarlo, pero abre el vector de front-running. El commit-reveal pattern
    pierde su utilidad si las calls son publicas via CCIP-read antes de ejecucion.

- id: IAR-O-03
  tier: 1
  type: property
  description: >
    El off-chain CCIP-read provider es un single point of failure — si retorna datos
    incorrectos o esta caido, el reveal message queda permanentemente atascado y el
    commitment nunca se ejecuta, bloqueando fondos en el ICA.
  attack_scenario: >
    1. Usuario envia callRemoteCommitReveal. El commitment se almacena en ICA.
    2. El CCIP-read provider (URL configurado en CommitmentReadIsm) se cae o es
       comprometido para retornar datos invalidos.
    3. El relayer no puede obtener metadata valida para verify().
    4. El commitment queda en commitments[hash] = true PERMANENTEMENTE.
    5. No existe mecanismo para cancelar/expirar un commitment pendiente.
    6. Si el usuario intenta enviar otro commitment con el mismo hash, revierte
       por "ICA: Previous commitment pending execution".
    VARIANTE: Provider malicioso retorna datos que pasan verify() pero con calls
    diferentes (imposible por hash check), o retorna datos con ICA address incorrecta
    (ver IAR-O-01).
  impact: >
    DoS permanente: commitment atascado sin mecanismo de cancelacion. Fondos
    potencialmente bloqueados si el ICA tiene fondos y el commitment era la unica
    forma de moverlos.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante: un commitment pendiente no deberia existir indefinidamente
    // sin mecanismo de cancelacion. Verificar que existe un path para limpiar.
    // Ghost: timestamp cuando se setea commitment
    if (ghost_commitmentSetTimestamp > 0 && ghost_commitmentStillPending) {
        uint256 elapsed = block.timestamp - ghost_commitmentSetTimestamp;
        // Si han pasado mas de 7 dias y el commitment sigue pendiente, es DoS
        t(
            elapsed < 7 days,
            "IAR-O-03: commitment stuck for >7 days without cancel mechanism"
        );
    }
  ghost_vars:
  - uint256 internal ghost_commitmentSetTimestamp;
  - bool internal ghost_commitmentStillPending;
  validated: false
  priority: medium
  confidence: 85
  notes: >
    No existe funcion cancelCommitment() en OwnableMulticall. setCommitment es
    onlyOwner (solo el router) y revierte si ya hay un commitment pendiente con
    el mismo hash. La unica forma de limpiar es revealAndExecute exitoso.

- id: IAR-O-04
  tier: 1
  type: property
  description: >
    callRemoteCommitReveal envia el reveal message con address(this).balance como value
    (linea 654 del router). Si hay ETH residual en el router de transacciones previas,
    el usuario actual obtiene ese ETH extra como subsidio para su reveal, o el reveal
    consume mas ETH del esperado del usuario.
  attack_scenario: >
    1. Multiples usuarios llaman callRemoteCommitReveal enviando msg.value.
    2. El primer _dispatchMessageWithValue usa msg.value para el commitment message.
    3. El segundo _dispatchMessageWithValue usa address(this).balance para el reveal.
    4. Si hay ETH residual en el router (donations, refunds previos, receive()),
       el reveal message lleva MAS valor del que el usuario pago.
    5. Un atacante puede: (a) enviar ETH al router via receive() antes de que otro
       usuario llame callRemoteCommitReveal, inflando el valor del reveal, o
       (b) front-run para drenar el balance residual llamando callRemoteCommitReveal
       con un commitment propio.
  impact: >
    Robo de ETH residual del router. Cualquier ETH que termine en el router (refunds,
    donations accidentales) puede ser capturado por el siguiente callRemoteCommitReveal.
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // El valor enviado en el reveal no debe exceder lo que el usuario pago
    // Ghost: track msg.value vs lo que realmente se uso
    uint256 totalDispatched = ghost_commitMsgValue + ghost_revealMsgValue;
    if (ghost_userMsgValue > 0) {
        lte(
            totalDispatched,
            ghost_userMsgValue,
            "IAR-O-04: reveal dispatched more value than user paid"
        );
    }
  ghost_vars:
  - uint256 internal ghost_userMsgValue;
  - uint256 internal ghost_commitMsgValue;
  - uint256 internal ghost_revealMsgValue;
  validated: false
  priority: high
  confidence: 80
  notes: >
    Linea 630: _commitmentMsgId usa msg.value. Linea 654: _revealMsgId usa
    address(this).balance. Si msg.value > fee del commitment, el exceso queda en
    el router y se suma al balance usado por el reveal. Pero si OTRO usuario ya
    dejo ETH, el siguiente usuario lo captura. El router tiene receive() payable.

- id: IAR-O-05
  tier: 2
  type: property
  description: >
    route() permite que el mensaje REVEAL especifique un ISM arbitrario via
    revealIsm(). Si el ISM especificado es address(0), usa el CCIP_READ_ISM
    por defecto. Pero si se especifica un ISM malicioso que siempre retorna true
    en verify(), el reveal se procesa sin validar el commitment.
  attack_scenario: >
    1. Atacante en chain A llama callRemoteCommitReveal con _ccipReadIsm apuntando
       a un contrato controlado que siempre retorna true en verify().
    2. En chain B, route() decodifica el ISM del mensaje REVEAL y lo retorna.
    3. El mailbox usa este ISM malicioso para verificar — verify() retorna true
       sin validar nada.
    4. handle() recibe el REVEAL y simplemente retorna (linea 170).
    5. PERO: las calls NO se ejecutan en handle() para REVEAL — la ejecucion depende
       de que verify() del ISM llame revealAndExecute(). Si el ISM malicioso no
       llama revealAndExecute, no pasa nada. Si lo hace con datos incorrectos, el
       hash check en el ICA lo detiene.
  impact: >
    Si un ISM custom llama revealAndExecute con datos validos (conoce salt+calls),
    las calls se ejecutan sin el flujo normal de CCIP-read. El impacto real depende
    de si el atacante conoce las calls originales.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // El ISM retornado por route() para mensajes REVEAL debe ser un ISM
    // de confianza (CCIP_READ_ISM o uno enrollado).
    // Ghost: capturar el ISM seleccionado en route()
    if (ghost_revealIsmSelected != address(0)) {
        bool isCcipReadIsm = ghost_revealIsmSelected == address(ccipReadIsm);
        bool isEnrolledIsm = enrolledIsms[ghost_revealIsmSelected];
        t(
            isCcipReadIsm || isEnrolledIsm,
            "IAR-O-05: reveal routed to unenrolled ISM"
        );
    }
  ghost_vars:
  - address internal ghost_revealIsmSelected;
  - mapping(address => bool) internal enrolledIsms;
  validated: false
  priority: medium
  confidence: 45
  notes: >
    El ISM del REVEAL lo controla el sender en la chain origen (linea 645:
    _ccipReadIsm parametro). Si el sender es malicioso, puede apuntar a cualquier
    ISM. Sin embargo, el handle() para REVEAL simplemente retorna sin ejecutar nada
    (linea 170), asi que el impacto depende enteramente de lo que haga el ISM
    custom en verify(). La seguridad recae en que el ISM sea honesto.

- id: IAR-O-06
  tier: 1
  type: property
  description: >
    CommitmentReadIsm.verify() computa revealedHash = keccak256(_metadata[20:]) pero
    el hash en OwnableMulticall.revealAndExecute() es keccak256(abi.encodePacked(salt,
    abi.encode(calls))). Si metadata[20:] != abi.encodePacked(salt, abi.encode(calls)),
    el verify pasa pero revealAndExecute falla, creando un estado inconsistente donde
    el ISM reporta verificacion exitosa pero la ejecucion nunca ocurre.
  attack_scenario: >
    1. Off-chain provider retorna metadata donde bytes[20:52] = salt y bytes[52:] =
       abi.encode(calls). Pero keccak256 de esa concatenacion no es lo mismo que
       keccak256(abi.encodePacked(salt, abi.encode(calls))) si hay padding issues.
    2. En practica: metadata[20:] = salt_bytes ++ abi_encoded_calls. Y abi.encodePacked
       (salt, abi.encode(calls)) = salt_bytes ++ abi_encoded_calls. Son identicos
       porque salt es bytes32 (fixed size) y abi.encode ya produce fixed output.
    3. PERO: verify() computes keccak256(metadata[20:]) y compara con msgCommitment.
       Luego extrae salt = bytes32(metadata[20:52]) y calls = abi.decode(metadata[52:]).
       Luego llama ica.revealAndExecute(calls, salt) que computa su propio hash:
       keccak256(abi.encodePacked(salt, abi.encode(calls))). Este hash debe coincidir
       con el commitment almacenado en el ICA.
    4. Si el commitment almacenado en ICA != revealedHash en verify, hay desync.
  impact: >
    El commitment en el ICA (seteado por setCommitment via handle()) es el valor
    crudo del campo commitment del mensaje. Si este valor difiere del hash que verify()
    computa, el reveal nunca puede ejecutarse. Potencial DoS permanente.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // El hash computado en verify() debe ser identico al commitment almacenado
    // en el ICA via setCommitment().
    // Ghost: capturar ambos hashes
    if (ghost_verifyHash != bytes32(0) && ghost_icaStoredCommitment != bytes32(0)) {
        eq(
            ghost_verifyHash,
            ghost_icaStoredCommitment,
            "IAR-O-06: verify hash != ICA stored commitment"
        );
    }
  ghost_vars:
  - bytes32 internal ghost_verifyHash;
  - bytes32 internal ghost_icaStoredCommitment;
  validated: false
  priority: high
  confidence: 60
  notes: >
    Hay DOS hashes en juego: (1) el commitment enviado por el usuario que se almacena
    en ICA via setCommitment(), y (2) el hash computado en verify/revealAndExecute.
    Si el usuario computa el commitment correctamente como hash(salt, encode(calls)),
    ambos coinciden. Pero si hay un mismatch en como el usuario computa el commitment
    vs como lo computan verify()/revealAndExecute(), hay un bug. El usuario debe saber
    la formula exacta: keccak256(abi.encodePacked(salt, abi.encode(calls))).

- id: IAR-O-07
  tier: 2
  type: property
  description: >
    CCIP-read URLs en CommitmentReadIsm son modificables por el owner. Si el owner
    es comprometido, puede redirigir todas las queries a un servidor malicioso que
    retorna calls manipuladas (aunque el hash check los detiene) o simplemente no
    retorna nada (DoS).
  attack_scenario: >
    1. Owner de CommitmentReadIsm llama setUrls() con URLs controladas por atacante.
    2. Todos los futuros reveal messages van al servidor del atacante.
    3. El servidor no responde -> DoS de todos los commit-reveal en progreso.
    4. O el servidor responde con datos invalidos -> verify() falla -> DoS.
    5. El hash check previene ejecucion de calls diferentes, pero NO previene DoS.
  impact: >
    DoS de todo el sistema commit-reveal si el owner de CommitmentReadIsm es
    comprometido. Commitments pendientes quedan atascados.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // URLs no deben cambiar mientras hay commitments pendientes
    // Ghost: contar commitments activos
    if (ghost_pendingCommitmentsCount > 0) {
        eq(
            ghost_urlsChangedWhilePending,
            false,
            "IAR-O-07: CCIP-read URLs changed with pending commitments"
        );
    }
  ghost_vars:
  - uint256 internal ghost_pendingCommitmentsCount;
  - bool internal ghost_urlsChangedWhilePending;
  validated: false
  priority: low
  confidence: 70
  notes: >
    Admin centralization risk. CommitmentReadIsm owner = el owner pasado al
    constructor del InterchainAccountRouter. setUrls es onlyOwner. No hay timelock.

false_positives:
- hunter: OracleHunter
  id: IAR-FP-01
  reason: >
    Investigue si CommitmentReadIsm.verify() podia retornar true sin llamar
    revealAndExecute. La funcion SIEMPRE llama ica.revealAndExecute() en linea 76
    antes de retornar true. Si revealAndExecute revierte, verify revierte. No hay
    path para que verify retorne true sin ejecucion.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: >
      CommitmentReadIsm verify() siempre ejecuta revealAndExecute como side-effect.
      No es un ISM pasivo — tiene side-effects en verify(). Esto es by design pero
      unusual para un ISM.
    briefing_update_applied: false
- hunter: OracleHunter
  id: IAR-FP-02
  reason: >
    Investigue si route() para mensajes non-REVEAL podia retornar un ISM controlado
    por el atacante. Para CALLS/COMMITMENT, el ISM viene del campo ism del mensaje
    (linea 186-187), con fallback a mailbox.defaultIsm(). El ISM en el mensaje lo
    pone el sender en la chain origen, pero el mailbox valida el mensaje a traves de
    este ISM. Si el ISM es malicioso y retorna true, el mensaje se procesa. Sin embargo,
    esto es by design: "this application is designed to receive messages from untrusted
    remote contracts" (comentario linea 130). La seguridad descansa en el ISM elegido.
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: cross-chain-messaging.md
    content: >
      InterchainAccountRouter handle() no tiene onlyRemoteRouter. Es by design para
      recibir de cualquier sender. La seguridad es delegada enteramente al ISM.
    briefing_update_applied: false
