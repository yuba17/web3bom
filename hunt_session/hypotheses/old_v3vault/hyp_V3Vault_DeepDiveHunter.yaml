      // 2. Create position with high collateral, borrow near max
      // 3. Manipulate oracle to crash collateral value to 0
      // 4. First liquidation succeeds but socializes losses, reducing totalLent
      // 5. Second position also crashes. Try to liquidate.
      // 6. Expect: revert due to underflow in _handleReserveLiquidation
      //
      // function test_cascadingSocializationDoS() public {
      //     // deposit 100 USDC as lender
      //     vault.deposit(100e6, lender);
      //     // create two positions, each borrows 40 USDC
      //     vault.borrow(tokenId1, 40e6);
      //     vault.borrow(tokenId2, 40e6);
      //     // crash both positions to 0 value
      //     mockOracle.setValue(tokenId1, 0, 0, 0);
      //     mockOracle.setValue(tokenId2, 0, 0, 0);
      //     // first liquidation works (reserves can absorb or socialize 40)
      //     vault.liquidate(LiquidateParams(tokenId1, ...));
      //     // totalLent reduced by socialized amount
      //     // second liquidation should revert if remaining debt > new totalLent
      //     vm.expectRevert(); // arithmetic underflow
      //     vault.liquidate(LiquidateParams(tokenId2, ...));
      // }
    call_stack: |
      liquidate() -> _checkLoanIsHealthy() [position unhealthy]
        -> _unstakeIfNeeded()
        -> _calculateLiquidation() [reserveCost = debt when fullValue=0]
        -> _handleReserveLiquidation(reserveCost)
          -> _getBalanceAndReserves() [reserves may be 0 after first socialization]
          -> missing = reserveCost - reserves [missing = debt]
          -> totalLent = totalSupply * lendRate / Q96
          -> (totalLent - missing) [UNDERFLOW if debt > totalLent] -> REVERT
