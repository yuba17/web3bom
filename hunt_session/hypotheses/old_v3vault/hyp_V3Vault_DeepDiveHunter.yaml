  - id: VV-DD-03
    tier: 1
    type: property
    hunter: DeepDiveHunter
    description: >
      Daily debt increase limit permanently shrinks through underwater liquidations.
      When a user borrows X, dailyDebtIncreaseLimitLeft decreases by X. On liquidation,
      it increases by liquidatorCost (L767). For underwater positions where fullValue < debt,
      liquidatorCost < debt (can even be 0 for free liquidations). The difference
      (debt - liquidatorCost) is a permanent reduction in daily headroom that only resets
      at the next day boundary. But the next day's cap is computed from totalLent which
      was ALSO reduced by the socialization. Over many underwater liquidations, both the daily
      cap and the daily remaining shrink, gradually choking new borrowing. Convergence of
      FlowHunter F-09 + DoSHunter DOS-04.
    attack_scenario: |
      1. Day starts: dailyDebtIncreaseLimitLeft = 1000 USDC (10% of 10K lent)
      2. Attacker borrows 800 USDC. dailyDebtIncreaseLimitLeft = 200.
      3. Position goes underwater (fullValue = 100, debt = 800).
      4. Liquidation: liquidatorCost = max(0, 100 - 80) = 20. reserveCost = 780.
      5. dailyDebtIncreaseLimitLeft += 20. Now = 220.
      6. But 800 was borrowed and only 20 returned to the limit. Net loss: 780.
      7. Next day: totalLent reduced by socialized 780. New cap = 10% of (10K - 780) = 922.
      8. Attacker repeats. Each cycle shrinks the pool and the daily cap.
      9. Eventually no one can borrow -- protocol is DoS'd for borrowers.
    solidity: |
      // VV-DD-03: daily debt limit should not be permanently drained by liquidations
      // After any liquidation, dailyDebtIncreaseLimitLeft + (debt - liquidatorCost) should
      // still allow reasonable borrowing
      uint256 limitLeft = vault.dailyDebtIncreaseLimitLeft();
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 totalLent = vault.totalSupply() * lendRate / Q96_val;
      uint256 dailyMin = vault.dailyDebtIncreaseLimitMin();
      // The limit should be at least the admin-configured minimum (if day has been reset)
      // This just checks the current state is internally consistent
      if (totalLent > 0 && dailyMin > 0) {
          // limitLeft should not be 0 unless genuinely at capacity
          uint256 totalDebt = vault.debtSharesTotal() * vault.lastDebtExchangeRateX96() / Q96_val;
          uint256 globalDebtLimit = vault.globalDebtLimit();
          if (totalDebt < globalDebtLimit / 2) {
              // If less than half debt capacity is used, limit should have headroom
              gte(limitLeft + 1, dailyMin / 10,
                "VV-DD-03: daily debt limit drained despite low utilization -- asymmetric drain");
          }
      }
    poc_sketch: |
      // Foundry test:
      // 1. Setup vault with 10K USDC deposits
      // 2. Borrow large amount, crash collateral to near zero
      // 3. Liquidate (free liquidation, liquidatorCost = 0)
      // 4. Check dailyDebtIncreaseLimitLeft -- it should NOT have recovered the borrowed amount
      // 5. Try to borrow with a different user -- should be severely limited
      //
      // function test_dailyLimitDrainViaUnderwaterLiquidation() public {
      //     vault.deposit(10_000e6, lender);
      //     vault.borrow(tokenId, 5_000e6); // uses half the daily limit
      //     // crash collateral
      //     mockOracle.setValue(tokenId, 0, 0, 0);
      //     vault.liquidate(...); // free liquidation, liquidatorCost = 0
      //     // Check: daily limit only recovered 0, not 5000
      //     uint256 limitAfter = vault.dailyDebtIncreaseLimitLeft();
      //     // limitAfter should be much less than initial (1000 - 5000 + 0 = underflow, but capped)
      //     // Other borrowers are now blocked
      // }
    call_stack: |
      borrow(tokenId, 5000e6)
        -> dailyDebtIncreaseLimitLeft -= 5000 [e.g., 1000 -> underflow? No, check first]
        -> Actually: `if (assets > dailyDebtIncreaseLimitLeft) revert`
        -> So borrow is capped at dailyDebtIncreaseLimitLeft
      liquidate()
        -> dailyDebtIncreaseLimitLeft += liquidatorCost [0 for free liq]
        -> Net: limit reduced by (borrowed - 0) = borrowed amount
      Next day:
        -> _resetDailyDebtIncreaseLimit()
        -> limit = max(minLimit, totalLent_new * 10% / Q32)
        -> totalLent_new < totalLent_old (socialization reduced it)
        -> New daily cap is lower. Permanent degradation.
    validated: true
    priority: high
    confidence: 65

  - id: VV-DD-04
    tier: 1
    type: property
    hunter: DeepDiveHunter
    description: >
      Liquidation health check uses staked valuation (ignoreFees=true) but
      _sendPositionValue operates on the now-unstaked position with the staked-era
      feeValue and fullValue. After _unstakeIfNeeded at L748, the NFT is back in the vault.
      But _calculateLiquidation and _sendPositionValue use fullValue/feeValue from the
      staked check (L742-743). For a staked position: feeValue=0, fullValue excludes fees.
      In _sendPositionValue, when liquidationValue < fullValue (partial liquidation), the
      code at L1127-1131 enters the else branch with feeValue=0: sets fees to uint128.max
      (collect ALL available fees) and takes proportional liquidity. But the position is now
      UNSTAKED, and per GaugeManager comments, fees accrued during staking are gauge-side
      (not collectable). However, any fees that accrued between the last gauge reward claim
      and the unstake are NOT forwarded. These residual fees go to the liquidator for free.
    attack_scenario: |
      1. Position is staked in gauge. Fees accrue in gauge accounting.
      2. Just before liquidation, the gauge has unclaimed rewards + a small amount of
         NFT-level fees from the unstake process.
      3. Health check: ignoreFees=true, fullValue=1000 (liquidity only), feeValue=0
      4. _unstakeIfNeeded: gauge.withdraw returns NFT. GaugeManager claims rewards for owner.
         But NFT-level fees from the brief unstake moment are now collectable.
      5. _sendPositionValue with feeValue=0: takes liquidity proportional to
         liquidationValue/fullValue, PLUS sets fees0=fees1=uint128.max -> collects ALL
         available fees (the residual ones from unstake).
      6. Liquidator gets these residual fees as bonus, which were not accounted in the
         liquidation math. This is value leaking from the position owner to the liquidator.
    solidity: |
      // VV-DD-04: After liquidation of staked position, residual fees should not leak to liquidator
      // This is hard to test as a property -- we check the invariant that
      // liquidation should not extract more value than fullValue from the position
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          uint256 tokenId = ghost_allTokenIds[i];
          (uint256 debtShares) = vault.loans(tokenId);
          if (debtShares > 0) {
              (uint256 debt, uint256 fullValue, uint256 collateralValue, uint256 liqCost, uint256 liqValue) = vault.loanInfo(tokenId);
              // If liquidatable, the liquidation value should not exceed fullValue
              if (liqValue > 0) {
                  lte(liqValue, fullValue, "VV-DD-04: liquidation extracts more than fullValue");
                  // Also check: for staked positions, fullValue already excludes fees
                  // So actual extracted value (liqValue + residual fees) > oracle-reported fullValue
                  // This property can only be checked via a before/after balance comparison in a PoC
              }
          }
      }
    poc_sketch: |
      // Foundry fork test:
      // 1. Create position, stake it, accrue some time
      // 2. Make position unhealthy (oracle price drop)
      // 3. Record liquidator balance before
      // 4. Liquidate staked position
      // 5. Record liquidator balance after
      // 6. Compare: actual received value vs oracle-reported liquidationValue
      // 7. If actual > liquidationValue, residual fees leaked
      //
      // function test_stakedLiquidationFeeLeak() public {
      //     // setup: create, stake, borrow, time passes, make unhealthy
      //     uint256 balBefore0 = token0.balanceOf(liquidator);
      //     uint256 balBefore1 = token1.balanceOf(liquidator);
      //     (uint256 amount0, uint256 amount1) = vault.liquidate(params);
      //     // value received = oracle.getPrice(amount0) + oracle.getPrice(amount1)
      //     // compare to reported liquidationValue from loanInfo
      //     // if received > liquidationValue, fee leakage confirmed
      // }
    call_stack: |
      liquidate(params)
        -> _checkLoanIsHealthy(tokenId, debt, false)
          -> _isStaked(tokenId) [true]
          -> oracle.getValue(tokenId, asset, ignoreFees=true)
            -> returns (fullValue_no_fees, feeValue=0, ...)
        -> _unstakeIfNeeded(tokenId)
          -> gaugeManager.unstakeIfStaked(tokenId)
            -> _claimAndSendRewardsBestEffort() [claims AERO rewards for owner]
            -> gauge.withdraw(tokenId) [NFT back to gaugeManager]
            -> nfpm.safeTransferFrom(gm, vault, tokenId) [NFT in vault]
            -> [NOTE: residual NFT fees from brief unstake window now collectable]
        -> _calculateLiquidation(debt, fullValue_no_fees, collateralValue_no_fees)
        -> _sendPositionValue(tokenId, liqValue, fullValue_no_fees, feeValue=0, ...)
          -> oracle.getLiquidityAndFees(tokenId) [may now see residual fees]
          -> else branch: fees0=uint128.max, fees1=uint128.max [collect ALL]
          -> nfpm.collect() [liquidator gets liquidity portion + ALL residual fees]
    validated: true
    priority: high
    confidence: 60

  - id: VV-DD-05
    tier: 1
    type: property
    hunter: DeepDiveHunter
    description: >
      Token replacement during transform creates a window where the old tokenId's
      _cleanupLoan subtracts from tokenConfigs[token0/token1].totalDebtShares, and the new
      tokenId's _updateAndCheckCollateral adds to token configs. If old and new positions have
      DIFFERENT token pairs (e.g., old = WETH/USDC, new = WBTC/USDC), the debt shares are
      removed from WETH+USDC configs but added to WBTC+USDC configs. This is correct
      behavior. BUT: the collateralValueLimitFactorX32 check at L1332-1346 only runs when
      newShares > oldShares (increasing debt). During replacement, _updateAndCheckCollateral
      for the NEW token is called with oldShares=0, newShares=debtShares. This IS an increase.
      However, the limit check uses the current totalDebtShares for the new token pair's
      configs AFTER the cleanup already subtracted from the old pair. If old pair == new pair,
      the subtraction+addition cancel out. If old pair != new pair, the new pair's limit could
      be exceeded because it suddenly gains all the debt shares from the replaced position
      without the old pair's subtraction helping.
    attack_scenario: |
      1. tokenConfig[WBTC] has collateralValueLimitFactorX32 set to allow max 50% of lent as
         WBTC-backed debt. Current WBTC totalDebtShares is at 45%.
      2. Attacker has position A (WETH/USDC pair) with large debt (30% of lent).
      3. Attacker calls transform() with a transformer that swaps position A (WETH/USDC) for
         position B (WBTC/USDC).
      4. During onERC721Received replacement:
         - _cleanupLoan(oldTokenId) subtracts debt from WETH+USDC configs
         - _updateAndCheckCollateral(newTokenId, 0, debtShares) adds debt to WBTC+USDC configs
         - WBTC totalDebtShares jumps from 45% to 75% -- exceeds 50% limit
         - But the check runs: 75% > 50% -> revert CollateralValueLimit
      5. WAIT: this actually reverts, so the replacement fails. This is a DoS: attacker
         cannot rebalance position to a token pair that's near its limit.
      6. The deeper issue: is this check ALWAYS applied? Looking at _updateAndCheckCollateral:
         the check only triggers when newShares > oldShares. For replacement: oldShares=0,
         newShares=debtShares. So newShares > oldShares -> check runs. This IS correct.
      7. However, what about the HEALTH check at L477? _updateAndCheckCollateral is called,
         then the position must be healthy. If the new position has different collateral
         factors, the health check uses min(factor0, factor1) of the NEW pair. An attacker
         could replace a high-CF position with a low-CF one to avoid liquidation.
         WAIT: that would make the position LESS healthy (lower CF), not more. Not exploitable.
      8. REVERSE: replace a low-CF position with a high-CF one. Now collateralValue increases.
         Could this allow the position to be healthy when it shouldn't be? No -- the debt
         stays the same, higher CF means higher collateralValue, so the position becomes MORE
         healthy. This benefits the borrower but doesn't harm the protocol.
    solidity: |
      // VV-DD-05: per-token collateral value limits must hold after token replacement
      // Specifically: when a transform replaces one position with another of different token pair
      // the new pair's totalDebtShares must not exceed its collateralValueLimitFactorX32
      uint256 debtRate = vault.lastDebtExchangeRateX96();
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 Q32_val = 4294967296;
      uint256 lentAssets = (vault.totalSupply() * lendRate + Q96_val - 1) / Q96_val;
