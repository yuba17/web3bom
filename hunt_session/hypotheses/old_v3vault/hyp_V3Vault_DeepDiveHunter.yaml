    priority: critical
    confidence: 70

  - id: VV-DD-02
    tier: 1
    type: property
    hunter: DeepDiveHunter
    description: >
      Staked position with debt cannot collect fees via decreaseLiquidityAndCollect if the
      post-restake health check fails. The function auto-unstakes (step 1), lets user collect
      fees/liquidity (step 2), then auto-restakes (step 3), and checks health with
      ignoreFees=true (step 4). If the position was barely healthy and the collected amount
      reduces collateral value, the post-restake check fails. The user is trapped: they need
      to collect to get funds to repay, but collecting reverts. Convergence of W-10, O-02,
      DOS-08.
    attack_scenario: |
      1. User has staked position with 1000 USDC worth of liquidity + 50 USDC fees
      2. Debt = 850 USDC, collateral factor = 90%, so collateralValue = 900
      3. Staked health check (ignoreFees=true): 900 >= 850 -> healthy
      4. User tries decreaseLiquidityAndCollect to collect 50 USDC fees only (liquidity=0)
      5. Function unstakes, collects 50 fees, restakes
      6. After restake: position value = 1000 (fees gone, liquidity unchanged)
         But wait -- fees were gauge-side while staked, so collecting post-unstake gets ~0
      7. Actually the deeper issue is if user collects LIQUIDITY (not just fees):
         User collects 100 USDC of liquidity. Remaining: 900 USDC liquidity.
         Post-restake health (ignoreFees=true): collateralValue = 900*0.9 = 810 < 850 debt
         -> CollateralFail revert. User cannot partially withdraw collateral to repay.
    solidity: |
      // VV-DD-02: staked positions should be able to reduce collateral via decreaseLiquidityAndCollect
      // without getting trapped by post-restake health check
      // Test: for each staked borrowed position, the health margin must be sufficient
      // to survive a minimal collateral withdrawal + restake
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          uint256 tokenId = ghost_allTokenIds[i];
          (uint256 debtShares) = vault.loans(tokenId);
          if (debtShares > 0) {
              address gm = vault.gaugeManager();
              if (gm != address(0)) {
                  try IGaugeManager(gm).tokenIdToGauge(tokenId) returns (address gauge) {
                      if (gauge != address(0)) {
                          // Position is staked with debt -- check it has health margin
                          (uint256 debt, uint256 fullValue, uint256 collateralValue, , ) = vault.loanInfo(tokenId);
                          // If barely healthy (collateralValue within 5% of debt), user may be trapped
                          if (collateralValue > 0 && debt > 0) {
                              uint256 margin = collateralValue > debt ? collateralValue - debt : 0;
                              uint256 fivePercent = fullValue / 20;
                              t(margin > fivePercent || debt == 0,
                                "VV-DD-02: staked position with tight margin -- may trap user on collateral withdrawal");
                          }
                      }
                  } catch {}
              }
          }
      }
    poc_sketch: |
      // Foundry fork test:
      // 1. Create position with 1000 USDC collateral value, stake it
      // 2. Borrow until barely healthy (collateralValue * 0.95 = debt)
      // 3. Try decreaseLiquidityAndCollect to withdraw small amount
      // 4. Expect: revert because post-restake health check fails
      //    (reduced collateral * collateralFactor < debt)
      //
      // function test_stakedPositionCollateralTrap() public {
      //     // setup position, stake, borrow to near max
      //     vault.stakePosition(tokenId);
      //     vault.borrow(tokenId, nearMaxAmount);
      //     // try to collect small amount of liquidity
      //     vm.expectRevert(V3Vault.CollateralFail.selector);
      //     vault.decreaseLiquidityAndCollect(
      //         DecreaseLiquidityAndCollectParams(tokenId, smallLiquidity, 0, 0, 0, 0, recipient, block.timestamp)
      //     );
      //     // User is trapped: can't reduce collateral, can't get funds to repay
      // }
    call_stack: |
      decreaseLiquidityAndCollect()
        -> _unstakeIfNeeded(tokenId) [wasStaked = true, gauge.withdraw + NFT back to vault]
        -> nonfungiblePositionManager.decreaseLiquidity() [reduces position value]
        -> nonfungiblePositionManager.collect() [sends tokens to user]
        -> _stake(tokenId) [restakes, NFT goes to gauge]
        -> _requireLoanIsHealthy(tokenId, debt)
          -> _checkLoanIsHealthy(tokenId, debt, true)
            -> _isStaked(tokenId) [true -- just restaked]
            -> oracle.getValue(tokenId, asset, ignoreFees=true) [reduced fullValue, no fees]
            -> collateralValue = fullValue * collateralFactor / Q32
            -> isHealthy = collateralValue * BORROW_SAFETY_BUFFER / Q32 >= debt
            [FAILS if collateral reduction pushed below threshold]
          -> REVERT CollateralFail
