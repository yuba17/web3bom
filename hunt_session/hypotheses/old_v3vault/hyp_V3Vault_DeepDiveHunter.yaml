hunter: DeepDiveHunter
component: V3Vault
date: "2026-03-24"
status: complete

analysis_notes: |
  ## Section 1: Design Assumption Analysis

  Key assumptions identified:
  1. The developer assumes totalLent can always absorb a single position's bad debt during
     reserve socialization (missing <= totalLent). If violated, _handleReserveLiquidation
     underflows and reverts, permanently blocking liquidation.
  2. The developer assumes staked positions have ~0 collectable fees after unstaking (gauge
     collects pre-stake fees on deposit, in-gauge fees accrue to gauge accounting). This is
     correct per GaugeManager code.
  3. The developer assumes daily limits replenishment on liquidation (liquidatorCost only,
     not full debt) is acceptable. But underwater liquidations replenish less than was
     borrowed, permanently shrinking daily headroom.
  4. The developer assumes decreaseLiquidityAndCollect + restake health check will pass.
     But collecting fees from a barely-healthy staked position, then restaking (which excludes
     fees), can make the position unhealthy -- trapping the user.

  ## Section 2: Cross-Function State Analysis

  Critical pairs analyzed:
  - liquidate() x _handleReserveLiquidation(): If one loan's bad debt exceeds totalLent,
    the subtraction at L1232 underflows -> revert -> liquidation blocked -> more bad debt.
  - decreaseLiquidityAndCollect() x _stake(): User unstakes, collects fees, restakes.
    Post-restake health check uses ignoreFees=true. If fees were the margin of health,
    the restake health check fails -> user cannot collect even though they need to.
  - borrow() x liquidate() via daily limits: Borrow reduces dailyDebtIncreaseLimitLeft by
    `assets`. Liquidation replenishes by `liquidatorCost`. When underwater, liquidatorCost <
    original borrow assets. Net effect: daily limit shrinks permanently by the shortfall.
  - _checkLoanIsHealthy (staked, ignoreFees=true) x _sendPositionValue (feeValue=0):
    When staked position is partially liquidated with feeValue=0, the else branch at L1127
    sets fees0/fees1 = type(uint128).max (take ALL fees). But fees should be ~0 post-unstake
    per gauge mechanics. Approximately correct but worth fuzzing.

  ## Section 3: Value Exit Trace (samczsun methodology)

  Value exit points:
  1. SafeERC20.safeTransfer in borrow() -- L653: sends borrowed assets. Guarded by health check.
  2. nonfungiblePositionManager.collect in _sendPositionValue -- L1141: sends collateral during
     liquidation. Guarded by !isHealthy check + _calculateLiquidation math.
  3. nonfungiblePositionManager.collect in decreaseLiquidityAndCollect -- L695: sends position
     value to owner. Guarded by health check post-collection.
  4. SafeERC20.safeTransfer in _withdraw -- L1014: sends lender assets. Guarded by share burn.
  5. SafeERC20.safeTransfer in withdrawReserves -- L851: sends reserves to owner. Guarded by
     reserve protection factor.
  6. nonfungiblePositionManager.safeTransferFrom in remove -- L827: returns NFT. Guarded by
     debtShares == 0 check.

  Backward trace for exit #2 (liquidation collateral):
  - _sendPositionValue uses fullValue/feeValue from _checkLoanIsHealthy
  - These are fetched BEFORE _unstakeIfNeeded (L742-748)
  - Position state changes between oracle read and actual token operations
  - If unstaking changes collectable fees or liquidity, the proportioning could be wrong

  ## Section 4: State Machine Attack Paths

  FSM from FlowHunter analyzed. Key anomalies:
  - STAKED_BORROWED -> LIQUIDATED requires _unstakeIfNeeded. If GaugeManager reverts,
    stuck in STAKED_BORROWED. (Already covered by VV-DOS-02, but deeper: this means ONE
    bricked gauge can block ALL staked liquidations. With one-time setGaugeManager, no fix.)
  - BORROWED -> COLLATERAL via full repay requires assets >= debt. But minLoanSize prevents
    partial repay to reduce debt. User in range [minLoanSize, 2*minLoanSize] debt is trapped.
    (Covered by VV-DOS-05.)
  - NEW: BORROWED/STAKED_BORROWED -> (decreaseLiquidityAndCollect) -> revert if post-restake
    health fails. This is a stuck transition: user cannot reduce collateral to repay debt
    because restake health check fails. Only option: unstakePosition first (needs to be owner),
    then decreaseLiquidityAndCollect without restake. BUT: the code auto-restakes if wasStaked.

  ## Section 5: Convergence Deep-Dive

  Convergence 1 (Math M-08 + DoS): Reserve socialization underflow -> liquidation DoS.
    4 hunters flagged related issues. The deeper bug: a cascade where first underwater
    liquidation socializes losses, reducing totalLent, making the NEXT underwater position
    even harder to liquidate (totalLent is now smaller). Multiple bad positions can create
    a cascading failure where later liquidations are impossible.

  Convergence 2 (Wildcard W-10 + Oracle O-02 + DoS DOS-08): Staked valuation inconsistency.
    The fee exclusion for staked positions creates a health check gap. When a position is
    staked, it's valued WITHOUT fees. The decreaseLiquidityAndCollect function unstakes,
    collects, restakes, then checks health with ignoreFees=true. This can trap users.

  Convergence 3 (Flow F-09 + DoS DOS-04): Daily limit asymmetric drain.
    Borrow deducts from dailyDebtIncreaseLimitLeft. Repay/liquidation add back. But
    underwater liquidations add back less (liquidatorCost < debt). Over time with bad debt,
    the daily limit permanently shrinks, limiting new borrowing.

hypotheses:
  - id: VV-DD-01
    tier: 1
    type: property
    hunter: DeepDiveHunter
    description: >
      Reserve socialization underflow blocks liquidation when a single position's bad debt
      exceeds total lender deposits. In _handleReserveLiquidation (L1232), the computation
      (totalLent - missing) * lendRate / totalLent underflows if missing > totalLent because
      Solidity 0.8 reverts on underflow. This makes the liquidate() call revert permanently
      for that position. Bad debt accumulates, making subsequent liquidations also fail
      (cascading failure). This is a convergence of Math M-08 and DoS findings.
    attack_scenario: |
      1. Protocol has 100 USDC total lent (from depositors)
      2. Attacker deposits high-value NFT collateral, borrows 90 USDC
      3. Collateral value crashes to 0 (oracle update or price crash)
      4. Liquidation: debt=90, fullValue=0, liquidatorCost=0, reserveCost=90
      5. _handleReserveLiquidation: reserves ~10, missing=90-10=80
      6. totalLent=100. (100-80)*lendRate/100 = 20*lendRate/100. This works.
      7. NOW: second position also crashes. debt=50, reserveCost=50.
         New totalLent = 100*(20/100) = 20. missing = 50 - 0 = 50.
         (20 - 50) underflows -> REVERT. Liquidation permanently blocked.
      8. All remaining lender funds are trapped.
    solidity: |
      // VV-DD-01: Reserve socialization must not exceed totalLent (prevents liquidation DoS)
      uint256 debtRate = vault.lastDebtExchangeRateX96();
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 totalLent = (vault.totalSupply() * lendRate + Q96_val - 1) / Q96_val;
      if (totalLent > 0) {
          for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
              (uint256 shares) = vault.loans(ghost_allTokenIds[i]);
              if (shares > 0) {
                  uint256 loanDebt = (shares * debtRate + Q96_val - 1) / Q96_val;
                  // In worst case (fullValue=0), reserveCost = debt, missing = debt - reserves
                  // reserves can be 0. So missing can equal full loanDebt.
                  // If loanDebt > totalLent, liquidation reverts.
                  t(loanDebt <= totalLent, "VV-DD-01: single loan debt > totalLent -- socialization underflow blocks liquidation");
              }
          }
      }
    poc_sketch: |
