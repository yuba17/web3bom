invariants:
- id: VV-D-01
  tier: 1
  type: property
  description: "Solvency invariant: vault balance + outstanding debt >= total lent amount (lender claims)"
  attack_scenario: "If balance + debt < lent, lenders cannot withdraw their full deposit. An attacker could manipulate this via donation attack on the asset token or by exploiting a rounding gap in the interest accrual path to create a deficit that grows with each operation."
  impact: "Lenders lose funds -- the last withdrawer gets less than entitled"
  impact_rating: Critical
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 balance = IERC20(vault.asset()).balanceOf(address(vault));
    uint256 debtRateX96 = vault.lastDebtExchangeRateX96();
    uint256 lendRateX96 = vault.lastLendExchangeRateX96();
    uint256 debtSharesT = vault.debtSharesTotal();
    uint256 Q96 = 2**96;
    // debt rounded up (liability), lent rounded up (claim)
    uint256 debt = (debtSharesT * debtRateX96 + Q96 - 1) / Q96;
    uint256 lent = (vault.totalSupply() * lendRateX96 + Q96 - 1) / Q96;
    // Allow 1 unit tolerance per operation for rounding
    uint256 tolerance = ghost_numOps + 1;
    gte(balance + debt + tolerance, lent, "VV-D-01: vault insolvent -- balance+debt < lent");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "Core solvency property. The reserve socialization in _handleReserveLiquidation reduces lendExchangeRate but should maintain this. Tolerance accounts for rounding."
  poc_sketch: ''
  call_stack: ''

