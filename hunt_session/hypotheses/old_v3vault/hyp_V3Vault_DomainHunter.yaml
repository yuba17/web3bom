  type: property
  description: "Debt shares total conservation: sum of all individual loan debtShares must equal debtSharesTotal"
  attack_scenario: "If these diverge, either: (a) some debt is untracked -- borrowers got free money, or (b) phantom debt exists -- someone is paying interest on nonexistent loans. A rounding asymmetry in borrow vs repay share conversions could accumulate this drift."
  impact: "Untracked debt means protocol losses; phantom debt means user losses"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    uint256 sumShares = 0;
    for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
        (uint256 shares) = vault.loans(ghost_allTokenIds[i]);
        sumShares += shares;
    }
    eq(sumShares, vault.debtSharesTotal(), "VV-D-04: sum of loan shares != debtSharesTotal");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: "This is the fundamental debt accounting invariant. borrow() adds shares to both, repay() subtracts from both, liquidate() zeroes the loan and subtracts from total. The _cleanupLoan path during transform replacement also deletes loan shares."
  poc_sketch: ''
  call_stack: ''

