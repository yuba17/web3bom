  attack_scenario: "If an NFT backing a loan escapes the vault's custody without the loan being cleaned up, the collateral backing that debt vanishes. The borrower keeps the borrowed assets and the NFT. This could happen via a malicious transformer that transfers the NFT out during transform."
  impact: "Complete loss of collateral for that loan -- borrower steals borrowed funds"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
        uint256 tid = ghost_allTokenIds[i];
        address owner = vault.ownerOf(tid);
        if (owner != address(0)) {
            address nftOwner = npm.ownerOf(tid);
            bool inVault = nftOwner == address(vault);
            bool inGauge = address(gaugeManager) != address(0) && nftOwner == address(gaugeManager);
            // Also check if staked in a gauge directly
            bool staked = false;
            if (address(gaugeManager) != address(0)) {
                try gaugeManager.tokenIdToGauge(tid) returns (address gauge) {
                    staked = gauge != address(0);
                } catch {}
            }
            t(inVault || inGauge || staked, "VV-D-15: NFT escaped vault custody while loan active");
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 80
  notes: "The _transform function checks nonfungiblePositionManager.ownerOf(newTokenId) == address(this) after the transformer call. But what about the case where the transformer swaps to a new tokenId? The old tokenId could be burned or transferred. The _cleanupLoan handles old token. Post-transform, vault checks custody of newTokenId."
  poc_sketch: ''
  call_stack: ''

false_positives:
- hunter: DomainHunter
  id: VV-D-FP-01
  reason: "Donation attack via direct ERC20 transfer to vault: totalAssets() uses balanceOf(address(this)) + debt. Direct donation would increase balance, inflating totalAssets and share price. However, this does NOT cause first-depositor attack because the vault starts with Q96 exchange rate (not calculated from balance/supply). The exchange rate is only updated via _updateGlobalInterest which uses the IRM, not raw balance. Donations just increase reserves, which benefit the protocol."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: vault.md
    content: "Revert Lend V3Vault uses exchange-rate-based accounting (Q96 fixed point), not balance/supply ratio. Donations to the vault just increase reserves and cannot manipulate share price. This is NOT vulnerable to vault-001 (first depositor) or vault-002 (donation attack)."
    briefing_update_applied: false
- hunter: DomainHunter
  id: VV-D-FP-02
  reason: "minLoanSize bypass via partial repay: repay() checks if resulting loan < minLoanSize and reverts. An attacker cannot create dust loans that are too expensive to liquidate. However, a position can START with 0 debt (just collateral, no borrow) which is fine -- minLoanSize only applies when there IS debt."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update: null
- hunter: DomainHunter
  id: VV-D-FP-03
  reason: "borrow() health check skip in transform mode: During _transform, the transformer can call borrow() and the health check is skipped. This is by design -- the health check happens AFTER the transform completes (line 621). The transformer might temporarily make the position unhealthy during its operation. The final check after transform ensures the result is healthy."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update: null
