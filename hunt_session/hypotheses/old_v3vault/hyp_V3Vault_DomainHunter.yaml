- id: VV-D-08
  tier: 1
  type: property
  description: "ERC4626 roundtrip safety: redeem(deposit(X)) <= X for any X (no value extraction via deposit-then-redeem)"
  attack_scenario: "If redeem(deposit(X)) > X, an attacker can extract value in a loop. The rounding direction in _deposit (shares rounded Down) and _withdraw (assets rounded Down) should prevent this, but edge cases with small amounts or first depositor could break it."
  impact: "Unlimited value extraction from vault, draining lender deposits"
  impact_rating: Critical
  likelihood: Low
  severity_final: null
  solidity: |
    // Use ghost tracking from last deposit
    if (ghost_lastDepositAssets > 0 && ghost_lastDepositShares > 0) {
        uint256 lendRate = vault.lastLendExchangeRateX96();
        uint256 Q96 = 2**96;
        // What would redeeming those shares give back (rounded down)
        uint256 redeemAssets = ghost_lastDepositShares * lendRate / Q96;
        // Must not exceed what was deposited (allow 1 wei tolerance for rounding)
        lte(redeemAssets, ghost_lastDepositAssets + 1, "VV-D-08: roundtrip extraction -- redeem > deposit");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 75
  notes: "The deposit path uses Rounding.Down for shares (fewer shares minted), withdraw uses Rounding.Down for assets (fewer assets returned). This should be safe. But if time passes between deposit and check, interest accrual could legitimately increase assets. This invariant is only valid same-block."
  poc_sketch: ''
  call_stack: ''

