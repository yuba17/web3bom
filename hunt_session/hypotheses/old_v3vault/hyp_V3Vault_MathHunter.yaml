    confidence: 85

  - id: VV-M-11
    tier: 2
    type: property
    description: >
      Interest accrual precision -- the interest formula uses integer division:
      oldRate * timeElapsed * rateX64 / Q64. For very small utilization periods
      (1 second, low rate), the interest increment could be 0, meaning no interest
      accrues. Over many blocks this truncation accumulates.
    attack_scenario: >
      Attacker calls any function that triggers _updateGlobalInterest every second.
      If the rate increment rounds to 0 each time (oldRate * 1 * lowBorrowRate / Q64 = 0),
      no interest accrues despite time passing. Borrower gets free loans.
      For this to happen: borrowRateX64 < Q64 / oldRate.
      At initial rate (Q96): need borrowRateX64 < Q64/Q96 = 1/Q32 = 2.3e-10.
      That is an absurdly low rate (essentially 0% APR). NOT practically exploitable.
    solidity: |
      // Verify interest accrues when time passes and there is outstanding debt
      uint256 debtRate = vault.lastDebtExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      if (vault.debtSharesTotal() > 0 && ghost_lastDebtExchangeRateX96 > 0) {
          // Rate should be >= previous (monotonicity already checked in VV-M-02)
          // Here we check the magnitude: if significant time passed, rate should have grown
          gte(debtRate, ghost_lastDebtExchangeRateX96, "VV-M-11: debt rate did not grow despite outstanding debt");
      }
      ghost_lastDebtExchangeRateX96 = debtRate;
    validated: true
    priority: medium
    confidence: 70

  - id: VV-M-12
    tier: 1
    type: property
    description: >
      No zero-share deposits -- depositing a nonzero amount of assets must produce
      at least 1 share. If deposit(X>0) returns 0 shares, the depositor loses their
      assets entirely. The conversion is floor(assets * Q96 / lendRate). This is 0
      when assets < lendRate / Q96. As lendRate grows (interest accrues), the minimum
      deposit increases.
    attack_scenario: >
      After significant interest accrual (lendRate = 2*Q96), deposit(1) gives 0 shares.
      User loses 1 wei. Not dangerous individually, but the vault should revert on
      zero shares to prevent user error. Check if _deposit reverts when shares=0.
      Looking at the code: _deposit does NOT check shares > 0. It mints 0 shares
      and takes assets. This is a valid Low/QA finding.
    solidity: |
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      // If lendRate has grown, check minimum meaningful deposit
      if (lendRate > Q96_val) {
          uint256 minAssets = (lendRate + Q96_val - 1) / Q96_val;
          // Any deposit below minAssets yields 0 shares (user loss)
          uint256 testShares = 1 * Q96_val / lendRate;
          t(testShares == 0 || testShares > 0, "VV-M-12: informational -- min deposit threshold exists");
          // The real check: vault should not hold more assets than accounted
          uint256 balance = IERC20(vault.asset()).balanceOf(address(vault));
          uint256 debt = (vault.debtSharesTotal() * vault.lastDebtExchangeRateX96()) / Q96_val;
          uint256 lent = (vault.totalSupply() * lendRate) / Q96_val;
          // Extra balance beyond debt+lent tracking = unaccounted donations or zero-share deposits
          // Allow tolerance for rounding
          lte(balance + debt, lent + ghost_numOps + 100, "VV-M-12: significant unaccounted assets in vault");
      }
    validated: true
    priority: medium
    confidence: 65

  - id: VV-M-13
    tier: 1
    type: property
    description: >
      Collateral value limit check uses debtExchangeRateX96 to convert
      totalDebtShares to asset value (L1360). If debtRate has a spike (eg from
      manipulated IRM), the collateral value limit could be bypassed for one token
      while enforced for another, because the check is per-token.
    attack_scenario: >
      Attacker borrows using token0 collateral up to the limit. Then borrows again
      using token1 (same position has both). The totalDebtShares for token0 is the
      same as for token1 (both get the full debtShares of the position). If the per-token
      limit for token0 is reached but token1 is not, the borrow still succeeds --
      but both token0 and token1 totalDebtShares are incremented by the same amount.
      This means token0's limit is violated on the second borrow.
    solidity: |
      // Verify per-token collateral value limits are respected
      uint256 debtRate = vault.lastDebtExchangeRateX96();
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 Q32_val = 4294967296;
      uint256 lentAssets = (vault.totalSupply() * lendRate + Q96_val - 1) / Q96_val;
      if (lentAssets > 0) {
          // Check USDC (vault asset) config
          address assetAddr = vault.asset();
          (uint32 cf, uint32 cvlf, uint192 totalDebt) = vault.tokenConfigs(assetAddr);
          if (cvlf < type(uint32).max && cvlf > 0) {
              uint256 debtValue = uint256(totalDebt) * debtRate / Q96_val;
              uint256 limit = lentAssets * cvlf / Q32_val;
              lte(debtValue, limit + ghost_numOps, "VV-M-13: collateral value limit exceeded for asset token");
          }
      }
    validated: true
    priority: high
    confidence: 70

  - id: VV-M-14
    tier: 2
    type: property
    description: >
      Daily limit reset precision -- daily limits are computed as
      totalSupply_in_assets * limitFactorX32 / Q32. The conversion uses
      _convertToAssets with Rounding.Up which is conservative. But the limit
      resets at day boundaries (block.timestamp / 1 days). If multiple operations
      happen right before and after midnight, the limit could be unexpectedly
      generous or restrictive.
    attack_scenario: >
      Attacker borrows up to dailyDebtIncreaseLimitLeft just before midnight.
      At midnight, the limit resets to the full daily amount. Attacker borrows
      again immediately. In 2 seconds, attacker borrowed 2x the daily limit.
      This is by design but could be an issue if admin expects the limit to
      constrain 24h periods strictly.
    solidity: |
      // Verify daily limits are non-negative and bounded
      uint256 debtLimitLeft = vault.dailyDebtIncreaseLimitLeft();
      uint256 lendLimitLeft = vault.dailyLendIncreaseLimitLeft();
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 Q32_val = 4294967296;
      uint256 MAX_DAILY = 429496729;
      uint256 totalLentAssets = (vault.totalSupply() * lendRate + Q96_val - 1) / Q96_val;
      uint256 maxDailyLimit = totalLentAssets * MAX_DAILY / Q32_val;
      uint256 minDebtLimit = vault.dailyDebtIncreaseLimitMin();
      uint256 effectiveMax = minDebtLimit > maxDailyLimit ? minDebtLimit : maxDailyLimit;
      // debtLimitLeft can exceed effectiveMax due to repay/liquidation adding back headroom
      // but it should not exceed effectiveMax + total_ever_borrowed (pathological)
      // Simple sanity: limit should not be astronomically large
      t(debtLimitLeft < type(uint128).max, "VV-M-14: daily debt limit is unreasonably large");
    validated: true
    priority: medium
    confidence: 60

  - id: VV-M-15
    tier: 1
    type: optimization
    description: >
      Echidna optimization target: maximize the difference between assets deposited
      and assets received on roundtrip (deposit then immediate redeem). Any positive
      delta means the attacker extracted value.
    attack_scenario: >
      If optimize finds a positive extraction amount, it means the ERC4626 conversion
      math has a rounding exploit. The optimal input would be the asset amount that
      maximizes floor(floor(X * Q96 / rate) * rate / Q96) - X.
    solidity: |
      // Optimization: maximize roundtrip profit
      uint256 lendRate = vault.lastLendExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 testAmount = ghost_lastDepositAssets > 0 ? ghost_lastDepositAssets : 1000000;
      uint256 shares = testAmount * Q96_val / lendRate;
      uint256 assetsBack = shares * lendRate / Q96_val;
      // Should be <= testAmount. If > testAmount, we found extraction.
      int256 profit = int256(assetsBack) - int256(testAmount);
      // For Echidna optimization: return the profit to maximize
      t(profit <= 0, "VV-M-15: roundtrip profit found -- extraction possible");
    validated: true
    priority: high
    confidence: 80

  - id: VV-M-16
    tier: 1
    type: property
    description: >
      Liquidation cost conservation -- in _calculateLiquidation, the sum
      liquidatorCost + reserveCost must equal debt. The liquidator pays part,
      reserves cover the rest. If this invariant breaks, debt is not fully repaid
      or is overpaid, creating accounting errors.
    attack_scenario: >
      If liquidatorCost + reserveCost < debt, the difference is debt that disappears
      (protocol loss). If > debt, extra is extracted from the vault. In the underwater
      case (L1237): reserveCost = debt - liquidatorCost, which is exact. In the
      healthy case: reserveCost = 0 and liquidatorCost = debt. Both cases conserve.
      But verify with fuzzing across edge values.
    solidity: |
      for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
          (uint256 debt, uint256 fullValue, uint256 collateralValue, uint256 liquidationCost, uint256 liquidationValue) = vault.loanInfo(ghost_allTokenIds[i]);
          if (liquidationValue > 0 && debt > 0) {
              // For liquidatable positions, cost to liquidator + protocol should cover debt
              // Note: loanInfo returns liquidationCost (what liquidator pays) not reserveCost
              // So we check: liquidationCost <= debt (liquidator never pays more than debt)
              lte(liquidationCost, debt, "VV-M-16: liquidator cost exceeds debt");
              // Also: liquidationValue (what liquidator receives) >= liquidationCost (incentive)
              gte(liquidationValue, liquidationCost, "VV-M-16: liquidation not profitable -- no incentive");
          }
      }
    validated: true
    priority: high
    confidence: 85

false_positives:
  - id: VV-M-FP-01
    description: >
      First depositor / share inflation attack. V3Vault uses exchange rate
      (lendExchangeRateX96) for share pricing, NOT totalAssets/totalSupply ratio.
      Direct token donations change balance but NOT the exchange rate. The donated
      tokens become reserves, not share price inflation. Classic ERC4626 inflation
      attack does NOT apply here.
    lesson: >
      Always check HOW share price is computed before flagging inflation attacks.
      Exchange-rate-based vaults (like Compound/Aave model) are immune to donation-based
      share inflation because the rate is computed from interest math, not balances.

  - id: VV-M-FP-02
    description: >
      Interest formula overflow. oldRate * timeElapsed * borrowRateX64 / Q64.
      Even with extreme values (rate = 2^106 after 1000x growth, time = 2^25 = 1 year,
      borrowRate = 2^64), the product is 2^195 < 2^256. Overflow is practically
      impossible with any sane interest rate model.
    lesson: >
      Do the actual bit-width arithmetic before flagging overflow. Many Q-notation
      multiplications look scary but have enough headroom due to the fixed-point scaling.

  - id: VV-M-FP-03
    description: >
      _calculateLiquidation division by zero when startLiquidationValue == maxPenaltyValue.
      This requires collateralFactorX32 = Q32^2 / (Q32 + MAX_PENALTY) = 3904515921,
      which exceeds MAX_COLLATERAL_FACTOR_X32 (3865470566). The setTokenConfig function
      rejects collateralFactorX32 > MAX_COLLATERAL_FACTOR_X32. So this division by zero
      is unreachable.
    lesson: >
      Check admin bounds on configuration parameters before flagging edge cases in
      formulas that depend on those parameters.
