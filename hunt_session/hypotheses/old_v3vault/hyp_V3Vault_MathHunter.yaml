    attack_scenario: >
      If rounding is wrong (Down instead of Up), borrower could borrow X assets but
      only owe shares worth X-1. Repeated across many small borrows, this leaks value.
      With 1M operations at 1 wei each = 1M wei loss to protocol.
    solidity: |
      // Verify that for any active loan, debtShares converted to assets >= original borrow amount
      // Since we track ghost_totalBorrowed and ghost_totalRepaid:
      uint256 debtRate = vault.lastDebtExchangeRateX96();
      uint256 Q96_val = 79228162514264337593543950336;
      uint256 totalDebtAssets = (vault.debtSharesTotal() * debtRate + Q96_val - 1) / Q96_val;
      uint256 netBorrowed = ghost_totalBorrowed > ghost_totalRepaid ? ghost_totalBorrowed - ghost_totalRepaid : 0;
