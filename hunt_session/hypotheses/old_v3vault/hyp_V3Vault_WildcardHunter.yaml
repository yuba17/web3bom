false_positives:
- hunter: WildcardHunter
  id: VV-W-FP-01
  reason: "Transform approval migration (lines 595-598): when tokenId changes during transform, approvals are copied from old to new token for the same msg.sender. Initially suspected this could allow unauthorized transform access, but the copy only happens for the CALLER (msg.sender) who already had approval. The old approval is deleted. This is correct behavior -- the caller who initiated the transform retains their approval on the replacement token."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update: null
- hunter: WildcardHunter
  id: VV-W-FP-02
  reason: "onERC721Received owner override via data parameter (lines 459-464): initially flagged as potential ownership hijack. But the comment at line 460-463 explicitly states this is intentional -- whoever can trigger safeTransferFrom for the NFT can also choose the callback payload. This is an accepted trust assumption for integrator/operator flows. The caller must already control the NFT to transfer it."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update: null
- hunter: WildcardHunter
  id: VV-W-FP-03
  reason: "Multicall + borrow reentrancy: considered whether multicall([borrow(token1, x), borrow(token2, y)]) could bypass per-token limits. But borrow checks are per-token (health, minLoanSize) and global (globalDebtLimit, dailyDebtIncreaseLimitLeft). Multicall batches are sequential within the same tx, so global limits correctly accumulate. No bypass found."
  investigated_at: '2026-03-24T00:00:00Z'
  pending_briefing_update: null
