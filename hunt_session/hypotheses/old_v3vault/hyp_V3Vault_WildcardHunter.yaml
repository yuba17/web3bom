- id: VV-W-09
  tier: 1
  type: property
  description: "Token replacement during transform must preserve debt accounting -- the sum of all loans debtShares plus the debtSharesTotal delta must remain consistent across the replacement"
  attack_scenario: "In onERC721Received during transform (lines 479-504), debt is copied from old token to new token, then _cleanupLoan is called on the old token. If the cleanup decrements debtSharesTotal (via _updateAndCheckCollateral with oldShares=debtShares, newShares=0), but the new tokens _updateAndCheckCollateral increments it (oldShares=0, newShares=debtShares), the net effect should be zero change to debtSharesTotal. But if the tokens have different token0/token1 pairs, tokenConfigs totalDebtShares for the OLD pair gets decremented and the NEW pair gets incremented. If collateralValueLimit is tight on the new pair, this could revert unexpectedly."
  impact: "Transform replacement blocked by CollateralValueLimit on the new token pair, user cannot rebalance position"
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // debtSharesTotal must always equal the sum of all individual loan debtShares
    uint256 sumDebt = 0;
    for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
        (uint256 shares) = vault.loans(ghost_allTokenIds[i]);
        sumDebt += shares;
    }
    eq(sumDebt, vault.debtSharesTotal(), "VV-W-09: debtSharesTotal mismatch after transform replacement");
  ghost_vars: []
  validated: true
  priority: high
  confidence: 85
  notes: "This overlaps with VV-W-02 but specifically targets the transform replacement path. The sequence in onERC721Received is: (1) copy debtShares to new loan, (2) _addTokenToOwner for new token, (3) _cleanupLoan on old token (decrements debtSharesTotal via _updateAndCheckCollateral), (4) _updateAndCheckCollateral on new token (increments debtSharesTotal). Net effect on debtSharesTotal should be zero. But _cleanupLoan calls _updateAndCheckCollateral(oldTokenId, ..., loans[oldTokenId].debtShares, 0) -- and loans[oldTokenId].debtShares was already copied but NOT zeroed yet (delete happens inside _cleanupLoan at line 1193, AFTER _updateAndCheckCollateral at line 1192). So it correctly passes the old shares as oldShares parameter."
  poc_sketch: ''
  call_stack: ''

- id: VV-W-10
  tier: 1
  type: property
  description: "Staked position health check must use ignoreFees=true valuation consistently -- if a staked position is valued WITH fees for some operations and WITHOUT fees for others, there is a valuation gap exploitable for borrowing more than the true collateral value"
  attack_scenario: "When a position is staked, _checkLoanIsHealthy passes ignoreFees=true to oracle.getValue (line 1429-1430). But if any code path computes collateral value without checking _isStaked and uses ignoreFees=false, the position appears more valuable (fees included). An attacker could: stake position (fees excluded from valuation), accumulate large fees, unstake (fees now included), borrow against inflated value, re-stake. The borrow health check during unstake/stake transition might use inconsistent valuations."
  impact: "Borrower can extract more than their collateral is worth, protocol takes bad debt"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // For each staked position with debt, verify that the loan is healthy
    // even when excluding fees (consistent with staked valuation)
    for (uint256 i = 0; i < ghost_allTokenIds.length; i++) {
        uint256 tid = ghost_allTokenIds[i];
        (uint256 shares) = vault.loans(tid);
        if (shares > 0) {
            (uint256 debt, uint256 fullValue, uint256 collateralValue,,) = vault.loanInfo(tid);
            // loanInfo uses _checkLoanIsHealthy which already handles ignoreFees
            // So if the loan is healthy per loanInfo, it should be consistent
            // The concern is if there is a path that DOESNT go through _checkLoanIsHealthy
            if (debt > 0 && collateralValue > 0) {
                t(collateralValue >= debt || fullValue > 0, "VV-W-10: staked loan has zero value but positive debt");
            }
        }
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 72
  notes: "Key concern: stakePosition (line 1381-1394) calls _stake then checks health via loanInfo->_checkLoanIsHealthy. The transform path (line 617-621) re-stakes then checks _requireLoanIsHealthy. Both use _checkLoanIsHealthy which calls _isStaked. The transition window is: unstake (fees now visible) -> do something -> re-stake (fees hidden again). During the unstaked window in transform (line 581-619), the position is unstaked, transformer runs, then re-staked at 619. The health check at 621 is AFTER re-staking, so it uses ignoreFees=true. But the transformer could have borrowed during the unstaked window when fees were visible as collateral."
  poc_sketch: ''
  call_stack: ''

