  impact: "Domains enrolled via the base enrollRemoteRouter function get null ISM, potentially weakening security for that route"
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Domains with enrolled router should have non-zero ISM for security
    bytes32 routerForDest = originRouter.routers(DESTINATION);
    bytes32 ismForDest = originRouter.isms(DESTINATION);
    if (routerForDest != bytes32(0)) {
        t(ismForDest != bytes32(0), "AIAR-D-04: enrolled domain has null ISM -- weak security");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 55
  notes: "EMPTY_SALT is bytes32(0). When used as ISM, it means the ICA on destination is created with ism=address(0). The actual security impact depends on how the destination handles address(0) ISM -- if it falls through to a default ISM or if it means no verification. Likely by design since the override exists for backwards compat with base Router interface."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-05
  tier: 2
  type: property
  description: "interchainSecurityModule returns address(this) -- the router IS its own ISM. If the router does not implement IInterchainSecurityModule.verify(), message verification is broken."
  attack_scenario: "The Mailbox calls interchainSecurityModule() on the recipient (this router) to determine which ISM to use for message verification. It returns address(this). The Mailbox then calls verify() on address(this). If AbstractInterchainAccountRouter does not implement verify(), the call either reverts (breaking all inbound messages) or succeeds vacuously if the Mailbox skips verification on revert."
  impact: "If the router does not properly implement ISM verification logic, either all inbound messages are blocked (DoS) or all pass without verification (auth bypass)"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // The router claims to be its own ISM
    address ism = address(originRouter.interchainSecurityModule());
    eq(uint256(uint160(ism)), uint256(uint160(address(originRouter))), "AIAR-D-05: ISM should be self");
    // The critical question is whether this contract implements verify()
    // We check that the ISM interface is properly implemented
    // This is a static property -- the contract IS the ISM
    t(ism != address(0), "AIAR-D-05: ISM must not be zero");
  ghost_vars: []
  validated: false
  priority: high
  confidence: 60
  notes: "The child contract (InterchainAccountRouter) likely implements verify(). This base class just returns address(this). The concern is whether ALL child implementations properly handle ISM verification. If a child inherits this but forgets to implement verify(), all security breaks."
  poc_sketch: ''
  call_stack: ''

