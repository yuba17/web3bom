- id: AIAR-D-07
  tier: 1
  type: property
  description: "getDeployedInterchainAccount is public and permissionless -- anyone can deploy ICAs for arbitrary (origin, owner, router, ism) combinations, front-running legitimate ICA creation"
  attack_scenario: "Attacker calls getDeployedInterchainAccount(origin, victimOwner, routerAddr, maliciousIsm) BEFORE the legitimate cross-chain message arrives. The ICA is deployed via Create2 with the specified params. When the real message arrives and tries to create the same ICA, it already exists. The ICA's OwnableMulticall owner is the router (immutable in constructor). The key question: does the deployed ICA use the ISM for anything? The ISM is only in the Create2 salt -- it determines the ADDRESS but not the behavior. So front-running with wrong ISM creates ICA at wrong address, which is harmless. But if attacker uses correct params, the ICA is pre-deployed which is fine since Create2 is deterministic."
  impact: "Low -- front-running ICA deployment with correct params is harmless (Create2 determinism). With wrong params, creates ICA at different address. Not a real attack vector."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // ICA deployment should be deterministic regardless of who calls it
    OwnableMulticall ica1 = destRouter.getDeployedInterchainAccount(
        ORIGIN,
        address(uint160(uint256(routerOverride))),
        address(destRouter),
        address(0)
    );
    OwnableMulticall ica2 = destRouter.getDeployedInterchainAccount(
        ORIGIN,
        address(uint160(uint256(routerOverride))),
        address(destRouter),
        address(0)
    );
    eq(uint256(uint160(address(ica1))), uint256(uint160(address(ica2))), "AIAR-D-07: ICA not deterministic");
  ghost_vars: []
  validated: false
  priority: low
  confidence: 40
  notes: "After analysis, this is by design. Create2 ensures same params = same address regardless of caller. The ICA owner is always the router contract. Marking as likely false positive."
  poc_sketch: ''
  call_stack: ''

