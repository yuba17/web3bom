invariants:
- id: AIAR-D-01
  tier: 1
  type: property
  description: "enrollRemoteRouterAndIsm immutability can be bypassed via Router.enrollRemoteRouter which calls _enrollRemoteRouter override -- but the override also checks immutability. However Router.unenrollRemoteRouter is NOT overridden and is onlyOwner, so owner can unenroll then re-enroll with different router/ism pair, breaking immutability guarantee"
  attack_scenario: "Owner (or compromised owner key) calls unenrollRemoteRouter(domain) to remove the entry from _routers map, then calls enrollRemoteRouterAndIsm(domain, maliciousRouter, maliciousIsm). The isms[domain] still has the old value so _enrollRemoteRouterAndIsm would revert -- UNLESS isms[domain] was bytes32(0). If original ISM was EMPTY_SALT (bytes32(0)) via _enrollRemoteRouter path, then unenroll + re-enroll succeeds with arbitrary new ISM. This breaks the stated immutability for domains enrolled via the base Router.enrollRemoteRouter path."
  impact: "Domains enrolled through base Router.enrollRemoteRouter (which sets ism to EMPTY_SALT) can be unenrolled and re-enrolled with a malicious ISM, allowing message forgery on that domain"
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Check: if a domain has been enrolled, unenrollRemoteRouter should NOT allow re-enrollment
    // This is a stateful test -- track enrolled domains
    // After any enrollment, the domain's router should never change
    bytes32 routerForDest = originRouter.routers(DESTINATION);
    if (ghost_enrolledRouterForDest != bytes32(0)) {
        eq(uint256(routerForDest), uint256(ghost_enrolledRouterForDest), "AIAR-D-01: enrolled router changed -- immutability violated");
    }
    if (routerForDest != bytes32(0)) {
        ghost_enrolledRouterForDest = routerForDest;
    }
  ghost_vars:
  - bytes32 internal ghost_enrolledRouterForDest;
  validated: false
  priority: high
  confidence: 70
  notes: "Key insight: _enrollRemoteRouterAndIsm checks both routers(domain)==EMPTY_SALT AND isms[domain]==EMPTY_SALT. But unenrollRemoteRouter only removes from _routers map, NOT from isms mapping. So after unenroll, routers(domain)==0 but isms[domain] still has old value. Re-enrollment via enrollRemoteRouterAndIsm would fail. BUT enrollRemoteRouter (base Router) calls _enrollRemoteRouter which calls _enrollRemoteRouterAndIsm with ism=EMPTY_SALT -- this also checks isms[domain]==EMPTY_SALT which is NOT 0 after first enrollment. So re-enrollment is blocked. This is actually SAFE but creates a permanent lockout -- domain can never be changed even after unenroll. Downgrading to tier 2 for the DoS angle."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-02
  tier: 1
  type: property
  description: "callRemoteWithOverrides allows caller to specify arbitrary _router and _ism, completely bypassing the enrolled router/ism for a domain. Message is dispatched to arbitrary recipient address on destination chain."
  attack_scenario: "Any user calls callRemoteWithOverrides(destDomain, attackerControlledRouter, attackerIsm, calls, hookMetadata). The message is dispatched via mailbox.dispatch to attackerControlledRouter instead of the enrolled router. On the destination chain, if the attacker deploys a contract at attackerControlledRouter that mimics InterchainAccountRouter.handle(), they can create ICA accounts with arbitrary parameters. The message body encodes msg.sender as owner -- so the ICA on destination will be owned by the caller. This is by-design for flexibility, but the ICA created on destination uses the _ism from the message which could be a permissive ISM."
  impact: "Users can route messages to non-canonical routers. If destination has assets in ICAs, routing to wrong router means ICA ownership model breaks -- different router = different ICA address via Create2."
  impact_rating: Medium
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verify that callRemoteWithOverrides does NOT validate _router against enrolled routers
    // This is a design property check -- the function accepts any non-zero router
    // If enrolled router exists, calls should ideally use it
    bytes32 enrolledRouter = originRouter.routers(DESTINATION);
    t(enrolledRouter != bytes32(0), "AIAR-D-02: test requires enrolled router");
    // The invariant: if an enrolled router exists, messages should go to it
    // callRemoteWithOverrides bypasses this -- that's the finding
    // We track if a dispatch was made to a non-enrolled router
    t(!ghost_dispatchedToNonEnrolledRouter, "AIAR-D-02: dispatch to non-enrolled router detected");
  ghost_vars:
  - bool internal ghost_dispatchedToNonEnrolledRouter;
  validated: false
  priority: high
  confidence: 65
  notes: "This is intentional design -- callRemoteWithOverrides is meant for custom routing. The risk is that users can create ICAs bound to arbitrary ISMs on the destination, potentially using a permissive ISM that allows anyone to execute. However, the ICA address is deterministic based on (origin, owner, router, ism, salt) so different params = different ICA = no collision with legitimate ICAs. Lowering confidence -- likely by design."
  poc_sketch: ''
  call_stack: ''

- id: AIAR-D-03
  tier: 1
  type: property
  description: "isms mapping is not cleared when unenrollRemoteRouter is called -- stale ISM data persists and blocks re-enrollment permanently"
  attack_scenario: "1. Owner enrolls domain 3 with router=R1, ism=ISM1 via enrollRemoteRouterAndIsm. 2. Owner realizes ISM1 is compromised and calls unenrollRemoteRouter(3). 3. _routers map removes domain 3, but isms[3] still equals ISM1. 4. Owner tries enrollRemoteRouterAndIsm(3, R2, ISM2) -- reverts because isms[3] != EMPTY_SALT. 5. Domain 3 is permanently bricked -- cannot re-enroll with corrected ISM. The only fix is proxy upgrade."
  impact: "Permanent inability to update a domain's router/ISM configuration after unenrollment. If the ISM was compromised, the domain is permanently unusable from this router."
  impact_rating: Medium
  likelihood: High
  severity_final: null
  solidity: |
    // After unenroll, the isms mapping should be cleared to allow re-enrollment
    bytes32 routerForDest = originRouter.routers(DESTINATION);
    bytes32 ismForDest = originRouter.isms(DESTINATION);
    // If router is zero (unenrolled), ism should also be zero
    if (routerForDest == bytes32(0)) {
        eq(uint256(ismForDest), 0, "AIAR-D-03: stale ISM after router unenrollment -- domain bricked");
    }
  ghost_vars: []
  validated: true
  priority: high
  confidence: 90
  notes: "This is a clear bug. unenrollRemoteRouter (from Router.sol) calls _unenrollRemoteRouter which only does _routers.remove(domain). It does NOT clear isms[domain]. The immutability check in _enrollRemoteRouterAndIsm requires BOTH routers(domain)==EMPTY_SALT AND isms[domain]==EMPTY_SALT. After unenroll, routers(domain) returns 0 (EMPTY_SALT) but isms[domain] retains old value. Re-enrollment is permanently blocked. NOT a duplicate of IAR-DD-01 through DD-05."
  poc_sketch: |
    function test_AIAR_D_03_staleIsmBricksReenrollment() public {
        // Setup: enroll domain with router and ISM
        originRouter.enrollRemoteRouterAndIsm(3, bytes32(uint256(0xaaa)), bytes32(uint256(0xbbb)));
        // Unenroll router
        originRouter.unenrollRemoteRouter(3);
        // Verify router is gone
        assertEq(originRouter.routers(3), bytes32(0));
        // Verify ISM is NOT gone (the bug)
        assertNotEq(originRouter.isms(3), bytes32(0));
        // Try to re-enroll -- should revert
        vm.expectRevert("router and ISM defaults are immutable once set");
        originRouter.enrollRemoteRouterAndIsm(3, bytes32(uint256(0xccc)), bytes32(uint256(0xddd)));
    }
  call_stack: 'unenrollRemoteRouter(3) -> _unenrollRemoteRouter(3) -> _routers.remove(3) [isms[3] NOT touched]'

- id: AIAR-D-04
