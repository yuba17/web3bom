    If the contract is paused, price transmissions still go through, updating
    s_dataStreamsPrice. This may be intentional (keep prices fresh even when
    paused) or a missing guard.
  attack_scenario: >
    Contract is paused due to emergency (e.g., price manipulation detected).
    Admin pauses to prevent auctions. But PRICE_ADMIN can still call transmit()
    and update prices. If the pause was due to suspicious price data, the
    attacker (if they have PRICE_ADMIN_ROLE or can influence the verifierProxy)
    can still inject manipulated prices during pause. When unpause occurs,
    the manipulated prices are immediately used for auction pricing.
  impact: >
    Manipulated prices accepted during pause, used immediately on unpause
    for auction settlement. Potential loss of funds if auctions settle at
    manipulated prices.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Check: if contract is paused, transmit should not update prices
    // This is a design question — document whether intentional
    // If paused && s_dataStreamsPrice[asset].timestamp changed → flag
    // Note: requires ghost tracking of pause state and pre/post timestamps
    if (ghost_isPaused) {
        for (uint256 i = 0; i < ghost_trackedAssets.length; i++) {
            (,uint256 ts,) = priceManager.getAssetPrice(ghost_trackedAssets[i]);
            eq(ts, ghost_prePauseTimestamp[ghost_trackedAssets[i]],
               "PM-F07: price updated while contract paused");
        }
    }
  ghost_vars:
