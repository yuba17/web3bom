- id: PM-F08
  tier: 1
  type: property
  description: >
    _getAssetPrice fallback does NOT validate Chainlink data feed answer for
    negative values or answeredInRound < roundId. The SafeCast toUint256()
    on a negative int256 will revert, causing DoS on the fallback path.
    This means if the Chainlink feed returns a negative price (circuit breaker
    scenario), the fallback path reverts instead of gracefully returning
    isValid=false.
  attack_scenario: >
    DataStreams price goes stale (no transmit for stalenessThreshold seconds).
    Fallback activates and calls usdDataFeed.latestRoundData(). If the
    Chainlink aggregator returns a negative answer (e.g., during extreme
    market conditions or feed malfunction), the toUint256() cast at L392
    reverts. This means _getAssetPrice reverts entirely — even with
    withValidation=false. The caller (e.g., BaseAuction.bid) cannot get
    ANY price for this asset, causing complete DoS on all auction operations
    involving this asset.
    The DataStreams path (transmit) is protected because report.price is
    int192 cast via toUint256() which also reverts on negative — but that's
    in a write path where the PRICE_ADMIN controls input. The fallback read
    path is passive and should degrade gracefully.
  impact: >
    Complete DoS on _getAssetPrice for the affected asset when both DataStreams
    is stale AND Chainlink feed returns negative. All auctions blocked.
    No direct fund loss but severe operational impact.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: _getAssetPrice(asset, false) should NEVER revert for an
    // allowlisted asset — it should return (0, 0, false) in worst case.
    // Test with mock data feed returning negative answer.
    // In fuzzing: call getAssetPrice for all allowlisted assets and verify
    // no revert when withValidation=false.
    address[] memory assets = priceManager.getAllowlistedAssets();
    for (uint256 i = 0; i < assets.length; i++) {
        // This should not revert
        try priceManager.getAssetPrice(assets[i]) returns (uint256, uint256, bool) {
            t(true, "PM-F08: getAssetPrice succeeded");
        } catch {
            t(false, "PM-F08: getAssetPrice reverted for allowlisted asset — DoS");
        }
    }
  ghost_vars: []
  validated: false
  priority: high
  confidence: 70
  notes: >
    Real issue: SafeCast.toUint256() on negative int256 reverts. Chainlink
    feeds CAN return negative prices in extreme scenarios (e.g., negative
    oil prices in 2020). The contract should handle this gracefully in the
    read path. This is a well-known oracle pattern — checking answer > 0
    before casting. Likely reportable as Medium.

false_positives:
- hunter: FlowHunter
  id: PM-FP-01
  reason: >
    Investigated reentrancy via verifierProxy.verifyBulk() callback in
    transmit(). The verifyBulk call at L153 is an external call to
    i_streamsVerifierProxy which is an immutable trusted Chainlink contract.
    Even if it called back into transmit(), the onlyRole check + no state
    read between pre-check and verifyBulk that could be manipulated makes
    this unexploitable. The pre-check at L140-150 is read-only and the
    post-verify loop writes fresh state. No CEI violation because effects
    (price storage) happen AFTER the interaction (verifyBulk).
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null

- hunter: FlowHunter
  id: PM-FP-02
  reason: >
    Investigated whether remove+add of same asset in one call could cause
    issues. The remove phase (L217-231) clears all state, then the add phase
    (L233-302) rebuilds it. The only "lost" data is s_dataStreamsPrice which
    is deleted on remove and not restored on add. This is by design — the
    add creates a fresh feed config and the next transmit() will populate
    the price. No vulnerability here.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null

- hunter: FlowHunter
  id: PM-FP-03
  reason: >
    Investigated _getAssetPrice reading s_feedInfo for non-allowlisted asset.
    If called with an asset not in s_allowlistedAssets, s_feedInfo[asset] is
    all zeros, s_dataStreamsPrice[asset] is all zeros. minTimestamp =
    block.timestamp - 0 = block.timestamp. updatedAt = 0 < block.timestamp,
    so stale. usdDataFeed = address(0), so no fallback. Returns (0, 0, false)
    with withValidation=false, or reverts with withValidation=true. This is
    correct behavior — no vulnerability.
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update: null
