# ══════════════════════════════════════════════════════════════════
#  ANÁLISIS DE FLUJO — FlowHunter
#  Foco: state consistency, incomplete cleanup, state desync between
#        s_feedInfo / s_dataStreamsFeedIdToAsset / s_dataStreamsPrice / s_allowlistedAssets
#
#  STATE MAPS (4 structures that MUST stay in sync):
#    s_allowlistedAssets    — EnumerableSet of active asset addresses
#    s_feedInfo[asset]      — FeedInfo struct (feedId, dataFeed, staleness, decimals)
#    s_dataStreamsFeedIdToAsset[feedId] — reverse mapping feedId→asset
#    s_dataStreamsPrice[asset] — cached DataStreams price+timestamp
#
#  CRITICAL FLOWS ANALYZED:
#    1. _applyFeedInfoUpdates (adds + removes) — L209-303
#    2. transmit() — L133-183 (pre-check → verifyBulk → store)
#    3. _getAssetPrice() — L372-418 (DataStreams → fallback DataFeed)
#    4. Feed rotation cleanup — L263-278
#
#  KEY FINDING: The pre-check in transmit() (L140-150) extracts the feedId
#  from the RAW unverified report bytes, while the post-verify loop (L155-182)
#  decodes feedId from the VERIFIED report struct. These SHOULD match because
#  the verifier preserves the feedId, but the extraction methods differ:
#    - Pre-check:  bytes32(reportData) where reportData is the 2nd decoded element
#    - Post-check: report.dataStreamsFeedId from abi.decode as ReportV3
#  If verifierProxy returns a different feedId (malicious or upgraded proxy),
#  the pre-check passes for allowlisted feed but price is stored for a
#  different (possibly non-allowlisted) asset.
# ══════════════════════════════════════════════════════════════════

