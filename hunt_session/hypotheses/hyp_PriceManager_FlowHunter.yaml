- id: PM-F06
  tier: 2
  type: property
  description: >
    _getAssetPrice underflow DoS: if stalenessThreshold is very large (close
    to or exceeding block.timestamp), the subtraction at L378
    (block.timestamp - feedInfo.stalenessThreshold) underflows and reverts
    due to Solidity 0.8 checked math. This blocks ALL price reads for the
    affected asset.
  attack_scenario: >
    ASSET_ADMIN sets stalenessThreshold to a value >= block.timestamp (e.g.,
    type(uint32).max = 4294967295, which is ~136 years from epoch). At
    current timestamps (~1.7B), this doesn't underflow. But on a chain with
    block.timestamp near 0 (test environments, or if block.timestamp is
    manipulated), or if stalenessThreshold is set to a value > current
    timestamp, the subtraction underflows.
    In practice: block.timestamp is ~1.7B (2024), uint32 max is ~4.3B.
    So stalenessThreshold > 1.7B would cause underflow. The field is uint32,
    max ~4.3B, so values between 1.7B and 4.3B would cause underflow.
    An ASSET_ADMIN setting stalenessThreshold > block.timestamp causes
    permanent DoS on _getAssetPrice for that asset until block.timestamp
    catches up.
  impact: >
    DoS on price reads for the affected asset. All auctions involving this
    asset would be blocked. No direct fund loss but operational disruption.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Property: block.timestamp >= feedInfo.stalenessThreshold for all assets
    address[] memory assets = priceManager.getAllowlistedAssets();
    for (uint256 i = 0; i < assets.length; i++) {
        PriceManager.FeedInfo memory fi = priceManager.getFeedInfo(assets[i]);
        if (fi.stalenessThreshold > 0) {
            gte(block.timestamp, fi.stalenessThreshold,
                "PM-F06: stalenessThreshold > block.timestamp causes underflow DoS");
        }
    }
  ghost_vars: []
  validated: false
  priority: low
  confidence: 75
  notes: >
    This is a real underflow with real DoS impact, but requires admin
