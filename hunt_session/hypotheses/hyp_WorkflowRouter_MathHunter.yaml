invariants:

- id: WR-MATH-01
  tier: 2
  type: property
  description: >
    Metadata offset mismatch: el comentario NatSpec indica que workflowId está en
    "Offset 32, size 32" pero el código lee bytes32(metadata[:32]) — es decir, offset 0.
    Si la especificación del protocolo define que los bytes 0-31 del metadata son otro
    campo (ej. un type prefix o version tag), el código estaría usando el campo incorrecto
    como workflowId, rompiendo la validación del allowlist.
  attack_scenario: >
    Un operador de workflow malintencionado podría construir un metadata cuyo campo en
    bytes 0-31 coincida con un workflowId allowlisted, mientras el campo "real" en
    bytes 32-63 sea un workflowId diferente (no allowlisted). Si el protocolo upstream
    (Chainlink DON) construye metadata según la spec (workflowId en offset 32), entonces
    el WorkflowRouter estaría leyendo el campo equivocado. En la práctica, un reporte
    con workflowId_real=NOT_ALLOWLISTED podría pasar el check si bytes[0:32] casualmente
    o intencionalmente es igual a un workflowId allowlisted.
  impact: >
    Bypass parcial del allowlist de workflowId: un workflow no autorizado podría ejecutar
    llamadas arbitrarias a targets/selectors allowlisted para otro workflow. La severidad
    depende de si el protocolo upstream envía metadata con workflowId en offset 0 u
    offset 32 — si hay discrepancia, es un bug real de confusión de campos.
  impact_rating: High
  likelihood: Medium
  severity_final: null
  solidity: |
    // Verificar que el workflowId extraído coincide con lo que el protocolo upstream
    // realmente envía. La invariante es: si metadata tiene ≥ 64 bytes, los bytes
    // [0:32] y [32:64] NO deberían ser ambos workflowIds válidos allowlisted
    // (ya que solo uno de ellos es el "real").
    //
    // Property testeable:
    // Dado un metadata donde bytes[0:32] == allowlistedId1 y bytes[32:64] == allowlistedId2,
    // el contrato solo debería aceptar el campo correcto según la spec.
    //
    // En Chimera (fork test):
    bytes32 extractedId = bytes32(metadata[:32]);
    bytes32 specId = bytes32(metadata[32:64]); // según el comentario NatSpec
    // Si la spec es offset 32, entonces el contrato debería revertir cuando
    // extractedId != specId y specId es el que realmente controla el workflow.
    // El invariante falla si ambos campos pueden ser usados indistintamente.
    bool idFromOffset0IsAllowlisted = s_allowlistedWorkflowIds.contains(extractedId);
    bool idFromOffset32IsAllowlisted = s_allowlistedWorkflowIds.contains(specId);
    // Si el protocolo real usa offset 32, y offset 0 contiene otro dato allowlisted,
    // el check actual pasaría incorrectamente.
    t(
      !(idFromOffset0IsAllowlisted && !idFromOffset32IsAllowlisted),
      "WR-MATH-01: workflowId leído de offset 0 pero spec dice offset 32"
    );
  ghost_vars: []
  validated: false
  priority: high
  confidence: 55
  notes: >
    REQUIERE INVESTIGACIÓN ADICIONAL: verificar el formato real del metadata que envía
    el Chainlink DON. Si el protocolo upstream siempre pone workflowId en bytes[0:32],
    entonces el código es correcto y el comentario NatSpec tiene un off-by-one tipográfico
    (el "Offset 32" en el comentario podría referirse al tamaño en bits, no en bytes, o
    podría ser una convención diferente de "offset"). Si en cambio el DON construye
    metadata con workflowId en bytes[32:64], esto es un bug crítico.
    Ver: la spec dice "Offset 32, size 32: workflow_id" — en protocolos Chainlink, los
    offsets en metadata suelen ser en bytes. Esto sugiere que el campo correcto debería
    estar en bytes[32:64], pero el código lee bytes[0:32].
    Confidence: 55 — no confirmado hasta revisar la spec del DON y los tests de integración.

- id: WR-MATH-02
  tier: 1
  type: property
  description: >
    Selector extraction sin validación de longitud mínima: el assembly block
    `selector := mload(add(data, 32))` no verifica que data.length >= 4 antes de
    ejecutarse. Si data tiene longitud 0, 1, 2, o 3, el mload lee bytes de memoria
    que pueden incluir padding de ceros, produciendo un selector derivado que no
    corresponde a ningún selector real.
  attack_scenario: >
    Un FORWARDER_ROLE malintencionado o comprometido envía un report con data de longitud
    < 4 bytes. El selector extraído sería 0x00000000 (ceros) o un valor parcialmente
    definido. Dado que bytes4(0) no puede ser añadido al allowlist (lo previene el check
    en _applyAllowlistedSelectorsUpdates: `if (selector == bytes4(0)) revert`), el check
    `contains(selector)` fallará y el contrato revertirá con SelectorNotAllowlisted.
    No hay pérdida de fondos directa — es un DoS en el flujo normal.
    NOTA: este vector es menos grave de lo que parece porque el sistema previene que
    bytes4(0) entre al allowlist, por lo que no hay bypass posible via data vacío.
  impact: >
    DoS limitado: un forwarder podría enviar data malformado que cause revert. No hay
    pérdida de fondos porque el check de allowlist previene la ejecución. Severidad: Low/Info.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: si data.length < 4, el contrato debe revertir ANTES de la llamada
    // a _call(target, data), no silenciosamente proceder con un selector inválido.
    // El comportamiento actual es correcto (revert por SelectorNotAllowlisted) pero
    // no da un mensaje de error descriptivo sobre la longitud de data.
    //
    // Property: si se llega al assembly block con data.length < 4, el selector
    // resultante no puede estar en el allowlist (porque bytes4(0) está excluido).
    // Por tanto, siempre revertiría. Invariante conservada.
    if (data.length < 4) {
      // El assembly leerá bytes de ceros (memory padding de Solidity)
      // El selector será bytes4(0) = 0x00000000
      // El contains(bytes4(0)) retornará false siempre
      // El contrato revertirá — OK, no hay bypass
      t(true, "WR-MATH-02: data corto -> revert esperado, no bypass");
    }
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: >
    Investigado y DESCARTADO como bug explotable. El sistema es safe porque:
    (1) bytes4(0) no puede ser añadido al allowlist por _applyAllowlistedSelectorsUpdates.
    (2) Si data.length < 4, el selector extraído sería 0x00000000 o una variante con
    ceros en las posiciones no escritas — ninguno puede estar allowlisted.
    (3) El contrato siempre revertiría con SelectorNotAllowlisted, no ejecutaría _call.
    Añadido como false positive.

- id: WR-MATH-03
  tier: 2
  type: property
  description: >
    Assembly pointer aliasing bytes32[] → bytes4[]: en _applyAllowlistedTargetsUpdates,
    el cast `removedSelectors := allowlistedSelectors` aliasa un bytes32[] como bytes4[].
    La correctness depende del memory layout de ambos tipos: ¿los bytes4 almacenados
    en el EnumerableSet.Bytes32Set tienen la representación correcta para ser leídos
    como bytes4[]?
  attack_scenario: >
    Si el alias es incorrecto, _applyAllowlistedSelectorsUpdates podría recibir selectores
    con valores corruptos. En el peor caso, intentaría remover del set un bytes32 que no
    existe (el valor aliased no coincide con el stored value), causando que el set NO se
    limpie correctamente cuando se remueve un target. Los selectores del target permanecerían
    en el mapping después de que el target es removido del allowlistedTargets set.
    Esto dejaría "fantasmas" de selectores huérfanos que no pueden ser alcanzados via
    allowlistedTargets (porque el target ya no está), pero siguen ocupando storage.
    No es explotable para bypass porque onReport chequea allowlistedSelectors[target].contains()
    que accede directamente al mapping, independiente de allowlistedTargets.
  impact: >
    Storage leak potencial: si el alias es incorrecto, los selectores de un target removido
    no se limpian del mapping allowlistedSelectors[target]. En una re-adición del mismo
    target, los selectores antiguos estarían presentes inesperadamente (re-activados sin
    haberlos añadido explícitamente). Esto podría ser explotado en un escenario donde un
    target es removido y re-añadido con una allowlist más restrictiva, pero los selectores
    viejos persisten.
  impact_rating: Medium
  likelihood: Low
  severity_final: null
  solidity: |
    // Verificar que el cast bytes32[] → bytes4[] produce los mismos valores.
    // En Solidity memory: bytes4(0x12345678) se almacena como
    // 0x1234567800000000000000000000000000000000000000000000000000000000 (left-aligned).
    // bytes32(bytes4(0x12345678)) tiene EXACTAMENTE el mismo bit pattern (MSB = left-aligned).
    // Por tanto: el slot de 32 bytes es idéntico en ambos casos.
    // El length field del array también es el mismo (mismo pointer).
    //
    // Invariante: para todo selector s en allowlistedSelectors[target],
    // bytes4(bytes32(s)) == s (la round-trip es identidad).
    //
    // En fork test:
    bytes32[] memory asBytes32 = s_workflowInfos[workflowId].allowlistedSelectors[target].values();
    for (uint256 i = 0; i < asBytes32.length; i++) {
      bytes4 asBytes4;
      assembly ("memory-safe") {
        // Leer el i-ésimo elemento del array aliased como bytes4[]
        asBytes4 := mload(add(add(asBytes32, 32), mul(i, 32)))
      }
      // El bytes4 debe ser el selector original (MSB de bytes32)
      bytes4 expected = bytes4(asBytes32[i]); // conversión estándar de Solidity
      eq(bytes32(asBytes4), bytes32(expected), "WR-MATH-03: alias bytes32[]->bytes4[] incorrecto");
    }
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 70
  notes: >
    El análisis teórico indica que el cast ES correcto: Solidity almacena bytes4 y bytes32
    con los bytes significativos en la posición MSB (left-aligned), por lo que el bit
    pattern de un slot de 32 bytes es idéntico para bytes4(X) y bytes32(bytes4(X)).
    Sin embargo, la consecuencia de un bug residual (storage leak si el cast falla en algún
    caso edge) justifica un test de propiedad. Confidence 70 de que es safe, 30 de que
    hay un edge case no considerado.
    RIESGO CONCRETO A TESTEAR: ¿qué pasa si el EnumerableSet almacena internamente los
    bytes32 con algún padding o hash que cambia el bit pattern? Revisar implementación
    de EnumerableSet.Bytes32Set.add() — usa el valor directamente sin transformación.

- id: WR-MATH-04
  tier: 1
  type: property
  description: >
    Invariante de consistencia del allowlist: si un selector está en
    allowlistedSelectors[workflowId][target], entonces el target DEBE estar en
    allowlistedTargets[workflowId]. La remoción de un target debe limpiar todos sus
    selectores, sin dejar selectores huérfanos accesibles via onReport.
  attack_scenario: >
    Si hay una ruta de código donde un selector queda en allowlistedSelectors[target]
    después de que el target es removido de allowlistedTargets, entonces en una re-adición
    del target, los selectores "fantasma" estarían activos sin haber sido explícitamente
    añadidos en la re-adición. Esto podría permitir llamadas a funciones que el admin
    creyó haber revocado al hacer el remove del target.
    Escenario específico: admin hace remove(target) → cree que todos los permisos de target
    están revocados → hace add(target, [selector_A]) → en realidad target tiene [selector_A,
    selector_B_fantasma] activos porque el cleanup falló.
  impact: >
    Privilege escalation via stale selectors: llamadas a funciones no autorizadas en re-added
    targets. Si el target es un contrato de alto valor (ej. un vault o un token), un selector
    fantasma podría permitir llamadas no autorizadas que el admin creyó haber eliminado.
  impact_rating: High
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante post-remoción de target: no deben quedar selectores en el mapping.
    // Esta invariante chequea que después de remover un target, su selector set está vacío.
    //
    // Se puede verificar con un ghost que trackea qué targets han sido removidos:
    // Para todo workflowId W, para todo target T:
    // Si T NO está en allowlistedTargets[W], ENTONCES allowlistedSelectors[W][T].length() == 0
    //
    // En Chimera fork test:
    address[] memory targets = s_workflowInfos[workflowId].allowlistedTargets.values();
    // Para targets que YA NO están en el set (necesitamos ghost tracking):
    // ghost_removedTargets[workflowId] contiene los targets removidos en la sesión
    for (uint256 i = 0; i < ghost_removedTargets[workflowId].length; i++) {
      address removedTarget = ghost_removedTargets[workflowId][i];
      bool stillInSet = s_workflowInfos[workflowId].allowlistedTargets.contains(removedTarget);
      if (!stillInSet) {
        uint256 selectorCount = s_workflowInfos[workflowId].allowlistedSelectors[removedTarget].length();
        eq(selectorCount, 0, "WR-MATH-04: selectores fantasma en target removido");
      }
    }
  ghost_vars:
  - "mapping(bytes32 => address[]) internal ghost_removedTargets;"
  validated: false
  priority: high
  confidence: 65
  notes: >
    La función _applyAllowlistedTargetsUpdates llama a _applyAllowlistedSelectorsUpdates
    con removedSelectors (todos los selectores del target) antes de remover el target del set.
    Si este cleanup funciona correctamente (lo cual depende de WR-MATH-03 siendo correcto),
    la invariante se mantiene. Si el cast bytes32[]→bytes4[] es incorrecto y algunos
    selectores no se remueven del set, esta invariante se violaría.
    Este invariante es el "downstream" de WR-MATH-03: si WR-MATH-03 falla, WR-MATH-04 también.

- id: WR-MATH-05
  tier: 2
  type: property
  description: >
    Doble allowlisting de selector no emite evento duplicado pero sí devuelve true en add():
    en _applyAllowlistedSelectorsUpdates, `s_workflowInfos[workflowId].allowlistedSelectors[target].add(bytes32(selector))`
    solo emite SelectorAllowlisted si la llamada add() retorna true (el elemento es nuevo).
    Si el selector ya existía, add() retorna false y NO se emite el evento. Esto es correcto
    para el evento, pero el contrato no revierte en doble-add. La operación es silenciosa.
  attack_scenario: >
    Un admin llama applyAllowlistedWorkflowsUpdates con un workflowId que ya existe en
    el allowlist (no hay check de "ya existe" para re-adds parciales). Los selectors se
    "re-añaden" silenciosamente sin error ni evento. No hay pérdida de fondos, pero puede
    causar confusión en el offchain monitoring que usa eventos para reconstruir el estado.
    Si el monitoring asume que el estado onchain es idéntico al estado reconstruido via
    eventos, y hay un add duplicado (que no emite evento), el estado divergiría.
    Impacto: monitoring/UI puede mostrar estado incorrecto, llevando a decisiones admin
    basadas en estado incompleto.
  impact: >
    Inconsistencia entre estado onchain y estado reconstruido via eventos. No hay pérdida
    de fondos directa. Severidad: Low/Informational.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante: el estado reconstruido sumando todos los eventos SelectorAllowlisted
    // y SelectorRemovedFromAllowlist debe ser idéntico al estado onchain de getAllowlistedSelectors.
    // En fuzzing, esto se verifica comparando getters vs ghost state.
    //
    // Ghost que trackea adiciones via eventos:
    // ghost_selectorAddedViaEvent[workflowId][target] = set de selectors
    //
    // Después de cada operación:
    bytes4[] memory onchainSelectors = getAllowlistedSelectors(workflowId, target);
    // Comparar con ghost reconstruido via eventos
    eq(onchainSelectors.length, ghost_selectorCount[workflowId][target],
       "WR-MATH-05: estado onchain difiere del reconstruido via eventos");
  ghost_vars:
  - "mapping(bytes32 => mapping(address => uint256)) internal ghost_selectorCount;"
  validated: false
  priority: low
  confidence: 75
  notes: >
    El comportamiento es technically correct (EnumerableSet.add() retorna false sin revert
    para duplicados, y el contrato condicionalmente emite el evento). La pregunta es si
    el protocolo DEPENDE de los eventos para reconstruir estado (common en sistemas
    event-sourced). Si sí, entonces re-adds en applyAllowlistedWorkflowsUpdates pueden
    dejar el estado de eventos desincronizado.

