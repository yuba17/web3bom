- hunter: MathHunter
  id: WR-MATH-FP-02
  reason: >
    Assembly pointer aliasing bytes32[] → bytes4[] (valor de bits): el análisis de
    memory layout de Solidity confirma que bytes4 y bytes32 usan la misma representación
    MSB (left-aligned) en slots de 32 bytes. bytes4(0x12345678) y bytes32(bytes4(0x12345678))
    tienen el MISMO bit pattern en el slot de memoria. El alias es seguro para lectura
    de valores. La preocupación de corrupción de valores queda descartada en el análisis
    teórico (pendiente test de confirmación para WR-MATH-03).
  investigated_at: '2026-03-22T00:00:00Z'
  pending_briefing_update:
    action: add_to_trampas
    briefing: access.md
    content: >
      Pointer aliasing bytes32[] → bytes4[] en Solidity memory es safe porque ambos tipos
      usan representación left-aligned (MSB) en slots de 32 bytes. El bit pattern es
      idéntico. Solo verificar que el EnumerableSet no transforma los valores internamente.
    briefing_update_applied: false

