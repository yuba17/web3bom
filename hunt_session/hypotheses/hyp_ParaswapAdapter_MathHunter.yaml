- id: PA-M07
  tier: 1
  type: property
  description: "updateAmounts escala limitAmount proporcionalmente, pero el swap real puede tener slippage no lineal"
  attack_scenario: |
    updateAmounts() escala limitAmount linealmente: newLimit = oldLimit * newExact / oldExact.
    Esto asume que el precio es constante (relación lineal entre cantidades).

    En la realidad, los AMMs tienen slippage no lineal (curva x*y=k).
    Si newExact >> oldExact, el limitAmount escalado linealmente puede ser DEMASIADO
    generoso — permitiendo más slippage del que el usuario espera.

    Ejemplo concreto (sell):
    - Original: vender 100 ETH, mínimo recibir 200,000 USDC (2000 USDC/ETH)
    - sellEntireBalance=true, balance=1000 ETH
    - newLimit = 200,000 * 1000/100 = 2,000,000 USDC (sigue asumiendo 2000/ETH)
    - Pero vender 1000 ETH en un AMM real con esa liquidez daría ~1,500,000 USDC
    - El limit de 2,000,000 haría revertir la tx → PROTEGE al usuario (Ceil rounding)

    Ejemplo contrario (buy con Floor):
    - Original: comprar 100 ETH, máximo gastar 200,000 USDC
    - newDestAmount=1000 ETH
    - newLimit = 200,000 * 1000/100 = 2,000,000 USDC máximo a gastar
    - Pero comprar 1000 ETH costaría ~2,500,000 USDC por slippage
    - El limit de 2,000,000 haría revertir → PROTEGE al usuario (Floor rounding)

    En ambos casos, el escalado lineal es CONSERVADOR cuando el precio empeora
    y PERMISIVO cuando mejora. Esto no es un bug — es una aproximación razonable
    y los checks de slippage en swap() actúan como safety net.
  impact: "Ninguno — el escalado lineal es una aproximación conservadora"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante conceptual: el escalado lineal no puede causar pérdida de fondos
    // porque swap() siempre verifica srcAmount <= maxSrcAmount y destAmount >= minDestAmount
    // El worst case es que la tx revierte (DoS), no fund loss
  ghost_vars: []
  validated: true
  priority: low
  confidence: 85
  notes: |
    Investigado: el escalado lineal de limitAmount es una aproximación, pero los
    checks post-swap en swap() son la verdadera protección. El limitAmount escalado
    es un hint para Augustus, no un invariante de seguridad del adapter.
    Los requires en L194-195 son los que protegen al usuario.
    VEREDICTO: Correcto by design. No es un finding.

