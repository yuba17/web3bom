- id: PA-M01
  tier: 2
  type: property
  description: "updateAmounts division-by-zero DoS cuando oldExactAmount en callData es 0"
  attack_scenario: |
    Si el callData original contiene 0 en el offset exactAmount, updateAmounts() llama
    mulDiv(limitAmount, newExactAmount, 0) que revierte con division by zero.
    Un atacante no gana fondos, pero un usuario legítimo que construya callData con
    exactAmount=0 (e.g., callData corrupto o edge case en integrador) sufre DoS.
    En sell(sellEntireBalance=true): balance se escribe como newSrcAmount, pero
    oldExactAmount ya se leyó antes del set → si oldExactAmount original era 0, revert.
    En buy(): si newDestAmount != 0 pero callData tiene exactAmount=0, revert.
  impact: "DoS — transacción revierte, no hay pérdida de fondos directa. Impacto bajo."
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Propiedad: updateAmounts nunca debería llamarse con oldExactAmount=0 sin revertir gracefully
    // Este es más un test de robustez que un invariante de fuzzing
    // En la práctica mulDiv revierte, así que el contrato está protegido por OZ Math
    // No es fuzzeable como invariante — es un unit test edge case
    bytes memory testCallData = new bytes(128);
    // Set exactAmount offset to contain 0
    // assembly { mstore(add(testCallData, add(32, 0)), 0) }
    // Calling updateAmounts should revert — this is expected behavior
  ghost_vars: []
  validated: false
  priority: low
  confidence: 30
  notes: |
    Investigado: mulDiv de OpenZeppelin revierte con denominator=0 (require en L155-156
    del Math.sol). Esto significa que la transacción revierte limpiamente — no hay estado
    corrupto ni fondos en riesgo. Es un DoS path pero solo afecta al caller con callData
    malformado. No es un bug explotable — es defensa natural del código.
    VEREDICTO: By design / no explotable.

- id: PA-M02
  tier: 2
  type: property
  description: "srcToken == destToken permite contabilidad inconsistente en swap()"
  attack_scenario: |
    Si srcToken y destToken son el mismo token:
    - srcInitial = destInitial = balanceOf(this) (mismo valor)
    - Después del swap via Augustus, srcFinal = destFinal (mismo balance)
    - srcAmount = srcInitial - srcFinal
    - destAmount = destFinal - destInitial = srcFinal - srcInitial = -(srcAmount)

    Si Augustus consume tokens (srcFinal < srcInitial): srcAmount > 0, pero
    destAmount = srcFinal - srcInitial sería negativo → underflow → revert.

    Si Augustus AÑADE tokens (srcFinal > srcInitial): srcAmount underflows → revert.

    El único caso que no revierte es srcFinal == srcInitial (no-op): srcAmount=0, destAmount=0.
    Pero destAmount=0 < minDestAmount → revert (minDestAmount != 0 enforced).

    Conclusión: srcToken == destToken SIEMPRE revierte. No hay explotación posible,
    pero un integrador que envíe esta combinación pierde gas sin mensaje de error claro.
  impact: "DoS con gas loss para integradores — no hay pérdida de fondos del protocolo"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: swap con srcToken == destToken siempre debe revertir
    // No es un invariante de fuzzing sino un test de edge case
    // La protección está implícita en la aritmética checked de Solidity 0.8
  ghost_vars: []
  validated: false
  priority: low
  confidence: 60
  notes: |
    Investigado a fondo. La aritmética checked de Solidity 0.8.28 protege contra
    este caso — siempre revierte. No hay path donde srcToken==destToken produzca
    un resultado válido. El "bug" es la falta de un require(srcToken != destToken)
    con un mensaje descriptivo, pero no es explotable.
    VEREDICTO: QA / informational como mejora de UX, no security issue.

- id: PA-M03
  tier: 2
  type: property
  description: "Rounding direction en updateAmounts: sell() Ceil vs buy() Floor — ¿favorece al usuario o al protocolo?"
  attack_scenario: |
    sell() usa Rounding.Ceil para limitAmount (= minBuyAmount para el seller).
    - Ceil redondea hacia arriba → el seller exige MÁS tokens de destino → protege al seller.

    buy() usa Rounding.Floor para limitAmount (= maxSellAmount para el buyer).
    - Floor redondea hacia abajo → el buyer permite MENOS tokens de origen gastados → protege al buyer.

    Ambos son correctos desde la perspectiva del usuario:
    - En sell: quieres recibir al menos X → Ceil asegura que el mínimo sea generoso.
    - En buy: quieres gastar como máximo Y → Floor asegura que el máximo sea conservador.

    ¿Podría un atacante explotar el rounding? Solo si la diferencia de 1 wei entre
    floor y ceil crea un arbitraje. Con tokens de 18 decimales, 1 wei = ~0.
    Con tokens de pocos decimales (e.g., USDC 6 decimales), 1 wei = 0.000001 USDC.
    No hay ataque económico viable por 1 wei de rounding.
  impact: "Ninguno — rounding es correcto y la diferencia es de 1 wei máximo"
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Test: verificar que sell() Ceil produce limitAmount >= buy() Floor para mismos inputs
    // Esto es un property test, no un invariante de runtime
    // Para cualquier (oldExact, newExact, limitOld):
    //   ceil_result = limitOld.mulDiv(newExact, oldExact, Ceil)
    //   floor_result = limitOld.mulDiv(newExact, oldExact, Floor)
    //   assert(ceil_result >= floor_result)
    //   assert(ceil_result - floor_result <= 1)
  ghost_vars: []
  validated: true
  priority: low
  confidence: 90
  notes: |
    Investigado: el rounding es correcto y consistente con la semántica de cada operación.
    mulDiv con Rounding.Ceil = mulDiv(x,y,d) + (mulmod(x,y,d) > 0 ? 1 : 0).
    La diferencia máxima es 1 wei. No hay vector de ataque.
    VEREDICTO: Correcto by design. No es un finding.

- id: PA-M04
  tier: 1
  type: property
  description: "BytesLib.get/set con offset fuera de bounds o overlapping offsets en Offsets struct"
  attack_scenario: |
    Los offsets (exactAmount, limitAmount, quotedAmount) los proporciona el caller.
    BytesLib.get() y .set() validan offset <= data.length - 32, lo cual previene
    lectura/escritura fuera de bounds.

    PERO: si dos offsets apuntan al MISMO byte range (e.g., exactAmount == limitAmount),
    updateAmounts() primero escribe exactAmount en ese offset, y luego lee limitAmount
    del MISMO offset (que ahora contiene exactAmount en vez de limitAmount original).

    Flujo en updateAmounts con exactAmount == limitAmount:
    1. oldExactAmount = callData.get(offsets.exactAmount)  // lee valor original
    2. callData.set(offsets.exactAmount, exactAmount)       // escribe nuevo valor
    3. limitAmount = callData.get(offsets.limitAmount)       // LEE EL NUEVO VALOR (no el original!)
    4. limitAmount = newValue.mulDiv(exactAmount, oldExactAmount, rounding)
    5. callData.set(offsets.limitAmount, limitAmount)        // sobreescribe con cálculo basado en sí mismo

    Resultado: limitAmount = exactAmount * exactAmount / oldExactAmount
    En sell(): minDestAmount = exactAmount^2 / oldExactAmount (potencialmente enorme)
    → swap revierte porque Augustus no puede satisfacer un minDestAmount inflado
    → DoS, no fund loss

    En buy(): maxSrcAmount = exactAmount^2 / oldExactAmount
    → si este valor es mayor al esperado, el buyer permite gastar más de lo deseado
    → POSIBLE pérdida para el buyer si Augustus cobra más del precio justo

    Sin embargo: el caller controla los offsets. Un caller honesto no pone offsets iguales.
    Un caller malicioso que controla offsets también controla callData → puede simplemente
    poner cualquier valor directamente. No hay ventaja en usar offsets overlapping vs
    manipular callData directamente.
  impact: |
    En buy() con offsets overlapping: maxSrcAmount inflado podría permitir que Augustus
    cobre más srcToken del esperado. Pero el caller que setea offsets overlapping se
    perjudica a sí mismo — no hay tercero víctima ya que el caller es el bundler3 user.
  impact_rating: Low
  likelihood: Low
  severity_final: null
  solidity: |
    // Invariante: si exactAmount offset == limitAmount offset, el resultado es cuadrático
    // No es fuzzeable como invariante de seguridad — es un edge case de input validation
    // El caller es quien pierde, no un tercero
    // Test conceptual:
    // bytes memory cd = abi.encode(selector, 1000);
    // Offsets memory o = Offsets(4, 4, 0); // same offset!
    // updateAmounts(cd, o, 2000, Rounding.Floor);
    // uint256 result = BytesLib.get(cd, 4);
    // assert(result == 2000 * 2000 / 1000); // 4000 instead of expected proportional scale
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 45
  notes: |
    Investigado: el overlap de offsets produce resultados incorrectos pero el caller
    controla ambos inputs (offsets y callData). No hay un tercer actor que sufra.
    El bundler3 ejecuta en nombre del initiator, y el initiator es quien setea offsets.
    Si un integrador tiene un bug que produce offsets overlapping, su usuario sufre
    (DoS o slippage excesivo), pero no es una vulnerabilidad del contrato per se.
    VEREDICTO: Informational / defense-in-depth. Un require(offsets.exactAmount != offsets.limitAmount)
    sería una mejora pero la ausencia no es explotable por terceros.

- id: PA-M05
  tier: 2
  type: property
  description: "buyMorphoDebt: debtAmount puede crecer entre expectedBorrowAssets() y la ejecución real del swap"
  attack_scenario: |
    buyMorphoDebt() lee debtAmount = expectedBorrowAssets() en el bloque actual.
    Luego llama buy() con newDestAmount = debtAmount.

    Si la intención es comprar EXACTAMENTE la deuda para repay completo, hay un timing issue:
    - La deuda acumula interés continuamente (cada bloque).
    - Entre la lectura de expectedBorrowAssets() y el repay posterior (en otra acción del bundle),
      podrían pasar bloques si hay acciones intermedias que consumen gas/tiempo.
    - PERO: todo está en el mismo bundle (Bundler3 es multicall atómico) → mismo bloque.

    Dentro del mismo bloque, ¿puede cambiar la deuda? Solo si otra acción del bundle
    modifica el mercado Morpho ANTES de buyMorphoDebt (e.g., un repay parcial, un borrow, o
    accrueInterest). Si se llama accrueInterest antes de buyMorphoDebt en el mismo bundle,
    la lectura de expectedBorrowAssets ya refleja el interés acumulado → no hay discrepancia.

    Si NO se llama accrueInterest primero: expectedBorrowAssets simula el interés internamente
    (es una view function que calcula el expected value). Pero el repay posterior SÍ llama
    accrueInterest → los valores podrían diferir por rounding (view vs storage update).

    La diferencia sería de 1 wei máximo (rounding up vs down). En el peor caso, el buyer
    compra 1 wei menos de lo necesario para el repay completo, dejando 1 wei de dust debt.
  impact: |
    1 wei de dust debt residual después de un repay "completo" via buyMorphoDebt.
    Impacto económico: ~0. Pero podría causar que un "full repay" no cierre la posición
    completamente, requiriendo una transacción adicional.
  impact_rating: Low
  likelihood: Medium
  severity_final: null
  solidity: |
    // Invariante: debtAmount from expectedBorrowAssets >= actual debt at repay time
    // O dicho de otra forma: buyMorphoDebt compra suficiente para cubrir la deuda
    // Este invariante requiere un setup con Morpho real (fork test)
    //
    // uint256 debtBefore = MorphoBalancesLib.expectedBorrowAssets(MORPHO, mp, user);
    // // execute buyMorphoDebt + repay bundle
    // uint256 debtAfter = morpho.borrowShares(id, user);
    // lte(debtAfter, 1, "PA-M05: dust debt > 1 wei after full repay");
  ghost_vars: []
  validated: false
  priority: medium
  confidence: 50
  notes: |
    expectedBorrowAssets() usa toAssetsUp() internamente — redondea la deuda hacia
    arriba. Esto significa que el buyer compra ligeramente MÁS de lo estrictamente
    necesario → el repay debería cubrir todo. Esto es protección deliberada.
    Sin embargo, si accrueInterest() en el repay produce un totalBorrowAssets
    diferente al simulado por expectedBorrowAssets (por rounding en el interés
    acumulado), podría haber 1 wei de diferencia.
    VEREDICTO: Probablemente correcto by design (toAssetsUp protege). Necesita
    fork test para confirmar. Low / QA como máximo.

