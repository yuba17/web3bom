# ============================================================
# proxy-001: storage-collision-on-upgrade
# ============================================================
- target_pattern: proxy-001
  new_incidents:
    - nombre: "Brink Protocol"
      fecha: "2022"
      perdida: "N/A (caught in audit)"
      tipo: "ProxyStorage._implementation and _owner at slots 0-1 overlap with verifier contract storage -- attacker could overwrite implementation address via delegatecall to crafted verifier"
      verificado: true
      fuente: "solodit #7274, Spearbit audit of Brink"

# ============================================================
# proxy-002: uninitialized-implementation
# ============================================================
- target_pattern: proxy-002
  new_incidents:
    - nombre: "Zap Protocol (Vesting, TokenSale, Admin)"
      fecha: "2024"
      perdida: "N/A (caught in audit)"
      tipo: "Three proxy contracts missing _disableInitializers in constructor -- implementation contracts directly initializable"
      verificado: true
      fuente: "solodit #35422, Zokyo audit of Zap"

    - nombre: "Ethos Network"
      fecha: "Oct 2024"
      perdida: "N/A (caught in audit)"
      tipo: "All EthosContracts (Profile, Review, Attestation, etc.) missing _disableInitializers in constructor + inheriting non-upgradeable OZ contracts"
      verificado: true
      fuente: "solodit #43742, Sherlock audit 2024-10-ethos-network"

    - nombre: "Lyra Finance (GMXAdapter)"
      fecha: "2023"
      perdida: "N/A (acknowledged, no impact on TransparentProxy)"
      tipo: "GMXAdapter implementation missing _disableInitializers -- attacker can take ownership of implementation, no delegatecall in contract limits impact"
      verificado: true
      fuente: "solodit #18907, Trust Security audit of Lyra Finance"

    - nombre: "Soulsclub Wheel"
      fecha: "2025"
      perdida: "N/A (caught in audit)"
      tipo: "UUPS Wheel contract missing _disableInitializers in constructor -- attacker could initialize implementation as admin"
      verificado: true
      fuente: "solodit #64741, Shieldify audit of Soulsclub Wheel"

# ============================================================
# proxy-003: uups-missing-upgrade-authorization
# ============================================================
- target_pattern: proxy-003
  new_incidents:
    - nombre: "MorpheusAI (DistributionV2)"
      fecha: "Jan 2024"
      perdida: "N/A (caught in audit)"
      tipo: "_authorizeUpgrade() has empty body with no access control -- anyone can upgrade implementation and selfdestruct proxy"
      verificado: true
      fuente: "solodit #41618, Codehawks audit of MorpheusAI"

    - nombre: "Ithaca Finance (Registry)"
      fecha: "2024"
      perdida: "N/A (caught in audit)"
      tipo: "Registry._authorizeUpgrade() has no access control -- any user can upgrade to arbitrary implementation"
      verificado: true
      fuente: "solodit #59727, Quantstamp audit of Ithaca Finance"

# ============================================================
# proxy-005: selfdestruct-on-implementation
# ============================================================
- target_pattern: proxy-005
  new_incidents:
    - nombre: "Biconomy SmartAccount"
      fecha: "Jan 2023"
      perdida: "N/A (caught in audit)"
      tipo: "Uninitialized SmartAccount implementation allows attacker to initialize, then delegatecall to Destructor contract executing selfdestruct -- all wallets pointing to implementation bricked"
      verificado: true
      fuente: "solodit #6440, Code4rena 2023-01-biconomy contest"

    - nombre: "Brink Protocol (Account.sol)"
      fecha: "2022"
      perdida: "N/A (caught in audit)"
      tipo: "Account.sol delegateCall() allows owner to delegatecall arbitrary target -- if access control compromised, selfdestruct bricks all user wallets"
      verificado: true
      fuente: "solodit #7276, Spearbit audit of Brink"

    - nombre: "Escher (FixedPrice/OpenEdition)"
      fecha: "Dec 2022"
      perdida: "User ETH locked permanently"
      tipo: "After selfdestruct, buy() calls to empty address succeed silently -- msg.value locked forever at destroyed contract address"
      verificado: true
      fuente: "solodit #6355, Code4rena 2022-12-escher contest"

    - nombre: "Mimo DeFi (MIMOProxy)"
      fecha: "Aug 2022"
      perdida: "N/A (proxy bricked + registry broken)"
      tipo: "User delegatecalls to selfdestruct target, destroying proxy. Registry still has destroyed proxy address -- user cannot deploy new proxy from same EOA"
      verificado: true
      fuente: "solodit #3150, Code4rena 2022-08-mimo contest"

# ============================================================
# proxy-006: storage-layout-gap-missing
# ============================================================
- target_pattern: proxy-006
  new_incidents:
    - nombre: "Biconomy SmartAccount (ModuleManager)"
      fecha: "Jan 2023"
      perdida: "N/A (caught in audit)"
      tipo: "SmartAccount inherits ModuleManager which has storage but no __gap -- future base contract changes shift all derived storage slots"
      verificado: true
      fuente: "solodit #6453, Code4rena 2023-01-biconomy contest"

    - nombre: "Connext Protocol"
      fecha: "2022"
      perdida: "N/A (caught in audit)"
      tipo: "All __GAP arrays set to 49 regardless of contract storage variable count -- incorrect gap sizes make future upgrades unsafe"
      verificado: true
      fuente: "solodit #7158, Spearbit audit of Connext"

    - nombre: "Rubicon (ExpiringMarket/SimpleMarket)"
      fecha: "May 2022"
      perdida: "N/A (caught in audit)"
      tipo: "SimpleMarket and ExpiringMarket have no storage gaps -- adding variables to base shifts RubiconMarket storage"
      verificado: true
      fuente: "solodit #2504, Code4rena 2022-05-rubicon contest"

    - nombre: "Ethos Network (AccessControl/SignatureControl)"
      fecha: "Oct 2024"
      perdida: "N/A (caught in audit)"
      tipo: "Custom AccessControl and SignatureControl have storage but no gaps, plus inherit non-upgradeable OZ contracts instead of upgradeable versions"
      verificado: true
      fuente: "solodit #43742, Sherlock audit 2024-10-ethos-network"

    - nombre: "Strata Protocol"
      fecha: "2024"
      perdida: "N/A (caught in audit)"
      tipo: "Upgradeable contracts missing both ERC-7201 namespaced storage and __gap arrays"
      verificado: true
      fuente: "solodit #57020, Cyfrin audit of Strata"

