# Access Control Round 2 — Incident Evidence from 1299 Solodit Findings
# Maps new patterns (access-024 to access-031) to supporting incidents
# Generated: 2026-03-19

# ============================================================
# access-024: Repeatable action missing epoch guard
# ============================================================

- pattern_id: access-024
  incidents:
    - protocol: "Alchemix"
      title: "Voter.poke() infinite FLUX minting"
      impact: critical
      description: "poke() called _vote() -> accrueFlux() without onlyNewEpoch modifier. 20+ independent reports on Immunefi. Attacker could mint unlimited FLUX in one tx."
      solodit_count: 18
      key_finding_ids: ["1103", "1111", "1115", "1119", "1122", "1125", "1140", "1156", "1158", "1167", "1171"]
      fix: "Added onlyNewEpoch modifier to poke()"

    - protocol: "Alchemix"
      title: "VotingEscrow.merge() + Voter.reset() cross-token epoch bypass"
      impact: critical
      description: "merge() transferred voting power to a new tokenId. reset() on new tokenId had fresh epoch state, allowing repeated accrual."
      solodit_count: 3
      key_finding_ids: ["1144", "1154", "1158"]

    - protocol: "Alchemix"
      title: "Voter.pokeTokens() admin function double-accrues FLUX"
      impact: high
      description: "Admin pokeTokens() function called poke for all tokens, accruing FLUX again even for tokens that already voted in the epoch."
      solodit_count: 1
      key_finding_ids: ["1139"]

    - protocol: "Blackhole (Code4rena)"
      title: "Permissionless voting via carryVoteForward()"
      impact: high
      description: "carryVoteForward() allowed anyone to trigger vote carry for any tokenId without epoch guard, disrupting bribe accounting."
      solodit_count: 1
      key_finding_ids: []

# ============================================================
# access-025: Timelock storage slot collision via cancel
# ============================================================

- pattern_id: access-025
  incidents:
    - protocol: "Coinbase / Solady"
      title: "cancel(bytes32(0)) zeroes minDelay via XOR slot collision"
      impact: critical
      description: "Timelock used assembly XOR to derive operation slots. cancel(0) produced a slot colliding with minDelay storage. Canceller could zero out delay and reinitialize the timelock, granting themselves all roles."
      solodit_count: 1
      key_finding_ids: ["451"]
      fix: "Added validation that cancel() only operates on actual pending operations"

# ============================================================
# access-026: ERC-6492 counterfactual signature abuse
# ============================================================

- pattern_id: access-026
  incidents:
    - protocol: "Coinbase SmartWallet"
      title: "ERC-6492 path drains any wallet with SpendPermissionManager"
      impact: critical
      description: "ERC-6492 verification deployed attacker-controlled contract during isValidSignature check. Contract returned true for signature validation, granting spend permission to drain the wallet."
      solodit_count: 2
      key_finding_ids: ["689", "690"]
      fix: "Restricted ERC-6492 deployment path in spend permission context"

# ============================================================
# access-027: Blacklist bypass via pre-existing approval
# ============================================================

- pattern_id: access-027
  incidents:
    - protocol: "TerPlayer BeraBTC"
      title: "Blacklisted user transfers via approved address"
      impact: high
      description: "transferFrom() blacklist modifier only checked msg.sender (spender), not from (token holder). Blacklisted users could move tokens through pre-approved non-blacklisted addresses."
      solodit_count: 1
      key_finding_ids: ["278"]

# ============================================================
# access-028: Session key scope escape
# ============================================================

- pattern_id: access-028
  incidents:
    - protocol: "Etherspot"
      title: "SessionKey owner impersonates another key owner"
      impact: critical
      description: "validateUserOp verified signer was a session key owner for the wallet but not that the signer owned the specific session key being consumed. Key A signer could consume Key B's token allowance."
      solodit_count: 1
      key_finding_ids: ["31"]

    - protocol: "Etherspot"
      title: "SessionKey owner drains wallet via approve + claim"
      impact: critical
      description: "Session keys could call ERC20.approve() on any token without amount restriction. Key holder approved themselves for max uint256 on all wallet tokens, then drained via transferFrom."
      solodit_count: 1
      key_finding_ids: ["32"]

    - protocol: "Etherspot"
      title: "Session key takeover via enableSessionKey overwrite"
      impact: critical
      description: "enableSessionKey() did not check if key was already registered to another wallet. Attacker overwrote sessionKeyToWallet mapping to hijack active session keys."
      solodit_count: 1
      key_finding_ids: ["134"]

    - protocol: "Etherspot"
      title: "disableSessionKey wrong wallet context"
      impact: critical
      description: "disableSessionKey() checked sessionData[_sessionKey][msg.sender] for SESSION_KEY_DISABLER callers, which was always zero, bypassing claim validation entirely."
      solodit_count: 1
      key_finding_ids: ["133"]

    - protocol: "Etherspot (mitigation review)"
      title: "Session key consumed by unauthorized SCW"
      impact: high
      description: "After initial fix, validateUserOp still did not verify recovered signer's session key belonged to the calling wallet (op.sender)."
      solodit_count: 1
      key_finding_ids: ["136"]

# ============================================================
# access-029: Buggy data structure breaks role revocation
# ============================================================

- pattern_id: access-029
  incidents:
    - protocol: "Astrolab"
      title: "AsSequentialSet.remove() does not reset index mapping"
      impact: high
      description: "Custom set library used for AccessControl role tracking. remove() performed swap-and-pop on the values array but never reset the index mapping for the removed account. hasRole() returned true for revoked accounts permanently."
      solodit_count: 1
      key_finding_ids: ["182"]
      fix: "Reset index mapping entry to 0 in remove() function"

# ============================================================
# access-030: Deployment script ownership not transferred
# ============================================================

- pattern_id: access-030
  incidents:
    - protocol: "HypurrFi"
      title: "DeployCapAutomator leaves deployer as owner"
      impact: high
      description: "Forge deployment script created CapAutomator with Ownable(msg.sender) but never called transferOwnership(admin). Deployer EOA retained permanent control."
      solodit_count: 1
      key_finding_ids: ["257"]

    - protocol: "HypurrFi"
      title: "_deployUsdxl leaves deployer as token owner"
      impact: high
      description: "USDXL token proxy initialized with deployer as owner. Script deployed multiple contracts but missed transferOwnership for usdxlToken to admin."
      solodit_count: 1
      key_finding_ids: ["258"]

# ============================================================
# access-031: Governance cancel state desync
# ============================================================

- pattern_id: access-031
  incidents:
    - protocol: "RAAC (Cyfrin)"
      title: "Governance.cancel() does not propagate to TimelockController"
      impact: medium
      description: "cancel() marked proposal as Cancelled in governance but did not call timelockController.cancel(). Queued operations remained executable via timelock after delay."
      solodit_count: 1
      key_finding_ids: ["379"]

    - protocol: "RAAC (Cyfrin)"
      title: "Unrestricted proposal cancellation in all states except Executed"
      impact: medium
      description: "cancel() allowed cancelling proposals in Succeeded and Queued states. Combined with the missing timelock propagation, created governance manipulation vector."
      solodit_count: 1
      key_finding_ids: ["371"]

