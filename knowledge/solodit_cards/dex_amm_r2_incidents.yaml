# DEX/AMM Round 2 Incidents from Solodit (834 findings analyzed)
# Supporting incidents for dex-026 through dex-032
# Generated: 2026-03-19

# === dex-026: JIT Liquidity Bypasses Anti-Sandwich Hooks ===

- id: dex-r2-incident-001
  name: "OpenZeppelin AntiSandwichHook JIT bypass"
  protocol: "OpenZeppelin Uniswap Hooks"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "AntiSandwichHook charges extra fee on swaps after price moves, donates to pool. Attacker adds tight JIT liquidity to capture donated fees, profiting from the anti-sandwich mechanism itself."
  vector: "Add concentrated liquidity at current tick before victim swap -> anti-sandwich fee is donated to pool -> attacker's JIT position captures majority of donated fees -> remove liquidity"
  leccion: "Fee donation to in-range LPs creates perverse incentive when the fee is a penalty -- attacker becomes the LP who receives the penalty."
  relacionado_con: [dex-026]
  tags: [uniswap-v4, hooks, jit, anti-sandwich, fee-donation]

- id: dex-r2-incident-002
  name: "OpenZeppelin LiquidityPenaltyHook multi-account bypass"
  protocol: "OpenZeppelin Uniswap Hooks"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "Penalty tracking is per-address. Attacker uses Account1 (tracked, penalized) and Account2 (clean) to split the JIT operation. Donated penalty goes to Account2 as in-range LP."
  vector: "Account1 adds+removes liquidity (gets penalized) -> penalty donated to pool -> Account2 (in-range) captures penalty as LP fee"
  leccion: "Per-address tracking is insufficient for Sybil-resistant penalty mechanisms. Need per-position or global approach."
  relacionado_con: [dex-026]
  tags: [uniswap-v4, hooks, penalty, multi-account, sybil]

- id: dex-r2-incident-003
  name: "Super DCA reward distribution tick manipulation"
  protocol: "Super DCA Liquidity Network"
  firma: "Sherlock"
  severidad: MEDIUM
  causa_raiz: "Rewards accumulated over time distributed via Uniswap donate() to in-range LPs at current tick. Attacker swaps to move tick to their concentrated position, triggers distribution, swaps back."
  vector: "Swap to move tick -> trigger reward distribution via modifyLiquidity -> concentrated position at manipulated tick captures all rewards -> swap back"
  leccion: "Lump-sum reward distribution at a single tick is exploitable. Use time-weighted distribution or distribute across all ticks that were active."
  relacionado_con: [dex-026, dex-014]
  tags: [uniswap-v4, donate, rewards, tick-manipulation]

- id: dex-r2-incident-004
  name: "Burve fee capture on range re-entry"
  protocol: "Burve"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "When Uniswap V3 pool price is out of Burve's range, collected fees cannot be compounded. Attacker deposits into Burve just before market re-enters range, capturing accumulated unclaimed fees."
  vector: "Wait for price to be out of Burve range (fees accumulate) -> deposit just before price re-enters range -> trigger fee collection and redistribution -> withdraw with captured fees"
  leccion: "Accumulated undistributed fees create a JIT opportunity at the moment of range re-entry."
  relacionado_con: [dex-026, dex-014]
  tags: [concentrated-liquidity, fee-capture, range-reentry, timing]

# === dex-027: Bonding Curve Escrow Poisoning ===

- id: dex-r2-incident-005
  name: "Pump.fun bonding curve escrow pre-funding DoS"
  protocol: "Pump.fun (Solana)"
  firma: "Independent audit"
  severidad: HIGH
  causa_raiz: "sol_escrow PDA is deterministic. Invariant uses == check between escrow balance and real_sol_reserves. Attacker sends SOL to escrow before curve creation, breaking invariant permanently."
  vector: "Compute PDA for target mint -> send SOL to escrow -> create_bonding_curve fails because balance != 0 when reserves == 0"
  leccion: "Never use strict equality (==) for balance vs tracked reserves. Deterministic addresses can always receive unsolicited transfers."
  relacionado_con: [dex-027]
  tags: [bonding-curve, solana, pda, dos, escrow, invariant]

- id: dex-r2-incident-006
  name: "DaosLive predictable token address pool exploit"
  protocol: "DaosLive"
  firma: "Shieldify"
  severidad: HIGH
  causa_raiz: "DaosToken deployed via CREATE opcode in finalize(). Address predictable from (sender, nonce). Attacker pre-creates Uniswap V3 pool at manipulated price before official launch."
  vector: "Precompute token address -> create Uniswap pool with manipulated initial price -> when finalize() adds liquidity, it goes to attacker-controlled pool at wrong price -> arbitrage"
  leccion: "Token deployment via CREATE is deterministic. Use CREATE2 with secret salt or verify pool creator in finalize."
  relacionado_con: [dex-027]
  tags: [bonding-curve, create-opcode, deterministic-address, frontrun, pool-creation]

- id: dex-r2-incident-007
  name: "GroupcoinFactory premature Uniswap launch"
  protocol: "GroupcoinFactory"
  firma: "Trail of Bits"
  severidad: HIGH
  causa_raiz: "Two-step launch: enableUniswapV3Launch sets commitLaunch[tokenId], then launchGroupCoinToUniswapV3 checks block.number <= commitLaunch. But default commitLaunch is 0, and 0 <= block.number passes for any block."
  vector: "Skip enableUniswapV3Launch -> call launchGroupCoinToUniswapV3 directly (passes check because 0 <= block.number) -> drain ETH from bonding curve at arbitrary price"
  leccion: "Default-zero values in commit-reveal patterns must be explicitly handled. Check for non-zero commit, not just timing."
  relacionado_con: [dex-027, dex-030]
  tags: [bonding-curve, graduation, commit-reveal, default-value, logic-error]

# === dex-028: LP Token Transfer Resets Tracking ===

- id: dex-r2-incident-008
  name: "QuantAMM uplift fee evasion via LP transfer"
  protocol: "QuantAMM"
  firma: "Cyfrin"
  severidad: HIGH
  causa_raiz: "Uplift fee calculated as f(currentValue - depositValue). On LP NFT transfer, depositValue resets to currentValue for new owner. Attacker transfers LP to fresh address, withdraws with zero uplift fee."
  vector: "Deposit at value V0 -> pool grows to V1 -> transfer LP NFT to Account2 -> Account2.depositValue = V1 -> withdraw with uplift = 0"
  leccion: "LP metadata (deposit value, timestamp) must follow the token on transfer. Override _beforeTokenTransfer."
  relacionado_con: [dex-028]
  tags: [lp-token, transfer, fee-evasion, deposit-value, nft]

- id: dex-r2-incident-009
  name: "Pendulum backstop pool cool-off bypass"
  protocol: "Pendulum Backstop Pool"
  firma: "Independent audit"
  severidad: HIGH
  causa_raiz: "Swap pool deposits have N-block cool-off before backstop withdrawal. Cool-off tracked by depositor address. LP token transfer to new address bypasses tracking."
  vector: "Deposit to swap pool -> receive LP tokens -> transfer LP to Account2 (no cool-off record) -> Account2 immediately withdraws via backstop"
  leccion: "Cool-off/lock mechanisms must be attached to the token, not the address. Make LP non-transferable during lock or carry lock metadata."
  relacionado_con: [dex-028]
  tags: [lp-token, transfer, cooloff-bypass, backstop, lock]

# === dex-029: Self-Sandwich Fee Recapture ===

- id: dex-r2-incident-010
  name: "Velar Artha self-sandwich position close"
  protocol: "Velar Artha"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "Borrowing fees accumulate in position, distributed to LPs pro-rata at close time (not time-weighted). Attacker flash-loans, adds liquidity (90% of pool), closes own position, captures 90% of own fees."
  vector: "Flash loan -> add liquidity (dominate pool) -> close fee-bearing position -> fees distributed to LPs (mostly attacker) -> remove liquidity -> repay flash loan"
  leccion: "Lump-sum fee distribution proportional to current LP share is always exploitable via flash liquidity."
  relacionado_con: [dex-029, dex-014]
  tags: [perpetual-dex, self-sandwich, flash-loan, fee-distribution, borrowing-fees]

- id: dex-r2-incident-011
  name: "TermMax Market swap fee theft"
  protocol: "TermMax Market"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "Swap fees distributed to LPs at time of swap, proportional to current liquidity share. Attacker adds large liquidity before swap, captures fees, removes immediately."
  vector: "Add massive liquidity -> perform swap (or wait for organic swap) -> collect disproportionate fee share -> remove liquidity"
  leccion: "Same as dex-014 (reward frontrun) but applied to per-swap fee distribution."
  relacionado_con: [dex-029, dex-014]
  tags: [amm, swap-fees, flash-liquidity, fee-theft]

# === dex-030: Bonding Curve Graduation Race Conditions ===

- id: dex-r2-incident-012
  name: "LiquidityFreeLaunch finalization failure"
  protocol: "LiquidityFreeLaunch"
  firma: "Independent audit"
  severidad: HIGH
  causa_raiz: "In _sendToDex(): (1) get pair, (2) add liquidity, (3) set isFinalized=true. But adding liquidity triggers a callback that checks isFinalized, which is still false. Permanent DoS."
  vector: "Contract can never finalize because order of operations creates circular dependency between liquidity addition and isFinalized flag"
  leccion: "Set state flags BEFORE external calls (CEI pattern). Order of operations in graduation must account for callbacks."
  relacionado_con: [dex-030]
  tags: [bonding-curve, graduation, order-of-operations, dos, callback]

- id: dex-r2-incident-013
  name: "NewMoon graduation slippage gap"
  protocol: "NewMoon (Kaspa)"
  firma: "Independent audit"
  severidad: MEDIUM
  causa_raiz: "During bonding curve graduation to DEX, slippage is checked on bonding curve side but NOT on the DEX liquidity provision side. Graduation tx is sandwichable at the DEX layer."
  vector: "Monitor for graduation tx -> front-run with swap on DEX side to manipulate price -> graduation adds liquidity at manipulated price -> back-run to capture spread"
  leccion: "Graduation involves TWO venues (bonding curve + DEX). Both need slippage protection."
  relacionado_con: [dex-030]
  tags: [bonding-curve, graduation, slippage, sandwich, two-venue]

# === dex-031: Internal Balance Drain ===

- id: dex-r2-incident-014
  name: "Beanstalk CurveFacet internal balance drain"
  protocol: "Beanstalk"
  firma: "Cyfrin"
  severidad: HIGH
  causa_raiz: "CurveFacet.exchangeUnderlying() with toMode=EXTERNAL sends output to msg.sender via Curve's recipient param. But with toMode=INTERNAL, it should receive to contract first. Mismatch allows draining internal balances."
  vector: "Call exchangeUnderlying with fromMode=INTERNAL -> uses another user's internal balance tokens -> output sent to attacker's address"
  leccion: "Internal balance mode MUST route swap output through the contract, not directly to caller. Validate from/to modes against recipient parameter."
  relacionado_con: [dex-031]
  tags: [internal-balance, diamond, curve, facet, recipient, drain]

# === dex-032: Slippage Check Sign Inversion ===

- id: dex-r2-incident-015
  name: "Uniswap V4 periphery slippage bypass on fee-rich positions"
  protocol: "Uniswap V4 Periphery"
  firma: "Spearbit / OpenZeppelin"
  severidad: HIGH
  causa_raiz: "validateMaxInNegative only checks when balanceDelta is negative (user pays). When accrued fees > position cost, net delta is positive (user receives), and slippage check is entirely skipped."
  vector: "Accumulate large fees on V4 position -> front-run increaseLiquidity to inflate cost -> fees mask the cost (net delta positive) -> slippage check skipped -> user overpays"
  leccion: "Position cost and fee collection must be checked independently. Net delta hiding costs is a new V4-specific attack surface."
  relacionado_con: [dex-032]
  tags: [uniswap-v4, slippage, balance-delta, fees, sign-inversion]

# === Cross-pattern incidents (maps to multiple new + existing patterns) ===

- id: dex-r2-incident-016
  name: "Dango DEX geometric pool swap splitting"
  protocol: "Dango DEX"
  firma: "Sherlock"
  severidad: HIGH
  causa_raiz: "Geometric pool passive order matching gives better prices to smaller swaps. Users split one large swap into many small swaps to get best-price matching on each, extracting value from passive LPs."
  vector: "Split 1000 token swap into 100x 10 token swaps -> each matches at best passive order price -> total output significantly exceeds single-swap output"
  leccion: "AMM pricing functions must be monotonic and convex. If splitting a swap improves outcome, the pricing function is broken."
  relacionado_con: [dex-001]
  tags: [amm, geometric-pool, swap-splitting, pricing-function, passive-orders]

- id: dex-r2-incident-017
  name: "Dango DEX XYK reflect_curve decreasing K"
  protocol: "Dango DEX"
  firma: "Sherlock"
  severidad: MEDIUM
  causa_raiz: "XYK reflect_curve algorithm generates passive orders at prices more favorable to takers than the actual AMM curve would give. This causes K to decrease over time, leaking value from LPs."
  vector: "Repeated swaps against passive orders generated by reflect_curve -> each swap decreases K slightly -> cumulative LP value loss"
  leccion: "Custom AMM curve implementations that generate limit orders must preserve the constant-product invariant. Passive order prices must be at or worse than the true curve price."
  relacionado_con: [dex-001]
  tags: [amm, xyk, reflect-curve, invariant-violation, passive-orders]

- id: dex-r2-incident-018
  name: "Sorella Angstrom tick boundary reward theft"
  protocol: "Sorella L2 Angstrom"
  firma: "Cyfrin"
  severidad: HIGH
  causa_raiz: "When current tick is exact multiple of tick spacing at upper bound, tick iterator skips the boundary tick's liquidity delta. Rewards distributed to wrong liquidity amount, enabling complete reward theft."
  vector: "Position at tick boundary where current tick == upper tick -> zero-for-one swap -> tick crossing logic skips boundary -> incorrect liquidity used for reward distribution -> overlapping position captures all rewards"
  leccion: "Tick boundary off-by-one errors are the #1 concentrated liquidity bug. Custom tick iterators must be fuzz-tested at exact tick spacing multiples."
  relacionado_con: [dex-006]
  tags: [concentrated-liquidity, tick-boundary, reward-theft, off-by-one, angstrom]
