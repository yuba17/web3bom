# Flash Loan Existing Pattern Incidents — New Solodit findings mapped to flash-001 through flash-006
# Source: 20 Solodit flash loan findings
# Date: 2026-03-19

flash-001_new_incidents:
  pattern: flash-loan-oracle-manipulation
  description: "New Solodit findings that map to flash-001 (price oracle manipulation via flash loan)"
  findings:
    - id: 1363
      title: "Flash loan price manipulation in purchasePyroFlan()"
      protocol: "Behodler (FlanBackstop)"
      impact: HIGH
      root_cause: >
        purchasePyroFlan() reads flan-stablecoin LP price from AMM spot reserves.
        acceptableHighestPrice variable limits max deviation but a flash loan sandwich
        attack can still profit within that limit using large volumes or multiple passes.
      notes: "Protocol acknowledged the risk in code comments but deemed the mitigation sufficient — it was not."
      grep_target: "acceptableHighestPrice, purchasePyroFlan"

    - id: 490
      title: "Synth realise vulnerable to flash loan attacks"
      protocol: "Spartan Protocol"
      impact: HIGH
      root_cause: >
        Synth realise() calculates baseValueLP and baseValueSynth from AMM spot price.
        Attacker shifts AMM ratio via flash loan, calls realise() to extract value,
        then reverses the shift. Big whales can also do this without flash loans by
        shifting ratio back and forth.
      grep_target: "realise, baseValueLP, baseValueSynth, calcLiquidityUnits"

    - id: 1276
      title: "Vaults with non-UST underlying asset vulnerable to flash loan attack on curve pool"
      protocol: "Anchor / NonUSTStrategy"
      impact: HIGH
      root_cause: >
        NonUSTStrategy reads DAI/UST exchange rate from Curve pool spot state.
        Flash loan DAI, swap to UST to move rate, deposit/withdraw from vault
        at favorable rate, swap back, repay.
      grep_target: "NonUSTStrategy, exchange_rate, curve_pool"

    - id: 1365
      title: "LP pricing formula vulnerable to flashloan manipulation"
      protocol: "Limbo / LimboDAO"
      impact: HIGH
      root_cause: >
        burnAsset() in LimboDAO prices LP tokens using reserve-based formula.
        Flash loan swaps inflate EYE reserves, making LP tokens appear more valuable.
        Attacker burns LP for inflated fate (voting power), converts to Flan tokens.
      grep_target: "burnAsset, fate, EYE.*reserve"

    - id: 63607
      title: "Oracles vulnerable to flash loan attack vectors"
      protocol: "Morpho Blue oracle integration"
      impact: MEDIUM
      root_cause: >
        Oracles fetch current LP token price from Curve pool via get_virtual_price()
        and spot reserve calculations. No TWAP. Flash loan imbalances pool,
        oracle returns incorrect LP price, enabling unfair liquidations.
      grep_target: "get_virtual_price, priceLpInPeg, CURVE_POOL"

    - id: 31886
      title: "Pool can be drained (WooFi sPMM repeat exploit)"
      protocol: "WooFi Swap"
      impact: HIGH
      root_cause: >
        sPMM pricing model allows flash-loan-funded sequential sells to crash
        internal price, then buy back at extreme discount. maxNotionalSwap and
        maxGamma caps insufficient — attacker splits into multiple sub-cap trades.
        Same vector as the original WooFi exploit ($8.5M, March 2024).
      notes: "This is a REPEAT of a real-world exploit. Protocol had attempted mitigation but it was insufficient."
      grep_target: "maxNotionalSwap, maxGamma, sPMM, sellBase, sellQuote"

flash-002_new_incidents:
  pattern: flash-loan-governance-vote
  description: "New Solodit findings that map to flash-002 (governance voting manipulation via flash loan)"
  findings:
    - id: 3302
      title: "PartyGovernance: vote multiple times by transferring NFT in same block as proposal"
      protocol: "PartyDAO"
      impact: HIGH
      root_cause: >
        Voting power snapshot taken at proposal creation block. Attacker votes,
        transfers NFT to second wallet in same block, votes again. Repeatable
        for arbitrary voting power. Any user can pass any proposal unanimously.
      notes: "Also maps to flash-007 (same-block checkpoint bypass). NFT-based voting creates unique transfer-and-revote vector."
      grep_target: "accept, getVotingPowerAt, transferFrom.*governanceNFT"

    - id: 27294
      title: "Flashloan + delegated voting to decide proposal and withdraw while Locked"
      protocol: "DeXe (GovPool)"
      impact: HIGH
      root_cause: >
        Attacker flash loans governance tokens, delegates to accomplice who votes,
        then withdraws tokens while proposal is still in Locked state. Combines
        flash loan with delegation to bypass anti-flash-loan mitigations (which
        only check direct voter balance, not delegated balance).
      notes: "Sophisticated bypass: protocol had flash loan protection but delegation was the escape hatch."
      grep_target: "delegate, flashloan, votingPower, Locked"

flash-003_new_incidents:
  pattern: flash-loan-pool-manipulation
  description: "New Solodit findings that map to flash-003 (liquidity pool reserve manipulation)"
  findings:
    - id: 3309
      title: "Attacker lists own NFT, inflates contributions to zero, keeps NFT and money"
      protocol: "PartyDAO (BuyCrowdfund)"
      impact: MEDIUM
      root_cause: >
        Crowdfund contribution accounting allows attacker to list own NFT, contribute
        flash-loaned funds to dominate contribution share, execute purchase (funds return
        to attacker as seller), and claim majority voting power/equity for free.
        Pool share manipulation via flash-loan-funded self-dealing.
      grep_target: "BuyCrowdfundBase, contribute, maximumPrice, totalContributions"

flash-004_new_incidents:
  pattern: flash-loan-fee-avoidance
  description: "New Solodit findings that map to flash-004 (fee avoidance/manipulation)"
  findings:
    - id: 5713
      title: "Flashloan fee collection mechanism easily manipulated (LBPair)"
      protocol: "TraderJoe (Liquidity Book)"
      impact: MEDIUM
      root_cause: >
        Flash loan fees paid exclusively to active bin LPs while liquidity from
        ALL bins is lent. JIT liquidity added to active bin just before flash loan
        captures most fees. Borrower can self-provide active bin liquidity to
        effectively self-refund the fee.
      notes: "Also maps to flash-010 (reward share dilution). Fee structure incentivizes manipulation."
      grep_target: "LBPair, flashLoan, _bins, activeId, accTokenX, accTokenY"
