# New incidents for existing bridge patterns (bridge-001 through bridge-009)
# Derived from 50 Solodit findings not already listed in bridge.md
# Generated: 2026-03-19

# === bridge-001: Message Replay ===
- maps_to: bridge-001
  incidents:
    - protocol: "Harpie"
      firm: "Sherlock"
      impact: "MEDIUM"
      title: "Cross-chain replay attacks possible with changeRecipientAddress - missing chain.id"
      detail: >
        changeRecipientAddress signature lacks chain.id in hash preimage. If user
        signs on wrong network, attacker replays on correct chain. Attacker creates
        same address on target chain (Wintermute-style) and steals funds from vault.
      slug: "m-2-cross-chain-replay-attacks-are-possible-with-changerecipientaddress-sherlock-harpie-harpie-git"

    - protocol: "Stakehouse Protocol"
      firm: "Code4rena"
      impact: "MEDIUM"
      title: "Cross-chain replay attacks possible with deployLPToken - missing chain.id"
      detail: >
        LPTokenFactory.deployLPToken uses Clones.clone with no chain.id validation.
        If deployed on wrong network, attacker replays on correct chain and steals LP funds
        via Wintermute gnosis safe attack pattern.
      slug: "m-14-cross-chain-replay-attacks-are-possible-with-deploylptoken-code4rena-stakehouse-protocol-lsd-network-stakehouse-contest-git"

    - protocol: "Tenbin"
      firm: "Spearbit"
      impact: "HIGH"
      title: "Redeem nonce mis-tracked enables endless replay of delegated signatures"
      detail: >
        Redeem validates _verifyNonce(order.payer, order.nonce) but records usage as
        nonces[signer][order.nonce]=true. When payer != signer (delegated), payer nonce
        never consumed. Same redeem signature replayed endlessly draining collateral.
      slug: "redeem-nonce-mis-tracked-enables-replay-spearbit-none-tenbin-pdf"

    - protocol: "Barter DAO"
      firm: "MixBytes"
      impact: "HIGH"
      title: "Replay attack via balance-based nonce - orders re-executable when balance recovers"
      detail: >
        Protocol uses user token balance as nonce (currentMakerBalance >= order.nonceBalance).
        Once balance increases again from any source, same order re-executable within deadline.
        Should use monotonic nonce (OpenZeppelin Nonces).
      slug: "replay-attack-via-balance-based-nonce-mixbytes-none-barter-dao-markdown"

# === bridge-002: Message Forgery ===
- maps_to: bridge-002
  incidents:
    - protocol: "Derby"
      firm: "Sherlock"
      impact: "HIGH"
      title: "Cross-chain message auth bypass - XProvider onlySource checks zero address"
      detail: >
        onlySource modifier checks _originSender == trustedRemoteConnext[_origin] but
        doesn't verify trustedRemoteConnext[_origin] != address(0). Connext slow path
        delivers _originSender=address(0) for unset origins. Attacker calls any XProvider
        function to disrupt vault state on all networks.
      slug: "h-6-cross-chain-message-authentication-can-be-bypassed-allowing-an-attacker-to-disrupt-the-state-of-vaults-sherlock-derby-derby-git"

    - protocol: "Connext"
      firm: "Spearbit"
      impact: "MEDIUM"
      title: "GnosisBase _verifySender missing source chain ID check enables message spoofing"
      detail: >
        _verifySender checks msg.sender==_amb and messageSender()==_expected but not
        messageSourceChainId()==MIRROR_DOMAIN. If same mirrorConnector address exists
        on future supported chain, attacker spoofs roots from wrong chain.
      slug: "extra-checks-in-_verifysender-ofgnosisbase-spearbit-connext-pdf"

# === bridge-004: Lock-Mint Race / Cross-Chain State Sync ===
- maps_to: bridge-004
  incidents:
    - protocol: "Tigris Trade"
      firm: "Code4rena"
      impact: "MEDIUM"
      title: "Failed LZ endpoint creates duplicate NFT across chains"
      detail: >
        GovNFT.crossChain burns NFT on source, LZ endpoint calls lzReceive with low gas
        on destination causing failure. Failed message stored but NFT also mintable on
        source by the original owner who calls retryMessage. Result: same tokenId NFT
        exists on two chains simultaneously.
      slug: "m-05-failure-in-endpoint-can-cause-minting-more-than-one-nft-with-the-same-token-id-in-different-chains-code4rena-tigris-trade-tigris-trade-contest-git"

# === bridge-006: Failed Message Recovery ===
- maps_to: bridge-006
  incidents:
    - protocol: "Toki Bridge"
      firm: "Shieldify"
      impact: "MEDIUM"
      title: "Retry payload channel collision - older failure permanently unreplayable"
      detail: >
        revertReceive[chainId][sequence] collapses all IBC channels sharing same
        counterpartyChainId into one storage slot. Two channels with same sequence
        number overwrite each other; older user permanently unable to retry their packet
        even though source pool already debited their funds.
      slug: "m-04-retry-payload-channel-collision-shieldify-none-toki-bridge-markdown"

    - protocol: "Recall"
      firm: "Code4rena"
      impact: "MEDIUM"
      title: "Refunds to EOAs on failed cross-chain messages fail - funds stuck in gateway"
      detail: >
        IPC bridge sends receipt on Transfer message failure, but refund mechanism
        calls performCall on EOA which fails. No alternative refund path exists.
        EOA users' funds permanently trapped in gateway contract.
      slug: "m-02-refunds-to-eoas-on-unsuccessful-cross-chain-messages-fail-leaving-users-funds-stuck-in-the-gateway-code4rena-recall-recall-git"

# === bridge-008: Finality Assumption / L2 Specifics ===
- maps_to: bridge-008
  incidents:
    - protocol: "Uniswap"
      firm: "Cantina"
      impact: "MEDIUM"
      title: "Incorrect use of L1 block.number on Arbitrum - orders decay incorrectly"
      detail: >
        NonlinearDutchDecayLib uses block.number which returns approximate L1 block number
        on Arbitrum (12s blocks) instead of L2 block number (0.25s blocks). Orders that
        should decay in seconds instead take minutes. Use ArbSys(100).arbBlockNumber().
      slug: "incorrect-use-of-l1-blocknumber-on-arbitrum-cantina-none-uniswap-pdf"

    - protocol: "Renzo"
      firm: "Code4rena"
      impact: "MEDIUM"
      title: "L1 block.timestamp invalid on L2 - valid price updates rejected"
      detail: >
        xRenzoBridge encodes L1 block.timestamp and compares against L2 block.timestamp.
        Arbitrum timestamps can be up to 24h earlier than real time. Valid price updates
        rejected as future timestamps, breaking cross-chain oracle.
      slug: "m-06-l1xrenzobridge-and-l2xrenzobridge-uses-the-blocktimestamp-as-dependency-which-can-cause-issues-code4rena-renzo-renzo-git"

    - protocol: "Optimism"
      firm: "Sherlock"
      impact: "MEDIUM"
      title: "Censorship resistance undermined - L1->L2 deposits DOSable at low cost"
      detail: >
        ResourceMetering.prevBoughtGas resets per block. Attacker fills MAX_RESOURCE_LIMIT
        (8M gas) in same block as victim's deposit, causing victim tx to revert. Cost
        is low (~$10 on mainnet) and repeatable every block.
      slug: "m-2-censorship-resistance-is-undermined-and-bridging-of-assets-can-be-dosed-at-low-cost-sherlock-optimism-optimism-git"

    - protocol: "Optimism"
      firm: "Sherlock"
      impact: "MEDIUM"
      title: "Gasless ETH bridging from L1 to L2 bypasses resource metering"
      detail: >
        depositTransaction allows gasLimit=0; zero-gas deposits bypass prevBoughtGas
        accumulation and MAX_RESOURCE_LIMIT check. Execution fails on L2 but ETH is
        minted. Can be used to bridge ETH cheaply (no L2 gas cost) or grief resource metering.
      slug: "m-11-gasless-eth-bridging-from-l1-to-l2-sherlock-optimism-optimism-git"
