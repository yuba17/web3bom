# Round 2 staking incidents from 995 NEW Solodit findings
# Incidents supporting patterns staking-024 through staking-031

# === staking-024: Reward claim tracking not keyed by token ===

- id: staking-incident-r2-001
  name: "Suzaku Core multi-token claim epoch lock"
  fecha: "2025"
  protocol: "Suzaku Core"
  firma: "Cyfrin"
  impacto: "HIGH"
  causa_raiz: "lastEpochClaimedStaker/Curator/Operator mappings not keyed by reward token"
  vector: "Claiming rewards for one token updates epoch tracker for all tokens, permanently blocking unclaimed tokens for past epochs"
  leccion: "Multi-token reward systems must track claim progress independently per token. A single epoch cursor blocks cross-token claims when distribution schedules differ."
  verificado: true
  relacionado_con: [staking-024]
  tags: [multi-token, epoch, claim-tracking, permanent-loss]

- id: staking-incident-r2-002
  name: "Suzaku Core division by zero from stale asset class list"
  fecha: "2025"
  protocol: "Suzaku Core"
  firma: "Cyfrin"
  impacto: "HIGH"
  causa_raiz: "Rewards._calculateOperatorShare fetches current asset classes but calculates for historical epoch"
  vector: "Adding new asset class causes division by zero for past epochs (zero totalStake), permanently locking epoch rewards"
  leccion: "Historical reward calculations must use the asset class list that was active during that epoch, not the current list."
  verificado: true
  relacionado_con: [staking-024, staking-013]
  tags: [division-by-zero, asset-class, historical-epoch, DoS]

# === staking-025: Future epoch cache manipulation ===

- id: staking-incident-r2-003
  name: "Suzaku Core future epoch cache lock-in"
  fecha: "2025"
  protocol: "Suzaku Core"
  firma: "Cyfrin"
  impacto: "HIGH"
  causa_raiz: "calcAndCacheStakes has no epoch validation, allows caching future epoch stakes"
  vector: "Attacker caches high stake value for future epoch, reduces stake before epoch arrives, receives inflated reward share"
  leccion: "Permissionless cache functions must validate epoch is not in the future. Immutable cache flags create permanent manipulation windows."
  verificado: true
  relacionado_con: [staking-025]
  tags: [future-epoch, cache, stake-manipulation, restaking]

- id: staking-incident-r2-004
  name: "Suzaku Core unconfirmed P-Chain stake in rewards"
  fecha: "2025"
  protocol: "Suzaku Core"
  firma: "Cyfrin"
  impacto: "HIGH"
  causa_raiz: "Middleware updates stake cache immediately on initializeValidatorStakeUpdate before P-Chain confirmation"
  vector: "Operator increases stake, gets rewards based on unconfirmed increase, stake change may later fail on P-Chain"
  leccion: "Cross-chain staking must not include unconfirmed stake changes in reward calculations. Cache should only include P-Chain-confirmed values."
  verificado: true
  relacionado_con: [staking-025]
  tags: [cross-chain, P-Chain, unconfirmed-stake, reward-manipulation]

# === staking-026: Gauge kill destroys rewards ===

- id: staking-incident-r2-005
  name: "KittenSwap gauge kill reward loss"
  fecha: "2025"
  protocol: "KittenSwap"
  firma: "Pashov Audit Group"
  impacto: "HIGH"
  causa_raiz: "killGauge zeroes claimable without calling updateGauge or _claimFees first"
  vector: "Emergency council kills gauge, all accumulated KITTEN rewards permanently lost, totalWeight not adjusted causing dilution for remaining gauges"
  leccion: "Always settle pending rewards before deactivating a gauge. Transfer claimable to reserve rather than zeroing. Adjust totalWeight on kill."
  verificado: true
  relacionado_con: [staking-026]
  tags: [gauge-kill, reward-loss, ve-DEX, totalWeight]

- id: staking-incident-r2-006
  name: "KittenSwap CLGauge rewards sent to self"
  fecha: "2025"
  protocol: "KittenSwap"
  firma: "Pashov Audit Group"
  impacto: "CRITICAL"
  causa_raiz: "_getReward uses nfp.ownerOf(tokenId) as recipient, but NFP is owned by gauge after deposit"
  vector: "Staker deposits NFP into CLGauge transferring ownership, _getReward sends KITTEN to gauge contract (self), 100% rewards permanently trapped"
  leccion: "When staking contracts take NFT custody, reward functions must store and use the original depositor address, not ownerOf."
  verificado: true
  relacionado_con: [staking-031]
  tags: [custody-transfer, ownerOf, wrong-recipient, NFT, permanent-loss]

# === staking-027: Reward dust griefing ===

- id: staking-incident-r2-007
  name: "DefiApp MFDLogic dust reward stream reset"
  fecha: "2025"
  protocol: "DefiApp"
  firma: "Cantina"
  impacto: "MEDIUM"
  causa_raiz: "trackUnseenReward detects any balanceOf delta and recalculates rewardPerSecond with full rewardStreamTime"
  vector: "Attacker sends 1 wei of reward token, triggers trackUnseenReward on next claimRewards, resets entire leftover reward distribution over fresh duration"
  leccion: "balanceOf-based reward detection without minimum thresholds enables cheap griefing. Use explicit notifyRewardAmount with access control."
  verificado: true
  relacionado_con: [staking-027, staking-003]
  tags: [dust, balanceOf, reward-stream, griefing]

- id: staking-incident-r2-008
  name: "Kwenta USDC precision reward zeroing"
  fecha: "2024"
  protocol: "Kwenta Staking Rewards"
  firma: "Sherlock"
  impacto: "MEDIUM"
  causa_raiz: "Same rewardPerToken calculation used for 6-decimal USDC as 18-decimal KWENTA"
  vector: "With 100K+ KWENTA staked, rewardPerToken increment for USDC rounds to zero on each update. Attacker triggers frequent updates via stake/unstake, all 10K weekly USDC rewards lost"
  leccion: "Low-decimal reward tokens need higher precision scaling. Frequent updateReward calls with low-decimal tokens cause silent rounding to zero."
  verificado: true
  relacionado_con: [staking-027, staking-001]
  tags: [precision, USDC, low-decimal, rounding-to-zero]

# === staking-028: Stake-on-behalf hijacks state ===

- id: staking-incident-r2-009
  name: "Virtuals Protocol 1-wei delegation hijack"
  fecha: "2025"
  protocol: "Virtuals Protocol"
  firma: "Code4rena"
  impacto: "HIGH"
  causa_raiz: "AgentVeToken.stake(amount, receiver, delegatee) calls _delegate(receiver, delegatee) regardless of caller"
  vector: "Attacker stakes 1 wei LP for victim, sets self as delegatee, hijacks victim's entire veToken voting power. Repeat across large holders for governance takeover."
  leccion: "Delegation changes must require consent from the delegator (receiver). Never allow third-party override of delegation via permissionless stake-on-behalf."
  verificado: true
  relacionado_con: [staking-028, staking-020]
  tags: [delegation-hijack, 1-wei, voting-power, governance]

- id: staking-incident-r2-010
  name: "DefiApp userLocks array flooding via stake-on-behalf"
  fecha: "2025"
  protocol: "DefiApp"
  firma: "Cantina"
  impacto: "HIGH"
  causa_raiz: "MFDBase.stake() allows staking on behalf of any user, pushes StakedLock into unbounded array"
  vector: "Attacker calls stake(dust, victim) thousands of times, victim's userLocks array grows to cause OOG on any withdrawal attempt"
  leccion: "Stake-on-behalf must be opt-in or have per-user array bounds. Withdrawal loops over unbounded arrays are DoS-vulnerable."
  verificado: true
  relacionado_con: [staking-028, staking-022]
  tags: [array-flooding, OOG, stake-on-behalf, DoS]

# === staking-029: Reward accumulator uninitialized ===

- id: staking-incident-r2-011
  name: "DIA Staking uninitialized rewardAccumulator"
  fecha: "2025"
  protocol: "DIA Staking"
  firma: "MixBytes"
  impacto: "CRITICAL"
  causa_raiz: "rewardAccumulator not set on new stake creation in _internalStakeForAddress"
  vector: "New staker claims stakerDelta = globalRewardAccumulator - 0 = all historical rewards. Repeatable with new addresses to drain contract."
  leccion: "Every new stake MUST initialize per-user accumulator to the current global value. The earned = global - user formula requires user to start at global."
  verificado: true
  relacionado_con: [staking-029, staking-001]
  tags: [accumulator, initialization, drain, historical-rewards]

- id: staking-incident-r2-012
  name: "NodeOps lastStakedEpoch not set for new stakers"
  fecha: "2025"
  protocol: "NodeOps Smart Contracts"
  firma: "Halborn"
  impacto: "HIGH"
  causa_raiz: "_updateRewards only called if staker.lastStakedEpoch > 0, but new stakers have 0"
  vector: "New staker claims rewards from epoch 0 to current epoch regardless of actual stake time. Multiple additional bugs: double-counting in _updateRewards, unlimited claims because lastStakedEpoch not updated on claim."
  leccion: "Conditional reward updates (if lastStakedEpoch > 0) skip initialization for new stakers. All staking epoch trackers must be set unconditionally."
  verificado: true
  relacionado_con: [staking-029, staking-004]
  tags: [lastStakedEpoch, initialization, unlimited-claims, epoch-0]

- id: staking-incident-r2-013
  name: "DIA inflation attack on external staking pool"
  fecha: "2025"
  protocol: "DIA Staking"
  firma: "MixBytes"
  impacto: "CRITICAL"
  causa_raiz: "Permissionless addRewardToPool plus share-based accounting with 1-share manipulation"
  vector: "Attacker stakes minimum, unstakes to 1 share, front-runs victim with addRewardToPool donation. Victim receives 0 shares, attacker drains victim deposit."
  leccion: "Classic first-depositor inflation attack applied to staking pools. Restrict addRewardToPool and require non-zero minimum shares minted."
  verificado: true
  relacionado_con: [staking-029, staking-003]
  tags: [inflation-attack, first-depositor, share-manipulation, front-run]

# === staking-030: Two-step unstake missing state ===

- id: staking-incident-r2-014
  name: "Mystic Finance validator unstake path fund loss"
  fecha: "2025"
  protocol: "Mystic Finance"
  firma: "Kann"
  impacto: "HIGH"
  causa_raiz: "Validator unstake fallback path returns amountUnstaked without saving withdrawalRequests[msg.sender]"
  vector: "User unstakes, insufficient buffer triggers validator unstake path, frxETH tokens burned but no withdrawal request saved. withdraw() finds nothing, permanent fund loss."
  leccion: "Every unstake code path that burns receipt tokens must persist the withdrawal request. Missing state writes in fallback paths cause silent fund loss."
  verificado: true
  relacionado_con: [staking-030]
  tags: [two-step-unstake, fallback-path, fund-loss, state-persistence]

- id: staking-incident-r2-015
  name: "Mystic Finance concurrent unstake DoS"
  fecha: "2025"
  protocol: "Mystic Finance"
  firma: "Kann"
  impacto: "MEDIUM"
  causa_raiz: "currentWithheldETH only decremented on withdraw(), not reserved on unstake()"
  vector: "Alice and Bob both see 10 ETH available and both call unstake(). Alice withdraws first, Bob's withdraw fails with 0 available. Bob stuck until rebalance."
  leccion: "Two-step unstake must reserve (decrement) the withheld balance on initiation, not just on completion. Race conditions cause overcommitment."
  verificado: true
  relacionado_con: [staking-030]
  tags: [concurrent-unstake, race-condition, DoS, overcommitment]

# === staking-031: Rewards to wrong recipient ===

- id: staking-incident-r2-016
  name: "Tanssi operator key reassignment double-claim"
  fecha: "2025"
  protocol: "Tanssi"
  firma: "Pashov Audit Group"
  impacto: "MEDIUM"
  causa_raiz: "ODefaultOperatorRewards tracks claimed[eraIndex][recipient] but recipient changes when operator key is reassigned"
  vector: "OperatorA claims epoch 5 rewards via key X. Key X reassigned to operatorB. OperatorB claims epoch 5 again (different recipient address, claimed mapping doesn't detect duplicate)."
  leccion: "Track claimed rewards by operator key (bytes32), not by resolved address. Key reassignment changes the resolved address but the underlying entity is the same."
  verificado: true
  relacionado_con: [staking-031]
  tags: [operator-key, reassignment, double-claim, identity]

- id: staking-incident-r2-017
  name: "Suzaku Core boundary condition reward dilution"
  fecha: "2025"
  protocol: "Suzaku Core"
  firma: "Cyfrin"
  impacto: "HIGH"
  causa_raiz: "_wasActiveAt uses >= instead of > for disabledTime comparison"
  vector: "Operator disabled at epochStartTs is still counted as active, their stake included in totalStake denominator but operator receives no rewards. Active operators' shares diluted."
  leccion: "Off-by-one in timestamp comparisons for active status causes silent reward dilution. Use > for disabled time, not >=."
  verificado: true
  relacionado_con: [staking-025]
  tags: [boundary-condition, off-by-one, reward-dilution, timestamp]

- id: staking-incident-r2-018
  name: "Yield Basis flash loan gauge weight manipulation"
  fecha: "2025"
  protocol: "Yield Basis"
  firma: "MixBytes"
  impacto: "HIGH"
  causa_raiz: "GaugeController checkpoint uses LP balanceOf/totalSupply ratio manipulable via same-block deposit/withdraw"
  vector: "Attacker flash-loans assets, deposits into gauge's pool inflating balanceOf/totalSupply ratio, calls checkpoint to lock in inflated weight, withdraws and repays. Earns extra 1.5% of rewards per day waited."
  leccion: "Gauge weight calculations using instantaneous balanceOf are manipulable via flash loans. Use time-weighted averages or prohibit same-block deposit+withdraw."
  verificado: true
  relacionado_con: [staking-002, staking-003]
  tags: [flash-loan, gauge-weight, checkpoint, balanceOf-manipulation]

- id: staking-incident-r2-019
  name: "DIA frequent claim griefing zeroes reward accumulator"
  fecha: "2025"
  protocol: "DIA Staking"
  firma: "MixBytes"
  impacto: "HIGH"
  causa_raiz: "claim() updates rewardAccumulator using daysElapsed which rounds to 0 for sub-day intervals"
  vector: "Attacker stakes minimum and calls claim() every few minutes. daysElapsed = 0 means rewardAccumulator unchanged but rewardLastUpdateTime advances. No rewards distributed to anyone."
  leccion: "Time-based reward accumulators using integer day division are griefable via frequent calls. Use higher precision (seconds) or accumulate fractional time."
  verificado: true
  relacionado_con: [staking-027, staking-001]
  tags: [rounding, daysElapsed, griefing, frequent-claims, precision]

- id: staking-incident-r2-020
  name: "DefiApp claimBounty relock accounting mismatch"
  fecha: "2025"
  protocol: "DefiApp"
  firma: "Cantina"
  impacto: "HIGH"
  causa_raiz: "claimBounty relocks expired stakes via stakeLogic but skips _afterStakeHook (gauge deposit)"
  vector: "Relock unstakes from gauge but doesn't re-stake, creating accounting mismatch. User later withdraws and gauge.withdraw underflows, permanently trapping funds."
  leccion: "All paths that modify stake state must maintain gauge accounting symmetry. Relock must call the same hooks as fresh stake."
  verificado: true
  relacionado_con: [staking-011, staking-008]
  tags: [relock, gauge-accounting, hook-mismatch, underflow]
