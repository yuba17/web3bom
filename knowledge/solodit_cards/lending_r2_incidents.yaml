    - "Swap amount calculated from predicted rather than actual balance"
    - "Flash loan fee not subtracted from available amount"
    - "Close fee only applied to one token path"
    - "Share-to-asset conversion uses wrong denominator during deleverage"

lending-031_emode-isolation-config-residual:
