# ============================================================
# INCIDENTS FOR NEW PATTERNS (lending-026 to lending-033)
# Full incidents are listed in the pattern file above.
# This section provides additional context and cross-references.
# ============================================================

lending-026_cross-chain-lending-state-desync:
  total_findings: 8
  severity_distribution:
    critical: 6
    high: 2
  primary_protocol: "LEND (Sherlock contest, 2025)"
  secondary_protocols: ["Autonomint Colored Dollar V1"]
  key_root_causes:
    - "Raw collateral value sent without deducting existing borrows"
    - "Seize amount used instead of repay amount in cross-chain liquidation message"
    - "No decimal normalization between chains"
    - "Debt tracking array index errors after cross-chain repayment"
    - "Liquidator not required to provide tokens on destination chain"

lending-027_stablecoin-depeg-health-assumption:
  total_findings: 3
  severity_distribution:
    high: 1
    medium: 2
  primary_protocol: "USG-Tangent (Sherlock, 2025)"
  secondary_protocols: ["The Standard Smart Vault", "Colbfinance"]
  key_root_causes:
    - "Health factor compares USD-valued collateral against raw token-denominated debt"
    - "No oracle used for debt token (assumed 1:1 with USD)"

lending-028_debt-share-rounding-rebase:
  total_findings: 5
  severity_distribution:
    high: 3
    medium: 2
  primary_protocol: "Bold (Code4rena, 2025)"
  secondary_protocols: ["Sharwafinance", "Meso Lending", "ZeroLend One"]
  key_root_causes:
    - "Truncation in batch debt share update accumulates across rate changes"
    - "No minimum borrow amount enforced for share creation"
    - "Rounding direction inconsistency between borrow and repay"

lending-029_index-overflow-dos-dust-supply:
  total_findings: 5
  severity_distribution:
    high: 3
    medium: 2
  primary_protocol: "Astera / Cod3x Lend (Spearbit, 2025)"
  secondary_protocols: ["Dahlia", "Folks Finance", "Sentiment V2"]
  key_root_causes:
    - "uint104 storage too small for reward index with dust totalSupply"
    - "No minimum totalSupply requirement before enabling reward accrual"
    - "Inconsistent scaling between reward controller and aToken"

lending-030_leverage-unwind-amount-mismatch:
  total_findings: 9
