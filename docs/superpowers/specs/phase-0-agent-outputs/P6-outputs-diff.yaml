---
agent: P6
scope: "outputs diff (run_hunt.py vs run_benchmark.py + plan_generator.py + skill run-benchmark-agent)"
methodology:
  step_1: "Readlines CLAUDE.md sections 3, 5, 16 + SKILL.md run-benchmark-agent"
  step_2: "Grepped paths: open(), Path(), write_text(), mkdir(), yaml.dump, json.dump"
  step_3: "Analyzed actual outputs in hunt_session/ vs benchmarks/<protocol>/bench_session/"
  step_4: "Categorized by output type and ownership"

run_hunt_outputs:
  - path: "hunt_session/context/{protocol}/{Component}_context.md"
    format: "Markdown"
    generator: "run_hunt.py:_write_context_md()"
    purpose: "Protocol model + component overview for hunters"
    usage_by: ["AccessHunter", "DomainHunter", "FlowHunter", "MathHunter", "OracleHunter", "TrustBoundaryHunter", "WildcardHunter", "SignatureHunter", "DoSHunter"]

  - path: "hunt_session/context/{protocol}/{Component}_{Hunter}_prompt.md"
    format: "Markdown"
    generator: "run_hunt.py:_write_hunter_prompts()"
    purpose: "Individual hunter-specific prompt (context + contract code + methodology)"
    count: "12 per component (12 hunters parallel)"

  - path: "hunt_session/fichas/{protocol}/{Component}.yaml"
    format: "YAML"
    generator: "run_hunt.py:_write_ficha_yaml()"
    schema_fields:
      - "file (contract path)"
      - "lines_of_code"
      - "interfaces (external dependencies)"
      - "state_vars (tracked variables)"
      - "public_functions (entry points)"
      - "invariants (initial schema)"
    purpose: "Component specification sheet for auditors"

  - path: "hunt_session/hypotheses/{protocol}/hyp_{Component}_{Hunter}.yaml"
    format: "YAML"
    generator: "Agent (12 parallel hunters)"
    schema_sample: |
      hypotheses:
        - id: "${PREFIX}-${COMP}-001"
          tier: [1|2]
          type: "logic_error|access_control|oracle_manipulation|..."
          description: "vulnerability description"
          attack_scenario: "step-by-step attack"
          solidity_property: "Chimera assertion code"
          validated: [true|false]
          confidence: "% (0-100)"
    purpose: "Findings from hunters (no test yet, raw hypotheses)"

  - path: "hunt_session/hypotheses/{protocol}/hyp_{Component}_DeepDiveHunter.yaml"
    format: "YAML"
    generator: "DeepDiveHunter (sequential, after 12 hunters)"
    purpose: "Deep analysis findings (cross-function, multi-step attacks)"

  - path: "hunt_session/hypotheses/{protocol}/hyp_{Component}_CrossChainHunter.yaml"
    format: "YAML"
    generator: "CrossChainHunter (sequential, only if multi-chain)"
    purpose: "Cross-chain specific findings (replay, desync, bytecode mismatch)"

  - path: "hunt_session/results/{Component}_prepass.yaml"
    format: "YAML"
    generator: "detection_engine.py --prepass"
    purpose: "Static analysis (Slither + Aderyn + SWC patterns)"
    used_before: "12 hunters launch"

  - path: "hunt_session/results/{Component}_harness_summary.json"
    format: "JSON"
    generator: "plan_generator.py (modern mode) or run_hunt.py (legacy)"
    purpose: "Chimera harness metadata (setup complexity, function count)"

  - path: "hunt_session/gate_status/{protocol}.json"
    format: "JSON"
    generator: "pipeline_gate.py --status"
    purpose: "Tracking gates: scope, prepass, hunters, crosschain, deepdive, merge, compile, phase1-5"

  - path: "hunt_session/cross_prompts/{Component1}_{Component2}.md"
    format: "Markdown"
    generator: "run_hunt.py (cross-component mode)"
    purpose: "EdgeHunter prompts for interaction analysis"

  - path: "hunt_session/cross_results/{Component1}_{Component2}.md"
    format: "Markdown"
    generator: "EdgeHunter (Agent)"
    purpose: "Cross-component vulnerability findings"

benchmark_outputs:
  - path: "benchmarks/{protocol}/bench_session/execution_plan.json"
    format: "JSON"
    generator: "plan_generator.py --generate --protocol {protocol}"
    schema_structure: |
      {
        "version": "1.0.0",
        "protocol": "{protocol}",
        "repo": "{repo_path}",
        "session_dir": "{bench_session_dir}",
        "components": ["Component1", "Component2", ...],
        "teams": {
          "parallel_components": 2,
          "groups": [
            {
              "group_id": 0,
              "components": ["Component1", "Component2"],
              "plan_file": "execution_plan_group_0.json"
            }
          ]
        } or null,
        "steps": [
          {
            "id": "step_id",
            "type": "agent|bash|gate|generate|python",
            "description": "...",
            "depends_on": ["other_step_ids"],
            "command": "...",
            "prompt": "...",
            "parallel_group": "group_name"
          }
        ]
      }
    purpose: "Task breakdown for agent execution (can be resumed via checkpoint.json)"

  - path: "benchmarks/{protocol}/bench_session/execution_plan_group_{N}.json"
    format: "JSON"
    generator: "plan_generator.py (if teams mode)"
    purpose: "Sub-plan for component group N (parallel execution)"

  - path: "benchmarks/{protocol}/bench_session/checkpoint.json"
    format: "JSON"
    generator: "run-benchmark-agent skill (after each batch)"
    schema_fields:
      - "plan_file"
      - "completed_steps (array)"
      - "failed_steps (dict with errors)"
      - "current_batch"
      - "last_updated (ISO timestamp)"
    purpose: "Resume support: resume from failed step without re-running completed steps"

  - path: "benchmarks/{protocol}/bench_session/step_outputs/{step_id}.json"
    format: "JSON"
    generator: "run-benchmark-agent skill"
    purpose: "Stdout capture from each step"

  - path: "benchmarks/{protocol}/bench_session/context/{protocol}/{Component}_hunter_brief.md"
    format: "Markdown"
    generator: "plan_generator.py:_gen_hunter_brief()"
    purpose: "Hunter briefing for component (like legacy prompt but generated on-the-fly)"

  - path: "benchmarks/{protocol}/bench_session/hypotheses/{protocol}/hyp_{Component}_{Hunter}.yaml"
    format: "YAML"
    generator: "Agent (hunter) → plan_generator.py collects"
    schema_identical_to_legacy: true
    purpose: "Same findings format as hunt_session"

  - path: "benchmarks/{protocol}/bench_session/findings_all.json"
    format: "JSON"
    generator: "plan_generator.py:phase_checkpoint() --phase checkpoint"
    schema_fields:
      - "component"
      - "id"
      - "hunter"
      - "title"
      - "severity"
      - "confidence"
      - "fuzz_confirmed"
      - "poc_passed"
      - "poc_path"
      - "redteam_verdict"
      - "redteam_kill_reason"
    purpose: "Incremental findings collection (updated after each component checkpoint)"

  - path: "benchmarks/{protocol}/bench_session/gate_status/{protocol}.json"
    format: "JSON"
    generator: "pipeline_gate.py --status (modern mode)"
    purpose: "Same gates as legacy (scope, prepass, hunters, merge, compile, phase1-5)"

  - path: "benchmarks/{protocol}/bench_session/logs/{protocol}_{TIMESTAMP}/"
    format: "Directory"
    generator: "run_benchmark.py (subprocess logs)"
    purpose: "Per-component compile/test logs (foundry, medusa, echidna)"

  - path: "benchmarks/{protocol}/bench_session/results/{Component}_prepass.yaml"
    format: "YAML"
    generator: "detection_engine.py --prepass (modern)"
    purpose: "Static analysis (same as legacy)"

  - path: "benchmarks/{protocol}/bench_session/hunter_performance.json"
    format: "JSON"
    generator: "plan_generator.py (after all hunters complete)"
    purpose: "Performance metrics (execution time, hypothesis count per hunter)"

shared_outputs:
  - path: "hunt_session/hypotheses/{protocol}/hyp_{Component}_{Hunter}.yaml"
    used_by_legacy: true
    used_by_modern: true
    generator_legacy: "Agent (12 hunters parallel) invoked by run_hunt.py"
    generator_modern: "Agent (12 hunters parallel) invoked by run-benchmark-agent skill"
    schema_identical: true
    notes: |
      Both flows produce IDENTICAL hypothesis YAML files.
      Legacy: hunt_session/hypotheses/{protocol}/hyp_*
      Modern: benchmarks/{protocol}/bench_session/hypotheses/{protocol}/hyp_*
      (Different base directories but identical schema and contents)

  - path: "*_prepass.yaml (Slither + Aderyn + SWC static analysis)"
    used_by_legacy: true
    used_by_modern: true
    generator_legacy: "detection_engine.py --prepass (before 12 hunters)"
    generator_modern: "detection_engine.py --prepass (before 12 hunters)"
    schema_identical: true
    notes: "Pre-hunter signal generation. Used to warm-start hunter context."

  - path: "{Component}_harness_summary.json (Chimera metadata)"
    used_by_legacy: true
    used_by_modern: true
    schema_identical: true
    notes: "Metadata about Foundry harness (state vars, function handlers, boundary values)"

schema_divergences:
  - component: "gate_status/{protocol}.json"
    divergence: "MINOR: Modern mode may have additional gates (e.g., 'agent_team_verify') not in legacy"
    impact: "LOW: gates are additive only, no conflicting fields"

  - component: "execution_plan.json"
    note: "NEW IN MODERN: No equivalent in legacy run_hunt.py. This is the orchestration spec for run-benchmark-agent skill."

  - component: "checkpoint.json"
    note: "NEW IN MODERN: Resume support. Legacy has no checkpoint mechanism."

only_run_hunt:
  - path: "hunt_session/context/{protocol}/{Component}_context.md"
    purpose: "Pre-generated hunter context (modern generates on-the-fly in hunter briefs)"

  - path: "hunt_session/fichas/{protocol}/{Component}.yaml"
    purpose: "Legacy component specification sheet (modern uses inline in briefs)"

only_benchmark:
  - path: "benchmarks/{protocol}/bench_session/execution_plan.json"
    purpose: "Task orchestration for skill execution"

  - path: "benchmarks/{protocol}/bench_session/checkpoint.json"
    purpose: "Resume support"

  - path: "benchmarks/{protocol}/bench_session/step_outputs/"
    purpose: "Per-step output capture"

  - path: "benchmarks/{protocol}/bench_session/hunter_performance.json"
    purpose: "Performance telemetry"

coverage_summary:
  run_hunt_outputs: 9
  benchmark_outputs: 10
  shared_outputs: 3
  only_run_hunt: 2
  only_benchmark: 4
  divergences: 3

notes:
  - "Both flows converge on hypotheses (hyp_*.yaml) and findings (findings_all.json) — same schema."
  - "Legacy (hunt_session/): pre-generates all context + fichas before hunters run."
  - "Modern (benchmarks/*/bench_session/): generates context on-the-fly, uses execution_plan for orchestration."
  - "Modern adds checkpointing (resume) and telemetry (hunter_performance.json)."
  - "Gate status compatible: both flows track pipeline progress via pipeline_gate.py."
  - "Static analysis (prepass.yaml) is identical between both flows — same detection_engine.py."
  - "RULE #0 (one component at a time) enforced by both flows via pipeline_gate.py gates."
