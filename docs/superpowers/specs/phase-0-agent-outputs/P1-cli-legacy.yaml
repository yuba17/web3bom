---
agent: P1
scope: "audit-agents/run_hunt.py CLI"
flags:
  - name: "--component"
    short: "-c"
    description: "Especifica el componente a huntar (contrato Solidity)"
    handler_function: "main() -> generar prompts para hunters"
    side_effects:
      - "crea hunt_session/context/<protocol>/<component>_*.md (context files)"
      - "crea hunt_session/context/<protocol>/<component>_<HunterName>_prompt.md (9 prompts)"
      - "crea hunt_session/fichas/<protocol>/<component>.yaml (ficha del componente)"
      - "ejecuta detection_engine.py --prepass -> hunt_session/results/<component>_prepass.yaml"
      - "ejecuta symmetric_analyzer.py -> output a context"
      - "ejecuta deep_flatten.py -> output a context"
      - "ejecuta solodit_search.py (3 queries) -> contexto Solodit"
      - "actualiza current_component en current_hunt.json"
    outputs:
      - "hunt_session/context/<protocol>/<component>_*.md"
      - "hunt_session/context/<protocol>/<component>_<HunterName>_prompt.md (9 archivos)"
      - "hunt_session/fichas/<protocol>/<component>.yaml"
      - "hunt_session/results/<component>_prepass.yaml"

  - name: "--hunters"
    description: "Selecciona subset de hunters (all | math,access,flow,oracle,domain,wildcard,...)"
    default_value: "all"
    handler_function: "main() -> filtro en generación de prompts"
    side_effects:
      - "limita qué hunters se lanzan (no genera prompts para hunters no seleccionados)"
    outputs: ~

  - name: "--domain"
    short: "-d"
    description: "Especifica el dominio del componente (staking, lending, yield, etc)"
    handler_function: "main() -> argumento para auto-detección"
    side_effects:
      - "usada en Solodit search queries"
      - "usada en briefing loading"
      - "almacenada en ficha del componente"
    outputs: ~

  - name: "--status"
    short: "-s"
    description: "Muestra estado actual del hunt (componentes, findings)"
    handler_function: "print_status(state)"
    side_effects:
      - "solo lectura de current_hunt.json y fichas YAML"
      - "imprime a stdout (no crea archivos)"
    outputs: ~

  - name: "--init-ficha"
    description: "Crea ficha vacía para un componente"
    argument_type: "str (COMPONENT name)"
    handler_function: "init_ficha(component, domain, protocol, repo_path)"
    side_effects:
      - "crea hunt_session/fichas/<protocol>/<component>.yaml"
      - "inicializa hunters_completed dict, checklist, status=in_progress"
    outputs:
      - "hunt_session/fichas/<protocol>/<component>.yaml"

  - name: "--complete"
    description: "Marca componente como completado, actualiza estado, lanza cross-component check"
    argument_type: "str (COMPONENT name)"
    handler_function: "main() -> mark_complete_handler"
    side_effects:
      - "remueve de components_remaining, agrega a components_done"
      - "ejecuta pipeline_gate.py --gate all"
      - "ejecuta apply_feedback.py --hypotheses"
      - "ejecuta run_cross_component_check(state)"
      - "actualiza component_map status=done"
      - "actualiza current_hunt.json"
    outputs:
      - "cross-component interaction maps en hunt_session/context/"
      - "edge_<comp_a>_<comp_b>.md prompts"
      - "hyp_*_EdgeHunter.yaml"

  - name: "--cross-component"
    description: "Ejecuta análisis de interacciones cross-component (Rule 0.5)"
    handler_function: "run_cross_component_check(state)"
    side_effects:
      - "detecta pares con interacciones potenciales"
      - "genera interaction maps"
      - "genera EdgeHunter prompts"
      - "detecta cadenas transitivas (A<->B + B<->C -> A->B->C)"
      - "genera ChainEdgeHunter prompts si aplica"
    outputs:
      - "hunt_session/context/<protocol>/edge_<comp_a>_<comp_b>.md"
      - "hunt_session/context/<protocol>/chain_*.md"
      - "hyp_*_EdgeHunter.yaml"

  - name: "--map-components"
    description: "Escanea repo y genera component_map con LOC, prioridad, dependencias"
    handler_function: "generate_component_map(state)"
    side_effects:
      - "escanea repo_path recursivamente"
      - "busca .sol en src/ y contracts/ (excluye test/, lib/)"
      - "calcula LOC para cada archivo >=10"
      - "detecta dependencias mediante análisis de imports"
      - "auto-pobla components_remaining si está vacío"
      - "persiste component_map en current_hunt.json"
    outputs:
      - "actualización de state['component_map']"
      - "guardado en current_hunt.json"
      - "tabla impresa con [prioridad] nombre (LOC)"

  - name: "--force"
    description: "Regenera component_map aunque ya exista; con --complete bypassa pipeline_gate"
    handler_function: "flag condicional en main()"
    side_effects:
      - "bypassa cache de component_map existente"
      - "con --complete: bypassa pipeline_gate checks"
    outputs: ~

  - name: "--backfill"
    description: "Solo genera prompts para hunters sin hyp_*.yaml existente"
    handler_function: "filtro en main()"
    side_effects:
      - "busca archivos hyp_<component>_*.yaml"
      - "compara hunters ejecutados vs. seleccionados"
      - "reduce selected_hunters a solo faltantes"
      - "retorna 0 si todos están completos"
    outputs:
      - "solo prompts para hunters nuevos"

  - name: "--no-solodit"
    description: "Omite búsqueda en Solodit (modo benchmark)"
    handler_function: "condicional en main()"
    side_effects:
      - "skip de get_solodit_context()"
      - "skip de run_prescan()"
      - "no descarga de referencias externas"
    outputs: ~

  - name: "--print-prompts"
    description: "Imprime primeros 500 chars de cada hunter prompt (DEBUG)"
    handler_function: "condicional en main()"
    side_effects:
      - "solo lectura, no escribe archivos"
      - "imprime a stdout truncado"
    outputs: ~

hunter_domains:
  - "MathHunter"
  - "AccessHunter"
  - "FlowHunter"
  - "OracleHunter"
  - "DomainHunter"
  - "WildcardHunter"
  - "CrossChainHunter"
  - "DeepDiveHunter"
  - "EdgeHunter"

output_path_structure:
  context: "hunt_session/context/<protocol>/"
  fichas: "hunt_session/fichas/<protocol>/"
  hypotheses: "hunt_session/hypotheses/<protocol>/"
  results: "hunt_session/results/"
  graph: "hunt_session/graph/<protocol>/"

notes:
  - "Flag --component es punto de entrada principal del pipeline de hunt autónomo"
  - "Genera prompts para 9 hunters (math, access, flow, oracle, domain, wildcard + CrossChain + DeepDive + EdgeHunter)"
  - "--complete ejecuta automáticamente apply_feedback y cross_component_check (Rule 0.5)"
  - "--force con --complete bypassa pipeline_gate (CUIDADO)"
  - "--backfill permite rerunear solo hunters faltantes"
  - "--no-solodit desactiva llamadas de red (Solodit, prescan, Slither)"
  - "Outputs YAML van a hunt_session/hypotheses/<protocol>/hyp_*.yaml (escritos por hunters)"
  - "Estado persiste en ~/.claude/MEMORY/STATE/current_hunt.json"
  - "--map-components autopobla components_remaining en primera ejecución"
  - "Sección argparse en líneas 3827-3843"
