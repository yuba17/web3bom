---
agent: P3
scope: "flujo moderno: benchmark + plan_generator + skill"
run_benchmark_cli:
  flags:
    - name: "--repo"
      required: true
      description: "Path to the repo root"
    - name: "--components"
      required: true
      description: "Comma-separated component names"
    - name: "--protocol"
      required: true
      description: "Protocol name for namespacing"
    - name: "--mode"
      values: ["api", "sub"]
      default: "api"
      description: "Execution mode. 'api' (subprocess + API key + stream-json + stall detection). 'sub' (subscription + agentic tools + sonnet + skill execution). Note: formerly 'agent', renamed in commit d6a5882"
    - name: "--benchmark-mode"
      values: ["hypothesis", "poc", "redteam"]
      default: "redteam"
      description: "Benchmark depth. 'hypothesis' (~45min/comp), 'poc' (~3h/comp), 'redteam' (full pipeline)"
    - name: "--ground-truth"
      description: "Path to benchmark YAML for scoring at end"
    - name: "--session-dir"
      description: "Override hunt_session output directory (default: benchmarks/<protocol>/bench_session/)"
    - name: "--fast"
      flag: true
      description: "Fast mode: reduced fuzz runs (3K vs 5K), skip Medusa, compile retry=1"
    - name: "--skip-phase3"
      flag: true
      description: "Skip fork PoC (explicit flag required)"
    - name: "--skip-hunters"
      flag: true
      description: "Skip prepass+hunters+deepdive if hypothesis files already exist"
    - name: "--pre-production"
      flag: true
      description: "Protocol is pre-production (not deployed on-chain); PoC deployment in setUp()"
    - name: "--no-few-shot"
      flag: true
      description: "Disable few-shot example injection into hunter prompts"
    - name: "--max-retries"
      type: int
      default: 5
      description: "Max fix-and-retry attempts"
    - name: "--workers"
      type: int
      default: 9
      description: "Max parallel hunters (9 = all truly parallel)"
    - name: "--parallel-components"
      type: int
      default: 2
      description: "Components in parallel (requires git worktrees)"
    - name: "--parallel-hunters"
      type: int
      default: 6
      description: "Max parallel hunter calls in sub mode"
    - name: "--parallel-fuzz"
      type: int
      default: 3
      description: "Parallel fuzz batches per component (forge-bound)"
    - name: "--parallel-poc"
      type: int
      default: 3
      description: "Parallel PoC generators per component (forge-bound)"
    - name: "--lang"
      description: "solidity, rust (auto-detected if empty)"
    - name: "--chain"
      default: "mainnet"
      description: "Target chain for fork PoCs (mainnet, base, optimism, arbitrum, polygon)"
    - name: "--fork-block"
      type: int
      default: 0
      description: "0=latest (portable), N=pinned (deterministic)"
    - name: "--poc-timeout"
      type: int
      default: "900 (api) / 1500 (sub)"
      description: "PoC generation timeout"
    - name: "--poc-confidence"
      type: int
      default: 65
      description: "Minimum confidence %% to attempt PoC generation"

plan_generator_phases:
  - name: "phase_hunter_prompt"
    context: "Solidity + Rust"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for {component}:hunters step"
  - name: "phase_deepdive_prompt"
    context: "Solidity + Rust"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for {component}:deepdive step"
  - name: "phase_chimera_early_prompt"
    context: "Solidity only"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for {component}:chimera_early_setup"
  - name: "phase_chimera_builder_prompt"
    context: "Solidity only"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for {component}:chimera_builder"
  - name: "phase_rust_fuzz_scaffold_prompt"
    context: "Rust only"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for Rust fuzz scaffold"
  - name: "phase_rust_fuzz_harness_prompt"
    context: "Rust only"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for Rust fuzz harness"
  - name: "phase_enhance_targets_prompt"
    context: "Solidity + Rust"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic steps for target enumeration"
  - name: "phase_findings"
    context: "Solidity + Rust"
    generates_step_type: "bash"
    outputs_to_plan: "Dynamic steps for verify + PoC + redteam"
  - name: "phase_fork_poc_prompt"
    context: "Solidity + Rust (fork PoCs)"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for {component}:poc_{finding_id}"
  - name: "phase_cross_prompt"
    context: "Multi-component"
    generates_step_type: "agent"
    outputs_to_plan: "Dynamic prompt for cross_component"
  - name: "phase_post_compile"
    context: "Solidity + Rust"
    generates_step_type: "bash"
    outputs_to_plan: "Fuzz execution results"
  - name: "phase_checkpoint"
    context: "Solidity + Rust"
    generates_step_type: "bash"
    outputs_to_plan: "findings_all.json + metrics"

plan_schema:
  dataclasses:
    - name: "Step"
      fields:
        id: "str"
        type: "Literal['agent','bash','gate','python','generate']"
        description: "str"
        depends_on: "list[str] (default: [])"
        retry: "int (default: 0)"
        timeout: "int (default: 120)"
        prompt: "str (for agent steps, may be '__DYNAMIC__')"
        tools: "list[str] (for agent steps)"
        cwd: "str (for bash/gate/python/generate)"
        command: "str (for bash/gate/python/generate)"
        parallel_group: "str (optional)"
      methods:
        - "to_dict(): serialize dropping empty optional fields"
        - "from_dict(d): deserialize with defaults"
    - name: "ExecutionPlan"
      fields:
        version: "str"
        protocol: "str"
        repo: "str"
        session_dir: "str"
        hypotheses_dir: "str"
        components: "list[str]"
        is_pre_production: "bool"
        lang: "str (default: 'solidity')"
        created_at: "str (ISO timestamp, auto-populated)"
        steps: "list[Step] (default: [])"
        teams: "dict (default: {})"
      methods:
        - "add_step(step: Step)"
        - "add_steps(steps: list[Step])"
        - "to_json(path)"
        - "from_json(path)"

skill_sections:
  - section: "Load Plan"
    number: "1"
    what_it_does: "Parse execution_plan.json; detect checkpoint.json for resume"
  - section: "Resolve Execution Order"
    number: "2"
    what_it_does: "Topological batches via Kahn's algorithm respecting depends_on + parallel_group"
  - section: "Execute Each Batch"
    number: "3"
    what_it_does: "Run agent/bash/gate/python/generate steps; resolve __DYNAMIC__ prompts"
  - section: "Handle Failures"
    number: "4"
    what_it_does: "Retry logic (decrement counter); gate failures halt execution"
  - section: "Write Checkpoints"
    number: "5"
    what_it_does: "After each batch: persist checkpoint.json (completed_steps, failed_steps, current_batch)"
  - section: "Progress Reporting"
    number: "6"
    what_it_does: "Print batch summaries; periodic overall progress; warn on failures"
  - section: "Final Summary"
    number: "7"
    what_it_does: "Total elapsed, step counts, scoring output, findings_all.json path"
  - section: "Team Orchestration"
    number: "8"
    what_it_does: "When plan.teams exists: TeamCreate + spawn agents per group + TaskCreate per + wait + verify + cross-component"
    subsections:
      "8.1": "Read teams config"
      "8.2": "TeamCreate"
      "8.3": "TaskCreate per group"
      "8.4": "Spawn team agents (Agent tool + filled team-executor-prompt.md)"
      "8.5": "Template placeholders: {group_id},{components},{plan_file},{session_dir},{protocol},{checkpoint_path},{checkpoint_json}"
      "8.6": "verify_team_outputs.py gate (agents lie; verify systematically)"
      "8.7": "Cross-component + scoring (Sequential Mode 2-7)"
      "8.8": "Final evidence gate (verify scoring, count outputs)"

verify_team_outputs:
  what_it_verifies:
    - "Hypothesis files exist: hypotheses/{protocol}/hyp_{component}_*.yaml"
    - "Prepass ran: results/{component}_prepass.yaml"
    - "Checkpoint exists: checkpoint.json (or checkpoint_group_{group_id}.json)"
    - "No fatal step failures (non-fatal: fuzz, medusa, echidna, halmos)"
  invoked_by: "skill run-benchmark-agent section 8.6 (Team-Parallel Mode)"
  command_format: |
    python3 audit-agents/verify_team_outputs.py \
      --session-dir {session_dir} \
      --protocol {protocol} \
      --groups '{json.dumps(teams["groups"])}'
  exit_codes:
    "0": "All checks pass, proceed to cross-component"
    "non-zero": "Failures found, report errors, ask user to retry or abort"

notes:
  - "Discrepancy: SKILL.md says '--mode agent'; CLI uses '--mode sub'. Renamed in commit d6a5882; both refer to subscription + agentic execution"
  - "prompt='__DYNAMIC__' requires preceding generate step to provide real prompt"
  - "Dynamic steps inserted into queue AFTER generate step, not in original JSON"
  - "parallel_group enables concurrent Agent launches in ONE message"
  - "depends_on entries can be step IDs or 'parallel_group:X' (wait for group)"
  - "topological_batches() detects circular dependencies (Kahn)"
  - "Team mode: each component group gets isolated sub-plan + Agent executor + checkpoint"
  - "Master plan (team mode): cross-component + scoring + verification gate + teams metadata"
  - "verify_team_outputs.py is critical gate — agents lie, verification is systematic"
  - "Coverage: 22 flags, 12 phases, 8 skill sections, 2 dataclasses, 4 verify checks"
