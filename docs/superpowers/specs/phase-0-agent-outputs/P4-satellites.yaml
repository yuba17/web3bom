---
agent: P4
scope: "scripts satélite invocados por run_hunt.py"
satellites:
  - path: "audit-agents/solodit_search.py"
    invoked_by_legacy:
      - "run_hunt.py:L952 subprocess.run (get_solodit_context)"
    invoked_by_modern: []
    cli:
      flags:
        - "--query"
        - "--domain"
        - "--protocol"
        - "--severity"
        - "--limit"
        - "--format"
        - "--component"
        - "--hunter-context"
        - "--our-findings"
        - "--max-scan"
        - "--force-jsonl"
    purpose: "Búsqueda en base de datos local de Solodit (SQLite FTS5) para reports similares por domain/severity"
    modern_status: "missing"

  - path: "audit-agents/pipeline_gate.py"
    invoked_by_legacy:
      - "run_hunt.py:L46 import"
      - "run_hunt.py:L3901 subprocess en mark_gate"
    invoked_by_modern:
      - "run_benchmark.py:L527 check_gate()"
      - "execution_plan.json step type=gate"
    cli:
      flags:
        - "--component"
        - "--finding"
        - "--gate"
        - "--status"
        - "--mark"
        - "--export-json"
        - "--queue-finding"
        - "--list-queue"
        - "--scope-status"
        - "--scope-review"
        - "--program"
        - "--session-dir"
    purpose: "Enforcer determinístico de gates del pipeline (scope, prepass, hunters, merge, compile, phase1..5)"
    modern_status: "present"
    notes: "Presente en ambos flujos; el moderno lo invoca vía step type=gate en execution_plan.json"

  - path: "audit-agents/apply_feedback.py"
    invoked_by_legacy:
      - "run_hunt.py:L3936 subprocess (post --complete)"
    invoked_by_modern: []
    cli:
      flags:
        - "--dry-run"
        - "--synthesis-only"
        - "--hypotheses"
        - "--ficha"
        - "--fichas-dir"
        - "--hyp-dir"
    purpose: "L8 Feedback Loop - aplica pending_briefing_updates a briefings y archivos de hipótesis; auto-ingesta a Obsidian wiki"
    modern_status: "missing"
    notes: "Gap real de migración: el flujo moderno no cierra el feedback loop"

  - path: "audit-agents/detection_engine.py"
    invoked_by_legacy:
      - "run_hunt.py:L4041 subprocess (--prepass)"
    invoked_by_modern:
      - "run_benchmark.py:L1450"
      - "plan_generator.py:L477 (phase_prepass step)"
    cli:
      flags:
        - "--source"
        - "--name"
        - "--output"
        - "--layers"
        - "--fast"
        - "--prepass"
        - "--payout"
    purpose: "Multi-layer vulnerability detection: static (Slither, Aderyn) + invariantes + simbólico + LLM + exploit patterns"
    modern_status: "present"

  - path: "audit-agents/symmetric_analyzer.py"
    invoked_by_legacy:
      - "run_hunt.py:L4120 subprocess"
    invoked_by_modern: []
    cli:
      flags:
        - "sol_file (positional)"
        - "--contract"
        - "--output"
    purpose: "Analiza state variables, events, modifiers de funciones simétricas (deposit/withdraw, mint/burn) y reporta diferencias"
    modern_status: "missing"

  - path: "audit-agents/deep_flatten.py"
    invoked_by_legacy:
      - "run_hunt.py:L2163 subprocess"
      - "run_hunt.py:L4144 subprocess"
    invoked_by_modern: []
    cli:
      flags:
        - "sol_file (positional)"
        - "--contract"
        - "--functions"
        - "--critical-only"
        - "--output"
    purpose: "Traza de ejecución aplanada: READ/WRITE/EXTERNAL en orden, inlineando modifiers y funciones internas; filtra funciones que mueven fondos con --critical-only"
    modern_status: "missing"

summary_matrix:
  - script: "solodit_search.py"
    legacy: "run_hunt.py:952"
    modern: "NO"
    status: "missing"
  - script: "pipeline_gate.py"
    legacy: "run_hunt.py:46,3901"
    modern: "run_benchmark.py:527 + plan step type=gate"
    status: "present"
  - script: "apply_feedback.py"
    legacy: "run_hunt.py:3936"
    modern: "NO"
    status: "missing"
  - script: "detection_engine.py"
    legacy: "run_hunt.py:4041"
    modern: "run_benchmark.py:1450, plan_generator.py:477"
    status: "present"
  - script: "symmetric_analyzer.py"
    legacy: "run_hunt.py:4120"
    modern: "NO"
    status: "missing"
  - script: "deep_flatten.py"
    legacy: "run_hunt.py:2163,4144"
    modern: "NO"
    status: "missing"

notes:
  - "6 satélites identificados con invocación real (≥4 cobertura mínima cumplida)"
  - "2 satélites migrados (detection_engine, pipeline_gate)"
  - "4 satélites exclusivos de legacy: solodit_search, apply_feedback, symmetric_analyzer, deep_flatten"
  - "apply_feedback.py es el gap más crítico: cierra el feedback loop L8 (briefings + wiki)"
  - "symmetric_analyzer y deep_flatten son context-enrichers pre-hunter; candidatos a migrar como pre-phase"
  - "solodit_search es enriquecimiento de context con reports similares — decisión: migrate/deprecate según cobertura wiki"
