# model_config.yaml — Asignación de modelos por tarea en el pipeline de hunting
#
# Principio: usar el modelo más barato que da calidad suficiente para cada tarea.
# No usar Opus donde Haiku es suficiente. Reservar Sonnet/Opus para razonamiento profundo.
#
# Modelos disponibles (2026):
#   claude-opus-4-6      — Razonamiento máximo, creativo, lento, caro
#   claude-sonnet-4-6    — Balance calidad/coste, rápido, buen razonamiento
#   claude-haiku-4-5-20251001 — Muy rápido, barato, bueno para tasks mecánicas
#
# Uso en código:
#   import yaml
#   cfg = yaml.safe_load(open("model_config.yaml"))
#   model = cfg["tasks"]["read_contract"]["model"]
#
# Uso en prompts de agentes:
#   "Usa modelo: {model_config.tasks.deep_analysis.model}"

# ─────────────────────────────────────────────────────────────────────────────
# COORDINADOR (L0 — Intake y Triage)
# ─────────────────────────────────────────────────────────────────────────────
coordinator:
  model: claude-sonnet-4-6
  reason: "Necesita entender scope completo y asignar hunters correctamente. Balance calidad/coste."
  tasks:
    - scope_parsing
    - hunter_assignment
    - results_aggregation
    - final_triage

# ─────────────────────────────────────────────────────────────────────────────
# HUNTERS (L1-L6 — Lectura y análisis de código)
# ─────────────────────────────────────────────────────────────────────────────
hunters:

  # Hunter de matemáticas — necesita razonamiento aritmético preciso
  math_hunter:
    model: claude-sonnet-4-6
    reason: "Análisis de overflow, rounding, invariantes matemáticos — requiere razonamiento preciso"
    tasks:
      - integer_overflow_analysis
      - rounding_direction_check
      - precision_loss_detection
      - economic_invariant_generation

  # Hunter de acceso — patrones bien definidos, más mecánico
  access_hunter:
    model: claude-haiku-4-5-20251001
    reason: "Patrones de access control son repetitivos y bien definidos — Haiku es suficiente"
    tasks:
      - onlyOwner_check
      - role_validation
      - privilege_escalation_patterns
      - missing_modifier_detection
    upgrade_to: claude-sonnet-4-6
    upgrade_when: "finding prometedor que requiere análisis de contexto complejo"

  # Hunter de flujo — seguimiento de flujo de tokens, reentrancy
  flow_hunter:
    model: claude-sonnet-4-6
    reason: "Reentrancy y flujo de fondos requiere rastrear estado entre múltiples llamadas"
    tasks:
      - reentrancy_analysis
      - token_flow_tracking
      - CEI_pattern_check
      - callback_analysis

  # Hunter de oracle — integración con AMMs y feeds de precio
  oracle_hunter:
    model: claude-sonnet-4-6
    reason: "Manipulación de oracle requiere entender mecánicas de AMM y timing"
    tasks:
      - twap_analysis
      - spot_price_vs_twap
      - oracle_staleness
      - price_manipulation_vectors

  # Hunter de dominio — análisis profundo específico del protocolo
  domain_hunter:
    model: claude-opus-4-6
    reason: "Análisis de invariantes específicos del dominio requiere comprensión más profunda"
    tasks:
      - protocol_model_generation
      - cross_component_interactions
      - economic_attack_scenarios
      - domain_specific_invariants
    note: "Usar Opus solo cuando el dominio es nuevo o complejo. Para protocolos conocidos (lending/vault), Sonnet es suficiente."

  # Hunter wildcard — búsqueda creativa de bugs no obvios
  wildcard_hunter:
    model: claude-opus-4-6
    reason: "Creatividad máxima para bugs fuera de patrones conocidos"
    tasks:
      - novel_attack_vector_generation
      - cross_protocol_interaction_bugs
      - unconventional_exploit_paths
      - assumption_questioning

# ─────────────────────────────────────────────────────────────────────────────
# TAREAS ESPECÍFICAS DEL PIPELINE
# ─────────────────────────────────────────────────────────────────────────────
tasks:

  # L0 — Intake
  read_contract:
    model: claude-haiku-4-5-20251001
    reason: "Lectura inicial de contrato para mapeo estructural — mecánico"

  count_locs:
    model: claude-haiku-4-5-20251001
    reason: "Conteo de LOC y estructura — totalmente mecánico"

  solodit_search:
    model: claude-haiku-4-5-20251001
    reason: "Búsqueda en DB local con keywords — no requiere razonamiento"

  # L1 — Análisis profundo
  protocol_model:
    model: claude-sonnet-4-6
    reason: "Generar Protocol Model completo — requiere comprensión del dominio"

  invariant_generation:
    model: claude-sonnet-4-6
    reason: "Generar invariantes específicos del protocolo — requiere razonamiento"
    override_for_novel_domains: claude-opus-4-6

  # L2 — Validación
  devil_advocate:
    model: claude-sonnet-4-6
    reason: "Validar si finding tiene defensas existentes — requiere análisis"

  poc_writing:
    model: claude-sonnet-4-6
    reason: "Escribir PoC en Foundry — requiere comprensión técnica y código correcto"

  # L3 — Fuzzing support
  handler_generation:
    model: claude-haiku-4-5-20251001
    reason: "Generar funciones handler para TargetFunctions.sol — mecánico/plantilla"

  ghost_var_generation:
    model: claude-haiku-4-5-20251001
    reason: "Variables ghost de tracking — mecánico"

  # L4 — Reporte
  report_writing:
    model: claude-sonnet-4-6
    reason: "Redactar reporte final — requiere calidad de escritura y claridad técnica"

  executive_summary:
    model: claude-opus-4-6
    reason: "Resumen ejecutivo del finding — máxima calidad para persuadir jueces"

  # L5 — Council y RedTeam
  council_debate:
    model: claude-opus-4-6
    reason: "Debate profundo entre expertos — requiere máxima capacidad de razonamiento"

  redteam:
    model: claude-sonnet-4-6
    reason: "Atacar finding con argumentos adversariales — Sonnet suficiente para argumentos técnicos"
    upgrade_for: "critical/high findings where submission confidence is borderline"

  # L6-L7 — Infraestructura
  merge_invariants:
    model: claude-haiku-4-5-20251001
    reason: "Parseo YAML y generación de código Solidity a partir de templates — mecánico"

  apply_feedback:
    model: claude-haiku-4-5-20251001
    reason: "Aplicar updates de feedback a briefings — mecánico/file manipulation"

  knowledge_search:
    model: claude-haiku-4-5-20251001
    reason: "Búsqueda en knowledge base con keywords — mecánico"

# ─────────────────────────────────────────────────────────────────────────────
# REGLAS DE UPGRADE AUTOMÁTICO
# ─────────────────────────────────────────────────────────────────────────────
upgrade_rules:
  # Si un hunter Haiku encuentra algo > Low, upgrade a Sonnet para confirmar
  haiku_to_sonnet:
    trigger: "finding_severity in [medium, high, critical]"
    action: "re-analyze con sonnet antes de escalar"

  # Si Sonnet no puede resolver una ambigüedad después de 2 intentos, escalar a Opus
  sonnet_to_opus:
    trigger: "retries >= 2 AND confidence < 60"
    action: "escalar a Opus con contexto completo"

  # Para PoCs de findings críticos, siempre usar Sonnet mínimo
  poc_minimum:
    trigger: "task == poc_writing AND severity >= high"
    model: claude-sonnet-4-6

# ─────────────────────────────────────────────────────────────────────────────
# CONTEXTO POR DOMINIO (afecta elección de modelo)
# ─────────────────────────────────────────────────────────────────────────────
domain_overrides:
  # Dominios conocidos con briefings maduros → Sonnet es suficiente
  well_known:
    domains: [lending, vault, oracle, access-control, staking]
    hunter_model: claude-sonnet-4-6
    reason: "Briefings maduros + Solodit DB = contexto rico, Opus no necesario"

  # Dominios complejos/nuevos → necesita Opus para domain_hunter
  complex:
    domains: [zk, bridge, proxy, cross-chain]
    hunter_model: claude-opus-4-6
    reason: "Menor briefing + mayor novedad = necesita máxima capacidad"

# ─────────────────────────────────────────────────────────────────────────────
# ESTIMACIÓN DE COSTES (referencia orientativa)
# ─────────────────────────────────────────────────────────────────────────────
cost_reference:
  # Hunt completo (6 hunters + coordinador + council + redteam)
  full_hunt_estimate:
    haiku_calls: ~40      # handlers, grep tasks, mechanical
    sonnet_calls: ~25     # analysis, invariants, PoC
    opus_calls: ~8        # domain hunter, wildcard, council
    estimated_total: "$2-5 USD por componente de 500-2000 LOC"

  # Quick scan (30 min grep + lectura rápida)
  quick_scan_estimate:
    haiku_calls: ~15
    sonnet_calls: ~5
    opus_calls: 0
    estimated_total: "$0.20-0.50 USD"

  rule: "Si payout < $10K o score < 45, usar quick_scan (Haiku/Sonnet). Solo full hunt para score >= 70."
