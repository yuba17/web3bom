# Few-shot examples: Oracle manipulation bugs
# Source: Yieldoor Sherlock 2025

examples:
  - id: "ex-oracle-01"
    title: "slot0 spot price used instead of TWAP"
    source: "Yieldoor H-02 (Sherlock 2025)"
    vulnerable_code: |
      (uint160 sqrtPriceX96, int24 tick,,,,,) = pool.slot0();
      // slot0() returns CURRENT price — manipulable in same block via swap
      uint256 price = _tickToPrice(tick);
    explanation: |
      Using slot0() for pricing instead of TWAP. An attacker can manipulate
      spot price with a large swap, call the vulnerable function in the same
      block, then swap back. Cost: only the pool fee on the manipulation swap.
    invariant: "price-sensitive operations must use TWAP, not slot0"
    category: "spot-price-manipulation"

  - id: "ex-oracle-02"
    title: "Uninitialized observation array causes revert"
    source: "Yieldoor M-04 (Sherlock 2025)"
    vulnerable_code: |
      // Tries to read N observations but pool only has < N initialized
      (int56[] memory tickCumulatives,) = pool.observe(secondsAgos);
      // Reverts with "OLD" if observation at secondsAgos[i] doesn't exist
    explanation: |
      The observation array in Uniswap V3 must be explicitly initialized via
      increaseObservationCardinalityNext(). If the pool hasn't been initialized
      with enough observations, observe() reverts, blocking all price reads.
    invariant: "observation cardinality must be verified before calling observe()"
    category: "uninitialized-state"

  - id: "ex-oracle-03"
    title: "Short TWAP window vulnerable to multi-block manipulation"
    source: "Yieldoor M-05 (Sherlock 2025)"
    vulnerable_code: |
      uint32 twapWindow = 300; // 5 minutes — too short
      // Attacker can manipulate price across multiple blocks
    explanation: |
      A 5-minute TWAP window can be manipulated by a well-funded attacker
      who maintains a price deviation across ~25 blocks. Cost increases with
      window size but 5 minutes is economically feasible for high-value targets.
    invariant: "TWAP window must be >= 30 minutes for price-sensitive operations"
    category: "insufficient-twap"
