# Few-shot examples: Access control bugs
# Source: Yieldoor Sherlock 2025, general DeFi patterns

examples:
  - id: "ex-access-01"
    title: "Public function missing access modifier"
    source: "Yieldoor H-07 (Sherlock 2025)"
    vulnerable_code: |
      function changePositionWidth(int24 newWidth) external {
          // Missing: onlyOwner or onlyStrategy modifier
          // Anyone can change the position width
          _rebalance(newWidth);
      }
    explanation: |
      Critical strategy function has no access control. Any address can call
      changePositionWidth to force rebalance with arbitrary tick width,
      causing loss of liquidity concentration and fees.
    invariant: "state-changing strategy functions must have access control"
    category: "missing-modifier"

  - id: "ex-access-02"
    title: "TTL desync allows expired ACL entries to persist"
    source: "LayerZero-Stellar H-01 (C4 2026)"
    vulnerable_code: |
      // Allowlist entry stored as Instance (short TTL)
      // But size counter stored as Persistent (long TTL)
      storage.instance.set(&key, &entry);  // expires in 30 days
      storage.persistent.set(&counter_key, &count);  // lives forever
    explanation: |
      When the allowlist entry expires (Instance TTL), the size counter
      (Persistent) still counts it. New additions can be blocked because
      counter shows max capacity, while actual entries have expired.
    invariant: "storage TTL must be consistent across related data structures"
    category: "ttl-desync"

  - id: "ex-access-03"
    title: "collectFees has no access control"
    source: "Yieldoor M-11 (Sherlock 2025)"
    vulnerable_code: |
      function collectFees() public {
          // No onlyOwner/onlyStrategy check
          // Anyone can trigger fee collection at any time
      }
    explanation: |
      Fee collection is callable by anyone, allowing an attacker to trigger
      collection at unfavorable times (e.g., mid-rebalance) or front-run
      legitimate fee collections.
    invariant: "fee collection must be restricted to authorized callers"
    category: "missing-modifier"
