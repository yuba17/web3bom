# Few-shot examples: Rounding/precision bugs
# Source: Yieldoor Sherlock 2025

examples:
  - id: "ex-round-01"
    title: "Integer overflow in reduced-precision pool"
    source: "Yieldoor M-01 (Sherlock 2025)"
    vulnerable_code: |
      // WBTC (8 decimals) * sqrtPriceX96 can overflow uint256
      uint256 amount = uint256(liquidity) * sqrtPriceX96 / (1 << 96);
      // With WBTC: liquidity * 2^96 exceeds uint256 range
    explanation: |
      When one token has low decimals (WBTC=8), the intermediate multiplication
      with sqrtPriceX96 (which is Q96 format, up to ~2^160) can overflow uint256.
      This causes silent truncation or revert depending on Solidity version.
    invariant: "intermediate math must not overflow with any supported decimal pair"
    category: "overflow"

  - id: "ex-round-02"
    title: "Negative modulo in secondary tick calculation"
    source: "Yieldoor M-06 (Sherlock 2025)"
    vulnerable_code: |
      int24 adjustedTick = tick - (tick % tickSpacing);
      // In Solidity, -5 % 3 = -2 (not 1 as in Python)
      // This gives wrong tick for negative values
    explanation: |
      Solidity's modulo operator preserves the sign of the dividend.
      For negative ticks, tick % tickSpacing gives a negative remainder,
      causing the adjusted tick to be wrong (shifted up instead of down).
    invariant: "tick alignment must handle negative ticks correctly"
    category: "negative-modulo"

  - id: "ex-round-03"
    title: "Division by zero when pool has no liquidity"
    source: "Yieldoor M-08 (Sherlock 2025)"
    vulnerable_code: |
      uint256 sharePrice = totalAssets() / totalSupply();
      // If totalSupply is 0 (no depositors), this reverts
      // Blocks all subsequent operations
    explanation: |
      Division by totalSupply without checking for zero. First depositor
      or empty pool state causes permanent revert. Common in ERC4626 vaults
      and share-based systems.
    invariant: "division must check for zero denominator"
    category: "division-by-zero"
