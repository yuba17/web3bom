# Few-shot examples: Denial of Service bugs
# Source: Yieldoor Sherlock 2025, LayerZero-Stellar C4 2026

examples:
  - id: "ex-dos-01"
    title: "Unbounded loop over observation array"
    source: "Yieldoor M-10 (Sherlock 2025)"
    vulnerable_code: |
      for (uint i = 0; i < pool.observationCardinality(); i++) {
          // O(n) loop where n can grow unboundedly
          (bool initialized,) = pool.observations(i);
          if (initialized) count++;
      }
    explanation: |
      observationCardinality can be increased by anyone calling
      increaseObservationCardinalityNext(). An attacker can inflate this to
      make the loop exceed block gas limit, permanently blocking the function.
    invariant: "loops must have bounded iteration count independent of user input"
    category: "unbounded-loop"

  - id: "ex-dos-02"
    title: "Fee recipient blacklist blocks all withdrawals"
    source: "Yieldoor H-03 (Sherlock 2025)"
    vulnerable_code: |
      // collectFees sends to feeRecipient
      IERC20(token).safeTransfer(feeRecipient, fees);
      // If feeRecipient is USDT-blacklisted, transfer reverts
      // This blocks the entire withdrawal flow
    explanation: |
      Fee collection is coupled with withdrawal. If the fee recipient address
      is blacklisted by a token (USDT, USDC), the safeTransfer reverts and
      blocks ALL user withdrawals — not just fee collection.
    invariant: "fee collection failures must not block user fund withdrawals"
    category: "coupled-revert"

  - id: "ex-dos-03"
    title: "Storage read limit causes DoS on large state"
    source: "LayerZero-Stellar M-06 (C4 2026)"
    vulnerable_code: |
      // Iterates over all entries in storage to count active ones
      // Soroban has storage read limits per transaction
      for entry in storage.iter() {
          if entry.is_active() { count += 1; }
      }
    explanation: |
      Soroban enforces per-transaction storage read limits. When the data
      structure grows beyond the limit, iteration-based functions become
      permanently uncallable, locking protocol functionality.
    invariant: "storage iteration must respect per-tx read limits"
    category: "storage-limit"
