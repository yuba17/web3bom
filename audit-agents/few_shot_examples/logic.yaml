# Few-shot examples: Logic bugs (wrong variable, copy-paste, contradiction)
# Source: Yieldoor Sherlock 2025, LayerZero-Stellar C4 2026

examples:
  - id: "ex-logic-01"
    title: "Wrong tick parameter in collectFees"
    source: "Yieldoor H-06 (Sherlock 2025)"
    vulnerable_code: |
      pool.collect(address(this), mainPosition.tickLower,
                   mainPosition.tickUpper, ...)  // Should be vestPosition.tickUpper
    explanation: |
      After rebalance, main ticks diverge from vesting ticks.
      When vestPosition.tickLower > mainPosition.tickUpper, collect() reverts
      with "TLU" error, permanently locking vesting fees.
    invariant: "vestPosition ticks must be used when collecting vesting fees"
    category: "copy-paste"

  - id: "ex-logic-02"
    title: "Contradictory leverage checks in borrow vs liquidation"
    source: "Yieldoor H-04/H-05 (Sherlock 2025)"
    vulnerable_code: |
      // _checkWithinlimits: allows up to maxTimesLeverage
      require(leverage <= maxTimesLeverage, "too leveraged");
      // isLiquidateable: uses (maxTimesLeverage - 1e18) as divisor
      uint256 threshold = borrowedValue / (maxTimesLeverage - 1e18);
    explanation: |
      Two functions enforce contradictory rules using the same parameter.
      A position can pass _checkWithinlimits but be immediately liquidatable,
      or vice versa. This creates an exploitable gap.
    invariant: "borrow limit and liquidation threshold must be consistent"
    category: "contradiction"

  - id: "ex-logic-03"
    title: "Copy-paste amountOut from wrong position"
    source: "Yieldoor M-09 (Sherlock 2025)"
    vulnerable_code: |
      // withdraw() copies amountOut logic from secondary position
      // but applies it to main position — wrong liquidity reference
      uint256 amountOut = _calculateFromSecondary(...);  // should use main
    explanation: |
      Developer copied code from secondary position handler into main position
      withdrawal. The liquidity source is wrong, leading to incorrect withdrawal
      amounts.
    invariant: "withdrawal amount must be calculated from the correct position"
    category: "copy-paste"
