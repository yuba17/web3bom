# Few-shot examples: Accounting bugs (decimals, stale rates, excess withdrawal)
# Source: Yieldoor Sherlock 2025

examples:
  - id: "ex-acct-01"
    title: "Liquidation fee uncollectable due to decimal mishandling"
    source: "Yieldoor H-01 (Sherlock 2025)"
    vulnerable_code: |
      // Divides by decimals() instead of 10**decimals()
      uint256 borrowedValue = totalBorrowed / token.decimals();
      // decimals() returns 18, not 1e18 — inflates borrowedValue by ~10^17
    explanation: |
      Using decimals() (returns 18) instead of 10**decimals() (returns 1e18)
      inflates borrowedValue by ~10^17. This makes totalValueUSD > borrowedValue
      unreachable, so liquidation fees are permanently locked.
    invariant: "decimal scaling must use 10**decimals(), not decimals()"
    category: "decimal-handling"

  - id: "ex-acct-02"
    title: "Balances exclude vesting position value"
    source: "Yieldoor M-02 (Sherlock 2025)"
    vulnerable_code: |
      function totalBalance() public view returns (uint256) {
          return mainPosition.liquidity;  // Missing: + vestPosition.liquidity
      }
    explanation: |
      totalBalance() only counts main position liquidity, ignoring vesting
      position. This understates the vault's total value, affecting share price
      and withdrawal calculations.
    invariant: "totalBalance must include ALL position types (main + vesting)"
    category: "incomplete-accounting"

  - id: "ex-acct-03"
    title: "Withdraw ignores vesting position in amount calculation"
    source: "Yieldoor M-03 (Sherlock 2025)"
    vulnerable_code: |
      // Only removes liquidity from main position
      uint256 liqToRemove = shares * mainPosition.liquidity / totalShares;
      // vestPosition liquidity is silently excluded
    explanation: |
      Withdrawal only considers main position liquidity. Users who withdraw
      receive less than their fair share because vesting position value is
      ignored in the pro-rata calculation.
    invariant: "withdrawal must account for all position types proportionally"
    category: "incomplete-accounting"
