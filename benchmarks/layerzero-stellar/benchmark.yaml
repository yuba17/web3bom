  - contracts/protocol/stellar/contracts/common-macros/src/contract_impl.rs
  - contracts/protocol/stellar/contracts/message-libs/message-lib-common/src/message_lib_manager.rs

findings:
  - id: "H-01"
    severity: HIGH
    title: "Persistent storage TTL desync causes denylist bypass, replay protection expiry, allowlist counter corruption, compose replay, and config downgrade"
    contracts: ["worker", "dvn", "endpoint-v2", "uln-302", "common-macros"]
    functions: ["has_acl", "is_on_denylist", "__check_auth", "send_compose", "clear_compose", "effective_send_uln_config", "effective_receive_uln_config"]
    category: "storage-model"
    description: |
      Security-critical data stored in Soroban persistent storage expires after ~30 days of
      inactivity per key. Due to transaction rollback semantics (TTL extensions revert on
      failed transactions), blocked entities can never extend their own denylist entry TTLs.
      Five distinct instances: (1) denylist bypass guaranteed after 30 days, (2) UsedHash
      replay protection expires enabling signature replay, (3) AllowlistSize counter
      permanently desyncs from expired entries causing total DoS, (4) ComposeQueue tombstone
      expires enabling compose message replay, (5) OApp ULN configs silently fall back to
      protocol defaults. Root cause is storing security-critical state in persistent storage
      instead of instance storage.
    keywords: ["ttl", "persistent-storage", "soroban", "denylist", "replay", "allowlist", "compose", "config-downgrade", "storage-expiry", "rollback"]

  - id: "H-02"
    severity: HIGH
    title: "MultiSig Signers Vec expiry in persistent storage causes irrecoverable DVN lockout"
    contracts: ["utils", "dvn"]
    functions: ["verify_signatures", "verify_n_signatures", "set_signer", "set_threshold", "enforce_multisig_auth"]
    category: "storage-model"
    description: |
      The MultiSig utility stores Signers in persistent storage (#[persistent]) and Threshold
      in instance storage (#[instance]). If no multisig-authenticated operations or view
      function calls occur for 30+ days, the Signers entry expires and defaults to an empty Vec.
      Threshold persists. All admin functions require multisig auth which verifies against the
      now-empty signers list — always failing. Circular dependency: restoring signers requires
      signer auth. The DVN is permanently bricked with no on-chain recovery path. Any funds
      held by the contract are locked forever.
    keywords: ["multisig", "signers", "persistent-storage", "ttl", "lockout", "circular-dependency", "brick", "irrecoverable", "dvn"]

  - id: "H-03"
    severity: HIGH
    title: "hash_call_data lacks instance binding enabling cross-instance DVN signature replay"
    contracts: ["dvn"]
    functions: ["hash_call_data", "__check_auth", "set_used_hash"]
    category: "signature-replay"
    description: |
      The DVN hash_call_data function computes keccak256 over (vid, expiration, calls_xdr) but
      omits both the contract's own address and the Soroban network identifier. Two DVN instances
      sharing the same vid and overlapping multisig signers produce identical hashes for identical
      calls, enabling cross-instance signature replay. An attacker capturing a valid multisig
      transaction from DVN-A can replay it on DVN-B. Replayable operations include set_signer,
      set_threshold, set_admin, set_deposit_address (fee theft), and set_paused (DoS).
      Compounded by UsedHash TTL expiry enabling same-instance temporal replay.
    keywords: ["signature-replay", "cross-instance", "hash", "keccak256", "dvn", "multisig", "instance-binding", "network-id"]

  - id: "M-01"
    severity: MEDIUM
    title: "Protocol owners can censor all cross-chain messages via denylist priority, pause, blocked-message-lib, and config removal — breaking three stated invariants"
    contracts: ["worker", "dvn", "executor", "endpoint-v2", "uln-302", "blocked-message-lib"]
    functions: ["has_acl", "set_paused", "set_denylist", "get_send_library", "effective_send_uln_config", "register_library", "set_default_send_library"]
    category: "censorship-resistance"
    description: |
      Three README-stated censorship-resistance invariants are broken via five independent vectors:
      (1) denylist unconditionally overrides allowlist in has_acl() — short-circuit means allowlist
      is meaningless when denylist is populated; (2) set_paused kills every OApp's access with no
      bypass, even with custom configs; (3) blocked-message-lib can be registered as the default
      send library (passes all validation) causing all default-config OApps to revert on send;
      (4) removing default ULN config makes effective_send_uln_config panic for OApps on defaults;
      (5) removing default send library blocks all default-config OApps. Treasury correctly handles
      censorship resistance (returns 0 when disabled, never reverts).
    keywords: ["censorship", "invariant-violation", "denylist", "allowlist", "pause", "blocked-message-lib", "default-config", "acl"]

  - id: "M-02"
    severity: MEDIUM
    title: "DVN in both required and optional lists reduces effective verification quorum"
    contracts: ["uln-302"]
    functions: ["validate_default_config", "verifiable_internal"]
    category: "logic"
    description: |
      UlnConfig validation fails to enforce disjointness between required_dvns and optional_dvns
      address lists. A DVN address present in both lists is counted toward both the required
      verification check and the optional threshold check in verifiable_internal(). This reduces
      the effective number of unique DVNs needed to verify a cross-chain message below what the
      configuration implies. Worst case: if all required DVNs are duplicated into optional list
      and optional_dvn_threshold <= len(required_dvns), the optional threshold is trivially
      satisfied with zero additional verifiers.
    keywords: ["quorum", "dvn", "duplicate", "verification", "threshold", "cross-list", "config-validation"]

  - id: "L-01"
    severity: LOW
    title: "send() with 15+ DVNs exceeds Soroban storage read limit causing DoS"
    contracts: ["uln-302", "dvn"]
    functions: ["send", "assign_dvns", "get_fee"]
    category: "dos"
    description: |
      Soroban imposes ~200 storage reads per transaction. The send() flow iterates all configured
      DVNs calling assign_job/get_fee (each reading ~10-15 storage entries). With 15+ DVNs the
      limit is exceeded, causing transaction failure. The protocol allows MAX_DVNS=127 but the
      practical limit is ~14. Downgraded to Low because it requires admin configuration of an
      unusually high DVN count and no funds are at risk.
    keywords: ["dos", "storage-reads", "soroban-limit", "max-dvns", "resource-exceeded", "send"]

  - id: "L-02"
    severity: LOW
    title: "ExecutorHelper contract lacks TTL management and will silently expire"
    contracts: ["executor-helper"]
    functions: ["execute", "compose"]
    category: "storage-model"
    description: |
      ExecutorHelper uses bare #[contract] macro instead of #[lz_contract], missing TTL
      configuration entirely. The auto-TTL extension injected by #[contract_impl] is a no-op
      because init_default_ttl_configs() was never called. No permissionless extend_ttl()
      function exists. The contract will expire at default Soroban TTL (~30 days), blocking
      all pull-mode message execution and compose delivery. Recoverable via admin redeployment.
    keywords: ["ttl", "executor-helper", "contract-expiry", "no-op", "lz-contract", "macro"]
