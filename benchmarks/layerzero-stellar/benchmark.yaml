# Benchmark: LayerZero-Stellar (Code4rena, April 2026)
# 3 High + 2 Medium + 2 Low = 7 unique findings (after deduplication)
# Soroban/Rust cross-chain messaging protocol on Stellar

contest:
  name: "LayerZero-Stellar"
  platform: "C4"
  date: "2026-04"
  repo: "https://github.com/nicholasio/LayerZero-v2"
  commit: ""  # contest repo commit
  source_commit: ""  # original source commit
  report_url: ""
  pool_size: 0
  nsloc: 5000  # estimated across all Soroban contracts

scope:
  - contracts/protocol/stellar/contracts/workers/worker/src/worker.rs
  - contracts/protocol/stellar/contracts/workers/worker/src/storage.rs
  - contracts/protocol/stellar/contracts/workers/dvn/src/dvn.rs
  - contracts/protocol/stellar/contracts/workers/dvn/src/auth.rs
  - contracts/protocol/stellar/contracts/workers/dvn/src/storage.rs
  - contracts/protocol/stellar/contracts/workers/executor/src/executor.rs
  - contracts/protocol/stellar/contracts/workers/executor-helper/src/executor_helper.rs
  - contracts/protocol/stellar/contracts/endpoint-v2/src/messaging_composer.rs
  - contracts/protocol/stellar/contracts/endpoint-v2/src/storage.rs
  - contracts/protocol/stellar/contracts/message-libs/uln-302/src/send_uln.rs
  - contracts/protocol/stellar/contracts/message-libs/uln-302/src/receive_uln.rs
  - contracts/protocol/stellar/contracts/message-libs/uln-302/src/storage.rs
  - contracts/protocol/stellar/contracts/message-libs/uln-302/src/types.rs
  - contracts/protocol/stellar/contracts/message-libs/blocked-message-lib/src/lib.rs
  - contracts/protocol/stellar/contracts/message-libs/treasury/src/treasury.rs
