# Foundry Invariant Testing Configuration
# Copy relevant sections to target project's foundry.toml

# ═══════════════════════════════════════════
# QUICK SCAN (5 min) — First pass, fast feedback
# ═══════════════════════════════════════════
# [invariant]
# runs = 256
# depth = 50
# fail_on_revert = false

# ═══════════════════════════════════════════
# DEEP SCAN (30 min) — Thorough coverage
# ═══════════════════════════════════════════
# [invariant]
# runs = 1000
# depth = 500
# fail_on_revert = false

# ═══════════════════════════════════════════
# OVERNIGHT (8h) — Maximum depth
# ═══════════════════════════════════════════
# [invariant]
# runs = 10000
# depth = 5000
# fail_on_revert = false

# ═══════════════════════════════════════════
# DEBUG (when invariant fails)
# ═══════════════════════════════════════════
# [invariant]
# runs = 1
# depth = 1
# fail_on_revert = true
# # Then use: forge test --match-test testFuzz_X -vvvv
