# Echidna Configuration for Bug Bounty Hunting
# Usage: echidna . --contract CryticTester --config echidna.yaml

# Testing mode: "property" checks echidna_* functions
# "assertion" checks for assert() failures
testMode: "property"

# Number of test sequences to run
testLimit: 100000

# Max calls per sequence
seqLen: 100

# Shrink failed sequences to minimal reproduction
shrinkLimit: 5000

# Corpus directory for coverage-guided fuzzing
corpusDir: "echidna-corpus"

# Deployer address
deployer: "0x30000"

# Sender addresses (actors)
sender:
  - "0x10000"
  - "0x20000"
  - "0x30000"

# Contract balance
balanceContract: 1000000000000000000000

# Sender balance
balanceAddr: 1000000000000000000000

# Block/time advancement
prefix: "forge"

# Compilation
cryticArgs:
  - "--foundry-compile-all"
